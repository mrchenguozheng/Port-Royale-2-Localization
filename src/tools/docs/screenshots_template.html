  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin:48px 0 18px}

    border:1px solid var(--line);font-size:14px;overflow:hidden;border-radius:10px
  }
  table.coverage th,table.coverage td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  table.coverage th{color:var(--gold-soft);font-weight:500;background:#1a2632;font-size:13px}

  .pair figure:nth-child(10){grid-column:7 / span 3}
  .pair figure:nth-child(11){grid-column:10 / span 3}

  figure img{
    display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;

  }

    display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:12px;color:#aeb9c4;
    background:#111a23

    position:fixed;inset:0;z-index:50;background:rgba(2,5,8,.94);
    display:none;align-items:center;justify-content:center;padding:24px
  }
  .lightbox[aria-hidden="false"]{display:flex}
  .lightbox img{max-width:96vw;max-height:92vh;object-fit:contain;box-shadow:0 12px 60px #000}

    position:absolute;top:16px;right:18px;border:1px solid #5b6672;background:#17222c;

  @media (max-width:980px){
    .player{grid-template-columns:1fr}

  }
  @media (max-width:520px){
    h1{font-size:24px}
    .lede{font-size:14px}
    .player-copy h2{font-size:22px}

    .section-head .sub{display:block;margin-top:4px}
  }

    .wrap{padding:26px 16px 60px}

    .pair figure,.pair figure:nth-child(n){grid-column:auto}

    .preview-grid{grid-template-columns:1fr}
    .how-steps{grid-template-columns:1fr}
    .player-copy{padding:20px}
    .player-copy h2{font-size:24px}
    table.coverage{display:block;overflow-x:auto}
    .row-head{padding:16px}
  }

<body>
<div class="wrap">

  <header class="hero">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{H1}}</h1>
    <p class="lede">{{LEDE}}</p>
    <div class="meta">
{{META_CHIPS}}
    </div>
    <nav class="toc">
{{TOC}}
    </nav>
  </header>

{{PLAYER}}

  <div class="note">
    {{INTRO}}
  </div>

  <div id="coverage" class="section-head">
    <h2>{{COVERAGE_HEADING}}</h2>
    <span class="sub">{{COVERAGE_SUB}}</span>
  </div>

  <table class="coverage">
    <thead>
      <tr>{{COVERAGE_HEAD}}</tr>
    </thead>
    <tbody>
{{COVERAGE_ROWS}}
    </tbody>
  </table>

  <div id="compare" class="section-head">
    <h2>{{COMPARE_HEADING}}</h2>
    <span class="sub">{{COMPARE_SUB}}</span>
  </div>

{{SECTIONS}}

{{NOTES}}

  <div id="extra" class="section-head">
    <h2>{{EXTRA_HEADING}}</h2>
    <span class="sub">{{EXTRA_SUB}}</span>
  </div>

  <div class="extra-grid">
{{EXTRA_GRID}}
  </div>

  <div class="footer">
    {{FOOTER}}
  </div>

</div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button type="button" id="closeLightbox">关闭</button>
  <img id="lightboxImg" alt="">
</div>

<script>
  const box = document.getElementById('lightbox');
  const big = document.getElementById('lightboxImg');
  document.querySelectorAll('figure img').forEach(img => {
    img.addEventListener('click', () => {
      big.src = img.dataset.full || img.src;
      big.alt = img.alt;
      box.setAttribute('aria-hidden', 'false');
    });
  });
  function closeBox(){ box.setAttribute('aria-hidden','true'); big.src=''; }
  document.getElementById('closeLightbox').addEventListener('click', closeBox);
  box.addEventListener('click', e => { if (e.target === box) closeBox(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBox(); });
</script>
</body>
