# 日语手工断点表：机械断行（src/tools/text/lang_rules/ja.py 的 JaLineBreak）切不动、
# 或切出来位置不合适的块，在这里人工指定断点。
#
# 写法：键是译文 id，值是在第 N 个可见字之前补一个空格（段首记 0，位置严格递增）。
#
# 作用范围是**块**，不是整条：块 = 译文里空格分隔的一段。位置落在哪一块，就由
# 机械层把这一块整体交给人工——这一块里机械插的 <n> 全部作废，改用人工位置补
# 空格；其它块保留机械切。所以长条目（838 字的 0xd4cd0fb4、522 字的 0xd4cd1020）
# 里机械已经切好的段不会被废掉。
#
# 可见字：标签 <…> 与已有的 <n> 不计，空格／制表不计（它们本来就是断行点），
# 占位 @a$Name$ / %1 各记 1 字。位置按**整条**累计，不因已有的 <n> 重置，
# 与 line_run.py 的度量口径一致。位置由 build/qa/mk_ja_manual.py 按规则算，
# 不靠手数。
#
# 补完仍有块超过 13 字会抛 ManualBreakError（人工位置给少了），不会静默落盘。
#
# 例：
#   "0x0e4a1b2c" = [12]
#   "0x0e4a1b2d" = [9, 18]

# 机械层把「かもしれません」从「かも」处割断；改在「生存者が」后补空格
"0xc73939cf" = [63]

# 职位名按英文词边界断开（International Product Manager / Senior Product Manager）
"0xd1c0dca1" = [9, 14]
"0xff624273" = [9, 14]
"0xc7639644" = [3, 8]

# 长文：只点给切不动／切得难看的那一块补位置，其余块由机械层照旧切
"0xd4cd1020" = [340]
"0x353cae5f" = [9, 10, 16]
"0xd3ac653a" = [2, 15]
"0xfebc8b4b" = [4, 13]
