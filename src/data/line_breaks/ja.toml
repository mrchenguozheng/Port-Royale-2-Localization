# 日语手工断点表：机械断行（src/tools/text/lang_rules/ja.py 的 JaLineBreak）切不动、
# 或切出来位置不合适的条目，在这里人工指定断点。
#
# 写法：键是译文 id，值是在第 N 个可见字之前插一个 <n>（段首记 0，位置严格递增）。
# 可见字不计标签 <…> 与已有的 <n>；占位 @a$Name$ / %1 各记 1 字。位置按整条累计，
# 不因已有 <n> 重置，与 line_run.py 的度量口径一致。
#
# 需要手工填的条目清单由构建时生成：build/qa/line_manual_ja.txt。
#
# 位置口径：从整条开头数**非空白**可见字，数到第 N 个就在它前面插 <n>。
# 标签 <…> 与已有 <n> 不数，空格／制表不数（引擎本来就在空格处断行），
# 占位 @a$Name$ / %1 各数 1 个字。
#
# 示例：
#   "0x0e4a1b2c" = [12]
#   "0x0e4a1b2d" = [9, 18]

# 机械层把「かもしれません」从「かも」处割断；改断在「生存者が」后（助词后）
"0xc73939cf" = [63]
