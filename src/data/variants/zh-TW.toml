# 台灣（zh-TW）用字差異表
#
# 底稿 `src/translations/zh-Hant.toml` 由簡體 `zh.toml` 經 OpenCC **s2tw** 轉出，
# s2tw 已經把字形歸一到台灣標準（裡／著／群／眾／秘／為／臺），所以"字形層"不需要
# 再列規則；台北側只剩火砲用字一項。s2tw 不做詞彙轉換（不會把「軟件」改「軟體」），
# 詞彙差異見下方說明。
#
# 修改此檔後執行：
#   python src/tools/pack/derive_variant.py --variant zh-TW
#
# 原則：規則只收「同義、可全局替換」的字形對；有任何一處會誤傷的（例如
# 著／著名 vs 著／沿著）一律不進全局規則，改走下方 [keys] 逐條覆蓋。

[variant]
locale = "zh-TW"
alias = "繁體中文（台灣）"

# 炮 → 砲：底稿的「炮」全部是火砲義（炮臺、砲彈、砲手），無「炮製」義。
# 命中 54 處（含「開炮」等）。
[[replace]]
from = "炮"
to = "砲"

# 逐條覆蓋：鍵 = 32 位鍵名，值 = 覆蓋後的完整字串。目前無需覆蓋。
[keys]
