# 香港（zh-HK）用字差異表
#
# 底稿 `src/translations/zh-Hant.toml` 由簡體 `zh.toml` 經 OpenCC **s2tw** 轉出，
# 底稿是台灣標準字形；香港側要把港式寫法收回來，所以規則方向與 zh-TW 相反。
#
# 修改此檔後執行：
#   python src/tools/pack/derive_variant.py --variant zh-HK
#
# 刻意不收的差異：
#   著／着  底稿的「著」有兩個來源（簡體「着」與簡體「著」），全局替換會把
#           「著名」「著作」誤改成「着名」「着作」，故不進規則，香港版保留「著」。
#   炮      底稿已是「炮」，香港用「炮」，無需替換。
#   許可證  香港機構多用「牌照」，但本作語境是私掠許可證（letter of marque）、
#           貿易許可，屬歷史文書，改「牌照」反而失真，兩地統一用「許可證」。
#   軟件／軟體、網絡／網路、預設／默認等科技詞在本作正文不命中，只出現在啟動器
#           界面，由 ui.zh-TW.ini / ui.zh-HK.ini 各自處理。

[variant]
locale = "zh-HK"
alias = "繁體中文（香港）"

# 裡 → 裏：香港寫「裏」。命中 392 處。
[[replace]]
from = "裡"
to = "裏"

# 臺 → 台：底稿僅 1 處（「臺北」），香港寫「台北」。命中 1 處。
[[replace]]
from = "臺"
to = "台"

