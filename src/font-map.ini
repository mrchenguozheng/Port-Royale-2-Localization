; Port Royale 2 本地化字体映射
;
; 游戏固定请求 fonts\ARIAL.TTF、fonts\ELGRECO_.TTF、
; fonts\Tiepolo_black.ttf、fonts\Tiepolo_bold.ttf。
; 这里的键是逻辑文件名，值是实际字体文件的路径；不需要复制或改名。
;
; 规则：
;   - [fonts] 是全局默认，[zh] / [ja] 按当前语言包覆盖。
;   - 值可以是绝对路径，或相对游戏根目录的路径。
;   - %WINDIR% 会展开为 Windows 目录，例如 C:\Windows。
;   - 多个候选用 | 分隔，按顺序取第一个存在的文件。
;   - 映射文件不存在、路径不存在或值无效时，运行时回退到
;     PR2Localization\fonts\<语言>\，再回退到根目录原版 fonts\...。
;
; 四个槽位不要全部指向同一个字体也可以，但应保持正文/标题的层级差异。
; 下面正文用 DengXian Regular，标题/粗体用 DengXian Bold；三者都是单面 .ttf，
; 避免依赖 .ttc 集合。系统没有 DengXian 时回退到 SimHei / 微软雅黑。
; .ttc 集合能否被游戏自带字体读取器接受尚未实测；[ja] 的 meiryo.ttc 只是候选，
; 在没有单面日文字体时可自行替换。

[fonts]
; ARIAL.TTF=%WINDIR%\Fonts\Deng.ttf
; ELGRECO_.TTF=%WINDIR%\Fonts\Dengb.ttf
; Tiepolo_black.ttf=%WINDIR%\Fonts\Dengb.ttf
; Tiepolo_bold.ttf=%WINDIR%\Fonts\Dengb.ttf

[zh]
ARIAL.TTF=%WINDIR%\Fonts\Deng.ttf|%WINDIR%\Fonts\simhei.ttf|%WINDIR%\Fonts\msyh.ttc
ELGRECO_.TTF=%WINDIR%\Fonts\Dengb.ttf|%WINDIR%\Fonts\simhei.ttf|%WINDIR%\Fonts\msyh.ttc
Tiepolo_black.ttf=%WINDIR%\Fonts\Dengb.ttf|%WINDIR%\Fonts\simhei.ttf|%WINDIR%\Fonts\msyh.ttc
Tiepolo_bold.ttf=%WINDIR%\Fonts\Dengb.ttf|%WINDIR%\Fonts\simhei.ttf|%WINDIR%\Fonts\msyh.ttc

[ja]
ARIAL.TTF=%WINDIR%\Fonts\meiryo.ttc
ELGRECO_.TTF=%WINDIR%\Fonts\meiryo.ttc
Tiepolo_black.ttf=%WINDIR%\Fonts\meiryo.ttc
Tiepolo_bold.ttf=%WINDIR%\Fonts\meiryo.ttc
