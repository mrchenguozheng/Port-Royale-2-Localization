; Port Royale 2 本地化字体映射
;
; 游戏固定请求 fonts\ARIAL.TTF、fonts\ELGRECO_.TTF、
; fonts\Tiepolo_black.ttf、fonts\Tiepolo_bold.ttf。
; 这里的键是逻辑文件名，值是实际字体文件的路径；不需要复制或改名。
;
; 规则：
;   - [fonts] 是全局默认，[zh] / [ja] 按当前语言包覆盖。
;   - 值可以是绝对路径，或相对游戏根目录的路径。
;   - %WINDIR% 会展开为 Windows 目录，例如 C:\Windows。
;   - 多个候选用 | 分隔，按顺序取第一个存在的文件。
;   - 映射文件不存在、路径不存在或值无效时，运行时回退到
;     PR2Localization\fonts\，再回退到根目录原版 fonts\...。
;
; 四个槽位不要全部指向同一个字体也可以，但应保持正文/标题的层级差异。
; 非拉丁系默认使用 Noto 对应字体：简体中文用 Noto Sans/Serif SC，
; 日文用 Noto Sans/Serif JP。这里只接受静态字重文件；不使用 .ttc 集合，
; 也不接受 -VF.ttf 可变字体。没有静态 Noto 时回退到内置字体/原版。

[fonts]
; ARIAL.TTF=%WINDIR%\Fonts\NotoSansSC-Regular.ttf
; ELGRECO_.TTF=%WINDIR%\Fonts\NotoSerifSC-Black.ttf
; Tiepolo_black.ttf=%WINDIR%\Fonts\NotoSerifSC-Black.ttf
; Tiepolo_bold.ttf=%WINDIR%\Fonts\NotoSerifSC-Bold.ttf

[zh]
ARIAL.TTF=%WINDIR%\Fonts\NotoSansSC-Regular.ttf
ELGRECO_.TTF=%WINDIR%\Fonts\NotoSerifSC-Black.ttf
Tiepolo_black.ttf=%WINDIR%\Fonts\NotoSerifSC-Black.ttf
Tiepolo_bold.ttf=%WINDIR%\Fonts\NotoSerifSC-Bold.ttf

[ja]
ARIAL.TTF=%WINDIR%\Fonts\NotoSansJP-Regular.ttf
ELGRECO_.TTF=%WINDIR%\Fonts\NotoSerifJP-Black.ttf
Tiepolo_black.ttf=%WINDIR%\Fonts\NotoSerifJP-Black.ttf
Tiepolo_bold.ttf=%WINDIR%\Fonts\NotoSerifJP-Bold.ttf
