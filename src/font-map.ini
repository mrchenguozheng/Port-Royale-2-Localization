; Port Royale 2 本地化字体映射
;
; 发行包把本模板复制为 PR2Localization\fonts\font-map.default.ini。
; 要自定义时，复制一份为同目录的 font-map.ini 再改；运行时优先读取
; font-map.ini，解压升级只会替换 default 文件，不会覆盖手工配置。
;
; 游戏固定请求 fonts\ARIAL.TTF、fonts\ELGRECO_.TTF、
; fonts\Tiepolo_black.ttf、fonts\Tiepolo_bold.ttf。
; 这里的键是游戏请求的逻辑文件名，值是 PR2Localization\fonts\ 下的
; 实际字体文件名；不要把实际字体改名为 ARIAL.TTF 等游戏逻辑名。
;
; 规则：
;   - [fonts] 是全局默认，[zh] / [ja] 按当前语言包覆盖。
;   - 值只写字体文件名，文件必须位于 PR2Localization\fonts\。
;   - 多个候选用 | 分隔，按顺序取第一个存在的文件。
;   - 不接受字体目录之外的路径，也不接受 .ttc 集合或 -VF.ttf 可变字体。
;   - 映射文件不存在、映射缺失或文件不存在时，运行时回退到根目录原版 fonts\...。
;
; 两个逻辑名可以指向同一个实际字体文件；按标题/正文需要决定是否分开。
; 非拉丁系默认使用 Noto 对应字体：简体中文用 Noto Sans/Serif SC，
; 日文用 Noto Sans/Serif JP；只使用静态字重文件。

[fonts]
; ARIAL.TTF=NotoSansSC-Regular.ttf
; ELGRECO_.TTF=NotoSerifSC-Black.ttf
; Tiepolo_black.ttf=NotoSerifSC-Black.ttf
; Tiepolo_bold.ttf=NotoSerifSC-Bold.ttf

[zh]
ARIAL.TTF=NotoSansSC-Regular.ttf
ELGRECO_.TTF=NotoSerifSC-Black.ttf
Tiepolo_black.ttf=NotoSerifSC-Black.ttf
Tiepolo_bold.ttf=NotoSerifSC-Bold.ttf

[ja]
ARIAL.TTF=NotoSansJP-Regular.ttf
ELGRECO_.TTF=NotoSerifJP-Black.ttf
Tiepolo_black.ttf=NotoSerifJP-Black.ttf
Tiepolo_bold.ttf=NotoSerifJP-Bold.ttf
