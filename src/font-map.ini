; Port Royale 2 本地化字体映射
;
; 发行包把本模板复制为 PR2Localization\fonts\font-map.default.ini。
; 要自定义时，在默认文件上叠加同目录的 font-map.ini：只写需要覆盖的
; 逻辑名，其余逻辑名继续用 default；解压升级只替换 default，不会覆盖
; 手工配置。要显式禁用某一项，写 ARIAL.TTF=none 或 ARIAL.TTF=-。
;
; 游戏固定请求 fonts\ARIAL.TTF、fonts\ELGRECO_.TTF、
; fonts\Tiepolo_black.ttf、fonts\Tiepolo_bold.ttf。
; 这里的键是游戏请求的逻辑文件名，值是 PR2Localization\fonts\ 下的
; 实际字体文件名；不要把实际字体改名为 ARIAL.TTF 等游戏逻辑名。
;
; 规则：
;   - [fonts] 是全局默认，[zh] / [ja] / [ko] / [es] / [de] / [fr] / [ru] / [pl] / [it] 按当前语言包覆盖。
;   - 用户 font-map.ini 按项覆盖 default；未写的逻辑名继续用 default；none 表示禁用该项。
;     四个逻辑名都写 none 表示不重定向任何字体，直接使用游戏根目录原版字体。
;   - 值只写字体文件名，文件必须位于 PR2Localization\fonts\。
;   - 多个候选用 | 分隔，按顺序取第一个存在的文件。
;   - 不接受字体目录之外的路径，也不接受 .ttc 集合或 -VF.ttf 可变字体。
;   - 映射文件不存在、映射缺失或文件不存在时，运行时回退到根目录原版 fonts\...。
;
; 两个逻辑名可以指向同一个实际字体文件；按标题/正文需要决定是否分开。
; 非拉丁系默认使用 Noto 对应字体：简体中文用 Noto Sans/Serif SC，
; 日文用 Noto Sans/Serif JP，韩文用 Noto Sans/Serif KR，俄语用 Noto Sans/Serif（西里尔）；
; 只使用静态字重文件。

[fonts]
; ARIAL.TTF=NotoSansSC-Regular.ttf
; ELGRECO_.TTF=NotoSerifSC-Black.ttf
; Tiepolo_black.ttf=NotoSerifSC-Black.ttf
; Tiepolo_bold.ttf=NotoSerifSC-Bold.ttf

[zh]
ARIAL.TTF=NotoSansSC-Regular.ttf
ELGRECO_.TTF=NotoSerifSC-Black.ttf
Tiepolo_black.ttf=NotoSerifSC-Black.ttf
Tiepolo_bold.ttf=NotoSerifSC-Bold.ttf

[zh-TW]
; 繁体（台湾）。简体 Noto SC 不含繁体专用字形（裡／砲／著等），必须换 TC。
; 与 [zh-HK] 指向同一组 TC 文件，两个语言包共用一个发行包。
ARIAL.TTF=NotoSansTC-Regular.ttf
ELGRECO_.TTF=NotoSerifTC-Black.ttf
Tiepolo_black.ttf=NotoSerifTC-Black.ttf
Tiepolo_bold.ttf=NotoSerifTC-Bold.ttf

[zh-HK]
; 繁体（香港）。用字与 zh-TW 只在少量字形上不同，字体文件完全相同。
ARIAL.TTF=NotoSansTC-Regular.ttf
ELGRECO_.TTF=NotoSerifTC-Black.ttf
Tiepolo_black.ttf=NotoSerifTC-Black.ttf
Tiepolo_bold.ttf=NotoSerifTC-Bold.ttf

[ja]
ARIAL.TTF=NotoSansJP-Regular.ttf
ELGRECO_.TTF=NotoSerifJP-Black.ttf
Tiepolo_black.ttf=NotoSerifJP-Black.ttf
Tiepolo_bold.ttf=NotoSerifJP-Bold.ttf

[ko]
; 原版四个拉丁字体没有谚文字形。韩文是预组合音节（U+AC00–U+D7A3），
; 用 Noto Sans/Serif KR 静态字重；文件由 src\tools\font\make_noto_fonts.py 生成，
; 与中文、日文一样平铺在 PR2Localization\fonts\ 下。
ARIAL.TTF=NotoSansKR-Regular.ttf
ELGRECO_.TTF=NotoSerifKR-Black.ttf
Tiepolo_black.ttf=NotoSerifKR-Black.ttf
Tiepolo_bold.ttf=NotoSerifKR-Bold.ttf

[es]
; 原版拉丁字体已覆盖西班牙语重音；不打包字体，回落到游戏根目录 fonts\。
ARIAL.TTF=none
ELGRECO_.TTF=none
Tiepolo_black.ttf=none
Tiepolo_bold.ttf=none

[de]
; 原版拉丁字体已覆盖德语变音与 ß；不打包字体，回落到游戏根目录 fonts\。
ARIAL.TTF=none
ELGRECO_.TTF=none
Tiepolo_black.ttf=none
Tiepolo_bold.ttf=none

[fr]
; 原版拉丁字体已覆盖法语重音（é è ê à ç ù ï ô û œ）；不打包字体，
; 回落到游戏根目录 fonts\。缺的只有 ²³€，与原版字体本身的缺口一致。
ARIAL.TTF=none
ELGRECO_.TTF=none
Tiepolo_black.ttf=none
Tiepolo_bold.ttf=none

[it]
; 实测原版四款字体（assets\fonts\original，fontTools 读 cmap）：
;   正文 ARIAL.TTF                       1223 码位，意语用字（à è é ì ò ó ù ú 及大写）缺 0；
;   标题 ELGRECO_ / Tiepolo_black / Tiepolo_bold  各 277 个字型，意语缺 0
;   （三款标题字体只缺 €，与原版缺口一致）→ 四个槽位全部回落根目录原版字体。
; 因此按 config 出包，不打包任何字体：没有 PR2It* 这类自建文件，也不需要缩放。
ARIAL.TTF=none
ELGRECO_.TTF=none
Tiepolo_black.ttf=none
Tiepolo_bold.ttf=none

[pl]
; 实测原版字体（assets\fonts\original，fontTools 读 cmap）：
;   正文 ARIAL.TTF          1186 个码位，波兰语 18 个字母全覆盖 → 不换，回落根目录；
;   标题 ELGRECO_ / Tiepolo_black / Tiepolo_bold   只有 223 个字形，缺 ą ć ę ł ń ś ź ż
;   及大写（ó 在 Latin-1 里，反而有）→ 标题三个槽位换成 Noto Serif 缩放版。
; 三个文件由 src\tools\font\build_lat_fonts.py 生成，按原版对应字体的
; cap height 与平均 advance 缩放（ELGRECO 0.343/0.724、Tiepolo 两档 0.517|0.496/0.614），
; 所以标题占的高度与宽度和英文版一致，不需要为波兰语缩文案。
ARIAL.TTF=none
ELGRECO_.TTF=PR2PlDisplay-Head.ttf
Tiepolo_black.ttf=PR2PlDisplay-Black.ttf
Tiepolo_bold.ttf=PR2PlDisplay-Bold.ttf

[pt-BR]
; 原版四款字体实测（assets\fonts\original，fontTools 读 cmap）：
;   正文 ARIAL.TTF 覆盖葡语全部重音字符（á à â ã é ê í ó ô õ ú ü ç），缺 0；
;   标题 ELGRECO_ / Tiepolo_black / Tiepolo_bold 同样覆盖葡语重音，缺 0。
; 与 es / fr / it 一样按 config 出包，四个槽位全部回落根目录原版字体。
ARIAL.TTF=none
ELGRECO_.TTF=none
Tiepolo_black.ttf=none
Tiepolo_bold.ttf=none

[ru]
; 原版四个拉丁字体没有西里尔字形。正文用 Noto Sans 按原版 ARIAL 的度量缩放
; （俄语用字平均 advance 0.578 / cap 0.716）；标题三档各出一份，把 Noto Serif
; 压缩成原版对应字体的 cap height 与平均字宽（ELGRECO 是窄而高的花体，单独一份）。
; Tiepolo 两档在原版宽度上再压 12%，否则挂牌木板放不下俄语长串。
; 四个文件由 src\tools\font\build_cyr_fonts.py 生成，见 docs\字体与分发.md。
ARIAL.TTF=PR2CyrBody-Regular.ttf
ELGRECO_.TTF=PR2CyrDisplay-Head.ttf
Tiepolo_black.ttf=PR2CyrDisplay-Black.ttf
Tiepolo_bold.ttf=PR2CyrDisplay-Bold.ttf
