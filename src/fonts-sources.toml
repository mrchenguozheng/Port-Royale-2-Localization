# Noto 源字体清单
#
# 字体文件本身不入库（约 96MB），只入库这份清单：文件名、下载地址、需要的
# 字重、最小体积。缺文件时由 src\tools\font\fetch_noto_fonts.py 按这里下载，
# 下载来的可变字体按 axis 里的 wght 实例化成静态文件，落盘后所有构建脚本
# 看到的都是静态文件名（与 font-map.ini 里的映射一致）。
#
# 落点目录（优先级从高到低，见 src\tools\font\font_sources.py）：
#   1. PR2_FONT_DIRS（环境变量，设置后只查它，分号分隔）
#   2. <repo>\assets\fonts\noto      入库目录，允许手工放置，默认空
#   3. <repo>\build\cache\noto-src   下载缓存，不入库，CI 用 actions/cache 持久
#   4. %WINDIR%\Fonts
#   5. %LOCALAPPDATA%\Microsoft\Windows\Fonts
# 五处都没有对应文件时，构建直接失败，不再"字体检查跳过"。
version = 1

# ---------- 简体中文 ----------
[[font]]
name = "NotoSansSC-Regular.ttf"
langs = ["zh"]
source = "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"
axis = { wght = 400 }
min_bytes = 9000000

[[font]]
name = "NotoSerifSC-Black.ttf"
langs = ["zh"]
source = "https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifsc/NotoSerifSC%5Bwght%5D.ttf"
axis = { wght = 900 }
min_bytes = 12000000

[[font]]
name = "NotoSerifSC-Bold.ttf"
langs = ["zh"]
source = "https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifsc/NotoSerifSC%5Bwght%5D.ttf"
axis = { wght = 700 }
min_bytes = 12000000

# ---------- 繁体中文（台湾／香港共用） ----------
# 发行代码是 zh-TW / zh-HK；zh-hant 只是派生底稿。三处都列上，
# 否则 CI 按 zh-TW/zh-HK 取字体时会漏掉这套 TC 文件。
[[font]]
name = "NotoSansTC-Regular.ttf"
langs = ["zh-hant", "zh-TW", "zh-HK"]
source = "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf"
axis = { wght = 400 }
min_bytes = 9000000

[[font]]
name = "NotoSerifTC-Black.ttf"
langs = ["zh-hant", "zh-TW", "zh-HK"]
source = "https://raw.githubusercontent.com/google/fonts/main/ofl/notoseriftc/NotoSerifTC%5Bwght%5D.ttf"
axis = { wght = 900 }
min_bytes = 12000000

[[font]]
name = "NotoSerifTC-Bold.ttf"
langs = ["zh-hant", "zh-TW", "zh-HK"]
source = "https://raw.githubusercontent.com/google/fonts/main/ofl/notoseriftc/NotoSerifTC%5Bwght%5D.ttf"
axis = { wght = 700 }
min_bytes = 12000000

