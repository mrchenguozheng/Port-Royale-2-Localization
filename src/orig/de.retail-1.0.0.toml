"0x12bf2170" = "Ich habe nichts weiter mit Euch zu besprechen.<n>Steigert Euer Ansehen bei meiner Nation, wenn Ihr weitere Geschäfte mit mir machen wollt."
"0x12c4aed2" = "Ihr tut mir einen großen Gefallen. Gut, die @g$PriceBuy$ habe ich von Euch erhalten. Trefft mich nun auf dem Marktplatz, dort übergebe ich Euch @a$Amount$ @G$Goods$. Danach bringt die Waren bis zum @D$EndDate$ nach @T$Town$ und übergebt sie dort an @N$DestName$."
"0x12e312db" = "Es gibt mal wieder einen Engpass mit der Lieferung von Importwaren durch Transportkonvois aus @n$Nation$. Könnt Ihr mich und meine Freunde in dieser Sache unterstützen?"
"0x12e312dd" = "Durch den Krieg mit @n$HostileNation$ ist es in @n$Nation$ zu einem Engpass an Importwaren für die Kolonien gekommen. Da @n$HostileNation$ anscheinend keinen Engpass hat, könnten wir deren Transportkonvois angreifen und uns die fehlenden Waren auf diese Weise beschaffen. Ihr könntet das übernehmen. "
