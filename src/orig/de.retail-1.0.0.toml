"0x15a2e0f7" = "Wareneinkauf"
"0x15b202b9" = "Ich grüße Euch, %1. Habt Ihr alle Waren für das Fest dabei? "
"0x15b2d03f" = "Ihr habt Euch zu viel Zeit gelassen."
"0x15ba13db" = "Oh, ich sehe, Ihr habt eine unfertige Schatzkarte in Eurem Logbuch. Hättet Ihr Interesse an einem neuen Stück? Wer weiß, vielleicht könnt Ihr damit den Schatz schon finden.<n>Ich gebe es Euch für @g$Price$."
"0x15ba13dc" = "@s$USER$, ich habe gehört, Ihr seid an Schatzkarten interessiert. Ich habe hier ein Stück, dass zu Eurer Karte passt. Ich gebe es Euch für @g$Price$."
"0x15ba13dd" = "Seid gegrüßt, @s$USER$. Ihr seid doch im Besitz einer unvollständigen Schatzkarte, oder? Ich könnte Euch ein weiteres Stück zu Eurer Karte geben. Ich möchte nur @g$Price$ für das Kartenstück."
"0x15be02a9" = "Datum"
"0x15c6f8fc" = "Spielername"
"0x15c7f2e0" = "(Konvoi überfüllt)"
"0x15d892f9" = "Tiepolo_bold14x14aaFH.res"
"0x15d8bad1" = "Das ist gut. Es handelt sich um die Stadt @T$TargetTown$. Um sie zur Vernunft zu bringen, hat der Vizekönig von @n$TargetNation$ allen Händlern untersagt, die Stadt anzufahren. Wenn wir es schaffen, die Stadt so zu versorgen, dass sie einen hohen Wohlstand erreicht, können wir die Bürger mit Sicherheit für uns gewinnen. Ihr habt für diese Mission Zeit bis zum @D$EndDate$."
"0x15d8bad2" = "Es handelt sich um die Stadt @T$TargetTown$. Allen Händlern wurde verboten, die Stadt anzufahren. Eure Aufgabe ist es, die Stadt so zu versorgen, dass sie wieder hohen Wohlstand erreicht. Auf diese Weise können wir unser Interesse an @T$TargetTown$ deutlich machen. Ihr müsst Eure Mission bis zum @D$EndDate$ erfüllen."
"0x15d8bad3" = "Die Sache ist die: Der Vizekönig hat allen Händlern untersagt, die Stadt @T$TargetTown$ anzufahren. Auf diese Weise will er auf die Stadtverwaltung Druck ausüben. Wenn Ihr es schafft, @T$TargetTown$ bis zum @D$EndDate$ so zu versorgen, dass sie wieder einen gewissen Wohlstand erreicht, bin ich sicher, dass ich auf friedlichem Wege einen Nationenwechsel der Stadt erreichen kann."
"0x15e96b4c" = "Sichern"
"0x15f470e9" = "Seeschlacht beenden"
"0x15f6d04b" = "Ihr habt die Seeschlacht gewonnen. Wollt Ihr die Verfolgung abbrechen?"
"0x15fd96d6" = "Ihr habt eine Konzession gekauft und dürft nun Gebäude in dieser Stadt errichten. Euer erstes Gebäude muss ein Lagerhaus sein.<n><n>Übrigens: je mehr Konzessionen Ihr besitzt, umso teurer ist eine weitere und desto langsamer steigt Euer Handelserfolg in anderen Städten."
"0x1605422d" = "Versteck"
"0x161f0ab3" = "Rang"
"0x1629fb20" = "%1,<n>da bist du ja wieder. Komm, ich habe vielleicht Neuigkeiten für dich."
"0x1629fb21" = "%1,<n>diesmal bist du aber schnell wieder da. Hast du denn nichts anderes zu tun?"
"0x1629fb22" = "%1,<n>ich hätte nicht erwartet, dich so bald wieder zu sehen. Ich glaube nicht, dass ich schon Neuigkeiten für dich habe."
"0x162a5cb6" = "Warenversteck"
"0x163fff71" = "%1,<n>schön, dass Du vorbeischaut. Soll ich dir von den neusten Ereignissen erzählen, die ich gehört habe?"
"0x163fff72" = "%1,<n>ich freue mich, dich zu sehen. Ich konnte mich in den letzten Tagen etwas umhören und habe vielleicht Neuigkeiten für dich."
"0x163fff73" = "%1,<n>da bist du ja wieder, das finde ich schön. Ich glaube, ich habe die eine oder andere Information für dich."
"0x165603c2" = "%1,<n>es ist zwar eine Weile her, aber ich freue mich sehr, dich wieder zu sehen. Ich habe auch einige Neuigkeiten für dich."
"0x165603c3" = "%1,<n>gerade wollte ich fort gehen und jemanden besuchen, denn mir ist etwas langweilig. Doch nun bist du ja da. Komm, ich habe dir etwas zu erzählen."
"0x165603c4" = "%1,<n>da bist du ja, ich habe mich schon gefragt, wo du bleibst. Ich habe auch einige Neuigkeiten für dich."
"0x1659b12c" = "Ihr habt nun genug Gold, um die Kampfkraft Eures Konvois zu erhöhen. Sucht in den Werften der Gouverneursstädte nach einem möglichst kampfstarken Schiff.<n><n>Anschließend müsst Ihr das Schiff Eurem Konvoi hinzufügen und weitere Kanonen und Matrosen an Bord nehmen. Wenn Ihr nicht genug Gold habt, so führt noch ein paar Handelsgeschäfte durch.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erhöht die Kampfkraft Eures Konvois auf mindestens 90 Kanonen."
"0x165fc28e" = "Besucht Eure neue Stadt und errichtet eine Werft."
"0x16656b80" = "%1 %2<g:scripts/intext_herz_800x600.screen>"
"0x1666a42c" = "%1, schön, dass Ihr da seid."
"0x1666a42d" = "Ich warte schon auf Euch, %1."
"0x1666a42e" = "Ich freue mich, Euch zu sehen, %1."
"0x166c0813" = "%1,<n>bist du es? Ich hätte dich kaum wiedererkannt. Ich verstehe ja, dass dich deine Abenteuer sehr in Anspruch nehmen. Dennoch könntest du mich etwas häufiger besuchen."
"0x166c0814" = "%1,<n>möchtest du, dass ich die ganze Zeit in der Hafenkneipe verbringe, nur damit ich mal etwas Gesellschaft habe? Du solltest mich wirklich häufiger besuchen."
"0x166c0815" = "%1,<n>sämtliche ankommenden Händler gehen bei mir ein und aus, nur damit ich mal etwas Gesellschaft bekomme. Kannst du nicht mal öfter bei mir vorbeischauen?"
"0x1680be32" = "Laderaum"
"0x1688414b" = "Schatzflotte geplündert"
"0x16cc82c9" = "Liefert @G$Goods$ bis zum @D$EndDate$ an eine Person in @T$TargetTown$. Anschließend erhaltet Ihr @g$Price$ pro geliefertem Fass."
"0x16e90f87" = "Ihr habt das verlorene Paket gefunden. Bringt es bis zum @D$EndDate$ zu @N$OwnerName$ in @T$TOWN$. "
"0x16fcf40f" = "Kredite"
"0x17081769" = "Größte Auslastung:"
"0x170f1419" = "%1 %2 hat die Hafenverteidigung der Stadt durchbrochen und die Stadt geplündert."
"0x171746e9" = "Ihr habt meiner Nation lange und ehrlich gedient, daher liegt es nun an mir, Euch dafür zu belohnen. Ich schenke Euch ein Stück Land, auf dem Ihr Eure eigene Stadt gründen könnt."
"0x17328849" = "unbekannt"
"0x1733ed83" = "In diesem Szenario erhaltet Ihr ein Landgeschenk vom spanischen Vizekönig, auf dem Ihr Eure eigene Stadt errichten könnt. Ziel dieses Szenarios ist es, Eure eigene Stadt zu wirtschaftlicher Blüte zu bringen.<n:25>Bevor Ihr jedoch ein Landgeschenk bekommt, müsst Ihr Euer Ansehen in Spanien steigern und Euch beim Vizekönig von Spanien beliebt machen, indem Ihr Städte für ihn annektiert."
"0x1742a5e4" = "Uhrzeit"
"0x17677dab" = "Prognose"
"0x17839498" = "Preisniveau um 5% verringern"
"0x178491f6" = "Preisniveau um 5% erhöhen"
"0x17885da0" = "Ihr habt ein Floß mit Schiffbrüchigen entdeckt und @I$Settlers$ Siedler aufgenommen. Sie hoffen, dass Ihr sie in einer Stadt mit Arbeitskräftemangel absetzt."
"0x17a97ba2" = "Seeschlachten"
"0x17abb14d" = "und der Hafen ist sehr schlecht verteidigt."
"0x17ae0013" = "Mit dem letzten Konvoi aus Europa bekam ich die Mitteilung, dass meine Stadt in den nächsten Wochen leer ausgehen soll, was die Lieferung von Importwaren angeht.<n><n>Wollt Ihr mich unterstützen? Schließlich kann ich mich nicht darauf verlassen, dass andere Händler diese Waren zufällig mitbringen."
"0x17ae0014" = "Ihr wisst, es herrscht Krieg zwischen @n$Nation1$ und @n$Nation2$.<n>Aus diesem Grunde erhalte ich auch in den nächsten Wochen keine Importwaren aus Europa. So bleibt mir nichts anderes übrig, als die Waren in @n$Nation2$ aufkaufen zu lassen.<n><n>Ich habe auch schon andere Händler beauftragt, doch ich hätte gerne auch Eure Hilfe."
"0x17ae0015" = "Was erlaubt @n$Nation2$ sich da? Gerade erfahre ich von einem Informanten, das Transportkonvois aus Europa unterwegs zu meiner Stadt überfallen und geplündert werden. Wollt Ihr mir helfen, die fehlenden Importwaren zu beschaffen?"
"0x17d31860" = "Wareneinkauf"
"0x17d5b880" = "Der Konvoi kann nicht aufgelöst werden, da sich noch Waren oder Fracht an Bord befinden."
"0x17f39d18" = "Konvois ohne Auftrag"
"0x1813d72e" = "%1. %2"
"0x183f926a" = "Gouverneur %1"
"0x1844fb4f" = "Nachdem Ihr die Geleitschiffe Eures Gegners besiegt habt, fällt Euch ein Handelsschiff in die Hände.<n><n>Entscheidet nun, welche Waren Ihr übernehmen und ob Ihr die Schiffe kapern oder nur plündern wollt."
"0x1844fb50" = "Nachdem Ihr die Geleitschiffe Eures Gegners besiegt habt, fallen Euch %1 Handelsschiffe in die Hände.<n><n>Entscheidet nun, welche Waren Ihr übernehmen und ob Ihr kapern oder nur plündern wollt."
"0x1844fb51" = "Der Konvoi Eures Gegners verfügt über keine Geleitschiffe, die sich Euch in den Weg stellen könnten. Das Handelsschiff fällt Euch daher kampflos in die Hände.<n><n>Entscheidet nun, welche Waren Ihr übernehmen und ob Ihr das Schiff kapern oder nur plündern wollt."
"0x1844fb52" = "Der Konvoi Eures Gegners verfügt über keine Geleitschiffe, die sich Euch in den Weg stellen könnten. Die Handelsschiffe fallen Euch daher kampflos in die Hände.<n><n>Entscheidet nun, welche Waren Ihr übernehmen und ob Ihr die Schiff kapern oder nur plündern wollt."
"0x184aee4b" = "Kompatibel"
"0x18546893" = "In diesem Szenario lernt Ihr, Seeschlachten zu führen. Es beginnt mit einer kleinen Übungsschlacht, später müsst Ihr den Konvoi eines berüchtigten Piraten aufspüren und vernichten.<n><n>Außerdem lernt Ihr den Gouverneur von Cartagena, Eurer Startstadt kennen. Er wird Euch helfen, mit Seeschlachten vertraut zu werden und wird Euch später auch den Auftrag geben, einen bestimmten Piraten zu jagen.<n><n>Ihr beginnt das Szenario mit dem Rang eines Matrosen. Dies ist die Voraussetzung dafür, dass Euch der Gouverneur einen Auftrag erteilt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Besucht den Gouverneur von Cartagena und erfüllt seinen Auftrag."
"0x18636d91" = "Soldaten"
"0x18708b29" = "Transfer von Waren"
"0x18ab27d9" = "<c>%1<n><n:5>%2 (%3)<n><n:5>%4<n:5>"
"0x18b36fa5" = "<n><n>Bei einem Gouverneur seiner Nation könnt Ihr Lösegeld für ihn verlangen."
