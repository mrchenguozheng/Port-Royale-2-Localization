"0xcb674ff0" = "Ich danke Euch im Namen meiner Nation. Der Konvoi wird nun auf Vordermann gebracht und die Mannschaft zusammengestellt. In 15 Tagen ist er einsatzbereit.<n><n>Wenn Ihr mir einen weiteren Konvoi übergeben wollt, so müsst Ihr bis dahin warten."
