"0x1f32f588" = "Szenario gescheitert"
"0x1f36e96b" = "In Kürze kommt hier ein Transportkonvoi an. Von einem Spion habe ich erfahren, dass dieser Konvoi auf seinem Rückweg nach Europa von unserem Feind angegriffen werden soll. Könnt Ihr den Rückweg des Konvois sichern? "
"0x1f36e96c" = "Ich habe ein Problem. Meine Gemahlin möchte mit dem nächsten Konvoi nach Europa fahren, um ihre Familie zu besuchen. Leider hat @n$HostileNation$ davon erfahren und will den Konvoi abfangen. Könnt Ihr meiner Gemahlin eine sichere Reise ermöglichen?"
"0x1f36e96d" = "In Kürze lasse ich wichtige Dokumente nach Europa bringen. Da wir uns derzeit im Krieg mit @n$HostileNation$ befinden, möchte ich sichergehen und für zusätzlichen Geleitschutz sorgen. Könnt Ihr diesen Geleitschutz übernehmen? "
"0x1f6696d2" = "Es tut mit leid, ich kann Euch den Auftrag nun doch nicht mehr erteilen. Ich habe gerade die Nachricht erhalten, dass das Problem nicht mehr besteht."
"0x1f851477" = "Der Konvoi, der diese Mission erfüllen sollte, wurde zerstört."
"0x1f890b43" = "Warennachfrage"
"0x1f9a14b7" = "<n><n>Um das Versteck angreifen zu können, müsst Ihr einen Konvoi dorthin schicken wie zu einer Stadt. Gebt acht! Denn alle Piratenkonvois, die sich zur Zeit Eures Angriffs nicht im Versteck befinden, sind gewarnt und gründen ein neues Versteck."
"0x1fb02f3a" = "Speichern"
"0x1fcb6529" = "Seeschlacht beenden"
"0x1fd35f28" = "Animation Arts"
"0x1fdba107" = " Sein täglicher Sold beträgt %1."
"0x1fe06eb2" = "Auslastung<n>%1%"
"0x1fe25594" = "Nachdem die Hafenverteidigung durchbrochen wurde, legt Euer Konvoi an und die Matrosen machen sich auf den Weg in die Stadt. Unterwegs treffen sie auf den Kommandant der Stadtwache. Er will nicht weichen, bevor er in einem ehrlichen Zweikampf besiegt wurde. Euer Kapitän nimmt die Herausforderung an."
"0x1fea1f37" = "Das laufende Spiel beenden und den Spielstand laden?"
"0x1ff731c7" = "Handelsroute Speichern"
"0x200d4e11" = "%1 %2 %3"
"0x20252656" = "Goldfund in %1"
"0x20413ba0" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
"0x204cf373" = "Stadt unterstützen"
"0x204d1e7c" = "Ein Piratenversteck kann nur von Seeseite angegriffen werden."
"0x20574fcc" = "%1, Ihr habt die geliebte Stadt meines Vaters für %2 annektiert! Damit ist es nun aus zwischen uns. Ich hoffe, ich muss Euch niemals mehr wieder sehen. Ihr solltet nun wissen, dass Ihr mir nie etwas bedeutet habt und dass ich auch in Zukunft keinen Augenblick in Gedanken an Euch verschwenden werde.<n>Euch allerdings wünsche ich, dass Ihr früher oder später das bekommt, was Euch zusteht.<n><n>%3"
"0x20574fcd" = "%1, durch Eure Annektierung für %2 habt Ihr den Vizekönig dazu gezwungen, in die geliebte Stadt meines Vaters umzuziehen und mein Vater muss zurück nach Europa.<n><n>Damit ist es nun aus zwischen uns. Ich hoffe, ich muss Euch niemals mehr wieder sehen. Ich teile Euch außerdem mit, dass ich mich weit mehr für die Händler in der Kneipe als für Euch interessiert habe. Ihr habt mir nie etwas bedeutet und auch in Zukunft werde ich besseres zu tun haben, als an Euch zu denken.<n><n>Euch allerdings wünsche ich, dass Ihr früher oder später das bekommt, was Euch zusteht.<n><n>%3"
"0x2065f070" = "Sieh an. Gerade erhalte ich eine Nachricht von meinem Botschafter, dass uns %1 ein überraschendes Friedensangebot gemacht hat. So werden wir dann wohl noch heute Frieden schließen. <n><n>Ich kann Euch daher den Auftrag für die Annektierung nicht mehr erteilen."
"0x207295a1" = "Eine Handelsroute mit dem Namen '%1' existiert bereits.<n><c>Überschreiben?"
"0x2077407d" = "%1,<n>schön, dass Ihr da seid. Kommt herein und ich will sehen, ob ich etwas für Euch habe."
"0x207a9d35" = "Von der Stadtmauer aus ruft der Kommandant der Stadtwache Eurem Kapitän zu, die Schlacht zu beenden und stattdessen einen Zweikampf mit ihm auszufechten. Um weitere Verluste zu vermeiden, stimmt Euer Kapitän zu."
"0x207b620f" = "Nachdem Eure Truppen das Stadttor zerstört haben, stellt sich ihnen der Hauptmann der Stadtwache in den Weg. Er fordert Euren Kapitän zum Zweikampf heraus."
"0x208aca1b" = " Haltet dort Ausschau nach englischen Militärkonvois und vernichtet @I$NumConvoys$ von ihnen."
"0x208aca1c" = " Haltet dort Ausschau nach französischen Militärkonvois und vernichtet @I$NumConvoys$ von ihnen."
"0x208aca1d" = " Haltet dort Ausschau nach holländischen Militärkonvois und vernichtet @I$NumConvoys$ von ihnen."
"0x208aca1e" = " Haltet dort Ausschau nach spanischen Militärkonvois und vernichtet @I$NumConvoys$ von ihnen."
