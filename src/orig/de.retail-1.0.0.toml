"0xfc64ab0e" = "Nun könnt Ihr Euer Ansehen in %1 steigern, indem Ihr französische Schiffe und Städte angreift. Euer Ansehen bei den anderen Nationen sinkt dabei nicht."
"0xfc692ef1" = "<n><n>Sofern mindestens ein Schiff Eures Konvois die Schlacht überlebt, bleibt Euch der Kapitän aber erhalten."
"0xfc71eb4b" = "Nun habe ich das Malheur. Seit Krieg mit @n$FoeNation$ herrscht, gelingt es mir nicht, für die Transportkonvois genug Kolonialwaren herbeizuschaffen. Könnt Ihr mir nicht mit einer größeren Menge @G$Goods$ aushelfen?"
"0xfc71eb4c" = "Seit wir im Krieg mit @n$FoeNation$ sind, wird den dortigen Händlern verboten, @G$Goods$ an die Städte meiner Nation zu liefern. Nun habe ich einen nicht unerheblichen Engpass. Ihr habt viele Schiffe und kennt Euch in den Gewässern aus. Könnt Ihr mir nicht eine größere Menge @G$Goods$ besorgen?"
"0xfc72151e" = "Transfer Lagerhaus - Konvoi"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Nach Kanonen"
"0xfc910833" = "Verfügbare Wohnhäuser"
"0xfc9a5f7d" = "Es war mir eine Freude, mit Euch Geschäfte zu machen. Ich wünsche Euch noch einen schönen Tag!"
"0xfc9a5f7e" = "Die Waren wurden an Euer Lager geschickt. Ich wünsche Euch noch einen schönen Tag!"
"0xfc9a5f7f" = "Die Waren wurden in Euren Konvoi eingeladen. Auf Wiedersehen, %1."
"0xfc9cf623" = "Erfüllt"
"0xfca882e8" = "Ihr wisst, dass die Spanische Schatzflotte stets eine unbekannte Route abfährt, um Schätze aus den Kolonien für Europa einzusammeln. Der Aufenthalt in den Städten ist jeweils nur von kurzer Dauer, um Überfälle zu vermeiden. Diesmal ist Spanien jedoch ein großer Fehler unterlaufen, durch den wir nun wissen, welche Route die Spanische Schatzflotte gerade nimmt. Euer Auftrag ist einfach: Vernichtet die gesamte Flotte."
"0xfca882e9" = "Wir befinden uns im Krieg mit Spanien und müssen verhindern, dass die Spanische Schatzflotte Europa erreicht. Glücklicherweise konnten wir in Erfahrung bringen, welche Stadt die Flotte als nächstes anläuft. In dieser Stadt werden wir die Flotte so sabotieren, dass sie ihren Aufenthalt im Hafen verlängern muss. Dies würde Euch genug Zeit geben, die Flotte abzufangen um zu verhindern, dass sie Europa erreicht. Übernehmt Ihr den Auftrag?"
"0xfca882ea" = "Es bietet sich uns eine seltene Gelegenheit. Einer meiner Informanten hat mir heute gemeldet, auf welcher Route die Spanische Schatzflotte derzeit fährt. Doch damit nicht genug. In ihrer nächsten Stadt wird die Flotte länger als sonst vor Anker liegen, wie wir erfahren konnten. Da wir uns im Krieg mit Spanien befinden, sollten wir dem Vizekönig eine Freude machen und dafür sorgen, dass die Schatzflotte ihr Ziel in Europa nie erreicht. Wollt Ihr die Flotte für meine Nation abfangen?"
"0xfcc82d44" = "Säbelträger"
"0xfcd6fdec" = "Wie ich sehe, habt Ihr meinen letzten Auftrag noch nicht erfüllt. Beendet diesen Auftrag, denn ich habe noch mehr Aufgaben für Euch."
"0xfcded04c" = "Spanien muss gerüstet sein, also sorgt für Bevölkerung und Güter. Errichtet 20 stattliche Wohnhäuser und 20 voll produzierende Betriebe in:<n>Havanna, Margarita, Guadeloupe, St. Juan, Port Royale, Cartagena, Biloxi, St. Augustine, Grand Bahama, Turk Island."
"0xfce1cfd1" = "Leider habe ich derzeit keine Verwendung für Euch.<n>Ich kann Euch nur dann den Auftrag zur Annektierung einer Stadt geben, wenn eine feindliche Nation geschwächt ist und mir genügend Militärkonvois zum Schutz meiner Städte zur Verfügung stehen."
"0xfce38f12" = "Stadtkommandant"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "Atmosphäre"
"0xfd1be8e3" = "Der %1 Freibeuter %2 hat sich in die Stadt geschlichen und große Lagerbestände verschiedener ansässiger Händler vernichtet. Die Stadtverwaltung übernimmt keine Haftung."
"0xfd1f0281" = "Rohstoffe und Produktion"
"0xfd26f2aa" = "Konvoi @C$Convoy$ hat einen Schiffbrüchigen aufgenommen. Bringt ihn nach @T$DestTown$."
"0xfd26f2ab" = "Konvoi @C$Convoy$ hat einen Schiffbrüchigen aufgenommen. Bringt ihn zu einer Stadt der Nation @n$DestNation$."
"0xfd26feb4" = "@N$Name$ ist wütend von Bord gesprungen, weil Ihr Euch zu viel Zeit gelassen habt."
"0xfd2f55fd" = "Spieldatum"
"0xfd40a541" = "<n><f:fonts/Tiepolo_black14x14aaFHk.res>Verluste<t><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen> %1<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen> %2<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_MANN_800x600.screen> %3<n>(ca. %4)"
"0xfd4ed860" = "Eure Truppen durchbrechen das Stadttor und nehmen den Kommandant als Geisel. Bei diesem Anblick kapitulieren die Soldaten der Stadt<n><n>Was habt Ihr nun vor?"
"0xfd518241" = "Gouverneursstadt %1"
"0xfd638295" = "Spiel wird geladen..."
"0xfd6477c9" = "Erhöht die Kampfkraft Eures Konvois auf mindestens 90 Kanonen."
"0xfd69d24a" = "%1:%2:%3"
"0xfd6d4abb" = "Ihr habt eine Aktion durchgeführt, durch die das Szenario nicht mehr erfolgreich absolviert werden kann.<n><n>Bitte haltet Euch an die Anweisungen im Ereignisfenster."
"0xfd9349ac" = "Beschlagnahme"
"0xfda0635d" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>LMT<f:fonts/Tiepolo_bold14x14aaFH.res><t>Breitseite feuern<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMT<f:fonts/Tiepolo_bold14x14aaFH.res><t>Kurs setzen<n><f:fonts/Tiepolo_black14x14aaFHk.res>1,2,3<f:fonts/Tiepolo_bold14x14aaFH.res><t>Munition wählen<n><f:fonts/Tiepolo_black14x14aaFHk.res>4<f:fonts/Tiepolo_bold14x14aaFH.res><t>Enterbereitschaft<n><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Kanonen abfeuern"
"0xfda277f4" = "%1 ist voll ausgebaut und bietet keinen Platz mehr für ein Lagerhaus. Wenn Ihr dennoch in dieser Stadt Fuß fassen wollt, so könnt Ihr versuchen, einen örtlichen Händler dazu zu bringen, einen seiner Betriebe abzureißen.<n><n>Ein Betrieb wird abgerissen, wenn der Preis der produzierten Ware in der Stadt über längere Zeit auf einem Tiefstand ist, d.h. wenn die Ware im Überfluss vorhanden ist. Um dies zu erreichen, müsst Ihr die Ware erst einmal horten. Dann verkauft Ihr an den Markt der Stadt so viele Waren, bis der Preis minimal ist.<n><n>Einmal am Tag wird am Warenmarkt der Stadt die Produktion abgeliefert. Ist in diesem Moment der Preis minimal, so reduziert der Betriebszweig seine Arbeiterzahl, was Ihr durch Anklicken überprüfen könnt. Sobald 30 Arbeiter entlassen wurden, wird ein Betrieb abgerissen."
"0xfda5ded4" = "Die Stadt floriert aufgrund eines Goldfundes"
"0xfdaf6463" = "Ich bin Euch erneut zum Dank verpflichtet, denn Ihr habt viel für meine Nation getan. Ich schenke Euch daher das restliche Land für Eure Stadt %1. Damit seid Ihr nun im Besitz des gesamten Stadtgebietes."
"0xfdb7f907" = "Ein Lagerfeuer verrät das Versteck des Lehrers, nicht weit vom Ufer entfernt. Als Euer Kapitän mit einem Boot an Land übersetzt, wird er schon von einem alten Mann empfangen. Als dieser den vielen Wein bemerkt, reibt er sich die Hände."
"0xfdb7f908" = "Nicht weit vom Ufer entdeckt Euer Konvoi ein kleines Einsiedlerlager. Euer Kapitän setzt mit einem Boot an Land und trifft dort auf einen alten Mann, der eine noch ältere Kapitänsuniform trägt. Als er die Rumfässer erblickt, ist er sehr erfreut."
"0xfdb7f909" = "Nach einiger Zeit entdeckt Euer Konvoi ein Versteck an Land. Der Kapitän setzt an Land und schaut sich um. Schließlich findet er den alten Meister und berichtet ihm den Grund seines Besuchs. Der Einsiedler nimmt die Nahrungsmittel an."
"0xfdc606cf" = "Piratenjagd"
"0xfdcdfd58" = " Gerne bringt er Eurem jungen Kapitän alles über die Geheimnisse des Handels bei."
"0xfdcdfd59" = " Er bringt dem jungen Kapitän daher alles über erfolgreiche Schlachtführung bei."
"0xfdcdfd5a" = " Gerne unterrichtet er den Kapitän in der hohen Kunst der Navigation."
"0xfdd49861" = "Schiffswrack"
"0xfdf9c881" = "%1: %2"
"0xfdfa3b73" = "Menge verringern"
"0xfe12c9d8" = "Konvoi überladen"
"0xfe4e2182" = "Grafikeinstellungen"
"0xfe5090b6" = "1"
"0xfe54d4d6" = "%1. %2"
"0xfe5c7df0" = "Errichtet 5 verschiedene Betriebe und Wohnhäuser in Tortuga und erhöht die Anzahl der Einwohner bis zum @D$EndDate$ auf 1500."
"0xfe6a6de4" = "Ich beginne sogleich mit den Vorbereitungen. Bitte liefert die Waren rechtzeitig bis spätestens %1."
"0xfe6eb6fe" = "%1 %2"
"0xfe7b3bb8" = "ESC"
"0xfe8843e4" = "Liste bekannter Piraten"
"0xfe955798" = "In der Stadt herrscht eine Rattenplage"
"0xfe9663e8" = "aktuelle Tagesproduktion"
"0xfeab2fe1" = "Gut. Der Transportkonvoi wird am @D$DepartDate$ den Hafen von @T$TOWN$ verlassen. Fahrt vor ihm in Richtung Europa und sichert seine Route. Achtet auf Militärkonvois der Nation @n$HostileNation$. Euer Auftrag ist erfüllt, wenn der Konvoi die Gewässer der Neuen Welt verlassen hat, ohne unterwegs angegriffen worden zu sein."
"0xfeab2fe2" = "Ich danke Euch sehr. Am @D$DepartDate$ wird ein Transportkonvoi meinen Hafen verlassen. Ihr sollt für eine sichere Fahrt nach Europa sorgen und den Konvoi vor Militärkonvois der Nation @n$HostileNation$ schützen."
"0xfeab2fe3" = "Ihr seid ein Mann der Tat. In Kürze trifft hier ein Transportkonvoi ein, der am @D$DepartDate$ den Hafen in Richtung Europa verlässt. Fahrt voraus und sichert seine Route, damit es nicht zu Zwischenfällen kommt."
"0xfeadceb1" = "In der Demo können Sie nur die Städte betreten, die nach Spielstart bereits sichtbar waren.<n><n>Sie können dennoch mit allen Städten handeln, indem Sie einen Konvoi in die Stadt schicken und dann einen Rechtsklick auf die Stadt machen, während der Konvoi ausgewählt ist."
"0xfebc8b4b" = "Farbigen Hardware-Mauscursor verwenden"
"0xfebdc084" = "Ändern"
"0xfecd9d17" = "Spieldauer"
"0xfecf5f4b" = "Schiffe im Konvoi"
"0xfee9991d" = "%1: %2 fertig"
"0xfee9c9a5" = "Alle Eure Produktionen laufen einwandfrei."
"0xfef2daf6" = "Lagerhäuser"
"0xfefac078" = "Stadtdetails"
"0xff020ef9" = "Ihr habt Euch bei meiner Nation sehr unbeliebt gemacht. Doch %1 ist bereit, für %2 die Feindschaft zu vergessen. Wollt Ihr diesen Betrag bezahlen?"
"0xff062e68" = "Lagerhäuser"
"0xff075dec" = "Optionen"
"0xff095c25" = "Eine Seuche ist ausgebrochen."
"0xff0dd628" = "%1 (%2 kn)"
"0xff20b243" = "Chronik"
"0xff2140da" = "Ihr sollt bis zum @D$Date$ @a$Amount$ @G$Goods$ in @T$TOWN$ abliefern. Ihr erhaltet @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> am Marktplatz."
"0xff26a17e" = " Ihr habt die Waren nicht rechtzeitig abgeliefert."
"0xff27ae91" = "<n>Ihr habt zu wenig Bares. Kommt wieder, wenn Ihr es Euch leisten könnt."
"0xff2fced2" = "Städtestatistik"
"0xff405393" = "Spiegelungen auf dem Wasser anzeigen"
"0xff4713d1" = "Der %1 Freibeuter %2 hat heute unter falscher Flagge im Hafen der Stadt angelegt und sich als Händler ausgegeben. Auf diese Weise gelang es ihm, Warenbestände der Stadt aufzukaufen. Viele Waren sind nun gar nicht mehr oder kaum vorhanden."
"0xff4e319b" = "Konvoi übergeben"
"0xff624273" = "International Product Manager"
"0xff819106" = "Kapert insgesamt drei englische Handelskonvois: entert deren Schiffe und nehmt sie in Euren Konvoi auf."
"0xff8d2f23" = "@A$USER$, ich grüße Euch. Ich hätte Interesse an einer größeren Menge @G$Goods$, sagen wir @a$Amount$. Ich biete Euch einen Stückpreis von @g$Price$. Seid Ihr interessiert?"
"0xff8d2f24" = "Hallo @A$USER$. Könnt Ihr mir @a$Amount$ @G$Goods$ liefern? Ich würde Euch dafür @g$TotalPrice$ bezahlen, das wäre ein Stückpreis von @g$Price$. Was sagt Ihr?"
"0xff8d2f25" = "Ich grüße Euch, @A$USER$. Habt Ihr daran Interesse, mir @a$Amount$ @G$Goods$ zu liefern? Ich zahle @g$Price$ pro Stück, zusammen also @g$TotalPrice$. Interessiert?"
