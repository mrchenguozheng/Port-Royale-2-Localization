"0xf353a9ce" = "@A$USER$, gut, dass ich Euch treffe. Mir ist unterwegs hierher ein Paket abhanden gekommen. Könnt Ihr es für mich suchen?"
"0xf353a9cf" = "Ich grüße Euch! Habt Ihr ein Schiff? Meines ist kürzlich im Sturm gesunken. Glücklicherweise konnte ich mich retten, doch nicht meine Truhe mit wichtigsten persönlichen Dingen. Könnt Ihr losziehen und nachsehen, ob meine Truhe vielleicht noch auf dem Meer schwimmt? Ich zahle Euch eine hohe Belohnung, denn die Truhe ist mir sehr viel wert."
