"0x30bb44fc" = "Ihr seid doch der bekannte @A$USER$? Könnt Ihr mir nicht helfen? Ein Kopfgeldjäger ist mir auf den Fersen, wahrscheinlich wurde er von einem meiner Konkurrenten auf mich gehetzt. "
"0x30bb44fd" = "@A$USER$, bitte setzt Euch zu mir. Mein Name ist @N$OwnerName$ und ich habe etwas wichtiges mit Euch zu besprechen. Wie soll ich nur anfangen. Also ich habe mich vor kurzem mit meiner Frau gestritten, sie behauptet, ich würde sie betrügen, was natürlich überhaupt nicht stimmt. Jedenfalls hat sie mich aus dem Haus geworfen. Das ist noch nicht alles: Sie hat einen Kopfgeldjäger angeheuert, damit ich nicht mal mehr in die Stadt komme. Könnt Ihr mir helfen?"
"0x30bb44fe" = "Ihr seht aus wie jemand, der ein gutes Schiff sein eigen nennt.<n>Ich muss dringend nach @T$Town$, um Dokumente abzuliefern, die einen örtlichen Händler dort sehr belasten. Leider hat der Händler Wind davon bekommen und versucht nun, die Dokumente in seine Hände zu bekommen. Könnt Ihr mir nicht den Weg nach @T$Town$ freimachen?"
"0x30ee69e7" = "Warenstatistik"
"0x30f0fea9" = "Sucht außerhalb der Stadt @T$TOWN$ nach Hinweisen über den Verbleib der Trunkenbolde. Bringt dem Händler @N$OwnerName$ das Schiff bis zum @D$EndDate$ zurück."
