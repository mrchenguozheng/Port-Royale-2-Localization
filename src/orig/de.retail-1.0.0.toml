"0x084340c7" = "In diesem anspruchsvollen Szenario geht es um Handel, Produktion und die Versorgung einer Stadt.<n:25>In Tortuga gehen seltsame Dinge vor: kaum ein Händler möchte die Stadt anfahren und mehrere Ereignisse machen den Bürgern das Leben schwer. Eure Aufgabe ist es, die Stadt vor dem Untergang zu bewahren. Am Ende des Szenarios wird Euch eine Punktzahl angezeigt, die sich aus Eurer Schnelligkeit und dem erzielten Vermögen errechnet.<n:25>Dieses Szenario bietet Euch neben den besonderen Szenariozielen alle Möglichkeiten des freien Spiels."
