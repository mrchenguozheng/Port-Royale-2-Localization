"0xe7519201" = "So haben wir eine Abmachung. Bringt mir die @a$Amount$ @G$Goods$ an den Markt. Ich warte dort bis zum @D$EndDate$ auf Euch. Ihr müsst die Waren in einer Lieferung übergeben."
