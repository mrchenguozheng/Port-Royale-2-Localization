"0xf4024494" = "Versorgt die Stadt @T$TargetTown$ der Nation @n$TargetNation$ mit Waren, so dass die Stadt bis zum @D$EndDate$ den Status „Blütezeit“ erreicht und mehr als 2000 Einwohner hat."
