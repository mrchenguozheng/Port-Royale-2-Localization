"0x0a49c903" = "Glückwunsch! Ihr habt das zweite Szenario erfolgreich bestanden. Ihr habt gelernt, mit Handel Gewinne zu machen, seid im Rang aufgestiegen und habt einen weiteren Konvoi gebildet, indem Ihr einen Kapitän eingestellt habt.<n><n>Übrigens sind Kapitäne umso teurer, je mehr Erfahrung sie haben. Anfangs sind sie meist sehr unerfahren, doch mit der Zeit erhält jeder Kapitän, abhängig davon, wie Ihr ihn einsetzt, Erfahrung in Navigation, Handel und Kampf. Die aktuelle Erfahrung Eurer Kapitäne könnt Ihr in der Übersicht eines Konvois erfahren. Klickt dazu einen Konvoi an und dann auf den Button \"Übersicht und Kosten\".<n><n>Im nächsten Szenario werdet Ihr eigene Betriebe errichten und Waren produzieren. "
