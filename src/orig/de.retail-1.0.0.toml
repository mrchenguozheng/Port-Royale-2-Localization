"0xcc2c64fb" = "Ihr habt den Auftrag erhalten, einen Konvoi des Piraten Blackbeard zu finden und zu vernichten.<n><n>Blackbeard verfügt über ein unbekanntes Versteck mit mehreren Konvois, die alle aus bis zu 5 vollbewaffneten Schiffen bestehen. Ihr werdet es mit Eurem bisherigen Konvoi daher nicht ganz leicht haben.<n><n>Ihr solltet daher zunächst die Kampfkraft Eures Konvois erhöhen. Um ein großes Schiff bezahlen zu können, könnt Ihr Eure Lagervorräte in @T$TOWN$ zu möglichst guten Preisen verkaufen. Beachtet die Tipps im Ereignisfenster, sie geben Euch an, wo Ihr die Waren nördlich und östlich von @T$TOWN$ gut verkaufen könnt.<n><n>Lasst Euch nicht zuviel Zeit, denn Ihr müsst später noch den Auftrag des Gouverneurs erfüllen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Verkauft die Waren, die Ihr im Lager von @T$TOWN$ vorrätig habt und erhöht so Euer Bargeld auf @g$GoldGoal$."
