"0x03cad242" = "Kredit abbezahlt"
"0x03ce7c8e" = "Szenarioziel"
"0x03d3dcd8" = "Während der Plünderung hat Eure Mannschaft auch das Versteck der Gouverneursgattin entdeckt und die Frau „befreit“. Sie war gerade damit beschäftigt, einen Kuchen zu backen.<n> „Bringt mich nicht zurück zum Gouverneur nach @T$TOWN$. Ich habe ihn nie geliebt, müsst Ihr wissen!“.<n><n>Wollt Ihr die Frau trotzdem mitnehmen lassen und zum Gouverneur zurückbringen? "
"0x03d3dcd9" = "Im Verlauf der Plünderung kommt Euren Leuten ein junger Bursche entgegen, der einen Pudel bei sich hat. Der Junge erzählt Euch, dass der Gouverneur von @T$TOWN$ selbst die Entführung inszeniert hat, um den Hund loszuwerden. Der Kapitän nimmt Michelle erst einmal mit an Bord. Er fragt sich, ob es sich lohnt, den Hund wieder dem Gouverneur von @T$TOWN$ zurückzubringen.<n><n>Wollt Ihr den Hund über Bord werfen lassen?"
"0x03d6dcdb" = "Piratenjagd"
"0x03dfeb8d" = "<c><o:0xFFFFE6A0>%1<n><o:0xFFEBF0A0>(Spielerstadt)"
"0x03e1b0eb" = "Ein großes Unglück! Ich muss regelmäßig Kolonialwaren für die Transportkonvois aus Europa vorrätig haben, doch es fehlt uns an Werkzeugen, um diese Waren überhaupt produzieren zu können. Wollt Ihr mir nicht helfen, eine Stadt mit Werkzeug zu versorgen?"
"0x03e1b0ec" = "Wie konnte das nur passieren! In @T$DestTown$ sind die Werkzeugvorräte zur Neige gegangen, nun ist die Produktion an Kolonialwaren in Gefahr. Wollt Ihr mir helfen, das Dilemma zu lösen?"
"0x03e1b0ed" = "In meiner Nation fehlt Werkzeug. Wir sollten es bei den anderen Nationen einsammeln, was meint Ihr?"
"0x03e9fe1e" = "Tortuga in Not"
"0x03efad5a" = "Es liegen keine Meldungen vor"
"0x03efff11" = "Ihr macht mich sehr glücklich! So eilt dann schnell zu meinen Vater, er wird sehr entzückt sein!"
"0x03f2ddbd" = "@A$USER$, kommt her und setzt Euch, ich habe etwas geschäftliches mit Euch zu besprechen.<n>Ich versuche, @G$Goods$ für @n$HostileNation$ zu beschaffen. Ihr wisst, dass sich @n$Nation$ und @n$HostileNation$ im Krieg befinden. Derzeit steht es in @n$HostileNation$ sogar unter Strafe, @G$Goods$ aus @n$Nation$ zu importieren, entsprechend gute Preise werden gezahlt. Daher frage ich Euch, ob Ihr an einem Schmuggelgeschäft interessiert wärt."
"0x03f2ddbe" = "@A$USER$, wärt Ihr an einem Schmuggelgeschäft interessiert? Ich bin hier im Auftrag eines Händlers aus @T$TargetTown$. Aufgrund des Krieges dürfen derzeit keine Waren aus Städten der Nation @n$Nation$ nach @T$TargetTown$ transportiert werden. Mein Auftraggeber ist an @G$Goods$ interessiert. Er bezahlt Euch @g$Price$ pro Fass, das Ihr ihm liefert. Was sagt Ihr?"
"0x03fb5c67" = "Aufgrund Eures andauernden schlechten Verhältnisses zur Nation %1 wurden Euch heute in %2 %3 Eurer Betriebe entzogen."
"0x03fb5c68" = "<n>Ich rate Euch, einen meiner Gouverneure zu besuchen, damit Ihr Euer Verhältnis zu meiner Nation aufbessern könnt."
"0x03fb5c69" = "<n>Ich rate Euch, mich zu besuchen, damit wir uns über Euer Verhältnis zu meiner Nation unterhalten können."
"0x03fb5c6a" = "<n><n>%1, Vizekönig von %2"
"0x04081363" = "Einer meiner Rivalen in @n$HostileNation$ hat mir meine Tagebücher gestohlen und will sie nun nach Europa bringen lassen. Dies darf auf keinen Fall passieren. Glücklicherweise konnte ich den Steuermann des Schiffes bestechen lassen, mit dem die Bücher nach Europa gebracht werden. Nun brauche ich Eure Hilfe."
"0x04081364" = "Lange Zeit sind wir von @n$HostileNation$ ausspioniert worden. Alle Informationen wurden nun, wie ich erfahren konnte, genauestens notiert und sollen nun von @T$HostileTown$ aus nach Europa gebracht werden. Ihr sollt mir helfen, damit diese Dokumente die Karibik niemals verlassen."
"0x040bf5f1" = "Das Spiel abgeben"
"0x04100fa0" = "%1: Piratenangriff"
"0x0420c2a2" = "<ts:20>Wie Ihr im Handelsfenster Waren kauft und verkauft, wisst Ihr ja schon. Hierzu noch folgende Hinweise:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Der auf den Pfeilen angezeigte Preis hängt von der Stückelung ab<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Ob Ihr 10 mal eine Ware handelt oder ein mal 10 Waren, ist egal. Der Gesamtpreis ist der gleiche.<n><n><g:INTEXT_AUSRUF_800x600.screen>Wenn eine Ware nicht vorhanden ist, wird trotzdem ein Preis angezeigt. Dies ist immer der Preis für eine Wareneinheit, egal, welche Stückelung eingestellt ist.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Ihr könnt auch handeln, indem Ihr auf das Symbol einer Ware klickt. In diesem Fall öffnet sich ein kleiner Dialog mit einem Schieberegler. Mit diesem Regler könnt Ihr einstellen, wie viele Waren Ihr kaufen oder verkaufen wollt. Der Einzelpreis und der Gesamtpreis wird sofort angezeigt."
"0x0424bb9a" = "Chronik"
"0x0436c531" = "Ihr habt ein besonderes Schiff gefunden!<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Dampfgetriebenes Segelschiff<f:fonts/Tiepolo_bold14x14aaFH.res><n><n>Ein solches Schiff habt Ihr noch niemals in Eurem Leben gesehen. Es scheint sich nicht nur durch die Segel auf zwei Masten fortbewegen zu können, sondern hat noch einen sonderbaren Mechanismus, mit dem durch Wasserdampf zwei Schaufelräder angetrieben werden können. Dadurch scheint sich das Schiff selbst bei absoluter Windstille vorwärts bewegen zu können."
"0x044bc6d2" = "Euer Kapitän hat den Fechtkampf gegen %1 gewonnen. Eure Leute machen sich auf die Suche nach dem Piratenschatz und finden %2.<n><n>Ihr habt das Versteck ausgeräuchert und die Ära des Piraten %3 beendet. "
"0x044bc6d3" = "Euer Kapitän hat den Fechtkampf gegen %1 gewonnen. Eure Leute machen sich auf die Suche nach dem Piratenschatz und finden %2.<n><n>Ihr habt zwar das Versteck ausgeräuchert und die Gefahren, die von hier ausgingen beendet, jedoch gibt es Anzeichen dafür, dass Ihr nicht alle Schiffe erwischt habt. Diese Schiffe werden möglicherweise ein neues Versteck gründen."
"0x044e52eb" = "Szenarien"
"0x045d87c5" = "Ihr müsst durch Handel auf @g$GoldGoal$ Bargeld kommen."
"0x04709af6" = "Missionen"
"0x0471f13a" = "Ihr habt ein Darlehen in Höhe von %1 erhalten. Die Rückzahlung beträgt %2 und wird am %3 eingezogen."
"0x04750e1c" = "Lebensqualität in Städten"
"0x0479b6bb" = "Spiel gespeichert."
"0x0480889b" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Ihr habt ein riesiges Warenversteck an der Stelle gefunden, die Euch der Schiffbrüchige beschrieben hat, und nehmt die Waren an Bord."
"0x0480889c" = "<g:INTEXT_TREIBGUT_800x600.screen><n>An der Stelle, die Euch der Schiffbrüchige beschrieben hat, findet Ihr ein riesiges Warenversteck.<n>Euer Konvoi hat leider keinen Laderaum mehr frei, so dass Ihr die Waren zunächst zurücklassen müsst."
"0x04825ba0" = "Der Konvoi kann nicht auslaufen, da er derzeit in der Werft zur Reparatur liegt. Wartet ab, bis die Reparatur abgeschlossen wurde."
"0x04b51123" = "Es tut mit leid, ich kann Euch den Auftrag nun doch nicht mehr geben. Ihr habt zu lange überlegt."
"0x04d40792" = "aktueller Produktionspreis"
"0x04ddc375" = "%1 wartet in der Kneipe auf Euch."
"0x04e000d9" = "Kapitän %1 ersetzt den bisherigen Kapitän."
"0x04e4fc22" = "Handel Stadt - Lagerhaus"
"0x04e5002a" = "In Tortuga ist ein Arbeiterstreik angezettelt worden. Alle Arbeiter haben ihre Arbeit niedergelegt (verursachen aber dennoch Kosten in Euren Betrieben).<n><n>Eure Aufgabe ist es, die Warenbestände der sonst produzierten Waren auf einem hohen Niveau zu halten, damit die Arbeiter mit ihrem Streik keinen Erfolg haben und den Arbeitskampf beenden.<n><n>Hinweis: Die in der Stadt produzierten Waren sind Weizen, Lehmziegel, Baumwolle, Zucker und Tabak.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Vorräte der in der Stadt produzierbaren Waren müssen bis zum @D$EndDate$ pro Ware @a$Amount$ betragen."
"0x04f319ed" = "Begebt Euch in den nächsten 30 Tagen zum Markt in @T$Town$, um Eure Belohnung abzuholen."
