"0xec45c63b" = "Jeder hat 5 Karten erhalten. Ich melde 1 Punkt an.<n><n>Wenn Ihr das Spiel machen wollt, müsst Ihr einen Punkt mehr anmelden."
"0xec656430" = "Nun könnt Ihr Euer Ansehen in %1 steigern, indem Ihr spanische Schiffe und Städte angreift. Euer Ansehen bei den anderen Nationen sinkt dabei nicht."
"0xec7fd9a8" = "Pirat greift Handelskonvoi an"
"0xec815821" = "Zurück zum Spiel"
"0xec86613a" = "Liefert bis zum @D$EndDate$ @a$Amount$ @G$Goods$ an den Marktplatz von @T$TOWN$. Dort erhaltet Ihr @g$Price$ pro Fass."
"0xecb4ae47" = "Funktion"
"0xece9a5c9" = "Ihr habt nicht die gesamte Ladung übernommen, obwohl Euer Konvoi noch Ladung aufnehmen kann.<n>Wollt Ihr den Transfer wirklich beenden?"
"0xed03acee" = "Finanzielle Hilfe"
"0xed2a047f" = "%1<n>Geentert"
"0xed34fe04" = "Militärkonvoi"
"0xed5e6448" = "Danke, dass Ihr den Piratenkonvoi vernichtet habt. Hier ist Eure Belohnung von @g$GoldReward$.<n>Übrigens: Immer, wenn Ihr einen Auftrag für mich erfüllt, steigt automatisch Euer Ansehen bei meiner Nation.<n>Habt Ihr hingegen ein niedriges Ansehen bei meiner Nation, kann ich Euch keinen Auftrag erteilen."
"0xed5e6449" = "Ich danke Euch, dass Ihr den Piratenkonvoi vernichtet habt. Ich gebe Euch @g$GoldReward$ als Belohnung. Mit etwas Glück finden wir bald heraus, von welchem Versteck die Piraten operieren. Dann können wir das Versteck vernichten."
"0xed6ee3f7" = "%1 steigt auf"
"0xed88c9e3" = "%1,<n><n>Der Kredit in Höhe von %2 wurde am %3 fällig. Der Betrag wurde heute eingezogen.<n><n>Der Schatzmeister zu %4"
"0xeda0288d" = "Dialog schließen/Optionen"
"0xeda49c74" = "Konzessionen"
"0xedad5b61" = "Ihr habt es nicht geschafft, die Zahl der Bürger in Tortuga innerhalb von 20 Tagen nach Ende der Seuche auf @I$Pop$ zu bringen.<n><n>Sobald eine Stadt den Status „Aufschwung“ oder besser erreicht hat, kann sie neue Arbeiter aufnehmen. Neue Arbeiter könnt Ihr in Form von Siedlerfamilien anliefern. Diese werden aus Europa zu den Gouverneursstädten gebracht und warten dort auf Mitfahrgelegenheiten. Auch in Städten mit niedrigem Status warten Siedler auf Abholung."
"0xedc30aca" = "<ts:75><ts:150><ts:225><ts:300>Durch eine Rattenplage sind Nahrungsmittel in Eurem Lager vernichtet worden. Rattenplagen treten vermehrt dann auf, wenn ein Händler zu viele Nahrungsmittel in seinem Lager hortet.<n><n>Verluste:"
"0xedffe567" = "Musketenschützen selektieren"
"0xee00c4df" = "<n><n>Normalerweise könnt Ihr erworbene Konzessionen wieder zurückgeben. Da %1 aber Eure Startstadt ist, ist das nicht möglich."
"0xee00c4e0" = "<n><n>Ein örtlicher Händler bietet Euch für Eure Konzession und Gebäude %1. Wollt Ihr das Angebot annehmen? Bedenkt, dass Ihr dadurch alle Gebäude in dieser Stadt verliert."
"0xee0f745a" = "<g:INTEXT_SCHATZKISTE_800x600.screen>"
"0xee286d68" = "%1,<n>ich danke Euch dafür, dass Ihr eine Stadt unserer Feinde annektiert habt. "
"0xee286d69" = "%1,<n>ich habe Euch bereits einen Auftrag erteilt. Erfüllt diesen Auftrag, denn ich habe noch mehr für Euch zu tun. "
"0xee286d6a" = "%1,<n>ich habe Euch den Auftrag gegeben, eine Stadt zu annektieren, doch Ihr habt versagt. Haltet Euch das nächste Mal an unsere Abmachungen."
"0xee28f112" = "Take2"
"0xee331379" = "Errichtet eigene Städte"
"0xee3b5f78" = "Stadtverteidigung"
"0xee4e882d" = "Okt"
"0xee7aaf49" = "Findet und vernichtet einen Konvoi des Piraten @P$PirateName$ bis zum @D$EndDate$. Die letzte bekannte Position eines seiner Konvois wurde auf Eurer Seekarte eingezeichnet. @l$Pos$"
"0xee7c03d6" = "Piratenkonvois"
"0xee7fe702" = "Beten"
"0xeea57a9b" = "Eine eigene Stadt"
"0xeea6068c" = "Hafenkanonen"
"0xeeced82e" = "@s$USER$, in Europa hat @n$Nation$ einen Engpass an @G$Goods$. Ich bin daher dabei, eine Expedition nach Europa zusammenzustellen. Ich kaufe jede Menge an @G$Goods$, die Ihr mir liefern könnt und biete Euch einen Stückpreis von @g$FullPrice$. Seid Ihr interessiert?"
"0xeeced82f" = "Ich grüße Euch. Ich bin gerade dabei, eine Expedition nach Europa zu organisieren. Ich möchte dort die knappen Vorräte an @G$Goods$ ausnutzen. Ich biete Euch an, mir beliebig viele Waren zu liefern und zahle Euch einen sehr guten Preis pro Fass, sagen wir @g$FullPrice$. Seid Ihr dabei?"
"0xeeced830" = "Seid gegrüßt, @s$USER$. Ich organisiere einen Konvoi nach Europa, da ich erfahren habe, dass ein sehr guter Preis für @G$Goods$ bezahlt wird. Ich biete jedem, der mir @G$Goods$ liefert, einen Stückpreis von @g$FullPrice$. Seid Ihr dabei?"
"0xeed24553" = "Spielgeschwindigkeit erhöhen"
"0xeee3380a" = "Der %1 Freibeuter %2 hat die Stadt von Landseite her angegriffen und Waren geplündert. Viele Truppen der Stadt wurden vernichtet und der Status der Stadt ist gesunken."
"0xeee5f0a7" = "Gebäude"
"0xef0275c8" = "Neue Stadt: %1"
"0xef04cb04" = "Reparaturkosten:"
"0xef0f916b" = "Ihr habt ein Floß mit @I$Settlers$ schiffsbrüchigen Siedlern entdeckt. Leider ist an Bord Eures Konvois nicht genug Platz. Kommt mit einem anderen Konvoi wieder."
"0xef152fb7" = "%1,<n>nun lerne ich Euch auch einmal kennen. Ihr steht bei meiner Nation hoch im Kurs, daher wollte ich Euch immer schon gerne persönlich treffen."
"0xef635ad0" = "Gut. In @T$TargetTown$ wartet am Markt eine Kontaktperson auf Euch. Liefert ihr bis zum @D$EndDate$ so viel @G$Goods$, wie Ihr beschaffen könnt. Anschließend erhaltet Ihr @g$Price$ pro geliefertem Fass."
