"0x20b2119a" = "Zurückgeben"
"0x20ccd2d7" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen>"
"0x20d2607a" = "Gute Arbeit! Tortuga hat den Status „Aufschwung“ erreicht. Ihr habt hierzu @I$Days$ Tage benötigt."
"0x20de74a6" = "Schiffsjagd"
"0x20e2a2f4" = "Aktiv seit 1 Tag. Gemittelter Tagesgewinn %1."
