"0xe1cdc367" = "Ihr habt nun einige Grundzüge der Steuerung erfahren und wisst, wie man einen Konvoi von einer Stadt in die nächste schickt. Dies ist sehr wichtig, denn Ihr werdet zu Anfang Euer Geld damit verdienen, Waren zwischen den Städten zu transportieren und zu handeln.<n><n>Im zweiten Teil dieses Szenarios sollt Ihr ein Schiff kaufen und Eurem bestehenden Konvoi hinzufügen.<n><n>Noch ein Tipp:<n><n>Ihr könnt im Spiel jederzeit F1 drücken, um eine Hilfeseite über Tastatur- und Mausbelegung anzeigen zu lassen.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Euer Konvoi mit zwei Schiffen muss den Hafen der Stadt Cartagena erreichen."
