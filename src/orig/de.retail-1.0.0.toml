"0xea7ede96" = "Findet das Versteck des Piraten Blackbeard. @l$IslandPos$"
"0xea8b5027" = "Ihr habt meiner Nation großen Schaden zugefügt, doch seid Ihr zugleich der einzige, der das Schicksal wenden kann. Ich biete Euch für %1 die Freundschaft an. Was sagt Ihr?"
"0xea92b930" = "Ich bin %1. Seid Ihr an einem besonderen Geschäft interessiert? Wenn Ihr mir einen Konvoi übergebt, beteilige ich Euch an meinen Raubzügen mit %2. Ihr könnt mir auch mitteilen, in welchen Gewässern ich aktiv sein soll. Ihr könnt mir einen beliebigen Konvoi mit bis zu 5 Schiffen übergeben."
