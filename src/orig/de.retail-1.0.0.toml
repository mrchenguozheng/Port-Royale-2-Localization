"0xe6490f96" = "Wir befinden uns in der holländischen Gouverneursstadt Turk Islands im Jahre 1676. Holland ist im Besitz von 7 Städten, darunter 5 Kolonialstädte und je eine Gouverneurs- und Vizekönigstadt.<n><n>England ist im Besitz von 14 Städten und befindet sich schon seit langem in einem Krieg mit Holland, der noch viele Monate andauern wird. Solange der Krieg dauert, müsst Ihr der englischen Krone mehrere Städte abjagen und für Holland annektieren.<n><n>Doch bevor Ihr die englischen Städte angreifen könnt, benötigt Ihr mehr Kapital und einen besser bewaffneten Konvoi. Euer erstes Ziel ist daher, drei englische Handelskonvois zu besiegen und deren Schiffe zu kapern.<n><n>Doch zunächst müsst Ihr einen Kaperbrief beim holländischen Gouverneur in Turk Islands erwerben.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Besucht den Gouverneur von Turk Islands und besorgt Euch einen Kaperbrief gegen England."
"0xe64f1385" = "Sehr gut, Ihr habt einen Konvoi des Piraten Blackbeard vernichtet. Geht nun zum Gouverneur von @T$TOWN$ und holt Euch Eure Belohnung ab.<n><n>Er hat außerdem eine weitere Mission für Euch. Auch diese müsst Ihr erfüllen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erledigt eine weitere Mission für den Gouverneur von @T$TOWN$."
"0xe65025c3" = "in 1 Stadt"
"0xe6510ae7" = "Die Vorräte der Stadt Tortuga an den Waren Weizen, Lehmziegel, Baumwolle, Zucker und Tabak müssen bis zum @D$EndDate$ pro Ware @a$Amount$ betragen."
"0xe65524e7" = "Sorgt dafür, dass in Eurer Stadt von jeder Ware @a$Amount$ vorrätig sind."
"0xe674b971" = "Schatzkarte"
"0xe67d58b9" = "Goldfund"
"0xe6851da5" = "Ihr habt bereits im letzten Szenario erfahren, dass Euer Rang mit Eurem Gesamtvermögen zusammenhängt. Euer Gesamtvermögen setzt sich aus Eurem Bargeld sowie Euren Gebäuden, Schiffen und Waren zusammen. Ihr könnt es Euch jederzeit im Logbuch unter Erfolge anzeigen lassen.<n><n>Über der Konvoianzeige unten wird außerdem stets der blaue Aufstiegsbalken angezeigt. Erreicht er den rechten Rand, so steigt Ihr in den nächsten Rang auf. Habt Ihr einmal einen Rang erreicht, könnt Ihr ihn nicht mehr verlieren.<n><n>Je höher Euer Rang ist, desto mehr Konvois dürft Ihr führen und in desto mehr Städten dürft Ihr eine Baukonzession erwerben. Ab einem bestimmten Rang sind Konvois und Konzessionen sogar unbegrenzt."
"0xe6d65f53" = "Einwohner"
"0xe6d9252d" = "%1, Ihr seid also der %2, von dem mein Vater mir soviel erzählt hat. Ich bin %3. Wollt Ihr Euch nicht zu mir setzen und mir von Euren Abenteuern berichten?"
"0xe6d9252e" = "Ich glaube, ich habe schon von Euch gehört, %1. Ich bin %3, die Tochter des Gouverneurs. Ich wollte schon immer mal einen %2 kennen lernen. Bitte, Ihr müsst mir unbedingt von Euren Abenteuern erzählen."
"0xe6d9252f" = "So, Ihr seid also der bekannte %1! Eigentlich hatte ich mir Euch größer vorgestellt, bei all den Geschichten, die ich über Euch gehört habe. Doch das macht Euch nicht weniger interessant. Kommt her, und erzählt mir von Euren Abenteuern. So viel habe ich meinen Vater, den Gouverneur, schon von Euch reden hören."
"0xe6d92530" = "%1,<n>ich freue mich sehr, Euch wieder zu sehen. Erzählt mir, wie es Euch seit unserem letzten Treffen ergangen ist. Habt Ihr mir auch etwas mitgebracht?"
"0xe6d92531" = "%1,<n>wie schön, Euch wieder zu sehen. Ich muss seit unserem letzten Treffen dauernd an Euch denken. Kommt schnell herein, denn ich habe Euch viel zu erzählen."
"0xe6d92532" = "%1,<n>welch Freude, das Ihr mich wieder besuchen kommt. Ich habe allen meinen Freundinnen von Euren Abenteuern berichtet. Doch nun müsst Ihr mir mehr erzählen, denn sie sind sehr wissbegierig. Kommt schnell herein."
