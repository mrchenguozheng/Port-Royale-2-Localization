"0xf4e195bf" = "Blackbeard hat herausgefunden, dass Ihr mit dem Gouverneur von @T$TOWN$ gemeinsame Sache macht. Daher hat er damit begonnen, gezielt die Händler einzuschüchtern, die @T$TOWN$ auf ihrer Route haben. In wenigen Tagen werden kaum noch Händler @T$TOWN$ anfahren.<n><n>Die Einschüchterung ist nur von begrenzter Dauer. Eure Aufgabe ist es, die Stadt bis zum @D$EndDate$ mit Waren zu versorgen. Der Status der Stadt darf nicht unter „Blütezeit“ fallen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Versorgt @T$TOWN$ bis zum @D$EndDate$. Der Status der Stadt darf nicht unter „Blütezeit“ fallen."
