"0x0f52782d" = "Glückwunsch! Nun könnt Ihr in Cartagena Baumwolle zu Kleidung verarbeiten.<n><n>Ihr könnt Euch denken, dass die Produktionskosten von Kleidung sehr stark davon abhängen, wie viel Ihr für die Baumwolle bezahlt habt. Daher bietet es sich an, Fertigwaren nur dann zu produzieren, wenn Ihr den Einkauf von günstigen Rohstoffen sicherstellen könnt. Alternativ könnt Ihr natürlich auch die Rohstoffe selbst produzieren.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Errichtet einen Baumwollbetrieb in Santa Marta und erhöht Euer Bargeld durch Handel auf @g$GoldGoal$."
"0x0f5d7735" = "Weit östlich von Charleston liegen die Bermudainseln. Macht bloß einen großen Bogen um sie! Vor zwei Monaten segelte mein Schwager dorthin, um sie zu erkunden, doch er kam nie wieder zurück. Kein Mensch weiß genau, was dort vorgeht, doch eines ist sicher: Das Grauen wartet dort auf jeden, der sich zu nah an die Inseln heranwagt!"
"0x0f5d7736" = "Habt Ihr schon von dem letzten Vorfall bei den Bermudainseln gehört? Ein Händler wollte über die Route vorbei an den Inseln nach Europa segeln, doch er kam nie dort an. Sein Bruder machte sich auf die Suche nach ihm, doch das einzige, was er fand, waren ein paar Schiffstrümmer südlich der Inseln."
"0x0f5d7737" = "Erst kürzlich habe ich von einem Seemann aus Port Royale erfahren, dass sie vor nicht langer Zeit sehr nah an den Bermudainseln vorbeifuhren. Ja fast zu nah. Denn er sah mit eigenen Augen, wie sich ein riesiges Ungetüm im Wasser bewegte. Es spie Feuer, und Rauch kam aus den langen Ohren. Oh wehe dem, der sich zu nah an dieses Seeungeheuer heranwagt!"
