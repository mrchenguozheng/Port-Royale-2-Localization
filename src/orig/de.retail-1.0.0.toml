"0x0161ec81" = "Ihr seid doch @s$USER$? Hättet Ihr nicht Interesse an einer Schatzkarte? Ich habe nur einen kleinen Teil, doch mit etwas Glück findet Ihr auch noch die übrigen Stücke!<n>Ich gebe Euch das Stück für @g$Price$."
"0x0161ec82" = "@s$USER$, Ihr habt doch bestimmt Interesse an einer neuen Schatzkarte, oder? Ich kann Euch zwar nur einen kleinen Teil geben, doch findet Ihr bestimmt auch noch ein paar weitere Stücke, so viel wie Ihr herumkommt.<n>Ich möchte nur @g$Price$ für das Kartenstück."
