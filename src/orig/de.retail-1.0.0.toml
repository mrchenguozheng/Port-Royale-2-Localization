"0xeaef8c4f" = "Tochter des Gouverneurs"
"0xeb151beb" = "Bekannte Piraten"
"0xeb1ce06d" = "Der Konvoi entdeckt Eure Gemahlin treibend auf einem Floss. Sie bedankt sich für das Abenteuer und möchte so schnell wie möglich wieder nach Hause zu ihren Puderdosen."
"0xeb1ce06e" = "Der Konvoi entdeckt Eure Gemahlin treibend auf einem Floss. Sie sagt, die Piraten hätten sie ausgesetzt, da es nur eine Sache zwischen ihnen und Euch sei."
"0xeb1ce06f" = "Endlich findet der Konvoi Eure Gemahlin, die auf dem Wasser treibt. Sie ist ohnmächtig, kommt jedoch nach einer Weile zu sich:<n>„Ich bin von diesem Blödmann entführt worden! Er dachte tatsächlich, ich wolle mit ihm durchbrennen, nur weil ich ihn ein paar mal höflich angelächelt habe.“"
"0xeb288ee4" = "Zuwenig Laderaum"
"0xeb2aee46" = "Ihr könnt den Transfer nicht beenden, da Euer Konvoi überladen ist. Entfernt Ladung aus Eurem Konvoi oder nehmt weitere Schiffe auf."
