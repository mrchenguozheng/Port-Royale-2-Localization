"0x1993c83f" = "Eure Gemahlin ist verschwunden. Sprecht mit dem Gouverneur!"
"0x19b399ce" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Dialog schließen/<n><t>Optionsmenü<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>Schnellvorlauf<n><f:fonts/Tiepolo_black14x14aaFHk.res>Shift<f:fonts/Tiepolo_bold14x14aaFH.res><t>Konvoi zentrieren<n><f:fonts/Tiepolo_black14x14aaFHk.res>Caps-Lock<f:fonts/Tiepolo_bold14x14aaFH.res><t>Zentrieren ein/aus<n><f:fonts/Tiepolo_black14x14aaFHk.res>Pfeiltasten<f:fonts/Tiepolo_bold14x14aaFH.res><t>Bildausschnitt<n><t>verschieben<n><f:fonts/Tiepolo_black14x14aaFHk.res>STRG + 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Konvoi speichern<n><f:fonts/Tiepolo_black14x14aaFHk.res> 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Konvoi abrufen<n><f:fonts/Tiepolo_black14x14aaFHk.res> TAB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Nächster Konvoi<n><f:fonts/Tiepolo_black14x14aaFHk.res>+ / -<f:fonts/Tiepolo_bold14x14aaFH.res><t>Spielgeschwindigkeit<n><f:fonts/Tiepolo_black14x14aaFHk.res>F5 <f:fonts/Tiepolo_bold14x14aaFH.res><t>Schnellspeichern<n><t> (nicht in Kämpfen)"
"0x19c31f0b" = "Neuer Rang: %1"
"0x19c34763" = "Handelsroute Laden"
