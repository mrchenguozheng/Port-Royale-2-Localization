"0x2a588ae0" = "Ihr habt den %1 Freibeuter %2 im Zweikampf besiegt und ihn als Geisel genommen. Bei einem Gouverneur seiner Nation könnt Ihr Lösegeld für ihn verlangen."
"0x2a688737" = "Landschlacht"
"0x2a78ce83" = "%1 (%2)"
"0x2a7f7e17" = "So sei es. Ich erteile Euch hiermit den Auftrag, Handelskonvois der Nation @n$TargetNation$ anzugreifen und @I$NumShips$ Schiffe zu kapern oder zu versenken. Ihr habt daher nur Zeit bis zum @D$EndDate$."
"0x2a7f7e18" = "Das freut mich. Viel Zeit kann ich Euch leider nicht geben, Ihr müsst meinen Auftrag bis zu @D$EndDate$ erledigen. Greift Handelskonvois der Nation @n$TargetNation$ an und versenkt oder kapert @I$NumShips$ Schiffe."
"0x2a8476a8" = "Produktion in Stadt"
"0x2a8b96d0" = "Eure Truppen durchbrechen das Stadttor und stürmen in die Stadt. Bei diesem Anblick kapitulieren die Soldaten der Stadt und Eure Leute machen sich ungehindert auf die Suche nach der Schatzkammer. Sie erbeuten %1. "
"0x2a9a8ab5" = "Letzte Seeschlacht vor 1 Tag"
"0x2aa014d9" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
