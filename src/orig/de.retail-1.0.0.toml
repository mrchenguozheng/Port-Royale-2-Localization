"0xc58b0f43" = "Da seid Ihr ja wieder, und wie ich sehe, wart Ihr erfolgreich.<n><n>So halte ich mich auch an meinen Teil der Abmachung. Ihr findet den Meister @N$TeacherName$ in seinem Versteck.<n><n> @l$TeacherPos$<n><n>Sucht die dortige Küste ab, dann werdet Ihr ihn finden.<n><n>Nehmt @a$Amount$ Wein als Bezahlung für ihn mit. "
"0xc58b0f44" = "Danke, dass Ihr mir den Gefallen getan habt.<n><n>Nun zu unserer Abmachung. Der alte Kapitän heißt @N$TeacherName$ und hat sich gut versteckt zur Ruhe gesetzt.<n><n>@l$TeacherPos$<n><n>Sucht die dortige Küste ab, dann werdet Ihr ihn finden.<n><n>Nehmt @a$Amount$ Rum mit, sonst hilft er Euch nicht weiter."
"0xc58b0f45" = "Ihr habt die Aufgabe erfüllt, dafür bin ich Euch sehr dankbar.<n><n>Ihr findet den Lehrer @N$TeacherName$ an einer Küste.<n><n> @l$TeacherPos$<n><n>Sucht die Gegend dort ab und nehmt @a$Amount$ Nahrungsmittel mit, damit er auch bereit ist, Euch zu helfen. "
