"0x0076d777" = "@A$USER$ ich grüße Euch. Ich biete Euch @a$Amount$ @G$Goods$ zum Stückpreis von @g$Price$. Seid Ihr interessiert?"
"0x0076d778" = "Hallo @A$USER$. Ich sitze hier auf @a$Amount$ @G$Goods$. Ich würde sie gerne loswerden, zum Stückpreis von @g$Price$. Schlagt Ihr ein?"
"0x0076d779" = "Habt Ihr vielleicht Interesse an @a$Amount$ @G$Goods$? Ich würde sie günstig zum Stückpreis von @g$Price$ angeben, allerdings nur alle Waren zusammen. Wollt Ihr sie kaufen?"
"0x00776793" = "Eintrag löschen"
"0x007c2733" = "Dann gebe ich Euch den Auftrag, @T$TargetTown$ bis zum @D$EndDate$ zu wirtschaftlicher Blüte zu führen. Bringt der Stadt benötigte Waren und holt überschüssige Waren ab, damit die ansässigen Händler wieder richtig produzieren. "
