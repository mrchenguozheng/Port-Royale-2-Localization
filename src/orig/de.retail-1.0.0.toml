"0xef77d11d" = "Der %1 Freibeuter %2 hat die Hafenverteidigung der Stadt zerstört und Waren geplündert. Der Status der Stadt ist ebenfalls gesunken."
"0xef795016" = "Die Stadt erholt sich von einem Angriff."
"0xef88a0d4" = "Oh, was sehe ich. Soeben erhalte ich eine Nachricht von meinem Kurier. Der Auftrag, den ich Euch gerade erteilen wollte, ist gar nicht mehr aktuell. Ich hatte den Auftrag wahrscheinlich schon zu lange auf meinem Schreibtisch liegen."
"0xef95e919" = "Schiffbrüchiger aufgenommen"
"0xef95e91a" = "Schiffbrüchige aufgenommen"
"0xef9ba866" = "Robert Andreas Drude"
"0xefbbbbe9" = "Nun ist es an der Zeit, das Versteck des Piraten Blackbeard zu finden, damit seinem Treiben ein Ende gemacht werden kann. Wenn ein Pirat lange genug aktiv ist, wird sein Versteck früher oder später entdeckt. Doch könnt Ihr auch nachhelfen: Von Zeit zu Zeit begibt sich ein Piratenkonvoi zurück in sein Versteck, um Beute abzuliefern und den Konvoi auf Vordermann zu bringen.<n>Wenn Ihr auf der Seekarte einen solchen Piratenkonvoi verfolgt und seht, wie er in sein Versteck verschwindet, so besteht eine gewisse Wahrscheinlichkeit, dass das Versteck aufgedeckt wird. Habt Ihr das Versteck erst einmal entdeckt, könnt Ihr es wie eine Stadt von Seeseite aus angreifen, um es zu vernichten.<n><n>Ein Tipp:<n> @l$IslandPos$ Wartet, bis sich ein Konvoi nähert und beobachtet, wie er in seinem Versteck verschwindet.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Findet das Versteck des Piraten Blackbeard."
"0xefc2e122" = "Habt Ihr mein Schiff noch nicht wieder? Bitte stellt es im Hafen ab, sobald Ihr es gefunden habt, und kommt dann wieder zu mir."
