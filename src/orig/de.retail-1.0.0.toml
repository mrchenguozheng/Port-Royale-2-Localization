"0x123fde40" = "Hervorragend! Ihr habt @I$Days$ Tage benötigt, um die Anzahl der Bürger in Tortuga wiederherzustellen."
"0x1253b328" = "Ich grüße Euch, @s$USER$. Ich habe einen Hinweis für Euch. Sammelt mehr solcher Hinweise, so könnt Ihr einen Schatz finden."
"0x1253b329" = "Ich grüße Euch, @s$USER$. Wollt Ihr Euch auf die Suche nach einem Schatz machen? So hört Euch den ersten Hinweis an."
"0x1253b32a" = "Wollt Ihr Euch auf Schatzsuche begeben, @A$USER$? So kann ich Euch einen ersten Hinweis geben."
"0x125721f5" = "%1,<n>wählt den Konvoi aus, der gesegnet werden soll. Durch die Segnung erhalten alle Matrosen die bestmögliche Moral."
