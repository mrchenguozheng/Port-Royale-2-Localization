"0xdf10406e" = "Sehr schön, Eure Stadt hat nun bereits eine gewisse Größe erreicht.<n><n>Sobald eure Stadt über 1000 Einwohner hat, wird sie für Händler anderer Städte interessant und kann angefahren werden.<n><n>Grundsätzlich wird eine Stadt immer dann angefahren, wenn in der Stadt ein gewisser Bedarf herrscht, also nicht alle Waren vorhanden sind.<n><n>Zum Thema Handel und Produktion in Eurer eigenen Stadt habt Ihr gerade einen Brief bekommen, den Ihr im Logbuch lesen könnt.<n><n>Euer nächstes Ziel ist, die Einwohnerzahl in Eurer Stadt auf 1000 zu erhöhen.<n><n>Übrigens: Damit eine Stadt mehr als 500 Einwohner haben kann, wird eine Kneipe benötigt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erhöht die Einwohnerzahl in Eurer Stadt auf 1000."
