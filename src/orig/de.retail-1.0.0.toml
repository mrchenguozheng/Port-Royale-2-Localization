"0xf214f69c" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt einen Schiffbrüchigen aus @n$DestNation$ gerettet. @N$Name$ bietet Euch eine hohe Belohnung, wenn Ihr ihn in der nächsten Stadt seiner Nation absetzt."
"0xf214f69d" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt den Händler @N$Name$ aus @T$DestTown$ gerettet. Er verspricht Euch eine hohe Belohung, wenn Ihr ihn zu seiner Heimatstadt bringt."
"0xf214f69e" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt den sehr erfahrenen Kapitän @N$Name$ gerettet. Er bittet Euch, ihn in einer Stadt der Nation @n$DestNation$ abzusetzen."
"0xf214f69f" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt @I$Sailors$ schiffbrüchige Matrosen aufgesammelt, die scheinbar mit einigen Besatzungsmitgliedern befreundet sind. Die Willkommensfeier hebt die Moral der Mannschaft."
"0xf214f6a0" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt einen Matrosen aus @n$Nation$ aufgenommen. Als Dank für seine Rettung verrät er Euch, wo sich viele Fässer Treibgut befinden. @l$DebrisPos$"
"0xf214f6a1" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt einen Geistlichen aus @n$DestNation$ gerettet. Er kann Euch nicht bezahlen, damit Ihr Ihn in einer Stadt seiner Nation absetzt, doch er verspricht Euch, sich für eine Anhebung Eures Ansehens in @n$DestNation$ einzusetzen."
"0xf22583c4" = "Wollt Ihr für %1 einen Kaperbrief kaufen und im Namen der holländischen Nation die Schiffe unserer Feinde jagen?"
"0xf22a4fad" = "In %1 gibt es eine Rattenplage. Einen Monat lang ist der Verbrauch an Weizen, Früchte, Mais, Fleisch doppelt so hoch. "
"0xf22b236f" = "Ihr habt die Waren nicht rechtzeitig abgeliefert."
"0xf22d73b9" = "Zur Produktion von Kolonialwaren werden Werkzeuge benötigt. Auf ähnliche Weise werden für die Produktion von Fertigwaren die Rohstoffwaren benötigt. Fertigwaren sind beispielsweise Seile und Kleidung. Rohstoffe hierzu sind Hanf und Baumwolle.<n><n>Nun, da Ihr wisst, wie man Produktionen errichtet, sollt Ihr in einer Gouverneursstadt eine Konzession erwerben und dort Fertigwarenbetriebe errichten. Bevor Ihr allerdings eine Konzession kaufen könnt, müsst Ihr gewisse Handelserfolge mit der Stadt vorweisen können, d.h. Ihr müsst der Stadt Waren verkaufen, die sie benötigt.<n><n>Doch Vorsicht! Wenn Ihr in einer Stadt Waren einkauft, die knapp sind, so sinkt Euer Handelserfolg wieder! Im Handelsfenster werden Waren, die in einer Stadt knapp sind, rot eingefärbt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erhöht Euren Handelserfolg in der Stadt Cartagena, um eine Baukonzession zu erwerben."
"0xf24b293b" = "Laden/Speichern"
"0xf253afcd" = "Ihr könnt erst dann eine Handelsroute einrichten, wenn der Kapitän des Konvois über %1 Erfahrungspunkte verfügt. Derzeit verfügt er über %2 Punkte."
"0xf2590753" = "Ich danke Euch. Wie es aussieht werden wir in der nächsten Zeit keine Importwaren aus Europa bekommen. Da wir gerade im Krieg mit @n$HostileNation$ sind, bietet es sich an, die Waren von den Transportkonvois unserer Feinde zu plündern, ohne deren Schiffe zu kapern oder zu versenken.<n>Bitte beschafft mir je @a$Amount$ der Waren Gewürze, Wein und Werkzeug und liefert sie bis zum @D$EndDate$ meinem Händler am Markt."
"0xf2590754" = "Eure Aufgabe ist es, Transportkonvois der Nation @n$HostileNation$ anzugreifen und zu plündern, ohne deren Schiffe zu kapern oder zu versenken. Anschließend liefert Ihr die Waren am Marktplatz ab. Ihr habt Zeit bis zum @D$EndDate$."
"0xf2590755" = "So sei es. Macht Euch auf die Suche nach Transportkonvois der Nation @n$HostileNation$ und plündert je @a$Amount$ der geladenen Importwaren. Anschließend wartet ein Händler am Marktplatz auf Euch, dem Ihr die Waren bis zum @D$EndDate$ übergeben sollt. Noch ein Hinweis: Aufgrund der derzeit sehr angespannten Lage dürft Ihr die Schiffe nur plündern, nicht kapern oder versenken!"
"0xf2593b17" = "Ich gewinne die %1."
"0xf2682c84" = "scenario001 - @I$Idx$"
"0xf285925a" = "Lieber %1,<n>vielleicht kann ich Euch mit einem Kredit aushelfen, damit Ihr uns helft, diese Stadt aufzubauen. Welcher Betrag interessiert Euch?"
"0xf2a41570" = "Pirat greift Händler an"
