"0x3353aa4c" = "Hervorragend! Nun sollt Ihr noch weitere englische Städte für Holland annektieren. Allerdings müsst Ihr Euch beeilen, denn Ihr könnt die Städte nur annektieren, solange Krieg zwischen Holland und England herrscht.<n><n>Annektierungsmissionen erhaltet Ihr wie immer beim Vizekönig in Grand Bahama. Eventuell müsst Ihr zuvor beim Stärkeverhältnis der Nationen etwas nachhelfen, bevor Ihr weitere Annektierungsmissionen bekommt. Wie Ihr dies bewerkstelligen könnt, wisst Ihr ja bereits.<n><n>Zur Unterstützung hat Euch der Gouverneur von Turk Islands 3 weitere Karacken geschenkt.<n><n>Außerdem stehen im Hafen viele Matrosen und Waffen zur Verfügung.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erfüllt zwei weitere Annektierungsmissionen für den holländischen Vizekönig, bevor der Krieg zwischen Holland und England endet. Ihr habt Zeit bis zum @D$EndDate$. Danach endet das Szenario."
