"0x077030da" = "Herzlichen Glückwunsch! Ihr habt das Szenario erfolgreich beendet und habt nun etwas Übung in Seeschlachten und Hafenangriffen.<n><n>Bevor Ihr einen anderen Konvoi angreift, solltet Ihr immer über gut bewaffnete Geleitschiffe verfügen. Außerdem solltet Ihr Euch natürlich genau überlegen, welche Konvois Ihr angreift. Transportkonvois aus Europa und Militärkonvois sind immer sehr stark, Piraten können mitunter auch stark werden.<n><n>Greift Ihr Händler an, ohne vorher einen entsprechenden Kaperbrief beim Gouverneur einer Nation erworben zu haben, hat dies große Auswirkungen auf Euer Ansehen bei allen Nationen. Im schlimmsten Falle machen starke Militärkonvois Jagd auf Eure Konvois.<n><n>Übrigens: Wenn Ihr einen Händlerkonvoi besiegt, ohne dessen Schiffe zu versenken und Ihr die Schiffe nur plündert, ist Euer Ansehensverlust weitaus geringer. "
