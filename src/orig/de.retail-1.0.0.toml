"0xd0b31590" = "Ewas mehr als eine Tagesreise westlich von Cartagena gibt es eine kleine Insel namens Providence. Dort wurde der Konvoi des Piraten @P$PirateName$ zuletzt gesehen. Sucht dort etwa eine Tagesreise nordöstlich nach dem Konvoi des Piraten @P$PirateName$.<n>Vernichtet ihn und kehrt anschließend zu mir zurück, um mir Bericht zu erstatten."
