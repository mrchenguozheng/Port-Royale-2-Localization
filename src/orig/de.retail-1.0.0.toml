"0xf4b68a6b" = "Herzlichen Glückwunsch! Ihr habt das Szenario erfolgreich absolviert und für Holland mehrere englische Städte annektiert.<n><n>Im freien Spiel könnt Ihr in der gleichen Art Städte annektieren. Ihr müsst nur darauf achten, dass die Nation, deren Städte Ihr annektieren wollt, militärisch schwach ist. Außerdem muss die Nation, für die Ihr annektieren wollt, militärisch stark sein und es muss Krieg herrschen zwischen den Nationen.<n><n>Übrigens: Normalerweise erhaltet Ihr Landgeschenke zum Aufbau eigener Städte, wenn Ihr für einen Vizekönig Annektierungen durchführt. In diesem Szenario waren die Landgeschenke jedoch deaktiviert."
