"0x1269b779" = "@s$USER$ ich habe hier einen Hinweis zu einem Schatzversteck für Euch. Wollt Ihr ihn erfahren?"
"0x1269b77a" = "@F$FName$ @L$LName$, setzt Euch zu mir und trinkt einen kleinen Schluck mit mir. Dann verrate ich Euch auch was zu einem versteckten Schatz."
"0x1269b77b" = "Ihr seid doch @s$USER$, oder? Dann seid Ihr doch auch auf der Suche nach weiteren Hinweisen zu einem versteckten Schatz. Ich kann Euch helfen, wenn Ihr wollt."
"0x1269b77c" = "Ich grüße Euch, @A$USER$. Ich kann Euch verraten, wie Ihr das findet, wonach Ihr sucht. Hört Euch meinen Hinweis zu dem Schatzversteck an."
