"0x0ce1a79e" = "Ihr befindet Euch in der Kolonialstadt Santa Marta. Klickt einmal auf den Stadtnamen, um die Stadtinfo anzeigen zu lassen."
"0x0ce1a79f" = "Kolonialstädte wie Santa Marta können 2 Grundwaren, 2 Rohstoffe und eine Kolonialware produzieren.<n>Im letzten Szenario habt Ihr bereits erfahren, dass Rohstoffe und Kolonialwaren vor allem in Gouverneursstädten benötigt werden.<n>Wir wollen als erstes die Kolonialware Kakao produzieren.<n>Schließt nun die Stadtinfo wieder."
"0x0ce1a7a0" = "Da Kolonialwaren von Gouverneursstädten aus nach Europa verschifft werden, haben diese Städte einen hohen Bedarf an Kakao. Für Euren ersten Betrieb ist das eine gute Voraussetzung. Sucht nun im Stadtzentrum nach dem Gebäude des Baumeisters und klickt es an."
"0x0ce1a7a1" = "Beim Baumeister könnt Ihr ein neues Gebäude in Auftrag geben oder Eure Baukonzession zurückgeben. Dies solltet Ihr natürlich jetzt nicht tun.<n>Schaut Euch mal die verschiedenen Gebäude an, die Ihr bauen könnt. Verwendet dazu auch die Buttons rechts vom Baumeisterdialog.<n>Klickt dann auf den Button „Kakaoplantage“."
"0x0ce1a7a2" = "Nun wird angezeigt, wie viele Bauwaren benötigt werden und wie hoch die Baukosten sind.<n>Außerdem wird angezeigt, wie viele Bauwaren Ihr gerade in Eurem Lager habt und wie viele Ihr von der Stadt dazukaufen müsst.<n>Im Moment habt Ihr genug Waren.<n>Bewegt nun den Mauszeiger auf einen freien Bauplatz und klickt mit der linken Maustaste."
"0x0ce1a7a3" = "Nun wird ein Baugerüst des Kakaobetriebs angezeigt und der Bau beginnt.<n>Es wird ein paar Tage dauern, bis der Betrieb fertig ist. In der Zwischenzeit solltet Ihr für eine Unterkunft für die neuen Arbeiter sorgen.<n>Schließt das Baumenü und sucht einmal in Santa Marta nach einem Wohngebiet und klickt es an."
"0x0ce1a7a4" = "Dieses Wohngebiet gehört einem Händler der Stadt. Ihr könnt ablesen, wie viele Wohngebiete die ansässigen Händler besitzen und wie viele Mieter den Wohnraum nutzen. Wir wollen nun auch ein Wohngebiet errichten. Öffnet dazu wieder das Baumenü."
"0x0ce1a7a5" = "Nun wählt im Baumenü ein Wohngebäude an und betrachtet die Baukostenanzeige.<n>Vielleicht habt Ihr nicht mehr genug Bauwaren auf Lager. Sind aber in der Stadt genug vorhanden, könnt Ihr die fehlenden Waren dazukaufen. <n>Ansonsten müsstet Ihr die Baustoffe aus einer anderen Stadt besorgen.<n>Errichtet nun ein Wohngebiet."
"0x0ce1a7a6" = "Ein Betrieb kann 30 Arbeiter aufnehmen. Da ein Arbeiter im Mittel noch 3 Familienangehörige hat, wird für jeden Betrieb Wohnraum für 120 Leute benötigt.<n>Ein Wohngebiet bietet Platz für 120 Mieter, pro Betrieb wird also ein Wohngebiet benötigt.<n>Nun schließt das Baumenü und klickt Euer neues Wohngebiet an."
"0x0ce1a7a7" = "Ein Wohngebiet hat keine Bauzeit, da die Mieter anfangs in Zelten wohnen.<n>Mit der Zeit bauen die Mieter das Wohngebiet selbstständig zu einem sehr ansehnlichen Gebäude aus.<n>Welches Aussehen ein Wohngebiet hat, hängt von dessen Alter und dem Status der Stadt ab.<n>Schließt nun den Wohngebiet-Dialog wieder."
"0x0ce1a80f" = "Wie Ihr wisst, muss Euer erstes Gebäude in einer Stadt stets ein Lagerhaus sein. Erst wenn Ihr dieses Gebäude gebaut habt, könnt Ihr weitere Gebäude errichten.<n>In Eurer Startstadt habt Ihr bereits ein Lagerhaus. Sucht es und klickt es an. Ihr erkennt es an der hellblauen Farbe."
"0x0ce1a810" = "Im Lagerhaus könnt Ihr sehen, welche Gebäude Ihr in der Stadt habt und welche Kosten sie verursachen.<n>Es wird aber auch angezeigt, wie viel Miete Ihr einnehmt und was Eure Betriebe produzieren.<n>Später könnt Ihr auch dem Lagerverwalter Anweisungen geben.<n>Schaut Euch mal im Lagerhaus um und schließt es dann wieder."
"0x0cee08cc" = "die Truppenstärke in dieser Stadt könnte besser sein"
"0x0cf75014" = "Schließen"
"0x0cf7abef" = "Klickt einmal Eure Kakaoplantage an. Die Anzeige bezieht sich immer auf alle Kakaoplantagen, die Ihr in der Stadt habt.<n>Ein fertig gebauter Betrieb benötigt 30 Arbeiter, also auch 30 Siedler. Nun verlasst den Betrieb, öffnet im Hafen das Handelsdock und wählt rechts den untersten Button „Fracht“."
"0x0cf7abf0" = "Hier wird angezeigt, ob in der Stadt Siedler auf Arbeit warten oder ob die Stadt Bedarf an neuen Arbeitern hat.<n>Sobald der Bau Eures Betriebes abgeschlossen ist, wird dies der Fall sein.<n>Fahrt daher in die umliegenden Gouverneursstädte und bringt Siedler nach Santa Marta, bis Euer Betrieb die volle Zahl an Arbeitern hat."
"0x0d0db040" = "Klickt einmal eine Eurer Kakaoplantagen an."
"0x0d0db041" = "Ihr seht nun, wie viel Kakao Euer Betrieb pro Tag produziert und wie viel Werkzeug pro Tag verbraucht werden.<n>Nun schafft Euch einen Vorrat von @a$SubGoal$ Werkzeug im Lager an, denn von dort entnimmt Euer Betrieb die Waren."
"0x0d0db042" = "Werkzeuge gehören zu den Importwaren. Die größten Mengen und den besten Preis erhaltet Ihr daher in Gouverneursstädten.<n>Ihr könnt es ja mal südwestlich in Cartagena oder weit östlich in Margarita versuchen."
"0x0d0db043" = "Gut gemacht.<n>Je niedriger der Durchschnittspreis für die benötigten Rohstoffe ist, desto niedriger sind auch die Produktionskosten für die produzierten Waren.<n>Nun produziert soviel Kakao bis Ihr @a$AmountGoal$ im Lager vorrätig habt."
"0x0d0f1795" = "Juli"
"0x0d0f1877" = "Juni"
"0x0d1098bd" = "%1,<n>Ihr seid neu hier, nicht wahr? Doch habe ich schon von Euch gehört, und nichts Schlechtes. Ihr solltet mir ab und zu einen Besuch abstatten, denn es gibt immer die eine oder andere Sache zu erledigen."
"0x0d23b491" = "Fahrt mit Eurem Konvoi in die Stadt Cartagena und betretet die Stadt.<n>Seht Ihr das kleine Kreissymbol rechts unter dem Stadtnamen? Es zeigt Euren bisherigen Handelserfolg in Cartagena an.<n>In diesem Szenario habt ihr es etwas einfacher, denn Ihr habt einen kleinen Bonus erhalten.<n>Öffnet nun die Stadtinfo."
"0x0d23b492" = "Unter „Handelserfolg“ könnt Ihr nun ablesen, wie viel Prozent des benötigten Handelserfolges Ihr schon erreicht habt. Steht hier 100%, so dürft Ihr beim Baumeister eine Konzession erwerben.<n>Schließt die Stadtinfo nun."
"0x0d23b493" = "Bei Waren, die in einer Stadt knapp sind, werden die Preise im Handelsfenster rot eingefärbt. Verkauft Ihr diese Waren, so steigt Euer Handelserfolg in der Stadt und Euer Ansehen bei der Nation der Stadt.<n>Klickt einmal das Handelsdock an, um Euch über den Warenbestand der Stadt zu informieren."
"0x0d23b494" = "Merkt Euch nun, welche Waren der Stadt fehlen. Beispielsweise kann die Stadt immer Zucker und Baumwolle gebrauchen, da in der Stadt Rum und Kleidung hergestellt wird.<n>Aber auch andere Waren sind knapp in der Stadt.<n>Kauft nun in anderen Städten die Waren ein, die Cartagena benötigt und erhöht Euren Handelserfolg."
"0x0d23b495" = "Nicht schlecht, Ihr habt Eure Bekanntheit in Cartagena schon merklich gesteigert.<n>Achtet darauf, dass Ihr in Cartagena keine knappen Waren aufkauft! Knappe Waren könnt Ihr leicht erkennen, denn bei Ihnen ist der Bestand rot gefärbt.<n>Erhöht nun Euren Handelserfolg auf 85%."
"0x0d23b496" = "Gut gemacht, Ihr habt nun einen Handelserfolg von 85% in Cartagena erreicht. Macht weiter so!<n>Erhöht nun Euren Handelserfolg auf 100%.<n>Übrigens habt Ihr gerade einen Brief zum Thema „Aufstieg und Ränge“ erhalten."
"0x0d23b497" = "Hervorragend! Nun habt Ihr genug mit Cartagena gehandelt.<n>Leider ist Euer Rang immer noch Leichtmatrose, daher dürft Ihr nur eine Konzession besitzen.<n>Um in den nächsten Rang aufzusteigen, sollt Ihr nun Euer Vermögen durch Handel noch etwas steigern. "
"0x0d23b498" = "Sehr gut! Als Matrose dürft Ihr zwei Baukonzessionen besitzen.<n>Begebt Euch nun zum Baumeister von Cartagena und erwerbt eine solche Konzession.<n>Falls Ihr noch nicht genug Gold habt, müsst Ihr weiter Handeln. Vergesst nicht, Eure Waren, die Ihr in Santa Marta produziert, zu verkaufen."
"0x0d2a3b89" = "Schiffsunterhalt"
"0x0d39b8e2" = "Als erstes müsst Ihr in Cartagena ein Lagerhaus bauen, denn vorher dürft Ihr keine anderen Gebäude errichten."
"0x0d39b8e3" = "Errichtet nun zwei Webereien und zwei Wohngebiete.<n>Sind nicht genug Baustoffe in der Stadt vorhanden, so müsst Ihr diese in einer anderen Stadt einkaufen und am Handelsdock in Euer Lager liefern.<n>Vergesst nicht zu handeln, bevor Euch das Gold ausgeht."
"0x0d39b8e4" = "Bis der Bau der Webereien abgeschlossen ist, solltet Ihr einen Vorrat von @a$SubGoal$ Baumwolle im Lager haben, damit die Betriebe gleich mit der Verarbeitung der Baumwolle zu Kleidung beginnen können."
"0x0d39b8e5" = "Euer nächstes Ziel soll sein, durch eigene Produktion einen Vorrat von @a$SubGoal$ Kleidung im Lager von Cartagena anzulegen und die Fertigstellung Eurer Webereien abzuwarten.<n>Für @a$SubGoal$ Kleidung benötigt Ihr übrigens genau @a$SubGoal$ Baumwolle."
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Militär<t>Eure Geleit- und Handelsschiffe<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Pirat<t>Eure Geleit- und Handelsschiffe<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "Ungültiger Spielstand!"
"0x0d496e89" = "Ware anklicken, um Kauf zu aktivieren bzw. deaktivieren."
"0x0d496e8a" = "Automatischer Einkauf durch den Lagerverwalter"
"0x0d4fbd33" = "Sehr gut.<n>Damit Ihr nun immer genügend Rohstoffe für Eure Webereien habt, sollt Ihr nun in Santa Marta einen Baumwollbetrieb errichten.<n>Ein Rohstoffbetrieb reicht aus, um zwei Fertigwarenbetriebe zu versorgen."
"0x0d4fbd34" = "Nun achtet darauf, dass Eure Betriebe in Santa Marta und Cartagena auf vollen Touren laufen.<n>Vergesst nicht, dass Eure Webereien in Cartagena laufend Nachschub an Baumwolle brauchen.<n>Betreibt nun weiter Handel und verkauft die produzierten Waren.<n>Sobald Euer Bargeld auf @g$GoldGoal$ gestiegen ist, endet dieses Szenario."
"0x0d552127" = "Angriff nicht möglich"
"0x0d578089" = "Ihr habt die Stadt %1 in den letzten 30 Tagen bereits angegriffen. Aus moralischen Gründen verweigert der Kapitän ein erneutes Angreifen."
"0x0d58ea99" = "Der %1 Freibeuter %2 hat %3 Arbeiter samt ihrer Familien abgeworben. Viele Betriebe in der Stadt sind nun nicht mehr ausgelastet."
"0x0d750c45" = "%1 Konvois"
"0x0d919a5a" = "%1,<n>Ihr wisst, dass ich Euch normalerweise zum Teufel schicken würde, doch in diesen Zeiten der Not würde ich sogar mit ihm persönlich paktieren.<n><n>So kommt denn herein, denn ich habe Euch etwas zu sagen."
"0x0d9c1799" = "Ihr sollt dafür sorgen, dass die Stadt @T$TargetTown$ bis zum @D$EndDate$ den Status „Rezession“ erreicht. Hierfür habt Ihr zwei Möglichkeiten:<n><n>Entweder Ihr greift die Stadt an und plündert alle Waren, um den Status „Erholung“ herbeizuführen. Durch die Warenknappheit wird dann der Status weiter sinken.<n><n>Oder aber, Ihr schneidet die Stadt von der Warenversorgung ab, indem Ihr die Händlerkonvois abfangt.<n><n>Übrigens: wenn Ihr einen Konvoi nur plündert und nicht kapert, sinkt Euer Ansehen bei der entsprechenden Nation deutlich weniger."
"0x0d9c179a" = "Gut. So gebe ich Euch den Auftrag, in der Stadt @T$TargetTown$ den Status „Rezession“ herbeizuführen. Ihr habt Zeit bis zum @D$EndDate$.<n><n>Um das Ziel zu erreichen, müsst Ihr alle ankommenden Händler abfangen, damit die Stadt keine Waren mehr erhält und der Status langsam sinkt.<n><n>Es gibt aber noch eine Möglichkeit, die schneller zum Ziel führt. Hierfür müsst Ihr die Stadt angreifen und plündern. Durch den Angriff sinkt der Status schnell auf „Erholung“, durch die anschließende Warenknappheit weiter auf „Rezession“."
"0x0daa656f" = "Streukugeln"
"0x0dbd9444" = "Es gibt nichts, was Ihr für mich tun könntet."
"0x0dbd9445" = "Ich habe derzeit leider keine Neuigkeiten für Euch. Versucht es doch später noch einmal."
"0x0dbd9446" = "Ich habe leider keinen Auftrag für Euch. Besucht mich doch in ein paar Tagen wieder."
