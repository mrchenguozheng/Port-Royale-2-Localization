"0xdd3808a0" = "Einführungsszenario<n><n>In Port Royale 2 könnt Ihr in jeder Stadt bauen, in der Ihr eine Konzession besitzt. In Eurer Startstadt dürft Ihr stets von Anfang an bauen.<n:25>Das Szenario führt Euch in Aufbau und Produktion ein. Es ist Eure Aufgabe, mehrere Betriebe und Wohnhäuser zu errichten. In mehreren Szenarioschritten werdet Ihr Euch auch um die Beschaffung von Rohstoffen, Siedlern und Arbeitern kümmern."
