"0xd4cd0f3d" = "Henry Avery ist ein Paradebeispiel des erfolgreichen Piraten. Er kaperte die reichsten Schiffe seiner Zeit, ließ sich von den Behörden nicht fassen und lebte lange genug, um seinen Wohlstand genießen zu können.<n><n>Averys frühe Jahre liegen im Dunkeln. Auf jeden Fall war er im Juni 1694 Maat auf einem Kaperschiff namens Charles, das von den Spaniern die Erlaubnis bekommen hatte, Schiffe der französischen Kolonie Martinique in westindischen Gewässern zu kapern. Eines Tage wurde er Anführer einer Meuterei und nahm sich das Schiff, wobei ihm der größte Teil der Mannschaft folgte. Das Schiff, ein schnelles Kaperschiff mit 46 Kanonen, wurde in Fancy umgenannt und eignete sich vorzüglich für die Zwecke der Piraten. Bereits 1695 ereignete sich der größte Coup: die Plünderung der indischen Schatzflotte. Im Verband mit anderen Piratenschiffen wurde eine schwerbewaffnete indische Schatzflotte angegriffen, von der zwei Schiffe gekapert werden konnten. Die Schiffe gehörten dem Großmogul persönlich und hatten ungeheure Schätze an Bord.<n><n>Als der Gouverneur von Bahamas gegen Bestechung den Piraten seinen Schutz anbot, wurde die Mannschaft ausbezahlt und verstreute sich in alle Winde. Einige von ihnen wurden in England gefasst, Avery hingegen segelte nach Irland, wo man jede Spur von ihm verlor. Man nimmt jedoch an, dass er im Verborgenen seinen Reichtum genoss."
"0xd4cd0f3e" = "Einer der populärsten Piraten aller Zeiten dürfte Edward Teach (gest. 1718) alias Blackbeard sein, dessen Markenzeichen, wie der Name schon sagt, ein furchterregender schwarzer, geflochtener Bart war. Mit 300 Mann Besatzung durchzog er auf seinem Schiff Queen Anne’s Revenge, einem umgebauten niederländischen Handelsschiff, die Meere und schreckte auch nicht davor zurück, es mit Kriegsschiffen der Royal Navy aufzunehmen.<n><n>Teach, im englischen Bristol gebürtig, machte 18 Monate lang vor allem den nördlichen Teil der westindischen Inseln und die nordamerikanische Küste unsicher. Auf den Bahamas und im armen North Carolina fand er immer wieder Möglichkeiten des Rückzugs.<n><n>Blackbeard wurde nicht zuletzt deswegen so berühmt, weil er geradezu dem Klischee eines Schrecken einflößenden, heißblütigen und launischen Seeräubers entsprach: angeblich machte er seinen Kanonier Israel Hands ohne irgendeinen Grund mit zwei Pistolenschüssen zum Krüppel, nur damit die Mannschaft nicht vergaß, wer er war.<n><n>Erst 1718 schlug seine letzte Stunde, als der Piratenjäger Robert Maynard seine Schaluppe auftrieb. Teach, obwohl sturzbetrunken, kämpfte wie ein Teufel und konnte nur mit Mühe besiegt werden. Er selbst starb, die Überlebenden seiner Crew wurden in der Mehrzahl gehängt."
"0xd4cd0f3f" = "Wer in der frühen Neuzeit aus viel Geld noch mehr Geld machen wollte, für den boten die Zuckerplantagen, die seit dem frühen 16. Jahrhundert vor allem in der Karibik entstanden, eine hervorragende Anlagemöglichkeit.<n><n>Die Investitionen warfen im Durchschnitt zehn Prozent Gewinn ab, im Idealfall (wie auf Barbados um 1650) sogar bis zu 50 Prozent! Natürlich brauchte man dafür viele, viele Arbeitskräfte, und zu diesem Zweck verschleppte man Hunderttausende von schwarzafrikanischen Sklaven hierher – der weiße Mann hatte nämlich die indianische Urbevölkerung an vielen Orten bereits fast vollständig ausgerottet. <n><n>Die Europäer selbst vertrugen das Klima nicht und waren sich überhaupt für die Drecksarbeit auch zu fein. Sogar die Plantagenbesitzer selbst zogen es vor, in London oder Madrid wohnen zu bleiben und die Arbeit in den Kolonien von ein paar Handlangern organisieren zu lassen. Auf manchen Inseln war der Anteil der Schwarzen an der Bevölkerung im 18. Jahrhundert auf bis zu 90 Prozent angestiegen!"
"0xd4cd0f40" = "Der Handel mit dem „schwarzen Gold“ begann bereits im frühen 16. Jahrhundert. Sklavenhändler besorgten die „Ware“ bevorzugt an der westafrikanischen Küste zwischen dem Senegal-Fluss und dem heutigen Kamerun. Diese Gegend lag nicht nur verkehrstechnisch günstig, sondern verfügte auch schon über eine stabile wirtschaftliche und sozialpolitische Infrastruktur – die Seeleute mussten also nicht selbst auf Menschenfang gehen, sondern konnten ihre Opfer bei den dortigen Häuptlingen oder anderen Sklavenhändlern kaufen.<n><n>Besonders gern nahm man junge Männer zwischen 15 und 35, denn sie waren ja vor allem für harte Plantagenarbeit vorgesehen. Etwa jeder fünfte Sklave überlebte aber nicht einmal die etwa sechs Wochen dauernde Überfahrt; die einen starben durch die unmenschliche Behandlung der Aufseher, die anderen durch Unglücke zur See. Die Händler kalkulierten die hohen Sterbeziffern von Anfang an mit ein und versuchten ihre Fahrten dadurch profitabler zu gestalten, dass sie ihre Schiffe bei jeder Fahrt mit so vielen Sklaven wie möglich voll stopften. Wie Holzkisten verstaut lagen diese armen Geschöpfe dann wochenlang nebeneinander gekettet, ohne Tageslicht und ausreichend Sauerstoff.<n><n>Unter diesen Umständen scheint es unglaublich, dass überhaupt jemand diese Fahrten lebendig überstand!  "
"0xd4cd0f41" = "Wenngleich es in Nord- und Mittelamerika keine weißen Sklaven gab, so befand sich der eine oder andere Europäer doch in Arbeitsverhältnissen, die sich vom Zustand der Sklaverei nicht besonders unterschieden.<n><n>Viele junge Männer (vorwiegend aus der ungebildeten Unterschicht) wollten zwar auswandern, besaßen aber kein Geld für die Überfahrt. Sie ließen sich das Geld für die Schiffspassage daher vorstrecken und verpflichteten sich als Gegenleistung für eine bestimmte Zeit zur Arbeit auf einer Zuckerplantage o.ä. <n><n>Diese an sich logisch klingende Vereinbarung hatte einen Haken: viele Plantagenbesitzer versuchten während der Zeit, in der der Vertragsarbeiter bei ihnen beschäftigt war, so viel Leistung wie möglich aus ihnen herauszuprügeln. Hinzu kam das für die meisten Europäer so gesundheitsschädliche Klima auf den karibischen Inseln.<n><n>Dieses als „Indentured Labour“ bekannte System wurde häufig auch für Strafgefangene angewendet, die man in ihrem Heimatland loswerden wollte. Die Briten wendeten diese Methode später vor allem auf Inder an, die sie zur Arbeit in den afrikanischen Kolonien zwangen."
"0xd4cd0f42" = "In dem Maße, in dem die amerikanischen Kolonien aufblühten, entfaltete sich auch der Atlantikhandel. Großbritannien, seit der Zeit von Königin Elisabeth die größte Macht zur See, hatte ein lebhaftes Interesse daran, den Warenverkehr zu kontrollieren und die heimische Wirtschaft am Profit teilhaben zu lassen.<n><n>Unter Lord Protector Oliver Cromwell verfügte die „Erste Navigationsakte“ von 1651, dass Warentransporte von den Kolonien nach Europa auf englischen Schiffen zu erfolgen hätten. Diese Maßnahme war vor allem gegen die aufstrebende Macht der Niederlande gerichtet und kam der eigenen Handelsflotte zugute.<n><n>1663 wurden die Bestimmungen noch verschärft: Kolonieschiffe, die ihre Güter nach Europa bringen wollten, mussten englische Häfen anlaufen und dort eine Gebühr entrichten. Gerade aber der Versuch, den Handel der Kolonien untereinander zu kontrollieren, stieß bald an seine Grenzen, denn das britische Militär konnte unmöglich alle Küsten überwachen, so dass sich ein lebhafter Schmuggel entwickelte. <n><n>Es war gerade der ständige Streit mit dem Mutterland um Aus- und Einfuhrbestimmungen, der besonders in den nordamerikanischen Kolonien eine eigene Identität der dortigen Siedler beförderte und später zu einem wesentlichen Auslöser der Unabhängigkeitsbewegung werden sollte."
"0xd4cd0f43" = "Der Beginn des kolonialen Zeitalters brachte zahlreiche gesundheitliche Probleme mit sich, die man von den viel kürzeren Fahrten im Mittelmeer oder entlang der Küsten kaum kannte. Eine Überfahrt nach den Kolonien in der Karibik und in Nordamerika dauerte ein bis zwei Monate, bei Flaute oder Unwetter sogar noch länger. Da verwundert es nicht, mit welchen Schwierigkeiten man zu kämpfen hatte: Gestank durch dreckige Kleidung und schlechte Körperhygiene; verunreinigte und verfaulte Lebensmittel; Mangel an sauberem Wasser; Ratten an Bord; und nicht zu vergessen, die psychische Belastung durch Eintönigkeit und Lagerkoller. Ein Schreckensgespenst jedes Seemanns war der Skorbut: diese durch Vitaminmangel verursachte Krankheit kündigte sich durch Haar- und Zahnausfall an und kostete viele Matrosen das Leben. Erst dem Weltumsegler James Cook (1728-1779) gelang es, diese Plage erfolgreich zu bekämpfen, indem er sich nicht nur für die Sauberkeit an Bord einsetzte, sondern seine Crew mit Sauerkraut und Frischobst versorgte. Ging man an Land, so lauerten dort Tropenkrankheiten wie das Schwarzwasserfieber, eine der gefährlichsten Erscheinungsformen der Malaria: diese Infektion, die sich durch erhöhten Puls, Fieber, Schüttelfrost und dunkel gefärbten Urin bemerkbar macht, führte fast immer zum Tode."
"0xd4cd0f44" = "Hinter vielen der zahlreichen Namen, die sich die Seefahrer und Kartographen für die neuen Landstriche, Flüsse und Siedlungen ausdenken mussten, verbergen sich interessante Anekdoten. Schon die erste Bezeichnung, die von den europäischen Entdeckern der Neuzeit in Amerika vergeben wurde, erzählt eine eigene Geschichte; Christoph Kolumbus nannte die Insel, auf der er am 12. Oktober 1492 landete, Salvador („Erretter“). Dies war der Dank für den göttlichen Beistand, der die Expedition auf der Hinfahrt vor Krankheiten und Stürmen verschont hatte, vor allem aber auch in buchstäblich letzter Sekunde eine Meuterei abwendete.<n><n>Auch in der Folgezeit wählten die spanischen Conquistadores meistens Namen mit religiösem Bezug, beispielsweise „Nombre de Dios“ - „Name Gottes“ oder „Trinidad“ - „Dreifaltigkeit“. In anderen Fällen ließ man sich vom Datum oder von Beobachtungen in der Landschaft inspirieren. Portugiesische Seeleute benannte zum Beispiel einen Bucht an der brasilianischen Küste, den sie am Neujahrstag 1502 erreichten, als „Januarsfluss“ (Rio de Janeiro), und der Name der Stadt Montevideo bezieht sich auf Magellans angeblichen Ausruf, der ihm beim Betrachten der Küstenlinie entfuhr: „Monte vido eu!“ - „Ich sehe einen Berg!“.<n><n>Eine beliebte Sitte war es auch, Landstriche und Städte nach den eigenen Herrschern, dem Mutterland oder der Stadt, der man entstammte, zu benennen. Damit dokumentierte man nicht nur nach außen einen klaren Besitzanspruch, sondern schuf sich auch weit in der Fremde ein Gefühl von Heimat.<n><n>Wenn alles nichts half, konnte man immer noch auf die Bezeichnungen der Indianersprache zurückgreifen (was einen aber meistens nicht davon abhielt, die Eingeborenen selbst anschließend auszurotten oder zu verjagen).<n><n>Bis heute hält sich hartnäckig das Gerücht, James Cook habe einen australischen Ureinwohner einst nach dem Namen jenes seltsamen Beuteltiers gefragt, und dieser habe mit kangooroo oder ganguru geantwortet – was angeblich aber nur bedeute, „Wovon redest du eigentlich“? Wenngleich es sich hierbei nur um eine Legende handelt, so hat es solche lustigen Missverständnisse wohl tatsächlich gegeben. <n><n>Man würde wahrscheinlich staunen, wie viele Städte, Berge und Flüsse übersetzt nichts anderes heißen als „Guten Morgen!“, „Wie bitte?“ oder „Lass mich doch in Frieden!“ ..."
"0xd4cd0f45" = "Mit der Entstehung des weltumspannenden spanischen Königreiches war es notwendig, koloniale Ämter mit so weit reichenden Befugnissen einzurichten, dass die tagespolitische Verwaltungsarbeit und plötzlich hereinbrechende Krisen gleichermaßen bewältigt werden konnten. Diesem Zweck diente die Verleihung des Titels eines Vizekönigs an die wichtigsten Gouverneure in den Kolonien.<n><n>In der Blütezeit des Weltreichs gab es zwei solche Würdenträger, nämlich in Neuspanien (Mexiko) und Peru. Im 18. Jahrhundert wurden die Vizekönigtümer Neu-Granada und Rio de la Plata hinzugefügt.<n><n>Zu den Aufgaben eines Virrey, die er gemeinsam (und oft im Streit) mit einer Audiencia genannten Verwaltungskammer wahrnahm, gehörten die üblichen Aufgaben hoher Regierungsbeamter – Eintreiben und Vermehrung der Steuergelder, Überwachung der Gesetzestreue, Organisation der kolonialen Verteidigung usw. – aber auch der Schutz der Indio-Bevölkerung und die Einsetzung niederer kirchlicher und weltlicher Würdenträger.<n><n>Gemäß der enormen wirtschaftlichen und politischen Bedeutung der überseeischen Besitzungen behielt die Krone das Treiben ihrer Vizekönige stets genau im Auge. Gewerbliche Nebenverdienste waren ihnen untersagt. Ganz davon abgesehen beschränkten sich die rivalisierenden Virreyes gegenseitig in ihrer Macht."
"0xd4cd0f46" = "Dass die europäischen Eroberer stets dem Ruf des Goldes und des Silbers nacheilten, ist hinlänglich bekannt. Fast noch wertvoller waren Gewürze; man kann sich kaum ausmalen, wie langweilig die europäische Speisekarte im Mittelalter ausgesehen haben muss, wenn man bedenkt, welche Gefahren die Menschen für ein bisschen Pfeffer oder Muskat auf sich nahmen.<n><n>Die Entdeckung Amerikas verlief in dieser Hinsicht zunächst sehr enttäuschend. Man nahm zwar die exotischen Tiere interessiert zur Kenntnis, die Christoph Kolumbus mit nach Hause brachte, freute sich über die Ausweitung der eigenen Besitzungen und die vielen Seelen, die man dort dem Christentum zuzuführen gedachte. Die versprochenen Unmengen an Gold ließen aber auf sich warten. Die Fahrten begannen sich erst zehn bis zwanzig Jahre später zu lohnen, als geradezu eine Flut amerikanischen Silbers über Europa hereinzubrechen begann. <n><n>Dabei brachte Kolumbus einen Schatz mit heim, der viel wertvoller war als alles Edelmetall der Welt zusammen: am 4. November 1492 präsentierten ihm die Eingeborenen einen – wie er es beschrieb – Apfel, der nach Kastanie schmeckte. Zum ersten Mal hatte in diesem Moment ein Europäer eine Kartoffel gegessen! Das indianische Wort für dieses Gewächs lautete übrigens batate und ist heute noch in der englischen Vokabel potato lebendig.<n><n>Noch weitere heute scheinbar so alltägliche Dinge gelangten erst durch Kolumbus und seine Nachfolger nach Europa: der Tabak, die Tomate, der Mais – und die Hängematte. Oder wie die Indianer sagen würden: die hamaka (daher das englische Wort hammock)."
"0xd4cd0fae" = "Die Entdeckung der Neuen Welt beflügelte vom ersten Moment ihres Bekanntwerdens an die Fantasie der Menschen in Europa. Was für Wesen mochten wohl in den unerforschten Gebieten leben? Die unglaublichsten Gerüchte kamen in Umlauf: die eine Insel sei voll von Menschenfressern, die nächste von Kreaturen ohne Kopf, die ihr Gesicht auf dem Bauch trügen.<n><n>Die südamerikanische Landschaft Patagonien heißt übersetzt in etwa „Land der Riesenfüßler“, der Amazonas verdankt seinen Namen einer Horde von weiblichen Kriegern, die bei den Entdeckern angeblich die Erinnerung an die Kämpferinnen der griechischen Sagenwelt weckten.<n><n>Einige dieser Gerüchte hatten einen wahren Hintergrund, andere beruhten auf Missverständnissen beim Dolmetschen oder auf Geschichten, die die Indianer selbst nur irgendwo aufgeschnappt hatten.<n><n>Vieles entsprang aber auch einfach der blühenden Vorstellungskraft der Menschen, nicht selten schlicht deswegen, weil man es einfach glauben wollte. Wie sonst ist es zu erklären, dass ganze Generationen von conquistadores nach dem legendären Jungbrunnen, dem Garten Eden oder der Goldstadt Eldorado suchten? In diesem Irrglauben bestärkt wurden sie durch die Indianer, die immer wieder versicherten, von diesem oder jenem Ort schon gehört zu haben – sich aber meistens nur Zeit gewinnen wollten, um die von Gier zerfressenen Weißen ins Landesinnere zu locken und von ihren Schiffen abzuschneiden."
"0xd4cd0faf" = "Eine der schillerndsten Figuren in der an Charakterköpfen nun wahrlich nicht armen Reihe von Entdeckern und Eroberern war der englische Schriftsteller und Abenteurer Sir Walter Raleigh (ca. 1554 – 1618). 1580 hatte er zum ersten Mal auf sich aufmerksam gemacht, als er den Aufstand irischer Rebellen gegen die englische Besatzung niederkämpfte.<n><n>Er stieg zum einem Günstling der Königin Elisabeth I. auf und nutzte seinen Einfluss, um sich eine Expedition finanzieren zu lassen, die in Südamerika die sagenhafte Goldstadt Eldorado aufspüren sollte. Auf einzigartige Weise gelang es ihm mit flinker Feder, seine Geldgeber in London trotz totaler Erfolglosigkeit bei der Suche immer wieder hinzuhalten, so als läge das Ziel direkt hinter der nächsten Flussmündung, und man könne doch nicht gerade jetzt aufgeben.<n><n>Doch irgendwann war sein Kredit aufgebraucht. Zu oft hatte man seinen schönen Versprechungen gelauscht, die sich am Ende als heiße Luft entpuppten. Raleigh fiel bei Elisabeth in Ungnade. Ihr Nachfolger Jakob I., der den heißblütigen Abenteurer als Gefahr für seine gemäßigte Außenpolitik ansah, ließ ihn gleich bei Amtsantritt unter fadenscheinigem Vorwand gefangen nehmen und zum Tode verurteilen. Das Urteil wurde ausgesetzt – wohlgemerkt nicht aufgehoben! - und Raleigh im Tower von London eingesperrt.<n><n>Jahre später, als es die Kassenlage dem König notwendig erscheinen ließ, gestatte er Sir Walter Raleigh eine nochmalige Expedition nach Guyana. Man erkenne die absurde Situation: ein zum Tode Verurteilter wurde selbst mit dem Kommando über Leben und Tod ausgestattet und zum Goldsuchen fortgeschickt! Dieser Widerspruch löste sich allerdings relativ bald auf, denn vom Fieber niedergestreckt erlebte Raleigh das Scheitern auch seiner letzten Reise.<n><n>Bei seiner Heimkehr nach England beschloss der zornige König, das 1603 ausgesetzte Todesurteil wieder in Kraft treten zu lassen. Sir Walter Raleigh wurde kurz darauf auf dem Schafott hingerichtet.  "
"0xd4cd0fb0" = "Die ersten Kontakte zwischen den Ureinwohnern in der Neuen Welt und den weißen Seefahrern verliefen im allgemeinen friedlich. An vielen Orten wurden die Europäer wie Götter begrüsst. Hier und da beruhte diese Einschätzung auf alten Mythen, in den meisten Fällen waren die Indianer aber einfach beeindruckt von den großen, blonden Fremden, die in schimmernder Rüstung und mit „Wasserhäusern“ (Schiffen) daherkamen.<n><n>Kolumbus, Cortez und all die anderen Entdecker beließen es nur zu gerne bei diesem Glauben, doch schon bald wurden die Eingeborenen mit der brutalen Wirklichkeit konfrontiert: angetrieben von der unersättlichen Gier nach Gold, der „spanischen Krankheit“, wie die Indianer es nannten, wurden ganze Völkerscharen misshandelt, versklavt und niedergemetzelt. Der Anblick der in Amerika unbekannten Pferde und der Knall der Kanonen sorgten für Panik, und wer die Massaker überlebte, den rafften die Pocken, die Grippe oder eine andere importierte Krankheit dahin.<n><n>Berühmte Intellektuelle wie Gonzolo Oviedo oder Juan de Sepulveda rechtfertigten die europäischen Verbrechen mit haarsträubenden rassistischen Argumenten, indem sie die amerikanischen Ureinwohner als von Geburt an niederträchtig, unvernünftig und minderwertig hinstellten.<n><n>Dieselben Männer, die im Namen ihres Glaubens Wissenschaftler und Hexen auf dem Scheiterhaufen verbrennen ließen, wussten voller Empörung von „bestialischen Sitten“ der Eingeborenen zu berichten: Götzenanbetung, Menschenopfer und Kannibalismus waren zwar tatsächlich kein Phantasieprodukt, dienten aber fortan als pauschale Rechtfertigung für härteste Zwangsmaßnahmen jeder Art, die die Weißen den Indianern auferlegten."
"0xd4cd0fb1" = "Die Frühphase der Kolonisierung in Amerika wurde bekanntlich von Spanien und Portugal betrieben; später gesellten sich die Niederlande, vor allem aber Großbritannien und Frankreich hinzu. Nach außen weniger offensichtlich ist, dass vor allem zahlreiche spanische Expeditionen niemals ohne ihre mächtigen deutschen Geldgeber zustande gekommen wären.<n><n>Um 1500 herum hatte sich Oberschwaben und speziell Augsburg zu einem der wichtigsten Finanz- und Handelszentren Europas entwickelt. Die Kaufmannsfamilien der Fugger und Welser betrieben von hier aus Weltpolitik, indem sie unter anderem dem spanischen König Karl durch umfangreiche Finanzhilfen 1519 die Wahl zum deutschen Kaiser ermöglichten. Auch König Heinrich VIII. von England und mancher Papst waren froh, Jakob Fugger den „Reichen“ zu ihren Bekannten zu zählen.<n><n>Solcherlei Unterstützung vergaben die schlauen Kaufleute natürlich nicht ohne Hintergedanken. Sie erwarteten als Gegenleistung die Zuteilung von Privilegien oder Beteiligung an der königlichen Silberförderung. Den Welsern gelang es sogar, sich zeitweilig einen Teil der Nordküste von Venezuela anzueignen, wo sie Städte wie „Neu-Augsburg“ gründeten und einige Expeditionen auf die – meist vergebliche - Suche nach Schätzen ins Landesinnere entsandten."
"0xd4cd0fb2" = "Die Eroberung des halben Erdballs brachte die spanische Krone in den Besitz einzigartiger Möglichkeiten. Spätestens als die großen amerikanischen Kulturen der Inka, Maya und Azteken unterworfen waren und man Zugriff auf die riesigen Silbervorkommen in Peru und Mexiko erlangt hatte, schien die Stellung Spaniens auf Jahrhunderte hinaus unanfechtbar zu sein; es klingt absurd, dass aber gerade der immense Reichtum mitverantwortlich war für den beginnenden Abstieg der Weltmacht.<n><n>Ein großer Teil der Schätze, den die Schiffe nach Spanien schafften, wanderte ohnehin direkt in die Taschen der Kaufleute nördlich der Pyrenäen, die die Reisen finanziert hatten. Was übrig blieb, reichte dann immer noch aus, um die Preise auf der iberischen Halbinsel in die Höhe zu treiben. Die Menschen begannen dort über ihre Verhältnisse zu leben: in einem Zeitalter, in dem eine prachtvolle Hofhaltung wichtiger war als eine ausgeglichene Haushaltsbilanz, achtete man nicht auf Kleingeld.<n><n>Waren wurden zunehmend auf ausländischen Schiffen ins Land gebracht, weil man sich selbst zu fein für diese Arbeit war. Auch die Bestückung der Amerika-Expeditionen mit Ausrüstung und Proviant wurde selten von eigenen Händlern vorgenommen. Mit Stolz vermerkte man: Ganz Europa ist Spanien zu Diensten.<n><n>Doch irgendwann sollte der Silberstrom versiegen, und das böse Erwachen würde einem Kater nach durchzechter Nacht gleichen: Holländer und Briten waren dabei, Spanien von den Weltmeeren zu vertreiben; die zahlreichen Religionskriege gegen die protestantischen „Ketzer“ und gegen die Türken verschlangen Unsummen; das Riesenreich, dessen Herrscher feststellte, dass in ihm die Sonne nicht untergehe, hatte sich zu einem unregierbaren Koloss entwickelt.<n><n>Bereits im Jahr 1557 wurde die Krise für alle offensichtlich, als der neue spanische Herrscher Philipp II. zum ersten Mal den Staatsbankrott verkünden musste. Das große Imperium, das größere Schätze als je ein Reich vor ihm in Händen gehalten hatte, war pleite."
"0xd4cd0fb3" = "Warum spricht man eigentlich ausgerechnet in Brasilien portugiesisch und fast überall sonst in Südamerika spanisch?<n><n>Nun, sowohl die Spanier als auch die Portugiesen, die den Seeweg nach Indien entlang der afrikanischen Küste entdeckt hatten, erkannten bereits früh, dass ihre Zukunft jenseits der Meere lag. Eifersüchtig wachten sie nun darüber, dass die jeweils andere Macht auf der Jagd nach Handelsgütern, Untertanen und Land nicht im eigenen Revier wilderte.<n><n>Da es so etwas wie Völkerrecht zu jener Zeit noch nicht gab, wandte man sich im Streitfall an den Papst – die einzige Person, deren Autorität sich beide Länder zu unterwerfen bereit waren. Die katholische Kirche hatte ihrerseits ein Interesse daran, dass Spanier und Portugiesen ihre Energie nicht dafür verschwendeten, sich gegenseitig das Leben schwer zu machen, sondern die Christianisierung der „Heiden“ in den unbekannten Ländern mit Eifer vorantrieben.<n><n>Aus diesem Grunde kam man bei gemeinsamen Verhandlungen in  Tordesillas (1494) und Saragossa (1529) überein, dass die neu entdeckten Territorien westlich eines bestimmten Längengrades zur spanischen Interessensphäre gehören sollten, alle anderen zur portugiesischen. Das damals noch unbekannte Südamerika wurde von diesem Längengrad durchschnitten, so dass sein Ostzipfel – Teil des heutigen Brasilien – zu Portugal fiel."
"0xd4cd0fb4" = "Wahrscheinlich um 140 v. Chr. finden wir beim römischen Schriftsteller Polybius die erste Erwähnung des Wortes „Pirat“ (peirato). Seitdem haben die Menschen im Laufe der Zeit viele Vokabeln für die gefürchteten Halunken zur See gefunden: Seeräuber, Freibeuter, Korsaren, Bukaniere, Flibustiers ... Die Mannen um Klaus Störtebeker wurden „Vitalienbrüder“ oder „Liekedeler“ genannt, Bartholomew Roberts betitelte sich und seine Mordbuben reichlich verharmlosend als „Gentlemen des Glücks“. Im Endeffekt dürfte es einem Kaufmann wohl ziemlich egal gewesen sein, wer da aus dem Nichts über sein Schiff herfiel. <n><n>Seeräuber sind eine Plage, die die Menschheit zu allen Zeiten und in jeder Ecke der Welt heimgesucht hat. Die kilikischen Piraten verbreiteten in der Antike im ganzen Mittelmeer einen solchen Schrecken, dass das Römische Reich regelrechte Feldzüge gegen sie unternehmen musste. Unübersichtliche Insellandschaften und zerklüftete Küstenlinien in der Nähe viel befahrener Handelsrouten waren der ideale Betätigungsort: dort, wo das Navigieren durch Riffe, Strömungen und schwierige Wetterverhältnisse die schwerfälligen Handelsschiffe zu einer leichten Beute machte, konnte man sich nach verrichteter Schandtat schnell zurückziehen. Die kleinasiatische Küste war im Altertum ebenso gefürchtet wie in der Neuzeit die Karibik; auch in Südostasien war die Piraterie fast sprichwörtlich.<n><n>Dem Wortursprung nach bezeichnet ein „Freibeuter“ eigentlich einen Seemann, der sich nicht als Matrose der Kriegsmarine, sondern als Privatmann auf die Suche nach Beute macht und somit Piraterie betreibt. <n><n>Durch die Ausstellung von Kaperbriefen verschafften sich manche karibischen Freibeuter aber den Anschein von Legalität. Solche offiziellen Dokumente wurden von englischen, französischen oder niederländischen Gouverneuren ausgestellt und verfolgten natürlich das Ziel, die anderen Mächte mit der Piratenplage zu piesacken.<n><n>Je nachdem, mit was für einem Gouverneur man es zu tun hatte, war es unterschiedlich schwierig, an Kaperbriefe zu gelangen; der eine Statthalter mochte es für unvereinbar mit seiner Ehre halten, mit Piraten zu paktieren. Andere hatten da weniger Skrupel – oder waren vielleicht auch einfach nur korrupt oder feige."
"0xd4cd0fb5" = "Die „Sieben Weltmeere“ sind nämlich in Wirklichkeit nur drei (nämlich die drei Ozeane): Nördlicher und südlicher Pazifik, nördlicher und südlicher Atlantik, nördliches und südliches Eismeer und der indische Ozean.<n><n>Die korrekte Bezeichnung des „Pazifik“ (oceano pacifico) im Deutschen müsste übrigens eigentlich „Friedlicher Ozean“ lauten, nicht „Stiller Ozean“. Er verdankt seinen Namen den ersten Weltumseglern unter Fernando Magellan, die das Glück hatten, ihre viele, viele Hungerwochen dauernde Überquerung dieses gigantischen Meeres bei bester Witterung zu erleben.<n><n>Und noch etwas: Die Karibik leitet ihren Namen von den „Kariben“ (oder auch „Karaiben“) ab, den Völkern einer indianischen Sprachfamilie, deren Siedlungsraum sich von den Kleinen Antillen entlang der Nordküste von Südamerika erstreckt."
"0xd4cd0fb6" = "Die Bermudainseln sind nach ihrem spanischen Entdecker Juan Bermúdez (Ankunft 1503) benannt. Das bei allen Seefahrern berüchtigte „Bermudadreieck“, in dem die Gefahr von Schiffsunglücken durch mysteriöse Einwirkungen angeblich besonders hoch ist, bezeichnet eine Seegegend zwischen den Bermudainseln, Puerto Rico und Fort Lauderdale (Florida).<n><n>Manche Leute behaupten, die seltsame Serie unerklärlicher Ereignisse habe bereits mit der Fahrt von Christoph Kolumbus seinen Anfang genommen: Als der genuesischer Seefahrer in spanischen Diensten befand er sich mit seinen drei Schiffen am 14. September 1492 gerade in jener Gegend, als erst die Kompassnadel verrückt zu spielen begann – Grund hierfür war der Unterschied zwischen geographischem und magnetischem Nordpol - und am nächsten Tag eine riesige Feuerflamme am Himmel auftauchte (vielleicht ein Meteor).<n><n>Der Spitzname „Bermudadreieck“ kam aber erst nach dem Zweiten Weltkrieg auf, nachdem eine Serie von Flugzeugunglücken die Aufmerksamkeit der Öffentlichkeit auf diese Gegend im südlichwestlichen Nordatlantik gelenkt hatte.<n><n>Mystikfreunde kommen auf mehr als 200 angeblich unerklärliche Unglücksfälle, wobei sie die Grenze allerdings mehr als großzügig ansetzen; die meisten Geschehnisse, von denen sich viele zudem noch nicht einmal in der Nähe jener Gegend abgespielt haben, lassen sich nämlich auf ganz natürliche Art erklären."
"0xd4cd0fb7" = "Die legendäre spanische Schatzflotte, die sich regelmäßig von Amerika nach Spanien aufmachten, weckte auch außerhalb der iberischen Halbinsel allerlei Begehrlichkeiten. Vor allem das aufstrebende England sah hier einen Weg, um der alten Großmacht Spanien ihre Rolle als Herrin der Meere und Königin der Welt streitig zu machen.<n><n>Für offene Kriegskampagnen im großen Stil war das Inselreich noch zu schwach; viel geschickter schien es da, den Rivalen außerhalb Europas zu treffen, dort in der Ferne, wo er keine Attacken erwartete und ihn auch keine Warnung erreichen konnte, dort, wo man seine Opfer in Ruhe ausplündern und verschwinden lassen konnte, ohne dass für Monate oder überhaupt jemals irgendwer in Europa von den Vorgängen erfahren würde.<n><n>Draufgängerische Kapitäne, deren bekanntester Francis Drake (1540-1596) war, bekamen von Ihrer Majestät Elisabeth I. Kaperbriefe ausgestellt – die Lizenz zum Plündern, der Blankoscheck, der Drake und seine Kollegen über den Rang gewöhnlicher Seeräuber erhob und zu privaten Raubrittern im Dienste einer höheren Sache machte. Und sie leisteten ganze Arbeit. Nirgendwo waren iberische Schiffe und Garnisonen sicher.<n><n>1578 durchquerte Francis Drake die Magellanstraße, jagte wie ein Wirbelwind auf Jagd nach spanischer Beute entlang der amerikanischen Pazifikküste - nie zuvor hatte das jemand gewagt! Als Drake 1580 wieder im Hafen von Plymouth einlief, hatte er als zweiter Kapitän nach Magellan die Welt umsegelt. <n><n>König Philipp von Spanien kochte derweil vor Wut und pochte auf den Vertrag von Tordesillas, in dem der Papst höchstpersönlich Spanien 1494 die westliche Hemisphäre als Interessensgebiet zugeschlagen hatte. – Doch wie konnte ein solcher Protest dieses seltsame Inselvolk von protestantischen „Ketzern“ jucken, die die Autorität des Mannes in Rom überhaupt nicht anerkannten, die sich sogar bis 1753 weigern sollten, den modernen gregorianischen Kalender einzuführen, nur weil dieser 1582 auf Geheiß von Papst Gregor entwickelt worden war?<n><n>Einmal mehr schien sich die Sache nur kriegerisch lösen zu lassen. 1588 machte sich Philipps Armada auf den Weg nach England, doch unter der Führung des inzwischen geadelten Sir Francis Drake und mit der Hilfe mehrerer Unwetter zur rechten Zeit wurde die spanische Flotte vernichtet. Für Hunderte von Jahren sollte niemand mehr Großbritannien die Rolle der führenden Seemacht streitig machen."
"0xd4cd101f" = "Ohne Zweifel gehört die Überfahrt des Christoph Kolumbus (1451-1506) nach Amerika zu den größten Abenteuern, die je ein Mensch erlebt hat. Kaum ein Schriftsteller würde es wagen sich eine Geschichte auszudenken, die derart voll von dramatischen Zuspitzungen und seltsamen Zufällen wäre.<n><n>Es war dem genuesischen Navigator zwar gelungen, das Königspaar Isabella und Ferdinand von Spanien von seiner Idee eines westlichen Seewegs nach Indien zu überzeugen, aber auf die Zustimmung der Mannschaft an Bord konnte er sich damit noch keineswegs verlassen. Im Gegenteil wurde der größte Teil der Crew zum Dienst gepresst: die Stadt Palos hatte sich eines Vergehens gegen die Krone schuldig gemacht und war in Folge dessen gezwungen, zwei Schiffe samt Besatzung zu stellen.<n><n>Als sich der Plan des Kolumbus herumsprach, machte sich Entsetzen breit – man war der festen Überzeugung, auf dem Schiff eines Wahnsinnigen zu segeln, der sich und alle, die mit ihm zögen, ins Verderben stürzen musste.<n><n>Kolumbus’ größter Feind aber war der Aberglaube: jede erdenkliche Spukgeschichte schien ihren Weg an Bord gefunden zu haben, und unheimliche Ereignisse verstärkten die Angst der Matrosen: bei der Vorbeifahrt an Teneriffa brach ein Vulkan aus, dann sah man Feuersäulen am Himmel, und sogar die Kompassnadel schien der Mannschaft einen Streich zu spielen. Lagen die Schiffe in einer Flaute fest, so war dies ein böses Omen. Machte man dagegen gute Fahrt, so hieß es, der Wind wehe immer von Osten nach Westen und man werde niemals umkehren können.<n><n>Mehrmals schien eine Meuterei unausweichlich zu sein; einmal hörte der Kapitän des Nachts Fußschritte und leises Gemurmel vor seine Kajüte, und erst als er laut zu beten anfing, verließ die Attentäter der Mut und sie schlichen davon.<n><n>Die schlimmsten Krisen brachen immer dann aus, wenn sich eine vermeintliche Insel am Horizont wieder einmal als optische Täuschung herausstellte. Ein solcher Vorfall war es auch, der am 10. Oktober das Fass zum Überlaufen brachte. Mit größter Mühe konnte sich Kolumbus ein Ultimatum von drei Tagen aushandeln, danach wollte die Mannschaft umkehren – am liebsten ohne ihren Kapitän. Aber das Schicksal wollte es anders: tatsächlich erreichte man innerhalb dieser drei Tage Land. Dass es sich hierbei nicht um Asien handelte, sondern um einen ganz neuen, unbekannten Kontinent, konnte keiner der Anwesenden ahnen.<n><n>Japan und China waren noch Tausende von Seemeilen entfernt, und ohne das unglaubliche Glück, dass eine fremde Landmasse quasi im Weg lag, wäre die Expedition des Kolumbus verloren gewesen. So aber war die schlechte Laune der Mannschaft mit einem Schlag wie weggeblasen. Keiner konnte sich daran erinnern, je etwas mit einer Meuterei im Sinn gehabt zu haben ..."
"0xd4cd1020" = "Nun, Christoph Kolumbus hatte die neue Landmasse zwar entdeckt (oder besser: wiederentdeckt, denn bereits die Wikinger hatten im Mittelalter ihren Fuß auf amerikanischen Boden gesetzt), bekanntlich aber im Irrtum vermeldet, er habe einen Seeweg nach Indien gefunden.<n><n>Bei der Vorbereitung seiner zweiten und dritten von vier Reisen hatte der Genueser mit dem aus Florenz stammenden Amerigo Vespucci zusammengearbeitet, der später als erster die Ansicht vertrat, es handele sich bei den Ländern im Westen um einen unbekannten neuen Kontinent. Diese spektakuläre Erkenntnis heizte das Interesse der Öffentlichkeit noch einmal neu an, und wo immer man über die Territorien diskutierte, fiel auch der Name Vespucci.<n><n>Der Stern von Christoph Kolumbus war hingegen im Sinken begriffen; zwischenzeitlich musste man ihn nach Klagen der karibischen Siedler sogar in Ketten nach Hause zurückschleppen, und von seinem Tod als verbitterter kranker Mann im Jahr 1506 nahmen weniger Leute Notiz als es ihm eigentlich zugestanden hätte. Es ist also nicht verwunderlich, dass der süddeutsche Kartograph Martin Waldseemüller, als er ein Jahr später auf einem seiner Entwürfe nach einem Namen für die unbekannten Länder suchte, den zu seiner Zeit populäreren Amerigo Vespucci als Namensgeber heranzog. <n><n>Waldseemüllers Bezeichnung wurde von seinen Kollegen übernommen. Wäre es gerecht zugegangen, hätte der Kontinent „Kolumbien“ getauft werden müssen."
"0xd4cd1021" = "Die erste amerikanische Gegend, die unter den Spaniern große Bedeutung erlangte, war Hispaniola. Hier gründete Christoph Kolumbus bereits 1493 die erste europäische Siedlung, die allerdings noch vor seiner Rückkehr aus Europa von Eingeborenen ausradiert wurde.<n><n>In den nächsten Jahren nahm sich die spanische Krone um so mehr dieser Insel an; hier wurden das erste Kloster und die erste Kathedrale erbaut, hier etablierte man als erstes das soziale System, welches man auf die anderen Gegenden auszuweiten gedachte: eine strikt in Klassen eingeteilte Sklavenhalter-Gesellschaft, eng verbunden mit der katholischen Kirche.<n><n>Hisponiola schien große Möglichkeiten zu bieten und lockte viele Unternehmungslustige über das Meer. <n><n>Doch schon wenig später wurde die spanische Aufmerksamkeit auf andere Regionen gelenkt: man hatte mittlerweile die großen Reiche auf dem Festland entdeckt und erobert. Dort ließ es sich besser und machtvoller regieren, Gold und Silber konnten leichter und reichhaltiger gefördert werden.<n><n>Wie bei einem alten Spielzeug, das man in die Ecke wirft, verlor man das Interesse an Hispaniola. Überfälle niederländischer, englischer und französischer Piraten wechselten einander ab. Die Franzosen übernahmen 1697 die Kontrolle über Saint Domingue, den Westteil der Insel (heute Haiti) und etablierten eine einträgliche Plantagenwirtschaft. Die Produktion von Kakao, Zucker, Indigo, Baumwolle und Kaffee machten Saint Domingue im 18. Jahrhundert zur profitabelsten Kolonie in der Neuen Welt.<n><n>Eine im Zusammenhang mit der Französischen Revolution entflammte Sklavenrevolte – die einzige erfolgreiche ihrer Art in der Weltgeschichte! – führte nach einigem Hin und Her 1804 zur Unabhängigkeit Haitis. Die Freiheitskämpfer gingen mit ihren vormaligen Unterdrückern nicht viel besser um als sie es von ihnen gelernt hatten: \"Für die Unabhängigkeitserklärung brauchen wir die Haut eines Weißen als Pergament, seinen Schädel als Tintenfass, sein Blut als Tinte und ein Bajonett als Feder\", verkündete der schwarze General Boisrond-Tonnerre damals."
"0xd4cd1022" = "Ein typisch karibisches Produkt, über dessen Nutzen für die Menschheit es zweifellos verschiedene Meinungen gibt, ist der Rum. Dieser aus Zuckerrohrmelasse gewonnene Branntwein, den man anfangs auch unter der hübschen Bezeichnung „Teufelstöter“ (kill-devil) fand, wurde erstmals 1650 auf Barbados erwähnt. Als geradezu sprichwörtlichen Piratentrunk verbinden die meisten Menschen den Rum allerdings eher mit der Insel Jamaika, einem der gefürchtetsten Seeräubernester aller Zeiten. <n><n>Sklavenhändler, die ihre menschliche Ware an der afrikanischen Küste erstanden hatten, verkauften sie in der Karibik für große Mengen von Melasse. In Neuengland wurden diese Melasse dann zu Rum verarbeitet und mit wieder denselben Schiffen nach Afrika transportiert, wo man das fertige Getränk verkaufte und Schiffsraum für neue Sklavenfracht schuf. Mit diesem fatalen „Dreieckshandel“ sorgten die Schiffseigentümer dafür, dass ihre Laderäume bei jeder Fahrt über das Meer gut gefüllt waren."
"0xd4cd1023" = "Jamaika ist neben Kuba wahrscheinlich die bekannteste Insel der Karibik. Ihr Name leitet sich von ihrer Bezeichnung Xymaca durch die Arawak-Indianer ab, was so viel bedeutet wie „Holz- und Wasserland“. Christoph Kolumbus persönlich, der die Insel neun Jahre zuvor entdeckt hatte, erhielt 1503 ausreichend Gelegenheit, sich von der Schönheit der Landschaft und der Freundlichkeit der Bewohner zu überzeugen – er hatte nämlich an der Nordküste Schiffbruch erlitten.<n><n>Tatsächlich gefiel es ihm hier so gut, dass er sich vom spanischen König gleich die ganze Insel als Privatbesitz übereignen ließ. Trotzdem wurde das paradiesische Eiland in den nächsten Jahrzehnten ziemlich vernachlässigt, bis die Briten es 1655 eroberten. Zu diesem Zeitpunkt waren fast keine Arawak mehr am Leben, denn ihr Stamm zeigte sich ganz besonders anfällig für die von den Europäern eingeschleppten Krankheiten.<n><n>1661 wurde Edward D'Oyley zum Generalkapitän und Gouverneur von Jamaika ernannt. Unter ihm verwandelte sich die Hauptstadt Port Royal in ein pulsierendes, schwer befestigtes Piratennest, von dem es hieß, es sei der „reichste und verdorbenste Ort auf Erden“; viele Bewohner, im Alltagsleben einfache Händler, schlossen sich häufig für private Raubzüge in spanische Gewässer zusammen. Die britische Regierung zeigte anfangs wenig Motivation, dem Treiben Einhalt zu gebieten – schließlich hielten die Freibeuter die spanischen Rivalen auf Trab.<n><n>Erst mit dem Amtsantritt von Sir Henry Morgan als Gouverneur – bezeichnenderweise selbst ein ehemaliger Piratenkapitän – kehrten Zucht und Ordnung nach Jamaika zurück. Morgan ließ das Freibeutertum rücksichtslos ausrotten und zögerte auch nicht, ehemalige Gefährten an den Galgen zu bringen.<n><n>Doch kaum war die britische Autorität wiederhergestellt, fand man – neben dem Anbau von Zuckerrohr - eine neue einträgliche Einnahmequelle: von 1672 an entwickelte sich Port Royal zu einem der größten Sklavenmärkte der Welt, nachdem die englische Royal African Company ein entsprechendes Monopolrecht erworben hatte."
"0xd4cd1024" = "Bereits etwas mehr als zwei Wochen nach seiner Ankunft in der Neuen Welt erreichte Christoph Kolumbus Kuba, die größte westindische Insel. Hier lebten mehrere Völker, die Ciboney, die Guanahatabey und die Taino, die trotz ihrer Friedfertigkeit das traurige Schicksal anderer Indianerstämme teilen sollten: 1511 wurden sie nach vierjährigem Krieg von den Spaniern erobert und ausgerottet, so dass auch hier ein lebhafter Import von schwarzen Sklaven entstand. Die Insel mit der Hauptstadt Havanna war in sieben Verwaltungsbezirke (cabildos) eingeteilt, von denen jeder einen Vertreter in ein spezielles Gremium entsandte mit der Aufgabe, die lokalen Interessen nach außen zu vertreten.<n><n>Das Bemerkenswerte an der Geschichte Kubas ist, dass die Insel, abgesehen von einem kurzen britischen Intermezzo 1762/63, vergleichsweise lange in spanischem Besitz verblieb. Vielleicht lag es daran, dass Kuba zu Kolonialzeiten nicht zu den wichtigsten Gegenden des spanischen Imperiums gehörte (es gab zum Beispiel nur wenige Bodenschätze) und eher als Zwischenstopp auf dem Weg zum Festland benutzt wurde. Jedenfalls hatten fast alle süd- und mittelamerikanischen Länder ihre Unabhängigkeit im ersten Viertel des 19. Jahrhunderts erstritten, wohingegen sich die Spanier auf Kuba noch bis 1898 halten konnten, bevor sie die Insel an die Vereinigten Staaten abtreten mussten."
"0xd4cd1025" = "Dass viele scheinbar so gewöhnliche Dinge erst durch den Handel mit Amerika nach Europa gelangten, ist bekannt. Aber auch andersherum funktionierte der kulturelle Austausch.<n><n>Vor der Ankunft der Spanier und Portugiesen gab es in Amerika zum Beispiel keine Pferde – erstaunlich, wenn man den typischen Indianer der nordamerikanischen Prärie vor Augen hat. Viele Eingeborene ergriffen gar panisch die Flucht, als sie Ross und Reiter zum ersten Mal sahen, denn sie dachten, einem unheimlichen, miteinander verwachsenen Doppelwesen gegenüberzustehen.<n><n>Auch der Kaffee, den man mit Ländern wie Brasilien und Guatemala verbindet, ist keine amerikanische Pflanze, sondern hatte zuvor bereits eine Kulturreise über drei Kontinente hinter sich gebracht: von Afrika (wahrscheinlich Äthiopien) über die arabischen Länder war er nach Südosteuropa gelangt. Nach Amerika wurde die Pflanze erst im 18. Jahrhundert eingeführt, als das Getränk sich zunehmender Beliebtheit erfreute und eine Ausweitung der Anbauflächen notwendig machte.<n><n>Mit der Kartoffel hatten die Europäer in der Karibik ein Grundnahrungsmittel von unschätzbarem Wert entdeckt; umgekehrt war in Amerika der Weizen bis zur Ankunft der Spanier und Engländer unbekannt, die dieses Getreide um 1520 nach Mexiko bzw. 1777 nach Virginia brachten. Obwohl man anfangs die Ansicht vertrat, der Weizen vertrage das amerikanische Klima nicht, trat er mit der Zeit seinen Siegeszug vor allem in Nordamerika an; heute ist Weizen das landwirtschaftliche Erzeugnis mit der größten Anbaufläche weltweit."
"0xd4cd1026" = "Kann man sich ein Leben ohne Schokolade vorstellen? Man muss es wohl, denn Kakao gehört zu den Pflanzen, die vor der Entdeckung Amerikas im Rest der Welt unbekannt waren. Die Vokabel cacao entstammt wahrscheinlich der Maya-Sprache, wo sich auch die ersten Spuren nachweisen lassen: bereits für die Zeit um 400 vor Christus scheint es gesichert, dass Maya-Händler Kakao als Getränk zu sich nahmen.<n><n>Bei den Azteken, seit dem 14. Jahrhundert die dominierende Macht auf dem mittelamerikanischen Festland, genoss der Kakao sogar heiligen Status. Der erste Europäer, der mit dieser Köstlichkeit in Kontakt kam war – wieder einmal – Christoph Kolumbus, allerdings auf einer seiner späteren Reisen, die ihn 1502 nach Nicaragua führte.<n><n>Als der eigentliche „Entdecker“ des Kakao gilt aber Hernan Cortés, der das Aztekenreich eroberte und das Rezept für ein Getränk namens xocoatl (daher das Wort „Schokolade“) nach Spanien mitbrachte. In der ersten Zeit empfand der europäische Gaumen den Geschmack als zu bitter; erst nachdem man Zucker oder Vanille beifügte, wurde heiß servierte Schokolade als Getränk der iberischen Oberklasse populär.<n><n>Für fast hundert Jahre behielten die Spanier die Rezepte für sich, danach verbreitete sich die heiße Schokolade in Frankreich und im restlichen Europa. Die Briten fügten um 1700 Milch hinzu. Den endgültigen Durchbruch in Europa erlebte der Kakao dann im 18. Jahrhundert, als man herausfand, wie köstlich Schokolade und Kaffee zusammen schmeckten."
"0xd4cd1027" = "Auch wenn es gerade im Piratenwesen oft schwer fällt, zwischen Legende und Wirklichkeit zu unterscheiden, so ist doch verbürgt, dass es auch weibliche Piraten gab. Zweien der schillerndsten Gestalten wurden im frühen 18. Jahrhundert auf Jamaika der Prozess gemacht.<n><n>Anne Bonny, die angeblich schon als Mädchen einer Hausmagd ein Messer in den Bauch gerammt hatte, war mit einem Seemann ins Piratenparadies New Providence (Nassau) durchgebrannt, hatte sich dort ihres Gatten entledigt und eine eigene Karriere auf einem gekaperten niederländischen Schiff gestartet. <n><n>Dort lernte sie Mary Read kennen, die als Mann verkleidet schon im Spanischen Erbfolgekrieg gekämpft hatte und angeblich jedem Gegner, bevor sie ihm den Gnadenstoß versetzte, ihre Brust entblößte, um ihm zu zeigen, dass er von einer Frau besiegt worden war.<n><n>Nach ihrer Verhaftung im Jahr 1720 endeten beide nur deshalb nicht am Galgen, weil sie schwanger waren; es erging ihnen damit besser als den meisten ihrer männlichen Kumpane, für die Anne Bonny nur Spott übrig hatte.<n><n>Überliefert sind die Worte, die sie dem berüchtigten „Calico Jack“ mit auf den letzten Weg gab: „Es tut mir leid, dich hier zu sehen, Jack, aber wenn du wie ein Mann gekämpft hättest, müsstest du jetzt nicht wie ein Hund hängen.\""
"0xd4cd1028" = "Der Waliser Bartholomew Roberts (1682? – 1722) war nicht nur der vielleicht bedeutendste aller Piraten, sondern auch ein sehr ungewöhnlicher. Er, der auch „Black Bart“ gerufen wurde (nicht zu verwechseln mit „Blackbeard“ alias Edward Teach) kam erst mit 37 Jahren zur Piraterie, doch der Übergang in die Kriminalität war sozusagen fließend: das Schiff, auf dem er arbeitete und das 1719 von seinem walisischen Landsmann Howell Davis überfallen wurde, war nämlich ein Sklavenschiff.<n><n>Roberts entschloss sich, bei Davis mitzumachen und übernahm seine Rolle als Kapitän, nachdem dieser ein paar Wochen später getötet wurde. Es ist überliefert, dass Bartholomew Roberts Alkohol mied und Tee bevorzugte.<n><n>Anders als Teach, der sich als leibhaftiger Satansbraten präsentierte, kleidete Roberts sich mit Vorliebe elegant, lehnte das Glücksspiel ab und hielt seine Leute sogar zum Beten an. Das soll aber nun wahrlich nicht bedeuten, dass Roberts im Grunde seines Wesens ein frommer Mann war; von seinen unzähligen Plünderungen sind zahlreiche Abscheulichkeiten vor allem vom Umgang mit Gefangenen überliefert, und mit angeblich über 400 Prisen ist er neben Henry Morgan einer der erfolgreichsten Piraten Mittelamerikas, dessen Einsatzgebiet sich von Brasilien bis nach Neufundland und Westafrika erstreckte. <n><n>Der Kanonendonner eines britischen Kriegsschiffs vor der Küste von Guinea streckte ihn 1722 schließlich nieder und befreite die Sieben Weltmeere damit von einer ihrer größten Plagen."
"0xd4cd1090" = "Der bekannteste Freibeuter, der im 17. Jahrhundert die spanischen Kolonien in Westindien heimsuchte und damit die Autoriät der iberischen Großmacht in der Region in den Grundfesten erschütterte, war der Waliser Henry Morgan (1635-1688).<n><n>Sein Leben ist ein gutes Beispiel für die moralisch mehr als zweifelhafte Politik der Briten, Holländer und Franzosen, die gegenüber der Seeräuberei allzu gerne beide Augen zuzudrücken pflegten, solange dadurch vor allem die anderen Großmächte geschädigt wurden.<n><n>Henry Morgan, seit 1668 mit einem Kommando als Bukanier versehen, trieb sein Unwesen zunächst an der Nordküste von Südamerika. Im August 1670 eroberte er mit fast 2000 Mann die schwerbefestigte spanische Stadt Panama – und machte sich auf der Rückfahrt alleine und mit dem größten Teil der Beute davon. Doch weil der Überfall nach einem Friedensschluss zwischen Spanien und England stattgefunden hatte, wurde er gefangen genommen und in London vor Gericht gestellt.<n><n>Morgan wurde allerdings nicht verurteilt, im Gegenteil: es dauerte nicht lang, und der diplomatische Wind drehte sich erneut. Morgan wurde nicht nur begnadigt, sondern sogar geadelt. Als Sir Henry setzte man ihn als neuen Gouverneur von Jamaika ein, wo er mit harter Hand regierte und seinen Lebensabend als reicher und angesehener Pflanzer beschloss."
"0xd4cd1091" = "Die Bahamas, Mitte des 17. Jahrhundert für kurze Zeit ein Rückzugsort für englische Glaubensabweichler, unterstand seit 1670 offiziell der Verantwortung des Grafen von Albemarle und einiger anderer Männer, die sich die Inselgruppe in der Hoffnung auf Profit von König Karl II. hatten übereignen lassen.<n><n>Entgegen ihren Zusagen zeigten diese Leute aber wenig Interesse am Aufbau einer geregelten Zivilverwaltung. Im Gegenteil: wie an manch anderem karibischen Ort nisteten sich ganze Heerscharen von Piraten auf den Bahamas ein, speziell auf der Insel New Providence, auf der sich die Stadt Nassau befindet. <n><n>Die seichten Buchten boten problemlos einigen hundert Schaluppen und Piratenbarken Platz, ohne dass ein schweres Kriegsschiff eindringen konnte. Die häufigen Raubfahrten in spanische Gewässer zogen Vergeltungsaktionen nach sich, so dass man John Wentworth, den ersten Gouverneur, kaum um seine Aufgabe beneiden konnte, auf den Inseln Ruhe und Ordnung wiederherzustellen.<n><n>Da sich die Lage offensichtlich nicht besserte, zog der englische König Georg I. die Bahamas als Lehen wieder ein und machte sie zur Kronkolonie. Mit Woodes Rogers, dem ehemaligen Freibeuter und Weltumsegler, traf Mitte des Jahres 1718 der erste königliche Gouverneur ein.<n><n>Mit Zuckerbrot und Peitsche machte er dem Spuk ein Ende: in der Hand hielt er eine Generalamnestie für alle Piraten, die bereit waren, ihrem Treiben mit Eid abzuschwören. Alle Unwilligen erwartete die Bestrafung durch eine bis an die Zähne bewaffnete Flotte.<n><n>Solchermaßen wieder in geordnete Verhältnisse gebracht, erhielt die Inselgruppe 1729 ein eigenes Parlament, und von da an verlief die Geschichte der Bahamas für das nächste Jahrhundert bis auf zeitweilige durch Invasionen verursachte Störungen ohne bemerkenswerte Zwischenfälle."
"0xd4cd1092" = "Fast überall in ihren neu erworbenen Kolonien errichteten die Spanier ein starres Gesellschaftssystem ohne große Aufstiegsmöglichkeiten. Ganz oben in der Rangordnung standen ihre in Europa geborenen Landsleute.<n><n>In den Kolonien auf die Welt gekommene Spanier nannte man Kreolen. Sie standen in der Hierarchie bereits nur an zweiter Stelle, hatten aber die meisten nachgeordneten Positionen in Staat, Kirche und Armee inne.<n><n>Landsleute und Kreolen bildeten stets die Elite in den Kolonien. Als Mestizen wurden Kinder von Mischehen zwischen Weißen (meistens Männern) und Eingeborenen bezeichnet. Die Indianer, die ursprünglichen Besitzer des Landes, bildeten den Bodensatz der Gesellschaft; dort, wo die Europäer sie ausgerottet hatten, nahmen die schwarzen Sklaven diese Rolle ein.<n><n>Die Bevölkerungsanteile unterschieden sich in den verschiedenen Regionen des spanischen Imperiums sehr stark; in Mexiko bildeten die Mestizen den größten Teil der Gesellschaft. Auf vielen Inseln waren die Schwarzen in der Überzahl (und gleichwohl ihren Herren ausgeliefert). Wo Dschungel, Sümpfe und Gebirgsgegenden Rückzugsmöglichkeiten boten, zum Beispiel in Bolivien oder Florida, konnten sich auch Indianerstämme erfolgreich am Leben halten."
