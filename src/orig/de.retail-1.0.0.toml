"0xdeeff94e" = " Der Inhalt war eine neue Kollektion Frauenmode aus Paris."
"0xdeeff94f" = " In ihr wurden parfümierte Rosenblätter aufbewahrt."
"0xdeeff950" = " Bei dem Inhalt handelte es sich wohl um hübsches Puppenkochgeschirr."
"0xdeeff951" = " In der Truhe wurden rosa Plüschtierchen aufbewahrt."
"0xdeeff952" = " Anscheinend befand sich in der Truhe unter anderem eine Sammlung Lippenstifte aus Paris."
"0xdeeff953" = " Es scheint, als wurden darin Staubwedel in verschiedenen Farben aufbewahrt."
"0xdeeff954" = " In der Truhe befanden sich mehrere Dienstmädchen-Uniformen."
"0xdeeff955" = " In der Truhe sind eine Menge nützlicher Dinge, darunter Peitschen, Kerzen und Puderdosen."
"0xdeeff956" = " In der Truhe befanden sich seltene Dinge, darunter ein holländisches Tulpenpflegeset."
"0xdeeff957" = " In ihr wurden lange Lackstiefel und Ledermützen aufbewahrt."
"0xdeeff9bf" = " Sie war bis oben hin voll mit Baströckchen und Schnurrbartcreme."
"0xdeeff9c0" = " Der Inhalt war eine Generalsuniform, ein Indianerkostüm, Arbeiterkleidung und ein Lederanzug."
"0xdeeff9c1" = " Sie war bis obenhin voll mit Puppen und Federboas."
"0xdeeff9c2" = " In der Truhe wurden lange französische Perücken aufbewahrt."
"0xdeeff9c3" = " Bei dem Inhalt handelte es sich wohl um Gemälde spanischer Toreros."
"0xdeeff9c4" = " Anscheinend befand sich in der Truhe unter anderem eine Schachtel Minzplättchen aus England."
"0xdeeff9c5" = " Es heißt, in der Truhe wurden Tigerstrumpfhosen, Seidenpyjamas und Reiterhosen versteckt."
"0xdeeff9c6" = " Die Truhe war voll mit flauschigen Kissen."
"0xdeeff9c7" = " In Ihr befanden sich auch Baskenmützen mit Ohrenwärmer."
"0xdeeff9c8" = " In der Truhe wurde vor allem eine bestickte Baguettewarmhaltedecke aufbewahrt."
"0xdeeffa30" = " Das wertvollste in der Truhe war ein langer Schottenrock aus Bärenfell."
"0xdeeffa31" = " Der besondere Inhalt der Truhe waren hochhackige Schuhe in besonders großer Ausführung."
"0xdeeffa32" = " In der Truhe befanden sich Ballettkleidchen und parfümierte Taschentücher."
"0xdeeffa33" = " Vor allem befand sich in der Truhe eine besonders hübsche Kochschürze mit Schleife."
