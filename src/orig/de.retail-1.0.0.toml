"0xfb64ad02" = "Ihr habt gesiegt"
"0xfbb36ec1" = "Ich bin Euch erneut zum Dank verpflichtet, denn Ihr habt viel für meine Nation getan. Ich schenke Euch daher zusätzliches Land für Eure Stadt %1. Damit seid Ihr nun im Besitz von %2% des Stadtgebietes."
"0xfbb97bb9" = "Belohnung beim Gouverneur abholen."
