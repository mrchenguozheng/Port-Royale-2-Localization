"0x142de1ba" = " Für @g$Price$ verrate ich Euch, wo Ihr @N$ContactName$ finden könnt."
"0x142de1bb" = " Viele dachten, er sei längst tot, doch vor nicht langer Zeit traf ich einen Händler, der durch Zufall an seinem Versteck vorbeikam. Scheint, er hätte sich nur zurückgezogen. Für @g$Price$ teile ich Euch mit, wie Ihr den Händler finden könnt."
