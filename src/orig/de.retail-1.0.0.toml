"0xce43a07c" = "Ihr habt den Konvoi einer befreundeten Nation angegriffen. In diesem Szenario leben die Nationen im Frieden miteinander. Ihr dürft daher auf keinen Fall Händler oder Militärkonvois angreifen."
"0xce4d9a57" = "Handel in der Stadt"
"0xce75e5c4" = "Ihr habt nun gelernt, wie man Waren kauft und verkauft. Ihr müsst die Waren immer in Städten kaufen, in denen sie produziert werden, denn dort sind sie in der Regel billiger.<n><n>Übrigens: wenn Ihr mit einem Konvoi handeln wollt, muss dieser immer selektiert sein und sich in der Stadt befinden, bevor Ihr das Handelsdock betretet.<n><n>Im weiteren Verlauf dieses Szenarios sollt Ihr eigenständig Handelsgewinne machen. Im Ereignisfenster erhaltet Ihr Tipps dazu.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Ihr müsst durch Handel auf @g$GoldGoal$  Bargeld kommen."
