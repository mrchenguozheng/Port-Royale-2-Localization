"0x24695110" = "Ich danke Euch. Ich bin ein Händler aus @T$Town$. Da die, die mich jagen, nicht wissen, wo ich mich aufhalte, versuchen sie bestimmt, mich vor meiner Heimatstadt abzufangen. Ihr solltet dort mit der Suche beginnen und den Kopfgeldjäger vernichten. Ich muss spätestens am @D$EndDate$ hier aufbrechen. Wenn Ihr den Auftrag vorher erfüllt, zahle ich Euch @g$Reward$."
"0x24695111" = "Ich muss dringend zurück nach @T$Town$, da ich dort noch einige Dinge klären muss, bevor ich mich endgültig aus dem Staub machen kann. Leider wird die Zufahrt nach @T$Town$ von einem Kopfgeldjäger bewacht, den Ihr vernichten sollt. Ich belohne Euch mit @g$Reward$, wenn Ihr den Auftrag bis zum @D$EndDate$ erledigt."
"0x24695112" = "Ich danke Euch. Ich vermute, die Hafeneinfahrt von @T$Town$ wird von einem Kopfgeldjäger bewacht.<n>Wir machen es so: ich erzähle überall herum, dass ich mich an Bord eines Eurer Schiffe begebe und Ihr nehmt Kurs auf @T$Town$ und seht, was passiert.<n>Sagt mir bis spätestens @D$EndDate$ Bescheid, dass die Luft rein ist, dann zahle ich Euch eine Belohung von @g$Reward$."
"0x246aece6" = "%1: Hungersnot"
"0x2478c95f" = "Glückwunsch! Ihr habt dieses Szenario erfolgreich absolviert und die Karibik von einem berüchtigten Piraten befreit.<n><n>Piratenverstecke entstehen im Lauf der Zeit von selbst, doch die Anzahl ihrer Konvois hängt von ihrem Erfolg ab. Üblicherweise sind Piraten nur auf das Plündern von Handelskonvois aus und nehmen sich sehr vor Militärkonvois in acht. Daher meiden sie auch Gewässer, in denen sich zu viele Militärkonvois herumtreiben.<n><n>Übrigens könnt Ihr auch im freien Spiel Jagd auf Piraten machen und deren Verstecke ausräuchern. "
"0x24802954" = "%1: Schiff gesunken"
"0x2487ab5c" = "Bilanz"
