"0x070c60f9" = "Ich danke Euch. Bitte bringt mir @a$Amount$ @G$Goods$. Ihr könnt die Waren bis zum @D$Date$ am Marktplatz abliefern. Ihr erhaltet dort @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fa" = "So liefert bitte @a$Amount$ @G$Goods$ an meinen Abgesandten am Marktplatz. Ihr habt Zeit bis zum @D$Date$. Sofort bei Lieferung erhaltet Ihr @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fb" = "So fahrt dann zu Städten der Nation @n$FoeNation$ und sammelt @G$Goods$ ein. Liefert bis zum @D$Date$ @a$Amount$ an den Markt meiner Stadt. Ihr erhaltet @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
