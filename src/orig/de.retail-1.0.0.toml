"0xcc0a1380" = "Sucht etwa eine Tagesreise nordöstlich von Providence nach dem Konvoi des Piraten @P$PirateName$. Dieser Konvoi soll vernichtet werden.<n>Kehrt anschließend zum Gouverneur von Cartagena zurück."
