"0x061848e4" = "Ihr habt die Stadt  @T$TargetTown$ sabotiert und dafür danke ich Euch im Namen meiner Nation. Als Belohnung habe ich etwas Besonderes für Euch. Ich konnte einen sehr erfahrenen Kapitän überreden, sich Euch anzuschließen. Er heißt @N$CaptainName$ und wartet in der Kneipe auf Euch."
