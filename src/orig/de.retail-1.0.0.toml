"0x19e2f378" = "%1: Mangel an Arbeitskräften"
"0x19f3d8a6" = "Nach Schiffanzahl"
"0x19f413a1" = "In diesem Szenario werdet Ihr deutlich mehr zu tun bekommen als im ersten Szenario. Ihr werdet lernen, wie man erfolgreich handelt und Eure ersten Handelsgewinne machen.<n><n>Außerdem werdet Ihr einen zweiten Konvoi bilden, damit Ihr mehr Waren gleichzeitig transportieren könnt.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Beachtet und befolgt die Hinweise im Ereignisfenster."
"0x1a106105" = "Konvoi hat noch keine Seeschlacht geführt."
"0x1a2ebe80" = "Leider habt Ihr keinen geeigneten Konvoi im Hafen vor Anker liegen. Der Konvoi muss aus genau 5 Schiffen bestehen und 150 Kanonen an Bord haben. Kommt wieder, nachdem Ihr einen solchen Konvoi zusammengestellt habt."
"0x1a3808bb" = "Das ist ein Wort. Der Händler heißt @N$Name$ und seine Heimatstadt ist @T$Town$. Wenn Ihr es schafft, seinen Konvoi bis zum @D$EndDate$ zu vernichten, werde ich Euch reich mit Waren belohnen."
"0x1a444b3b" = "Ich kann Euch nicht beauftragen, die Stadt einer anderen Nation für mich zu annektieren, da wir uns derzeit nicht im Krieg befinden. Doch die Zeiten können sich sehr schnell ändern. Besucht mich dann wieder."
"0x1a444b3c" = "Wir befinden uns im Krieg mit %1 und Ihr habt dafür gesorgt, dass %1 nur noch eine Stadt besitzt. Diese Stadt können wir Ihnen nicht nehmen, Ihr könnt daher keine Annektierung für mich durchführen.<n><n>Bitte besucht mich später wieder, wenn sich die Situation geändert haben sollte."
"0x1a444b3d" = "Ich würde Euch gerne den Auftrag geben, eine Stadt der Nation %1 zu annektieren. Ich hätte genügend Militärkonvois, um das neu hinzugewonnene Gebiet zu schützen.<n><n>Jedoch ist %1 für ein solches Vorhaben noch zu stark.<n><n>Ihr könnt %1 schwächen, indem Ihr Militärkonvois vernichtet.<n><n>Kehrt dann zu mir zurück, vielleicht habe ich einen Auftrag für Euch."
"0x1a444b3e" = "Ich würde Euch gerne den Auftrag geben, eine Stadt der Nation %1 zu annektieren. Ich hätte genügend Militärkonvois, um das neu hinzugewonnene Gebiet zu schützen.<n><n>Jedoch ist %1 für ein solches Vorhaben noch zu stark.<n><n>Ihr könnt %1 schwächen, indem Ihr Militärkonvois vernichtet.<n><n>Kehrt dann zu mir zurück, vielleicht habe ich einen Auftrag für Euch.<n><n>Ihr könnt in der Chronik unter „Nationen“ ablesen, ob eine Nation schwach ist."
