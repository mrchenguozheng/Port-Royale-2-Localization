"0x02387a4e" = "Ihr habt es nicht geschafft, die Vorräte an den Waren Weizen, Lehm, Baumwolle, Zucker und Tabak auf 150 Fass zu bringen. Kauft die Waren in den umliegenden Städten ein und liefert sie zunächst an Euer Lager in Tortuga. Verkauft sie dann alle gleichzeitig an die Stadt, sobald Ihr sie beisammen habt."
