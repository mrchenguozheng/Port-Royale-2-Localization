"0x2796edbb" = "%1 annektiert"
"0x27beb2d9" = "Plündert je @a$Amount$ Gewürze, Wein und Werkzeug von Transportkonvois der Nation @n$HostileNation$. Ihr dürft dabei kein Schiff versenken oder kapern. Liefert anschließend diese Waren bis zum @D$EndDate$ am Markt von @T$TOWN$ ab. Holt Euch anschließend Eure Belohnung beim Gouverneur ab."
"0x27e88b91" = "Errichtet eine Kirche und erhöht die Einwohnerzahl in Eurer Stadt auf 2200. Ihr habt für diese Aufgabe Zeit bis zum @D$EndDate$."
"0x2806bf85" = "Der Konvoi kann nicht auslaufen, da sich zu viele Matrosen an Bord befinden. Entlasst einige der Matrosen, bis die Maximalbesatzung nicht mehr überschritten wird."
"0x282e1ded" = "Annektiert für %1 bis zum %2 eine Kolonialstadt der Nation %3. Die Stadt darf nicht der Sitz eines Gouverneurs oder des Vizekönigs sein."
