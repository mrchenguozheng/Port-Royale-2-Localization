"0x343e9f4b" = "Herzlichen Glückwunsch! Ihr seid nun vertraut mit den Grundlagen des Städteaufbaus.<n><n>Sobald Eurer Betrieb fertiggestellt ist, beginnt er automatisch damit, Arbeiter einzustellen. Aus jedem Siedler, der im Hafen auf Arbeit wartet, werden ein Arbeiter und 4 Bürger. Im Grunde besteht ein Siedler also aus einer ganzen Siedlerfamilie.<n><n>Damit Eure Betriebe genug Arbeiter einstellen können, müsst Ihr darauf achten, dass genügend Siedler vorhanden sind. Siedler werden von Transportkonvois aus Europa zu den Gouverneursstädten gebracht und gelangen von dort über Händler zu den anderen Städten.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Sorgt dafür, dass Eurer Betrieb in Santa Marta genug Arbeiter bekommt."
