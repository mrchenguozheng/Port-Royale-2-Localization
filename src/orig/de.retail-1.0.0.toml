"0xe8925b0d" = "Fechtkampf"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>Links befindet sich Euer Kapitän. Ihr steuert ihn wie folgt:<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Angriff<f:fonts/Tiepolo_bold14x14aaFH.res><n>Ein Angriff erfolgt per Linksklick auf einen Körperbereich des Gegners. Variiert die Bereiche, um die Trefferchance zu erhöhen.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Abwehr<f:fonts/Tiepolo_bold14x14aaFH.res><n>Sobald der Gegner zu einem Angriff ausholt, müsst Ihr im richtigen Moment die rechte Maustaste drücken, um den Angriff zu parieren.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Spezialattacke<f:fonts/Tiepolo_bold14x14aaFH.res><n>Drückt die linke Maustaste, kurz bevor sich Euer Kapitän nach einem Angriff wieder in die Grundstellung begeben hat.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Ausdauer<f:fonts/Tiepolo_bold14x14aaFH.res><n>Jeder Angriff reduziert die Ausdauer Eures Kapitäns, während sie zwischen den Angriffen wieder regeneriert.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Reaktionszeit<f:fonts/Tiepolo_bold14x14aaFH.res><n>Je mehr Fechtkämpfe Ihr gewonnen habt, desto schneller müsst Ihr reagieren."
"0xe8aae87c" = "(Städteliste geändert, Route wurde zurückgesetzt)"
"0xe8b8bf24" = "%1: Angriff durch %2 abgewehrt"
"0xe8b8c0e4" = "%1 durch %2 geplündert"
"0xe8d7e960" = "%1,<n>wir kennen uns nun schon so lange und mein Herz wünschte sich, Ihr würdet allein mir gehören. Wollt Ihr nicht bei meinem Vater um meine Hand anhalten?"
"0xe8d7e961" = "%1,<n>ich muss mit Euch über etwas sprechen. Mein Vater wünscht sich nichts sehnlicher, als einen stattlichen Edelmann für mich als Gemahl auszuwählen. Doch mein Herz gehört Euch. So frage ich Euch, wollt Ihr nicht bei meinem Vater um meine Hand anhalten?"
"0xe8d7e962" = "%1,<n>ich freue mich immer so sehr über unsere Treffen. Doch nun droht mein Vater, mich mit irgendeinem Möchtegern-Edelmann zu vermählen. Nur Ihr könnt mich noch davor retten. Wollt Ihr nicht bei meinem Vater um meine Hand anhalten?"
