"0x354505ea" = "Ich habe sehr gute Neuigkeiten: Mit dem letzten Artefakt, dass du gefunden hast, konnte ich jetzt eine genaue Position ausmachen. Hier, ich markiere sie dir auf der Seekarte. %1<n>Bitte sei vorsichtig, denn niemand kann sagen, was sich dort verbirgt."
