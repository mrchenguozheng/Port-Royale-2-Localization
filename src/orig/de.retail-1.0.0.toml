"0xe4233be0" = "In diesem Szenario sollt Ihr dafür sorgen, dass die holländischen Kolonien neue Städte dazugewinnen.<n:25>Ihr beginnt das Szenario mit einem gut bewaffneten Konvoi und etwas Startkapital. Mit Kaperfahrten auf englische Händler steigert Ihr zunächst Euer Vermögen und rüstet Euren Konvoi weiter auf.<n:25>Später müsst Ihr mit Eurem Konvoi englische Militärkonvois angreifen, um England so zu schwächen, dass Ihr deren Städte annektieren könnt."
