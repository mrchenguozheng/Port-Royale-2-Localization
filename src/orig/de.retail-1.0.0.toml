"0xd5328f24" = "In diesem Szenario sollt Ihr den berüchtigten Piraten Edward Teach, genannt Blackbeard, ausfindig machen und vernichten. Der Gouverneur von Havanna erteilt Euch dazu mehrere Aufträge und unterstützt Euch bei Eurer Jagd.<n:25>Dieses Szenario bietet Euch alle Möglichkeiten des freien Spiels. Ihr erhaltet jedoch bestimmte Aufgaben, die Ihr erfüllen müsst, um das Szenario erfolgreich zu absolvieren."
