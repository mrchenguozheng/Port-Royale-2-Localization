"0xde535352" = "Leider ist nun in Tortuga eine Seuche ausgebrochen. Sie wird rund einen Monat in der Stadt wüten. Der Status der Stadt sinkt merklich ab und täglich sterben Bürger. Außerdem flüchten viele Bürger aus Angst vor der Krankheit.<n><n>Für Euch als Händler ist außerdem von Bedeutung, dass der Verbrauch an Kleidung und Holz in der Stadt verdoppelt ist, während das Ereignis anhält.<n><n>Eure Aufgabe ist es nun, die Versorgung der Stadt während der Seuche sicherzustellen und dafür zu sorgen, dass die Anzahl der Bürger erhalten bleibt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Zahl der Bürger (Einwohner abzüglich Soldaten) muss spätestens 20 Tage nach Ende der Seuche wieder bei @I$Pop$ liegen, damit alle Betriebe wieder volle Arbeiterzahl haben."
