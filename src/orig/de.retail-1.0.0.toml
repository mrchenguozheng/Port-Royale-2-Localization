"0xfac6c05b" = "Ich grüße Euch! Der Konvoi ist unterwegs, und bald werden die ersten Händler vor uns zittern! Bitte kommt später wieder, um Euch Euren ersten Anteil abzuholen!"
"0xfac6c05c" = "Ich wünsche einen guten Tag, doch Ihr seid zu früh! Ich habe noch keinen neuen Anteil für Euch. Bitte geduldet Euch noch ein paar Tage!"
