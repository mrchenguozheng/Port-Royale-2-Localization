"0x030bb0b2" = "Ihr wisst, dass wir uns im Krieg mit @n$HostileNation$ befinden.<n><n>Dies ist ein guter Zeitpunkt, um unsere Vorräte mit Waren aufzufüllen, die in @n$HostileNation$ in größeren Mengen vorrätig sind.<n><n>Ihr sollt mir eine gute Menge einer bestimmten Ware erbeuten. "
"0x030bb0b4" = "Da wir uns im Krieg mit @n$HostileNation$ befinden, habe ich vom Vizekönig den Auftrag bekommen, bei unseren Feinden einen Warenengpass auszulösen.<n><n>Ich habe daher einen Plünderungsauftrag für Euch. Nehmt Ihr an?"
"0x03141035" = "Städtedesign"
