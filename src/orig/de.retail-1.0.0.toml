"0x08d9e61b" = "Ich danke Euch. Sucht die Gewässer außerhalb der Stadt ab, vielleicht entdeckt Ihr Hinweise darüber, wo sich die Trunkenbolde verstecken wollen. Ich kann nur bis zum @D$EndDate$ hier warten, bitte beeilt Euch!"
"0x08d9e61c" = "Wie großmütig Ihr doch seid. Sucht die Gewässer außerhalb der Stadt ab, vielleicht entdeckt Ihr Hinweise darüber, wo die Trunkenbolde ihr Saufgelage abhalten. Ich kann nur bis zum @D$EndDate$ hier warten, bitte beeilt Euch!"
