"0xe3922641" = "Die Nadel dieses Kompasses lässt sich besonders leicht bewegen und pendelt sich sehr schnell ein. Nie habt Ihr bisher einen solch präzisen Kompass gesehen.<n>Der Kompass ist wie ein Schmuckstück gearbeitet und hat auf der Unterseite verschiedene Gravuren."
"0xe3922642" = "Der Zirkel liegt wunderbar in der Hand und lässt sich sehr einfach bedienen. Er scheint vollständig aus Gold gefertigt zu sein und ist mit einem feinen Muster verziert."
"0xe3922643" = "Dieser Sextant lässt auch bei hohem Seegang noch eine genaue Peilung zu. Teile des Sextanten sind an Federn aufgehängt und vermindern dadurch starke Verwacklungen."
"0xe3922644" = "Bei diesem Instrument handelt es sich wohl um ein doppeltes Fernrohr, so dass man mit beiden Augen gleichzeitig in die Ferne sehen kann. Buntes Glas lässt sich vor das Objektiv klappen, um die Augen zu schonen. An der Seite ist auch eine unverständliche Gravur zu erkennen."
"0xe3922645" = "Dies ist eine normale goldene Uhr, doch ist sie kleiner als die, die Ihr sonst gesehen habt. Außerdem ist auf einer Scheibe hinter dem Ziffernblatt ein Mond zu erkennen, der auch langsam zu wandern scheint. Es gibt auch ein paar Gravuren auf der Rückseite der Uhr."
"0xe3922646" = "Diese Lampe ähnelt einer normalen Laterne. Um den brennenden Docht sind jedoch viele Spiegel angebracht, so dass das Licht nur in eine bestimmte Richtung leuchtet. Mit einer Art Fächer vor der Öffnung kann man das austretende Licht sehr schnell ein- und ausschalten."
"0xe3922647" = "In einem Stab ist ein weiterer Stab eingefügt, der sich verschieben lässt. Eine Klammer aus einem durchsichtigen Stoff ist daran befestigt und lässt sich ebenfalls verschieben. Es scheint, als könne man mit diesem Gerät einfache Rechnungen sehr schnell durchführen."
"0xe3922648" = "Dieses seltsame Gerät sieht einem Pfeil ähnlich. Durch die Flügel beginnt er sich zu drehen, sobald man ihn ins Fahrwasser hält. Da die Umdrehungen mit einem kleinen Zeiger mitgezählt werden, scheint es, als könne man damit die Geschwindigkeit des Schiffes sehr genau bestimmen."
"0xe3922649" = "Dieses Instrument besteht aus drehbaren Flügeln und einem Zeiger, der die Drehgeschwindigkeit der Flügel anzeigt. Hält man die Flügel in den Wind, so kann man wohl Windrichtung und Windgeschwindigkeit ablesen. Das Instrument ist sehr sorgfältig gefertigt und ist mit einigen unbekannten Zeichen beschriftet."
"0xe392264a" = "Obwohl dieses Seil schon einige Zeit dem Meerwasser ausgesetzt gewesen sein muss, sieht es aus, als sei es eben erst gefertigt worden. Es fühlt sich wunderbar glatt an und lässt sich hervorragend knoten."
"0xe39226b2" = "In diesem großen Foliant befinden sich eine Vielzahl von wunderschönen Sternkarten. Eine große Tabelle führt genau auf, wann und wo jeder einzelne Stern auf- und untergeht."
"0xe39226b3" = "Eine Runde Scheibe mit feinster Gravur, in die sich verschiedene kleinere Runde Scheiben einlegen lassen. Es scheint, als könne man je nach Datum und Uhrzeit sehen, welcher Teil des Sternenhimmels gerade sichtbar ist.<n>Markierungen auf der Scheibe deuten an, das dieses Instrument einst bei der Positionsbestimmung in einer bestimmten Region eingesetzt wurde."
"0xe39226b4" = "Ein großes Horn lässt den Gesang einer Frauenstimme ertönen, wenn man an einer Kurbel dreht. Genau das richtige für Matrosen, die sich wochenlang auf See befinden."
"0xe39226b5" = "An einem goldenen Stab ist ein großes, abgerundetes Glas angebracht. Hält man es über eine Karte, so kann man selbst bei schlechtem Licht selbst die feinsten Linien deutlich und klar ablesen."
"0xe39226b6" = "Dieser kleine Metalltisch ist aus massivem Messing gefertigt und so konstruiert, dass seine Platte immer horizontal steht, ganz gleich welche Neigung das Schiff hat. Auf dem äußeren Metallring sind Markierungen eingraviert, als würden sie eine Richtung anzeigen. Fragt sich nur, in welcher Gegend der Tisch einst eingesetzt wurde."
"0xe39226b7" = "In einer kleinen Schachtel befindet sich ein edler Apparat, um sehr leicht ein Feuer anzuzünden. Die Schachtel ist übersät mit seltsamen Gravuren."
"0xe39226b8" = "Dieser Anker dient wohl mehr zur Dekoration als zum praktischen Gebrauch. Allenfalls könnte er zur Befestigung eines Ruderbootes dienen.<n>Er ist für seine Größe sehr schwer und besitzt feine Verzierungen und unbekannte Schriftzeichen."
"0xe39226b9" = "Dieses Gerät ist wie eine Petroleumlampe mit eingebautem Feuerstein. Wenn man an dem Rädchen dreht, springen Funken auf einen Docht und können so selbst bei starkem Wind ein Feuer entfachen."
"0xe39226ba" = "Dieses Horn bringt man nicht mit dem Mund zum Tönen, sondern mit Hilfe einer Art Pumpe. Drückt man sie kräftig herunter, so ertönt das Horn, wie Ihr es so laut noch nie gehört habt."
"0xe39226bb" = "Diese Karte sieht ganz anders aus als die üblichen Seekarten, die es sonst gibt. Sie ist sehr detailliert und mit mehreren Farben angefertigt. Welchen Ausschnitt die Karte zeigt, könnt Ihr allerdings nicht erkennen."
"0xe39bb702" = "Der Konvoi kann nicht auslaufen, da sich zu viele Kanonen an Bord befinden. Verkauft einige der Kanonen oder verschiebt sie in Euer Lager, bis die maximale Anzahl der Kanonen nicht mehr überschritten wird."
