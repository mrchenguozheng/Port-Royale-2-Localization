"0xd44a911d" = "Gratulation! Ihr habt nun einiges über die Produktion von Waren gelernt. Vielleicht habt Ihr auch schon bemerkt, dass es gar nicht immer so einfach ist, die selbst produzierten Waren mit Gewinn zu verkaufen und gleichzeitig Euer Unternehmen durch Handel mit anderen Waren über Wasser zu halten.<n><n>Wenn Ihr in späteren Szenarien oder im freien Spiel Betriebe errichtet, solltet Ihr Euch daher immer sicher sein, dass Ihr die produzierten Waren auch mit Gewinn absetzen könnt. Die Produktion von Waren ist teuer und die Beschaffung der Rohstoffe nicht immer leicht.<n><n>Schafft Euch daher immer erst einen finanziellen Rückhalt durch Handel und steigt nur ganz langsam in die Produktion ein."
