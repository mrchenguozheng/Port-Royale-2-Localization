"0x05478cea" = "Meine Tochter hat mir schon verkündet, dass Ihr kommt. Sie ist manchmal sehr ungestüm, müsst Ihr wissen. Doch ich kann meiner Tochter nichts abschlagen und ich glaube, Ihr seid der Richtige für sie. So frage ich Euch: wollt Ihr %1 zur Gemahlin nehmen? "
"0x05633055" = "Eure Gebäude"
"0x05716a06" = "Eure nächste Schlacht wird etwas schwieriger werden, denn diesmal wehrt sich der Gegner. Ihr sollt nämlich für den Gouverneur einen Piraten aufspüren und vernichten.<n><n>Doch zuvor müsst Ihr Euren Konvoi aufrüsten, damit Ihr für die Schlacht gewappnet seid. Dazu sollt Ihr ein neues Schiff kaufen, es Eurem Konvoi hinzufügen und neue Waffen und Matrosen an Bord nehmen.<n><n>Übrigens, auch in der Seeschlacht könnt Ihr jederzeit F1 drücken, um die Tastatur- und Mausbelegung in der Seeschlacht anzeigen zu lassen. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Rüstet Euren Konvoi auf und erfüllt den neuen Auftrag des Gouverneurs von Cartagena"
"0x058ca789" = "Besucht den Gouverneur von @T$TOWN$ und nehmt seinen Auftrag an."
"0x05980d2c" = "Der Schwierigkeitsgrad hat Einfluss auf die Warenpreise und die Schäden in Seeschlachten.<n><n>Außerdem benötigt Ihr bei niedrigem Grad weniger Handelserfolge in einer Stadt, um Konzessionen zum Bau von Gebäuden erwerben zu können."
"0x05ae35b1" = "Sehr gut! Nun besucht den spanischen Vizekönig in Port Royale und nehmt eine Annektierungsmission an, um eine französische Stadt zu annektieren.<n><n>Normalerweise müsst Ihr zwei Städte annektieren, bevor Euch der Vizekönig Land schenkt, doch in diesem Szenario habt Ihr einen kleinen Bonus und müsst nur eine Stadt für Spanien gewinnen.<n><n>Ihr könnt die Stadt, die Ihr annektieren sollt, selbst bestimmen. Es ist daher ratsam, dass Ihr eine Stadt wählt, die besonders wenig Hafenkanonen hat. Eine solche französische Stadt ist derzeit @T$SampleTown$.<n><n>Nachdem Ihr eine Stadt annektiert habt, bedankt sich der Vizekönig bei Euch mit einem Landgeschenk.<n><n>Übrigens:Ihr könnt erst ab Rang Bootsmann mit einem Vizekönig sprechen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Besucht den Vizekönig von Spanien in Port Royale und nehmt eine Annektierungsmission an. Nach erfolgreicher Annektierung könnt Ihr Euch ein Landgeschenk abholen."
