"0x0087e50b" = "+"
"0x00885bdb" = "Schön, nun habt Ihr eine eigene Stadt. In dieser Stadt darf außer Euch niemand bauen.<n><n>Einige Gebäude, wie das Handelsdock und Euer Palast, sind in der Stadt bereits vorhanden, andere müsst Ihr erst bauen.<n><n>Fahrt nun mit Eurem Konvoi in Eure Stadt. Nehmt möglichst viel Holz und Lehmziegel mit, denn Ihr werdet sie dort brauchen, um neue Gebäude zu errichten.<n><n>Baut als erstes eine Werft, damit Ihr Eure Schiffe selbst reparieren könnt.<n><n>Übrigens:<n>Die Besatzung auf Euren Geleitschiffen kostet sehr viel Unterhalt. Ihr solltet Sie entlassen, wenn Ihr sie nicht mehr benötigt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Besucht Eure neue Stadt und errichtet eine Werft."
"0x009aa6c5" = "%1 (vor 1 Tag)"
"0x009dba4d" = "Dieser Teil des Großbetriebes kann nicht abgerissen werden, da sonst eine unerlaubte Bebauung entstehen würde."
