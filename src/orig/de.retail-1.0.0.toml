"0xffcf021a" = "Existierende Stadt"
"0xffd864a4" = "Kredit aufnehmen"
"0xffdc2433" = "<c>%1  %2"
"0xffe679ca" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Leider könnt Ihr das Treibgut nicht aufnehmen, da Euer Konvoi keinen Laderaum mehr frei hat."
"0xffe679cb" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Ihr habt Treibgut gefunden und nehmt es in Euren Konvoi auf."
"0xfff97ff4" = "<g:INTEXT_MISSION_800x600.screen>"
"0xfffcdb88" = "Vorname"
"0x000bc2bb" = "Ihr habt kein freies Schiff im Hafen."
"0x000d39a6" = "Einheiten (Trefferpunkte je Einheit)"
"0x0017fc96" = "Ihr habt Euren Gegner in die Flucht geschlagen."
"0x0022560c" = "Aus Nordosten bewegt sich eine Sturmfront in den karibischen Raum. In allen betroffenen Städten halbiert sich die Produktion der Anbaubetriebe."
"0x00225853" = "Ein neuer Sturm bricht aus Südwesten in die Karibik herein. In allen Städten, die vom Sturm erfasst werden, halbiert sich die Produktion der Anbaubetriebe."
"0x0027e860" = "Betriebe"
"0x002e6f8f" = "-"
"0x0034be0d" = "Geschwindigkeit"
"0x004b9030" = "Ihr habt schon erfahren, dass nur Geleitschiffe an Seeschlachten teilnehmen. Die Handelsschiffe des Verlierers fallen immer dem Gewinner der Seeschlacht in die Hände – er kann sie plündern oder kapern.<n><n>Ihr müsst nicht jede Schlacht, in die Eure Konvois verwickelt werden, selbst führen. Wird einer Eurer Konvois von Piraten oder einem Militärkonvoi einer Nation, bei der Ihr sehr niedriges Ansehen habt, angegriffen, so könnt Ihr wählen, ob Ihr die Schlacht durchführen wollt oder ob der Konvoi versuchen soll, dem Kampf auszuweichen. Eure Geleitschiffe versuchen dann, den Gegner von Euren Handelsschiffen fernzuhalten.<n><n>Gelingt das Ausweichen nicht, so werden Eure Geleitschiffe gekapert und die Handelsschiffe geplündert. Hat ein Konvoi kein Kampfschiff, so könnt Ihr bei einem Angriff nur ausweichen. Vorteil: die Handelsschiffe werden weder beschädigt noch gekapert sondern nur geplündert.<n><n>Nun geht zum Gouverneur. Er hat einen neuen Auftrag für Euch. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erledigt den nächsten Auftrag des Gouverneurs"
