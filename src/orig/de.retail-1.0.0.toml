"0xdcba5843" = "@A$USER$, gut dass ich Euch sehe, denn ich brauche Eure Hilfe. Ich stand einst im Dienst des Piraten @P$PirateName$. Doch nun bin ich zur Vernunft gekommen und habe mit dem Gouverneur von @T$TargetTown$ eine Abmachung getroffen. Leider haben meine früheren Freunde davon erfahren und eine Prämie auf meinen Kopf ausgesetzt. Könnt Ihr mir helfen und mich nach @T$TargetTown$ bringen?"
"0xdcba5844" = "@A$USER$, man hat mir erzählt, dass ich mich auf Euch verlassen kann. Ich stehe im Dienste des Gouverneurs von @T$TargetTown$ und muss dringend zu ihm, um ihm brisante Informationen zukommen zu lassen. Leider gibt es gewisse Kreise, die verhindern wollen, dass ich @T$TargetTown$ erreiche. Daher frage ich Euch, ob Ihr mir sicheres Geleit gewähren könnt."
"0xdcba5845" = "Ach, ich bin vom Pech verfolgt. Erst traf ich vor einigen Wochen auf ein Schiff des berüchtigten Piraten @P$PirateName$. Doch der Kapitän dieses Schiffes war wohl sehr unerfahren, denn es gelang uns nahezu mühelos, das Schiff zu versenken.<n>Leider hat es sich bei dem glücklosen Kapitän um den geliebten Neffen des Piraten @P$PirateName$ gehandelt. Seit er meinen Namen gehört hat, macht er Jagd auf mich. Meine Mannschaft ist aus Angst samt Schiff getürmt und nun sitze ich hier fest.<n>Könnt Ihr mir helfen, @T$TargetTown$, meine Heimatstadt zu erreichen?"
