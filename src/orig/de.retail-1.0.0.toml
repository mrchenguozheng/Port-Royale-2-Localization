"0xd92d797c" = "Ein Händler einer anderen Nation hat in Tortuga eine beträchtliche Anzahl an Arbeitern abgeworben. Diese haben zusammen mit ihren Familien als Siedler die Stadt verlassen.<n><n>Eure Aufgabe ist es nun, so viele neue Siedler herbeizuschaffen, dass bis spätestens @D$EndDate$ alle Betriebe volle Arbeiterzahl haben.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Zahl der Bürger (Einwohner abzüglich Soldaten) muss spätestens am @D$EndDate$ wieder @I$Pop$ betragen."
"0xd95aa48e" = "Es tut mir leid, Ihr habt Euch für Eure Antwort zuviel Zeit gelassen. Redet erst mit meiner Tochter um zu sehen, ob sie Euch noch will."
"0xd95fcda8" = "Schließen"
"0xd9720471" = "Ich grüße Euch. Habt Ihr ein Schiff, dass mich nach @T$TargetTown$ bringen kann? Ich muss dringend am @D$EndDate$ dort sein. Ich zahle Euch @g$Reward$, wenn Ihr mich rechtzeitig dort hin bringt."
"0xd9720472" = "@A$USER$, man hat mich hier sitzen lassen. Dabei muss ich dringend nach @T$TargetTown$. Könnt Ihr mich dort hin bringen? Ich bezahle Euch @g$Reward$!"
"0xd9720473" = "@A$USER$, ich bin auf der Suche nach einer Mitfahrgelegenheit nach @T$TargetTown$. Ich wäre Euch sehr verbunden, wenn Ihr mir ein Quartier auf einem Eurer Schiffe anbieten könntet. Ich bezahle Euch @g$Reward$."
"0xd979efd5" = "So sei es. Bitte beginnt bis zum @D$EndDate$ mit dem Bau eines Spitals in @T$Town$."
"0xd99426c9" = "Wollt Ihr ein Spielchen mit mir wagen?<n><n>Dann wählt Euren Einsatz! Ich setze das Gleiche und der Gewinner bekommt alles."
"0xd99426ca" = "Euch brauche ich gar nicht zu fragen, ob Ihr ein Spielchen mit mir machen wollt, denn Ihr seid ja so blank wie ein frisch geschrubbtes Deck. Kommt wieder, wenn Ihr volle Taschen habt."
"0xd99426cb" = "Nein, nicht schon wieder Ihr. Ich kann mich noch gut an unser letztes Spiel erinnern. Habt Ihr denn immer noch nicht genug? Ich jedenfalls spiele mit Euch die nächste Zeit nicht mehr."
"0xd99426cc" = "Jeder hat 5 Karten erhalten. Ich melde %1 Punkte an.<n><n>Wenn Ihr das Spiel machen wollt, müsst Ihr einen Punkt mehr anmelden."
"0xd99426cd" = "Dann bin ich am Spiel. Ich wähle %1 als Trumpf.<n>Hier ist meine erste Karte."
"0xd99426ce" = "Ihr führt das Spiel. Nennt mir nun, welche Farbe Trumpf sein soll (wählt dazu eine Karte an)."
"0xd99426cf" = "%1 ist also Trumpf.<n>Nun legt Eure erste Karte ab."
"0xd99426d0" = "Ihr habt einen Punkt erhalten.<n>Wählt Eure nächste Karte."
"0xd99426d1" = "Ich habe einen Punkt erhalten.<n>Und hier ist meine Karte."
"0xd9942739" = "Ich kann die Punkte, die ich angesagt habe, nicht mehr erreichen. Ich habe verloren."
"0xd994273a" = "Ich habe meine Punktzahl bereits erreicht und Ihr habt verloren."
"0xd994273b" = "Ihr könnt Eure angesagte Punktzahl nicht mehr erreichen. Damit habt Ihr das Spiel verloren."
"0xd994273c" = "Ihr habt Eure Punktzahl erreicht und könnt das Spiel nicht mehr verlieren."
"0xd994273d" = "So, das war mein letzter Punkt und Ihr habt das Spiel verloren."
"0xd994273e" = "Verdammt, diesen Punkt hätte ich machen müssen. Ich habe das Spiel verloren."
"0xd994273f" = "Konnte ich das Spiel doch für mich entscheiden. Ihr habt dann wohl verloren."
"0xd9942740" = "Euer Glück ist nicht zu ertragen.<n>Das war mein letztes Spiel, denn meine Taschen sind leer."
"0xd9942741" = "All mein Gold liegt nun in Euren Händen. Bestellt mir noch eine Buddel Rum, doch dann lasst mich mit meiner Trauer allein."
"0xd9942742" = "So, nun habt Ihr es geschafft! Ich kann mich heute nicht mehr nach Hause wagen."
"0xd99427aa" = "Ihr habt das Spiel gewonnen!"
"0xd99427ab" = "Wollt Ihr noch ein Spiel wagen?"
