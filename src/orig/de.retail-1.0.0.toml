"0x034e66b1" = "Lagerhäuser"
"0x0351768f" = "Habt Ihr schon von dem Piraten Blackbeard gehört? Sein bürgerlicher Name ist Edward Teach und er verfügt über mehrere Konvois und greift seit einiger Zeit mit großem Erfolg Händler aller Nationen an, dennoch konnte er bisher nicht dingfest gemacht werden.<n><n>Ich gebe Euch daher den Auftrag, einen seiner Konvois zu finden und zu vernichten."
"0x03517690" = "Die Aktivitäten der Blackbeard-Sippe sind bereits zurückgegangen, doch muss der Druck auf die üblen Schurken aufrechterhalten werden. Ich erteile Euch daher den Auftrag, einen weiteren Konvoi des Piraten Blackbeard zu vernichten."
