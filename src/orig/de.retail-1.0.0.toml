"0x39e32dc6" = "Ich danke Euch. Die betroffene Stadt heißt @T$TargetTown$. Ich hoffe, ich kann mich bis zum @D$EndDate$ mit den Händlern einigen. Bis dahin darf die Stadt nicht unter den Status „Aufschwung“ fallen, damit ich in den Verhandlungen eine bessere Position habe."
"0x39e32dc7" = "Es handelt sich um die Stadt @T$TargetTown$. Versorgt die Stadt mit allen nötigen Waren. Ich werde mein Möglichstes tun, um das Gerücht bis zum @D$EndDate$ aus der Welt zu schaffen. Bis dahin darf die Stadt nicht unter den Status „Aufschwung“ fallen."
"0x39e32dc8" = "Die gebeutelte Stadt ist @T$TargetTown$. Ihr Status darf bis zum @D$EndDate$ nicht unter „Aufschwung“ fallen, sonst werden zu viele Bürger die Stadt verlassen. Es ist nicht auszuschließen, dass in der Stadt eine Pest ausbricht. Ihr müsst die Stadt daher rechtzeitig mit genügend Waren versorgen."
"0x39e32dc9" = "Gut. @T$TargetTown$ ist die betroffene Stadt. Bitte versorgt die Stadt bis zum @D$EndDate$ mit allem Nötigen. Der Status darf nicht unter „Aufschwung“ fallen. Fairerweise muss ich euch mitteilen, dass tatsächlich mit einer Pest zu rechnen ist. Bereitet Euch darauf vor."
"0x39e7361e" = "%1 besiegt"
"0x39e9081a" = "Ihr habt das Versteck des Piraten Blackbeard entdeckt. Ihr könnt das Verstecksymbol auf der Seekarte mit der linken Maustaste anklicken, um Euch über die Piratensippe zu informieren.<n><n>Vorsicht: wenn Ihr ein Versteck vernichtet, wird dadurch die Piratensippe zwar ausgelöscht. Piratenkonvois, die sich zu diesem Zeitpunkt jedoch nicht im Versteck aufgehalten haben, sind aber gewarnt und gründen ein neues Versteck.<n><n>Eure Aufgabe ist daher, zunächst alle Konvois zu vernichten, die zu dem Versteck gehören. Am Besten Ihr lauert vor dem Versteck den rein- oder rausfahrenden Konvois auf.<n><n>Zur Unterstützung habt noch etwas Bargeld bekommen.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vernichtet alle auf See befindlichen Konvois des Piraten Blackbeard. Greift nicht das Versteck an!"
