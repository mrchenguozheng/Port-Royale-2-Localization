"0x2842ae4a" = "Kaperbrief"
"0x2875b307" = "%1 %2 hat einen Konvoi des Piraten %3 vernichtet."
"0x28812f6e" = "Ich habe erfahren, dass Ihr Euch im Führen von Seeschlachten erproben wollt. Ich hätte da etwas für Euch, was uns beiden von Nutzen ist.<n>Es gibt da zwei herrenlose Schiffe, die auf dem Meer herumtreiben. Ich möchte, dass Ihr diese Schiffe beseitigt, bevor sie zur Gefahr für meine Händler werden.<n>Nehmt Ihr den Auftrag an?"
"0x28812f6f" = "Jetzt wird es schon etwas schwieriger. Mir ist zu Ohren gekommen, wo sich ein Konvoi des Piraten @P$PirateName$ herumtreibt. Der Konvoi besteht nur aus einem Schiff, es sollte also kein Problem für Euch sein, ihn zu vernichten.<n>Sagt Ihr zu?"
"0x28812f70" = "Ihr habt bereits einen Konvoi des Piraten @P$PirateName$ vernichtet. Doch ein Piratenversteck besteht meistens aus mehreren Konvois, die von @P$PirateName$ geführt werden. Nur wenn man das Versteck einer solchen Piratensippe findet und vernichtet, kann man auch dem Anführer den Garaus machen.<n>Nun ist ein weiterer Konvoi des Piraten @P$PirateName$ aufgetaucht. Dieser Konvoi besteht aus zwei Schiffen, Ihr solltet also gut vorbereitet sein, bevor Ihr in die Schlacht zieht.<n>Seid Ihr bereit?"
"0x2883fdae" = "Ihr könnt dieses Piratenversteck mit einem Konvoi von Seeseite aus angreifen. Zuvor müsst Ihr alle Schiffe besiegen, die sich im Hafen aufhalten. "
"0x289d1ced" = "täglicher Verbrauch"
"0x28b1f98d" = "%1 %2 Außerdem verfügt Ihr über eine Konzession zum Bau von Gebäuden und Betrieben in %3 und besitzt auch schon ein Lagerhaus in der Stadt.<n><n>Da Ihr jung und unerfahren seid, habt Ihr erst den Rang eines Schiffsjungen. Ihr könnt daher noch keine weiteren Konvois führen und auch noch keine Konzession in einer anderen Stadt erwerben.<n><n>Euer Rang ist an Euer Gesamtvermögen gekoppelt, das sich aus dem Bargeld und Besitztümern zusammensetzt und sich momentan auf etwa %4 beläuft. Sobald dieses Vermögen %5 erreicht, steigt Ihr in den nächsten Rang auf.<n><n><n>Viel Erfolg!"
"0x28c94158" = "Schiffe"
"0x28cc4ee4" = "Der Konvoi kann nicht auslaufen, da sich zu viele Waren an Bord befinden. Verkauft einige der Waren oder verschiebt sie in Euer Lager, bis die maximale Ladekapazität des Konvois nicht mehr überschritten wird."
"0x28ef24c0" = "schwach"
"0x28ef24c1" = "normal"
"0x28ef24c2" = "stark"
"0x28f090e8" = "Kaperbriefe"
"0x293d8c9f" = "Hervorragend, Eure Stadt hat schon eine ansehnliche Größe. Bald werden die ersten Händler anderer Städte anlegen und Warenhandel mit Eurer Stadt betreiben.<n><n>Doch ist Eure Stadt auch der Gefahr ausgesetzt, von anderen, weniger erwünschten Zeitgenossen, besucht zu werden. Hierzu gehören Piraten und Freibeuter von Nationen, zu denen Ihr ein schlechtes Verhältnis habt. Eure nächste Aufgabe soll daher sein, Soldaten einzustellen und Hafenkanonen zu errichten.<n><n>Glücklicherweise organisieren sich die Bürger Ihrer Stadt weitgehend selbst. Ihr müsst nur einige Vorgaben machen und die Anschaffungen bezahlen. Anschließend entstehen Euch aber keine weiteren Kosten.<n><n>Hafenkanonen könnt Ihr über das Baumenü errichten, Soldaten stellt Ihr über Euren Palast ein.<n><n>Übrigens:<n>Auch Soldaten benötigen Wohnraum! Anders als bei Arbeitern benötigt aber jeder Soldat nur einen Platz.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Baut 5 Hafenkanonen und erhöht die Anzahl an Soldaten auf 300."
"0x294a8c2e" = "Verlasst sofort die Stadt."
"0x294abe0f" = "Niemand hier kann Euch leiden."
