"0x09ccb838" = "Einer unserer Transportkonvois ist kürzlich von Piraten angegriffen und gekapert worden. Meine Sorge gilt den Siedlerfamilien, die sich an Bord der gekaperten Schiffe befanden. Wir suchen derzeit das Gebiet um den Ort des Angriffs ab. Könnt Ihr auch ein Gebiet übernehmen?"
"0x09ccb839" = "Einige Siedler waren mit den Arbeitsbedingungen in @T$SampleTown$ unzufrieden und haben mit einem klapprigen Kahn die Stadt verlassen. Seitdem wurde nichts mehr von ihnen gesehen. Könnt Ihr mir bei der Suche helfen? "
"0x09d182c4" = "Seid Ihr sicher, dass Ihr das Spiel beenden und zu Windows zurückkehren wollt?"
"0x09d615b1" = "Ihr habt Euren Gegner besiegt und ein Schiff geentert.<n><n>Entscheidet nun, welche Waren Ihr übernehmen und ob Ihr das Schiff kapern oder nur plündern wollt."
"0x09d615b2" = "Ihr habt Euren Gegner besiegt und mehrere Schiffe geentert.<n><n>Entscheidet nun, welche Waren Ihr übernehmen und ob Ihr die Schiffe kapern oder nur plündern wollt."
"0x09fa577e" = "Für Euren ersten Auftrag seid Ihr noch zu unerfahren. Sobald Ihr den Rang eines Matrosen erreicht habt, kommt wieder zu mir, vielleicht habe ich dann einen Auftrag für Euch.<n><n>Euer Rang steigt, indem Ihr mehr Vermögen anhäuft."
