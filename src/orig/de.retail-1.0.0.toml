"0xf7c59ef9" = "In meiner Stadt fehlen @G$Goods$ für die Weiterverarbeitung. Schon jetzt haben die Betriebe nur noch wenige Vorräte. Könnt Ihr mir helfen?"
"0xf7c59efa" = "Kürzlich stand der Verein katholischer Produzenten vor meiner Tür. Sie beklagen sich, dass es zuwenig @G$Goods$ in der Stadt gibt. 3 Stunden haben sie mir das Ohr vollgequasselt. Ich ertrage das nicht noch einmal. Wollt Ihr mit nicht aus dieser kniffligen Situation heraushelfen?"
"0xf7c59efb" = "Sapperlot! Nun sind in meiner Stadt schon wieder die Vorräte an @G$Goods$ zur Neige gegangen. Es ist mir bisweilen schleierhaft, wie die ansässigen Händler ihr Handelsgeschäfte abschließen. Bis ich das ins Reine gebracht habe, wäre ich froh, wenn Ihr mir helfen könntet."
