"0xfc3ac0b4" = "Ihr habt das Piratenversteck von Blackbeard vernichtet, konntet aber vorher nicht alle Konvois vernichten."
"0xfc3fdd9b" = "Ihr habt es nicht geschafft, die Anzahl der Bürger in Tortuga wiederherzustellen.<n><n>Sobald eine Stadt den Status „Aufschwung“ oder besser erreicht hat, kann sie neue Arbeiter aufnehmen. Neue Arbeiter könnt Ihr in Form von Siedlerfamilien anliefern. Diese werden aus Europa zu den Gouverneursstädten gebracht und warten dort auf Mitfahrtgelegenheiten. Auch in Städten mit niedrigem Status warten Siedler auf Abholung."
