"0x0f1ade15" = "Nun sollt Ihr Arbeitsplätze in der Stadt schaffen und Wohnhäuser errichten.<n><n>Da nur dann Siedler in Eurer Stadt bleiben wollen, wenn sie auch Arbeit finden, sollt Ihr als erstes 4 Betriebe errichten. Entscheidet selbst, welche Betriebe Ihr bauen wollt. Achtet aber darauf, dass Ihr nur solche Waren produziert, die Ihr in anderen Städten auch gut absetzen könnt, denn die Produktion von Waren verursacht hohe Kosten und Ihr seid auf die Gewinne durch den Warenverkauf angewiesen.<n><n>4 Betriebe bieten Platz für 120 Arbeiter. Da diese Arbeiter im Mittel zu einer 4-köpfigen Familie gehören, müsst Ihr Wohnraum für 480 Bürger schaffen – also 4 Wohngebiete.<n><n>Sobald Betriebe und Wohnhäuser vorhanden sind, solltet Ihr versuchen, Siedler aus anderen Städten in Eure Stadt zu holen. Am meisten Siedler warten in den Gouverneursstädten.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erhöht die Einwohnerzahl in Eurer Stadt auf 480."
