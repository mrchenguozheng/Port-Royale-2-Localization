"0xea43addd" = "Es bietet sich uns eine gute Gelegenheit. Eine Stadt der Nation @n$TargetNation$ möchte sich unserer Nation anschließen, da es anscheinend dauernd zu irgendwelchen Streitigkeiten kommt. Ihr sollt die Stadt unterstützen, bis sie sich zum Wechsel der Nationenangehörigkeit entschieden hat."
"0xea43adde" = "Es gibt ein Problem mit einer Stadt der Nation @n$TargetNation$. Schon vor längerer Zeit wurde vertraglich vereinbart, dass die Stadt auf friedlichem Wege an unsere Nation übergeht. Leider hält sich @n$TargetNation$ nicht mehr an die Abmachung. Ihr sollt die Stadt unterstützen, bis die Streitigkeiten geklärt sind."
"0xea43addf" = "Eine Stadt der Nation @n$TargetNation$ hat heftigen Streit mit ihrem Vizekönig. Ich kenne den Grund und habe nun den Plan, die Stadt zu unterstützen, um sie auf unsere Seite zu ziehen. Ihr könnt mir dabei helfen."
"0xea44c34b" = "Kosten:"
"0xea566056" = "Erfüllte Missionen"
