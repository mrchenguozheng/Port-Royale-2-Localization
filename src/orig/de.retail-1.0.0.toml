"0xfb343dde" = "Während der Plünderung kommt eine junge Frau angerannt.<n>„Dieser Überfall ist bestimmt nur im Auftrag meines Vaters geschehen! Hat er Euch auch gesagt, dass ich aus freien Stücken hier bin und dass ich meinen Entführer aufrichtig liebe? Bitte bringt mich nicht zurück, ich werde Euch auch belohnen!“.<n><n>Wollt Ihr die Tochter hier in @T$TargetTown$ ihrem Schicksal überlassen?"
"0xfb343ddf" = "Die Gouverneurstochter bedankt sich und übergibt Euch eine Karte mit einem eingezeichneten Versteck, an dem @a$Amount$ Waren versteckt sind."
"0xfb3648b2" = "Handelsroute aktiv"
"0xfb399b9a" = "Ein örtlicher Händler ist bereit, Euch das Wohngebiet zum Preis von %1 zu verkaufen."
"0xfb3ffb48" = "Ich möchte Euch nochmals danken, dass Ihr mir einen Konvoi übergeben habt. Er wird derzeit bewaffnet und ist in %1 Tagen einsatzbereit.<n><n>Wenn Ihr mir einen weiteren Konvoi übergeben wollt, so müsst Ihr bis dahin warten."
"0xfb425369" = "Konzeptunterstützung"
"0xfb4be839" = "Ausgezeichnet! Ihr habt alle Konvois des Piraten vernichtet und keiner kann mehr entkommen. Wenn Ihr alle Konvois einer Piratensippe vernichtet, bevor Ihr das Versteck angreift, dauert es länger, bis neue Piratenkonvois in der Karibik auftauchen.<n><n>Greift nun das Versteck wie eine Stadt an, indem Ihr Euren Konvoi anwählt und anschließend einen Rechtsklick auf das Piratenversteck macht. Liegen noch einzelne Piratenschiffe im Hafen vor Anker, so müsst Ihr erst gegen sie antreten, bevor Ihr die Hafenschlacht schlagen könnt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vernichtet das Versteck des Piraten Blackbeard."
