"0x14565717" = "Konvoiliste"
"0x1458215d" = "Bearbeiten"
"0x146c233b" = "Herzlichen Glückwunsch! Ihr habt die einzelnen Aufgaben dieses Szenarios in @I$Days$ Tagen erfolgreich abgeschlossen und ein Gesamtvermögen von @g$Wealth$ angehäuft.<n><n>Eure erreichte Punktzahl beträgt: @I$Val1$"
"0x14787e96" = "<n>Wollt Ihr mir Gold für die Anschaffung weiterer Hafenkanonen übergeben? Eine Kanone kostet %1."
"0x147c4ab1" = "Ich sehe, Ihr seid ein vermögender Mann, %1. Ich habe ein paar Löcher zu stopfen und frage Euch daher im Namen meiner Nation, ob Ihr mir nicht einen Kredit über %2 zukommen lassen könnt. Ihr erhaltet dann in %3 Monaten %4 zurück."
"0x149f54ae" = "(kein Platz für weitere Waren)"
"0x14cb5d50" = "(Reparatur nicht möglich)"
"0x14d27340" = "Nahrungsmittel verseucht"
"0x1515b387" = "Noch keine aktuellen Daten vorhanden."
"0x151a3bd1" = "Kapitän und Besatzung werden im Hafen abgesetzt. Das wird ein Abenteuer! In welchen Gewässern soll ich auf Beutefang gehen?"
"0x1525b23c" = "Lagerhaus"
