"0x31074c51" = "Habt Ihr schon gehört, dass in @T$Town$ eine Seuche ausgebrochen ist? Dies hätte bestimmt verhindert werden können, wenn es in der Stadt ein Spital geben würde. Leider ist mein Baumeister ein Angsthase und traut sich nun nicht mehr in die Stadt, um das Spital in Auftrag zu geben. Daher möchte ich Euch schicken. Nehmt Ihr an? Ich bin bereit Euch für Eure Mühe @g$Reward$ zu zahlen!"
