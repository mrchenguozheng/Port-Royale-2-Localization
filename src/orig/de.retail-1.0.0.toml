"0x080f2b29" = "<ts:20>Folgende Dinge solltet Ihr über die Waren wissen:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Es gibt 5 Warentypen: Grundwaren, Rohstoffe, Fertigwaren, Kolonialwaren und Importwaren<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Jede Stadt kann 5 Waren produzieren<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Es gibt 2 Arten von Städten: Kolonialstädte und Städte mit Gouverneur oder Vizekönig<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Gouverneursstädte produzieren Grundwaren und Fertigwaren. Außerdem erhalten sie regelmäßig Lieferungen von Importwaren aus Europa. Fertigwaren und Importwaren bekommt man also am Besten in diesen Städten<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Gouverneursstädte benötigen Rohstoffe zur Weiterverarbeitung zu Fertigwaren. Außerdem sammeln sie Kolonialwaren ein. Diese werden von den Transportkonvois aus Europa abgeholt<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Kolonialstädte produzieren Grundwaren, Rohstoffe und Kolonialwaren. Jede Kolonialware kann nur in bestimmten Gebieten der Karibik produziert werden. Beispielsweise gibt es Kaffee nur im Süden und Westen der Karibik<n><n>Folgende Dinge solltet Ihr über Preise wissen:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>je größer die Nachfrage nach einer Ware und je kleiner der Vorrat einer Stadt, desto höher ist der Preis<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>je besser Euer Ansehen bei einer Nation ist, desto günstiger könnt Ihr Waren in deren Städte kaufen<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Ihr solltet Waren nur in Städten kaufen, in denen sie produziert werden<n><n>Wie Ihr am schnellsten zu Geld kommt:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>kauft Kolonialwaren und Rohstoffe in Kolonialstädten<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>verkauft diese Waren in Gouverneursstädten und kauft dort Fertigwaren und Importwaren ein."
