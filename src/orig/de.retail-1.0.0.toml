"0x2c4a7b42" = "Eure Aufgabe war es, 5 verschiedene Betriebe in Tortuga zu errichten und die Anzahl der Bürger auf 1500 zu erhöhen. Dieses Ziel habt Ihr nicht erreicht.<n><n>Besorgt die Rohstoffe, die für den Bau der Gebäude benötigt werden. Sobald der Bau der Gebäude im Gange ist, solltet Ihr die Siedlerfamilien beschaffen. Für jeden Betrieb benötigt Ihr 30 Siedlerfamilien, aus denen dann 120 neue Bürger werden."
