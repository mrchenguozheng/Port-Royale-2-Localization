"0x3933132f" = "Ach @s$USER$, was soll ich nur machen. Dauernd kommt mir ein Händler aus @T$Town$ in die Quere und schnappt mir Handelsgewinne weg. Das geht nun schon seit Monaten so. Könnt Ihr mir nicht helfen und seinen Konvoi aus dem Weg räumen?"
"0x39331330" = "Könnt Ihr mir bei einem kleinen Vergeltungsschlag helfen? Ein Händler aus @T$Town$, da bin ich mir sehr sicher, hat einige meiner Schiffe sabotieren lassen. Nun sitze ich herum und muss warten, bis meine Schiffe aus der Werft kommen. Ich würde Euch gerne damit beauftragen, einen Konvoi meines üblen Konkurrenten zu vernichten. Ich gebe Euch eine hohe Belohnung!"
"0x39331331" = "Seid Ihr nicht @A$USER$? Ich habe vielleicht einen Auftrag für Euch.<n>Ich habe vor langer Zeit einem Händler aus @T$Town$ einen hohen Kredit gegeben und vor fast ebenso langer Zeit hätte er ihn zurückzahlen sollen. Nun, das hat er nicht getan und ich denke, es wird ihm auch in Zukunft nicht in den Sinn kommen.<n>Daher möchte ich ihm eine Lektion erteilen! Wollt Ihr nicht einen seiner Konvois angreifen? Ich würde Euch reich belohnen!"
