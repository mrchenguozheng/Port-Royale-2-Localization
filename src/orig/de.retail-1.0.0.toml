"0xf932eef8" = "Glückwunsch! Ihr habt dieses Szenario erfolgreich absolviert und seid nun mit dem Aufbau einer eigenen Stadt vertraut.<n><n>Im freien Spiel könnt Ihr von jedem Vizekönig eine eigene Stadt geschenkt bekommen. Ganz so leicht ist das aber nicht, denn für jedes Landgeschenk müsst Ihr auch Annektierungen durchführen, die natürlich Euer Ansehen bei den jeweils anderen Nationen schmälern.<n><n>Was Ihr in diesem Szenario über den Aufbau gelernt habt, hilft Euch natürlich auch bei Aufbau eigener Produktionen in anderen Städten. Der größte Unterschied ist, dass Ihr Euch in solchen Städten nicht um die Verteidigung der Stadt kümmern müsst."
