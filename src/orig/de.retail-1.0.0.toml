"0x24b0fd83" = "Eigenschaft"
"0x24c12812" = "Herzlichen Glückwunsch, Ihr habt eine Annektierungsmission erhalten!<n><n>Da Städte mitunter sehr stark verteidigt sind, solltet Ihr eine englische Stadt wählen, die möglichst wenig Kanonentürme im Hafen hat. Die Stadt @T$SampleTown$ ist eine solche Stadt.<n><n>Um eine Stadt angreifen zu können, müsst Ihr die Option „Städte angreifen“ bei Eurem Konvoi aktivieren. Wählt dazu den Konvoi an und klickt auf den Button „Angriffsmodus“.<n><n>Ihr könnt eine Stadt von See- oder von Landseite angreifen. Einen Angriff von Landseite solltet Ihr aber nur wagen, wenn Ihr über mehr Matrosen verfügt als die Stadt Soldaten hat. Außerdem solltet Ihr etwa die Hälfte der Matrosen mit Entermessern, die andere Hälfte mit Musketen ausrüsten können.<n><n>Übrigens: Liegt bei einer Stadt ein Militärkonvoi im Hafen, so müsst Ihr diesen Konvoi besiegen, bevor Ihr die Stadt selbst angreifen könnt.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erfüllt die Annektierungsmission."
"0x24e18ac4" = "<f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x24ec3366" = "Ausgezeichnet. Ihr habt nun einen Konvoi, mit dem Ihr Euch auf die Suche nach einem Konvoi des Piraten Blackbeard begeben könnt.<n><n>Im Ereignisfenster erhaltet Ihr täglich einen Tipp, wo Ihr einen solchen Konvoi finden könnt, sofern sich einer auf See befindet. Die Suche nach Piraten ist nicht immer leicht, denn nach erfolgreichen Beutefahrten begeben sie sich immer wieder zurück in Ihr Versteck.<n><n>Bedenkt, dass ein Piratenkonvoi bis zu 5 Kampfschiffe haben kann. Wenn Ihr Euch noch nicht stark genug fühlt, solltet Ihr Euren Konvoi weiter stärken. Wie man zu Gold kommt, habt Ihr ja bereits gelernt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erfüllt nun den Auftrag des Gouverneurs von @T$TOWN$."
"0x250c7a12" = "So liefert bis zum @D$Date$ @a$Amount$. Ihr könnt die Ware am Marktplatz abgeben und erhaltet sofort Eure Bezahlung von @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> @G$Goods$."
"0x250c7a13" = "Das freut mich. Bitte liefert @a$Amount$ am Marktplatz ab. Bis zum @D$Date$ erhaltet ihr dort Eure Bezahlung von @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x250c7a14" = "Bitte trefft Euch am Markt mit meinem Abgesandten. Übergebt Ihm bis zum @D$Date$ @a$Amount$ @G$Goods$, er wird euch einen guten Preis anbieten."
"0x2540ea42" = "Zusätzliche Texte (Chronist)"
"0x2546beb9" = "So, @N$OwnerName$ hat Euch also zu mir geschickt? Ja, ich kenne diesen alten Kapitän, der einem Eurer Leute was beibringen kann. Doch warum sollte ich Euch helfen? Aber ich will mal nicht so sein, denn Ihr habt gewiss einige Zeit nach mir gesucht. Erfüllt einen kleinen Auftrag für mich, dann verrate ich Euch, wo sich der Kapitän zur Ruhe gesetzt hat."
"0x2546beba" = "Ich kenne keinen @N$OwnerName$, doch wo @N$TeacherName$ sich aufhält, könnte ich Euch wirklich sagen. Wenn ich wollte. Ein Vorschlag: Ihr helft mir, ich helfe Euch! "
"0x2546bebb" = "Egal, ob Ihr von @N$OwnerName$ kommt oder Euch der bucklige Großwesir von Taipeh geschickt hat. Ich habe ein Problem. Und bevor das nicht gelöst ist, interessiere ich mich für nichts anderes. Ich mache Euch einen Vorschlag: Ihr besorgt mir eine Truhe, ich verrate Euch, wo sich dieser verrückte @N$TeacherName$ versteckt hält."
