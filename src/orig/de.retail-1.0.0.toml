"0xcc823e54" = "Wir befinden uns im Krieg mit @n$TargetNation$ und aufgrund jüngster Ereignisse ist es für uns an der Zeit, zurückzuschlagen. Ihr sollt in meinem Auftrag Militärschiffe kapern oder versenken. Nehmt Ihr an? "
"0xcc823e55" = "Erst kürzlich hat @n$TargetNation$ eine unserer Städte angegriffen. Nun plane ich selbst eine Militäraktion gegen @n$TargetNation$ und frage Euch, ob Ihr daran teilhaben wollt. Ihr sollt Militärkonvois versenken oder kapern. Alles, was Ihr erbeutet, soll Euch gehören, mir geht es nur darum, @n$TargetNation$ zu schwächen. Seid Ihr dabei?"
"0xcc823e56" = "@n$TargetNation$ ist gegen eine unserer Städte vorgegangen. Nun schlagen wir zurück und versenken ihre Schiffe. Ich möchte Euch gerne in eine bestimmte Gegend schicken und Euch beauftragen, Militärschiffe zu kapern oder zu versenken. "
