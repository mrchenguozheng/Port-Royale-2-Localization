"0xe0f66b24" = "Es herrscht Hungersnot"
"0xe10e4380" = "Die vorgegebene Zeit ist abgelaufen, Ihr habt jedoch das letzte Szenarioziel nicht erreicht.<n><n>Im freien Spiel könnt Ihr von jedem Vizekönig eine eigene Stadt geschenkt bekommen. Ganz so leicht ist das aber nicht, denn für jedes Landgeschenk müsst Ihr auch Annektierungen durchführen, die natürlich Euer Ansehen bei den jeweils anderen Nationen schmälern.<n><n>Was Ihr in diesem Szenario über den Aufbau gelernt habt, hilft Euch natürlich auch bei Aufbau eigener Produktionen in anderen Städten. Der größte Unterschied ist, dass Ihr Euch in solchen Städten nicht um die Verteidigung der Stadt kümmern müsst."
"0xe10f2f85" = "Dann hoffe ich auf ein gutes Geschäft mit Euch.<n>Liefert so viel @G$Goods$ wie Ihr könnt an den Markt von @T$TOWN$. Ich nehme dort auch mehrere Lieferungen entgegen und zahle Euch zunächst @g$Price$ sofort.<n>Am @D$EndDate$ kommt der Expeditionskonvoi hier an. Gebt diesem Konvoi sicheren Geleit nach Europa, dann bekommt Ihr die zweite Hälfte des Goldes."
