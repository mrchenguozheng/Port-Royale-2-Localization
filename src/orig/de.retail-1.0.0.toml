"0xe3de2672" = "Ihr habt nun alle Dokumente des Gouverneurs an Bord genommen. Bringt die Dokumente nach @T$TOWN$ "
"0xe3e1d467" = "%1,<n><n>Ihr könnt keine Konzession erwerben, da Euer Ansehen bei meiner Nation zu gering ist und Ihr Euch außerdem für diese Stadt zu wenig eingesetzt habt.<n><n>Erhöht Euer Ansehen bei meiner Nation und handelt mit meiner Stadt, um Euren Handelserfolg zu erhöhen, dann sprechen wir uns wieder."
"0xe3e1d468" = "%1,<n><n>Euer Ansehen bei meiner Nation ist zu gering, ich kann Euch leider keine Konzession verkaufen.<n><n>Kommt wieder, wenn Euer Ansehen gestiegen ist."
"0xe3e1d469" = "%1,<n><n>Ihr habt nicht genug Handel mit dieser Stadt betrieben. Liefert benötigte Waren, um Euren Handelserfolg zu erhöhen. Erst dann könnt Ihr eine Konzession erwerben."
"0xe3e33a30" = "So sei %1 Eure neue Stadt. Ihr könnt Sie nun anfahren wie jede andere Stadt auch, um Gebäude und Betriebe zu errichten.<n>Es steht Euch noch nicht das ganze Stadtgebiet zur Verfügung, doch wenn Ihr weitere Städte annektiert, schenke ich Euch Land dazu."
"0xe3fa97eb" = "Das ist ein Wort. Bringt @a$Amount$ Werkzeug nach @T$DestTown$. Ihr erhaltet am Marktplatz @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>. Die Lieferung muss bis zum @D$Date$ erfolgen."
"0xe3fa97ec" = "So sei es. Liefert @a$Amount$ nach @T$DestTown$. Das Werkzeug muss bis zum @D$Date$ dort sein. "
"0xe3fa97ed" = "Gut. So gebe ich Euch den Auftrag, @a$Amount$ Werkzeug zu beschaffen. Liefert es bis zum @D$Date$ in @T$DestTown$ ab. Ihr erhaltet am Marktplatz Eure Bezahlung von @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
