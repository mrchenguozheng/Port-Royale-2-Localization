"0x0eb34b66" = "In diesem Szenario werdet Ihr lernen, wie Ihr Betriebe errichtet und was Ihr dabei beachten solltet. Außerdem werdet Ihr Wohngebiete bauen, damit Eure neuen Arbeiter eine Unterkunft haben.<n><n>In Port Royale 2 könnt Ihr in jeder Stadt bauen, in der Ihr eine Konzession gekauft habt. Je mehr Konzessionen Ihr bereits besitzt, desto teurer wird eine weitere. In Eurer Startstadt besitzt Ihr bereits eine Konzession, Ihr könnt also sofort mit dem Bau neuer Gebäude beginnen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Errichtet in Santa Marta einen Kakaobetrieb und ein Wohngebiet."
"0x0ede126a" = "Ihr wisst nun, wie Seeschlachten geführt werden. Ihr könnt aber auch ganze Städte angreifen, um sie zu plündern oder um sie für eine Nation zu annektieren. Hierfür benötigt Ihr allerdings große Konvois mit starken Schiffen. Außerdem könnt Ihr Euch wohl denken, dass dies Eurem Ansehen bei der angegriffenen Nation sehr schadet und die Militärkonvois dieser Nation fortan Jagd auf Euch machen werden.<n><n>Es besteht aber auch die Möglichkeit, ein Piratenversteck anzugreifen. Zwar sind Piratenverstecke meist geheim, doch wird jedes Versteck irgendwann einmal bekannt. Dann könnt Ihr das Versteck wie eine Stadt angreifen, um die ganze Piratensippe zu vernichten.<n><n>Wie stark ein solches Versteck verteidigt ist, hängt davon ab, wie lange eine Piratensippe schon ihr Unwesen getrieben hat und wie erfolgreich deren Konvois Handelsschiffe geplündert haben.<n><n>Eure letzte Aufgabe in diesem Szenario wird es sein, ein kleines Piratennest auszuheben. Holt Euch beim Gouverneur von @T$TOWN$ die Information, wo sich das Versteck befindet.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vernichtet das Versteck des Piraten @P$PirateName$."
"0x0eecc4e8" = "Englische Kolonie"
