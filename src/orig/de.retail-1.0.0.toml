"0x31ed47e7" = "Ein Saboteur hat in Tortuga die Nahrungsmittelvorräte verseucht. Dadurch ist in der Stadt sofort eine Hungersnot ausgebrochen.<n><n>Eure Aufgabe ist es nun, die Hungersnot so schnell wie möglich wieder zu beenden.<n><n>Dazu müssen etwa 2-3 Wochen lang von möglichst vielen Nahrungsmitteln mehr Waren vorhanden sein, als pro Tag verbraucht werden.<n><n>Hinweis: Zu den Nahrungsmitteln gehören Weizen, Früchte, Mais und Fleisch.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Hungersnot muss bis zum @D$EndDate$ beendet sein."
