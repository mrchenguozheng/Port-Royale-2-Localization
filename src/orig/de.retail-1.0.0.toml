"0xcff9644a" = "Das Spiel „Einarmiger Pirat“ ist ein Glückspiel mit 32 Karten. Jeder zahlt seinen Einsatz in den Pott und erhält 5 Karten, die der andere nicht sehen kann.<n><n>Zunächst muss jeder ansagen, wie viele Punkte er machen kann, wobei jeder gewonnene Stich ein Punkt bedeutet. Der Spieler, der mehr Punkte ansagt, wird Spielführer und bestimmt den Trumpf. Er muss nun versuchen, mindestens die angesagten Punkte zu holen.<n><n>Dazu legt der Spielführer seine erste Karte aus und der andere Spieler muss bedienen, also eine Karte derselben Farbe ablegen, wenn er kann. Wer die höhere Karte hat, erhält den Punkt.<n><n>Wer nicht bedienen kann, darf eine beliebige Karte abwerfen oder mit einem Trumpf stechen.<n><n>Die Reihenfolge der Karten ist I, II, III, IV, Pirat, Braut, Gouverneur, Papagei. Ein Trumpf sticht alle anderen Karten.<n><n>Derjenige, der den Punkt erhalten hat, legt nun die nächste Karte. So geht es weiter, bis das Spiel entschieden ist.<n><n>Schafft es der Spielführer, so viele Punkte wie angekündigt zu machen, gewinnt er das Spiel und den Pott. Schafft er es nicht, gewinnt sein Gegner."
