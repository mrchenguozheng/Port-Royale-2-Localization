"0xe7bffbb6" = "In Tortuga sind Warenbestände der Stadt durch Sabotage vernichtet worden. Dadurch ist ein beträchtlicher Teil der Vorräte für die Bürger verlorengegangen, wodurch die Lebensqualität der Bürger stark gesunken ist.<n><n>Euer Ziel ist es, die Warenvorräte der Stadt so schnell wie möglich wieder aufzufüllen, damit der Status der Stadt wieder steigen kann.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Stadt muss bis zum @D$EndDate$ den Status „Aufschwung“ erreicht haben."
