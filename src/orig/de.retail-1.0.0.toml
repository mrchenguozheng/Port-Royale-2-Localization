"0x1b0a0b6d" = "Ihr habt den Rang „Matrose“ erreicht. Ab heute müsst Ihr etwas dafür tun, wenn Euer hohes Ansehen bei einer Nation bestehen bleiben soll.<n><n>Ihr könnt Euer Ansehen bei den Nationen steigern, indem Ihr handelt, an Kirchen spendet, Feste veranstaltet, Piraten vernichtet sowie Missionen oder Kaperbriefe erfüllt.<n><n>Steigert Ihr Euer Ansehen bei einer Nation nicht, so sinkt es täglich um einen sehr kleinen Wert. Wie tief Euer Ansehen auf diese Weise sinken kann, hängt übrigens davon ab, wie viele Gebäude Ihr in den Städten einer Nation errichtet habt.<n><n>Das Ansehen beeinflusst Handelspreise und die Vergabe von Missionen in den Städten. Bei niedrigem Ansehen solltet Ihr Euch außerdem vor Militärkonvois in Acht nehmen!"
"0x1b33d8e6" = "Möglicherweise werden ungenutzte Waren transportiert!"
"0x1b407276" = "Produktion"
"0x1b416d15" = "Vermögen"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "Die Zahl der Bürger (Einwohner abzüglich Soldaten) in Tortuga muss spätestens am @D$EndDate$ wieder @I$Pop$ betragen, damit alle Betriebe wieder volle Arbeiterzahl haben."
"0x1b900424" = "Reisender"
"0x1ba04e6b" = "Ein Militärkonvoi der Nation %1 wurde von Schiffen der Nation %2 vernichtet."
"0x1ba7362a" = "Militärschiffe der Nation %1 haben einen Handelskonvoi der Nation %2 angegriffen."
"0x1bcad43f" = "Der %1 Freibeuter %2 hat sich heute unter falschen Namen in die Stadt begeben und eine große Unruhe unter den Arbeitern verursacht. Zwei Wochen lang wollen sie nun ihre Arbeit ruhen lassen."
