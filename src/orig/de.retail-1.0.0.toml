"0xcdf0b227" = "Einige Händler haben sich zusammengeschlossen und verlangen mehr Schutz in unseren Gewässern. Um ihren Forderungen Nachdruck zu verleihen, haben sie beschlossen, eine unserer Städte in der nächsten Zeit nicht mehr zu versorgen. Könnt Ihr mir und den Bürgern in dieser Sache helfen?"
"0xcdf0b228" = "Eine unserer Städte wird kaum noch von Händlern angefahren, da das Gerücht in die Welt gesetzt wurde, in der Stadt herrsche eine Seuche. Könnt Ihr mir helfen, die Stadt zu versorgen, bis niemand mehr an das Gerücht glaubt?"
"0xcdf0b229" = "In einer unserer Städte herrscht seit einiger Zeit Pestgefahr. Zu allem Übel bleiben nun auch noch die Händler von der Stadt fern. Könnt Ihr die Stadt unterstützen, bis sich die Lage verbessert hat?"
"0xcdf0b22a" = "In einer unserer Städte gab es in den letzten Tagen ein Pestopfer. Wir haben versucht, den Vorfall zu verheimlichen, aber es ist wohl etwas durchgesickert. Als Konsequenz haben sich viele Händler dazu entschlossen, die Stadt nicht mehr anzufahren. Ihr verfügt über eine stolze Handelsflotte. Könnt Ihr nicht die Versorgung der Stadt in der nächsten Zeit übernehmen?"
"0xcdfdf758" = "Eure Kampfschiffe haben den Angreifer in die Flucht geschlagen."
