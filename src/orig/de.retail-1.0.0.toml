"0xf64f1e5a" = "Ihr wisst, dass wir uns im Krieg befinden. Um @n$TargetNation$ wirtschaftlich zu schwächen, gebe ich Euch den Auftrag, @I$NumShips$ Handelsschiffe zu kapern oder zu versenken. Nehmt Ihr an? "
"0xf64f1e5b" = "Wir befinden uns im Krieg mit @n$TargetNation$. Daher solltet Ihr eine bestimmte Anzahl Handelsschiffe versenken oder kapern. Alles, was Ihr erbeutet, soll Euch gehören, mir geht es nur darum, @n$TargetNation$ wirtschaftlich zu schwächen. Seid Ihr dabei?"
"0xf64f1e5c" = "Ich frage mich, ob Ihr uns nicht im Krieg gegen @n$TargetNation$ unterstützen könnt. Ich möchte Euch gerne in eine bestimmte Gegend schicken und Euch beauftragen, dort Handelsschiffe zu kapern oder zu versenken. "
"0xf651cc3f" = "Holland und England haben Frieden geschlossen und Ihr könnt keine weiteren Städte mehr annektieren.<n><n>Ihr seid in diesem Szenario weit gekommen, jedoch habt Ihr es nicht geschafft, rechtzeitig genügend Städte für Holland zu gewinnen.<n><n>Im freien Spiel könnt Ihr in der gleichen Art Städte annektieren. Ihr müsst nur darauf achten, dass die Nation, deren Städte Ihr annektieren wollt, militärisch schwach ist. Außerdem muss die Nation, für die Ihr annektieren wollt, militärisch stark sein und es muss Krieg herrschen zwischen den Nationen.<n><n>Übrigens: Normalerweise erhaltet Ihr Landgeschenke zum Aufbau eigener Städte, wenn Ihr für einen Vizekönig Annektierungen durchführt. In diesem Szenario waren die Landgeschenke jedoch deaktiviert."
"0xf65a5a04" = "Nun könnt Ihr Euer Ansehen in %1 steigern, indem Ihr englische Schiffe und Städte angreift. Euer Ansehen bei den anderen Nationen sinkt dabei nicht."
"0xf65b6f4c" = "Heute traf der spanisch Freibeuter %1 auf einen englischen Militärkonvoi und wurde vernichtet."
"0xf65b6f4d" = "Heute traf der spanisch Freibeuter %1 auf einen französischen Militärkonvoi und wurde vernichtet."
"0xf65b6f4e" = "Heute traf der spanisch Freibeuter %1 auf einen holländischen Militärkonvoi und wurde vernichtet."
"0xf662124e" = "Der Konvoi des Piraten %1 wurde vernichtet."
"0xf669f78e" = "Die spanische Schatzflotte hat in der Stadt %1 angelegt"
"0xf67158d8" = "Freies Spiel"
"0xf680e197" = "%1 wartet am Marktplatz auf Euch."
"0xf6957b90" = "Schiffe im Hafen"
"0xf69c4221" = "Angriff auf %1"
"0xf6a84efd" = "Wir befinden uns in der Karibik im Jahre 1570. Eure Aufgabe ist es, vom unbedeutenden Händler zum einflussreichen Handelsunternehmer aufzusteigen. Dabei stehen Euch Mittel aus Warentransport, Handel, Aufbau, Politik und Piraterie zur Verfügung.<n><n>In diesem Szenario werdet Ihr die Grundlagen der Spielsteuerung erfahren. Dazu ist dieses Szenario wie alle anderen auch in mehrere Szenarioziele unterteilt. Ihr müsst alle Ziele erfüllen, um das Szenario erfolgreich zu absolvieren.<n><n>Schließt nun dieses Fenster mit dem Schließen-Button und beachtet das Ereignisfenster unten links.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Beachtet und befolgt die Hinweise im Ereignisfenster."
"0xf6bb9f8c" = "Preis"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "Grafikkarte"
"0xf6c77503" = "Das Versteck des Piraten %1 wurde entdeckt. Welcher heldenhafte Abenteurer wagt es, das Versteck anzugreifen und zu vernichten?"
"0xf6ec5ddc" = "In Tortuga gehen seltsame Dinge vor. Aufgrund einiger Ereignisse in der Vergangenheit wagt sich kaum noch ein Händler in die Stadt. Eure Aufgabe ist es, Tortuga so gut wie möglich bei der Versorgung mit Waren zu unterstützen.<n><n>Doch ist Euer Startkapital nicht gerade üppig: @g$StartGold$ stehen Euch als Bargeld zur Verfügung. Immerhin habt Ihr einen gut ausgestatteten Handelskonvoi im Hafen und einige Warenvorräte auf Lager.<n><n>Euer erstes Ziel ist es, das Bargeld auf @g$GoldGoal$zu bringen. Erfüllt dieses Ziel so schnell wie möglich, Ihr dürft aber nicht länger als 40 Tage benötigen.<n><n>Ein Tipp: Ihr solltet auf keinen Fall Eure Schiffe verkaufen, könnt aber Kredite aufnehmen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erhöht bis zum @D$EndDate$ Euer Bargeld auf @g$GoldGoal$."
"0xf70feddb" = "Ihr befindet Euch wieder im Hafen von Cartagena und Euer Konvoi „Santa Maria“ ist ausgewählt.<n>Wie Ihr seht, liegen im Konvoi bereits einige Waren: Baumwolle, Fleisch und Kakao.<n>Nun sucht einmal am Hafen das Handelsdock und klickt es mit ausgewähltem Konvoi an, denn wir wollen die Waren verkaufen."
"0xf70feddc" = "Im Handelsdock könnt Ihr zwischen der Stadt und Eurem Lager sowie Eurem Konvoi handeln.<n>Ihr könnt nun sehen, welche Waren in der Stadt und in Eurem Konvoi vorhanden sind. Mit den Pfeilen könnt Ihr Waren kaufen und verkaufen, wobei die Preise auf den Pfeilen stehen.<n>Verkauft nun einmal Eure Baumwolle."
"0xf70feddd" = "Vielleicht habt Ihr bemerkt, wie der Preis für Baumwolle gefallen ist, während Ihr die Ware verkauft habt.<n>Dies liegt daran, dass der Preis nach Angebot und Nachfrage in der Stadt bestimmt wird.<n>Indem Ihr Waren verkauft, wird die Nachfrage erfüllt und der Preis nimmt ab. Kauft Ihr Waren, kann der Preis zunehmen.<n>Kauft nun @a$SubGoal$ Weizen."
"0xf70fedde" = "Habt Ihr gesehen, wie der Preis für Weizen gestiegen ist? <n>Übrigens hängt der Preis, den Ihr für eine Ware bezahlt, nicht nur vom Angebot sondern auch von Eurem Ansehen in der Stadt ab.<n>Klickt nun einmal auf den Button mit dem Gebäude rechts unten vom Handelsfenster."
"0xf70feddf" = "Nun könnt Ihr zwischen Eurem Lager und der Stadt handeln.<n>In jeder Stadt, in der Ihr eine Produktion aufbauen wollt, müsst Ihr als erstes ein Lagerhaus bauen. In Eurer Startstadt habt Ihr immer bereits ein Lager.<n>Verkauft nun alle Waren, die sich im Lager befinden."
"0xf70fede0" = "Damit Ihr größere Mengen von Waren schneller handeln könnt, gibt es die drei Buttons mit den Zahlen 1, 10 und 100 ganz oben im Handelsfenster. Klickt einmal auf den Button 10 und beobachtet, wie sich die Preise ändern.<n>Ob Ihr 10 x 1 Ware kauft oder 1 x 10 Waren spielt keine Rolle: Der Gesamtpreis ist immer der Gleiche. Nun kauft @a$SubGoal$ Rum."
"0xf70fede1" = "In der Spalte ganz rechts im Handelsmenü stehen die Durchschnittspreise für die Waren, die Ihr gekauft habt. Da Ihr die Waren mit Gewinn verkaufen wollt, müsst Ihr eine Stadt finden, in der ein höherer Preis bezahlt wird.<n>Nun öffnet den Transfer zwischen Schiff und Lager, indem Ihr auf den 4. Button unten rechts klickt, den mit dem Kran."
"0xf70fede2" = "In diesem Fenster könnt Ihr Waren zwischen Konvoi und Lager verschieben. Ladet nun einmal alle Waren vom Lager in den Konvoi, falls sich dort noch Waren befinden, denn wir wollen die Waren in einer anderen Stadt verkaufen.<n>Schließt dann das Handelsfenster mit dem X-Button rechts unten."
"0xf70fede3" = "Wechselt nun auf die Seekarte und fahrt mit Eurem Konvoi nach Santa Marta. Betretet Santa Marta jedoch nicht, sondern macht einen Rechtsklick auf die Stadt, sobald der Konvoi in der Stadt eingetroffen ist. "
"0xf70fede4" = "Auf diese Weise öffnet sich auch das Handelsfenster von Santa Marta.<n>Ihr müsst also eine Stadt nicht extra betreten, um dort zu handeln.<n>Nun verkauft alle Waren, die Ihr an Bord Eures Konvois habt.<n>Schließt dann das Handelsfenster wieder."
"0xf7110875" = "Den Spielstand wirklich löschen?"
"0xf725f22c" = "Euer Konvoi liegt nun in Santa Marta. Klickt auf den Stadtnamen, um die Stadtinfo aufzurufen.<n>Ihr könnt das von der Seekarte aus machen oder dazu die Stadt betreten."
"0xf725f22d" = "In der Stadtinfo könnt Ihr sehen, welche Waren in der Stadt produziert werden.<n><n>Außerdem wird auch Euer Verhältnis zu Spanien angezeigt: Es ist freundlich! Ihr erhaltet also den bestmöglichen Preis in der Stadt.<n><n>Nun schließt dieses Fenster und seht Euch in der Stadt um."
"0xf725f22e" = "Klickt nun einmal auf das Einwohnersymbol links unter dem Stadtnamen, um den Warenbestand von Santa Marta anzuzeigen."
"0xf725f22f" = "Ihr könnt nun sehen, wie viele Waren die Stadt auf Lager hat und wie viele Waren verbraucht werden. Natürlich hängt die Höhe des Verbrauchs von der Einwohnerzahl der Stadt ab.<n>Am Verbrauch seht Ihr, wie viele Waren regelmäßig herbeigeschafft werden können. Jetzt schließt das Warenbestandfenster wieder."
"0xf725f230" = "Nun versucht einmal, ein paar Handelsgewinne zu machen.<n>Öffnet das Handelsfenster und kauft soviel Baumwolle, Zucker und Kakao, wie in Euren Konvoi passt, denn diese Waren werden hier produziert.<n>Fahrt dann zurück nach Cartagena, um die Waren mit Gewinn wieder zu verkaufen."
"0xf725f231" = "Ihr habt soeben zwei Nachrichten erhalten, in der Euch ein paar Tipps für den erfolgreichen Handel gegeben werden.<n>Öffnet nun das Logbuch und seht Euch die Nachrichten an.<n>"
"0xf725f232" = "Verkauft nun alle Waren, die Ihr über dem Durchschnittspreis verkaufen könnt und kauft neue Waren ein.<n>Übrigens: Bei Waren, die in einer Stadt knapp sind, werden die Preise rot eingefärbt. Für diese Waren erhaltet Ihr immer gute Preise.<n>"
"0xf725f233" = "Gouverneursstädte wie Cartagena erhalten Importwaren aus Europa.<n>Diese könnt Ihr meist mit Gewinn an Kolonialstädte wie Santa Marta, Maracaibo oder Gibraltar verkaufen.<n>Handelt nun eine Weile selbstständig.<n>Euer Ziel ist es, durch Handel auf @g$GoldGoal$ Bargeld zu kommen."
"0xf7346191" = "Händler aus %1"
"0xf73619d7" = "Piratenversteck wurde bekannt"
"0xf7370c4b" = "%1,<n>ich bin nicht entzückt, Euch zu sehen. Haben wir etwas geschäftliches zu besprechen? So kommt denn herein, wenn es sein muss."
"0xf73bf67d" = "Begebt Euch in die Stadtansicht von Cartagena.<n>Normalerweise müsst Ihr einen Konvoi im Hafen einer Stadt haben, um die Stadt zu betreten. In Cartagena jedoch habt Ihr ein Lager, daher dürft Ihr die Stadt immer betreten.<n>Klickt in Cartagena die Werft an."
"0xf73bf67e" = "Nun kauft in der Werft ein kleines Schiff. Gebt nicht zuviel Geld aus, denn Ihr benötigt noch Reserven für den Handel und die Unterhaltskosten Eures Schiffes."
"0xf73bf67f" = "Im letzten Szenario habt Ihr gelernt, dass man einem Konvoi Schiffe hinzufügt, indem man einen Rechtsklick auf den Hafen macht.<n>Nun sollt Ihr aber einen weiteren Konvoi bilden, indem Ihr in der Kneipe einen Kapitän anstellt.<n>Sucht nun die Kneipe im Stadtzentrum und klickt sie an."
"0xf73bf680" = "Kapitäne findet Ihr immer in der Kneipe. Sofern sich in der Stadt ein Kapitän aufhält, ist es der dritte Button im Menü der Kneipe.<n>Habt Ihr noch andere Schiffe oder Konvois im Hafen, so müsst Ihr dem Kapitän mitteilen, wo Ihr ihn einsetzen wollt.<n>Gebt nun an, dass sich der Kapitän auf Euer neues Schiff begeben soll."
"0xf73bf681" = "Herzlichen Glückwunsch! Ihr habt Euren ersten Konvoi gebildet. Eure Aufgabe ist es nun, Euer Vermögen auf @g$GoldGoal$ zu steigern. Im Logbuch unter „Erfolge“ könnt Ihr jederzeit Euer Vermögen ablesen.<n><n>Viel Glück!"
"0xf73dab55" = "Danke, dass Ihr meinen letzten Auftrag erfüllt habt."
"0xf73dab56" = "Ich möchte mich bei Euch für die Durchführung meines letzten Auftrages bedanken."
"0xf73dab57" = "Ich schulde Euch Dank für Eure Unterstützung."
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "Ihr beginnt Eure Karriere mit <o:0xFFF2FAAD>%1<o> Goldstücken und einer <o:0xFFF2FAAD>Pinasse<o> (60 Tonnen, max. 8 Kanonen)."
"0xf7534d8f" = "Wenn Ihr Siedler in eine Stadt bringt, die Bedarf an Arbeitern hat, bedanken sich die Siedler beim Ausladen mit einem Fahrtgeld.<n><n>Um Kolonialwaren wie Kakao zu produzieren, wird stets eine kleine Menge Werkzeug benötigt. Fehlen diese Werkzeuge, so bleibt die Produktion stehen. Ihr könnt später, wenn Ihr etwas mehr Übung mit Preisen und Mengen habt, Euren Lagerverwalter anweisen, Werkzeuge regelmäßig in der Stadt einzukaufen. Sicherer ist es zunächst aber, wenn Ihr den Einkauf selbst erledigt.<n><n>Dies ist Eure nächste Aufgabe. Anschließend steht der Kakaoproduktion nichts mehr im Wege.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produziert Kakao und legt Euch einen Vorrat von @a$AmountGoal$ im Lager an."
"0xf760fd2a" = "Ich danke Euch. Hier sind Eure %1. Ich bin noch bis zum %2 hier. Bis dahin könnt Ihr mir weitere Waren bringen."
