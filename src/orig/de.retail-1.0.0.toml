"0x072a9579" = "Ich danke Euch, dass Ihr mir die Importwaren gebracht habt, denn viele Wochen lang wurden wir in der neuen Welt nicht durch die Transportkonvois meiner Nation versorgt. Zur Belohnung schenke ich Euch zwei holländische Handelsfleuten. Sie stehen im Hafen für Euch bereit."
"0x0744a699" = "Ich kann Euch nicht sagen, wie viele Städte die Schatzflotte noch anfahren wird. Sicher ist nur, dass sie in jeder Stadt mehr Gold an Bord holt. Wann Ihr sie angreift, ist mir gleich, denn das Gold dürft Ihr behalten. Ihr sollt nur sicherstellen, dass die Schatzflotte verschwindet. Zuletzt war sie in @T$StartTown$, als nächstes legt sie in @T$DestTown$ an, wo sie etwa 5 Tage vor Anker liegen wird. Ihr müsst Euch also beeilen."
"0x0744a69a" = "So handelt schnell. Zuletzt war sie in @T$StartTown$, von dort aus ist sie nach @T$DestTown$ aufgebrochen, wo sie länger als sonst vor Anker liegen wird. Je länger Ihr mit Eurem Angriff wartet, desto mehr Gold hat sie an Bord. Ihr dürft alles behalten, doch die Schatzflotte darf Europa niemals erreichen."
"0x0744a69b" = "Das ist ein Wort, ich danke Euch. Wenn meine Informationen stimmen, hat die Schatzflotte kürzlich @T$StartTown$ verlassen und befindet sich auf dem Weg nach @T$DestTown$. Dort hat sie ausnahmsweise einen längeren Aufenthalt. Nun beeilt Euch und fangt den Konvoi ab."
"0x0746253d" = "Wenn Ihr also wollt, dass möglichst viele andere Händler in Eure Stadt kommen, solltet Ihr Eure Stadt mit einigen Waren einfach nicht versorgen. Am Besten wählt Ihr die Waren, die in näherer Umgebung produziert werden, denn auch die Reisezeit spielt für Händler eine Rolle.<n><n>Händler, die Eure Stadt besuchen, kaufen automatisch Waren ein, die in größerer Menge und niedrigem Preis vorhanden sind. Ihr könnt also Eure produzierten Waren auch direkt an Eure Stadt verkaufen. Solange die Waren nicht teurer sind als in anderen Städten, werden sie regelmäßig von Händlern mitgenommen.<n><n>Dies hat den Vorteil, dass immer genug Waren für Eure Bürger vorhanden sind und Ihr Euch außerdem nicht um den Transport der Waren in andere Städte kümmern müsst."
"0x0747b567" = "Konvoi zerstören"
