"0xc557fe31" = "In %1 ist eine Seuche ausgebrochen. Die Lebensqualität ist gesunken und der Verbrauch an Kleidung und Holz für einen Monat doppelt so hoch. Solange die Seuche anhält, sterben täglich Bürger der Stadt und Händler fahren die Stadt ungern an."
"0xc558e134" = "Wenn Ihr also wollt, dass möglichst viele andere Händler in Eure Stadt kommen, solltet Ihr Eure Stadt mit einigen Waren einfach nicht versorgen. Am Besten wählt Ihr die Waren, die in näherer Umgebung produziert werden, denn auch die Reisezeit spielt für Händler eine Rolle.<n><n>Händler, die Eure Stadt besuchen, kaufen automatisch Waren ein, die in größerer Menge und niedrigem Preis vorhanden sind. Ihr könnt also Eure produzierten Waren auch direkt an Eure Stadt verkaufen. Solange die Waren nicht teurer sind als in anderen Städten, werden sie regelmäßig von Händlern mitgenommen.<n><n>Dies hat den Vorteil, dass immer genug Waren für Eure Bürger vorhanden sind und Ihr Euch außerdem nicht um den Transport der Waren in andere Städte kümmern müsst."
