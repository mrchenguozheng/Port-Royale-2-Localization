"0x132a8a31" = "%1 hat den Freibeuter %2 aktiviert, um unsere Städte zu sabotieren. Erst kürzlich ist er gegen %3 vorgegangen, nun befindet er sich auf dem Weg zu seiner Heimatstadt. Ihr würdet mir und meiner Nation einen großen Gefallen tun, wenn Ihr diesen Freibeuter aufhaltet."
"0x132a8a32" = "Ich habe gerade erfahren, dass der Freibeuter %1 kürzlich %2 verlassen hat, um gegen eine unserer Städte vorzugehen. Ich hoffe, wir können Ihn aufhalten, bevor er zuschlägt. "
"0x132a8a33" = "Der Freibeuter %1 ist im Auftrag von %2 unterwegs, um unsere Städte zu schädigen. Ich konnte in Erfahrung bringen, dass er sich derzeit in %3 aufhält, um seine nächste Aktion vorzubereiten."
"0x132e00ca" = "Das macht mich glücklich! Von heute an ist die Feindschaft zwischen uns vergessen."
"0x13385f0f" = "Schön. Durch den Kaperbrief steht Ihr nun offiziell im Dienst der Holländer und nehmt am Krieg gegen England teil. Daher könnt Ihr nun englische Händlerkonvois angreifen, ohne dass Euer Ansehen in Holland, Frankreich und Spanien sinkt.<n><n>In England sinkt Euer Ansehen natürlich weiterhin, und Ihr solltet in englischen Gewässern auf die Militärkonvois achten, die fortan Jagd auf Euch machen.<n><n>Die englischen Städte liegen alle südöstlich von Turk Islands. Geht dort mit Eurem Konvoi auf Kaperfahrt und sucht nach geeigneten Handelskonvois. Verkauft die erbeuteten Waren und die kleineren Schiffe, um Euer Vermögen zu steigern.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Kapert drei englische Handelskonvois: entert deren Schiffe und nehmt sie in Euren Konvoi auf. "
"0x133e8429" = "und der Hafen ist ausreichend gesichert."
"0x13475956" = "Betatest-Leitung, Mastering"
"0x13493847" = "Der Konvoi befindet sich in Reparatur und kann nicht verschickt werden.<n>Wollt Ihr die Reparatur des Konvois abbrechen?<n>Ihr erhaltet kein Gold zurück!"
"0x13601073" = "Danke, dass Ihr mir die Dokumente gebracht habt. Als Belohnung überlasse ich Euch eine Barke. Ihr findet sie im Hafen."
"0x13601074" = "Vielen Dank für die Unterstützung und dass Ihr mir meine Tagebücher wiedergebracht habt. Als Belohnung überlasse ich Euch eine Barke. Ihr findet sie im Hafen."
"0x13601075" = "Danke, dass Ihr mir die Dokumente gebracht habt. Als Belohnung überlasse ich Euch eine Barke. Ihr findet sie im Hafen."
