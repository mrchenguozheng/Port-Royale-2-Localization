"0xf55df2cf" = "(Waren durch Verschieben zuordnen)"
"0xf562862e" = "Seit einiger Zeit schon werden unsere Kolonien von Emporkömmlingen bedroht und es kommt immer wieder zu Übergriffen auf Konvois und Städte!<n><n>Der weise Magister hat sich deshalb entschlossen, mit den besten Patrioten aus dieser, seiner Lieblingsstadt im Namen des Rey Phillip in der Karibik den „Paz Española“ zu verteidigen!<n><n>Um mächtige Streiter zu finden, hat jeder Aspirant schwere Prüfungen zu erfüllen. Diese Prüfungen werden alle Fähigkeiten eines wagemutigen Caballero testen, Witz, Geschick, Kampfkraft, Strategie, Diplomatie, List und vor allem Schnelligkeit, denn unsere Feinde schlafen nicht.<n><n>Die erfolgreichsten Teilnehmer werden ausgestattet mit besonderen Kleinodien aus dem Besitze Magisters.<n><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Wettbewerbsziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n>Erfüllt die Missionen im Logbuch und schickt den Spielstand an die Wettbewerbs-Jury."
"0xf5684e84" = "Fallend"
"0xf56f3d78" = "Gut, so macht Euch dann auf den Weg und vernichtet einen Konvoi des Piraten Blackbeard. Vorher solltet Ihr aber noch Euren Konvoi stärken."
