"0xf9404c19" = "Ich kann Euch derzeit leider nicht sagen, wo Ihr einen Blackbeard- Konvoi finden könnt, denn sie halten sich momentan im Verborgenen. Doch ich lasse Euch genug Zeit für den Auftrag. Vernichtet einen Konvoi bis zum @D$EndDate$."
