"0x273267f2" = "Oh, es ist nicht zu fassen. Trunkenbolde haben mir mein schönes Schiff gestohlen. Sie haben haufenweise Rumflaschen geladen und sind dann auf und davon. Könnt Ihr mir nicht helfen und mein Schiff suchen gehen?"
"0x273267f3" = "Ich hätte es wissen müssen. Mein nichtsnutziger Sohn Boris hat sich mein schönstes Schiff ausgeliehen. Nun habe ich erfahren, dass er zusammen mit seinen Freunden einen Vatertagsausflug gemacht hat. Bestimmt haben sie wieder den ganzen Laderaum voller Rum und ich sehe mein Schiff nie mehr wieder. Könnt Ihr mir nicht das Schiff zurückholen?"
"0x27344ff4" = "Ich danke Euch für die rechtzeitige Lieferung, der Gouverneur wird entzückt sein. Das Hochzeitsfest soll noch heute beginnen!"
"0x273d7e0f" = "Alle Eure Matrosen haben bereits maximale Moral."
