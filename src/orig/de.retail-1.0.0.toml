"0x20ff905e" = "Besatzung"
"0x2106ce9e" = "In der Kneipe wartet ein erfahrener Kapitän."
"0x21117682" = "<n><n>Normalerweise könnt Ihr erworbene Konzessionen wieder zurückgeben. Da %1 aber Eure Startstadt ist, ist das nicht möglich."
"0x21117683" = "<n><n>Wollt Ihr Eure Konzession wieder zurückgeben?<n>Bedenkt, dass ich Euch nichts dafür bezahlen kann!"
"0x211c8552" = "Maximale Spieldauer erreicht"
"0x2137ec23" = "Ich danke Euch. Bis zum @D$Date$ bezahle ich Euch hohe Preise für Wein, Werkzeug und Gewürze. Trefft Euch am Marktplatz mit meinem Abgesandten und liefert je @a$Amount$. Er nimmt die Lieferung nur vollständig entgegen und bezahlt Euch sofort."
"0x2137ec24" = "Das klingt gut. So fahrt die Städte unserer Feinde an und kauft dort Importwaren auf. Liefert je @a$Amount$ bis zum @D$Date$ an meinen Abgesandten am Marktplatz von @T$TOWN$, er bezahlt mehr als das Doppelte des üblichen Preises."
"0x2137ec25" = "Wisst Ihr was am Besten wäre? Die Importwaren in @n$Nation2$ aufzukaufen, so dass dort ein Engpass entsteht. Liefert je @a$Amount$ am Marktplatz ab. Mein Abgesandter wartet dort bis zum @D$Date$ und zahlt Euch einen hohen Preis."
"0x215e37a6" = "Ich habe kürzlich ein Gespräch belauscht, in dem ein Händler erzählt hat, ihm sei auf See ein Schiff gesunken. Dies sei aber nicht weiter schade gewesen, denn es war nur ein alter Kahn. Doch an Bord war eine besondere Truhe."
"0x215e37a7" = "Wir haben also eine Abmachung. Auf meiner letzten Fahrt, auf der ich angeheuert hatte, hat sich der Kapitän aus einem mir nicht bekannten Grund über eine Truhe geärgert, die er dann kurzerhand über Bord werfen ließ."
"0x215e37a8" = "Ein ehemals guter Freund von mir hat sich aus dem Staub gemacht und mir eine kostbare Truhe gestohlen."
"0x2167838b" = "Schiffskauf"
"0x21743bf7" = " Ich will die Sachen unbedingt haben. Die genaue Stelle, an der das Schiff sank, wurde nicht genannt. @l$ChestPos$ Bringt mir die Kiste bis zum @D$EndDate$."
"0x21743bf8" = " Ihr müsst mir die Sachen bis zum @D$EndDate$ beschaffen. @l$ChestPos$"
"0x21743bf9" = " Kürzlich hat er mir geschrieben, dass er diese Truhe über Bord geworfen hat. @l$ChestPos$ Ihr müsst mir meine Sachen unbedingt wiederbringen. Ich bin bis zum @D$EndDate$ hier anzutreffen."
"0x217923cb" = "Ende der Warenübergabe: %1"
"0x2190d204" = "Ein örtlicher Händler ist bereit, Euch %1 für den Betrieb zu bezahlen."
"0x21a69afe" = "Marketing Director"
"0x21b0dfff" = "%1 plündert %2"
"0x21b3050a" = "Ein Militärkonvoi hat die Hafenverteidigung der Stadt zerstört und Waren geplündert. Der Status der Stadt ist ebenfalls gesunken."
"0x21bdc952" = "nächster Graph"
"0x21bf83f0" = "Permanente Schiffsinfoanzeige"
"0x21c2f2cf" = "<n><o:0xffC00000>Mission nicht erfüllt. <o:0xff000000>"
"0x21cae149" = "Sehr gut. Nun müsst Ihr Euren Konvoi stärken, damit Ihr es mit mehreren Militärkonvois aufnehmen könnt. Ihr solltet mindestens drei Schiffe des Typs Fregatte oder höher in Eurem Konvoi haben.<n><n>Ihr könnt die Schiffe kapern oder versuchen, sie in den Werften der Gouverneursstädte zu kaufen.<n><n>Macht diese Schiffe dann zu Geleitschiffen und sorgt dafür, dass sie volle Bewaffnung und Matrosenzahl haben.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Rüstet Euren Konvoi so auf, dass er aus mindestens drei vollbewaffneten und vollbesetzten Geleitschiffen des Typs Fregatte oder höher besteht."
"0x21d142f5" = "Konvoi in dieser Stadt reparieren"
"0x21e727b4" = "Sicherlich habt Ihr schon von dem Piraten @P$PirateName$ gehört. Er verfügt bereits über @I$NumConvoys$ Konvois und sein Versteck ist uns noch nicht bekannt. Glücklicherweise kennen wir den Aufenthaltsort eines Konvois. Vielleicht ist er noch in der Nähe. Ich gebe Euch den Auftrag, diesen Konvoi zu vernichten. "
"0x21e727b5" = "Wir müssen schnell handeln, denn gerade habe ich erfahren, wo sich ein Konvoi des Piraten @P$PirateName$ befindet. Findet und vernichtet diesen Konvoi."
"0x21e727b6" = "Jeder Pirat hat ein eigenes Versteck, von dem aus Konvois auf Beutefang geschickt werden. Pirat @P$PirateName$ hat mittlerweile @I$NumConvoys$ Konvois. Durch Zufall haben wir erfahren, wo sich ein bedeutender Kapitän dieser Sippe mit seinem Konvoi vor kurzem aufgehalten hat. Ihr sollt diesen Konvoi finden und vernichten."
"0x21f9ce44" = "Hungersnot in %1"
"0x2204d118" = "Einsatzfähige Betriebe/Gesamt"
"0x22163917" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_SCHIFF_800x600.screen>"
"0x2225ed1a" = "Schiffsjagd"
"0x22385c1b" = "Schiff"
"0x22385c1c" = "Normal"
"0x22385c1d" = "Gold"
"0x22481c3e" = "Mieter / Maximal"
"0x22497d5c" = "Der Status der Stadt ist niedrig."
"0x22584831" = "Pirat treffen"
"0x226068b3" = "Schlechter Zustand"
"0x227ca1f5" = "<f:fonts/Tiepolo_black13x13aaFHk.res>Hafen der Stadt schützen<n><f:fonts/Tiepolo_bold13x13aaFHk.res>(Konvoi im Hafen und Geleitschiff vorhanden)"
"0x22a3b6d0" = "Schatzsuche"
"0x22b99c70" = "Soll das zuletzt gebaute Lagerhaus abgerissen werden?"
"0x22caa09f" = "%1. %2 %3"
"0x22e58881" = "Angriffsmodus"
"0x22fffe32" = "Geliebter %1,<n>ich kann meine Ungeduld kaum noch im Zaum halten. So eilet schnell zum Markt und liefert die Waren für die Hochzeit ab, damit das Fest bald stattfinden kann."
"0x2310e7f4" = "Erfüllt die Annektierungsmission, um das nächste Szenarioziel anzuzeigen."
"0x2335f663" = "Danke, dass Ihr mir das Paket wiederbringt. Hier ist Eure Belohnung von @g$Reward$."
"0x234d00d9" = "Der Pirat %1 treibt seit heute sein Unwesen in der Karibik."
"0x23652698" = "Ich kann Euch leider nichts genaues sagen. Von meinem Hafenmeister bekam ich eine vage Beschreibung des Schiffs, mit dem sie geflohen sein könnte. Dieses Schiff wurde von einem Händler auf See ausgemacht. Er hat mir die Stelle gezeigt. @l$Pos$ Sucht diese Gegend ab, vielleicht findet Ihr einen Anhaltspunkt."
"0x23652699" = "@l$Pos$ Sucht diese Gegend ab, vielleicht findet Ihr einen Anhaltspunkt. Bitte bringt mir meine Tochter heil wieder zurück."
"0x2365269a" = "@l$Pos$ Sucht diese Gegend ab, vielleicht wollte @F$WifeName$ uns damit etwas mitteilen. Bitte bringt mir meine Tochter heil wieder zurück. Und wenn Ihr den Casanova findet, bestellt ihm schöne Grüße von mir."
"0x23815ece" = "Möchtet Ihr das laufende Spiel wirklich beenden und zum Hauptmenü zurückkehren?"
"0x2388c117" = "(benötigte Waren nicht an Bord)"
"0x238c039b" = "Festausrichter"
"0x239bed4a" = "Dem Konvoi können nicht mehr als 10 Schiffe hinzugefügt werden."
"0x23a8f980" = "Laden / Speichern"
"0x23f0ed65" = "Wir befinden uns im Krieg mit @n$HostileNation$. Einer meiner Kapitäne hatte kürzlich eine sehr interessante Idee, um @n$HostileNation$ zu demoralisieren. Er hat vorgeschlagen, einen Militärkonvoi aus den Schiffen unseres Feindes zu bilden, um sie dadurch sozusagen mit ihren eigenen Waffen zu schlagen.<n>Ihr scheint mir der Richtige zu sein, um diese Schiffe zu besorgen."
"0x23f0ed66" = "Da wir uns mal wieder im Krieg mit @n$HostileNation$ befinden, möchte ich einen neuen Konvoi zum Schutz meiner Stadt bilden. Ich habe nämlich keine Lust, darauf zu warten, bis mir aus Europa ein neuer Militärkonvoi zugeteilt wird.<n>Leider sind meine Mittel gerade sehr begrenzt und so kam ich auf die Idee, die Schiffe unseres Feindes einzusetzen. Wollt Ihr mir helfen, einige Schiffe des Typs @S$ShipType$ zu beschaffen?"
"0x23f33e8d" = "Konvoi"
