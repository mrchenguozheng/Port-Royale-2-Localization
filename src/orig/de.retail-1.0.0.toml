"0xdfb549a4" = "Wir befinden uns im Krieg mit %1, unser Gegner hat aber nicht genügend Militärkonvois, um die Gewässer zu schützen. Ihr sollt diese Schwäche ausnutzen und eine Stadt annektieren."
"0xdfb549a5" = "%1 hat zuwenig Militärkonvois, um die Gewässer zu schützen! Wir sollten sofort losschlagen und eine Stadt annektieren!<n>Kann ich auf Euch zählen?"
"0xdfb9b5b7" = "Hervorragend. Ihr habt @g$Gold$ erhalten.<n><n>Jede Nation hat Militärkonvois, um ihre Städte und die Gewässer um die Städte zu schützen. Je mehr Städte eine Nation hat, desto mehr Militärkonvois benötigt sie auch, um für genügend Sicherheit sorgen zu können.<n><n>Verliert eine Nation einen Militärkonvoi, so wird sie dadurch militärisch geschwächt. Da ein solcher Konvoi im Kriegsfall relativ aggressiv gegen Städte und Konvois der feindlichen Nationen vorgeht, bleibt es nicht aus, dass eine Nation hin und wieder einen Militärkonvoi verliert. Aus diesem Grunde werden regelmäßig Konvois aus Europa entsandt, um die Nationen in der Neuen Welt zu stärken.<n><n>Wie stark eine Nation ist, könnt Ihr in der Chronik unter „Nationen“ nachsehen. Gilt eine Nation als schwach, so können deren Städte annektiert werden.<n><n>Ihr sollt nun so viele englische Militärkonvois besiegen, bis die Stärke Englands als „schwach“ eingestuft wird.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Besiegt so viele englische Militärkonvois, bis England als „schwach“ eingestuft wird."
