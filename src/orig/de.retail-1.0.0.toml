"0xcb853f07" = "Euer Kapitän hat den Fechtkampf gegen den Kommandant gewonnen. Eure Leute machen sich auf den Weg zur Schatzkammer und erbeuten %1.<n><n>Wählt nun, welche Waren Ihr aus dem Lager der Stadt plündern wollt."
