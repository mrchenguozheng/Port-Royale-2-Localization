"0x13cc600d" = "Managing Director Ascaron UK"
"0x13cd046e" = "Immer, wenn Ihr für einen Vizekönig Städte einer feindlichen Nation annektiert, schenkt er Euch zum Dank etwas Land. Auf diesem Land könnt Ihr eine Stadt errichten, die nur Euch gehört und in der nur Ihr Gebäude errichten könnt. Jeder Vizekönig kann Euch so zu einer eigenen Stadt verhelfen!<n><n>Euer nächstes Ziel ist es, Euer Ansehen in Spanien zu erhöhen, denn ein Vizekönig empfängt Euch nur, wenn Ihr ein hohes Ansehen bei seiner Nation habt.<n><n>Euer Ansehen bei einer Nation könnt Ihr beispielsweise in der Stadtansicht unter dem Stadtnamen sehen. In Eurer Startstadt Margarita werden 3 Flaggen angezeigt, d.h. Euer Ansehen in Spanien ist „neutral“.<n><n>Ihr steigert Euer Ansehen bei einer Nation, indem Ihr Missionen für deren Gouverneure erfüllt, Piraten jagt oder mit den Städten handelt und benötigte Waren abliefert.<n><n>Da Krieg zwischen Spanien und Frankreich herrscht, bietet es sich auch an, dass Ihr beim Gouverneur von Margarita einen Kaperbrief gegen Frankreich erwerbt. Kaperfahrten erhöhen das Ansehen schnell.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Steigert Euer Ansehen in Spanien auf freundlich."
"0x13d92dd7" = "%1 (%2)"
"0x13ec9ac1" = "Ihr habt eine Aktion durchgeführt, durch die das Szenario nicht mehr erfolgreich absolviert werden kann.<n><n>Bitte haltet Euch an die Anweisungen im Ereignisfenster."
"0x1401d917" = "@s$USER$, ich könnte Euch etwas verraten, was Euch bestimmt @g$Price$ wert ist. Mein Schwager kennt nämlich @N$TeacherName$, einen Kapitän, der sich zur Ruhe gesetzt hat."
"0x1401d918" = "Setzt Euch zu mir und gebt mir Rum aus, ich habe Euch etwas zu berichten. Auf meiner letzten Fahrt habe ich @N$ContactName$ kennen gelernt. Er war ein Freund und Schüler des legendären @N$TeacherName$. "
"0x1401d919" = "@s$USER$, setzt Euch zu mir, ich weiß, wie Ihr einen Eurer Kapitäne ausbilden lassen könnt. Könnt Ihr Euch an @N$TeacherName$ erinnern? "
