"0x11e79f57" = "Einführungsszenario<n><n>In Port Royale 2 ist es Eure Aufgabe, vom unbedeutenden Händler zum einflussreichen Handelsunternehmer aufzusteigen. Dabei stehen Euch Mittel aus Warentransport, Handel, Aufbau, Politik und Piraterie zur Verfügung.<n:25>In diesem Einführungsszenario lernt Ihr die Grundlagen der Spielsteuerung. Dazu ist dieses Szenario - wie alle anderen auch - in mehrere Szenarioziele unterteilt."
