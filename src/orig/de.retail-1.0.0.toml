"0x2ad0de32" = "im Hafen"
"0x2ae68b1b" = "Es ist eine besondere Genugtuung für mich zu wissen, dass Ihr Blackbeard in die Schranken gewiesen habt. Daher schenke ich Euch noch eine spanische Galeone. Sie befindet sich im Hafen und steht zu Eurer Verfügung. <n><n>Ach, und was soll’s. Ich gebe Euch noch einmal @g$Reward$."
"0x2ae68b1c" = "Und wieder bin ich sehr erfreut über die erneute Niederlage des gemeinen Blackbeard. Ich soll Euch außerdem einen besonderen Gruß von meiner Frau ausrichten. Sie schenkt Euch ihre spanische Galeone, und damit meine ich nicht unsere Köchin.<n><n>Und von mir bekommt ihr noch mal @g$Reward$."
"0x2b0bca45" = "Das Schiff mit dem Spion ist von @T$HostileTown$ in Richtung Europa gefahren und verlässt die Karibik im Osten. Sucht auf der Route nach mehreren Dokumenten und bringt sie bis zum @D$EndDate$ dem Gouverneur von @T$TOWN$."
"0x2b3109a2" = "<n>Ihr habt zu wenig Bares. Kommt wieder, wenn Ihr es Euch leisten könnt."
