"0x3641d8d1" = "Ich danke Euch, dass Ihr mir meine Frau zurückgebracht habt. Zwar habe ich die Ruhe der letzten Tage sehr genossen, doch kann ich meine Frau doch nicht meinen Feinden überlassen. Zu Eurer Belohnung: Hier habt Ihr eine Karte mit einem Versteck, an dem @a$Amount$ Waren zu finden sind."
"0x3641d8d2" = "So, Ihr habt mir meine Frau also nicht zurückgebracht! Dann kann ich Euch auch keine Belohnung geben. Aber unter uns gesagt: ich bin Euch sehr dankbar."
"0x36573a59" = "Die Überlegenheit Eurer Truppen wird immer deutlicher. Plötzlich erscheint über der Stadtmauer die weiße Flagge: die Stadtwache kapituliert!<n><n>Was soll nun geschehen?"
"0x3657dd22" = "Meine Frau freut sich sehr, dass Ihr den Hund gefunden habt. Hier habt Ihr eine Karte mit einem Versteck, an dem @a$Amount$ Waren zu finden sind."
"0x3657dd23" = "Seid Ihr verrückt, den Hund über Bord zu werfen? Aber ich danke Euch. Offiziell kann ich Euch nicht belohnen, aber ich habe einst einen Schatz versteckt, von dem niemand weiß. Hier, ich gebe Euch die Karte dazu."
"0x366de173" = "Oh ich danke Euch, dass Ihr mir meine geliebte Tochter zurückgebracht habt. Hier, ich gebe Euch eine Karte. Auf Ihr ist eingezeichnet, wo ich einst einen großen Schatz versteckt habe."
"0x366de174" = "Was habt Ihr getan! Wie konntet Ihr meine Tochter in den Händen des Feindes zurücklassen. Ich werde ganz @n$Nation$ erzählen, dass man sich auf Euch nicht verlassen kann! (Ansehen in @n$Nation$ gesunken)"
