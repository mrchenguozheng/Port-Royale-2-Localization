"0xd07dbe34" = "Den größten Einfluss auf die Lebensqualität in einer Stadt hat der Warenbestand und die Vielfalt an Waren. Es müssen aber nicht alle Waren vorrätig sein, um die Bewohner bei Laune zu halten.<n><n>Die Waren einer Stadt teilen sich in 5 Gruppen auf: Grundwaren, Rohstoffe, Fertigwaren, Kolonialwaren und Importwaren. Im Handelsfenster sind sie auch in dieser Reihenfolge aufgelistet. Für eine gute Lebensqualität genügt es, wenn innerhalb jeder Gruppe 2-3 Waren in ausreichender Menge vorhanden sind.<n><n>Zum Thema Lebensqualität habt Ihr gerade einen Brief bekommen, den Ihr im Logbuch lesen könnt.<n><n>Da Eure Stadt noch klein ist, ist es besonders leicht, eine hohe Lebensqualität zu erreichen, denn die Bürger kleiner Städte sind nicht so anspruchsvoll. Es sollte daher für Euch kein Problem sein, für eine hohe Lebensqualität zu sorgen. Allerdings kann eine Stadt mit weniger als 2000 Einwohnern nicht über den Status „Aufschwung“ kommen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Sorgt dafür, dass in Eurer Stadt von jeder Ware 5 Fass vorrätig sind."
