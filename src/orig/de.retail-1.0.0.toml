"0xf52fee2f" = "Bekämpfen Sie Piraten, Militärkonvois feindlicher Nationen und Freibeuter<n><n>Ziehen Sie selbst als Freibeuter aus, um Händlerkonvois zu jagen<n><n>Machen Sie sich auf die Suche nach der legendären spanischen Schatzflotte<n><n>Steuern Sie 16 verschiedene Schiffstypen"
"0xf52fee30" = "Steuern Sie Ihren Kapitän in Fechtkämpfen gegen andere Kapitäne und Piraten<n><n>Absolvieren Sie unzählige Missionen aus den Bereichen Kampf, Handel und Politik"
"0xf52fee31" = "Erleben Sie 4 verschiedene Nationen mit unterschiedlichen Gebäudesets<n><n:10>Erfreuen Sie sich an variantenreicher Grafik durch verschiedene Vegetationen<n><n:10>Plündern und annektieren Sie Städte für Ihre Lieblingsnation<n><n:10>Errichten Sie eigene Städte<n><n:10>Kaufen Sie Betriebe anderer Händler auf und errichten Sie Warenmonopole<n><n:10><o:0xFFFFEB7D>...erobern Sie die gesamte Karibik!"
"0xf5496c7e" = "Laden"
