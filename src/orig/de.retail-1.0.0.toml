"0xca4930db" = "Ich grüße Euch, @A$USER$. Ich muss eine größere Warenladung @G$Goods$ nach @T$Town$ schaffen, doch leider hat mich mein Kapitän versetzt. Ich schlage Euch folgendes vor: Ihr gebt mir @g$PriceBuy$ als Sicherheit, transportiert @a$Amount$ nach @T$Town$ und erhaltet dort @g$PriceSell$ zurück. Was sagt Ihr?"
"0xca4930dc" = "@A$USER$, gut, dass ich Euch sehe. Ihr verfügt doch über eine große Handelsflotte. Ich muss nämlich @a$Amount$ @G$Goods$ verschiffen.<n>Ich schlage Euch vor, Ihr gebt mir @g$PriceBuy$ als Sicherheit und bringt die Waren nach @T$Town$. Dort erhaltet Ihr dann @g$PriceSell$ zurück."
"0xca4930dd" = "Ich stecke in der Klemme. Ich muss bis zum @D$EndDate$ @a$Amount$ @G$Goods$ nach @T$Town$ schaffen, mein Konvoi ist aber gerade schon mit einer anderen Warenlieferung unterwegs. Ich mache Euch folgendes Angebot: Bezahlt mir @g$PriceBuy$ als Sicherheit und liefert die Waren ab. Dann erhaltet Ihr @g$PriceSell$ zurück. Was haltet Ihr davon?"
"0xca6a6869" = "Speichern"
"0xca6f7275" = "Wir konnten das Versteck des Piraten %1 ausfindig machen. %2 Wie wäre es, wenn Ihr das Versteck angreift und diese Brut ein für allemal vernichtet, auf dass wieder etwas mehr Frieden in unsere Gewässer einkehrt?"
"0xca6f7276" = "Habt Ihr schon davon gehört, dass nun endlich bekannt wurde, wo der Pirat %1 sein Versteck hat? %2 %3 sucht nach einem Helden, der dieses Versteck ausräuchert. Seid Ihr dieser Held?"
"0xca6f7277" = "Die Position der Basis des berüchtigten Piraten %1 ist nun nicht mehr unbekannt. %2 Wir sollten dieser Sippe so schnell wie möglich den Garaus machen. Mir scheint, Ihr seid der richtige für die Aufgabe."
"0xca6f7278" = "Ihr habt kein sehr gutes Ansehen bei meiner Nation. Doch es gäbe da etwas, was Ihr tun könntet, um Euer Ansehen zu steigern.<n><n>Kürzlich wurde das Versteck des Piraten %1 bekannt. %2<n><n>Vielleicht seid Ihr ja der Richtige, der uns endgültig von dieser Sippe befreit. "
"0xcab1988a" = "%1 greift an"
"0xcac5b30b" = "Beten"
"0xcacc4fa8" = "Findet und vernichtet die Spanische Schatzflotte. Zuletzt war sie in @T$StartTown$, von dort aus nahm sie Kurs auf @T$DestTown$."
"0xcb2b0709" = "Ein Unglück! Habt Ihr heute schon @F$WifeName$ besucht? Ihr könnt Euch den Besuch schenken, denn sie ist weg. Hier, ich fand eine Art Abschiedsbrief. Sie schreibt, sie hatte das langweilige Leben satt und sei mit einem Abenteurer auf und davon. Ihr müsst mir meine geliebte Tochter zurückholen!"
"0xcb2b070a" = "Ein Unheil ist geschehen und mir scheint, Ihr hängt mittendrin. Meine Tochter ist von Piraten entführt worden, doch man hat Euch eine Nachricht hinterlassen mit einer Karte, auf der ein Ort eingezeichnet ist. Mir scheint es eine Falle zu sein, doch was sollen wir tun? Ihr müsst mir meine Tochter zurückholen!"
"0xcb2b070b" = "Ha! Meine Tochter und Eure Gemahlin ist mit einem meiner Offiziere der Stadtwache durchgebrannt! Ich hätte es wissen müssen! Nun sind beide weg, geflohen mit einem meiner Schiffe! Ihr müsst mir meine Tochter zurückholen und sie zur Vernunft bringen! Seltsamerweise habe ich in den Gemächern meiner Tochter eine Karte gefunden, auf der ein Ort markiert ist."
