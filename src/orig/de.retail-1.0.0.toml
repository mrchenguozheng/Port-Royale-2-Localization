"0x00bff5f3" = "Ihr habt nun eine Konzession in Cartagena und könnt dort Betriebe errichten. Euer nächstes Ziel wird sein, zwei Webereien in Cartagena in Betrieb zu nehmen. Die Weberei ist ein Fertigwarenbetrieb und benötigt Baumwolle als Rohstoff.<n><n>Die Rohstoffe müssen immer in Eurem Lager vorrätig sein, denn sonst kann ein Betrieb nicht produzieren. Er verursacht dann jedoch  hohe Kosten, denn jeder Betrieb kostet Unterhalt und muss Löhne an die Arbeiter bezahlen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Errichtet zwei Webereien in der Stadt Cartagena und produziert @a$AmountGoal$ Kleidung."
