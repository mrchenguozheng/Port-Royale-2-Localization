"0x1c703500" = "Der Gouverneur möchte Euch dringend sprechen."
"0x1c74c605" = "Ihr habt %1 erbeutet."
"0x1c7e1413" = "Ich danke Euch.<n>Ihr benötigt natürlich erst einmal eine Konzession in der Stadt, aber das schafft Ihr bestimmt.<n>Ich bezahle selbstverständlich alle Eure Ausgaben, sobald die Schule errichtet wird. Meine Frau hat am @D$EndDate$ Geburtstag, bis dahin muss der Grundstein für die Schule gelegt sein."
"0x1c7e1414" = "Schön. Beginnt mit dem Bau der Schule bis zum @D$EndDate$. Ich werde anschließend Eure Unkosten ersetzen.<n>Denkt daran, dass Ihr zunächst eine Konzession in @T$Town$ benötigt, wenn Ihr eine Schule bauen wollt.<n>Und erzählt meiner Schwester nichts von dem Auftrag."
"0x1c7e1415" = "Ich danke Euch! @T$Town$ wird nichts von unserer Abmachung erfahren. Beginnt mit dem Bau bis zum @D$EndDate$. Ich werde anschließend Eure Unkosten ersetzen.<n>Denkt daran, dass Ihr zunächst eine Konzession in @T$Town$ benötigt, wenn Ihr eine Schule bauen wollt."
"0x1c7e9deb" = "%1: Kreditsumme %2 zurückbezahlt."
"0x1c83647f" = "Waffen und Munition:"
"0x1ca41002" = "Szenario beendet"
"0x1ca50773" = "Schön, Ihr seid nun im Besitz eines ansehnlichen Konvois.<n><n>Eure nächste Aufgabe wird nicht leicht, denn Ihr sollt einen englischen Militärkonvoi angreifen und besiegen. Sicherheitshalber hat Euch der Gouverneur von Turk Islands noch ein weiteres Schiff zur Verfügung gestellt. Ihr findet es im Hafen von Turk Islands, damit Ihr es in Euren Konvoi aufnehmen könnt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vernichtet einen englischen Militärkonvoi."
"0x1ce621bb" = "Wohngebiet eines ansässigen Händlers"
"0x1ce62aab" = "Aktuelle Missionen"
"0x1ce81e5e" = "Spieltyp"
"0x1cf07333" = "Sehr schön, Ihr habt Euer erstes Ziel in @I$Days$ Tagen erreicht. Euer nächstes Ziel ist es, die Zahl der Bürger in der Stadt zu erhöhen. Dazu sollt Ihr 5 Betriebe bauen, einen von jedem Typ, der in der Stadt möglich ist.<n><n>Vergesst nicht, dass Tortuga nur von wenigen Händlern angefahren wird, Ihr müsst Euch also auch um die Versorgung der Stadt kümmern, damit der Status der Stadt hoch genug ist, um neue Siedler aufzunehmen. Vergesst auch nicht, für ausreichend Wohnraum zu sorgen.<n><n>Ihr habt 60 Tage Zeit, um dieses Ziel zu erreichen. Je früher Ihr es schafft, desto besser.<n><n>Hinweis: Soldaten zählen zwar zu den Einwohnern, aber nicht zu den Bürgern einer Stadt! Die Zahl der Bürger einer Stadt kann nur erhöht werden, indem Arbeitsplätze geschaffen werden.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Errichtet 5 verschiedene Betriebe in Tortuga und erhöht die Anzahl der Einwohner bis zum @D$EndDate$ auf 1500. Denkt auch an ausreichend Wohnraum! Pro Betrieb wird ein Wohngebiet benötigt."
"0x1d01f111" = "Sounds"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>An dieser Stelle muss das Schiff eines sehr erfahrenen Kapitäns gesunken sein. In der Kiste findet Ihr zwar kein Gold, jedoch ein genaues Tagebuch des Kapitäns @L$RandLName$. Die Erfahrung des Kapitäns im Konvoi @C$Convoy$ steigt dadurch um 2 Punkte."
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Die Schatzkiste ist zwar leer, doch diente sie als Schwimmer für ein Seil. In nicht allzu großer Tiefe entdeckt Ihr ein Versteck mit Kanonen, von denen Eure Mannschaft so viele wie möglich an Bord des Konvois hievt."
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Eine große Zahl mit Rumfässern schwimmt hier überall auf dem Wasser. Eure Leute holen soviel Fässer an Bord, wie Euer Konvoi noch tragen kann."
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Euer Konvoi ist auf eine große Holztruhe gestoßen. Sie wird sofort an Bord geholt und geöffnet. Endlich mal wieder ein richtiger Schatz, denkt der Kapitän, als er die @g$Gold$ erblickt."
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Im Wasser schwimmt eine alte, fast schon zerfallene Holzkiste. Was auch immer einst in Ihr aufbewahrt wurde: Außer einem widerlichen Geruch ist nichts mehr davon übrig. Trotzdem steigt die Moral Eurer Mannschaft, denn die Suche nach dem Schatz hat endlich ein Ende."
"0x1d19d29c" = "Baukonzession in %1"
"0x1d6d7bd9" = "und der Hafen ist optimal verteidigt."
"0x1db06b05" = "Paket suchen"
"0x1db7f908" = "Ihr habt es leider nicht geschafft, in der vorgegebenen Zeit ein Bargeld von @g$GoldGoal$ zu erreichen.<n><n>Verkauft die Waren, die in Eurem Lager in Tortuga liegen in den Städten, in denen sie knapp sind und achtet dabei auf Waren, die Ihr günstig einkaufen könnt.<n><n>Ihr könnt außerdem Kredite beim Schatzmeister von Tortuga aufnehmen."
