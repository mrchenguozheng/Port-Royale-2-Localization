"0x35392fbd" = "Herzlichen Glückwunsch, Ihr habt Euer erstes Szenario absolviert. Ihr wisst nun, wie man Konvois selektiert und zu anderen Städten schickt. Außerdem habt Ihr erfahren, wie man in einer Stadt Gebäude betreten kann, um dort Aktionen durchzuführen – wie beispielsweise das Kaufen eines Schiffs.<n><n>Im nächsten Kapitel geht es ums Geldverdienen mit erfolgreichem Warenhandel."
