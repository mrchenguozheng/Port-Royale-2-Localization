"0x0ad66781" = "Es gelingt Eurem Konvoi, die Hafenabwehr zu durchbrechen. Eure Matrosen begeben sich an Land und suchen ungehindert nach dem Piratenschatz. Sie erbeuten %1. "
"0x0adb3fdd" = "Ich wusste, ich kann mich auf Euch verlassen. Es handelt sich um die Stadt @T$TargetTown$ der Nation @n$HostileNation$. Greift die Stadt an und plündert sie von mir aus, dann könnt Ihr nach meiner Gemahlin suchen lassen. Doch beeilt Euch, man hat mir nur bis zum @D$EndDate$ Bedenkzeit gegeben.<n><n>Falls Ihr noch keinen Kaperbrief gegen @n$HostileNation$ habt, gebe ich Euch einen."
"0x0adb3fde" = "Meine Frau wird entzückt sein. Die Pudelsdame Michelle wird in @T$TargetTown$ versteckt. Plündert die Stadt, damit es nach einer militärischen Aktion aussieht und sucht dann nach dem Hund. Ich gebe Euch Zeit bis zum @D$EndDate$.<n>Glaubt mir, ich bin nicht froh, wenn Michelle wieder da ist, aber meine Frau heult noch mehr als vorher.<n><n>Falls Ihr noch keinen Kaperbrief gegen @n$HostileNation$ habt, gebe ich Euch einen."
"0x0adb3fdf" = "Das ist ein Wort. Bitte plündert @T$TargetTown$ und bringt mir meine Tochter zurück. Am @D$EndDate$ hat sie Geburtstag, dann muss sie wieder hier sein.<n><n>Falls Ihr noch keinen Kaperbrief gegen @n$HostileNation$ habt, gebe ich Euch einen."
"0x0b16cc19" = "2 herrenlose Schiffe"
"0x0b1a8b7f" = "Warenbestände vernichtet"
"0x0b25ca20" = "So soll es dann sein. Doch bevor ich Euch meine Tochter anvertraue, müsst Ihr die Waren für das Fest beschaffen. Trefft Euch am Markt mit meinem Festausrichter.<n><n>Nachdem Ihr alle Waren geliefert habt, findet das Fest sofort statt."
"0x0b2775c3" = " Ihr habt die Waren nicht rechtzeitig abgeliefert."
