"0xcb8dd6d9" = "@n$HostileNation$ schreckt wirklich vor nichts zurück. Meine Frau wurde entführt und ihre Freilassung wird mit bestimmten Bedingungen verknüpft. Ich weiß aber, wo sie gefangengehalten wird. Ich kann nichts offizielles unternehmen, aber Ihr könntet die Stadt angreifen und mir meine Frau zurückholen."
"0xcb8dd6da" = "Gut, dass Ihr gerade jetzt kommt.<n>Meine Frau hat erst kürzlich einen frisierten Pudel aus Paris bekommen. Dieses Tier hat mir den letzten Nerv geraubt, doch meine Frau ist verrückt nach dem Hund.<n>Nun, irgendwer hat davon Wind bekommen, den Hund entführt und ihn unseren Feinden als Druckmittel gegen uns übergeben.<n><n>Könnt Ihr mir den Pudel zurückbringen?"
"0xcb8dd6db" = "Vor einiger Zeit ist meine jüngste Tochter durchgebrannt, es hieß, mit irgend so einem dahergelaufenen Abenteurer. Nun habe ich erfahren, dass sie sich in @T$TargetTown$ aufhält und den dortigen Stadtkommandanten heiraten soll. Ich kenne meine Tochter, sie würde das nie aus freiem Willen tun! Doch soll ich dem Vizekönig erzählen, wir müssten eine Stadt stürmen, um meine Tochter zu retten? Aber wie ist es mit Euch?"
