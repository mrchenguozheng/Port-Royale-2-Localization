"0x00cde503" = "<ts:20>Ihr seid erstmals feindlich zu einer Nation geworden, daher ein paar Hinweise dazu.<n>-<t>Feindlich werdet Ihr nur, wenn Ihr Konvois und Städte einer Nation angreift<n>-<t>Ihr könnt Euch bei den Gouverneuren der Nationen freikaufen, um Euer Ansehen anzuheben. Es steigt aber auch täglich von selbst um einen kleinen Wert, da Eure schlechten Taten in Vergessenheit geraten<n>-<t>Ihr dürft nicht in den Häfen feindlicher Nationen anlegen<n>-<t>fahrt Ihr eine feindliche Stadt trotzdem an, so legt der Konvoi heimlich an: Ihr könnt dann zwar die Stadt betreten, jedoch z.B. nicht handeln"
