"0xe84971d5" = "Ehefrau"
"0xe84c0654" = "Ich habe da ein kleines Problem in @T$Town$. Ich habe meiner Frau versprochen, mich darum zu kümmern, dass dort eine Schule gebaut wird. Leider habe ich immer noch eine alte Feindseligkeit mit dem dortigen Baumeister. Er würde nie zulassen, dass ich mich in seine Stadt einmische. Könnt Ihr nicht für mich die Schule errichten?"
"0xe84c0655" = "Ich möchte Euch damit beauftragen, in @T$Town$ eine Schule zu errichten, um den Wohlstand der Stadt anzuheben. Eigentlich geht mich @T$Town$ ja nichts an, aber meine Schwester lebt dort und möchte einfach nicht einsehen, dass es schönere Städte gibt."
"0xe84c0656" = "Der Vizekönig hat mich beauftragt, der Stadt @T$Town$ auf die Beine zu helfen. Daher würde ich gerne der Stadt eine Schule spendieren. Doch die dortige Stadtverwaltung lehnt ab, sie wollen nicht, dass ich mich einmische und würden lieber das Gold direkt nehmen. Daher möchte ich Euch fragen, ob Ihr nicht die Schule bauen könnt."
