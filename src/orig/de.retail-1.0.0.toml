"0xc647e049" = "<n><n>Damit habt Ihr alle Szenarioziele abgeschlossen.<n><n>Ihr habt nun noch weitere 20 Tage Zeit, um mehr Vermögen anzuhäufen, dann endet dieses Szenario und Ihr erhaltet eine Punktzahl angezeigt.<n><n>Übrigens: Alle in diesem Szenario aufgetretenen Ereignisse können auch im freien Spiel auftreten. Wenn Krieg herrscht senden die Nationen von Zeit zu Zeit Freibeuter aus, um Städte feindlicher Nationen zu sabotieren. "
