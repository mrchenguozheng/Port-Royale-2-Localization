"0x19251021" = "Soll der gesamte Großbetrieb abgerissen werden?"
"0x1936271b" = "Wollt Ihr für %1 einen Kaperbrief kaufen und im Namen der englischen Nation die Schiffe unserer Feinde jagen?"
