"0x305f2287" = "Meine Nation hat kürzlich die letzte Gouverneursstadt an ihre Feinde verloren.<n><n>Schwächt die Nationen unserer Feinde, indem Ihr deren Militärkonvois versenkt, dann können wir uns einige Städte zurückholen.<n><n>Damit ihr keine Probleme mit den anderen Nationen bekommt, stelle ich Euch einen Kaperbrief gegen unseren Gegner aus."
