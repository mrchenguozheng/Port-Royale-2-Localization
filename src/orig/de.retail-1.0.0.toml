"0x2ee8bb8c" = "Wir befinden uns in der Gouverneursstadt Cartagena im Süden der Karibik.<n>In einer Stadt könnt Ihr verschiedene Gebäude betreten und Aktionen durchführen, dazu später mehr.<n>Betrachtet einmal den oberen Bildschirmrand. Dort befinden sich verschiedene Buttons und Anzeigen.<n>Klickt nun auf den Button ganz links, der mit der Uhr darauf."
"0x2ee8bb8d" = "Dies ist die Chronik. Sie enthält, wie eine Tageszeitung, alle Vorfälle und Ereignisse in der Karibik.<n>Rechts vom Chronikfenster befinden sich einige Buttons. Mit Ihnen könnt Ihr verschiedene Infos über die Karibik abrufen. Im Moment ist das aber unwichtig.<n>Schließt nun die Chronik, indem Ihr auf den Button mit dem „X“ klickt."
"0x2ee8bb8e" = "Oben neben dem Datum befindet sich der Button für das Logbuch und daneben Euer Bargeld.<n>Das Logbuch informiert Euch über alles, was Eure Erfolge und Eure Besitztümer betrifft. Außerdem werden hier alle Nachrichten und Aufgaben abgelegt, die Ihr erhaltet.<n>Öffnet nun das Logbuch. "
"0x2ee8bb8f" = "Wie Ihr seht, werden sofort die Nachrichten angezeigt, die Ihr bisher erhalten habt. Im Moment sind das nur die Hinweistexte dieses Szenarios.<n>Rechts vom Logbuchfenster befinden sich wieder einige Buttons. Klickt einmal auf den dritten Button. "
"0x2ee8bb90" = "Hierdurch werden die Aufträge und Missionen angezeigt, die Ihr erhalten habt. Momentan steht hier nur das Szenarioziel.<n>Mit den beiden Buttons ganz oben im Missionsfenster könnt Ihr zwischen offenen und abgeschlossen Missionen umschalten.<n>Schließt nun das Logbuch. Ihr könnt dazu auch einfach auf den rechten Mausbutton drücken."
"0x2ee8bb91" = "Später im Spiel könnt Ihr viele Missionen annehmen, um zu Gold und Ruhm zu kommen.<n>Nun wollen wir uns mit der Stadt beschäftigen. Wie Ihr in der oberen Bildschirmmitte seht, befinden wir uns in Cartagena. Die Stadt hat etwa 2000 Einwohner.<n>Klickt einmal auf den Button mit dem Namen der Stadt."
"0x2ee8bb92" = "Hierdurch wird ein Fenster geöffnet, das Euch über die Stadt informiert.<n>Cartagena ist eine Gouverneursstadt und gehört zu Spanien. Außerdem könnt Ihr den Status der Stadt erfahren und welche Waren in der Stadt produziert werden können.<n>Wir wollen nun ein Gebäude betreten. Schließt dazu die Stadtinfo."
"0x2ee8bb93" = "Mit den Pfeiltasten auf der Tastatur könnt Ihr die Stadtansicht verschieben. Nun betrachtet einmal das Stadtzentrum innerhalb der Stadtmauer. Dort stehen Gebäude wie Handelsdock, Kirche oder Gouverneurspalast.<n>Klickt einmal ein beliebiges Gebäude an."
"0x2ee8bb94" = "Durch das Anklicken eines Gebäudes ändert sich die Anzeige in der unteren Bildschirmmitte. Je nach Gebäude erhaltet Ihr nun Informationen oder Ihr könnt bestimmte Dinge erledigen.<n>Rechts von der Gebäudeanzeige befinden sich Buttons. Verlasst das Gebäude nun, indem Ihr den X-Button drückt."
"0x2ee8bb95" = "Die Gebäude, in denen Ihr Aktionen durchführen könnt, befinden sich stets innerhalb der Stadtmauern. Eine Ausnahme ist Euer Lagerhaus, mehr dazu im nächsten Szenario.<n>Verlasst nun das Gebäude und benutzt die Pfeiltasten, um im Hafen den Konvoi „Santa Maria“ anzuzeigen. Klickt ihn an."
"0x2ee8bbfd" = "Wie Ihr seht, werden nun in der unteren Bildmitte Infos über Euren Konvoi angezeigt.<n>Der Konvoi hat bereits Waren geladen: 10 Fass Weizen und 15 Fass Mais.<n>Rechts von der Konvoianzeige befinden sich mehrere Buttons. Klickt auf den zweiten Button, den mit dem Schiff."
"0x2ee8bbfe" = "Hierdurch wird angezeigt, welche Schiffe sich im Konvoi befinden. Ein Konvoi kann aus bis zu 10 Schiffen bestehen, die von einem Kapitän geführt werden.<n>Jetzt wollen wir den Konvoi in eine andere Stadt schicken.<n>Klickt dazu auf den Button mit dem Pfeil rechts oben im Bildschirm, um die Stadt zu verlassen und die Seekarte anzuzeigen."
"0x2ee8bbff" = "Nun wird die Seekarte angezeigt. In der Mitte des Bildschirms seht Ihr die Stadt Cartagena.<n>Mit den Pfeiltasten könnt Ihr den angezeigten Ausschnitt der Karte verschieben und die gesamte Spielwelt betrachten.<n>Sucht nun die Stadt Port Royale auf einer Insel im Norden und macht einen Rechtsklick mit selektiertem Konvoi auf sie."
"0x2ee8bc00" = "Eine Route wird eingezeichnet und Euer Konvoi setzt sich in Bewegung.<n>Durch den Rechtsklick habt Ihr Port Royale als Ziel für Euren Konvoi ausgewählt.<n>Wenn es Euch zu lange dauert, bis der Konvoi die Stadt erreicht hat, betätigt den Schnellvorlauf (Standard: Leertaste), um das Spiel schneller laufen zu lassen."
"0x2ef566b4" = "Tastatur"
"0x2ef8f665" = "Herzlich willkommen in %1,<n><n>Ich möchte Euch gerne ein paar Tipps für den Anfang geben, damit Ihr Euch schneller in der Region um %2 zurechtfindet und meine Nation beim Aufbau meiner und anderer Städte unterstützen könnt.<n>Die grundsätzlichen Hinweise über Gouverneursstädte kennt Ihr bestimmt schon: sie benötigen laufend Kolonialwaren für den Export nach Europa. Gleichzeitig gibt es in diesen Städten meist ein gutes Angebot an Luxuswaren, die gewinnbringend in andere Städte verkauft werden können.<n>Eine Sache noch: es wird Euch interessieren, dass Gouverneure ab und zu Aufträge vergeben. Jedoch erst dann, wenn Ihr zum Schiffsjungen aufgestiegen seid.<n><n>%3 %4, Gouverneur von %5"
"0x2efebfdd" = "Nun, da der Konvoi in Port Royale angekommen ist, könnt Ihr die Stadt auch betreten. Klickt dazu das Stadtsymbol mit den kleinen Häusern an."
"0x2efebfde" = "Ihr seht nun wieder die bekannte Stadtansicht, diesmal allerdings von Port Royale. Ihr dürft alle Städte betreten, in denen Ihr Konvois oder Gebäude habt.<n>Sucht nun im Hafen nach der Werft und klickt sie an, denn wir wollen ein neues Schiff kaufen."
"0x2efebfdf" = "Im Auswahlfenster, wo gerade noch der Konvoi angezeigt wurde, wird nun die Werft angezeigt.<n>Seht Euch einmal in der Werft um, indem Ihr auf die Buttons rechts von der Werftanzeige klickt.<n>Dann wechselt wieder zur Anzeige „Schiff kaufen“ und seht Euch die verfügbaren Schiffe an.<n>Nun kauft ein beliebiges Schiff."
"0x2efebfe0" = "Herzlichen Glückwunsch! Ihr habt Euer erstes Schiff gekauft.<n>Das Schiff wird im Hafen der Stadt abgeliefert.<n>Verlasst nun die Werft und klickt das Wasser im Hafenbecken an. Im Auswahlfenster werden nun die Einzelschiffe im Hafen angezeigt.<n>Klickt auf Euer neues Schiff."
"0x2efebfe1" = "Nun werden die Schiffsdaten angezeigt, die Ihr schon von der Werft her kennt.<n>Um mit einem einzelnen Schiff etwas anzufangen, muss es einem Konvoi hinzugefügt werden.<n>Wählt dazu wieder Euren Konvoi aus."
"0x2efebfe2" = "Wir wollen dem Konvoi nun mitteilen, dass er mit dem Hafenbecken agieren soll.<n>Macht dazu einen Rechtsklick auf das Hafenbecken."
"0x2efebfe3" = "Es öffnet sich ein Transferdialog und Ihr könnt einzelne Schiffe dem Konvoi hinzufügen.<n>Klickt dazu das einzelne Schiff auf der linken Seite an und zieht es in den Konvoi, so dass der Konvoi aus zwei Schiffen besteht.<n>Schließt dann den Transferdialog wieder mit dem „X“-Button auf der rechten Seite."
"0x2efebfe4" = "Man kann mit einem neuen Schiff auch einen weiteren Konvoi bilden, indem man in der Kneipe einen neuen Kapitän anheuert.<n>Im Moment dürft Ihr das aber noch nicht, da Euer Rang noch nicht hoch genug ist.<n>Nun wählt die Schiffsliste des Konvois an. Es ist der zweite Button."
"0x2efebfe5" = "Ihr habt nun einen Konvoi mit zwei Schiffen im Hafen von Port Royale.<n>Ihr könnt die Schiffe in der Schiffsliste des Konvois anklicken, um Details über die Schiffe zu erfahren.<n>Nun schickt den Konvoi zurück in Eure Heimatstadt Cartagena. Begebt Euch dazu auf die Seekarte, indem Ihr auf den Button mit dem Pfeil ganz oben rechts im Bildschirm klickt. "
"0x2efebfe6" = "Sucht nun nach der Stadt Cartagena im Süden und schickt Euren Konvoi dorthin, indem Ihr einen Rechtsklick auf die Stadt macht.<n>Sobald der Konvoi die Stadt erreicht, endet dieses Szenario."
"0x2f0127e1" = "Ihr verbringt einen schönen Tag mit %1 und erzählt ihr von Euren Abenteuern."
"0x2f0127e2" = "Ihr verbringt einen schönen Nachmittag mit %1 und vergesst für eine Weile Eure Geschäfte."
"0x2f0127e3" = "Ihr verbringt den Abend bei %1 und wünschtet, der Abend würde ewig andauern."
