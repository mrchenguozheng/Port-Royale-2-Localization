"0xfab539b0" = "Ich danke Euch, dass Ihr dieses Piratenversteck ausgeräuchert habt. Ich hoffe, Ihr konntet genug Gold in dem Versteck finden und seid angemessen entschädigt worden. Der Dank aller Nationen ist Euch sicher!  "
