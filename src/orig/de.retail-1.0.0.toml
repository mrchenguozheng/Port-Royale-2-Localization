"0xda75935c" = "Annektierung einer Stadt"
"0xda93dbe1" = "Sehr gut, dies war keine leichte Aufgabe! England hat nun so viele Militärkonvois verloren, dass englische Städte annektiert werden können. Aus Dank stellt Euch der Gouverneur von Turk Islands 4 weitere Karacken zur Verfügung.<n><n>Um Städte einer Nation annektieren zu können, benötigt Ihr den Auftrag eines Vizekönigs. Ein Vizekönig gibt Euch immer dann den Auftrag, eine Stadt zu annektieren, wenn seine eigene Nation militärisch stark ist und die des Kriegsgegners militärisch schwach ist.<n><n>Leider ist Holland nicht stark genug, um eine Stadt annektieren zu können. Doch könnt Ihr etwas dagegen unternehmen: Besucht den Vizekönig von Holland in Grand Bahama und übergebt ihm einen Konvoi. Er wird dann einen neuen Militärkonvoi bilden und dadurch die Stärke Hollands erhöhen.<n><n>Wenn Ihr einem Vizekönig einen Konvoi übergeben wollt, so muss dieser aus genau 5 Schiffen und mindestens 150 Kanonen bestehen.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Helft dem Vizekönig dabei, die militärische Stärke Hollands zu erhöhen. Nehmt dann bei ihm eine Annektierungsmission an."
"0xdab4fea7" = "Wohnhäuser"
"0xdac343f7" = "Freier Handel und Sicherheit"
"0xdac43b47" = "Siedlermangel"
"0xdacb8ff6" = "Die Lebensqualität in Eurer Stadt"
"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "Taste"
"0xdaeb0484" = "Ihr beginnt das Szenario diesmal in Cartagena, einer Gouverneursstadt inmitten der Karibik.<n>Im Hafen steht Euer Konvoi, der aus einer Schaluppe besteht.<n>Als erstes sollt Ihr Euren Konvoi bewaffnen, denn es soll ja in diesem Szenario um Seeschlachten gehen.<n>Öffnet das Handelsdock und dort das Frachtmenü."
"0xdaeb0485" = "Ihr könnt nun sehen, dass Ihr weder Kanonen noch Munition an Bord Eures Konvois habt. Außerdem fehlt Euch Besatzung.<n>Nehmt nun maximale Besatzung und Kanonen sowie je 10x10 Schuss der drei verschiedenen Kugelarten auf.<n>Vielleicht reicht der Platz im Konvoi nicht aus, denn Kanonen sind schwer. Verkauft dann eben ein paar der geladenen Waren."
"0xdaeb0486" = "Sehr schön, Euer Konvoi ist nun gerüstet für eine kleine Schlacht.<n>Zufällig hält der Gouverneur von Cartagena eine passende Mission für Euch bereit.<n>Klickt nun das Gebäude des Gouverneurs an und nehmt seinen Auftrag an."
"0xdaeb0487" = "Gouverneure bieten häufig Missionen an, deren Erfüllung Euch Ansehen bei seiner Nation und Gold bringt.<n>Außerdem könnt Ihr bei Gouverneuren Kaperbriefe erhalten oder Lösegeld für Freibeuter, die Ihr gefangen habt, einfordern.<n>Sucht nun mit Hilfe Eures Konvois die Schiffe, von denen der Gouverneur gesprochen hat."
"0xdaeb0488" = "Sehr gut, Ihr habt den Konvoi gefunden.<n>Macht nun Euer Schiff gefechtsklar. Öffnet dazu die Schiffsliste Eures Konvois und wählt dort Eure Schaluppe. Um sie als Kampfschiff zu deklarieren, müsst Ihr den Button neben der Kanone aktivieren. Dann könnt Ihr mit einem Rechtsklick auf den Konvoi \"angreifen\"."
"0xdaeb0489" = "Dies ist die Seeschlachtansicht von Port Royale.<n>Ihr seht nun Euer Schiff und könnt die herrenlosen Schiffe sehen, indem Ihr den Bildausschnitt bewegt.<n>Nun deaktiviert die Pause und übt das Navigieren mit der rechten Maustaste. Während Seeschlachten wird im Ereignisfenster übrigens die Wind- und Schiffsrichtung angezeigt."
"0xdaeb048a" = "Unten im Bildschirm werden alle beteiligten Schiffe angezeigt. Darüber könnt Ihr die Munitionsart bestimmen. Wählt die Massivkugeln und versenkt eines der gegnerischen Schiffe.<n>Feuern könnt Ihr mit der linken Maustaste, jedoch nur, wenn sich Euer Schiff in aussichtsreicher Schussposition befindet. Ziele werden dann in rot markiert."
"0xdaeb048b" = "Gut. Das zweite Schiff sollt Ihr entern.<n>Klickt dazu unten rechts von der Schiffsanzeige auf den Button „Entern“.<n>Fahrt dann auf das feindliche Schiff zu und rammt es. Übrigens: auch während Seeschlachten ist die F1-Taste aktiv."
"0xdaeb048c" = "Normalerweise haben Eure Gegner Besatzung an Bord und es kommt zum Enterkampf zwischen den Besatzungen.<n>Ist eine Schlacht zu Ende, fallen dem Gewinner alle geenterten Schiffe zu.<n>Nun übernehmt das Schiff des Gegners in Euren Konvoi und schließt das Transferfenster."
"0xdaeb048d" = "Sehr gut.<n>Schickt Euren Konvoi nun zurück nach Cartagena."
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "Ein Konvoi des Piraten %1 hat einen Händler aus %2 angegriffen."
"0xdb0108d5" = "Als erstes sollt Ihr ein neues Schiff kaufen. Betretet dazu die Werft und sucht Euch ein Schiff mit möglichst vielen Kanonen aus."
"0xdb0108d6" = "Nun wählt Euren Konvoi aus und macht einen Rechtsklick auf den Hafen, um das neue Schiff dem Konvoi hinzuzufügen."
"0xdb0108d7" = "Jeder Konvoi besteht aus Handelsschiffen und Geleitschiffen.<n>Wenn ein Schiff Eures Konvois an einer Schlacht teilnehmen soll, dann müsst Ihr es als Kampfschiff definieren.<n>Öffnet bei Eurem Konvoi einmal die Schiffsliste, so dass alle Schiffe des Konvois angezeigt werden."
"0xdb0108d8" = "Die Schiffsliste zeigt alle Schiffe des Konvois. In der rechten oberen Ecke eines Schiffs wird der Kampfschiffstatus angezeigt. Ist ein Kanonensymbol sichtbar, ist das Schiff als Kampfschiff definiert und nimmt an Kämpfen teil. Ein Klick auf diese Ecke ändert den Status direkt.<n>Klickt aber nun auf Euer neues Schiff und wählt es aus."
"0xdb0108d9" = "Nun werden die „technischen Daten“ des Schiffs wie in der Werft angezeigt, beispielsweise die maximale Ladekapazität.<n>Außerdem wird noch angezeigt, wie hoch die täglich anfallenden Unterhaltskosten sind.<n>Macht nun aus dem Schiff ein Kampfschiff, indem Ihr bei der Kanone ein Häkchen macht."
"0xdb0108da" = "Sehr schön.<n>Kanonen und Matrosen werden immer gleichmäßig auf die Geleitschiffe des Konvois verteilt.<n>Sorgt dafür, dass Eure Geleitschiffe voll bewaffnet und bemannt sind und begebt Euch dann zum Gouverneur, um seinen neuen Auftrag anzunehmen."
"0xdb0108db" = "Erfüllt nun den Auftrag des Gouverneurs. "
"0xdb0108dc" = "Wählt aus Euren Geleitschiffen das Schiff aus, das Ihr in der Seeschlacht steuern wollt.<n><n>Ihr könnt jederzeit ein anderes Geleitschiff wählen, indem Ihr es in der Liste anklickt.<n><n>Achtung: sobald die Schlacht begonnen hat, kann jedes Schiff nur einmal gewählt werden!"
"0xdb0108dd" = "Sehr gut Ihr habt den Piratenkonvoi vernichtet.<n><n>Kehrt nun zum Gouverneur von Cartagena zurück, denn dies ist Teil Eures Auftrages.<n><n>In Eurem Logbuch werden übrigens Eure Aufträge automatisch vermerkt. Bei Bedarf könnt Ihr dort die Details Eurer Missionen jederzeit nachlesen."
"0xdb04023a" = "Baumaterial fehlt"
"0xdb0e3d33" = "Ich habe folgenden Auftrag für Euch.<n><n>"
"0xdb0e3d34" = "Ihr könntet mir einen Gefallen tun.<n><n>"
"0xdb0e3d35" = "Es gibt da etwas, was Ihr für mich tun könntet.<n><n>"
"0xdb10f490" = "Spenden"
"0xdb126f49" = "Eure Punkte<n>"
"0xdb170d26" = "Bevor Ihr Euch beim Gouverneur eine neue Mission holt, solltet Ihr Euren Konvoi auf Vordermann bringen.<n>Besucht einmal die Werft und lasst den Konvoi reparieren, falls er beschädigt ist."
"0xdb170d27" = "Ihr habt gerade noch etwas Geld erhalten, damit Ihr Euren Konvoi besser ausstatten könnt.<n>Euer Konvoi soll 3 Schiffe haben, volle Bewaffnung und volle Matrosenzahl.<n>Vergesst nicht die Munition und definiert neue Schiffe als Kampfschiffe. Erledigt das nun."
"0xdb170d28" = "Hervorragend.<n>Nun besucht den Gouverneur und erledigt seinen Auftrag."
"0xdb2ae26e" = "Ablehnen"
"0xdb2d1177" = "Nun sollt Ihr ein Piratenversteck ausheben.<n>Bringt zunächst Euren Konvoi auf Vordermann.<n>Vielleicht besucht Ihr noch ein paar Gouverneursstädte und seht in den dortigen Werften nach, ob nicht ein größeres Schiff verfügbar ist.<n>Besucht währenddessen den Gouverneur und erfahrt etwas über das Piratenversteck."
"0xdb2d1178" = "Hafenschlachten laufen ähnlich ab wie Seeschlachten, nur dass Ihr nicht gegen Schiffe sondern sehr starke Kanonentürme kämpft.<n>Ihr müsst alle Türme zerstören, um eine Hafenschlacht zu gewinnen.<n>Manchmal liegen bewaffnete Schiffe im Hafen. Dann müsst Ihr erst gegen diese Schiffe kämpfen, bevor Ihr den Hafen selbst angreifen könnt."
"0xdb2d1179" = "Begebt Euch mit Eurem Konvoi wieder nach Cartagena, um das Szenario zu beenden."
"0xdb4287ac" = "Der Gouverneur von Cartagena sieht großes Potential in Euch und schenkt Euch @g$Gold$.<n><n>Ein kleiner Tipp:<n>Kauft Waren, wenn sie in einer Stadt zahlreich vorhanden sind (die Menge darf nicht rot eingefärbt sein). Verkauft sie dann in einer Stadt, in der sie knapp sind, damit Ihr einen besseren Preis bekommt.<n><n>So steigt Euer Vermögen schnell wieder an."
"0xdb4eeb89" = "Konvoi auswählen"
"0xdb5dde0a" = "laberfasel?"
"0xdb66b4df" = "Nehmt 2 englische Freibeuter in Euren Gewahrsam."
