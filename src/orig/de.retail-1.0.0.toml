"0xc93b91cb" = "Erhöht Euren Handelserfolg in der Stadt Cartagena und erwerbt eine Baukonzession beim Baumeister."
"0xc9500bee" = "Herzlichen Glückwunsch! Ihr habt Euer Ziel erreicht und konntet Euer Bargeld erhöhen. Außerdem seid Ihr im Rang gestiegen.<n><n>Euer Rang ist immer an Euer Gesamtvermögen gekoppelt. Dieses richtet sich an Euer  Bargeld und Eure Besitztümer wie Waren und Schiffe. Ihr könnt Euer Vermögen jederzeit im Logbuch unter „Erfolge“ abrufen. Dort steht auch, wann Ihr den nächsten Rang erreicht.<n><n>Je höher Euer Rang ist, desto mehr Konvois dürft Ihr führen und in desto mehr Städten dürft Ihr später Betriebe errichten.<n><n>Nun, da Ihr einen neuen Rang habt, sollt Ihr einen weiteren Konvoi bilden und Euer Vermögen durch Handel weiter steigern.<n><n>Euer aktuelles Vermögen könnt Ihr auch abfragen, wenn Ihr die Maus auf den blauen Vermögensbalken unter diesem Fenster bewegt.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Bildet einen zweiten Konvoi und erhöht Euer Gesamtvermögen auf @g$GoldGoal$."
