"0xf88d6ee5" = "Liefert eine beliebige Menge @G$Goods$ an den Marktplatz von @T$TOWN$. Dort erhaltet Ihr zunächst @g$Price$ pro Fass.  Am @D$EndDate$ holt ein Expeditionskonvoi die Waren ab. Gebt ihm Geleitschutz nach Europa, dann erhaltet Ihr nochmals @g$Price$ pro Fass."
"0xf894bc2d" = "Der Konvoi kann nicht auslaufen, da sich einige der Schiffe in einem sehr schlechten Zustand befinden. Lasst Euren Konvoi in der Werft reparieren, bevor Ihr ihn wieder auf See schickt. Ihr könnt die beschädigten Schiffe auch aus dem Konvoi entfernen und einzeln in der Werft reparieren lassen."
"0xf89f542f" = " Ihr habt <o:0xff1e1eff>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GOLD_800x600.screen> erhalten."
"0xf8af3810" = "Wir sind hier mit allem versorgt."
"0xf8b3a303" = "Der Status einer Stadt reicht in 7 Stufen von Armut bis Reichtum. In den beiden niedrigsten Stufen ist die Lebensqualität in einer Stadt so schlecht, dass regelmäßig Bürger die Stadt verlassen. In den Stufen Blütezeit, Wohlstand und Reichtum dagegen erhalten Eure Betriebe einen Effizienzbonus und Arbeiter arbeiten kostengünstiger. In der höchsten Stufe erzeugt eine Stadt sogar von selbst Siedler.<n><n>Die jeweiligen Status-Auswirkungen könnt Ihr in der Stadtinfo ablesen. Sie wird durch Anklicken des Stadtnamens angezeigt.<n><n>Für eine gute Lebensqualität genügt es, wenn innerhalb jeder Warengruppe 2-3 Waren in ausreichender Menge vorhanden sind. Ausreichend heißt, dass der Vorrat einer Ware für 10 Tage reichen muss, um die Stadtbewohner zu versorgen.<n><n>Übrigens: der Status einer Stadt verbessert sich nicht von heute auf morgen. Es dauert eine Weile, bis sich die Bürger auf eine neue Situation eingestellt haben."
"0xf8bacb9a" = "Kneipe"
"0xf8cc0545" = "Warenverkauf"
