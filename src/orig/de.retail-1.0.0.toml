"0x062a6d44" = "Gut. Der Konvoi ist von @T$HostileTown$ in Richtung Europa gefahren und verlässt die Karibik im Osten. Sucht die gesamte Strecke nach Dokumenten ab und bringt sie bis zum @D$EndDate$ zu mir."
"0x062a6d45" = "Ihr seid mir eine große Hilfe! Wenn alles klappt, wirft der Steuermann die Bücher nacheinander heimlich über Bord. Das Schiff ist von @T$HostileTown$ aus nach Europa aufgebrochen. Ihr sollt dem Schiff hinterher fahren und die Bücher einsammeln. Bringt sie dann bis zum @D$EndDate$ zu mir zurück."
"0x062a6d46" = "Schön. Das Schiff hat den Hafen von @T$HostileTown$ in Richtung Europa bereits verlassen, doch befindet sich ein Reisender an Bord, der mir noch etwas schuldig ist. Er wird nach den Dokumenten an Bord suchen und sie nacheinander über Bord werfen. Eure Aufgabe ist es, sie einzusammeln und mir bis zum @D$EndDate$ zu bringen."
"0x063dfcc8" = "%1 besiegt"
"0x064021d3" = "Die Hafenverteidigung ist zerstört und Eure Mannschaft legt im Hafen an. Von der Stadtwache ist weit und breit nichts zu sehen.<n><n>Was habt Ihr nun vor?"
