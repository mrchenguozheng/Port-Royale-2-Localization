"0xf0e1f57c" = "@n$HostileNation$, unserer derzeitiger Feind, hat unsere Transportkonvois überfallen und die Importwaren geplündert, die für die englischen Städte in der Neuen Welt gedacht waren."
"0xf0e1f57d" = "@n$HostileNation$, unserer derzeitiger Feind, hat unsere Transportkonvois überfallen und die Importwaren geplündert, die für die französischen Städte in der Neuen Welt gedacht waren."
"0xf0e1f57e" = "@n$HostileNation$, unserer derzeitiger Feind, hat unsere Transportkonvois überfallen und die Importwaren geplündert, die für die holländischen Städte in der Neuen Welt gedacht waren."
