"0xcd01da76" = "Ihr beginnt das Spiel mit dem Rang eines Matrosen in der spanischen Gouverneursstadt @T$TOWN$, wo Ihr bereits über ein Lagerhaus verfügt. Im Hafen steht außerdem ein Konvoi mit 2 bewaffneten Schiffen, jedoch ohne Matrosen bereit.<n><n>Euer erstes Szenarioziel ist es, den Gouverneur von @T$TOWN$ zu besuchen und seinen Auftrag anzunehmen. Er hat ein Problem mit dem berüchtigten Piraten Edward Teach - besser bekannt als Blackbeard - und möchte, dass Ihr ihm behilflich seid.<n><n>Ein wichtiger Hinweis: In diesem Szenario leben die Nationen im Frieden miteinander. Ihr dürft daher auf keinen Fall einen Konvoi einer Nation angreifen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Besucht den Gouverneur von @T$TOWN$ und nehmt seinen Auftrag an."
