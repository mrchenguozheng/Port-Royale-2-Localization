"0x04e5002a" = "A workers' strike has been instigated in Tortuga. All of the workers have downed tools and are now on strike (but they are still incurring costs for your business).<n><n>Your task is to maintain ample stocks of the goods that the workers would normally produce, to ensure that the workers' strike fails and that they resume work.<n><n>Note: The town produces wheat, bricks, cotton, sugar and tobacco. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>The stocks of goods produced in the town must be @a$Amount$ for each good by @D$EndDate$."
