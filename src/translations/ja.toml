"0xcc0a1380" = "@P$PirateName$ が率いる海賊船団を 探してください。 プロビデンスの北東およそ 1 日行程に います。 この船団を 撃破してください。<n>その後カルタヘナの総督のもとへ 戻ってください。"
"0xcc1709af" = "%1 ： 敵対"
"0xcc2c64fb" = "黒ひげの海賊船団を 1 つ追跡して撃破する任務が 与えられました。<n><n>黒ひげには秘密の隠れ家が あり、 そこに 船団を いくつも 置いています。 どれも 完全武装の船 5 隻で 構成されています。 今のあなたの船団では難しい任務でしょう。<n><n>ですから、 まず船団の火力を 上げてください。 大きな船を 買う資金を 作るには、 @T$TOWN$ の倉庫の物資を できるだけ良い値で 売りましょう。 @T$TOWN$ の北と 東で 物資を 高く売れる場所は、 イベントウィンドウのヒントに あります。<n><n>ただし時間を かけすぎないでください。 後に 総督の任務も 果たさねばなりません！<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@T$TOWN$ の倉庫の物資を 売り、 現金を @g$GoldGoal$ まで増やしてください。"
