"0x05716a06" = "次の戦いは 少し難しくなります。 今度は 敵が 抵抗するからです。 あなたの任務は、 総督のために 海賊を 追って討ち取ることです。<n><n>ただしその前に、 戦いのために 船団を 武装させねばなりません。 船を 買って船団に加え、 新しい武器と 船員を 積み込んでください。<n><n>海戦中いつでも F1 を押すと、 キーボードと マウスの設定が 表示されます。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>船団を 武装させ、 カルタヘナの総督から 与えられた新しい任務を 果たしてください。"
"0x058ca789" = "@T$TOWN$ の総督を 訪ね、 任務を 受諾してください。"
"0x05980d2c" = "難易度は 物資の価格と、 海戦で 受ける損害を 左右します。<n><n>さらに難易度が 低いと、 建築許可を 買う前に 町で そこまで 良い交易実績を 残さなくてもよくなります。"
"0x05ae35b1" = "上出来です！ ではポートロワイヤルのスペイン総督代理を 訪ね、 フランスの町を 1 つ占領する任務を 受けてください。<n><n>通常は 町を 2 つ占領しないと総督代理から 土地を もらえませんが、 このシナリオでは少しボーナスが あり、 スペインのために 1 つ占領するだけで済みます。<n><n>どの町を 占領するかはあなた次第です。 港の大砲が できるだけ少ない町を 選ぶのが よいでしょう。 今の狙い目として 理想的なフランスの町が @T$SampleTown$ です。<n><n>町を 占領した見返りに、 総督代理は 土地の区画を 与えます。 注意： 少なくとも水夫長の階級が ないと総督代理と 話せません。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>ポートロワイヤルのスペイン総督代理を 訪ね、 町を 占領する任務を 受けてください。 任務を 果たしたら、 彼の贈る土地の区画を 受け取れます。"
