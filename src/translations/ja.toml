"0xf214f69f" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>You have picked up @I$Sailors$ shipwrecked sailors, who appear to be acquainted with some of the crew. The welcome party raises the morale of the crew."
