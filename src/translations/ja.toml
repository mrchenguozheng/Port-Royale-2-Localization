"0xf52fee2f" = "Battle against pirates, buccaneers and military convoys from enemy nations.<n><n>Try your hand at hunting down trading convoys as a buccaneer.<n><n>Set off in search of the legendary Spanish treasure fleet.<n><n>Command 16 different types of ship."
"0xf52fee30" = "Guide your captain through duels with  other captains and pirates.<n><n>Accomplish countless missions involving battles, trade and politics."
"0xf52fee31" = "Visit towns in 4 different nations with different sets of buildings<n><n:10>Enjoy a rich variety of graphics as you move through different landscapes.<n><n:10>Loot and capture towns for your favorite nation<n><n:10>Build your own towns<n><n:10>Buy businesses from other traders and establish monopolies on goods<n><n:10><o:0xFFFFEB7D>...take the whole of the Caribbean by storm!"
