"0xf74a5740" = "<o:0xFFF2FAAD>%1<o> 枚の金貨と <o:0xFFF2FAAD>ピンネース<o> （60 トン、 最大 8 門） で船乗りの人生が 始まります。"
"0xf7534d8f" = "労働者を 必要と する町へ 入植者を 運ぶと、 入植者は 下船時に お礼として 運賃を 払ってくれます。<n><n>カカオのような植民地物資を 生産するには、 少量の道具が 常に必要です。 道具が ないと生産が 止まります。 後で値段と 数量について もう少し分かってきたら、 倉庫番に 定期的な道具の購入を 指示できます。 ただ今のところは、 念のため自分で 道具を 買っておきましょう。<n><n>これが 次の課題です。 そうすればカカオ生産を 妨げるものは なくなります。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>カカオを 生産し、 倉庫に @a$AmountGoal$ の備蓄を 築いてください。"
