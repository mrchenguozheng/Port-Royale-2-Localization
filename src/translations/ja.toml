"0x1db7f908" = "Unfortunately, you didn't have enough time to make @g$GoldGoal$ in cash.<n><n>Sell the goods in your warehouse in Tortuga in the towns where they are in short supply and be on the lookout for goods that you can buy at a good price.<n><n>You can also get a loan from the treasurer in Tortuga."
