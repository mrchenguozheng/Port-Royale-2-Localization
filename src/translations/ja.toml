"0xd07dbe34" = "The most important factors influencing the quality of life in a town are the supply and range of goods available. However, you don't have to ensure supplies of all kinds of goods to keep the inhabitants happy.<n><n>The goods in a town can be divided into five groups: essential goods, raw materials, finished goods, colonial goods and import goods. These are listed in the same sequence in the Trade window. A sufficient supply of two to three goods in each group will ensure a good quality of life in your town. <n><n>You have just received a message on the subject of the quality of life in towns. You can display this in the log.<n><n>Because your town is still small, it is particularly easy to achieve a good quality of life because the citizens of small towns are not too demanding. This means that you shouldn't have any problems achieving your objective. However, a town with fewer than 2,000 inhabitants cannot rise above the status “boom”.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Ensure that your town has a supply of five barrels of each good."
