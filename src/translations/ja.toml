"0x305f2287" = "My nation recently lost the last governor town to its enemies.<n><n>If these enemy nations are weakened by having their military convoys sunk, we will then be able to win back some towns.<n><n>To avoid any problems with the other nations, I will  issue you with a Letter of Marque against our enemies."
