"0x3641d8d1" = "Thank you for returning my wife to me. Although I very much enjoyed the peace and quiet of the last few days, I could not simply abandon my wife to my enemies. As a reward, take this map showing a hideout containing @a$Amount$ of goods."
"0x3641d8d2" = "So, you have not returned my wife to me! Then I cannot reward you. However, between us both, I am actually very grateful to you."
"0x36573a59" = "Your troops soon gain the upper hand. Suddenly a white flag is raised above the town wall: the town guard has capitulated!<n><n>What do you want to do now?"
"0x3657dd22" = "My wife is overjoyed that you have found her dog. Take this map showing a hideout containing @a$Amount$ of goods."
"0x3657dd23" = "What? You mean you threw the dog overboard? I am nevertheless very grateful to you. Naturally, I cannot officially reward you, but I once hid treasure in a secret location. Here is a map."
"0x366de173" = "Oh, thank you for bringing back my beloved daughter. Here is a map. On it, I have marked the spot where I once hid lots of treasure."
