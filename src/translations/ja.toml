"0x084340c7" = "This challenging scenario is all about trade, production and goods supplies in a town.<n:25>Strange things are happening in Tortuga: Hardly any traders want to visit the town and several events are making life difficult for its citizens. Your task is to save the town from ruin. At the end of the scenario, your score will be displayed. It depends on your speed and on your wealth at the end of the scenario.<n:25>In this scenario, you can use all the options offered in free-play mode but you will also have specific objectives to achieve."
