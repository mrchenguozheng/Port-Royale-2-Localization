"0xf932eef8" = "Congratulations! You have successfully completed this scenario and now know how to build your own town.<n><n>In free-play mode, the viceroy of any nation may grant you the gift of your own town. But this is not easy to achieve, because you must always capture towns in order to receive a plot of land, and this will naturally damage your reputation with other nations. <n><n>Anything you have learned in this scenario about developing your town will help you to develop businesses in other towns also. The main difference is that you don't have to worry about defending those towns."
