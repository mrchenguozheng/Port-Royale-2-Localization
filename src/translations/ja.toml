"0x178491f6" = "価格を 5% 上げる"
"0x17885da0" = "You have come across castaways on a raft and have picked up @I$Settlers$ settlers. They are hoping to be put ashore in a town where there is a shortage of workers."
"0x17a97ba2" = "海戦"
"0x17abb14d" = "そして港の防備はとても貧弱です。"
"0x17ae0013" = "The last convoy from Europe informed me that my town is going to run short of imported goods in the next few weeks.<n><n>Can you help me? I cannot rely on the possibility of other traders bringing these goods to the town."
"0x17ae0014" = "As you know, @n$Nation1$ and @n$Nation2$ are at war.<n>For this reason, I will still not be getting any imported goods from Europe for the coming weeks.  I therefore have no choice but to buy up the goods in @n$Nation2$.<n><n>I have already employed some other traders to do so but I would like to be able to rely on your help also."
"0x17ae0015" = "What does @n$Nation2$ think it's doing? I have just learned from an informant that transport convoys from Europe en route to my town are being attacked and looted. Will you help me to buy the imported goods we need?"
"0x17d31860" = "購入した物資"
"0x17d5b880" = "You cannot disband the convoy because there are still goods or cargo on board."
"0x17f39d18" = "任務のない船団"
