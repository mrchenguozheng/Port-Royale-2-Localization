"0x21117682" = "<n><n>You can usually hand back a building permit you have acquired. However, you cannot do so in this case because %1 is the town where you started the game."
"0x21117683" = "<n><n>Do you want to hand back your permit?<n>Remember that I can pay you nothing for it!"
"0x211c8552" = "Game time over"
"0x2137ec23" = "Thank you. I will pay you high prices for wine, tools and spices until @D$Date$. Meet my emissary at the marketplace and deliver @a$Amount$ of each. He will only accept a complete delivery and will pay you there and then."
"0x2137ec24" = "That sounds good. So travel to our enemies' towns and buy up import goods there. Deliver @a$Amount$ of each by @D$Date$ to my emissary at the marketplace of @T$TOWN$, he will pay more than twice the usual price."
"0x2137ec25" = "Do you know what the best thing would be? To buy up the imported goods in @n$Nation2$ and cause a shortage there. Deliver @a$Amount$ of each to the marketplace. My emissary will wait there until @D$Date$ and will pay you a high price."
"0x215e37a6" = "I recently overheard a conversation in which a trader mentioned that one of his ships had sunk. He wasn't too concerned about the ship, as it was only a rickety old tub. But it had a special chest on board."
"0x215e37a7" = "We have an agreement then. On the last trip I signed on to, the captain lost his temper over a chest for some reason, which he then just dumped overboard."
"0x215e37a8" = "A man who was once a good friend has run off with an expensive chest of mine."
"0x2167838b" = "Purchase of ship"
"0x21743bf7" = " I must have these things! We do not know the exact spot where the ship sank. @l$ChestPos$ Bring me the chest by @D$EndDate$."
"0x21743bf8" = " You must get me the things by @D$EndDate$. @l$ChestPos$"
"0x21743bf9" = " Only recently he wrote to tell me he had thrown this chest overboard. @l$ChestPos$ You must bring me back my things! You can find me here until @D$EndDate$."
