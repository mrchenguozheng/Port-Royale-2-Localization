"0x28f090e8" = "Letters of Marque"
"0x293d8c9f" = "Excellent! Your town is now quite large. Soon, the first traders from other towns will land to trade goods with your town.<n><n>But your town is also in danger of being visited by other, less desirable characters. These include pirates and buccaneers from nations with which you have a poor relationship. Your next task is therefore to hire soldiers and erect harbor cannons.<n><n>Fortunately, the citizens in your town can organize themselves to a large degree. You only have to give them some instructions and purchase any necessary materials. After that, there are no extra costs.<n><n>You can construct harbor cannons using the Construction menu, and you can hire soldiers from your palace.<n><n>Remember:<n>Soldiers need living quarters too! However, in contrast to workers, soldiers only require one  space each.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario  objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construct five harbor cannons and increase your soldiers to 300."
