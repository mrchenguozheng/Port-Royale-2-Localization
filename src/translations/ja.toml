"0xfc9cf623" = "完了"
"0xfca882e8" = "As you know, the Spanish treasure fleet always takes a different route when collecting treasures from its colonies and shipping them to Europe. The fleet avoids being ambushed by only ever staying a short time at each town. However, this time Spain has committed a serious blunder, by allowing us to find out the route the Spanish treasure fleet is following at this very moment. Your orders couldn't be simpler. Destroy every last ship!"
"0xfca882e9" = "We are at war with Spain and must ensure that the Spanish treasure fleet never reaches Europe. Luckily, we have learned which town the fleet will be calling at next. We will sabotage the fleet at this town so that it has to prolong its stay in the harbor. This should give you enough time to intercept the fleet and prevent it from reaching Europe. Do you accept this mission?"
"0xfca882ea" = "You don't get opportunities like this every day! Today one of my informants told me the route the Spanish treasure fleet is currently following. But that's not all. We have learned that the fleet will be lying at anchor for longer than usual at the next town it visits. Since we are at war with Spain, we should give the viceroy something to smile about and make sure the treasure fleet never reaches its destination in Europe. Will you intercept the fleet for my nation?"
"0xfcc82d44" = "サーベル兵"
"0xfcd6fdec" = "I see you have still not completed my last mission. Complete this job, as I have further work for you."
