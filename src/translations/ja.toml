"0xfda277f4" = "%1 は満杯で、 倉庫を 建てる場所が もうありません。 それでもこの町に 足がかりを 得たいなら、 地元の商人を 説得して事業の一つを 取り壊させられます。<n><n>生産した物資の値段が 長期間低いまま、 つまり物資が 余っていると、 事業は 取り壊されます。 そのためにはまず製品を 買い占め、 次に町の市場で 十分な量を 売って値段を 下げます。<n><n>生産物は 1 日 1 回町の市場へ 届けられます。 値段が 最低に なっていれば、 事業は 労働者を 減らします。 事業を クリックすれば確認できます。 労働者が 30 人余剰に なると、 その事業は 取り壊されます。"
"0xfda5ded4" = "金鉱の発見で 町は 繁栄しています"
"0xfdaf6463" = "あらためて感謝します。 あなたは わが国のために 多くのことを してくれました。 褒美として、 あなたの町 %1 に残りの土地を 追加して 差し上げましょう。 これで 地区全体を 所有することに なります。"
"0xfdb7f907" = "焚き火の明かりで、 岸から 遠くない師匠の隠れ家が 見つかりました。 船長は 小舟で 岸へ 漕ぎ寄せ、 老人に 迎えられます。 老人は ワインの量を 見て、 うれしそうに 手を こすりました。"
"0xfdb7f908" = "岸から 遠くないところで、 船団は 小さな隠者の野営地を 見つけました。 船長は 小舟で 岸へ 漕ぎ寄せ、 自分より 古びた船長服を 着た老人に 会います。 老人は ラム酒の樽に 気づいて大喜びです。"
"0xfdb7f909" = "しばらくして、 船団は 陸に 隠れ家を 見つけました。 船長は 小舟で 岸へ 上がって見回り、 ついに老師匠を 見つけて、 来た理由を 説明します。 隠者は 食料を 受け取ります。"
