"0xe10e4380" = "Your time is up but you have not achieved the final scenario objective.<n><n>In free-play mode, the viceroy of any nation may grant you the gift of your own town. But this is not so easy to achieve, because you must always capture towns in order to be awarded a plot of land, and this will naturally damage your reputation with other nations. <n><n>Anything you have learned in this scenario about developing your town will help you to develop businesses in other towns also. The main difference is that you don't have to worry about defending those towns."
"0xe10f2f85" = "Then I look forward to doing business with you.<n>Deliver as much @G$Goods$ as you can to the market in @T$TOWN$. I will also be receiving several deliveries there and I will pay you @g$Price$ immediately.<n>The expeditionary convoy will arrive here on @D$EndDate$. Guarantee this convoy safe passage to Europe and I will pay you the rest of the gold."
