"0xdcba5843" = "会えてうれしいです、 @A$USER$ 。 助けが 必要なのです。 私は かつて海賊 @P$PirateName$ の下で 働いていました。 しかし目を 覚まし、 @T$TargetTown$ の総督と 取引したのです。 あいにく昔の仲間が それを 知り、 私の首に 賞金を かけました。 私を @T$TargetTown$ まで連れて行ってもらえませんか？"
"0xdcba5844" = "あなたは 信頼できると聞きました、 @A$USER$ 。 私は @T$TargetTown$ の総督に 仕えており、 極秘情報を 伝えるため至急会わねばなりません。 あいにく、 ある者たちが 私を @T$TargetTown$ へ行かせまいとしています。 そこでお尋ねしますが、 安全な航路を 提供してもらえませんか？"
"0xdcba5845" = "ああ、 災難が 続いています。 数週間前、 悪名高い海賊 @P$PirateName$ の船に 出くわしました。 しかしその船の船長は とても未熟だったらしく、 ほとんど苦も なく沈められました。<n>ところが、 その不運な船長は 海賊 @P$PirateName$ の可愛がっていた甥だったのです。 彼は 私の名を 聞いてからずっと私を 追っています。 乗員たちは 私の船を 奪って 恐怖で 逃げ出し、 私は ここで 足止めです。<n>故郷の @T$TargetTown$ まで行けるよう助けてもらえませんか？"
