"0xe7bffbb6" = "In Tortuga, the town's stocks have been destroyed by saboteurs. Many of the town's supplies have been lost, and the quality of life for the town's citizens has fallen dramatically as a result.<n><n>Your objective is to replenish the town's supplies as quickly as possible so the town's status can rise again.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>The town must reach the status \"boom\" by @D$EndDate$."
