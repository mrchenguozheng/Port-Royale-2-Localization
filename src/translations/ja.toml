"0x273267f2" = "Oh, I can't believe it. Drunkards have stolen my beautiful ship. They filled it with bottles of rum and made off. Can you help me search for my ship?"
"0x273267f3" = "I might have known. My feckless son Boris has borrowed my finest ship. I have now discovered that he and his friends have decided to set off on a jaunt. No doubt, they have filled the hold with rum and I'm sure that I will never see my ship again. Could you retrieve my ship for me?"
