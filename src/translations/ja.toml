"0x03d3dcd8" = "While looting the town, your crew also discovered where the Governor's wife was hiding and \"freed\" the woman. She wasin the kitchen at the time.<n> \"Don't take me back to the Governor in @T$TOWN$. I never loved him, I swear it!\".<n><n>Do you want to take this woman with you and bring her back to the Governor despite her pleas ? "
"0x03d3dcd9" = "While looting the town, your men come across a young lad with a poodle. The boy tells you that the Governor of @T$TOWN$ staged the kidnapping himself, in order to get rid of the dog. The captain decides to take Michelle on board his ship. He then wonders if it is worth returning the dog to the Governor of @T$TOWN$.<n><n>Do you want to throw the dog overboard?"
"0x03d6dcdb" = "海賊狩り"
"0x03dfeb8d" = "<c><o:0xFFFFE6A0>%1<n><o:0xFFEBF0A0>(player town)"
"0x03e1b0eb" = "What rotten luck! I must have regular stocks of colonial goods for the transport convoys from Europe, but we don't have the tools to be able to produce these goods in the first place. Would you not like to help me to supply a town with tools?"
"0x03e1b0ec" = "How could this happen! Supplies of tools have run low in @T$DestTown$ and now the production of colonial goods is threatened. Will you help me to solve this dilemma?"
"0x03e1b0ed" = "My nation lacks tools. We should obtain them from the other nations. What do you think?"
"0x03e9fe1e" = "トルトゥーガの危機"
"0x03efad5a" = "メッセージはありません"
"0x03efff11" = "You have made me so happy! Hurry to my father, he'll be overjoyed!"
"0x03f2ddbd" = " @A$USER$, come here and sit down, I have some business to discuss with you.<n>I'm trying to buy @G$Goods$ for @n$HostileNation$. As you know, @n$Nation$ and @n$HostileNation$ are at war. In fact, it is now a punishable offence in @n$HostileNation$ to import @G$Goods$ from @n$Nation$, and good prices are being paid accordingly. So I'd like to ask you if you'd be interested in a little smuggling?"
"0x03f2ddbe" = " @A$USER$, would you be interested in a little smuggling? I am here on behalf of a trader from @T$TargetTown$. Due to the war, no goods may currently be transported from towns of @n$Nation$ to @T$TargetTown$. The man who sent me is interested in @G$Goods$. He will pay you @g$Price$ for each barrel you deliver him. What do you say?"
"0x03fb5c67" = "As a result of your continuing poor relationship with %1, %3 of your businesses in %2 were seized today."
"0x03fb5c68" = "<n>I would advise you to pay one of my Governors a visit in order to improve your relationship with my nation."
"0x03fb5c69" = "<n>I would advise you to pay me a visit so that we can discuss your relationship with my nation."
"0x03fb5c6a" = "<n><n>%1, viceroy of %2"
"0x04081363" = "One of my rivals in @n$HostileNation$ has stolen my diaries and now wants to send them to Europe. It is vital that he does not succeed. Luckily, I was able to bribe the helmsman on the ship carrying the diaries to Europe. Now I need your help."
"0x04081364" = "We have been spied upon by @n$HostileNation$ for a long time. I have discovered that all the information gleaned has been carefully recorded and is now to be sent from @T$HostileTown$ to Europe. I want you to help me ensure that these documents never leave the Caribbean."
"0x040bf5f1" = "ゲームを送信"
"0x04100fa0" = "%1 ： 海賊の襲撃"
"0x0420c2a2" = "<ts:20>You already know how to buy and sell goods in the Trade window. Here are some more tips:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>The price shown on the arrows depends on the unit size<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>It doesn’t matter whether you buy or sell one good 10 times or buy or sell 10 goods once only. The total price is the same.<n><n><g:INTEXT_AUSRUF_800x600.screen>A price is always shown, even if a good is not available. This is always the price for a unit of goods, regardless of the unit size that is set.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>You can also trade by clicking on the symbol for a good. When you do this, a small window containing a scrollbar appears. You can use this scrollbar to specify how many goods you want to buy or sell. The individual price and the total price are then immediately displayed."
"0x0424bb9a" = "年代記"
"0x0436c531" = "You have found a very special ship!<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Steam-powered sailing ship<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>Never in your life have you seen such a ship! It seems to be powered not only by the sails on its twin masts, but also by a curious mechanism that uses steam to power two paddle wheels. Apparently, this allows the ship to keep moving even if there isn't a breath of wind."
"0x044bc6d2" = "船長は %1 との剣闘に勝利しました。 部下たちが海賊の宝を探し、 %2 を見つけます。<n><n>あなたは隠れ家を破壊し、 海賊 %3 の支配に終止符を打ちました。"
"0x044bc6d3" = "Your captain has won his sword fight with %1. Your men begin searching for the pirate treasure and find %2. While you have destroyed the hideout and successfully eliminated the dangers it posed, there are signs that you may not have destroyed all the ships. The remaining ships might seek out a new hideout."
