"0xcc823e54" = "We are at war with @n$TargetNation$ and, in light of recent events, the time has now come for us to retaliate. I want you to capture or sink military ships on my behalf. Do you accept this mission? "
"0xcc823e55" = "Just recently, @n$TargetNation$ attacked one of our towns. Now I'm planning my own military action against @n$TargetNation$ and was wondering if you'd like to be part of it? I want you to sink or capture military convoys. Everything you loot from them is yours to keep, all I care about is weakening @n$TargetNation$. Are you interested?"
"0xcc823e56" = "One of our towns has been attacked by @n$TargetNation$. We are now retaliating and sinking their ships. I would very much like to send you to a particular area and authorize you to capture or sink military ships. "
