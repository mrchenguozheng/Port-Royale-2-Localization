"0x184aee4b" = "互換性あり"
"0x18546893" = "In this scenario, you'll learn how to wage a battle at sea. The scenario begins with a short practice battle. Later, you'll have to track down and destroy the convoy of a notorious pirate.<n><n>You'll also get to know the Governor of Cartagena, where you start the scenario. He will help you to become accomplished in waging sea battles and later he will assign you the mission of hunting down a certain pirate.<n><n>Your rank at the start of the scenario is Sailor. You must have reached this rank in order to be assigned a mission by the governor. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Pay a visit to the Governor of Cartagena and accomplish the mission he assigns to you."
