"0x0ce1a79e" = "You are in the colonial town of Santa Marta. Click on the town name to display the town information."
"0x0ce1a79f" = "サンタマルタのような植民地の町は、 必需物資を 2 種、 原材料を 2 種、 植民地物資を 1 種生産できます。<n>前のシナリオで、 総督都市では原材料と 植民地物資の需要が 特に高いことを 学びました。<n>まずは植民地物資であるカカオを 生産しましょう。<n>では町の情報を 閉じてください。"
"0x0ce1a7a0" = "植民地物資は 総督都市から ヨーロッパへ 送られるため、 これらの町ではカカオの需要が 高いのです。 この条件は 最初の事業に 向いています。 では町の中心に ある親方建築士の建物を 探してクリックしてください。"
"0x0ce1a7a1" = "親方建築士のところでは、 新しい建物の建築許可を 申請したり、 建築許可を 返却したりできます。 もちろん今やりたいのは そちらではありません！<n>建てられる建物を 見てください。 親方建築士ウィンドウ右側のボタンも 使えます。<n>「カカオ農園」 ボタンを クリックしてください。"
"0x0ce1a7a2" = "必要な建材の数と 建設費が 分かります。<n>また、 倉庫に 今ある建材の数と、 町から 買い足す必要のある数も 分かります。<n>今は 建材が 足りています。<n>空いている建設用地に カーソルを 合わせ、 左クリックしてください。"
"0x0ce1a7a3" = "カカオ生産施設の足場が 表示され、 建設が 始まりました。<n>完成までに数日かかります。 その間に 新しい労働者の住まいを 用意しましょう。<n>建設メニューを 閉じ、 サンタマルタの住宅地区を 探してください。"
"0x0ce1a7a4" = "この住宅地区は 町の商人のものです。 地元の商人が いくつの住宅地区を 持ち、 入居者が 何人いるかを 確認できます。 あなたは 自分の住宅地区を 建てたいのです。 そのために 建設メニューを 開いてください。"
"0x0ce1a7a5" = "建設メニューで 住宅地区を 選び、 建設費の表示を 見てください。<n>倉庫に 建材が 足りないかもしれません。 ただし、 町に 十分な供給が あれば必要な建材を 買えます。<n>なければ別の町で 調達せねばなりません。<n>では住宅地区を 建ててください。"
"0x0ce1a7a6" = "事業 1 つにつき労働者 30 人を 雇えます。 平均的な労働者の家庭は 4 人家族なので、 事業 1 つにつき 120 人分の住まいが 必要です。<n>住宅地区 1 つは入居者 120 人分なので、 事業 1 つにつき住宅地区 1 つが必要に なります。<n>では建設メニューを 閉じ、 新しい住宅地区を クリックしてください。"
"0x0ce1a7a7" = "住宅地区には建設期間が ありません。 入居者は 最初テントに 住むからです。<n>やがて入居者自身が 住宅地区を 立派な建物へと発展させていきます。<n>住宅地区の見た目は、 築年数と 町の状態によって 変わります。<n>住宅地区のダイアログを 閉じてください。"
"0x0ce1a80f" = "ご存じのとおり、 町で 最初に 建てるものは 必ず倉庫です。 それを 建てるまで他の建物は 建てられません。<n>ゲームを 開始した町にはすでに倉庫が あります。 探してクリックしてください。 画面上では水色で 表示されています。"
"0x0ce1a810" = "倉庫では、 町で 所有している建物と その維持費が 分かります。<n>入居者が 払う家賃や、 事業が 生産している物資も 確認できます。<n>後には倉庫番に 指示も 出せるように なります。<n>倉庫を 見て回ってから閉じてください。"
"0x0cee08cc" = "この町の軍事力は もう少し欲しいところです"
"0x0cf75014" = "閉じる"
"0x0cf7abef" = "自分のカカオ農園を クリックしてください。 表示には常に、 町に ある自分のカカオ農園すべてが 出ます。<n>生産施設が 建つと、 労働者が 30 人、 つまり入植者 30 人が 必要に なります。 では農園を 出て、 港の船着場へ 行き、 「積荷」 ボタン （右側の一番下） を押してください。"
"0x0cf7abf0" = "ここでは、 町に 雇い待ちの入植者が いるか、 町が 新しい労働者を 必要と しているかが分かります。 事業の建設が 終わると、 そうなります。<n>周辺の総督都市へ 行き、 事業に 労働者が そろうまで入植者を サンタマルタへ 運んでください。"
"0x0d0db040" = "自分のカカオ農園の 1 つをクリックしてください。"
"0x0d0db041" = "自分の事業が 1 日に どれだけ カカオを 生産し、 そのために 道具が どれだけ 要るかが分かります。<n>倉庫は 事業に 物資を 供給するので、 倉庫に 道具を @a$SubGoal$ ためてください。"
"0x0d0db042" = "道具は 輸入品です。 つまり総督都市で 最も豊富に、 最も安く手に 入ります。<n>南西のカルタヘナか、 ずっと東のマルガリータで 調達してみるとよいでしょう。"
"0x0d0db043" = "よくやりました！<n>必要な原材料の平均価格が 低いほど、 生産する物資の生産費も 低くなります。<n>では倉庫に @a$AmountGoal$ たまるまでカカオを 生産し続けてください。"
"0x0d0f1795" = "7月"
"0x0d0f1877" = "6月"
"0x0d1098bd" = "%1,<n>あなたは このあたりでは新顔ですよね？ もう噂は 聞いていますし、 良い評判が 先に 立っています。 時々私を 訪ねてきてください。 仕事は いつでもあるのですから。"
"0x0d23b491" = "船団で カルタヘナの町へ 航海し、 町に 入ってください。<n>画面右の町の名前の下に、 小さな丸い記号が 出ています。 これは これまでのカルタヘナでの交易実績を 示しています。<n>このシナリオではボーナスが あるので、 少し楽に なっています。<n>では町の情報を 開いてください。"
"0x0d23b492" = "「交易実績」 では、 必要な到達度のうち何パーセントを 達成したかが分かります。 ここに 100% と出れば、 親方建築士に 許可を 申請できます。<n>町の情報を 閉じてください。"
"0x0d23b493" = "町で 不足している物資の価格は、 取引ウィンドウで 赤く表示されます。 こうした物資を 売れば、 その町での交易実績と、 その町が 属する国での名声の両方が 上がります。<n>船着場を 一度クリックして、 町の物資在庫の情報を 表示してください。"
"0x0d23b494" = "町で 足りない物資に 注目してください。 たとえばこの町は ラム酒と 衣類を 生産するので、 砂糖と 綿花は 常に必要です。<n>ただし町には他にも不足している物資が あります。<n>他の町へ 行ってカルタヘナが 必要と する物資を 買い、 交易実績を 上げてください。"
"0x0d23b495" = "悪くありません！ カルタヘナでのあなたの評価は かなり上がりました。<n>ただしカルタヘナで 不足している物資を 買い占めないよう気を つけてください！ 不足している物資は 在庫が 赤く表示されるので、 すぐに見分けられます。<n>交易実績の到達度を 85% まで上げてください。"
"0x0d23b496" = "よくやりました！ カルタヘナでの評価は 85% です。 この調子で 続けてください！<n>評価を 100% まで上げましょう。<n>ところで、 「昇進と 階級」 についてのメッセージが 届いています。"
"0x0d23b497" = "見事です！ これで カルタヘナとの交易は 十分です。<n>あいにく階級は まだ普通の船員なので、 許可は 1 枚しか与えられません。<n>次の階級に 上がるには、 もう少し交易して財産を 増やしてください。"
"0x0d23b498" = "上出来です！ 船員の階級なら、 建築許可を 2 枚まで得られます。<n>カルタヘナの親方建築士へ 行き、 許可を 申請してください。<n>金貨が 足りないなら、 もう少し交易してください。 サンタマルタで 生産している物資の交易も 忘れずに。"
"0x0d2a3b89" = "船の維持費"
"0x0d39b8e2" = "You must first build a warehouse in Cartagena before you can construct any other buildings."
"0x0d39b8e3" = "では織物工場を 2 つ建て、 住宅地区も 2 つ建ててください。<n>町に 建材が 足りなければ、 他の町で 買い、 港の倉庫へ 届けねばなりません。<n>大事な金貨を 手放す前に、 値段交渉を 忘れずに！"
"0x0d39b8e4" = "織物工場が 建つまでに、 倉庫に 綿花を @a$SubGoal$ 用意しておいてください。 そうすれば新しい事業が すぐに綿花から 布を 織り始められます。"
"0x0d39b8e5" = "次の目標は、 カルタヘナの倉庫用に 布を @a$SubGoal$ 自前で 生産し、 織物工場の完成を 待つことです。<n>布を @a$SubGoal$ 作るには、 綿花が ちょうど @a$SubGoal$ 必要です。"
