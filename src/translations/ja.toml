"0x20e2a2f4" = "1 日あたりの平均。 1 日の平均利益は %1 。"
"0x20eedea9" = "交易路を 保存できません。"
"0x20eef526" = "<ts:80><ts:145><ts:210><n>戦いの結果：<n><n>"
"0x20ff905e" = "乗員"
"0x2106ce9e" = "経験豊かな船長が 酒場で 待っています。"
"0x21117682" = "<n><n>You can usually hand back a building permit you have acquired. However, you cannot do so in this case because %1 is the town where you started the game."
"0x21117683" = "<n><n>Do you want to hand back your permit?<n>Remember that I can pay you nothing for it!"
"0x211c8552" = "ゲーム内時間切れ"
"0x2137ec23" = "Thank you. I will pay you high prices for wine, tools and spices until @D$Date$. Meet my emissary at the marketplace and deliver @a$Amount$ of each. He will only accept a complete delivery and will pay you there and then."
"0x2137ec24" = "That sounds good. So travel to our enemies' towns and buy up import goods there. Deliver @a$Amount$ of each by @D$Date$ to my emissary at the marketplace of @T$TOWN$, he will pay more than twice the usual price."
"0x2137ec25" = "Do you know what the best thing would be? To buy up the imported goods in @n$Nation2$ and cause a shortage there. Deliver @a$Amount$ of each to the marketplace. My emissary will wait there until @D$Date$ and will pay you a high price."
"0x215e37a6" = "I recently overheard a conversation in which a trader mentioned that one of his ships had sunk. He wasn't too concerned about the ship, as it was only a rickety old tub. But it had a special chest on board."
"0x215e37a7" = "We have an agreement then. On the last trip I signed on to, the captain lost his temper over a chest for some reason, which he then just dumped overboard."
"0x215e37a8" = "A man who was once a good friend has run off with an expensive chest of mine."
"0x2167838b" = "船の購入"
"0x21743bf7" = " I must have these things! We do not know the exact spot where the ship sank. @l$ChestPos$ Bring me the chest by @D$EndDate$."
"0x21743bf8" = "@D$EndDate$ までに品を 手に 入れてください。 @l$ChestPos$"
"0x21743bf9" = " Only recently he wrote to tell me he had thrown this chest overboard. @l$ChestPos$ You must bring me back my things! You can find me here until @D$EndDate$."
"0x217923cb" = "物資引き渡し終了： %1"
"0x2190d204" = "地元の商人が、 この事業に %1 を払う用意が あります。"
"0x21a69afe" = "マーケティング部長"
"0x21b0dfff" = "%1 が %2 を略奪"
"0x21b3050a" = "A military convoy has destroyed the town's harbor defenses and has looted goods. The status of the town has also fallen."
"0x21bdc952" = "次のグラフ"
"0x21bf83f0" = "船の情報を 常時表示"
"0x21c2f2cf" = "<n><o:0xffC00000>任務未達成。 <o:0xff000000>"
"0x21cae149" = "Very good! Now you have to make your convoy more powerful so that you'll be able to take on several military convoys. You should have at least three ships in your convoy that are frigates or larger ships.<n><n>You can capture the ships or try to purchase them in the shipyards of the governor towns.<n><n>Make these ships escort ships and ensure that they are fully-armed and fully-manned with sailors.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arm your convoy so that it has at least three fully-armed and fully-manned escort ships that are frigates or larger ships. "
"0x21d142f5" = "この町で 船団を 修理"
"0x21e727b4" = "I am certain that you have already heard of the pirate @P$PirateName$. He already has @I$NumConvoys$ convoys and we have not yet discovered his hideout. Fortunately, we know the whereabouts of one of his convoys. Perhaps he is still nearby. I want you to destroy this convoy. "
"0x21e727b5" = "We must act quickly, for I have just learned of the whereabouts of one of the convoys belonging to the pirate @P$PirateName$. Find and destroy this convoy."
"0x21e727b6" = "All pirates have their own hideout from which they dispatch convoys to capture booty. Meanwhile, the pirate @P$PirateName$ has amassed a fleet of @I$NumConvoys$ convoys. By chance, we have discovered the recent whereabouts of an important captain from this gang and his convoy. I want you to find and destroy this convoy."
