"0x0f52782d" = "Congratulations! You can now produce cloth from cotton in Cartagena.<n><n>As you can imagine, the costs of producing cloth depend to a large degree on the price you pay for the cotton. For this reason, you can only produce finished goods if you can be sure of being able to purchase the raw materials at a reasonable price. Alternatively, you can produce the raw materials yourself.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Build a cotton production facility in Santa Marta and trade to increase your cash to @g$GoldGoal$."
"0x0f5d7735" = "Far to the east of Charleston lie the Bermuda Islands. Steer well clear of them! Two months ago, my brother-in-law sailed there to explore them, but he never returned. No one knows what goes on there, but one thing is certain: A terrible fate awaits all those that dare to sail too close to the islands!"
"0x0f5d7736" = "Have you heard the latest story about the Bermuda Islands? A trader wanted to use the route leading past the islands to sail to Europe, but he never arrived there. His brother set out to search for him, but he found nothing but a few pieces of wreckage to the south of the islands."
"0x0f5d7737" = "Just the other day, a seaman from Port Royale told me that they recently sailed very close to the Bermuda Islands. They almost sailed too close, for with his own eyes, he saw a huge monster moving in the water. It was spitting fire and smoke belched from its long ears. Woe betide those that dare to approach this sea monster!"
