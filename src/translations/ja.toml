"0x00cde503" = "<ts:20>You have become an enemy of a nation for the first time. Here are some useful hints.<n>-<t>You only become an enemy if you attack the convoys and towns of a nation<n>-<t>You can bribe the governors of the nations, in order to improve your reputation. However, your reputation also automatically improves by a small amount every day, as your bad deeds are slowly forgotten<n>-<t>You may not dock in the harbor of enemy nations<n>-<t>If you sail to an enemy town in spite of this, you must anchor your convoy in secret: You can then enter the town, but you cannot trade there."
