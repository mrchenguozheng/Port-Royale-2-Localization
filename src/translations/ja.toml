"0xf22d73b9" = "You need tools to produce colonial goods. In the same way, you need raw materials to produce finished goods. Finished goods include rope and cloth, for example. The raw materials for these are hemp and cotton.<n><n>Now that you know how to build production facilities, you should purchase a building permit in a governor town and build facilities there for producing finished goods. However, before you can purchase a building permit, you must have established a proven trading record with the town, which means that you must sell goods to the town when they are in scarce supply.<n><n>But be careful! If you buy up scarce goods in a town, this has a negative effect on your trading record with the town! Goods that are scarce in a town are displayed in red in the Trade window.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Improve your trading record in Cartagena so that you can purchase a building permit there."
"0xf24b293b" = "ロード／セーブ"
"0xf253afcd" = "You can only enter a trade route if the captain of the convoy has %1 experience points. He currently has %2 points."
"0xf2590753" = "Thank you. It looks as though we shall not be receiving any imported goods from Europe in the near future. As we are currently at war with @n$HostileNation$, we have the opportunity of looting goods from the transport convoys of our enemies, without capturing or sinking their ships.<n>Please procure @a$Amount$ of each of the goods spices, wine and tools and deliver them to my trader at the market by @D$EndDate$."
"0xf2590754" = "Your mission is to attack and loot transport convoys belonging to @n$HostileNation$, without capturing or sinking their ships. You must then deliver the goods to the market. You have until @D$EndDate$."
"0xf2590755" = "So be it. Go in search of transport convoys belonging to @n$HostileNation$ and loot @a$Amount$ of the imported goods on board. You then have until @D$EndDate$ to hand over the goods to a trader, who will be waiting for you at the market. A word of advice: Due to the very tense situation that presently exists in the region, you may only loot the ships and must neither capture nor sink them!"
