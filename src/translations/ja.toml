"0x0f52782d" = "おめでとうございます！ これで カルタヘナで 綿花から 布を 生産できます。<n><n>ご想像のとおり、 布の生産費は 綿花の仕入れ値に 大きく左右されます。 ですから、 原材料を 妥当な値段で 買える見込みが あるときにしか加工品は 作れません。 あるいは原材料を 自分で 生産する手も あります。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>サンタマルタに 綿花生産施設を 建て、 交易で 現金を @g$GoldGoal$ まで増やしてください。"
"0x0f5d7735" = "チャールストンのはるか東に バミューダ諸島が あります。 近づかないように！ 2 か月前、 義理の兄が そこへ 探検に 出たまま戻りません。 そこで何が 起きているのか誰も 知りませんが、 確かなことが 一つあります。 島に 近づきすぎた者には恐ろしい運命が 待っているのです！"
"0x0f5d7736" = "バミューダ諸島の最新の話を 聞きましたか？ ある商人が 島のそばを 通る航路で ヨーロッパへ 向かったまま、 着かなかったのです。 弟が 捜しに出ましたが、 島の南で いくつかの残骸を 見つけただけでした。"
"0x0f5d7737" = "つい先日、 ポートロワイヤルの船乗りが 話してくれました。 最近バミューダ諸島のすぐそばを 航海したそうです。 危うく近づきすぎるところでしたが、 自分の目で 水中を 動く巨大な怪物を 見たと言います。 火を 噴き、 長い耳から 煙を 吐いていたそうです。 この海の怪物に 近づこうとする者に 災いあれ！"
