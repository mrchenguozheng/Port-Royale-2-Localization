"0x077030da" = "おめでとうございます！ このシナリオを 達成し、 海戦と 港への攻撃を 少し経験しました。<n><n>他の船団を 攻める前に、 護衛船が 十分に 武装しているか必ず確かめてください。 もちろん、 どの船団を 攻めるかもよく考えるべきです。 ヨーロッパからの輸送船団や 軍事船団は いつも非常に 強力で、 海賊も しばしば手強い相手に なります。<n><n>ある国の総督から 私掠免許状を 受け取らずに商人を 攻撃すると、 すべての国でのあなたの名声に 大きく響きます。 最悪の場合、 強力な軍事船団が あなたの船団を 追ってきます。<n><n>忠告です。 交易船団を 拿捕しても船を 沈めず、 積荷だけを奪えば、 名声への悪影響は ずっと小さくなります。"
