"0x22fffe32" = "My darling %1,<n>I can barely contain my impatience. Please hurry to the market and deliver the goods for the wedding, so we can have the banquet soon."
"0x2310e7f4" = "To display the next scenario objective, you must accomplish your mission to capture the towns."
"0x2335f663" = "Thank you for returning the package to me. Here is your reward of @g$Reward$."
"0x234d00d9" = "Today, the pirate %1 started wreaking havoc in the Caribbean."
"0x23652698" = "Unfortunately, I cannot tell you anything definite. My harbor master gave me a vague description of the ship that they may have taken. A trader spotted this ship at sea and showed me the spot. @l$Pos$ Search this area, you may find a clue."
"0x23652699" = "The position is @l$Pos$. Search this area, you may find a clue. Please bring me back my daughter safe and sound."
"0x2365269a" = "The position is @l$Pos$. Search this area, perhaps @F$WifeName$ was trying to tell us something when she mentioned it. Please bring my daughter back safe and sound. And if you come across that Casanova, give him my best regards."
