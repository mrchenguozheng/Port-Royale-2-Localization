"0xfc71eb4b" = "なんという不運でしょう。 @n$FoeNation$ との戦争が 始まってから、 輸送船団に 回す植民地物資を 十分に 集められません。 @G$Goods$ を大量に 届けて助けてもらえませんか？"
"0xfc71eb4c" = "@n$FoeNation$ と戦争に なってから、 相手の商人は わが国の町へ @G$Goods$ を届けることを 禁じられています。 おかげで 物資が ひどく不足しています。 あなたは 船を 多く持ち、 海を よく知っています。 @G$Goods$ を大量に 確保してもらえませんか？"
