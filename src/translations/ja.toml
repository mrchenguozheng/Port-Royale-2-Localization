"0x0d9c1799" = "あなたの任務は、 @D$EndDate$ までに @T$TargetTown$ の状態を 「不況」 まで落とすことです。 方法は 二つあります。<n><n>町を 攻撃して物資を すべて奪い、 状態を 「回復」 まで下げる。 その後は 物資不足で 状態が 下がり続けます。<n><n>あるいは、 交易船団を 迎撃して町への物資供給を 断つ。 注意： 船団を 拿捕せず略奪だけ なら、 その国での名声の損害は ずっと小さく済みます。"
"0x0d9c179a" = "よろしい！ @T$TargetTown$ の町を 「不況」 に陥れる任務を 命じます。 期限は @D$EndDate$ です。<n><n>目的を 果たすには、 町を 訪れる商人を すべて迎撃し、 物資が 届かないように して状態を ゆっくり下げさせてください。<n><n>ただし、 もっと早く進める方法も あります。 町を 攻撃して略奪するのです。 攻撃で 状態が 「回復」 まで急落し、 その後の物資不足で さらに下がり、 やがて 「不況」 に至ります。"
