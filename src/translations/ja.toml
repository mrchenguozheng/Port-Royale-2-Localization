"0xcc823e54" = "我々は @n$TargetNation$ と戦争中で、 最近の出来事から、 そろそろ報復すべき時が 来ました。 私に 代わって軍船を 拿捕するか沈めてください。 この任務を 受けますか？"
"0xcc823e55" = "つい先ごろ、 @n$TargetNation$ が我々の町を 攻撃しました。 今こそ @n$TargetNation$ への軍事行動を 考えており、 あなたも 加わりませんか？ 軍の船団を 沈めるか拿捕してください。 奪ったものは すべてあなたのもの、 私が 望むのは @n$TargetNation$ を弱めることだけ です。 興味は ありますか？"
"0xcc823e56" = "我々の町の一つが @n$TargetNation$ に攻撃されました。 今は 報復として 相手の船を 沈めています。 あなたを 特定の海域へ 送り、 軍船の拿捕や 撃沈を 許可したいと思います。"
