"0xf88d6ee5" = "Deliver any amount of @G$Goods$ to the market in @T$TOWN$. There you will receive @g$Price$ per barrel immediately. On @D$EndDate$, an expeditionary convoy will collect the goods. Escort the convoy to Europe and you will receive another @g$Price$ per barrel."
"0xf894bc2d" = "The convoy cannot set sail because some of your ships are in very poor condition. Have your convoy repaired in the shipyard before sending it to sea again. Alternatively, you can take the damaged ships out of the convoy and have them repaired separately."
"0xf89f542f" = " You have received <o:0xff1e1eff>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GOLD_800x600.screen>."
"0xf8af3810" = "ここに必要なものはすべてそろっています。"
"0xf8b3a303" = "The status of a town can advance through seven levels, from poverty to wealth. At the lowest two levels, the quality of life is so bad that citizens regularly leave the town. On the other hand, when a town reaches the levels of “flourishing economy”, “wealth” and “riches”, your businesses receive an efficiency bonus and your workforce is more cost-efficient. At the highest level, a town even produces its own settlers.<n><n>You will find more information on the effects of each status level in the town information. To display this, click on the town name.<n><n> A sufficient supply of two to three goods in each goods group will ensure a good quality of life in your town. The supply of a good is sufficient if it can cater for the town’s population for ten days.<n><n>Note: A town's status doesn't improve overnight. It takes a while for the town’s citizens to adapt to a new situation."
