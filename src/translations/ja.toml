"0x15ba13db" = "I see you have a piece of a treasure map in your log. Would you be interested in a new piece? You never know, perhaps it will already be enough for you to find the treasure.<n>I'll give it to you for @g$Price$."
"0x15ba13dc" = " @s$USER$, I've heard you are interested in treasure maps. I have a piece here that belongs to your map. I'll give it to you for @g$Price$."
"0x15ba13dd" = "Good day, @s$USER$. I hear you have an incomplete treasure map in your possession, do you not? I would like to offer you another piece belonging to your map. I'm only asking @g$Price$ for it."
"0x15be02a9" = "日付"
"0x15c6f8fc" = "プレイヤー名"
"0x15c7f2e0" = "（船団が積載超過です）"
"0x15d892f9" = "Tiepolo_bold14x14aaFH.res"
"0x15d8bad1" = "Good! The town in question is @T$TargetTown$. In order to bring them to heel, the Viceroy of @n$TargetNation$ has forbidden all traders to sail to the town. If we can succeed in restoring wealth by supplying the town, then we can certainly count on its citizens' allegiance. You have until @D$EndDate$ to complete this mission."
"0x15d8bad2" = "I refer to the town of @T$TargetTown$. All traders have been forbidden to sail to the town. Your mission is to supply the town in order to restore its wealth. In this way, we can make clear our interest in @T$TargetTown$. You have until @D$EndDate$ to accomplish your mission."
"0x15d8bad3" = "The matter is this: The viceroy has forbidden all traders to sail to the town of @T$TargetTown$. By doing this, he wants to exert pressure on the town council. If you succeed in supplying @T$TargetTown$ enough goods to allow wealth to be restored by @D$EndDate$, I have no doubt that I can arrange a peaceful change of national allegiance."
"0x15e96b4c" = "セーブ"
"0x15f470e9" = "海戦を終了"
"0x15f6d04b" = "You have won the sea battle. Do you want to call off the attack?"
"0x15fd96d6" = "You have purchased a building permit and you may now build in this town. Your first building must be a warehouse.<n><n>Note: The more building permits you have, the more expensive the next one will be and the longer it will take for your trading record in other towns to improve."
"0x1605422d" = "隠れ家"
"0x161f0ab3" = "階級"
"0x1629fb20" = "%1,<n>there you are again. Come, I may have some news for you."
"0x1629fb21" = "%1,<n>you weren’t gone for long this time. Have you nothing else to do?"
"0x1629fb22" = "%1,<n>I was not expecting to see you again so soon. I don’t believe I have any news for you as yet."
"0x162a5cb6" = "物資の隠し場所"
"0x163fff71" = "%1,<n>nice of you to drop by. Shall I tell you of the latest events I've heard?"
"0x163fff72" = "%1,<n>it's good to see you again. In the last couple of days, I’ve asked around and I may now have some news for you."
"0x163fff73" = "%1,<n>there you are again, I’m glad to see. I believe I may have some information for you."
"0x165603c2" = "%1,<n>it’s been quite a while, but I’m happy to see you again. I have some news for you."
"0x165603c3" = "%1,<n>I was just about to go out to visit someone, as things are rather boring for me around here. But now you’re here. Come, I have something to tell you."
"0x165603c4" = "%1,<n>There you are, I was just wondering where you’ve been all this time. I have some news for you."
"0x1659b12c" = "You now have enough gold to increase your convoy's firepower. Look in the shipyards in the Governor towns for the most powerful ship you can afford.<n><n>Then add this ship to your convoy and take more cannons and sailors on board. If you don't have enough gold, trade some more.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Increase your convoy's firepower to at least 90 cannons."
"0x165fc28e" = "新しい町を訪れて造船所を建ててください。"
"0x16656b80" = "%1 %2<g:scripts/intext_herz_800x600.screen>"
"0x1666a42c" = "%1 、 会えてうれしい。"
"0x1666a42d" = "待っていましたよ、 %1 。"
"0x1666a42e" = "お会いできてうれしいです、 %1 。"
"0x166c0813" = "%1,<n>it’s you, is it? I hardly recognize you. I understand that your adventures take up a lot of your time. However, you really could visit me more often."
"0x166c0814" = "%1,<n>do you want me to have to spend all of my time at the inn just for some company? You really should visit me more often!"
"0x166c0815" = "%1,<n>l allow all the visiting traders to be in and out here all day long, just so I can have some company. Could you not manage to drop by more often?"
"0x1680be32" = "収容能力"
"0x1688414b" = "宝船団を略奪"
"0x16cc82c9" = "Deliver @G$Goods$ by @D$EndDate$ to a person in @T$TargetTown$. You will then be paid @g$Price$ for each barrel delivered."
"0x16e90f87" = "You have found the missing package. Bring it to @N$OwnerName$ in @T$TOWN$ by @D$EndDate$. "
