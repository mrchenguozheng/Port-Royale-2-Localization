"0xdf10406e" = "Well done! Your town has already grown a little.<n><n>As soon as your town has more than 1,000 inhabitants, it will be of interest to traders from other towns, who may come to trade their goods.<n><n>Traders usually visit a town if there is a demand in the town for a certain good, in other words, if there are some goods that are not available in your town.<n><n>You have just received a message about trade and production in your own town. To read it, open the log.<n><n>Your first objective is to increase the population of your town to 1,000.<n><n>Note: If a town is to have more than 500 inhabitants, it must have an inn!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Increase the population of your town to 1,000."
