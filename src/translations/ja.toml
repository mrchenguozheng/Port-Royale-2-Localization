"0x1b0a0b6d" = "You have reached the rank of “Sailor”. As of today, you must do something to maintain your high reputation with a nation.<n><n> You can improve your reputation with the nations by trading, donating to the church, organizing celebrations, destroying pirates as well as by accomplishing missions and Letters of Marque.<n><n>If your reputation with a nation does not improve, it diminishes by a very small amount every day. Note that the number of buildings you have built in the towns of a nation determines how low your reputation can become in this way.<n><n>Your reputation influences both the trading prices and the assignment of missions in the towns. If your reputation is low, you should also beware of military convoys!"
"0x1b33d8e6" = "未使用の物資を 輸送できます！"
