"0xfb343dde" = "While you are looting the town, a young woman comes running up to you.<n>\"I know this attack is only being carried out on my father's orders! Did he tell you that I am here of my own free will and that I am truly in love with my abductor? I beg you not to take me back, I will reward you!\".<n><n>Do you want to abandon the daughter to her fate here in @T$TargetTown$?"
