"0x3933132f" = "Oh @s$USER$, what am I to do? A trader from @T$Town$ keeps interfering in my business and snatching my profits. This has been going on for months. Can you help me get rid of his convoy?"
"0x39331330" = "Can you help me arrange a little act of reprisal? I am quite certain that a trader from @T$Town$ was responsible for sabotaging some of my ships. Now I can only sit and wait for my ships to return from the shipyard. I want you to destroy a convoy belonging to my ruthless adversary. I will reward you handsomely!"
"0x39331331" = "Are you not @A$USER$? I may have a task for you.<n>A long time ago, I gave a sizeable loan to a trader from  @T$Town$ and it is nearly as long since he was supposed to have repaid it.  Well, he did not do so and it don’t think it will occur to him to do so in the future.<n>Therefore, I want to teach him a lesson! Would you attack one of his convoys for me? I will reward you richly!"
