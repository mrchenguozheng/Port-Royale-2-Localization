"0x204cf373" = "町を 支援"
"0x204d1e7c" = "海賊の隠れ家は 海からしか攻撃できません。"
"0x20574fcc" = "%1, you have captured the beloved town of my father for %2! I want nothing more to do with you. I hope I never see you again. You should know that you never meant anything to me and that I won't spare you a thought in the future.<n>I sincerely hope that, sooner or later, you receive the punishment that you so richly deserve.<n><n>%3"
"0x20574fcd" = "%1, by carrying out the annexation for %2, you have forced the viceroy to move to the beloved town of my father, who must now return to Europe.<n><n>I want nothing more to do with you. I hope I never see you again. I also want you to know that I was always far more interested in the traders at the inn than I ever was in you. You never meant anything to me and you will be the last thing on my mind from now on.<n><n>I sincerely hope that, sooner or later, you receive the punishment you so richly deserve.<n><n>%3"
"0x2065f070" = "Look here. I have just received a message from my ambassador informing me that %1 has made us a unexpected peace offering. This means that we will probably make peace as early as today. <n><n>Therefore, I can no longer assign you a mission to capture a town."
"0x207295a1" = "A trade route already exists with the name '%1'.<n><c>Do you want to overwrite it?"
"0x2077407d" = "%1,<n>I am glad that you have come. Come in and I'll see if I have something for you."
"0x207a9d35" = "The commander of the town guard calls to your captain from the town wall,  asking him to call off the battle and fight a duel with him instead. To avoid further losses, your captain agrees."
"0x207b620f" = "After your troops have destroyed the town gate, they are confronted by the commander of the town guard. He challenges your captain to a duel."
"0x208aca1b" = " Keep a lookout for English convoys in the area and destroy @I$NumConvoys$ of them."
"0x208aca1c" = " Keep a lookout for French convoys in the area and destroy @I$NumConvoys$ of them."
"0x208aca1d" = " Keep a lookout for Dutch convoys in the area and destroy @I$NumConvoys$ of them."
"0x208aca1e" = " Keep a lookout for Spanish convoys in the area and destroy @I$NumConvoys$ of them."
