"0xdf10406e" = "よくやりました！ 町が 少し育ちました。<n><n>人口が 1,000 人を 超えると、 他の町の商人が 興味を 持ち、 品を 売りに来るかもしれません。<n><n>商人は 通常、 町に ある物資への需要、 つまり町に ない物資が あるときに 訪れます。<n><n>自分の町の交易と 生産についてのメッセージが 届きました。 ログを 開いて読んでください。<n><n>最初の目標は、 自分の町の人口を 1,000 人まで 増やすことです。<n><n>注意： 人口 500 人を 超える町には酒場が 必要です！<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>自分の町の人口を 1,000 人まで 増やしてください。"
