"0xe38974d7" = "残高："
"0xe3922641" = "The needle of this compass moves very freely and settles into position very quickly. You have never seen such an accurate compass.<n>The compass is wrought like a piece of jewelry and the underside is adorned with various engravings."
"0xe3922642" = "The pair of compasses sits beautifully in your hand and is very easy to use. It seems to be made entirely of gold and is decorated with an intricate pattern."
"0xe3922643" = "This sextant gives an accurate bearing even in heavy seas. Parts of the sextant are mounted on springs, which helps to reduce any strong vibrations."
"0xe3922644" = "This instrument is a double spy-glass that allows you to see into the distance with both eyes simultaneously. You can slide colored glass over the lens to protect your eyes . A mysterious engraving is discernable on the side."
"0xe3922645" = "This is an ordinary gold watch, but it is smaller than any you have ever seen. On a disc behind the face, you also notice a moon that seems to be slowly rotating. There are also some engravings on the back of the watch."
"0xe3922646" = "This lamp is similar to a normal lantern. However, lots of mirrors are arranged around the burning wick so that the light shines in one direction only. By using a device resembling a fan over the aperture, you can switch the light emitted on and off very quickly."
"0xe3922647" = "A ruler that can slide back and forth is set into another ruler. A sliding bracket made of transparent material is attached to this. You could use this device to carry out simple calculations very quickly."
"0xe3922648" = "This strange device looks like an arrow. The vanes on it cause it to rotate as soon as you hold it in the water. A little dial counts each revolution, thus enabling you to calculate the ship's speed very accurately."
"0xe3922649" = "This instrument consists of rotating vanes and a dial that displays the rotational speed of the vanes. By holding the vanes in the wind, you can read the direction and speed of the wind. The instrument is meticulously crafted and marked with an unknown symbol."
"0xe392264a" = "Although this rope must have been exposed to seawater for some time, it looks as if it had just been made. It feels wonderfully smooth and ties very strong knots."
"0xe39226b2" = "This folio contains a multitude of beautiful star charts. A large table specifies precisely when and where each individual star rises and falls."
"0xe39226b3" = "A round disk, finely engraved, into which various smaller round disks are set. You could use it to see which part of the starry sky is currently visible, depending on the date and time.<n>Markings on the disk show that this instrument was once used to determine a ship's position in a particular region."
"0xe39226b4" = "When you turn a handle, a large horn emits the dulcet tones of a woman singing. Just the thing for sailors at sea for weeks on end."
"0xe39226b5" = "A large piece of rounded glass is mounted on the end of a golden rod. If you hold it over a map, the finest lines are clearly visible even in poor light."
"0xe39226b6" = "This small metal table is made of solid brass and is constructed in such a way that its surface always remains horizontal regardless of the pitch of the ship. The outer metal ring is engraved with markings that seem to indicate directions. However, you cannot identify the region in which the table was once used."
"0xe39226b7" = "A small box contains an ornate device that can be used to light a fire very easily. This box is covered in mysterious engravings."
"0xe39226b8" = "This anchor is more decorative than practical. At best, it could be used to anchor a rowing boat.<n>It is very heavy for its size and is covered with intricate decorations and unknown lettering."
"0xe39226b9" = "This device is like an oil lamp with its own flint. If you turn the small wheel, sparks fly onto a wick and can ignite a flame even in a strong wind."
"0xe39226ba" = "This horn is not sounded with your mouth, but by using a device that resembles a pump. If you press it down hard, the horn sounds louder than you would have believed possible."
"0xe39226bb" = "This chart looks very different to the ordinary sea charts that are available. It is very detailed and has been drafted using several colors. However, you cannot identify which area is shown on the chart."
"0xe39bb702" = "船団は大砲を積みすぎているため出航できません。 大砲を売るか倉庫へ移して、 最大数を超えないようにしてください。"
