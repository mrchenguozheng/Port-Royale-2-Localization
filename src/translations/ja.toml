"0xf7c59ef9" = "There is a shortage of @G$Goods$ for processing in my town. The stocks of the various businesses are already very low. Could you help me?"
"0xf7c59efa" = "I recently had the Association of Catholic Producers on my doorstep. They are complaining that there is not enough @G$Goods$ in the town. I had to endure their complaining for three hours. I cannot go through that again. Could you not help to extricate me from this delicate situation?"
"0xf7c59efb" = "Curses! Once again, my town has run short of @G$Goods$. It is sometimes quite beyond me how the resident traders carry on their business. Until I have sorted this matter out, I would be grateful if you could help me."
