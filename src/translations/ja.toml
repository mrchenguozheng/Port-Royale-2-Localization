"0xcd01da76" = "You start the game with the rank of Sailor in the Spanish governor town of @T$TOWN$, where you already have a warehouse. You also have a convoy in the harbor with two armed ships but no sailors.<n><n>The first objective in this scenario is to visit the Governor of @T$TOWN$ and accept his mission. He is having problems with the notorious pirate, Edward Teach, better known as Blackbeard, and wants you to help him.<n><n>Important: The nations are at peace in this scenario. This means that you must never attack a convoy belonging to a nation.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visit the Governor of @T$TOWN$ and accept the mission he assigns to you."
