"0xe3922645" = "ごく普通の金時計ですが、 これまで 見たどれよりも小さいものです。 文字盤の裏の円盤には、 ゆっくり回っているように 見える月が 描かれています。 時計の裏にもいくつか刻印が あります。"
"0xe3922646" = "このランプは 普通のカンテラに 似ています。 しかし燃える芯の周りに 多くの鏡が 並べられ、 光は 一方向だけに射します。 開口部に 扇のような装置を 使うと、 放つ光を 素早く点滅させられます。"
