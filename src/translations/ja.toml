"0x0f1ade15" = "では町に 仕事を 作り、 住宅地区を 建ててください。<n><n>入植者は 働き口が あるときにしか町に 残らないので、 まず生産施設を 4 つ建てましょう。 どんな生産施設を 建てるか決めてください。 ただし生産費は 高く、 物資を 売った利益に 頼るのですから、 他の町で 利益を 出して売れる物資だけを生産するように。<n><n>生産施設 4 つで労働者 120 人分の仕事が できます。 労働者は それぞれ 4 人家族なので、 市民 480 人分、 つまり住宅地区 4 つ分の住まいが 必要です。<n><n>生産施設と 住宅地区が できたら、 他の町から 自分の町へ 入植者を 連れてきましょう。 入植者は 普通、 総督都市で 仕事を 待っています。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>自分の町の人口を 480 人まで 増やしてください。"
