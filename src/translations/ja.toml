"0x072a9579" = "輸入品を 届けてくれて本当に感謝しています。 新世界の我々には、 もう何週間も 自国の輸送船団が 来ていないのです。 褒美として、 オランダの交易フリュート船を 2 隻差し上げます。 港で あなたを 待っています。"
"0x0744a699" = "宝船団が あと何の町を 訪れるかは分かりません。 確かなのは、 町を 訪れるたびに 船団がより多くの金を 積み込むことだけ です。 いつ攻めてもかまいません。 金は あなたのものに できますから。 私が 望むのは、 宝船団を 消えさせることだけ です。 最後に 確認されたのは @T$StartTown$ で、 次に寄港するのは @T$DestTown$ 、 そこではおよそ 5 日間停泊します。"
"0x0744a69a" = "ですから急いでください。 最後に 確認されたのは @T$StartTown$ で、 そこから @T$DestTown$ へ向けて出航し、 そこではいつもより長く停泊します。 攻撃を 遅らせるほど、 船団の積む金は 増えます。 全部あなたのものに してかまいませんが、 宝船団は 決してヨーロッパへ 着かせてはなりません。"
"0x0744a69b" = "では決まりですね、 感謝します。 私の情報が 正しければ、 宝船団は 先ごろ @T$StartTown$ を出て @T$DestTown$ へ向かっています。 そこではいつもより長く停泊するでしょう。 では急いで迎撃してください！"
"0x0746253d" = "できるだけ多くの商人に 自分の町へ 来てほしいなら、 特定の物資を あえて町に 供給しないのが よいでしょう。 近くの町で 生産される物資を 選ぶのが 理想的です。 商人は 移動距離も 考慮するからです。<n><n>自分の町を 訪れた商人は、 町に 豊富に あり値段の安い物資を 自動的に 買います。 自分で 生産した物資を 町に 直接売ることも できます。 他の町より 高くなければ、 商人が 定期的に 買っていきます。<n><n>そうすれば市民に 必要な物資が 常に足り、 他の町へ 運ぶ手間も 考えずに済みます。"
