"0xde535352" = "Unfortunately, a plague has broken out in Tortuga. It will rage in the town for about one month. The town's status falls considerably and its citizens are dying every day. Many citizens are terrified of the disease and are fleeing.<n><n>For you as a trader, it is also of interest that the demand for garments and wood is doubled in the town while the plague rages.<n><n>Your task now is to ensure that the town is supplied during the plague and to ensure that the number of citizens does not fall.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>The number of citizens (inhabitants minus soldiers) must be restored to @I$Pop$ by no later than 20 days after the end of the plague. This will ensure that all businesses have a full complement of workers."
