"0x1f36e96b" = "A transport convoy will be arriving here shortly. A spy has told me that our enemy is planning to attack this convoy on its return voyage to Europe. Can you protect the convoy on its way home? "
"0x1f36e96c" = "I have a problem. My wife wants to travel to Europe on the next convoy, in order to visit her family. Unfortunately, @n$HostileNation$ has learned of this and is planning to intercept the convoy. Can you guarantee my wife safe passage?"
"0x1f36e96d" = "I will soon be sending important documents to Europe. As we are currently at war with @n$HostileNation$, I am taking no risks and want to arrange an additional escort. Could you provide this escort? "
"0x1f6696d2" = "I'm sorry, it turns out I can't give you this mission after all. I have just received a message telling me that the problem no longer exists."
"0x1f851477" = "この任務を 遂行するはずだった船団は 撃破されました。"
"0x1f890b43" = "物資の需要"
"0x1f9a14b7" = "<n><n>To attack the hideout, you must send a convoy there in the same way you would send one to a town. Watch out! Any pirate convoy that is not in the hideout when you attack will be warned and will set up a new hideout."
