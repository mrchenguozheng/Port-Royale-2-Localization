"0xfda277f4" = "%1 is full and no longer has any space on which to build a warehouse. If you want to gain a foothold in this town in spite of this, you can try to persuade one of the local traders to demolish one of his businesses.<n><n>Businesses are demolished if the price in the town for the goods produced remains at a low level over a long period, that is, if there is a surplus of the good. To achieve this, you must first start to hoard the product. Then sell sufficient quantities of the product at the town market to drive the price down to a low level.<n><n>The goods produced are delivered to the town market once a day. If the price is currently minimal, the business reduces its complement of workers. You can check this by clicking on the business. A business is demolished once 30 workers have been made redundant."
