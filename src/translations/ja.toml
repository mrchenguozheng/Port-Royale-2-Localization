"0xe7ba475b" = "海戦"
"0xe7bffbb6" = "トルトゥーガでは、 破壊工作によって 町の在庫が 破壊されました。 町の備蓄の多くが 失われ、 その結果、 市民の生活水準が 大きく下がりました。<n><n>あなたの目標は、 できるだけ早く町の備蓄を 補って状態を 再び上げることです。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>町の状態を @D$EndDate$ までに 「好況」 にしなければなりません。"
