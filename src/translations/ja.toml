"0xe84971d5" = "妻"
"0xe84c0654" = "@T$Town$ で小さな問題を 抱えています。 妻に、 あそこに 学校を 建てると約束したのです。 あいにく親方建築士との関係は 極めて険悪なままで、 彼は 私が 町のことに 口を 出すのを 決して許しません。 代わりに 学校を 建ててもらえませんか？"
"0xe84c0655" = "@T$Town$ の富を 増やすため、 この町に 学校を 建ててほしいのです。 実は @T$Town$ 自体には何の思い入れも ありませんが、 妹が そこに 住んでいて、 他の町のほうが 良いなどとどうしても認めないのです。"
"0xe84c0656" = "総督代理から @T$Town$ を支援するよう指示されました。 ですから町の学校の費用を 喜んで払うつもりです。 しかし町議会は 私の申し出を 断り、 干渉されたくないので金貨を 直接もらいたいと言います。 そこで、 あなたが 学校を 建ててくれないかと。"
"0xe88ea6ee" = "船団名で"
"0xe8925b0d" = "決闘"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>あなたの船長は 左側に います。 操作は 次のとおりです：<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>攻撃<f:fonts/Tiepolo_bold14x14aaFH.res><n>攻撃するには、 相手の体の一部を 左クリックします。 体のいろいろな場所を クリックすると、 当たる確率が 上がります。<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>防御<f:fonts/Tiepolo_bold14x14aaFH.res><n>相手が 攻撃の構えを 見せたら、 良いタイミングで 右マウスボタンを クリックして受け流します。<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>特殊攻撃<f:fonts/Tiepolo_bold14x14aaFH.res><n>攻撃のあと船長が 元の位置に 戻る直前に、 左マウスボタンを 押します。<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>持久力<f:fonts/Tiepolo_bold14x14aaFH.res><n>攻撃するたびに 船長の持久力が 減り、 攻撃の合間に 回復します。<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>反応時間<f:fonts/Tiepolo_bold14x14aaFH.res><n>決闘に 勝つほど、 より速い反応が 求められます。"
