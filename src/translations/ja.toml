"0x0ce1a79e" = "ここは 植民地の町サンタマルタです。 町の名前を クリックすると町の情報が 出ます。"
"0x0ce1a79f" = "サンタマルタのような植民地の町は、 必需物資を 2 種、 原材料を 2 種、 植民地物資を 1 種生産できます。<n>前のシナリオで、 総督都市では原材料と 植民地物資の需要が 特に高いことを 学びました。<n>まずは植民地物資であるカカオを 生産しましょう。<n>では町の情報を 閉じてください。"
"0x0ce1a7a0" = "植民地物資は 総督都市から ヨーロッパへ 送られるため、 これらの町ではカカオの需要が 高いのです。 この条件は 最初の事業に 向いています。 では町の中心に ある親方建築士の建物を 探してクリックしてください。"
"0x0ce1a7a1" = "親方建築士のところでは、 新しい建物の建築許可を 申請したり、 建築許可を 返却したりできます。 もちろん今やりたいのは そちらではありません！<n>建てられる建物を 見てください。 親方建築士ウィンドウ右側のボタンも 使えます。<n>「カカオ農園」 ボタンを クリックしてください。"
"0x0ce1a7a2" = "必要な建材の数と 建設費が 分かります。<n>また、 倉庫に 今ある建材の数と、 町から 買い足す必要のある数も 分かります。<n>今は 建材が 足りています。<n>空いている建設用地に カーソルを 合わせ、 左クリックしてください。"
"0x0ce1a7a3" = "カカオ生産施設の足場が 表示され、 建設が 始まりました。<n>完成までに数日かかります。 その間に 新しい労働者の住まいを 用意しましょう。<n>建設メニューを 閉じ、 サンタマルタの住宅地区を 探してください。"
"0x0ce1a7a4" = "この住宅地区は 町の商人のものです。 地元の商人が いくつの住宅地区を 持ち、 入居者が 何人いるかを 確認できます。 あなたは 自分の住宅地区を 建てたいのです。 そのために 建設メニューを 開いてください。"
"0x0ce1a7a5" = "建設メニューで 住宅地区を 選び、 建設費の表示を 見てください。<n>倉庫に 建材が 足りないかもしれません。 ただし、 町に 十分な供給が あれば必要な建材を 買えます。<n>なければ別の町で 調達せねばなりません。<n>では住宅地区を 建ててください。"
"0x0ce1a7a6" = "事業 1 つにつき労働者 30 人を 雇えます。 平均的な労働者の家庭は 4 人家族なので、 事業 1 つにつき 120 人分の住まいが 必要です。<n>住宅地区 1 つは入居者 120 人分なので、 事業 1 つにつき住宅地区 1 つが必要に なります。<n>では建設メニューを 閉じ、 新しい住宅地区を クリックしてください。"
"0x0ce1a7a7" = "住宅地区には建設期間が ありません。 入居者は 最初テントに 住むからです。<n>やがて入居者自身が 住宅地区を 立派な建物へと発展させていきます。<n>住宅地区の見た目は、 築年数と 町の状態によって 変わります。<n>住宅地区のダイアログを 閉じてください。"
"0x0ce1a80f" = "ご存じのとおり、 町で 最初に 建てるものは 必ず倉庫です。 それを 建てるまで他の建物は 建てられません。<n>ゲームを 開始した町にはすでに倉庫が あります。 探してクリックしてください。 画面上では水色で 表示されています。"
