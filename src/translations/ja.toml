"0x070c60f9" = "I thank you. Please bring me @a$Amount$ of @G$Goods$. You have until @D$Date$ to deliver the goods to the market. There, you will receive @g$GoldPerBarrel$ for each <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fa" = "Please deliver @a$Amount$ of @G$Goods$ to my emissaries in the market. You have until @D$Date$. On delivery, you shall receive @g$GoldPerBarrel$ for each <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fb" = "Sail to towns belonging to @n$FoeNation$ and collect @G$Goods$. Deliver @a$Amount$ to the market in my town by @D$Date$. You will receive @g$GoldPerBarrel$ for each <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
