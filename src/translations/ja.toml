"0xe3de2672" = "You have now taken all of the governor's documents on board. Take the documents to @T$TOWN$ "
"0xe3e1d467" = "%1,<n><n>You cannot purchase any permits because your reputation in my nation is not high enough and besides, you have not done enough for this town.<n><n>Increase your reputation in my nation and trade with my town to improve your trading record, and then we will speak again."
"0xe3e1d468" = "%1,<n><n>Your reputation in my nation is not high enough, I'm afraid I cannot sell you any permits.<n><n>Come back when your reputation has improved."
"0xe3e1d469" = "%1,<n><n>You have not done enough trade with this town. Deliver goods that are in demand to improve your trading record. Only then can you buy a permit."
"0xe3e33a30" = "Let %1 be your new town. You can now enter it just like any other town to erect buildings and set up businesses there.<n>The entire district is not yet available to you, but, if you capture additional towns, I will give you the land you need for this."
"0xe3fa97eb" = "That's agreed then. Bring @a$Amount$ tools to @T$DestTown$. At the marketplace, you will get @g$GoldPerBarrel$ per <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>. The goods must be delivered by @D$Date$."
"0xe3fa97ec" = "So be it. Deliver @a$Amount$ to @T$DestTown$. The tools must arrive by @D$Date$. "
"0xe3fa97ed" = "Good! I am tasking you with procuring @a$Amount$ of tools. Deliver them by @D$Date$ to @T$DestTown$. You will be paid @g$GoldPerBarrel$ per <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> at the marketplace."
