"0x00bff5f3" = "You now have a building permit for Cartagena and can establish businesses there. Your next objective is to build two weaving mills in Cartagena. A weaving mill is a business that produces finished goods and requires cotton as a raw material.<n><n>You must always have a supply of raw materials in your warehouse, or the business will be unable to produce any goods. However, the costs will still be high because you have to pay maintenance costs for each business and pay your workers.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Build two weaving mills in the town of Cartagena and produce @a$AmountGoal$ of cloth."
