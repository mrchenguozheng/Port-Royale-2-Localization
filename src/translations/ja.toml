"0x23a8f980" = "Load / Save"
"0x23f0ed65" = "We are at war with @n$HostileNation$. One of my captains recently thought of a clever way to demoralize @n$HostileNation$. He suggested assembling a military convoy comprising our enemy’s ships, in order to give them a taste of their own medicine, so to speak.<n>You appear to be just the man to secure these ships for us."
"0x23f0ed66" = "As we are once again at war with @n$HostileNation$, I want to assemble a new convoy to protect my town. I have no desire to wait until I am assigned a new military convoy from Europe.<n>Unfortunately, my resources are currently very limited and so I came up with the idea of using our enemy's ships. Do you wish to help me capture several @S$ShipType$ type ships?"
