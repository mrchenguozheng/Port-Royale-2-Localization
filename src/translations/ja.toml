"0xe6490f96" = "It is 1676 in the Dutch governor town of the Turk Islands. Holland is in possession of seven towns, five of which are colonial towns, one a governor town and one a viceroy town.<n><n>England is in possession of 14 towns and has been at war with Holland for a long time and will continue to be for many months to come. As long as this war lasts, you must capture towns from the English Crown on behalf of Holland.<n><n>But before you can attack any English towns, you need more capital and more arms for your convoy. Your first objective is to defeat three English trading convoys and capture their ships.<n><n>First, though, you must obtain a Letter of Marque from the Dutch governor in the Turk Islands.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Pay a visit to the Governor of the Turk Islands and obtain a Letter of Marque against England."
"0xe64f1385" = "Very good! You have destroyed one of Blackbeard's pirate convoys. Now go to the Governor of @T$TOWN$ and collect your reward.<n><n>He also has another mission for you to accomplish.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplish another mission for the Governor of @T$TOWN$."
"0xe65025c3" = "1 つの町で"
"0xe6510ae7" = "You must increase supplies of wheat, bricks, cotton, sugar and tobacco to @a$Amount$ each by @D$EndDate$."
"0xe65524e7" = "Ensure that your town has a supply of @a$Amount$ of all goods."
"0xe674b971" = "宝の地図"
"0xe67d58b9" = "金鉱を発見"
"0xe6851da5" = "In the last scenario, you learned that your rank depends on your total assets. Your total assets comprise your cash as well as your buildings, ships and goods. You can check your total assets at any time under \"Successes\" in the log.<n><n>You can also check the blue bar indicating your experience, which is always at the bottom of the screen in the convoy display. When the bar reaches the right edge of the screen, you are promoted to the next rank. You cannot drop below a rank once you have reached it.<n><n>The higher your rank, the more convoys you can command and, therefore, the greater the number of towns in which you can establish businesses later. After you reach a certain rank, you are entitled to an unlimited number of convoys and building permits."
"0xe6d65f53" = "住民"
"0xe6d9252d" = "%1, so you are the %2 my father has told me so much of. I am %3. Will you not join me and tell me of your adventures?"
"0xe6d9252e" = "I believe I have already heard tell of you, %1. I am %3, the governor’s daughter. I always wanted to meet a %2. Please, do tell me of your adventures!"
"0xe6d9252f" = "So, you are the famous %1! I had imagined you as being much taller, from all the stories I've heard about you. But that doesn't make you any less interesting! Come over here and tell me of your adventures! I have already heard my father, the governor, talk so much about you."
"0xe6d92530" = "%1,<n>I am so happy to see you again. Tell me how you've been since we last met. Did you bring something for me?"
"0xe6d92531" = "%1,<n>it is lovely to see you again. I haven't stopped thinking of you since our last meeting. Come in quickly, I have a lot to tell you."
"0xe6d92532" = "%1,<n>I am so happy you've come to visit me again. I've told all my friends of your adventures. But now you must tell me more, for the girls are longing for more information. Come in quickly."
"0xe6dea2e1" = "%1 総督代理の所在地"
