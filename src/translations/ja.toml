"0xfc9cf623" = "完了"
"0xfca882e8" = "ご存じのとおり、 スペインの宝船団は 植民地から 宝物を 集めてヨーロッパへ 送る際、 いつも違う航路を 取ります。 各町に 短時間しか 滞在しないことで 待ち伏せを 避けています。 ところが今回は スペインが 大きな失策を 犯し、 今この瞬間の宝船団の航路を 我々に 知られてしまいました。 命令は いたって簡単です。 一隻残らず沈めなさい！"
"0xfca882e9" = "我々は スペインと 戦争中で、 スペインの宝船団が ヨーロッパへ 到達しないように せねばなりません。 幸い、 船団が 次に寄港する町が 分かりました。 その町で 船団に 妨害工作を して、 港での滞在を 長引かせます。 そうすれば船団を 迎撃し、 ヨーロッパへ 行かせない時間が できるはずです。 この任務を 受けますか？"
"0xfca882ea" = "こんな機会は 毎日あるものではありません！ 今日、 情報屋の一人が スペイン宝船団の現在の航路を 教えてくれました。 それだけ ではありません。 船団は 次に寄港する町で、 いつもより長く停泊するそうです。 スペインと 戦争中ですから、 総督代理を 喜ばせるためにも、 宝船団を ヨーロッパの目的地へ 着かせないように しましょう。 わが国のために 船団を 迎撃してくれますか？"
