"0xe67d58b9" = "金鉱を 発見"
"0xe6851da5" = "前のシナリオで、 階級が 総資産で 決まることを 学びました。 総資産には現金、 建物、 船、 物資が 含まれます。 総資産は ログの 「成果」 でいつでも 確認できます。<n><n>経験値を 示す青いバーも 確認できます。 船団表示の画面下に 常に出ています。 バーが 右端まで 来ると次の階級に 昇進します。 一度上がった階級が 下がることは ありません。<n><n>階級が 高いほど多くの船団を 指揮でき、 後に 事業を 興せる町も 増えます。 ある階級に 達すると、 船団と 建築許可の数が 無制限に なります。"
"0xe6d65f53" = "住民"
"0xe6d9252d" = "%1, so you are the %2 my father has told me so much of. I am %3. Will you not join me and tell me of your adventures?"
"0xe6d9252e" = "あなたの噂は もう耳に しています、 %1 。 私は 総督の娘、 %3 です。 %2 にはずっと会ってみたかったのです。 どうか、 あなたの冒険の話を 聞かせてください！"
"0xe6d9252f" = "なるほど、 あなたが あの有名な %1 ！ 話に 聞いていたので、 もっと背が 高い方だと思っていました。 でも、 それが あなたの魅力を 減らすわけではありません！ こちらへ 来て、 冒険の話を 聞かせてください！ 父である総督から、 あなたのことを たくさん聞かされています。"
"0xe6d92530" = "%1,<n>I am so happy to see you again. Tell me how you've been since we last met. Did you bring something for me?"
"0xe6d92531" = "%1,<n>またお会いできてうれしいです。 前に お会いしてから、 あなたのことばかり 考えていました。 早く入ってください、 話したいことが たくさんあります。"
"0xe6d92532" = "%1,<n>また訪ねてきてくれて、 とてもうれしいです。 あなたの冒険の話は 友達みんなに しました。 でも、 もっと聞かせてください。 みんな続きを 楽しみに しているんです。 早く入ってください。"
