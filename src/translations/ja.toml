"0xdb2d1177" = "これから海賊の隠れ家を 襲撃します。<n>まず船団を 「航海可能な状態」 にしておきましょう！<n>いくつかの総督都市を 回って、 どこかの造船所に もっと大きな船が ないか見てみるのも よいでしょう。<n>途中で 総督を 訪ね、 海賊の隠れ家の情報を 手に 入れてください。"
"0xdb2d1178" = "港の戦いは 海戦と 似ていますが、 相手が 船ではなく非常に 堅固な砲塔である点が 違います。<n>港の戦いに 勝つには、 すべての砲塔を 破壊する必要が あります。<n>港に 武装した船が いることも あります。 その場合は、 港そのものを 攻める前に 船と 戦わねばなりません。"
"0xdb2d1179" = "このシナリオを 終えるには、 船団とともに カルタヘナへ 戻ってください。"
"0xdb4287ac" = "カルタヘナの総督は あなたに 大きな可能性を 感じ、 @g$Gold$ を贈りました。<n><n>ヒント：<n>ある町で 豊富に 供給されている物資 （数量が 赤で 表示されていないもの） を買い、 それが 不足している町で 売ると、 より良い値段がつきます。<n><n>こうすればすぐに富を 増やせます。"
