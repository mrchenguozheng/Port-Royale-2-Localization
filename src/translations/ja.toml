"0xe1cdc367" = "You have now learned some of the basic controls and know how to send a convoy from one town to another. This is very important, because at first you will make your living by transporting and trading goods between the towns.<n><n>In the second part of this scenario, you will buy a ship and add it to your existing convoy.<n><n>Here's another tip:<n><n>You can press F1 at any time during the game to display a help page explaining the keyboard and mouse configuration.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Your convoy with two ships must reach the harbor of the town of Cartagena."
