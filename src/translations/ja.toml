"0xe38974d7" = "残高："
"0xe3922641" = "この羅針盤の針は とても滑らかに 動き、 すぐに位置を 定めます。 これほど 正確な羅針盤は 見たことが ありません。<n>宝石細工のように 作られ、 裏面にはさまざまな刻印が 施されています。"
"0xe3922642" = "この一対のコンパスは 手に 美しく収まり、 とても使いやすいものです。 全体が 金で できているようで、 精巧な文様が 施されています。"
"0xe3922643" = "この六分儀は 荒れた海でも 正確な方位を 示します。 一部が ばねで 支えられており、 強い振動を 和らげるのに 役立っています。"
"0xe3922644" = "これは 両眼で 同時に 遠くを 見られる双眼望遠鏡です。 色付きのガラスを レンズの上に スライドさせて目を 保護できます。 側面には神秘的な刻印が 見て取れます。"
"0xe3922645" = "ごく普通の金時計ですが、 これまで 見たどれよりも小さいものです。 文字盤の裏の円盤には、 ゆっくり回っているように 見える月が 描かれています。 時計の裏にもいくつか刻印が あります。"
"0xe3922646" = "このランプは 普通のカンテラに 似ています。 しかし燃える芯の周りに 多くの鏡が 並べられ、 光は 一方向だけに射します。 開口部に 扇のような装置を 使うと、 放つ光を 素早く点滅させられます。"
"0xe3922647" = "前後に 滑る物差しが 別の物差しに 組み込まれています。 そこには透明な素材の滑る金具が 付いています。 この道具で 簡単な計算を 素早く行えます。"
"0xe3922648" = "この奇妙な道具は 矢のような形を しています。 羽根に 当たる水の流れで 回転し、 小さな目盛盤が 回転数を 数えるので、 船の速さを とても正確に 計算できます。"
"0xe3922649" = "この計器は 回転する羽根と、 その回転速度を 示す目盛盤から なります。 羽根を 風に かざすと、 風向きと 風速を 読み取れます。 丁寧に 作られており、 未知の記号が 刻まれています。"
"0xe392264a" = "このロープは しばらく海水に さらされていたはずですが、 できたばかりのように 見えます。 手触りは 驚くほど滑らかで、 とても丈夫な結び目を 作れます。"
"0xe39226b2" = "この帳面には美しい星図が 数多く収められています。 大きな表が、 それぞれの星が いつどこで 昇り沈むかを正確に 示しています。"
"0xe39226b3" = "精巧に 刻まれた円盤で、 そこに いくつもの小さな円盤が はめ込まれています。 日付と 時刻に応じて、 星空のどの部分が 見えているかを調べるのに 使えます。<n>円盤の刻みから、 かつてこの計器が 特定の海域で 船の位置を 測るのに 使われたと分かります。"
"0xe39226b4" = "取っ手を 回すと、 大きなホルンから 女の歌声のような優しい音が 出ます。 何週間も 海に 出ている船乗りにはうってつけです。"
"0xe39226b5" = "金の棒の先に 大きな丸いガラスが 付いています。 地図の上に かざすと、 光の弱いところでも細い線まで はっきり見えます。"
"0xe39226b6" = "この小さな金属製の台は 真鍮で できており、 船が どれだけ 揺れても台の面が 常に水平を 保つように 作られています。 外側の金属環には方位を 示すような刻みが あります。 ただし、 この台が かつて使われた海域までは分かりません。"
"0xe39226b7" = "A small box contains an ornate device that can be used to light a fire very easily. This box is covered in mysterious engravings."
"0xe39226b8" = "この錨は 実用よりも装飾的です。 せいぜい手漕ぎ舟を 留める程度にしか使えません。<n>大きさの割に 非常に 重く、 精巧な装飾と 未知の文字で 覆われています。"
"0xe39226b9" = "これは 火打石を 備えた石油ランプのような道具です。 小さな車輪を 回すと芯に 火花が 飛び、 強い風の中でも 火をともせます。"
"0xe39226ba" = "このホルンは 口では鳴らさず、 ポンプのような装置で 鳴らします。 強く押し込むと、 信じられないほど大きな音が 出ます。"
"0xe39226bb" = "この海図は、 普通に 出回っている海図とはかなり趣が 違います。 非常に 細かく、 何色も 使って描かれています。 ただし、 どの海域を 描いたものかは分かりません。"
"0xe39bb702" = "船団は 大砲を 積みすぎているため出航できません。 大砲を 売るか倉庫へ 移して、 最大数を 超えないように してください。"
