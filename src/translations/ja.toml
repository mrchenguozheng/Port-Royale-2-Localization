"0x2ee8bb8c" = "南カリブ海の総督都市カルタヘナにいます。<n>町の様々な建物に入って行動できますが、 詳しくは後ほど説明します。<n>まず画面上部を見てください。 ボタンと表示が並んでいます。<n>では画面の一番左、 時計のボタンをクリックしてください。"
"0x2ee8bb8d" = "これは年代記です。 カリブ海で起きた出来事が、 日刊紙のように記録されています。<n>年代記ウィンドウの右側にボタンがあり、 カリブ海の情報を表示できます。 ただし今は重要ではありません。<n>では 「X」 と書かれたボタンで年代記を閉じてください。"
"0x2ee8bb8e" = "画面上部、 日付の隣がログボタン、 その隣が所持金です。<n>ログには成果や財産に関する情報が随時記録されます。 受け取ったメッセージや任務もすべてここに保存されます。<n>ログを開いてください。"
"0x2ee8bb8f" = "ご覧のとおり、 ログにはこれまで受け取ったメッセージが表示されます。 今はこのシナリオの指示だけが出ています。<n>ログウィンドウの右側にもボタンがあります。 3 番目のボタンをクリックしてください。"
"0x2ee8bb90" = "受け取ったタスクと任務が表示されます。 今はシナリオ目標だけです。<n>任務ウィンドウ最上部の 2 つのボタンで、 現在の任務と完了した任務を切り替えられます。<n>ではログを閉じてください。 右クリックでも閉じられます。"
"0x2ee8bb91" = "ゲームが進むと、 名声と富のために多くの任務を請けられます。<n>まず町を見てみましょう。 画面上部中央の表示から、 ここがカルタヘナだと分かります。 人口はおよそ 2,000 人です。<n>町の名前が書かれたボタンをクリックしてください。"
"0x2ee8bb92" = "町の情報を表示するウィンドウが開きます。<n>カルタヘナは総督都市で、 スペイン領です。 町の状態や生産できる物資も分かります。<n>では建物に入ってみましょう。 町の情報表示を閉じてください。"
"0x2ee8bb93" = "方向キーで町の表示を動かせます。 城壁の内側の町の中心を見てください。 船着場、 教会、 総督の宮殿などの建物があります。<n>いずれかの建物をクリックしてください。"
"0x2ee8bb94" = "建物をクリックすると、 画面下部中央の表示が変わります。 建物の種類に応じて、 情報が表示されたり、 操作できたりします。<n>建物表示の右側にボタンがあります。 建物を出るには 「X」 ボタンをクリックしてください。"
"0x2ee8bb95" = "様々な行動ができる建物は、 必ず城壁の内側にあります。 倉庫だけは例外で、 次のシナリオで説明します。<n>では建物を出て、 方向キーで港と 「Santa Maria」 という船団を表示し、 クリックしてください。"
"0x2ee8bbfd" = "ご覧のとおり、 船団の情報が画面下部中央に表示されます。<n>船団にはすでに 10 樽の小麦と 15 樽のとうもろこしが積まれています。<n>船団表示の右側にいくつかボタンがあります。 2 番目 （船のアイコンのボタン） をクリックしてください。"
"0x2ee8bbfe" = "船団の船の数が表示されます。 船団は船長が率いる最大 10 隻の船で構成できます。<n>では船団を別の町へ送りましょう。<n>画面右上の矢印ボタンで町を出て、 海図を表示してください。"
"0x2ee8bbff" = "海図が表示されました。 画面中央にカルタヘナの町があります。<n>矢印ボタンで表示範囲を動かし、 ゲーム世界全体を見渡せます。<n>北の島にあるポートロワイヤルの町を探し、 船団を選んだまま町を右クリックしてください。"
"0x2ee8bc00" = "航路が引かれ、 船団が出発します。<n>ポートロワイヤルを右クリックしたことで、 目的地に設定されました。<n>町への到着が遅いときは、 スペースキー （既定） でゲームを早送りできます。"
"0x2ef566b4" = "Keyboard"
"0x2ef8f665" = "%1 へようこそ。<n><n>%2 周辺を早く知り、 わが国のこの町と他の町の発展を助けられるよう、 いくつか助言しておきます。<n>総督都市の基本はご存じでしょう。 ヨーロッパへ輸出する植民地物資を絶えず供給する必要があります。 同時に、 こうした町では各種の贅沢品もそろっており、 他の町へ売れば大きな利益になります。<n>もう一点。 総督は時折任務を出すので覚えておいてください。 ただし、 甲板見習いの階級に達するまで任務は受けられません。<n><n>%3 %4 、 %5 の総督"
"0x2efebfdd" = "船団がポートロワイヤルに着いたので、 町に入れます。 小さな家の町アイコンをクリックしてください。"
"0x2efebfde" = "見慣れた町の表示ですが、 今度はポートロワイヤルです。 船団や建物がある町ならどこでも移動できます。<n>港の造船所を探してクリックしてください。 新しい船を買います。"
"0x2efebfdf" = "さきほど船団が表示されていた選択ウィンドウに、 造船所が表示されました。<n>造船所表示の右側のボタンで中を見て回れます。<n>「船を購入」 の表示に戻り、 買える船を見てください。<n>好きな船を買ってください。"
"0x2efebfe0" = "おめでとうございます。 初めての船を買いました。<n>船は町の港に届けられます。<n>では造船所を出て、 港の水面をクリックしてください。 選択ウィンドウに港の船が並びます。<n>新しい船をクリックしてください。"
"0x2efebfe1" = "造船所でも見た船のデータが表示されます。<n>一隻の船で何かするには、 まず船団に加える必要があります。<n>そのために、 もう一度自分の船団を選んでください。"
"0x2efebfe2" = "次に、 船団に港とやり取りさせます。<n>港を右クリックしてください。"
"0x2efebfe3" = "「移譲」 ウィンドウが開き、 個々の船を船団に追加できます。<n>左側の船をクリックして船団までドラッグし、 船団が 2 隻になるようにしてください。<n>終わったら右側の 「X」 ボタンでウィンドウを閉じてください。"
"0x2efebfe4" = "酒場で新しい船長を雇えば、 新しい船で別の船団を組むこともできます。<n>ただし今は階級が足りないためできません。<n>では船団の船リストを選んでください。 2 番目のボタンです。"
"0x2efebfe5" = "ポートロワイヤルの港に 2 隻の船団ができました。<n>船団の船リストで船をクリックすると、 詳細が分かります。<n>では船団を本拠地カルタヘナへ戻しましょう。 画面右上の矢印ボタンで海図へ移動してください。"
"0x2efebfe6" = "南のカルタヘナの町を探し、 船団を選んだまま右クリックして送りましょう。<n>船団が町に着くと、 このシナリオは終了します。"
