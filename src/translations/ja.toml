"0xdfb549a5" = "%1 は自国の海域を 守るだけの軍事船団を 持っていません！ 今すぐ動いて町を 1 つ占領しましょう！！<n>任せられますか？"
"0xdfb9b5b7" = "見事です！ これで @g$Gold$ を手に 入れました。<n><n>各国には町を 守り、 周辺海域を 防衛する軍事船団が あります。 町が 多い国ほど、 十分に 守るための軍事船団も 多く必要です。<n><n>軍事船団を 失うと、 その国の軍事力は 弱まります。 戦争中、 軍事船団は 敵国の町や 船団に対して かなり攻撃的なので、 時折失われることが あります。 そのためヨーロッパから 定期的に 船団が 送られ、 新世界の軍事力が 補強されます。<n><n>国の強さは 年代記の 「国家」 で確認できます。 「弱い」 と表示されている国の町は 占領できます。<n><n>ではイングランドの軍事船団を 十分に 撃破し、 イングランドの強さが 「弱い」 と評価されるように してください。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>イングランドの軍事船団を 十分に 撃破し、 イングランドが 「弱い」 と評価されるように してください。"
