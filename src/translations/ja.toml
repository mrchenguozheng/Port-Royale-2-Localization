"0xc558e134" = "If you want as many traders as possible to visit your town, you should simply not supply your town with certain goods. You should ideally choose goods that are produced in nearby towns, because traders will take the length of the journey involved into consideration.<n><n>Traders who visit your town automatically buy goods that are in abundance and therefore have low prices in your town. You can sell the goods you have produced to your town directly. As long as the goods are not more expensive than in other towns, they will be purchased regularly by traders.<n><n>The advantage of this is that there are always enough goods available for your citizens and you also don't have to worry about transporting the goods to other towns."
