"0x0d0db041" = "自分の事業が 1 日に どれだけ カカオを 生産し、 そのために 道具が どれだけ 要るかが分かります。<n>倉庫は 事業に 物資を 供給するので、 倉庫に 道具を @a$SubGoal$ ためてください。"
