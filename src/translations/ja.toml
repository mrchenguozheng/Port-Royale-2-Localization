"0x13cd046e" = "Whenever you capture enemy towns for a viceroy, he will grant you a plot of land in return. On this land, you can build a town that will belong to you and in which you can construct different buildings. In other words, any viceroy can help you become the owner of your own town. <n><n>Your next objective is to improve your reputation with Spain, because a viceroy will only receive you if you have a good reputation with his nation.<n><n>You can check your reputation with a nation under the town name in the town view, for example. In Margarita, where you start the game, three flags are displayed, indicating that your reputation with Spain is \"neutral\".<n><n>You can improve your reputation with a nation by accomplishing missions for its governors, hunting pirates or trading with its towns and delivering the goods they need.<n><n>Since Spain and France are at war, you can obtain a Letter of Marque against France from the Governor of Margarita. You can improve your reputation quickly with letters of Marque.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Improve your reputation with Spain to \"friendly\"."
