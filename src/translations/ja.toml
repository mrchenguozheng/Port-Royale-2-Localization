"0x061848e4" = "You have sabotaged the town of @T$TargetTown$ and I thank you on behalf of my nation. I have a very special reward for you. I have persuaded a very experienced captain to join you. His name is @N$CaptainName$ and he awaits you at the inn."
"0x061b50a1" = "Do you want to buy a Letter of Marque for %1 and hunt down the ships of our enemies in the name of France?"
"0x0625c88f" = "国家"
"0x062a6d44" = "Good! The convoy set sail from @T$HostileTown$ in the direction of Europe and will leave the Caribbean in the east. Search the entire route for the documents and bring them to me by @D$EndDate$."
"0x062a6d45" = "You are a great help to me! If all goes according to plan, the helmsman will secretly throw the books overboard, one after the other. The ship has set sail from @T$HostileTown$, bound for Europe. Follow the ship and collect the books. Bring them to me by @D$EndDate$."
"0x062a6d46" = "Excellent. The ship has already left the harbor of @T$HostileTown$ bound for Europe. However, she is carrying a passenger who still owes me a favor. He will search the ship for documents and will secretly throw them overboard, one after the other. Your mission is to collect the documents and bring them to me by @D$EndDate$."
