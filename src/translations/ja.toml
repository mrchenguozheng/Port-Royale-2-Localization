"0xd4b8ac66" = "ようこそ！ ちょうど新しい歴史随筆を 書いているところです。"
"0xd4cd0f3d" = "ヘンリー・エイヴリーは 成功した海賊の典型例です。 当時最も豊かな船を 奪い、 当局の追跡を 逃れ、 富を 楽しめるだけの長生きを しました。<n><n>エイヴリーの若い頃は 謎に 包まれています。 ただ、 1694 年 6 月に 彼が 私掠船 「チャールズ」 の航海士だったことは 分かっています。 この船は スペインから、 西インド諸島のフランス植民地マルティニークの船を 拿捕する許可を 得ていました。 ある日彼は 反乱を 主導して船を 掌握し、 乗員の大半が 味方しました。 46 門の大砲を 積む快速の私掠船で、 海賊船に うってつけだったこの船は 「ファンシー」 と改名されました。 1695 年、 彼は 最大の功業を 成し遂げます。 インドの宝船団の略奪です。 他の海賊と 手を 組み、 重武装のインド宝船団を 襲って 2 隻を 拿捕しました。 その船は 大ムガル帝の所有で、 想像を 絶する宝を 積んでいました。<n><n>バハマの総督に 賄賂を 渡して海賊への保護を 約束させた後、 エイヴリーは 乗員に 分け前を 払い、 一同は 世界各地へ 散っていきました。 何人かはイングランドで 捕まりましたが、 エイヴリーは アイルランドへ 渡り、 跡形も なく消えました。 身を 隠したまま富を 楽しみ続けたのだとしか思えません。"
"0xd4cd0f3e" = "史上最も名高い海賊の一人が エドワード・ティーチ （1718 年没）、 別名ブラックベアード （黒ひげ） です。 その名のとおり、 恐ろしい黒い三つ編みの髭が 彼の印でした。 300 人の乗員とともに、 オランダの交易船を 改造した船 「クイーン・アンズ・リベンジ」 で外洋を 航海し、 イギリス海軍の軍艦と 戦うことも いとしませんでした。<n><n>ブリストル生まれのティーチは、 18 か月のあいだ、 主に 西インド諸島北部と 北アメリカ沿岸で 猛威を 振るいました。 そして常にバハマと、 貧しいノースカロライナに 逃げ込むことが できました。<n><n>黒ひげが これほど 有名に なったもう一つの理由は、 恐ろしく血の気が 多く短気な海賊という 型に ぴったり合っていたことです。 砲手のイスラエル・ハンズを 二度撃って不具に したとされ、 その理由は、 乗員に 誰が 仕切っているかを思い知らせるためだけ だったとも言われます。<n><n>彼の最後が 訪れたのは 1718 年、 海賊狩りのロバート・メイナードが 彼のスループを 追い詰めたときでした。 ティーチは 泥酔していながら悪鬼のように 戦い、 激しい格闘のすえに 倒されました。 彼は 戦いの中で 命を 落とし、 生き残った乗員の多くは 絞首刑に されました。"
"0xd4cd0f3f" = "大航海時代の初め、 すでに持つ富を さらに増やしたいと考えた人々は、 主に カリブ海で 16 世紀初めから 発展してきたサトウキビ農園が、 絶好の投資先であることを 知りました。<n><n>こうした投資は 平均 10 パーセントの利益を 生み、 最良の場合 （1650 年ごろのバルバドスなど） は 50 パーセントにも達しました！ 当然、 農園には膨大な数の労働者が 要り、 何十万もの奴隷が アフリカから 送られました。 というのも、 この頃までに白人によって 先住民が 多くの土地で ほぼ絶滅させられていたからです。<n><n>ヨーロッパ人自身は この気候に 耐えられず、 それ以前に、 こうした単純労働に従事するにはあまりに高貴すぎました。 農園主たちも ロンドンや マドリードに 住み、 手下に 植民地の仕事を 任せるのを 好みました。 18 世紀までには、 一部の島では黒人の割合が 人口の 90 パーセントに 達していました！"
"0xd4cd0f40" = "「黒い黄金」 の交易は 16 世紀初めにはすでに始まっていました。 奴隷商人が 好んだ 「商品」 の供給源は、 セネガル川から 現在のカメルーンに 至る西アフリカ沿岸でした。 この地域は 輸送上の立地が 理想的だっただけでなく、 安定した経済的・社会政治的な基盤も 備えていました。 つまり船乗りたちは 自分で 奴隷を 狩り集める必要が なく、 地元の首長や 他の奴隷商人から 買い取れたのです。<n><n>特に求められたのは 15 歳から 35 歳の若い男性で、 主に 農園での重労働に 充てられました。 最長 6 週間に 及ぶ航海で、 奴隷のおよそ 5 人に 1 人が 命を 落としました。 主人の野蛮な扱いで 死ぬ者も いれば、 海難事故で 命を 失う者も いました。 この高い死亡率を 踏まえ、 奴隷商人は できるだけ多くの奴隷を 船に 詰め込み、 1 航海あたりの利益を 最大に しようとしました。 数週間にわたり、 哀れな人々は 缶詰のイワシのように 並んで横たわり、 互いに鎖で つながれ、 暗闇の中で 息を するのが やっとでした。<n><n>こうした状況で 誰かが生き延びたこと自体、 ほとんど信じがたいことです！"
"0xd4cd0f41" = "北アメリカや 中央アメリカに 白人の奴隷は いませんでしたが、 奴隷と ほとんど変わらない境遇で 働くヨーロッパ人は 数多くいました。<n><n>多くの若者 （主に 教育を 受けていない下層階級の出身） が移民を 望みながら、 渡航費を 払う金が ありませんでした。 そこで渡航費を 借り、 一定期間サトウキビ農園などで働いて借金を 返す約束を したのです。<n><n>しかし、 一見理に かなったこの取り決めにも落とし穴が ありました。 多くの農園主は、 雇用期間中に この契約労働者を できるかぎり酷使しようとしたのです。 さらに、 ほとんどのヨーロッパ人が 耐え難いと感じるカリブ海の気候も ありました。<n><n>この 「年季奉公」 制度は、 母国を 追われた囚人にもよく使われました。 イギリスは 後に この方法を 用い、 とりわけインド人を アフリカの植民地で 働かせました。"
"0xd4cd0f42" = "アメリカの植民地が 栄えるにつれ、 大西洋を 渡る交易も 盛んに なりました。 エリザベス女王の時代以来、 最も強力な海洋国家だったイギリスは、 物資の流れを 統制し、 国内経済が 交易の利益を 分け合えるように することに 強い関心を 持っていました。<n><n>護国卿オリバー・クロムウェルの下、 1651 年の 「第一次航海条例」 は、 植民地から ヨーロッパへ 物資を 運べるのは イギリス船だけと定めました。 この措置は 主に 新興のオランダを 狙ったもので、 国内の交易船団に 利しました。<n><n>1663 年には規定が さらに厳しくなりました。 ヨーロッパへ 物資を 運びたい植民地の船は、 イギリスの港に 寄港して通行料を 払わねばならなくなったのです。 しかし、 植民地間の交易を 統制しようとするこの試みは すぐに行き詰まりました。 イギリス軍に 海岸線全体を 監視させるわけにはいかず、 結果として 密輸取引が 盛んに なったのです。<n><n>物資の輸出入の条件を めぐる母国とのこの絶え間ない対立こそが、 とりわけ北アメリカの植民地で 入植者たちの間に 独自のアイデンティティを 生み、 後に 独立運動の大きな動機と なっていきました。"
"0xd4cd0f43" = "植民地時代の始まりは、 それまで 地中海や 沿岸の短い航海ではほとんど知られなかった数多くの健康問題を もたらしました。 カリブ海や 北アメリカの植民地への航海は 1〜2 か月、 嵐や 無風に 遭えばさらに長引きました。 克服すべき困難は 当然でした。 汚れた衣服と 不潔な体の悪臭、 汚染されて腐った食料、 きれいな水の不足、 船内の鼠、 そして単調さと 閉所による 精神的な疲労です。 すべての船乗りに 壊血病という 恐ろしい影がつきまといました。 ビタミン不足による この病は、 髪と 歯を 失わせ、 多くの船員の命を 奪いました。 これを 最初に 治療しえたのが 世界一周航海者のジェームズ・クック （1728-1779） です。 船内を 清潔に 保つよう命じただけでなく、 乗員に ザワークラウトと 新鮮な果物を 与えました。 上陸する者には、 黒水熱のような熱帯病も 立ちはだかりました。 マラリアで 最も危険な形の一つで、 脈拍の亢進、 発熱、 悪寒、 黒い尿を 症状と し、 ほぼ確実に 命を 奪うものでした。"
"0xd4cd0f44" = "船乗りや 地図製作者が 新しい土地、 川、 集落に 付けねばならなかった多くの名の裏には、 興味深い逸話が あります。 大航海時代に ヨーロッパの探検者が アメリカに 付けた最初の名でさえ、 物語を 物語っています。 コロンブスは 1492 年 10 月 12 日に 上陸した島を 「サルバドル （救世主）」 と名付けました。 これは、 往路で 船団を 病と 嵐から 守り、 とりわけ陸地を 目前に したまさに土壇場で 起きかけた反乱を 防いでくれた主に 感謝するためでした。<n><n>その後、 スペインの征服者たちは 宗教的な含みを 持つ名を 選ぶことが 多くなりました。 たとえば 「ノンブレ・デ・ディオス （神の名）」 や 「トリニダード （三位一体）」 です。 別の場合は、 日付や 景観の観察から 着想を 得ました。 ポルトガルの船乗りたちは、 1502 年の元日に 発見したブラジル沿岸の湾を 「一月の川」 と名付け、 モンテビデオという 市の名は、 初めてその海岸線を 見たときのマゼランの叫びに 由来します。 「モンテ・ビド・エウ！ （山が 見える！）」<n><n>支配者の名や 母国、 出身の町を 新しい土地や 町に 付けるのも、 探検家たちに 人気の慣習でした。 これは 外部に 領有を 明確に 示すだけでなく、 こうした遠く離れた土地にも母国とのつながりを 生みました。<n><n>それも かなわなければ、 先住民の言葉の名に 頼ることも できました （もっとも多くの場合、 それによって 入植者たちが 後に 先住民を 追い払ったり絶滅させたりするのを 思いとどまることは ありませんでした）。<n><n>今なお、 あの奇妙な有袋類の名を 尋ねられたオーストラリアの先住民が 「カングールー」 あるいは 「ガングル」 と答え、 それが 実は 「何の話だ？」 という意味だったという俗説が 生き続けています。 たとえ作り話でも、 こうした愉快な誤解は きっと実際に起きたのでしょう。<n><n>町や 山、 川の名のうち、 どれほど多くが 単に 「おはよう！」 「何とおっしゃいました？」 「放っておいてくれ！」 という意味に すぎないかを知れば、 人は きっと驚くでしょう。"
"0xd4cd0f45" = "スペイン帝国が 世界に 広がるにつれ、 日常の行政事務から 突発的な危機まで 扱える十分な権限を 持つ植民地の統治機関を 設ける必要が 生じました。 そのために、 植民地で 最も重要な総督に 「総督代理 （ビレイ）」 の称号が 与えられました。<n><n>帝国の最盛期には、 ヌエバ・エスパーニャ （メキシコ） とペルーに 二人の総督代理が いました。 18 世紀にはヌエバ・グラナダと リオ・デ・ラ・プラタの総督代理領が 加わりました。<n><n>総督代理の職務は、 アウディエンシアと 呼ばれる行政評議会とともに （しばしば対立しながら） 行い、 税の徴収、 住民が 法を 守ることの確保、 植民地防衛の組織化など、 通常の官吏の仕事を 含みました。 さらに先住民の保護や、 下級の教会・世俗の要職の任命も 担いました。<n><n>海外領土の経済的・政治的な重要性が 大きかったため、 王室は 常に総督代理の動きに 目を 光らせていました。 余分な収入を 得る商業活動は 禁じられていました。 それとは別に、 総督代理同士の対立は 互いの権限を 制約する結果にしかなりませんでした。"
"0xd4cd0f46" = "ヨーロッパの征服者たちが 常に銀と 金の呼び声に従ったことは、 すでに広く知られています。 しかし、 ほとんどそれ以上に 価値が あったのが 香辛料です。 胡椒や ナツメグを 少し手に 入れるために 人々が どれほどの危険を 厭わなかったかを思えば、 中世ヨーロッパの食事が いかに味気なかったか、 想像するのは 難しいでしょう。<n><n>その点で、 アメリカの発見は 当初こそ ひどく期待外れでした。 人々は コロンブスが 持ち帰った珍しい動物に関心を 示し、 自国の領土が 広がること、 そしてキリスト教の普及で 多くの魂が 救われることを 想像して喜びました。 しかし約束されたほどの金の山は、 なかなか見つかりませんでした。 これらの航海が 利益を 生むように なったのは 10〜20 年後、 アメリカの銀が ヨーロッパへ なだれ込むように なってからです。<n><n>その航海の一つで、 コロンブスは 世界中の金銀すべてより 貴重な宝物を 持ち帰りました。 1492 年 11 月 4 日、 先住民が 彼に 差し出したのは、 栗のような味のする 「果物」 と彼が 記したものでした。 その瞬間、 彼は ジャガイモを 食べた最初のヨーロッパ人に なったのです！ この植物の先住民の言葉は 「バタテ」 で、 英語の 「potato」 として今も 残っています。<n><n>今日では当たり前に なっている多くのものも、 コロンブスと その後継者たちによって 初めてヨーロッパへ もたらされました。 たばこ、 トマト、 とうもろこし、 そしてハンモックです。 先住民の言葉では 「ハマカ」 といい、 英語の語源にもなっています。"
"0xd4cd0fae" = "新世界の発見が 伝えられると、 ヨーロッパの人々の想像力は かき立てられました。 この未踏の地にはどんな生き物が いるのか。 信じがたい噂が 飛び交いました。 ある島は 人食いでいっぱいだと言い、 次の島には顔が 腹に 付いた首無しの生物が いると言う。<n><n>南アメリカのパタゴニアは、 おおよそ 「大足の者たちの国」 を意味します。 アマゾンという 名は、 探検家たちに ギリシア神話の女戦士を 思い起こさせたという女戦士の一団に 由来します。<n><n>こうした噂のいくつかには事実の裏付けが ありましたが、 他は 誤解や 誤った解釈、 あるいは先住民が どこかで聞きかじった話に基づいていました。<n><n>しかし多くの噂は、 人々の生き生きとした想像力の産物に すぎず、 たいていは信じたいから信じていただけでした。 歴代の征服者たちが、 伝説の若さの泉、 エデンの園、 黄金の都エル・ドラードを 探し求めたのも、 そう説明できるでしょう。 彼らの誤信を 後押ししたのは 先住民でした。 あの場所も この場所も 聞いたことが あると常に請け合いながら、 実のところは 時間を 稼ぎ、 欲深い白人を 内陸深くへ誘い込んで船から 切り離そうとしていたのです。"
"0xd4cd0faf" = "多彩な人物を 数多く輩出した探検家・征服者の系譜の中でも、 際立って華やかな一人が イングランドの文人に して冒険家、 ウォルター・ローリー卿 （およそ 1554-1618） です。 彼が 最初に 名を 上げたのは 1580 年、 イングランドの占領に 反対するアイルランド反乱を 鎮圧したときでした。<n><n>エリザベス 1 世の寵を 得た彼は、 その影響力を 使って、 南アメリカの伝説の都市エル・ドラードを 探す遠征に 資金を 集めます。 何度かの遠征が 価値あるものを 何も 見つけられずに失敗しても、 彼は 独特の説得力で ロンドンの出資者たちの支持を 保ち続けました。 最後の褒美は いつも次の河口の先に ある、 今やめるわけにはいかない、 と信じさせたのです。<n><n>それでもやがて彼の信用は 尽きました。 人々は 高らかな約束を 聞かされ、 後に なってそれが 空手形に すぎなかったと知ることを、 あまりに重ねてきたのです。 ローリーはついにエリザベスの寵を 失います。 後継者ジェームズ 1 世は この血の気の多い冒険家を、 より穏健な外交政策への脅威と 見なし、 即位するとすぐ、 きわめて薄弱な根拠で 逮捕して死刑を 宣告しました。 刑は 減刑され （ただし取り消されはしませんでした！）、 ローリーは ロンドン塔に 投獄されます。<n><n>数年後、 国の財政が、 必要だと王を 説得したとき、 王は ローリー卿に ギアナへの新たな遠征を 率いる許可を 与えました。 これは 不合理な状況でした。 自ら死刑を 宣告された者に、 他人の生死を 左右する権限を 与え、 金を 探しに行かせるというのですから。 しかしこの矛盾は ほどなく解消します。 熱病に 苦しむローリーは、 最後の遠征が 失敗に 終わるのを 見届けたのです。<n><n>イングランドへ 戻ると、 激怒した王は 1603 年に 定めた執行停止を 終わらせることに しました。 ウォルター・ローリー卿は まもなく処刑されました。"
"0xd4cd0fb0" = "新世界の先住民と 白人の船乗りたちの最初の出会いは、 おおむね平穏に 過ぎました。 多くの土地で、 ヨーロッパ人は 神として 迎えられました。 それが 古い神話に基づくことも ありましたが、 ほとんどの場合、 先住民は 「水の家」 （船） に乗って輝く鎧で 現れた、 背の高い金髪の見知らぬ者たちに 圧倒されただけでした。<n><n>コロンブスも コルテスも 他の探検者たちも、 この幻想を 広めたいと喜んでいましたが、 先住民は やがて残酷な現実に 直面します。 飽くなき金への欲情、 先住民が 「スペイン病」 と呼んだものに 突き動かされ、 スペイン人は 住民を 虐待し、 奴隷に し、 虐殺しました。 アメリカに いなかった馬の姿と 大砲の音は 激しい恐慌を 呼び、 虐殺を 生き延びた者も まもなく天然痘や インフルエンザなど 持ち込まれた病に 倒れました。<n><n>ゴンサロ・オビエドや フアン・デ・セプルベダといった 著名な知識人は、 血も 凍るような人種差別的な論法で、 先住民を 卑しく無知で 劣った人種と 描き、 ヨーロッパ人の犯した罪を 正当化しようとしました。<n><n>信仰のゆえに 科学者や 魔女を 火刑に した同じ者たちが、 先住民の 「獣のような風習」 について衝撃的な記述を 作る術にも長けていました。 偶像崇拝、 人身御供、 人食いが まったくの空想ではなかったにせよ、 以後それは、 先住民に あらゆる残酷な制裁を 課すための包括的な口実として 使われたのです。"
"0xd4cd0fb1" = "広く知られているように、 アメリカ植民地化の初期は スペインと ポルトガルが 担いました。 後に オランダ、 そして何よりイングランドと フランスが 加わりました。 あまり知られていないのは、 ドイツの強力な資金提供者が いなければ数多くのスペイン遠征が 実現しなかったということです。<n><n>1500 年までに、 とりわけ上シュヴァーベンと アウクスブルクは ヨーロッパ有数の交易・金融の中心地へと発展していました。 ここから フッガー家や ヴェルザー家といった 商人の一族が、 世界の政治に 強い影響を 及ぼしました。 たとえば、 スペイン王カルロスが 1519 年に ドイツ皇帝と なったのも、 彼らの手厚い財政支援が あってのことでした。 イングランド王ヘンリー 8 世や 多くの教皇も、 「富者」 ヤーコプ・フッガーを 友人に 数えることを 喜んでいました。<n><n>もちろん、 こうした支援には彼らなりの下心が ありました。 見返りとして、 特権や 王室の銀採掘への参加許可を 期待したのです。 ヴェルザー家は 一時、 ベネズエラ北岸の一部を 手に 入れ、 そこに 「ノイアウクスブルク」 などの町を 築き、 内陸の宝を 求めて何度も （ほとんど実りのない） 遠征を 送り出しました。"
"0xd4cd0fb2" = "世界の半分を 征服することで、 スペイン王室は 他に 類のない機会を 得ました。 数世紀にわたり、 インカ・マヤ・アステカの大文明が 滅び、 最後にはペルーと メキシコで 巨大な銀鉱床が 発見されるまで、 スペインの地位は 揺るぎないように 見えました。 まさにその途方も ない富が この世界帝国の衰退を 招いたとは、 ほとんど不合理に 思えます。<n><n>船で スペインへ 送られた宝の大部分は、 そもそも航海に 資金を 出したピレネー以北の商人たちの懐に 直接入りました。 それでも残りは、 イベリア半島の物価を 押し上げるのに 十分でした。 人々は 身の丈を 超えた暮らしを 始めます。 壮大に 宮廷を 開く力が 国家予算の均衡より 重んじられた時代に、 小さな財政の心配など 誰も 気に しませんでした。<n><n>自国で 作るにはあまりに洗練されすぎたため、 物資は 外国船で ますます大量に 輸入されました。 アメリカ遠征の装備や 食料まで、 国内の商人が 用意することは まれでした。 人々は 誇らしげに 言いました。 ヨーロッパ中が スペインの意のままに 動いている、 と。<n><n>しかし銀の流れは いずれ涸れるものであり、 その後に 訪れた目覚めは、 長い夜の酔いの後の二日酔いのようなものでした。 オランダと イギリスが スペインを 公海から 追い出そうとし、 プロテスタントの 「異端者」 やトルコ人との数々の宗教戦争が 莫大な金を 食い尽くし、 太陽の沈まぬ大帝国は 統治不能な巨像と 化していたのです。<n><n>危機は 1557 年、 誰の目にも明らかに なりました。 新たなスペインの支配者フェリペ 2 世が、 初めて国家破産を 宣言せざるを得なかったのです。 かつてのどの帝国よりも多くの宝を 抱えた大帝国は、 破産しました。"
"0xd4cd0fb3" = "なぜブラジルで 話される言語は ポルトガル語で、 南アメリカのほとんどどこでも スペイン語なのでしょうか。<n><n>スペイン人も、 アフリカ沿岸を 回るインドへの海路を 発見したポルトガル人も、 自らの未来が 海の向こうに あると早くから気づいていました。 互いに嫉妬深く監視し合い、 物資・臣民・土地を 求める中で 相手の領土を 侵さないように していたのです。<n><n>当時は 国際法のようなものが なかったため、 紛争が 起きると両国が その権威に従う 用意のある唯一の人物、 教皇に 裁定を 求めました。 カトリック教会としても、 スペイン人と ポルトガル人が 互いの足を 引っ張ることに 力を 費やすより、 未知の土地で 「異教徒」 のキリスト教化に 熱心に 取り組むことを 望んでいました。<n><n>そこで 1494 年のトルデシリャス、 1529 年のサラゴサでの共同交渉で、 ある経線より 西の新発見の領土は スペインに、 それ以外は すべてポルトガルに 属するという合意が 成立しました。 この経線は 当時未発見だった南アメリカを 横切ったため、 その東側、 現在のブラジルの一部が ポルトガル領と なったのです。"
"0xd4cd0fb4" = "「海賊」 という語を 初めて記したのは、 おそらく紀元前 140 年ごろのローマの著述家ポリュビオスでした。 以来、 この恐るべき海の悪党を 指す言葉は 数多く使われてきました。 コルセア、 フリーブーター、 バッカニア、 フィリバスター… クラウス・シュテルテベッカーを 取り巻く者たちは 「ヴィタリア同胞団」 と呼ばれ、 バーソロミュー・ロバーツは 自分と 殺し屋の一行に 「幸運の紳士たち」 といういかにも無害な称号を 与えました。 しかし結局、 商人にとっては、 虚空から 現れて船を 襲うのが 誰であれ大差は ありませんでした。<n><n>バッカニアは 古来、 世界のあらゆる隅々で 人類の災いでした。 古代にはキリキアの海賊が 地中海全域に 恐怖を 広め、 ローマ帝国は 彼らに対して 定期的な遠征を 余儀なくされました。 航路の多い海域に 近い隠れた島々や ぎざぎざの海岸線は、 海賊活動の理想的な拠点でした。 岩礁や 海流、 悪天候が 緩慢な交易船を 格好の獲物に 変える海域は、 暴行を 働いた後に 素早く逃げ込める避難所でもあったのです。 古代に 小アジアの海岸が 恐れられたのは、 大航海時代に カリブ海が 恐れられたのと 同じであり、 東南アジアの海賊は ほとんど神話的な存在に なりました。<n><n>語源に よれば 「バッカニア」 とは、 海軍の水夫ではなく私人として 獲物を 求めて海に 出た船乗り、 つまり海賊行為に従事していると見なされた者を 指しました。<n><n>しかし私掠免許状の発行によって、 カリブ海のバッカニアの一部は 合法の外観を 得ました。 これらの文書は イングランド・フランス・オランダの総督が 発行し、 海賊という 災いを 敵対国に向けるのが 目的でした。<n><n>私掠免許状を どれだけ 容易に 得られるかは、 総督次第でした。 海賊と 手を 組むのは 不名誉だと考える総督も いれば、 あまり良心に 縛られない者、 単に腐敗していたり臆病だったりする者も いました。"
"0xd4cd0fb5" = "「七つの海」 は実際には三つ （つまり三大洋） しかありません。 太平洋 （南北）、 大西洋 （南北）、 北極海と 南極海、 そしてインド洋です。<n><n>太平洋の名は、 マゼランの世界一周に 由来します。 この広大な海を 渡るのに 何週間も 飢えながら、 幸運にも好天に 恵まれたのです。<n><n>もう一つ。 カリブ海の名は 「カリベ （カライベ）」 から来ています。 これは インディアン語族の民族名で、 その居住域は アンティル諸島から 南米北岸一帯に 及んでいました。"
"0xd4cd0fb6" = "バミューダ諸島の名は、 1503 年に 発見したスペインの探検家フアン・ベルムデスの名に 由来します。 船乗りたちに 「バミューダ・トライアングル」 として知られる、 不可解な海難事故の危険が 非常に 高いとされる海域は、 バミューダ諸島、 プエルトリコ、 フォートローダーデール （フロリダ） の間の海を 指します。<n><n>この一連の奇妙な出来事は コロンブスの航海から 始まったと主張する人も います。 スペインに 仕えたジェノヴァ出身の彼は、 1492 年 9 月 14 日、 まさにこの海域で 三隻の船とともに、 羅針盤の針が 激しく回るのを 目に しました。 これは 地理上の北極と 磁北との差による ものでした。 翌日には空に 巨大な炎が 現れました （隕石だった可能性が あります）。<n><n>ただし 「バミューダ・トライアングル」 という呼び名が 生まれたのは 第二次世界大戦後のことでした。 一連の航空機事故が、 北大西洋南西部のこの海域に 世間の注目を 集めたのです。<n><n>神秘現象の信奉者たちは 200 件以上もの未解明の事故を 挙げますが、 境界の取り方は かなり恣意的です。 その多くは、 そもそもこの海域で 起きてもおらず、 ごく論理的に 説明が つくものです。"
"0xd4cd0fb7" = "定期的に アメリカから スペインへ向けて出航した伝説のスペイン宝船団は、 イベリア半島の外にもあらゆる欲望を 呼び起こしました。 とりわけ野心家のイングランドは、 これを スペインの 「海の女王・世界の女王」 の地位に 異を 唱える好機と 見たのです。<n><n>島国は まだ大規模な軍事作戦を 展開できるほど強くなかったため、 ライバルと ヨーロッパの外で、 遠くで、 攻撃を 予期されず警告も 与えられない場所で 事を 構えるほうが はるかに 理に かなっていました。 そこでは獲物を 楽に 奪い、 そのまま消えれば、 ヨーロッパの誰も 何か月も その出来事を 知りません。<n><n>大胆な船長たち、 その最も有名なフランシス・ドレイク （1540-1596） らには、 エリザベス 1 世陛下から 私掠免許状が 与えられました。 この免許状は いわば白紙小切手のようなもので、 ドレイク一味を 並のバッカニアの上に 押し上げ、 より高き権威に 仕える私的な山賊男爵の地位を 与える略奪許可証でした。 彼らは 実に見事に それを こなしました。 イベリアの船も 守備隊も 安全な場所は ありませんでした。<n><n>1578 年、 ドレイクは マゼラン海峡を 抜け、 アメリカの太平洋岸で スペインの獲物を 求めて旋風のように 駆け回りました。 それまで 誰も 敢えてしなかったことです！ 1580 年に プリマス港へ 戻ったドレイクは、 マゼランに 次いで世界を 一周した二人目の船長に なっていました。<n><n>一方、 スペイン王フェリペは 激怒し、 1494 年に 教皇が 西半球を スペインの勢力圏と 断言したトルデシリャス条約を 振りかざしました。 しかし、 ローマ教皇の権威を 完全に 拒否し、 1582 年に 教皇グレゴリウスの命で 作られたという理由だけで 1753 年まで グレゴリオ暦の採用さえ 拒んだプロテスタント異端者の、 この奇妙な島国に、 そんな抗議が 効くはずも ありませんでした。<n><n>再び、 問題は 戦争でしか解決できないかに見えました。 フェリペの無敵艦隊は 1588 年に イングランドへ向けて出航しますが、 すでに騎士に 叙されていたフランシス・ドレイク卿の指揮と、 折よく訪れた嵐の助けによって、 イングランドは スペイン艦隊を 撃破しました。 以後数百年、 イギリスの海軍大国としての地位に 挑む者は いませんでした。"
"0xd4cd101f" = "疑いなく、 コロンブス （1451-1506） のアメリカ航海は、 人類が 行った最大の冒険の一つに 数えられます。 劇的な出来事と 奇妙な偶然に 満ちたこんな物語は、 著述家でさえ想像するのを ためらうでしょう。<n><n>ジェノヴァ出身の航海者は、 インドへの西の海路が あるという考えを スペインのイサベル女王と フェルナンド王に 納得させることに 成功しましたが、 船の乗員の同意は 得られませんでした。 実際、 乗員の多くは 強制的に 集められたのです。 王冠に対する 軽犯罪の罰として、 パロスの町は 船二隻と 乗員を 供出させられました。<n><n>コロンブスの計画が 知れ渡ると、 恐怖の声が 上がりました。 乗員たちは、 自分たちは 狂人の指揮下で 航海しており、 その男は 自分と 同船する全員を 破滅させるだけだと固く信じていました。<n><n>しかしコロンブスの最大の敵は 迷信でした。 ありとあらゆる恐怖の物語が 船内に 持ち込まれ、 奇妙で不吉な出来事が 船乗りの恐れを 強めるだけでした。 テネリフェを 過ぎるころ火山が 噴火し、 空には炎の柱が 見え、 羅針盤の針まで 乗員を 翻弄しているようでした。 船が 無風で 止まれば凶兆と され、 順調に 進めば、 風は 常に東から 西へ 吹いており引き返せないのだと言われました。<n><n>何度も 反乱は 避けられないかに見えました。 ある夜、 船長は 船室の外に 足音と つぶやきを 聞きましたが、 大声で 祈り始めたとき、 暗殺者たちは 勇気を 失って忍び去りました。<n><n>最も深刻な危機は、 水平線上の島だと思ったものが またしても錯覚に すぎないと分かったときに 訪れました。 まさにそうしたことが 起きた 10 月 10 日、 事態は 頂点に 達します。 コロンブスは 苦労して三日間の猶予を 取り付けました。 その後に 乗員は （できれば船長抜きで） 引き返したがっていました。 しかし運命は 別の意図を 持っていました。 実際、 その三日のうちに 陸地が 見えたのです。 その場に いた誰も、 アジアではなく全く新しい未知の大陸に たどり着いたとは夢にも思わなかったでしょう。<n><n>日本も 中国も まだ何千海里も 先に あり、 その航路に 外国の大陸が あったという信じがたい幸運が なければ、 コロンブスの遠征は 失敗に 終わっていたでしょう。 乗員の士気は すぐに持ち直しました。 誰一人、 反乱を 考えたことなど 一度も なかったかのように 振る舞いました…"
"0xd4cd1020" = "コロンブスは 確かに 新しい陸地を 発見しました （というより再発見で、 中世にはすでにヴァイキングが アメリカの地を 踏んでいました） が、 誤ってインドへの海路を 発見したと宣言しました。<n><n>四回の航海のうち二回目と 三回目を 準備するあいだ、 ジェノヴァ出身の彼は フィレンツェのアメリゴ・ヴェスプッチと 協力しました。 西のこれらの土地は 実は新しく未知の大陸に 属すると最初に 示したのは 彼です。 この目覚ましい認識が 世間の関心を 再び呼び起こし、 新しい領土が 話題に なれば必ずヴェスプッチの名が 挙がりました。<n><n>一方、 コロンブスの声望は 衰えました。 その間に カリブ海の入植者たちの訴えで 鎖に つながれて本国へ 送り返され、 1506 年に 苦々しく病んだ末の死も、 ふさわしい注目を 集めませんでした。 ですから一年後、 南ドイツの地図製作者マルティン・ヴァルトゼーミュラーが、 この未知の土地に 名を 提案する際に、 人気のアメリゴ・ヴェスプッチの名に 着想を 得たのも 不思議ではありません。<n><n>ヴァルトゼーミュラーの名は 同僚たちに 受け入れられました。 「コロンビア」 と名付けられていたら、 もっと公平だったでしょう。"
"0xd4cd1021" = "スペイン統治下で 最初に 重要に なったアメリカの地は イスパニョーラ島でした。 コロンブスは すでに 1493 年に ここに 最初のヨーロッパ人入植地を 築きましたが、 彼が ヨーロッパから 戻る前に 先住民によって 滅ぼされていました。<n><n>その後、 スペイン王室は この島の支配を 強めていきます。 最初の修道院と 大聖堂が 建てられ、 他の地域へ 広がる社会制度が ここで 初めて整いました。 階級で 厳格に 分かれた奴隷制社会で、 カトリック教会と 密接に 結びついていました。<n><n>イスパニョーラは 大きな可能性を 秘めているように 見え、 海を 渡って多くの進取の気性ある入植者を 惹きつけました。<n><n>しかしスペインが 目を 他の地域へ向けるのに 時間はかかりませんでした。 大陸の大王国は すでに発見され征服されていたのです。 そこでは統治も 容易で、 金銀の鉱床も 豊かで採掘も 簡単でした。<n><n>投げ捨てられた玩具のように、 人々は イスパニョーラへの関心を 失いました。 オランダ・イングランド・フランスの海賊が 交代で 攻撃を 仕掛けます。 1697 年、 フランスが 島の西部サン＝ドマング （現在のハイチ） を支配し、 利益の出る農園経済を 築きました。 カカオ・砂糖・藍・綿花・コーヒーの生産により、 サン＝ドマングは 18 世紀に 新世界で 最も利益を 生む植民地と なりました。<n><n>フランス革命を 機に 起きた、 史上唯一成功した奴隷反乱は、 やがて 1804 年のハイチ独立へとつながります。 反乱者たちは かつての支配者を、 自分たちが されたのと ほとんど同じように 扱いました。 「独立宣言には、 羊皮紙に 白人の皮、 インク壺に その頭蓋骨、 インクに その血、 ペンに 銃剣が 必要だ」 と、 黒人将軍ボワスロン＝トネールは 当時宣言しました。"
"0xd4cd1022" = "カリブ海を 代表する産物でありながら、 人類への恩恵は 疑問なのが ラム酒です。 サトウキビの糖蜜から 作られるこの蒸留酒は、 もともと 「悪魔殺し」 という色鮮やかな名を 持ち、 1650 年に バルバドスで 初めて言及されました。 海賊の伝説的な飲み物として、 多くの人は ラム酒を ジャマイカ島と 結びつけます。 史上最も恐れられた海賊の巣窟の一つです。<n><n>奴隷商人は アフリカ沿岸で 買い付けた 「人間の商品」 を、 カリブ海で 大量の糖蜜と 交換しました。 その糖蜜は ニューイングランドで ラム酒に 蒸留され、 同じ船で アフリカへ 運ばれます。 酒は アフリカで 売られ、 空に なった船には新たな奴隷が 積まれました。 この 「三角貿易」 によって、 船主は どの航海でも船を 満載に できたのです。"
"0xd4cd1023" = "キューバに 次いで、 ジャマイカは おそらくカリブ海で 最も名高い島でしょう。 その名は アラワク語の 「シバマカ」 に由来し、 おおよそ 「木と 水の国」 を意味します。 9 年前に この島を 発見していたコロンブス自身も、 1503 年に 北岸沖で 船が 難破したとき、 その景観の美しさと 住民の親切を 存分に 味わう機会を 得ました。<n><n>実際、 彼は この島が たいほど 気に入り、 スペイン王から 島全体の所有権を 移して自分のものと 宣言しました。 にもかかわらず、 この楽園のような島は その後数十年ほとんど顧みられず、 1655 年に イギリスに 奪われます。 この時点で アラワク人は ごくわずかしか残っていませんでした。 彼らは ヨーロッパ人が 持ち込んだ病に とりわけ弱かったのです。<n><n>1661 年、 エドワード・ドイリーが ジャマイカの総督兼総司令官に 任じられました。 その権威のもと、 首都ポートロイヤルは 活気に 満ち、 厳重に 防備された海賊の避難所へと変貌します。 「地上で 最も豊かで最も腐敗した場所」 と言われ、 ふだんは 普通の商人である住民の多くが、 しばしば徒党を 組んでスペイン海域へ 私的な略奪に 出かけました。 当初、 イギリス政府は これを 取り締まる気を ほとんど見せませんでした。 何しろバッカニアたちは スペインの競争相手を 抑え込んでくれていたのです。<n><n>文化と 秩序が ジャマイカに 戻ったのは、 ヘンリー・モーガン卿が 総督に 就いてからでした （彼自身が 元海賊だった点が 重要です）。 モーガンは 海賊行為を 容赦なく弾圧し、 かつての仲間を 絞首台へ 送ることに 何の躊躇も 示しませんでした。<n><n>しかし、 イギリスの権威が 回復されるやいなや、 サトウキビ栽培に加えて新たなもうかる収入源が 見つかります。 1672 年以降、 イギリス王立アフリカ会社が 独占を 確立すると、 ポートロイヤルは 世界最大の奴隷市場へと発展したのです。"
"0xd4cd1024" = "新世界に 到着してわずか 2 週間後、 コロンブスは 西インド諸島最大の島、 キューバに 到達しました。 ここにはシボネイ、 グアナハタベイ、 タイノといった部族が 住んでいましたが、 平和的な性質にもかかわらず、 他の先住民部族と 同じ不幸な運命を たどりました。 1511 年、 スペインとの 4 年間の戦いの末に 征服され、 絶滅させられたのです。 その結果、 大量の黒人奴隷が ここへ 輸入されました。 首都ハバナを 持つこの島は 七つの行政区 （カビルド） に分かれ、 それぞれが 特別評議会へ 代議員を 送り、 地域の利益を 代表しました。<n><n>キューバ史で 注目すべきは、 1762 年から 1763 年のイギリス支配という 短い中断を 除き、 この島が 比較的長くスペインの手に とどまったことです。 植民地時代のキューバは スペイン帝国の最重要地域ではなく （たとえば鉱床は ほとんどなく）、 大陸へ 向かう中継地として 使われていたからかもしれません。 いずれに せよ、 19 世紀の最初の四半世紀に 南米・中米の大多数の国が 独立を 戦った一方で、 スペインは 1898 年に 島の支配権を アメリカへ 譲るまでキューバを 保持し続けました。"
"0xd4cd1025" = "今では当たり前に なっている多くのものが、 アメリカとの交易によって 初めてヨーロッパへ 届いたことは 広く知られています。 しかし文化の交流は 逆方向にも働きました。<n><n>たとえば北アメリカの平原の典型的な先住民を 思い描くとき、 スペイン人と ポルトガル人が 来る前のアメリカに 馬が いなかったとは想像しにくいでしょう。 多くの先住民は 初めて馬と 騎手を 見たとき、 二つの生き物が 一つに 育った奇妙な獣だと思い、 盲目的な恐怖で 逃げ出しました。<n><n>ブラジルや グアテマラなどと結びつけられるコーヒーも、 アメリカ原産ではなく、 そこへ 届く前に すでに三つの大陸を 旅していました。 アフリカ （おそらくエチオピア） からアラブ諸国を 経て南西ヨーロッパへ。 この植物が アメリカに 初めてもたらされたのは 18 世紀、 飲み物の人気が 高まり栽培を 増やす必要が 生じたときでした。<n><n>ジャガイモによって、 ヨーロッパ人は カリブ海で 想像を 絶する価値のある主食を 見つけました。 逆に 小麦は、 スペイン人と イングランド人が 持ち込むまでアメリカにはありませんでした。 それぞれ 1520 年に メキシコへ、 1777 年に バージニアへ もたらされています。 当初アメリカの気候は 小麦に 適さないと考えられていましたが、 とりわけ北アメリカで この作物は 驚異的な成功を 収めました。 今日、 小麦は 世界で 最も作付面積の大きい農作物です。"
"0xd4cd1026" = "チョコレートのない生活を 想像できますか？ できて当然です。 アメリカ発見以前、 カカオは 世界の他の地域では知られていませんでした。 カカオという 語は おそらくマヤ語に 由来し、 そこまで 遡れます。 キリスト生誕の 400 年前には、 マヤの商人が すでにカカオを 飲んでいたのは 確かでしょう。<n><n>14 世紀から 中央アメリカ大陸の支配勢力だったアステカ人は、 カカオに 宗教的な意味まで 与えていました。 この珍味に 最初に 触れたヨーロッパ人も、 やはりコロンブスでした。 ただしそれは 1502 年、 ニカラグアへ 向かった後の航海でのことです。<n><n>しかしカカオの正当な 「発見者」 は、 アステカ王国を 征服したエルナン・コルテスです。 彼は 「ショコアトル」 という飲み物の作り方 （これが 「チョコレート」 の語源です） をスペインへ 持ち帰りました。 当初は ヨーロッパ人の口には苦すぎ、 砂糖や バニラを加えるように なってから、 ホットチョコレートは イベリア半島の上流階級に 広まりました。<n><n>スペインは およそ 100 年のあいだ作り方を 独占し、 その後ホットチョコレートは フランスから ヨーロッパ各地へ 広がりました。 1700 年ごろにはイギリス人が 牛乳を加えます。 コーヒーと カカオを 混ぜると美味しいと分かって、 ヨーロッパでのカカオの本格的な普及が 完成したのです。"
"0xd4cd1027" = "海賊について 語るとき、 現実と 伝説の区別がつきにくいことも ありますが、 女海賊が 実在したことは 疑いようが ありません。 その中でも特に華やかな二人が、 18 世紀初めに ジャマイカ島で この道に 踏み出しました。<n><n>アン・ボニーは まだ子どもの頃に 腹を 刺されたと言われ、 やがて船乗りと 駆け落ちして海賊の巣窟ニュープロビデンス （ナッソー） へ渡りました。 そこで夫を 始末し、 拿捕したオランダ船の上で 自らの海賊稼業を 始めます。<n><n>そこで 出会ったのが メアリー・リードでした。 彼女は 男装してスペイン継承戦争を 戦ったことが あり、 相手を 殺す前に 胸を あらわして、 女に 負けたのだと示したと言われています。<n><n>1720 年に 捕らえられた二人は、 妊娠していたため絞首台送りを 免れました。 男の仲間たちの多くより 幸運で、 アン・ボニーは 彼らを 軽蔑してやまなかったといいます。<n><n>絞首台へ 向かう悪名高い 「キャリコ・ジャック」 に彼女が 浴びせた言葉が 残っています。 「こんなところで 会うのは 残念だよ、 ジャック。 男らしく戦っていれば、 犬のように 吊るされることは なかったのに」。"
"0xd4cd1028" = "ウェールズ出身のバーソロミュー・ロバーツ （1682 年？ -1722 年） は、 最も重要な海賊の一人であるだけでなく、 非常に 変わった海賊でもありました。 「ブラック・バート」 とも呼ばれ （エドワード・ティーチこと 「黒ひげ」 とは別人物です）、 37 歳で 遅まきながら海賊に 転じましたが、 犯罪への転身は 疑いなく滑らかでした。 1719 年に 同郷のハウエル・デイヴィスに 襲われた彼の乗っていた船は、 実は奴隷船だったのです。<n><n>ロバーツは デイヴィスと 運命を ともに することに し、 数週間後に デイヴィスが 殺されると船長の役目を 引き継ぎました。 バーソロミュー・ロバーツは 酒を 避け、 茶を 好んだと言われています。<n><n>自らを 悪魔の化身と 見せたティーチと対照的に、 ロバーツは 身なりの良さを 好み、 賭け事を 嫌い、 部下に 祈りを 唱えるよう命じました。 しかし、 だからといってロバーツが 心から敬虔だったわけではありません。 数え切れない略奪のさなか、 とりわけ捕虜に対して 犯した残虐行為の話は 数多く残っています。 400 隻を 超える船を 奪い、 活動範囲は ブラジルから ニューファンドランド、 西アフリカにまで及んだ彼は、 ヘンリー・モーガンと 並ぶ中央アメリカで 最も成功した海賊でした。<n><n>1722 年、 ギニア沖のイギリス軍艦の砲声が 彼の海賊稼業の終わりを告げ、 七つの海から 最大級の脅威の一つが 消え去りました。"
"0xd4cd1090" = "17 世紀で 最も名高いバッカニアは ウェールズ出身のヘンリー・モーガン （1635-1688） で、 西インド諸島のスペイン植民地を 悩ませ、 この地域における イベリアの大国の権威を 根底から 揺るがしました。<n><n>彼の生涯は、 イギリス・オランダ・フランスの政策の背後に ある、 いささか怪しげな道徳を 示しています。 他の大国に 損害を 与える限り、 海賊行為には喜んで目を つぶったのです。<n><n>1668 年に バッカニア船の指揮を 任されたモーガンは、 まず南米北岸で 猛威を 振るい始めました。 2000 人近い部下を 率い、 1670 年 8 月に 防備の厚いパナマの町を 攻略し、 帰路には戦利品の大半を 持ち去りました。 しかし、 この攻撃が スペインと イングランドの和平条約調印後だったため、 捕らえられてロンドンで 裁判に かけられました。<n><n>モーガンは 有罪に なりませんでした。 それどころか、 まもなく外交の風向きが 再び変わったのです。 恩赦されただけでなく、 騎士に 叙されました。 サー・ヘンリーとして ジャマイカの新総督に 任じられ、 厳しい法と 秩序を 敷き、 裕福で尊敬される農園主として 余生を 過ごしました。"
"0xd4cd1091" = "バハマは 17 世紀半ばに わずかな期間、 イングランドの宗教的異端者の避難所と なりましたが、 1670 年からは正式に、 利益を 狙って国王チャールズ 2 世から この島々の所有権を 得たアルバマール伯爵ら紳士たちの支配下に 入りました。<n><n>しかし約束に 反し、 彼らは 秩序ある民政の確立に関心を ほとんど示しませんでした。 まったく逆でした。 カリブ海の他の地と 同じく、 海賊の群れが バハマ、 とりわけナッソーの町が あるニュープロビデンス島に 居着いたのです。<n><n>重い軍艦が 入れない浅い入り江は、 数百隻のスループや 海賊バークにとって 理想の停泊地でした。 スペイン海域への頻繁な襲撃は 報復を 招き、 初代総督ジョン・ウェントワースは 島々に 法と 秩序を 回復するという厄介な仕事を 負いました。<n><n>状況が 好転する気配が ないため、 イングランド王ジョージ 1 世は バハマを 再び没収し、 王室直轄植民地と しました。 元バッカニアで 世界一周航海者のウッズ・ロジャーズが、 1718 年の半ばに 初代王室総督に 任じられました。<n><n>飴と 鞭を 使い分けて、 彼は それまでの混乱に 終止符を 打ちます。 誓いを立てて海賊行為を 捨てる者には広範な恩赦を 約束しました。 応じない者には、 徹底的に 武装した艦隊による 罰が 待っていました。<n><n>こうして正常な状態が 戻ると、 1729 年にはこの島々に 独自の議会が 認められ、 以後 100 年、 侵略による 多少の混乱を 除けば、 バハマの歴史は 比較的平穏に 過ぎました。"
"0xd4cd1092" = "スペインは 新たに 得た植民地のほとんどどこでも、 出世の機会が ほとんどない厳格な社会制度を 敷きました。 階層の最上位は、 ヨーロッパ生まれの同国人たちです。<n><n>植民地生まれのスペイン人は クリオーリョと 呼ばれました。 階層上は 二次的な存在と されたものの、 国家・教会・軍の下級職の大半を 占めていました。<n><n>ヨーロッパ系のスペイン人と クリオーリョが 植民地のエリート層を 成していたのです。 白人 （主に 男性） と先住民の混血の子は メスティーソと 呼ばれました。 もともとこの土地の持ち主だった先住民は 社会の最下層に 置かれ、 彼らが ヨーロッパ人によって 完全に 絶滅させられた地域では、 その 「名誉」 は黒人奴隷に 与えられました。<n><n>こうした階層の人口比は、 スペイン帝国の地域によって 大きく異なりました。 たとえばメキシコではメスティーソが 人口の最大部分を 占めました。 多くの島では黒人奴隷が 多数を 占め （そして主人のなすが ままに され）、 ジャングルや 沼地、 山岳地帯が 安全な隠れ場所と なった地域、 たとえばボリビアや フロリダでは先住民の部族も 生き延びました。"
