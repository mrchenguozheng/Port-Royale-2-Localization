"0xca6f7278" = "あなたは わが国で とても良い名声を 得ています。 さらに名声を 上げる方法を 一つ知っています。<n><n>少し前に 海賊 %1 の隠れ家が 見つかりました。 %2<n><n>この一党という 災いを 我々から 取り除いてくれるのは、 あなたかも しれません。"
"0xcab1988a" = "%1 が攻撃"
"0xcac5b30b" = "祈る"
"0xcacc4fa8" = "スペインの宝船団を 見つけて撃破してください。 最後に 確認されたのは @T$StartTown$ で、 そこから @T$DestTown$ へ向けて出航しました。"
"0xcb2b0709" = "なんという災難だ！ 今日 @F$WifeName$ に会いましたか？ 手間を 省いてもいい、 彼女は もういません。 ほら、 別れの手紙のようなものを 見つけました。 退屈な生活に 愛想が 尽きた、 冒険者と 駆け落ちしたと書いてあります。 私の愛する娘を 救ってください！"
"0xcb2b070a" = "災難が 降りかかり、 どうやらあなたも その渦中に いるようだ。 娘が 海賊に さらわれたが、 誰かが地図付きの伝言を 残している。 罠に 見えるが、 どうすればいい？ 娘を 救わねばならない！"
"0xcb2b070b" = "はっ！ 私の娘、 つまりあなたの妻は、 町の警備隊の将校と 駆け落ちした！ そうだろうと思った！ 今は 二人とも 行方不明で、 私の船を 一隻盗んでいる！ 娘を 私のもとへ 連れ戻し、 よく言い聞かせてくれ！ 奇妙なことに、 娘の部屋で 場所の記された地図を 見つけた。"
"0xcb3b9785" = "新しい名前"
"0xcb3c204b" = "新しい建築許可"
"0xcb4ef185" = "攻撃"
"0xcb6604a0" = "沈没"
"0xcb674ff0" = "わが国を 代表して感謝します。 船団は これから整備され、 乗員も 集められます。 出航できるのは 15 日後です。<n><n>別の船団を 引き渡したいなら、 それまで 待ってください。"
"0xcb6c23d8" = "購入"
"0xcb6f7f0c" = "道具の納品"
"0xcb7ef0e8" = "交易成功 %1"
"0xcb853f07" = "船長は 司令官との決闘に 勝ちました。 船員たちは 宝物庫へ 向かい、 %1 を持ち出します。<n><n>次に、 町の倉庫から どの物資を 奪うか選んでください。"
"0xcb8dbdae" = "敵の銃士"
"0xcb8dd6d9" = "敵の @n$HostileNation$ は手段を 選びません。 妻が さらわれ、 解放の条件が 突きつけられています。 ただし、 どこに 監禁されているかは知っています。 表向きには何も できないのです、 お分かりでしょう。 しかしあなたが 町を 攻めて妻を 連れ戻すことは できます。"
"0xcb8dd6da" = "会えてうれしい。<n>妻が 最近パリから 手入れされたプードルを 買いました。 その忌々しい動物には気が 変に なりそうですが、 妻は 犬に 夢中です。<n>それを 知った誰かが 犬を さらって敵に 渡し、 我々を 脅しているのです。<n><n>そのプードルを 救ってくれませんか？"
"0xcb8dd6db" = "しばらく前、 末娘が 通りすがりの冒険者と 駆け落ちしたと言われていました。 それが 今、 @T$TargetTown$ に住み、 町の司令官と 結婚することに なっていると分かったのです。 娘のことは 分かっています。 自分の意思で あんなことを する子ではありません！ 総督代理に 「娘を 救うため町を 攻撃せよ」 などと言えるはずも ない。 しかし、 あなたならどうですか？"
"0xcb9b3a82" = "鼠の疫病が 発生"
