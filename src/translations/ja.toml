"0xd92d797c" = "A trader from a different nation has lured away a considerable number of workers. These workers have left the town as settlers together with their families.<n><n>Now your task is to find enough settlers so that every business in the town has a full complement of workers by no later than @D$EndDate$.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective <f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>The number of citizens (inhabitants minus soldiers) must be restored to @I$Pop$ by no later than @D$EndDate$."
