"0xe392264a" = "このロープは しばらく海水に さらされていたはずですが、 できたばかりのように 見えます。 手触りは 驚くほど滑らかで、 とても丈夫な結び目を 作れます。"
"0xe39226b2" = "この帳面には美しい星図が 数多く収められています。 大きな表が、 それぞれの星が いつどこで 昇り沈むかを正確に 示しています。"
