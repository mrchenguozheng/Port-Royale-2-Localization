"0x0adb3fdd" = "I knew I could trust you. It concerns the town of @T$TargetTown$, which belongs to @n$HostileNation$. Attack the town and loot it for all I care, then seek out my wife. Don’t delay, as I have only been given until @D$EndDate$ to think it over.<n><n>If you do not yet possess a Letter of Marque against @n$HostileNation$, I will give you one."
"0x0adb3fde" = "My wife will be overjoyed. The poodle Michelle is hidden in @T$TargetTown$. Loot the town so that it looks like a military mission and then search for the dog. You have until @D$EndDate$.<n>Believe me, it will give me no pleasure to see the dog again, but my wife's sniveling shows no sign of abating.<n><n>If you do not yet possess a Letter of Marque against @n$HostileNation$, I will give you one."
"0x0adb3fdf" = "That's agreed then. Please loot @T$TargetTown$ and return my daughter to me. Her birthday is on @D$EndDate$ and she must be back here again for this special occasion.<n><n>If you do not yet possess a Letter of Marque against @n$HostileNation$, I will give you one."
