"0x0eb34b66" = "In this scenario, you'll learn how to establish businesses and find out what you need to take into account when you do so. You'll also construct residential areas for your new workers.<n><n>In Port Royale 2, you can build in any town where you have a purchased a building permit. The more permits you have, the more expensive your next one will be. You already have one permit in the town where you started the game, so you can start to construct new buildings there immediately.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construct one cocoa production facility and one residential area in Santa Marta."
"0x0ede126a" = "Now you know how sea battles work. It is also possible to attack an entire town to loot it or to capture it on behalf of another nation. However, to do so, you need large convoys with powerful ships. As you can imagine, attacking a city will seriously damage your reputation with the nation in question and its military convoys will pursue you from then on.<n><n>Alternatively, you can attack a pirate hideout. Pirate hideouts are usually in secret locations but each of these locations will become known at some point in the game. You can then attack a pirate hideout in the same way you attack a town, to destroy the entire pirate gang.<n><n>The strength of the defenses surrounding one of these hideouts depends on how long a pirate gang has been at large and how successfully their convoys have looted trading ships.<n><n>Your final task in this scenario will be to raid a small pirate's den. Find out where the hideout is located from the Governor of @T$TOWN$.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destroy the pirate hideout of @P$PirateName$."
"0x0eecc4e8" = "イングランドの植民地"
