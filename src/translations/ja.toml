"0x080f2b29" = "<ts:20>You should know the following about goods:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>There are five different types of goods: essential goods, raw materials, finished goods, colonial goods and import goods<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Each town can produce five goods<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>There are two types of town: colonial towns and towns with a governor or viceroy<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Governor towns produce essential goods and finished goods. They also receive regular deliveries of import goods from Europe. These towns are therefore the best places to find finished goods and import goods.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Governor towns need raw materials to produce finished goods. They also take in colonial goods. These are collected from the transport convoys from Europe.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Colonial towns produce essential goods, raw materials and colonial goods. Each colonial good can only be produced in certain areas of the Caribbean. Coffee, for instance, is only available in the south and west of the Caribbean.<n><n>You should know the following about prices:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>The greater the demand for a good and the smaller the supply of it in a town, the higher the price will be.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>The better your reputation in a nation, the lower the price at which you will be able to buy goods in towns belonging to that nation.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>You should only buy goods in the towns where they are produced.<n><n>The fastest way to get money:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>buy colonial goods and raw materials in colonial towns<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>sell these goods in governor towns and buy finished products and import goods there."
