"0x034e66b1" = "倉庫"
"0x0351768f" = "Have you heard tell of this pirate Blackbeard? His real name is Edward Teach and he is in possession of several convoys and for some time now they have been attacking traders of all nations with a great deal of success. However, no one has yet managed to arrest him.<n><n>I am therefore assigning you the task of tracking down one of his convoys and destroying it."
"0x03517690" = "The activities of Blackbeard's gang are already on the decline, but we cannot afford to rest on our laurels when it comes to those filthy scoundrels. I am therefore assigning you the task of destroying yet another of Blackbeard's convoys."
