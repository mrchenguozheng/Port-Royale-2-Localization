"0xf6ec5ddc" = "トルトゥーガで 奇妙なことが 起きています。 過去のさまざまな出来事のせいで、 町に 足を 踏み入れようとする商人は ほとんどいません。 あなたの任務は、 物資を 供給してトルトゥーガを できるかぎり支えることです。<n><n>ただし開始資金は 決して潤沢ではありません。 手元の現金は @g$StartGold$ です。 それでも港には装備の整った交易船団が あり、 物資も いくらか蓄えが あります。<n><n>最初の目標は、 現金を @g$GoldGoal$ まで増やすことです。 できるだけ早く、 ただし 40 日を 超えないように。<n><n>忠告： どんなことが あっても船を 売ってはなりません。 借金は かまいません。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@D$EndDate$ までに現金を @g$GoldGoal$ まで増やしてください。"
"0xf70feddb" = "カルタヘナの港に 戻り、 船団 「Santa Maria」 が選ばれています。<n>ご覧のとおり、 船団にはすでに綿花・肉・カカオが 積まれています。<n>では港の船着場を 探してクリックしてください。 物資を 売るのです。"
"0xf70feddc" = "船着場では、 町と 倉庫の間、 町と 船団の間の両方で 取引できます。<n>町に どんな物資が あり、 船団に 何が 積まれているかが分かります。 矢印で 売買します （価格は 矢印に 表示されます）。<n>では綿花を 売ってください。"
"0xf70feddd" = "綿花を 売ったときに 値段が 下がるのに 気づいたでしょう。<n>これは 町の需要と 供給で 値段が 決まるからです。<n>売れば需要が 満たされて値段は 下がり、 買えば値段は 上がります。<n>では小麦を @a$SubGoal$ 買ってください。"
"0xf70fedde" = "小麦の値段が 上がったのが 分かりますか？<n>ただし値段は 供給だけ でなく、 その町でのあなたの名声にも左右されます。<n>取引ウィンドウ右下の建物のボタンを クリックしてください。"
"0xf70feddf" = "これで 倉庫と 町の間で 取引できます。<n>物資の生産を 始めたい町では、 まず倉庫を 建てねばなりません。 開始した町では最初から 倉庫を 持っています。<n>では倉庫に ある物資を 全部売ってください。"
"0xf70fede0" = "取引ウィンドウの一番上に 1、 10、 100 のボタンが あり、 まとめて早く取引できます。 10 のボタンを 押して値段が どう変わるか見てください。<n>1 個を 10 回買っても、 10 個を 1 回買っても、 合計価格は 同じです。 ではラム酒を @a$SubGoal$ 買ってください。"
"0xf70fede1" = "取引メニューの一番右の列には、 買った物資の平均価格が 出ます。 利益を 出して売るには、 より高い値を 付ける町を 探さねばなりません。<n>では右下の 4 番目 （クレーンの） ボタンで、 船と 倉庫の間の移譲を 開いてください。"
"0xf70fede2" = "このウィンドウでは船団と 倉庫の間で 物資を 移せます。 別の町で 売るのですから、 倉庫に 残っている物資を すべて船団に 積んでください。<n>その後、 右下の 「X」 ボタンで 取引ウィンドウを 閉じてください。"
"0xf70fede3" = "では海図に 切り替え、 船団で サンタマルタへ 向かってください。 サンタマルタには入らず、 船団が 町に 着いたらすぐ町を 右クリックしてください。"
"0xf70fede4" = "サンタマルタの取引ウィンドウが 開きます。<n>つまり、 取引するために 町に 入る必要は ありません。<n>では船団に 積んだ物資を すべて売ってください。<n>その後、 取引ウィンドウを 閉じてください。"
"0xf7110875" = "このセーブデータを 削除してもよろしいですか？"
"0xf725f22c" = "船団は サンタマルタに います。 町の名前を クリックすると町の情報が 出ます。<n>海図からでも、 町に 入ってからでもかまいません。"
"0xf725f22d" = "町の情報には、 その町で 生産される物資が 表示されます。<n><n>スペインとの関係も 表示されています。 友好的ですね！ これは 町で 最高の値段が 付くという意味です。<n><n>ではこの窓を 閉じて、 町を 見て回ってください。"
"0xf725f22e" = "画面左の町の名前の下に ある住民の記号を クリックして、 サンタマルタの在庫を 表示してください。"
"0xf725f22f" = "ここには在庫量と 町での消費量が 表示されます。 消費量は 当然ながら町の人口によって 変わります。<n>消費量から、 定期的に どれだけ 届けられるかが分かります。 では在庫ウィンドウを 閉じてください。"
"0xf725f230" = "では利益の出る取引を 試してみましょう。<n>取引ウィンドウを 開き、 綿花・砂糖・カカオを 船団で 運べるだけ買ってください。 これらは この町で 生産されています。<n>そしてカルタヘナに 戻り、 利益を 付けて売ってください。"
"0xf725f231" = "交易を うまく進めるヒントのメッセージを 2 通受け取りました。<n>ログを 開いて読んでください。<n>"
"0xf725f232" = "平均価格より 高く売れる物資は どんどん売り、 新しい物資を 買ってください。<n>注意： 町で 不足している物資の価格は 赤で 表示されます。 こうした物資は いつでも 良い値で 売れます。<n>"
"0xf725f233" = "カルタヘナのような総督都市は、 ヨーロッパから 輸入品を 受け取ります。<n>輸入品は 通常、 サンタマルタや マラカイボ、 ジブラルタルのような植民地の町へ 売ると利益が 出ます。<n>ではしばらく自分で 交易してください。<n>目標は 交易で 現金を @g$GoldGoal$ 稼ぐことです。"
"0xf7346191" = "%1 からの商人"
"0xf73619d7" = "海賊の隠れ家が 知られるように なった"
"0xf7370c4b" = "%1,<n>会いたい人は 他にも大勢います。 話すことが あるのですか？ どうしてもなら入りなさい。"
"0xf73bf67d" = "カルタヘナの町の画面へ 行ってください。<n>通常、 町に 入るには船団を 港に 停泊させておく必要が あります。 しかしカルタヘナには倉庫が あるので、 いつでも この町に 入れます。<n>カルタヘナの造船所を クリックしてください。"
"0xf73bf67e" = "造船所で 小さな船を 1 隻買ってください。 使いすぎないように。 交易と 船の維持のためにも資金を 残しておく必要が あります。"
"0xf73bf67f" = "前のシナリオでは、 港を 右クリックして船団に 船を加える方法を 学びました。<n>しかし今度は、 酒場で 船長を 雇って新しい船団を 編成してください。<n>町の中心に ある酒場を 探してクリックしてください。"
"0xf73bf680" = "船長は いつも酒場に います。 町に 船長が 滞在していれば、 酒場メニューの 3 番目のボタンに 表示されます。<n>港に 他の船や 船団が ある場合は、 その船長を どこで 使うかを正確に 伝えねばなりません。<n>新しい船の船長に することを 指定してください。"
"0xf73bf681" = "おめでとうございます！ 初めての船団を 編成しました！ 次の課題は、 財産を @g$GoldGoal$ まで増やすことです。 財産は ログの 「成果」 でいつでも 確認できます。<n><n>幸運を 祈ります！"
"0xf73dab55" = "前回の任務を 完了してくれて感謝します。"
"0xf73dab56" = "前回の任務を 完了していただき感謝します。"
"0xf73dab57" = "支援に 感謝します。"
