"0xdfb9b5b7" = "Excellent! You now have @g$Gold$.<n><n>Each nation has military convoys to defend its towns and protect the waters around them. The more towns a nation occupies, the more military convoys it needs to ensure they are adequately protected.<n><n>If a nation loses a military convoy, its military strength is weakened. Since military convoys are quite aggressive towards the enemy nation's towns and convoys during a war, a nation may lose a military convoy from time to time. For this reason, convoys are regularly sent from Europe to reinforce a nation’s military strength in the New World.<n><n>You can check a nation's strength under \"Nations\" in the Chronicle. If a nation is described as weak, its towns can be captured.<n><n>You should now defeat enough English military convoys to ensure that England's strength is rated as “weak”.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Defeat enough English military convoys to ensure that England is rated as “weak”."
