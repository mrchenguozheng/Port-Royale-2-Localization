"0xefbbbbe9" = "Now it’s time to find Blackbeard’s pirate hideout and put an end to his dastardly deeds.  Once a pirate has been at large for a while, it will only be a matter of time until his hideout is discovered. But you can also do something to influence this: From time to time, a pirate convoy will return to its hideout to drop off loot and make any necessary repairs.<n>If you follow one of these pirate convoys on the sea chart and watch as it disappears into its hideout, it is very likely that you'll discover the location of the hideout. Once you have discovered the hideout, you can destroy it by attacking it from the sea in the same way you attack a town.<n><n>Hint:<n> @l$IslandPos$ Wait until a convoy approaches and observe it as it disappears into its hideout.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Locate Blackbeard's hideout."
