"0xdaeb0484" = "今回は カリブ海中央の総督都市カルタヘナから シナリオが 始まります。<n>スループ 1 隻から なるあなたの船団が 港に います。<n>このシナリオには海戦が あるので、 まず船団を 武装させましょう。<n>船着場へ 行き、 積荷メニューを 開いてください。"
"0xdaeb0485" = "ご覧のとおり、 船団には大砲も 弾薬も 積まれていません。 乗員も 必要です。<n>乗員を 最大まで、 大砲を できるだけ多く、 さらに 3 種類の弾薬を それぞれ 10x10 ずつ積んでください。<n>大砲は 重いので、 船団に 十分な余裕が ないかもしれません。 その場合は、 積んでいる物資を いくつか売ればよいでしょう。"
"0xdaeb0486" = "よくやりました！ 船団は 武装でき、 小規模な戦いに 備えられました。<n>ちょうど今、 カルタヘナの総督に ぴったりの任務が あります。<n>総督の建物を クリックして、 任務を 受けてください。"
"0xdaeb0487" = "総督は、 成功すればその国でのあなたの名声が 上がる任務を よく持ちかけます。<n>また、 総督に 私掠免許状を 求めたり、 捕らえた海賊の身代金を 請求したりもできます。<n>では船団で、 総督が 話していた船を 探してください。"
"0xdaeb0488" = "上出来です、 船団を 発見しました。<n>次は 船を 戦闘態勢に して、 戦いの準備を します。 船団の船リストを 開いてスループを 選び、 大砲の隣のボタンで 軍艦として 宣言してください。 そうすれば、 船団を 右クリックして 「攻撃」 できます。"
"0xdaeb0489" = "ここが ポートロワイヤルの海戦画面です。<n>自分の船が 表示され、 表示窓を 動かせば放棄船も 見られます。<n>では一時停止を 解除し、 右マウスボタンで 航海の練習を してください。 海戦中は イベントウィンドウに 風向きと 船の向きが 表示されます。"
"0xdaeb048a" = "戦いに 参加している船は 画面下に 表示されます。 ここで 使う弾薬を 選べます。 重い砲弾を 選んで、 敵船を 1 隻沈めてください。<n>左マウスボタンで 撃てますが、 射撃位置が 良いときだけ です。 そのとき目標は 赤く表示されます。"
"0xdaeb048b" = "よし！ 2 隻目に 接舷しましょう。<n>船の表示の右下に ある 「接舷」 ボタンを クリックしてください。<n>そして敵船へ 近づいて体当たりします。 なお、 海戦中も F1 ボタンは 使えます。"
"0xdaeb048c" = "通常、 敵には乗員が いて、 あなたの乗員との間で 船上の戦いに なります。<n>戦いが 終わると、 接舷した船は すべて勝者のものに なります。<n>では敵船を 船団に 加え、 移譲ウィンドウを 閉じてください。"
"0xdaeb048d" = "結構です！<n>では船団を カルタヘナへ 戻してください。"
