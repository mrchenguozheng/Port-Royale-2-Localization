"0xce75e5c4" = "You've now learned how to buy and sell goods. You should always buy goods in the towns where they are produced, as they are generally less expensive there.<n><n>Note: If you want to trade with a convoy, you must have selected it and it must already be in the town before you enter the docks.<n><n>Later in this scenario, you should make profits by trading on your own. The Event window contains tips for doing this.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>You must make @g$GoldGoal$ in cash from trade."
