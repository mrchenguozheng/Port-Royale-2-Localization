"0x077030da" = "Congratulations! You have successfully completed this scenario and now have some experience of sea battles and port attacks.<n><n>Always make sure your escort ships are well armed before you attack another convoy. Of course, you should also think very carefully before deciding which convoys to attack. Transport convoys from Europe and military convoys are always very powerful and pirates can sometimes become powerful opponents too.<n><n>If you attack traders without first obtaining a Letter of Marque from the Governor of a nation, this has a major influence on your reputation with all nations.  At worst, powerful military convoys will pursue your convoy.<n><n>A word of advice: If you capture a trading convoy without sinking its ships and only loot it, the negative impact on your reputation is much smaller. "
