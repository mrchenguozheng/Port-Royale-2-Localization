"0x05478cea" = "My daughter already mentioned you were coming. She can be very impetuous sometimes, you know. But I cannot stand in the way of my daughter's wishes, and I do believe you are the right man for her. And so I must ask you: will you take %1 as your wife? "
"0x05633055" = "自分の建物"
"0x05716a06" = "Your next battle is going be a little more difficult because this time the enemy will resist. Your mission is to track down and kill a pirate for the governor.<n><n>But first you have to arm your convoy for the battle. Buy a ship, add it to your convoy and take new weapons and sailors on board.<n><n>You can press the F1 button at any time during the sea battle to display the keyboard and mouse configuration. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arm your convoy and accomplish the new mission assigned to you by the Governor of Cartagena."
"0x058ca789" = "@T$TOWN$ の総督を訪ね、 任務を受諾してください。"
"0x05980d2c" = "The level of difficulty determines the prices of goods and the damage inflicted in sea battles.<n><n>In addition, with a low level of difficulty, you do not need such a successful trading record in a town before you can purchase a building permit."
"0x05ae35b1" = "Very good! Now pay a visit to the Spanish viceroy in Port Royale and accept a mission to capture a French town.<n><n>Usually, you have to capture two towns before a viceroy grants you a plot of land. However, in this scenario, you have a small bonus and only have to capture one town for Spain.<n><n>You can decide which town to capture. It is a good idea to choose a town with a minimum number of harbor cannons. One French town that would be an ideal target at present is @T$SampleTown$.<n><n>In return for capturing a town, the viceroy will grant you a plot of land. Note: You cannot speak with a viceroy unless you hold at least the rank of Boatswain.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Pay a visit to the Spanish viceroy in Port Royale and accept a mission to capture a town. After you have accomplished this mission, you can accept his gift of a plot of land."
