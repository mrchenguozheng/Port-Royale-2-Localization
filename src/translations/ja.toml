"0x0f1ade15" = "Now you should create jobs in the town and construct residential areas.<n><n>Since settlers will only want to stay in your town if they can find work there, you should first construct four production facilities. Decide what kind of production facilities you want to build. But ensure that you only produce goods that you'll be able to sell at a profit in other towns, because production costs are high and you rely on the profits you make from selling the goods.<n><n>Four production facilities provide jobs for 120 workers. Since each of these workers is one of a family of four, you must provide living quarters for 480 citizens, in other words, four residential areas.<n><n>As soon as your production facilities and residential areas are ready, you can try to bring settlers from other towns to your own town. Settlers usually wait for work in governor towns. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Increase your town's population to 480."
