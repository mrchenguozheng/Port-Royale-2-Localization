"0xf4b68a6b" = "おめでとうございます！ シナリオを 達成し、 オランダのために イングランドの町を いくつか占領しました。<n><n>フリープレイでも同じように 町を 占領できます。 ただし、 占領したい町の国が 軍事的に 弱っていること、 あなたが 仕える国も 軍事的に 弱っていること、 そして二国が 戦争中であることが 必要です。<n><n>補足： 総督代理のために 町を 占領すると、 通常は 自分の町を 建てられる土地が もらえます。 ただしこのシナリオではその機能は 無効に なっています。"
