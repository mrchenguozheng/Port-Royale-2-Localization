"0x0d23b494" = "町で 足りない物資に 注目してください。 たとえばこの町は ラム酒と 衣類を 生産するので、 砂糖と 綿花は 常に必要です。<n>ただし町には他にも不足している物資が あります。<n>他の町へ 行ってカルタヘナが 必要と する物資を 買い、 交易実績を 上げてください。"
