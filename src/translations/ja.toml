"0xfc692ef1" = "<n><n>However, if at least one ship in your convoy survives the battle, the captain survives also."
"0xfc71eb4b" = "What misfortune has befallen me. Since the outbreak of war with @n$FoeNation$, I have not been able to accumulate enough colonial goods for the transport convoys. Can you assist by providing me with a large shipment of @G$Goods$?"
"0xfc71eb4c" = "Since we went to war with @n$FoeNation$, their traders have been forbidden to deliver @G$Goods$ to the towns belonging to my nation. I am now faced with a significant shortage of goods. You have many ships and know the seas well. Could you not secure me a large shipment of @G$Goods$?"
