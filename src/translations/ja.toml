"0x2ae68b1b" = "It gives me great satisfaction to hear that you have put Blackbeard in his place. As a reward, I am making you the gift of a Spanish galleon. It is awaiting you in the harbor. <n><n>And, while I’m at it, I might as well give you @g$Reward$."
"0x2ae68b1c" = "I am once again very satisfied to hear about your renewed defeat of the contemptible Blackbeard. I must also pass on my wife’s very special regards. She wishes to make you a gift of her Spanish galleon, and I don’t mean our cook!<n><n>In addition, I am rewarding you with @g$Reward$."
