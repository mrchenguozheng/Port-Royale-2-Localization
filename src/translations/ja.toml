"0x0d4fbd34" = "ではサンタマルタと カルタヘナの事業を フル稼働させてください。<n>カルタヘナの織物工場には綿花を 絶やさないよう忘れずに。<n>交易を 続け、 生産した物資を 売ってください。<n>現金が @g$GoldGoal$ に達しだい、 このシナリオは 終了します。"
