"0xd9720472" = " @A$USER$, I've been left in the lurch here. But I urgently need to get to @T$TargetTown$. Can you bring me there? I will pay you @g$Reward$!"
"0xd9720473" = " @A$USER$, I'm looking for a ride to @T$TargetTown$. I would be most grateful if you would offer me a berth on one of your ships. I will pay you @g$Reward$."
