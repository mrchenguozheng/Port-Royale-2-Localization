"0x0d919a5a" = "%1,<n>you know quite well I'd tell you to go to hell under normal circumstances, but in dire times like these, I'd sell my soul to the devil himself.<n><n>So come on in, I have something to tell you."
"0x0d9c1799" = "Your task is to ensure that the town of @T$TargetTown$ declines in status to “Recession” by @D$EndDate$. You have two options here:<n><n>Either attack the town and loot all the goods to bring about the status “Recovery”. The town’s status will then continue to decline due to the scarcity of goods.<n><n>Alternatively, you can cut off the supply of goods to the town by intercepting trading convoys. Note:  If you only loot a convoy and do not capture it, your reputation with the nation in question will suffer to a much lesser extent."
"0x0d9c179a" = "Good! I am assigning you the mission of causing the town of @T$TargetTown$ to fall into a state of “Recession”. You have until @D$EndDate$.<n><n>To achieve your objective, you must intercept all traders visiting the town so that it receives no more goods and its status slowly starts to decline.<n><n>However, there is a way of making this happen faster. This involves attacking and looting the town. Your attack will cause the status to drop rapidly to “Recovery” and the resulting scarcity of goods in the town will then cause it to drop even further until the town is in “Recession”."
