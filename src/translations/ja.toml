"0xea43addd" = "This is a good opportunity for us. A town belonging to @n$TargetNation$ wishes to align itself with our nation because it appears to be continuously beset with various conflicts. I want you to support the town until such time as it decides to change its nationality."
"0xea43adde" = "A problem has arisen regarding a town belonging to @n$TargetNation$. A written agreement setting out the peaceful handover of the town to our nation was signed long ago. Regrettably, @n$TargetNation$ is no longer honoring the agreement. I want you to support the town until such time as the disputes have been resolved."
"0xea43addf" = "A town belonging to @n$TargetNation$ is in serious dispute with its viceroy. I know the reason why and I am now planning to support the town, so as to tempt it to side with us. You could help me do this."
