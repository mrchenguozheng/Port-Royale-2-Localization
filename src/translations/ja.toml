"0xcdf0b227" = "何人かの商人が 手を 組み、 我々の海域での保護強化を 求めています。 要求を 強めるため、 近いうちに ある町への供給を 止めることに したそうです。 私と 市民のために、 何とかしてもらえませんか？"
"0xcdf0b228" = "ある町では疫病が 流行したという噂が 広がり、 週の初めから 終わりまで商人が ほとんど来なくなりました。 物資を 供給して噂を 打ち消すのを 手伝ってもらえませんか？"
"0xcdf0b229" = "ここ数週間、 ある町に 疫病の脅威が 迫っています。 さらに悪いことに、 商人たちも その町を 避けるように なりました。 状況が 良くなるまで町を 支えてもらえませんか？"
"0xcdf0b22a" = "数日前、 ある町で 市民が 疫病で 亡くなりました。 隠そうとしましたが、 残念ながら噂は 広まってしまいました。 今では多くの商人が その町に 寄港しないと決めています。 あなたは 立派な交易船団を お持ちです。 しばらくのあいだ町に 物資を 供給してもらえませんか？"
