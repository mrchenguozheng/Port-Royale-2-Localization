"0x05478cea" = "娘から、 あなたが 来るともう聞いていました。 あの子は 時々とても衝動的なんですよ。 しかし娘の望みを 阻むわけにはいきませんし、 あなたこそ 彼女に ふさわしい男性だと本当に思っています。 ですからお尋ねします。 %1 を妻に 迎えますか？"
