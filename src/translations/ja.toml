"0xf52fee2f" = "海賊、 バッカニア、 敵国の軍事船団と 戦いましょう。<n><n>バッカニアとして 交易船団を 追う腕試しも。<n><n>伝説のスペイン宝船団を 探しに出ましょう。<n><n>16 種類の船を 指揮できます。"
"0xf52fee30" = "船長を 他の船長や 海賊との決闘で 導きましょう。<n><n>戦い・交易・政治にわたる 無数の任務を 果たしましょう。"
"0xf52fee31" = "4 か国の町を 訪ね、 それぞれ違う建物を 眺めましょう<n><n:10>さまざまな景観を 移動しながら、 豊かなグラフィックを 楽しめます。<n><n:10>お気に入りの国のために 町を 略奪し占領しましょう<n><n:10>自分の町を 建てましょう<n><n:10>他の商人から 事業を 買い、 物資の独占を 築きましょう<n><n:10><o:0xFFFFEB7D>… カリブ海を 丸ごと席巻しましょう！"
