"0x28812f6e" = "I hear that you want to put yourself to the test as commander of a sea battle. Well, I have a task for you that could benefit both of us.<n>Two abandoned ships are floating aimlessly at sea as we speak. I want you to get rid of these ships before they start to pose a threat to my traders.<n>Do you accept this mission?"
"0x28812f6f" = "Now for something rather more difficult. A little bird told me where a pirate convoy commanded by @P$PirateName$ is currently roaming the seas. The convoy consists of only one ship, so it shouldn't prove too difficult for you to destroy it.<n>Do you accept this mission?"
"0x28812f70" = "You have already destroyed a pirate convoy belonging to @P$PirateName$. However, there are usually several convoys in a pirate hideout, all commanded by @P$PirateName$. You can only eliminate the leader of a pirate gang by finding and destroying their hideout.<n>Another convoy commanded by @P$PirateName$ has now emerged. This convoy consists of two ships, and so you must be well prepared before you engage in combat.<n>Are you ready?"
"0x2883fdae" = "You can attack this pirate hideout from the sea with a convoy. First you must defeat all ships in the harbor. "
"0x289d1ced" = "1 日の消費量"
"0x28b1f98d" = "%1 %2 You also have a permit to erect buildings and establish businesses in %3 and you already own a warehouse in the town.<n><n>As you are young and inexperienced, you have only reached the rank of Ship's Boy. Therefore you cannot yet command further convoys or buy additional building permits in another town.<n><n>Your rank is determined by your total assets, which comprise cash and property and currently amount to around %4. You will reach the next rank as soon as your assets reach %5.<n><n><n>Good luck!"
"0x28c94158" = "船"
"0x28cc4ee4" = "The convoy cannot set sail because there are too many goods on board. Sell some of your goods or move them to your warehouse so you do not exceed the maximum loading capacity of the convoy."
