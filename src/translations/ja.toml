"0xfb425369" = "デザイン協力"
"0xfb4be839" = "Excellent! You destroyed all of the pirate convoys so that none of the pirates can escape. If you destroy all of a pirate gang's convoys before attacking their hideout, it will take longer for new pirate convoys to appear in the Caribbean.<n><n>Now attack the hideout the same way you would attack a town by selecting you convoy and then right-clicking on the pirate hideout.  If some pirate ships are anchored in the harbor, you must first attack these before you can win the harbor battle.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destroy Blackbeard’s pirate hideout."
