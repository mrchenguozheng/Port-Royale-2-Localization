"0x1c7e1413" = "Thank you!<n> Naturally, you will first need a permit in the town, but you are sure to receive one.<n>I will of course pay for all of your expenses as soon as the school is built. My wife's birthday is on @D$EndDate$, see to it that the foundation stone for the school is laid by then."
"0x1c7e1414" = "That's good. Start building the school by @D$EndDate$. I will then pay for your expenses.<n>Don’t forget that you will need a permit in @T$Town$ if you want to build a school.<n>Don't breathe a word about this mission to my sister."
"0x1c7e1415" = "Thank you! @T$Town$ will not find out about our accord. Begin construction by @D$EndDate$. I will then pay for your expenses.<n>Don’t forget that you will need a permit in @T$Town$ if you want to build a school."
"0x1c7e9deb" = "%1 ： 貸付金 %2 を返済しました。"
"0x1c83647f" = "武器と弾薬："
"0x1ca41002" = "シナリオ完了"
"0x1ca50773" = "Nice work! You now have an impressive convoy.<n><n>Your next task won't be an easy one, as it involves attacking and defeating an English military convoy. The Governor of the Turk Islands has provided you with another ship as backup. Locate it in the harbor of the Turk Islands and add it to your convoy.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destroy an English military convoy."
"0x1ce621bb" = "地元商人の住宅地区"
"0x1ce62aab" = "現在の任務"
"0x1ce81e5e" = "ゲームの種類"
"0x1cf07333" = "Well done, you reached your first objective within @I$Days$ days. Your next objective is to increase the number of citizens living in the town. To do this, establish five businesses, one of each kind that is permitted in the town.<n><n>Remember that only a small number of traders visit Tortuga, and you must ensure that the town has sufficient supplies, so that its status is high enough to allow you to take in new settlers. Also, don’t forget to ensure that there is enough living space for the citizens.<n><n>You have 60 days to reach this objective. The sooner you achieve it, the better.<n><n>Hint: Soldiers are part of a town’s population but they don’t count as citizens! You can only increase the number of citizens in a town by creating jobs.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Set up five different businesses in Tortuga and increase the number of inhabitants to 1,500 by @D$EndDate$. Don’t forget to provide sufficient living space! One residential area is required for each business."
"0x1d01f111" = "サウンド"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>The ship that sank here must have been under the command of a very experienced captain. The chest does not contain any gold, but you find a carefully kept diary belonging to the captain @L$RandLName$. As a result, the experience of the captain of convoy @C$Convoy$ increases by two points."
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>The treasure chest is empty, however, it served as a buoy for a rope. Not far below the surface, you discover a hideout containing cannons. Your crew haul as many of these cannons as possible on board."
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>A large number of barrels of rum are floating in the surrounding waters. Your men retrieve as many of them as your convoy can carry."
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Your convoy has come across a large wooden chest. It is immediately brought on board and opened. Some real treasure at last, thinks the captain as he catches a glimpse of the @g$Gold$."
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>An old and almost completely rotten wooden chest is floating in the water. Whatever it once contained, nothing remains now apart from a revolting smell. In spite of this, your crew's morale is lifted because the search for the treasure has finally come to an end."
"0x1d19d29c" = "%1 の建築許可"
"0x1d6d7bd9" = "そして港は厳重に防備されています。"
