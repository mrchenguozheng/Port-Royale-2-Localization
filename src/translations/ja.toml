"0xf64f1e5c" = "I was wondering if you might be able to help us in our war against @n$TargetNation$. I would like to send you into a particular area and task you with capturing or sinking ships there. "
"0xf651cc3f" = "Holland and England have made peace, so you can no longer capture any towns.<n><n>You got quite far in this scenario but you didn't have time to capture enough towns on behalf of Holland.<n><n>You can capture towns in the same way in free-play mode. However, you must first be sure that the nation whose towns you want to capture is militarily weak. In addition, the nation that wants to capture these towns must be militarily strong and the two nations must be at war with one another.<n><n>Note: You are usually awarded a plot of land on which you can establish your own towns whenever you capture towns for a viceroy. However, this feature is deactivated in this scenario."
"0xf65a5a04" = "You can now boost your reputation in %1 by attacking English ships and towns. This will not diminish your reputation in the other nations."
