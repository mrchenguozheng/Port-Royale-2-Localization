"0x0eb34b66" = "このシナリオでは、 事業の興し方と、 その際に 気を つけることを 学びます。 新しい労働者のための住宅地区も 建てます。<n><n>ポートロワイヤル2 では、 建築許可を 買った町ならどこでも 建てられます。 許可を 多く持つほど、 次の許可は 高くなります。 ゲームを 開始した町ではすでに許可を 1 枚持っているので、 すぐに建物を 建て始められます。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>サンタマルタに カカオ生産施設を 1 つと、 住宅地区を 1 つ建ててください。"
"0x0ede126a" = "これで 海戦の仕組みが 分かりました。 町全体を 攻撃して略奪したり、 他国のために 占領したりもできます。 ただしそのためには、 強力な船を そろえた大きな船団が 必要です。 ご想像のとおり、 都市を 攻撃すればその国での名声は 大きく損なわれ、 以後その国の軍事船団が あなたを 追ってきます。<n><n>別の方法として、 海賊の隠れ家を 攻撃することも できます。 隠れ家は 通常は 秘密の場所ですが、 ゲームが 進むうちに いずれ分かります。 分かれば、 町を 攻めるのと 同じように 攻撃して、 海賊一味を 丸ごと壊せます。<n><n>隠れ家周辺の防備の強さは、 その一味が どれだけ 長くのさばっていたか、 そして船団が どれだけ うまく交易船を 略奪したかで決まります。<n><n>このシナリオの最後の仕事は、 小さな海賊の根城を 襲うことです。 隠れ家の場所は @T$TOWN$ の総督に 聞いてください。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@P$PirateName$ の海賊の隠れ家を 破壊してください。"
