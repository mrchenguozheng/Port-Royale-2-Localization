"0xdb170d26" = "総督が 新しい任務を 出す前に、 船団を 「航海可能な状態」 にしておきましょう！<n>船団が 損傷しているなら、 造船所へ 行って 修理してください。"
"0xdb170d27" = "船団をより良く装備できるよう、 ちょうど資金が 届きました。<n>船団には十分に 武装した船 3 隻と、 満員の乗員が 必要です。<n>弾薬を 忘れず、 新しい船を 軍艦として 指定するのも 忘れないでください。 今すぐやりましょう。"
"0xdb170d28" = "Excellent!<n>Now visit the Governor and accomplish the mission he assigns to you."
