"0x21c2f2cf" = "<n><o:0xffC00000>任務未達成。 <o:0xff000000>"
"0x21cae149" = "Very good! Now you have to make your convoy more powerful so that you'll be able to take on several military convoys. You should have at least three ships in your convoy that are frigates or larger ships.<n><n>You can capture the ships or try to purchase them in the shipyards of the governor towns.<n><n>Make these ships escort ships and ensure that they are fully-armed and fully-manned with sailors.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arm your convoy so that it has at least three fully-armed and fully-manned escort ships that are frigates or larger ships. "
"0x21d142f5" = "Repair convoy in this town"
"0x21e727b4" = "I am certain that you have already heard of the pirate @P$PirateName$. He already has @I$NumConvoys$ convoys and we have not yet discovered his hideout. Fortunately, we know the whereabouts of one of his convoys. Perhaps he is still nearby. I want you to destroy this convoy. "
"0x21e727b5" = "We must act quickly, for I have just learned of the whereabouts of one of the convoys belonging to the pirate @P$PirateName$. Find and destroy this convoy."
"0x21e727b6" = "All pirates have their own hideout from which they dispatch convoys to capture booty. Meanwhile, the pirate @P$PirateName$ has amassed a fleet of @I$NumConvoys$ convoys. By chance, we have discovered the recent whereabouts of an important captain from this gang and his convoy. I want you to find and destroy this convoy."
