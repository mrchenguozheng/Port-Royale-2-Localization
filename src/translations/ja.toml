"0x07242fbe" = "労働者"
"0x07246168" = "修理"
"0x072a9579" = "I am most grateful to you for bringing me the imported goods, for we in the New World have not been supplied by my nation's transport convoys for many weeks now. As a reward, I am presenting you with two Dutch trading flute-ships. They are waiting for you in the harbor."
"0x0744a699" = "I cannot tell you how many more towns the treasure fleet will visit. All we can say for sure is that the fleet takes more gold on board with every town it visits. I don't care when you attack, because you can keep the gold. All I want you to do is ensure that the treasure fleet disappears. It was last in @T$StartTown$, and its next port of call is @T$DestTown$, where it will lie at anchor for about five days."
"0x0744a69a" = "So you must act quickly. It was last in @T$StartTown$, from there it set off for @T$DestTown$, where it will anchor for longer than usual. The longer you hold off your attack, the more gold it will have on board. You can keep the lot, but the treasure fleet must never reach Europe."
"0x0744a69b" = "That's agreed then, thank you. If my information is correct, the treasure fleet recently left @T$StartTown$ and is en route to @T$DestTown$. There it will anchor for longer than usual. Now make haste and intercept it!"
"0x0746253d" = "If you want as many traders as possible to visit your town, you should simply not supply your town with certain goods. You should ideally choose goods that are produced in nearby towns, because traders will take the length of the journey involved into consideration.<n><n>Traders who visit your town automatically buy goods that are in abundance and therefore have low prices in your town. You can also sell the goods you have produced to your town directly. As long as the goods are not more expensive than in other towns, they will be purchased regularly by traders.<n><n>The advantage of this is that there are always enough goods available for your citizens and you also don't have to worry about transporting the goods to other towns."
