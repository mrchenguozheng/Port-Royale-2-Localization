"0xca6f7276" = "海賊 %1 の隠れ家がついに分かったと聞きましたか？ %2 %3 はそれを壊す勇敢な英雄を探しています。 やってみませんか？"
"0xca6f7277" = "悪名高い海賊 %1 が根城にしている場所は、 もう謎ではありません。 %2 この一党を今すぐ叩き潰すべきです。 あなたこそ適任だと思います。"
"0xca6f7278" = "あなたはわが国でとても良い名声を得ています。 さらに名声を上げる方法を一つ知っています。<n><n>少し前に海賊 %1 の隠れ家が見つかりました。 %2<n><n>この一党という災いを我々から取り除いてくれるのは、 あなたかもしれません。"
