"0x080f2b29" = "<ts:20>物資について、 次のことを 知っておきましょう。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>物資には五つの種類が あります。 必需物資、 原材料、 加工品、 植民地物資、 輸入品です<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>各町は 5 種類の物資を 生産できます<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>町には二つの型が あります。 植民地の町と、 総督や 総督代理のいる町です<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>総督都市は 必需物資と 加工品を 生産します。 またヨーロッパから 輸入品の定期的な納品を 受けます。 ですから加工品と 輸入品を 探すなら、 これらの町が 最適です。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>総督都市は 加工品を 作るために 原材料を 必要と します。 また植民地物資も 受け入れます。 これは ヨーロッパからの輸送船団が 集めてくるものです。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>植民地の町は 必需物資、 原材料、 植民地物資を 生産します。 植民地物資は それぞれカリブ海の特定の地域でしか作れません。 たとえばコーヒーは カリブ海の南と 西でしか手に 入りません。<n><n>価格について、 次のことを 知っておきましょう。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>町である物資の需要が 高く供給が 少ないほど、 値段は 高くなります。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>ある国での名声が 良いほど、 その国の町で 物資を 安く買えます。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>物資は 生産されている町で 買うべきです。<n><n>金を 稼ぐ最速の方法：<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>植民地の町で 植民地物資と 原材料を 買う<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>それらを 総督都市で 売り、 そこで加工品と 輸入品を 買う。"
