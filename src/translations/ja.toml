"0x132e00ca" = "I'm delighted! From this day onwards, the hostilities between us are a thing of the past."
"0x13385f0f" = "Nice work! With your Letter of Marque, you are now officially in the service of Holland and involved in the war with England. This means that you can attack English trading ships without your reputation suffering in Holland, France or Spain.<n><n>Naturally, your reputation with England will be damaged and, from now on, whenever you are in English waters, you should be on the lookout for the military convoys that will be pursuing you!<n><n>The English towns are all located to the southeast of the Turk Islands. Sail in this direction with your convoy and search for suitable trading convoys to capture. Sell the loot and the smaller ships to increase your wealth.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Capture three English trading convoys: Board their ships and add them to your convoy. "
