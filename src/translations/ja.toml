"0xf4e195bf" = "Blackbeard has discovered that you are collaborating with the Governor of @T$TOWN$.  He has therefore begun to terrorize the traders who visit @T$TOWN$.  Within a few days, hardly any traders will dare to come to @T$TOWN$. <n><n>This is only a temporary tactic. Your task is to supply the town with goods until @D$EndDate$. The status of the town must not drop below \"flourishing economy\".<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Supply @T$TOWN$ with goods until @D$EndDate$. The status of the town must not drop below \"flourishing economy\"."
