"0xe84971d5" = "妻"
"0xe84c0654" = "I am faced with a small problem in @T$Town$. I promised my wife that I would see to it that a school was built there. Unfortunately, relations between myself and the master builder remain extremely hostile. He would never allow me to interfere in the affairs of his town. Could you not build the school for me?"
"0xe84c0655" = "I would like you to build a school in @T$Town$ in order to increase the wealth of the town. In fact, @T$Town$ means nothing to me, but my sister lives there and simply will not accept that there are better towns."
"0xe84c0656" = "The viceroy has instructed me to support the town of @T$Town$. I would therefore be happy to pay for a school in the town. However, the town council has rejected my offer, they don't want me interfering and would rather take the gold directly. Hence, I wanted to ask whether you could build the school."
