"0xcb6f7f0c" = "道具の納品"
"0xcb7ef0e8" = "交易成功 %1"
"0xcb853f07" = "Your captain has won his duel with the commander. Your sailors make their way to the treasure chamber and make off with %1.<n><n>Now choose what goods you want to loot from the town's warehouse."
"0xcb8dbdae" = "敵の銃士"
"0xcb8dd6d9" = "Our enemy, @n$HostileNation$, will stop at nothing. My wife has been abducted and certain conditions have been attached to her release. However, I happen to know where she is being held. Officially, I can do nothing, you understand, but you could attack the town and bring her back to me."
"0xcb8dd6da" = "I am glad to see you.<n>My wife recently received a groomed poodle from Paris. The wretched animal has driven me to distraction, but my wife is besotted with the dog.<n>Somebody learned of this, kidnapped the dog and handed it over to our enemies as a way of blackmailing us.<n><n>Can you rescue the poodle for me?"
"0xcb8dd6db" = "Some time ago, my youngest daughter ran off with some sort of passing adventurer, it was said at the time. I have now discovered that she is living in @T$TargetTown$ and that she is to marry the commander of the town. I know my daughter, she would never do such a thing of her own free will! I can hardly suggest to the viceroy that we have to attack a town to rescue my daughter? But how about you?"
"0xcb9b3a82" = "鼠の疫病が発生"
"0xcba7ebba" = "親方建築士"
"0xcbb16a2d" = "事業を持つと、 ここで生産に問題が起きていないか確認できます。"
"0xcbbb1ba9" = "生産ボーナス"
"0xcbc60959" = "続ける"
