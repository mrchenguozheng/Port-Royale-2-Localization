"0xe6490f96" = "時は 1676 年、 オランダの総督都市テルクス諸島に います。 オランダは 7 つの町を 有し、 そのうち 5 つが植民地の町、 1 つが総督都市、 1 つが総督代理都市です。<n><n>イングランドは 14 の町を 有し、 長くオランダと 戦争中で、 これから何か月も 続くでしょう。 この戦争が 続く限り、 オランダのために イングランド王室の町を 占領せねばなりません。<n><n>ただしイングランドの町を 攻める前に、 もっと資金と 船団の武装が 必要です。 最初の目標は、 イングランドの交易船団を 3 つ撃破し、 その船を 拿捕することです。<n><n>まずはテルクス諸島のオランダ総督から 私掠免許状を もらってください。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>テルクス諸島の総督を 訪ね、 イングランドに対する 私掠免許状を 取得してください。"
"0xe64f1385" = "上出来です！ 黒ひげの海賊船団を 1 つ撃破しました。 では @T$TOWN$ の総督のところへ 行き、 報酬を 受け取ってください。<n><n>彼には他にもあなたに 果たしてほしい任務が あります。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@T$TOWN$ の総督のために、 もう一つ任務を 果たしてください。"
"0xe65025c3" = "1 つの町で"
"0xe6510ae7" = "You must increase supplies of wheat, bricks, cotton, sugar and tobacco to @a$Amount$ each by @D$EndDate$."
"0xe65524e7" = "自分の町に、 すべての物資を @a$Amount$ ずつ供給してください。"
