"0xca4930db" = "ようこそ、 @A$USER$ 。 @G$Goods$ を大量に @T$Town$ へ届けねばならないのですが、 あいにく船長に逃げられてしまいました。 こうしませんか。 保証金として @g$PriceBuy$ をいただき、 @a$Amount$ を @T$Town$ へ運べば、 そこで @g$PriceSell$ を受け取れます。 いかがですか？"
"0xca4930dc" = "会えてうれしいです、 @A$USER$ 。 大きな交易船団をお持ちですよね。 実は @G$Goods$ を @A$Amount$ 輸送したいのです。<n>保証金 @g$PriceBuy$ をいただいて、 その品を @T$Town$ へ運ぶのはどうでしょう。 そこで @g$PriceSell$ で売れますよ。"
"0xca4930dd" = "困った立場でして。 @D$EndDate$ までに @G$Goods$ を @a$Amount$ @T$Town$ へ届けねばならないのに、 船団は別の品の輸送に出ています。 こう提案します。 保証金 @g$PriceBuy$ をいただいて品を届けてください。 そうすれば @g$PriceSell$ を受け取れます。 いかがですか？"
"0xca6a6869" = "セーブ"
