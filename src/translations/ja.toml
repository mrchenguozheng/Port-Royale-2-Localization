"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>Your captain is on the left. You control him as follows:<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Attack<f:fonts/Tiepolo_bold14x14aaFH.res><n>To attack, left-click on part of your opponent’s body. Click on different parts of his body to increase your chances of scoring a hit.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Defend<f:fonts/Tiepolo_bold14x14aaFH.res><n>As soon at the opponent prepares to attack, you must click the right mouse button at the right time to ward off the attack.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Special attacks<f:fonts/Tiepolo_bold14x14aaFH.res><n>Press the left mouse button just before your captain has returned to the starting position after an attack.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Endurance<f:fonts/Tiepolo_bold14x14aaFH.res><n>Each attack reduces your captain’s endurance, which recovers between attacks.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Reaction time<f:fonts/Tiepolo_bold14x14aaFH.res><n>The more duels you have won, the faster you must react."
