"0xe3de2672" = "You have now taken all of the governor's documents on board. Take the documents to @T$TOWN$ "
"0xe3e1d467" = "%1,<n><n>わが国でのあなたの名声が 足りず、 この町への貢献も 十分ではないので、 許可証は お売りできません。<n><n>わが国での名声を 高め、 この町と 交易して実績を 上げてから、 またお話ししましょう。"
