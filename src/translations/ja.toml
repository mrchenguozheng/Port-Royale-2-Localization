"0x2ee8bb8c" = "南カリブ海の総督都市カルタヘナに います。<n>町の様々な建物に 入って 行動できますが、 詳しくは後ほど 説明します。<n>まず画面上部を 見てください。 ボタンと 表示が 並んでいます。<n>では画面の一番左、 時計のボタンを クリックしてください。"
