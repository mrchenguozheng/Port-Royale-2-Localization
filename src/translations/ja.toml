"0xdad6e283" = "ボタン"
"0xdaeb0484" = "This time, you begin the scenario in Cartagena, a governor town in the middle of the Caribbean.<n>Your convoy, which consists of a sloop, is in the harbor.<n>First you must arm your convoy because this scenario will involve sea battles.<n>Go to the docks and open the Cargo menu."
"0xdaeb0485" = "As you can see, you have no cannons or ammunition on board your convoy. You are also in need of a crew.<n>Take on board the largest crew and as many cannons as you can, as well as 10x10 of each of the three types of ammunition for your cannons.<n>There may not be enough space in your convoy because cannons are heavy. If this is the case, you can sell some of the goods you have loaded."
"0xdaeb0486" = "Well done! Your convoy is now armed and ready for a small-scale battle.<n>As it happens, the Governor of Cartagena now has the perfect mission for you.<n>Click on the governor's building and accept his mission."
"0xdaeb0487" = "Governors often propose missions that will improve your reputation with their nation if they are successfully accomplished.<n>You are also entitled to ask governors for Letters of Marque or claim ransom for buccaneers whom you have captured.<n>Now use your convoy to find the ships the governor told you about."
"0xdaeb0488" = "Very good, you have located the convoy.<n>Your next step is to clear your ship for action and prepare to engage in combat. To do so, open the list of ships in your convoy and select your sloop. To declare it as a warship, press the button next to the cannon. You can then \"attack\" the convoy by right-clicking on it."
"0xdaeb0489" = "This is Port Royale's Sea Battle View.<n>It shows your ship and you can view the abandoned ships by moving the display window.<n>Now deactivate pause mode and practice navigating with the right mouse button. The Event window displays the direction of the wind and the ship during sea battles."
"0xdaeb048a" = "All ships engaged in the battle are displayed at the bottom of the screen. Here you can use which ammunition you want to use. Select the heavy cannonballs and sink one of the enemy ships.<n>You can fire with the left mouse button, but only when your ship is in a good firing position. Targets are then shown in red."
"0xdaeb048b" = "Good! Board the second ship.<n>To do so, click on the “Board” button on the bottom right of the ship display.<n>Then move towards the enemy ship and ram it. Take note: The F1 button is also active during sea battles."
"0xdaeb048c" = "Usually, the enemy has a crew and a battle ensues on board the ship between your crew and theirs.<n>When the battle is over, all of the ships that have been boarded fall to the victor.<n>Now add the enemy ship to your convoy and close the Transfer window ."
"0xdaeb048d" = "結構です！<n>では船団をカルタヘナへ戻してください。"
"0xdaeb9147" = "ティム・プレーガー"
"0xdaed79ac" = "A convoy belonging to the pirate %1 has attacked a trader from %2."
"0xdb0108d5" = "First, buy a new ship. Go to the shipyard and buy a ship with as many cannons as possible."
"0xdb0108d6" = "Select your convoy and then right-click on the harbor to add the new ship to the convoy."
"0xdb0108d7" = "All convoys consist of trading ships and escort ships.<n>If one ship in your convoy is to be involved in a battle, you must define it as a warship. <n>Open the list of ships in your convoy to display all your ships."
"0xdb0108d8" = "The Ships list displays all of the ships in your convoy. The warship status is displayed in the top right corner of a ship. If a cannon symbol is displayed, the ship is defined as a warship and it takes part in battles. Clicking on this corner changes the status directly.<n>But you should now click on your new ship and select it. "
"0xdb0108d9" = "The ship's technical details, such as its maximum load capacity, are displayed here as in the shipyard.<n>You can also see the daily cost of  maintaining the ship.<n>Now convert the ship into a warship by ticking the cannon symbol."
"0xdb0108da" = "Well done!<n>Cannons and sailors are always divided equally among the escort ships in a convoy.<n>Ensure that your escort ships are fully armed and have a full crew, and then pay a visit to the governor and accept the new mission he assigns to you."
"0xdb0108db" = "総督から与えられた任務を遂行してください。"
"0xdb0108dc" = "Select the ship that you want to control in the sea battle from among your escort ships.<n><n>You can select another escort ship at any stage by clicking on it in the list.<n><n>But beware: As soon as the battle starts, each ship can only be selected once!"
"0xdb0108dd" = "Well done! You have destroyed the pirate convoy.<n>Now return to the Governor of Cartagena because this is part of your mission.<n><n>Note that your missions are automatically recorded in your log. You can view the details of your mission there at any time if necessary."
"0xdb04023a" = "建材が足りません"
"0xdb0e3d33" = "あなたに次の任務があります。<n><n>"
