"0xdb10f490" = "寄付"
"0xdb126f49" = "あなたのポイント<n>"
"0xdb170d26" = "Before the Governor assigns a new mission to you, make sure that your convoy is \"shipshape\"!<n>If your convoy is damaged, go to the shipyard and have it repaired."
"0xdb170d27" = "You have just received some money to help you make sure your convoy is better equipped.<n>Your convoy should have three fully-armed ships and a full crew.<n>Don't forget the ammunition, and remember to define your new ships as warships. Do this now."
"0xdb170d28" = "Excellent!<n>Now visit the Governor and accomplish the mission he assigns to you."
"0xdb2ae26e" = "辞退"
"0xdb2d1177" = "You are now going to raid a pirate hideout.<n>First, ensure that your convoy is \"shipshape\"!<n>You could visit some more governor towns to see if a larger ship is available in one of the shipyards.<n>Along the way, pay a visit to the governor and obtain some information on the pirate hideout."
"0xdb2d1178" = "Port battles are similar to sea battles, except for the fact that the battle is between you and very solid cannon towers instead of other ships.<n>To win a port battle, you have to destroy all of the towers.<n>Sometimes there are armed ships in the harbor. In this case, you must fight the ships before you can attack the port itself."
"0xdb2d1179" = "このシナリオを終えるには、 船団とともにカルタヘナへ戻ってください。"
"0xdb4287ac" = "The Governor of Cartagena believes you have great potential and makes you a gift of @g$Gold$.<n><n>Hint:<n>Purchase goods that are in plentiful supply in a town (the quantity must not be shown in red). Then sell these goods in a town where they are in short supply to ensure that you get a better price for them.<n><n>You will soon increase your wealth in this way."
