"0x004b9030" = "You already know that only escort ships can take part in sea battles. The vanquished trading ships always fall to the victor, who can choose to loot or capture them.<n><n>You are not always the initiator of sea battles involving your convoys. If one of your convoys is attacked by pirates or by a military convoy from a nation in which your reputation is very low, you can engage in combat or your convoy can try to avoid the battle. If you want to avoid a battle, your escort ships must try to keep the enemy from getting too close to your trading ships.<n><n>If this fails, your escort ships will be captured and your trading ships  looted. If a convoy has no warships, all it can do in the case of an attack is try to avoid a battle. Advantage: The trading ships are only looted by the enemy and are not captured.<n><n>Now pay the governor a visit. He has a new mission for you. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplish the next mission assigned to you by the governor."
