"0x3353aa4c" = "Excellent! Now you should capture more English towns on Holland's behalf. But don't be slow because you can only capture towns while Holland and England are at war.<n><n>As usual, missions of this kind can only be assigned to you by the viceroy in Grand Bahama. Before you can be assigned any more missions to capture towns, you may have to do something to influence the military strengths and weaknesses of the two nations. You already know how to do this.<n><n>As backup, the Governor of the Turk Islands has provided you with three more carracks.<n><n>There are also many sailors and weapons available in the harbor.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplish two more missions to capture towns for the Dutch viceroy before the end of the war between Holland and England. You have until @D$EndDate$. The scenario will then be over."
