"0xcd01da76" = "スペインの総督都市 @T$TOWN$ で船員の階級から 始まり、 そこにはすでに倉庫が あります。 港には武装した船 2 隻の船団も ありますが、 船員は いません。<n><n>このシナリオの最初の目標は、 @T$TOWN$ の総督を 訪ねて任務を 受けることです。 彼は 悪名高い海賊エドワード・ティーチ （黒ひげとして 知られています） に手を 焼いていて、 あなたの助けを 求めています。<n><n>重要： このシナリオでは各国は 平和状態です。 つまり、 どの国の船団も 決して攻撃してはなりません。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@T$TOWN$ の総督を 訪ね、 彼が 与える任務を 受けてください。"
