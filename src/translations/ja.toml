"0xd99426c9" = "Would you like to chance a little card game with me?<n><n>Then choose your stake! I’ll match it, and the winner takes all."
"0xd99426ca" = "I don't even need to ask you if you'll join me in a game, you're as cleaned out as a freshly scrubbed deck! Come back when your pockets are full."
"0xd99426cb" = "Oh no, not you again! I can still remember our last game. Do you still not have enough? Well, I won't be playing with you for the time being."
"0xd99426cc" = "Everyone has been given 5 cards. I'll call %1 points.<n><n>If you want to play, you must call one point higher."
