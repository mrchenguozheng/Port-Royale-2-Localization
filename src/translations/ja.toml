"0xda93dbe1" = "上出来です！ 並大抵のことではありませんでした！ イングランドは 軍事船団を 多く失い、 もう町を 占領できます。 その功績に 感謝し、 テルクス諸島の総督は 大型帆船を さらに 4 隻与えます。<n><n>国の町を 占領できるのは 総督代理の命令が ある場合だけ です。 総督代理は、 自国が 軍事的に 強く、 敵国が 軍事的に 弱いときにしか町の占領を 命じません。<n><n>あいにくオランダは 町を 占領できるほど強くありません。 しかし、 これには手が あります。 グランドバハマのオランダ総督代理を 訪ね、 船団を 一隻引き渡してください。 新しい軍事船団を 編成し、 オランダの軍事力が 上がります。<n><n>総督代理に 船団を 引き渡すには、 船が ちょうど 5 隻、 大砲が 少なくとも 150 門必要です。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>総督代理が オランダの軍事力を 高めるのを 助けてください。 その後、 彼の代理として 町を 占領する任務を 受けてください。"
