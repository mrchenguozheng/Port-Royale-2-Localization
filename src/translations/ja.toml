"0x19f413a1" = "You'll have a lot more to do in this scenario than in the first. You'll learn how to trade successfully and make your first trading profits.<n><n>You'll also form a second convoy to allow you to transport more goods.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Read and follow the hints in the Event window."
"0x1a106105" = "船団は まだ海戦を 経験していません。"
"0x1a2ebe80" = "Unfortunately you have no suitable convoys left anchored in the harbor. The convoy must consist of exactly 5 ships and have 150 cannons on board. Come back when you have assembled such a convoy."
"0x1a3808bb" = "The trader is called @N$Name$ and his hometown @T$Town$. If you succeed in destroying his convoy by @D$EndDate$, I will reward you handsomely with goods."
"0x1a444b3b" = "I cannot task you with capturing a town belonging to another nation on my behalf because we are not at war at the present time. However, things may change very quickly. Come back to me if they do."
"0x1a444b3c" = "We are at war with %1 and you have ensured that %1 only has one town left. We cannot take this, and so I am unable to task you with capturing any town at present. <n><n>But do come back again when the situation changes."
"0x1a444b3d" = "I would gladly task you with capturing a town belonging to %1.  I have enough military convoys to protect any newly captured area.<n><n>However, %1 is still too strong for such an undertaking.<n><n>You could help to weaken %1 by destroying its military convoys.<n><n>Then return to me and I may have a mission for you."
"0x1a444b3e" = "I would gladly task you with capturing a town belonging to %1.  I have enough military convoys to protect any newly captured area.<n><n>However, %1 is still too strong for such an undertaking.<n><n>You could help to weaken %1 by destroying its military convoys.<n><n>Then return to me and I may have a mission for you.<n><n><n>You can check a nation’s strength under “Nations” in the Chronicle. "
