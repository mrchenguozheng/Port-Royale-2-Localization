"0xf2590753" = "感謝します。 近いうちに ヨーロッパから 輸入品が 入ってきそうに ありません。 現在 @n$HostileNation$ と戦争中なので、 敵の輸送船団から、 船を 拿捕も 撃沈も せずに物資を 奪う機会が あります。<n>香辛料・ワイン・道具を それぞれ @a$Amount$ ずつ調達し、 @D$EndDate$ までに市場の私の商人へ 届けてください。"
"0xf2590754" = "あなたの任務は、 @n$HostileNation$ の輸送船団を 攻撃して物資を 奪うことです。 船を 拿捕したり撃沈したりしてはなりません。 その後、 物資を 市場へ 届けてください。 期限は @D$EndDate$ です。"
"0xf2590755" = "よろしい。 @n$HostileNation$ の輸送船団を 探し、 積荷の輸入品を @a$Amount$ 奪ってください。 その後 @D$EndDate$ までに、 市場で 待つ商人へ 物資を 引き渡してください。 忠告です。 この地域は 今非常に 緊張しているので、 船から 物資を 奪うだけで、 拿捕も 撃沈も してはなりません！"
