"0x17081769" = "最大容量："
"0x170f1419" = "%1 %2 has broken through the town's harbor defenses and looted the town."
"0x171746e9" = "You have served my nation long and faithfully, now I must reward you for your loyalty. I shall give you a parcel of land on which you can establish your own town."
"0x17328849" = "不明"
"0x1733ed83" = "In this scenario, the Spanish viceroy grants you a plot of land on which you can build your own town. The objective of this scenario is ensure that your town's economy begins to flourish.<n:25>However, before you receive a plot of land, you must improve your reputation with Spain and make yourself popular with the Spanish viceroy by capturing towns on his behalf."
