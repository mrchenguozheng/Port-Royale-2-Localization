"0x04e5002a" = "トルトゥーガで 労働者のストライキが 扇動されました。 労働者が 全員仕事を 放棄してスト中です （それでも事業の費用はかかり続けます）。<n><n>あなたの任務は、 労働者が 普通なら生産する物資の在庫を 十分に 保ち、 ストライキを 失敗させて仕事に 戻らせることです。<n><n>注意： この町は 小麦・レンガ・綿花・砂糖・たばこを 生産します。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>町で 生産される物資の在庫を、 @D$EndDate$ までにそれぞれ @a$Amount$ にしてください。"
