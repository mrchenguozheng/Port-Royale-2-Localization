"0xf4b68a6b" = "Congratulations! You have successfully completed the scenario and have captured several English towns on behalf of Holland.<n><n>You can capture towns in the same way in free-play mode. But remember to ensure that the nation whose towns you want to capture must be militarily weak. In addition, the nation for which you want to capture towns must be militarily weak and the two nations in question must be at war.<n><n>Note: You are usually rewarded with a plot of land on which you can build your own towns when you capture towns for a viceroy. However, this feature is deactivated in this scenario."
