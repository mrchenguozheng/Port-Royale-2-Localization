"0x30bb44fc" = "Are you not the famous @A$USER$? Could you please help me? I am being pursued by a bounty hunter, one of my adversaries put him on my tail. "
"0x30bb44fd" = "Please pull up a stool, @A$USER$. My name is @N$OwnerName$ and I have an important matter to discuss with you. Where do I begin? Well, I had an argument with my wife; she accused me of being unfaithful to her, which of course is completely untrue. Anyway, she threw me out of the house, and that's not the worst of it: She has hired a bounty hunter, so I can no longer even enter the town. Can you help me?"
"0x30bb44fe" = "You look like someone who can run a tight ship.<n>I have to travel to @T$Town$ urgently, to deliver documents that incriminate one of the local traders there. Unfortunately, the trader has got wind of this and is now trying to get his hands on the documents. Couldn’t you find a way of getting me to @T$Town$?"
"0x30ee69e7" = "物資統計"
"0x30f0fea9" = "Search outside the town of @T$TOWN$ for clues as to the drunkards' whereabouts. Return the ship to the trader @N$OwnerName$ by @D$EndDate$."
"0x31054c65" = "scenario000 - @I$Idx$"
"0x31074c51" = "Have you heard that a plague has broken out in @T$Town$? This could certainly have been prevented if there had been a hospital in the town. Unfortunately, my master builder is a coward and is afraid to enter the town in order to commission the hospital. I therefore propose sending you. Do you accept? I am prepared to pay you @g$Reward$ for your efforts!"
