"0xcc0a1380" = "Find the pirate convoy commanded by @P$PirateName$, which is located approximately 1 day’s journey northeast of Providence. Destroy this convoy.<n>Then return to the Governor of Cartagena."
"0xcc1709af" = "%1 ： 敵対"
"0xcc2c64fb" = "You have been assigned the mission of tracking down and destroying one of Blackbeard's pirate convoys.<n><n>Blackbeard has a secret hideout where he keeps several convoys, each consisting of five fully-armed ships. This will be a difficult mission for the convoy you have at present.<n><n>Therefore, you should first increase your convoy's firepower. To get enough money to purchase a bigger ship, you can sell the goods from your warehouse in @T$TOWN$ at the best prices you can get. Follow the tips in the Event window, which tell you where you can sell the goods at a good price to the north and east of @T$TOWN$.<n><n>Don't spend too much time on this, as you still have to accomplish the governor's mission afterwards!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Sell the goods in your warehouse in @T$TOWN$ and increase your cash to @g$GoldGoal$."
