"0xdcba5843" = "I am glad to see you, @A$USER$, for I need your help. I once served under the pirate @P$PirateName$. However, I came to my senses and made a bargain with the Governor of @T$TargetTown$. Unfortunately, my former comrades have learned of this and have put a price on my head. Can you help me and take me to @T$TargetTown$?"
"0xdcba5844" = "I have heard that you can be trusted, @A$USER$. I am in the service of the Governor of @T$TargetTown$ and must see him urgently to give him some highly sensitive information. Unfortunately, certain parties are intent on preventing me from reaching @T$TargetTown$. For this reason, I am asking you whether you can grant me safe passage."
"0xdcba5845" = "Oh, I am plagued with misfortune. Several weeks ago, I came across a ship belonging to the notorious pirate @P$PirateName$. However, the captain of this ship must have been very inexperienced, as we managed to sink it almost without trying.<n>Unfortunately, this hapless captain turned out to be the beloved nephew of the pirate @P$PirateName$. Ever since he heard my name, he has been hunting me down. My crew have taken my ship and have fled in terror and now I am stranded here.<n>Can you help me to get to @T$TargetTown$, my home town?"
