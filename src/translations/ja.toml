"0xcdf0b227" = "A number of traders have joined forces and are demanding greater protection in our waters. To back up their demands, they have decided to stop supplying one of our towns soon. Can you intervene to help me and the citizens?"
"0xcdf0b228" = "One of our towns now hardly sees a trader from one end of the week to the next, because a rumor has spread that a plague has hit the town. Can you help me to quash the rumor by supplying the town with goods?"
"0xcdf0b229" = "The threat of a plague has loomed over one of our towns in recent weeks. To make matters worse, the traders are giving the town a wide berth now as well. Can you help support the town until the situation improves?"
"0xcdf0b22a" = "A citizen died of a plague in one of our towns a few days ago. We tried to cover it up, but I'm afraid word still got out. Now many traders have decided not to call at the town. You have a fine trading fleet. Couldn't you supply the town for the next while?"
