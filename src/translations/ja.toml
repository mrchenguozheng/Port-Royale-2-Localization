"0x24695110" = "Thank you. I am a trader from @T$Town$. As my pursuers do not know where I am staying, they will surely try to catch me in my home town. Start your search there and kill the bounty hunters. I must depart from here no later than @D$EndDate$. If you accomplish the mission before then, I will pay you @g$Reward$."
"0x24695111" = "I must return to @T$Town$ urgently, as I have some business to take care of there before I can make off for good. Unfortunately, the access routes to @T$Town$ are being watched by a bounty hunter, whom you must kill. I will reward you with @g$Reward$ if you accomplish the mission before @D$EndDate$."
"0x24695112" = "Thank you! I suspect that a bounty hunter is watching the entrance to the harbor of @T$Town$.<n>This is what we will do: I will spread a rumor that I am going aboard one of your ships and then you set sail for @T$Town$ and see what happens.<n>Let me know by @D$EndDate$ at the latest that the coast is clear and I will then pay you a reward of @g$Reward$."
"0x246aece6" = "%1: Famine"
"0x2478c95f" = "Congratulations! You have successfully completed this scenario and rid the Caribbean of the scourge of a notorious pirate.<n><n>Over the course of the game, pirate hideouts will emerge of their own accord. However, the number of pirate convoys depends on how successful they are. Note that pirates only want to loot trading convoys and are very wary of military convoys. For this reason, they avoid waters where too many military convoys are at large.<n><n>You can also hunt down pirates and smoke out their hideouts in free-play mode. "
"0x24802954" = "%1: Ship sunk"
"0x2487ab5c" = "残高"
"0x248f1e26" = "海賊 %1 の隠れ家"
"0x24901249" = "%1 of %2 sailors want to join you in your adventures."
"0x24a0f898" = "造船所"
"0x24b0fd83" = "機能"
"0x24c12812" = "Congratulations! You have been entrusted with a mission to capture towns!<n><n>Since towns may be very heavily defended, you should choose an English town with a minimum number of cannon towers in its harbor. The town of @T$SampleTown$ is a perfect target.<n><n>To attack a town, activate the Attack Towns option for your convoy. To do so, select your convoy and click on the Attack Mode button.<n><n>You can attack a town from the sea or from land. However, you should only risk an attack from land if your sailors outnumber the town's soldiers. You should also be able to arm half of your sailors with cutlasses and half with muskets in this case.<n><n>Note: If there is a military convoy in a town's harbor, you have to defeat this convoy before attacking the town itself.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplish your mission to capture towns."
"0x24e18ac4" = "<f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x24ec3366" = "Excellent! Now your convoy is armed and ready to track down one of Blackbeard's pirate convoys.<n><n>The Event window provides daily hints to help you discover the location of the pirate convoy, provided that the location is at sea. Finding pirates can be difficult because they always return to their hideout after a successful raid on a trading ship.<n><n>Remember that a pirate convoy can have up to five warships. Reinforce your convoy if you don't think it is powerful enough. You already know how to get your hands on some gold.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplish the mission assigned to you by the Governor of @T$TOWN$."
"0x250c7a12" = "Deliver @a$Amount$ by @D$Date$. You can hand over the goods at the market and you shall receive an immediate payment of @g$GoldPerBarrel$ for each <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> of @G$Goods$."
"0x250c7a13" = "I am delighted. Please deliver @a$Amount$ to the market. There, you shall receive your payment of  @g$GoldPerBarrel$ for each <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> until @D$Date$."
"0x250c7a14" = "Please meet my emissary at the market. Hand over @a$Amount$ of @G$Goods$ by @D$Date$, he will offer you good price."
"0x2540ea42" = "Additional text (chronicler)"
"0x2546beb9" = "So, @N$OwnerName$ sent you to see me? Yes, I do know this old captain, he could certainly teach your crew a thing or two. Why should I help you though? But I don't want to be difficult, I appreciate you must have spent some time tracking me down. If you do a small favor for me, I'll tell you where the captain has retired."
"0x2546beba" = "I don't know any @N$OwnerName$, but I certainly do know where @N$TeacherName$ is. I suppose I could tell you, if I was so inclined. How about you scratch my back and I'll scratch yours? "
"0x2546bebb" = "I don't care if it was @N$OwnerName$ who sent you or the hunchbacked Grand Vizier of Taipei! I have a problem. And, until it is solved, I am not interested in hearing about anything else. I have a suggestion: How about you find me a chest, and I’ll tell you where this crazy old @N$TeacherName$ is hiding."
