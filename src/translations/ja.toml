"0x03036377" = "Captain %1 assembles a new convoy.<n>The  convoy is seaworthy and waiting in the harbor.<n>The daily cost of the captain and basic crew is %2."
"0x030bb0b2" = "As you know, we are at war with @n$HostileNation$.<n><n>This would be a good time to fill our warehouses with goods that @n$HostileNation$ has in plentiful supply.<n><n>I want you to capture a substantial quantity of a particular good for me.  "
"0x030bb0b4" = "As we are at war with @n$HostileNation$, I have been ordered by the viceroy to see to it that our enemies suffer a goods shortage.<n><n>I therefore have a looting mission for you. Do you accept?"
