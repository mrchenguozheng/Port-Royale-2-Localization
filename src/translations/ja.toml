"0xda93dbe1" = "Very good! That was no simple feat! England has now lost so many military convoys that its towns can be captured. In grateful recognition of your service, the Governor of the Turk Islands provides you with four more carracks.<n><n>You can only capture a nation's towns by order of a viceroy. A viceroy will only instruct you to capture a town if his own nation is militarily strong and the enemy nation is militarily weak.<n><n>Unfortunately, Holland is not strong enough to be able to capture a town. However, you can do something about this: Pay a visit to the Dutch viceroy in Grand Bahama and hand over one of your convoys to him. He will then assemble a new military convoy, which will increase Holland's military strength.<n><n>If you want to hand over a convoy to a viceroy, the convoy in question must have exactly five ships and at least 150 cannons.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Help the viceroy to increase Holland's military strength. Then accept a mission to capture towns on his behalf."
"0xdab4fea7" = "住宅"
