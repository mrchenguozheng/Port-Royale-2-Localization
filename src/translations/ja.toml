"0x0420c2a2" = "<ts:20>取引ウィンドウでの物資の買い方・売り方は もうご存じでしょう。 もう少しヒントを 挙げます。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>矢印に 表示される価格は、 単位の大きさによって 変わります<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>1 個を 10 回売買しても、 10 個を 1 回売買しても、 合計価格は 同じです。<n><n><g:INTEXT_AUSRUF_800x600.screen>物資が なくても価格は 常に表示されます。 これは 設定した単位の大きさにかかわらず、 1 単位あたりの価格です。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>物資の記号を クリックしても取引できます。 そのときスクロールバーの付いた小さな窓が 出て、 売買する数量を 指定できます。 単価と 合計価格が すぐに表示されます。"
"0x0424bb9a" = "年代記"
"0x0436c531" = "とても特別な船を 見つけました！<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>蒸気機関付き帆船<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>こんな船は 生涯見たことが ありません！ 二本のマストの帆だけ でなく、 蒸気で 二つの外輪を 回す奇妙な仕組みでも 進むようです。 どうやら風が まったくなくても進み続けられるらしいのです。"
"0x044bc6d2" = "船長は %1 との剣闘に 勝利しました。 部下たちが 海賊の宝を 探し、 %2 を見つけます。<n><n>あなたは 隠れ家を 破壊し、 海賊 %3 の支配に 終止符を 打ちました。"
"0x044bc6d3" = "船長は %1 との剣闘に 勝ちました。 部下たちが 海賊の宝を 探し、 %2 を見つけます。 隠れ家を 破壊し、 それが もたらす危険を うまく取り除きましたが、 どうやらすべての船を 壊したわけではないようです。 残った船は 新しい隠れ家を 探すかもしれません。"
