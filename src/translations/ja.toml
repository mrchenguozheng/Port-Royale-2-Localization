"0xd4cd0f3d" = "Henry Avery is a prime example of the successful pirate. He captured the richest ships of his time, managed to elude the authorities and live long enough to enjoy his wealth.<n><n>Avery's early years are shrouded in mystery. However, we do know that in June 1694 he was a mate on a privateer named Charles, which had been given permission by the Spanish to capture ships belonging to the French colony of Martinique in the West Indies. One day, he led a mutiny and seized control of the ship, whereupon most of the crew sided with him. The ship, a fast privateer with 46 cannons and ideally suited to the role of pirate ship, was renamed Fancy. In 1695, he succeeded in carrying out his greatest feat: The looting of the Indian treasure fleet. As part of an alliance with other pirates, he attacked a heavily armed Indian treasure fleet and managed to capture two ships. The ships belonged to the Grand Mogul himself and were loaded with unimaginable treasures. <n><n>After bribing the governor of the Bahamas to offer the pirates protection, Avery paid off the crew, who then scattered to the four corners of the earth. Some of them were captured in England but Avery sailed to Ireland, where he disappeared without trace. We can only assume that he continued to enjoy his wealth in hiding."
"0xd4cd0f3e" = "One of the most popular pirates of all time was Edward Teach (died 1718), alias Blackbeard, whose hallmark, as his name implies, was his fearsome black plaited beard. With a crew of 300 men, he sailed the high seas in his ship, Queen Anne’s Revenge, a converted Dutch trading ship, and had no fear of taking on the warships of the Royal Navy.<n><n>Over a period of 18 months, Teach, who was born in Bristol, wrought havoc, mainly in the northern part of the West Indies and along the coast of North America. He was always able to find refuge in the Bahamas and in poverty-stricken North Carolina.<n><n>Another reason why Blackbeard was so famous was that he fitted the stereotype of a terrifying, hot-blooded and temperamental buccaneer: He is alleged to have maimed his gunner Israel Hands by shooting him twice, for no reason other than to remind the rest of the crew who was in charge.<n><n>His final hour only arrived in 1718 when the pirate hunter Robert Maynard tracked down his sloop. Despite being roaring drunk, Teach fought like a demon and was only defeated after a bitter struggle. He was killed in the battle and most of the surviving members of his crew were hanged."
"0xd4cd0f3f" = "Those who yearned to add to their existing wealth in the early years of the Age of Discovery found that the sugar plantations that had been developed since the early 16th century, mainly in the Caribbean, offered excellent investment opportunities.<n><n>These investments returned an average profit of ten percent and in the best cases (such as on Barbados around 1650) as much as 50 percent! Naturally, these plantations required huge numbers of workers and so hundreds of thousands of slaves were shipped there from Africa. This was because the white man had by now almost completely exterminated the Native American population in many places. <n><n>The Europeans themselves could not endure the climate and, quite apart from that, they were far too dignified to engage in this sort of donkey work. Even the plantation owners preferred to live in London or Madrid and let a couple of their henchmen organize the work in the colonies. By the 18th century, the black proportion of the population of some islands had reached 90 percent!"
"0xd4cd0f40" = "The trade in “black gold” had already begun in the early 16th century. The slave traders’ preferred source of “goods” was the coast of West Africa that stretched between the Senegal river and what is today known as Cameroon. Not only was this area ideally situated from a transport point of view, it also possessed a stable economic and sociopolitical infrastructure. This meant that the sailors did not have to go hunting for slaves themselves, but could purchase their victims from the local chieftains or from other slave traders.<n><n>Young men between the ages of 15 and 35 were particularly sought after because they were destined primarily for hard labor on the plantations. Approximately one in every five slaves didn’t even survive the crossing, which could last for up to six weeks. Some died as a result of the barbaric treatment meted out by their masters, while others perished due to accidents at sea. Taking this high mortality rate into account, the slave traders sought to make each voyage as profitable as possible by cramming as many slaves as they could onto their ships. For weeks on end, these wretched creatures lay side by side like sardines in a tin, chained to one another, in the dark and with barely enough air to breathe.<n><n>Under these conditions, it is almost incredible that any of them survived these journeys!  "
"0xd4cd0f41" = "Although there were no white slaves in North and Central America, there were plenty of Europeans who found themselves working under conditions that differed very little from those of the slaves.<n><n>Many young men (predominantly from the uneducated lower classes) wanted to emigrate but did not have the money to pay for the crossing. They therefore borrowed the money to pay for their passage, on the understanding that they would then settle the debt by working for a certain period on a sugar plantation (or somewhere similar). <n><n>However, what seemed a perfectly logical arrangement also had a catch: Many plantation owners tried to work these contract workers as hard as they possibly could during their period of employment. Added to this was the Caribbean climate that most Europeans found so hard to endure.<n><n>This system of “indentured labor” was also frequently used for convicts who had been expelled from their native countries. The British used this method later on, most notably against the Indians, whom they forced to work in the African colonies."
"0xd4cd0f42" = "As the American colonies flourished, so too did the trade across the Atlantic Ocean. Great Britain, the most powerful maritime nation since the time of Queen Elizabeth, had a keen interest in controlling the movement of goods, thereby allowing the domestic economy to share in the trading profits.<n><n>Under the Lord Protector, Oliver Cromwell, the “First Navigation Act” of 1651 decreed that only English ships could be used to transport goods from the colonies to Europe. This measure was aimed principally at the emerging power of Holland and benefited the domestic trading fleet.<n><n>In 1663, the provisions of this act were made even more stringent: Colonial ships wishing to transport goods to Europe had to call at English ports and pay a toll there. However, this attempt to control the trade between the colonies soon ran aground. As the British army could scarcely be expected to watch the entire coastline, the result was a flourishing contraband trade. <n><n>It was precisely this ongoing conflict with the mother country regarding the conditions governing the exporting and importing of goods that, particularly in the North American colonies, resulted in the formation of a separate identity among the settlers there and was later to become a significant motivation behind the independence movement."
"0xd4cd0f43" = "The beginning of the colonial age brought with it numerous health problems, hitherto largely unknown on the much shorter journeys in the Mediterranean or along the coast. A crossing to the colonies in the Caribbean and North America took from one to two months, or even longer if the ship encountered storms or periods where there was no wind. The difficulties to be overcome were therefore hardly surprising: The stench of filthy clothing and poor personal hygiene, contaminated and rotten food, a lack of clean water, rats on board as well as the psychological strain caused by monotony and cabin fever. The terrible specter of scurvy hung over every seaman: This disease, caused by a lack of vitamins, manifested itself in the loss of hair and teeth and cost many sailors their lives. It was the circumnavigator of the globe, James Cook (1728-1779), who first succeeded in treating this disease. Not only did he insist that the ship be kept clean, he also provided his crew with sauerkraut and fresh fruit. Anyone going ashore also had to contend with tropical diseases such as blackwater fever, one of the most dangerous manifestations of malaria: This infection, whose symptoms include a quickening of the pulse, fever, shivering and dark-colored urine, was almost always fatal."
"0xd4cd0f44" = "There are interesting anecdotes behind the many names that the seafarers and cartographers had to come up with for the new swathes of land, rivers and settlements. Even the first name given by the European explorers of the Age of Discovery in America tells its own story. Christopher Columbus named the island on which he landed on October 12th 1492 Salvador (“Savior“). This was to give thanks to the Lord for protecting the convoy from disease and storms during the outward journey and above all, for preventing a mutiny that threatened to break out literally at the last minute before land was sighted.<n><n>In the times that followed, the Spanish Conquistadors mostly chose names with religious connotations, for example “Nombre de Dios” (“The Name of God“) or “Trinidad” (“Trinity”). In other cases, people took inspiration from the date or from their observations of the landscape. For example, Portuguese sailors named a bay on the Brazilian coast that they discovered on New Year’s Day 1502 “January River” (Rio de Janeiro), and the name of the city of Montevideo refers to Magellan’s alleged exclamation on seeing the coastline for the first time: “Monte vido eu!” (“I see a mountain!”).<n><n>It was also a popular custom for explorers to name swathes of land and towns after their rulers, their mother country or the town from which they came. Not only did this communicate to the outside world a clear statement of tenure, it also created a connection to one’s home country even in these far-flung lands.<n><n>If all else failed, one could always fall back on the names from the native Indian languages (although, in most cases, this did not deter the colonizers from subsequently chasing away or exterminating the natives themselves).<n><n>To this day, the myth persists that, on being asked by James Cook what that strange marsupial was called, an Australian Aborigine replied “kangooroo” or “ganguru”, which allegedly only meant “What are you talking about?”. Even if this is a myth, these kinds of amusing misunderstandings must certainly have taken place. <n><n>One would probably be astonished at how many names of towns, mountains and rivers simply mean “good morning!”, “I beg your pardon?” or “leave me in peace!” ..."
"0xd4cd0f45" = "With the emergence of a Spanish empire stretching across the globe, it became necessary to establish colonial authorities with sufficient powers to deal with day-to-day administrative matters as well as any crises that might suddenly arise. For this purpose, the title of viceroy was conferred on the most important governors in the colonies.<n><n>At the height of the world empire, there were two such dignitaries, in New Spain (Mexico) and in Peru. The viceroyalties of New Granada and Rio de la Plata were added during the 18th century.<n><n> The duties of a viceroy (also known as a virrey), which he performed together (and often in conflict) with an administrative council known as the Audiencia, included the normal tasks of a government official: Raising and collecting taxes, ensuring that the population abided by the law, organizing the colony’s defenses and so on. He was also responsible for protecting the Native American population and for the appointment of lesser ecclesiastical and secular dignitaries.<n><n>Due to the enormous economic and political importance of its overseas possessions, the Crown always kept a watchful eye on the activities of its viceroys. They were forbidden from engaging in any extra commercial activities that would earn them an additional income. Quite apart from this, rivalry between the virreys only resulted in the mutual restriction of their power."
"0xd4cd0f46" = "It is already a well known fact that the European conquerors always heeded the call of silver and gold. However, of almost greater value were spices. It is difficult to imagine how dull the European diet of the Middle Ages must have been, if one thinks of the dangers people were prepared to face in order to obtain a little pepper or nutmeg.<n><n>In this regard, the discovery of America proved to be extremely disappointing at first. People noted with interest the exotic animals that Christopher Columbus brought home with him, rejoiced at the expansion of their country’s possessions and at the many souls that they imagined would be saved by the spread of Christianity there. However, the mountains of gold proved rather more elusive than had been promised. These voyages only became profitable ten to twenty years later, when a veritable flood of American silver started to arrive in Europe. <n><n>On one of these voyages, Columbus brought back a treasure more precious than all the gold and silver in the entire world: On the 4th of November 1492, the natives presented him with what he described as an apple that tasted of chestnuts. At that moment, he became the first European to eat a potato! The Indian word for this plant was “batate” and it survives to this day in the English language as “potato”.<n><n>Many other things that we take for granted today were first brought to Europe by Columbus and his successors: Tobacco, tomatoes, corn and the hammock. Or as the Native Americans would say: “hamaka” (from which the English word is derived)."
"0xd4cd0fae" = "From the moment it was announced, the discovery of the New World fired the imagination of the people of Europe. What sort of creatures might these unexplored territories contain? The most incredible rumors circulated: One island was said to be teeming with cannibals, the next with headless creatures whose faces were set into their stomachs.<n><n>The South American landscape of Patagonia translates roughly as “land of the big-footed ones” while the Amazon owes its name to a horde of female warriors who are alleged to have reminded the explorers of similar female warriors from Greek mythology.<n><n>While there was a factual background to some of these rumors, others were based on misunderstandings and misinterpretations or on stories that the Native Americans themselves had simply picked up somewhere.<n><n>However, many of these rumors were simply the product of people’s vivid imaginations and, more often than not, people only believed them because they wanted to. This would explain why entire generations of conquistadors searched for the legendary Fountain of Youth, the Garden of Eden and Eldorado, the city of gold. They were encouraged in their erroneous beliefs by the Native Americans, who constantly assured them that they had heard of one place or another, but who simply wished to buy time so they could entice these greedy white men deep inland and cut them off from their ships."
"0xd4cd0faf" = "One of the most dazzling figures in a list of explorers and conquerors that included many other colorful characters was the English writer and adventurer Sir Walter Raleigh (approx. 1554 – 1618). He first came to prominence in 1580 when he defeated an uprising by Irish rebels opposed to the English occupation.<n><n>He became a favorite of Queen Elizabeth I and used his influence to finance an expedition to find the legendary city of Eldorado in South America. Despite the total failure of several expeditions to find anything of value, he managed to retain the support of his financial backers in London by using his unique powers of persuasion. He gave them to believe that the final prize always lay just beyond the next estuary and that he could not possibly give up now.<n><n>Nevertheless, his credit eventually came to an end. To often, people had listened to his lofty promises only to find out later on that they were nothing but hot air. Raleigh finally fell from grace with Elizabeth. Her successor, James I, saw this hot-blooded adventurer as a threat to his more moderate foreign policy and had him arrested on very weak grounds and sentenced to death as soon as he came to power. His sentence was commuted (mind you, it was not lifted!) and Raleigh was imprisoned in the Tower of London.<n><n>Years later, when the state of the country’s finances persuaded the King that it was necessary, he gave Sir Walter Raleigh permission to lead another expedition to Guyana. This was an absurd situation: giving a man, who was himself sentenced to death, the authority over the life and death of others and sending him off in search of gold! However, this contradiction resolved itself relatively soon afterwards, for Raleigh, by now wracked with fever, lived to see his final expedition end in failure.<n><n>On his return to England, the furious King decided that Raleigh’s stay of execution decreed in 1603 should now come to an end. Sir Walter Raleigh was executed shortly afterwards.  "
"0xd4cd0fb0" = "The first encounters between the native inhabitants of the New World and the white seafarers generally passed off peacefully. In many places, the Europeans were greeted as gods. Here and there, this impression was based on old myths, but in most cases, the Native Americans were simply impressed by the tall blonde strangers that arrived in shimmering armor on their “water houses” (ships).<n><n>Columbus, Cortez and all the other explorers were only too delighted to perpetuate this illusion, but the Native Americans were confronted with the brutal reality soon enough: Driven by their insatiable lust for gold, the “Spanish disease” as the Native Americans called it, the Spaniards abused, enslaved and massacred entire populations. The sight of horses, hitherto unknown in America, and the sound of the canons caused utter panic and those that survived the massacre soon succumbed to smallpox, influenza or another imported disease.<n><n>Famous intellectuals such as Gonzolo Oviedo or Juan de Sepulveda tried to justify the crimes committed by the Europeans by using blood-curdling racist arguments that portrayed the native American race as being base, ignorant and inferior.<n><n>The same men who had scientists and witches burnt at the stake because of their beliefs, were well versed in the art of creating shocking accounts of the “bestial customs” of the Native Americans: Although the practices of idolatry, sacrificing humans and cannibalism were by no means imaginary, they were used henceforth by the white man as a blanket justification for imposing the most brutal sanctions of every kind on the Native Americans."
"0xd4cd0fb1" = "As is generally known, the early phase of the colonization of America was undertaken by Spain and Portugal. They were later joined by Holland and, most importantly, by England and France. What is rather less well known is that numerous Spanish expeditions would never have been undertaken had it not been for their powerful German financial backers.<n><n>By the year 1500, Upper Swabia and Augsburg in particular had developed into one of the most important centers of trade and finance in Europe. From here, the merchant families of Fugger and Welser exerted a powerful influence over world politics. For example, it was their extensive financial support that helped King Charles of Spain become Emperor of Germany in 1519. King Henry VIII of England and many of the Popes were happy to count Jakob Fugger the “Wealthy” among their friends.<n><n>Naturally, these astute traders had their own ulterior motives in bestowing this kind of support. In return, they expected to be assigned privileges or permission to participate in the royal mining of silver. The Welsers even managed to temporarily acquire part of the northern coast of Venezuela, where they founded towns such as “New Augsburg” and from where they sent several expeditions on (mostly fruitless) searches into the heartland for treasure."
"0xd4cd0fb2" = "By conquering half of the globe, the Spanish Crown found itself able to avail of unique opportunities. Over a period of several centuries, up until the demise of the great American cultures of the Incas, Mayas and Aztecs and the discovery of huge silver deposits in Peru and Mexico by the latest, Spain’s position appeared to be unassailable. It seems almost absurd that it was precisely this immense wealth that precipitated this world power’s decline.<n><n>A large part of the treasures sent by ship back to Spain went directly into the pockets of those traders north of the Pyrenees who had financed the voyages in the first place. However, the remainder was still sufficient to drive up price levels on the Iberian peninsula. People there began living beyond their means: In an age where the ability to hold court on a grand scale was considered more important than balancing the state budget, people payed little attention to trivial financial concerns.<n><n>Goods were imported in ever increasing quantities aboard foreign ships because people had become far too refined to produce them at home. Even the equipment and provisions for the expeditions to America were seldom provided by the domestic traders. People remarked with pride: All of Europe is at Spain’s command.<n><n>However, the flow of silver had to run dry eventually, and the rude awakening that followed would resemble a hangover after a long night’s drunken carousing: The Dutch and the British were attempting to drive Spain from the high seas. Numerous religious wars against the protestant “heretics” and against the Turks had devoured enormous sums of money and the vast empire, on which the sun never set, had developed into an ungovernable colossus.<n><n> The crisis was apparent to all in the year 1557, when the new Spanish ruler, Philip II, was forced to declare state bankruptcy for the first time. The great empire, which had held greater treasures than any empire that had gone before, was broke."
"0xd4cd0fb3" = "Why is it that the language spoken in Brazil is Portuguese, when almost everywhere else in South America, it is Spanish?<n><n>Well, both the Spaniards and the Portuguese, who had discovered the sea route to India along the African coast, recognized early on that their future lay across the oceans. Each jealously watched the other to make sure that, in their hunt for goods, subjects and land, they did not encroach on each other’s territory.<n><n>As there was no such thing as international law at that time, in cases of conflict, they turned to the Pope, who was the only person to whose authority both nations were prepared to submit. For its part, the Catholic Church had an interest in ensuring that the Spaniards and Portuguese zealously pursued the Christianization of “heathens” in the unknown lands instead of wasting their energies making life difficult for one another.<n><n>Agreement was therefore reached during joint negotiations in Tordesillas (1494) and Saragossa (1529) that the newly discovered territories to the west of a particular line of longitude should belong to Spain and all others to Portugal. This line of longitude cut across what was at that time undiscovered South America so that its eastern side, part of what is now Brazil, fell to Portugal."
"0xd4cd0fb4" = "It was probably the Roman writer Polybius who first mentioned the word “pirate” (peirato) at around 140 BC. Since then, many different words have been used to refer to these fearful seafaring villains: Corsairs, freebooters, buccaneers, filibusters ... The men who surrounded Klaus Störtebeker were known as “The Vitalian Brotherhood” and Bartholomew Roberts gave himself and his band of murderous thugs the rather innocuous title “Gentlemen of Fortune”. Ultimately, however, it made little difference to the trader who it was who emerged out of the void to attack his ship. <n><n>Buccaneers have been a scourge to mankind down through the ages in every corner of the world. In ancient times, the Cicilian pirates spread such terror across the entire Mediterranean that the Roman Empire was forced to mount regular campaigns against them. Hidden islands and jagged coastlines located near to frequently-traveled trade routes provided the ideal locations for pirate activity: Those areas where reefs, currents and bad weather conditions made easy targets of the cumbersome trading ships provided a refuge to which one could quickly retreat after the outrage had been committed. The coast of Asia Minor was as feared in ancient times as the Caribbean was during the Age of Discovery, while the pirates of Southeast Asia assumed an almost mythical status.<n><n>According to the origins of the word, a “buccaneer” was actually a seaman who put to sea as a private individual, not as a sailor of the navy, in search of booty and who was therefore considered to be engaged in piracy. <n><n>However, the issuing of Letters of Marque gave some of the Caribbean buccaneers a semblance of legality. These documents were issued by English, French or Dutch governors and their purpose was to direct the scourge of piracy at the opposing powers.<n><n> The ease with which Letters of Marque could be obtained depended on the particular governor. One governor would consider it dishonorable to enter into a pact with pirates. Others were rather less scrupulous or may simply have been corrupt or cowardly."
"0xd4cd0fb5" = "The “seven seas” are actually only three (namely, the three oceans): The North and South Pacific, the North and South Atlantic, the Arctic and Antarctic Oceans and the Indian Ocean.<n><n> The Pacific Ocean owes its name to the first circumnavigation of the globe by Fernando Magellan, who had the good fortune to encounter favorable weather during the many hungry weeks it took him to cross this vast ocean.<n><n>And another thing: The Caribbean derives its name from the “Karibe” (or “Karaibe”), the peoples of an Indian language group, whose area of settlement stretched from the Antilles along the northern coast of South America."
"0xd4cd0fb6" = "The Bermuda Islands are named after the Spanish explorer Juan Bermúdez who discovered them in 1503. The infamous area known to all seafarers as the “Bermuda Triangle”, in which the risk of mysterious shipping accidents is said to be very high, covers an area of the sea between the Bermuda Islands, Puerto Rico and Fort Lauderdale (Florida).<n><n>Some people maintain that the strange series of inexplicable events started with the voyage of Christopher Columbus: The seafarer from Genoa in the service of Spain found himself with his three ships on September 14th 1492 in this very area, when his compass needle began to spin wildly. This was caused by the difference between the geographic north pole and the magnetic north pole. The next day, an enormous flame appeared in the sky (possibly a meteor).<n><n>However, the nickname “Bermuda Triangle” only emerged after the Second World War, following a series of aircraft accidents that drew the public’s attention to this area in the southwest of the North Atlantic.<n><n>Followers of mysterious events point to more than 200 alleged unexplained accidents, although they interpret the borders somewhat generously. Most of these events, a large number of which did not even occur in the area, have a perfectly logical explanation."
"0xd4cd0fb7" = "The legendary Spanish treasure fleet, which regularly set sail from America to Spain, also gave rise to all manner of greed beyond the Iberian peninsula. It was primarily an ambitious England who saw this as an opportunity to contest Spain’s role as mistress of the seas and queen of the world.<n><n>As the island kingdom was still too weak to engage in large-scale military campaigns, it made far more sense to engage its rival outside of Europe, far afield, where she would neither expect to be attacked nor receive any warning of attack. There, one could loot one’s victim with ease and then simply disappear and no one in Europe would hear of the events for months.<n><n>Daring captains, the most famous of whom was Francis Drake (1540-1596), were issued with Letters of Marque by Her Majesty Elizabeth I. These Letters of Marque resembled a kind of blank check and were a license to loot that elevated Drake and his associates above the level of regular buccaneers and conferred on them the status of private robber barons in the service of a higher authority. They made an excellent job of it. Nowhere were Iberian ships and garrisons safe.<n><n>In 1578, Francis Drake traversed the Straits of Magellan and set off like a whirlwind on the hunt for Spanish booty along the Pacific coast of America. No one had ever dared to do this before! On his return to Plymouth harbor in 1580, Drake had become the second captain after Magellan to sail around the world. <n><n>Meanwhile, King Philip of Spain was boiling with rage and waved the Treaty of Tordesillas, under which His Holiness the Pope had adamantly declared the western hemisphere to be within Spain’s sphere of influence in 1494. – But how could this sort of protest have any affect on this peculiar island nation of Protestant heretics, who completely rejected the authority of the Pope in Rome and who even refused to adopt the modern Gregorian calendar until 1753, purely because it had been developed on the orders of Pope Gregory in 1582?<n><n>Once more, it seemed that the matter could only be resolved by means of war. Philip’s Armada set sail for England in 1588, but under the command of Sir Francis Drake, who had by now been made a knight, and with the help of several timely storms, the English succeeded in destroying the Spanish fleet. For hundreds of years afterwards, no one would challenge Great Britain’s position as the leading sea power."
"0xd4cd101f" = "Without doubt, the voyages of Christopher Columbus (1451-1506) to America ranked among the greatest adventures ever undertaken by mankind. Even a writer could hardly dare to imagine such a tale of dramatic events and strange coincidences.<n><n>Although the navigator from Genoa had managed to convince the royal couple Isabella and Ferdinand of Spain of his idea that there was a western sea route to India, he was certainly not able to rely on the assent of the crew on board. Indeed, most of the crew were pressed into service: As punishment for misdemeanors against the Crown, the town of Palos was forced to provide two ships with crews.<n><n>The news of Columbus’ plan provoked expressions of horror. The crew was firmly convinced that they were sailing under the command of a madman who could only bring destruction on himself and all who sailed with him.<n><n>However, Columbus’ greatest enemy was superstition: Every imaginable tale of horror appeared to have made its way on board and any strange or sinister events only reinforced the sailor’s fears: A volcano erupted as they sailed past Tenerife, then they saw columns of fire in the sky and even the compass needle appeared to be playing tricks on the crew. If the ships were becalmed, this was seen as a bad omen. On the other hand, if they made good progress, this meant that the wind always blew from east to west and that they would never be able to turn around.<n><n>On many occasions, a mutiny appeared to be inevitable. One night, the captain heard footsteps and muttering outside his cabin, and only when he started to pray in a loud voice did the assassins lose courage and sneak away.<n><n>The most serious crises always broke out when what was thought to be an island on the horizon turned out once again to be nothing more than an optical illusion. It was just such an occurrence on October 10th that brought matters to a head. With great difficulty, Columbus negotiated an ultimatum of three days, after which the crew wanted to turn around (preferably without their captain). However, fate had other intentions: They did in fact sight land within these thee days. None of those present could have dreamt that, instead of Asia, they had stumbled upon a completely new and unknown continent.<n><n>Japan and China still lay thousands of nautical miles away and only for the unbelievable good fortune that a foreign continent lay in its path, Columbus’ expedition would have been lost. The morale of the crew was immediately lifted. None of them could recall ever having harbored thoughts of mutiny ..."
"0xd4cd1020" = "Christopher Columbus had indeed discovered a new land mass (or rather: rediscovered, for the Vikings had already set foot on American soil during the middle ages), but he mistakenly announced that he had discovered a sea route to India.<n><n>While preparing the second and third of his four voyages, the Genoan collaborated with Amerigo Vespucci from Florence. It was he who first suggested that these lands to the west actually belonged to a new and unknown continent. This spectacular realization reignited public interest and whenever anyone discussed these new territories, the name Vespucci was sure to be mentioned.<n><n>In contrast, Christopher Columbus’ star was in decline. In the meantime, he had even been sent home in chains after complaints by the Caribbean settlers, and his death as an embittered and sick man in 1506 did not attract the attention it deserved. It is therefore hardly surprising that the southern German cartographer Martin Waldseemüller turned to the popular name of Amerigo Vespucci as an inspiration when he tried to suggest a name for these unknown lands one year later. <n><n>Waldseemüller’s name was accepted by his colleagues. It would have been fairer if the continent had been christened “Columbia”."
"0xd4cd1021" = "The first part of America that rose to great importance under the Spanish was Hispaniola. Christopher Columbus had already founded the first European settlement here in 1493, although it had been wiped out by Native Americans even before he returned from Europe.<n><n>Over the following years, the Spanish Crown took increasing control of this island. The first monastery and the first cathedral were built, and it was here that the social system that was to be extended to the other areas was first established: A slave-holding society, strictly divided into classes and closely associated with the Catholic Church.<n><n>Hisponiola seemed to offer huge opportunities and attracted many enterprising settlers across the ocean. <n><n>However, it was not long before Spain directed its attention to other regions: By now, the great realms of the continent had been discovered and conquered. Here, it was easier to rule, the deposits of gold and silver were richer and easier to extract.<n><n>Just like a toy that has been tossed aside, people lost interest in Hispaniola. Dutch, English and French pirates took turns to mount attacks. In 1697, the French took control of Saint Domingue, the western part of the island (today Haiti) and established a profitable plantation economy. The production of cocoa, sugar, indigo, cotton and coffee made Saint Domingue the most profitable colony in the New World in the 18th century.<n><n>The only successful slave revolt in history, which erupted as a result of the French Revolution, eventually led to the independence of Haiti in 1804. The rebels treated their former oppressors very much as they had been treated themselves: \"For the declaration of independence, we need the skin of a white man for the parchment, his skull as an inkwell, his blood as ink and a bayonet for a pen\" announced the black General, Boisrond-Tonnerre at the time."
"0xd4cd1022" = "A typical Caribbean product, though of questionable benefit to mankind, is rum. This spirit made from sugar-cane molasses, which originally bore the colorful name of “devil killer”, was first alluded to in Barbados in 1650. As the pirates’ legendary drink of choice, most people tend to associate rum with the island of Jamaica, one of the most feared pirate’s dens of all time. <n><n>Slave traders sold the human merchandise that they had purchased on the African coast in the Caribbean for large quantities of molasses. This molasses was refined into rum in New England and then transported to Africa on the very same ships. The spirit was sold in Africa and the empty ships were then loaded with a fresh cargo of slaves. With this fatal “triangle trade”, the ship owners ensured that their ships were always fully laden on every voyage."
"0xd4cd1023" = "Next to Cuba, Jamaica is probably the most famous of the Caribbean islands. Its name is derived from the Arawak Indian name of Xymaca, which means roughly “the land of wood and water”. Christopher Columbus himself, who had discovered the island nine years previously, had ample opportunity to experience the beauty of the landscape and the friendliness of its inhabitants when his ship was wrecked off the northern coast in 1503.<n><n>Indeed he liked it so much that he transferred ownership of the entire island from the King of Spain and declared it as his own. In spite of this, this island paradise was quite neglected over the next few decades until it was seized by the British in 1655. Very few Arawak still remained at this stage, as their tribe proved particularly susceptible to the diseases that the Europeans had brought with them.<n><n>In 1661, Edward D'Oyley was appointed captain general and governor of Jamaica. Under his authority, the capital of Port Royal was transformed into a vibrant, heavily defended haven for pirates. It was said to be the “richest and most corrupt place on earth” and many of the inhabitants, who were otherwise ordinary traders, frequently banded together to carry out private raids in Spanish waters. At first, the British Government showed little inclination to reign in these goings on, as after all, the buccaneers kept its Spanish rivals at bay.<n><n>It was only after Sir Henry Morgan took office as governor (significant in that he was a former pirate himself) that culture and order returned to Jamaica. Morgan ruthlessly suppressed piracy and showed no hesitation in sending his former associates to the gallows.<n><n>However, no sooner had British authority been re-established than a new and lucrative source of income in addition to growing sugar cane was discovered: After 1672, Port Royal developed into the largest slave market in the world, once the English Royal African Company had established a monopoly."
"0xd4cd1024" = "A mere two weeks after his arrival in the New World, Christopher Columbus reached Cuba, the largest island in the West Indies. Several tribes lived here, the Ciboney, die Guanahatabey and the Tainos, who, despite their peaceful nature, all suffered the same unhappy fate as other Native American tribes: In 1511, after fighting a four-year war against the Spanish, they were conquered and exterminated. This then resulted in large numbers of black slaves being imported here. The island, with its capital city Havana, was divided into seven administrative areas (cabildos), each of which sent a deputy to a special council. The deputy’s duty was to represent local interests of the area.<n><n>What is remarkable about the history of Cuba is that, apart from a short interlude of British control from 1762 to 1763, the island remained in Spanish hands for a relatively long time. This may have been because Cuba was not one of the most important areas of the Spanish empire during colonial times (for example, there were hardly any mineral deposits) and was generally used as a stopover on the way to the continent. In any case, while the vast majority of South American and Central American countries fought for their independence in the first quarter of the 19th century, the Spanish were able to hold on to Cuba until 1898, when they ceded control of the island to the United States."
"0xd4cd1025" = "It is well known that many things we now take for granted first arrived in Europe as a result of the trade with America. However, the cultural exchange worked the other way around.<n><n> For example, when one pictures the typical Native American of the North American plains, it is hard to imagine that there were no horses in America before the arrival of the Spanish and the Portuguese. Many of the Native Americans fled in blind panic the first time that they saw a horse and rider, because they thought that this was a strange beast comprising two beings that had grown into one.<n><n>Coffee, which one normally associates with countries such as Brazil and Guatemala, is not native to America and had already traveled across three continents before its arrival there: From Africa (probably from Ethiopia), it traveled via the Arab countries before arriving in southwest Europe. The plant was first introduced in America during the 18th century, when the drink’s increasing popularity made it necessary to increase cultivation of the crop.<n><n>In the potato, the Europeans had discovered in the Caribbean a basic foodstuff of unimaginable value. Conversely, wheat was unknown in America until the arrival of the Spanish and the English, who brought this crop to Mexico in 1520 and to Virginia in 1777 respectively. Although people originally felt that the American climate was not suited to growing wheat, it was North America in particular that witnessed the most phenomenal success of this crop. Today, wheat is the agricultural crop with the largest acreage under cultivation in the world."
"0xd4cd1026" = "Can you imagine life without chocolate? You certainly should, because cocoa was unknown in the rest of the world before the discovery of America. The word cocoa probably originates from the Maya language, to which it can first be traced: It seems certain that Maya traders were drinking cocoa 400 years before the birth of Christ.<n><n>The Aztecs, who were the dominant power on the Central American continent since the 14th century, even bestowed a religious significance on cocoa. The first European to come into contact with this delicacy was, once again, Christopher Columbus, although this was on a later voyage in 1502 that took him to Nicaragua.<n><n>However, the rightful “discoverer” of cocoa is Hernan Cortés, conqueror of the Aztec kingdom, who brought back to Spain the recipe for a drink called xocoatl (hence the word “chocolate”). The taste was initially too bitter for the European palate and it was only after people started to add sugar or vanilla that hot chocolate become a popular drink among the Iberian upper classes.<n><n>The Spanish kept the recipe to themselves for nearly a hundred years, after which time hot chocolate spread through France and the rest of Europe. Around the year 1700, the British added milk. The final breakthrough of cocoa in Europe took place when it was discovered how delicious coffee and cocoa tasted together."
"0xd4cd1027" = "Although it is sometimes difficult to distinguish between reality and legend when one talks about piracy, there is no disputing the fact that there were women pirates. Two of the most dazzling figures set out on this course on the island of Jamaica during the early 18th century.<n><n>Anne Bonny, who was said to have been stabbed in the stomach while still a child, had eloped with a seaman to the pirate haven of New Providence (Nassau). There, she managed to get rid of her husband and start her own career on board a captured Dutch ship. <n><n>There, she met Mary Read, who had already fought in the Spanish Wars of Succession disguised as a man and who allegedly bared her breasts to her opponents before killing them, to prove to them that they had been beaten by a woman.<n><n>After their capture in the year 1720, they only escaped being sent to the gallows because they were pregnant. They fared better than most of their male sidekicks, on whose heads Anne Bonny could only pour scorn.<n><n>Below are the words she spoke to the infamous “Calico Jack” on his way to the gallows: “I’m sorry to see you here, Jack, but if you had only fought like a man, you wouldn’t be here to be hung like a dog”."
"0xd4cd1028" = "The Welshman, Bartholomew Roberts (1682? – 1722), was not only one of the most important pirates but he was also a very unusual one. Also known as “Black Bart” (not to be confused with “Blackbeard” alias Edward Teach), he was a late convert to piracy at 37 years of age, although the transition into criminal activities was without doubt a smooth one: The ship on which he was working and which was attacked in 1719 by his fellow Welshman Howell Davis was in fact a slave ship.<n><n>Roberts decided to throw in his lot with Davis, after whose murder a couple of weeks later, he assumed the role of captain. It is said that Bartholomew Roberts avoided alcohol and preferred tea.<n><n>In contrast to Teach, who cast himself as the devil incarnate, Roberts had a penchant for fine clothes, disliked gambling and insisted that his men said their prayers. However, this certainly did not mean that Roberts was a pious man at heart. There are numerous tales of the atrocities he committed, especially against prisoners, during his countless looting exploits. With a haul of over 400 ships and an area of operation extending from Brazil as far as Newfoundland and West Africa, he was, along with Henry Morgan, one of the most successful pirates of Central America. <n><n>The roar of guns from a British warship off the coast of Guinea in 1722 signaled the end of his career and the removal of one of the greatest menaces on the seven seas."
"0xd4cd1090" = "The most famous buccaneer of the 17th century was the Welshman, Henry Morgan (1635-1688), who plagued the Spanish colonies in the West Indies, thereby shaking the authority of the great Iberian power in the region to its foundations.<n><n>His life exemplifies the rather dubious morality behind the policies of Britain, Holland and France, who were only too happy to turn a blind eye to piracy as long as it inflicted damage on the other great powers.<n><n>Henry Morgan, who was put in command of a buccaneer ship in 1668, first started to wreak havoc along the northern coast of South America. In command of almost 2,000 men, he captured the heavily defended town of Panama in August 1670, and then absconded with most of the booty on the return voyage. However, because the attack took place after Spain and England had signed a peace treaty, has was taken prisoner and put on trial in London.<n><n>Morgan was not convicted, on the contrary: It was not long before the winds of diplomacy had once more changed direction. Not only was Morgan pardoned, he was made a knight. As Sir Henry, he was appointed as the new governor of Jamaica, where he imposed strict law and order and lived out the remaining years of his life as a wealthy and respected planter."
"0xd4cd1091" = "The Bahamas, which for a brief period in the middle of the 17th century served as a refuge for religious dissenters from England, was from 1670 officially under the control of the Earl of Albemarle and other gentlemen who had taken ownership of the group of islands from King Charles II in the hope of making profits.<n><n>Despite their promises, however, these individual showed little interest in setting up a well-ordered civil administration. Quite the opposite was the case: Similar to other places in the Caribbean, hordes of pirates settled in the Bahamas, especially on the island of New Providence, which was home to the town of Nassau. <n><n>The shallow bays, into which heavy warships could not intrude, offered an ideal berth for several hundred sloops and pirate barques. The frequent raids in Spanish waters resulted in reprisals and John Wentworth, the first governor, had the unenviable task of reimposing law and order on the islands.<n><n>As the situation showed no signs of improvement, King George I of England confiscated the Bahamas again and turned it into a Crown Colony. Woodes Rogers, the former buccaneer and circumnavigator, was appointed the first royal governor in the middle of 1718.<n><n>Using a carrot and stick approach, he brought an end to the chaos that had hitherto prevailed. He held out a general amnesty for all pirates who were prepared to renounce their activities under oath. For all those who were unwilling to do so, punishment awaited in the form of a fleet of ships armed to the teeth.<n><n>After normal conditions had been restored in this way, the island group was granted its own parliament in 1729 and over the following hundred years, with the exception of occasional disturbances as a result of invasions, the history of the Bahamas remained relatively uneventful."
"0xd4cd1092" = "Almost everywhere in their newly acquired colonies, the Spanish set up a rigid social system offering precious little opportunity for advancement. At the very top of the hierarchy were those fellow countrymen born in Europe.<n><n> Spaniards born in the colonies were known as Creoles. Although they were only considered as being of secondary importance in the hierarchy, they occupied most of the lesser positions in the state, church and the army.<n><n>Spaniards of European descent and Creoles therefore represented the elite class in the colonies. The children of mixed marriages between whites (mostly men) and Native Americans were known as mestizos. The Native Americans, who originally owned the land, occupied the very lowest position in society and in those areas where they had been completely exterminated by the Europeans, this honor was reserved for the black slaves.<n><n>The relative proportions of these classes among the population differed greatly among the various regions of the Spanish empire. In Mexico, for example, the mestizos formed the largest section of the population. On many islands, black slaves were present in superior numbers (and at the mercy of their masters). Native American tribes also managed to survive in those areas where jungles, swamps and mountainous regions offered a safe retreat, for example, in Bolivia or Florida."
