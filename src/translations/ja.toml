"0x39e32dc6" = "Thank you kindly. The town in question is called @T$TargetTown$. I hope I can come to an arrangement with the traders before @D$EndDate$. Until then, the town cannot fall below the status \"Boom\", so I can negotiate from a stronger position."
"0x39e32dc7" = "The town in question is @T$TargetTown$. Supply the town with all the goods it needs. I will do my utmost to quell the rumor by @D$EndDate$ for once and for all. Before then, the town cannot fall below the status \"Boom\"."
"0x39e32dc8" = "The town in difficulty is @T$TargetTown$. Its status cannot fall below \"Boom\" before @D$EndDate$, otherwise too many citizens will leave the town. There is even the risk of a plague breaking out there. You must ensure that you supply the town with enough goods in time to prevent this!"
"0x39e32dc9" = "Good. @T$TargetTown$ is the town in question. Supply the town with everything it needs by @D$EndDate$. Its status cannot fall below \"Boom\". I must be honest and tell you that the town could quite possibly be hit by a plague. Be prepared for it."
"0x39e7361e" = "%1 を撃破"
"0x39e9081a" = "You have discovered the location of Blackbeard's hideout. For information on the pirate gang, left-click on the hideout symbol on the sea chart.<n><n>Beware: When you destroy a hideout, the pirate gang is annihilated. However, any pirate convoys that were not in the hideout at the time are informed and they then set up a new hideout.<n><n>Your first objective is therefore to destroy all of the convoys belonging to the hideout. Ideally, you should lie in wait for any convoys that sail into or out of the hideout and attack them.<n><n>You have received some more cash to support you in your quest.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destroy all of Blackbeard’s pirate convoys that are currently at sea. Do not attack his hideout!"
