"0x0cf7abf0" = "ここでは、 町に 雇い待ちの入植者が いるか、 町が 新しい労働者を 必要と しているかが分かります。 事業の建設が 終わると、 そうなります。<n>周辺の総督都市へ 行き、 事業に 労働者が そろうまで入植者を サンタマルタへ 運んでください。"
