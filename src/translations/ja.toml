"0x0ce1a79e" = "You are in the colonial town of Santa Marta. Click on the town name to display the town information."
"0x0ce1a79f" = "Colonial towns like Santa Marta can produce two essential goods, two raw materials and one colonial good.<n>In the last scenario, you learned that there is a particularly high demand for raw materials and colonial goods in governor towns.<n>You want to produce the colonial good cocoa first.<n>Now close the town information."
"0x0ce1a7a0" = "Since colonial goods are shipped to Europe from governor towns, the demand for cocoa in these towns is high. These conditions are good for your first business. Now locate and click on the master builder's building in the center of the town."
"0x0ce1a7a1" = "At the master builder's, you can apply for permission to construct a new building or return your building permit. This is not what you want to do now of course!<n>Look at the different buildings you can construct. You can also use the buttons on the right of the Master Builder window.<n>Click on the Cocoa Plantation button."
"0x0ce1a7a2" = "You can now see how many building materials are required and what the construction costs will be.<n>You can also see how many building materials you currently have in your warehouse and how many you'll have to buy from the town.<n>You have enough materials at present.<n>Position your cursor on an available construction site and left-click on it."
"0x0ce1a7a3" = "The scaffolding of the cocoa production facility is now displayed and construction begins.<n>It will take a couple of days for construction to be completed. In the meantime, you should organize accommodation for your new workers.<n>Close the Construction menu and look for a residential area in Santa Marta. "
"0x0ce1a7a4" = "This residential area belongs to a trader from the town. You can check how many residential areas are owned by local traders and how many tenants they have. You want to build your own residential area. To do so, open the Construction menu."
"0x0ce1a7a5" = "Select a residential area in the Construction menu and look at the construction costs display. <n>You may not have enough building materials in storage. However, you can buy any materials that you need in the town if they are in sufficient supply. <n>Otherwise, you'll have to source them in another town.<n>Then build a residential area."
"0x0ce1a7a6" = "A business can employ 30 workers. Since there are four family members in an average worker's family, living quarters for 120 people are required for each business you establish. <n>A residential area has space for 120 tenants and so one residential area is required for each business.<n>Now close the Construction menu and click on your new residential area."
"0x0ce1a7a7" = "There is no construction period for a residential area because the tenants live in tents at first.<n>Over time, the tenants themselves develop the residential area into a very sizeable building.<n>The appearance of a residential area depends on how old it is and on the status of the town.<n>Close the residential area dialog."
"0x0ce1a80f" = "As you know, your first building in a town must always be a warehouse. You cannot construct any other buildings until you have built this.<n>You already have a warehouse in the town where you started the game. Find it and click on it. It is shown in light blue on the screen."
"0x0ce1a810" = "In the warehouse, you can see which buildings you own in the town and what it costs to maintain them.<n>You can also see how much rent your tenants pay you and what goods your businesses are producing.<n>Later, you'll be able to give the storekeeper instructions.<n>Have a look around the warehouse and then close it."
"0x0cee08cc" = "この町の軍事力はもう少し欲しいところです"
"0x0cf75014" = "閉じる"
"0x0cf7abef" = "Click on your cocoa plantation. The display always shows all of your cocoa plantations in the town.<n>Once your production facilities are constructed, you’ll need 30 workers, that is, 30 settlers. Now leave the plantation, go to the docks in the harbor and press the “Cargo” button (the bottom button on the right)."
"0x0cf7abf0" = "Here you can see if there are any settlers waiting to be hired in the town or if the town needs new workers. This will be the case as soon as construction of your business has been completed.<n>Go to the surrounding governor towns and bring settlers to Santa Marta until your business is employing a full complement of workers."
"0x0d0db040" = "自分のカカオ農園の 1 つをクリックしてください。"
"0x0d0db041" = "You can now see how much cocoa your business is producing each day and how many tools this requires.<n>Now build up a supply of @a$SubGoal$ of tools in your warehouse because your warehouse supplies goods to your businesses."
"0x0d0db042" = "Tools are imported goods. This means that you'll find the most plentiful supply and the lowest prices in governor towns.<n>You could try to source some in Cartagena to the southwest or far to the east in Margarita ."
"0x0d0db043" = "Well done!<n>The lower the average price of the raw materials your require, the lower your production costs for the goods you produce.<n>Now continue to produce cocoa until you have a supply of @a$AmountGoal$ in your warehouse."
"0x0d0f1795" = "7月"
"0x0d0f1877" = "6月"
"0x0d1098bd" = "%1,<n>you’re new here, aren't you? But I have already heard tell of you, and your good name precedes you. You should pay me a visit now and then, as there is always some work to be done."
"0x0d23b491" = "Sail with your convoy to the town of Cartagena and enter the town.<n>A small circle symbol is displayed below the town name on the right of the screen. This shows your trading record in Cartagena up to now.<n>Things are a little easier for you in this scenario because you have received a bonus.<n>Now open the town information."
"0x0d23b492" = "Under \"Trading Record\", you can now check what percentage of the required score you have already achieved. If 100% is displayed here, you can apply for a permit from the master builder.<n>Close the town information."
"0x0d23b493" = "The prices of goods that are scarce in a town are shown in red in the trade window. If you sell these goods, you will improve both your trading record in the town and your reputation with the nation to which the town belongs.<n>Click once on the docks to display information on the stock of goods in the town."
"0x0d23b494" = "Note which goods are lacking in the town. For example, the town will always need sugar and cotton because it produces rum and garments.<n>But there are other scarce goods in the town also.<n>Go to other towns to buy the goods that Cartagena needs and improve your trading record."
"0x0d23b495" = "Not bad! You have raised your profile in Cartagena considerably.<n>But be careful not to buy up any scarce goods in Cartagena! You can easily recognize scarce goods because the stocks of these goods are displayed in red.<n>Increase your trading record score to 85%."
"0x0d23b496" = "よくやりました！ カルタヘナでの評価は 85% です。 この調子で続けてください！<n>評価を 100% まで上げましょう。<n>ところで、 「昇進と階級」 についてのメッセージが届いています。"
"0x0d23b497" = "Excellent! You have now done enough trade with Cartagena.<n>Unfortunately, your rank is still Ordinary Sailor and so you can only be granted one permit.<n>To be promoted to the next rank, you must increase your wealth by trading some more. "
"0x0d23b498" = "Very good! As a Sailor, you can be granted two building permits.<n>Go to the master builder in Cartagena and apply for a permit.<n>If you don't have enough gold, you must trade some more. Don't forget to trade the goods that you are producing in Santa Marta."
"0x0d2a3b89" = "船の維持費"
"0x0d39b8e2" = "You must first build a warehouse in Cartagena before you can construct any other buildings."
"0x0d39b8e3" = "Now establish two weaving mills and build two residential areas.<n>If there are not enough building materials in the town, you must buy these in another town and deliver them to your warehouse at the docks. <n>Don't forget to negotiate a price before you part with your precious gold!"
"0x0d39b8e4" = "You should ensure that you have a supply of @a$SubGoal$ of cotton in the warehouse by the time your weaving mills have been built, so that the new businesses can start weaving cloth from cotton straight away."
"0x0d39b8e5" = "Your next objective is to produce your own supply of @a$SubGoal$ of cloth for the warehouse in Cartagena and wait for your weaving mills to be constructed.<n>For @a$SubGoal$ of cloth, you need exactly @a$SubGoal$ of cotton."
