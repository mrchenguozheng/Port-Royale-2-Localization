"0xf6a84efd" = "It is the year 1570 and we find ourselves in the Caribbean. Your objective is to rise from being a humble trader to become an influential businessman. To help you achieve the status you seek, you can transport goods as well as trade, build, and engage in politics and piracy.<n><n>The following scenario will teach you the basics of how to play the game. As with the other scenarios, this involves several different objectives. You must achieve all of your objectives to successfully complete the scenario.<n><n>You can now close this window using the Close button and refer to the Event window in the bottom-left of your screen.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Follow the instructions in the Event window."
"0xf6bb9f8c" = "価格"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "グラフィックカード"
"0xf6c77503" = "The hideout of the pirate %1 has been discovered. Which heroic adventurer dares to attack and destroy the hideout?"
"0xf6ec5ddc" = "Strange things are happening in Tortuga. Due to a number of events that have happened in the past, hardly a single trader dares set foot in the town. Your task is to support Tortuga as best you can by supplying goods.<n><n>But your starting capital is not exactly spectacular. You have @g$StartGold$ cash available. Nonetheless, you have a well-equipped trading convoy in the harbor and some stores of goods.<n><n>Your first objective is to increase your cash to @g$GoldGoal$. Complete this task as fast as possible, but you cannot take longer than 40 days.<n><n>A word of advice: Under no circumstances should you sell your ships. However, you can take out loans.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Increase your cash to @g$GoldGoal$ by @D$EndDate$."
"0xf70feddb" = "You are back in the harbor of Cartagena and your convoy, the \"Santa Maria\", is selected.<n>As you can see, the convoy already has some goods: cotton, meat and cocoa.<n>Now find the docks in the harbor and click on them, because you want to sell the goods."
"0xf70feddc" = "At the docks, you can trade both between the town and your warehouse and between the town and your convoy.<n>You can now see what goods the town has and what goods your convoy has. Use the arrows to buy and sell (the prices are shown on the arrows).<n>Now sell your cotton."
"0xf70feddd" = "You may have noticed how the price of cotton fell when you sold some.<n>This is because the price is determined by the supply and demand in the town.<n>Selling the goods satisfies the demand and the price falls. If you buy a good, its price will go up.<n>Now buy @a$SubGoal$ of wheat."
"0xf70fedde" = "Notice how the price of wheat has just gone up? <n>Note, however, that the price depends not only on the supply but also on your reputation in the town.<n>Click on the button with the building to the bottom-right of the Trade window."
"0xf70feddf" = "Now you can trade between your warehouse and the town.<n>In every town in which you want to set up production of a good, you must first build a warehouse. You will always already own a warehouse in your starting town.<n>Now sell all the goods you have in the warehouse."
"0xf70fede0" = "You have three buttons with the numbers 1, 10 and 100 at the very top of the Trade window to allow you to trade larger quantities of goods more quickly. Click on the button 10 and watch how the prices change.<n>It makes no difference whether you buy 10 x 1 good or 1 x 10 goods: The total price is always the same. Now buy @a$SubGoal$ of rum."
"0xf70fede1" = "The column in the far right of the trade menu displays the average prices for the goods you have bought. Since you want to sell the goods at a profit, you must find a town where a higher price will be paid.<n>Now open the transfer between the ship and your warehouse by clicking on the fourth button (with the crane) on the bottom right."
"0xf70fede2" = "In this window, you can move goods between your convoy and your warehouse. Now load any remaining goods from your warehouse onto the convoy, because you want to sell the goods in another town.<n>Then close the Trade window by clicking on the button marked \"X\" on the bottom right."
"0xf70fede3" = "Now switch to the sea chart and travel with your convoy to Santa Marta. Do not enter Santa Marta, but right-click on the town as soon as the convoy reaches the town. "
"0xf70fede4" = "This will open the Trade window for Santa Marta.<n>Therefore, you do not have to enter a town to trade there.<n>Now sell all the goods that you have on board your convoy.<n>Then close the Trade window."
"0xf7110875" = "このセーブデータを削除してもよろしいですか？"
"0xf725f22c" = "Your convoy is now in Santa Marta. Click on the town name to display the town information.<n>You can do this from the sea chart or by entering the town."
"0xf725f22d" = "The town information shows the goods that are produced in the town.<n><n>Your relationship with Spain is also displayed: This relationship is friendly! This means that you will be paid the best possible prices in the town.<n><n>Now close this window and take a look around the town."
"0xf725f22e" = "Now click on the Inhabitants symbol under the town name on the left of the screen to display Santa Marta's stock."
"0xf725f22f" = "This displays the quantity of goods in storage and the quantity of goods consumed in the town. Naturally, the level of consumption depends on the town's population.<n>The consumption tells you how many goods can be delivered regularly. Now close the Stock window."
"0xf725f230" = "Now try to strike some profitable bargains.<n>Open the Trade window and buy as much cotton, sugar and cocoa as you can transport in your convoy because these goods are produced in this town.<n>Then return to Cartagena and sell these goods at a profit."
"0xf725f231" = "You have just received two messages with some tips for successful trading.<n>Open the log to read the messages.<n>"
"0xf725f232" = "Sell as many goods as you can above the average price and buy new goods. <n>Note: The prices of goods that are scarce in a town are shown in red. You will always get good prices for these goods.<n>"
"0xf725f233" = "Governor towns like Cartagena receive import goods from Europe.<n>You can usually sell these at a profit to colonial towns, such as Santa Marta, Maracaibo or Gibraltar.<n>Now trade on your own for a while.<n>Your objective is to make @g$GoldGoal$ in cash from trade."
"0xf7346191" = "%1 からの商人"
"0xf73619d7" = "海賊の隠れ家が知られるようになった"
"0xf7370c4b" = "%1,<n>I can think of many people I'd rather see. Do we have business to discuss? Come in, if you must."
"0xf73bf67d" = "Go to the town view for Cartagena.<n>Usually, you must have a convoy anchored in the harbor if you want to enter a town. However, you have a warehouse in Cartagena and can therefore enter this town whenever you like.<n>Click on the shipyard in Cartagena."
"0xf73bf67e" = "In the shipyard, purchase a small ship. Don't spend too much money because you'll need to keep some for trading and for maintaining your ship."
"0xf73bf67f" = "In the last scenario, you learned how to add ships to a convoy by right-clicking on the harbor.<n>Now, however, you should assemble a new convoy by hiring a captain at the inn.<n>Find the inn (located in the center of the town) and click on it."
"0xf73bf680" = "Captains are always to be found at the inn. If there is a captain staying in the town, this will be indicated by the third button in the Inn menu.<n>If you have other ships or convoys in the harbor, you must tell the captain where exactly he is to be employed.<n>Specify that he is to captain your new ship."
"0xf73bf681" = "Congratulations! You have formed your first convoy! Your next task is to increase your wealth to @g$GoldGoal$. You can check your wealth at any time under \"Successes\" in the log.<n><n>Good luck!"
"0xf73dab55" = "前回の任務を完了してくれて感謝します。"
