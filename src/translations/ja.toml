"0xf64f1e5a" = "ご存じのとおり、 我々は 戦争中です。 @n$TargetNation$ の経済を 弱めるため、 交易船を @I$NumShips$ 隻拿捕するか沈めてください。 この任務を 受けますか？"
"0xf64f1e5b" = "我々は @n$TargetNation$ と戦争中です。 ですから、 交易船を 指定の数だけ 沈めるか拿捕してほしいのです。 奪ったものは すべてあなたのもの、 私が 望むのは @n$TargetNation$ の経済を 弱めることだけ。 引き受けてもらえますか？"
"0xf64f1e5c" = "@n$TargetNation$ との戦争で 助けてもらえないでしょうか。 あなたを ある海域へ 送り、 そこの船を 拿捕するか沈める任務を 任せたいのです。"
"0xf651cc3f" = "オランダと イングランドは 和平を 結んだので、 もう町を 占領できません。<n><n>このシナリオではかなり進みましたが、 オランダのために 十分な数の町を 占領する時間が ありませんでした。<n><n>フリープレイでも同じように 町を 占領できます。 ただし、 まず占領したい町の国が 軍事的に 弱っていることを 確かめてください。 さらに、 その町を 占領したい国が 軍事的に 強く、 二国が 戦争中である必要が あります。<n><n>補足： 総督代理のために 町を 占領すると、 通常は 自分の町を 建てられる土地が もらえます。 ただしこのシナリオではその機能は 無効です。"
"0xf65a5a04" = "これで、 イングランドの船や 町を 攻撃して %1 での名声を 高められます。 他の国での名声が 下がることは ありません。"
