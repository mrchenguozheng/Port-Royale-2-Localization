"0xf7534d8f" = "When you carry settlers to a town where workers are needed, the settlers will thank you by paying you a fare when they disembark.<n><n>A small number of tools is always required to produce colonial goods like cocoa. If these tools are not available, production stops. Later, when you know a little more about prices and quantities, you can instruct the storekeeper to purchase tools regularly in the town. However, you should purchase the tools yourself for the moment, to be on the safe side.<n><n>This is your next task. Then there will be nothing to stop you from producing cocoa.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produce cocoa and build up a supply of @a$AmountGoal$ in your warehouse."
"0xf760fd2a" = "Thank you. Here are your %1. I am here until %2. You can bring me more goods until then."
