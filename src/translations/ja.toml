"0x00885bdb" = "Well done! Now you have a town of your own! No one but you may build in this town. <n><n>The town already has some buildings, such as the docks, where you can trade, and your palace. The rest you must build yourself.<n><n>Sail with your convoy to your town. Carry as much wood and as many bricks as you can because you'll need these to construct buildings.<n><n>First, build a shipyard, where you'll be able to repair your own ships.<n><n>Note:<n> It costs a lot to maintain the crew on your escort ships. You should dismiss the crew, as you no longer need them.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visit your new town and build a shipyard."
