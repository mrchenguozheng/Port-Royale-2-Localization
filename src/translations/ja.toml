"0x2ee8bb8e" = "画面上部、 日付の隣が ログボタン、 その隣が 所持金です。<n>ログには成果や 財産に 関する情報が 随時記録されます。 受け取ったメッセージや 任務も すべてここに 保存されます。<n>ログを 開いてください。"
"0x2ee8bb8f" = "ご覧のとおり、 ログにはこれまで 受け取ったメッセージが 表示されます。 今は このシナリオの指示だけが出ています。<n>ログウィンドウの右側にもボタンが あります。 3 番目のボタンを クリックしてください。"
"0x2ee8bb90" = "受け取ったタスクと 任務が 表示されます。 今は シナリオ目標だけ です。<n>任務ウィンドウ最上部の 2 つのボタンで、 現在の任務と 完了した任務を 切り替えられます。<n>ではログを 閉じてください。 右クリックでも 閉じられます。"
"0x2ee8bb91" = "ゲームが 進むと、 名声と 富のために 多くの任務を 請けられます。<n>まず町を 見てみましょう。 画面上部中央の表示から、 ここが カルタヘナだと分かります。 人口は およそ 2,000 人です。<n>町の名前が 書かれたボタンを クリックしてください。"
"0x2ee8bb92" = "町の情報を 表示するウィンドウが 開きます。<n>カルタヘナは 総督都市で、 スペイン領です。 町の状態や 生産できる物資も 分かります。<n>では建物に 入ってみましょう。 町の情報表示を 閉じてください。"
"0x2ee8bb93" = "方向キーで 町の表示を 動かせます。 城壁の内側の町の中心を 見てください。 船着場、 教会、 総督の宮殿などの建物が あります。<n>いずれかの建物を クリックしてください。"
"0x2ee8bb94" = "建物を クリックすると、 画面下部中央の表示が 変わります。 建物の種類に 応じて、 情報が 表示されたり、 操作できたりします。<n>建物表示の右側に ボタンが あります。 建物を 出るには 「X」 ボタンを クリックしてください。"
"0x2ee8bb95" = "様々な行動が できる建物は、 必ず城壁の内側に あります。 倉庫だけは例外で、 次のシナリオで 説明します。<n>では建物を 出て、 方向キーで 港と 「Santa Maria」 という船団を 表示し、 クリックしてください。"
"0x2ee8bbfd" = "ご覧のとおり、 船団の情報が 画面下部中央に 表示されます。<n>船団にはすでに 10 樽の小麦と 15 樽のとうもろこしが 積まれています。<n>船団表示の右側に いくつかボタンが あります。 2 番目 （船のアイコンのボタン） をクリックしてください。"
"0x2ee8bbfe" = "船団の船の数が 表示されます。 船団は 船長が 率いる最大 10 隻の船で 構成できます。<n>では船団を 別の町へ 送りましょう。<n>画面右上の矢印ボタンで 町を 出て、 海図を 表示してください。"
"0x2ee8bbff" = "海図が 表示されました。 画面中央に カルタヘナの町が あります。<n>矢印ボタンで 表示範囲を 動かし、 ゲーム世界全体を 見渡せます。<n>北の島に あるポートロワイヤルの町を 探し、 船団を 選んだまま町を 右クリックしてください。"
"0x2ee8bc00" = "航路が 引かれ、 船団が 出発します。<n>ポートロワイヤルを 右クリックしたことで、 目的地に 設定されました。<n>町への到着が 遅いときは、 スペースキー （既定） でゲームを 早送りできます。"
"0x2ef566b4" = "キーボード"
"0x2ef8f665" = "%1 へようこそ。<n><n>%2 周辺を 早く知り、 わが国のこの町と 他の町の発展を 助けられるよう、 いくつか助言しておきます。<n>総督都市の基本は ご存じでしょう。 ヨーロッパへ 輸出する植民地物資を 絶えず供給する必要が あります。 同時に、 こうした町では各種の贅沢品も そろっており、 他の町へ 売れば大きな利益に なります。<n>もう一点。 総督は 時折任務を 出すので覚えておいてください。 ただし、 甲板見習いの階級に 達するまで任務は 受けられません。<n><n>%3%4 、 %5 の総督"
"0x2efebfdd" = "船団が ポートロワイヤルに 着いたので、 町に 入れます。 小さな家の町アイコンを クリックしてください。"
"0x2efebfde" = "見慣れた町の表示ですが、 今度は ポートロワイヤルです。 船団や 建物が ある町ならどこでも 移動できます。<n>港の造船所を 探してクリックしてください。 新しい船を 買います。"
"0x2efebfdf" = "さきほど船団が 表示されていた選択ウィンドウに、 造船所が 表示されました。<n>造船所表示の右側のボタンで 中を 見て回れます。<n>「船を 購入」 の表示に 戻り、 買える船を 見てください。<n>好きな船を 買ってください。"
"0x2efebfe0" = "おめでとうございます。 初めての船を 買いました。<n>船は 町の港に 届けられます。<n>では造船所を 出て、 港の水面を クリックしてください。 選択ウィンドウに 港の船が 並びます。<n>新しい船を クリックしてください。"
"0x2efebfe1" = "造船所でも 見た船のデータが 表示されます。<n>一隻の船で 何かするには、 まず船団に 加える必要が あります。<n>そのために、 もう一度自分の船団を 選んでください。"
"0x2efebfe2" = "次に、 船団に 港と やり取りさせます。<n>港を 右クリックしてください。"
"0x2efebfe3" = "「移譲」 ウィンドウが 開き、 個々の船を 船団に 追加できます。<n>左側の船を クリックして船団まで ドラッグし、 船団が 2 隻に なるように してください。<n>終わったら右側の 「X」 ボタンで ウィンドウを 閉じてください。"
"0x2efebfe4" = "酒場で 新しい船長を 雇えば、 新しい船で 別の船団を 組むことも できます。<n>ただし今は 階級が 足りないためできません。<n>では船団の船リストを 選んでください。 2 番目のボタンです。"
"0x2efebfe5" = "ポートロワイヤルの港に 2 隻の船団が できました。<n>船団の船リストで 船を クリックすると、 詳細が 分かります。<n>では船団を 本拠地カルタヘナへ 戻しましょう。 画面右上の矢印ボタンで 海図へ 移動してください。"
"0x2efebfe6" = "南のカルタヘナの町を 探し、 船団を 選んだまま右クリックして送りましょう。<n>船団が 町に 着くと、 このシナリオは 終了します。"
