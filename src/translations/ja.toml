"0x343e9f4b" = "Congratulations! You are now familiar with the basics of building a town.<n><n>As soon as your production facility is constructed, it automatically begins to employ workers. Each settler waiting at the harbor to be hired can be converted into one worker and four citizens. This means that one settler actually represents an entire settler family.<n><n>To ensure that your businesses have enough workers, you must ensure that sufficient numbers of settlers are available for work. Transport convoys carry settlers from Europe to the governor towns and are then brought by traders to the other towns<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Ensure that you have enough workers for your business in Santa Marta."
