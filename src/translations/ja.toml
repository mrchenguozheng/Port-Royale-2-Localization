"0xcff9644a" = "「片腕の海賊」 は 32 枚の札を 使う運任せのゲームです。 各プレイヤーは 掛け金を ポットに 入れ、 相手には見えない 5 枚の札を 配られます。<n><n>まず各プレイヤーは、 取れると思う点数を 宣言します。 1 トリック取るごとに 1 点です。 高い点数を 宣言した方が 主導権を 握り、 切り札の種類を 決めます。 そして少なくともその点数を 取らねばなりません。<n><n>主導側が 最初の札を 出し、 相手は 同じ種類の札が あれば必ずそれを 出します。 高い札を 出した方が 1 点を 得ます。<n><n>同じ種類の札が なければ、 どの札を 捨てても、 切り札を 出してもかまいません。<n><n>札の順序は I、 II、 III、 IV、 海賊、 花嫁、 総督、 鸚鵡です。 切り札は 他のどの札にも勝ります。<n><n>点を 取った方が 次の札を 出します。 どちらかが勝つまでこれを 続けます。<n><n>主導側が 宣言した点数を 取れば、 そのプレイヤーの勝ちで ポットを 獲得します。 取れなければ相手の勝ちです。"
