"0x12ed2014" = "Eure Männer brechen auf, um die Schatzkammer zu suchen, ohne auf Widerstand zu treffen. Sie erbeuten %1.<n><n>Nun müsst Ihr wählen, welche Waren Ihr aus dem Lagerhaus der Stadt plündern wollt."
