"0x084340c7" = "In diesem anspruchsvollen Szenario dreht sich alles um Handel, Produktion und Warenversorgung in einer Stadt.<n:25>In [town:Tortuga] geschehen seltsame Dinge: Kaum ein Händler will die Stadt besuchen, und mehrere Ereignisse machen ihren Bürgern das Leben schwer. Eure Aufgabe ist es, die Stadt vor dem Ruin zu bewahren. Am Ende des Szenarios wird Eure Punktzahl angezeigt. Sie hängt von Eurer Schnelligkeit und Eurem Vermögen am Ende des Szenarios ab.<n:25>In diesem Szenario könnt Ihr alle Optionen des freien Spiels nutzen, habt aber auch bestimmte Ziele zu erreichen."
