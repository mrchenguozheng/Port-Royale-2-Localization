"0xe38814c2" = "Konvoistatus"
"0xe38974d7" = "Bilanz:"
"0xe3922641" = "Die Nadel dieses Kompasses bewegt sich sehr frei und findet sehr schnell ihre Lage. Einen so genauen Kompass habt Ihr noch nie gesehen.<n>Der Kompass ist wie ein Schmuckstück gearbeitet, und die Unterseite ist mit verschiedenen Gravuren verziert."
"0xe3922642" = "Der Zirkel liegt wunderbar in der Hand und lässt sich sehr leicht führen. Er scheint ganz aus Gold zu sein und ist mit einem kunstvollen Muster verziert."
"0xe3922643" = "Dieser Sextant liefert selbst bei schwerer See eine genaue Peilung. Teile des Sextanten sind auf Federn gelagert, was starke Erschütterungen dämpft."
"0xe3922644" = "Dieses Instrument ist ein Doppel-Fernrohr, mit dem Ihr mit beiden Augen zugleich in die Ferne sehen könnt. Über die Linse könnt Ihr farbiges Glas schieben, um Eure Augen zu schützen. An der Seite ist eine geheimnisvolle Gravur zu erkennen."
"0xe3922645" = "Das ist eine gewöhnliche goldene Uhr, doch sie ist kleiner als jede, die Ihr je gesehen habt. Auf einer Scheibe hinter dem Zifferblatt bemerkt Ihr zudem einen Mond, der sich langsam zu drehen scheint. Auch auf der Rückseite der Uhr finden sich einige Gravuren."
"0xe3922646" = "Diese Lampe ähnelt einer gewöhnlichen Laterne. Doch um den brennenden Docht sind viele Spiegel angeordnet, sodass das Licht nur in eine Richtung fällt. Mit einer Vorrichtung ähnlich einem Fächer über der Öffnung könnt Ihr das ausgestrahlte Licht sehr schnell an- und abschalten."
"0xe3922647" = "Ein Lineal, das sich hin- und herschieben lässt, ist in ein anderes Lineal eingefügt. Daran sitzt ein verschiebbarer Rahmen aus durchsichtigem Material. Mit diesem Gerät könntet Ihr einfache Rechnungen sehr schnell ausführen."
"0xe3922648" = "Dieses seltsame Gerät sieht wie ein Pfeil aus. Die Flügel daran bringen es zum Drehen, sobald Ihr es ins Wasser haltet. Ein kleines Zifferblatt zählt jede Umdrehung, sodass Ihr die Geschwindigkeit des Schiffs sehr genau berechnen könnt."
"0xe3922649" = "Dieses Instrument besteht aus sich drehenden Flügeln und einem Zifferblatt, das die Drehzahl der Flügel anzeigt. Haltet Ihr die Flügel in den Wind, könnt Ihr Richtung und Stärke des Windes ablesen. Das Instrument ist sorgfältig gearbeitet und trägt ein unbekanntes Zeichen."
"0xe392264a" = "Obwohl dieses Tau eine Zeit lang dem Seewasser ausgesetzt gewesen sein muss, sieht es aus, als wäre es gerade erst gemacht. Es fühlt sich wunderbar glatt an und lässt sich zu sehr festen Knoten binden."
"0xe39226b2" = "Dieser Folioband enthält eine Vielzahl schöner Sternkarten. Eine große Tabelle gibt genau an, wann und wo jeder einzelne Stern auf- und untergeht."
"0xe39226b3" = "Eine runde, fein gravierte Scheibe, in die verschiedene kleinere runde Scheiben eingesetzt sind. Mit ihr könntet Ihr sehen, welcher Teil des Sternenhimmels je nach Datum und Uhrzeit gerade sichtbar ist.<n>Markierungen auf der Scheibe zeigen, dass dieses Instrument einst dazu diente, die Position eines Schiffs in einer bestimmten Region zu bestimmen."
"0xe39226b4" = "Dreht man eine Kurbel, gibt ein großes Horn die sanften Töne einer singenden Frau von sich. Genau das Richtige für Seeleute, die monatelang auf See sind."
"0xe39226b5" = "Ein großes Stück geschliffenes Glas sitzt am Ende eines goldenen Stabs. Haltet Ihr es über eine Karte, sind selbst die feinsten Linien auch bei schlechtem Licht deutlich zu erkennen."
"0xe39226b6" = "Dieser kleine Metalltisch ist aus massivem Messing und so konstruiert, dass seine Fläche unabhängig vom Stampfen des Schiffs stets waagerecht bleibt. Der äußere Metallring trägt Gravuren, die Richtungen anzugeben scheinen. Welche Region, in der der Tisch einst benutzt wurde, könnt Ihr jedoch nicht bestimmen."
"0xe39226b7" = "Ein kleines Kästchen enthält eine kunstvolle Vorrichtung, mit der sich sehr leicht Feuer entzünden lässt. Das Kästchen ist mit geheimnisvollen Gravuren bedeckt."
"0xe39226b8" = "Dieser Anker ist eher Zierde als Werkzeug. Höchstens ein Ruderboot ließe sich damit festmachen.<n>Für seine Größe ist er sehr schwer und mit kunstvollen Verzierungen und unbekannter Schrift überzogen."
"0xe39226b9" = "Dieses Gerät gleicht einer Öllampe mit eigenem Feuerstein. Dreht Ihr das kleine Rad, springen Funken auf einen Docht und entzünden selbst bei starkem Wind eine Flamme."
"0xe39226ba" = "Dieses Horn wird nicht mit dem Mund geblasen, sondern mit einer Vorrichtung ähnlich einer Pumpe. Drückt Ihr sie kräftig nieder, klingt das Horn lauter, als Ihr es für möglich gehalten hättet."
"0xe39226bb" = "Diese Karte sieht ganz anders aus als die gewöhnlichen Seekarten, die erhältlich sind. Sie ist sehr detailliert und in mehreren Farben gezeichnet. Welches Gebiet dargestellt ist, könnt Ihr jedoch nicht bestimmen."
"0xe39bb702" = "Der Konvoi kann nicht auslaufen, weil zu viele Kanonen an Bord sind. Verkauft einige Eurer Kanonen oder bringt sie in Euer Lagerhaus, damit Ihr die Höchstzahl an Kanonen nicht überschreitet."
