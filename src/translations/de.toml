"0xd9fb62e7" = "Euer Konvoi fischt eine Flaschenpost auf. Die Flasche enthält eine Karte, die eine bestimmte Stelle zeigt."
"0xd9fb62e8" = "[ref:0xd9fb62e7]"
"0xd9fb62e9" = "Der Konvoi findet eine Flaschenpost. Sie enthält eine hastig geschriebene Notiz: „Rettet mich! Ich glaube, sie wollen mich zu dieser Stelle bringen!“.<n>Der Notiz liegt eine Karte bei, die die Lage einer bestimmten Stelle zeigt. "
