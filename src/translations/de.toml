"0xe67d58b9" = "Gold gefunden"
"0xe6851da5" = "Im letzten Szenario habt Ihr gelernt, dass Euer Rang von Eurem Gesamtvermögen abhängt. Euer Gesamtvermögen umfasst Euer Bargeld sowie Eure Gebäude, Schiffe und Waren. Ihr könnt Euer Gesamtvermögen jederzeit im Protokoll unter „Erfolge“ prüfen.<n><n>Ihr könnt auch den blauen Balken für Eure Erfahrung prüfen, der in der Konvoianzeige stets am unteren Bildschirmrand steht. Erreicht der Balken den rechten Bildschirmrand, werdet Ihr in den nächsten Rang befördert. Ein einmal erreichter Rang kann Euch nicht mehr genommen werden.<n><n>Je höher Euer Rang, desto mehr Konvois könnt Ihr befehligen und desto mehr Städte könnt Ihr später mit Gewerben ausstatten. Ab einem bestimmten Rang stehen Euch Konvois und Baugenehmigungen unbegrenzt zur Verfügung."
"0xe6d65f53" = "Einwohner"
"0xe6d9252d" = "%1, Ihr seid also der %2, von dem mein Vater so viel erzählt hat. Ich bin %3. Wollt Ihr Euch nicht zu mir setzen und mir von Euren Abenteuern erzählen?"
"0xe6d9252e" = "Ich glaube, von Euch habe ich schon gehört, %1. Ich bin %3, die Tochter des Gouverneurs. Ich wollte schon immer einen %2 kennenlernen. Bitte erzählt mir von Euren Abenteuern!"
"0xe6d9252f" = "Ihr seid also der berühmte %1! Nach allem, was ich über Euch gehört habe, hatte ich Euch viel größer vorgestellt. Aber das macht Euch nicht weniger interessant! Kommt her und erzählt mir von Euren Abenteuern! Mein Vater, der Gouverneur, hat schon so viel von Euch gesprochen."
"0xe6d92530" = "%1,<n>ich bin so glücklich, Euch wiederzusehen. Erzählt mir, wie es Euch seit unserem letzten Treffen ergangen ist. Habt Ihr etwas für mich mitgebracht?"
"0xe6d92531" = "%1,<n>es ist wunderbar, Euch wiederzusehen. Seit unserem letzten Treffen habe ich nicht aufgehört, an Euch zu denken. Kommt schnell herein, ich habe Euch viel zu erzählen."
"0xe6d92532" = "%1,<n>ich bin so glücklich, dass Ihr mich wieder besucht. Ich habe allen meinen Freundinnen von Euren Abenteuern erzählt. Doch nun müsst Ihr mir mehr erzählen, denn die Mädchen dürsten nach Neuigkeiten. Kommt schnell herein."
