"0x3933132f" = "Oh @s$USER$, was soll ich nur tun? Ein Händler aus @T$Town$ mischt sich ständig in meine Geschäfte ein und schnappt mir meine Gewinne weg. Das geht nun schon seit Monaten so. Könnt Ihr mir helfen, seinen Konvoi loszuwerden?"
"0x39331330" = "Könnt Ihr mir helfen, einen kleinen Vergeltungsschlag zu organisieren? Ich bin mir ziemlich sicher, dass ein Händler aus @T$Town$ für die Sabotage einiger meiner Schiffe verantwortlich war. Nun kann ich nur dasitzen und warten, bis meine Schiffe von der Werft zurückkehren. Ich möchte, dass Ihr einen Konvoi meines rücksichtslosen Widersachers vernichtet. Ich belohne Euch reichlich!"
"0x39331331" = "Seid Ihr nicht @A$USER$? Ich hätte vielleicht eine Aufgabe für Euch.<n>Vor langer Zeit habe ich einem Händler aus @T$Town$ ein beträchtliches Darlehen gegeben, und es ist fast ebenso lange her, dass er es hätte zurückzahlen sollen. Nun, er hat es nicht getan, und ich glaube nicht, dass ihm das in Zukunft in den Sinn kommen wird.<n>Daher möchte ich ihm eine Lektion erteilen! Würdet Ihr für mich einen seiner Konvois angreifen? Ich belohne Euch reichlich!"
