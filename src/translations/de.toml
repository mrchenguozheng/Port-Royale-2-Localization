"0xc73939cd" = "Gut. Das Schiff ist irgendwo auf der Route zwischen @T$TOWN$ und @T$Town$ untergegangen. Bitte beeilt Euch! Die Aussicht, nach @D$EndDate$ noch Überlebende zu finden, ist gering.<n>Übrigens herrscht derzeit in @T$SampleTown$ Arbeitermangel. Ihr könntet die Überlebenden einfach dort an Land setzen."
