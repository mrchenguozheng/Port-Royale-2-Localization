"0xea43addd" = "Das ist eine gute Gelegenheit für uns. Eine Stadt von @n$TargetNation$ möchte sich unserer Nation anschließen, weil sie offenbar fortwährend von allerlei Konflikten heimgesucht wird. Ich möchte, dass Ihr die Stadt unterstützt, bis sie beschließt, ihre Staatsangehörigkeit zu wechseln."
"0xea43adde" = "In Bezug auf eine Stadt von @n$TargetNation$ ist ein Problem entstanden. Eine schriftliche Vereinbarung über die friedliche Übergabe der Stadt an unsere Nation wurde vor langer Zeit unterzeichnet. Bedauerlicherweise hält @n$TargetNation$ die Vereinbarung nicht mehr ein. Ich möchte, dass Ihr die Stadt unterstützt, bis die Streitigkeiten beigelegt sind."
"0xea43addf" = "Eine Stadt von @n$TargetNation$ befindet sich in ernstem Streit mit ihrem Vizekönig. Ich kenne den Grund und plane nun, die Stadt zu unterstützen, um sie auf unsere Seite zu locken. Ihr könntet mir dabei helfen."
