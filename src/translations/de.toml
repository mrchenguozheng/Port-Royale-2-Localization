"0xc558e134" = "Wenn möglichst viele Händler Eure Stadt anlaufen sollen, solltet Ihr bestimmte Waren einfach nicht an Eure Stadt liefern. Am besten wählt Ihr Waren, die in umliegenden Städten erzeugt werden, denn die Händler berücksichtigen die Länge des Weges.<n><n>Händler, die Eure Stadt anlaufen, kaufen automatisch die Waren auf, die im Überfluss vorhanden und deshalb in Eurer Stadt billig sind. Die Waren, die Ihr selbst erzeugt habt, könnt Ihr direkt an Eure Stadt verkaufen. Solange die Waren nicht teurer sind als in anderen Städten, werden sie regelmäßig von Händlern gekauft.<n><n>Der Vorteil: Für Eure Bürger sind stets genug Waren vorhanden, und Ihr müsst Euch keine Gedanken über den Transport in andere Städte machen."
