"0xd0b3158f" = "Ausgezeichnet! Der Konvoi des Piraten @P$PirateName$ liegt nahe der Stadt Belize, etwa fünf Tagesreisen nordwestlich von hier. Diese Stadt liegt im Nordwesten. Kehrt dann hierher zurück und bringt mir Nachricht von Eurem Erfolg."
"0xd0b31590" = "Etwas mehr als eine Tagesreise westlich von [town:Cartagena] liegt die kleine Insel Providence. Dort wurde der Piratenkonvoi unter dem Kommando von @P$PirateName$ zuletzt gesehen. Ihr solltet den Piratenkonvoi unter dem Kommando von @P$PirateName$ etwa eine Tagesreise nordöstlich davon finden.<n>Zerstört ihn und kehrt dann hierher zurück, um mir einen vollständigen Bericht zu geben."
