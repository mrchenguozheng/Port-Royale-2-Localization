"0xe799be68" = "Der %1 Bukanier %2 hat in der Stadt große Mengen Nahrung verseucht. In der Folge ist eine Hungersnot ausgebrochen. Solange die Hungersnot wütet, steigen die Preise für Weizen, Obst, Mais und Fleisch."
