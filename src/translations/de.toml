"0xdbd1233e" = "<c><o:0xFFFFE6A0>%1<n><o:0xFFEBF0A0>(Spielerstadt)<n><n:5>%2<n:5>"
"0xdbd3f83d" = "%1,<n>was wollt Ihr von mir? Wärt Ihr wie ein echter Seemann in die Stadt gesegelt, hätte ich meine Kanonen auf Euch gerichtet, denn Ihr seid meiner Nation feindlich gesinnt.<n><n> Aber nun, da Ihr hier seid, muss ich mich wie ein Edelmann benehmen."
"0xdbe529f7" = "Kosten pro Tag"
"0xdbec5c5c" = "Versorgt @T$TOWN$ bis @D$EndDate$ mit Vorräten. Der Zustand der Stadt darf nicht unter „blühende Wirtschaft“ fallen."
