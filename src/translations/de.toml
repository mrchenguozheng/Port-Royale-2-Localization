"0xdfb549a4" = "Wir befinden uns im Krieg mit %1, aber der Feind hat nicht genug Militärkonvois, um seine Gewässer zu schützen. Ich möchte, dass Ihr das ausnutzt und eine Stadt erobert."
"0xdfb549a5" = "%1 hat nicht genug Militärkonvois, um seine Gewässer zu schützen! Wir sollten sofort aufbrechen und eine Stadt erobern!!<n>Kann ich auf Euch zählen? "
"0xdfb9b5b7" = "Ausgezeichnet! Ihr habt nun @g$Gold$.<n><n>Jede Nation unterhält Militärkonvois, um ihre Städte zu verteidigen und die Gewässer um sie herum zu schützen. Je mehr Städte eine Nation besetzt, desto mehr Militärkonvois braucht sie, um sie ausreichend zu schützen.<n><n>Verliert eine Nation einen Militärkonvoi, ist ihre militärische Stärke geschwächt. Da Militärkonvois während eines Krieges recht aggressiv gegen Städte und Konvois der feindlichen Nation vorgehen, kann eine Nation von Zeit zu Zeit einen Militärkonvoi verlieren. Deshalb werden regelmäßig Konvois aus Europa entsandt, um die militärische Stärke einer Nation in der Neuen Welt zu verstärken.<n><n>Die Stärke einer Nation könnt Ihr in der Chronik unter „Nationen“ prüfen. Wird eine Nation als schwach bezeichnet, können ihre Städte erobert werden.<n><n>Ihr solltet nun genügend englische Militärkonvois besiegen, damit Englands Stärke als „schwach“ eingestuft wird.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Besiegt genügend englische Militärkonvois, damit England als „schwach“ eingestuft wird."
