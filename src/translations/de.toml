"0xef9ba866" = "Robert Andreas Drude"
"0xefbbbbe9" = "Jetzt ist es Zeit, das Piratenversteck von Blackbeard zu finden und seinem ruchlosen Treiben ein Ende zu setzen. Ist ein Pirat erst eine Weile frei unterwegs, ist es nur eine Frage der Zeit, bis sein Versteck entdeckt wird. Doch auch Ihr könnt etwas tun, um dies zu beeinflussen: Von Zeit zu Zeit kehrt ein Piratenkonvoi in sein Versteck zurück, um Beute abzuladen und nötige Reparaturen vorzunehmen.<n>Folgt auf der Seekarte einem dieser Piratenkonvois und schaut zu, wie er in seinem Versteck verschwindet – sehr wahrscheinlich entdeckt Ihr so den Ort des Verstecks. Habt Ihr das Versteck entdeckt, könnt Ihr es zerstören, indem Ihr es von See aus angreift, ganz so wie eine Stadt.<n><n>Hinweis:<n> @l$IslandPos$ Wartet, bis ein Konvoi herankommt, und beobachtet ihn, wenn er in seinem Versteck verschwindet.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Findet Blackbeards Versteck."
"0xefc2e122" = "Ihr habt mein Schiff noch nicht zurückgebracht? Vertäut es bitte im Hafen, sobald Ihr es findet, und kommt dann zu mir zurück."
