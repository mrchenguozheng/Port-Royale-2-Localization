"0xcd01da76" = "Ihr beginnt das Spiel im Rang eines Matrosen in der spanischen Gouverneursstadt @T$TOWN$, wo Ihr bereits ein Lagerhaus besitzt. Im Hafen liegt außerdem ein Konvoi mit zwei bewaffneten Schiffen, aber ohne Seeleute.<n><n>Zuerst sollt Ihr den Gouverneur von @T$TOWN$ besuchen und seinen Auftrag annehmen. Er hat Probleme mit dem berüchtigten Piraten Edward Teach, besser bekannt als Blackbeard, und möchte, dass Ihr ihm helft.<n><n>Wichtig: In diesem Szenario herrscht Frieden zwischen den Nationen. Das bedeutet, Ihr dürft niemals einen Konvoi einer Nation angreifen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Besucht den Gouverneur von @T$TOWN$ und nehmt den Auftrag an, den er Euch erteilt."
