"0x080f2b29" = "<ts:20>Was Ihr über Waren wissen solltet:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Es gibt fünf verschiedene Warenarten: Bedarfsgüter, Rohstoffe, Fertigwaren, Kolonialwaren und Importwaren<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Jede Stadt kann fünf Waren produzieren<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Es gibt zwei Arten von Städten: Kolonialstädte und Städte mit einem Gouverneur oder Vizekönig<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Gouverneursstädte produzieren Bedarfsgüter und Fertigwaren. Außerdem erhalten sie regelmäßig Lieferungen von Importwaren aus Europa. Diese Städte sind daher die besten Orte, um Fertigwaren und Importwaren zu finden.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Gouverneursstädte brauchen Rohstoffe, um Fertigwaren zu produzieren. Sie nehmen außerdem Kolonialwaren auf. Diese werden von den Transportkonvois aus Europa eingesammelt.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Kolonialstädte produzieren Bedarfsgüter, Rohstoffe und Kolonialwaren. Jede Kolonialware kann nur in bestimmten Gebieten der Karibik produziert werden. Kaffee zum Beispiel gibt es nur im Süden und Westen der Karibik.<n><n>Was Ihr über Preise wissen solltet:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Je größer die Nachfrage nach einer Ware und je kleiner ihr Angebot in einer Stadt, desto höher ist der Preis.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Je besser Euer Ansehen bei einer Nation, desto niedriger der Preis, zu dem Ihr Waren in Städten dieser Nation kaufen könnt.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Ihr solltet Waren nur in den Städten kaufen, in denen sie produziert werden.<n><n>Der schnellste Weg zum Geld:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Kolonialwaren und Rohstoffe in Kolonialstädten kaufen<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>diese Waren in Gouverneursstädten verkaufen und dort Fertigwaren und Importwaren kaufen."
