"0x18d8e332" = "Ihr habt derzeit keine Kartenteile."
"0x1910fc69" = "Taste geändert."
"0x19251021" = "Wollt Ihr diesen großen Betrieb abreißen?"
"0x1936271b" = "Wollt Ihr für %1 einen Kaperbrief kaufen und im Namen Englands die Schiffe unserer Feinde jagen?"
"0x194aca7e" = "Geheime Dokumente"
"0x19770fdc" = "Ihr habt die Waren nicht rechtzeitig geliefert."
"0x197fc8d6" = "Euer Betrieb"
"0x1993c83f" = "Eure Frau ist verschwunden. Sprecht mit dem Gouverneur!"
"0x19b399ce" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Dialog schließen/<n><t>Optionsmenü<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>Vorspulen<n><f:fonts/Tiepolo_black14x14aaFHk.res>Umschalt<f:fonts/Tiepolo_bold14x14aaFH.res><t>Konvoi zentrieren<n><f:fonts/Tiepolo_black14x14aaFHk.res>Feststelltaste<f:fonts/Tiepolo_bold14x14aaFH.res><t>Zentrierung ein/aus<n><f:fonts/Tiepolo_black14x14aaFHk.res>Pfeiltasten<f:fonts/Tiepolo_bold14x14aaFH.res><t>Bewegen<n><t>Fenster anzeigen<n><f:fonts/Tiepolo_black14x14aaFHk.res>STRG + 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Konvoi speichern<n><f:fonts/Tiepolo_black14x14aaFHk.res> 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Konvoi abrufen<n><f:fonts/Tiepolo_black14x14aaFHk.res> TAB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Nächster Konvoi<n><f:fonts/Tiepolo_black14x14aaFHk.res>+ / -<f:fonts/Tiepolo_bold14x14aaFH.res><t>Spielgeschwindigkeit<n><f:fonts/Tiepolo_black14x14aaFHk.res>F5 <f:fonts/Tiepolo_bold14x14aaFH.res><t>Schnellspeichern<n><t> (in Schlachten nicht verfügbar)"
"0x19c31f0b" = "Neuer Rang: %1"
"0x19c34763" = "Handelsroute laden"
"0x19c8d3d9" = "Euer Konvoi wurde gesegnet."
"0x19e2f378" = "%1: Mangel an Arbeitern"
"0x19f3d8a6" = "Nach Schiffsanzahl"
"0x19f413a1" = "In diesem Szenario habt Ihr weit mehr zu tun als im ersten. Ihr lernt, erfolgreich zu handeln und Eure ersten Handelsgewinne zu erzielen.<n><n>Außerdem stellt Ihr einen zweiten Konvoi zusammen, um mehr Waren transportieren zu können.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Lest die Hinweise im Ereignisfenster und folgt ihnen."
"0x1a106105" = "Der Konvoi hat noch keine Seeschlachten geführt."
"0x1a2ebe80" = "Leider habt Ihr keinen geeigneten Konvoi mehr im Hafen vor Anker. Der Konvoi muss aus genau 5 Schiffen bestehen und 150 Kanonen an Bord haben. Kommt wieder, wenn Ihr einen solchen Konvoi zusammengestellt habt."
"0x1a3808bb" = "Der Händler heißt @N$Name$ und seine Heimatstadt ist @T$Town$. Wenn es Euch gelingt, seinen Konvoi bis @D$EndDate$ zu vernichten, belohne ich Euch reichlich mit Waren."
"0x1a444b3b" = "Ich kann Euch nicht beauftragen, in meinem Namen eine Stadt einer anderen Nation zu erobern, denn derzeit befinden wir uns nicht im Krieg. Doch die Lage kann sich sehr schnell ändern. Kommt wieder zu mir, wenn es so weit ist."
"0x1a444b3c" = "Wir befinden uns im Krieg mit %1, und Ihr habt dafür gesorgt, dass %1 nur noch eine Stadt besitzt. Das können wir nicht hinnehmen, und daher kann ich Euch derzeit nicht mit der Eroberung einer Stadt beauftragen. <n><n>Doch kommt wieder, wenn sich die Lage ändert."
"0x1a444b3d" = "Gerne würde ich Euch beauftragen, eine Stadt von %1 zu erobern. Ich habe genug Militärkonvois, um jedes neu eroberte Gebiet zu schützen.<n><n>Doch ist %1 für ein solches Unterfangen noch zu stark.<n><n>Ihr könntet helfen, %1 zu schwächen, indem Ihr seine Militärkonvois vernichtet.<n><n>Dann kehrt zu mir zurück, und ich habe vielleicht einen Auftrag für Euch."
"0x1a444b3e" = "Gerne würde ich Euch beauftragen, eine Stadt von %1 zu erobern. Ich habe genug Militärkonvois, um jedes neu eroberte Gebiet zu schützen.<n><n>Doch ist %1 für ein solches Unterfangen noch zu stark.<n><n>Ihr könntet helfen, %1 zu schwächen, indem Ihr seine Militärkonvois vernichtet.<n><n>Dann kehrt zu mir zurück, und ich habe vielleicht einen Auftrag für Euch.<n><n><n>Die Stärke einer Nation könnt Ihr unter „Nationen“ in der Chronik prüfen. "
"0x1a5c88bd" = "Dialog"
"0x1a6b5eb5" = "Einstellungen"
"0x1a7b911b" = "Konvoibeladung"
"0x1a897c3d" = "Erfüllt einen weiteren Auftrag für den Gouverneur von @T$TOWN$."
"0x1aa57bbd" = "Ereignisse"
