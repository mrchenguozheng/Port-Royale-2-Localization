"0xd5328f24" = "In diesem Szenario müsst Ihr den berüchtigten Piraten Edward Teach, besser bekannt als Blackbeard, aufspüren und töten. Der Gouverneur von [town:Havana] gibt Euch verschiedene Anweisungen und unterstützt Euch bei Eurem Vorhaben.<n:25>In diesem Szenario könnt Ihr alle im freien Spiel gebotenen Möglichkeiten nutzen. Um das Szenario erfolgreich abzuschließen, müsst Ihr jedoch auch bestimmte Aufgaben erfüllen."
