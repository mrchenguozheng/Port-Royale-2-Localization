"0xed34fe04" = "Militärkonvoi"
"0xed5e6448" = "Meinen Dank für die Zerstörung dieses Piratenkonvois. Hier ist eine Belohnung von @g$GoldReward$.<n>Übrigens: Immer wenn Ihr einen Auftrag in meinem Namen erfüllt, verbessert sich automatisch Euer Ansehen bei meiner Nation.<n>Habt Ihr hingegen ein niedriges Ansehen bei meiner Nation, kann ich Euch leider keine Aufträge anvertrauen."
"0xed5e6449" = "Meinen Dank für die Zerstörung des Piratenkonvois. Hier ist eine Belohnung von @g$GoldReward$. Wenn das Glück uns hold ist, entdecken wir bald den Ort des Piratenverstecks. Dann können wir es zerstören."
"0xed6ee3f7" = "%1 wird befördert"
"0xed88c9e3" = "%1,<n><n>Ein Darlehen über %2 war am %3 fällig. Die Summe wurde heute eingezogen.<n><n>Der Schatzmeister von %4"
"0xeda0288d" = "Dialog schließen/Optionen"
"0xeda49c74" = "Baugenehmigungen"
"0xedad5b61" = "Ihr habt es nicht geschafft, die Bevölkerung von [town:Tortuga] bis spätestens 20 Tage nach dem Ende der Pest wieder auf @I$Pop$ zu bringen. <n><n>Sobald der Status einer Stadt „Aufschwung“ oder besser erreicht, können neue Arbeiter angeworben werden. Ihr könnt die Stadt mit neuen Arbeitern in Form von Siedlerfamilien versorgen. Diese reisen aus Europa in die Gouverneursstädte, wo sie auf eine Passage in andere Städte warten. Auch in Städten mit niedrigerem Status findet Ihr Siedler, die auf ihre Abholung warten."
"0xedc30aca" = "<ts:75><ts:150><ts:225><ts:300>Eine Rattenplage hat die Nahrung in Euren Lagerhäusern vernichtet. Rattenplagen treten häufig auf, wenn Händler zu viel Nahrung in ihren Lagerhäusern horten.<n><n>Verluste:"
"0xedffe567" = "Musketier wählen"
"0xee00c4df" = "<n><n>Normalerweise könnt Ihr eine erworbene Baugenehmigung zurückgeben. In diesem Fall geht das jedoch nicht, weil %1 die Stadt ist, in der Ihr das Spiel begonnen habt."
"0xee00c4e0" = "<n><n>Ein ansässiger Händler bietet Euch %1 für Eure Genehmigung und Eure Gebäude. Wollt Ihr das Angebot annehmen? Denkt daran, dass Ihr dann alle Eure Gebäude in dieser Stadt verliert."
"0xee0f745a" = "<g:INTEXT_SCHATZKISTE_800x600.screen>"
"0xee286d68" = "%1,<n>danke, dass Ihr eine der Städte unseres Feindes erobert habt. "
"0xee286d69" = "%1,<n>ich habe Euch bereits einen Auftrag gegeben. Erfüllt diesen Auftrag, denn ich habe noch mehr für Euch zu tun."
"0xee286d6a" = "%1,<n>Euer Auftrag war es, eine Stadt zu erobern, doch Ihr habt versagt. Ich hoffe, dass Ihr Euch beim nächsten Mal an unsere Abmachungen haltet."
