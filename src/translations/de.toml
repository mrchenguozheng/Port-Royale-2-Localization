"0x35f490c4" = "[riddle:answer=Providence;group=35f490c3+35f490c4;clue=Norden;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9]Wie in einer Wiege liegt hier eine Insel im Meer, und aus dem Norden legt sich eine Halbinsel schützend um sie her."
"0x35f490c5" = "[riddle:answer=Santa Marta;group=35f490c5;clue=Weißer Strand+Dschungel+nur die Sonne;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#ch23]Weißer Strand neben Dschungelgrün, ein kleiner Fluss, den niemand nennt – hier liegt sie versteckt im Sand, in einer Bucht, die nur die Sonne kennt."
"0x35f490c6" = "[riddle:answer=Maracaibo;group=35f490c6;clue=Sund+Bucht+Schiffen;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#ch5]Hier liegt die Stadt und überblickt den Sund; sie bewacht die Bucht, in der es von Schiffen wimmelt – und das mit gutem Grund."
