"0xd4cd0f3d" = "Henry Avery ist das beste Beispiel für einen erfolgreichen Piraten. Er kaperte die reichsten Schiffe seiner Zeit, entkam den Behörden und lebte lange genug, um seinen Reichtum zu genießen.<n><n>Averys frühe Jahre liegen im Dunkeln. Bekannt ist jedoch, dass er im Juni 1694 Maat auf dem Kaperfahrer Charles war, der von Spanien die Erlaubnis erhalten hatte, Schiffe der französischen Kolonie Martinique in Westindien zu kapern. Eines Tages führte er eine Meuterei an und übernahm das Schiff, woraufhin sich der Großteil der Mannschaft ihm anschloss. Das Schiff, ein schneller Kaper mit 46 Kanonen, wie geschaffen für die Rolle eines Piratenschiffs, wurde in Fancy umbenannt. 1695 gelang ihm seine größte Tat: die Plünderung der indischen Schatzflotte. Im Bündnis mit anderen Piraten griff er eine schwer bewaffnete indische Schatzflotte an und konnte zwei Schiffe kapern. Die Schiffe gehörten dem Großmogul selbst und waren mit unvorstellbaren Schätzen beladen. <n><n>Nachdem er den Gouverneur der Bahamas bestochen hatte, den Piraten Schutz zu gewähren, zahlte Avery die Mannschaft aus, die sich daraufhin in alle Winde zerstreute. Einige wurden in England gefasst, Avery aber segelte nach Irland, wo er spurlos verschwand. Wir können nur annehmen, dass er seinen Reichtum im Verborgenen weiter genoss."
"0xd4cd0f3e" = "Einer der bekanntesten Piraten aller Zeiten war Edward Teach (gestorben 1718), genannt Blackbeard, dessen Markenzeichen, wie der Name sagt, sein furchteinflößender schwarzer geflochtener Bart war. Mit einer Mannschaft von 300 Mann befuhr er die Weltmeere auf seinem Schiff Queen Anne’s Revenge, einem umgebauten niederländischen Handelsschiff, und scheute sich nicht, es mit Kriegsschiffen der Royal Navy aufzunehmen.<n><n>Über einen Zeitraum von 18 Monaten richtete Teach, geboren in Bristol, Verheerung an, vor allem im Norden Westindiens und entlang der Küste Nordamerikas. Zuflucht fand er stets auf den Bahamas und im verarmten North Carolina.<n><n>Ein weiterer Grund für seine Berühmtheit war, dass er dem Bild des furchterregenden, hitzigen und launischen Bukaniers entsprach: Er soll seinen Kanonier Israel Hands verstümmelt haben, indem er ihn zweimal erschoss, ohne anderen Grund, als der übrigen Mannschaft zu zeigen, wer das Kommando hatte.<n><n>Seine letzte Stunde schlug erst 1718, als der Piratenjäger Robert Maynard seine Schaluppe aufspürte. Obwohl er stark betrunken war, kämpfte Teach wie ein Dämon und wurde erst nach erbittertem Ringen besiegt. Er fiel im Kampf, und die meisten überlebenden Mitglieder seiner Mannschaft wurden gehängt."
"0xd4cd0f3f" = "Wer in den frühen Jahren des Zeitalters der Entdeckungen seinen vorhandenen Reichtum mehren wollte, fand in den seit Beginn des 16. Jahrhunderts vor allem in der Karibik entstandenen Zuckerplantagen ausgezeichnete Anlagemöglichkeiten.<n><n>Diese Investitionen brachten durchschnittlich zehn Prozent Gewinn und in den besten Fällen (etwa auf Barbados um 1650) bis zu 50 Prozent! Natürlich brauchten solche Plantagen riesige Zahlen von Arbeitskräften, und so wurden Hunderttausende von Sklaven aus Afrika dorthin verschifft. Denn der Weiße hatte inzwischen die indianische Bevölkerung an vielen Orten nahezu vollständig ausgerottet. <n><n>Die Europäer selbst ertrugen das Klima nicht, und ganz abgesehen davon waren sie sich zu vornehm für solche Plackerei. Selbst die Plantagenbesitzer zogen es vor, in London oder Madrid zu leben und ein paar ihrer Handlanger die Arbeit in den Kolonien organisieren zu lassen. Bis zum 18. Jahrhundert erreichte der schwarze Anteil der Bevölkerung auf manchen Inseln 90 Prozent!"
"0xd4cd0f40" = "Der Handel mit „schwarzem Gold“ hatte bereits im frühen 16. Jahrhundert begonnen. Bevorzugte Quelle der „Ware“ für die Sklavenhändler war die Küste Westafrikas zwischen dem Senegalfluss und dem heutigen Kamerun. Dieses Gebiet war nicht nur verkehrstechnisch ideal gelegen, es besaß auch eine stabile wirtschaftliche und soziopolitische Infrastruktur. Das bedeutete, dass die Seeleute nicht selbst Sklaven jagen mussten, sondern ihre Opfer bei den örtlichen Häuptlingen oder anderen Sklavenhändlern kaufen konnten.<n><n>Besonders begehrt waren junge Männer zwischen 15 und 35 Jahren, da sie vor allem für die harte Arbeit auf den Plantagen bestimmt waren. Etwa jeder fünfte Sklave überlebte die Überfahrt, die bis zu sechs Wochen dauern konnte, nicht einmal. Manche starben an der barbarischen Behandlung durch ihre Herren, andere kamen bei Unfällen auf See ums Leben. Angesichts dieser hohen Sterblichkeit versuchten die Sklavenhändler, jede Reise so einträglich wie möglich zu machen, indem sie so viele Sklaven wie möglich auf ihre Schiffe pferchten. Wochenlang lagen diese elenden Wesen wie Sardinen in der Dose nebeneinander, aneinandergekettet, im Dunkeln und mit kaum genug Luft zum Atmen.<n><n>Unter solchen Umständen ist es fast unglaublich, dass überhaupt jemand diese Reisen überlebte!  "
"0xd4cd0f41" = "Obwohl es in Nord- und Mittelamerika keine weißen Sklaven gab, fanden sich genügend Europäer, die unter Bedingungen arbeiteten, die sich von denen der Sklaven nur wenig unterschieden.<n><n>Viele junge Männer (vorwiegend aus den ungebildeten unteren Schichten) wollten auswandern, hatten aber kein Geld, um die Überfahrt zu bezahlen. Sie liehen sich das Geld für die Passage, mit der Abmachung, die Schuld anschließend durch eine bestimmte Zeit der Arbeit auf einer Zuckerplantage (oder ähnliches) abzutragen. <n><n>Doch die scheinbar völlig logische Abmachung hatte einen Haken: Viele Plantagenbesitzer versuchten, diese Vertragsarbeiter während ihrer Dienstzeit so hart wie nur möglich zu schinden. Hinzu kam das karibische Klima, das die meisten Europäer so schwer ertrugen.<n><n>Dieses System der „Vertragsarbeit“ wurde häufig auch für Sträflinge angewandt, die aus ihren Heimatländern ausgewiesen worden waren. Die Briten nutzten diese Methode später, besonders gegen die Inder, die sie zur Arbeit in den afrikanischen Kolonien zwangen."
"0xd4cd0f42" = "Als die amerikanischen Kolonien aufblühten, wuchs auch der Handel über den Atlantik. Großbritannien, die stärkste Seemacht seit den Zeiten Elisabeths, hatte großes Interesse daran, den Warenverkehr zu kontrollieren, damit die heimische Wirtschaft an den Handelsgewinnen teilhaben konnte.<n><n>Unter dem Lordprotektor Oliver Cromwell legte die „Erste Navigationsakte“ von 1651 fest, dass nur englische Schiffe Waren von den Kolonien nach Europa befördern durften. Diese Maßnahme richtete sich vor allem gegen die aufstrebende Macht Holland und kam der heimischen Handelsflotte zugute.<n><n>1663 wurden die Bestimmungen dieser Akte noch verschärft: Koloniale Schiffe, die Waren nach Europa bringen wollten, mussten englische Häfen anlaufen und dort einen Zoll zahlen. Dieser Versuch, den Handel zwischen den Kolonien zu kontrollieren, lief jedoch bald auf Grund. Da kaum zu erwarten war, dass das britische Heer die gesamte Küste bewachte, war das Ergebnis ein blühender Schmuggelhandel. <n><n>Genau dieser andauernde Konflikt mit dem Mutterland über die Bedingungen von Aus- und Einfuhr führte, besonders in den nordamerikanischen Kolonien, zur Herausbildung einer eigenen Identität der dortigen Siedler und wurde später zu einer wichtigen Triebkraft der Unabhängigkeitsbewegung."
"0xd4cd0f43" = "Der Beginn des kolonialen Zeitalters brachte zahlreiche Gesundheitsprobleme mit sich, die auf den bislang weit kürzeren Fahrten im Mittelmeer oder an der Küste weitgehend unbekannt gewesen waren. Eine Überfahrt in die Kolonien in der Karibik und in Nordamerika dauerte ein bis zwei Monate, oder noch länger, wenn das Schiff in Stürme oder Flaute geriet. Die Schwierigkeiten, die es zu überwinden galt, waren daher kaum überraschend: der Gestank schmutziger Kleidung und schlechter Körperpflege, verdorbene und verfaulte Nahrung, Mangel an sauberem Wasser, Ratten an Bord sowie die psychische Belastung durch Monotonie und Lagerkoller. Das furchtbare Gespenst des Skorbuts stand über jedem Seemann: Diese durch Vitaminmangel verursachte Krankheit zeigte sich im Verlust von Haaren und Zähnen und kostete viele Seeleute das Leben. Es war der Weltumsegler James Cook (1728-1779), der diese Krankheit erstmals erfolgreich bekämpfte. Er verlangte nicht nur, dass das Schiff sauber gehalten wurde, sondern gab seiner Mannschaft auch Sauerkraut und frisches Obst. Wer an Land ging, hatte zudem mit Tropenkrankheiten wie dem Schwarzwasserfieber zu tun, einer der gefährlichsten Formen der Malaria: Diese Infektion, deren Symptome ein schneller werdender Puls, Fieber, Schüttelfrost und dunkel gefärbter Urin sind, war fast immer tödlich."
"0xd4cd0f44" = "Hinter den vielen Namen, die Seefahrer und Kartografen für die neuen Landstriche, Flüsse und Siedlungen erfinden mussten, stecken interessante Anekdoten. Selbst der erste Name, den die europäischen Entdecker des Zeitalters der Entdeckungen in Amerika vergaben, erzählt seine eigene Geschichte. Christoph Kolumbus benannte die Insel, auf der er am 12. Oktober 1492 landete, Salvador („Erlöser“). Damit dankte er dem Herrn dafür, dass er den Konvoi auf der Hinreise vor Krankheit und Stürmen bewahrt hatte, und vor allem dafür, dass er eine Meuterei verhindert hatte, die buchstäblich in letzter Minute vor Sichtung des Landes auszubrechen drohte.<n><n>In der Folgezeit wählten die spanischen Konquistadoren meist Namen mit religiösem Bezug, etwa „Nombre de Dios“ („Name Gottes“) oder „Trinidad“ („Dreifaltigkeit“). In anderen Fällen ließen sich die Menschen vom Datum oder von der Beobachtung der Landschaft inspirieren. So benannten portugiesische Seeleute eine Bucht an der brasilianischen Küste, die sie am Neujahrstag 1502 entdeckten, „Januarfluss“ (Rio de Janeiro), und der Name der Stadt Montevideo verweist auf Magellans angeblichen Ausruf beim ersten Anblick der Küste: „Monte vido eu!“ („Ich sehe einen Berg!“).<n><n>Beliebt war es außerdem, Landstriche und Städte nach seinen Herrschern, seinem Mutterland oder der Stadt zu benennen, aus der man stammte. Das vermittelte der Außenwelt nicht nur einen klaren Anspruch auf Besitz, sondern schuf auch eine Verbindung zur Heimat, selbst in diesen weit entfernten Ländern.<n><n>Wenn alles andere scheiterte, konnte man immer noch auf Namen aus den indianischen Sprachen zurückgreifen (was die Kolonisatoren in den meisten Fällen allerdings nicht davon abhielt, die Indianer selbst anschließend zu vertreiben oder auszurotten).<n><n>Bis heute hält sich der Mythos, ein australischer Ureinwohner habe auf James Cooks Frage, wie dieses seltsame Beuteltier heiße, „kangooroo“ oder „ganguru“ geantwortet, was angeblich nur „Wovon reden Sie?“ bedeutete. Auch wenn es ein Mythos ist: Solche amüsanten Missverständnisse hat es sicher gegeben. <n><n>Man würde wohl staunen, wie viele Namen von Städten, Bergen und Flüssen schlicht „Guten Morgen!“, „Wie bitte?“ oder „Lasst mich in Ruhe!“ bedeuten ..."
"0xd4cd0f45" = "Mit dem Entstehen eines spanischen Weltreichs wurde es nötig, Kolonialbehörden mit ausreichenden Vollmachten zu schaffen, die sowohl den täglichen Verwaltungsaufwand als auch plötzlich auftretende Krisen bewältigen konnten. Zu diesem Zweck wurde den wichtigsten Gouverneuren in den Kolonien der Titel des Vizekönigs verliehen.<n><n>Auf dem Höhepunkt des Weltreichs gab es zwei solche Würdenträger, in Neuspanien (Mexiko) und in Peru. Die Vizekönigreiche Neugranada und Río de la Plata kamen im 18. Jahrhundert hinzu.<n><n> Zu den Pflichten eines Vizekönigs (auch virrey genannt), die er gemeinsam mit einem Verwaltungsrat namens Audiencia (und oft im Streit mit diesem) erfüllte, gehörten die üblichen Aufgaben eines Regierungsbeamten: Steuern erheben und einziehen, dafür sorgen, dass die Bevölkerung das Gesetz beachtete, die Verteidigung der Kolonie organisieren und so weiter. Er war zudem für den Schutz der indianischen Bevölkerung und für die Ernennung geringerer geistlicher und weltlicher Würdenträger verantwortlich.<n><n>Wegen der enormen wirtschaftlichen und politischen Bedeutung ihrer Überseegebiete behielt die Krone die Tätigkeit ihrer Vizekönige stets wachsam im Blick. Ihnen war jede zusätzliche Handelstätigkeit verboten, die ihnen ein zusätzliches Einkommen eingebracht hätte. Ganz abgesehen davon führte die Rivalität zwischen den Virreyes nur zur gegenseitigen Beschränkung ihrer Macht."
"0xd4cd0f46" = "Es ist hinlänglich bekannt, dass die europäischen Eroberer stets dem Ruf von Silber und Gold folgten. Fast wertvoller waren jedoch Gewürze. Es fällt schwer, sich vorzustellen, wie fade die europäische Kost des Mittelalters gewesen sein muss, wenn man bedenkt, welchen Gefahren Menschen sich aussetzten, um ein wenig Pfeffer oder Muskatnuss zu bekommen.<n><n>In dieser Hinsicht erwies sich die Entdeckung Amerikas zunächst als ausgesprochen enttäuschend. Man nahm die exotischen Tiere, die Christoph Kolumbus mitbrachte, interessiert zur Kenntnis, freute sich über die Erweiterung des Besitzes des eigenen Landes und über die vielen Seelen, die man durch die Ausbreitung des Christentums dort gerettet glaubte. Die Berge von Gold aber erwiesen sich als schwerer fassbar, als es versprochen worden war. Gewinnbringend wurden diese Fahrten erst zehn bis zwanzig Jahre später, als eine wahre Flut amerikanischen Silbers in Europa eintraf. <n><n>Auf einer dieser Fahrten brachte Kolumbus einen Schatz mit, der kostbarer war als alles Gold und Silber der ganzen Welt: Am 4. November 1492 reichten ihm die Einheimischen etwas, das er als einen Apfel beschrieb, der nach Kastanien schmecke. In diesem Augenblick wurde er der erste Europäer, der eine Kartoffel aß! Das indianische Wort für diese Pflanze war „batate“, und es lebt bis heute im englischen „potato“ weiter.<n><n>Vieles andere, was uns heute selbstverständlich erscheint, brachten Kolumbus und seine Nachfolger zuerst nach Europa: Tabak, Tomaten, Mais und die Hängematte. Oder, wie die Indianer sagten: „hamaka“ (woraus das englische Wort abgeleitet ist)."
"0xd4cd0fae" = "Seit ihrer Bekanntgabe beflügelte die Entdeckung der Neuen Welt die Fantasie der Menschen in Europa. Was für Geschöpfe mochten diese unerforschten Gebiete wohl beherbergen? Die unglaublichsten Gerüchte machten die Runde: Eine Insel sei von Kannibalen bevölkert, die nächste von kopflosen Wesen, deren Gesicht in den Bauch eingelassen sei.<n><n>Die südamerikanische Landschaft Patagoniens bedeutet grob „Land der Großfüßigen“, während der Amazonas seinen Namen einer Schar weiblicher Krieger verdankt, die den Entdeckern angeblich an ähnliche Kriegerinnen aus der griechischen Mythologie erinnerten.<n><n>Während einige dieser Gerüchte einen realen Hintergrund hatten, beruhten andere auf Missverständnissen und Fehldeutungen oder auf Geschichten, die die Indianer selbst irgendwo aufgeschnappt hatten.<n><n>Viele dieser Gerüchte waren jedoch schlicht das Produkt einer lebhaften Fantasie, und zumeist glaubten die Menschen sie nur, weil sie es wollten. Das erklärt, warum ganze Generationen von Konquistadoren nach dem legendären Jungbrunnen, dem Garten Eden und Eldorado, der Stadt aus Gold, suchten. Bestärkt wurden sie in ihrem Irrglauben von den Indianern, die ihnen ständig versicherten, von dem einen oder anderen Ort gehört zu haben, die aber nur Zeit gewinnen wollten, um diese gierigen Weißen tief ins Landesinnere zu locken und von ihren Schiffen abzuschneiden."
"0xd4cd0faf" = "Eine der schillerndsten Figuren in einer Liste von Entdeckern und Eroberern, die viele andere farbige Gestalten enthält, war der englische Schriftsteller und Abenteurer Sir Walter Raleigh (um 1554 – 1618). Erstmals hervor trat er 1580, als er einen Aufstand irischer Rebellen gegen die englische Besetzung niederschlug.<n><n>Er wurde ein Günstling Königin Elisabeths I. und nutzte seinen Einfluss, um eine Expedition zur Suche nach der legendären Stadt Eldorado in Südamerika zu finanzieren. Trotz des völligen Scheiterns mehrerer Expeditionen, die nichts von Wert fanden, gelang es ihm, die Unterstützung seiner Geldgeber in London zu behalten, indem er seine einzigartige Überredungskunst einsetzte. Er ließ sie glauben, der endgültige Preis liege stets nur jenseits der nächsten Flussmündung, und er könne unmöglich jetzt aufgeben.<n><n>Dennoch ging ihm der Kredit irgendwann aus. Zu oft hatten die Menschen seinen hochtrabenden Versprechungen gelauscht, um später zu erfahren, dass sie nichts als heiße Luft waren. Raleigh fiel schließlich bei Elisabeth in Ungnade. Ihr Nachfolger Jakob I. sah in diesem hitzigen Abenteurer eine Gefahr für seine gemäßigtere Außenpolitik und ließ ihn bei seiner Machtübernahme auf sehr schwacher Grundlage verhaften und zum Tode verurteilen. Das Urteil wurde umgewandelt (wohlgemerkt nicht aufgehoben!), und Raleigh wurde im Tower of London eingesperrt.<n><n>Jahre später, als der Zustand der Staatsfinanzen den König überzeugte, dass es nötig sei, erlaubte er Sir Walter Raleigh, eine weitere Expedition nach Guayana anzuführen. Eine absurde Situation: einem Mann, der selbst zum Tode verurteilt war, Vollmacht über Leben und Tod anderer zu geben und ihn zur Suche nach Gold auszusenden! Dieser Widerspruch löste sich jedoch bald danach von selbst, denn Raleigh, inzwischen von Fieber gezeichnet, erlebte noch, wie seine letzte Expedition scheiterte.<n><n>Bei seiner Rückkehr nach England beschloss der erzürnte König, dass Raleighs 1603 verfügter Aufschub der Hinrichtung nun enden sollte. Sir Walter Raleigh wurde kurz darauf hingerichtet.  "
"0xd4cd0fb0" = "Die ersten Begegnungen zwischen den Ureinwohnern der Neuen Welt und den weißen Seefahrern verliefen im Allgemeinen friedlich. An vielen Orten wurden die Europäer als Götter empfangen. Hier und da beruhte dieser Eindruck auf alten Mythen, doch zumeist waren die Indianer einfach beeindruckt von den großen blonden Fremden, die in schimmernden Rüstungen auf ihren „Wasserhäusern“ (Schiffen) anlandeten.<n><n>Kolumbus, Cortez und all die anderen Entdecker waren nur zu erfreut, diese Illusion aufrechtzuerhalten, doch die Indianer bekamen die brutale Wirklichkeit bald genug zu spüren: Getrieben von ihrer unersättlichen Goldgier, der „spanischen Krankheit“, wie die Indianer sie nannten, misshandelten, versklavten und massakrierten die Spanier ganze Völkerschaften. Der Anblick von Pferden, die es in Amerika bis dahin nicht gab, und der Klang der Kanonen lösten blanke Panik aus, und wer das Massaker überlebte, erlag bald den Pocken, der Grippe oder einer anderen eingeschleppten Krankheit.<n><n>Berühmte Gelehrte wie Gonzolo Oviedo oder Juan de Sepulveda versuchten, die von den Europäern begangenen Verbrechen mit blutrünstigen rassistischen Argumenten zu rechtfertigen, die die indianische Rasse als niedrig, unwissend und minderwertig darstellten.<n><n>Dieselben Männer, die Wissenschaftler und Hexen wegen ihres Glaubens auf dem Scheiterhaufen verbrannten, waren wahre Meister darin, schockierende Berichte über die „bestialischen Bräuche“ der Indianer zu verfassen: Götzendienst, Menschenopfer und Kannibalismus waren keineswegs erfunden, doch fortan nutzte der Weiße sie als pauschale Rechtfertigung dafür, den Indianern Sanktionen jeder Art und in brutalster Form aufzuerlegen."
"0xd4cd0fb1" = "Wie allgemein bekannt ist, wurde die frühe Phase der Kolonisierung Amerikas von Spanien und Portugal betrieben. Später kamen Holland und, vor allem, England und Frankreich hinzu. Weit weniger bekannt ist, dass zahlreiche spanische Expeditionen nie unternommen worden wären, hätte es nicht ihre mächtigen deutschen Geldgeber gegeben.<n><n>Bis zum Jahr 1500 hatten sich Oberschwaben und besonders Augsburg zu einem der bedeutendsten Handels- und Finanzzentren Europas entwickelt. Von hier aus übten die Kaufmannsfamilien Fugger und Welser starken Einfluss auf die Weltpolitik aus. So war es ihre umfangreiche finanzielle Unterstützung, die König Karl von Spanien 1519 half, Kaiser von Deutschland zu werden. König Heinrich VIII. von England und viele der Päpste zählten Jakob Fugger den „Reichen“ gern zu ihren Freunden.<n><n>Natürlich hatten diese klugen Händler bei solcherart Unterstützung eigene Hintergedanken. Im Gegenzug erwarteten sie, Privilegien oder die Erlaubnis zur Beteiligung am königlichen Silberbergbau zu erhalten. Die Welser schafften es sogar, zeitweise einen Teil der Nordküste Venezuelas zu erwerben, wo sie Städte wie „Neuaugsburg“ gründeten und von wo sie mehrere Expeditionen auf (meist erfolglose) Schatzsuche ins Innere des Landes entsandten."
"0xd4cd0fb2" = "Durch die Eroberung der halben Welt konnte die spanische Krone einzigartige Gelegenheiten nutzen. Über mehrere Jahrhunderte hinweg, bis zum Untergang der großen amerikanischen Kulturen der Inka, Maya und Azteken und der Entdeckung gewaltiger Silberlager in Peru und Mexiko, schien Spaniens Stellung uneinnehmbar. Es scheint fast absurd, dass gerade dieser unermessliche Reichtum den Niedergang dieser Weltmacht herbeiführte.<n><n>Ein großer Teil der mit Schiffen nach Spanien gebrachten Schätze floss direkt in die Taschen jener Händler nördlich der Pyrenäen, die die Fahrten überhaupt erst finanziert hatten. Der Rest aber reichte noch aus, um das Preisniveau auf der Iberischen Halbinsel in die Höhe zu treiben. Dort begann man, über seine Verhältnisse zu leben: In einem Zeitalter, in dem die Fähigkeit, in großem Stil Hof zu halten, mehr galt als ein ausgeglichener Staatshaushalt, schenkte man kleinlichen Finanzfragen wenig Beachtung.<n><n>Waren wurden in ständig wachsenden Mengen auf fremden Schiffen eingeführt, weil man zu verfeinert geworden war, um sie selbst herzustellen. Selbst Ausrüstung und Vorräte für die Expeditionen nach Amerika lieferten die heimischen Händler nur selten. Stolz bemerkte man: Ganz Europa steht Spanien zu Gebote.<n><n>Doch der Silberstrom musste irgendwann versiegen, und das jähe Erwachen danach glich einem Kater nach durchzechter Nacht: Die Niederländer und die Briten versuchten, Spanien von den Weltmeeren zu verdrängen. Zahlreiche Religionskriege gegen die protestantischen „Ketzer“ und gegen die Türken hatten ungeheure Summen verschlungen, und das riesige Reich, in dem die Sonne nie unterging, hatte sich zu einem unbeherrschbaren Koloß entwickelt.<n><n> Die Krise war für alle im Jahr 1557 offensichtlich, als der neue spanische Herrscher Philipp II. zum ersten Mal den Staatsbankrott erklären musste. Das große Reich, das größere Schätze gehalten hatte als jedes Reich zuvor, war pleite."
"0xd4cd0fb3" = "Warum wird in Brasilien Portugiesisch gesprochen, während es in fast allen anderen Teilen Südamerikas Spanisch ist?<n><n>Nun, sowohl die Spanier als auch die Portugiesen, die den Seeweg nach Indien entlang der afrikanischen Küste entdeckt hatten, erkannten früh, dass ihre Zukunft jenseits der Ozeane lag. Jeder beobachtete den anderen eifersüchtig, um sicherzustellen, dass sie bei ihrer Jagd nach Waren, Untertanen und Land nicht in das Gebiet des anderen eindrangen.<n><n>Da es damals kein Völkerrecht gab, wandten sie sich im Streitfall an den Papst, den einzigen, dessen Autorität beide Nationen bereit waren zu unterwerfen. Die katholische Kirche ihrerseits hatte Interesse daran, dass Spanier und Portugiesen eifrig die Christianisierung der „Heiden“ in den unbekannten Ländern vorantrieben, statt ihre Kräfte darauf zu verwenden, einander das Leben schwer zu machen.<n><n>So wurde bei gemeinsamen Verhandlungen in Tordesillas (1494) und Saragossa (1529) vereinbart, dass die neu entdeckten Gebiete westlich eines bestimmten Längengrads Spanien und alle übrigen Portugal gehören sollten. Dieser Längengrad schnitt durch das damals noch unentdeckte Südamerika, sodass dessen östliche Seite, ein Teil des heutigen Brasilien, an Portugal fiel."
"0xd4cd0fb4" = "Wohl war es der römische Schriftsteller Polybios, der um 140 v. Chr. erstmals das Wort „Pirat“ (peirato) erwähnte. Seither wurden viele verschiedene Wörter für diese furchterregenden Seeräuber gebraucht: Korsaren, Freibeuter, Bukanier, Filibuster ... Die Männer um Klaus Störtebeker hießen „Vitalienbrüder“, und Bartholomew Roberts gab sich und seiner Bande mörderischer Schurken den recht harmlosen Titel „Gentlemen of Fortune“. Letztlich aber machte es dem Händler wenig Unterschied, wer da aus dem Nichts auftauchte, um sein Schiff anzugreifen. <n><n>Bukanier waren über die Jahrhunderte in jedem Winkel der Welt eine Geißel der Menschheit. In der Antike verbreiteten die kilikischen Piraten solchen Schrecken im gesamten Mittelmeer, dass das Römische Reich gezwungen war, regelmäßig Feldzüge gegen sie zu führen. Verborgene Inseln und zerklüftete Küsten nahe vielbefahrener Handelsrouten boten ideale Lagen für piratische Tätigkeit: Gegenden, in denen Riffe, Strömungen und schlechtes Wetter die schwerfälligen Handelsschiffe zu leichten Zielen machten, boten einen Zufluchtsort, in den man sich nach vollbrachter Tat schnell zurückziehen konnte. Die Küste Kleinasiens war in der Antike so gefürchtet wie die Karibik im Zeitalter der Entdeckungen, während die Piraten Südostasiens geradezu einen mythischen Status erlangten.<n><n>Nach der Herkunft des Wortes war ein „Bukanier“ eigentlich ein Seemann, der als Privatmann und nicht als Angehöriger der Marine zur See fuhr, um Beute zu suchen, und der daher als Pirat galt. <n><n>Die Ausstellung von Kaperbriefen verlieh jedoch einigen der karibischen Bukanier einen Schein der Legalität. Diese Dokumente wurden von englischen, französischen oder niederländischen Gouverneuren ausgestellt, und ihr Zweck war, die Geißel der Piraterie auf die gegnerischen Mächte zu lenken.<n><n> Wie leicht Kaperbriefe zu bekommen waren, hing vom jeweiligen Gouverneur ab. Der eine hielt es für unehrenhaft, mit Piraten einen Pakt zu schließen. Andere waren weniger skrupelhaft oder schlicht korrupt oder feige."
"0xd4cd0fb5" = "Die „sieben Weltmeere“ sind eigentlich nur drei (nämlich die drei Ozeane): der Nord- und der Südpazifik, der Nord- und der Südatlantik, das Nordpolarmeer und das Südpolarmeer sowie der Indische Ozean.<n><n> Der Pazifik verdankt seinen Namen der ersten Weltumsegelung durch Fernando Magellan, dem es vergönnt war, auf den vielen hungrigen Wochen der Überquerung dieses riesigen Ozeans günstiges Wetter anzutreffen.<n><n>Und noch etwas: Die Karibik hat ihren Namen von den „Kariben“, Völkern einer indianischen Sprachgruppe, deren Siedlungsgebiet sich von den Antillen entlang der Nordküste Südamerikas erstreckte."
"0xd4cd0fb6" = "Die Bermudainseln sind nach dem spanischen Entdecker Juan Bermúdez benannt, der sie 1503 entdeckte. Das bei allen Seeleuten berüchtigte Gebiet des „Bermudadreiecks“, in dem das Risiko mysteriöser Schiffsunglücke sehr hoch sein soll, umfasst eine Meeresfläche zwischen den Bermudainseln, Puerto Rico und Fort Lauderdale (Florida).<n><n>Manche behaupten, die seltsame Reihe unerklärlicher Ereignisse habe mit der Fahrt des Christoph Kolumbus begonnen: Der Genueser Seefahrer in spanischen Diensten befand sich mit seinen drei Schiffen am 14. September 1492 genau in diesem Gebiet, als seine Kompassnadel wild zu kreisen begann. Das lag am Unterschied zwischen geografischem Nordpol und magnetischem Nordpol. Am nächsten Tag erschien eine gewaltige Flamme am Himmel (möglicherweise ein Meteor).<n><n>Der Beiname „Bermudadreieck“ entstand jedoch erst nach dem Zweiten Weltkrieg, nach einer Reihe von Flugzeugunglücken, die die Aufmerksamkeit der Öffentlichkeit auf dieses Gebiet im Südwesten des Nordatlantiks lenkte.<n><n>Anhänger mysteriöser Ereignisse verweisen auf mehr als 200 angeblich ungeklärte Unfälle, wobei sie die Grenzen recht großzügig auslegen. Die meisten dieser Ereignisse, von denen eine große Zahl gar nicht in diesem Gebiet stattfand, haben eine vollkommen logische Erklärung."
"0xd4cd0fb7" = "Die legendäre spanische Schatzflotte, die regelmäßig von Amerika nach Spanien auslief, weckte auch jenseits der Iberischen Halbinsel allerlei Begehrlichkeiten. Vor allem das ehrgeizige England sah darin eine Gelegenheit, Spaniens Rolle als Herrin der Meere und Königin der Welt streitig zu machen.<n><n>Da das Inselkönigreich noch zu schwach war, um groß angelegte Feldzüge zu führen, war es weit sinnvoller, den Rivalen außerhalb Europas anzugreifen, weit entfernt, wo er weder einen Angriff erwartete noch eine Warnung davor erhalten würde. Dort konnte man sein Opfer bequem ausplündern und dann einfach verschwinden, und in Europa würde monatelang niemand davon erfahren.<n><n>Kühnen Kapitänen, deren berühmtester Francis Drake (1540-1596) war, stellte Ihre Majestät Elisabeth I. Kaperbriefe aus. Diese Kaperbriefe glichen einer Art Blankoscheck und waren eine Lizenz zum Plündern, die Drake und seine Gefährten über die Ebene gewöhnlicher Bukanier erhoben und ihnen den Status privater Raubbarone im Dienst einer höheren Autorität verliehen. Sie machten ihre Sache ausgezeichnet. Nirgends waren iberische Schiffe und Garnisonen sicher.<n><n>1578 durchfuhr Francis Drake die Magellanstraße und brach wie ein Wirbelsturm zur Jagd auf spanische Beute die Pazifikküste Amerikas entlang auf. Niemand hatte dies je zuvor gewagt! Bei seiner Rückkehr in den Hafen von Plymouth im Jahr 1580 war Drake nach Magellan der zweite Kapitän, der die Welt umsegelt hatte. <n><n>König Philipp von Spanien kochte unterdessen vor Wut und schwenkte den Vertrag von Tordesillas, mit dem Seine Heiligkeit der Papst 1494 unnachgiebig erklärt hatte, die westliche Hemisphäre liege in Spaniens Einflusssphäre. – Doch wie sollte solcherart Protest auf diese eigenartige Inselnation protestantischer Ketzer wirken, die die Autorität des Papstes in Rom vollständig verwarf und die sogar bis 1753 den modernen Gregorianischen Kalender nicht übernahm, nur weil er im Auftrag Papst Gregors 1582 entwickelt worden war?<n><n>Wieder einmal schien die Sache nur mit Krieg lösbar. Philipps Armada segelte 1588 nach England, doch unter dem Kommando Sir Francis Drakes, der inzwischen zum Ritter geschlagen worden war, und mit Hilfe mehrerer rechtzeitiger Stürme gelang es den Engländern, die spanische Flotte zu vernichten. Hunderte Jahre danach wagte niemand mehr, Großbritanniens Stellung als führende Seemacht anzufechten."
"0xd4cd101f" = "Zweifellos gehören die Fahrten des Christoph Kolumbus (1451-1506) nach Amerika zu den größten Abenteuern, die die Menschheit je unternommen hat. Selbst ein Schriftsteller hätte kaum gewagt, eine solche Geschichte voller dramatischer Ereignisse und seltsamer Zufälle zu erfinden.<n><n>Zwar hatte der Genueser Seefahrer das spanische Königspaar Isabella und Ferdinand von seiner Idee überzeugt, es gebe einen westlichen Seeweg nach Indien, doch auf die Zustimmung der Mannschaft an Bord konnte er gewiss nicht zählen. Tatsächlich wurde der Großteil der Besatzung zwangsverpflichtet: Als Strafe für Vergehen gegen die Krone musste die Stadt Palos zwei Schiffe samt Besatzung stellen.<n><n>Die Nachricht von Kolumbus' Plan rief Entsetzen hervor. Die Mannschaft war fest überzeugt, unter dem Kommando eines Wahnsinnigen zu segeln, der nur Verderben über sich und alle, die mit ihm fuhren, bringen konnte.<n><n>Kolumbus' größter Feind aber war der Aberglaube: Jede erdenkliche Schauergeschichte schien an Bord gelangt zu sein, und jedes seltsame oder unheimliche Ereignis bestärkte die Ängste der Seeleute: Bei der Vorbeifahrt an Teneriffa brach ein Vulkan aus, dann sahen sie Feuersäulen am Himmel, und sogar die Kompassnadel schien der Mannschaft Streiche zu spielen. Lag das Schiff in der Flaute, galt das als böses Omen. Andererseits: Wenn sie gut vorankamen, hieß das, dass der Wind stets von Ost nach West wehte und sie niemals würden umkehren können.<n><n>Vielfach schien eine Meuterei unausweichlich. Eines Nachts hörte der Kapitän Schritte und Gemurmel vor seiner Kajüte, und erst als er laut zu beten begann, verloren die Attentäter den Mut und schlichen davon.<n><n>Die schwersten Krisen brachen stets dann aus, wenn sich das, was am Horizont wie eine Insel ausgesehen hatte, erneut nur als optische Täuschung entpuppte. Genau ein solcher Vorfall brachte am 10. Oktober die Sache zum Äußersten. Mit großer Mühe handelte Kolumbus ein Ultimatum von drei Tagen aus, nach dem die Mannschaft umkehren wollte (möglichst ohne ihren Kapitän). Doch das Schicksal wollte es anders: Sie sichteten tatsächlich innerhalb dieser drei Tage Land. Keiner der Anwesenden hätte es erträumt, dass sie nicht auf Asien, sondern auf einen völlig neuen und unbekannten Kontinent gestoßen waren.<n><n>Japan und China lagen noch Tausende Seemeilen entfernt, und nur dem unglaublichen Glück, dass ein fremder Kontinent auf ihrem Weg lag, verdankte Kolumbus' Expedition ihr Überleben. Die Moral der Mannschaft hob sich sofort. Keiner von ihnen konnte sich erinnern, je Meutereigedanken gehegt zu haben ..."
"0xd4cd1020" = "Christoph Kolumbus hatte zwar einen neuen Landstrich entdeckt (genauer: wiederentdeckt, hatten doch die Wikinger bereits im Mittelalter amerikanischen Boden betreten), doch er verkündete fälschlich, er habe einen Seeweg nach Indien gefunden.<n><n>Während der Vorbereitung seiner zweiten und dritten der vier Fahrten arbeitete der Genuese mit Amerigo Vespucci aus Florenz zusammen. Dieser war es, der erstmals die Ansicht vertrat, dass diese Länder im Westen tatsächlich zu einem neuen und unbekannten Kontinent gehörten. Diese spektakuläre Erkenntnis entfachte das öffentliche Interesse neu, und wo immer man über diese neuen Gebiete sprach, fiel gewiss der Name Vespucci.<n><n>Christoph Kolumbus' Stern hingegen sank. Inzwischen hatte man ihn nach Klagen der karibischen Siedler sogar in Ketten nach Hause geschickt, und sein Tod als verbitterter und kranker Mann im Jahr 1506 erregte nicht die Aufmerksamkeit, die er verdient hätte. Es überrascht daher kaum, dass der süddeutsche Kartograf Martin Waldseemüller sich ein Jahr später, als er einen Namen für diese unbekannten Länder vorschlagen wollte, vom populären Namen Amerigo Vespuccis inspirieren ließ. <n><n>Waldseemüllers Name wurde von seinen Kollegen übernommen. Gerechter wäre es gewesen, den Kontinent „Columbia“ zu taufen."
"0xd4cd1021" = "Der erste Teil Amerikas, der unter den Spaniern zu großer Bedeutung gelangte, war Hispaniola. Christoph Kolumbus hatte hier bereits 1493 die erste europäische Siedlung gegründet, obwohl sie von Indianern ausgelöscht worden war, noch bevor er aus Europa zurückkehrte.<n><n>In den folgenden Jahren übernahm die spanische Krone zunehmend die Kontrolle über diese Insel. Das erste Kloster und die erste Kathedrale wurden errichtet, und hier entstand auch jenes Gesellschaftssystem, das später auf die anderen Gebiete ausgedehnt werden sollte: eine Sklavenhaltergesellschaft, streng in Klassen geschieden und eng mit der katholischen Kirche verbunden.<n><n>Hispaniola schien riesige Möglichkeiten zu bieten und zog viele unternehmungslustige Siedler über den Ozean. <n><n>Doch schon bald richtete Spanien seine Aufmerksamkeit auf andere Regionen: Inzwischen waren die großen Reiche des Kontinents entdeckt und erobert. Dort ließ sich leichter herrschen, die Gold- und Silbervorkommen waren reicher und leichter abzubauen.<n><n>Wie ein beiseite geworfenes Spielzeug verlor Hispaniola das Interesse. Niederländische, englische und französische Piraten griffen abwechselnd an. 1697 übernahmen die Franzosen Saint Domingue, den westlichen Teil der Insel (heute Haiti), und errichteten eine einträgliche Plantagenwirtschaft. Die Produktion von Kakao, Zucker, Indigo, Baumwolle und Kaffee machte Saint Domingue im 18. Jahrhundert zur einträglichsten Kolonie der Neuen Welt.<n><n>Der einzige erfolgreiche Sklavenaufstand der Geschichte, der infolge der Französischen Revolution ausbrach, führte schließlich 1804 zur Unabhängigkeit Haitis. Die Rebellen behandelten ihre einstigen Unterdrücker ganz so, wie man sie selbst behandelt hatte: „Für die Erklärung der Unabhängigkeit brauchen wir die Haut eines Weißen für das Pergament, seinen Schädel als Tintenfass, sein Blut als Tinte und ein Bajonett als Feder“, verkündete damals der schwarze General Boisrond-Tonnerre."
"0xd4cd1022" = "Ein typisches karibisches Produkt, wenngleich von fraglichem Nutzen für die Menschheit, ist der Rum. Dieser aus Zuckerrohrmelasse gebrannte Schnaps, der ursprünglich den farbigen Namen „Teufelstöter“ trug, wurde 1650 auf Barbados erstmals erwähnt. Als legendäres Lieblingsgetränk der Piraten verbinden die meisten Menschen Rum mit der Insel Jamaika, einem der gefürchtetsten Piratennester aller Zeiten. <n><n>Sklavenhändler verkauften die an der afrikanischen Küste eingekaufte Menschenware in der Karibik gegen große Mengen Melasse. Diese Melasse wurde in Neuengland zu Rum veredelt und dann mit denselben Schiffen nach Afrika gebracht. Dort wurde der Schnaps verkauft, und die leeren Schiffe lud man mit frischer Sklavenfracht. Mit diesem verderblichen „Dreieckshandel“ sorgten die Reedereibesitzer dafür, dass ihre Schiffe auf jeder Fahrt voll beladen waren."
"0xd4cd1023" = "Nach Kuba ist Jamaika wohl die berühmteste der Karibikinseln. Ihr Name leitet sich vom Arawak-Wort Xymaca ab, das etwa „Land von Holz und Wasser“ bedeutet. Christoph Kolumbus selbst, der die Insel neun Jahre zuvor entdeckt hatte, hatte reichlich Gelegenheit, die Schönheit der Landschaft und die Freundlichkeit ihrer Bewohner zu erleben, als sein Schiff 1503 vor der Nordküste Schiffbruch erlitt.<n><n>Er mochte sie so sehr, dass er den gesamten Besitz der Insel vom König von Spanien übertrug und sie zu seinem Eigentum erklärte. Trotzdem blieb dieses Inselparadies in den folgenden Jahrzehnten recht vernachlässigt, bis es 1655 von den Briten eingenommen wurde. Zu diesem Zeitpunkt lebten nur noch sehr wenige Arawak, denn ihr Stamm erwies sich als besonders anfällig für die von den Europäern eingeschleppten Krankheiten.<n><n>1661 wurde Edward D'Oyley zum Generalkapitän und Gouverneur von Jamaika ernannt. Unter seiner Herrschaft wurde die Hauptstadt Port Royal in einen lebhaften, schwer befestigten Zufluchtsort für Piraten verwandelt. Sie galt als „reichster und verderbtester Ort der Erde“, und viele der Einwohner, sonst gewöhnliche Händler, taten sich häufig zusammen, um in spanischen Gewässern private Raubzüge zu unternehmen. Zunächst zeigte die britische Regierung wenig Neigung, diesem Treiben Einhalt zu gebieten, hielten die Bukanier doch immerhin ihre spanischen Rivalen in Schach.<n><n>Erst als Sir Henry Morgan das Gouverneursamt antrat (bemerkenswert, war er doch selbst einst Pirat), kehrten Kultur und Ordnung nach Jamaika zurück. Morgan unterdrückte die Piraterie rücksichtslos und zögerte nicht, seine früheren Gefährten an den Galgen zu schicken.<n><n>Kaum aber war die britische Herrschaft wiederhergestellt, wurde neben dem Zuckerrohranbau eine neue und einträgliche Einnahmequelle entdeckt: Nach 1672 entwickelte sich Port Royal zum größten Sklavenmarkt der Welt, nachdem die englische Royal African Company ein Monopol errichtet hatte."
"0xd4cd1024" = "Nur zwei Wochen nach seiner Ankunft in der Neuen Welt erreichte Christoph Kolumbus Kuba, die größte Insel Westindiens. Hier lebten mehrere Stämme, die Ciboney, die Guanahatabey und die Tainos, die trotz ihrer friedlichen Art alle dasselbe unglückliche Schicksal erlitten wie andere Indianerstämme: 1511 wurden sie nach einem vierjährigen Krieg gegen die Spanier unterworfen und ausgerottet. Das führte dazu, dass in großer Zahl schwarze Sklaven hierher gebracht wurden. Die Insel mit ihrer Hauptstadt Havanna war in sieben Verwaltungsbezirke (cabildos) eingeteilt, von denen jeder einen Abgeordneten in einen besonderen Rat entsandte. Der Abgeordnete hatte die Aufgabe, die örtlichen Interessen des Bezirks zu vertreten.<n><n>Bemerkenswert an der Geschichte Kubas ist, dass die Insel, abgesehen von einem kurzen britischen Zwischenspiel 1762 bis 1763, verhältnismäßig lange in spanischer Hand blieb. Das mag daran liegen, dass Kuba in der Kolonialzeit nicht zu den wichtigsten Gebieten des spanischen Reichs zählte (es gab dort zum Beispiel kaum Bodenschätze) und allgemein als Zwischenstation auf dem Weg zum Kontinent diente. Jedenfalls gelang es den Spaniern, während die weitaus meisten Länder Süd- und Mittelamerikas im ersten Viertel des 19. Jahrhunderts ihre Unabhängigkeit erkämpften, Kuba bis 1898 zu halten, als sie die Kontrolle über die Insel an die Vereinigten Staaten abtraten."
"0xd4cd1025" = "Es ist bekannt, dass vieles, was uns heute selbstverständlich ist, erst durch den Handel mit Amerika nach Europa kam. Doch der kulturelle Austausch wirkte auch in die andere Richtung.<n><n> Wenn man sich den typischen Indianer der nordamerikanischen Prärien vorstellt, fällt es schwer zu glauben, dass es in Amerika vor der Ankunft der Spanier und Portugiesen keine Pferde gab. Viele Indianer flohen in blinde Panik, als sie zum ersten Mal ein Pferd mit Reiter sahen, denn sie hielten es für ein seltsames Tier aus zwei Wesen, die zu einem zusammengewachsen waren.<n><n>Kaffee, den man gewöhnlich mit Ländern wie Brasilien und Guatemala verbindet, ist in Amerika nicht heimisch und hatte vor seiner Ankunft dort bereits drei Kontinente bereist: Von Afrika (wohl aus Äthiopien) ging er über die arabischen Länder nach Südwesteuropa. Die Pflanze wurde erst im 18. Jahrhundert in Amerika eingeführt, als die wachsende Beliebtheit des Getränks eine Ausweitung des Anbaus nötig machte.<n><n>In der Kartoffel hatten die Europäer in der Karibik ein Grundnahrungsmittel von unvorstellbarem Wert entdeckt. Umgekehrt war Weizen in Amerika unbekannt, bis die Spanier und die Engländer kamen, die diese Feldfrucht 1520 nach Mexiko bzw. 1777 nach Virginia brachten. Obwohl man ursprünglich meinte, das amerikanische Klima tauge nicht zum Weizenanbau, war es gerade Nordamerika, wo diese Frucht den phänomenalsten Erfolg erlebte. Heute ist Weizen die landwirtschaftliche Kultur mit der größten Anbaufläche der Welt."
"0xd4cd1026" = "Könnt Ihr Euch ein Leben ohne Schokolade vorstellen? Eigentlich solltet Ihr es können, denn Kakao war vor der Entdeckung Amerikas im übrigen Teil der Welt unbekannt. Das Wort Kakao stammt wohl aus der Maya-Sprache, in der es sich zuerst nachweisen lässt: Es gilt als sicher, dass Maya-Händler bereits 400 Jahre vor Christus Kakao tranken.<n><n>Die Azteken, seit dem 14. Jahrhundert die herrschende Macht auf dem mittelamerikanischen Festland, verliehen dem Kakao sogar religiöse Bedeutung. Der erste Europäer, der mit dieser Köstlichkeit in Berührung kam, war wiederum Christoph Kolumbus, allerdings auf einer späteren Fahrt, die ihn 1502 nach Nicaragua führte.<n><n>Der rechtmäßige „Entdecker“ des Kakaos ist jedoch Hernán Cortés, der Eroberer des Aztekenreichs, der das Rezept für ein Getränk namens xocoatl (daher das Wort „Schokolade“) nach Spanien brachte. Der Geschmack war für den europäischen Gaumen zunächst zu bitter, und erst als man begann, Zucker oder Vanille hinzuzufügen, wurde die heiße Schokolade bei der iberischen Oberschicht zum beliebten Getränk.<n><n>Fast hundert Jahre lang behielten die Spanier das Rezept für sich, danach verbreitete sich die heiße Schokolade über Frankreich im übrigen Europa. Um das Jahr 1700 fügten die Briten Milch hinzu. Den endgültigen Durchbruch des Kakaos in Europa brachte die Entdeckung, wie köstlich Kaffee und Kakao zusammen schmecken."
"0xd4cd1027" = "Obwohl es manchmal schwerfällt, bei der Piraterie zwischen Wirklichkeit und Legende zu unterscheiden, ist unbestreitbar, dass es Piratinnen gab. Zwei der schillerndsten Gestalten schlugen diesen Weg im frühen 18. Jahrhundert auf der Insel Jamaika ein.<n><n>Anne Bonny, die als Kind angeblich in den Bauch gestochen wurde, war mit einem Seemann in das Piratennest New Providence (Nassau) durchgebrannt. Dort gelang es ihr, ihren Mann loszuwerden und ihre eigene Laufbahn auf einem gekaperten niederländischen Schiff zu beginnen. <n><n>Dort traf sie Mary Read, die bereits als Mann verkleidet in den spanischen Erbfolgekriegen gekämpft hatte und die angeblich ihren Gegnern vor dem Töten die Brust entblößte, um ihnen zu beweisen, dass sie von einer Frau besiegt worden waren.<n><n>Nach ihrer Gefangennahme im Jahr 1720 entgingen sie nur deshalb dem Galgen, weil sie schwanger waren. Ihnen erging es besser als den meisten ihrer männlichen Gefährten, über die Anne Bonny nur Spott ausgießen konnte.<n><n>Hier ihre Worte an den berüchtigten „Calico Jack“ auf seinem Weg zum Galgen: „Es tut mir leid, dich hier zu sehen, Jack, aber hättest du nur wie ein Mann gekämpft, dann müsstest du nicht hier stehen und wie ein Hund aufgehängt werden“."
"0xd4cd1028" = "Der Waliser Bartholomew Roberts (1682? – 1722) war nicht nur einer der bedeutendsten Piraten, sondern auch ein sehr ungewöhnlicher. Auch als „Black Bart“ bekannt (nicht zu verwechseln mit „Blackbeard“, alias Edward Teach), wurde er erst spät, mit 37 Jahren, zum Piraten, wobei der Übergang ins Verbrechen zweifellos fließend war: Das Schiff, auf dem er arbeitete und das 1719 von seinem Landsmann Howell Davis angegriffen wurde, war tatsächlich ein Sklavenschiff.<n><n>Roberts entschied sich, sein Los mit Davis zu verbinden, und nachdem dieser wenige Wochen später ermordet worden war, übernahm er die Rolle des Kapitäns. Bartholomew Roberts soll Alkohol gemieden und Tee bevorzugt haben.<n><n>Anders als Teach, der sich als leibhaftiger Teufel inszenierte, hatte Roberts eine Schwäche für feine Kleidung, mochte kein Glücksspiel und bestand darauf, dass seine Männer ihre Gebete sprachen. Das bedeutete allerdings keineswegs, dass Roberts im Herzen ein frommer Mann war. Es gibt zahlreiche Berichte über Grausamkeiten, besonders gegen Gefangene, bei seinen unzähligen Raubzügen. Mit einer Beute von über 400 Schiffen und einem Operationsgebiet von Brasilien bis nach Neufundland und Westafrika war er neben Henry Morgan einer der erfolgreichsten Piraten Mittelamerikas. <n><n>Der Kanonendonner eines britischen Kriegsschiffs vor der Küste Guineas im Jahr 1722 bedeutete das Ende seiner Laufbahn und die Beseitigung einer der größten Geißeln der sieben Weltmeere."
"0xd4cd1090" = "Der berühmteste Bukanier des 17. Jahrhunderts war der Waliser Henry Morgan (1635-1688), der die spanischen Kolonien in Westindien heimsuchte und damit die Autorität der großen iberischen Macht in der Region in ihren Grundfesten erschütterte.<n><n>Sein Leben ist ein Beispiel für die recht fragwürdige Moral hinter der Politik Britanniens, Hollands und Frankreichs, die nur zu gern ein Auge auf die Piraterie zudrückten, solange sie den anderen Großmächten Schaden zufügte.<n><n>Henry Morgan, der 1668 das Kommando über ein Bukanierschiff erhielt, begann zunächst, an der Nordküste Südamerikas zu wüten. Mit fast 2.000 Mann eroberte er im August 1670 die schwer befestigte Stadt Panama und entwich auf der Rückfahrt mit dem Großteil der Beute. Weil der Angriff jedoch nach der Unterzeichnung eines Friedensvertrags zwischen Spanien und England erfolgte, wurde er gefangen genommen und in London vor Gericht gestellt.<n><n>Morgan wurde nicht verurteilt, im Gegenteil: Es dauerte nicht lange, bis die Winde der Diplomatie wieder drehten. Morgan wurde nicht nur begnadigt, sondern zum Ritter geschlagen. Als Sir Henry wurde er zum neuen Gouverneur von Jamaika ernannt, wo er strenge Ordnung durchsetzte und die letzten Jahre seines Lebens als wohlhabender und angesehener Plantagenbesitzer verbrachte."
"0xd4cd1091" = "Die Bahamas, die Mitte des 17. Jahrhunderts kurze Zeit als Zuflucht für religiöse Abweichler aus England dienten, standen ab 1670 offiziell unter der Kontrolle des Earl of Albemarle und anderer Herren, die die Inselgruppe von König Karl II. erworben hatten, um Gewinn daraus zu schlagen.<n><n>Entgegen ihren Versprechen zeigten diese Personen jedoch wenig Interesse daran, eine geordnete bürgerliche Verwaltung einzurichten. Das Gegenteil war der Fall: Ähnlich wie an anderen Orten der Karibik siedelten sich Scharen von Piraten auf den Bahamas an, besonders auf der Insel New Providence, wo die Stadt Nassau lag. <n><n>Die flachen Buchten, in die schwere Kriegsschiffe nicht eindringen konnten, boten Hunderten von Schaluppen und Piratenbarken einen idealen Liegeplatz. Die häufigen Raubzüge in spanischen Gewässern führten zu Vergeltungsmaßnahmen, und John Wentworth, der erste Gouverneur, hatte die undankbare Aufgabe, auf den Inseln wieder Recht und Ordnung durchzusetzen.<n><n>Da die Lage keine Besserung erkennen ließ, konfiszierte König Georg I. von England die Bahamas erneut und machte sie zur Kronkolonie. Woodes Rogers, der frühere Bukanier und Weltumsegler, wurde Mitte 1718 zum ersten königlichen Gouverneur ernannt.<n><n>Mit Zuckerbrot und Peitsche beendete er das bis dahin herrschende Chaos. Er stellte allen Piraten, die bereit waren, unter Eid ihrem Treiben zu entsagen, eine allgemeine Amnestie in Aussicht. Auf alle, die dazu nicht bereit waren, wartete die Strafe in Gestalt einer Flotte bis an die Zähne bewaffneter Schiffe.<n><n>Nachdem auf diese Weise normale Verhältnisse wiederhergestellt waren, erhielt die Inselgruppe 1729 ihr eigenes Parlament, und in den folgenden hundert Jahren blieb die Geschichte der Bahamas, abgesehen von gelegentlichen Störungen durch Invasionen, verhältnismäßig ereignislos."
"0xd4cd1092" = "Fast überall in ihren neu erworbenen Kolonien errichteten die Spanier ein starres Gesellschaftssystem, das kaum Aufstiegsmöglichkeiten bot. Ganz oben in der Hierarchie standen jene in Europa geborenen Landsleute.<n><n> Die in den Kolonien geborenen Spanier hießen Kreolen. Obwohl sie in der Hierarchie nur als zweitrangig galten, besetzten sie die meisten der geringeren Stellen in Staat, Kirche und Heer.<n><n>Spanier europäischer Abstammung und Kreolen bildeten daher die Elite der Kolonien. Die Kinder gemischter Ehen zwischen Weißen (meist Männern) und Indianerinnen hießen Mestizen. Die Indianer, denen das Land ursprünglich gehörte, standen ganz unten in der Gesellschaft, und in jenen Gebieten, wo sie von den Europäern vollständig ausgerottet worden waren, blieb diese Ehre den schwarzen Sklaven vorbehalten.<n><n>Die relativen Anteile dieser Klassen an der Bevölkerung unterschieden sich in den verschiedenen Regionen des spanischen Reichs stark. In Mexiko etwa bildeten die Mestizen den größten Teil der Bevölkerung. Auf vielen Inseln waren die schwarzen Sklaven in überlegener Zahl vorhanden (und der Gnade ihrer Herren ausgeliefert). Indianerstämme konnten sich auch in jenen Gebieten halten, wo Dschungel, Sümpfe und Bergregionen einen sicheren Rückzug boten, etwa in Bolivien oder Florida."
