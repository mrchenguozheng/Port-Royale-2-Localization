"0xc9500bee" = "Herzlichen Glückwunsch! Ihr habt Euer Ziel erreicht und mehr Geld verdient. Außerdem seid Ihr in einen höheren Rang aufgestiegen.<n><n>Euer Rang richtet sich stets nach Eurem Gesamtvermögen. Dieses umfasst Bargeld sowie Besitz wie Waren und Schiffe. Euren Reichtum könnt Ihr jederzeit im Logbuch unter „Erfolge“ einsehen. Dort erfahrt Ihr auch, wann Ihr den nächsten Rang erreicht.<n><n>Je höher Euer Rang, desto mehr Konvois könnt Ihr befehligen und desto mehr Städte könnt Ihr später mit Betrieben erschließen.<n><n>Da Ihr nun einen höheren Rang habt, solltet Ihr einen weiteren Konvoi zusammenstellen und weiterhandeln, um Euren Reichtum zu mehren.<n><n>Euren Reichtum könnt Ihr jederzeit abfragen, indem Ihr den Zeiger auf den blauen Balken stellt, der Euren Reichtum anzeigt und unter diesem Fenster eingeblendet wird. <n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Stellt einen zweiten Konvoi zusammen und steigert Euer Gesamtvermögen auf @g$GoldGoal$."
