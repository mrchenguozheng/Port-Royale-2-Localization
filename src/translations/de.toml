"0xfb64ad02" = "Ihr habt gewonnen "
"0xfbb36ec1" = "I must thank you once again, you have done so much for my nation. I shall reward you with additional land for your town %1. You will then own %2% of the district."
"0xfbb97bb9" = "Holt die Belohnung beim Gouverneur ab."
"0xfbbba36d" = "I have nothing further to say to you, other than this warning: watch out for the military convoys of my nation, for they are hunting you!"
