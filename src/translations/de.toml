"0x12b72f2f" = "Ihr habt %1 gewonnen."
"0x12bf2170" = "Ich habe nichts weiter mit Euch zu besprechen.<n>Verbessert Euer Ansehen bei meiner Nation, wenn Ihr mehr Geschäfte mit mir machen wollt."
"0x12c4aed2" = "Ihr erweist mir einen großen Gefallen. Alles ist in Ordnung, Ihr habt mir die @g$PriceBuy$ gezahlt. Trefft mich am Markt, und ich übergebe Euch @a$Amount$ @G$Goods$. Bringt die Waren danach bis @D$EndDate$ nach @T$Town$ und übergebt sie @N$DestName$."
"0x12e312db" = "Erneut haben wir einen Mangel an jenen Importwaren, die von den Transportkonvois aus @n$Nation$ geliefert werden. Könntet Ihr mir und meinen Freunden in dieser Sache helfen?"
"0x12e312dd" = "Der Krieg mit @n$HostileNation$ hat zu einem Mangel an Importwaren für die Kolonien in @n$Nation$ geführt. Da es in @n$HostileNation$ offenbar keine Engpässe gibt, könnten wir ihre Transportkonvois angreifen und die knappen Waren auf diese Weise beschaffen. Ihr könntet diese Aufgabe übernehmen. "
