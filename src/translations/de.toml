"0xfc3fdd9b" = "Ihr habt es nicht geschafft, die Bevölkerung von [town:Tortuga] wiederherzustellen.<n><n>Sobald der Status einer Stadt „Aufschwung“ oder besser erreicht, können neue Arbeiter angeworben werden. Ihr könnt die Stadt mit neuen Arbeitern in Form von Siedlerfamilien versorgen. Diese reisen aus Europa in die Gouverneursstädte, wo sie auf eine Passage in andere Städte warten. Auch in Städten mit niedrigerem Status findet Ihr Siedler, die auf ihre Abholung warten."
