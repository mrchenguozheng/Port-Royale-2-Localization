"0xf52fee2f" = "Kämpft gegen Piraten, Bukanier und Militärkonvois feindlicher Nationen.<n><n>Versucht Euch als Bukanier an der Jagd auf Handelskonvois.<n><n>Brecht auf zur Suche nach der legendären spanischen Schatzflotte.<n><n>Befehligt 16 verschiedene Schiffstypen."
"0xf52fee30" = "Führt Euren Kapitän durch Duelle mit anderen Kapitänen und Piraten.<n><n>Erfüllt unzählige Aufträge mit Kämpfen, Handel und Politik."
"0xf52fee31" = "Besucht Städte in 4 verschiedenen Nationen mit unterschiedlichen Gebäudesets<n><n:10>Genießt eine reiche Vielfalt an Grafiken, während Ihr verschiedene Landschaften durchquert.<n><n:10>Plündert und erobert Städte für Eure Lieblingsnation<n><n:10>Baut Eure eigenen Städte<n><n:10>Kauft Gewerbe von anderen Händlern und errichtet Monopole auf Waren<n><n:10><o:0xFFFFEB7D>...erobert die ganze Karibik im Sturm!"
