"0xe84971d5" = "Ehefrau"
"0xe84c0654" = "In @T$Town$ stehe ich vor einem kleinen Problem. Ich habe meiner Frau versprochen, dafür zu sorgen, dass dort eine Schule gebaut wird. Leider ist das Verhältnis zwischen mir und dem Baumeister nach wie vor äußerst feindselig. Er würde mir nie erlauben, mich in die Angelegenheiten seiner Stadt einzumischen. Könntet Ihr die Schule nicht für mich bauen?"
"0xe84c0655" = "Ich möchte, dass Ihr in @T$Town$ eine Schule baut, um den Wohlstand der Stadt zu erhöhen. Eigentlich bedeutet mir @T$Town$ nichts, aber meine Schwester lebt dort und will einfach nicht akzeptieren, dass es bessere Städte gibt."
"0xe84c0656" = "Der Vizekönig hat mich angewiesen, die Stadt @T$Town$ zu unterstützen. Deshalb würde ich gern eine Schule in der Stadt bezahlen. Der Stadtrat hat mein Angebot jedoch abgelehnt; man will keine Einmischung und lieber das Gold direkt nehmen. Daher wollte ich Euch fragen, ob Ihr die Schule bauen könntet."
"0xe88ea6ee" = "Nach Konvoinamen"
"0xe8925b0d" = "Duell"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>Euer Kapitän steht links. Ihr steuert ihn wie folgt:<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Angriff<f:fonts/Tiepolo_bold14x14aaFH.res><n>Um anzugreifen, klickt mit der linken Maustaste auf einen Teil des Körpers Eures Gegners. Klickt auf verschiedene Körperteile, um Eure Trefferchancen zu erhöhen.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Abwehr<f:fonts/Tiepolo_bold14x14aaFH.res><n>Sobald der Gegner zum Angriff ansetzt, müsst Ihr im richtigen Moment die rechte Maustaste drücken, um den Angriff abzuwehren.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Spezialangriffe<f:fonts/Tiepolo_bold14x14aaFH.res><n>Drückt die linke Maustaste kurz bevor Euer Kapitän nach einem Angriff in die Ausgangsposition zurückgekehrt ist.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Ausdauer<f:fonts/Tiepolo_bold14x14aaFH.res><n>Jeder Angriff verringert die Ausdauer Eures Kapitäns, die sich zwischen den Angriffen wieder erholt.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Reaktionszeit<f:fonts/Tiepolo_bold14x14aaFH.res><n>Je mehr Duelle Ihr gewonnen habt, desto schneller müsst Ihr reagieren."
"0xe8aae87c" = "(Städteliste geändert, Route wurde zurückgesetzt)"
"0xe8b8bf24" = "%1: Angriff von %2 abgewehrt"
"0xe8b8c0e4" = "%1 von %2 geplündert"
"0xe8d7e960" = "%1,<n>wir kennen uns nun schon so lange, und mein Herz sehnt sich danach, dass Ihr allein mein seid. Wollt Ihr meinen Vater nicht um meine Hand bitten?"
"0xe8d7e961" = "%1,<n>ich muss mit Euch über etwas sprechen. Mein Vater würde sich nichts sehnlicher wünschen, als einen feinen Edelmann auszuwählen, der seine Tochter heiratet. Doch mein Herz gehört Euch. Wollt Ihr meinen Vater nicht um meine Hand bitten?"
"0xe8d7e962" = "%1,<n>mein Herz hüpft vor Freude, sooft wir uns treffen. Doch mein Vater droht, mich mit irgendeinem Möchtegern-Edelmann zu verheiraten. Ihr seid der Einzige, der mich vor diesem Schicksal bewahren kann. Wollt Ihr meinen Vater nicht um meine Hand bitten?"
