"0xf214f69c" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt einen Schiffbrüchigen aus @n$DestNation$ gerettet. @N$Name$ bietet Euch eine große Belohnung, wenn Ihr ihn in der nächsten Stadt seiner Nation an Land setzt."
"0xf214f69d" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt den Händler @N$Name$ aus @T$DestTown$ gerettet. Er verspricht Euch eine große Belohnung, wenn Ihr ihn in seine Heimatstadt zurückbringt."
"0xf214f69e" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt den sehr erfahrenen Kapitän @N$Name$ gerettet. Er bittet darum, in einer Stadt von @n$DestNation$ an Land gesetzt zu werden."
"0xf214f69f" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt @I$Sailors$ schiffbrüchige Matrosen aufgenommen, die einige der Mannschaft offenbar kennen. Der freudige Empfang hebt die Moral der Mannschaft."
"0xf214f6a0" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt einen Matrosen aus @n$Nation$ aufgenommen. Zum Dank für seine Rettung verrät er Euch, wo Ihr viele Fässer mit wertvollem Strandgut findet. @l$DebrisPos$"
"0xf214f6a1" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Ihr habt einen Priester aus @n$DestNation$ gerettet. Er kann Euch die Fahrt in eine Stadt seiner Nation nicht bezahlen, verspricht aber, für Euch einzutreten, um Euer Ansehen in @n$DestNation$ zu verbessern."
"0xf22583c4" = "Wollt Ihr für %1 einen Kaperbrief kaufen und im Namen Hollands die Schiffe unserer Feinde jagen?"
"0xf22a4fad" = "In %1 gibt es eine Rattenplage. Der Verbrauch an Weizen, Obst, Mais und Fleisch ist einen Monat lang doppelt so hoch. "
"0xf22b236f" = "Ihr habt die Waren nicht rechtzeitig geliefert."
"0xf22d73b9" = "Ihr braucht Werkzeug, um Kolonialwaren zu produzieren. Ebenso braucht Ihr Rohstoffe, um Fertigwaren zu produzieren. Zu den Fertigwaren gehören zum Beispiel Seil und Kleidung. Die Rohstoffe dafür sind Hanf und Baumwolle.<n><n>Da Ihr nun wisst, wie man Produktionsstätten baut, solltet Ihr in einer Gouverneursstadt eine Baugenehmigung kaufen und dort Anlagen zur Herstellung von Fertigwaren errichten. Bevor Ihr jedoch eine Baugenehmigung kaufen könnt, müsst Ihr Euch einen nachweisbaren Handelsnachweis bei der Stadt erarbeitet haben, das heißt, Ihr müsst Waren an die Stadt verkaufen, wenn diese knapp sind.<n><n>Doch Vorsicht! Kauft Ihr knappe Waren in einer Stadt auf, wirkt sich das negativ auf Euren Handelsnachweis bei der Stadt aus! Waren, die in einer Stadt knapp sind, werden im Handelsfenster rot dargestellt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Verbessert Euren Handelsnachweis in Cartagena, damit Ihr dort eine Baugenehmigung kaufen könnt."
"0xf24b293b" = "Laden/Speichern"
"0xf253afcd" = "Ihr könnt eine Handelsroute nur einrichten, wenn der Kapitän des Konvois %1 Erfahrungspunkte hat. Derzeit hat er %2 Punkte."
"0xf2590753" = "Ich danke Euch. Es sieht so aus, als würden wir in naher Zukunft keine eingeführten Waren aus Europa erhalten. Da wir uns derzeit im Krieg mit @n$HostileNation$ befinden, haben wir die Gelegenheit, Waren aus den Transportkonvois unserer Feinde zu plündern, ohne ihre Schiffe zu kapern oder zu versenken.<n>Bitte beschafft von den Waren Gewürze, Wein und Werkzeug jeweils @a$Amount$ und liefert sie bis @D$EndDate$ an meinen Händler am Markt."
"0xf2590754" = "Euer Auftrag ist es, Transportkonvois von @n$HostileNation$ anzugreifen und zu plündern, ohne ihre Schiffe zu kapern oder zu versenken. Anschließend müsst Ihr die Waren an den Markt liefern. Ihr habt bis @D$EndDate$ Zeit."
"0xf2590755" = "So sei es. Sucht die Transportkonvois von @n$HostileNation$ und plündert @a$Amount$ der an Bord befindlichen eingeführten Waren. Danach habt Ihr bis @D$EndDate$ Zeit, die Waren einem Händler zu übergeben, der am Markt auf Euch wartet. Ein Rat: Wegen der derzeit sehr angespannten Lage in der Region dürft Ihr die Schiffe nur ausplündern und sie weder kapern noch versenken!"
"0xf2593b17" = "Ich habe %1 gewonnen."
"0xf2682c84" = "scenario001 - @I$Idx$"
"0xf285925a" = "Mein lieber %1,<n>vielleicht kann ich Euch mit einem Darlehen helfen, damit Ihr uns beim Ausbau dieser Stadt unterstützt. Welche Summe schwebt Euch vor?"
