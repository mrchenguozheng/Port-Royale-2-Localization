"0xfda277f4" = "%1 ist voll und hat keinen Platz mehr, um ein Lagerhaus zu errichten. Wenn Ihr trotzdem in dieser Stadt Fuß fassen wollt, könnt Ihr versuchen, einen der ansässigen Händler zu überreden, einen seiner Betriebe abzureißen.<n><n>Betriebe werden abgerissen, wenn der Preis für die produzierte Ware in der Stadt über längere Zeit niedrig bleibt, das heißt, wenn ein Überschuss der Ware besteht. Dazu müsst Ihr zuerst das Produkt horten. Verkauft dann ausreichende Mengen des Produkts auf dem Stadtmarkt, um den Preis auf ein niedriges Niveau zu drücken.<n><n>Die produzierten Waren werden einmal täglich an den Stadtmarkt geliefert. Liegt der Preis gerade am Minimum, baut der Betrieb Arbeitsplätze ab. Das könnt Ihr prüfen, indem Ihr auf den Betrieb klickt. Ein Betrieb wird abgerissen, sobald 30 Arbeiter entlassen sind."
"0xfda5ded4" = "Die Stadt blüht auf, weil Gold gefunden wurde"
"0xfdaf6463" = "Ich muss Euch noch einmal danken, Ihr habt so viel für meine Nation getan. Als Belohnung gebe ich Euch das restliche Land für Eure Stadt %1. Damit besitzt Ihr nun den gesamten Distrikt."
"0xfdb7f907" = "Ein Lagerfeuer verrät das Versteck des Lehrmeisters, nicht weit vom Ufer. Euer Kapitän rudert an Land und wird von einem alten Mann empfangen. Als der Alte all den Wein sieht, reibt er sich vergnügt die Hände."
"0xfdb7f908" = "Nicht weit vom Ufer entdeckt Euer Konvoi ein kleines Lager eines Einsiedlers. Euer Kapitän rudert an Land und trifft einen alten Mann in einer Kapitänsuniform, die noch älter ist als er selbst. Er erblickt die Fässer Rum und ist hocherfreut."
"0xfdb7f909" = "Nach einer Weile entdeckt Euer Konvoi ein Versteck an Land. Der Kapitän rudert an Land und sieht sich um. Schließlich findet er den alten Meister und erklärt ihm, was ihn hierher führt. Der Einsiedler nimmt die Nahrung an."
"0xfdc606cf" = "Piratenjagd"
