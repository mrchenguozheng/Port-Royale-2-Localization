"0x37d00ed9" = "Ihr solltet nun vorerst über ausreichende Stadtverteidigung verfügen. Vergrößert nun Eure Stadt und verbessert ihr Aussehen. Baut eine Kirche sowie weitere Produktionsstätten und Wohngebiete, um mehr als 2.200 Einwohner in Eure Stadt zu locken.<n><n>Ihr habt bis @D$EndDate$ Zeit dafür. Danach ist das Szenario vorbei.<n><n>Vergesst nicht, die Waren, die Ihr produziert, mit Gewinn zu verkaufen! <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Baut eine Kirche und erhöht die Bevölkerung Eurer Stadt auf 2.200. Ihr habt bis @D$EndDate$ Zeit."
