"0x0a49c903" = "Herzlichen Glückwunsch! Ihr habt das zweite Szenario erfolgreich abgeschlossen. Ihr habt gelernt, gewinnbringend zu handeln, einen höheren Rang erreicht und indem Ihr einen neuen Kapitän anheuert einen neuen Konvoi zusammengestellt.<n><n>Beachtet, dass Kapitäne umso teurer sind, je mehr Erfahrung sie haben. Zunächst haben sie meist sehr wenig Erfahrung, doch mit der Zeit sammeln alle Kapitäne Erfahrung in Navigation, Handel und Kampf, je nachdem, wie Ihr sie einsetzt. Die aktuellen Erfahrungswerte Eurer Kapitäne könnt Ihr in der Übersicht eines Konvois prüfen. Klickt dazu auf einen Konvoi und dann auf die Schaltfläche „Übersicht und Kosten“.<n><n>Im nächsten Szenario werdet Ihr eigene Betriebe errichten und Waren produzieren. "
