"0xc557fe31" = "In %1 ist eine Seuche ausgebrochen. Die Lebensqualität hat sich verschlechtert, und die Nachfrage nach Kleidung und Holz ist einen Monat lang doppelt so hoch. Solange die Seuche währt, sterben täglich Bürger der Stadt, und Händler zögern, die Stadt anzulaufen."
"0xc558e134" = "Wenn möglichst viele Händler Eure Stadt anlaufen sollen, solltet Ihr bestimmte Waren einfach nicht an Eure Stadt liefern. Am besten wählt Ihr Waren, die in umliegenden Städten erzeugt werden, denn die Händler achten auf die Entfernung.<n><n>Händler, die Eure Stadt anlaufen, kaufen automatisch die Waren auf, die im Überfluss vorhanden und deshalb in Eurer Stadt billig sind. Die Waren, die Ihr selbst erzeugt habt, könnt Ihr direkt an Eure Stadt verkaufen. Solange die Waren nicht teurer sind als in anderen Städten, werden sie regelmäßig von Händlern gekauft.<n><n>Der Vorteil: Für Eure Bürger sind stets genug Waren vorhanden, und Ihr müsst Euch keine Gedanken über den Transport in andere Städte machen."
"0xc567cbb1" = "Spürt den Kopfgeldjäger auf und tötet ihn; er hält sich bei der Stadt @T$Town$ auf. Frist: @D$EndDate$."
"0xc58b0cac" = "Einwohner"
"0xc58b0f43" = "Da seid Ihr ja wieder, und ich sehe, es ist Euch gelungen.<n><n>Also muss ich meinen Teil unserer Abmachung einhalten. Ihr findet Meister @N$TeacherName$ in seinem Versteck.<n><n> @l$TeacherPos$<n><n>Sucht dort an der Küste, dann findet Ihr ihn.<n><n>Bringt @a$Amount$ Wein als Bezahlung mit. "
"0xc58b0f44" = "Habt Dank für diesen Gefallen.<n><n>Nun zu unserer Abmachung. Der alte Kapitän heißt @N$TeacherName$ und hat sich nicht weit von hier zurückgezogen.<n><n>@l$TeacherPos$<n><n>Sucht dort an der Küste, dann findet Ihr ihn.<n><n>Bringt @a$Amount$ Rum mit, sonst ist er nicht bereit zu helfen."
"0xc58b0f45" = "Ihr habt getan, worum ich bat, und ich bin Euch sehr dankbar.<n><n>Ihr findet den Lehrer namens @N$TeacherName$ an der Küste.<n><n> @l$TeacherPos$ <n><n>Durchsucht die Gegend dort und bringt @a$Amount$ Proviant mit, damit er bereit ist, Euch zu helfen. "
