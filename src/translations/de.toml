"0xd7ce1a20" = "%1,<n><n>Ihr könnt für diese Stadt eine Baugenehmigung kaufen. Wäre Euer Ansehen bei meiner Nation höher, würde ich Euch einen besseren Preis anbieten.<n><n>Der aktuelle Preis für eine Baugenehmigung beträgt %2."
"0xd7ce1a21" = "%1,<n><n>Ihr könnt in dieser Stadt eine Baugenehmigung erwerben.<n><n>Eine Genehmigung kostet %2.<n>Je mehr Baugenehmigungen Ihr besitzt, desto teurer wird die nächste."
"0xd7d22330" = " Gouverneur %1 %2 der Stadt %3 wurde abgesetzt."
"0xd7d22331" = "<n>Der Vizekönig von %1 ist nach %2 gezogen. Gouverneur %3 %4 wurde abgesetzt."
