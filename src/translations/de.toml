"0x2ee7d67a" = "Vizekönig von %1"
"0x2ee8bb8c" = "Wir befinden uns in der Gouverneursstadt [town:Cartagena] im Süden der Karibik.<n>Ihr könnt die verschiedenen Gebäude einer Stadt betreten und dort verschiedene Aktionen ausführen, mehr dazu später.<n>Zunächst seht Euch den oberen Bildschirmrand an. Ihr erkennt eine Reihe von Schaltflächen und Anzeigen.<n>Klickt nun auf die Schaltfläche mit der Uhr ganz links auf dem Bildschirm."
"0x2ee8bb8d" = "Das ist die Chronik. Sie enthält eine Aufzeichnung aller Ereignisse und Geschehnisse in der Karibik, ähnlich einer Tageszeitung.<n>Rechts vom Chronik-Fenster befinden sich einige Schaltflächen. Mit ihnen könnt Ihr Informationen über die Karibik anzeigen. Das ist im Moment jedoch nicht wichtig.<n>Schließt nun die Chronik, indem Ihr auf die mit „X“ beschriftete Schaltfläche klickt."
"0x2ee8bb8e" = "Oben auf dem Bildschirm, neben dem Datum, befindet sich die Schaltfläche Logbuch, und daneben Euer Bargeld.<n>Das Logbuch hält Euch über alles auf dem Laufenden, was Eure Erfolge und Euren Besitz betrifft. Außerdem werden hier alle Nachrichten und Aufträge gespeichert, die Ihr erhaltet.<n>Öffnet nun das Logbuch. "
"0x2ee8bb8f" = "Wie Ihr seht, zeigt das Logbuch sofort alle Nachrichten an, die Ihr bisher erhalten habt. Derzeit zeigt das Logbuch nur die Anweisungen für dieses Szenario.<n>Rechts vom Logbuchfenster befinden sich weitere Schaltflächen. Klickt auf die dritte Schaltfläche. "
"0x2ee8bb90" = "Hiermit werden die Aufgaben und Aufträge angezeigt, die Ihr erhalten habt. Derzeit wird nur das Szenarioziel angezeigt.<n>Mit den beiden Schaltflächen ganz oben im Auftragsfenster könnt Ihr zwischen laufenden und abgeschlossenen Aufträgen umschalten.<n>Schließt nun das Protokoll. Das könnt Ihr auch einfach mit einem Rechtsklick tun."
"0x2ee8bb91" = "Später im Spiel könnt Ihr zahlreiche Aufträge annehmen, um Ruhm und Reichtum zu erlangen.<n>Sehen wir uns zunächst die Stadt an. Wie die Anzeige oben in der Mitte Eures Bildschirms zeigt, sind wir in [town:Cartagena]. Die Stadt hat rund 2.000 Einwohner.<n>Klickt auf die Schaltfläche, die den Namen der Stadt zeigt."
"0x2ee8bb92" = "Damit öffnet sich ein Fenster mit Informationen über die Stadt.<n>[town:Cartagena] ist eine Gouverneursstadt und gehört zu Spanien. Ihr seht außerdem den Status der Stadt und die Waren, die dort produziert werden können.<n>Betretet nun ein Gebäude. Schließt dazu die Anzeige der Stadtinformationen."
"0x2ee8bb93" = "Mit den Pfeiltasten auf Eurer Tastatur könnt Ihr Euch in der Stadtansicht bewegen. Seht Euch nun das Stadtzentrum innerhalb der Stadtmauern an. Es enthält Gebäude wie das Handelsdock, die Kirche und den Gouverneurspalast.<n>Klickt einmal auf eines dieser Gebäude."
"0x2ee8bb94" = "Die Anzeige unten in der Mitte Eures Bildschirms ändert sich, wenn Ihr auf ein Gebäude klickt. Je nach Art des Gebäudes erhaltet Ihr nun Informationen oder könnt bestimmte Dinge tun.<n>Rechts von der Gebäudeanzeige befinden sich Schaltflächen. Um das Gebäude zu verlassen, klickt auf die mit „X“ beschriftete Schaltfläche."
"0x2ee8bb95" = "Die Gebäude, in denen Ihr verschiedene Aktionen ausführen könnt, liegen stets innerhalb der Stadtmauern. Euer Lagerhaus ist eine Ausnahme, mehr dazu im nächsten Szenario.<n>Verlasst nun das Gebäude und zeigt mit den Pfeiltasten den Hafen und den Konvoi namens „Santa Maria“. Klickt ihn an."
"0x2ee8bbfd" = "Wie Ihr seht, erscheinen nun Informationen zu Eurem Konvoi unten in der Mitte Eures Bildschirms.<n>Der Konvoi hat bereits Waren geladen: 10 Fässer Weizen und 15 Fässer Mais.<n>Rechts von der Konvoianzeige befinden sich mehrere Schaltflächen. Klickt auf die zweite Schaltfläche (die mit dem Schiffssymbol)."
"0x2ee8bbfe" = "Damit wird die Zahl der Schiffe im Konvoi angezeigt. Ein Konvoi kann bis zu 10 Schiffe umfassen, die von einem Kapitän geführt werden.<n>Schicken wir den Konvoi nun in eine andere Stadt.<n>Klickt auf die Schaltfläche mit dem Pfeil oben rechts auf Eurem Bildschirm, um die Stadt zu verlassen und die Seekarte anzuzeigen."
"0x2ee8bbff" = "Nun erscheint die Seekarte. In der Mitte des Bildschirms seht Ihr die Stadt [town:Cartagena].<n>Mit den Pfeilschaltflächen könnt Ihr den angezeigten Kartenausschnitt verschieben und die gesamte Spielwelt betrachten.<n>Sucht nun die Stadt [town:Port Royale] auf einer Insel im Norden und klickt mit ausgewähltem Konvoi mit der rechten Maustaste auf die Stadt."
"0x2ee8bc00" = "Eine Route wird eingezeichnet, und Euer Konvoi macht sich auf den Weg.<n>Mit dem Rechtsklick auf [town:Port Royale] habt Ihr die Stadt zum Ziel Eures Konvois gemacht.<n>Wenn der Konvoi zu lange braucht, um die Stadt zu erreichen, könnt Ihr das Spiel einfach durch Drücken der Leertaste (Standardeinstellung) vorspulen. "
"0x2ef566b4" = "Tastatur"
"0x2ef8f665" = "Willkommen in %1,<n><n>Ich möchte Euch einige Ratschläge geben, damit Ihr Euch in der Gegend um %2 schneller zurechtfindet und meiner Nation beim Ausbau dieser und anderer Städte helfen könnt.<n>Ich bin sicher, Ihr kennt bereits die grundlegenden Informationen über Gouverneursstädte: Sie brauchen eine ständige Versorgung mit Kolonialwaren für den Export nach Europa. Gleichzeitig bieten diese Städte meist eine Auswahl an Luxuswaren, die sich in anderen Städten mit ansehnlichem Gewinn verkaufen lassen.<n>Noch eines: Vielleicht ist es für Euch interessant zu wissen, dass Gouverneure von Zeit zu Zeit Aufträge erteilen. Aufträge könnt Ihr jedoch erst annehmen, wenn Ihr den Rang eines Schiffsjungen erreicht habt.<n><n>%3 %4, Gouverneur von %5"
"0x2efebfdd" = "Da Euer Konvoi in [town:Port Royale] angekommen ist, könnt Ihr nun die Stadt betreten. Klickt einfach auf das Stadtsymbol (mit den kleinen Häusern)."
"0x2efebfde" = "Ihr seht nun wieder die vertraute Stadtansicht, diesmal jedoch von [town:Port Royale]. Ihr könnt Euch in jeder Stadt bewegen, in der Ihr Konvois oder Gebäude habt.<n>Sucht die Werft im Hafen und klickt sie an, denn wir wollen ein neues Schiff kaufen."
"0x2efebfdf" = "Die Werft wird nun im Auswahlfenster angezeigt, in dem eben noch der Konvoi stand.<n>Seht Euch in der Werft um, indem Ihr auf die Schaltflächen rechts von der Werftanzeige klickt.<n>Kehrt dann zur Anzeige „Schiff kaufen“ zurück und seht Euch die verfügbaren Schiffe an.<n>Kauft ein Schiff Eurer Wahl."
"0x2efebfe0" = "Herzlichen Glückwunsch! Ihr habt Euer erstes Schiff gekauft.<n>Das Schiff wird in den Hafen der Stadt geliefert.<n>Verlasst nun die Werft und klickt auf die Gewässer im Hafen. Das Auswahlfenster zeigt nun die einzelnen Schiffe im Hafen.<n>Klickt auf Euer neues Schiff."
"0x2efebfe1" = "Damit werden die Schiffsdaten angezeigt, die Ihr bereits in der Werft gesehen habt.<n>Bevor Ihr mit einem einzelnen Schiff etwas tun könnt, müsst Ihr es einem Konvoi hinzufügen.<n>Wählt dazu erneut Euren Konvoi aus."
"0x2efebfe2" = "Nun wollt Ihr Eurem Konvoi sagen, dass er mit dem Hafen interagieren soll.<n>Klickt mit der rechten Maustaste auf den Hafen.  "
"0x2efebfe3" = "Es öffnet sich ein Übergabefenster, in dem Ihr einzelne Schiffe zum Konvoi hinzufügen könnt.<n>Klickt dazu auf das einzelne Schiff links und zieht es zum Konvoi, sodass der Konvoi aus zwei Schiffen besteht.<n>Schließt das Übergabefenster dann wieder über die Schaltfläche „X“ rechts."
"0x2efebfe4" = "Ihr könnt auch mit einem neuen Schiff einen weiteren Konvoi zusammenstellen, indem Ihr im Gasthaus einen neuen Kapitän anheuert.<n>Das könnt Ihr derzeit jedoch nicht tun, weil Euer Rang nicht hoch genug ist.<n>Wählt nun die Schiffsliste des Konvois. Das ist die zweite Schaltfläche."
"0x2efebfe5" = "Ihr habt nun einen Konvoi mit zwei Schiffen im Hafen von [town:Port Royale].<n>Ihr könnt die Schiffe in der Schiffsliste des Konvois anklicken, um Details zu den Schiffen zu erfahren.<n>Schickt den Konvoi nun zurück in Eure Heimatstadt [town:Cartagena]. Wechselt dazu auf die Seekarte, indem Ihr auf die Schaltfläche mit dem Pfeil ganz oben rechts auf Eurem Bildschirm klickt. "
"0x2efebfe6" = "Sucht nun im Süden die Stadt [town:Cartagena] und schickt Euren Konvoi dorthin, indem Ihr mit der rechten Maustaste auf die Stadt klickt.<n>Dieses Szenario endet, sobald der Konvoi in der Stadt ankommt."
"0x2f0127e1" = "Ihr verbringt einen sehr angenehmen Tag mit %1 und erzählt ihr von Euren Abenteuern."
"0x2f0127e2" = "Ihr verbringt einen sehr angenehmen Nachmittag mit %1 und vergesst für eine Weile Eure Geschäfte."
"0x2f0127e3" = "Ihr verbringt den Abend mit %1 und wünscht, die gemeinsame Zeit würde nie enden."
"0x2f08cdb5" = "Ich habe auf Euch gewartet, %1. Was habt Ihr für mich?"
"0x2f08cdb6" = "Da seid Ihr ja, %1. Habt Ihr alle Waren dabei?"
"0x2f08cdb7" = "Seid gegrüßt, %1. Habt Ihr etwas für mich mitgebracht?"
