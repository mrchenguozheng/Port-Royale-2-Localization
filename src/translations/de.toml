"0xe8d7e960" = "%1,<n>we have known each other for so long now and my heart yearns for you to be mine alone. Will you not ask my father for my hand in marriage?"
"0xe8d7e961" = "%1,<n>I need to talk to you about something. My father would dearly love nothing better than to choose a fine nobleman to wed his daughter. But my heart belongs to you. Will you not ask my father for my hand in marriage?"
"0xe8d7e962" = "%1,<n>my heart leaps for joy every time we meet. But my father is threatening to marry me off to some would-be nobleman. You are the only one who can save me from this fate. Will you not ask my father for my hand in marriage?"
