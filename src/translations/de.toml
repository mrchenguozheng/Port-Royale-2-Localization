"0x070c60f9" = "Ich danke Euch. Bitte bringt mir @a$Amount$ @G$Goods$. Ihr habt bis @D$Date$ Zeit, die Waren an den Markt zu liefern. Dort erhaltet Ihr @g$GoldPerBarrel$ für jedes <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fa" = "Bitte liefert @a$Amount$ @G$Goods$ an meine Gesandten am Markt. Ihr habt bis @D$Date$ Zeit. Bei der Lieferung erhaltet Ihr @g$GoldPerBarrel$ für jedes <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fb" = "Segelt in Städte von @n$FoeNation$ und sammelt @G$Goods$ ein. Liefert bis @D$Date$ @a$Amount$ an den Markt in meiner Stadt. Ihr erhaltet @g$GoldPerBarrel$ für jedes <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
