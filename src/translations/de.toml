"0x0b8b9679" = "Ihr dürft nun beliebig viele Kapitäne führen und 10 Lizenzen besitzen."
"0x0b8b967a" = "Die Zahl der Kapitäne und Lizenzen, die Ihr führen dürft, ist nun unbegrenzt."
"0x0b8b967b" = "Ihr könnt nun %1 Kapitäne befehligen und %2 Konzession besitzen.<n>Ihr habt gerade eine Nachricht mit Hinweisen zum Thema „Ansehen“ erhalten. "
"0x0b8f4aae" = "Handelserfahrung"
"0x0b9292cb" = "Ihr habt es nicht geschafft, die Waren rechtzeitig für das Fest zu liefern.<n><n>%1 ist wütend auf Euch und will Euch nie wieder sehen."
"0x0b9292cc" = "Ihr habt es nicht geschafft, die Waren rechtzeitig für das Fest zu liefern.<n><n>%1 will nichts mehr mit Euch zu tun haben."
