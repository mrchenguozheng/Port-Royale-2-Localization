"0xcff9644a" = "Das Spiel „Einarmiger Pirat“ ist ein Glücksspiel mit 32 Karten. Jeder Spieler legt seinen Einsatz in den Topf und erhält 5 Karten, die der andere Spieler nicht sehen kann.<n><n>Zuerst muss jeder Spieler ansagen, wie viele Punkte er glaubt zu gewinnen, wobei jeder gewonnene Stich einen Punkt zählt. Der Spieler, der die höhere Punktzahl ansagt, führt das Spiel und bestimmt die Trumpf-Farbe. Er muss nun versuchen, mindestens diese Punktzahl zu gewinnen.<n><n>Der führende Spieler spielt seine ersten Karten aus, und der andere Spieler muss mit einer Karte derselben Farbe nachziehen, wenn er kann. Der Spieler mit der höchsten Karte gewinnt den Punkt.<n><n>Kann ein Spieler nicht nachziehen, darf er eine beliebige Karte abwerfen oder eine Trumpfkarte ausspielen.<n><n>Die Reihenfolge der Karten ist I, II, III, IV, Pirat, Braut, Gouverneur, Papagei. Eine Trumpfkarte schlägt alle anderen Karten.<n><n>Der Spieler, der den Punkt gewonnen hat, spielt die nächste Karte aus. So geht es weiter, bis jemand das Spiel gewinnt.<n><n>Gelingt es dem Führenden, die angesagte Punktzahl zu gewinnen, gewinnt er das Spiel und nimmt den Topf. Gelingt es ihm nicht, gewinnt sein Gegner."
