"0x386a053b" = "Ihr habt den höchsten Rang erreicht!"
"0x386a3a7f" = " Sucht ihn dort in den Gasthäusern. Glaubt mir, Ihr könnt Euch Zeit lassen, doch solltet Ihr ihn tatsächlich sehen, richtet ihm meine besten Grüße aus und sagt ihm, er könne meiner Schwester gern ins Gedächtnis rufen, wie er aussieht!"
"0x386a3a80" = " Ich fürchte, ich kann nicht sagen, wann die beste Zeit wäre, ihn dort zu sehen. Am besten sucht Ihr ihn einfach so oft wie möglich in den dortigen Gasthäusern."
