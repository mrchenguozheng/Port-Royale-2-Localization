"0xef0f916b" = "Ihr seid auf @I$Settlers$ schiffbrüchige Siedler auf einem Floß gestoßen. Leider habt Ihr nicht genug Platz in Eurem Konvoi für alle. Kehrt mit einem anderen Konvoi zurück."
"0xef152fb7" = "%1,<n>nun bin ich an der Reihe, Euch kennenzulernen. Ihr seid in meiner Nation ein geschätzter Mann, ich hatte immer gehofft, Euch persönlich zu begegnen."
"0xef635ad0" = "Gut. Ein Kontaktmann wartet am Markt in @T$TargetTown$ auf Euch. Liefert bis @D$EndDate$ so viel @G$Goods$, wie Ihr bekommen könnt. Danach erhaltet Ihr @g$Price$ für jedes gelieferte Fass."
