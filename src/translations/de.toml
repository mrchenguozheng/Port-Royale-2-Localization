"0xf88d6ee5" = "Liefert eine beliebige Menge @G$Goods$ an den Markt in @T$TOWN$. Dort erhaltet Ihr sofort @g$Price$ pro Fass. Am @D$EndDate$ wird ein Expeditionskonvoi die Waren abholen. Geleitet den Konvoi nach Europa, und Ihr erhaltet weitere @g$Price$ pro Fass."
"0xf894bc2d" = "Der Konvoi kann nicht in See stechen, weil sich einige Eurer Schiffe in sehr schlechtem Zustand befinden. Lasst Euren Konvoi in der Werft reparieren, bevor Ihr ihn wieder auf See schickt. Alternativ könnt Ihr die beschädigten Schiffe aus dem Konvoi nehmen und sie einzeln reparieren lassen."
"0xf89f542f" = " Ihr habt <o:0xff1e1eff>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GOLD_800x600.screen> erhalten."
"0xf8af3810" = "Hier haben wir alles, was wir brauchen."
"0xf8b3a303" = "Der Status einer Stadt kann sich über sieben Stufen entwickeln, von der Armut bis zum Reichtum. Auf den beiden untersten Stufen ist die Lebensqualität so schlecht, dass die Bürger die Stadt regelmäßig verlassen. Erreicht eine Stadt hingegen die Stufen „Blühende Wirtschaft“, „Wohlstand“ und „Reichtum“, erhalten Eure Betriebe einen Effizienzbonus, und Eure Arbeitskräfte arbeiten kostengünstiger. Auf der höchsten Stufe bringt eine Stadt sogar eigene Siedler hervor.<n><n>Mehr Informationen zu den Wirkungen der einzelnen Statusstufen findet Ihr in den Stadtinformationen. Um sie anzuzeigen, klickt auf den Stadtnamen.<n><n> Eine ausreichende Versorgung mit zwei bis drei Waren aus jeder Warengruppe sichert eine gute Lebensqualität in Eurer Stadt. Die Versorgung mit einer Ware ist ausreichend, wenn sie die Bevölkerung der Stadt zehn Tage lang ernähren kann.<n><n>Hinweis: Der Status einer Stadt verbessert sich nicht über Nacht. Es dauert eine Weile, bis sich die Bürger der Stadt an eine neue Lage angepasst haben."
"0xf8bacb9a" = "Gasthaus"
"0xf8cc0545" = "Verkaufte Waren"
