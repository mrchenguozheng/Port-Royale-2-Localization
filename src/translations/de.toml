"0xcc823e54" = "Wir befinden uns im Krieg mit @n$TargetNation$, und angesichts der jüngsten Ereignisse ist nun der Zeitpunkt gekommen, uns zu revanchieren. Ich möchte, dass Ihr in meinem Namen Militärschiffe kapert oder versenkt. Nehmt Ihr diesen Auftrag an? "
"0xcc823e55" = "Erst kürzlich hat @n$TargetNation$ eine unserer Städte angegriffen. Nun plane ich meine eigene militärische Aktion gegen @n$TargetNation$ und wollte wissen, ob Ihr daran teilnehmen möchtet? Ich möchte, dass Ihr Militärkonvois versenkt oder kapert. Alles, was Ihr von ihnen erbeutet, gehört Euch; mir geht es nur darum, @n$TargetNation$ zu schwächen. Habt Ihr Interesse?"
"0xcc823e56" = "Eine unserer Städte wurde von @n$TargetNation$ angegriffen. Wir schlagen nun zurück und versenken ihre Schiffe. Ich möchte Euch sehr gern in ein bestimmtes Gebiet entsenden und Euch ermächtigen, Militärschiffe zu kapern oder zu versenken. "
