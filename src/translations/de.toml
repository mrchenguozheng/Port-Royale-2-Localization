"0xcc0a1380" = "Findet den Piratenkonvoi unter dem Kommando von @P$PirateName$, der etwa eine Tagesreise nordöstlich von Providence liegt. Zerstört diesen Konvoi.<n>Kehrt dann zum Gouverneur von Cartagena zurück."
"0xcc1709af" = "%1: Feindlich"
"0xcc2c64fb" = "Ihr habt den Auftrag erhalten, einen der Piratenkonvois von Blackbeard aufzuspüren und zu zerstören.<n><n>Blackbeard hat ein geheimes Versteck, in dem er mehrere Konvois hält, jeder aus fünf voll bewaffneten Schiffen. Mit dem Konvoi, den Ihr derzeit habt, wird das eine schwierige Aufgabe.<n><n>Deshalb solltet Ihr zuerst die Feuerkraft Eures Konvois erhöhen. Um genug Geld für ein größeres Schiff zu haben, könnt Ihr die Waren aus Eurem Lagerhaus in @T$TOWN$ zu möglichst guten Preisen verkaufen. Folgt den Hinweisen im Ereignisfenster; sie sagen Euch, wo Ihr die Waren nördlich und östlich von @T$TOWN$ gut verkaufen könnt.<n><n>Verliert dabei nicht zu viel Zeit, denn anschließend müsst Ihr immer noch den Auftrag des Gouverneurs erfüllen!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Verkauft die Waren in Eurem Lagerhaus in @T$TOWN$ und erhöht Euer Bargeld auf @g$GoldGoal$."
"0xcc475a7d" = "Baumeister"
"0xcc528764" = "Gemeinschaftsbau "
"0xcc56863a" = "Lohnkosten pro Tag"
"0xcc5bfb04" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Aktueller Auftrag<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
