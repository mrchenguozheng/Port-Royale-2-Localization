"0x18c8a516" = "%1 %2 erhält die Stadt %3 vom französischen Vizekönig."
"0x18c8a517" = "%1 %2 erhält die Stadt %3 vom niederländischen Vizekönig."
"0x18c8a518" = "%1 %2 erhält die Stadt %3 vom spanischen Vizekönig."
