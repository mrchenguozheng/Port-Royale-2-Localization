"0xf6a84efd" = "Wir schreiben das Jahr 1570, und wir befinden uns in der Karibik. Euer Ziel ist es, vom bescheidenen Händler zu einem einflussreichen Geschäftsmann aufzusteigen. Damit Ihr den erstrebten Status erreicht, könnt Ihr Waren transportieren, handeln, bauen und Euch in Politik und Piraterie betätigen.<n><n>Das folgende Szenario lehrt Euch die Grundlagen des Spiels. Wie bei den anderen Szenarien gibt es dabei mehrere verschiedene Ziele. Um das Szenario erfolgreich abzuschließen, müsst Ihr alle Eure Ziele erreichen.<n><n>Ihr könnt dieses Fenster nun mit der Schaltfläche „Schließen“ schließen und das Ereignisfenster unten links auf Eurem Bildschirm nutzen.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Folgt den Anweisungen im Ereignisfenster."
"0xf6bb9f8c" = "Preis"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "Grafikkarte"
"0xf6c77503" = "Das Versteck des Piraten %1 wurde entdeckt. Welcher heldenhafte Abenteurer wagt es, das Versteck anzugreifen und zu zerstören?"
"0xf6ec5ddc" = "In [town:Tortuga] geschehen seltsame Dinge. Wegen einer Reihe von Ereignissen in der Vergangenheit wagt kaum noch ein Händler, die Stadt zu betreten. Eure Aufgabe ist es, [town:Tortuga] so gut es geht durch Warenlieferungen zu unterstützen.<n><n>Doch Euer Startkapital ist nicht gerade berauschend: Ihr habt @g$StartGold$ Bargeld dabei. Dafür wartet ein gut ausgestatteter Handelskonvoi im Hafen, und Ihr habt einige Warenvorräte an Bord.<n><n>Zuerst sollt Ihr Euer Bargeld auf @g$GoldGoal$ erhöhen. Erfüllt diese Aufgabe so schnell wie möglich, doch dürft Ihr dafür nicht länger als 40 Tage brauchen.<n><n>Ein Tipp: Unter keinen Umständen solltet Ihr Eure Schiffe verkaufen. Ihr könnt jedoch Darlehen aufnehmen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erhöht Euer Bargeld bis @D$EndDate$ auf @g$GoldGoal$."
"0xf70feddb" = "Ihr seid wieder im Hafen von [town:Cartagena], und Euer Konvoi, die „Santa Maria“, ist ausgewählt.<n>Wie Ihr seht, hat der Konvoi bereits einige Waren geladen: Baumwolle, Fleisch und Kakao.<n>Nun sucht im Hafen das Handelsdock und klickt es an, denn Ihr wollt die Waren verkaufen."
"0xf70feddc" = "Im Handelsdock könnt Ihr sowohl zwischen Stadt und Eurem Lagerhaus als auch zwischen Stadt und Eurem Konvoi handeln.<n>Nun seht Ihr, welche Waren die Stadt hat und welche Waren Euer Konvoi hat. Mit den Pfeilen kauft und verkauft Ihr (die Preise stehen auf den Pfeilen).<n>Verkauft jetzt Eure Baumwolle."
"0xf70feddd" = "Vielleicht ist Euch aufgefallen, wie der Baumwollpreis gefallen ist, als Ihr etwas verkauft habt.<n>Das liegt daran, dass der Preis durch Angebot und Nachfrage in der Stadt bestimmt wird.<n>Verkauft man Waren, sättigt das die Nachfrage, und der Preis fällt. Kauft man eine Ware, steigt ihr Preis.<n>Kauft nun @a$SubGoal$ Weizen."
"0xf70fedde" = "Fällt Euch auf, dass der Weizenpreis gerade gestiegen ist? <n>Beachtet jedoch, dass der Preis nicht nur vom Angebot, sondern auch von Eurem Ansehen in der Stadt abhängt.<n>Klickt auf die Schaltfläche mit dem Gebäude unten rechts im Handelsfenster."
"0xf70feddf" = "Jetzt könnt Ihr zwischen Eurem Lagerhaus und der Stadt handeln.<n>In jeder Stadt, in der Ihr die Produktion einer Ware aufnehmen wollt, müsst Ihr zuerst ein Lagerhaus bauen. In Eurer Startstadt besitzt Ihr immer schon ein Lagerhaus.<n>Verkauft nun alle Waren, die Ihr im Lagerhaus habt."
"0xf70fede0" = "Ganz oben im Handelsfenster findet Ihr drei Schaltflächen mit den Zahlen 1, 10 und 100, mit denen Ihr größere Warenmengen schneller handeln könnt. Klickt auf die Schaltfläche 10 und beobachtet, wie sich die Preise ändern.<n>Es macht keinen Unterschied, ob Ihr 10 x 1 Ware oder 1 x 10 Waren kauft: Der Gesamtpreis ist immer gleich. Kauft nun @a$SubGoal$ Rum."
"0xf70fede1" = "In der Spalte ganz rechts im Handelsmenü werden die Durchschnittspreise für die Waren angezeigt, die Ihr gekauft habt. Da Ihr die Waren mit Gewinn verkaufen wollt, müsst Ihr eine Stadt finden, in der ein höherer Preis gezahlt wird.<n>Öffnet nun die Übergabe zwischen Schiff und Lagerhaus, indem Ihr unten rechts auf die vierte Schaltfläche (mit dem Kran) klickt."
"0xf70fede2" = "In diesem Fenster könnt Ihr Waren zwischen Eurem Konvoi und Eurem Lagerhaus verschieben. Ladet nun alle restlichen Waren aus Eurem Lagerhaus auf den Konvoi, denn Ihr wollt die Waren in einer anderen Stadt verkaufen.<n>Schließt danach das Handelsfenster, indem Ihr unten rechts auf die mit „X“ markierte Schaltfläche klickt."
"0xf70fede3" = "Wechselt nun zur Seekarte und fahrt mit Eurem Konvoi nach Santa Marta. Betretet Santa Marta nicht, sondern klickt mit der rechten Maustaste auf die Stadt, sobald der Konvoi die Stadt erreicht. "
"0xf70fede4" = "Damit öffnet sich das Handelsfenster für Santa Marta.<n>Ihr müsst also keine Stadt betreten, um dort zu handeln.<n>Verkauft nun alle Waren, die Ihr an Bord Eures Konvois habt.<n>Schließt danach das Handelsfenster."
"0xf7110875" = "Seid Ihr sicher, dass Ihr den Spielstand löschen wollt?"
"0xf725f22c" = "Euer Konvoi befindet sich nun in Santa Marta. Klickt auf den Stadtnamen, um die Stadtinformationen anzuzeigen.<n>Ihr könnt das von der Seekarte aus tun oder indem Ihr die Stadt betretet."
"0xf725f22d" = "Die Stadtinformationen zeigen die Waren, die in der Stadt produziert werden.<n><n>Auch Euer Verhältnis zu Spanien wird angezeigt: Dieses Verhältnis ist freundlich! Das bedeutet, dass Euch in der Stadt die bestmöglichen Preise gezahlt werden.<n><n>Schließt nun dieses Fenster und seht Euch in der Stadt um."
"0xf725f22e" = "Klickt nun links am Bildschirmrand auf das Einwohnersymbol unter dem Stadtnamen, um den Bestand von Santa Marta anzuzeigen."
"0xf725f22f" = "Hier werden die Menge der eingelagerten Waren und die in der Stadt verbrauchte Menge angezeigt. Der Verbrauch hängt natürlich von der Bevölkerung der Stadt ab.<n>Der Verbrauch sagt Euch, wie viele Waren regelmäßig geliefert werden können. Schließt nun das Bestandsfenster."
"0xf725f230" = "Versucht nun, ein paar gewinnbringende Geschäfte zu machen.<n>Öffnet das Handelsfenster und kauft so viel Baumwolle, Zucker und Kakao, wie Ihr in Eurem Konvoi transportieren könnt, denn diese Waren werden in dieser Stadt produziert.<n>Kehrt dann nach [town:Cartagena] zurück und verkauft diese Waren mit Gewinn."
"0xf725f231" = "Ihr habt gerade zwei Nachrichten mit Hinweisen für erfolgreichen Handel erhalten.<n>Öffnet das Protokoll, um die Nachrichten zu lesen.<n>"
"0xf725f232" = "Verkauft so viele Waren wie möglich über dem Durchschnittspreis und kauft neue Waren. <n>Hinweis: Die Preise von Waren, die in einer Stadt knapp sind, werden rot angezeigt. Für diese Waren erhaltet Ihr immer gute Preise.<n>"
"0xf725f233" = "Gouverneursstädte wie [town:Cartagena] erhalten Importwaren aus Europa.<n>Diese könnt Ihr in Kolonialstädten wie Santa Marta, Maracaibo oder Gibraltar für gewöhnlich mit Gewinn verkaufen.<n>Handelt nun eine Weile auf eigene Faust.<n>Euer Ziel ist es, durch Handel @g$GoldGoal$ an Bargeld zu erwirtschaften."
"0xf7346191" = "Händler aus %1"
"0xf73619d7" = "Das Piratenversteck wurde bekannt"
"0xf7370c4b" = "%1,<n>mir fallen viele Leute ein, die ich lieber sehen würde. Haben wir geschäftlich etwas zu besprechen? Kommt herein, wenn es sein muss."
"0xf73bf67d" = "Geht zur Stadtansicht von [town:Cartagena].<n>Normalerweise müsst Ihr einen Konvoi im Hafen vor Anker haben, um eine Stadt zu betreten. In [town:Cartagena] besitzt Ihr jedoch ein Lagerhaus und könnt diese Stadt daher betreten, wann immer Ihr wollt.<n>Klickt in [town:Cartagena] auf die Werft."
"0xf73bf67e" = "Kauft in der Werft ein kleines Schiff. Gebt nicht zu viel Geld aus, denn Ihr müsst noch etwas für den Handel und den Unterhalt Eures Schiffs übrig behalten."
"0xf73bf67f" = "Im letzten Szenario habt Ihr gelernt, wie man Schiffe zu einem Konvoi zusammenfügt, indem man mit der rechten Maustaste auf den Hafen klickt.<n>Nun sollt Ihr jedoch einen neuen Konvoi bilden, indem Ihr im Gasthaus einen Kapitän anheuert.<n>Findet das Gasthaus (es liegt im Zentrum der Stadt) und klickt es an."
"0xf73bf680" = "Kapitäne findet Ihr immer im Gasthaus. Hält sich ein Kapitän in der Stadt auf, wird dies durch die dritte Schaltfläche im Gasthausmenü angezeigt.<n>Habt Ihr weitere Schiffe oder Konvois im Hafen, müsst Ihr dem Kapitän genau sagen, wo er eingesetzt werden soll.<n>Bestimmt, dass er Euer neues Schiff führen soll."
"0xf73bf681" = "Herzlichen Glückwunsch! Ihr habt Euren ersten Konvoi gebildet! Eure nächste Aufgabe ist es, Euer Vermögen auf @g$GoldGoal$ zu erhöhen. Euer Vermögen könnt Ihr jederzeit unter „Erfolge“ im Protokoll prüfen.<n><n>Viel Glück!"
"0xf73dab55" = "Habt Dank, dass Ihr den letzten Auftrag, den ich Euch gab, erfüllt habt."
"0xf73dab56" = "Ich möchte Euch danken, dass Ihr meinen letzten Auftrag erfüllt habt."
"0xf73dab57" = "Ich danke Euch für Eure Unterstützung."
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "Ihr beginnt Eure Karriere mit <o:0xFFF2FAAD>%1<o> Goldstücken und einer <o:0xFFF2FAAD>Pinasse<o> (60 Tonnen, max. 8 Kanonen)."
"0xf7534d8f" = "Wenn Ihr Siedler in eine Stadt bringt, in der Arbeiter gebraucht werden, zahlen sie Euch beim Aussteigen das Fahrgeld als Dank.<n><n>Zur Produktion von Kolonialwaren wie Kakao wird stets eine kleine Menge Werkzeug benötigt. Ist dieses Werkzeug nicht vorhanden, stockt die Produktion. Später, wenn Ihr etwas mehr über Preise und Mengen wisst, könnt Ihr den Lagerverwalter anweisen, in der Stadt regelmäßig Werkzeug zu kaufen. Vorerst solltet Ihr das Werkzeug jedoch selbst beschaffen, um auf der sicheren Seite zu sein.<n><n>Das ist Eure nächste Aufgabe. Danach steht der Kakaoerzeugung nichts mehr im Wege.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produziert Kakao und baut einen Vorrat von @a$AmountGoal$ in Eurem Lagerhaus auf."
"0xf760fd2a" = "Habt Dank. Hier sind Eure %1. Ich bin bis %2 hier. Bis dahin könnt Ihr mir weitere Waren bringen."
"0xf76d173f" = "%1 eingenommen."
