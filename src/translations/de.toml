"0xeeced82e" = "@s$USER$, in Europa herrscht bei @n$Nation$ ein Mangel an @G$Goods$. Deshalb organisiere ich eine Expedition nach Europa. Ich kaufe so viel @G$Goods$, wie Ihr liefern könnt, und bin bereit, Euch einen Stückpreis von @g$FullPrice$ zu bieten. Habt Ihr Interesse?"
"0xeeced82f" = "Grüße. Ich organisiere eine Expedition nach Europa. Ich will den Mangel an @G$Goods$ dort ausnutzen. Ich kaufe Euch so viele Waren ab, wie Ihr liefern könnt, und zahle einen sehr guten Preis pro Fass — sagen wir @g$FullPrice$. Haben wir ein Geschäft?"
"0xeeced830" = "Grüße, @s$USER$. Ich stelle einen Konvoi nach Europa zusammen, denn ich habe gehört, dass @G$Goods$ einen sehr hohen Preis erzielen. Jedem, der mir @G$Goods$ liefern kann, biete ich einen Stückpreis von @g$FullPrice$. Haben wir ein Geschäft?"
"0xeed24553" = "Spieltempo erhöhen"
