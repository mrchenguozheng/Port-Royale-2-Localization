"0x1f32f588" = "Szenario gescheitert"
"0x1f36e96b" = "In Kürze wird hier ein Transportkonvoi eintreffen. Ein Spion hat mir erzählt, dass unser Feind plant, diesen Konvoi auf seiner Rückreise nach Europa anzugreifen. Könnt Ihr den Konvoi auf dem Heimweg schützen? "
"0x1f36e96c" = "Ich habe ein Problem. Meine Frau möchte mit dem nächsten Konvoi nach Europa reisen, um ihre Familie zu besuchen. Leider hat @n$HostileNation$ davon erfahren und plant, den Konvoi abzufangen. Könnt Ihr meiner Frau eine sichere Überfahrt garantieren?"
"0x1f36e96d" = "Ich werde bald wichtige Dokumente nach Europa schicken. Da wir uns derzeit im Krieg mit @n$HostileNation$ befinden, gehe ich kein Risiko ein und möchte zusätzlichen Geleitschutz stellen lassen. Könntet Ihr diesen Geleitschutz übernehmen? "
"0x1f6696d2" = "Es tut mir leid, es stellt sich heraus, dass ich Euch diesen Auftrag doch nicht erteilen kann. Ich habe gerade eine Nachricht erhalten, dass das Problem nicht mehr besteht."
"0x1f851477" = "Der Konvoi, der diesen Auftrag ausführen sollte, wurde zerstört."
"0x1f890b43" = "Warennachfrage"
"0x1f9a14b7" = "<n><n>Um das Versteck anzugreifen, müsst Ihr einen Konvoi dorthin entsenden, so wie Ihr einen Konvoi zu einer Stadt entsendet. Achtung! Jeder Piratenkonvoi, der sich beim Angriff nicht im Versteck befindet, wird gewarnt und richtet ein neues Versteck ein."
"0x1fb02f3a" = "Speichern"
"0x1fcb6529" = "Seeschlacht beenden"
"0x1fd35f28" = "Animationskunst"
"0x1fdba107" = " Sein Tageslohn beträgt %1."
"0x1fe06eb2" = "Kapazität<n>%1%"
"0x1fe25594" = "Nach dem Durchbruch durch die Hafenverteidigung legt Euer Konvoi an, und die Matrosen bahnen sich ihren Weg durch die Stadt. Unterwegs treffen sie auf den Kommandanten der Stadtwache. Er weigert sich, Platz zu machen, es sei denn, er wird in einem fairen Duell besiegt. Euer Kapitän nimmt die Herausforderung an."
"0x1fea1f37" = "Dieses Spiel beenden und den Spielstand laden?"
"0x1ff731c7" = "Handelsroute speichern"
"0x200d4e11" = "%1 %2 %3"
"0x20252656" = "Gold in %1 gefunden"
"0x20413ba0" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
"0x204cf373" = "Stadt unterstützen"
"0x204d1e7c" = "Ein Piratenversteck kann nur von der See aus angegriffen werden."
"0x20574fcc" = "%1, Ihr habt die geliebte Stadt meines Vaters für %2 erobert! Ich will nichts mehr mit Euch zu tun haben. Ich hoffe, ich sehe Euch nie wieder. Ihr solltet wissen, dass Ihr mir nie etwas bedeutet habt und dass ich in Zukunft keinen Gedanken an Euch verschwenden werde.<n>Ich hoffe von Herzen, dass Ihr früher oder später die Strafe erhaltet, die Ihr so reichlich verdient.<n><n>%3"
"0x20574fcd" = "%1, indem Ihr die Annexion für %2 durchgeführt habt, habt Ihr den Vizekönig gezwungen, in die geliebte Stadt meines Vaters umzuziehen, der nun nach Europa zurückkehren muss.<n><n>Ich will nichts mehr mit Euch zu tun haben. Ich hoffe, ich sehe Euch nie wieder. Ich möchte Euch außerdem wissen lassen, dass ich stets weit mehr an den Händlern im Gasthaus interessiert war als an Euch. Ihr habt mir nie etwas bedeutet, und Ihr werdet von nun an das Letzte sein, woran ich denke.<n><n>Ich hoffe von Herzen, dass Ihr früher oder später die Strafe erhaltet, die Ihr so reichlich verdient.<n><n>%3"
"0x2065f070" = "Seht her. Ich habe gerade eine Nachricht von meinem Botschafter erhalten, dass %1 uns ein unerwartetes Friedensangebot gemacht hat. Das bedeutet, dass wir wahrscheinlich schon heute Frieden schließen werden. <n><n>Daher kann ich Euch keinen Auftrag zur Eroberung einer Stadt mehr erteilen."
"0x207295a1" = "Eine Handelsroute mit dem Namen ‚%1‘ existiert bereits.<n><c>Wollt Ihr sie überschreiben?"
"0x2077407d" = "%1,<n>ich bin froh, dass Ihr gekommen seid. Kommt herein, ich sehe nach, ob ich etwas für Euch habe."
"0x207a9d35" = "Der Kommandant der Stadtwache ruft Eurem Kapitän von der Stadtmauer zu und bittet ihn, die Schlacht abzubrechen und stattdessen ein Duell mit ihm auszutragen. Um weitere Verluste zu vermeiden, stimmt Euer Kapitän zu."
"0x207b620f" = "Nachdem Eure Truppen das Stadttor zerstört haben, sehen sie sich dem Kommandanten der Stadtwache gegenüber. Er fordert Euren Kapitän zum Duell heraus."
"0x208aca1b" = " Achtet in der Gegend auf englische Konvois und zerstört @I$NumConvoys$ davon."
"0x208aca1c" = " Achtet in der Gegend auf französische Konvois und zerstört @I$NumConvoys$ davon."
