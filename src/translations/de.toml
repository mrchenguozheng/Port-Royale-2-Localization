"0xe7bffbb6" = "In Tortuga wurden die Vorräte der Stadt von Saboteuren zerstört. Viele der Vorräte der Stadt sind verloren, und die Lebensqualität der Bürger ist dadurch drastisch gefallen.<n><n>Euer Ziel ist es, die Vorräte der Stadt schnellstmöglich aufzufüllen, damit der Status der Stadt wieder steigen kann.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Stadt muss bis @D$EndDate$ den Status „Aufschwung“ erreicht haben."
