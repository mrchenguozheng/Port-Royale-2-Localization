"0xe37f3b12" = " Da die Städte meiner Nation nicht genug produzieren, war ich auf Lieferungen aus niederländischen Städten angewiesen."
"0xe37f3b13" = " Da die Städte meiner Nation nicht genug produzieren, war ich auf Lieferungen aus spanischen Städten angewiesen."
