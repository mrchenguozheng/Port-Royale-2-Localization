"0x1269b779" = "Hallo, @s$USER$, ich hab hier einen Hinweis, der Euch zu verborgenem Schatz führt. Wollt Ihr ihn hören?"
"0x1269b77a" = "Hallo, @F$FName$ @L$LName$, setzt Euch hier neben mich und lasst uns ein Schlückchen trinken. Dann erzähle ich Euch von verborgenem Schatz."
"0x1269b77b" = "Ihr seid @s$USER$, nicht wahr? Dann seid Ihr derjenige, der weitere Hinweise auf einen verborgenen Schatz sucht. Wenn Ihr wollt, könnte ich Euch helfen."
"0x1269b77c" = "Seid gegrüßt, @A$USER$. Ich kann Euch sagen, wie Ihr findet, was Ihr sucht. Hört meinen Hinweis auf den verborgenen Schatz."
