"0xca4930db" = "Seid gegrüßt, @A$USER$. Ich muss eine große Lieferung @G$Goods$ nach @T$Town$ bringen, doch leider hat mich mein Kapitän im Stich gelassen. Ich schlage Euch Folgendes vor: Ihr zahlt mir eine Sicherheit von @g$PriceBuy$, bringt @a$Amount$ nach @T$Town$ und erhaltet dort @g$PriceSell$ dafür. Was sagt Ihr?"
"0xca4930dc" = "Schön, Euch zu sehen, @A$USER$. Ihr habt doch eine große Handelsflotte? Ich muss nämlich @A$Amount$ @G$Goods$ verschiffen.<n>Wie wär's, Ihr zahlt mir eine Sicherheit von @g$PriceBuy$ und bringt die Waren nach @T$Town$. Dort könnt Ihr sie für @g$PriceSell$ verkaufen."
"0xca4930dd" = "Ich bin in einer misslichen Lage. Bis @D$EndDate$ muss ich @a$Amount$ @G$Goods$ nach @T$Town$ liefern, doch mein Konvoi ist bereits mit einer anderen Lieferung unterwegs. Ich mache Euch folgendes Angebot: Zahlt mir eine Sicherheit von @g$PriceBuy$ und liefert die Waren. Dafür erhaltet Ihr @g$PriceSell$. Was sagt Ihr dazu?"
"0xca6a6869" = "Speichern"
"0xca6f7275" = "Wir konnten das Piratenversteck von %1 aufspüren. %2 Wie wäre es, wenn Ihr das Versteck angreift, diese Bande ein für alle Mal auslöscht und unseren Gewässern so etwas wie Frieden zurückgebt?"
"0xca6f7276" = "Habt Ihr gehört, dass wir endlich wissen, wo der Pirat %1 sein Versteck hat? %2 %3 sucht einen tapferen Helden, der es zerstört. Traut Ihr Euch das zu?"
"0xca6f7277" = "Die Lage des Stützpunkts, von dem der berüchtigte Pirat %1 operiert, ist kein Geheimnis mehr. %2 Wir sollten diese Bande ohne weiteren Aufschub zerschlagen. Ich glaube, Ihr seid genau der Richtige für diese Aufgabe."
"0xca6f7278" = "Ihr habt einen sehr guten Ruf bei meiner Nation. Doch ich kenne einen Weg, wie Ihr ihn noch verbessern könntet.<n><n>Das Versteck des Piraten %1 wurde vor Kurzem entdeckt.  %2<n><n>Vielleicht seid Ihr derjenige, der uns alle endgültig von dieser Bande befreit. "
"0xcab1988a" = "%1 greift an"
"0xcac5b30b" = "Beten"
"0xcacc4fa8" = "Findet die spanische Schatzflotte und zerstört sie. Zuletzt lag sie in @T$StartTown$, von dort lief sie nach @T$DestTown$ aus."
"0xcb2b0709" = "Welch ein Unglück! Habt Ihr @F$WifeName$ heute schon besucht? Ihr könnt Euch den Weg sparen, denn sie ist fort. Seht, ich habe so etwas wie einen Abschiedsbrief gefunden. Sie schreibt, sie habe ihr langweiliges Leben satt und sei mit einem Abenteurer durchgebrannt. Ihr müsst mir meine geliebte Tochter retten!"
"0xcb2b070a" = "Ein Unglück ist geschehen, und wie mir scheint, steckt Ihr mitten darin. Meine Tochter wurde von Piraten entführt, doch jemand hat Euch eine Nachricht mit einer Karte hinterlassen, die eine bestimmte Stelle zeigt. Für mich sieht das nach einer Falle aus, aber was sollen wir tun? Ihr müsst meine Tochter retten!"
"0xcb2b070b" = "Ha! Meine Tochter, und Eure Frau, ist mit einem meiner Offiziere der Stadtwache durchgebrannt! Das hätte ich ahnen können! Nun sind beide verschwunden und haben eines meiner Schiffe gestohlen! Ihr müsst mir meine Tochter zurückbringen und sie zur Vernunft bringen! Seltsamerweise bin ich in den Gemächern meiner Tochter auf eine Karte gestoßen, auf der eine Stelle markiert ist."
"0xcb3b9785" = "Neuer Name"
"0xcb3c204b" = "Eine neue Baugenehmigung"
"0xcb4ef185" = "Angriff"
"0xcb6604a0" = "versenkt"
"0xcb674ff0" = "Ich danke Euch im Namen meiner Nation. Der Konvoi wird nun instand gesetzt und die Mannschaft zusammengestellt. In 15 Tagen wird er auslaufen können.<n><n>Wenn Ihr einen weiteren Konvoi übergeben wollt, müsst Ihr bis dahin warten."
"0xcb6c23d8" = "Kaufen"
"0xcb6f7f0c" = "Werkzeuglieferung"
"0xcb7ef0e8" = "Handelserfolg %1"
"0xcb853f07" = "Euer Kapitän hat sein Duell mit dem Kommandanten gewonnen. Eure Seeleute machen sich auf den Weg zur Schatzkammer und nehmen %1 mit.<n><n>Wählt nun, welche Waren Ihr aus dem Lagerhaus der Stadt plündern wollt."
"0xcb8dbdae" = "feindliche Musketiere "
"0xcb8dd6d9" = "Unser Feind @n$HostileNation$ schreckt vor nichts zurück. Meine Frau wurde entführt, und an ihre Freilassung sind gewisse Bedingungen geknüpft. Doch ich weiß zufällig, wo man sie festhält. Offiziell kann ich nichts tun, das versteht Ihr, aber Ihr könntet die Stadt angreifen und sie mir zurückbringen."
"0xcb8dd6da" = "Schön, Euch zu sehen.<n>Meine Frau erhielt vor Kurzem einen frisierten Pudel aus Paris. Das elende Tier treibt mich in den Wahnsinn, doch meine Frau ist vernarrt in den Hund.<n>Jemand erfuhr davon, entführte den Hund und übergab ihn unseren Feinden, um uns zu erpressen.<n><n>Könnt Ihr den Pudel für mich retten?"
"0xcb8dd6db" = "Vor einiger Zeit ist meine jüngste Tochter mit irgendeinem durchreisenden Abenteurer durchgebrannt, so hieß es damals. Nun habe ich erfahren, dass sie in @T$TargetTown$ lebt und den Kommandanten der Stadt heiraten soll. Ich kenne meine Tochter, sie würde so etwas niemals aus freiem Willen tun! Ich kann dem Vizekönig kaum vorschlagen, dass wir eine Stadt angreifen müssen, um meine Tochter zu retten? Aber wie steht es mit Euch?"
"0xcb9b3a82" = "[term:en_plague_of_rats] ausgebrochen"
