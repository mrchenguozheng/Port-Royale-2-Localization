"0x343e9f4b" = "Herzlichen Glückwunsch! Ihr kennt nun die Grundlagen des Städtebaus.<n><n>Sobald Eure Produktionsanlage errichtet ist, stellt sie automatisch Arbeiter ein. Jeder Siedler, der im Hafen darauf wartet, angeheuert zu werden, lässt sich in einen Arbeiter und vier Bürger umwandeln. Ein Siedler steht also für eine ganze Siedlerfamilie.<n><n>Damit Eure Betriebe genug Arbeiter haben, müsst Ihr dafür sorgen, dass ausreichend Siedler zur Arbeit verfügbar sind. Transportkonvois bringen Siedler aus Europa in die Gouverneursstädte, von wo aus sie von Händlern in die anderen Städte gebracht werden<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Sorgt dafür, dass Ihr genug Arbeiter für Euren Betrieb in Santa Marta habt."
