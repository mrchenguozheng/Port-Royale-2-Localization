"0x273267f2" = "Oh, ich kann's noch gar nicht fassen. Da haben mir Trunkenbolde doch glatt mein schönes Schiff geklaut. Sie haben es mit Flaschen voll Rum beladen und sind damit abgehauen. Könnt Ihr mir helfen, mein Schiff zu suchen?"
"0x273267f3" = "Ich hätte es wissen müssen. Mein nichtsnutziger Sohn Boris hat sich mein schönstes Schiff ausgeliehen. Nun habe ich erfahren, dass er und seine Freunde beschlossen haben, einen Ausflug zu machen. Sicher haben sie den Laderaum mit Rum vollgepackt, und ich bin sicher, ich werde mein Schiff wohl nie wiedersehen. Könntet Ihr mein Schiff für mich zurückholen?"
"0x27344ff4" = "Vielen Dank für die pünktliche Lieferung, der Gouverneur wird entzückt sein. Das Hochzeitsfest beginnt noch heute!"
"0x273d7e0f" = "Alle Eure Seeleute haben bereits die höchstmögliche Moral."
