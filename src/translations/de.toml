"0xec86613a" = "Liefert bis @D$EndDate$ @a$Amount$ @G$Goods$ an den Markt in @T$TOWN$. Dort erhaltet Ihr @g$Price$ pro Fass."
"0xecb4ae47" = "Funktion"
