"0x034e66b1" = "Lagerhäuser"
"0x0351768f" = "Habt Ihr schon von diesem Piraten Blackbeard gehört? Sein richtiger Name ist Edward Teach, und er hat mehrere Konvois unter sich, die seit einiger Zeit mit großem Erfolg Händler aller Nationen angreifen. Bisher hat es jedoch niemand geschafft, ihn zu fassen.<n><n>Daher erteile ich Euch den Auftrag, einen seiner Konvois aufzuspüren und zu zerstören."
"0x03517690" = "Das Treiben von Blackbeards Bande ist bereits auf dem Rückzug, doch können wir uns dieser elenden Schufte wegen nicht auf unseren Lorbeeren ausruhen. Daher erteile ich Euch den Auftrag, noch einen weiteren Konvoi von Blackbeard zu zerstören."
