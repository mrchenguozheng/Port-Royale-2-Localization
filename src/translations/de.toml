"0x03ce7c8e" = "Szenarioziel"
"0x03d3dcd8" = "Während Ihr die Stadt plündert, entdeckt Eure Mannschaft auch, wo sich die Frau des Gouverneurs versteckt hielt, und „befreit“ die Frau. Sie war gerade in der Küche.<n> „Bringt mich nicht zum Gouverneur nach @T$TOWN$ zurück. Ich habe ihn nie geliebt, ich schwöre es!“.<n><n>Wollt Ihr diese Frau mitnehmen und trotz ihrer Bitten zum Gouverneur zurückbringen? "
"0x03d3dcd9" = "Während Ihr die Stadt plündert, stoßen Eure Männer auf einen jungen Buben mit einem Pudel. Der Junge erzählt Euch, der Gouverneur von @T$TOWN$ habe die Entführung selbst inszeniert, um den Hund loszuwerden. Der Kapitän beschließt, Michelle an Bord seines Schiffs zu nehmen. Dann fragt er sich, ob es sich lohnt, den Hund zum Gouverneur von @T$TOWN$ zurückzubringen.<n><n>Wollt Ihr den Hund über Bord werfen?"
"0x03d6dcdb" = "Piratenjagd"
"0x03dfeb8d" = "<c><o:0xFFFFE6A0>%1<n><o:0xFFEBF0A0>(Spielerstadt)"
"0x03e1b0eb" = "Welch ein Pech! Ich muss für die Transportkonvois aus Europa regelmäßig Bestände an Kolonialwaren haben, aber wir haben kein Werkzeug, um diese Waren überhaupt erzeugen zu können. Würdet Ihr mir nicht helfen, eine Stadt mit Werkzeug zu versorgen?"
"0x03e1b0ec" = "Wie konnte das nur passieren! In @T$DestTown$ sind die Werkzeugvorräte zur Neige gegangen, und nun ist die Produktion von Kolonialwaren bedroht. Helft Ihr mir, dieses Dilemma zu lösen?"
"0x03e1b0ed" = "Meiner Nation fehlen Werkzeuge. Wir sollten sie bei den anderen Nationen beschaffen. Was meint Ihr?"
"0x03e9fe1e" = "[town:Tortuga] in Not"
"0x03efad5a" = "Es liegen keine Nachrichten vor"
"0x03efff11" = "Ihr habt mich so glücklich gemacht! Eilt zu meinem Vater, er wird außer sich vor Freude sein!"
"0x03f2ddbd" = " @A$USER$, kommt her und setzt Euch, ich habe etwas Geschäftliches mit Euch zu besprechen.<n>Ich versuche, @G$Goods$ für @n$HostileNation$ zu kaufen. Wie Ihr wisst, befinden sich @n$Nation$ und @n$HostileNation$ im Krieg. Tatsächlich ist es in @n$HostileNation$ mittlerweile strafbar, @G$Goods$ aus @n$Nation$ einzuführen, und entsprechend gute Preise werden gezahlt. Also möchte ich Euch fragen, ob Ihr an einem kleinen Schmuggel interessiert wärt?"
"0x03f2ddbe" = " @A$USER$, wärt Ihr an einem kleinen Schmuggel interessiert? Ich bin im Auftrag eines Händlers aus @T$TargetTown$ hier. Wegen des Krieges dürfen derzeit keine Waren aus Städten von @n$Nation$ nach @T$TargetTown$ transportiert werden. Der Mann, der mich schickte, ist an @G$Goods$ interessiert. Er zahlt Euch @g$Price$ für jedes Fass, das Ihr ihm liefert. Was sagt Ihr?"
"0x03fb5c67" = "Aufgrund Eures weiterhin schlechten Verhältnisses zu %1 wurden heute %3 Eurer Betriebe in %2 beschlagnahmt."
"0x03fb5c68" = "<n>Ich würde Euch raten, einem meiner Gouverneure einen Besuch abzustatten, um Euer Verhältnis zu meiner Nation zu verbessern."
"0x03fb5c69" = "<n>Ich würde Euch raten, mich zu besuchen, damit wir Euer Verhältnis zu meiner Nation besprechen können."
"0x03fb5c6a" = "<n><n>%1, Vizekönig von %2"
"0x04081363" = "Ein Rivale von mir in @n$HostileNation$ hat meine Tagebücher gestohlen und will sie nun nach Europa schicken. Es ist entscheidend, dass ihm das nicht gelingt. Zum Glück konnte ich den Steuermann des Schiffs bestechen, das die Tagebücher nach Europa bringt. Nun brauche ich Eure Hilfe."
"0x04081364" = "Wir werden seit Langem von @n$HostileNation$ ausgespäht. Ich habe entdeckt, dass all die erlangten Informationen sorgfältig aufgezeichnet wurden und nun von @T$HostileTown$ nach Europa geschickt werden sollen. Ich möchte, dass Ihr mir helft, dafür zu sorgen, dass diese Papiere die Karibik nie verlassen."
"0x040bf5f1" = "Spiel einsenden"
"0x04100fa0" = "%1: Piratenangriff"
"0x0420c2a2" = "<ts:20>Ihr wisst bereits, wie man im Handelsfenster Waren kauft und verkauft. Hier noch einige Tipps:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Der auf den Pfeilen angezeigte Preis hängt von der Einheitsgröße ab<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Es macht keinen Unterschied, ob Ihr eine Ware zehnmal einzeln kauft oder verkauft oder zehn Waren auf einmal kauft oder verkauft. Der Gesamtpreis ist derselbe.<n><n><g:INTEXT_AUSRUF_800x600.screen>Ein Preis wird stets angezeigt, auch wenn eine Ware nicht verfügbar ist. Es ist immer der Preis für eine Einheit Ware, unabhängig von der eingestellten Einheitsgröße.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Ihr könnt auch handeln, indem Ihr auf das Symbol einer Ware klickt. Daraufhin erscheint ein kleines Fenster mit einem Schieberegler. Mit diesem Schieberegler legt Ihr fest, wie viele Waren Ihr kaufen oder verkaufen wollt. Der Einzelpreis und der Gesamtpreis werden dann sofort angezeigt."
"0x0424bb9a" = "Chronik"
"0x0436c531" = "Ihr habt ein ganz besonderes Schiff gefunden!<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Dampfgetriebenes Segelschiff<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>Niemals in Eurem Leben habt Ihr ein solches Schiff gesehen! Es scheint nicht nur von den Segeln an seinen beiden Masten angetrieben zu werden, sondern auch von einem seltsamen Mechanismus, der mit Dampf zwei Schaufelräder antreibt. Anscheinend kann das Schiff dadurch auch ohne einen Hauch Wind Fahrt machen."
"0x044bc6d2" = "Euer Kapitän hat seinen Säbelkampf gegen %1 gewonnen. Eure Männer beginnen, nach dem Piratenschatz zu suchen, und finden %2.<n><n>Ihr habt das Versteck zerstört und die Herrschaft des Piraten %3 beendet. "
"0x044bc6d3" = "Euer Kapitän hat seinen Säbelkampf mit %1 gewonnen. Eure Männer beginnen, nach dem Piratenschatz zu suchen, und finden %2. Zwar habt Ihr das Versteck zerstört und die von ihm ausgehenden Gefahren erfolgreich beseitigt, doch gibt es Anzeichen, dass Ihr nicht alle Schiffe vernichtet habt. Die übrigen Schiffe könnten sich ein neues Versteck suchen."
"0x044e52eb" = "Szenarien"
"0x045d87c5" = "Ihr müsst durch Handel @g$GoldGoal$ Bargeld anhäufen."
"0x04709af6" = "Aufträge"
"0x0471f13a" = "Ihr habt ein Darlehen über %1 erhalten. Die Rückzahlung beträgt %2 und ist am %3 fällig."
