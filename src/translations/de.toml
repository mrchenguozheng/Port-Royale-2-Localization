"0x04e000d9" = "Kapitän %1 hat den bisherigen Kapitän abgelöst."
"0x04e4fc22" = "Stadt - Lagerhaus-Handel"
"0x04e5002a" = "In [town:Tortuga] ist ein Arbeiterstreik ausgelöst worden. Alle Arbeiter haben die Arbeit niedergelegt und streiken nun (sie verursachen Eurem Betrieb aber weiterhin Kosten).<n><n>Eure Aufgabe ist es, reichliche Bestände der Waren zu unterhalten, die die Arbeiter normalerweise produzieren, damit der Streik scheitert und sie die Arbeit wieder aufnehmen.<n><n>Hinweis: Die Stadt produziert Weizen, Lehmziegel, Baumwolle, Zucker und Tabak. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Bestände der in der Stadt produzierten Waren müssen bis @D$EndDate$ je Ware @a$Amount$ betragen."
"0x04f319ed" = "Geht in den nächsten 30 Tagen zum Markt in @T$Town$, um Eure Belohnung abzuholen."
