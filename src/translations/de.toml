"0xf9404c19" = "Leider kann ich Euch nicht sagen, wo einer von Blackbeards Konvois zu finden ist, denn sie halten sich derzeit an einem geheimen Ort auf. Dafür räume ich Euch für diesen Auftrag reichlich Zeit ein. Ihr habt bis @D$EndDate$ Zeit, um einen Konvoi zu zerstören."
