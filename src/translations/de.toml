"0xe10e4380" = "Eure Zeit ist um, aber Ihr habt das abschließende Szenarioziel nicht erreicht.<n><n>Im freien Spiel kann der Vizekönig jeder Nation Euch eine eigene Stadt schenken. Doch das ist nicht so leicht zu erreichen, denn Ihr müsst stets Städte erobern, um ein Stück Land zugesprochen zu bekommen, und das beschädigt naturgemäß Euer Ansehen bei den anderen Nationen. <n><n>Alles, was Ihr in diesem Szenario über den Ausbau Eurer Stadt gelernt habt, wird Euch auch beim Aufbau von Gewerben in anderen Städten helfen. Der wesentliche Unterschied ist, dass Ihr Euch dort keine Sorgen um die Verteidigung machen müsst."
"0xe10f2f85" = "Dann freue ich mich auf das Geschäft mit Euch.<n>Liefert so viel @G$Goods$ wie möglich an den Markt in @T$TOWN$. Ich werde dort ebenfalls mehrere Lieferungen erhalten und Euch @g$Price$ sofort bezahlen.<n>Der Expeditionskonvoi wird am @D$EndDate$ hier eintreffen. Gewährleistet diesem Konvoi sichere Fahrt nach Europa, und ich zahle Euch den Rest des Goldes."
