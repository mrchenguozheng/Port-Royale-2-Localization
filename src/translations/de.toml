"0xf353a9ce" = "Ich freue mich, Euch zu sehen, @A$USER$. Ich habe unterwegs ein Paket verloren. Könntet Ihr es für mich finden?"
"0xf353a9cf" = "Grüße! Besitzt Ihr ein Schiff? Ich habe meines in einem Sturm verloren. Zum Glück konnte ich mich retten, doch ich habe meine Truhe mit vielen meiner wertvollsten persönlichen Habseligkeiten verloren. Könntet Ihr in See stechen und nachsehen, ob meine Truhe noch irgendwo auf dem Meer treibt? Ich werde Euch fürstlich belohnen, denn die Truhe ist mir sehr wertvoll."
