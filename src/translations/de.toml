"0x07cd4054" = "Statten dem spanischen Vizekönig in [town:Port Royale] einen Besuch ab und nehmt einen Auftrag an, für ihn Städte zu erobern. Nachdem Ihr diesen Auftrag erfüllt habt, könnt Ihr sein Geschenk, ein Stück Land, annehmen."
