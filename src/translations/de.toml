"0xd07dbe34" = "Die wichtigsten Faktoren für die Lebensqualität in einer Stadt sind Angebot und Auswahl der verfügbaren Waren. Ihr müsst jedoch nicht alle Warenarten bereitstellen, um die Einwohner zufrieden zu halten.<n><n>Die Waren einer Stadt lassen sich in fünf Gruppen einteilen: Grundnahrung, Rohstoffe, Fertigwaren, Kolonialwaren und Importwaren. Im Handelsfenster stehen sie in derselben Reihenfolge. Versorgt Ihr zwei bis drei Waren aus jeder Gruppe ausreichend, ist die Lebensqualität in Eurer Stadt gut. <n><n>Ihr habt gerade eine Nachricht zum Thema Lebensqualität in Städten erhalten. Im Logbuch könnt Ihr sie nachlesen.<n><n>Da Eure Stadt noch klein ist, fällt eine gute Lebensqualität besonders leicht – die Bürger kleiner Städte stellen keine hohen Ansprüche. Euer Ziel dürfte also kein Problem sein. Eine Stadt mit weniger als 2.000 Einwohnern kann jedoch nicht über den Status „Aufschwung“ hinaussteigen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Sorgt dafür, dass Eure Stadt von jeder Ware fünf Fässer vorrätig hat."
