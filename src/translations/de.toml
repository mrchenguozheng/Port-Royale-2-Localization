"0xe6490f96" = "Wir schreiben das Jahr 1676 in der niederländischen Gouverneursstadt der Türkeninseln. Holland besitzt sieben Städte, davon fünf Kolonialstädte, eine Gouverneursstadt und eine Vizekönigsstadt.<n><n>England besitzt 14 Städte und befindet sich seit langem im Krieg mit Holland, und das wird noch viele Monate so bleiben. Solange dieser Krieg dauert, müsst Ihr im Namen Hollands Städte der englischen Krone erobern.<n><n>Doch bevor Ihr englische Städte angreifen könnt, braucht Ihr mehr Kapital und mehr Waffen für Euren Konvoi. Euer erstes Ziel ist es, drei englische Handelskonvois zu besiegen und ihre Schiffe zu kapern.<n><n>Zuerst aber müsst Ihr Euch vom niederländischen Gouverneur auf den Türkeninseln einen Kaperbrief besorgen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Statte dem Gouverneur der Türkeninseln einen Besuch ab und holt Euch einen Kaperbrief gegen England."
"0xe64f1385" = "Sehr gut! Ihr habt einen der Piratenkonvois von Blackbeard zerstört. Geht nun zum Gouverneur von @T$TOWN$ und holt Eure Belohnung ab.<n><n>Er hat außerdem einen weiteren Auftrag für Euch.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erfüllt einen weiteren Auftrag für den Gouverneur von @T$TOWN$."
"0xe65025c3" = "in 1 Stadt"
"0xe6510ae7" = "Ihr müsst bis @D$EndDate$ die Vorräte an Weizen, Ziegel, Baumwolle, Zucker und Tabak auf je @a$Amount$ steigern."
"0xe65524e7" = "Sorgt dafür, dass Eure Stadt von allen Waren je @a$Amount$ vorrätig hat."
