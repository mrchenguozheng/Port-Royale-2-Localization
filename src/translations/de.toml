"0x39e32dc6" = "Ich danke Euch vielmals. Die Stadt in Frage heißt @T$TargetTown$. Ich hoffe, ich kann mich mit den Händlern bis @D$EndDate$ einigen. Bis dahin darf die Stadt nicht unter den Status „Aufschwung“ fallen, damit ich aus einer stärkeren Position verhandeln kann."
"0x39e32dc7" = "Die Stadt in Frage ist @T$TargetTown$. Versorgt die Stadt mit allen Waren, die sie braucht. Ich werde mein Möglichstes tun, um das Gerücht bis @D$EndDate$ ein für alle Mal zu ersticken. Bis dahin darf die Stadt nicht unter den Status „Aufschwung“ fallen."
"0x39e32dc8" = "Die Stadt in Schwierigkeiten ist @T$TargetTown$. Ihr Status darf bis @D$EndDate$ nicht unter „Aufschwung“ fallen, sonst verlassen zu viele Bürger die Stadt. Es besteht sogar die Gefahr, dass dort eine Seuche ausbricht. Ihr müsst dafür sorgen, dass Ihr die Stadt rechtzeitig mit genug Waren versorgt, um das zu verhindern!"
"0x39e32dc9" = "Gut. @T$TargetTown$ ist die Stadt in Frage. Versorgt die Stadt bis @D$EndDate$ mit allem, was sie braucht. Ihr Status darf nicht unter „Aufschwung“ fallen. Ich muss ehrlich sein und Euch sagen, dass die Stadt durchaus von einer Seuche heimgesucht werden könnte. Seid darauf vorbereitet."
"0x39e7361e" = "%1 besiegt"
"0x39e9081a" = "Ihr habt den Standort von Blackbeards Versteck entdeckt. Informationen über die Piratenbande erhaltet Ihr, wenn Ihr auf der Seekarte mit der linken Maustaste auf das Verstecksymbol klickt.<n><n>Achtung: Wenn Ihr ein Versteck zerstört, wird die Piratenbande ausgelöscht. Piratenkonvois, die sich zu diesem Zeitpunkt nicht im Versteck befanden, werden jedoch informiert und errichten dann ein neues Versteck.<n><n>Zuerst sollt Ihr daher alle Konvois vernichten, die zum Versteck gehören. Am besten lauert Ihr Konvois auf, die in das Versteck hinein- oder hinausfahren, und greift sie an.<n><n>Ihr habt weiteres Bargeld erhalten, das Euch bei Eurer Aufgabe unterstützen soll.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vernichtet alle Piratenkonvois von Blackbeard, die sich derzeit auf See befinden. Greift sein Versteck nicht an!"
