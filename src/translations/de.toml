"0xee7aaf49" = "Findet bis @D$EndDate$ einen Konvoi des Piraten @P$PirateName$ und zerstört ihn. Die zuletzt bekannte Position eines seiner Konvois ist für Euch auf der Seekarte markiert. @l$Pos$"
