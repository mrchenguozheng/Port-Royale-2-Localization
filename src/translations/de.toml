"0xf64f1e5a" = "Wie Ihr wisst, befinden wir uns im Krieg. Um die Wirtschaft von @n$TargetNation$ zu schwächen, möchte ich, dass Ihr @I$NumShips$ Handelsschiffe kapert oder versenkt. Nehmt Ihr diesen Auftrag an? "
"0xf64f1e5b" = "Wir befinden uns im Krieg mit @n$TargetNation$. Deshalb möchte ich, dass Ihr eine bestimmte Zahl von Handelsschiffen versenkt oder kapert. Alles, was Ihr von ihnen erbeutet, gehört Euch; mir geht es allein darum, die Wirtschaft von @n$TargetNation$ zu schwächen. Kann ich mit Euch rechnen?"
"0xf64f1e5c" = "Ich habe mich gefragt, ob Ihr uns in unserem Krieg gegen @n$TargetNation$ helfen könntet. Ich möchte Euch in ein bestimmtes Gebiet entsenden und Euch auftragen, dort Schiffe zu kapern oder zu versenken. "
"0xf651cc3f" = "Holland und England haben Frieden geschlossen, daher könnt Ihr keine Städte mehr erobern.<n><n>Ihr seid in diesem Szenario recht weit gekommen, hattet aber nicht genug Zeit, um im Namen Hollands genügend Städte zu erobern.<n><n>Auf dieselbe Weise könnt Ihr auch im freien Spiel Städte erobern. Zuvor müsst Ihr jedoch sicher sein, dass die Nation, deren Städte Ihr erobern wollt, militärisch schwach ist. Außerdem muss die Nation, die diese Städte erobern will, militärisch stark sein, und die beiden Nationen müssen sich im Krieg miteinander befinden.<n><n>Hinweis: Immer wenn Ihr für einen Vizekönig Städte erobert, wird Euch für gewöhnlich ein Stück Land zugesprochen, auf dem Ihr eigene Städte gründen könnt. In diesem Szenario ist diese Funktion jedoch deaktiviert."
"0xf65a5a04" = "Ihr könnt nun Euer Ansehen in %1 steigern, indem Ihr englische Schiffe und Städte angreift. Euer Ansehen bei den anderen Nationen wird dadurch nicht gemindert."
