"0x072a9579" = "Ich danke Euch sehr, dass Ihr mir die eingeführten Waren gebracht habt, denn wir in der Neuen Welt werden seit vielen Wochen nicht mehr von den Transportkonvois meiner Nation versorgt. Als Belohnung übergebe ich Euch zwei holländische Handelsfleuten. Sie warten im Hafen auf Euch."
"0x0744a699" = "Ich kann Euch nicht sagen, wie viele Städte die Schatzflotte noch anlaufen wird. Sicher ist nur, dass die Flotte mit jeder Stadt, die sie anläuft, mehr Gold an Bord nimmt. Wann Ihr angreift, ist mir egal, denn das Gold könnt Ihr behalten. Ich möchte nur, dass Ihr dafür sorgt, dass die Schatzflotte verschwindet. Zuletzt war sie in @T$StartTown$, und ihr nächster Anlaufhafen ist @T$DestTown$, wo sie etwa fünf Tage vor Anker liegen wird."
"0x0744a69a" = "Also müsst Ihr schnell handeln. Zuletzt war sie in @T$StartTown$, von dort ist sie nach @T$DestTown$ aufgebrochen, wo sie länger als gewöhnlich ankern wird. Je länger Ihr Euren Angriff hinauszögert, desto mehr Gold hat sie an Bord. Das könnt Ihr alles behalten, doch die Schatzflotte darf Europa nie erreichen."
"0x0744a69b" = "Abgemacht, ich danke Euch. Wenn meine Informationen stimmen, hat die Schatzflotte kürzlich @T$StartTown$ verlassen und ist auf dem Weg nach @T$DestTown$. Dort wird sie länger als gewöhnlich ankern. Nun beeilt Euch und fangt sie ab!"
