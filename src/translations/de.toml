"0xf4e195bf" = "Blackbeard hat erfahren, dass Ihr mit dem Gouverneur von @T$TOWN$ zusammenarbeitet. Daher hat er begonnen, die Händler einzuschüchtern, die @T$TOWN$ anlaufen. Innerhalb weniger Tage werden kaum noch Händler wagen, nach @T$TOWN$ zu kommen. <n><n>Das ist nur eine vorübergehende Taktik. Eure Aufgabe ist es, die Stadt bis @D$EndDate$ mit Waren zu versorgen. Der Status der Stadt darf nicht unter „Blütezeit“ fallen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Versorgt @T$TOWN$ bis @D$EndDate$ mit Waren. Der Status der Stadt darf nicht unter „Blütezeit“ fallen."
