"0xc66396bb" = "Seht hier, ich habe die zuletzt bekannte Position auf Eurer Seekarte eingezeichnet. @l$Pos$ Findet diesen Konvoi und zerstört ihn. Ihr habt bis @D$EndDate$ Zeit."
"0xc66396bc" = "Ihr müsst schnell handeln. Die aktuelle Position des Konvois ist auf Eurer Seekarte eingezeichnet. @l$Pos$ Ihr habt bis @D$EndDate$ Zeit, diesen Konvoi zu finden und zu zerstören."
"0xc66396bd" = "Habt Dank! Beeilt Euch, denn es wird sehr schwer sein, den Konvoi zu finden, wenn er sich eine neue Region als Ziel gewählt hat. Seine letzte Position ist auf Eurer Seekarte eingezeichnet. @l$Pos$ Ihr habt bis @D$EndDate$ Zeit."
