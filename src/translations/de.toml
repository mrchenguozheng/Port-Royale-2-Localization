"0x31ed47e7" = "Ein Saboteur hat die Lebensmittelversorgung in [town:Tortuga] verseucht. Dadurch ist in der Stadt sofort eine Hungersnot ausgebrochen.<n><n>Eure Aufgabe ist es, diese Hungersnot so schnell wie möglich zu beenden.<n><n>Etwa 2–3 Wochen lang müsst Ihr dafür sorgen, dass bei möglichst vielen Nahrungsmitteln mehr Waren verfügbar sind als täglich verbraucht werden.<n><n>Hinweis: Zu den Nahrungsmitteln gehören Weizen, Früchte, Mais und Fleisch.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Hungersnot muss bis @D$EndDate$ beendet sein."
