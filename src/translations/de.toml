"0x3353aa4c" = "Ausgezeichnet! Nun solltet Ihr weitere englische Städte im Namen Hollands erobern. Doch beeilt Euch, denn Ihr könnt Städte nur erobern, solange Holland und England im Krieg sind.<n><n>Wie üblich erteilt Euch einen solchen Auftrag nur der Vizekönig in [town:Grand Bahama]. Bevor Ihr weitere Aufträge zum Erobern von Städten bekommt, müsst Ihr vielleicht erst die militärische Stärke der beiden Nationen beeinflussen. Ihr wisst bereits, wie das geht.<n><n>Als Verstärkung hat Euch der Gouverneur der [town:Turk Islands] drei weitere Karacken geschenkt.<n><n>Im Hafen sind außerdem viele Matrosen und Waffen verfügbar.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erfüllt zwei weitere Aufträge zur Eroberung von Städten für den niederländischen Vizekönig, bevor der Krieg zwischen Holland und England endet. Ihr habt bis @D$EndDate$ Zeit. Danach ist das Szenario vorbei."
