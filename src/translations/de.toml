"0xfc64ab0e" = "You can now boost your reputation in %1 by attacking French ships and towns. This will not diminish your reputation in the other nations."
"0xfc692ef1" = "<n><n>However, if at least one ship in your convoy survives the battle, the captain survives also."
"0xfc71eb4b" = "What misfortune has befallen me. Since the outbreak of war with @n$FoeNation$, I have not been able to accumulate enough colonial goods for the transport convoys. Can you assist by providing me with a large shipment of @G$Goods$?"
"0xfc71eb4c" = "Since we went to war with @n$FoeNation$, their traders have been forbidden to deliver @G$Goods$ to the towns belonging to my nation. I am now faced with a significant shortage of goods. You have many ships and know the seas well. Could you not secure me a large shipment of @G$Goods$?"
"0xfc72151e" = "Lagerhaus - Konvoiübergabe"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Durch Kanonen"
"0xfc910833" = "Verfügbare Wohngebäude"
"0xfc9a5f7d" = "Es war mir ein Vergnügen, mit Euch Geschäfte zu machen. Guten Tag!"
"0xfc9a5f7e" = "Die Waren wurden in Euer Lagerhaus gebracht. Guten Tag!"
"0xfc9a5f7f" = "Die Waren wurden auf Euren Konvoi geladen. Lebt wohl, %1."
"0xfc9cf623" = "Abgeschlossen"
"0xfca882e8" = "As you know, the Spanish treasure fleet always takes a different route when collecting treasures from its colonies and shipping them to Europe. The fleet avoids being ambushed by only ever staying a short time at each town. However, this time Spain has committed a serious blunder, by allowing us to find out the route the Spanish treasure fleet is following at this very moment. Your orders couldn't be simpler. Destroy every last ship!"
"0xfca882e9" = "We are at war with Spain and must ensure that the Spanish treasure fleet never reaches Europe. Luckily, we have learned which town the fleet will be calling at next. We will sabotage the fleet at this town so that it has to prolong its stay in the harbor. This should give you enough time to intercept the fleet and prevent it from reaching Europe. Do you accept this mission?"
"0xfca882ea" = "You don't get opportunities like this every day! Today one of my informants told me the route the Spanish treasure fleet is currently following. But that's not all. We have learned that the fleet will be lying at anchor for longer than usual at the next town it visits. Since we are at war with Spain, we should give the viceroy something to smile about and make sure the treasure fleet never reaches its destination in Europe. Will you intercept the fleet for my nation?"
"0xfcc82d44" = "Säbelkämpfer"
"0xfcd6fdec" = "Wie ich sehe, habt Ihr meinen letzten Auftrag noch nicht erfüllt. Erledigt diese Arbeit, denn ich habe weitere Aufgaben für Euch."
"0xfcded04c" = "IDM_CONTEST_01_2004_LOG_01_TEXT"
"0xfce1cfd1" = "I'm afraid I have no use for you at the moment.<n> I can only task you with capturing a town if a hostile nation is weakened and I have enough military convoys available to protect my towns."
"0xfce38f12" = "Stadtkommandant"
"0xfcf67c79" = "%s%s"
