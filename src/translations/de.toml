"0x00776793" = "Eintrag löschen"
"0x007c2733" = "Dann beauftrage ich Euch damit, @T$TargetTown$ bis @D$EndDate$ auf den Status „Blütezeit“ zu bringen. Bringt der Stadt die Waren, die sie braucht, und nehmt Überschusswaren mit, damit die ansässigen Händler wieder richtig produzieren. "
"0x007f40c8" = "Siedlerwachstum in der Stadt"
"0x0087e50b" = "+"
"0x00885bdb" = "Gut gemacht! Nun habt Ihr eine eigene Stadt! Niemand außer Euch darf in dieser Stadt bauen. <n><n>Die Stadt hat bereits einige Gebäude, etwa das Handelsdock, an dem Ihr handeln könnt, und Euren Palast. Den Rest müsst Ihr selbst bauen.<n><n>Segelt mit Eurem Konvoi zu Eurer Stadt. Nehmt so viel Holz und so viele Lehmziegel mit, wie Ihr nur könnt – Ihr braucht sie zum Bauen.<n><n>Baut zuerst eine Werft, in der Ihr Eure eigenen Schiffe reparieren könnt.<n><n>Hinweis:<n> Die Mannschaft auf Euren Geleitschiffen kostet viel Geld. Entlasst sie, Ihr braucht sie nicht mehr.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Besucht Eure neue Stadt und baut eine Werft."
"0x009aa6c5" = "%1 (vor 1 Tag)"
"0x009dba4d" = "Ihr könnt diesen Teil des großen Betriebs nicht abreißen, da es sich um eine Bebauung handeln würde, für die Ihr keine Genehmigung habt."
