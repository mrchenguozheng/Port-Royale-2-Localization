"0x3641d8d1" = "Ich danke Euch, dass Ihr mir meine Frau zurückgebracht habt. Obwohl ich die Ruhe der letzten Tage sehr genossen habe, konnte ich meine Frau doch nicht einfach meinen Feinden überlassen. Als Belohnung nehmt diese Karte, die ein Versteck mit @a$Amount$ Waren zeigt."
"0x3641d8d2" = "So habt Ihr mir meine Frau also nicht zurückgebracht! Dann kann ich Euch nicht belohnen. Unter uns gesagt: Ich bin Euch eigentlich sehr dankbar."
"0x36573a59" = "Eure Truppen gewinnen bald die Oberhand. Plötzlich wird über der Stadtmauer eine weiße Fahne gehisst: Die Stadtwache hat kapituliert!<n><n>Was wollt Ihr nun tun?"
"0x3657dd22" = "Meine Frau ist außer sich vor Freude, dass Ihr ihren Hund gefunden habt. Nehmt diese Karte, die ein Versteck mit @a$Amount$ Waren zeigt."
"0x3657dd23" = "Was? Ihr habt den Hund tatsächlich über Bord geworfen? Ich danke Euch trotzdem. Natürlich kann ich Euch nicht offiziell belohnen, aber ich habe einst einen Schatz an einem geheimen Ort versteckt. Hier, die Karte."
"0x366de173" = "Oh, ich danke Euch, dass Ihr meine geliebte Tochter zurückgebracht habt. Hier ist eine Karte. Darauf habe ich die Stelle markiert, an der ich einst viele Schätze versteckt habe."
"0x366de174" = "Was habt Ihr getan! Wie konntet Ihr meine Tochter in den Händen des Feindes zurücklassen? Ich werde ganz @n$Nation$ erzählen, dass man Euch nicht vertrauen kann! (Euer Ansehen bei @n$Nation$ ist gesunken)"
