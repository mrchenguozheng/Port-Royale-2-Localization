"0xfb64ad02" = "Ihr habt gewonnen "
"0xfbb36ec1" = "Ich muss Euch noch einmal danken, Ihr habt so viel für meine Nation getan. Ich belohne Euch mit zusätzlichem Land für Eure Stadt %1. Damit besitzt Ihr dann %2% des Distrikts."
"0xfbb97bb9" = "Holt die Belohnung beim Gouverneur ab."
