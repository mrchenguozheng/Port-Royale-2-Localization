"0xe1cdc367" = "Ihr habt nun einige der grundlegenden Steuerungen kennengelernt und wisst, wie man einen Konvoi von einer Stadt in eine andere schickt. Das ist sehr wichtig, denn zunächst werdet Ihr Euren Lebensunterhalt mit dem Transport und dem Handel von Waren zwischen den Städten bestreiten.<n><n>Im zweiten Teil dieses Szenarios werdet Ihr ein Schiff kaufen und es Eurem bestehenden Konvoi hinzufügen.<n><n>Noch ein Tipp:<n><n>Ihr könnt jederzeit während des Spiels F1 drücken, um eine Hilfeseite mit der Belegung von Tastatur und Maus anzuzeigen.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Euer Konvoi mit zwei Schiffen muss den Hafen der Stadt Cartagena erreichen."
