"0x35f49132" = "Hier liegt eine Insel, wie in einer Wiege. Das Land aus dem Norden krümmt sich im Winkel darum."
"0x35f49133" = "Hier liegt eine Insel, wie in einer Wiege. Das Land aus dem Norden krümmt sich im Winkel darum."
"0x35f49134" = "Ihr kommt aus dem Westen und überquert die Brücke. Die Stadt mit dem X liegt nur ein Stück weiter."
"0x35f49135" = "Oh, was für ein wunderbarer Ort. In einer Bucht gebettet. Von hoch aufragenden Klippen geschützt, das ist X, sage ich!"
"0x35f49136" = "Nicht weit von der Stadt, am Fuß einer Klippe, liegen die zerschlagenen Reste eines alten Wracks."
"0x35f49137" = "Ein mächtiger Fluss strömt so tief, weiter nach Osten und in den Sumpf. Von dort nach Südosten, zeitweise über Land. Zur Stadt mit dem X, am Rand, am Ende."
