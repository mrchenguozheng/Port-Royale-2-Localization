"0x3545057e" = "Ich habe etwas mehr über die Artefakte und den besonderen Ort herausgefunden. Eines kann ich nun mit Sicherheit sagen: %1 Was dieser Ort birgt, weiß ich nicht. Um die Position genauer zu bestimmen, brauche ich mehr Artefakte."
"0x354505ea" = "Ich habe sehr gute Nachrichten: Mit dem letzten Artefakt, das Ihr gefunden habt, konnte ich eine genaue Position ausmachen. Hier, ich zeichne sie Euch auf der Seekarte ein. %1<n>Bitte seid vorsichtig, denn niemand weiß, was dort lauert."
