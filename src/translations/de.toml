"0xe6490f96" = "Wir schreiben das Jahr 1676 in der niederländischen Gouverneursstadt der [town:Turk Islands]. Holland besitzt sieben Städte, davon fünf Kolonialstädte, eine Gouverneursstadt und eine Vizekönigsstadt.<n><n>England besitzt 14 Städte und befindet sich seit langem im Krieg mit Holland, und das wird noch viele Monate so bleiben. Solange dieser Krieg dauert, müsst Ihr im Namen Hollands Städte der englischen Krone erobern.<n><n>Doch bevor Ihr englische Städte angreifen könnt, braucht Ihr mehr Kapital und mehr Waffen für Euren Konvoi. Zuerst sollt Ihr drei englische Handelskonvois besiegen und ihre Schiffe kapern.<n><n>Zuerst aber müsst Ihr Euch vom niederländischen Gouverneur auf den [town:Turk Islands] einen Kaperbrief besorgen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Statten dem Gouverneur der [town:Turk Islands] einen Besuch ab und holt Euch einen Kaperbrief gegen England."
"0xe64f1385" = "Sehr gut! Ihr habt einen der Piratenkonvois von Blackbeard zerstört. Geht nun zum Gouverneur von @T$TOWN$ und holt Eure Belohnung ab.<n><n>Er hat außerdem einen weiteren Auftrag für Euch.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erfüllt einen weiteren Auftrag für den Gouverneur von @T$TOWN$."
"0xe65025c3" = "in 1 Stadt"
"0xe6510ae7" = "Ihr müsst bis @D$EndDate$ die Vorräte an Weizen, Ziegel, Baumwolle, Zucker und Tabak auf je @a$Amount$ steigern."
"0xe65524e7" = "Sorgt dafür, dass Eure Stadt von allen Waren je @a$Amount$ vorrätig hat."
"0xe674b971" = "Schatzkarte"
"0xe67d58b9" = "Gold gefunden"
"0xe6851da5" = "Im letzten Szenario habt Ihr gelernt, dass Euer Rang von Eurem Gesamtvermögen abhängt. Euer Gesamtvermögen umfasst Euer Bargeld sowie Eure Gebäude, Schiffe und Waren. Ihr könnt Euer Gesamtvermögen jederzeit im Protokoll unter „Erfolge“ prüfen.<n><n>Ihr könnt auch den blauen Balken für Eure Erfahrung prüfen, der in der Konvoianzeige stets am unteren Bildschirmrand steht. Erreicht der Balken den rechten Bildschirmrand, werdet Ihr in den nächsten Rang befördert. Ein einmal erreichter Rang kann Euch nicht mehr genommen werden.<n><n>Je höher Euer Rang, desto mehr Konvois könnt Ihr befehligen – und desto mehr Betriebe könnt Ihr später in den Städten errichten. Ab einem bestimmten Rang gibt es für Konvois und Baugenehmigungen keine Obergrenze mehr."
"0xe6d65f53" = "Einwohner"
"0xe6d9252d" = "%1, Ihr seid also der %2, von dem mein Vater so viel erzählt hat. Ich bin %3. Wollt Ihr Euch nicht zu mir setzen und mir von Euren Abenteuern erzählen?"
"0xe6d9252e" = "Ich glaube, von Euch habe ich schon gehört, %1. Ich bin %3, die Tochter des Gouverneurs. Ich wollte schon immer einen %2 kennenlernen. Bitte erzählt mir von Euren Abenteuern!"
"0xe6d9252f" = "Ihr seid also der berühmte %1! Nach allem, was ich über Euch gehört habe, hatte ich Euch viel größer vorgestellt. Aber das macht Euch nicht weniger interessant! Kommt her und erzählt mir von Euren Abenteuern! Mein Vater, der Gouverneur, hat schon so viel von Euch gesprochen."
"0xe6d92530" = "%1,<n>ich bin so glücklich, Euch wiederzusehen. Erzählt mir, wie es Euch seit unserem letzten Treffen ergangen ist. Habt Ihr etwas für mich mitgebracht?"
"0xe6d92531" = "%1,<n>es ist wunderbar, Euch wiederzusehen. Seit unserem letzten Treffen habe ich nicht aufgehört, an Euch zu denken. Kommt schnell herein, ich habe Euch viel zu erzählen."
"0xe6d92532" = "%1,<n>ich bin so glücklich, dass Ihr mich wieder besucht. Ich habe allen meinen Freundinnen von Euren Abenteuern erzählt. Doch nun müsst Ihr mir mehr erzählen, denn die Mädchen dürsten nach Neuigkeiten. Kommt schnell herein."
"0xe6dea2e1" = "Sitz des Vizekönigs von %1"
