"0x227ca1f5" = "<f:fonts/Tiepolo_black13x13aaFHk.res>Stadthafen schützen<n><f:fonts/Tiepolo_bold13x13aaFHk.res>(der Konvoi ist im Hafen und ein Geleitschiff ist anwesend)"
"0x22a3b6d0" = "Schatzsuche"
"0x22b99c70" = "Wollt Ihr das zuletzt errichtete Lagerhaus abreißen?"
"0x22caa09f" = "%1. %2 %3"
"0x22e58881" = "Angriffsmodus"
"0x22fffe32" = "Mein Liebster %1,<n>ich kann meine Ungeduld kaum beherrschen. Bitte eilt zum Markt und liefert die Waren für die Hochzeit, damit wir das Fest bald feiern können."
"0x2310e7f4" = "Um das nächste Szenarioziel anzuzeigen, müsst Ihr Euren Auftrag zur Einnahme der Städte erfüllen."
"0x2335f663" = "Habt Dank, dass Ihr mir das Paket zurückgebracht habt. Hier ist Eure Belohnung von @g$Reward$."
"0x234d00d9" = "Heute begann der Pirat %1, in der Karibik sein Unwesen zu treiben."
"0x23652698" = "Leider kann ich Euch nichts Bestimmtes sagen. Mein Hafenmeister gab mir eine vage Beschreibung des Schiffes, das sie womöglich genommen haben. Ein Händler hat dieses Schiff auf See gesichtet und mir die Stelle gezeigt. @l$Pos$ Durchsucht dieses Gebiet, vielleicht findet Ihr einen Hinweis."
"0x23652699" = "Die Stelle ist @l$Pos$. Durchsucht dieses Gebiet, vielleicht findet Ihr einen Hinweis. Bringt mir meine Tochter wohlbehalten zurück."
"0x2365269a" = "Die Position ist @l$Pos$. Durchsucht dieses Gebiet, vielleicht wollte @F$WifeName$ uns mit dieser Erwähnung etwas sagen. Bitte bringt meine Tochter sicher und gesund zurück. Und wenn Ihr diesen Casanova trefft, richtet ihm meinen besten Gruß aus."
"0x23815ece" = "Seid Ihr sicher, dass Ihr das aktuelle Spiel beenden und zum Hauptmenü zurückkehren wollt?"
"0x2388c117" = "(benötigte Waren nicht an Bord)"
"0x238c039b" = "Festorganisator"
"0x239bed4a" = "Ihr könnt dem Konvoi nicht mehr als 10 Schiffe hinzufügen."
"0x23a8f980" = "Laden / Speichern"
"0x23f0ed65" = "Wir befinden uns im Krieg mit @n$HostileNation$. Einer meiner Kapitäne hatte kürzlich eine kluge Idee, wie wir @n$HostileNation$ demoralisieren können. Er schlug vor, einen Militärkonvoi aus Schiffen unseres Feindes zusammenzustellen, um ihm sozusagen mit gleicher Münze heimzuzahlen.<n>Ihr scheint genau der Mann zu sein, der uns diese Schiffe beschaffen kann."
"0x23f0ed66" = "Da wir uns erneut im Krieg mit @n$HostileNation$ befinden, möchte ich einen neuen Konvoi zusammenstellen, um meine Stadt zu schützen. Ich habe keine Lust, darauf zu warten, dass mir aus Europa ein neuer Militärkonvoi zugeteilt wird.<n>Leider sind meine Mittel derzeit sehr begrenzt, und so kam mir die Idee, die Schiffe unseres Feindes zu nutzen. Wollt Ihr mir helfen, mehrere Schiffe des Typs @S$ShipType$ zu kapern?"
