"0x2a78ce83" = "%1 (%2)"
"0x2a7f7e17" = "So sei es. Ich beauftrage Euch hiermit, Handelskonvois von @n$TargetNation$ anzugreifen und @I$NumShips$ Schiffe zu kapern oder zu versenken. Ihr habt also nur bis @D$EndDate$ Zeit."
"0x2a7f7e18" = "Ich freue mich. Ich bedauere, dass ich Euch nicht viel Zeit lassen kann. Ihr müsst diesen Auftrag bis @D$EndDate$ erfüllen.   Greift Handelskonvois von @n$TargetNation$ an und versenkt oder kapert @I$NumShips$ Schiffe.   "
"0x2a8476a8" = "Produktion in der Stadt"
"0x2a8b96d0" = "Eure Truppen brechen das Stadttor auf und stürmen in die Stadt. Als die Soldaten der Stadt das sehen, kapitulieren sie, und Eure Männer beginnen ohne Widerstand, die Schatzkammer zu suchen. Sie erbeuten %1. "
