"0x0769a667" = "Yanco"
"0x077030da" = "Herzlichen Glückwunsch! Ihr habt dieses Szenario erfolgreich abgeschlossen und habt nun etwas Erfahrung mit Seeschlachten und Hafenangriffen.<n><n>Sorgt stets dafür, dass Eure Geleitschiffe gut bewaffnet sind, bevor Ihr einen anderen Konvoi angreift. Natürlich solltet Ihr auch sehr genau überlegen, welche Konvois Ihr angreift. Transportkonvois aus Europa und Militärkonvois sind immer sehr stark, und auch Piraten werden manchmal zu mächtigen Gegnern.<n><n>Greift Ihr Händler an, ohne zuvor einen Kaperbrief vom Gouverneur einer Nation zu erhalten, wirkt sich das stark auf Euer Ansehen bei allen Nationen aus. Im schlimmsten Fall verfolgen mächtige Militärkonvois Euren Konvoi.<n><n>Ein Tipp: Kapert Ihr einen Handelskonvoi, ohne seine Schiffe zu versenken, und plündert ihn nur, schadet das Eurem Ansehen weit weniger. "
