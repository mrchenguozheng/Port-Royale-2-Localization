"0x2c4a7b42" = "Eure Aufgabe war es, fünf verschiedene Betriebe in [town:Tortuga] zu errichten und die Zahl der Bürger auf 1.500 zu erhöhen. Diese Aufgabe habt Ihr nicht erfolgreich abgeschlossen.<n><n>Beschafft die Rohstoffe, die Ihr für den Bau der Gebäude braucht. Sobald der Bau läuft, solltet Ihr beginnen, die benötigten Siedlerfamilien zu gewinnen. Ihr braucht 30 Siedlerfamilien für jeden Betrieb, und das bringt Euch 120 neue Bürger."
