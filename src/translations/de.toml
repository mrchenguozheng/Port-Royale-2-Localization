"0xfeab2fe1" = "Gut. Der Transportkonvoi wird am @D$DepartDate$ den Hafen von @T$TOWN$ verlassen. Segelt ihm in Richtung Europa voraus und sichert seine Route. Haltet scharf Ausschau nach Militärkonvois von @n$HostileNation$. Euer Auftrag ist erfüllt, wenn es dem Konvoi gelingt, die Gewässer der Neuen Welt unbehelligt zu verlassen."
"0xfeab2fe2" = "Ich danke Euch sehr. Am @D$DepartDate$ wird ein Transportkonvoi meinen Hafen verlassen. Ich möchte, dass Ihr ihn vor den Militärkonvois von @n$HostileNation$ schützt und dafür sorgt, dass er Europa sicher erreicht."
"0xfeab2fe3" = "Ihr seid ein Mann der Tat. In Kürze wird hier ein Transportkonvoi eintreffen, der am @D$DepartDate$ den Hafen nach Europa verlässt. Segelt ihm voraus und sichert seine Route, um ihn vor Angriffen zu bewahren."
"0xfeadceb1" = "In der Demo könnt Ihr nur die Städte betreten, die bereits zu Spielbeginn gezeigt wurden.<n><n>Ihr könnt jedoch mit jeder Stadt handeln, indem Ihr einen Konvoi in die Stadt entsendet und mit ausgewähltem Konvoi mit der rechten Maustaste auf die Stadt klickt."
