"0x03036377" = "Kapitän %1 stellt einen neuen Konvoi zusammen.<n>Der Konvoi ist seeklar und wartet im Hafen.<n>Die täglichen Kosten für den Kapitän und die Grundmannschaft betragen %2."
"0x030bb0b2" = "Wie Ihr wisst, befinden wir uns im Krieg mit @n$HostileNation$.<n><n>Jetzt wäre ein guter Zeitpunkt, unsere Lagerhäuser mit Waren zu füllen, die bei @n$HostileNation$ reichlich vorhanden sind.<n><n>Ich möchte, dass Ihr eine beträchtliche Menge einer bestimmten Ware für mich erbeutet.  "
"0x030bb0b4" = "Da wir uns im Krieg mit @n$HostileNation$ befinden, hat mich der Vizekönig angewiesen, dafür zu sorgen, dass unsere Feinde an Warenmangel leiden.<n><n>Deshalb habe ich einen Plünderungsauftrag für Euch. Nehmt Ihr ihn an?"
