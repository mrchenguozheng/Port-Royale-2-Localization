"0x15c7f2e0" = "(Konvoi ist überladen)"
"0x15d892f9" = "Tiepolo_bold14x14aaFH.res"
"0x15d8bad1" = "Gut! Es handelt sich um die Stadt @T$TargetTown$. Um sie zur Räson zu bringen, hat der Vizekönig von @n$TargetNation$ allen Händlern verboten, die Stadt anzulaufen. Wenn es uns gelingt, den Wohlstand durch Versorgung der Stadt wiederherzustellen, können wir gewiss auf die Gefolgschaft ihrer Bürger zählen. Ihr habt bis @D$EndDate$ Zeit, diesen Auftrag zu erledigen."
"0x15d8bad2" = "Ich meine die Stadt @T$TargetTown$. Allen Händlern wurde verboten, die Stadt anzulaufen. Euer Auftrag ist es, die Stadt zu versorgen, um ihren Wohlstand wiederherzustellen. So können wir unser Interesse an @T$TargetTown$ deutlich machen. Ihr habt bis @D$EndDate$ Zeit, Euren Auftrag zu erfüllen."
"0x15d8bad3" = "Die Sache ist die: Der Vizekönig hat allen Händlern verboten, die Stadt @T$TargetTown$ anzulaufen. Damit will er Druck auf den Stadtrat ausüben. Wenn es Euch gelingt, @T$TargetTown$ genug Waren zu liefern, dass der Wohlstand bis @D$EndDate$ wiederhergestellt ist, zweifle ich nicht daran, dass ich einen friedlichen Wechsel der Nationalität vermitteln kann."
"0x15e96b4c" = "Speichern"
"0x15f470e9" = "Seeschlacht beenden"
"0x15f6d04b" = "Ihr habt die Seeschlacht gewonnen. Wollt Ihr den Angriff abbrechen?"
"0x15fd96d6" = "Ihr habt eine Baugenehmigung gekauft und könnt nun in dieser Stadt bauen. Euer erstes Gebäude muss ein Lagerhaus sein.<n><n>Hinweis: Je mehr Baugenehmigungen Ihr habt, desto teurer wird die nächste und desto länger dauert es, bis sich Euer Handelsnachweis in anderen Städten verbessert."
"0x1605422d" = "Versteck"
"0x161f0ab3" = "Rang"
"0x1629fb20" = "%1,<n>da seid Ihr ja wieder. Kommt, ich habe vielleicht Neuigkeiten für Euch."
"0x1629fb21" = "%1,<n>diesmal wart Ihr nicht lange fort. Habt Ihr nichts anderes zu tun?"
"0x1629fb22" = "%1,<n>ich hatte nicht erwartet, Euch so bald wiederzusehen. Ich glaube, ich habe noch keine Neuigkeiten für Euch."
"0x162a5cb6" = "Warendepot"
"0x163fff71" = "%1,<n>nett, dass Ihr vorbeischaut. Soll ich Euch von den neuesten Ereignissen erzählen, von denen ich gehört habe?"
"0x163fff72" = "%1,<n>es ist gut, Euch wiederzusehen. In den letzten Tagen habe ich mich umgehört und vielleicht habe ich nun Neuigkeiten für Euch."
"0x163fff73" = "%1,<n>da seid Ihr ja wieder, wie ich mich freue. Ich glaube, ich habe vielleicht eine Information für Euch."
"0x165603c2" = "%1,<n>es ist schon eine ganze Weile her, doch ich freue mich, Euch wiederzusehen. Ich habe Neuigkeiten für Euch."
"0x165603c3" = "%1,<n>ich wollte gerade aufbrechen, um jemanden zu besuchen, denn hier ist es mir ziemlich langweilig. Aber nun seid Ihr da. Kommt, ich habe Euch etwas zu erzählen."
"0x165603c4" = "%1,<n>da seid Ihr ja, ich habe mich gerade gefragt, wo Ihr all die Zeit gewesen seid. Ich habe Neuigkeiten für Euch."
"0x1659b12c" = "Ihr habt nun genug Gold, um die Feuerkraft Eures Konvois zu erhöhen. Sucht in den Werften der Gouverneursstädte das stärkste Schiff, das Ihr Euch leisten könnt.<n><n>Reiht dieses Schiff dann in Euren Konvoi ein und nehmt mehr Kanonen und Matrosen an Bord. Habt Ihr nicht genug Gold, handelt noch etwas.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erhöht die Feuerkraft Eures Konvois auf mindestens 90 Kanonen."
"0x165fc28e" = "Besucht Eure neue Stadt und baut eine Werft."
"0x16656b80" = "%1 %2<g:scripts/intext_herz_800x600.screen>"
"0x1666a42c" = "%1, schön, Euch zu sehen."
"0x1666a42d" = "Ich habe auf Euch gewartet, %1."
"0x1666a42e" = "Schön, Euch zu sehen, %1."
"0x166c0813" = "%1,<n>Ihr seid es, nicht wahr? Ich erkenne Euch kaum wieder. Ich verstehe, dass Eure Abenteuer viel Zeit in Anspruch nehmen. Trotzdem könntet Ihr mich wirklich öfter besuchen."
"0x166c0814" = "%1,<n>soll ich wirklich meine ganze Zeit im Gasthaus verbringen, nur damit ich mal etwas Gesellschaft habe? Ihr solltet mich wirklich öfter besuchen!"
"0x166c0815" = "%1,<n>ich lasse hier den ganzen Tag alle möglichen Händler ein und aus gehen, nur um etwas Gesellschaft zu haben. Könntet Ihr es nicht schaffen, öfter vorbeizukommen?"
"0x1680be32" = "Lagerkapazität "
"0x1688414b" = "Schatzflotte geplündert"
"0x16cc82c9" = "Liefert bis @D$EndDate$ @G$Goods$ an eine Person in @T$TargetTown$. Für jedes gelieferte Fass erhaltet Ihr dann @g$Price$."
"0x16e90f87" = "Ihr habt das verlorene Paket gefunden. Bringt es bis @D$EndDate$ zu @N$OwnerName$ nach @T$TOWN$. "
"0x16fcf40f" = "Kredite"
"0x17081769" = "Höchstkapazität:"
"0x170f1419" = "%1 %2 hat die Hafenverteidigung der Stadt durchbrochen und die Stadt ausgeplündert."
"0x171746e9" = "Ihr habt meiner Nation lange und treu gedient, nun muss ich Eure Treue belohnen. Ich gebe Euch ein Stück Land, auf dem Ihr Eure eigene Stadt gründen könnt."
"0x17328849" = "unbekannt"
"0x1733ed83" = "In diesem Szenario gewährt Euch der spanische Vizekönig ein Stück Land, auf dem Ihr Eure eigene Stadt bauen könnt. Ziel dieses Szenarios ist es, dass die Wirtschaft Eurer Stadt zu blühen beginnt.<n:25>Bevor Ihr jedoch ein Stück Land erhaltet, müsst Ihr Euer Ansehen bei Spanien verbessern und Euch beim spanischen Vizekönig beliebt machen, indem Ihr in seinem Namen Städte erobert."
"0x1742a5e4" = "Zeit"
"0x17677dab" = "Prognose"
"0x17839498" = "Preis um 5 % senken"
"0x178491f6" = "Preis um 5 % erhöhen"
"0x17885da0" = "Ihr seid auf einem Floß auf Schiffbrüchige gestoßen und habt @I$Settlers$ Siedler aufgenommen. Sie hoffen, in einer Stadt an Land gesetzt zu werden, in der Arbeitskräfte fehlen."
"0x17a97ba2" = "Seeschlachten"
"0x17abb14d" = "und der Hafen ist sehr schlecht verteidigt."
"0x17ae0013" = "Der letzte Konvoi aus Europa hat mir gemeldet, dass in meiner Stadt in den nächsten Wochen die Importwaren knapp werden.<n><n>Könnt Ihr mir helfen? Ich kann nicht darauf angewiesen sein, dass andere Händler diese Waren in die Stadt bringen."
"0x17ae0014" = "Wie Ihr wisst, befinden sich @n$Nation1$ und @n$Nation2$ im Krieg.<n>Aus diesem Grund erhalte ich in den kommenden Wochen weiterhin keine Importwaren aus Europa. Also bleibt mir nichts anderes übrig, als die Waren in @n$Nation2$ aufzukaufen.<n><n>Ich habe zu diesem Zweck bereits einige andere Händler angeworben, doch ich möchte auch auf Eure Hilfe zählen können."
"0x17ae0015" = "Was glaubt @n$Nation2$ eigentlich, was sie da tut? Ich habe gerade von einem Informanten erfahren, dass Transportkonvois aus Europa auf dem Weg zu meiner Stadt angegriffen und ausgeraubt werden. Helft Ihr mir, die benötigten Importwaren zu kaufen?"
"0x17d31860" = "Gekaufte Waren"
"0x17d5b880" = "Ihr könnt den Konvoi nicht auflösen, da sich noch Waren oder Ladung an Bord befinden."
"0x17f39d18" = "Konvois ohne Auftrag"
"0x1813d72e" = "%1. %2"
"0x183f926a" = "Gouverneur %1"
"0x1844fb4f" = "Nachdem Ihr die Geleitschiffe Eures Gegners besiegt habt, bringt Ihr ein Handelsschiff auf.<n><n>Nun müsst Ihr entscheiden, welche Waren Ihr nehmen wollt und ob Ihr die Schiffe kapern oder nur ausplündern wollt."
"0x1844fb50" = "Nachdem Ihr die Geleitschiffe Eures Gegners besiegt habt, bringt Ihr %1 Handelsschiffe auf.<n><n>Nun müsst Ihr entscheiden, welche Waren Ihr nehmen wollt und ob Ihr die Schiffe kapern oder nur ausplündern wollt."
"0x1844fb51" = "Der Konvoi Eures Gegners hat keine Geleitschiffe zu seiner Verteidigung. Daher bringt Ihr das Handelsschiff ohne Kampf auf.<n><n>Nun müsst Ihr entscheiden, welche Waren Ihr nehmen wollt und ob Ihr das Schiff kapern oder nur ausplündern wollt."
"0x1844fb52" = "Der Konvoi Eures Gegners hat keine Geleitschiffe zu seiner Verteidigung. Daher bringt Ihr die Handelsschiffe ohne Kampf auf.<n><n>Nun müsst Ihr entscheiden, welche Waren Ihr nehmen wollt und ob Ihr die Schiffe kapern oder nur ausplündern wollt."
"0x184aee4b" = "Kompatibel"
"0x18546893" = "In diesem Szenario lernt Ihr, wie man eine Seeschlacht führt. Das Szenario beginnt mit einer kurzen Übungsschlacht. Später müsst Ihr den Konvoi eines berüchtigten Piraten aufspüren und vernichten.<n><n>Außerdem lernt Ihr den Gouverneur von [town:Cartagena] kennen, wo Ihr das Szenario beginnt. Er hilft Euch, Euch in Seeschlachten zu üben, und gibt Euch später den Auftrag, einen bestimmten Piraten zu jagen.<n><n>Euer Rang zu Beginn des Szenarios ist Matrose. Ihr müsst diesen Rang erreicht haben, um vom Gouverneur einen Auftrag zu erhalten. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Statten dem Gouverneur von [town:Cartagena] einen Besuch ab und erfüllt den Auftrag, den er Euch erteilt."
"0x18636d91" = "Soldaten"
"0x18708b29" = "Warenübergabe"
"0x18ab27d9" = "<c>%1<n><n:5>%2 (%3)<n><n:5>%4<n:5>"
"0x18b36fa5" = "<n><n>Ihr könnt zu einem Gouverneur seiner Nation gehen, um ein Lösegeld für ihn zu fordern."
"0x18b8442c" = "%1 wurde dadurch geschwächt."
"0x18b9a161" = "Militärkonvoi vernichtet"
