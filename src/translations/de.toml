"0xcc0a1380" = "Findet den Piratenkonvoi unter dem Kommando von @P$PirateName$, der etwa eine Tagesreise nordöstlich von Providence liegt. Zerstört diesen Konvoi.<n>Kehrt dann zum Gouverneur von [town:Cartagena] zurück."
