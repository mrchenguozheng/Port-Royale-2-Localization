"0xf932eef8" = "Herzlichen Glückwunsch! Ihr habt dieses Szenario erfolgreich abgeschlossen und wisst nun, wie man eine eigene Stadt baut.<n><n>Im freien Spiel kann der Vizekönig jeder Nation Euch eine eigene Stadt schenken. Doch das ist nicht leicht zu erreichen, denn Ihr müsst stets Städte erobern, um ein Stück Land zu erhalten, und das schadet natürlich Eurem Ansehen bei den anderen Nationen. <n><n>Alles, was Ihr in diesem Szenario über die Entwicklung Eurer Stadt gelernt habt, wird Euch auch beim Aufbau von Betrieben in anderen Städten helfen. Der wesentliche Unterschied ist, dass Ihr Euch um die Verteidigung dieser Städte keine Sorgen machen müsst."
