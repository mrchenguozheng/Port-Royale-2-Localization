"0x0b715286" = "Nehmt die Bevölkerung für Euch ein, also baut Schulen und Spitäler in:<n>[town:Havana], [town:Margarita], [town:Guadeloupe], [town:San Juan], [town:Port Royale], [town:Cartagena], [town:Biloxi], [town:St. Augustine], [town:Grand Bahama], [town:Turk Islands]."
"0x0b8b9677" = "Ihr dürft nun 2 Kapitäne führen und 1 Lizenz besitzen."
