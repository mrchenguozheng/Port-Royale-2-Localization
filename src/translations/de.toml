"0xdf10406e" = "Gut gemacht! Eure Stadt ist bereits ein wenig gewachsen.<n><n>Sobald Eure Stadt mehr als 1.000 Einwohner hat, wird sie für Händler aus anderen Städten interessant, die vielleicht kommen, um ihre Waren zu handeln.<n><n>Händler kommen gewöhnlich dann in eine Stadt, wenn dort Nachfrage nach einer bestimmten Ware besteht – das heißt, wenn Eurer Stadt diese Waren fehlen.<n><n>Ihr habt gerade eine Nachricht über Handel und Produktion in Eurer eigenen Stadt erhalten. Um sie zu lesen, öffnet das Protokoll.<n><n>Zuerst sollt Ihr die Bevölkerung Eurer Stadt auf 1.000 erhöhen.<n><n>Hinweis: Soll eine Stadt mehr als 500 Einwohner haben, muss sie ein Gasthaus besitzen!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erhöht die Bevölkerung Eurer Stadt auf 1.000."
