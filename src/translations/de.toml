"0xeb1ce06d" = "Der Konvoi findet Eure Frau auf einem Floß treibend. Sie hat das Abenteuer genossen, möchte nun aber so schnell wie möglich zu ihren Puderdosen nach Hause zurückkehren."
"0xeb1ce06e" = "Der Konvoi findet Eure Frau auf einem Floß treibend. Sie sagt, die Piraten hätten sie zurückgelassen, weil die Sache nur sie und Euch betraf."
"0xeb1ce06f" = "Endlich findet der Konvoi Eure Frau, treibend auf dem Meer. Sie ist bewusstlos, doch nach einer Weile kommt sie zu sich:<n>„Dieser Einfaltspinsel hat mich entführt! Er glaubte tatsächlich, ich wolle mit ihm durchbrennen, nur weil ich ihm ein- oder zweimal höflich zugelächelt habe.“"
"0xeb288ee4" = "Nicht genug Lagerkapazität"
"0xeb2aee46" = "Ihr könnt die Übergabe nicht abschließen, da Euer Konvoi überladen ist. Entfernt Ladung von Eurem Konvoi oder fügt weitere Schiffe hinzu."
