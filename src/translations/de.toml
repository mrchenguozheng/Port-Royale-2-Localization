"0x35392fbd" = "Herzlichen Glückwunsch, Ihr habt Euer erstes Szenario erfolgreich abgeschlossen. Ihr wisst nun, wie Ihr Konvois auswählt und in andere Städte schickt. Ihr habt außerdem gelernt, Gebäude in einer Stadt zu betreten, um verschiedene Aktionen auszuführen, etwa ein Schiff zu kaufen.<n><n>Der nächste Abschnitt handelt davon, durch gewinnbringenden Handel Geld zu verdienen."
