"0x2ad0de32" = "im Hafen"
"0x2ae68b1b" = "Es bereitet mir große Genugtuung zu hören, dass Ihr Blackbeard in seine Schranken gewiesen habt. Als Belohnung mache ich Euch eine spanische Galeone zum Geschenk. Sie wartet im Hafen auf Euch. <n><n>Und wo ich schon dabei bin, kann ich Euch ebenso gut @g$Reward$ geben."
"0x2ae68b1c" = "Ich bin wiederum sehr zufrieden, von Eurer erneuten Niederlage des verachtenswerten Blackbeard zu hören. Ich muss Euch auch die ganz besonderen Grüße meiner Frau ausrichten. Sie möchte Euch ihre spanische Galeone schenken – und damit meine ich nicht unsere Köchin!<n><n>Zusätzlich belohne ich Euch mit @g$Reward$."
"0x2b0bca45" = "Das Schiff mit dem Spion ist von @T$HostileTown$ aus Richtung Europa in See gestochen und wird die Karibik im Osten verlassen. Sucht entlang der Route nach mehreren Dokumenten und bringt sie bis @D$EndDate$ zum Gouverneur von @T$TOWN$."
