"0x2875b307" = "%1 %2 hat einen Konvoi des Piraten %3 zerstört."
"0x28812f6e" = "Wie ich höre, wollt Ihr Euch als Kommandeur einer Seeschlacht erproben. Nun, ich habe eine Aufgabe für Euch, die uns beiden nützen könnte.<n>Zwei verlassene Schiffe treiben gerade ziellos auf See. Ich möchte, dass Ihr diese Schiffe beseitigt, bevor sie beginnen, meinen Händlern zur Bedrohung zu werden.<n>Nehmt Ihr diesen Auftrag an?"
"0x28812f6f" = "Nun etwas Schwierigeres. Ein Vögelchen hat mir gezwitschert, wo ein Piratenkonvoi unter dem Kommando von @P$PirateName$ derzeit die Meere durchstreift. Der Konvoi besteht nur aus einem Schiff, daher sollte es für Euch nicht allzu schwer sein, ihn zu vernichten.<n>Nehmt Ihr diesen Auftrag an?"
"0x28812f70" = "Ihr habt bereits einen Piratenkonvoi von @P$PirateName$ vernichtet. In einem Piratenversteck sind jedoch meist mehrere Konvois stationiert, alle unter dem Kommando von @P$PirateName$. Den Anführer einer Piratenbande könnt Ihr nur beseitigen, indem Ihr ihr Versteck findet und zerstört.<n>Nun ist ein weiterer Konvoi unter dem Kommando von @P$PirateName$ aufgetaucht. Dieser Konvoi besteht aus zwei Schiffen, also müsst Ihr gut vorbereitet sein, bevor Ihr den Kampf aufnehmt.<n>Seid Ihr bereit?"
"0x2883fdae" = "Ihr könnt dieses Piratenversteck mit einem Konvoi von der See aus angreifen. Zuerst müsst Ihr alle Schiffe im Hafen besiegen. "
"0x289d1ced" = "täglicher Verbrauch"
"0x28b1f98d" = "%1 %2 Ihr besitzt außerdem eine Genehmigung, in %3 Gebäude zu errichten und Betriebe zu gründen, und Ihr habt in der Stadt bereits ein Lagerhaus.<n><n>Da Ihr jung und unerfahren seid, habt Ihr erst den Rang eines Schiffsjungen erreicht. Daher könnt Ihr noch keine weiteren Konvois befehligen und auch keine weiteren Baugenehmigungen in einer anderen Stadt kaufen.<n><n>Euer Rang richtet sich nach Eurem Gesamtvermögen, das aus Bargeld und Besitz besteht und derzeit etwa %4 beträgt. Den nächsten Rang erreicht Ihr, sobald Euer Vermögen %5 beträgt.<n><n><n>Viel Glück!"
"0x28c94158" = "Schiffe"
"0x28cc4ee4" = "Der Konvoi kann nicht in See stechen, weil zu viele Waren an Bord sind. Verkauft einen Teil Eurer Waren oder bringt sie in Euer Lagerhaus, damit Ihr die Höchstladefähigkeit des Konvois nicht überschreitet."
"0x28ef24c0" = "schwach"
"0x28ef24c1" = "[term:fr_medium]"
"0x28ef24c2" = "stark"
"0x28f090e8" = "Kaperbriefe"
"0x293d8c9f" = "Ausgezeichnet! Eure Stadt ist inzwischen recht groß. Bald werden die ersten Händler aus anderen Städten anlegen, um mit Eurer Stadt Waren zu handeln.<n><n>Doch Eure Stadt läuft auch Gefahr, von anderen, weniger erwünschten Gestalten heimgesucht zu werden. Dazu zählen Piraten und Bukanier aus Nationen, zu denen Ihr ein schlechtes Verhältnis habt. Als Nächstes sollt Ihr daher Soldaten anheuern und Hafenkanonen errichten.<n><n>Zum Glück können sich die Bürger Eurer Stadt weitgehend selbst organisieren. Ihr müsst ihnen nur einige Anweisungen geben und die nötigen Materialien beschaffen. Danach entstehen keine zusätzlichen Kosten.<n><n>Hafenkanonen könnt Ihr über das Baumenü errichten, und Soldaten könnt Ihr in Eurem Palast anheuern.<n><n>Denkt daran:<n>Auch Soldaten brauchen Unterkünfte! Anders als Arbeiter benötigen sie jedoch nur einen Platz.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Errichtet fünf Hafenkanonen und erhöht Eure Soldaten auf 300."
