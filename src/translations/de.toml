"0x0ad66781" = "Eurem Konvoi gelingt es, die Hafenverteidigung zu durchbrechen. Eure Matrosen gehen an Land und suchen ohne Widerstand nach dem Piratenschatz. Sie erbeuten %1. "
"0x0adb3fdd" = "Ich wusste, dass ich Euch vertrauen kann. Es geht um die Stadt @T$TargetTown$, die zu @n$HostileNation$ gehört. Greift die Stadt an und plündert sie, so viel Ihr wollt, dann sucht meine Frau. Zögert nicht, denn ich habe nur bis @D$EndDate$ Zeit, mir die Sache zu überlegen.<n><n>Besitzt Ihr noch keinen Kaperbrief gegen @n$HostileNation$, gebe ich Euch einen."
"0x0adb3fde" = "Meine Frau wird außer sich vor Freude sein. Der Pudel Michelle ist in @T$TargetTown$ versteckt. Plündert die Stadt, damit es wie ein militärischer Auftrag aussieht, und sucht dann nach dem Hund. Ihr habt bis @D$EndDate$ Zeit.<n>Glaubt mir, es wird mir keine Freude sein, den Hund wiederzusehen, doch das Geschniefe meiner Frau nimmt kein Ende.<n><n>Besitzt Ihr noch keinen Kaperbrief gegen @n$HostileNation$, gebe ich Euch einen."
"0x0adb3fdf" = "Abgemacht. Bitte plündert @T$TargetTown$ und bringt mir meine Tochter zurück. Ihr Geburtstag ist am @D$EndDate$, und sie muss zu diesem besonderen Anlass wieder hier sein.<n><n>Besitzt Ihr noch keinen Kaperbrief gegen @n$HostileNation$, gebe ich Euch einen."
"0x0b16cc19" = "Zwei verlassene Schiffe"
"0x0b1a8b7f" = "Vorräte zerstört"
"0x0b25ca20" = "Dann soll es so sein. Doch bevor ich sie Euch anvertraue, müsst Ihr die Waren für das Fest beschaffen. Trefft meinen Hochzeitsfest-Organisator am Markt.<n><n>Das Fest findet statt, sobald Ihr alle Waren geliefert habt."
"0x0b2775c3" = " Ihr habt die Waren nicht rechtzeitig geliefert."
"0x0b319f8c" = "M&S Music"
