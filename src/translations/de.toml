"0xcff9644a" = "Das Spiel „Einarmiger Pirat“ ist ein Glücksspiel mit 32 Karten. Jeder Spieler legt seinen Einsatz in den Topf und bekommt 5 Karten, die der andere nicht sehen kann.<n><n>Zuerst sagt jeder Spieler an, wie viele Punkte er holen will – jeder gewonnene Stich zählt einen Punkt. Wer die höhere Zahl ansagt, führt das Spiel und bestimmt die Trumpffarbe. Diese Punktzahl muss er nun mindestens erreichen.<n><n>Der Ansager spielt die erste Karte aus; der andere muss mit einer Karte derselben Farbe bedienen, wenn er kann. Wer die höchste Karte legt, gewinnt den Punkt.<n><n>Kann ein Spieler nicht bedienen, darf er eine beliebige Karte abwerfen oder Trumpf ausspielen.<n><n>Die Kartenreihenfolge lautet I, II, III, IV, Pirat, Braut, Gouverneur, Papagei. Eine Trumpfkarte schlägt alle anderen Karten.<n><n>Wer den Punkt gewonnen hat, spielt die nächste Karte aus. So geht es weiter, bis einer das Spiel gewinnt.<n><n>Erreicht der Ansager seine angesagte Punktzahl, gewinnt er das Spiel und nimmt den Topf. Verfehlt er sie, gewinnt sein Gegner."
