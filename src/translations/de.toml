"0x32f1c30f" = "Einsteigerszenario<n><n>In diesem Einsteigerszenario dreht sich alles um Warentransport und Handel. Ihr erhaltet Tipps, wie Ihr große Handelsgewinne erzielt, und Ihr lernt, neue Konvois zusammenzustellen."
