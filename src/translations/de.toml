"0xf7534d8f" = "Wenn Ihr Siedler in eine Stadt bringt, in der Arbeiter gebraucht werden, danken die Siedler es Euch, indem sie beim Aussteigen eine Überfahrt bezahlen.<n><n>Zur Produktion von Kolonialwaren wie Kakao wird stets eine kleine Menge Werkzeug benötigt. Ist dieses Werkzeug nicht vorhanden, stockt die Produktion. Später, wenn Ihr etwas mehr über Preise und Mengen wisst, könnt Ihr den Lagerverwalter anweisen, in der Stadt regelmäßig Werkzeug zu kaufen. Vorerst solltet Ihr das Werkzeug jedoch selbst beschaffen, um auf der sicheren Seite zu sein.<n><n>Das ist Eure nächste Aufgabe. Danach steht der Kakaoerzeugung nichts mehr im Wege.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produziert Kakao und baut einen Vorrat von @a$AmountGoal$ in Eurem Lagerhaus auf."
