"0xdbf5380b" = "Friedensvertrag geschlossen"
"0xdbf8bc55" = "Piratenkonvoi vernichtet"
"0xdc0e801d" = "Ich habe weitere wichtige Informationen für Euch über den Krieg mit %1.<n><n>"
