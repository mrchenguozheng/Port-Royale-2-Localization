"0xf88d6ee5" = "Liefert eine beliebige Menge @G$Goods$ an den Markt in @T$TOWN$. Dort erhaltet Ihr sofort @g$Price$ pro Fass. Am @D$EndDate$ wird ein Expeditionskonvoi die Waren abholen. Geleitet den Konvoi nach Europa, und Ihr erhaltet weitere @g$Price$ pro Fass."
"0xf894bc2d" = "Der Konvoi kann nicht in See stechen, weil sich einige Eurer Schiffe in sehr schlechtem Zustand befinden. Lasst Euren Konvoi in der Werft reparieren, bevor Ihr ihn wieder auf See schickt. Alternativ könnt Ihr die beschädigten Schiffe aus dem Konvoi nehmen und sie einzeln reparieren lassen."
"0xf89f542f" = " Ihr habt <o:0xff1e1eff>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GOLD_800x600.screen> erhalten."
"0xf8af3810" = "Hier haben wir alles, was wir brauchen."
"0xf8b3a303" = "Der Status einer Stadt durchläuft sieben Stufen – von der Armut bis zum Reichtum. In den beiden untersten Stufen ist die Lebensqualität so schlecht, dass die Bürger der Stadt regelmäßig den Rücken kehren. Erreicht eine Stadt dagegen die Stufen „Blütezeit“, „Wohlstand“ und „Reichtum“, bringen Eure Betriebe einen Effizienzbonus, und Eure Arbeitskräfte arbeiten kostengünstiger. In der höchsten Stufe bringt eine Stadt sogar von selbst Siedler hervor.<n><n>Welche Wirkung die einzelnen Stufen haben, lest Ihr in den Stadtinformationen nach; sie öffnen sich per Klick auf den Stadtnamen.<n><n> Eine ausreichende Versorgung mit zwei bis drei Waren aus jeder Warengruppe sichert eine gute Lebensqualität in Eurer Stadt. Ausreichend heißt: Der Vorrat einer Ware reicht zehn Tage für die Bevölkerung der Stadt.<n><n>Übrigens: Der Status einer Stadt bessert sich nicht über Nacht. Es dauert eine Weile, bis sich die Bürger auf die neue Lage eingestellt haben."
"0xf8bacb9a" = "Gasthaus"
"0xf8cc0545" = "Verkaufte Waren"
"0xf8e13932" = "Versorgt @T$TargetTown$ mit Waren und kauft Überschusswaren auf. Am @D$EndDate$ muss die Stadt den Status „Aufschwung“ haben, und alle Betriebe der ansässigen Händler müssen mit voller Kapazität arbeiten."
"0xf8e13933" = "Versorgt @T$TargetTown$ mit Waren und kauft Überschusswaren auf. Am @D$EndDate$ muss die Stadt den Status „Blütezeit“ haben, und alle Betriebe der ansässigen Händler müssen voll ausgelastet sein."
