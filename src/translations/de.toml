"0x13cc600d" = "Geschäftsführer Ascaron UK"
"0x13cd046e" = "Erobert Ihr für einen Vizekönig feindliche Städte, gewährt er Euch dafür ein Stück Land. Dort könnt Ihr eine Stadt bauen, die Euch gehört und in der Ihr verschiedene Gebäude errichten könnt. Mit anderen Worten: Jeder Vizekönig kann Euch helfen, Eigentümer Eurer eigenen Stadt zu werden. <n><n>Als Nächstes solltet Ihr Euer Ansehen bei Spanien verbessern, denn ein Vizekönig empfängt Euch nur, wenn Ihr bei seiner Nation einen guten Ruf habt.<n><n>Euer Ansehen bei einer Nation könnt Ihr zum Beispiel in der Stadtansicht unter dem Stadtnamen prüfen. In [town:Margarita], wo Ihr das Spiel beginnt, sind drei Fahnen zu sehen: Euer Ansehen bei Spanien ist „neutral“.<n><n>Ihr könnt Euer Ansehen bei einer Nation verbessern, indem Ihr Aufträge für ihre Gouverneure erfüllt, Piraten jagt oder mit ihren Städten handelt und die Waren liefert, die sie brauchen.<n><n>Da Spanien und Frankreich im Krieg sind, könnt Ihr vom Gouverneur von [town:Margarita] einen Kaperbrief gegen Frankreich erhalten. Mit Kaperbriefen lässt sich Euer Ansehen schnell verbessern.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Verbessert Euer Ansehen bei Spanien auf „freundlich“."
"0x13d92dd7" = "%1 (%2)"
"0x13ec9ac1" = "Ihr habt eine Aktion ausgeführt, die Euch daran hindert, das Szenario erfolgreich abzuschließen.<n><n>Folgt den Anweisungen im Ereignisfenster."
"0x1401d917" = " @s$USER$, ich habe eine Information, die Euch gewiss @g$Price$ wert ist. Mein Schwager kennt @N$TeacherName$, einen pensionierten Kapitän."
"0x1401d918" = "Setzt Euch hier neben mich und gießt mir etwas Rum ein, ich habe Neuigkeiten für Euch. Auf meiner letzten Reise habe ich @N$ContactName$ getroffen. Er war ein Freund und Schüler des legendären @N$TeacherName$. "
"0x1401d919" = " @s$USER$, setzt Euch neben mich, ich weiß, wo Ihr einen Eurer Kapitäne ausbilden lassen könnt. Erinnert Ihr Euch an @N$TeacherName$? "
