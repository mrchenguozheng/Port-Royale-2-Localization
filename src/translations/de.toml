"0x11e79f57" = "Einsteigerszenario<n><n>In [town:Port Royale] 2 ist Euer Ziel, vom bescheidenen Händler zu einem einflussreichen Geschäftsmann aufzusteigen. Um den erstrebten Status zu erreichen, könnt Ihr Waren transportieren sowie handeln, bauen und Euch in Politik und Piraterie engagieren.<n:25>Das Einsteigerszenario vermittelt Euch die Grundlagen des Spiels. Dieses Szenario umfasst wie alle anderen mehrere verschiedene Ziele."
