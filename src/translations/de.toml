"0x35f49057" = "[riddle:answer=Santo Domingo;group=35f49057;clue=Vier+Vulkan+Südosten;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#ch19]Vier Städte liegen um einen Vulkan. Die Stadt im Südosten ist die, die Ihr sucht."
