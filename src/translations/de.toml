"0xde535352" = "Leider ist in Tortuga die Pest ausgebrochen. Sie wird in der Stadt etwa einen Monat wüten. Der Status der Stadt fällt erheblich, und ihre Bürger sterben täglich. Viele Bürger fürchten die Krankheit und fliehen.<n><n>Für Euch als Händler ist außerdem von Interesse, dass die Nachfrage nach Kleidung und Holz in der Stadt doppelt so hoch ist, solange die Pest wütet.<n><n>Eure Aufgabe ist es nun, die Versorgung der Stadt während der Pest sicherzustellen und dafür zu sorgen, dass die Zahl der Bürger nicht sinkt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Zahl der Bürger (Einwohner ohne Soldaten) muss bis spätestens 20 Tage nach dem Ende der Pest wieder @I$Pop$ betragen. Damit ist sichergestellt, dass alle Gewerbe über eine volle Belegschaft verfügen."
