"0x061848e4" = "Ihr habt die Stadt @T$TargetTown$ sabotiert, und ich danke Euch im Namen meiner Nation. Ich habe eine ganz besondere Belohnung für Euch. Ich habe einen sehr erfahrenen Kapitän überredet, sich Euch anzuschließen. Sein Name ist @N$CaptainName$, und er wartet im Gasthaus auf Euch."
"0x061b50a1" = "Wollt Ihr für %1 einen Kaperbrief kaufen und im Namen Frankreichs die Schiffe unserer Feinde jagen?"
"0x0625c88f" = "Nationen"
"0x062a6d44" = "Gut! Der Konvoi ist von @T$HostileTown$ in Richtung Europa in See gestochen und wird die Karibik im Osten verlassen. Durchsucht die gesamte Route nach den Schriftstücken und bringt sie mir bis @D$EndDate$."
"0x062a6d45" = "Ihr seid mir eine große Hilfe! Wenn alles nach Plan läuft, wirft der Steuermann die Bücher heimlich eines nach dem anderen über Bord. Das Schiff ist von @T$HostileTown$ Richtung Europa in See gestochen. Folgt dem Schiff und sammelt die Bücher ein. Bringt sie mir bis @D$EndDate$."
"0x062a6d46" = "Ausgezeichnet. Das Schiff hat den Hafen von @T$HostileTown$ Richtung Europa bereits verlassen. Es hat jedoch einen Passagier an Bord, der mir noch einen Gefallen schuldet. Er wird das Schiff nach Schriftstücken durchsuchen und sie heimlich eines nach dem anderen über Bord werfen. Euer Auftrag ist es, die Schriftstücke einzusammeln und mir bis @D$EndDate$ zu bringen."
"0x063dfcc8" = "%1 besiegt"
"0x064021d3" = "Die Hafenverteidigung ist zerstört, und Eure Mannschaft legt im Hafen an. Von der Stadtwache ist nichts zu sehen.<n><n>Was wollt Ihr nun tun?"
