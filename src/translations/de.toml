"0x35f48fe5" = "Einst vor langer Zeit lebten hier andere Menschen, die in ihren großen Tempeln ihren Göttern Lob darbrachten. Darüber liegt X, oben in einer Ecke. Nach Südwesten segelt Ihr vergebens, das sei Euch gewarnt."
