"0xce36d9cb" = "Expeditionskonvoi"
"0xce43a07c" = "Ihr habt einen Konvoi einer befreundeten Nation angegriffen. In diesem Szenario herrscht Frieden zwischen den Nationen, das heißt, Ihr dürft auf keinen Fall Händler oder Militärkonvois angreifen."
"0xce4d9a57" = "Handel in der Stadt"
"0xce75e5c4" = "Ihr habt nun gelernt, wie man Waren kauft und verkauft. Kauft Waren stets in den Städten, in denen sie erzeugt werden, denn dort sind sie in der Regel billiger.<n><n>Hinweis: Wenn Ihr mit einem Konvoi handeln wollt, müsst Ihr ihn ausgewählt haben, und er muss bereits in der Stadt liegen, bevor Ihr die Docks betretet.<n><n>Später in diesem Szenario sollt Ihr durch eigenen Handel Gewinn machen. Das Ereignisfenster enthält Hinweise dazu.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Ihr müsst durch Handel @g$GoldGoal$ an Bargeld verdienen."
