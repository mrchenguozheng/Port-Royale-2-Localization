"0xfc64ab0e" = "Ihr könnt nun Euer Ansehen in %1 steigern, indem Ihr französische Schiffe und Städte angreift. Euer Ansehen bei den anderen Nationen wird dadurch nicht gemindert."
"0xfc692ef1" = "<n><n>Überlebt jedoch mindestens ein Schiff Eures Konvois den Kampf, überlebt auch der Kapitän."
"0xfc71eb4b" = "Welch ein Unglück mir widerfahren ist. Seit dem Ausbruch des Krieges mit @n$FoeNation$ konnte ich nicht genug Kolonialwaren für die Transportkonvois sammeln. Könnt Ihr mir helfen, indem Ihr mir eine große Lieferung @G$Goods$ beschafft?"
"0xfc71eb4c" = "Seit wir uns mit @n$FoeNation$ im Krieg befinden, ist ihren Händlern verboten, @G$Goods$ an die Städte meiner Nation zu liefern. Nun stehe ich vor einem erheblichen Mangel an Waren. Ihr habt viele Schiffe und kennt die Meere gut. Könntet Ihr mir nicht eine große Lieferung @G$Goods$ sichern?"
"0xfc72151e" = "Lagerhaus - Konvoiübergabe"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Durch Kanonen"
"0xfc910833" = "Verfügbare Wohngebäude"
"0xfc9a5f7d" = "Es war mir ein Vergnügen, mit Euch Geschäfte zu machen. Guten Tag!"
"0xfc9a5f7e" = "Die Waren wurden in Euer Lagerhaus gebracht. Guten Tag!"
"0xfc9a5f7f" = "Die Waren wurden auf Euren Konvoi geladen. Lebt wohl, %1."
"0xfc9cf623" = "Abgeschlossen"
"0xfca882e8" = "Wie Ihr wisst, nimmt die spanische Schatzflotte bei jeder Sammlung der Schätze aus ihren Kolonien und deren Verschiffung nach Europa stets eine andere Route. Die Flotte entgeht einem Hinterhalt, indem sie sich in jeder Stadt nur kurz aufhält. Diesmal jedoch hat Spanien einen schweren Fehler begangen und uns verraten lassen, welche Route die spanische Schatzflotte gerade jetzt nimmt. Eure Befehle könnten einfacher nicht sein. Zerstört jedes einzelne Schiff!"
"0xfca882e9" = "Wir befinden uns im Krieg mit Spanien und müssen dafür sorgen, dass die spanische Schatzflotte Europa nie erreicht. Zum Glück haben wir erfahren, welche Stadt die Flotte als Nächstes anläuft. Wir werden die Flotte in dieser Stadt sabotieren, sodass sie ihren Aufenthalt im Hafen verlängern muss. Das sollte Euch genug Zeit geben, die Flotte abzufangen und daran zu hindern, Europa zu erreichen. Nehmt Ihr diesen Auftrag an?"
"0xfca882ea" = "Solche Gelegenheiten bekommt man nicht alle Tage! Heute hat mir einer meiner Gewährsmänner die Route verraten, die die spanische Schatzflotte gerade nimmt. Doch das ist nicht alles. Wir haben erfahren, dass die Flotte in der nächsten Stadt, die sie anläuft, länger als gewöhnlich vor Anker liegen wird. Da wir uns im Krieg mit Spanien befinden, sollten wir dem Vizekönig etwas zum Lächeln geben und dafür sorgen, dass die Schatzflotte ihr Ziel in Europa nie erreicht. Wollt Ihr die Flotte für meine Nation abfangen?"
"0xfcc82d44" = "Säbelkämpfer"
"0xfcd6fdec" = "Wie ich sehe, habt Ihr meinen letzten Auftrag noch nicht erfüllt. Erledigt diese Arbeit, denn ich habe weitere Aufgaben für Euch."
"0xfcded04c" = "Spanien muss gerüstet sein, also sorgt für Bevölkerung und Waren. Errichtet 20 stattliche Wohnhäuser und 20 voll produzierende Betriebe in:<n>[town:Havana], [town:Margarita], [town:Guadeloupe], [town:San Juan], [town:Port Royale], [town:Cartagena], [town:Biloxi], [town:St. Augustine], [town:Grand Bahama], [town:Turk Islands]."
"0xfce1cfd1" = "Leider habe ich derzeit keine Verwendung für Euch.<n> Ich kann Euch nur dann mit der Eroberung einer Stadt beauftragen, wenn eine feindliche Nation geschwächt ist und ich genug Militärkonvois habe, um meine Städte zu schützen."
"0xfce38f12" = "Stadtkommandant"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "Atmosphäre"
