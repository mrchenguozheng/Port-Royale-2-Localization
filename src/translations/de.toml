"0xcb853f07" = "Euer Kapitän hat sein Duell mit dem Kommandanten gewonnen. Eure Seeleute machen sich auf den Weg zur Schatzkammer und nehmen %1 mit.<n><n>Wählt nun, welche Waren Ihr aus dem Lagerhaus der Stadt plündern wollt."
"0xcb8dbdae" = "feindliche Musketiere "
"0xcb8dd6d9" = "Unser Feind @n$HostileNation$ schreckt vor nichts zurück. Meine Frau wurde entführt, und an ihre Freilassung sind gewisse Bedingungen geknüpft. Doch ich weiß zufällig, wo man sie festhält. Offiziell kann ich nichts tun, das versteht Ihr, aber Ihr könntet die Stadt angreifen und sie mir zurückbringen."
"0xcb8dd6da" = "Schön, Euch zu sehen.<n>Meine Frau erhielt vor Kurzem einen frisierten Pudel aus Paris. Das elende Tier treibt mich in den Wahnsinn, doch meine Frau ist vernarrt in den Hund.<n>Jemand erfuhr davon, entführte den Hund und übergab ihn unseren Feinden, um uns zu erpressen.<n><n>Könnt Ihr den Pudel für mich retten?"
"0xcb8dd6db" = "Vor einiger Zeit ist meine jüngste Tochter mit irgendeinem durchreisenden Abenteurer durchgebrannt, so hieß es damals. Nun habe ich erfahren, dass sie in @T$TargetTown$ lebt und den Kommandanten der Stadt heiraten soll. Ich kenne meine Tochter, sie würde so etwas niemals aus freiem Willen tun! Ich kann dem Vizekönig kaum vorschlagen, dass wir eine Stadt angreifen müssen, um meine Tochter zu retten? Aber wie steht es mit Euch?"
"0xcb9b3a82" = "Rattenplage ausgebrochen"
"0xcba7ebba" = "Baumeister"
"0xcbb16a2d" = "Sobald Ihr Betriebe besitzt, könnt Ihr hier prüfen, ob Produktionsprobleme aufgetreten sind. "
