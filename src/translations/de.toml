"0x0cd42878" = "Alle Macht den Niederländern!"
"0x0ce1a79e" = "Ihr befindet Euch in der Kolonialstadt Santa Marta. Klickt auf den Stadtnamen, um die Stadtinformationen anzuzeigen."
"0x0ce1a79f" = "Kolonialstädte wie Santa Marta können zwei Bedarfsgüter, zwei Rohstoffe und eine Kolonialware produzieren.<n>Im letzten Szenario habt Ihr erfahren, dass in Gouverneursstädten eine besonders hohe Nachfrage nach Rohstoffen und Kolonialwaren besteht.<n>Ihr wollt zunächst die Kolonialware Kakao produzieren.<n>Schließt nun die Stadtinformationen."
"0x0ce1a7a0" = "Da die Kolonialwaren von den Gouverneursstädten nach Europa verschifft werden, ist die Nachfrage nach Kakao in diesen Städten hoch. Diese Bedingungen sind gut für Euren ersten Betrieb. Sucht nun das Gebäude des Baumeisters im Zentrum der Stadt und klickt es an."
"0x0ce1a7a1" = "Beim Baumeister könnt Ihr eine Genehmigung für ein neues Gebäude beantragen oder Eure Baugenehmigung zurückgeben. Das wollt Ihr jetzt natürlich nicht tun!<n>Seht Euch die verschiedenen Gebäude an, die Ihr errichten könnt. Ihr könnt auch die Schaltflächen rechts im Baumeister-Fenster nutzen.<n>Klickt auf die Schaltfläche „Kakaoplantage“."
"0x0ce1a7a2" = "Nun seht Ihr, wie viele Baumaterialien benötigt werden und wie hoch die Baukosten ausfallen.<n>Ihr seht außerdem, wie viele Baumaterialien Ihr derzeit in Eurem Lagerhaus habt und wie viele Ihr von der Stadt kaufen müsst.<n>Derzeit habt Ihr genug Material.<n>Setzt den Mauszeiger auf ein freies Baugrundstück und klickt es mit der linken Maustaste an."
"0x0ce1a7a3" = "Nun wird das Baugerüst der Kakaoanlage angezeigt, und der Bau beginnt.<n>Es dauert einige Tage, bis der Bau abgeschlossen ist. In der Zwischenzeit solltet Ihr die Unterbringung für Eure neuen Arbeiter organisieren.<n>Schließt das Baumenü und sucht in Santa Marta ein Wohngebiet. "
"0x0ce1a7a4" = "Dieses Wohngebiet gehört einem Händler aus der Stadt. Ihr könnt prüfen, wie viele Wohngebiete den ansässigen Händlern gehören und wie viele Mieter sie haben. Ihr wollt ein eigenes Wohngebiet bauen. Öffnet dazu das Baumenü."
"0x0ce1a7a5" = "Wählt im Baumenü ein Wohngebiet und seht Euch die Anzeige der Baukosten an. <n>Möglicherweise habt Ihr nicht genug Baumaterialien auf Lager. Benötigte Materialien könnt Ihr jedoch in der Stadt kaufen, wenn sie ausreichend vorhanden sind. <n>Andernfalls müsst Ihr sie in einer anderen Stadt besorgen.<n>Baut dann ein Wohngebiet."
"0x0ce1a7a6" = "Ein Betrieb kann 30 Arbeiter beschäftigen. Da eine durchschnittliche Arbeiterfamilie aus vier Personen besteht, braucht Ihr für jeden Betrieb, den Ihr errichtet, Wohnraum für 120 Menschen. <n>Ein Wohngebiet bietet Platz für 120 Mieter, also ist für jeden Betrieb ein Wohngebiet erforderlich.<n>Schließt nun das Baumenü und klickt auf Euer neues Wohngebiet."
"0x0ce1a7a7" = "Für ein Wohngebiet gibt es keine Bauzeit, da die Mieter zunächst in Zelten wohnen.<n>Mit der Zeit bauen die Mieter das Wohngebiet selbst zu einem recht ansehnlichen Gebäude aus.<n>Das Aussehen eines Wohngebiets hängt von seinem Alter und vom Status der Stadt ab.<n>Schließt den Dialog des Wohngebiets."
"0x0ce1a80f" = "Wie Ihr wisst, muss Euer erstes Gebäude in einer Stadt immer ein Lagerhaus sein. Ihr könnt keine anderen Gebäude errichten, bevor Ihr dieses gebaut habt.<n>In der Stadt, in der Ihr das Spiel begonnen habt, besitzt Ihr bereits ein Lagerhaus. Sucht es und klickt es an. Es wird auf dem Bildschirm hellblau dargestellt."
"0x0ce1a810" = "Im Lagerhaus seht Ihr, welche Gebäude Euch in der Stadt gehören und was ihre Unterhaltung kostet.<n>Ihr seht auch, wie viel Miete Eure Mieter Euch zahlen und welche Waren Eure Betriebe produzieren.<n>Später könnt Ihr dem Lagerverwalter Anweisungen geben.<n>Seht Euch im Lagerhaus um und schließt es dann."
"0x0cee08cc" = "die militärische Präsenz in dieser Stadt könnte besser sein"
"0x0cf75014" = "Schließen"
"0x0cf7abef" = "Klickt auf Eure Kakaoplantage. Die Anzeige zeigt stets alle Eure Kakaoplantagen in der Stadt.<n>Sobald Eure Produktionsanlagen errichtet sind, braucht Ihr 30 Arbeiter, also 30 Siedler. Verlasst nun die Plantage, geht zum Handelsdock im Hafen und drückt die Schaltfläche „Ladung“ (die unterste Schaltfläche rechts)."
"0x0cf7abf0" = "Hier seht Ihr, ob in der Stadt Siedler darauf warten, angeheuert zu werden oder ob die Stadt neue Arbeiter braucht. Das wird der Fall sein, sobald der Bau Eures Betriebs abgeschlossen ist.<n>Fahrt in die umliegenden Gouverneursstädte und bringt Siedler nach Santa Marta, bis Euer Betrieb die volle Besetzung an Arbeitern hat."
"0x0d0db040" = "Klickt eine Eurer Kakaoplantagen an."
"0x0d0db041" = "Nun seht Ihr, wie viel Kakao Euer Betrieb täglich produziert und wie viel Werkzeug dafür nötig ist.<n>Baut nun in Eurem Lagerhaus einen Vorrat von @a$SubGoal$ Werkzeug auf, denn Euer Lagerhaus versorgt Eure Betriebe mit Waren."
"0x0d0db042" = "Werkzeug ist eine Importware. Das bedeutet, dass Ihr in Gouverneursstädten das größte Angebot und die niedrigsten Preise findet.<n>Ihr könntet versuchen, etwas davon zu beschaffen – im Südwesten in [town:Cartagena] oder weit im Osten in [town:Margarita]."
"0x0d0db043" = "Gut gemacht!<n>Je niedriger der Durchschnittspreis der Rohstoffe, die Ihr braucht, desto niedriger sind Eure Produktionskosten für die hergestellten Waren.<n>Produziert nun weiter Kakao, bis Ihr einen Vorrat von @a$AmountGoal$ in Eurem Lagerhaus habt."
"0x0d0f1795" = "Juli"
"0x0d0f1877" = "Juni"
"0x0d1098bd" = "%1,<n>Ihr seid neu hier, nicht wahr? Doch ich habe schon von Euch gehört, und Euer guter Ruf eilt Euch voraus. Ihr solltet mich ab und zu besuchen, denn es gibt immer etwas zu tun."
"0x0d23b491" = "Segelt mit Eurem Konvoi in die Stadt [town:Cartagena] und betretet die Stadt.<n>Unter dem Stadtnamen rechts auf dem Bildschirm wird ein kleines Kreis-Symbol angezeigt. Es zeigt Euren bisherigen Handelsnachweis in [town:Cartagena].<n>In diesem Szenario ist es für Euch etwas leichter, da Ihr einen Bonus erhalten habt.<n>Öffnet nun die Stadtinformationen."
"0x0d23b492" = "Unter „Handelsnachweis“ könnt Ihr nun prüfen, welchen Prozentsatz der erforderlichen Punktzahl Ihr bereits erreicht habt. Wird hier 100 % angezeigt, könnt Ihr beim Baumeister eine Genehmigung beantragen.<n>Schließt die Stadtinformationen."
"0x0d23b493" = "Die Preise von Waren, die in einer Stadt knapp sind, werden im Handelsfenster rot angezeigt. Verkauft Ihr diese Waren, verbessert Ihr sowohl Euren Handelsnachweis in der Stadt als auch Euer Ansehen bei der Nation, zu der die Stadt gehört.<n>Klickt einmal auf das Handelsdock, um Informationen über den Warenbestand in der Stadt anzuzeigen."
"0x0d23b494" = "Beachtet, welche Waren in der Stadt fehlen. Zum Beispiel braucht die Stadt stets Zucker und Baumwolle, weil sie Rum und Kleidung produziert.<n>Doch es gibt auch andere knappe Waren in der Stadt.<n>Fahrt in andere Städte, um die Waren zu kaufen, die [town:Cartagena] braucht, und verbessert so Euren Handelsnachweis."
"0x0d23b495" = "Nicht schlecht! Ihr habt Euren Stand in [town:Cartagena] beträchtlich verbessert.<n>Doch seid vorsichtig und kauft in [town:Cartagena] keine knappen Waren auf! Knappe Waren erkennt Ihr leicht daran, dass ihre Bestände rot angezeigt werden.<n>Erhöht Euren Handelsnachweis auf 85 %."
"0x0d23b496" = "Gut gemacht! Ihr habt nun 85 % in [town:Cartagena] erreicht. Weiter so!<n>Erhöht Euren Wert auf 100 %.<n>Übrigens: Ihr habt gerade eine Nachricht zum Thema „Beförderung und Ränge“ erhalten."
"0x0d23b497" = "Ausgezeichnet! Ihr habt nun genug Handel mit [town:Cartagena] getrieben.<n>Leider ist Euer Rang noch immer Leichtmatrose, und so kann Euch nur eine Genehmigung erteilt werden.<n>Um in den nächsten Rang befördert zu werden, müsst Ihr Euer Vermögen durch weiteren Handel erhöhen. "
"0x0d23b498" = "Sehr gut! Als Matrose können Euch zwei Baugenehmigungen erteilt werden.<n>Geht zum Baumeister in [town:Cartagena] und beantragt eine Genehmigung.<n>Habt Ihr nicht genug Gold, müsst Ihr noch etwas handeln. Vergesst nicht, die Waren zu verkaufen, die Ihr in Santa Marta produziert."
"0x0d2a3b89" = "Unterhalt des Schiffes"
"0x0d39b8e2" = "Ihr müsst zuerst ein Lagerhaus in [town:Cartagena] bauen, bevor Ihr andere Gebäude errichten könnt."
"0x0d39b8e3" = "Errichtet nun zwei Webereien und baut zwei Wohngebiete.<n>Sind in der Stadt nicht genug Baumaterialien vorhanden, müsst Ihr diese in einer anderen Stadt kaufen und an Euer Lagerhaus im Handelsdock liefern. <n>Vergesst nicht, erst über den Preis zu verhandeln, bevor Ihr Euch von Eurem kostbaren Gold trennt!"
"0x0d39b8e4" = "Ihr solltet dafür sorgen, dass Ihr bis zur Fertigstellung Eurer Webereien einen Vorrat von @a$SubGoal$ Baumwolle im Lagerhaus habt, damit die neuen Betriebe sofort Kleidung aus Baumwolle weben können."
"0x0d39b8e5" = "Als Nächstes sollt Ihr einen eigenen Vorrat von @a$SubGoal$ Tuch für das Lagerhaus in [town:Cartagena] anlegen und auf die Fertigstellung Eurer Webereien warten.<n>Für @a$SubGoal$ Tuch braucht Ihr genau @a$SubGoal$ Baumwolle."
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Militär<t>Eure Geleit- und Handelsschiffe<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Pirat<t>Eure Geleit- und Handelsschiffe<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "Spielstand ungültig!"
"0x0d496e89" = "Klickt die Waren an, um den Einkauf zu aktivieren oder abzubrechen."
"0x0d496e8a" = "Automatischer Einkauf durch den Lagerhausverwalter"
"0x0d4fbd33" = "Sehr gut!<n>Damit Ihr stets genug Rohstoffe für Eure Webereien habt, solltet Ihr nun in Santa Marta einen Baumwollbetrieb errichten.<n>Eine Produktionsstätte kann genug Rohstoffe für zwei Fertigungsbetriebe liefern."
"0x0d4fbd34" = "Sorgt nun dafür, dass Eure Betriebe in Santa Marta und [town:Cartagena] auf Hochtouren laufen.<n>Vergesst nicht, dass Eure Webereien in [town:Cartagena] eine ständige Versorgung mit Baumwolle brauchen.<n>Handelt weiter und verkauft die Waren, die Ihr produziert.<n>Dieses Szenario endet, sobald Ihr Euer Bargeld auf @g$GoldGoal$ erhöht habt."
"0x0d552127" = "Stadt kann nicht angegriffen werden"
"0x0d578089" = "Ihr habt die Stadt %1 bereits in den letzten 30 Tagen angegriffen. Der Kapitän weigert sich aus moralischen Gründen, sie erneut anzugreifen."
"0x0d58ea99" = "Der %1 Bukanier %2 hat %3 Arbeiter samt ihren Familien abgeworben. Viele Betriebe in der Stadt arbeiten nun nicht mehr mit voller Kapazität."
"0x0d750c45" = "%1 Konvois"
"0x0d919a5a" = "%1,<n>Ihr wisst recht gut, dass ich Euch unter normalen Umständen zum Teufel schicken würde, doch in so schlimmen Zeiten wie diesen würde ich sogar dem Teufel selbst meine Seele verkaufen.<n><n>Also kommt herein, ich habe Euch etwas zu sagen."
"0x0d9c1799" = "Eure Aufgabe ist es, dafür zu sorgen, dass die Stadt @T$TargetTown$ bis @D$EndDate$ auf den Status „Rezession“ sinkt. Dafür habt Ihr zwei Möglichkeiten:<n><n>Entweder greift Ihr die Stadt an und plündert alle Waren, um den Status „Erholung“ herbeizuführen. Der Status der Stadt sinkt dann wegen der Warenknappheit weiter.<n><n>Alternativ könnt Ihr die Warenversorgung der Stadt abschneiden, indem Ihr Handelskonvois abfangt. Hinweis:  Plündert Ihr einen Konvoi nur und kapert ihn nicht, leidet Euer Ansehen bei der betreffenden Nation in weit geringerem Maße."
"0x0d9c179a" = "Gut! Ich erteile Euch den Auftrag, die Stadt @T$TargetTown$ in den Zustand „Rezession“ zu versetzen. Ihr habt bis @D$EndDate$ Zeit.<n><n>Um Euer Ziel zu erreichen, müsst Ihr alle Händler abfangen, die die Stadt anlaufen, damit sie keine Waren mehr erhält und ihr Status langsam zu sinken beginnt.<n><n>Es gibt jedoch einen Weg, das schneller zu erreichen. Dazu müsst Ihr die Stadt angreifen und plündern. Euer Angriff lässt den Status rasch auf „Erholung“ fallen, und die daraus folgende Warenknappheit in der Stadt lässt ihn weiter sinken, bis die Stadt in der „Rezession“ ist."
"0x0daa656f" = "Kartätsche"
"0x0dbd9444" = "Ihr könnt nichts für mich tun."
"0x0dbd9445" = "Leider habe ich im Moment keine Neuigkeiten für Euch. Versucht es später noch einmal."
"0x0dbd9446" = "Ich fürchte, ich habe keine Aufträge für Euch. Kommt in einigen Tagen wieder."
"0x0dc7ffd3" = "Ein Pirat greift an"
"0x0de467bb" = "Organisator der Hochzeitsfeier"
"0x0e141340" = "Bewaffnet Euren Konvoi so, dass er mindestens drei voll bewaffnete und voll bemannte Geleitschiffe des Typs Fregatte oder höher hat."
"0x0e2cf5dd" = "Handel und Produktion"
"0x0e321cfd" = "Schiffsunterhalt"
"0x0e539993" = "Seeschlachten"
"0x0e60a698" = "Habt Dank für Eure freundliche Spende."
"0x0e60a699" = "Habt Dank für Eure freundliche und großzügige Spende."
"0x0e632146" = "Euer Verhältnis zu %1: %2"
"0x0e636f4c" = "In der Stadt werden keine Arbeiter gebraucht."
"0x0e7a4720" = "Übrig bleibt nur ein einsamer Hut, wo der Piratenkapitän einst saß. Er muss gefangen genommen und der Konvoi versenkt worden sein."
"0x0e8bfce9" = "Nach Rang des Kapitäns"
"0x0e96019a" = "%1 knapp"
"0x0ea0e0e8" = "Nun, dann macht Euch auf den Weg. Steuert die Gewässer um die Stadt @T$TargetTown$ an."
"0x0ea0e0ea" = " Erfüllt diesen Auftrag bis @D$EndDate$."
"0x0eb34b66" = "In diesem Szenario lernt Ihr, wie man Betriebe errichtet, und erfahrt, was Ihr dabei beachten müsst. Außerdem baut Ihr Wohngebiete für Eure neuen Arbeiter.<n><n>In [town:Port Royale] 2 könnt Ihr in jeder Stadt bauen, in der Ihr eine Baugenehmigung gekauft habt. Je mehr Genehmigungen Ihr habt, desto teurer wird die nächste. In der Stadt, in der Ihr das Spiel begonnen habt, besitzt Ihr bereits eine Genehmigung, also könnt Ihr dort sofort mit dem Bau neuer Gebäude beginnen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Errichtet in Santa Marta eine Kakaoanlage und ein Wohngebiet."
"0x0ede126a" = "Jetzt wisst Ihr, wie Seeschlachten ablaufen. Ihr könnt auch eine ganze Stadt angreifen, um sie zu plündern oder sie im Namen einer anderen Nation einzunehmen. Dafür braucht Ihr jedoch große Konvois mit starken Schiffen. Ein Angriff auf eine Stadt schadet Eurem Ansehen bei dieser Nation erheblich – wie Ihr Euch denken könnt –, und von da an verfolgen Euch ihre Militärkonvois.<n><n>Alternativ könnt Ihr ein Piratenversteck angreifen. Piratenverstecke liegen meist an geheimen Orten, doch jeder dieser Orte wird im Laufe des Spiels irgendwann bekannt. Dann könnt Ihr ein Piratenversteck genauso angreifen wie eine Stadt, um die ganze Piratenbande auszulöschen.<n><n>Wie stark ein solches Versteck verteidigt ist, hängt davon ab, wie lange eine Piratenbande schon frei ihr Unwesen treibt und wie erfolgreich ihre Konvois Handelsschiffe geplündert haben.<n><n>Zum Schluss sollt Ihr in diesem Szenario ein kleines Piratennest überfallen. Erfährt vom Gouverneur von @T$TOWN$, wo das Versteck liegt.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zerstört das Piratenversteck von @P$PirateName$."
"0x0eecc4e8" = "Englische Kolonie"
"0x0eecc4e9" = "Französische Kolonie"
"0x0eecc4ea" = "Niederländische Kolonie"
"0x0eecc4eb" = "Spanische Kolonie"
"0x0f1ade15" = "Nun solltet Ihr in der Stadt Arbeitsplätze schaffen und Wohngebiete bauen.<n><n>Da Siedler nur dann in Eurer Stadt bleiben wollen, wenn sie dort Arbeit finden, solltet Ihr zuerst vier Produktionsstätten errichten. Entscheidet, welche Art von Produktionsstätten Ihr bauen wollt. Achtet aber darauf, nur Waren zu produzieren, die Ihr in anderen Städten mit Gewinn verkaufen könnt, denn die Produktionskosten sind hoch, und Ihr lebt vom Erlös dieser Waren.<n><n>Vier Produktionsstätten bieten Arbeit für 120 Arbeiter. Da jeder dieser Arbeiter zu einer vierköpfigen Familie gehört, müsst Ihr Wohnraum für 480 Bürger schaffen, mit anderen Worten vier Wohngebiete.<n><n>Sobald Eure Produktionsstätten und Wohngebiete fertig sind, könnt Ihr versuchen, Siedler aus anderen Städten in Eure Stadt zu bringen. Siedler warten für gewöhnlich in Gouverneursstädten auf Arbeit. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erhöht die Bevölkerung Eurer Stadt auf 480."
