"0x2e39d24e" = "Wie ich sehe, seid Ihr ein wohlhabender Mann, %1.<n><n>Gewöhnlich würde ich Euch um ein Darlehen bitten, doch leider kann ich solche Geschäfte nur mit einheimischen Händlern machen. Daher müsst Ihr eine Baugenehmigung für meine Stadt vorweisen können."
