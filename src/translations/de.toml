"0x0480889b" = "<g:INTEXT_TREIBGUT_800x600.screen><n>You have found a huge goods cache in the place the castaway described, and you take the goods on board."
"0x0480889c" = "<g:INTEXT_TREIBGUT_800x600.screen><n>You discover a huge goods cache in the place the castaway described.<n>Unfortunately your convoy has no more space left on board, so you will have to leave the goods behind for now."
