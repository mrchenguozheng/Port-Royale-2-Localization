"0x00225853" = "Ein neuer Sturm zieht aus Südwesten auf die Karibik zu. Die Produktion auf den Plantagen ist in allen vom Sturm betroffenen Städten halbiert."
"0x0027e860" = "Betriebe"
"0x002e6f8f" = "-"
"0x0034be0d" = "Geschwindigkeit"
"0x004b9030" = "Ihr wisst bereits, dass an Seeschlachten nur Geleitschiffe teilnehmen können. Die besiegten Handelsschiffe fallen stets dem Sieger zu, der sie plündern oder kapern kann.<n><n>Nicht immer seid Ihr der Auslöser einer Seeschlacht mit Euren Konvois. Wird einer Eurer Konvois von Piraten oder von einem Militärkonvoi einer Nation angegriffen, bei der Euer Ansehen sehr niedrig ist, könnt Ihr den Kampf aufnehmen, oder Euer Konvoi kann versuchen, der Schlacht auszuweichen. Wollt Ihr eine Schlacht vermeiden, müssen Eure Geleitschiffe versuchen, den Feind von Euren Handelsschiffen fernzuhalten.<n><n>Gelingt das nicht, werden Eure Geleitschiffe gekapert und Eure Handelsschiffe geplündert. Hat ein Konvoi keine Kriegsschiffe, kann er bei einem Angriff nur versuchen, der Schlacht auszuweichen. Vorteil: Die Handelsschiffe werden vom Feind nur geplündert und nicht gekapert.<n><n>Statten dem Gouverneur jetzt einen Besuch ab. Er hat einen neuen Auftrag für Euch. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erfüllt den nächsten Auftrag, den der Gouverneur Euch erteilt."
