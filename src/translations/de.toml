"0x24695110" = "Ich danke Euch. Ich bin ein Händler aus @T$Town$. Da meine Verfolger nicht wissen, wo ich untergekommen bin, werden sie gewiss versuchen, mich in meiner Heimatstadt zu erwischen. Beginnt Eure Suche dort und tötet die Kopfgeldjäger. Ich muss spätestens @D$EndDate$ von hier fort. Wenn Ihr den Auftrag vorher erledigt, zahle ich Euch @g$Reward$."
"0x24695111" = "Ich muss dringend nach @T$Town$ zurück, denn dort muss ich einige Angelegenheiten erledigen, bevor ich endgültig verschwinden kann. Leider werden die Zugänge zu @T$Town$ von einem Kopfgeldjäger beobachtet, den Ihr töten müsst. Ich belohne Euch mit @g$Reward$, wenn Ihr den Auftrag vor @D$EndDate$ erledigt."
"0x24695112" = "Ich danke Euch! Ich vermute, dass ein Kopfgeldjäger den Hafeneingang von @T$Town$ beobachtet.<n>Wir machen es so: Ich streue das Gerücht, dass ich an Bord eines Eurer Schiffe gehe, dann segelt Ihr nach @T$Town$ und seht, was geschieht.<n>Lasst mich spätestens @D$EndDate$ wissen, dass der Weg frei ist, dann zahle ich Euch eine Belohnung von @g$Reward$."
"0x246aece6" = "%1: Hungersnot"
"0x2478c95f" = "Herzlichen Glückwunsch! Ihr habt dieses Szenario erfolgreich abgeschlossen und die Karibik von der Plage eines berüchtigten Piraten befreit.<n><n>Im Laufe des Spiels entstehen Piratenverstecke von selbst. Die Zahl der Piratenkonvois hängt jedoch davon ab, wie erfolgreich sie sind. Beachtet, dass Piraten nur Handelskonvois ausplündern wollen und Militärkonvois sehr scheuen. Aus diesem Grund meiden sie Gewässer, in denen zu viele Militärkonvois unterwegs sind.<n><n>Auch im freien Spiel könnt Ihr Piraten jagen und ihre Verstecke ausräuchern. "
"0x24802954" = "%1: Schiff versenkt"
"0x2487ab5c" = "Bilanz"
"0x248f1e26" = "Versteck von Pirat %1"
"0x24901249" = "%1 von %2 Seeleuten wollen sich Euren Abenteuern anschließen."
"0x24a0f898" = "Werft"
"0x24b0fd83" = "Merkmal "
"0x24c12812" = "Herzlichen Glückwunsch! Ihr habt den Auftrag erhalten, Städte einzunehmen!<n><n>Da Städte sehr stark verteidigt sein können, solltet Ihr eine englische Stadt mit möglichst wenigen Kanonentürmen im Hafen wählen. Die Stadt @T$SampleTown$ ist ein perfektes Ziel.<n><n>Um eine Stadt anzugreifen, aktiviert die Option Städte angreifen für Euren Konvoi. Wählt dazu Euren Konvoi und klickt auf die Schaltfläche Angriffsmodus.<n><n>Ihr könnt eine Stadt von der See oder vom Land aus angreifen. Einen Angriff vom Land solltet Ihr jedoch nur wagen, wenn Eure Matrosen die Soldaten der Stadt zahlenmäßig übertreffen. Außerdem solltet Ihr in diesem Fall die Hälfte Eurer Matrosen mit Entermessern und die andere Hälfte mit Musketen ausrüsten können.<n><n>Hinweis: Befindet sich ein Militärkonvoi im Hafen einer Stadt, müsst Ihr diesen Konvoi besiegen, bevor Ihr die Stadt selbst angreift.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erfüllt Euren Auftrag, Städte einzunehmen."
"0x24e18ac4" = "[ref:0x101874f6]"
"0x24ec3366" = "Ausgezeichnet! Nun ist Euer Konvoi bewaffnet und bereit, einen der Piratenkonvois von Blackbeard zu stellen.<n><n>Das Ereignisfenster liefert täglich Hinweise, die Euch helfen, den Aufenthaltsort des Piratenkonvois zu finden, sofern dieser auf See liegt. Piraten zu finden kann schwierig sein, denn nach einem erfolgreichen Überfall auf ein Handelsschiff kehren sie stets in ihr Versteck zurück.<n><n>Denkt daran, dass ein Piratenkonvoi bis zu fünf Kriegsschiffe umfassen kann. Verstärkt Euren Konvoi, wenn Ihr ihn nicht für stark genug haltet. Ihr wisst bereits, wie Ihr an etwas Gold kommt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Erfüllt den Auftrag, den Euch der Gouverneur von @T$TOWN$ erteilt hat."
"0x250c7a12" = "Liefert bis @D$Date$ @a$Amount$. Ihr könnt die Waren am Markt übergeben und erhaltet sofort eine Zahlung von @g$GoldPerBarrel$ für jedes <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> von @G$Goods$."
"0x250c7a13" = "Ich bin begeistert. Bitte liefert @a$Amount$ an den Markt. Dort erhaltet Ihr bis @D$Date$ Eure Zahlung von  @g$GoldPerBarrel$ für jedes <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x250c7a14" = "Trefft meinen Gesandten am Markt. Übergebt bis @D$Date$ @a$Amount$ @G$Goods$, er wird Euch einen guten Preis bieten."
"0x2540ea42" = "Zusätzlicher Text (Chronist)"
"0x2546beb9" = "So, @N$OwnerName$ hat Euch zu mir geschickt? Ja, ich kenne diesen alten Kapitän, er könnte Eurer Mannschaft gewiss noch das eine oder andere beibringen. Warum sollte ich Euch aber helfen? Ich will nicht schwierig sein – ich schätze, Ihr habt einige Zeit damit verbracht, mich aufzuspüren. Wenn Ihr mir einen kleinen Gefallen tut, sage ich Euch, wo der Kapitän seinen Ruhestand verbracht hat."
"0x2546beba" = "Ich kenne keinen @N$OwnerName$, aber ich weiß sehr wohl, wo @N$TeacherName$ ist. Ich könnte es Euch sagen, wenn ich denn geneigt wäre. Wie wäre es, wenn Ihr mir einen Gefallen tut und ich Euch dafür einen? "
"0x2546bebb" = "Mir ist egal, ob @N$OwnerName$ Euch geschickt hat oder der bucklige Großwesir von Taipei! Ich habe ein Problem. Und solange es nicht gelöst ist, bin ich nicht daran interessiert, von irgendetwas anderem zu hören. Ich habe einen Vorschlag: Wie wäre es, wenn Ihr mir eine Truhe beschafft, und ich sage Euch, wo dieser verrückte alte @N$TeacherName$ sich versteckt."
