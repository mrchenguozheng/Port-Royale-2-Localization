"0xec45c63b" = "Jeder hat 5 Karten bekommen. Ich sage 1 Punkt an.<n><n>Wenn Ihr mitspielen wollt, müsst Ihr einen Punkt höher ansagen."
"0xec656430" = "Ihr könnt nun Euer Ansehen in %1 steigern, indem Ihr spanische Schiffe und Städte angreift. Euer Ansehen bei den anderen Nationen wird dadurch nicht gemindert."
