"0xf7b263ab" = "%1 ist persönlich auf dem feindlichen Schiff. Er schlägt Eurem Kapitän vor, den Kampf durch ein Duell zu entscheiden.<n><n>Um die Mannschaft zu schonen, nimmt Euer Kapitän die Herausforderung an."
