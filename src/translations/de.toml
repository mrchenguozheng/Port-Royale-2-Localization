"0x37d00ed9" = "You should now have sufficient town defenses for the moment. Now increase the size of your town and improve its appearance. Build a church, as well as more production facilities and residential areas to attract more than 2,200 inhabitants to your town.<n><n>You have until @D$EndDate$ to do so. The scenario will then be over.<n><n>Don't forget to sell the goods you produce at a profit! <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Build a church and increase the population of your town to 2,200. You have until @D$EndDate$."
