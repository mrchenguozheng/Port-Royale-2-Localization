"0x35f49055" = "[riddle:answer=Cayman;group=35f49055;clue=weit draußen+allein;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#ch25]Eine Insel weit draußen, klein und allein, sonst gibt es nichts, das könnte X sein."
