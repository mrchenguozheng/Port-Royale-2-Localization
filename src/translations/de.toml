"0x27beb2d9" = "Loot @a$Amount$ of spices, wine and tools from transport convoys belonging to @n$HostileNation$. You must not capture or sink any ships. Then deliver these goods to the market in @T$TOWN$ by @D$EndDate$. After that, you can collect your reward from the governor."
