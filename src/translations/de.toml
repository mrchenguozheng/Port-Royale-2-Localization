"0x30bb44fc" = "Seid Ihr nicht der berühmte @A$USER$? Könntet Ihr mir bitte helfen? Ich werde von einem Kopfgeldjäger verfolgt, einer meiner Widersacher hat ihn mir auf den Hals geschickt. "
"0x30bb44fd" = "Nehmt Euch einen Hocker, @A$USER$. Mein Name ist @N$OwnerName$, und ich habe eine wichtige Sache mit Euch zu besprechen. Wo soll ich anfangen? Nun, ich hatte einen Streit mit meiner Frau; sie beschuldigte mich, ihr untreu zu sein, was natürlich völlig unwahr ist. Wie auch immer, sie hat mich aus dem Haus geworfen, und das ist noch nicht das Schlimmste: Sie hat einen Kopfgeldjäger angeheuert, sodass ich die Stadt nicht einmal mehr betreten kann. Könnt Ihr mir helfen?"
"0x30bb44fe" = "Ihr seht aus wie jemand, der ein Schiff straff führen kann.<n>Ich muss dringend nach @T$Town$ reisen, um Dokumente zu überbringen, die einen der dortigen Händler belasten. Leider hat der Händler Wind davon bekommen und versucht nun, die Dokumente in seine Hände zu bekommen. Könntet Ihr nicht einen Weg finden, mich nach @T$Town$ zu bringen?"
"0x30ee69e7" = "Warenstatistik"
"0x30f0fea9" = "Sucht außerhalb der Stadt @T$TOWN$ nach Hinweisen auf den Aufenthaltsort der Trunkenbolde. Bringt das Schiff bis @D$EndDate$ zum Händler @N$OwnerName$ zurück."
"0x31054c65" = "scenario000 - @I$Idx$"
"0x31074c51" = "Habt Ihr gehört, dass in @T$Town$ eine Seuche ausgebrochen ist? Das hätte sich gewiss verhindern lassen, wenn es in der Stadt ein Hospital gäbe. Leider ist mein Baumeister ein Feigling und fürchtet sich davor, die Stadt zu betreten, um das Hospital in Auftrag zu geben. Daher schlage ich vor, Euch zu schicken. Nehmt Ihr an? Ich bin bereit, Euch @g$Reward$ für Eure Mühen zu zahlen!"
