"0x35f49136" = "[riddle:answer=Caracas;group=35f490c7+35f49136;clue=Schiffswracks+Klippe;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#ch7]Nicht weit von der Stadt, am Fuß einer Klippe, liegen die Überreste eines alten, zerschlagenen Schiffswracks."
"0x35f49137" = "[riddle:answer=southeast;group=35f49137;clue=Südosten;certainty=certain;source=original-en]Ein mächtiger Fluss zieht tief seine Bahn nach Osten, in Sumpf und Morast hinein — dann von dort nach Südosten, ein Stück über Land, zur Stadt mit dem X, ganz außen am Rand."
