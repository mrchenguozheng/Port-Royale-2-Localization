"0x0f52782d" = "Herzlichen Glückwunsch! Ihr könnt nun in [town:Cartagena] Kleidung aus Baumwolle produzieren.<n><n>Wie Ihr Euch vorstellen könnt, hängen die Kosten der Kleidungsproduktion in hohem Maße von dem Preis ab, den Ihr für die Baumwolle zahlt. Aus diesem Grund könnt Ihr Fertigwaren nur produzieren, wenn Ihr sicher seid, die Rohstoffe zu einem vernünftigen Preis einkaufen zu können. Alternativ könnt Ihr die Rohstoffe selbst produzieren.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Baut in Santa Marta eine Baumwollproduktion und handelt, um Euer Bargeld auf @g$GoldGoal$ zu erhöhen."
"0x0f5d7735" = "Weit östlich von [town:Charleston] liegen die Bermudainseln. Haltet Euch weit von ihnen fern! Vor zwei Monaten segelte mein Schwager dorthin, um sie zu erkunden, doch er ist nie zurückgekehrt. Niemand weiß, was dort vor sich geht, doch eines ist sicher: Ein schreckliches Schicksal erwartet alle, die sich den Inseln zu sehr nähern!"
"0x0f5d7736" = "Habt Ihr die neueste Geschichte über die Bermudainseln gehört? Ein Händler wollte die Route an den Inseln vorbei nach Europa nutzen, doch er kam dort nie an. Sein Bruder brach auf, um ihn zu suchen, fand aber südlich der Inseln nichts als ein paar Wrackteile."
"0x0f5d7737" = "Erst vorgestern erzählte mir ein Seemann aus [town:Port Royale], dass sie kürzlich sehr nahe an den Bermudainseln vorbeigefahren sind. Fast wären sie zu nahe gekommen, denn mit eigenen Augen sah er ein riesiges Ungeheuer im Wasser. Es sprühte Feuer, und aus seinen langen Ohren quoll Rauch. Wehe denen, die es wagen, sich diesem Seeungeheuer zu nähern!"
