"0x20eef526" = "<ts:80><ts:145><ts:210><n>Ausgang der Schlacht:<n><n>"
"0x20ff905e" = "Mannschaft"
"0x2106ce9e" = "Im Gasthaus wartet ein erfahrener Kapitän."
"0x21117682" = "[ref:0xee00c4df]"
"0x21117683" = "<n><n>Wollt Ihr Eure Genehmigung zurückgeben?<n>Denkt daran, dass ich Euch dafür nichts zahlen kann!"
"0x211c8552" = "Spielzeit abgelaufen"
"0x2137ec23" = "Ich danke Euch. Bis @D$Date$ zahle ich Euch hohe Preise für Wein, Werkzeug und Gewürze. Trefft meinen Abgesandten am Marktplatz und liefert ihm je @a$Amount$. Er nimmt nur eine vollständige Lieferung an und zahlt Euch dort sofort."
"0x2137ec24" = "Das klingt gut. So reist in die Städte unserer Feinde und kauft dort Importwaren auf. Liefert bis @D$Date$ je @a$Amount$ an meinen Abgesandten am Marktplatz von @T$TOWN$, er zahlt mehr als das Doppelte des üblichen Preises."
"0x2137ec25" = "Wisst Ihr, was das Beste wäre? Die Importwaren in @n$Nation2$ aufzukaufen und dort eine Knappheit zu verursachen. Liefert je @a$Amount$ an den Marktplatz. Mein Abgesandter wartet dort bis @D$Date$ und zahlt Euch einen hohen Preis."
"0x215e37a6" = "Ich habe kürzlich ein Gespräch mitgehört, in dem ein Händler erwähnte, eines seiner Schiffe sei gesunken. Um das Schiff machte er sich keine großen Sorgen, es war nur eine klapprige alte Kiste. Doch es hatte eine besondere Truhe an Bord."
"0x215e37a7" = "Dann haben wir eine Abmachung. Auf der letzten Fahrt, auf der ich angeheuert hatte, verlor der Kapitän aus irgendeinem Grund die Beherrschung wegen einer Truhe und warf sie einfach über Bord."
"0x215e37a8" = "Ein Mann, der einst ein guter Freund war, ist mit einer wertvollen Truhe von mir davongelaufen."
"0x2167838b" = "Schiffskauf"
"0x21743bf7" = " Ich muss diese Dinge haben! Wir kennen die genaue Stelle des Schiffsuntergangs nicht. @l$ChestPos$ Bringt mir die Truhe bis @D$EndDate$."
"0x21743bf8" = " Ihr müsst mir die Sachen bis @D$EndDate$ beschaffen. @l$ChestPos$"
"0x21743bf9" = " Erst kürzlich schrieb er mir, er habe diese Truhe über Bord geworfen. @l$ChestPos$ Ihr müsst mir meine Sachen zurückbringen! Ihr findet mich bis @D$EndDate$ hier."
"0x217923cb" = "Ende der Warenlieferung: %1"
"0x2190d204" = "Ein örtlicher Händler ist bereit, Euch %1 für den Betrieb zu zahlen."
"0x21a69afe" = "Marketingleiter"
"0x21b0dfff" = "%1 plündert %2"
"0x21b3050a" = "Ein Militärkonvoi hat die Hafenverteidigung der Stadt zerstört und Waren erbeutet. Der Status der Stadt ist ebenfalls gesunken."
"0x21bdc952" = "nächstes Diagramm"
"0x21bf83f0" = "Ständige Schiffsanzeige"
"0x21c2f2cf" = "<n><o:0xffC00000>Auftrag nicht erfüllt. <o:0xff000000>"
"0x21cae149" = "Sehr gut! Nun müsst Ihr Euren Konvoi stärker machen, damit Ihr es mit mehreren Militärkonvois aufnehmen könnt. Ihr solltet mindestens drei Schiffe in Eurem Konvoi haben, die Fregatten oder größer sind.<n><n>Ihr könnt die Schiffe kapern oder versuchen, sie in den Werften der Gouverneursstädte zu kaufen.<n><n>Macht diese Schiffe zu Geleitschiffen und sorgt dafür, dass sie voll bewaffnet und voll mit Matrosen bemannt sind.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Bewaffnet Euren Konvoi so, dass er mindestens drei voll bewaffnete und voll bemannte Geleitschiffe hat, die Fregatten oder größere Schiffe sind. "
"0x21d142f5" = "Konvoi in dieser Stadt reparieren"
"0x21e727b4" = "Ich bin sicher, dass Ihr schon vom Piraten @P$PirateName$ gehört habt. Er hat bereits @I$NumConvoys$ Konvois, und wir haben sein Versteck noch nicht entdeckt. Glücklicherweise kennen wir den Aufenthaltsort eines seiner Konvois. Vielleicht ist er noch in der Nähe. Ich möchte, dass Ihr diesen Konvoi vernichtet. "
"0x21e727b5" = "Wir müssen uns beeilen, denn ich habe gerade erfahren, wo sich einer der Konvois des Piraten @P$PirateName$ befindet. Sucht und vernichtet diesen Konvoi."
"0x21e727b6" = "Alle Piraten haben ihr eigenes Versteck, von dem aus sie Konvois zum Beutemachen entsenden. Der Pirat @P$PirateName$ hat inzwischen eine Flotte von @I$NumConvoys$ Konvois angesammelt. Durch Zufall haben wir den aktuellen Aufenthaltsort eines wichtigen Kapitäns dieser Bande und seines Konvois entdeckt. Ich möchte, dass Ihr diesen Konvoi sucht und vernichtet."
