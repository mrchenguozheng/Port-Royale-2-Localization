"0xdbf5380b" = "Friedensvertrag geschlossen"
"0xdbf8bc55" = "Piratenkonvoi vernichtet"
"0xdc0e801d" = "Ich habe weitere wichtige Informationen für Euch über den Krieg mit %1.<n><n>"
"0xdc124a2b" = "Bestand"
"0xdc24736a" = "<n><n>Nun ist es Zeit zurückzuschlagen:"
"0xdc3ece69" = "Der Pirat %1 ist mächtiger geworden."
"0xdc471503" = "Feind von %1"
"0xdc773a52" = "Gestohlene Dokumente"
"0xdc7929c7" = "Treibende Kiste"
"0xdc7c1613" = "Erfolgreiche Gefechte steigern Euren Ruf schneller um <o:0xFFFF2FAAD>5%<o>."
"0xdc939a60" = "Kirche"
"0xdc9ac8b5" = "Eine Pest ist ausgebrochen"
"0xdc9c4bab" = "Baum"
"0xdca0a525" = "Verkaufen"
"0xdcba5843" = "Schön, Euch zu sehen, @A$USER$, denn ich brauche Eure Hilfe. Ich diente einst unter dem Piraten @P$PirateName$. Doch ich kam zur Vernunft und schloss ein Abkommen mit dem Gouverneur von @T$TargetTown$. Leider haben meine früheren Kameraden davon erfahren und ein Kopfgeld auf mich ausgesetzt. Könnt Ihr mir helfen und mich nach @T$TargetTown$ bringen?"
"0xdcba5844" = "Ich habe gehört, dass man Euch vertrauen kann, @A$USER$. Ich stehe im Dienst des Gouverneurs von @T$TargetTown$ und muss ihn dringend sehen, um ihm höchst brisante Informationen zu überbringen. Leider sind gewisse Parteien entschlossen, mich daran zu hindern, @T$TargetTown$ zu erreichen. Deshalb frage ich Euch, ob Ihr mir freie Fahrt gewähren könnt."
"0xdcba5845" = "Oh, mich verfolgt das Unglück. Vor einigen Wochen bin ich auf ein Schiff des berüchtigten Piraten @P$PirateName$ getroffen. Der Kapitän dieses Schiffs muss allerdings sehr unerfahren gewesen sein, denn wir konnten es fast ohne Mühe versenken.<n>Leider stellte sich heraus, dass dieser unglückliche Kapitän der geliebte Neffe des Piraten @P$PirateName$ war. Seit er meinen Namen gehört hat, jagt er mich. Meine Mannschaft hat mein Schiff genommen und ist in Panik geflohen, und nun sitze ich hier fest.<n>Könnt Ihr mir helfen, nach @T$TargetTown$ zu kommen, meiner Heimatstadt?"
