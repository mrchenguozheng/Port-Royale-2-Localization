"0xef77d11d" = "Der %1 Bukanier %2 hat die Hafenverteidigung der Stadt zerstört und Waren geplündert. Auch der Status der Stadt ist gefallen."
"0xef795016" = "Die Stadt erholt sich von einem Angriff."
"0xef88a0d4" = "Oh, seht nur. Ich habe gerade eine Nachricht von meinem Kurier erhalten. Der Auftrag, den ich Euch geben wollte, ist nicht mehr gültig. Ich muss ihn wohl zu lange auf meinem Schreibtisch liegen lassen haben!"
