"0xfb343dde" = "Während Ihr die Stadt plündert, läuft eine junge Frau auf Euch zu.<n>„Ich weiß, dass dieser Überfall nur auf Befehl meines Vaters ausgeführt wird! Hat er Euch gesagt, dass ich aus freiem Willen hier bin und meinen Entführer wirklich liebe? Ich flehe Euch an, mich nicht zurückzubringen – ich werde Euch belohnen!“<n><n>Wollt Ihr die Tochter hier in @T$TargetTown$ ihrem Schicksal überlassen?"
"0xfb343ddf" = "Die Tochter des Gouverneurs dankt Euch und gibt Euch eine Karte, die ein Versteck mit @a$Amount$ Waren zeigt."
"0xfb3648b2" = "Handelsroute aktiv"
"0xfb399b9a" = "Ein örtlicher Händler ist bereit, Euch das Wohngebiet für %1 zu verkaufen."
"0xfb3ffb48" = "Ich möchte Euch noch einmal dafür danken, dass Ihr so großzügig wart und einen Eurer Konvois übergeben habt. Er wird derzeit bewaffnet und wird in %1 Tagen seeklar sein.<n><n>Wenn Ihr einen weiteren Konvoi übergeben wollt, müsst Ihr bis dahin warten."
"0xfb425369" = "Design-Unterstützung"
"0xfb4be839" = "Ausgezeichnet! Ihr habt alle Piratenkonvois zerstört, sodass kein Pirat entkommen kann. Zerstört Ihr alle Konvois einer Piratenbande, bevor Ihr ihr Versteck angreift, dauert es länger, bis neue Piratenkonvois in der Karibik auftauchen.<n><n>Greift nun das Versteck an, so wie Ihr eine Stadt angreifen würdet: Wählt Euren Konvoi und klickt dann mit der rechten Maustaste auf das Piratenversteck. Sind einige Piratenschiffe im Hafen vor Anker, müsst Ihr diese zuerst angreifen, bevor Ihr die Hafenkämpfe gewinnen könnt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zerstört Blackbeards Piratenversteck."
