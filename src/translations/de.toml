"0x0480889b" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Ihr habt an dem vom Schiffbrüchigen beschriebenen Ort ein gewaltiges Warendepot gefunden und die Waren an Bord genommen."
"0x0480889c" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Ihr entdeckt ein gewaltiges Warendepot an dem vom Schiffbrüchigen beschriebenen Ort.<n>Leider hat Euer Konvoi keinen Platz mehr an Bord, sodass Ihr die Waren vorerst zurücklassen müsst."
"0x04825ba0" = "Der Konvoi kann nicht auslaufen, da er sich derzeit zur Reparatur in der Werft befindet. Wartet, bis die Reparaturen abgeschlossen sind."
"0x04b51123" = "Es tut mir leid, ich kann Euch diesen Auftrag nicht mehr geben. Ihr habt zu lange überlegt."
