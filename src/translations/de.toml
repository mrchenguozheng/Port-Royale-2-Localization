"0xfab539b0" = "Ich danke Euch, dass Ihr dieses Piratenversteck ausgeräuchert habt. Ich hoffe, das Versteck enthielt genug Gold, um Eure Mühen zu entschädigen. Alle Nationen sind Euch dankbar!  "
