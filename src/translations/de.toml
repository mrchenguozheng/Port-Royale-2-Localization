"0xd4cd0f3d" = "Henry Avery gilt als Musterbeispiel des erfolgreichen Piraten. Er kaperte die reichsten Schiffe seiner Zeit, entging den Behörden und lebte lange genug, um seinen Reichtum auskosten zu können.<n><n>Über Averys frühe Jahre ist kaum etwas bekannt. Sicher ist nur, dass er im Juni 1694 als Maat auf dem Kaperschiff Charles fuhr, das von den Spaniern die Erlaubnis erhalten hatte, Schiffe der französischen Kolonie Martinique in Westindien zu kapern. Eines Tages stellte er sich an die Spitze einer Meuterei und brachte das Schiff in seine Gewalt; der größte Teil der Mannschaft schloss sich ihm an. Der Kaper – schnell, mit 46 Kanonen bewaffnet und wie gemacht für ein Piratenschiff – erhielt den Namen Fancy. 1695 gelang ihm sein größter Coup: die Plünderung der indischen Schatzflotte. Im Verband mit anderen Piraten griff er die schwer bewaffnete Flotte des Großmoguls an und kaperte zwei Schiffe, die bis unter die Rahen mit unvorstellbaren Schätzen beladen waren. <n><n>Er bestach den Gouverneur der Bahamas, damit er den Piraten seinen Schutz gewährte, zahlte die Mannschaft aus – und die Seeleute verstreuten sich in alle Winde. Einige wurden in England gefasst; Avery aber segelte nach Irland, wo sich seine Spur verliert. Vermutlich genoss er seinen Reichtum im Verborgenen weiter."
"0xd4cd0f3e" = "Einer der populärsten Piraten aller Zeiten war Edward Teach (gestorben 1718), genannt Blackbeard. Sein Markenzeichen war, wie der Name schon sagt, ein furchteinflößender schwarzer, geflochtener Bart. Mit 300 Mann Besatzung durchkreuzte er auf der Queen Anne’s Revenge, einem umgebauten niederländischen Handelsschiff, die Weltmeere und scheute sich nicht, es mit den Kriegsschiffen der Royal Navy aufzunehmen.<n><n>18 Monate lang machte Teach, ein Bristol-Gebürtiger, vor allem den Norden Westindiens und die Küste Nordamerikas unsicher. Auf den Bahamas und im verarmten North Carolina fand er immer wieder Zuflucht.<n><n>Berühmt wurde Blackbeard nicht zuletzt deshalb, weil er dem Klischee des furchterregenden, heißblütigen und launischen Seeräubers aufs Genaueste entsprach: Angeblich schoss er seinen Kanonier Israel Hands zweimal nieder und machte ihn damit zum Krüppel – einzig, um der Mannschaft in Erinnerung zu rufen, wer hier das Kommando hatte.<n><n>Seine letzte Stunde schlug erst 1718, als der Piratenjäger Robert Maynard seine Schaluppe aufspürte. Obwohl er bis an die Zähne betrunken war, kämpfte Teach wie ein Dämon und konnte erst nach erbittertem Ringen besiegt werden. Er fiel im Kampf; die meisten Überlebenden seiner Mannschaft wurden gehängt."
"0xd4cd0f3f" = "Wer im frühen Zeitalter der Entdeckungen sein vorhandenes Vermögen mehren wollte, fand in den Zuckerplantagen, die seit dem frühen 16. Jahrhundert vor allem in der Karibik entstanden, eine hervorragende Anlagemöglichkeit.<n><n>Sie warfen im Durchschnitt zehn Prozent Gewinn ab, in den besten Fällen (etwa auf Barbados um 1650) sogar bis zu 50 Prozent! Solche Plantagen brauchten natürlich riesige Mengen an Arbeitskräften, und so wurden Hunderttausende von Sklaven aus Afrika dorthin verschifft – der weiße Mann hatte die indigene Bevölkerung an vielen Orten inzwischen fast vollständig ausgerottet. <n><n>Die Europäer selbst hielten das Klima nicht aus; ganz abgesehen davon waren sie sich für solche Plackerei auch zu fein. Selbst die Plantagenbesitzer zogen es vor, in London oder Madrid zu wohnen, und überließen die Arbeit in den Kolonien ein paar Handlangern. Im 18. Jahrhundert lag der Anteil der Schwarzen auf manchen Inseln bei bis zu 90 Prozent!"
"0xd4cd0f40" = "Der Handel mit dem „schwarzen Gold“ hatte bereits im frühen 16. Jahrhundert begonnen. Die Sklavenhändler holten ihre „Ware“ vorzugsweise von der westafrikanischen Küste zwischen dem Senegal und dem heutigen Kamerun. Diese Gegend lag nicht nur verkehrstechnisch günstig, sondern verfügte auch über eine stabile wirtschaftliche und sozialpolitische Infrastruktur. Die Seeleute mussten also nicht selbst auf Sklavenjagd gehen, sondern konnten ihre Opfer bei den dortigen Häuptlingen oder anderen Sklavenhändlern kaufen.<n><n>Besonders gefragt waren junge Männer zwischen 15 und 35, denn man brauchte sie vor allem für die harte Arbeit auf den Plantagen. Etwa jeder fünfte Sklave überstand die Überfahrt nicht, die bis zu sechs Wochen dauern konnte. Die einen starben an der barbarischen Behandlung ihrer Herren, die anderen bei Unglücken auf See. Diese hohe Sterblichkeit kalkulierten die Händler von Anfang an ein und stopften, um jede Fahrt so einträglich wie möglich zu machen, so viele Sklaven wie nur möglich auf ihre Schiffe. Wochenlang lagen diese elenden Geschöpfe aneinandergekettet wie Sardinen in der Dose, ohne Tageslicht und mit kaum Luft zum Atmen.<n><n>Unter diesen Umständen ist es fast unglaublich, dass überhaupt jemand diese Reisen überlebte!  "
"0xd4cd0f41" = "Obwohl es in Nord- und Mittelamerika keine weißen Sklaven gab, arbeiteten dort zahlreiche Europäer unter Bedingungen, die sich von denen der Sklaven kaum unterschieden.<n><n>Viele junge Männer (vorwiegend aus der ungebildeten Unterschicht) wollten auswandern, hatten aber kein Geld für die Überfahrt. Sie liehen sich das Geld dafür und verpflichteten sich, die Schuld anschließend durch eine befristete Arbeit auf einer Zuckerplantage (oder etwas Ähnlichem) abzutragen. <n><n>Doch die so logisch klingende Abmachung hatte einen Haken: Viele Plantagenbesitzer versuchten, aus diesen Vertragsarbeitern während ihrer Dienstzeit so viel Leistung wie nur möglich herauszupressen. Hinzu kam das karibische Klima, das den meisten Europäern schwer zusetzte.<n><n>Dieses System der „Vertragsarbeit“ wurde häufig auch bei Sträflingen angewandt, die man aus ihrer Heimat verbannt hatte. Die Briten wandten diese Methode später vor allem auf Inder an, die sie zur Arbeit in den afrikanischen Kolonien zwangen."
"0xd4cd0f42" = "Je mehr die amerikanischen Kolonien aufblühten, desto stärker wuchs auch der Atlantikhandel. Großbritannien, seit den Tagen Königin Elisabeths die stärkste Seemacht, hatte ein lebhaftes Interesse daran, den Warenverkehr zu kontrollieren, damit die heimische Wirtschaft an den Handelsgewinnen teilhatte.<n><n>Unter dem Lordprotektor Oliver Cromwell bestimmte die „Erste Navigationsakte“ von 1651, dass Waren von den Kolonien nach Europa nur auf englischen Schiffen befördert werden durften. Diese Maßnahme richtete sich vor allem gegen die aufstrebende Macht Holland und kam der eigenen Handelsflotte zugute.<n><n>1663 wurden die Bestimmungen noch verschärft: Kolonieschiffe, die ihre Waren nach Europa bringen wollten, mussten englische Häfen anlaufen und dort einen Zoll entrichten. Doch gerade dieser Versuch, den Handel der Kolonien zu kontrollieren, stieß bald an seine Grenzen – das britische Militär konnte unmöglich die gesamte Küste überwachen, und so blühte der Schmuggel. <n><n>Gerade der ständige Streit mit dem Mutterland um die Bedingungen von Aus- und Einfuhr ließ besonders in den nordamerikanischen Kolonien ein eigenes Selbstbewusstsein der Siedler entstehen und wurde später zu einer wesentlichen Triebkraft der Unabhängigkeitsbewegung."
"0xd4cd0f43" = "Der Beginn des kolonialen Zeitalters brachte zahlreiche gesundheitliche Probleme mit sich, die man von den viel kürzeren Fahrten im Mittelmeer oder entlang der Küsten kaum kannte. Eine Überfahrt in die Kolonien in der Karibik und in Nordamerika dauerte ein bis zwei Monate, bei Sturm oder Flaute auch länger. Da verwundert es nicht, womit man an Bord zu kämpfen hatte: Gestank nach schmutziger Kleidung und schlechter Körperpflege, verdorbene und verfaulte Lebensmittel, Mangel an sauberem Wasser, Ratten an Bord und nicht zuletzt die psychische Belastung durch Eintönigkeit und Lagerkoller. Der Skorbut war ein Schreckgespenst jedes Seemanns: Die durch Vitaminmangel verursachte Krankheit kündigte sich durch Haar- und Zahnausfall an und kostete viele Matrosen das Leben. Erst dem Weltumsegler James Cook (1728-1779) gelang es, diese Plage wirksam zu bekämpfen. Er sorgte nicht nur für Sauberkeit an Bord, sondern versorgte seine Mannschaft auch mit Sauerkraut und Frischobst. Wer an Land ging, hatte es zudem mit Tropenkrankheiten zu tun, etwa dem Schwarzwasserfieber, einer der gefährlichsten Erscheinungsformen der Malaria: Diese Infektion, die sich durch beschleunigten Puls, Fieber, Schüttelfrost und dunklen Urin bemerkbar macht, endete fast immer tödlich."
"0xd4cd0f44" = "Hinter den vielen Namen, die Seefahrer und Kartografen für die neuen Landstriche, Flüsse und Siedlungen erfinden mussten, stecken interessante Anekdoten. Schon der erste Name, den die europäischen Entdecker in Amerika vergaben, erzählt eine eigene Geschichte: Christoph Kolumbus nannte die Insel, auf der er am 12. Oktober 1492 landete, Salvador („Erlöser“). Damit dankte er dem Herrn dafür, dass dieser die Flotte auf der Hinreise vor Krankheiten und Stürmen bewahrt und in buchstäblich letzter Minute eine Meuterei abgewendet hatte, die vor der Sichtung des Landes auszubrechen drohte.<n><n>In der Folgezeit wählten die spanischen Konquistadoren meist Namen mit religiösem Bezug, etwa „Nombre de Dios“ („Name Gottes“) oder „Trinidad“ („Dreifaltigkeit“). In anderen Fällen ließ man sich vom Datum oder vom Anblick der Landschaft inspirieren. So erhielt eine Bucht an der brasilianischen Küste, die portugiesische Seeleute am Neujahrstag 1502 erreichten, den Namen „Januarsfluss“ (Rio de Janeiro), und der Name der Stadt Montevideo geht auf Magellans angeblichen Ausruf beim ersten Anblick der Küste zurück: „Monte vido eu!“ („Ich sehe einen Berg!“).<n><n>Beliebt war es außerdem, Landstriche und Städte nach den eigenen Herrschern, dem Mutterland oder der Heimatstadt zu benennen. Das dokumentierte nach außen einen klaren Besitzanspruch und schuf selbst in der Fremde ein Gefühl von Heimat.<n><n>Wenn alles nichts half, konnte man immer noch auf Bezeichnungen aus den Indianersprachen zurückgreifen (was die Kolonisatoren freilich meist nicht davon abhielt, die Indianer anschließend zu vertreiben oder auszurotten).<n><n>Bis heute hält sich hartnäckig der Mythos, ein australischer Ureinwohner habe auf James Cooks Frage, wie dieses seltsame Beuteltier denn heiße, „kangooroo“ oder „ganguru“ geantwortet – was angeblich nur „Wovon redest du eigentlich?“ bedeutete. Auch wenn es sich um eine Legende handelt: Solche amüsanten Missverständnisse hat es sicher gegeben. <n><n>Man würde wohl staunen, wie viele Namen von Städten, Bergen und Flüssen schlicht „Guten Morgen!“, „Wie bitte?“ oder „Lass mich in Ruhe!“ bedeuten ..."
"0xd4cd0f45" = "Mit dem Entstehen des spanischen Weltreichs wurden Kolonialbehörden nötig, die mit weit genug reichenden Vollmachten sowohl die tägliche Verwaltungsarbeit als auch plötzlich hereinbrechende Krisen bewältigen konnten. Diesem Zweck diente die Verleihung des Titels eines Vizekönigs an die wichtigsten Gouverneure in den Kolonien.<n><n>In der Blütezeit des Weltreichs gab es zwei solche Würdenträger: einen in Neuspanien (Mexiko) und einen in Peru. Im 18. Jahrhundert kamen die Vizekönigreiche Neugranada und Río de la Plata hinzu.<n><n> Ein Vizekönig (auch Virrey genannt) nahm seine Pflichten gemeinsam mit einem Verwaltungsrat namens Audiencia wahr – oft im Streit mit ihr. Zu seinen Aufgaben gehörten die üblichen Pflichten eines hohen Regierungsbeamten: Steuern erheben und eintreiben, für Gesetzestreue sorgen, die Verteidigung der Kolonie organisieren und so weiter. Zudem schützte er die indigene Bevölkerung und setzte die niederen geistlichen und weltlichen Würdenträger ein.<n><n>Gemessen an der enormen wirtschaftlichen und politischen Bedeutung ihrer Überseegebiete behielt die Krone das Treiben ihrer Vizekönige stets genau im Auge. Gewerbliche Nebeneinkünfte waren ihnen untersagt. Zudem beschränkten sich die rivalisierenden Virreyes gegenseitig in ihrer Macht."
"0xd4cd0f46" = "Dass die europäischen Eroberer stets dem Ruf des Silbers und des Goldes folgten, ist allgemein bekannt. Fast noch wertvoller waren Gewürze. Man kann sich kaum vorstellen, wie fade die europäische Küche im Mittelalter gewesen sein muss – wenn man bedenkt, welche Gefahren die Menschen für ein wenig Pfeffer oder Muskatnuss auf sich nahmen.<n><n>Die Entdeckung Amerikas war in dieser Hinsicht zunächst ausgesprochen enttäuschend. Man nahm die exotischen Tiere, die Christoph Kolumbus mit nach Hause brachte, mit Interesse zur Kenntnis und freute sich über die Ausweitung des eigenen Besitzes und über die vielen Seelen, die dort durch die Ausbreitung des Christentums gerettet würden. Die versprochenen Berge von Gold aber ließen auf sich warten. Diese Fahrten warfen erst zehn bis zwanzig Jahre später Gewinn ab, als eine wahre Flut amerikanischen Silbers nach Europa strömte. <n><n>Auf einer dieser Fahrten brachte Kolumbus einen Schatz mit, der kostbarer war als alles Gold und Silber der Welt: Am 4. November 1492 reichten ihm die Einheimischen einen – wie er es beschrieb – Apfel, der nach Kastanien schmeckte. In diesem Augenblick aß zum ersten Mal ein Europäer eine Kartoffel! Das indianische Wort für diese Pflanze war „batate“, und es lebt bis heute im englischen „potato“ weiter.<n><n>Vieles, was uns heute selbstverständlich vorkommt, kam erst durch Kolumbus und seine Nachfolger nach Europa: Tabak, Tomaten, Mais und die Hängematte. Oder, wie die Indianer sagten: „hamaka“ (daher das englische Wort)."
"0xd4cd0fae" = "Vom ersten Bekanntwerden an beflügelte die Entdeckung der Neuen Welt die Fantasie der Europäer. Welche Wesen mochten in diesen unerforschten Gebieten leben? Die unglaublichsten Gerüchte machten die Runde: Eine Insel sei voll von Kannibalen, die nächste von kopflosen Wesen, die ihr Gesicht auf dem Bauch trügen.<n><n>Der südamerikanische Landstrich Patagonien heißt übersetzt ungefähr „Land der Großfüßigen“, der Amazonas verdankt seinen Namen einer Schar von Kriegerinnen, die die Entdecker angeblich an die Kämpferinnen der griechischen Sage erinnerten.<n><n>Einige dieser Gerüchte hatten einen wahren Hintergrund, andere beruhten auf Missverständnissen und Fehldeutungen oder auf Geschichten, die die Indianer selbst irgendwo aufgeschnappt hatten.<n><n>Vieles davon entsprang aber auch einfach einer blühenden Fantasie, und nicht selten glaubte man es, weil man es glauben wollte. Wie sonst wäre zu erklären, dass ganze Generationen von Konquistadoren nach dem legendären Jungbrunnen, dem Garten Eden und Eldorado, der Stadt aus Gold, suchten? In diesem Irrglauben bestärkten sie die Indianer, die ihnen stets versicherten, von diesem oder jenem Ort gehört zu haben – und die in Wahrheit nur Zeit gewinnen wollten, um die gierigen Weißen tief ins Landesinnere zu locken und von ihren Schiffen abzuschneiden."
"0xd4cd0faf" = "Unter den vielen schillernden Gestalten, welche die Reihe der Entdecker und Eroberer hervorgebracht hat, war der englische Schriftsteller und Abenteurer Sir Walter Raleigh (um 1554 – 1618) eine der auffälligsten. Bekannt wurde er 1580, als er einen Aufstand irischer Rebellen gegen die englische Besetzung niederschlug.<n><n>Er wurde zu einem Günstling Elisabeths I. und nutzte seinen Einfluss, um eine Expedition finanzieren zu lassen, die in Südamerika nach der sagenhaften Stadt Eldorado suchen sollte. Mehrere Expeditionen scheiterten vollständig und fanden nichts von Wert – dennoch hielt er seine Geldgeber in London bei sich, allein mit seiner Überredungskunst. Er ließ sie glauben, das Ziel liege immer nur hinter der nächsten Flussmündung, und aufgeben könne er jetzt unmöglich.<n><n>Doch irgendwann war sein Kredit aufgebraucht. Zu oft hatte man seinen schönen Versprechungen gelauscht, die sich am Ende als heiße Luft erwiesen. Raleigh fiel bei Elisabeth in Ungnade. Ihr Nachfolger Jakob I. hielt den heißblütigen Abenteurer für eine Gefahr seiner gemäßigteren Außenpolitik und ließ ihn gleich bei seiner Machtübernahme unter fadenscheinigem Vorwand verhaften und zum Tode verurteilen. Das Urteil wurde ausgesetzt – wohlgemerkt nicht aufgehoben! – und Raleigh kam in den Tower von London.<n><n>Jahre später, als die leere Staatskasse dem König die Notwendigkeit vor Augen führte, gestattete er Sir Walter Raleigh eine weitere Expedition nach Guyana. Welch absurde Lage: Ein selbst zum Tode Verurteilter erhielt Vollmacht über Leben und Tod anderer und wurde zum Goldsuchen ausgeschickt! Dieser Widerspruch löste sich freilich bald von selbst, denn Raleigh, vom Fieber gebeutelt, erlebte noch, wie auch seine letzte Expedition scheiterte.<n><n>Nach seiner Rückkehr nach England ließ der zornige König den 1603 gewährten Aufschub der Hinrichtung enden. Sir Walter Raleigh wurde kurz darauf hingerichtet."
"0xd4cd0fb0" = "Die ersten Begegnungen zwischen den Ureinwohnern der Neuen Welt und den weißen Seefahrern verliefen im Allgemeinen friedlich. An vielen Orten empfing man die Europäer wie Götter. Hier und da beruhte dieser Eindruck auf alten Mythen, doch zumeist waren die Indianer einfach beeindruckt von den großen blonden Fremden, die in schimmernder Rüstung auf ihren „Wasserhäusern“ (Schiffen) daherkamen.<n><n>Kolumbus, Cortez und all die anderen Entdecker beließen es nur zu gern bei dieser Illusion – doch die Indianer bekamen die brutale Wirklichkeit früh genug zu spüren: Angetrieben von ihrer unersättlichen Goldgier, der „spanischen Krankheit“, wie die Indianer sie nannten, misshandelten, versklavten und metzelten die Spanier ganze Völkerschaften nieder. Der Anblick der in Amerika unbekannten Pferde und der Donner der Kanonen lösten blanke Panik aus; wer das Gemetzel überlebte, rafften bald die Pocken, die Grippe oder eine andere eingeschleppte Krankheit dahin.<n><n>Berühmte Gelehrte wie Gonzolo Oviedo oder Juan de Sepulveda suchten die Verbrechen der Europäer mit haarsträubenden rassistischen Argumenten zu rechtfertigen: Die Indianer seien niedrig, unwissend und minderwertig.<n><n>Dieselben Männer, die Wissenschaftler und Hexen wegen ihres Glaubens auf dem Scheiterhaufen verbrennen ließen, verfassten meisterhaft schockierende Berichte über die „bestialischen Bräuche“ der Indianer: Götzendienst, Menschenopfer und Kannibalismus waren keineswegs erfunden – doch fortan dienten sie den Weißen als pauschale Rechtfertigung für Sanktionen jeder Art, die sie in brutalster Form über die Indianer verhängten."
"0xd4cd0fb1" = "Die Frühphase der Kolonisierung Amerikas betrieben bekanntlich Spanien und Portugal. Später gesellten sich die Niederlande und vor allem England und Frankreich dazu. Weit weniger bekannt ist, dass zahlreiche spanische Expeditionen ohne ihre mächtigen deutschen Geldgeber nie zustande gekommen wären.<n><n>Um 1500 hatte sich Oberschwaben, vor allem Augsburg, zu einem der bedeutendsten Handels- und Finanzzentren Europas entwickelt. Von hier aus machten die Kaufmannsfamilien Fugger und Welser Weltpolitik. Mit ihrer umfangreichen Finanzhilfe ermöglichten sie dem spanischen König Karl 1519 die Wahl zum deutschen Kaiser. König Heinrich VIII. von England und mancher Papst zählten Jakob Fugger den „Reichen“ gern zu ihren Bekannten.<n><n>Solche Unterstützung vergaben die schlauen Kaufleute natürlich nicht ohne Hintergedanken. Als Gegenleistung erwarteten sie Privilegien oder eine Beteiligung am königlichen Silberbergbau. Den Welsern gelang es sogar, zeitweise einen Teil der Nordküste Venezuelas zu erwerben; dort gründeten sie Städte wie „Neu-Augsburg“ und schickten von dort mehrere Expeditionen ins Landesinnere – meist vergeblich auf Schatzsuche."
"0xd4cd0fb2" = "Die Eroberung des halben Erdballs eröffnete der spanischen Krone einzigartige Möglichkeiten. Über Jahrhunderte hinweg schien Spaniens Stellung uneinnehmbar, bis die großen amerikanischen Kulturen der Inka, Maya und Azteken untergingen und zuletzt gewaltige Silberlager in Peru und Mexiko entdeckt wurden. Fast absurd mutet es an, dass gerade dieser unermessliche Reichtum den Niedergang der Weltmacht einleitete.<n><n>Ein großer Teil der Schätze, die die Schiffe nach Spanien brachten, floss direkt in die Taschen jener Händler nördlich der Pyrenäen, die die Fahrten finanziert hatten. Was übrig blieb, reichte immer noch, um die Preise auf der Iberischen Halbinsel in die Höhe zu treiben. Dort begann man über seine Verhältnisse zu leben: In einem Zeitalter, in dem eine prächtige Hofhaltung mehr galt als ein ausgeglichener Staatshaushalt, achtete man aufs Kleingeld wenig.<n><n>Waren kamen in wachsenden Mengen auf fremden Schiffen ins Land, weil man sich selbst zu fein war, sie herzustellen. Selbst Ausrüstung und Proviant für die Expeditionen nach Amerika lieferten die eigenen Händler selten. Mit Stolz vermerkte man: Ganz Europa steht Spanien zu Diensten.<n><n>Doch irgendwann versiegte der Silberstrom, und das Erwachen danach glich einem Kater nach durchzechter Nacht: Holländer und Briten waren dabei, Spanien von den Weltmeeren zu verdrängen. Die vielen Religionskriege gegen die protestantischen „Ketzer“ und gegen die Türken verschlangen Unsummen, und das Riesenreich, in dem die Sonne nie unterging, war zu einem unbeherrschbaren Koloss geworden.<n><n> Im Jahr 1557 wurde die Krise für alle offensichtlich, als der neue spanische Herrscher Philipp II. zum ersten Mal den Staatsbankrott erklären musste. Das große Imperium, das größere Schätze angehäuft hatte als je ein Reich vor ihm, war pleite."
"0xd4cd0fb3" = "Warum spricht man ausgerechnet in Brasilien Portugiesisch – und fast überall sonst in Südamerika Spanisch?<n><n>Nun, die Spanier und die Portugiesen, die den Seeweg nach Indien entlang der afrikanischen Küste entdeckt hatten, erkannten früh, dass ihre Zukunft jenseits der Meere lag. Eifersüchtig wachten sie darüber, dass die jeweils andere Macht auf der Jagd nach Waren, Untertanen und Land nicht im eigenen Revier wilderte.<n><n>Da es so etwas wie Völkerrecht damals noch nicht gab, wandte man sich im Streitfall an den Papst – den einzigen, dessen Autorität beide Länder zu unterwerfen bereit waren. Die katholische Kirche hatte ihrerseits ein Interesse daran, dass Spanier und Portugiesen ihre Kräfte nicht damit verschwendeten, einander das Leben schwer zu machen, sondern die Christianisierung der „Heiden“ in den unbekannten Ländern mit Eifer vorantrieben.<n><n>So kam man bei gemeinsamen Verhandlungen in Tordesillas (1494) und Saragossa (1529) überein, dass die neu entdeckten Gebiete westlich eines bestimmten Längengrads Spanien gehören sollten und alle übrigen Portugal. Dieser Längengrad durchschnitt das damals noch unentdeckte Südamerika, sodass dessen Ostseite – ein Teil des heutigen Brasilien – an Portugal fiel."
"0xd4cd0fb4" = "Wahrscheinlich war es der römische Schriftsteller Polybios, der um 140 v. Chr. das Wort „Pirat“ (peirato) zum ersten Mal erwähnte. Seither haben sich viele Wörter für diese gefürchteten Halunken zur See eingebürgert: Korsaren, Freibeuter, Bukanier, Filibuster … Die Männer um Klaus Störtebeker hießen „Vitalienbrüder“, und Bartholomew Roberts gab sich und seinen Mordbuben den harmlos klingenden Titel „Gentlemen of Fortune“. Im Endeffekt war es einem Kaufmann ziemlich gleich, wer da aus dem Nichts über sein Schiff herfiel. <n><n>Seeräuber haben die Menschheit zu allen Zeiten und in jeder Ecke der Welt heimgesucht. Die kilikischen Piraten verbreiteten in der Antike im ganzen Mittelmeer einen solchen Schrecken, dass das Römische Reich regelrechte Feldzüge gegen sie führen musste. Versteckte Inseln und zerklüftete Küsten nahe viel befahrener Handelsrouten waren der ideale Ort für ihr Handwerk: Dort, wo Riffe, Strömungen und schlechtes Wetter die schwerfälligen Handelsschiffe zu leichter Beute machten, fand man einen Zufluchtsort, in den man sich nach vollbrachter Tat schnell zurückzog. Die Küste Kleinasiens war im Altertum so gefürchtet wie die Karibik im Zeitalter der Entdeckungen, und die Piraten Südostasiens waren geradezu sagenumwoben.<n><n>Dem Wortursprung nach war ein „Bukanier“ eigentlich ein Seemann, der nicht als Matrose der Kriegsmarine, sondern als Privatmann zur See fuhr, um Beute zu machen – und damit als Pirat galt. <n><n>Durch die Ausstellung von Kaperbriefen bekamen manche karibischen Bukanier jedoch einen Schein von Legalität. Solche Dokumente stellten englische, französische oder niederländische Gouverneure aus; sie sollten die Piratenplage auf die gegnerischen Mächte lenken.<n><n> Wie leicht man an einen Kaperbrief kam, hing vom jeweiligen Gouverneur ab. Der eine hielt ein Bündnis mit Piraten für unehrenhaft; andere hatten weniger Skrupel – oder waren schlicht korrupt oder feige."
"0xd4cd0fb5" = "Die „sieben Weltmeere“ sind nämlich in Wirklichkeit nur drei, nämlich die drei Ozeane: der Nord- und der Südpazifik, der Nord- und der Südatlantik, das Nordpolarmeer und das Südpolarmeer sowie der Indische Ozean.<n><n> Der Pazifik verdankt seinen Namen der ersten Weltumsegelung des Fernando Magellan – er hatte schlichtes Glück: Die Überquerung dieses riesigen Ozeans dauerte viele hungrige Wochen, doch das Wetter blieb ihm hold.<n><n>Und noch etwas: Die Karibik hat ihren Namen von den „Kariben“ (oder „Karaiben“), den Völkern einer indianischen Sprachgruppe, deren Siedlungsraum sich von den Antillen entlang der Nordküste Südamerikas erstreckte."
"0xd4cd0fb6" = "Die Bermudainseln sind nach dem spanischen Entdecker Juan Bermúdez benannt, der sie 1503 entdeckte. Das bei allen Seeleuten berüchtigte „Bermudadreieck“, in dem angeblich besonders viele mysteriöse Schiffsunglücke geschehen, ist eine Meeresfläche zwischen den Bermudainseln, Puerto Rico und Fort Lauderdale (Florida).<n><n>Manche behaupten, die seltsame Serie unerklärlicher Ereignisse habe mit der Fahrt des Christoph Kolumbus begonnen: Der Genueser Seefahrer in spanischen Diensten hielt sich mit seinen drei Schiffen am 14. September 1492 gerade dort auf, als seine Kompassnadel verrückt zu spielen begann. Schuld war der Unterschied zwischen geografischem und magnetischem Nordpol. Am nächsten Tag erschien eine gewaltige Flamme am Himmel (vielleicht ein Meteor).<n><n>Der Beiname „Bermudadreieck“ kam jedoch erst nach dem Zweiten Weltkrieg auf, als eine Serie von Flugzeugunglücken die Aufmerksamkeit der Öffentlichkeit auf diese Gegend im Südwesten des Nordatlantiks lenkte.<n><n>Anhänger des Mysteriösen kommen auf mehr als 200 angeblich ungeklärte Unglücksfälle – wobei sie die Grenze recht großzügig ziehen. Die meisten davon, und viele spielten sich nicht einmal in dieser Gegend ab, haben eine völlig logische Erklärung."
"0xd4cd0fb7" = "Die legendäre spanische Schatzflotte, die regelmäßig von Amerika nach Spanien auslief, weckte auch jenseits der Iberischen Halbinsel allerlei Begehrlichkeiten. Vor allem das aufstrebende England sah darin einen Weg, Spanien die Rolle der Herrin der Meere und Königin der Welt streitig zu machen.<n><n>Für groß angelegte Feldzüge war das Inselreich noch zu schwach; viel geschickter war es, den Rivalen in der Ferne außerhalb Europas zu treffen, wo er keinen Angriff erwartete und ihn keine Warnung erreichte. Dort ließ sich sein Opfer in Ruhe ausplündern, und danach verschwand man einfach – monatelang erfuhr in Europa niemand davon.<n><n>Draufgängerische Kapitäne – der berühmteste war Francis Drake (1540–1596) – erhielten von Ihrer Majestät Elisabeth I. Kaperbriefe. Diese Briefe waren so etwas wie ein Blankoscheck: eine Lizenz zum Plündern, die Drake und seine Männer über den Rang gewöhnlicher Seeräuber erhob und zu privaten Raubrittern im Dienst einer höheren Sache machte. Und sie leisteten ganze Arbeit: Nirgendwo waren iberische Schiffe und Garnisonen sicher.<n><n>1578 durchquerte Francis Drake die Magellanstraße und hetzte wie ein Wirbelsturm die amerikanische Pazifikküste entlang auf der Jagd nach spanischer Beute. Nie zuvor hatte das jemand gewagt! Als Drake 1580 wieder in den Hafen von Plymouth einlief, hatte er als zweiter Kapitän nach Magellan die Welt umsegelt. <n><n>König Philipp von Spanien kochte derweil vor Wut und schwenkte den Vertrag von Tordesillas, mit dem der Papst 1494 höchstpersönlich die westliche Hemisphäre für Spanien beansprucht hatte. – Doch was sollte solcher Protest bei diesem seltsamen Inselvolk protestantischer „Ketzer“ bewirken, die die Autorität des Mannes in Rom rundweg ablehnten und sogar bis 1753 den gregorianischen Kalender nicht übernahmen – nur weil er 1582 auf Geheiß Papst Gregors entstanden war?<n><n>Einmal mehr schien sich die Sache nur kriegerisch lösen zu lassen. 1588 segelte Philipps Armada nach England, doch unter dem Kommando des inzwischen geadelten Sir Francis Drake und mit Hilfe mehrerer Stürme zur rechten Zeit gelang es den Engländern, die spanische Flotte zu vernichten. Hundert Jahre lang sollte danach niemand mehr Großbritanniens Rolle als führende Seemacht streitig machen."
"0xd4cd101f" = "Zweifellos gehören die Fahrten des Christoph Kolumbus (1451–1506) nach Amerika zu den größten Abenteuern, die die Menschheit je unternommen hat. Kaum ein Schriftsteller hätte es gewagt, eine solche Geschichte voller dramatischer Wendungen und seltsamer Zufälle zu erfinden.<n><n>Zwar hatte der Genueser Seefahrer das spanische Königspaar Isabella und Ferdinand von seiner Idee überzeugt, es gebe einen westlichen Seeweg nach Indien, doch auf die Zustimmung der Mannschaft konnte er sich keineswegs verlassen. Im Gegenteil: Der größte Teil der Besatzung wurde zwangsverpflichtet – die Stadt Palos hatte sich gegen die Krone vergangen und musste zur Strafe zwei Schiffe samt Mannschaft stellen.<n><n>Als sich Kolumbus' Plan herumsprach, machte sich Entsetzen breit: Man war überzeugt, unter dem Kommando eines Wahnsinnigen zu segeln, der sich und alle, die mit ihm fuhren, ins Verderben stürzen würde.<n><n>Kolumbus' größter Feind aber war der Aberglaube: Jede erdenkliche Spukgeschichte schien an Bord gefunden zu haben, und jedes unheimliche Ereignis verstärkte die Angst der Matrosen: Bei der Vorbeifahrt an Teneriffa brach ein Vulkan aus, dann sahen sie Feuersäulen am Himmel, und sogar die Kompassnadel schien der Mannschaft Streiche zu spielen. Lagen die Schiffe in einer Flaute fest, war das ein böses Omen. Machten sie dagegen gute Fahrt, hieß es, der Wind wehe immer von Ost nach West – umkehren könne man dann nie mehr.<n><n>Mehrmals schien eine Meuterei unausweichlich; einmal hörte der Kapitän des Nachts Schritte und Gemurmel vor seiner Kajüte, und erst als er laut zu beten anfing, verließ die Attentäter der Mut, und sie schlichen davon.<n><n>Die schlimmsten Krisen brachen immer dann aus, wenn sich eine vermeintliche Insel am Horizont wieder einmal als optische Täuschung entpuppte. Ein solcher Vorfall brachte am 10. Oktober das Fass zum Überlaufen. Mit größter Mühe handelte Kolumbus ein Ultimatum von drei Tagen aus; danach wollte die Mannschaft umkehren – möglichst ohne ihren Kapitän. Aber das Schicksal wollte es anders: Tatsächlich sichtete man innerhalb dieser drei Tage Land. Dass man nicht auf Asien, sondern auf einen ganz neuen, unbekannten Kontinent gestoßen war, konnte keiner der Anwesenden ahnen.<n><n>Japan und China lagen noch Tausende Seemeilen entfernt; ohne das unglaubliche Glück, dass eine fremde Landmasse im Weg lag, wäre Kolumbus' Expedition verloren gewesen. So aber hellte sich die Stimmung der Mannschaft sofort auf. Keiner konnte sich daran erinnern, je Meutereigedanken gehegt zu haben ..."
"0xd4cd1020" = "Christoph Kolumbus hatte die neue Landmasse zwar entdeckt – genauer: wiederentdeckt, denn schon die Wikinger hatten im Mittelalter amerikanischen Boden betreten –, doch verkündete er fälschlich, einen Seeweg nach Indien gefunden zu haben.<n><n>Bei der Vorbereitung seiner zweiten und dritten von vier Reisen arbeitete der Genueser mit dem aus Florenz stammenden Amerigo Vespucci zusammen. Er war es, der als erster die Ansicht vertrat, bei den Ländern im Westen handle es sich um einen unbekannten neuen Kontinent. Diese spektakuläre Erkenntnis heizte das Interesse der Öffentlichkeit neu an, und wo immer man über diese Gebiete sprach, fiel der Name Vespucci.<n><n>Der Stern des Christoph Kolumbus hingegen war im Sinken begriffen. Zwischenzeitlich hatte man ihn nach Klagen der karibischen Siedler sogar in Ketten nach Hause geschickt, und von seinem Tod als verbitterter kranker Mann im Jahr 1506 nahmen weniger Leute Notiz, als ihm zugestanden hätte. Es überrascht also kaum, dass der süddeutsche Kartograf Martin Waldseemüller ein Jahr später, als er einen Namen für diese unbekannten Länder suchte, den damals populäreren Amerigo Vespucci als Namensgeber heranzog. <n><n>Waldseemüllers Bezeichnung übernahmen seine Kollegen. Gerechter wäre es gewesen, den Kontinent „Columbia“ zu taufen."
"0xd4cd1021" = "Der erste Teil Amerikas, der unter den Spaniern große Bedeutung erlangte, war Hispaniola. Christoph Kolumbus gründete hier bereits 1493 die erste europäische Siedlung – die allerdings von Indianern ausgelöscht wurde, noch bevor er aus Europa zurückkehrte.<n><n>In den folgenden Jahren nahm sich die spanische Krone dieser Insel immer stärker an. Hier wurden das erste Kloster und die erste Kathedrale errichtet, und hier entstand als Erstes jenes Gesellschaftssystem, das man später auf die anderen Gebiete ausweiten sollte: eine Sklavenhaltergesellschaft, streng in Klassen geschieden und eng mit der katholischen Kirche verbunden.<n><n>Hispaniola schien große Möglichkeiten zu bieten und lockte viele Unternehmungslustige über das Meer. <n><n>Doch schon bald lenkte Spanien seine Aufmerksamkeit auf andere Regionen: Die großen Reiche auf dem Festland waren inzwischen entdeckt und erobert. Dort ließ es sich bequemer regieren, und Gold und Silber waren reicher vorhanden und leichter zu fördern.<n><n>Wie ein Spielzeug, das man in die Ecke wirft, verlor Hispaniola an Interesse. Überfälle niederländischer, englischer und französischer Piraten wechselten einander ab. 1697 übernahmen die Franzosen Saint Domingue, den westlichen Teil der Insel (heute Haiti), und errichteten eine einträgliche Plantagenwirtschaft. Kakao, Zucker, Indigo, Baumwolle und Kaffee machten Saint Domingue im 18. Jahrhundert zur profitabelsten Kolonie der Neuen Welt.<n><n>Der einzige erfolgreiche Sklavenaufstand der Geschichte, der im Zuge der Französischen Revolution ausbrach, führte 1804 zur Unabhängigkeit Haitis. Die Rebellen gingen mit ihren einstigen Unterdrückern kaum anders um, als man mit ihnen umgegangen war: „Für die Erklärung der Unabhängigkeit brauchen wir die Haut eines Weißen als Pergament, seinen Schädel als Tintenfass, sein Blut als Tinte und ein Bajonett als Feder“, verkündete damals der schwarze General Boisrond-Tonnerre."
"0xd4cd1022" = "Ein typisch karibisches Erzeugnis – wenngleich von zweifelhaftem Nutzen für die Menschheit – ist der Rum. Dieser aus Zuckerrohrmelasse gebrannte Schnaps, der ursprünglich den bildhaften Namen „Teufelstöter“ trug, wurde 1650 auf Barbados erstmals erwähnt. Als legendären Piratentrunk verbinden die meisten Menschen den Rum eher mit Jamaika, einem der gefürchtetsten Seeräubernester aller Zeiten. <n><n>Sklavenhändler tauschten die an der afrikanischen Küste eingekaufte Menschenware in der Karibik gegen große Mengen Melasse. Diese Melasse wurde in Neuengland zu Rum verarbeitet und dann mit denselben Schiffen nach Afrika gebracht. Dort verkaufte man den Schnaps und lud die leeren Schiffe mit neuer Sklavenfracht. Mit diesem verhängnisvollen „Dreieckshandel“ sorgten die Reeder dafür, dass ihre Schiffe auf jeder Fahrt voll beladen waren."
"0xd4cd1023" = "Nach Kuba ist Jamaika wohl die berühmteste der Karibikinseln. Ihr Name leitet sich vom Arawak-Namen Xymaca ab, was etwa „Land von Holz und Wasser“ bedeutet. Christoph Kolumbus, der die Insel neun Jahre zuvor entdeckt hatte, hatte 1503 reichlich Gelegenheit, die Schönheit der Landschaft und die Freundlichkeit der Bewohner kennenzulernen – sein Schiff erlitt vor der Nordküste Schiffbruch.<n><n>Es gefiel ihm hier so gut, dass er sich die ganze Insel vom König von Spanien übereignen ließ und sie zu seinem Eigentum erklärte. Trotzdem wurde das Inselparadies in den folgenden Jahrzehnten ziemlich vernachlässigt, bis die Briten es 1655 eroberten. Zu diesem Zeitpunkt lebten fast keine Arawak mehr, denn ihr Stamm war für die von den Europäern eingeschleppten Krankheiten besonders anfällig.<n><n>1661 wurde Edward D'Oyley zum Generalkapitän und Gouverneur von Jamaika ernannt. Unter ihm wurde die Hauptstadt [town:Port Royal] zu einem pulsierenden, schwer befestigten Piratennest. Sie galt als „reichster und verderbtester Ort der Erde“; viele Bewohner, im Alltag einfache Händler, schlossen sich immer wieder zu privaten Raubzügen in spanischen Gewässern zusammen. Anfangs zeigte die britische Regierung wenig Neigung, dem Treiben Einhalt zu gebieten – hielten die Bukanier doch die spanischen Rivalen in Schach.<n><n>Erst mit dem Amtsantritt Sir Henry Morgans als Gouverneur – bezeichnenderweise selbst ein ehemaliger Pirat – kehrten Zucht und Ordnung nach Jamaika zurück. Morgan ließ die Piraterie rücksichtslos ausrotten und zögerte nicht, seine früheren Gefährten an den Galgen zu schicken.<n><n>Doch kaum war die britische Herrschaft wiederhergestellt, tat sich neben dem Zuckerrohr eine neue einträgliche Einnahmequelle auf: Nach 1672 wurde [town:Port Royal] zum größten Sklavenmarkt der Welt, nachdem die englische Royal African Company ein Monopol erlangt hatte."
"0xd4cd1024" = "Nur gut zwei Wochen nach seiner Ankunft in der Neuen Welt erreichte Christoph Kolumbus Kuba, die größte Insel Westindiens. Hier lebten mehrere Stämme, die Ciboney, die Guanahatabey und die Tainos, die trotz ihrer Friedfertigkeit dasselbe traurige Schicksal ereilte wie andere Indianerstämme: 1511 wurden sie nach einem vierjährigen Krieg gegen die Spanier unterworfen und ausgerottet. Daraufhin wurden in großer Zahl schwarze Sklaven hierher gebracht. Die Insel mit ihrer Hauptstadt [town:Havana] war in sieben Verwaltungsbezirke (cabildos) eingeteilt, von denen jeder einen Vertreter in einen eigenen Rat entsandte; seine Aufgabe war es, die örtlichen Interessen des Bezirks nach außen zu vertreten.<n><n>Bemerkenswert an der Geschichte Kubas ist, dass die Insel, abgesehen von einem kurzen britischen Zwischenspiel 1762 bis 1763, verhältnismäßig lange in spanischer Hand blieb. Vielleicht lag es daran, dass Kuba zu Kolonialzeiten nicht zu den wichtigsten Gebieten des spanischen Imperiums gehörte – es gab dort kaum Bodenschätze – und eher als Zwischenstopp auf dem Weg zum Festland diente. Jedenfalls erkämpften die weitaus meisten Länder Süd- und Mittelamerikas im ersten Viertel des 19. Jahrhunderts ihre Unabhängigkeit, während die Spanier sich auf Kuba bis 1898 halten konnten – dann mussten sie die Insel an die Vereinigten Staaten abtreten."
"0xd4cd1025" = "Dass vieles, was uns heute selbstverständlich ist, erst durch den Handel mit Amerika nach Europa kam, ist bekannt. Umgekehrt funktionierte der kulturelle Austausch aber auch.<n><n> Zum Beispiel: Vor der Ankunft der Spanier und Portugiesen gab es in Amerika keine Pferde – kaum zu glauben, wenn man den typischen Indianer der nordamerikanischen Prärie vor Augen hat. Viele Indianer ergriffen in blinder Panik die Flucht, als sie zum ersten Mal Ross und Reiter sahen, denn sie sahen darin ein seltsames Doppelwesen, das zusammengewachsen war.<n><n>Auch der Kaffee, den man gewöhnlich mit Ländern wie Brasilien und Guatemala verbindet, ist in Amerika nicht heimisch; vor seiner Ankunft dort hatte er bereits drei Kontinente bereist: Von Afrika – wohl aus Äthiopien – ging er über die arabischen Länder nach Südwesteuropa. Die Pflanze wurde erst im 18. Jahrhundert in Amerika eingeführt, als die wachsende Beliebtheit des Getränks eine Ausweitung des Anbaus nötig machte.<n><n>Mit der Kartoffel hatten die Europäer in der Karibik ein Grundnahrungsmittel von unschätzbarem Wert entdeckt. Umgekehrt war der Weizen in Amerika unbekannt, bis die Spanier und Engländer kamen, die dieses Getreide 1520 nach Mexiko bzw. 1777 nach Virginia brachten. Obwohl man anfangs meinte, das amerikanische Klima tauge nicht für Weizen, trat dieser vor allem in Nordamerika seinen beispiellosen Erfolgszug an. Heute ist Weizen das landwirtschaftliche Erzeugnis mit der größten Anbaufläche weltweit."
"0xd4cd1026" = "Könnt Ihr Euch ein Leben ohne Schokolade vorstellen? Eigentlich solltet Ihr es auch können, denn Kakao war vor der Entdeckung Amerikas im übrigen Teil der Welt unbekannt. Das Wort Kakao stammt wohl aus der Maya-Sprache, in der es sich zuerst nachweisen lässt: Es gilt als sicher, dass Maya-Händler bereits 400 Jahre vor Christus Kakao tranken.<n><n>Die Azteken, seit dem 14. Jahrhundert die herrschende Macht auf dem mittelamerikanischen Festland, verliehen dem Kakao sogar religiöse Bedeutung. Der erste Europäer, der mit dieser Köstlichkeit in Berührung kam, war wiederum Christoph Kolumbus – allerdings auf einer späteren Reise, die ihn 1502 nach Nicaragua führte.<n><n>Als eigentlicher „Entdecker“ des Kakaos gilt jedoch Hernán Cortés, der Eroberer des Aztekenreichs, der das Rezept für ein Getränk namens xocoatl (daher das Wort „Schokolade“) nach Spanien brachte. Zunächst war der Geschmack dem europäischen Gaumen zu bitter; erst als man Zucker oder Vanille hinzufügte, wurde die heiße Schokolade in der iberischen Oberschicht zum beliebten Getränk.<n><n>Fast hundert Jahre lang behielten die Spanier das Rezept für sich, danach verbreitete sich die heiße Schokolade von Frankreich aus im übrigen Europa. Um das Jahr 1700 fügten die Briten Milch hinzu. Zum endgültigen Durchbruch in Europa verhalf dem Kakao die Entdeckung, wie köstlich Kaffee und Kakao zusammen schmecken."
"0xd4cd1027" = "Auch wenn es gerade im Piratenwesen oft schwerfällt, zwischen Legende und Wirklichkeit zu unterscheiden – verbürgt ist, dass es Piratinnen gab. Zwei der schillerndsten Gestalten gingen diesen Weg im frühen 18. Jahrhundert auf Jamaika.<n><n>Anne Bonny, von der es hieß, sie sei schon als Kind in den Bauch gestochen worden, war mit einem Seemann in das Piratenparadies New Providence (Nassau) durchgebrannt. Dort wurde sie ihren Mann los und begann ihre eigene Laufbahn auf einem gekaperten niederländischen Schiff. <n><n>Dort traf sie Mary Read, die als Mann verkleidet schon im Spanischen Erbfolgekrieg gekämpft hatte und angeblich jedem Gegner, bevor sie ihn tötete, die Brust entblößte, um ihm zu zeigen, dass er von einer Frau besiegt worden war.<n><n>Nach ihrer Gefangennahme im Jahr 1720 entgingen sie nur deshalb dem Galgen, weil sie schwanger waren. Es erging ihnen besser als den meisten ihrer männlichen Kumpane, für die Anne Bonny nur Spott übrig hatte.<n><n>Überliefert sind die Worte, die sie dem berüchtigten „Calico Jack“ auf seinem letzten Weg mitgab: „Es tut mir leid, dich hier zu sehen, Jack, aber hättest du nur wie ein Mann gekämpft, dann müsstest du nicht hier stehen und wie ein Hund aufgehängt werden“."
"0xd4cd1028" = "Der Waliser Bartholomew Roberts (1682? – 1722) war nicht nur einer der bedeutendsten Piraten, sondern auch einer der ungewöhnlichsten. Er, der auch „Black Bart“ hieß (nicht zu verwechseln mit „Blackbeard“, alias Edward Teach), wurde erst mit 37 Jahren Pirat – der Übergang ins Verbrechen war freilich fließend: Das Schiff, auf dem er arbeitete und das 1719 sein walisischer Landsmann Howell Davis überfiel, war nämlich ein Sklavenschiff.<n><n>Roberts schloss sich Davis an und übernahm nach dessen Ermordung wenige Wochen später selbst das Kapitänsamt. Bartholomew Roberts soll Alkohol gemieden und Tee bevorzugt haben.<n><n>Anders als Teach, der sich als leibhaftiger Teufel inszenierte, hatte Roberts eine Schwäche für feine Kleidung, lehnte das Glücksspiel ab und hielt seine Leute sogar zum Beten an. Das bedeutete allerdings keineswegs, dass Roberts im Herzen ein frommer Mann war. Von seinen unzähligen Plünderungen sind zahlreiche Grausamkeiten überliefert, besonders im Umgang mit Gefangenen. Mit über 400 Prisen und einem Einsatzgebiet von Brasilien bis Neufundland und Westafrika war er neben Henry Morgan einer der erfolgreichsten Piraten Mittelamerikas. <n><n>Der Kanonendonner eines britischen Kriegsschiffs vor der Küste Guineas machte 1722 seiner Laufbahn ein Ende und befreite die sieben Weltmeere von einer ihrer größten Plagen."
"0xd4cd1090" = "Der berühmteste Bukanier des 17. Jahrhunderts war der Waliser Henry Morgan (1635–1688), der die spanischen Kolonien in Westindien heimsuchte und damit die Autorität der großen iberischen Macht in der Region in ihren Grundfesten erschütterte.<n><n>Sein Leben steht für die mehr als fragwürdige Moral hinter der Politik Britanniens, Hollands und Frankreichs: Gegenüber der Seeräuberei drückten sie gern ein Auge zu, solange sie den anderen Großmächten schadete.<n><n>Henry Morgan, der 1668 das Kommando über ein Bukanierschiff erhielt, trieb sein Unwesen zunächst an der Nordküste Südamerikas. Im August 1670 eroberte er mit fast 2.000 Mann die schwer befestigte Stadt Panama und machte sich auf der Rückfahrt mit dem Großteil der Beute davon. Doch weil der Überfall nach dem Friedensschluss zwischen Spanien und England erfolgte, nahm man ihn gefangen und stellte ihn in London vor Gericht.<n><n>Morgan wurde nicht verurteilt, im Gegenteil: Es dauerte nicht lange, da drehte sich der diplomatische Wind erneut. Morgan wurde nicht nur begnadigt, sondern sogar geadelt. Als Sir Henry setzte man ihn als neuen Gouverneur von Jamaika ein; dort sorgte er für strenge Ordnung und verbrachte seine letzten Jahre als reicher und angesehener Pflanzer."
"0xd4cd1091" = "Die Bahamas, Mitte des 17. Jahrhunderts für kurze Zeit ein Rückzugsort für englische Glaubensabweichler, unterstanden ab 1670 offiziell dem Earl of Albemarle und einigen anderen Herren, die sich die Inselgruppe in der Hoffnung auf Profit von König Karl II. hatten übereignen lassen.<n><n>Entgegen ihren Zusagen zeigten diese Leute aber wenig Interesse daran, eine geordnete Zivilverwaltung aufzubauen. Im Gegenteil: Wie an manch anderem karibischen Ort nisteten sich ganze Heerscharen von Piraten auf den Bahamas ein, vor allem auf New Providence, wo die Stadt Nassau liegt. <n><n>Die seichten Buchten, in die kein schweres Kriegsschiff eindringen konnte, boten Hunderten von Schaluppen und Piratenbarken Platz. Die häufigen Raubfahrten in spanische Gewässer zogen Vergeltungsaktionen nach sich; John Wentworth, der erste Gouverneur, hatte die undankbare Aufgabe, auf den Inseln wieder für Ruhe und Ordnung zu sorgen.<n><n>Da sich die Lage nicht besserte, zog der englische König Georg I. die Bahamas wieder ein und machte sie zur Kronkolonie. Mit Woodes Rogers, dem früheren Bukanier und Weltumsegler, kam Mitte 1718 der erste königliche Gouverneur.<n><n>Mit Zuckerbrot und Peitsche machte er dem Spuk ein Ende: Er hielt eine Generalamnestie für alle Piraten bereit, die bereit waren, ihrem Treiben eidlich abzuschwören. Alle Unwilligen erwartete die Strafe in Gestalt einer bis an die Zähne bewaffneten Flotte.<n><n>So wieder in geordnete Verhältnisse gebracht, erhielt die Inselgruppe 1729 ein eigenes Parlament; danach verlief die Geschichte der Bahamas ein Jahrhundert lang ohne bemerkenswerte Zwischenfälle – abgesehen von gelegentlichen Störungen durch Invasionen."
"0xd4cd1092" = "Fast überall in ihren neu erworbenen Kolonien errichteten die Spanier ein starres Gesellschaftssystem ohne nennenswerte Aufstiegsmöglichkeiten. Ganz oben in der Rangordnung standen die in Europa geborenen Landsleute.<n><n> In den Kolonien geborene Spanier nannte man Kreolen. Sie galten in der Hierarchie nur als zweitrangig, hatten aber die meisten nachgeordneten Posten in Staat, Kirche und Heer inne.<n><n>Spanier europäischer Abstammung und Kreolen bildeten die Elite der Kolonien. Kinder von Mischehen zwischen Weißen (meist Männern) und Indianerinnen hießen Mestizen. Die Indianer, die ursprünglichen Besitzer des Landes, standen ganz unten in der Gesellschaft; in den Gebieten, in denen die Europäer sie vollständig ausgerottet hatten, nahmen die schwarzen Sklaven diesen Platz ein.<n><n>Die Bevölkerungsanteile dieser Klassen unterschieden sich in den Regionen des spanischen Imperiums stark. In Mexiko etwa bildeten die Mestizen den größten Teil der Bevölkerung. Auf vielen Inseln waren die schwarzen Sklaven in der Überzahl (und doch der Gnade ihrer Herren ausgeliefert). Wo Dschungel, Sümpfe und Gebirge einen sicheren Rückzug boten – etwa in Bolivien oder Florida –, konnten sich auch Indianerstämme halten."
