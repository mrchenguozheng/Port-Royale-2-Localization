"0x09ccb838" = "Einer unserer Transportkonvois wurde kürzlich von Piraten angegriffen und gekapert. Ich mache mir Sorgen um das Schicksal der Siedlerfamilien an Bord der gekaperten Schiffe. Wir durchsuchen derzeit die Gegend um den Ort des Angriffs. Könntet Ihr auch die Aufgabe übernehmen, ein anderes Gebiet zu durchsuchen?"
