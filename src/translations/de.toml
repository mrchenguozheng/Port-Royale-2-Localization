"0xde535352" = "Leider ist in [town:Tortuga] die Pest ausgebrochen. Sie wird in der Stadt etwa einen Monat wüten. Der Status der Stadt sinkt erheblich, und ihre Bürger sterben täglich. Viele Bürger fürchten die Krankheit und fliehen.<n><n>Für Euch als Händler ist außerdem von Interesse, dass die Nachfrage nach Kleidung und Holz in der Stadt doppelt so hoch ist, solange die Pest wütet.<n><n>Jetzt sollt Ihr die Stadt während der Pest versorgen und dafür sorgen, dass die Zahl der Bürger nicht sinkt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Zahl der Bürger (Einwohner ohne Soldaten) muss bis spätestens 20 Tage nach dem Ende der Pest wieder @I$Pop$ betragen. Dann haben alle Betriebe wieder eine volle Belegschaft."
