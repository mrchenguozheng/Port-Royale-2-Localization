"0xd83f794d" = "Euer Handelsnachweis in dieser Stadt ist noch nicht eindrucksvoll genug, um Euch eine Begegnung mit dem Schatzmeister zu erlauben. Liefert Waren, die die Stadt benötigt, um Euren Handelsnachweis zu verbessern."
"0xd83f9cae" = "Protokoll"
"0xd850a739" = "<n>Wollt Ihr mir etwas Gold für den Unterhalt zusätzlicher Soldaten geben? Für %1 kann ich %2 neue Soldaten anwerben."
"0xd8a6f58d" = "%1 greift %2 an"
"0xd8a91a98" = "Ein Militärkonvoi hat erfolglos versucht, die Hafenverteidigung der Stadt zu durchbrechen."
"0xd8c1e1ad" = "Gegner"
"0xd8c2c858" = "Übersicht"
"0xd8e39bc3" = "Helft dem Vizekönig auf [town:Grand Bahama], Hollands militärische Stärke zu erhöhen, indem Ihr ihm einen Konvoi übergebt. Nehmt danach einen Auftrag an, in seinem Namen Städte zu erobern."
"0xd91054d3" = "Dieses Schiff hat keinen Kapitän und kann daher nicht auslaufen. Heuert im Gasthaus einen Kapitän für dieses Schiff an oder fügt es einem bestehenden Konvoi hinzu."
"0xd918680a" = "Ihr habt Eure Baugenehmigung und alle Eure Gebäude in dieser Stadt verkauft."
"0xd918680b" = "Ihr habt Eure Baugenehmigung zurückgegeben."
"0xd91d3621" = "max. Kanonenzahl"
"0xd92d797c" = "Ein Händler einer anderen Nation hat eine beträchtliche Zahl von Arbeitern abgeworben. Diese Arbeiter haben die Stadt zusammen mit ihren Familien als Siedler verlassen.<n><n>Eure Aufgabe ist es nun, genügend Siedler zu finden, damit jedes Gewerbe der Stadt bis spätestens @D$EndDate$ über eine volle Belegschaft verfügt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel <f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Die Zahl der Bürger (Einwohner ohne Soldaten) muss bis spätestens @D$EndDate$ wieder @I$Pop$ betragen."
"0xd95aa48e" = "Leider habt Ihr zu lange mit der Antwort gewartet. Sprecht zuerst mit meiner Tochter, ob sie Euch noch haben will."
"0xd95fcda8" = "Schließen"
"0xd9720471" = "Grüße. Habt Ihr ein Schiff, das mich nach @T$TargetTown$ bringen kann? Ich muss dringend bis @D$EndDate$ dorthin. Ich zahle Euch @g$Reward$, wenn Ihr mich rechtzeitig hinbringt."
"0xd9720472" = " @A$USER$, man hat mich hier im Stich gelassen. Aber ich muss dringend nach @T$TargetTown$. Könnt Ihr mich dorthin bringen? Ich zahle Euch @g$Reward$!"
"0xd9720473" = " @A$USER$, ich suche eine Mitfahrgelegenheit nach @T$TargetTown$. Ich wäre Euch sehr dankbar, wenn Ihr mir eine Koje auf einem Eurer Schiffe anbieten würdet. Ich zahle Euch @g$Reward$."
"0xd979efd5" = "So sei es. Baut bitte bis @D$EndDate$ ein Spital in @T$Town$."
"0xd99426c9" = "Wollt Ihr es mit mir auf ein kleines Kartenspiel ankommen lassen?<n><n>Dann wählt Euren Einsatz! Ich halte mit, und der Gewinner nimmt alles."
"0xd99426ca" = "Ich muss Euch gar nicht erst fragen, ob Ihr mitspielen wollt, Ihr seid so blank wie ein frisch geschrubbtes Deck! Kommt wieder, wenn Eure Taschen voll sind."
"0xd99426cb" = "Oh nein, nicht Ihr schon wieder! Ich erinnere mich noch gut an unser letztes Spiel. Habt Ihr immer noch nicht genug? Also, mit Euch spiele ich vorerst nicht."
"0xd99426cc" = "Jeder hat 5 Karten bekommen. Ich sage %1 Punkte an.<n><n>Wenn Ihr mitspielen wollt, müsst Ihr einen Punkt höher ansagen."
"0xd99426cd" = "Dann bin ich dabei. %1 sind Trumpf.<n>Hier ist meine erste Karte."
"0xd99426ce" = "Ihr spielt aus. Sagt mir, welche Farbe Ihr als Trumpf wünscht (wählt eine Karte)."
"0xd99426cf" = "Also sind %1 Trumpf.<n>Spielt Eure erste Karte."
"0xd99426d0" = "Ihr habt 1 Punkt gewonnen.<n>Wählt Eure nächste Karte."
"0xd99426d1" = "Ich habe 1 Punkt gewonnen.<n>Und hier ist meine Karte."
"0xd9942739" = "Ich erreiche die Zahl der angesagten Punkte nicht. Ich habe verloren."
"0xd994273a" = "Ich habe die Zahl der angesagten Punkte erreicht. Ihr habt verloren."
"0xd994273b" = "Ihr erreicht die Zahl der angesagten Punkte nicht. Ihr habt das Spiel verloren."
"0xd994273c" = "Ihr habt die Zahl der angesagten Punkte erreicht. Ihr habt es geschafft!"
"0xd994273d" = "So, das war mein letzter Punkt. Ihr habt das Spiel verloren!"
"0xd994273e" = "Verdammt, den Punkt hätte ich gewinnen müssen. Ich habe das Spiel verloren."
"0xd994273f" = "Nun, das Spiel ist doch zu meinen Gunsten ausgegangen. Leider habt Ihr verloren."
"0xd9942740" = "Ihr habt das Glück des Teufels!<n>Das war mein letztes Spiel, ich bin pleite."
"0xd9942741" = "Ihr habt mir mein ganzes Gold abgenommen. Bestellt mir noch eine Buddel Rum und lasst mich dann bitte allein meinen Kummer ersaufen."
"0xd9942742" = "Jetzt habt Ihr es geschafft! Heute Abend kann ich mich zu Hause nicht mehr zeigen."
"0xd99427aa" = "Ihr habt das Spiel gewonnen!"
"0xd99427ab" = "Wollt Ihr noch eine Runde spielen?"
