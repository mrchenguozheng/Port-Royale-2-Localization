"0xe3d4a613" = "Sagt %1 Punkte an und führt das Spiel"
"0xe3de2671" = "Euer Konvoi hat aus dem Meer ein Kästchen geborgen, das eines der Dokumente des Gouverneurs enthält."
"0xe3de2672" = "Ihr habt nun alle Dokumente des Gouverneurs an Bord. Bringt die Dokumente nach @T$TOWN$ "
"0xe3e1d467" = "%1,<n><n>Ihr könnt keine Genehmigungen kaufen, weil Euer Ansehen bei meiner Nation nicht hoch genug ist und Ihr Euch außerdem nicht genug für diese Stadt verdient gemacht habt.<n><n>Steigert Euer Ansehen bei meiner Nation und handelt mit meiner Stadt, um Euren Handelsnachweis zu verbessern, dann sprechen wir uns wieder."
"0xe3e1d468" = "%1,<n><n>Euer Ansehen bei meiner Nation ist leider nicht hoch genug, ich kann Euch keine Genehmigungen verkaufen.<n><n>Kommt wieder, wenn Euer Ansehen gestiegen ist."
"0xe3e1d469" = "%1,<n><n>Ihr habt mit dieser Stadt noch nicht genug Handel getrieben. Liefert nachgefragte Waren, um Euren Handelsnachweis zu verbessern. Erst dann könnt Ihr eine Genehmigung kaufen."
"0xe3e33a30" = "Betrachtet %1 als Eure neue Stadt. Ihr könnt sie nun wie jede andere Stadt betreten, um dort Gebäude zu errichten und Gewerbe einzurichten.<n>Der gesamte Bezirk ist noch nicht für Euch freigegeben, aber wenn Ihr weitere Städte erobert, werde ich Euch das dafür nötige Land geben."
"0xe3fa97eb" = "Dann ist es abgemacht. Bringt @a$Amount$ Werkzeug nach @T$DestTown$. Auf dem Marktplatz erhaltet Ihr @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>. Die Waren müssen bis @D$Date$ geliefert sein."
"0xe3fa97ec" = "So sei es. Liefert @a$Amount$ nach @T$DestTown$. Die Werkzeuge müssen bis @D$Date$ eintreffen. "
"0xe3fa97ed" = "Gut! Ich beauftrage Euch, @a$Amount$ Werkzeug zu beschaffen. Liefert sie bis @D$Date$ nach @T$DestTown$. Auf dem Marktplatz erhaltet Ihr @g$GoldPerBarrel$ pro <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
