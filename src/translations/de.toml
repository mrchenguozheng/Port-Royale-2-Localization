"0x05478cea" = "Meine Tochter hat schon erwähnt, dass Ihr kommen würdet. Sie kann manchmal recht ungestüm sein, wisst Ihr. Doch ich kann den Wünschen meiner Tochter nicht im Weg stehen, und ich glaube in der Tat, dass Ihr der richtige Mann für sie seid. Und so muss ich Euch fragen: Wollt Ihr %1 zur Frau nehmen? "
"0x05633055" = "Eure Gebäude"
"0x05716a06" = "Eure nächste Schlacht wird etwas schwieriger, denn diesmal wird der Feind Widerstand leisten. Euer Auftrag ist es, für den Gouverneur einen Piraten aufzuspüren und zu töten.<n><n>Doch zuerst müsst Ihr Euren Konvoi für den Kampf bewaffnen. Kauft ein Schiff, fügt es Eurem Konvoi hinzu und nehmt neue Waffen und Matrosen an Bord.<n><n>Ihr könnt jederzeit während der Seeschlacht die F1-Taste drücken, um die Tasten- und Mausbelegung anzuzeigen. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Bewaffnet Euren Konvoi und erfüllt den neuen Auftrag, den der Gouverneur von [town:Cartagena] Euch erteilt."
"0x058ca789" = "Besucht den Gouverneur von @T$TOWN$ und nehmt seinen Auftrag an."
"0x05980d2c" = "Der Schwierigkeitsgrad bestimmt die Preise der Waren und den Schaden in Seeschlachten.<n><n>Außerdem braucht Ihr bei niedrigem Schwierigkeitsgrad keinen so erfolgreichen Handelsnachweis in einer Stadt, bevor Ihr eine Baugenehmigung kaufen könnt."
"0x05ae35b1" = "Sehr gut! Nun stattet dem spanischen Vizekönig in [town:Port Royale] einen Besuch ab und nehmt einen Auftrag zur Eroberung einer französischen Stadt an.<n><n>Normalerweise müsst Ihr zwei Städte erobern, bevor ein Vizekönig Euch ein Stück Land zuspricht. In diesem Szenario habt Ihr jedoch einen kleinen Bonus und müsst nur eine Stadt für Spanien erobern.<n><n>Ihr könnt selbst entscheiden, welche Stadt Ihr erobert. Am besten wählt Ihr eine Stadt mit möglichst wenigen Hafenkanonen. Eine französische Stadt, die derzeit ein ideales Ziel wäre, ist @T$SampleTown$.<n><n>Als Gegenleistung für die Eroberung einer Stadt überlässt der Vizekönig Euch ein Stück Land. Hinweis: Ihr könnt mit einem Vizekönig nicht sprechen, wenn Ihr nicht mindestens den Rang eines Bootsmanns habt.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Statten dem spanischen Vizekönig in [town:Port Royale] einen Besuch ab und nehmt einen Auftrag zur Eroberung einer Stadt an. Nachdem Ihr diesen Auftrag erfüllt habt, könnt Ihr sein Geschenk, ein Stück Land, annehmen."
