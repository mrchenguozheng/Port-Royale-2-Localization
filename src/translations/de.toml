"0xc647e049" = "<n><n>Ihr habt nun alle Szenarioziele erfüllt.<n><n>Ihr habt noch 20 Tage Zeit, weitere Vermögenswerte anzuhäufen, bevor dieses Szenario endet und Eure Punktzahl angezeigt wird.<n><n>Hinweis: Alle Ereignisse dieses Szenarios können auch im freien Spiel auftreten. Wenn Krieg geführt wird, entsenden die Nationen manchmal Bukaniere, um die Städte feindlicher Nationen zu sabotieren. "
"0xc65c8b8c" = "Im Namen meiner Nation danke ich Euch dafür, dass Ihr einen Konvoi des berüchtigten Piraten %1 zerstört habt.<n><n>Für alle Piratenschiffe, die Ihr besiegt habt, erhaltet Ihr eine Belohnung von insgesamt %2, und ich kann Euch versichern, dass meine Nation Euch sehr dankbar ist."
