"0xe4233be0" = "In diesem Szenario müsst Ihr den niederländischen Kolonien helfen, neue Städte zu gewinnen.<n:25>Ihr beginnt das Szenario mit einem gut bewaffneten Konvoi und etwas Startkapital. Indem Ihr englische Handelsschiffe kapert, vermehrt Ihr sofort Euren Reichtum und könnt Euren Konvoi mit mehr Waffen ausrüsten.<n:25>Später wird Euer Konvoi englische Militärkonvois angreifen, um Englands Verteidigung zu schwächen, und dann deren Städte erobern können."
