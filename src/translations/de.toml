"0xd07dbe34" = "Die wichtigsten Faktoren, die die Lebensqualität in einer Stadt beeinflussen, sind das Angebot und die Auswahl der verfügbaren Waren. Ihr müsst jedoch nicht alle Arten von Waren bereitstellen, um die Einwohner zufrieden zu halten.<n><n>Die Waren einer Stadt lassen sich in fünf Gruppen einteilen: Grundnahrung, Rohstoffe, Fertigwaren, Kolonialwaren und Importwaren. Diese sind im Handelsfenster in derselben Reihenfolge aufgeführt. Eine ausreichende Versorgung mit zwei bis drei Waren aus jeder Gruppe gewährleistet eine gute Lebensqualität in Eurer Stadt. <n><n>Ihr habt gerade eine Nachricht zum Thema Lebensqualität in Städten erhalten. Ihr könnt sie im Logbuch anzeigen.<n><n>Da Eure Stadt noch klein ist, ist eine gute Lebensqualität besonders leicht zu erreichen, denn die Bürger kleiner Städte stellen keine hohen Ansprüche. Das bedeutet, Ihr solltet keine Probleme haben, Euer Ziel zu erreichen. Eine Stadt mit weniger als 2.000 Einwohnern kann jedoch nicht über den Status „Aufschwung“ hinaussteigen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Stellt sicher, dass Eure Stadt von jeder Ware fünf Fässer vorrätig hat."
"0xd0b18a8e" = "Nov"
"0xd0b3158e" = "Gut. Die zwei verlassenen Schiffe, die Ihr beseitigen sollt, liegen etwa zwei Tagesreisen nördlich von Cartagena."
"0xd0b3158f" = "Ausgezeichnet! Der Konvoi des Piraten @P$PirateName$ liegt nahe der Stadt Belize, etwa fünf Tagesreisen nordwestlich von hier. Diese Stadt liegt im Nordwesten. Kehrt dann hierher zurück und bringt mir Nachricht von Eurem Erfolg."
"0xd0b31590" = "Etwas mehr als eine Tagesreise westlich von Cartagena liegt die kleine Insel Providence. Dort wurde der Piratenkonvoi unter dem Kommando von @P$PirateName$ zuletzt gesehen. Ihr solltet diesen Konvoi etwa eine Tagesreise nordöstlich davon finden.<n>Zerstört ihn und kehrt dann hierher zurück, um mir einen vollständigen Bericht zu geben."
