"0x2f40c20b" = "Ihr habt die Hungersnot in [town:Tortuga] nicht rechtzeitig beendet. Um eine Hungersnot zu beenden, müsst Ihr dafür sorgen, dass in der Stadt mindestens drei Nahrungsarten für den täglichen Verbrauch verfügbar sind. Sind alle vier Nahrungsarten vorhanden, endet die Hungersnot schneller."
