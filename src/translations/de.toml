"0x100afa32" = "%1,<n>Unsere Kirche braucht ständige Instandhaltung und muss geschmückt werden, wie es sich für ein Gotteshaus geziemt, doch Rom ist weit. Spendet für unsere Kirche, und wir schließen Euch in unsere Gebete ein. Auch Euer Ansehen bei meiner Nation und in meiner Stadt wird davon profitieren.<n><n>Wählt die Summe, die Ihr spenden möchtet."
