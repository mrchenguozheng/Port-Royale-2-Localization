"0xea8b5027" = "Ihr habt in meiner Nation viel Verwüstung angerichtet, aber Ihr seid auch der einzige Mann, der unser Schicksal retten kann. Ich biete Euch unsere Freundschaft für %1. Was sagt Ihr?"
"0xea92b930" = "Ich bin %1. Habt Ihr Interesse an einem Geschäft? Gebt Ihr mir einen Konvoi, lasse ich Euch an meiner Beute mit %2 teilhaben. Ihr könnt mir sogar sagen, in welchen Gewässern ich tätig sein soll. Ihr könnt mir jeden Konvoi mit bis zu 5 Schiffen übergeben."
