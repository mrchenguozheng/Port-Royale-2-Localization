"0xc7640158" = "Die Schiffe liegen also im Hafen. Ich danke Euch. Ich werde sofort einen neuen Militärkonvoi aufstellen.<n>Wie ich bereits sagte, sind meine Mittel derzeit sehr begrenzt, und es tut mir leid, dass ich Euch nicht mit Gold belohnen kann. Eure Belohnung ist jedoch nicht weniger wertvoll.<n>Hier, nehmt stattdessen diese Karte. Darauf habe ich die Lage eines gesunkenen Transportkonvois eingezeichnet. Dort findet Ihr eine große Menge Waren."
