"0xe7519201" = "Dann haben wir ein Geschäft. Bringt mir @a$Amount$ von @G$Goods$ auf den Markt. Ich werde dort bis @D$EndDate$ auf Euch warten. Ihr müsst die Waren in einer einzigen Lieferung bringen."
