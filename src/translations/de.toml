"0xda75935c" = "Einnahme einer Stadt"
"0xda93dbe1" = "Sehr gut! Das war keine einfache Leistung! England hat inzwischen so viele Militärkonvois verloren, dass seine Städte eingenommen werden können. In dankbarer Anerkennung Eurer Dienste stellt Euch der Gouverneur der Türkeninseln vier weitere Karacken zur Verfügung.<n><n>Städte einer Nation könnt Ihr nur auf Befehl eines Vizekönigs erobern. Ein Vizekönig weist Euch nur dann an, eine Stadt zu erobern, wenn seine eigene Nation militärisch stark und die feindliche Nation militärisch schwach ist.<n><n>Leider ist Holland nicht stark genug, um eine Stadt erobern zu können. Doch Ihr könnt etwas dagegen tun: Besucht den niederländischen Vizekönig auf Grand Bahama und übergebt ihm einen Eurer Konvois. Er wird dann einen neuen Militärkonvoi zusammenstellen, was Hollands militärische Stärke erhöht.<n><n>Wenn Ihr einem Vizekönig einen Konvoi übergeben wollt, muss dieser Konvoi genau fünf Schiffe und mindestens 150 Kanonen haben.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Helft dem Vizekönig, Hollands militärische Stärke zu erhöhen. Nehmt danach einen Auftrag an, in seinem Namen Städte zu erobern."
"0xdab4fea7" = "Wohngebäude"
"0xdac343f7" = "IDM_CONTEST_01_2004_LOG_03_HDR"
"0xdac43b47" = "Mangel an Siedlern"
"0xdacb8ff6" = "Lebensqualität in Eurer Stadt"
"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "Schaltfläche  "
"0xdaeb0484" = "Diesmal beginnt Ihr das Szenario in Cartagena, einer Gouverneursstadt mitten in der Karibik.<n>Euer Konvoi, der aus einer Schaluppe besteht, liegt im Hafen.<n>Zuerst müsst Ihr Euren Konvoi bewaffnen, denn in diesem Szenario wird es Seeschlachten geben.<n>Geht zum Handelsdock und öffnet das Menü „Waren-/Ladungsansicht“."
"0xdaeb0485" = "Wie Ihr seht, habt Ihr keine Kanonen und keine Munition an Bord Eures Konvois. Auch eine Mannschaft fehlt Euch.<n>Nehmt die größtmögliche Mannschaft und so viele Kanonen an Bord, wie Ihr könnt, dazu von jeder der drei Munitionsarten je 10x10 für Eure Kanonen.<n>Möglicherweise reicht der Platz in Eurem Konvoi nicht, denn Kanonen sind schwer. In diesem Fall könnt Ihr einige der geladenen Waren verkaufen."
"0xdaeb0486" = "Gut gemacht! Euer Konvoi ist nun bewaffnet und für ein Gefecht im kleinen Maßstab gerüstet.<n>Wie es der Zufall will, hat der Gouverneur von Cartagena jetzt den passenden Auftrag für Euch.<n>Klickt auf das Gebäude des Gouverneurs und nehmt seinen Auftrag an."
"0xdaeb0487" = "Gouverneure schlagen oft Aufträge vor, die Euer Ansehen bei ihrer Nation erhöhen, wenn Ihr sie erfolgreich erfüllt.<n>Ihr habt außerdem Anspruch darauf, Gouverneure um Kaperbriefe zu bitten oder für gefangene Bukanier Lösegeld zu verlangen.<n>Macht Euch nun mit Eurem Konvoi auf, die Schiffe zu finden, von denen der Gouverneur gesprochen hat."
"0xdaeb0488" = "Sehr gut, Ihr habt den Konvoi gefunden.<n>Als Nächstes müsst Ihr Euer Schiff gefechtsklar machen und Euch auf den Kampf vorbereiten. Öffnet dazu die Schiffsliste Eures Konvois und wählt Eure Schaluppe. Um sie zum Kriegsschiff zu erklären, drückt die Schaltfläche neben der Kanone. Danach könnt Ihr den Konvoi per Rechtsklick „angreifen“."
"0xdaeb0489" = "Das ist die Seeschlachtansicht von Port Royale.<n>Sie zeigt Euer Schiff, und durch Verschieben des Anzeigefensters könnt Ihr die verlassenen Schiffe betrachten.<n>Beendet jetzt den Pausenmodus und übt die Steuerung mit der rechten Maustaste. Das Ereignisfenster zeigt in Seeschlachten die Windrichtung und das Schiff an."
"0xdaeb048a" = "Alle am Gefecht beteiligten Schiffe werden unten am Bildschirm angezeigt. Dort könnt Ihr wählen, welche Munition Ihr verwenden wollt. Wählt die schweren Kugeln und versenkt eines der feindlichen Schiffe.<n>Feuern könnt Ihr mit der linken Maustaste, aber nur, wenn sich Euer Schiff in einer guten Schussposition befindet. Ziele werden dann rot dargestellt."
"0xdaeb048b" = "Gut! Entern das zweite Schiff.<n>Klickt dazu auf die Schaltfläche „Feindliches Schiff entern“ unten rechts in der Schiffsanzeige.<n>Fahrt dann auf das feindliche Schiff zu und rammt es. Zu beachten: Auch in Seeschlachten ist die F1-Taste aktiv."
"0xdaeb048c" = "Gewöhnlich hat der Feind eine Mannschaft, und an Bord entbrennt ein Gefecht zwischen Eurer und seiner Mannschaft.<n>Ist der Kampf vorbei, fallen alle geenterten Schiffe dem Sieger zu.<n>Fügt nun das feindliche Schiff Eurem Konvoi hinzu und schließt das Übergabefenster."
"0xdaeb048d" = "Sehr gut!<n>Schickt Euren Konvoi nun zurück nach Cartagena."
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "Ein Konvoi des Piraten %1 hat einen Händler aus %2 angegriffen."
"0xdb0108d5" = "Kauft zuerst ein neues Schiff. Geht zur Werft und kauft ein Schiff mit möglichst vielen Kanonen."
"0xdb0108d6" = "Wählt Euren Konvoi und klickt dann mit der rechten Maustaste auf den Hafen, um das neue Schiff dem Konvoi hinzuzufügen."
"0xdb0108d7" = "Alle Konvois bestehen aus Handelsschiffen und Geleitschiffen.<n>Wenn ein Schiff Eures Konvois an einem Gefecht teilnehmen soll, müsst Ihr es als Kriegsschiff bestimmen. <n>Öffnet die Schiffsliste Eures Konvois, um alle Eure Schiffe anzuzeigen."
"0xdb0108d8" = "Die Schiffsliste zeigt alle Schiffe Eures Konvois an. Der Kriegsschiff-Status wird oben rechts an einem Schiff angezeigt. Wird ein Kanonensymbol angezeigt, ist das Schiff als Kriegsschiff bestimmt und nimmt an Gefechten teil. Ein Klick auf diese Ecke ändert den Status unmittelbar.<n>Jetzt aber solltet Ihr auf Euer neues Schiff klicken und es auswählen. "
"0xdb0108d9" = "Die technischen Angaben des Schiffs, etwa seine maximale Ladekapazität, werden hier wie in der Werft angezeigt.<n>Ihr seht auch die täglichen Kosten für den Unterhalt des Schiffs.<n>Macht das Schiff nun zum Kriegsschiff, indem Ihr das Kanonensymbol ankreuzt."
"0xdb0108da" = "Gut gemacht!<n>Kanonen und Matrosen werden unter den Geleitschiffen eines Konvois stets gleichmäßig aufgeteilt.<n>Sorgt dafür, dass Eure Geleitschiffe voll bewaffnet sind und eine volle Mannschaft haben, und stattet dann dem Gouverneur einen Besuch ab, um den neuen Auftrag anzunehmen, den er Euch zuteilt."
"0xdb0108db" = "Erfüllt nun den Auftrag, den Euch der Gouverneur übertragen hat. "
"0xdb0108dc" = "Wählt aus Euren Geleitschiffen das Schiff, das Ihr in der Seeschlacht steuern wollt.<n><n>Ihr könnt jederzeit ein anderes Geleitschiff auswählen, indem Ihr es in der Liste anklickt.<n><n>Doch Vorsicht: Sobald die Schlacht beginnt, kann jedes Schiff nur einmal ausgewählt werden!"
"0xdb0108dd" = "Gut gemacht! Ihr habt den Piratenkonvoi zerstört.<n>Kehrt nun zum Gouverneur von Cartagena zurück, denn das gehört zu Eurem Auftrag.<n><n>Beachtet, dass Eure Aufträge automatisch in Eurem Logbuch festgehalten werden. Dort könnt Ihr bei Bedarf jederzeit die Einzelheiten Eures Auftrags nachlesen."
"0xdb04023a" = "Nicht genug Baumaterial"
"0xdb0e3d33" = "Ich habe den folgenden Auftrag für Euch.<n><n>"
"0xdb0e3d34" = "Ihr könntet mir einen Gefallen tun.<n><n>"
"0xdb0e3d35" = "Es gibt etwas, das Ihr für mich tun könntet.<n><n>"
"0xdb10f490" = "Spenden"
"0xdb126f49" = "Eure Punkte<n>"
"0xdb170d26" = "Bevor der Gouverneur Euch einen neuen Auftrag zuteilt, bringt Euren Konvoi in „Schuss“!<n>Ist Euer Konvoi beschädigt, geht in die Werft und lasst ihn reparieren."
"0xdb170d27" = "Ihr habt gerade etwas Geld erhalten, damit Ihr Euren Konvoi besser ausrüsten könnt.<n>Euer Konvoi sollte drei voll bewaffnete Schiffe und eine volle Mannschaft haben.<n>Vergesst die Munition nicht und denkt daran, Eure neuen Schiffe als Kriegsschiffe zu bestimmen. Tut das jetzt."
"0xdb170d28" = "Ausgezeichnet!<n>Besucht nun den Gouverneur und erfüllt den Auftrag, den er Euch zuteilt."
"0xdb2ae26e" = "Ablehnen"
"0xdb2d1177" = "Jetzt werdet Ihr ein Piratenversteck überfallen.<n>Zunächst: Bringt Euren Konvoi in „Schuss“!<n>Ihr könntet noch einige Gouverneursstädte besuchen und schauen, ob in einer der Werften ein größeres Schiff verfügbar ist.<n>Besucht unterwegs den Gouverneur und holt Euch einige Informationen über das Piratenversteck."
"0xdb2d1178" = "Hafenkämpfe ähneln Seeschlachten, nur dass Ihr es statt mit anderen Schiffen mit sehr stabilen Kanonentürmen zu tun habt.<n>Um einen Hafenkampf zu gewinnen, müsst Ihr alle Türme zerstören.<n>Manchmal liegen bewaffnete Schiffe im Hafen. In diesem Fall müsst Ihr erst die Schiffe bekämpfen, bevor Ihr den Hafen selbst angreifen könnt."
"0xdb2d1179" = "Um dieses Szenario zu beenden, kehrt mit Eurem Konvoi nach Cartagena zurück."
"0xdb4287ac" = "Der Gouverneur von Cartagena glaubt an Euer großes Potenzial und macht Euch ein Geschenk von @g$Gold$.<n><n>Hinweis:<n>Kauft Waren, die in einer Stadt reichlich vorhanden sind (die Menge darf nicht rot dargestellt sein). Verkauft diese Waren dann in einer Stadt, in der sie knapp sind, damit Ihr einen besseren Preis dafür erzielt.<n><n>Auf diese Weise werdet Ihr Euren Reichtum bald mehren."
"0xdb4eeb89" = "Konvoi wählen"
"0xdb5dde0a" = "Platzhalter"
"0xdb66b4df" = "IDM_CONTEST_01_2004_LOG_04_TEXT"
