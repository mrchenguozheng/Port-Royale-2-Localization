"0xf4b68a6b" = "Herzlichen Glückwunsch! Ihr habt das Szenario erfolgreich abgeschlossen und im Namen Hollands mehrere englische Städte erobert.<n><n>Auf dieselbe Weise könnt Ihr auch im freien Spiel Städte erobern. Denkt jedoch daran, dass die Nation, deren Städte Ihr erobern wollt, militärisch schwach sein muss. Außerdem muss die Nation, in deren Namen Ihr Städte erobern wollt, militärisch stark sein, und die beiden Nationen müssen sich im Krieg befinden.<n><n>Hinweis: Für gewöhnlich werdet Ihr mit einem Stück Land belohnt, auf dem Ihr eigene Städte bauen könnt, wenn Ihr für einen Vizekönig Städte erobert. In diesem Szenario ist diese Funktion jedoch deaktiviert."
