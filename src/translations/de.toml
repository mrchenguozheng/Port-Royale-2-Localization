"0xd44a911d" = "Herzlichen Glückwunsch! Ihr habt nun etwas Erfahrung mit der Warenproduktion. Vielleicht habt Ihr auch bemerkt, dass es nicht immer leicht ist, die erzeugten Waren mit Gewinn zu verkaufen und zugleich den Betrieb durch Handel mit anderen Waren über Wasser zu halten.<n><n>Wenn Ihr in späteren Szenarien oder im freien Spiel Betriebe errichtet, müsst Ihr stets darauf achten, dass Ihr die erzeugten Waren mit Gewinn verkaufen könnt. Die Produktion ist teuer, und die Rohstoffe zu beschaffen ist nicht immer einfach.<n><n>Deshalb solltet Ihr zuerst durch Handel finanzielle Rücklagen bilden und erst dann ganz allmählich mit der Produktion beginnen. "
