"0x132a8a31" = "%1 hat den Bukanier %2 auf unsere Städte losgelassen, um Sabotage zu treiben. Erst kürzlich hat er %3 angegriffen, und nun ist er auf dem Weg in seine Heimatstadt. Ihr würdet mir und meiner Nation einen großen Gefallen erweisen, wenn Ihr diesen Bukanier aufhalten würdet."
"0x132a8a32" = "Ich habe gerade erfahren, dass der Bukanier %1 kürzlich %2 verlassen hat, um eine unserer Städte anzugreifen. Ich hoffe, wir können ihn stoppen, bevor er zuschlägt. "
"0x132a8a33" = "Auf Befehl von %2 ist der Bukanier %1 auf dem Weg, unsere Städte anzugreifen. Ich habe erfahren, dass er sich derzeit in %3 aufhält, um seinen nächsten Schlag vorzubereiten."
"0x132e00ca" = "Ich bin entzückt! Von diesem Tag an gehören die Feindseligkeiten zwischen uns der Vergangenheit an."
"0x13385f0f" = "Gute Arbeit! Mit Eurem Kaperbrief steht Ihr nun offiziell im Dienst Hollands und steht nun im Krieg mit England. Das bedeutet, dass Ihr englische Handelsschiffe angreifen könnt, ohne dass Euer Ansehen in Holland, Frankreich oder Spanien darunter leidet.<n><n>Natürlich wird Euer Ansehen bei England Schaden nehmen, und von nun an solltet Ihr in englischen Gewässern stets nach den Militärkonvois Ausschau halten, die Euch verfolgen werden!<n><n>Die englischen Städte liegen alle südöstlich der [town:Turk Islands]. Segelt mit Eurem Konvoi in diese Richtung und sucht geeignete Handelskonvois zum Aufbringen. Verkauft die Beute und die kleineren Schiffe, um Euer Vermögen zu erhöhen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Bringt drei englische Handelskonvois auf: Entert ihre Schiffe und reiht sie in Euren Konvoi ein. "
"0x133e8429" = "und der Hafen ist ausreichend gesichert."
"0x13475956" = "Beta-Test-Management, Mastering"
"0x13493847" = "Der Konvoi wird instand gesetzt und kann nicht entsendet werden.<n>Wollt Ihr die Instandsetzung des Konvois abbrechen?<n>Ihr erhaltet kein Gold zurück!"
"0x13601073" = "Vielen Dank, dass Ihr mir die Dokumente gebracht habt. Als Belohnung überlasse ich Euch eine Barke. Ihr findet sie im Hafen."
"0x13601074" = "Vielen Dank für Eure Unterstützung und die Rückgabe meiner Tagebücher. Als Belohnung überlasse ich Euch eine Barke. Ihr findet sie im Hafen."
