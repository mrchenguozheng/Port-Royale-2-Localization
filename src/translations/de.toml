"0xfeab2fe1" = "Good. The transport convoy will leave the port of @T$TOWN$ on @D$DepartDate$. Sail ahead of it in the direction of Europe and secure its route. Keep a sharp lookout for military convoys from @n$HostileNation$. Your mission will be accomplished if the convoy succeeds in leaving the waters of the New World without being attacked."
"0xfeab2fe2" = "I am very grateful to you. A transport convoy will leave my harbor on @D$DepartDate$. I want you to protect it from military convoys from @n$HostileNation$ and make sure that reaches Europe safely."
"0xfeab2fe3" = "You are a man of action. A transport convoy will shortly arrive here and will be leaving port for Europe on @D$DepartDate$. Sail ahead of it and secure its route to protect the convoy from attack."
"0xfeadceb1" = "In the demo, you can only enter the towns that were already shown at the start of the game.<n><n>However, you can trade with any town by dispatching a convoy to the town and right-clicking on the town while the convoy is selected."
