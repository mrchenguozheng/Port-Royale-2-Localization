"0x1aa78782" = "Angriff auf einen spanischen Militärkonvoi"
"0x1ab784e9" = "Einen Piratenkonvoi vernichten"
"0x1ab9b63f" = "Blackbeard dicht auf den Fersen! "
"0x1ac13fc5" = "Pest"
"0x1ac38a65" = "%1. %2. %3"
"0x1acbcf40" = "Welchen Konvoi könnt Ihr mir anbieten?"
"0x1af8f2c6" = "Aktiv seit %1"
"0x1b0a0b6d" = "Ihr habt den Rang „Matrose“ erreicht. Von heute an müsst Ihr etwas tun, um Euer hohes Ansehen bei einer Nation zu halten.<n><n> Ihr könnt Euer Ansehen bei den Nationen verbessern, indem Ihr handelt, der Kirche spendet, Feste ausrichtet, Piraten vernichtet sowie Aufträge und Kaperbriefe erfüllt.<n><n>Verbessert sich Euer Ansehen bei einer Nation nicht, schwindet es jeden Tag um ein ganz klein wenig. Wie tief Euer Ansehen auf diese Weise sinken kann, hängt davon ab, wie viele Gebäude Ihr in den Städten dieser Nation errichtet habt.<n><n>Euer Ansehen beeinflusst sowohl die Handelspreise als auch die Vergabe von Aufträgen in den Städten. Ist Euer Ansehen niedrig, solltet Ihr Euch außerdem vor Militärkonvois in Acht nehmen!"
"0x1b33d8e6" = "Ungenutzte Waren können transportiert werden!"
"0x1b407276" = "Produktion"
"0x1b416d15" = "Vermögen"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "Die Zahl der Bürger (die Bevölkerung ohne die Zahl der Soldaten) in [town:Tortuga] muss bis spätestens @D$EndDate$ wieder auf @I$Pop$ gebracht werden, damit alle Betriebe die volle Besetzung an Arbeitern haben."
"0x1b900424" = "Reisender"
"0x1ba04e6b" = "Ein Militärkonvoi von %1 wurde von Schiffen von %2 zerstört."
"0x1ba7362a" = "Kriegsschiffe von %1 haben einen Handelskonvoi von %2 angegriffen."
"0x1bcad43f" = "Heute hat der %1 Bukanier %2 die Stadt unter falschem Namen betreten und große Unruhe unter den Arbeitern gestiftet. Sie verweigern nun zwei Wochen lang die Arbeit."
"0x1bccfb60" = "Gesamtpreis"
"0x1be1209e" = "Eure eigene Stadt"
"0x1be7a5dc" = "Ihr müsst ein Paket finden. @l$Pos$ Bringt es bis @D$EndDate$ zu @N$OwnerName$ nach @T$TOWN$. "
"0x1bf425d5" = "Leider seid Ihr ein Feind der Nation, zu der die Stadt gehört, und habt Euch daher heimlich in den Hafen geschlichen."
"0x1c0b520a" = "Keine Spielstände vorhanden"
"0x1c1160cb" = "Technische Leitung"
"0x1c16ab5a" = "Zum Lagerhaus:"
"0x1c394b47" = "Seeschlachterfahrung"
"0x1c4cc4f1" = "%1: Schiff repariert"
"0x1c703500" = "Der Gouverneur möchte dringend mit Euch sprechen."
"0x1c74c605" = "Ihr habt %1 erbeutet."
"0x1c7e1413" = "Ich danke Euch!<n> Natürlich braucht Ihr zuerst eine Genehmigung in der Stadt, doch die werdet Ihr gewiss erhalten.<n>Ich bezahle Euch selbstverständlich alle Ausgaben, sobald die Schule gebaut ist. Der Geburtstag meiner Frau ist am @D$EndDate$, sorgt dafür, dass bis dahin der Grundstein für die Schule gelegt ist."
"0x1c7e1414" = "Das ist gut. Beginnt bis @D$EndDate$ mit dem Bau der Schule. Ich bezahle dann Eure Ausgaben.<n>Vergesst nicht, dass Ihr eine Genehmigung in @T$Town$ braucht, wenn Ihr eine Schule bauen wollt.<n>Verratet meiner Schwester kein Wort von diesem Auftrag."
"0x1c7e1415" = "Ich danke Euch! @T$Town$ wird von unserer Abmachung nichts erfahren. Beginnt bis @D$EndDate$ mit dem Bau. Ich bezahle dann Eure Ausgaben.<n>Vergesst nicht, dass Ihr eine Genehmigung in @T$Town$ braucht, wenn Ihr eine Schule bauen wollt."
"0x1c7e9deb" = "%1: Kreditbetrag %2 zurückgezahlt."
"0x1c83647f" = "Waffen und Munition:"
"0x1ca41002" = "Szenario abgeschlossen"
"0x1ca50773" = "Gute Arbeit! Ihr habt nun einen beeindruckenden Konvoi.<n><n>Eure nächste Aufgabe wird nicht leicht, denn sie besteht darin, einen englischen Militärkonvoi anzugreifen und zu besiegen. Der Gouverneur der [town:Turk Islands] hat Euch als Verstärkung ein weiteres Schiff geschenkt. Sucht es im Hafen der [town:Turk Islands] und reiht es in Euren Konvoi ein.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vernichtet einen englischen Militärkonvoi."
"0x1ce621bb" = "Wohngebiet eines örtlichen Händlers"
"0x1ce62aab" = "Laufende Aufträge"
"0x1ce81e5e" = "Spieltyp"
"0x1cf07333" = "Gut gemacht, Ihr habt Euer erstes Ziel in @I$Days$ Tagen erreicht. Als Nächstes sollt Ihr die Zahl der Bürger in der Stadt erhöhen. Errichtet dazu fünf Betriebe – von jeder erlaubten Art einen.<n><n>Bedenkt: [town:Tortuga] laufen nur wenige Händler an, und die Stadt muss gut versorgt sein, damit ihr Status hoch genug ist, um neue Siedler aufzunehmen. Und vergesst den Wohnraum für die Bürger nicht.<n><n>Für dieses Ziel habt Ihr 60 Tage Zeit. Je früher Ihr es schafft, desto besser.<n><n>Hinweis: Soldaten gehören zur Bevölkerung einer Stadt, zählen aber nicht als Bürger! Die Zahl der Bürger einer Stadt wächst nur über neue Arbeitsplätze.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Richtet fünf verschiedene Betriebe in [town:Tortuga] ein und erhöht die Zahl der Einwohner bis @D$EndDate$ auf 1.500. Vergesst den Wohnraum nicht! Für jeden Betrieb ist ein Wohngebiet nötig."
"0x1d01f111" = "Geräusche"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Das hier gesunkene Schiff muss unter dem Kommando eines sehr erfahrenen Kapitäns gestanden haben. Die Truhe enthält kein Gold, doch Ihr findet ein sorgfältig geführtes Tagebuch des Kapitäns @L$RandLName$. Dadurch steigt die Erfahrung des Kapitäns des Konvois @C$Convoy$ um zwei Punkte."
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Die Schatztruhe ist leer, doch sie diente einem Seil als Boje. Nicht weit unter der Oberfläche entdeckt Ihr ein Versteck mit Kanonen. Eure Mannschaft holt so viele dieser Kanonen wie möglich an Bord."
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>In den umliegenden Gewässern treiben zahlreiche Fässer Rum. Eure Männer bergen so viele davon, wie Euer Konvoi tragen kann."
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Euer Konvoi ist auf eine große hölzerne Truhe gestoßen. Sie wird sofort an Bord gebracht und geöffnet. Endlich ein echter Schatz, denkt der Kapitän, als er einen Blick auf die @g$Gold$ erhascht."
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Eine alte, fast völlig verrottete hölzerne Truhe treibt im Wasser. Was sie einst enthielt, ist dahin – übrig bleibt nur ein widerwärtiger Geruch. Trotzdem hebt sich die Moral Eurer Mannschaft, denn die Suche nach dem Schatz hat endlich ein Ende gefunden."
"0x1d19d29c" = "Baugenehmigung in %1"
"0x1d6d7bd9" = "und der Hafen ist stark verteidigt."
"0x1db06b05" = "Das Paket finden"
"0x1db7f908" = "Leider hattet Ihr nicht genug Zeit, um @g$GoldGoal$ an Bargeld zu erwirtschaften.<n><n>Verkauft die Waren in Eurem Lagerhaus in [town:Tortuga] in den Städten, in denen sie knapp sind, und haltet Ausschau nach Waren, die Ihr zu einem guten Preis kaufen könnt.<n><n>Ihr könnt auch beim Schatzmeister in [town:Tortuga] ein Darlehen aufnehmen."
