"0xe4233be0" = "In this scenario, you must help the Dutch colonies to acquire new towns.<n:25>You begin the scenario with a well-armed convoy and some starting capital. By capturing English trading ships, you'll immediately increase your wealth and will be able equip your convoy with more arms.<n:25>Later, your convoy will attack English military convoys to weaken England's defenses and will then be able to capture their towns."
