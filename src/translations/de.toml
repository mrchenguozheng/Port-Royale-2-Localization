"0x305f2287" = "Meiner Nation ist kürzlich die letzte Gouverneursstadt an ihre Feinde verloren gegangen.<n><n>Wenn diese feindlichen Nationen geschwächt werden, indem ihre Militärkonvois versenkt werden, können wir anschließend einige Städte zurückgewinnen.<n><n>Um Probleme mit den anderen Nationen zu vermeiden, stelle ich Euch einen Kaperbrief gegen unsere Feinde aus."
