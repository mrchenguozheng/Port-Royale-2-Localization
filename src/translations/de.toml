"0xf7c59ef9" = "In meiner Stadt fehlt es an @G$Goods$ zur Weiterverarbeitung. Die Bestände der verschiedenen Betriebe sind bereits sehr niedrig. Könntet Ihr mir helfen?"
"0xf7c59efa" = "Kürzlich stand die Vereinigung katholischer Produzenten vor meiner Tür. Sie beklagen, dass es in der Stadt nicht genug @G$Goods$ gibt. Ich musste mir ihr Gejammer drei Stunden lang anhören. Das kann ich kein zweites Mal durchstehen. Könntet Ihr mir nicht helfen, mich aus dieser heiklen Lage zu befreien?"
"0xf7c59efb" = "Verdammt! Schon wieder ist in meiner Stadt @G$Goods$ knapp geworden. Manchmal ist es mir völlig unbegreiflich, wie die ansässigen Händler ihr Geschäft betreiben. Bis ich diese Sache geregelt habe, wäre ich Euch dankbar, wenn Ihr helfen könntet."
