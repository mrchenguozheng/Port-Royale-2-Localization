"0xf0e1f57c" = "Unser derzeitiger Feind, @n$HostileNation$, hat unsere Transportkonvois angegriffen und die eingeführten Waren geplündert, die für die englischen Städte in der Neuen Welt bestimmt waren."
"0xf0e1f57d" = "Unser derzeitiger Feind, @n$HostileNation$, hat unsere Transportkonvois angegriffen und die eingeführten Waren geplündert, die für die französischen Städte in der Neuen Welt bestimmt waren."
