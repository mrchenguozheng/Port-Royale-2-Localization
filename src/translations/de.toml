"0xe7270933" = "<gs:TEXTFLUSS_KEINEHOEHE>%1  %2"
"0xe7519201" = "So we have a deal. Bring me @a$Amount$ of @G$Goods$ to the market. I will wait for you there until @D$EndDate$. You must deliver the goods in a single delivery."
"0xe77b3422" = "Ich habe keine weiteren Neuigkeiten für Euch. Sucht mich wieder auf, wenn Ihr den Auftrag erfüllt habt, den ich Euch gab."
