"0x00b383d2" = "Das Schiff kann nicht auslaufen"
"0x00bff5f3" = "Ihr besitzt nun eine Baugenehmigung für [town:Cartagena] und könnt dort Betriebe errichten. Als Nächstes sollt Ihr in [town:Cartagena] zwei Webereien bauen. Eine Weberei ist ein Betrieb, der Fertigwaren herstellt und Baumwolle als Rohstoff benötigt.<n><n>In Eurem Lagerhaus muss stets ein Vorrat an Rohstoffen lagern, sonst kann der Betrieb keine Waren produzieren. Die Kosten bleiben jedoch hoch, denn Ihr müsst für jeden Betrieb Unterhaltskosten zahlen und Eure Arbeiter entlohnen.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Szenarioziel<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Baut in der Stadt [town:Cartagena] zwei Webereien und produziert @a$AmountGoal$ Kleidung."
"0x00c0bb39" = "[term:fr_normal]"
"0x00c59673" = "Angriff auf einen Militärkonvoi"
"0x00cde503" = "<ts:20>Ihr seid zum ersten Mal zum Feind einer Nation geworden. Hier einige nützliche Hinweise.<n>-<t>Zum Feind werdet Ihr nur, wenn Ihr die Konvois und Städte einer Nation angreift<n>-<t>Ihr könnt die Gouverneure der Nationen bestechen, um Euer Ansehen zu verbessern. Euer Ansehen verbessert sich jedoch auch jeden Tag automatisch um ein kleines Maß, da Eure Untaten langsam vergessen werden<n>-<t>In den Häfen feindlicher Nationen dürft Ihr nicht anlegen<n>-<t>Segelt Ihr trotzdem in eine feindliche Stadt, müsst Ihr Euren Konvoi heimlich vor Anker legen: Dann könnt Ihr die Stadt betreten, dort aber nicht handeln."
