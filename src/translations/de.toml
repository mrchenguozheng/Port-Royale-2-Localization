"0x2796edbb" = "%1 erobert"
"0x27beb2d9" = "Plündert @a$Amount$ Gewürze, Wein und Werkzeug aus Transportkonvois von @n$HostileNation$. Ihr dürft keine Schiffe kapern oder versenken. Liefert diese Waren dann bis @D$EndDate$ an den Markt in @T$TOWN$. Danach könnt Ihr Eure Belohnung beim Gouverneur abholen."
"0x27e88b91" = "Baut eine Kirche und steigert die Bevölkerung Eurer Stadt auf 2.200. Ihr habt bis @D$EndDate$ Zeit."
