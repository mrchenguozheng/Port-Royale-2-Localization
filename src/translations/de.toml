"0xcdf0b227" = "Eine Anzahl Händler hat sich zusammengeschlossen und verlangt besseren Schutz in unseren Gewässern. Um ihren Forderungen Nachdruck zu verleihen, haben sie beschlossen, eine unserer Städte bald nicht mehr zu beliefern. Könnt Ihr eingreifen, um mir und den Bürgern zu helfen?"
"0xcdf0b228" = "Eine unserer Städte sieht von einer Woche zur nächsten kaum noch einen Händler, weil sich das Gerücht verbreitet hat, eine Seuche habe die Stadt erfasst. Könnt Ihr mir helfen, das Gerücht zu zerstreuen, indem Ihr die Stadt mit Waren versorgt?"
"0xcdf0b229" = "Die Gefahr einer Seuche steht seit einigen Wochen über einer unserer Städte. Zu allem Übel meiden die Händler die Stadt nun zusätzlich. Könnt Ihr helfen, die Stadt zu versorgen, bis sich die Lage bessert?"
"0xcdf0b22a" = "Vor einigen Tagen ist in einer unserer Städte ein Bürger an einer Seuche gestorben. Wir haben versucht, das zu vertuschen, aber ich fürchte, es ist dennoch durchgesickert. Nun haben viele Händler beschlossen, die Stadt nicht mehr anzulaufen. Ihr habt eine feine Handelsflotte. Könntet Ihr die Stadt für die nächste Zeit versorgen?"
"0xcdfdf758" = "Eure Kriegsschiffe haben die Angreifer in die Flucht geschlagen."
