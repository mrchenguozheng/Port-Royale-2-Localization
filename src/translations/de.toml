"0xfda277f4" = "%1 is full and no longer has any space on which to build a warehouse. If you want to gain a foothold in this town in spite of this, you can try to persuade one of the local traders to demolish one of his businesses.<n><n>Businesses are demolished if the price in the town for the goods produced remains at a low level over a long period, that is, if there is a surplus of the good. To achieve this, you must first start to hoard the product. Then sell sufficient quantities of the product at the town market to drive the price down to a low level.<n><n>The goods produced are delivered to the town market once a day. If the price is currently minimal, the business reduces its complement of workers. You can check this by clicking on the business. A business is demolished once 30 workers have been made redundant."
"0xfda5ded4" = "Die Stadt blüht auf, weil Gold gefunden wurde"
"0xfdaf6463" = "I must thank you once again, you have done so much for my nation. As a reward, I shall give you the remaining land for your town %1. You now own the entire district."
"0xfdb7f907" = "A campfire exposes the teacher's hideout, not far from the shore. Your captain rows ashore and is met by an old man. When the old man sees all the wine, he rubs his hands with glee."
"0xfdb7f908" = "Not far from the shore, your convoy discovers a small hermit's campsite. Your captain rows ashore and meets an old man wearing a captain's uniform that is even older than he is. He spots the barrels of rum and is delighted."
"0xfdb7f909" = "After a while, your convoy discovers a hideout on land. The captain rows ashore and looks around. He finally finds the old master and explains what brings him there. The hermit accepts the food."
