"0xfc64ab0e" = "Ora puoi accrescere la tua reputazione in %1 attaccando navi e città francesi. Ciò non diminuirà la tua reputazione nelle altre nazioni."
"0xfc692ef1" = "<n><n>Se però almeno una nave del tuo convoglio sopravvive alla battaglia, sopravvive anche il capitano."
"0xfc71eb4b" = "Che disgrazia mi è capitata. Da quando è scoppiata la guerra con @n$FoeNation$, non sono riuscito ad accumulare abbastanza merci coloniali per i convogli di trasporto. Puoi aiutarmi fornendomi un grosso carico di @G$Goods$?"
"0xfc71eb4c" = "Da quando siamo in guerra con @n$FoeNation$, ai loro commercianti è vietato consegnare @G$Goods$ alle città della mia nazione. Ora mi trovo di fronte a una carenza significativa di merci. Hai molte navi e conosci bene i mari. Non potresti procurarmi un grosso carico di @G$Goods$?"
"0xfc72151e" = "Magazzino - Trasferimento convoglio"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Con i cannoni"
"0xfc910833" = "Edifici residenziali disponibili"
"0xfc9a5f7d" = "È stato un piacere fare affari con te. Buona giornata!"
"0xfc9a5f7e" = "Le merci sono state inviate al tuo magazzino. Buona giornata!"
"0xfc9a5f7f" = "Le merci sono state caricate sul tuo convoglio. Addio %1."
"0xfc9cf623" = "Completato"
"0xfca882e8" = "Come sai, la flotta del tesoro spagnola segue sempre una rotta diversa quando raccoglie i tesori dalle sue colonie e li trasporta in Europa. La flotta evita di essere presa in imboscata restando sempre solo poco tempo in ogni città. Questa volta però la Spagna ha commesso un grave errore, permettendoci di scoprire la rotta che la flotta del tesoro spagnola segue in questo momento. I tuoi ordini non potrebbero essere più semplici. Distruggi ogni singola nave!"
"0xfca882e9" = "Siamo in guerra con la Spagna e dobbiamo assicurarci che la flotta del tesoro spagnola non raggiunga mai l'Europa. Per fortuna abbiamo saputo in quale città farà scalo la flotta. Saboteremo la flotta in questa città, così dovrà prolungare la sua sosta in porto. Questo dovrebbe darti il tempo sufficiente per intercettare la flotta e impedirle di raggiungere l'Europa. Accetti questa missione?"
"0xfca882ea" = "Non si hanno occasioni così tutti i giorni! Oggi uno dei miei informatori mi ha detto la rotta che la flotta del tesoro spagnola segue attualmente. Ma non è tutto. Abbiamo saputo che la flotta resterà all'ancora più a lungo del solito nella prossima città in cui farà scalo. Poiché siamo in guerra con la Spagna, dovremmo dare al viceré qualcosa per cui sorridere e assicurarci che la flotta del tesoro non raggiunga mai la sua destinazione in Europa. Intercetterai la flotta per la mia nazione?"
"0xfcc82d44" = "Guerriero con sciabola"
"0xfcd6fdec" = "Vedo che non hai ancora completato la mia ultima missione. Completa questo lavoro, perché ho altro da farti fare."
"0xfcded04c" = "IDM_CONTEST_01_2004_LOG_01_TEXT"
"0xfce1cfd1" = "Temo di non avere alcun bisogno di te al momento.<n> Posso affidarti la conquista di una città solo se una nazione ostile è indebolita e ho abbastanza convogli militari disponibili per proteggere le mie città."
"0xfce38f12" = "Comandante della città"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "Atmosfera"
"0xfd1be8e3" = "Il bucaniere %1 %2 si è intrufolato nella città e ha distrutto grandi scorte di merci appartenenti a diversi commercianti della città. Il consiglio cittadino rifiuta di assumersi la responsabilità."
"0xfd1f0281" = "Materie prime e produzione"
"0xfd26f2aa" = "Il convoglio @C$Convoy$ ha raccolto un naufrago. Portalo a @T$DestTown$."
"0xfd26f2ab" = "Il convoglio @C$Convoy$ ha raccolto un naufrago. Portalo in una città appartenente a @n$DestNation$. "
"0xfd26feb4" = "@N$Name$ si è buttato in mare furioso perché eri troppo lento."
"0xfd2f55fd" = "Data di gioco"
"0xfd40a541" = "<n><f:fonts/Tiepolo_black14x14aaFHk.res>Perdite<t><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen> %1<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen> %2<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_MANN_800x600.screen> %3<n>(circa %4)"
"0xfd4ed860" = "Le tue truppe sfondano il portone della città e prendono il comandante in ostaggio. Quando i soldati della città lo vedono, capitolano.<n><n>Cosa vuoi fare ora?"
