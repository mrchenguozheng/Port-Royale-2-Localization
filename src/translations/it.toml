"0x0f52782d" = "Congratulazioni! Ora puoi produrre stoffa dal cotone a Cartagena.<n><n>Come puoi immaginare, i costi di produzione della stoffa dipendono in larga misura dal prezzo che paghi per il cotone. Per questo puoi produrre prodotti finiti solo se sei sicuro di poter acquistare le materie prime a un prezzo ragionevole. In alternativa puoi produrre tu stesso le materie prime.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Costruisci un impianto di produzione del cotone a Santa Marta e commercia per aumentare il tuo contante a @g$GoldGoal$."
"0x0f5d7735" = "Molto a est di Charleston si trovano le isole Bermuda. Stanne ben alla larga! Due mesi fa mio cognato è salpato per esplorarle, ma non è mai tornato. Nessuno sa cosa succede là, ma una cosa è certa: un destino terribile attende tutti coloro che osano avvicinarsi troppo alle isole!"
"0x0f5d7736" = "Hai sentito l'ultima storia sulle isole Bermuda? Un mercante voleva usare la rotta che passa davanti alle isole per salpare verso l'Europa, ma non ci è mai arrivato. Suo fratello si è messo a cercarlo, ma non ha trovato altro che qualche pezzo di relitto a sud delle isole."
"0x0f5d7737" = "Proprio l'altro giorno un marinaio di Port Royale mi ha raccontato che di recente hanno navigato molto vicino alle isole Bermuda. Ci sono quasi arrivati troppo vicino, perché con i suoi occhi ha visto un enorme mostro muoversi nell'acqua. Sputava fuoco e dalle sue lunghe orecchie usciva fumo. Guai a chi osa avvicinarsi a questo mostro marino!"
