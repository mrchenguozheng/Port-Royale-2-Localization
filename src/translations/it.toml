"0xf83c8bf1" = "Da oggi %1 e %2 sono in guerra. Entrambi gli schieramenti aumentano il numero dei loro convogli militari."
"0xf83ed362" = " @N$ContactName$ può aiutarti a trovare un insegnante che addestri uno dei tuoi capitani (nell'arte del commercio)."
"0xf83ed363" = " @N$ContactName$ può aiutarti a trovare un insegnante che addestri uno dei tuoi capitani (nell'arte della guerra)."
"0xf83ed364" = " @N$ContactName$ può aiutarti a trovare un insegnante che addestri uno dei tuoi capitani (nell'arte della navigazione)."
"0xf8414493" = "Materiale da costruzione"
"0xf8523349" = "Incontra l'emissario del governatore al mercato di @T$TOWN$ entro @D$Date$ e consegna @a$Amount$ di vino, utensili e spezie. Devi consegnare tutte le merci insieme."
"0xf85a75c0" = "Convogli militari"
"0xf862eb18" = "1 giorno"
"0xf864dd8c" = "Capacità"
"0xf86a57f3" = "Hai sconfitto in duello il bucaniere inglese %1 e l'hai preso in ostaggio."
"0xf86a57f4" = "Hai sconfitto in duello il bucaniere francese %1 e l'hai preso in ostaggio."
"0xf86a57f5" = "Hai sconfitto in duello il bucaniere olandese %1 e l'hai preso in ostaggio."
"0xf86a57f6" = "Hai sconfitto in duello il bucaniere spagnolo %1 e l'hai preso in ostaggio."
"0xf86adc04" = "Usa un convoglio per trovare il covo dell'insegnante. @l$TeacherPos$ A bordo del convoglio devono esserci @a$Amount$ di vino."
"0xf86adc05" = "Usa un convoglio per trovare il covo dell'insegnante. @l$TeacherPos$ A bordo del convoglio devono esserci @a$Amount$ di rum."
"0xf86adc06" = "Usa un convoglio per trovare il covo dell'insegnante. @l$TeacherPos$ A bordo del convoglio devono esserci @a$Amount$ di cibo."
