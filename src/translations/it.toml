"0x1733ed83" = "In questo scenario il viceré spagnolo ti concede un appezzamento di terra su cui puoi costruire una tua città. L'obiettivo di questo scenario è fare in modo che l'economia della tua città inizi a fiorire.<n:25>Tuttavia, prima di ricevere un appezzamento di terra, devi migliorare la tua reputazione con la Spagna e renderti popolare presso il viceré spagnolo conquistando città a suo nome."
