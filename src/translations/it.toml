"0xd4cd0f3d" = "Henry Avery è un esempio lampante del pirata di successo. Catturò le navi più ricche del suo tempo, riuscì a sfuggire alle autorità e visse abbastanza a lungo da godersi la sua ricchezza.<n><n>Gli anni giovanili di Avery sono avvolti nel mistero. Sappiamo però che nel giugno 1694 era ufficiale su un corsaro chiamato Charles, a cui gli spagnoli avevano dato il permesso di catturare navi appartenenti alla colonia francese di Martinica nelle Indie occidentali. Un giorno guidò un ammutinamento e prese il controllo della nave, dopo di che gran parte dell'equipaggio si schierò con lui. La nave, un veloce corsaro con 46 cannoni, ideale per il ruolo di nave pirata, fu ribattezzata Fancy. Nel 1695 riuscì a compiere la sua impresa più grande: il saccheggio della flotta del tesoro indiana. In alleanza con altri pirati attaccò una flotta del tesoro indiana pesantemente armata e riuscì a catturare due navi. Le navi appartenevano al Gran Mogol in persona ed erano cariche di tesori inimmaginabili. <n><n>Dopo aver corrotto il governatore delle Bahamas perché offrisse protezione ai pirati, Avery pagò l'equipaggio, che poi si disperse ai quattro angoli della terra. Alcuni furono catturati in Inghilterra, ma Avery salpò per l'Irlanda, dove scomparve senza lasciare traccia. Possiamo solo supporre che abbia continuato a godersi la sua ricchezza in clandestinità."
"0xd4cd0f3e" = "Uno dei pirati più famosi di tutti i tempi fu Edward Teach (morto nel 1718), alias Barbanera, il cui segno distintivo, come suggerisce il nome, era la sua terribile barba nera intrecciata. Con un equipaggio di 300 uomini solcava gli oceani sulla sua nave, Queen Anne's Revenge, una nave mercantile olandese convertita, e non temeva di affrontare le navi da guerra della Royal Navy.<n><n>In un periodo di 18 mesi Teach, nato a Bristol, seminò il caos soprattutto nella parte settentrionale delle Indie occidentali e lungo la costa del Nord America. Riusciva sempre a trovare rifugio alle Bahamas e nella poverissima Carolina del Nord.<n><n>Un altro motivo per cui Barbanera era così famoso è che corrispondeva allo stereotipo del bucaniere terrificante, sanguigno e collerico: si dice che abbia mutilato il suo cannoniere Israel Hands sparandogli due volte, senza altro motivo che ricordare al resto dell'equipaggio chi comandava.<n><n>La sua ultima ora arrivò solo nel 1718, quando il cacciatore di pirati Robert Maynard scovò il suo sloop. Pur essendo ubriaco fradicio, Teach combatté come un demonio e fu sconfitto solo dopo una lotta accanita. Morì in battaglia e la maggior parte dei superstiti del suo equipaggio fu impiccata."
"0xd4cd0f3f" = "Coloro che nei primi anni dell'Età delle scoperte bramavano accrescere la propria ricchezza scoprirono che le piantagioni di canna da zucchero sviluppate dall'inizio del XVI secolo, principalmente nei Caraibi, offrivano eccellenti opportunità di investimento.<n><n>Questi investimenti rendevano in media il dieci per cento e nei casi migliori (come alle Barbados intorno al 1650) fino al 50 per cento! Naturalmente queste piantagioni richiedevano enormi quantità di lavoratori, e così centinaia di migliaia di schiavi furono portati là dall'Africa. Ciò avveniva perché ormai l'uomo bianco aveva quasi completamente sterminato la popolazione indiana nativa in molti luoghi. <n><n>Gli europei stessi non potevano sopportare il clima e, a parte questo, erano troppo dignitosi per dedicarsi a quel genere di lavori pesanti. Perfino i proprietari delle piantagioni preferivano vivere a Londra o a Madrid e lasciare che un paio dei loro sgherri organizzassero il lavoro nelle colonie. Nel XVIII secolo la percentuale nera della popolazione di alcune isole aveva raggiunto il 90 per cento!"
"0xd4cd0f40" = "Il commercio dell'\"oro nero\" era già iniziato nei primi anni del XVI secolo. La fonte preferita di \"merci\" dei trafficanti di schiavi era la costa dell'Africa occidentale che si estende tra il fiume Senegal e quello che oggi è noto come Camerun. Quest'area non solo era idealmente situata dal punto di vista dei trasporti, ma possedeva anche un'infrastruttura economica e sociopolitica stabile. Ciò significava che i marinai non dovevano andare a caccia di schiavi da soli, ma potevano acquistare le loro vittime dai capi locali o da altri trafficanti di schiavi.<n><n>I giovani tra i 15 e i 35 anni erano particolarmente richiesti, perché erano destinati soprattutto ai lavori pesanti nelle piantagioni. Circa uno schiavo su cinque non sopravviveva nemmeno alla traversata, che poteva durare fino a sei settimane. Alcuni morivano per il trattamento barbaro inflitto dai padroni, altri perirono in incidenti in mare. Tenendo conto di questo alto tasso di mortalità, i trafficanti cercavano di rendere ogni viaggio il più redditizio possibile stipando quanti più schiavi potevano sulle navi. Per settimane intere queste povere creature giacevano fianco a fianco come sardine in una scatola, incatenate l'una all'altra, nel buio e con appena l'aria per respirare.<n><n>In queste condizioni è quasi incredibile che qualcuno sia sopravvissuto a quei viaggi!  "
"0xd4cd0f41" = "Sebbene non ci fossero schiavi bianchi nel Nord e nel Centro America, c'erano molti europei che si ritrovarono a lavorare in condizioni che differivano molto poco da quelle degli schiavi.<n><n>Molti giovani (soprattutto delle classi inferiori senza istruzione) volevano emigrare ma non avevano il denaro per pagare la traversata. Prendevano quindi in prestito il denaro per pagare il passaggio, con l'intesa di saldare poi il debito lavorando per un certo periodo in una piantagione di zucchero (o in un luogo simile). <n><n>Tuttavia quella che sembrava una sistemazione del tutto logica aveva anche un tranello: molti proprietari di piantagioni cercavano di far lavorare questi operai a contratto il più duramente possibile durante il loro periodo di impiego. A ciò si aggiungeva il clima caraibico, che la maggior parte degli europei trovava così difficile da sopportare.<n><n>Questo sistema di \"servitù a contratto\" era anche spesso usato per i condannati espulsi dai loro paesi d'origine. Gli inglesi usarono questo metodo più tardi, soprattutto contro gli indiani, che costrinsero a lavorare nelle colonie africane."
"0xd4cd0f42" = "Man mano che le colonie americane prosperavano, prosperava anche il commercio attraverso l'Oceano Atlantico. La Gran Bretagna, la nazione marittima più potente dai tempi della regina Elisabetta, aveva un vivo interesse a controllare il movimento delle merci, permettendo così all'economia interna di partecipare ai profitti commerciali.<n><n>Sotto il Lord Protettore Oliver Cromwell, il \"Primo Atto di navigazione\" del 1651 decretò che solo navi inglesi potessero essere usate per trasportare merci dalle colonie all'Europa. Questo provvedimento era rivolto principalmente all'emergente potenza dell'Olanda e favoriva la flotta commerciale nazionale.<n><n>Nel 1663 le disposizioni di questo atto furono rese ancora più severe: le navi coloniali che volevano trasportare merci in Europa dovevano fare scalo nei porti inglesi e pagarvi un dazio. Tuttavia questo tentativo di controllare il commercio tra le colonie ben presto fallì. Poiché non ci si poteva certo aspettare che l'esercito britannico sorvegliasse l'intera costa, il risultato fu un commercio di contrabbando fiorente. <n><n>Fu proprio questo conflitto continuo con la madrepatria sulle condizioni che regolavano l'esportazione e l'importazione delle merci che, soprattutto nelle colonie del Nord America, portò alla formazione di un'identità separata tra i coloni e divenne in seguito una motivazione importante del movimento indipendentista."
"0xd4cd0f43" = "L'inizio dell'età coloniale portò con sé numerosi problemi di salute, fino ad allora in gran parte sconosciuti nei molto più brevi viaggi nel Mediterraneo o lungo la costa. Una traversata verso le colonie nei Caraibi e in Nord America durava da uno a due mesi, o anche di più se la nave incontrava tempeste o periodi di bonaccia. Le difficoltà da superare erano dunque tutt'altro che sorprendenti: il puzzo di vestiti sporchi e la scarsa igiene personale, cibo contaminato e marcio, mancanza di acqua pulita, topi a bordo e la tensione psicologica causata dalla monotonia e dalla claustrofobia. Il terribile spettro dello scorbuto incombeva su ogni marinaio: questa malattia, causata dalla carenza di vitamine, si manifestava con la perdita di capelli e denti e costò la vita a molti marinai. Fu il circumnavigatore del globo James Cook (1728-1779) il primo a riuscire a curare questa malattia. Non solo insisteva perché la nave fosse tenuta pulita, ma forniva anche al suo equipaggio crauti e frutta fresca. Chi scendeva a terra doveva anche fare i conti con malattie tropicali come la febbre nera, una delle manifestazioni più pericolose della malaria: questa infezione, i cui sintomi includono accelerazione del polso, febbre, brividi e urine scure, era quasi sempre fatale."
"0xd4cd0f44" = "Dietro i molti nomi che i marinai e i cartografi dovettero inventare per le nuove distese di terra, i fiumi e gli insediamenti ci sono aneddoti interessanti. Perfino il primo nome dato dagli esploratori europei dell'Età delle scoperte in America racconta la sua storia. Cristoforo Colombo chiamò l'isola sulla quale sbarcò il 12 ottobre 1492 Salvador (\"Salvatore\"). Ciò per ringraziare il Signore di aver protetto il convoglio da malattie e tempeste durante il viaggio d'andata e soprattutto di aver impedito un ammutinamento che minacciava di scoppiare letteralmente all'ultimo minuto prima dell'avvistamento della terra.<n><n>Nei tempi successivi i conquistadores spagnoli scelsero per lo più nomi di connotazione religiosa, per esempio \"Nombre de Dios\" (\"Il nome di Dio\") o \"Trinidad\" (\"Trinità\"). In altri casi le persone trassero ispirazione dalla data o dalle loro osservazioni del paesaggio. Per esempio i marinai portoghesi chiamarono una baia sulla costa brasiliana che scoprirono il giorno di Capodanno del 1502 \"Fiume di gennaio\" (Rio de Janeiro), e il nome della città di Montevideo si riferisce alla presunta esclamazione di Magellano alla vista della costa per la prima volta: \"Monte vido eu!\" (\"Vedo una montagna!\").<n><n>Era anche una consuetudine diffusa che gli esploratori dessero il nome di distese di terra e città ai loro sovrani, alla madrepatria o alla città da cui venivano. Ciò non solo comunicava al mondo esterno una chiara dichiarazione di possesso, ma creava anche un legame con la propria patria persino in queste terre lontane.<n><n>Se tutto il resto falliva, si poteva sempre ricorrere ai nomi delle lingue indiane native (anche se nella maggior parte dei casi ciò non impedì ai colonizzatori di cacciare o sterminare poi gli stessi nativi).<n><n>Ancora oggi persiste il mito secondo cui, alla domanda di James Cook su come si chiamasse quello strano marsupiale, un aborigeno australiano avrebbe risposto \"kangooroo\" o \"ganguru\", che a quanto pare significava solo \"Di che cosa stai parlando?\". Anche se è un mito, questo genere di divertenti fraintendimenti deve essersi certamente verificato. <n><n>Ci si stupirebbe probabilmente di quanti nomi di città, montagne e fiumi significhino semplicemente \"buongiorno!\", \"come dici?\" o \"lasciami in pace!\" ..."
"0xd4cd0f45" = "Con l'emergere di un impero spagnolo esteso su tutto il globo, divenne necessario istituire autorità coloniali con poteri sufficienti per occuparsi degli affari amministrativi quotidiani e di eventuali crisi improvvise. A tal fine il titolo di viceré fu conferito ai governatori più importanti delle colonie.<n><n>All'apice dell'impero mondiale esistevano due dignitari di questo tipo, nella Nuova Spagna (Messico) e in Perù. I vicereami della Nuova Granada e del Río de la Plata si aggiunsero nel corso del XVIII secolo.<n><n> I compiti di un viceré (detto anche virrey), che egli svolgeva insieme (e spesso in conflitto) con un consiglio amministrativo noto come Audiencia, comprendevano le normali mansioni di un funzionario: riscuotere e raccogliere le tasse, garantire che la popolazione rispettasse la legge, organizzare le difese della colonia e così via. Era anche responsabile della protezione della popolazione indiana nativa e della nomina di dignitari ecclesiastici e secolari di rango inferiore.<n><n>A causa dell'enorme importanza economica e politica dei suoi possedimenti d'oltremare, la Corona teneva sempre un occhio vigile sulle attività dei suoi viceré. Era loro vietato dedicarsi ad attività commerciali extra che avrebbero procurato un reddito aggiuntivo. A parte questo, la rivalità tra i viceré si traduceva solo nella reciproca limitazione del loro potere."
"0xd4cd0f46" = "È già un fatto ben noto che i conquistatori europei rispondevano sempre al richiamo dell'argento e dell'oro. Tuttavia, quasi più preziosi erano le spezie. È difficile immaginare quanto dovesse essere insipida la dieta europea del Medioevo, se si pensa ai pericoli che le persone erano disposte ad affrontare per ottenere un po' di pepe o di noce moscata.<n><n>A questo proposito la scoperta dell'America si rivelò dapprima estremamente deludente. Le persone notarono con interesse gli animali esotici che Cristoforo Colombo riportò con sé, gioirono dell'espansione dei possessi del loro paese e delle molte anime che immaginavano sarebbero state salvate dalla diffusione del cristianesimo laggiù. Tuttavia le montagne d'oro si rivelarono piuttosto elusive rispetto a quanto era stato promesso. Questi viaggi divennero redditizi solo dieci o vent'anni dopo, quando un vero e proprio fiume d'argento americano cominciò ad arrivare in Europa. <n><n>In uno di questi viaggi Colombo riportò un tesoro più prezioso di tutto l'oro e l'argento del mondo intero: il 4 novembre 1492 i nativi gli presentarono ciò che egli descrisse come una mela dal sapore di castagne. In quel momento divenne il primo europeo a mangiare una patata! La parola indiana per questa pianta era \"batate\" e sopravvive ancora oggi nella lingua inglese come \"potato\".<n><n>Molte altre cose che oggi diamo per scontate furono portate per la prima volta in Europa da Colombo e dai suoi successori: il tabacco, i pomodori, il mais e l'amaca. O, come direbbero i nativi americani: \"hamaka\" (da cui deriva la parola inglese)."
"0xd4cd0fae" = "Dal momento in cui fu annunciata, la scoperta del Nuovo Mondo accese l'immaginazione dei popoli d'Europa. Che genere di creature potevano contenere quei territori inesplorati? Circolavano le voci più incredibili: si diceva che un'isola brulicasse di cannibali, un'altra di creature senza testa con il volto conficcato nello stomaco.<n><n>Il paesaggio sudamericano della Patagonia si traduce all'incirca come \"terra dei piedoni\", mentre l'Amazzonia deve il suo nome a un'orda di guerriere che si dice abbiano ricordato agli esploratori simili guerriere della mitologia greca.<n><n>Mentre alcune di queste voci avevano un fondamento fattuale, altre si basavano su fraintendimenti e interpretazioni errate o su storie che i nativi americani stessi avevano semplicemente raccolto da qualche parte.<n><n>Tuttavia molte di queste voci erano semplicemente il prodotto della vivida immaginazione della gente e, assai spesso, la gente ci credeva solo perché lo voleva. Ciò spiegherebbe perché intere generazioni di conquistadores abbiano cercato la leggendaria Fonte della giovinezza, il Giardino dell'Eden ed Eldorado, la città dell'oro. Furono incoraggiati nelle loro convinzioni errate dai nativi americani, che assicuravano continuamente di aver sentito parlare di un luogo o dell'altro, ma che desideravano soltanto guadagnare tempo per attirare in profondità questi avidi uomini bianchi e tagliarli fuori dalle loro navi."
"0xd4cd0faf" = "Una delle figure più abbaglianti in un elenco di esploratori e conquistatori che comprendeva molti altri personaggi pittoreschi fu lo scrittore e avventuriero inglese Sir Walter Raleigh (ca. 1554 – 1618). Salì alla ribalta nel 1580, quando sconfisse una rivolta di ribelli irlandesi contrari all'occupazione inglese.<n><n>Divenne un favorito della regina Elisabetta I e usò la sua influenza per finanziare una spedizione alla ricerca della leggendaria città di Eldorado in Sud America. Nonostante il totale fallimento di diverse spedizioni nel trovare qualcosa di valore, riuscì a mantenere il sostegno dei suoi finanziatori londinesi grazie alle sue straordinarie doti di persuasione. Fece loro credere che il premio finale si trovasse sempre appena oltre il prossimo estuario e che non potesse certo rinunciare ora.<n><n>Tuttavia il suo credito alla fine si esaurì. Troppo spesso le persone avevano ascoltato le sue alte promesse solo per scoprire più tardi che erano soltanto fumo. Raleigh infine cadde in disgrazia presso Elisabetta. Il suo successore Giacomo I vedeva in questo avventuriero sanguigno una minaccia per la sua politica estera più moderata e, appena salì al potere, lo fece arrestare con motivi assai deboli e lo condannò a morte. La sua condanna fu commutata (ma attenzione, non revocata!) e Raleigh fu imprigionato nella Torre di Londra.<n><n>Anni dopo, quando lo stato delle finanze del paese convinse il re che era necessario, egli diede a Sir Walter Raleigh il permesso di guidare un'altra spedizione in Guyana. Era una situazione assurda: dare a un uomo egli stesso condannato a morte l'autorità sulla vita e sulla morte di altri e mandarlo in cerca d'oro! Tuttavia questa contraddizione si risolse relativamente presto, perché Raleigh, ormai devastato dalla febbre, visse abbastanza da vedere la sua ultima spedizione finire in un fallimento.<n><n>Al suo ritorno in Inghilterra il furioso re decise che la sospensione dell'esecuzione decretata nel 1603 doveva ora terminare. Sir Walter Raleigh fu giustiziato poco dopo.  "
"0xd4cd0fb0" = "I primi incontri tra gli abitanti nativi del Nuovo Mondo e i marinai bianchi si svolsero in genere pacificamente. In molti luoghi gli europei furono accolti come dèi. Qua e là questa impressione si fondava su vecchi miti, ma nella maggior parte dei casi i nativi americani erano semplicemente colpiti da quegli stranieri alti e biondi che arrivavano in armature scintillanti sulle loro \"case d'acqua\" (navi).<n><n>Colombo, Cortez e tutti gli altri esploratori furono fin troppo felici di perpetuare questa illusione, ma i nativi americani si scontrarono ben presto con la brutale realtà: spinti dall'insaziabile brama d'oro, la \"malattia spagnola\" come la chiamavano i nativi, gli spagnoli abusarono, resero schiave e massacrarono intere popolazioni. La vista dei cavalli, fino ad allora sconosciuti in America, e il suono dei cannoni provocarono il panico totale e coloro che sopravvissero al massacro soccombettero presto al vaiolo, all'influenza o a un'altra malattia importata.<n><n>Intellettuali famosi come Gonzalo Oviedo o Juan de Sepúlveda cercarono di giustificare i crimini commessi dagli europei con argomenti razzisti agghiaccianti che dipingevano la razza nativa americana come vile, ignorante e inferiore.<n><n>Gli stessi uomini che avevano bruciato scienziati e streghe sul rogo per le loro convinzioni erano ben versati nell'arte di creare racconti scioccanti delle \"abitudini bestiali\" dei nativi americani: sebbene le pratiche di idolatria, sacrificio umano e cannibalismo non fossero affatto immaginarie, da allora in poi l'uomo bianco le usò come giustificazione generale per imporre ai nativi americani le più brutali sanzioni di ogni genere."
"0xd4cd0fb1" = "Come è generalmente noto, la fase iniziale della colonizzazione dell'America fu intrapresa da Spagna e Portogallo. A loro si unirono più tardi l'Olanda e, soprattutto, Inghilterra e Francia. Ciò che è molto meno noto è che numerose spedizioni spagnole non sarebbero mai state intraprese se non fosse stato per i loro potenti finanziatori tedeschi.<n><n>Verso il 1500 l'Alta Svevia e in particolare Augusta si erano sviluppate in uno dei più importanti centri di commercio e finanza d'Europa. Da qui le famiglie mercantili dei Fugger e dei Welser esercitavano una potente influenza sulla politica mondiale. Per esempio fu il loro ampio sostegno finanziario che aiutò re Carlo di Spagna a diventare imperatore di Germania nel 1519. Re Enrico VIII d'Inghilterra e molti dei papi erano felici di annoverare Jakob Fugger il \"Ricco\" tra i loro amici.<n><n>Naturalmente questi astuti mercanti avevano propri secondi fini nel concedere questo genere di sostegno. In cambio si aspettavano di ricevere privilegi o il permesso di partecipare all'estrazione regia dell'argento. I Welser riuscirono perfino ad acquisire temporaneamente parte della costa settentrionale del Venezuela, dove fondarono città come \"Nuova Augusta\" e da dove inviarono diverse spedizioni (per lo più infruttuose) alla ricerca di tesori nell'entroterra."
"0xd4cd0fb2" = "Conquistando metà del globo, la Corona spagnola si trovò in grado di approfittare di opportunità uniche. Per un periodo di diversi secoli, fino alla scomparsa delle grandi culture americane degli Inca, dei Maya e degli Aztechi e alla scoperta di enormi giacimenti d'argento in Perù e in Messico al più tardi, la posizione della Spagna sembrò inattaccabile. Sembra quasi assurdo che sia stata proprio questa immensa ricchezza a precipitare il declino di questa potenza mondiale.<n><n>Gran parte dei tesori riportati in Spagna per nave finì direttamente nelle tasche di quei mercanti a nord dei Pirenei che avevano finanziato i viaggi in primo luogo. Tuttavia il resto bastava ancora a far salire i prezzi nella penisola iberica. La gente cominciò a vivere al di sopra dei propri mezzi: in un'epoca in cui la capacità di tenere corte in grande stile era considerata più importante del pareggio del bilancio statale, si prestava poca attenzione a banali preoccupazioni finanziarie.<n><n>Le merci venivano importate in quantità sempre crescenti a bordo di navi straniere, perché la gente era ormai troppo raffinata per produrle in casa. Perfino le attrezzature e le provviste per le spedizioni in America erano raramente fornite dai mercanti nazionali. La gente osservava con orgoglio: tutta Europa è al comando della Spagna.<n><n>Tuttavia il flusso d'argento doveva prima o poi esaurirsi, e il brusco risveglio che ne seguì avrebbe assomigliato ai postumi di una lunga notte di baldoria: gli olandesi e gli inglesi cercavano di cacciare la Spagna dagli oceani. Numerose guerre di religione contro gli \"eretici\" protestanti e contro i turchi avevano divorato somme enormi di denaro e il vasto impero, sul quale il sole non tramontava mai, si era trasformato in un colosso ingovernabile.<n><n> La crisi fu evidente a tutti nel 1557, quando il nuovo sovrano spagnolo Filippo II fu costretto a dichiarare per la prima volta la bancarotta dello stato. Il grande impero, che aveva posseduto tesori maggiori di qualsiasi impero precedente, era in bancarotta."
"0xd4cd0fb3" = "Perché la lingua parlata in Brasile è il portoghese, quando quasi ovunque altrove in Sud America è lo spagnolo?<n><n>Ebbene, sia gli spagnoli sia i portoghesi, che avevano scoperto la rotta marittima per l'India lungo la costa africana, riconobbero presto che il loro futuro era oltre gli oceani. Ognuno sorvegliava gelosamente l'altro per assicurarsi che, nella loro caccia a merci, sudditi e terre, non invadessero il territorio altrui.<n><n>Poiché a quel tempo non esisteva nulla di simile al diritto internazionale, in caso di conflitto si rivolgevano al papa, che era l'unica persona alla cui autorità entrambe le nazioni erano disposte a sottomettersi. Da parte sua, la Chiesa cattolica aveva interesse a garantire che spagnoli e portoghesi perseguissero con zelo la cristianizzazione dei \"pagani\" nelle terre sconosciute invece di sprecare le loro energie rendendosi la vita difficile a vicenda.<n><n>Si giunse quindi a un accordo durante negoziati congiunti a Tordesillas (1494) e Saragozza (1529): i territori di nuova scoperta a ovest di un particolare meridiano dovevano appartenere alla Spagna e tutti gli altri al Portogallo. Questo meridiano tagliava quella che allora era la Sud America inesplorata, così che il suo lato orientale, parte dell'attuale Brasile, toccò al Portogallo."
"0xd4cd0fb4" = "Fu probabilmente lo scrittore romano Polibio il primo a menzionare la parola \"pirata\" (peirato) intorno al 140 a.C. Da allora sono state usate molte parole diverse per indicare questi temibili malfattori del mare: corsari, filibustieri, bucanieri, pirati... Gli uomini che circondavano Klaus Störtebeker erano noti come \"La fratellanza vitaliana\" e Bartholomew Roberts diede a sé e alla sua banda di assassini il titolo piuttosto innocuo di \"Gentiluomini della fortuna\". In definitiva, però, poco importava al mercante chi fosse colui che emergeva dal nulla per attaccare la sua nave. <n><n>I bucanieri sono stati un flagello per l'umanità nel corso dei secoli in ogni angolo del mondo. Nell'antichità i pirati cilici diffusero un tale terrore in tutto il Mediterraneo che l'Impero romano fu costretto a lanciare regolari campagne contro di loro. Isole nascoste e coste frastagliate situate vicino a rotte commerciali molto frequentate offrivano i luoghi ideali per l'attività piratesca: quelle zone in cui scogliere, correnti e cattive condizioni meteorologiche rendevano facili bersagli le pesanti navi mercantili offrivano un rifugio in cui ritirarsi rapidamente dopo aver commesso l'oltraggio. La costa dell'Asia Minore era temuta nell'antichità quanto i Caraibi lo furono nell'Età delle scoperte, mentre i pirati del Sud-Est asiatico assunsero uno status quasi mitico.<n><n>Secondo l'origine della parola, un \"bucaniere\" era in realtà un marinaio che prendeva il mare come privato, non come marinaio della marina, in cerca di bottino e che era quindi considerato dedito alla pirateria. <n><n>Tuttavia il rilascio di lettere di corsa diede ad alcuni bucanieri dei Caraibi un'apparenza di legalità. Questi documenti erano emessi da governatori inglesi, francesi o olandesi e il loro scopo era di dirigere il flagello della pirateria contro le potenze avversarie.<n><n> La facilità con cui si potevano ottenere le lettere di corsa dipendeva dal singolo governatore. Un governatore considerava disonorevole stringere un patto con i pirati. Altri erano piuttosto meno scrupolosi o semplicemente corrotti o codardi."
"0xd4cd0fb5" = "I \"sette mari\" in realtà sono soltanto tre (vale a dire i tre oceani): il Pacifico settentrionale e meridionale, l'Atlantico settentrionale e meridionale, l'Oceano Artico e Antartico e l'Oceano Indiano.<n><n> L'Oceano Pacifico deve il suo nome alla prima circumnavigazione del globo di Ferdinando Magellano, che ebbe la fortuna di incontrare condizioni meteorologiche favorevoli durante le molte settimane di fame che gli occorsero per attraversare questo vasto oceano.<n><n>E un'altra cosa: i Caraibi derivano il loro nome dai \"Karibe\" (o \"Karaibe\"), popoli di un gruppo linguistico indiano, la cui area di insediamento si estendeva dalle Antille lungo la costa settentrionale del Sud America."
"0xd4cd0fb6" = "Le isole Bermuda prendono il nome dall'esploratore spagnolo Juan Bermúdez, che le scoprì nel 1503. La famigerata zona nota a tutti i marinai come \"Triangolo delle Bermuda\", in cui il rischio di misteriosi incidenti marittimi sarebbe altissimo, copre un'area di mare tra le isole Bermuda, Porto Rico e Fort Lauderdale (Florida).<n><n>Alcuni sostengono che la strana serie di eventi inspiegabili cominciò con il viaggio di Cristoforo Colombo: il navigatore genovese al servizio della Spagna si trovò con le sue tre navi in questa stessa zona il 14 settembre 1492, quando l'ago della bussola cominciò a girare all'impazzata. La causa era la differenza tra il polo nord geografico e quello magnetico. Il giorno dopo apparve in cielo un'enorme fiamma (forse un meteorite).<n><n>Tuttavia il soprannome \"Triangolo delle Bermuda\" nacque solo dopo la Seconda guerra mondiale, in seguito a una serie di incidenti aerei che attirarono l'attenzione del pubblico su questa zona nel sud-ovest dell'Atlantico settentrionale.<n><n>I seguaci del mistero parlano di oltre 200 presunti incidenti inspiegabili, anche se ne interpretano i confini con una certa generosità. La maggior parte di questi eventi, molti dei quali non avvennero nemmeno nella zona, ha una spiegazione del tutto logica."
"0xd4cd0fb7" = "La leggendaria flotta del tesoro spagnola, che salpava regolarmente dall'America verso la Spagna, suscitò anche ogni sorta di bramosia oltre la penisola iberica. Fu soprattutto un'Inghilterra ambiziosa a vedere in ciò l'occasione per contendere alla Spagna il ruolo di padrona dei mari e regina del mondo.<n><n>Poiché il regno insulare era ancora troppo debole per intraprendere campagne militari su larga scala, era molto più sensato attaccare il rivale fuori dall'Europa, molto lontano, dove non si sarebbe aspettato un attacco né avrebbe ricevuto alcun avvertimento. Là si poteva saccheggiare la propria vittima con facilità e poi semplicemente svanire, e in Europa nessuno avrebbe saputo nulla per mesi.<n><n>A capitani audaci, il più celebre dei quali fu Francis Drake (1540-1596), Sua Maestà Elisabetta I rilasciò lettere di corsa. Queste lettere di corsa somigliavano a una sorta di assegno in bianco ed erano una licenza di saccheggio che elevava Drake e i suoi compagni al di sopra dei comuni bucanieri, conferendo loro lo status di predatori privati al servizio di un'autorità superiore. Se ne servirono in modo eccellente. Nessun luogo era sicuro per le navi e le guarnigioni iberiche.<n><n>Nel 1578 Francis Drake attraversò lo Stretto di Magellano e si lanciò come un turbine a caccia del bottino spagnolo lungo la costa pacifica dell'America. Nessuno aveva mai osato tanto prima! Al suo ritorno nel porto di Plymouth nel 1580, Drake era diventato il secondo capitano, dopo Magellano, a compiere il giro del mondo. <n><n>Nel frattempo il re Filippo di Spagna ribolliva di rabbia e agitava il Trattato di Tordesillas, con il quale Sua Santità il papa aveva fermamente dichiarato nel 1494 che l'emisfero occidentale rientrava nella sfera d'influenza spagnola. – Ma come poteva una simile protesta avere qualche effetto su quella bizzarra nazione insulare di eretici protestanti, che respingeva del tutto l'autorità del papa a Roma e che rifiutò perfino di adottare il moderno calendario gregoriano fino al 1753, unicamente perché era stato messo a punto per ordine di papa Gregorio nel 1582?<n><n>Ancora una volta sembrò che la questione potesse essere risolta solo con la guerra. L'Armada di Filippo salpò verso l'Inghilterra nel 1588, ma sotto il comando di Sir Francis Drake, ormai fatto cavaliere, e con l'aiuto di diverse tempeste provvidenziali, gli inglesi riuscirono a distruggere la flotta spagnola. Per centinaia di anni dopo nessuno avrebbe contestato la posizione della Gran Bretagna come prima potenza marittima."
"0xd4cd101f" = "Senza dubbio i viaggi di Cristoforo Colombo (1451-1506) verso l'America figurano tra le più grandi avventure mai intraprese dall'umanità. Perfino uno scrittore difficilmente oserebbe immaginare un racconto simile, fatto di eventi drammatici e stranissime coincidenze.<n><n>Sebbene il navigatore genovese fosse riuscito a convincere la coppia reale di Spagna, Isabella e Ferdinando, della sua idea che esistesse una rotta marittima occidentale per l'India, non poteva certo contare sull'assenso dell'equipaggio a bordo. Anzi, la maggior parte dell'equipaggio fu reclutata a forza: come punizione per reati contro la Corona, la città di Palos fu costretta a fornire due navi con i rispettivi equipaggi.<n><n>La notizia del piano di Colombo provocò reazioni di orrore. L'equipaggio era fermamente convinto di navigare agli ordini di un pazzo che non poteva portare che la rovina su di sé e su tutti coloro che salpavano con lui.<n><n>Tuttavia il peggior nemico di Colombo era la superstizione: ogni racconto di orrore immaginabile sembrava essere salpato a bordo, e qualsiasi evento strano o sinistro non faceva che rafforzare i timori dei marinai: un vulcano eruttò mentre costeggiavano Tenerife, poi videro colonne di fuoco nel cielo e perfino l'ago della bussola sembrò prendersi gioco dell'equipaggio. Se le navi restavano in bonaccia, lo si vedeva come un cattivo presagio. Se invece avanzavano bene, ciò significava che il vento soffiava sempre da est verso ovest e che non avrebbero mai potuto invertire la rotta.<n><n>In molte occasioni l'ammutinamento sembrò inevitabile. Una notte il capitano udì passi e mormorii fuori dalla sua cabina, e solo quando cominciò a pregare ad alta voce gli assassini persero coraggio e si allontanarono furtivi.<n><n>Le crisi più gravi scoppiavano sempre quando quella che si credeva un'isola all'orizzonte si rivelava ancora una volta nient'altro che un'illusione ottica. Fu proprio un caso del genere, il 10 ottobre, a far precipitare la situazione. Con grande difficoltà Colombo negoziò un ultimatum di tre giorni, dopo i quali l'equipaggio voleva invertire la rotta (preferibilmente senza il capitano). Il destino però aveva altre intenzioni: entro quei tre giorni la terra fu davvero avvistata. Nessuno dei presenti avrebbe potuto sognare che, invece dell'Asia, si erano imbattuti in un continente del tutto nuovo e sconosciuto.<n><n>Il Giappone e la Cina erano ancora a migliaia di miglia nautiche di distanza e, senza l'incredibile buona sorte di un continente straniero sulla loro rotta, la spedizione di Colombo sarebbe stata perduta. Il morale dell'equipaggio si risollevò all'istante. Nessuno di loro ricordava di aver mai nutrito pensieri di ammutinamento ..."
"0xd4cd1020" = "Cristoforo Colombo aveva davvero scoperto una nuova massa continentale (o meglio: riscoperto, poiché i vichinghi avevano già messo piede su suolo americano nel Medioevo), ma annunciò erroneamente di aver scoperto una rotta marittima per l'India.<n><n>Mentre preparava il secondo e il terzo dei suoi quattro viaggi, il genovese collaborò con Amerigo Vespucci, fiorentino. Fu questi il primo a suggerire che quelle terre a ovest appartenessero in realtà a un continente nuovo e sconosciuto. Questa spettacolare intuizione riaccese l'interesse del pubblico e, ogni volta che si discuteva di questi nuovi territori, il nome di Vespucci era certo menzionato.<n><n>Al contrario, la stella di Cristoforo Colombo era in declino. Nel frattempo era perfino stato rimandato in patria in catene dopo le lamentele dei coloni caraibici, e la sua morte, nel 1506, da uomo amareggiato e malato, non attirò l'attenzione che meritava. Non sorprende quindi che il cartografo tedesco meridionale Martin Waldseemüller si ispirasse al nome popolare di Amerigo Vespucci quando, un anno dopo, cercò di proporre un nome per queste terre sconosciute. <n><n>Il nome di Waldseemüller fu accettato dai suoi colleghi. Sarebbe stato più giusto battezzare il continente \"Columbia\"."
"0xd4cd1021" = "La prima parte dell'America che acquistò grande importanza sotto gli spagnoli fu Hispaniola. Cristoforo Colombo vi aveva già fondato il primo insediamento europeo nel 1493, anche se era stato distrutto dai nativi americani prima ancora che egli tornasse dall'Europa.<n><n>Negli anni successivi la Corona spagnola prese un controllo crescente di quest'isola. Furono costruiti il primo monastero e la prima cattedrale, e fu qui che si stabilì per la prima volta il sistema sociale poi esteso alle altre regioni: una società schiavista, rigidamente divisa in classi e strettamente legata alla Chiesa cattolica.<n><n>Hispaniola sembrava offrire enormi opportunità e attirò attraverso l'oceano molti coloni intraprendenti. <n><n>Tuttavia non passò molto tempo prima che la Spagna rivolgesse la propria attenzione ad altre regioni: ormai i grandi regni del continente erano stati scoperti e conquistati. Lì era più facile governare, i giacimenti d'oro e d'argento erano più ricchi e più facili da estrarre.<n><n>Proprio come un giocattolo gettato da parte, la gente perse interesse per Hispaniola. Pirati olandesi, inglesi e francesi si alternarono negli attacchi. Nel 1697 i francesi presero il controllo di Saint-Domingue, la parte occidentale dell'isola (l'odierna Haiti), e vi stabilirono una redditizia economia di piantagione. La produzione di cacao, zucchero, indaco, cotone e caffè fece di Saint-Domingue la colonia più redditizia del Nuovo Mondo nel XVIII secolo.<n><n>L'unica rivolta di schiavi riuscita della storia, scoppiata in seguito alla Rivoluzione francese, portò infine all'indipendenza di Haiti nel 1804. I ribelli trattarono i loro antichi oppressori più o meno come erano stati trattati essi stessi: \"Per la dichiarazione di indipendenza ci serve la pelle di un bianco per la pergamena, il suo cranio come calamaio, il suo sangue come inchiostro e una baionetta come penna\", annunciò allora il generale nero Boisrond-Tonnerre."
"0xd4cd1022" = "Un prodotto tipico dei Caraibi, anche se di dubbio beneficio per l'umanità, è il rum. Questo distillato ricavato dalla melassa di canna da zucchero, che in origine portava il colorito nome di \"ammazza-diavoli\", fu menzionato per la prima volta alle Barbados nel 1650. Bevanda leggendaria prediletta dai pirati, il rum è per lo più associato nella mente della gente all'isola di Jamaica, uno dei covi di pirati più temuti di ogni tempo. <n><n>I trafficanti di schiavi vendevano nei Caraibi la merce umana acquistata sulla costa africana in cambio di grandi quantità di melassa. Questa melassa era raffinata in rum nel New England e poi trasportata in Africa sulle stesse navi. Il distillato era venduto in Africa e le navi vuote venivano poi caricate con un nuovo carico di schiavi. Con questo fatale \"commercio triangolare\" gli armatori facevano sì che le loro navi fossero sempre a pieno carico in ogni viaggio."
"0xd4cd1023" = "Accanto a Cuba, la Jamaica è probabilmente la più famosa delle isole caraibiche. Il suo nome deriva dal nome indiano arawak Xymaca, che significa all'incirca \"la terra del legno e dell'acqua\". Cristoforo Colombo stesso, che aveva scoperto l'isola nove anni prima, ebbe ampia occasione di sperimentare la bellezza del paesaggio e la cordialità dei suoi abitanti quando la sua nave naufragò al largo della costa settentrionale nel 1503.<n><n>Gli piacque talmente che trasferì la proprietà dell'intera isola dal re di Spagna e la dichiarò sua. Ciononostante questo paradiso insulare fu alquanto trascurato nei decenni successivi, finché non fu conquistato dagli inglesi nel 1655. A quel punto restavano pochissimi arawak, poiché la loro tribù si dimostrò particolarmente vulnerabile alle malattie portate dagli europei.<n><n>Nel 1661 Edward D'Oyley fu nominato capitano generale e governatore della Jamaica. Sotto la sua autorità la capitale Port Royale fu trasformata in un rifugio vivace e ben difeso per i pirati. Si diceva che fosse \"il luogo più ricco e corrotto della terra\" e molti abitanti, che per il resto erano comuni mercanti, si univano spesso per compiere razzie private in acque spagnole. All'inizio il governo britannico mostrò scarsa intenzione di reprimere queste attività, perché dopo tutto i bucanieri tenevano a bada i rivali spagnoli.<n><n>Fu solo dopo che Sir Henry Morgan assunse la carica di governatore (cosa significativa, perché era egli stesso un ex pirata) che la cultura e l'ordine tornarono in Jamaica. Morgan represse senza pietà la pirateria e non esitò a mandare al patibolo i suoi antichi compagni.<n><n>Tuttavia, appena ristabilita l'autorità britannica, fu scoperta una nuova e redditizia fonte di guadagno oltre alla coltivazione della canna da zucchero: dopo il 1672 Port Royale si sviluppò nel più grande mercato di schiavi del mondo, una volta che la Royal African Company inglese ebbe stabilito il suo monopolio."
"0xd4cd1024" = "Appena due settimane dopo il suo arrivo nel Nuovo Mondo, Cristoforo Colombo raggiunse Cuba, la più grande isola delle Indie occidentali. Vi abitavano diverse tribù, i ciboney, i guanahatabey e i tainos, che, nonostante la loro indole pacifica, subirono tutti lo stesso triste destino delle altre tribù indiane americane: nel 1511, dopo aver combattuto una guerra di quattro anni contro gli spagnoli, furono conquistati e sterminati. Ciò portò in seguito all'importazione qui di un gran numero di schiavi neri. L'isola, con la sua capitale L'Avana, era divisa in sette distretti amministrativi (cabildos), ciascuno dei quali inviava un deputato a un consiglio speciale. Compito del deputato era rappresentare gli interessi locali della zona.<n><n>Notevole nella storia di Cuba è che, a parte un breve interludio di dominio britannico dal 1762 al 1763, l'isola rimase in mani spagnole per un periodo relativamente lungo. Forse perché Cuba non era una delle zone più importanti dell'impero spagnolo in epoca coloniale (per esempio non vi erano quasi giacimenti minerari) ed era in genere usata come scalo sulla rotta verso il continente. In ogni caso, mentre la stragrande maggioranza dei paesi sudamericani e centroamericani lottava per l'indipendenza nel primo quarto del XIX secolo, gli spagnoli riuscirono a tenersi Cuba fino al 1898, quando cedettero il controllo dell'isola agli Stati Uniti."
"0xd4cd1025" = "È ben noto che molte cose oggi per noi ovvie arrivarono per la prima volta in Europa grazie al commercio con l'America. Tuttavia lo scambio culturale funzionò anche in senso inverso.<n><n> Per esempio, quando si immagina il tipico indiano americano delle pianure nordamericane, è difficile credere che in America non ci fossero cavalli prima dell'arrivo degli spagnoli e dei portoghesi. Molti nativi americani fuggirono in preda al panico cieco la prima volta che videro un cavallo con il suo cavaliere, perché pensarono si trattasse di uno strano animale formato da due esseri cresciuti insieme.<n><n>Il caffè, che di solito si associa a paesi come il Brasile e il Guatemala, non è originario dell'America e aveva già attraversato tre continenti prima di arrivarvi: dall'Africa (probabilmente dall'Etiopia) passò per i paesi arabi prima di giungere nell'Europa sud-occidentale. La pianta fu introdotta in America nel XVIII secolo, quando la crescente popolarità della bevanda rese necessario aumentare la coltivazione.<n><n>Nella patata gli europei avevano scoperto nei Caraibi un alimento base di valore inimmaginabile. Viceversa il frumento era sconosciuto in America fino all'arrivo degli spagnoli e degli inglesi, che portarono questa coltura rispettivamente in Messico nel 1520 e in Virginia nel 1777. Sebbene all'inizio si pensasse che il clima americano non fosse adatto alla coltivazione del frumento, fu proprio il Nord America a vederne il successo più strepitoso. Oggi il frumento è la coltura agricola con la maggiore superficie coltivata al mondo."
"0xd4cd1026" = "Riesci a immaginare la vita senza cioccolato? Dovresti, perché il cacao era sconosciuto nel resto del mondo prima della scoperta dell'America. La parola cacao deriva probabilmente dalla lingua maya, dove se ne trova la prima traccia: sembra certo che i mercanti maya bevessero cacao 400 anni prima della nascita di Cristo.<n><n>Gli aztechi, che dal XIV secolo erano la potenza dominante nel continente centroamericano, attribuirono al cacao perfino un significato religioso. Il primo europeo a entrare in contatto con questa prelibatezza fu, ancora una volta, Cristoforo Colombo, anche se ciò avvenne in un viaggio successivo, nel 1502, che lo portò in Nicaragua.<n><n>Tuttavia il legittimo \"scopritore\" del cacao è Hernán Cortés, conquistatore del regno azteco, che riportò in Spagna la ricetta di una bevanda chiamata xocoatl (da cui la parola \"cioccolato\"). All'inizio il gusto era troppo amaro per il palato europeo e solo dopo che si cominciò ad aggiungere zucchero o vaniglia la cioccolata calda divenne una bevanda popolare tra le classi alte iberiche.<n><n>Gli spagnoli tennero la ricetta per sé per quasi cento anni, dopo di che la cioccolata calda si diffuse in Francia e nel resto d'Europa. Intorno al 1700 gli inglesi aggiunsero il latte. Il definitivo successo del cacao in Europa avvenne quando si scoprì quanto fosse delizioso il caffè insieme al cacao."
"0xd4cd1027" = "Sebbene quando si parla di pirateria sia talvolta difficile distinguere realtà e leggenda, non si può certo negare che esistessero anche donne pirata. Due delle figure più brillanti si misero su questa strada sull'isola di Jamaica nei primi anni del XVIII secolo.<n><n>Anne Bonny, che si dice sia stata trafitta al ventre già da bambina, era fuggita con un marinaio verso il covo di pirati di New Providence (Nassau). Là riuscì a sbarazzarsi del marito e a iniziare una propria carriera a bordo di una nave olandese catturata. <n><n>Là conobbe Mary Read, che aveva già combattuto nelle guerre spagnole di successione travestita da uomo e che, a quanto si racconta, mostrava il seno ai suoi avversari prima di ucciderli, per dimostrare loro di essere stati sconfitti da una donna.<n><n>Dopo la cattura, nel 1720, sfuggirono al patibolo solo perché incinte. Se la cavarono meglio della maggior parte dei loro complici maschi, sul cui capo Anne Bonny poteva solo versare disprezzo.<n><n>Riportiamo le parole che rivolse al famigerato \"Calico Jack\" mentre veniva condotto al patibolo: \"Mi dispiace vederti qui, Jack, ma se avessi combattuto come un uomo, non saresti qui per essere impiccato come un cane\"."
"0xd4cd1028" = "Il gallese Bartholomew Roberts (1682? – 1722) non fu solo uno dei pirati più importanti, ma anche uno dei più insoliti. Noto anche come \"Black Bart\" (da non confondere con \"Barbanera\", alias Edward Teach), si convertì tardi alla pirateria, a 37 anni, anche se il passaggio alle attività criminali fu senza dubbio indolore: la nave su cui lavorava, attaccata nel 1719 dal suo connazionale gallese Howell Davis, era in realtà una nave negriera.<n><n>Roberts decise di unire la sua sorte a quella di Davis, e dopo l'assassinio di quest'ultimo, poche settimane dopo, assunse il ruolo di capitano. Si dice che Bartholomew Roberts evitasse l'alcol e preferisse il tè.<n><n>A differenza di Teach, che si atteggiava a diavolo in persona, Roberts aveva il debole per i bei vestiti, non amava il gioco d'azzardo e insisteva che i suoi uomini recitassero le preghiere. Ciò non significa però che Roberts fosse nel fondo un uomo pio. Sono numerosi i racconti delle atrocità che commise, soprattutto contro i prigionieri, durante le sue innumerevoli imprese di saccheggio. Con un bottino di oltre 400 navi e un'area di operazioni che si estendeva dal Brasile fino a Terranova e all'Africa occidentale, fu, insieme a Henry Morgan, uno dei pirati di maggior successo dell'America centrale. <n><n>Il rombo dei cannoni di una nave da guerra britannica al largo della costa della Guinea nel 1722 segnò la fine della sua carriera e la scomparsa di una delle più grandi minacce dei sette mari."
"0xd4cd1090" = "Il bucaniere più famoso del XVII secolo fu il gallese Henry Morgan (1635-1688), che devastò le colonie spagnole nelle Indie occidentali, scuotendo così dalle fondamenta l'autorità della grande potenza iberica nella regione.<n><n>La sua vita è un esempio della morale alquanto discutibile che stava dietro alla politica di Gran Bretagna, Olanda e Francia, che chiudevano volentieri un occhio sulla pirateria purché recasse danno alle altre grandi potenze.<n><n>Henry Morgan, che nel 1668 fu messo al comando di una nave bucaniere, cominciò a seminare il caos lungo la costa settentrionale del Sud America. Al comando di quasi 2.000 uomini conquistò nell'agosto 1670 la città ben difesa di Panama, per poi allontanarsi con la maggior parte del bottino sulla via del ritorno. Tuttavia, poiché l'attacco era avvenuto dopo che Spagna e Inghilterra avevano firmato un trattato di pace, fu fatto prigioniero e processato a Londra.<n><n>Morgan non fu condannato, al contrario: non passò molto tempo prima che i venti della diplomazia cambiassero ancora direzione. Non solo Morgan fu graziato, ma fu fatto cavaliere. Come Sir Henry fu nominato nuovo governatore della Jamaica, dove impose una rigorosa legge e ordine e visse gli ultimi anni della sua vita come ricco e rispettato piantatore."
"0xd4cd1091" = "Le Bahamas, che per un breve periodo a metà del XVII secolo servirono da rifugio ai dissidenti religiosi inglesi, furono dal 1670 ufficialmente sotto il controllo del conte di Albemarle e di altri gentiluomini che avevano acquisito la proprietà del gruppo di isole dal re Carlo II nella speranza di trarne profitto.<n><n>Nonostante le loro promesse, però, costoro mostrarono scarso interesse a istituire una ben ordinata amministrazione civile. Avvenne anzi l'esatto contrario: come in altri luoghi dei Caraibi, orde di pirati si stabilirono alle Bahamas, soprattutto sull'isola di New Providence, dove si trovava la città di Nassau. <n><n>Le baie poco profonde, in cui le pesanti navi da guerra non potevano entrare, offrivano un ormeggio ideale a centinaia di sloop e barche pirata. Le frequenti razzie in acque spagnole provocarono rappresaglie e John Wentworth, il primo governatore, ebbe l'ingrato compito di ristabilire legge e ordine sulle isole.<n><n>Poiché la situazione non mostrava segni di miglioramento, il re Giorgio I d'Inghilterra confiscò di nuovo le Bahamas e le trasformò in colonia della Corona. Woodes Rogers, l'ex bucaniere e circumnavigatore, fu nominato primo governatore reale a metà del 1718.<n><n>Con il metodo del bastone e della carota pose fine al caos che aveva regnato fino ad allora. Concesse un'amnistia generale a tutti i pirati disposti a rinunciare alle loro attività sotto giuramento. Per tutti coloro che non volevano farlo, la punizione attendeva sotto forma di una flotta di navi armate fino ai denti.<n><n>Dopo che le condizioni normali furono così ripristinate, al gruppo di isole fu concesso un proprio parlamento nel 1729 e nei cento anni successivi, salvo occasionali turbamenti dovuti a invasioni, la storia delle Bahamas rimase relativamente tranquilla."
"0xd4cd1092" = "Quasi ovunque nelle loro colonie di nuova acquisizione gli spagnoli istituirono un rigido sistema sociale che offriva ben poche possibilità di ascesa. Al vertice della gerarchia stavano i connazionali nati in Europa.<n><n> Gli spagnoli nati nelle colonie erano detti creoli. Sebbene fossero considerati solo di importanza secondaria nella gerarchia, occupavano la maggior parte dei gradi inferiori nello stato, nella Chiesa e nell'esercito.<n><n>Gli spagnoli di origine europea e i creoli rappresentavano dunque la classe d'élite delle colonie. I figli dei matrimoni misti tra bianchi (per lo più uomini) e native americane erano detti meticci. I nativi americani, che originariamente possedevano la terra, occupavano il gradino più basso della società, e in quelle zone dove erano stati del tutto sterminati dagli europei questo onore fu riservato agli schiavi neri.<n><n>Le proporzioni relative di queste classi nella popolazione variavano molto tra le diverse regioni dell'impero spagnolo. In Messico, per esempio, i meticci formavano la parte più numerosa della popolazione. Su molte isole gli schiavi neri erano presenti in numero superiore (e in balìa dei loro padroni). Anche le tribù indiane americane riuscirono a sopravvivere in quelle zone dove giungle, paludi e regioni montuose offrivano un rifugio sicuro, per esempio in Bolivia o in Florida."
