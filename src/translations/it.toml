"0xe7bffbb6" = "A Tortuga le scorte della città sono state distrutte da sabotatori. Molte provviste della città sono andate perdute e, di conseguenza, la qualità della vita dei cittadini è calata drasticamente.<n><n>Il tuo obiettivo è rifornire la città il più rapidamente possibile perché il suo status possa risalire.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La città deve raggiungere lo status \"boom\" entro il @D$EndDate$."
