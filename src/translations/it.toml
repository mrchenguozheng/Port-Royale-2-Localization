"0xf214f69c" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Hai salvato un naufrago di @n$DestNation$. @N$Name$ ti offre una ricompensa cospicua se lo sbarchi nella prossima città della sua nazione."
"0xf214f69d" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Hai salvato il mercante @N$Name$ da @T$DestTown$. Ti promette una ricompensa cospicua se lo riporti nella sua città natale."
"0xf214f69e" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Hai salvato il capitano molto esperto @N$Name$. Chiede di essere sbarcato in una città appartenente a @n$DestNation$."
"0xf214f69f" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Hai raccolto @I$Sailors$ marinai naufragati, che sembrano conoscere alcuni membri dell'equipaggio. L'accoglienza solleva il morale dell'equipaggio."
"0xf214f6a0" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Hai raccolto un marinaio di @n$Nation$. Per ringraziarti di averlo salvato, ti dice dove trovare molti barili di detriti di valore. @l$DebrisPos$"
"0xf214f6a1" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Hai salvato un prete di @n$DestNation$. Non può pagarti per portarlo in una città della sua nazione, ma promette di intercedere per te per migliorare la tua reputazione in @n$DestNation$."
"0xf22583c4" = "Vuoi comprare una lettera di corsa per %1 e dare la caccia alle navi dei nostri nemici in nome dell'Olanda?"
"0xf22a4fad" = "C'è un'infestazione di ratti in %1. Il consumo di grano, frutta, mais e carne è doppio per un mese. "
"0xf22b236f" = "Non hai consegnato le merci in tempo."
"0xf22d73b9" = "Per produrre merci coloniali ti servono utensili. Allo stesso modo, per produrre merci finite ti servono materie prime. Le merci finite comprendono, per esempio, corda e tessuto. Le materie prime per queste sono la canapa e il cotone.<n><n>Ora che sai come costruire impianti di produzione, dovresti acquistare un permesso di costruzione in una città con governatore e costruirvi impianti per produrre merci finite. Tuttavia, prima di poter acquistare un permesso di costruzione devi aver stabilito una comprovata esperienza commerciale con la città, il che significa che devi vendere merci alla città quando sono scarse.<n><n>Ma attenzione! Se acquisti merci scarse in una città, questo ha un effetto negativo sulla tua esperienza commerciale con la città! Le merci scarse in una città sono mostrate in rosso nella finestra del commercio.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Migliora la tua esperienza commerciale a Cartagena così da potervi acquistare un permesso di costruzione."
"0xf24b293b" = "Carica/Salva"
"0xf253afcd" = "Puoi entrare in una rotta commerciale solo se il capitano del convoglio ha %1 punti esperienza. Al momento ne ha %2."
"0xf2590753" = "Grazie. Sembra che nel prossimo futuro non riceveremo alcuna merce importata dall'Europa. Poiché siamo attualmente in guerra con @n$HostileNation$, abbiamo l'occasione di saccheggiare merci dai convogli di trasporto dei nostri nemici, senza conquistare né affondare le loro navi.<n>Ti prego di procurarti @a$Amount$ di ciascuna delle merci spezie, vino e utensili e di consegnarle al mio mercante al mercato entro @D$EndDate$."
"0xf2590754" = "La tua missione è attaccare e saccheggiare i convogli di trasporto di @n$HostileNation$, senza conquistare né affondare le sue navi. Devi poi consegnare le merci al mercato. Hai tempo fino al @D$EndDate$."
"0xf2590755" = "E sia. Va' in cerca dei convogli di trasporto di @n$HostileNation$ e saccheggia @a$Amount$ delle merci importate che trasportano. Hai poi tempo fino al @D$EndDate$ per consegnare le merci a un mercante che ti attenderà al mercato. Un consiglio: data la situazione molto tesa che c'è attualmente nella regione, puoi solo saccheggiare le navi e non devi né conquistarle né affondarle!"
"0xf2593b17" = "Ho vinto %1."
