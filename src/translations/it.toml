"0xea43addd" = "Questa è una buona occasione per noi. Una città appartenente a @n$TargetNation$ desidera schierarsi con la nostra nazione, perché sembra continuamente vessata da vari conflitti. Voglio che tu sostenga la città finché non deciderà di cambiare nazionalità."
"0xea43adde" = "È sorto un problema riguardo a una città appartenente a @n$TargetNation$. Molto tempo fa fu firmato un accordo scritto che stabiliva il passaggio pacifico della città alla nostra nazione. Purtroppo @n$TargetNation$ non rispetta più l'accordo. Voglio che tu sostenga la città finché le dispute non saranno risolte."
"0xea43addf" = "Una città appartenente a @n$TargetNation$ è in grave disputa con il suo viceré. Conosco il motivo e ora intendo sostenere la città per indurla a schierarsi con noi. Potresti aiutarmi."
