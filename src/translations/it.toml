"0xf64f1e5a" = "Come sai, siamo in guerra. Per indebolire l'economia di @n$TargetNation$, voglio che tu conquisti o affondi @I$NumShips$ navi mercantili. Accetti questa missione? "
"0xf64f1e5b" = "Siamo in guerra con @n$TargetNation$. Perciò voglio che tu affondi o conquisti un numero preciso di navi mercantili. Tutto ciò che saccheggi è tuo, a me interessa solo indebolire l'economia di @n$TargetNation$. Posso contare su di te?"
"0xf64f1e5c" = "Mi chiedevo se potessi aiutarci nella nostra guerra contro @n$TargetNation$. Vorrei mandarti in una zona precisa e affidarti il compito di conquistare o affondare navi laggiù. "
"0xf651cc3f" = "L'Olanda e l'Inghilterra hanno fatto la pace, quindi non puoi più conquistare città.<n><n>Sei arrivato piuttosto lontano in questo scenario, ma non hai avuto il tempo di conquistare abbastanza città per conto dell'Olanda.<n><n>Puoi conquistare città allo stesso modo nella modalità libera. Tuttavia devi prima essere certo che la nazione le cui città vuoi conquistare sia militarmente debole. Inoltre la nazione che vuole conquistare queste città deve essere militarmente forte e le due nazioni devono essere in guerra tra loro.<n><n>Nota: di solito ricevi in premio un appezzamento di terra su cui puoi fondare le tue città ogni volta che conquisti città per un viceré. Tuttavia questa funzione è disattivata in questo scenario."
"0xf65a5a04" = "Ora puoi accrescere la tua reputazione in %1 attaccando navi e città inglesi. Ciò non diminuirà la tua reputazione nelle altre nazioni."
"0xf65b6f4c" = "Oggi il bucaniere spagnolo %1 ha incrociato un convoglio militare inglese ed è stato ucciso."
"0xf65b6f4d" = "Oggi il bucaniere spagnolo %1 ha incrociato un convoglio militare francese ed è stato ucciso."
"0xf65b6f4e" = "Oggi il bucaniere spagnolo %1 ha incrociato un convoglio militare olandese ed è stato ucciso."
