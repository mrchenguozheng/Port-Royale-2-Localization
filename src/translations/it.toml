"0xd8e39bc3" = "Aiuta il viceré di Grand Bahama ad accrescere la potenza militare dell'Olanda cedendogli un convoglio. Poi accetta una missione per catturare città per suo conto."
"0xd91054d3" = "Questa nave non ha un capitano e quindi non può salpare. Ingaggia un capitano per questa nave alla locanda oppure aggiungila a un convoglio esistente."
"0xd918680a" = "Hai venduto il tuo permesso di costruzione e tutti i tuoi edifici in questa città."
