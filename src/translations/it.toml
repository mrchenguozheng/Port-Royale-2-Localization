"0xcda66953" = "Impresa fallita"
"0xcdd473c0" = "Zona residenziale"
"0xcde25dc6" = "<g:INTEXT_SCHATZKISTE_800x600.screen><n>Hai trovato un forziere in acqua.<n><n>@g$Gold$"
"0xcde47db7" = "Difese della città"
"0xcde8b98e" = "mappa precedente"
"0xcdf0b227" = "Un certo numero di mercanti ha unito le forze e chiede maggiore protezione nelle nostre acque. Per sostenere le loro richieste, hanno deciso di smettere presto di rifornire una delle nostre città. Puoi intervenire per aiutare me e i cittadini?"
"0xcdf0b228" = "Una delle nostre città ormai vede a malapena un mercante da un capo all'altro della settimana, perché si è sparsa la voce che una pestilenza ha colpito la città. Puoi aiutarmi a smentire la voce rifornendo la città di merci?"
"0xcdf0b229" = "Nelle ultime settimane una minaccia di pestilenza è incombita su una delle nostre città. Per peggiorare le cose, ora anche i mercanti la evitano. Puoi aiutare a sostenere la città finché la situazione non migliora?"
"0xcdf0b22a" = "Qualche giorno fa un cittadino è morto di pestilenza in una delle nostre città. Abbiamo cercato di insabbiare la cosa, ma temo che la voce sia comunque uscita. Ora molti mercanti hanno deciso di non fare scalo in città. Hai una bella flotta commerciale. Non potresti rifornire la città per un po'?"
"0xcdfdf758" = "Le tue navi da guerra hanno costretto gli attaccanti a fuggire."
"0xce03abbc" = "Bucaniere spagnolo"
"0xce36d9cb" = "Convoglio di spedizione"
"0xce43a07c" = "Hai attaccato un convoglio appartenente a una nazione amica. In questo scenario le nazioni sono in pace, il che significa che non devi in nessun caso attaccare mercanti o convogli militari."
"0xce4d9a57" = "Commercio in città"
"0xce75e5c4" = "Ora hai imparato come comprare e vendere merci. Dovresti sempre comprare le merci nelle città dove vengono prodotte, perché lì sono generalmente meno care.<n><n>Nota: se vuoi commerciare con un convoglio, devi averlo selezionato e deve già trovarsi in città prima che entri nel porto.<n><n>Più avanti in questo scenario dovresti guadagnare commerciando da solo. La finestra Eventi contiene consigli per farlo.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Devi guadagnare @g$GoldGoal$ in contanti con il commercio."
