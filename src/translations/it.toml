"0xf9125b3d" = "Un convoglio pirata agli ordini di @P$PirateName$ è attualmente in libertà vicino alla città di Belize, a nordovest di Cartagena. La tua missione è distruggere il convoglio. Poi torna dal governatore di Cartagena."
"0xf91ff4fd" = "Città"
"0xf921efc0" = "Hai trovato i resti del convoglio affondato e hai preso a bordo le merci."
"0xf921efc1" = "Hai trovato i resti del convoglio di trasporto affondato, ma non c'è spazio per prendere a bordo le merci."
"0xf9256ece" = "Costi di riparazione"
"0xf9279095" = "Per una festa modesta ti servono %1 di ciascuna delle merci grano, frutta, carne, rum e vino."
"0xf9279096" = "Per una festa di media grandezza ti servono %1 di ciascuna delle merci grano, frutta, carne, rum e vino."
"0xf9279097" = "Per una festa sontuosa ti servono %1 di ciascuna delle merci grano, frutta, carne, rum e vino."
