"0xe8469fdd" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Cronaca<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>Registro<n><f:fonts/Tiepolo_black14x14aaFHk.res>%3<f:fonts/Tiepolo_bold14x14aaFH.res><t>Elenco convogli<n><f:fonts/Tiepolo_black14x14aaFHk.res>CTRL<f:fonts/Tiepolo_bold14x14aaFH.res><t>Dimensione unità nella <n><t>Finestra commerciale<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Chiudi dialogo"
"0xe84971d5" = "Moglie"
"0xe84c0654" = "Affronto un piccolo problema a @T$Town$. Ho promesso a mia moglie che avrei fatto costruire una scuola. Purtroppo i rapporti tra me e il capomastro restano estremamente ostili. Non permetterebbe mai che mi intrometta negli affari della sua città. Non potresti costruire tu la scuola per me?"
"0xe84c0655" = "Vorrei che costruissi una scuola a @T$Town$ per accrescere la ricchezza della città. In realtà @T$Town$ non significa nulla per me, ma mia sorella ci vive e non vuole ammettere che ci siano città migliori."
"0xe84c0656" = "Il viceré mi ha incaricato di sostenere la città di @T$Town$. Sarei quindi lieto di pagare una scuola in città. Tuttavia il consiglio cittadino ha respinto la mia offerta: non vogliono che mi intrometta e preferirebbero prendere direttamente l'oro. Perciò volevo chiederti se potresti costruire tu la scuola."
"0xe88ea6ee" = "Per nome del convoglio"
"0xe8925b0d" = "Duello"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>Il tuo capitano è a sinistra. Lo controlli così:<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Attacco<f:fonts/Tiepolo_bold14x14aaFH.res><n>Per attaccare, fai clic con il tasto sinistro su una parte del corpo dell'avversario. Clicca su parti diverse del corpo per aumentare le possibilità di andare a segno.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Difesa<f:fonts/Tiepolo_bold14x14aaFH.res><n>Non appena l'avversario si prepara ad attaccare, devi fare clic con il tasto destro al momento giusto per parare il colpo.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Attacchi speciali<f:fonts/Tiepolo_bold14x14aaFH.res><n>Premi il tasto sinistro del mouse subito prima che il tuo capitano sia tornato nella posizione di partenza dopo un attacco.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Resistenza<f:fonts/Tiepolo_bold14x14aaFH.res><n>Ogni attacco riduce la resistenza del tuo capitano, che si recupera tra un attacco e l'altro.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Tempo di reazione<f:fonts/Tiepolo_bold14x14aaFH.res><n>Più duelli hai vinto, più velocemente devi reagire."
