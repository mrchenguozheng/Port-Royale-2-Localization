"0x1acbcf40" = "Quale convoglio puoi offrirmi?"
"0x1af8f2c6" = "Attivo da %1"
"0x1b0a0b6d" = "Hai raggiunto il grado di \"Marinaio\". Da oggi devi fare qualcosa per mantenere la tua alta reputazione con una nazione.<n><n> Puoi migliorare la tua reputazione con le nazioni commerciando, offrendo denaro alla chiesa, organizzando festeggiamenti, distruggendo pirati, nonché portando a termine missioni e lettere di corsa.<n><n>Se la tua reputazione con una nazione non migliora, diminuisce di una quantità molto piccola ogni giorno. Nota che il numero di edifici che hai costruito nelle città di una nazione determina quanto in basso può scendere la tua reputazione in questo modo.<n><n>La tua reputazione influenza sia i prezzi commerciali sia l'assegnazione delle missioni nelle città. Se la tua reputazione è bassa, dovresti anche guardarti dai convogli militari!"
"0x1b33d8e6" = "Le merci inutilizzate possono essere trasportate!"
"0x1b407276" = "Produzione"
"0x1b416d15" = "Patrimonio"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "Il numero di cittadini (la popolazione meno il numero di soldati) a Tortuga deve essere ripristinato a @I$Pop$ entro il @D$EndDate$ al più tardi, per fare in modo che tutte le attività abbiano un organico completo di lavoratori."
"0x1b900424" = "Viaggiatore"
"0x1ba04e6b" = "Un convoglio militare appartenente a %1 è stato distrutto da navi appartenenti a %2."
"0x1ba7362a" = "Navi militari appartenenti a %1 hanno attaccato un convoglio commerciale appartenente a %2."
"0x1bcad43f" = "Oggi il bucaniere %1 %2 è entrato in città sotto falso nome e ha causato molto malcontento tra i lavoratori. Ora si rifiutano di lavorare per due settimane."
"0x1bccfb60" = "Prezzo totale"
