"0xd06e1e7e" = "Lascia la città"
"0xd07dbe34" = "I fattori più importanti che influenzano la qualità della vita in una città sono l'approvvigionamento e la varietà delle merci disponibili. Tuttavia, non devi garantire forniture di ogni tipo di merce per mantenere felici gli abitanti.<n><n>Le merci di una città si dividono in cinque gruppi: merci essenziali, materie prime, prodotti finiti, merci coloniali e merci d'importazione. Sono elencate nello stesso ordine nella finestra Commercio. Una fornitura sufficiente di due o tre merci per ciascun gruppo garantirà una buona qualità della vita nella tua città. <n><n>Hai appena ricevuto un messaggio sul tema della qualità della vita nelle città. Puoi visualizzarlo nel registro.<n><n>Poiché la tua città è ancora piccola, è particolarmente facile ottenere una buona qualità della vita, perché i cittadini delle piccole città non sono troppo esigenti. Ciò significa che non dovresti avere problemi a raggiungere il tuo obiettivo. Tuttavia, una città con meno di 2.000 abitanti non può superare lo stato \"boom\".<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Assicurati che la tua città abbia una scorta di cinque barili di ogni merce."
"0xd0b18a8e" = "nov"
"0xd0b3158e" = "Bene. Le due navi abbandonate di cui voglio che ti sbarazzi si trovano a circa due giorni a nord di Cartagena."
"0xd0b3158f" = "Eccellente! Il convoglio del pirata @P$PirateName$ si trova vicino alla città di Belize, che dista circa 5 giorni di viaggio a nord-ovest da qui. Questa città è a nord-ovest. Poi torna qui a portarmi notizia del tuo successo."
"0xd0b31590" = "A poco più di 1 giorno di viaggio a ovest di Cartagena c'è la piccola isola di Providence. Il convoglio pirata comandato da @P$PirateName$ è stato visto l'ultima volta là. Dovresti trovare il convoglio pirata comandato da @P$PirateName$ a circa 1 giorno di viaggio a nord-est da lì.<n>Distruggilo e poi torna qui a farmi un resoconto completo degli eventi."
