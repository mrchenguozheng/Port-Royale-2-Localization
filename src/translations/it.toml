"0xc9500bee" = "Congratulazioni! Hai raggiunto il tuo obiettivo e guadagnato più denaro. Hai anche raggiunto un grado superiore.<n><n>Il tuo grado è sempre determinato dal tuo patrimonio totale. Esso comprende il denaro contante e i beni, come merci e navi. Puoi controllare la tua ricchezza in qualsiasi momento sotto \"Successi\" nel registro. Ti dirà anche quando raggiungerai il grado successivo.<n><n>Più alto è il tuo grado, più convogli puoi comandare e, quindi, maggiore sarà il numero di città in cui potrai in seguito fondare imprese.<n><n>Ora che hai un grado superiore, dovresti allestire un altro convoglio e continuare a commerciare per aumentare la tua ricchezza.<n><n>Puoi controllare la tua ricchezza in qualsiasi momento posizionando il cursore sulla barra blu che indica la tua ricchezza, mostrata sotto questa finestra. <n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Allestisci un secondo convoglio e aumenta il tuo patrimonio totale a @g$GoldGoal$."
