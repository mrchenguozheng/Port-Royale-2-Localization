"0xedad5b61" = "Non sei riuscito ad aumentare la popolazione di Tortuga fino a @I$Pop$ entro e non oltre 20 giorni dalla fine della peste. <n><n>Non appena lo stato di una città raggiunge \"Boom\" o superiore, si possono assumere nuovi lavoratori. Puoi fornire nuovi lavoratori alla città sotto forma di famiglie di coloni. Queste viaggiano dall'Europa alle città dei governatori, dove attendono un passaggio per altre città. Troverai coloni in attesa di essere imbarcati anche nelle città con uno stato inferiore."
"0xedc30aca" = "<ts:75><ts:150><ts:225><ts:300>Un'infestazione di ratti ha distrutto il cibo nei tuoi magazzini. Le infestazioni di ratti si verificano spesso se i commercianti accumulano troppo cibo nei magazzini.<n><n>Perdite:"
"0xedffe567" = "Seleziona moschettiere"
"0xee00c4df" = "<n><n>Di solito puoi restituire un permesso di costruzione che hai ottenuto. In questo caso però non puoi, perché %1 è la città in cui hai iniziato il gioco."
"0xee00c4e0" = "<n><n>Un commerciante locale ti offre %1 per il tuo permesso e i tuoi edifici. Vuoi accettare l'offerta? Ricorda che poi perderai tutti i tuoi edifici in questa città."
"0xee0f745a" = "<g:INTEXT_SCHATZKISTE_800x600.screen>"
