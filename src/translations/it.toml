"0xeb1ce06e" = "Il convoglio trova tua moglie alla deriva su una zattera. Dice che i pirati l'hanno abbandonata, perché la faccenda riguardava solo loro e te."
"0xeb1ce06f" = "Alla fine il convoglio trova tua moglie, alla deriva in mare. È priva di sensi, ma dopo un po' rinviene:<n>\"Quel buffone mi ha rapita! Credeva davvero che volessi fuggire con lui solo perché gli ho sorriso con educazione un paio di volte.\""
