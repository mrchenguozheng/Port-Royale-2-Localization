"0xd44a911d" = "Congratulazioni! Ora hai un po' di esperienza nella produzione di merci. Avrai anche notato che non è sempre facile vendere con profitto le merci che produci mantenendo in piedi la tua impresa commerciando altre merci.<n><n>Se fondi imprese in scenari successivi o in modalità libera, devi sempre assicurarti di poter vendere con profitto le merci prodotte. Produrre merci è costoso e trovare le materie prime non è sempre facile.<n><n>Per questo motivo, dovresti prima accumulare riserve finanziarie commerciando e poi iniziare molto gradualmente a produrre merci. "
