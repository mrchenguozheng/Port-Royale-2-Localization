"0x31ed47e7" = "Un sabotatore ha contaminato le scorte alimentari di Tortuga. Questo ha subito scatenato una carestia in città.<n><n>Il tuo compito è porre fine a questa carestia il più in fretta possibile.<n><n>Per circa 2-3 settimane devi garantire che, per quanti più generi alimentari possibile, le merci disponibili siano più di quelle consumate ogni giorno.<n><n>Suggerimento: i generi alimentari comprendono frumento, frutta, mais e carne.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La carestia deve finire entro @D$EndDate$."
