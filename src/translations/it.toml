"0x15d8bad1" = "Bene! La città in questione è @T$TargetTown$. Per portarla all'obbedienza, il viceré di @n$TargetNation$ ha vietato a tutti i mercanti di salpare verso la città. Se riusciremo a ripristinare la ricchezza rifornendo la città, potremo di certo contare sulla fedeltà dei suoi cittadini. Hai tempo fino al @D$EndDate$ per completare questa missione."
"0x15d8bad2" = "Mi riferisco alla città di @T$TargetTown$. A tutti i mercanti è stato vietato di salpare verso la città. La tua missione è rifornirla per ripristinarne la ricchezza. In questo modo possiamo rendere chiaro il nostro interesse per @T$TargetTown$. Hai tempo fino al @D$EndDate$ per portare a termine la tua missione."
"0x15d8bad3" = "La faccenda è questa: il viceré ha vietato a tutti i mercanti di salpare verso la città di @T$TargetTown$. Così facendo vuole esercitare pressione sul consiglio cittadino. Se riuscirai a rifornire @T$TargetTown$ di merci sufficienti perché la ricchezza venga ripristinata entro il @D$EndDate$, non ho dubbi che potrò organizzare un cambio di fedeltà nazionale pacifico."
