"0x343cc312" = "Il convoglio è sovraffollato"
"0x343e9f4b" = "Congratulazioni! Ora conosci le basi della costruzione di una città.<n><n>Appena il tuo impianto di produzione è costruito, inizia automaticamente ad assumere lavoratori. Ogni colono in attesa al porto per essere assunto può essere convertito in un lavoratore e quattro cittadini. Ciò significa che un colono rappresenta in realtà un'intera famiglia di coloni.<n><n>Per assicurarti che le tue attività abbiano abbastanza lavoratori, devi garantire che sia disponibile un numero sufficiente di coloni per il lavoro. I convogli di trasporto portano i coloni dall'Europa alle città con governatore, e poi i mercanti li portano alle altre città<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Assicurati di avere abbastanza lavoratori per la tua attività a Santa Marta."
"0x344b915f" = "Mercante del governatore"
"0x34669be1" = "Tortuga non ha raggiunto in tempo lo status \"Ricca\". Ogni singola merce influenza lo status di una città. Se c'è una scorta sufficiente di una merce per 10 giorni, quella merce avrà il miglior effetto possibile sulla qualità della vita dei cittadini e quindi sullo status della città. "
