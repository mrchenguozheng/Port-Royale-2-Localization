"0x084340c7" = "Questo scenario impegnativo riguarda tutto il commercio, la produzione e l'approvvigionamento di merci in una città.<n:25>A Tortuga stanno succedendo cose strane: quasi nessun mercante vuole visitare la città e diversi eventi rendono la vita difficile ai suoi cittadini. Il tuo compito è salvare la città dalla rovina. Alla fine dello scenario verrà mostrato il tuo punteggio. Dipende dalla tua rapidità e dalla tua ricchezza alla fine dello scenario.<n:25>In questo scenario puoi usare tutte le opzioni offerte dalla modalità libera, ma avrai anche obiettivi specifici da raggiungere."
