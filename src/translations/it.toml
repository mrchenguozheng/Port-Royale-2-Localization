"0x061848e4" = "Hai sabotato la città di @T$TargetTown$ e ti ringrazio a nome della mia nazione. Ho una ricompensa molto speciale per te. Ho convinto un capitano molto esperto a unirsi a te. Si chiama @N$CaptainName$ e ti aspetta alla locanda."
"0x061b50a1" = "Vuoi comprare una lettera di corsa per %1 e dare la caccia alle navi dei nostri nemici a nome della Francia?"
"0x0625c88f" = "Nazioni"
"0x062a6d44" = "Bene! Il convoglio è salpato da @T$HostileTown$ in direzione dell'Europa e lascerà i Caraibi a est. Perquisisci l'intera rotta alla ricerca dei documenti e portameli entro il @D$EndDate$."
"0x062a6d45" = "Mi sei di grande aiuto! Se tutto va secondo i piani, il timoniere getterà segretamente i libri in mare, uno dopo l'altro. La nave è salpata da @T$HostileTown$, diretta in Europa. Segui la nave e recupera i libri. Portameli entro il @D$EndDate$."
"0x062a6d46" = "Ottimo. La nave ha già lasciato il porto di @T$HostileTown$ diretta in Europa. Tuttavia trasporta un passeggero che ha ancora un debito verso di me. Perquisirà la nave alla ricerca dei documenti e li getterà segretamente in mare, uno dopo l'altro. La tua missione è recuperare i documenti e portarmeli entro il @D$EndDate$."
"0x063dfcc8" = "%1 sconfitto"
"0x064021d3" = "Le difese del porto sono distrutte e il tuo equipaggio attracca nel porto. La guardia cittadina non si vede da nessuna parte.<n><n>Cosa vuoi fare ora?"
