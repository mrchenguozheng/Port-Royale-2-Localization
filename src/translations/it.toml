"0xe386ebc4" = "Responsabile QA"
"0xe38814c2" = "Stato del convoglio"
"0xe38974d7" = "Saldo:"
"0xe3922641" = "L'ago di questa bussola si muove molto liberamente e si assesta in posizione molto rapidamente. Non hai mai visto una bussola così precisa.<n>La bussola è lavorata come un gioiello e il lato inferiore è ornato di varie incisioni."
"0xe3922642" = "Il compasso a due punte si adatta magnificamente alla mano ed è molto facile da usare. Sembra fatto interamente d'oro ed è decorato con un motivo intricato."
"0xe3922643" = "Questo sestante dà un rilevamento preciso anche in mare grosso. Alcune parti del sestante sono montate su molle, il che aiuta a ridurre le vibrazioni forti."
"0xe3922644" = "Questo strumento è un cannocchiale doppio che permette di vedere in lontananza con entrambi gli occhi contemporaneamente. Puoi far scorrere del vetro colorato sulla lente per proteggerti gli occhi . Sul lato si distingue un'incisione misteriosa."
"0xe3922645" = "È un normale orologio d'oro, ma è più piccolo di qualsiasi altro tu abbia mai visto. Su un disco dietro il quadrante noti anche una luna che sembra ruotare lentamente. Ci sono anche alcune incisioni sul retro dell'orologio."
"0xe3922646" = "Questa lampada è simile a una normale lanterna. Tuttavia intorno al lucignolo acceso sono disposti molti specchi, così che la luce si irradia in una sola direzione. Con un dispositivo che ricorda un ventaglio sopra l'apertura, puoi accendere e spegnere la luce emessa molto rapidamente."
"0xe3922647" = "Un righello che può scorrere avanti e indietro è inserito in un altro righello. A questo è fissato un supporto scorrevole di materiale trasparente. Potresti usare questo dispositivo per eseguire calcoli semplici molto rapidamente."
"0xe3922648" = "Questo strano dispositivo sembra una freccia. Le sue palette lo fanno ruotare non appena lo tieni nell'acqua. Un piccolo quadrante conta ogni giro, permettendoti così di calcolare con grande precisione la velocità della nave."
"0xe3922649" = "Questo strumento è composto da palette rotanti e da un quadrante che mostra la velocità di rotazione delle palette. Tenendo le palette nel vento puoi leggere la direzione e la velocità del vento. Lo strumento è realizzato con cura meticolosa e reca un simbolo sconosciuto."
"0xe392264a" = "Sebbene questa corda sia stata esposta all'acqua di mare per qualche tempo, sembra appena fatta. Al tatto è meravigliosamente liscia e annoda nodi molto saldi."
"0xe39226b2" = "Questo foglio contiene una moltitudine di bellissime carte stellari. Una grande tabella specifica con precisione quando e dove sorge e tramonta ogni singola stella."
"0xe39226b3" = "Un disco rotondo, finemente inciso, in cui sono inseriti vari dischi rotondi più piccoli. Potresti usarlo per vedere quale parte del cielo stellato è attualmente visibile, a seconda della data e dell'ora.<n>I segni sul disco mostrano che questo strumento serviva un tempo a determinare la posizione di una nave in una particolare regione."
"0xe39226b4" = "Quando giri una manovella, un grande corno emette i toni soavi di una donna che canta. Proprio ciò che serve ai marinai in mare da settimane."
"0xe39226b5" = "Un grande pezzo di vetro arrotondato è montato sull'estremità di un'asta dorata. Se lo tieni sopra una mappa, le linee più sottili sono chiaramente visibili anche con poca luce."
"0xe39226b6" = "Questo piccolo tavolo metallico è di ottone massiccio ed è costruito in modo che la sua superficie resti sempre orizzontale, indipendentemente dal beccheggio della nave. L'anello metallico esterno è inciso con segni che sembrano indicare direzioni. Tuttavia non riesci a identificare la regione in cui il tavolo fu un tempo usato."
"0xe39226b7" = "Una piccola scatola contiene un dispositivo ornato che può essere usato per accendere un fuoco molto facilmente. Questa scatola è coperta di incisioni misteriose."
"0xe39226b8" = "Questa ancora è più decorativa che pratica. Nel migliore dei casi potrebbe servire ad ancorare una barca a remi.<n>È molto pesante per le sue dimensioni ed è coperta di decorazioni intricate e di lettere sconosciute."
"0xe39226b9" = "Questo dispositivo è come una lampada a olio con la propria pietra focaia. Se giri la piccola ruota, le scintille volano su un lucignolo e possono accendere una fiamma anche con vento forte."
"0xe39226ba" = "Questo corno non si suona con la bocca, ma usando un dispositivo che ricorda una pompa. Se lo premi con forza, il corno suona più forte di quanto avresti creduto possibile."
"0xe39226bb" = "Questa carta nautica è molto diversa dalle normali carte marine disponibili. È molto dettagliata ed è stata tracciata con diversi colori. Tuttavia non riesci a identificare quale area vi sia raffigurata."
"0xe39bb702" = "Il convoglio non può salpare perché a bordo ci sono troppi cannoni. Vendi alcuni dei tuoi cannoni o spostali nel tuo magazzino per non superare il numero massimo di cannoni."
