"0xf52fee2f" = "Combatti contro pirati, bucanieri e convogli militari delle nazioni nemiche.<n><n>Cimentati nella caccia ai convogli commerciali come bucaniere.<n><n>Parti alla ricerca della leggendaria flotta del tesoro spagnola.<n><n>Comanda 16 diversi tipi di nave."
"0xf52fee30" = "Guida il tuo capitano attraverso duelli con altri capitani e pirati.<n><n>Completa innumerevoli missioni che coinvolgono battaglie, commercio e politica."
"0xf52fee31" = "Visita le città di 4 nazioni diverse con diversi insiemi di edifici<n><n:10>Goditi una ricca varietà di immagini muovendoti tra paesaggi diversi.<n><n:10>Saccheggia e conquista città per la tua nazione preferita<n><n:10>Costruisci le tue città<n><n:10>Compra le attività di altri mercanti e crea monopoli sulle merci<n><n:10><o:0xFFFFEB7D>...conquista l'intero Caribe con la forza!"
