"0x0adb3fdd" = "Sapevo di potermi fidare di te. Riguarda la città di @T$TargetTown$, che appartiene a @n$HostileNation$. Attacca la città e saccheggiala quanto ti pare, poi cerca mia moglie. Non tardare, perché mi hanno dato tempo di pensarci solo fino al @D$EndDate$.<n><n>Se non possiedi ancora una lettera di corsa contro @n$HostileNation$, te ne darò una."
"0x0adb3fde" = "Mia moglie sarà al settimo cielo. Il barboncino Michelle è nascosto a @T$TargetTown$. Saccheggia la città in modo che sembri una missione militare e poi cerca il cane. Hai tempo fino al @D$EndDate$.<n>Credimi, non mi farà piacere rivedere quel cane, ma i singhiozzi di mia moglie non accennano a placarsi.<n><n>Se non possiedi ancora una lettera di corsa contro @n$HostileNation$, te ne darò una."
