"0x0ce1a79e" = "Ti trovi nella città coloniale di Santa Marta. Fai clic sul nome della città per visualizzare le informazioni sulla città."
"0x0ce1a79f" = "Le città coloniali come Santa Marta possono produrre due beni di prima necessità, due materie prime e una merce coloniale.<n>Nell'ultimo scenario hai imparato che nelle città con governatore c'è una domanda particolarmente alta di materie prime e merci coloniali.<n>Vuoi produrre prima la merce coloniale cacao.<n>Ora chiudi le informazioni sulla città."
"0x0ce1a7a0" = "Poiché le merci coloniali vengono spedite in Europa dalle città con governatore, la domanda di cacao in queste città è alta. Queste condizioni sono favorevoli per la tua prima attività. Ora individua e fai clic sull'edificio del capomastro al centro della città."
"0x0ce1a7a1" = "Dal capomastro puoi richiedere il permesso di costruire un nuovo edificio o restituire il tuo permesso di costruzione. Naturalmente non è quello che vuoi fare ora!<n>Guarda i diversi edifici che puoi costruire. Puoi anche usare i pulsanti a destra della finestra del capomastro.<n>Fai clic sul pulsante Piantagione di cacao."
"0x0ce1a7a2" = "Ora puoi vedere quanti materiali da costruzione servono e quali saranno i costi di costruzione.<n>Puoi anche vedere quanti materiali da costruzione hai attualmente nel magazzino e quanti dovrai comprarne dalla città.<n>Al momento hai materiali sufficienti.<n>Posiziona il cursore su un lotto edificabile disponibile e fai clic sinistro."
"0x0ce1a7a3" = "Ora viene mostrata l'impalcatura dell'impianto di produzione del cacao e la costruzione inizia.<n>Ci vorranno un paio di giorni perché la costruzione sia completata. Nel frattempo dovresti organizzare l'alloggio per i tuoi nuovi lavoratori.<n>Chiudi il menu Costruzioni e cerca una zona residenziale a Santa Marta. "
"0x0ce1a7a4" = "Questa zona residenziale appartiene a un mercante della città. Puoi verificare quante zone residenziali sono di proprietà dei mercanti locali e quanti inquilini hanno. Vuoi costruire una tua zona residenziale. Per farlo, apri il menu Costruzioni."
"0x0ce1a7a5" = "Seleziona una zona residenziale nel menu Costruzioni e guarda la visualizzazione dei costi di costruzione. <n>Potresti non avere abbastanza materiali da costruzione in deposito. Tuttavia puoi comprare in città i materiali che ti servono, se ce ne sono in quantità sufficiente. <n>Altrimenti dovrai procurarteli in un'altra città.<n>Poi costruisci una zona residenziale."
"0x0ce1a7a6" = "Un'attività può impiegare 30 lavoratori. Poiché in una famiglia di un lavoratore medio ci sono quattro membri, per ogni attività che stabilisci servono alloggi per 120 persone. <n>Una zona residenziale ha spazio per 120 inquilini, quindi per ogni attività serve una zona residenziale.<n>Ora chiudi il menu Costruzioni e fai clic sulla tua nuova zona residenziale."
"0x0ce1a7a7" = "Non c'è un periodo di costruzione per una zona residenziale, perché all'inizio gli inquilini vivono in tende.<n>Con il tempo sono gli inquilini stessi a trasformare la zona residenziale in un edificio molto grande.<n>L'aspetto di una zona residenziale dipende dalla sua età e dallo stato della città.<n>Chiudi la finestra della zona residenziale."
"0x0ce1a80f" = "Come sai, il tuo primo edificio in una città deve sempre essere un magazzino. Non puoi costruire altri edifici finché non l'hai costruito.<n>Hai già un magazzino nella città in cui hai iniziato il gioco. Trovalo e fai clic su di esso. Sullo schermo è mostrato in azzurro."
"0x0ce1a810" = "Nel magazzino puoi vedere quali edifici possiedi in città e quanto costa mantenerli.<n>Puoi anche vedere quanto affitto ti pagano i tuoi inquilini e quali merci producono le tue attività.<n>Più avanti potrai dare istruzioni al magazziniere.<n>Dai un'occhiata al magazzino e poi chiudilo."
"0x0cee08cc" = "la presenza militare in questa città potrebbe essere migliore"
"0x0cf75014" = "Chiudi"
"0x0cf7abef" = "Fai clic sulla tua piantagione di cacao. La visualizzazione mostra sempre tutte le tue piantagioni di cacao in città.<n>Una volta costruite le tue strutture produttive, avrai bisogno di 30 lavoratori, cioè di 30 coloni. Ora lascia la piantagione, vai ai moli del porto e premi il pulsante \"Carico\" (l'ultimo pulsante a destra)."
"0x0cf7abf0" = "Qui puoi vedere se in città ci sono coloni in attesa di essere assunti o se la città ha bisogno di nuovi lavoratori. Sarà così non appena la costruzione della tua attività sarà completata.<n><n>Vai nelle città con governatore dei dintorni e porta coloni a Santa Marta finché la tua attività non impiegherà un numero completo di lavoratori."
"0x0d0db040" = "Fai clic su una delle tue piantagioni di cacao."
"0x0d0db041" = "Ora puoi vedere quanto cacao produce ogni giorno la tua attività e quanti attrezzi servono.<n>Ora accumula una scorta di @a$SubGoal$ di attrezzi nel tuo magazzino, perché è il tuo magazzino a rifornire le tue attività."
"0x0d0db042" = "Gli attrezzi sono merci importate. Questo significa che troverai l'offerta più abbondante e i prezzi più bassi nelle città con governatore.<n>Potresti provare a procurartene un po' a Cartagena, a sudovest, o molto a est a Margarita ."
"0x0d0db043" = "Ben fatto!<n>Più basso è il prezzo medio delle materie prime che ti servono, più bassi sono i tuoi costi di produzione per le merci che produci.<n>Ora continua a produrre cacao fino ad avere una scorta di @a$AmountGoal$ nel tuo magazzino."
"0x0d0f1795" = "Luglio"
"0x0d0f1877" = "Giugno"
"0x0d1098bd" = "%1,<n>sei nuovo qui, vero? Ma ho già sentito parlare di te, e la tua buona nomea ti precede. Dovresti venirmi a trovare ogni tanto, perché c'è sempre qualche lavoro da fare."
"0x0d23b491" = "Naviga con il tuo convoglio verso la città di Cartagena ed entra in città.<n>Sotto il nome della città, a destra dello schermo, viene mostrato un piccolo simbolo a cerchio. Mostra il tuo record commerciale a Cartagena fino ad ora.<n>In questo scenario le cose sono un po' più facili per te, perché hai ricevuto un bonus.<n>Ora apri le informazioni sulla città."
"0x0d23b492" = "Alla voce \"Record commerciale\" puoi ora verificare quale percentuale del punteggio richiesto hai già raggiunto. Se qui è visualizzato 100%, puoi richiedere un permesso al capomastro.<n>Chiudi le informazioni sulla città."
"0x0d23b493" = "I prezzi delle merci scarse in una città sono mostrati in rosso nella finestra di commercio. Se vendi queste merci, migliorerai sia il tuo record commerciale in città sia la tua reputazione con la nazione a cui appartiene la città.<n>Fai clic una volta sui moli per visualizzare le informazioni sulle scorte di merci in città."
"0x0d23b494" = "Nota quali merci mancano in città. Per esempio, la città avrà sempre bisogno di zucchero e cotone, perché produce rum e indumenti.<n>Ma in città ci sono anche altre merci scarse.<n>Vai in altre città a comprare le merci di cui Cartagena ha bisogno e migliora il tuo record commerciale."
"0x0d23b495" = "Niente male! Hai notevolmente aumentato la tua presenza a Cartagena.<n>Ma attento a non accaparrarti le merci scarse a Cartagena! Riconosci facilmente le merci scarse perché le scorte di queste merci sono visualizzate in rosso.<n>Aumenta il tuo punteggio del record commerciale all'85%."
"0x0d23b496" = "Ben fatto! Ora hai un punteggio dell'85% a Cartagena. Continua così!<n>Aumenta il tuo punteggio al 100%.<n>A proposito, hai appena ricevuto un messaggio su \"promozioni e gradi\"."
"0x0d23b497" = "Eccellente! Ora hai commerciato abbastanza con Cartagena.<n>Purtroppo il tuo grado è ancora Marinaio semplice, quindi può esserti concesso un solo permesso.<n>Per essere promosso al grado successivo, devi aumentare la tua ricchezza commerciando ancora un po'. "
"0x0d23b498" = "Molto bene! Come Marinaio puoi ottenere due permessi di costruzione.<n>Vai dal capomastro a Cartagena e richiedi un permesso.<n>Se non hai abbastanza oro, devi commerciare di più. Non dimenticare di commerciare le merci che produci a Santa Marta."
"0x0d2a3b89" = "Mantenimento della nave"
"0x0d39b8e2" = "Devi prima costruire un magazzino a Cartagena prima di poter costruire altri edifici."
"0x0d39b8e3" = "Ora crea due tessitorie e costruisci due zone residenziali.<n>Se in città non ci sono abbastanza materiali da costruzione, devi comprarli in un'altra città e consegnarli al tuo magazzino ai moli. <n>Non dimenticare di negoziare un prezzo prima di separarti dal tuo prezioso oro!"
"0x0d39b8e4" = "Dovresti assicurarti di avere una scorta di @a$SubGoal$ di cotone nel magazzino quando le tue tessitorie saranno costruite, così che le nuove attività possano iniziare subito a tessere stoffa dal cotone."
"0x0d39b8e5" = "Il tuo prossimo obiettivo è produrre una tua scorta di @a$SubGoal$ di stoffa per il magazzino a Cartagena e aspettare che le tue tessitorie siano costruite.<n>Per @a$SubGoal$ di stoffa ti serve esattamente @a$SubGoal$ di cotone. "
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Militare<t>Le tue navi di scorta e mercantili<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Pirata<t>Le tue navi di scorta e mercantili<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "Partita salvata non valida!"
"0x0d496e89" = "Fai clic sulle merci per attivare o annullare l'acquisto."
"0x0d496e8a" = "Acquisto automatico da parte del magazziniere"
"0x0d4fbd33" = "Molto bene!<n>Per assicurarti di avere sempre abbastanza materie prime per le tue tessitorie, dovresti ora creare un'attività di cotone a Santa Marta.<n>Un impianto di produzione può fornire materie prime sufficienti per due impianti di lavorazione."
"0x0d4fbd34" = "Ora assicurati che le tue attività a Santa Marta e Cartagena funzionino a pieno regime.<n>Non dimenticare che le tue tessitorie a Cartagena richiedono un rifornimento costante di cotone.<n>Continua a commerciare e a vendere le merci che produci.<n>Questo scenario terminerà non appena avrai aumentato il tuo contante a @g$GoldGoal$."
"0x0d552127" = "La città non può essere attaccata"
"0x0d578089" = "Hai già attaccato la città di %1 negli ultimi 30 giorni. Il capitano si rifiuta di attaccarla di nuovo per ragioni morali."
"0x0d58ea99" = "Il bucaniere %1 %2 ha sottratto %3 lavoratori e le loro famiglie. Molte attività in città ora non funzionano più a pieno regime."
"0x0d750c45" = "%1 convogli"
"0x0d919a5a" = "%1,<n>sai bene che in circostanze normali ti manderei all'inferno, ma in tempi disperati come questi venderei l'anima al diavolo in persona.<n><n>Quindi entra, ho qualcosa da dirti."
"0x0d9c1799" = "Il tuo compito è fare in modo che lo stato della città di @T$TargetTown$ scenda a \"Recessione\" entro il @D$EndDate$. Qui hai due opzioni:<n><n>Oppure attacchi la città e saccheggi tutte le merci per provocare lo stato \"Ripresa\". Lo stato della città continuerà poi a peggiorare per la scarsità di merci.<n><n>In alternativa puoi tagliare il rifornimento di merci alla città intercettando i convogli commerciali. Nota: se ti limiti a saccheggiare un convoglio e non lo catturi, la tua reputazione con la nazione in questione subirà un danno molto minore."
"0x0d9c179a" = "Bene! Ti affido la missione di far cadere la città di @T$TargetTown$ nello stato di \"Recessione\". Hai tempo fino al @D$EndDate$.<n><n>Per raggiungere il tuo obiettivo devi intercettare tutti i mercanti che visitano la città, così che non riceva più merci e il suo stato cominci lentamente a peggiorare.<n><n>Tuttavia c'è un modo per farlo più in fretta: attaccare e saccheggiare la città. Il tuo attacco farà precipitare rapidamente lo stato a \"Ripresa\" e la conseguente scarsità di merci in città lo farà scendere ancora, finché la città non sarà in \"Recessione\"."
"0x0daa656f" = "Mitraglia"
"0x0dbd9444" = "Non c'è nulla che tu possa fare per me."
"0x0dbd9445" = "Purtroppo al momento non ho notizie per te. Riprova più tardi."
"0x0dbd9446" = "Temo di non avere missioni per te. Torna a trovarmi tra qualche giorno."
