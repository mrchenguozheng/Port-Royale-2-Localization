"0x070c60f9" = "Ti ringrazio. Portami @a$Amount$ di @G$Goods$. Hai tempo fino al @D$Date$ per consegnare le merci al mercato. Lì riceverai @g$GoldPerBarrel$ per ogni <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fa" = "Consegna @a$Amount$ di @G$Goods$ ai miei emissari al mercato. Hai tempo fino al @D$Date$. Alla consegna riceverai @g$GoldPerBarrel$ per ogni <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fb" = "Naviga verso le città di @n$FoeNation$ e raccogli @G$Goods$. Consegna @a$Amount$ al mercato della mia città entro il @D$Date$. Riceverai @g$GoldPerBarrel$ per ogni <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
