"0xf353a9ce" = "Sono felice di vederti, @A$USER$. Ho perso un pacco mentre venivo qui. Potresti trovarlo per me?"
"0xf353a9cf" = "Salve! Possiedi una nave? Ho perso la mia in una recente tempesta. Per fortuna sono riuscito a salvarmi, ma ho perso il baule con molti dei miei effetti personali più preziosi. Potresti salpare e vedere se il mio baule galleggia ancora da qualche parte in mare? Ti ricompenserò generosamente, perché il baule è molto prezioso per me."
