"0x1f32f588" = "Scenario fallito"
"0x1f36e96b" = "Un convoglio di trasporto arriverà qui a breve. Una spia mi ha detto che il nostro nemico progetta di attaccare questo convoglio nel suo viaggio di ritorno in Europa. Puoi proteggere il convoglio sulla via di casa? "
"0x1f36e96c" = "Ho un problema. Mia moglie vuole viaggiare in Europa sul prossimo convoglio, per visitare la sua famiglia. Purtroppo @n$HostileNation$ l'ha saputo e progetta di intercettare il convoglio. Puoi garantire a mia moglie un passaggio sicuro?"
"0x1f36e96d" = "Presto invierò documenti importanti in Europa. Poiché siamo attualmente in guerra con @n$HostileNation$, non voglio correre rischi e voglio organizzare una scorta aggiuntiva. Potresti fornire tu questa scorta? "
"0x1f6696d2" = "Spiacente, alla fine non posso darti questa missione. Ho appena ricevuto un messaggio che mi dice che il problema non esiste più."
"0x1f851477" = "Il convoglio che doveva portare a termine questa missione è stato distrutto."
"0x1f890b43" = "Domanda di merci"
"0x1f9a14b7" = "<n><n>Per attaccare il covo devi inviarvi un convoglio nello stesso modo in cui lo invieresti a una città. Attenzione! Qualsiasi convoglio pirata non presente nel covo quando attacchi verrà avvertito e allestirà un nuovo covo."
"0x1fb02f3a" = "Salva"
"0x1fcb6529" = "Termina la battaglia navale"
"0x1fd35f28" = "Arte dell'animazione"
"0x1fdba107" = " La sua paga giornaliera è %1."
"0x1fe06eb2" = "Capacità<n>%1%"
"0x1fe25594" = "Dopo aver sfondato le difese del porto, il tuo convoglio attracca e i marinai si fanno strada per la città. Lungo la via incontrano il comandante della guardia cittadina. Si rifiuta di farsi da parte se non viene sconfitto in un duello leale. Il tuo capitano accetta la sfida."
"0x1fea1f37" = "Terminare questa partita e caricare la partita salvata?"
"0x1ff731c7" = "Salva rotta commerciale"
"0x200d4e11" = "%1 %2 %3"
"0x20252656" = "Oro scoperto a %1"
"0x20413ba0" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
"0x204cf373" = "Sostieni la città"
"0x204d1e7c" = "Un covo di pirati può essere attaccato solo dal mare."
"0x20574fcc" = "%1, hai conquistato per %2 l'amata città di mio padre! Non voglio più avere nulla a che fare con te. Spero di non rivederti mai più. Sappi che non hai mai significato nulla per me e che non ti dedicherò un pensiero in futuro.<n>Spero sinceramente che, prima o poi, riceva la punizione che tanto meriti.<n><n>%3"
"0x20574fcd" = "%1, compiendo l'annessione per %2, hai costretto il viceré a trasferirsi nell'amata città di mio padre, che ora deve tornare in Europa.<n><n>Non voglio più avere nulla a che fare con te. Spero di non rivederti mai più. Voglio anche che tu sappia che mi interessavano sempre molto più i mercanti della locanda di quanto sia mai stato interessata a te. Non hai mai significato nulla per me e d'ora in poi sarai l'ultimo dei miei pensieri.<n><n>Spero sinceramente che, prima o poi, riceva la punizione che tanto meriti.<n><n>%3"
"0x2065f070" = "Guarda qui. Ho appena ricevuto un messaggio dal mio ambasciatore che mi informa che %1 ci ha fatto un'inattesa offerta di pace. Questo significa che probabilmente faremo pace già da oggi. <n><n>Pertanto non posso più assegnarti una missione per conquistare una città."
"0x207295a1" = "Esiste già una rotta commerciale con il nome '%1'.<n><c>Vuoi sovrascriverla?"
"0x2077407d" = "%1,<n>sono contento che tu sia venuto. Entra e vedrò se ho qualcosa per te."
"0x207a9d35" = "Il comandante della guardia cittadina chiama il tuo capitano dalla cinta muraria, chiedendogli di rinunciare alla battaglia e di affrontarlo invece in duello. Per evitare altre perdite, il tuo capitano accetta."
"0x207b620f" = "Dopo che le tue truppe hanno distrutto la porta della città, si trovano di fronte il comandante della guardia cittadina. Sfida il tuo capitano a duello."
"0x208aca1b" = " Tieni d'occhio i convogli inglesi nella zona e distruggine @I$NumConvoys$."
"0x208aca1c" = " Tieni d'occhio i convogli francesi nella zona e distruggine @I$NumConvoys$."
"0x208aca1d" = " Tieni d'occhio i convogli olandesi nella zona e distruggine @I$NumConvoys$."
"0x208aca1e" = " Tieni d'occhio i convogli spagnoli nella zona e distruggine @I$NumConvoys$."
