"0x0a49c903" = "Congratulazioni! Hai completato con successo il secondo scenario. Hai imparato a commerciare con profitto, hai raggiunto un grado superiore e hai messo insieme un nuovo convoglio assumendo un nuovo capitano.<n><n>Nota che più esperienza hanno i capitani, più costano. Di solito all'inizio hanno pochissima esperienza ma, con il tempo, tutti i capitani acquisiscono esperienza nella navigazione, nel commercio e nel combattimento, a seconda di come li impieghi. Puoi controllare i livelli di esperienza attuali dei tuoi capitani nella Panoramica di un convoglio. Per farlo, fai clic su un convoglio e poi sul pulsante \"Panoramica e costi\".<n><n>Nel prossimo scenario creerai le tue attività e produrrai merci. "
