"0x0f1ade15" = "Ora dovresti creare posti di lavoro in città e costruire zone residenziali.<n><n>Poiché i coloni resteranno nella tua città solo se ci trovano lavoro, dovresti prima costruire quattro impianti di produzione. Decidi quali impianti di produzione vuoi costruire. Ma assicurati di produrre solo merci che potrai vendere con profitto in altre città, perché i costi di produzione sono alti e dipendi dai profitti che ricavi vendendo le merci.<n><n>Quattro impianti di produzione offrono lavoro a 120 lavoratori. Poiché ciascuno di questi lavoratori fa parte di una famiglia di quattro persone, devi fornire alloggi per 480 cittadini, in altre parole quattro zone residenziali.<n><n>Non appena i tuoi impianti di produzione e le zone residenziali sono pronti, puoi provare a portare coloni da altre città nella tua. I coloni di solito aspettano lavoro nelle città con governatore. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumenta la popolazione della tua città a 480."
