"0x2796edbb" = "%1 catturata"
"0x27beb2d9" = "Saccheggia @a$Amount$ di spezie, vino e attrezzi dai convogli di trasporto appartenenti a @n$HostileNation$. Non devi catturare né affondare alcuna nave. Poi consegna queste merci al mercato di @T$TOWN$ entro il @D$EndDate$. Dopodiché potrai ritirare la tua ricompensa dal governatore."
"0x27e88b91" = "Costruisci una chiesa e aumenta la popolazione della tua città a 2.200. Hai tempo fino al @D$EndDate$."
"0x2806bf85" = "Il convoglio non può salpare perché a bordo ci sono troppi marinai. Licenzia alcuni marinai per non superare il numero massimo di equipaggio consentito."
"0x282e1ded" = "Conquista per %1 entro %2 una città coloniale appartenente a %3 . La città non deve essere sede di un governatore o del viceré."
