"0xf92d7da5" = "%1%"
"0xf932eef8" = "Congratulazioni! Hai completato con successo questo scenario e ora sai come costruire la tua città.<n><n>Nella modalità libera il viceré di qualsiasi nazione può concederti in dono una tua città. Ma non è facile ottenerlo, perché per ricevere un appezzamento di terra devi sempre conquistare città, e questo naturalmente danneggia la tua reputazione presso le altre nazioni. <n><n>Quanto hai imparato in questo scenario sullo sviluppo della tua città ti aiuterà a sviluppare attività anche in altre città. La differenza principale è che non devi preoccuparti di difendere quelle città."
"0xf934d153" = "(Nessun effetto)"
"0xf93656ab" = "IDM_CONTEST_01_2004_LOG_00_HDR"
"0xf93abe1a" = "Migliora la tua reputazione con la Spagna fino a \"amichevole\"."
"0xf93ea2aa" = "Un appezzamento di terra"
"0xf9404c18" = "Posso segnare sulla carta nautica l'ubicazione approssimativa del suo convoglio. @l$ConvoyPos$ Sta a te decidere se distruggere questo convoglio o no. Devi però completare questa missione entro @D$EndDate$."
"0xf9404c19" = "Temo di non poterti dire dove trovare uno dei convogli di Barbanera, perché al momento si trovano in un luogo segreto. Ti concedo però molto tempo per questa missione. Hai tempo fino al @D$EndDate$ per distruggere un convoglio."
"0xf9462f72" = "La tua attività a Santa Marta dovrebbe impiegare un numero completo di lavoratori."
"0xf94c02c2" = "Per il prestito di %1 che mi hai concesso, riceverai la somma concordata di  %3 il %2."
