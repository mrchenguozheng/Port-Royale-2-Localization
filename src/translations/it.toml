"0xe4233be0" = "In questo scenario devi aiutare le colonie olandesi ad acquisire nuove città.<n:25>Inizi lo scenario con un convoglio ben armato e un po' di capitale iniziale. Catturando navi mercantili inglesi accrescerai subito la tua ricchezza e potrai equipaggiare il tuo convoglio con più armi.<n:25>Più tardi il tuo convoglio attaccherà convogli militari inglesi per indebolire le difese dell'Inghilterra e potrà poi catturarne le città."
