"0xcd01da76" = "Inizi la partita con il grado di Marinaio nella città del governatore spagnolo @T$TOWN$, dove hai già un magazzino. Hai anche un convoglio in porto con due navi armate ma senza marinai.<n><n>Il primo obiettivo di questo scenario è visitare il governatore di @T$TOWN$ e accettare la sua missione. Ha problemi con il famigerato pirata Edward Teach, meglio noto come Barbanera, e vuole che tu lo aiuti.<n><n>Importante: in questo scenario le nazioni sono in pace. Ciò significa che non devi mai attaccare un convoglio appartenente a una nazione.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visita il governatore di @T$TOWN$ e accetta la missione che ti assegna."
