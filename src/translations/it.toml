"0xef9ba866" = "Robert Andreas Drude"
"0xefbbbbe9" = "Ora è il momento di trovare il covo dei pirati di Barbanera e porre fine alle sue azioni infami. Una volta che un pirata è in libertà da un po', è solo questione di tempo prima che il suo covo venga scoperto. Ma puoi anche fare qualcosa per influenzarlo: di tanto in tanto un convoglio pirata torna al suo covo per scaricare il bottino e fare le riparazioni necessarie.<n>Se segui uno di questi convogli pirata sulla carta nautica e lo osservi mentre scompare nel suo covo, è molto probabile che scoprirai l'ubicazione del covo. Una volta scoperto il covo, puoi distruggerlo attaccandolo dal mare come faresti con una città.<n><n>Suggerimento:<n> @l$IslandPos$ Attendi che un convoglio si avvicini e osservalo mentre scompare nel suo covo.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Trova il covo di Barbanera."
