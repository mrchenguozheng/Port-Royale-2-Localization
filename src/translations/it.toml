"0x19f413a1" = "In questo scenario avrai molto più da fare rispetto al primo. Imparerai a commerciare con successo e a realizzare i tuoi primi profitti commerciali.<n><n>Formerai anche un secondo convoglio per poter trasportare più merci.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Leggi e segui i suggerimenti nella finestra degli eventi."
"0x1a106105" = "Il convoglio non ha ancora sostenuto battaglie navali."
"0x1a2ebe80" = "Purtroppo non ti sono rimasti convogli adatti all'ancora nel porto. Il convoglio deve essere composto esattamente da 5 navi e avere 150 cannoni a bordo. Torna quando avrai messo insieme un convoglio simile."
"0x1a3808bb" = "Il mercante si chiama @N$Name$ e la sua città natale è @T$Town$. Se riuscirai a distruggere il suo convoglio entro il @D$EndDate$, ti ricompenserò generosamente con merci."
"0x1a444b3b" = "Non posso incaricarti di conquistare una città appartenente a un'altra nazione a mio nome perché al momento non siamo in guerra. Tuttavia le cose possono cambiare molto in fretta. Torna da me se succede."
"0x1a444b3c" = "Siamo in guerra con %1 e hai fatto in modo che a %1 resti una sola città. Non possiamo prenderla, quindi al momento non posso incaricarti di conquistare alcuna città. <n><n>Ma torna quando la situazione cambia."
"0x1a444b3d" = "Ti incaricherei volentieri di conquistare una città appartenente a %1.  Ho abbastanza convogli militari per proteggere qualsiasi zona di nuova conquista.<n><n>Tuttavia %1 è ancora troppo forte per un'impresa simile.<n><n>Potresti aiutare a indebolire %1 distruggendo i suoi convogli militari.<n><n>Poi torna da me e potrei avere una missione per te."
"0x1a444b3e" = "Ti incaricherei volentieri di conquistare una città appartenente a %1.  Ho abbastanza convogli militari per proteggere qualsiasi zona di nuova conquista.<n><n>Tuttavia %1 è ancora troppo forte per un'impresa simile.<n><n>Potresti aiutare a indebolire %1 distruggendo i suoi convogli militari.<n><n>Poi torna da me e potrei avere una missione per te.<n><n><n>Puoi controllare la forza di una nazione alla voce \"Nazioni\" nella Cronaca. "
