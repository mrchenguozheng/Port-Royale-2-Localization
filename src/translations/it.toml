"0x080f2b29" = "<ts:20>Dovresti sapere quanto segue sulle merci:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Ci sono cinque tipi di merci: beni di prima necessità, materie prime, prodotti finiti, merci coloniali e merci d'importazione<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Ogni città può produrre cinque merci<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Ci sono due tipi di città: le città coloniali e le città con governatore o viceré<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Le città con governatore producono beni di prima necessità e prodotti finiti. Ricevono anche consegne regolari di merci d'importazione dall'Europa. Queste città sono quindi i posti migliori per trovare prodotti finiti e merci d'importazione.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Le città con governatore hanno bisogno di materie prime per produrre prodotti finiti. Assorbono anche merci coloniali, che provengono dai convogli di trasporto dall'Europa.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Le città coloniali producono beni di prima necessità, materie prime e merci coloniali. Ogni merce coloniale può essere prodotta solo in certe zone dei Caraibi. Il caffè, per esempio, si trova solo nel sud e nell'ovest dei Caraibi.<n><n>Dovresti sapere quanto segue sui prezzi:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Maggiore è la domanda di una merce e minore è l'offerta in una città, più alto sarà il prezzo.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Migliore è la tua reputazione in una nazione, più basso sarà il prezzo al quale potrai comprare merci nelle città di quella nazione.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Dovresti comprare merci solo nelle città in cui vengono prodotte.<n><n>Il modo più rapido per fare soldi:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>comprare merci coloniali e materie prime nelle città coloniali<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>vendere queste merci nelle città con governatore e comprarvi prodotti finiti e merci d'importazione."
