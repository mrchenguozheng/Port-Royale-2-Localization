"0xcb8dd6da" = "Sono felice di vederti.<n>Mia moglie ha recentemente ricevuto da Parigi un barboncino ben curato. Il disgraziato animale mi ha fatto uscire di senno, ma mia moglie è innamorata del cane.<n>Qualcuno ne è venuto a conoscenza, ha rapito il cane e l'ha consegnato ai nostri nemici per ricattarci.<n><n>Puoi recuperare il barboncino per me?"
"0xcb8dd6db" = "Qualche tempo fa, mia figlia più giovane è scappata con una specie di avventuriero di passaggio, così si diceva allora. Ora ho scoperto che vive a @T$TargetTown$ e che sta per sposare il comandante della città. Conosco mia figlia, non farebbe mai una cosa simile di sua spontanea volontà! Posso difficilmente suggerire al viceré di attaccare una città per salvare mia figlia? Ma tu che ne dici?"
