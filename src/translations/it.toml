"0xfc3fdd9b" = "Non sei riuscito a ripristinare la popolazione di Tortuga.<n><n>Non appena lo stato di una città raggiunge \"Boom\" o superiore, si possono assumere nuovi lavoratori. Puoi fornire nuovi lavoratori alla città sotto forma di famiglie di coloni. Queste viaggiano dall'Europa alle città dei governatori, dove attendono un passaggio per altre città. Troverai coloni in attesa di essere imbarcati anche nelle città con uno stato inferiore."
