"0x273267f2" = "Oh, non ci credo. Gli ubriaconi hanno rubato la mia bella nave. L'hanno riempita di bottiglie di rum e sono scappati. Puoi aiutarmi a cercare la mia nave?"
"0x273267f3" = "Avrei dovuto immaginarlo. Mio figlio scapestrato Boris ha preso in prestito la mia nave migliore. Ora ho scoperto che lui e i suoi amici hanno deciso di fare una gita. Senza dubbio hanno riempito la stiva di rum e sono sicuro che non rivedrò mai più la mia nave. Potresti recuperare la mia nave per me?"
"0x27344ff4" = "Molte grazie per aver consegnato in tempo, il governatore ne sarà felice. Il banchetto nuziale inizia proprio oggi!"
"0x273d7e0f" = "Tutti i tuoi marinai hanno già il morale più alto possibile."
