"0x1c703500" = "Il governatore vuole parlarti urgentemente."
"0x1c74c605" = "Sei fuggito con %1."
"0x1c7e1413" = "Grazie!<n> Naturalmente avrai prima bisogno di un permesso in città, ma sei sicuro di ottenerlo.<n>Pagherò ovviamente tutte le tue spese non appena la scuola sarà costruita. Il compleanno di mia moglie è il @D$EndDate$, fa' in modo che la prima pietra della scuola sia posata per allora."
"0x1c7e1414" = "Bene. Inizia a costruire la scuola entro il @D$EndDate$. Poi pagherò le tue spese.<n>Non dimenticare che ti servirà un permesso a @T$Town$ se vuoi costruire una scuola.<n>Non fiatare di questa missione con mia sorella."
"0x1c7e1415" = "Grazie! @T$Town$ non verrà a sapere del nostro accordo. Inizia la costruzione entro il @D$EndDate$. Poi pagherò le tue spese.<n>Non dimenticare che ti servirà un permesso a @T$Town$ se vuoi costruire una scuola."
"0x1c7e9deb" = "%1: Importo del prestito %2 rimborsato."
"0x1c83647f" = "Armi e munizioni:"
"0x1ca41002" = "Scenario completato"
"0x1ca50773" = "Bel lavoro! Ora hai un convoglio impressionante.<n><n>Il tuo prossimo compito non sarà facile, perché consiste nell'attaccare e sconfiggere un convoglio militare inglese. Il governatore delle Isole Turk ti ha fornito un'altra nave come riserva. Trovala nel porto delle Isole Turk e aggiungila al tuo convoglio.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Distruggi un convoglio militare inglese."
"0x1ce621bb" = "Zona residenziale di un mercante locale"
"0x1ce62aab" = "Missioni attuali"
"0x1ce81e5e" = "Tipo di gioco"
"0x1cf07333" = "Ben fatto, hai raggiunto il tuo primo obiettivo in @I$Days$ giorni. Il tuo prossimo obiettivo è aumentare il numero di cittadini che vivono in città. Per farlo, crea cinque attività, una per ciascun tipo consentito in città.<n><n>Ricorda che solo un piccolo numero di mercanti visita Tortuga, e devi assicurarti che la città abbia rifornimenti sufficienti, così che il suo stato sia abbastanza alto da permetterti di accogliere nuovi coloni. Inoltre non dimenticare di garantire spazio abitativo sufficiente per i cittadini.<n><n>Hai 60 giorni per raggiungere questo obiettivo. Prima lo raggiungi, meglio è.<n><n>Suggerimento: i soldati fanno parte della popolazione di una città ma non contano come cittadini! Puoi aumentare il numero di cittadini in una città solo creando posti di lavoro.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Crea cinque attività diverse a Tortuga e aumenta il numero di abitanti a 1.500 entro il @D$EndDate$. Non dimenticare di fornire spazio abitativo sufficiente! Serve una zona residenziale per ogni attività."
"0x1d01f111" = "Suoni"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>La nave che è affondata qui doveva essere al comando di un capitano molto esperto. Il baule non contiene oro, ma trovi un diario tenuto con cura che appartiene al capitano @L$RandLName$. Di conseguenza l'esperienza del capitano del convoglio @C$Convoy$ aumenta di due punti."
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Il baule del tesoro è vuoto, ma è servito da boa per una corda. Non lontano sotto la superficie scopri un covo che contiene cannoni. Il tuo equipaggio ne imbarca il maggior numero possibile."
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Un gran numero di barili di rum galleggia nelle acque circostanti. I tuoi uomini ne recuperano quanti il tuo convoglio può trasportarne."
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Il tuo convoglio si è imbattuto in un grande baule di legno. Viene subito portato a bordo e aperto. Finalmente un vero tesoro, pensa il capitano intravedendo @g$Gold$."
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Un vecchio baule di legno quasi completamente marcio galleggia nell'acqua. Qualunque cosa contenesse, ora non resta nulla tranne un odore ripugnante. Nonostante ciò il morale del tuo equipaggio si solleva, perché la ricerca del tesoro è finalmente giunta al termine."
"0x1d19d29c" = "Permesso di costruzione a %1"
"0x1d6d7bd9" = "e il porto è difeso in forze."
"0x1db06b05" = "Trova il pacco"
"0x1db7f908" = "Purtroppo non hai avuto abbastanza tempo per mettere insieme @g$GoldGoal$ in contanti.<n><n>Vendi le merci del tuo magazzino a Tortuga nelle città in cui scarseggiano e tieni d'occhio le merci che puoi comprare a buon prezzo.<n><n>Puoi anche ottenere un prestito dal tesoriere a Tortuga."
