"0xd9720471" = "Salve. Hai una nave che possa portarmi a @T$TargetTown$? Devo urgentemente arrivarci entro il @D$EndDate$. Ti pagherò @g$Reward$ se mi ci porti in tempo."
"0xd9720472" = " @A$USER$, mi hanno lasciato in mezzo alla strada. Ma devo urgentemente arrivare a @T$TargetTown$. Puoi portarmici? Ti pagherò @g$Reward$!"
"0xd9720473" = " @A$USER$, cerco un passaggio per @T$TargetTown$. Ti sarei molto grato se mi offrissi un posto su una delle tue navi. Ti pagherò @g$Reward$."
"0xd979efd5" = "E sia. Per favore, inizia la costruzione di un ospedale a @T$Town$ entro il @D$EndDate$."
"0xd99426c9" = "Ti va di fare una partitina a carte con me?<n><n>Allora scegli la tua posta! Io la pareggio e il vincitore prende tutto."
"0xd99426ca" = "Non ho nemmeno bisogno di chiederti se ti unirai a me in una partita: sei più spiantato di un ponte appena strofinato! Torna quando avrai le tasche piene."
"0xd99426cb" = "Oh no, di nuovo tu! Ricordo ancora la nostra ultima partita. Non ne hai ancora abbastanza? Beh, per il momento non giocherò con te."
"0xd99426cc" = "A tutti sono state date 5 carte. Dichiaro %1 punti.<n><n>Se vuoi giocare, devi dichiararne uno in più."
"0xd99426cd" = "Allora ci sto. %1 sono briscole.<n>Ecco la mia prima carta."
"0xd99426ce" = "Apri tu. Dimmi quale colore vuoi come seme di briscola (scegli una carta)."
"0xd99426cf" = "Quindi %1 sono briscole.<n>Gioca la tua prima carta."
"0xd99426d0" = "Hai vinto 1 punto.<n>Scegli la tua prossima carta."
"0xd99426d1" = "Ho vinto 1 punto.<n>Ed ecco la mia carta."
"0xd9942739" = "Non riesco a raggiungere il numero di punti che ho dichiarato. Ho perso."
"0xd994273a" = "Ho raggiunto il numero di punti che ho dichiarato. Hai perso."
"0xd994273b" = "Non puoi raggiungere il numero di punti che hai dichiarato. Hai perso la partita."
"0xd994273c" = "Hai raggiunto il numero di punti che hai dichiarato. Sei salvo!"
"0xd994273d" = "Ecco, quello era il mio ultimo punto. Hai perso la partita!"
"0xd994273e" = "Accidenti, avrei dovuto vincere quel punto. Ho perso la partita."
"0xd994273f" = "Beh, alla fine la partita è andata a mio favore. Temo che tu abbia perso."
"0xd9942740" = "Hai la fortuna del diavolo!<n>Quella era la mia ultima partita, sono al verde."
"0xd9942741" = "Mi hai preso tutto l'oro. Ordinami una bottiglia di rum e poi, per favore, lasciami solo ad affogare i miei dispiaceri."
"0xd9942742" = "Ora l'hai fatto! Stasera non potrò farmi vedere a casa."
"0xd99427aa" = "Hai vinto la partita!"
"0xd99427ab" = "Vuoi rischiare un'altra partita?"
