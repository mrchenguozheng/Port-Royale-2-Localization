"0x17ae0013" = "L'ultimo convoglio dall'Europa mi ha informato che alla mia città mancheranno merci importate nelle prossime settimane.<n><n>Puoi aiutarmi? Non posso contare sulla possibilità che altri mercanti portino queste merci in città."
"0x17ae0014" = "Come sai, @n$Nation1$ e @n$Nation2$ sono in guerra.<n>Per questo non riceverò merci importate dall'Europa per le prossime settimane.  Non ho quindi altra scelta che comprare le merci in @n$Nation2$.<n><n>Ho già incaricato altri mercanti di farlo, ma vorrei poter contare anche sul tuo aiuto."
"0x17ae0015" = "Che cosa crede di fare @n$Nation2$? Ho appena saputo da un informatore che i convogli di trasporto dall'Europa diretti alla mia città vengono attaccati e saccheggiati. Mi aiuterai a comprare le merci importate di cui abbiamo bisogno?"
