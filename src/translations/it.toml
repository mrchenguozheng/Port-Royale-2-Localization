"0xdfb549a4" = "Siamo in guerra con %1, ma il nemico non ha abbastanza convogli militari per proteggere le sue acque. Voglio che tu ne approfitti e catturi una città."
"0xdfb549a5" = "%1 non ha abbastanza convogli militari per proteggere le sue acque! Dovremmo muoverci subito e catturare una città!!<n>Posso contare su di te? "
"0xdfb9b5b7" = "Eccellente! Ora hai @g$Gold$.<n><n>Ogni nazione ha convogli militari per difendere le proprie città e proteggere le acque intorno a esse. Più città occupa una nazione, più convogli militari le servono per garantirne un'adeguata protezione.<n><n>Se una nazione perde un convoglio militare, la sua potenza militare si indebolisce. Poiché durante una guerra i convogli militari sono piuttosto aggressivi verso le città e i convogli della nazione nemica, una nazione può perdere di tanto in tanto un convoglio militare. Per questo motivo dall'Europa partono regolarmente convogli per rafforzare la potenza militare di una nazione nel Nuovo Mondo.<n><n>Puoi controllare la potenza di una nazione sotto \"Nazioni\" nella Cronaca. Se una nazione è descritta come debole, le sue città possono essere catturate.<n><n>Ora dovresti sconfiggere abbastanza convogli militari inglesi da far sì che la potenza dell'Inghilterra sia valutata \"debole\".<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Sconfiggi abbastanza convogli militari inglesi da far sì che l'Inghilterra sia valutata \"debole\"."
