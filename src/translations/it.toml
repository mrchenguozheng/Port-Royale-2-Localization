"0x22fffe32" = "Mio caro %1,<n>riesco a stento a trattenere l'impazienza. Ti prego, affrettati al mercato e consegna le merci per le nozze, così potremo tenere presto il banchetto."
"0x2310e7f4" = "Per visualizzare il prossimo obiettivo dello scenario devi portare a termine la tua missione di conquistare le città."
"0x2335f663" = "Grazie per avermi restituito il pacco. Ecco la tua ricompensa di @g$Reward$."
"0x234d00d9" = "Oggi il pirata %1 ha iniziato a seminare il caos nei Caraibi."
"0x23652698" = "Purtroppo non posso dirti nulla di certo. Il mio capitano di porto mi ha dato una vaga descrizione della nave che potrebbero aver preso. Un mercante ha avvistato questa nave in mare e mi ha mostrato il punto. @l$Pos$ Perquisisci questa zona, potresti trovare un indizio."
"0x23652699" = "La posizione è @l$Pos$. Perquisisci questa zona, potresti trovare un indizio. Ti prego, riportami mia figlia sana e salva."
"0x2365269a" = "La posizione è @l$Pos$. Perquisisci questa zona, forse @F$WifeName$ cercava di dirci qualcosa quando l'ha menzionata. Ti prego, riportami mia figlia sana e salva. E se ti imbatti in quel Casanova, portagli i miei saluti. "
"0x23815ece" = "Sei sicuro di voler uscire dalla partita attuale e tornare al menu principale?"
"0x2388c117" = "(merci richieste non a bordo)"
"0x238c039b" = "Organizzatore della festa"
"0x239bed4a" = "Non puoi aggiungere più di 10 navi al convoglio."
"0x23a8f980" = "Carica / Salva"
"0x23f0ed65" = "Siamo in guerra con @n$HostileNation$. Di recente uno dei miei capitani ha pensato a un modo ingegnoso per demoralizzare @n$HostileNation$. Ha proposto di mettere insieme un convoglio militare composto dalle navi del nostro nemico, per fargli assaggiare, per così dire, la sua stessa medicina.<n>Sembri proprio l'uomo giusto per procurarci queste navi."
"0x23f0ed66" = "Poiché siamo di nuovo in guerra con @n$HostileNation$, voglio mettere insieme un nuovo convoglio per proteggere la mia città. Non ho alcuna voglia di aspettare che mi venga assegnato un nuovo convoglio militare dall'Europa.<n>Purtroppo le mie risorse al momento sono molto limitate, così mi è venuta l'idea di usare le navi del nostro nemico. Vuoi aiutarmi a catturare alcune navi di tipo @S$ShipType$?"
