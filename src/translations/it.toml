"0xf4da7469" = "e"
"0xf4e195bf" = "Barbanera ha scoperto che collabori con il governatore di @T$TOWN$. Perciò ha cominciato a terrorizzare i mercanti che visitano @T$TOWN$. Nel giro di pochi giorni quasi nessun mercante oserà più venire a @T$TOWN$. <n><n>Questa è solo una tattica temporanea. Il tuo compito è rifornire la città di merci fino al @D$EndDate$. Lo stato della città non deve scendere sotto \"Fiorente\".<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Rifornisci @T$TOWN$ di merci fino al @D$EndDate$. Lo stato della città non deve scendere sotto \"Fiorente\"."
