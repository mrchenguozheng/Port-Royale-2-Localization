"0xdd14592b" = "Dopo aver sfondato le difese portuali, il tuo convoglio attracca e i marinai partono a caccia del tesoro dei pirati. Si trovano improvvisamente di fronte al pirata %1, che sfida il tuo capitano a duello."
"0xdd22ec49" = "La tua nuova nave è in porto. Il tuo equipaggio di base è già a bordo."
"0xdd379158" = "Consegna @a$Amount$ di utensili al mercato di @T$DestTown$ entro il @D$Date$ . Riceverai @g$GoldPerBarrel$ per ogni <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0xdd3808a0" = "Scenario introduttivo<n><n>In Port Royale 2 puoi costruire in qualsiasi città in cui possiedi un permesso di costruzione. Hai sempre il permesso di costruire nella città in cui inizi la partita.<n:25>Questo scenario ti introduce alla costruzione e alla produzione. Il tuo compito è costruire diversi edifici commerciali e residenziali. Nelle varie fasi dello scenario dovrai trovare materie prime, coloni e lavoratori. "
"0xdd5aa167" = "Ti sono stati dati @g$Gold$."
