"0x00bff5f3" = "Ora hai un permesso di costruzione per Cartagena e puoi aprirvi delle attività. Il tuo prossimo obiettivo è costruire due tessitorie a Cartagena. Una tessitoria è un'attività che produce merci finite e richiede cotone come materia prima.<n><n>Devi sempre avere una scorta di materie prime nel tuo magazzino, altrimenti l'attività non potrà produrre alcuna merce. I costi resteranno però alti, perché devi pagare le spese di mantenimento di ogni attività e pagare i tuoi lavoratori.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Costruisci due tessitorie nella città di Cartagena e produci @a$AmountGoal$ di tessuto."
