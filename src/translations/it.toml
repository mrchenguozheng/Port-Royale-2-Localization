"0xf8707567" = "Vendite:"
"0xf880e055" = " Manda un capitano che non abbia molta esperienza di commercio."
"0xf880e056" = " Manda un capitano che non abbia molta esperienza di battaglia."
"0xf880e057" = " Manda un capitano che non abbia molta esperienza di navigazione."
"0xf88d5e17" = "Statistiche della popolazione"
"0xf88d6ee5" = "Consegna qualsiasi quantità di @G$Goods$ al mercato di @T$TOWN$. Lì riceverai subito @g$Price$ per barile. Il @D$EndDate$ un convoglio di spedizione raccoglierà le merci. Scorta il convoglio fino in Europa e riceverai altri @g$Price$ per barile."
"0xf894bc2d" = "Il convoglio non può salpare perché alcune delle tue navi sono in condizioni molto pessime. Fai riparare il convoglio nel cantiere navale prima di rimandarlo in mare. In alternativa puoi togliere dal convoglio le navi danneggiate e farle riparare separatamente."
"0xf89f542f" = " Hai ricevuto <o:0xff1e1eff>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GOLD_800x600.screen>."
"0xf8af3810" = "Qui abbiamo tutto ciò che ci serve."
"0xf8b3a303" = "Lo stato di una città può passare attraverso sette livelli, dalla povertà alla ricchezza. Nei due livelli più bassi la qualità della vita è così scadente che i cittadini lasciano regolarmente la città. Quando invece una città raggiunge i livelli di \"Fiorente\", \"Ricca\" e \"Opulenta\", le tue attività ricevono un bonus di efficienza e la tua manodopera è più economica. Al livello più alto una città produce perfino i propri coloni.<n><n>Troverai maggiori informazioni sugli effetti di ogni livello di stato nelle informazioni sulla città. Per visualizzarle, clicca sul nome della città.<n><n>Una fornitura sufficiente di due o tre merci per ogni gruppo di merci garantisce una buona qualità della vita nella tua città. La fornitura di una merce è sufficiente se può coprire il fabbisogno della popolazione cittadina per dieci giorni.<n><n>Nota: lo stato di una città non migliora da un giorno all'altro. I cittadini impiegano un po' di tempo per adattarsi a una nuova situazione."
"0xf8bacb9a" = "Locanda"
"0xf8cc0545" = "Merci vendute"
"0xf8e13932" = "Rifornisci @T$TargetTown$ di merci e acquista le merci in eccedenza. Al @D$EndDate$ lo stato della città deve essere \"Boom\" e tutte le attività dei commercianti locali devono lavorare a pieno regime."
"0xf8e13933" = "Rifornisci @T$TargetTown$ di merci e acquista le merci in eccedenza. Al @D$EndDate$ lo stato della città deve essere \"Fiorente\" e tutte le attività dei commercianti locali devono lavorare a pieno regime."
