"0x24695110" = "Grazie. Sono un mercante di @T$Town$. Poiché i miei inseguitori non sanno dove alloggio, cercheranno di certo di catturarmi nella mia città natale. Inizia la ricerca lì e uccidi i cacciatori di taglie. Devo partire da qui non più tardi del @D$EndDate$. Se porterai a termine la missione prima, ti pagherò @g$Reward$."
"0x24695111" = "Devo tornare urgentemente a @T$Town$, perché ho degli affari da sbrigare lì prima di poter sparire per sempre. Purtroppo le vie d'accesso a @T$Town$ sono sorvegliate da un cacciatore di taglie, che devi uccidere. Ti ricompenserò con @g$Reward$ se porterai a termine la missione entro il @D$EndDate$."
"0x24695112" = "Grazie! Sospetto che un cacciatore di taglie sorvegli l'ingresso del porto di @T$Town$.<n>Faremo così: spargerò la voce che mi imbarcherò su una delle tue navi, poi tu salperai per @T$Town$ e vedremo cosa succede.<n>Fammi sapere entro il @D$EndDate$ al più tardi che la costa è libera e ti pagherò una ricompensa di @g$Reward$."
"0x246aece6" = "%1: Carestia"
"0x2478c95f" = "Congratulazioni! Hai completato con successo questo scenario e hai liberato i Caraibi dal flagello di un pirata famoso.<n><n>Nel corso del gioco i covi dei pirati nasceranno da soli. Tuttavia il numero di convogli pirata dipende da quanto successo hanno. Nota che i pirati vogliono saccheggiare solo convogli commerciali e diffidano molto dei convogli militari. Per questo evitano le acque in cui sono in circolazione troppi convogli militari.<n><n>Puoi anche dare la caccia ai pirati e stanare i loro covi in modalità libera. "
"0x24802954" = "%1: Nave affondata"
"0x2487ab5c" = "Saldo"
"0x248f1e26" = "Covo del pirata %1"
"0x24901249" = "%1 di %2 marinai vogliono unirsi alle tue avventure."
"0x24a0f898" = "Cantiere navale"
"0x24b0fd83" = "Caratteristica "
"0x24c12812" = "Congratulazioni! Ti è stata affidata una missione per conquistare città!<n><n>Poiché le città possono essere difese molto duramente, dovresti scegliere una città inglese con un numero minimo di torri di cannoni nel porto. La città di @T$SampleTown$ è un bersaglio perfetto.<n><n>Per attaccare una città attiva l'opzione Attacca città per il tuo convoglio. Per farlo, seleziona il tuo convoglio e fai clic sul pulsante Modalità attacco.<n><n>Puoi attaccare una città dal mare o da terra. Tuttavia dovresti rischiare un attacco da terra solo se i tuoi marinai sono più numerosi dei soldati della città. In questo caso dovresti anche poter armare metà dei tuoi marinai con sciabole e metà con moschetti.<n><n>Nota: se nel porto di una città c'è un convoglio militare, devi sconfiggere quel convoglio prima di attaccare la città stessa.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Porta a termine la tua missione di conquistare le città."
"0x24e18ac4" = "<f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x24ec3366" = "Eccellente! Ora il tuo convoglio è armato e pronto a rintracciare uno dei convogli pirata di Barbanera.<n><n>La finestra degli eventi fornisce suggerimenti quotidiani per aiutarti a scoprire l'ubicazione del convoglio pirata, a patto che si trovi in mare. Trovare i pirati può essere difficile, perché tornano sempre al loro covo dopo un attacco riuscito a una nave mercantile.<n><n>Ricorda che un convoglio pirata può avere fino a cinque navi da guerra. Rinforza il tuo convoglio se non lo ritieni abbastanza potente. Sai già come mettere le mani su un po' d'oro.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Porta a termine la missione che ti ha affidato il governatore di @T$TOWN$."
"0x250c7a12" = "Consegna @a$Amount$ entro il @D$Date$. Puoi consegnare le merci al mercato e riceverai un pagamento immediato di @g$GoldPerBarrel$ per ogni <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> di @G$Goods$."
"0x250c7a13" = "Ne sono felice. Consegna @a$Amount$ al mercato. Lì riceverai il tuo pagamento di  @g$GoldPerBarrel$ per ogni <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> fino al @D$Date$."
"0x250c7a14" = "Incontra il mio emissario al mercato. Consegna @a$Amount$ di @G$Goods$ entro il @D$Date$; ti offrirà un buon prezzo."
"0x2540ea42" = "Testo aggiuntivo (cronista)"
"0x2546beb9" = "Dunque, @N$OwnerName$ ti ha mandato da me? Sì, conosco questo vecchio capitano, potrebbe di certo insegnare qualcosa al tuo equipaggio. Ma perché dovrei aiutarti? Non voglio però fare il difficile, capisco che devi aver passato un po' di tempo a rintracciarmi. Se mi fai un piccolo favore, ti dirò dove si è ritirato il capitano."
"0x2546beba" = "Non conosco nessun @N$OwnerName$, ma so di certo dove si trova @N$TeacherName$. Suppongo di potertelo dire, se ne avessi voglia. Che ne dici se tu gratti la mia schiena e io gratto la tua? "
"0x2546bebb" = "Non mi importa se ti ha mandato @N$OwnerName$ o il gobbo Gran Visir di Taipei! Ho un problema. E finché non è risolto, non mi interessa sentire parlare d'altro. Ho un suggerimento: che ne dici di trovarmi un baule, e io ti dirò dove si nasconde questo vecchio pazzo di @N$TeacherName$."
