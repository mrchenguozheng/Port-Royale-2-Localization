"0x2ee7d67a" = "Viceré di %1"
"0x2ee8bb8c" = "Siamo nella città con governatore di Cartagena, nei Caraibi meridionali.<n>Puoi entrare nei vari edifici di una città e compiere diverse azioni, ne parleremo più avanti.<n>Prima guarda la parte superiore dello schermo. Puoi vedere una serie di pulsanti e indicatori.<n>Ora fai clic sul pulsante con l'orologio, all'estrema sinistra dello schermo."
"0x2ee8bb8d" = "Questa è la Cronaca. Contiene il registro di tutti gli eventi e gli avvenimenti dei Caraibi, più o meno come un quotidiano.<n>A destra della finestra della Cronaca ci sono alcuni pulsanti. Puoi usarli per visualizzare informazioni sui Caraibi. Tuttavia al momento non è importante.<n>Ora chiudi la Cronaca facendo clic sul pulsante \"X\"."
"0x2ee8bb8e" = "In alto nello schermo, accanto alla data, si trova il pulsante Diario e accanto il tuo contante.<n>Il diario ti tiene aggiornato su qualsiasi informazione riguardante i tuoi successi e i tuoi possedimenti. Inoltre qui vengono salvati tutti i messaggi e le missioni che ricevi.<n>Apri il diario. "
"0x2ee8bb8f" = "Come puoi vedere, il diario mostra subito tutti i messaggi che hai ricevuto finora. Al momento mostra solo le istruzioni per questo scenario.<n>A destra della finestra del Diario ci sono altri pulsanti. Fai clic sul terzo pulsante. "
"0x2ee8bb90" = "Qui vengono mostrati i compiti e le missioni che hai ricevuto. Al momento è visualizzato solo l'obiettivo dello scenario.<n>Con i due pulsanti in cima alla finestra Missioni puoi passare dalle missioni attuali a quelle completate.<n>Ora chiudi il diario. Puoi farlo anche semplicemente con un clic destro."
"0x2ee8bb91" = "Più avanti nel gioco potrai accettare numerose missioni per raggiungere fama e fortuna.<n>Prima diamo un'occhiata alla città. Come puoi vedere dall'indicatore in alto al centro dello schermo, siamo a Cartagena. La città ha circa 2.000 abitanti.<n>Fai clic sul pulsante con il nome della città."
"0x2ee8bb92" = "Questo apre una finestra che mostra informazioni sulla città.<n>Cartagena è una città con governatore e appartiene alla Spagna. Puoi anche vedere lo stato della città e le merci che vi si possono produrre.<n>Ora entra in un edificio. Per farlo, chiudi la visualizzazione delle informazioni sulla città."
"0x2ee8bb93" = "Puoi usare i tasti freccia della tastiera per muoverti nella vista della città. Ora dai un'occhiata al centro cittadino dentro le mura. Contiene edifici come i moli, la chiesa e il palazzo del governatore.<n>Fai un clic su uno di questi edifici."
"0x2ee8bb94" = "L'indicatore in basso al centro dello schermo cambia quando fai clic su un edificio. A seconda del tipo di edificio, ora ricevi informazioni o puoi fare certe cose.<n>A destra dell'indicatore dell'edificio ci sono dei pulsanti. Per uscire dall'edificio, fai clic sul pulsante \"X\"."
"0x2ee8bb95" = "Gli edifici in cui puoi compiere diverse azioni si trovano sempre dentro le mura della città. Il tuo magazzino è un'eccezione, e se ne parlerà più diffusamente nel prossimo scenario.<n>Ora lascia l'edificio e usa i tasti freccia per visualizzare il porto e il convoglio chiamato \"Santa Maria\". Fai clic su di esso."
"0x2ee8bbfd" = "Come puoi vedere, ora in basso al centro dello schermo compaiono le informazioni sul tuo convoglio.<n>Il convoglio ha già caricate delle merci: 10 barili di grano e 15 barili di mais.<n>A destra dell'indicatore del convoglio ci sono diversi pulsanti. Fai clic sul secondo pulsante (quello con l'icona della nave)."
"0x2ee8bbfe" = "Qui viene mostrato il numero di navi nel convoglio. Un convoglio può avere fino a 10 navi guidate da un capitano.<n>Ora mandiamo il convoglio in un'altra città.<n>Fai clic sul pulsante con la freccia in alto a destra dello schermo per uscire dalla città e visualizzare la carta nautica."
"0x2ee8bbff" = "Ora appare la carta nautica. Al centro dello schermo vedrai la città di Cartagena.<n>Puoi usare i pulsanti a freccia per spostare l'area della mappa visualizzata e vedere l'intero mondo di gioco.<n>Ora cerca la città di Port Royale su un'isola a nord e fai clic destro sulla città con il tuo convoglio selezionato."
"0x2ee8bc00" = "Viene tracciata una rotta e il tuo convoglio parte.<n>Facendo clic destro su Port Royale, l'hai scelta come destinazione del tuo convoglio.<n>Se il convoglio impiega troppo tempo a raggiungere la città, puoi semplicemente mandare avanti il gioco premendo la barra spaziatrice (impostazione predefinita). "
"0x2ef566b4" = "Tastiera"
"0x2ef8f665" = "Benvenuto a %1,<n><n>Vorrei darti qualche consiglio che ti permetta di orientarti più rapidamente nella regione intorno a %2, così potrai aiutare la mia nazione a espandere questa e altre città.<n>Sono certo che tu conosca già le informazioni di base sulle città con governatore: hanno bisogno di un rifornimento costante di merci coloniali da esportare in Europa. Allo stesso tempo queste città offrono di solito un assortimento di merci di lusso, che possono essere vendute con un bel guadagno ad altre città.<n>Solo un'altra cosa: potrebbe interessarti sapere che i governatori assegnano missioni di tanto in tanto. Tuttavia non puoi accettare missioni finché non hai raggiunto il grado di Mozzo.<n><n>%3 %4, governatore di %5"
"0x2efebfdd" = "Poiché il tuo convoglio è arrivato a Port Royale, ora puoi entrare in città. Basta fare clic sul simbolo della città (con le piccole case)."
"0x2efebfde" = "Ora vedi di nuovo la familiare vista della città, ma questa volta è quella di Port Royale. Puoi muoverti in qualsiasi città in cui hai convogli o edifici.<n>Cerca il cantiere navale nel porto e fai clic su di esso, perché vogliamo comprare una nuova nave."
"0x2efebfdf" = "Ora il cantiere navale è mostrato nella finestra di selezione dove prima era visualizzato il convoglio.<n>Dai un'occhiata al cantiere navale facendo clic sui pulsanti a destra del suo indicatore.<n>Poi torna alla schermata \"Compra nave\" e guarda le navi disponibili.<n>Compra la nave che vuoi."
"0x2efebfe0" = "Congratulazioni! Hai comprato la tua prima nave.<n>La nave verrà consegnata nel porto della città.<n>Ora lascia il cantiere e fai clic sulle acque del porto. La finestra di selezione ora mostra le singole navi nel porto.<n>Fai clic sulla tua nuova nave."
"0x2efebfe1" = "Qui compaiono i dati della nave, che hai già visto nel cantiere.<n>Prima di poter fare qualsiasi cosa con una singola nave, devi aggiungerla a un convoglio.<n>Per farlo, seleziona di nuovo il tuo convoglio."
"0x2efebfe2" = "Ora vuoi dire al tuo convoglio di interagire con il porto.<n>Fai clic destro sul porto.  "
"0x2efebfe3" = "Si apre una finestra di trasferimento in cui puoi aggiungere singole navi al convoglio.<n>Per farlo, fai clic sulla nave singola a sinistra e trascinala sul convoglio, così che il convoglio sia composto da due navi.<n>Poi chiudi di nuovo la finestra di trasferimento con il pulsante \"X\" a destra."
"0x2efebfe4" = "Puoi anche mettere insieme un altro convoglio con una nuova nave assumendo un nuovo capitano alla locanda.<n>Tuttavia al momento non puoi farlo perché il tuo grado non è abbastanza alto.<n>Ora seleziona l'elenco delle navi del convoglio. È il secondo pulsante."
"0x2efebfe5" = "Ora hai un convoglio con due navi nel porto di Port Royale.<n>Puoi fare clic sulle navi nell'elenco del convoglio per scoprire i dettagli.<n>Ora manda il convoglio indietro nella tua città natale, Cartagena. Per farlo, vai alla carta nautica facendo clic sul pulsante con la freccia all'estrema destra in alto dello schermo. "
"0x2efebfe6" = "Ora trova la città di Cartagena a sud e manda lì il tuo convoglio con un clic destro sulla città.<n>Questo scenario terminerà non appena il convoglio arriverà in città."
"0x2f0127e1" = "Passi una giornata molto piacevole con %1 e le racconti le tue avventure."
"0x2f0127e2" = "Passi un pomeriggio molto piacevole con %1 e dimentichi per un po' i tuoi affari."
"0x2f0127e3" = "Passi la serata con %1 e vorresti che il vostro tempo insieme non finisse mai."
