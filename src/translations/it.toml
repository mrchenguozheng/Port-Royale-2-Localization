"0x352df805" = "Capitolazione"
"0x35353f8f" = "Saccheggia la città di @T$TargetTown$, che appartiene a @n$HostileNation$, e libera la moglie del governatore entro @D$EndDate$."
"0x35353f90" = "Quel poodle ben curato di nome Michelle, che appartiene al governatore di @T$TOWN$, è tenuto prigioniero a @T$TargetTown$. Saccheggia la città e salva il cane prima del @D$EndDate$."
"0x35353f91" = "Attacca la città di @T$TargetTown$, che appartiene a @n$HostileNation$, entro @D$EndDate$ per liberare la figlia minore del governatore."
"0x35392fbd" = "Congratulazioni, hai completato con successo il tuo primo scenario. Ora sai come selezionare i convogli e inviarli ad altre città. Hai anche imparato a entrare negli edifici di una città per compiere varie azioni, come acquistare una nave.<n><n>La prossima sezione riguarda come guadagnare commerciando con profitto."
"0x353a3e45" = "Libreria grafica 2D e strumenti per lo schermo"
"0x353cae5f" = "…i molti partecipanti al forum di Port Royale, le cui idee e proposte hanno reso possibile la seconda parte di Port Royale.<n>...i beta tester di Port Royale 2, che hanno dimostrato un impegno instancabile nel progetto durante il beta test aperto. Nicole Jeannette Pescher, Don Geraldo e BMP del beta test per i loghi che hanno inviato."
"0x35450579" = "Ho esaminato i nuovi reperti e penso che le incisioni indichino un luogo preciso. %1 Ma non ne sono ancora sicuro. Spero che troverai altri reperti, perché sono certo di poter individuare il luogo con maggiore precisione."
"0x3545057e" = "Ho scoperto qualcosa in più sui reperti e sul luogo speciale. Una cosa ora posso dirla con certezza: %1 Che cosa custodisca quel posto, non lo so. Per individuare la posizione con più precisione mi servono altri reperti."
"0x354505ea" = "Ho ottime notizie: con l'ultimo reperto che hai trovato sono riuscito a individuare una posizione esatta. Ecco, te la segno sulla carta nautica. %1<n>Stai attento, perché nessuno sa che cosa ci attenda laggiù."
