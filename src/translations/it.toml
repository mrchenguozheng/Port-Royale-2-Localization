"0x00885bdb" = "Ben fatto! Ora hai una città tua! Nessuno tranne te può costruire in questa città. <n><n>La città ha già alcuni edifici, come i moli, dove puoi commerciare, e il tuo palazzo. Il resto devi costruirlo tu.<n><n>Salpa con il tuo convoglio verso la tua città. Porta quanto più legno e mattoni puoi, perché ti serviranno per costruire edifici.<n><n>Prima costruisci un cantiere navale, dove potrai riparare le tue navi.<n><n>Nota:<n> Mantenere l'equipaggio sulle navi di scorta costa molto. Dovresti congedare l'equipaggio, visto che non ti serve più.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visita la tua nuova città e costruisci un cantiere navale."
