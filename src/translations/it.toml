"0xc558e134" = "Se vuoi che quanti più mercanti possibile visitino la tua città, non dovresti semplicemente rifornirla di certe merci. Meglio scegliere merci prodotte nelle città vicine, perché i mercanti terranno conto della lunghezza del viaggio.<n><n>I mercanti che visitano la tua città acquistano automaticamente le merci abbondanti e quindi a basso prezzo nella tua città. Puoi vendere direttamente alla tua città le merci che hai prodotto. Finché non costano più che in altre città, i mercanti le acquisteranno regolarmente.<n><n>Il vantaggio è che ci sono sempre merci sufficienti per i tuoi cittadini e non devi preoccuparti di trasportare le merci in altre città."
