"0xe8d7e961" = "%1,<n>devo parlarti di una cosa. Mio padre non desidererebbe altro che scegliere un nobile di prestigio da dare in sposa a sua figlia. Ma il mio cuore appartiene a te. Non chiederai a mio padre la mia mano?"
