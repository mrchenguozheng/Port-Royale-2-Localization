"0xed5e6448" = "Ti ringrazio per aver distrutto quel convoglio pirata. Ecco una ricompensa di @g$GoldReward$.<n>A proposito: ogni volta che completi una missione per me, la tua reputazione presso la mia nazione migliora automaticamente.<n>Se invece la tua reputazione presso la mia nazione è bassa, temo di non poterti affidare alcuna missione."
"0xed5e6449" = "Ti ringrazio per aver distrutto il convoglio pirata. Ecco una ricompensa di @g$GoldReward$. Se la sorte ci assiste, scopriremo presto l'ubicazione del covo dei pirati. Allora potremo distruggerlo."
"0xed6ee3f7" = "%1 è promosso"
