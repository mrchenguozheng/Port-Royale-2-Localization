"0x32f1c30f" = "Scenario introduttivo<n><n>Questo scenario introduttivo riguarda il trasporto delle merci e il commercio. Riceverai consigli su come ottenere grandi profitti commerciali e imparerai a formare nuovi convogli."
"0x33045442" = "Bucaniere %1 "
"0x3327e51b" = "Markus Wilding"
"0x3337aa7e" = "Città normale"
"0x334585f4" = "Pestilenza"
"0x334d5256" = "Regole  "
"0x3353aa4c" = "Ottimo! Ora dovresti conquistare altre città inglesi per conto dell'Olanda. Ma non perdere tempo, perché puoi conquistare città solo finché Olanda e Inghilterra sono in guerra.<n><n>Come al solito, missioni di questo tipo possono esserti affidate solo dal viceré di Grand Bahama. Prima che ti vengano affidate altre missioni di conquista, potresti dover fare qualcosa per influire sulle forze e sulle debolezze militari delle due nazioni. Sai già come fare.<n><n>Come riserva, il governatore delle Turks Islands ti ha fornito altre tre caracche.<n><n>Nel porto sono inoltre disponibili molti marinai e armi.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Porta a termine altre due missioni per conquistare città per il viceré olandese prima della fine della guerra tra Olanda e Inghilterra. Hai tempo fino al @D$EndDate$. Lo scenario sarà poi concluso."
"0x336d1860" = "Attività "
"0x338a357f" = "%1 %2 acquista un permesso per costruire edifici a %3."
"0x33a2304e" = "Salva i coloni"
"0x33a89d6d" = "Profitti commerciali"
"0x33ab2ad8" = "Non ho altre notizie per te. Buona giornata."
