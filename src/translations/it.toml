"0xdc471503" = "Nemico di %1"
"0xdc773a52" = "Documenti rubati"
"0xdc7929c7" = "Pacco galleggiante"
"0xdc7c1613" = "Le battaglie vittoriose accresceranno la tua reputazione più rapidamente del <o:0xFFFF2FAAD>5%<o>."
"0xdc939a60" = "Chiesa"
"0xdc9ac8b5" = "È scoppiata una pestilenza"
