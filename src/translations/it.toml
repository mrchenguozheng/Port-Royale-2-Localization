"0x05478cea" = "Mia figlia ti aveva già detto che saresti venuto. Sapessi quanto può essere impetuosa, a volte. Ma non posso oppormi ai desideri di mia figlia, e credo proprio che tu sia l'uomo giusto per lei. E quindi devo chiederti: vuoi prendere %1 come tua moglie? "
"0x05633055" = "I tuoi edifici"
"0x05716a06" = "Il tuo prossimo combattimento sarà un po' più difficile, perché questa volta il nemico resisterà. La tua missione è rintracciare e uccidere un pirata per il governatore.<n><n>Ma prima devi armare il tuo convoglio per la battaglia. Compra una nave, aggiungila al tuo convoglio e imbarca nuove armi e nuovi marinai.<n><n>Puoi premere il tasto F1 in qualsiasi momento durante la battaglia navale per visualizzare la configurazione di tastiera e mouse. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arma il tuo convoglio e porta a termine la nuova missione che ti ha affidato il governatore di Cartagena."
"0x058ca789" = "Fa' visita al governatore di @T$TOWN$ e accetta la sua missione."
"0x05980d2c" = "Il livello di difficoltà determina i prezzi delle merci e i danni inflitti nelle battaglie navali.<n><n>Inoltre, con un livello di difficoltà basso, non ti serve un record commerciale così riuscito in una città prima di poter acquistare un permesso di costruzione."
"0x05ae35b1" = "Molto bene! Ora fa' visita al viceré spagnolo a Port Royale e accetta una missione per conquistare una città francese.<n><n>Di solito devi conquistare due città prima che un viceré ti conceda un appezzamento di terra. Tuttavia in questo scenario hai un piccolo bonus e devi conquistare una sola città per la Spagna.<n><n>Puoi decidere quale città conquistare. È una buona idea scegliere una città con un numero minimo di cannoni portuali. Una città francese che al momento sarebbe un obiettivo ideale è @T$SampleTown$.<n><n>In cambio della conquista di una città, il viceré ti concederà un appezzamento di terra. Nota: non puoi parlare con un viceré se non hai almeno il grado di Nostromo.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Fa' visita al viceré spagnolo a Port Royale e accetta una missione per conquistare una città. Dopo aver portato a termine questa missione, potrai accettare il suo regalo, un appezzamento di terra."
