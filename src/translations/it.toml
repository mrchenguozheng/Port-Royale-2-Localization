"0x39e32dc6" = "Grazie mille. La città in questione si chiama @T$TargetTown$. Spero di poter raggiungere un accordo con i mercanti entro @D$EndDate$. Fino ad allora la città non deve scendere sotto lo status \"Boom\", così potrò negoziare da una posizione più forte."
"0x39e32dc7" = "La città in questione è @T$TargetTown$. Rifornisci la città con tutte le merci di cui ha bisogno. Farò del mio meglio per smentire la voce entro @D$EndDate$, una volta per tutte. Prima di allora la città non deve scendere sotto lo status \"Boom\"."
"0x39e32dc8" = "La città in difficoltà è @T$TargetTown$. Il suo status non può scendere sotto \"Boom\" prima del @D$EndDate$, altrimenti troppi cittadini lasceranno la città. C'è perfino il rischio che vi scoppi la peste. Devi assicurarti di rifornire la città con merci sufficienti in tempo per evitarlo!"
"0x39e32dc9" = "Bene. @T$TargetTown$ è la città in questione. Riforniscila di tutto ciò di cui ha bisogno entro @D$EndDate$. Il suo status non può scendere sotto \"Boom\". Devo essere onesto e dirti che la città potrebbe benissimo essere colpita dalla peste. Preparati."
"0x39e7361e" = "%1 sconfitto"
"0x39e9081a" = "Hai scoperto l'ubicazione del covo di Barbanera. Per informazioni sulla banda di pirati, clicca con il tasto sinistro sul simbolo del covo sulla carta nautica.<n><n>Attenzione: quando distruggi un covo, la banda di pirati viene annientata. Tuttavia i convogli pirata che in quel momento non erano nel covo vengono avvertiti e fondano un nuovo covo.<n><n>Il tuo primo obiettivo è quindi distruggere tutti i convogli del covo. Idealmente dovresti tendere un agguato ai convogli che entrano o escono dal covo e attaccarli.<n><n>Hai ricevuto altro denaro per sostenerti nella tua impresa.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Distruggi tutti i convogli pirata di Barbanera che sono in mare. Non attaccare il suo covo!"
