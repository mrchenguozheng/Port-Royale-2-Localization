"0x2840c9a8" = "Bene. La tua missione è saccheggiare @a$Amount$ di @G$Goods$ dai mercanti inglesi. "
"0x2840c9a9" = "Bene. La tua missione è saccheggiare @a$Amount$ di @G$Goods$ dai mercanti francesi. "
