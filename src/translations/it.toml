"0x3933132f" = "Oh @s$USER$, che cosa devo fare? Un mercante di @T$Town$ continua a intromettersi nei miei affari e a portarmi via i profitti. Va avanti così da mesi. Puoi aiutarmi a sbarazzarmi del suo convoglio?"
"0x39331330" = "Puoi aiutarmi a organizzare una piccola rappresaglia? Sono certo che un mercante di @T$Town$ sia responsabile del sabotaggio di alcune mie navi. Ora posso solo sedermi ad aspettare che le mie navi tornino dal cantiere. Voglio che distrugga un convoglio del mio spietato avversario. Ti ricompenserò generosamente!"
"0x39331331" = "Non sei tu @A$USER$? Potrei avere un compito per te.<n>Molto tempo fa ho concesso un cospicuo prestito a un mercante di  @T$Town$ e da quasi altrettanto tempo avrebbe dovuto restituirlo.  Beh, non l'ha fatto e non credo che gli verrà in mente di farlo in futuro.<n>Perciò voglio dargli una lezione! Attaccheresti uno dei suoi convogli per me? Ti ricompenserò lautamente!"
