"0xd91d3621" = "numero max di cannoni"
"0xd92d797c" = "Un mercante di un'altra nazione ha attirato via un numero considerevole di lavoratori. Questi lavoratori hanno lasciato la città come coloni, insieme alle loro famiglie.<n><n>Ora il tuo compito è trovare coloni sufficienti perché ogni impresa della città abbia un organico completo di lavoratori entro e non oltre il @D$EndDate$.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario <f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Il numero di cittadini (abitanti meno soldati) deve essere riportato a @I$Pop$ entro e non oltre il @D$EndDate$."
"0xd95aa48e" = "Temo che tu abbia impiegato troppo tempo a rispondere. Parla prima con mia figlia per vedere se ti vuole ancora."
