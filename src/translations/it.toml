"0xf7b263ab" = "%1 si trova personalmente sulla nave nemica. Suggerisce al tuo capitano che la battaglia si decida con un duello.<n><n>Per risparmiare l'equipaggio, il tuo capitano accetta la sfida."
"0xf7b3d0f1" = "Vuoi sovrascriverlo?"
"0xf7b48e5f" = "Affondata: %1"
"0xf7c59ef9" = "C'è carenza di @G$Goods$ da lavorare nella mia città. Le scorte delle varie attività sono già molto basse. Potresti aiutarmi?"
"0xf7c59efa" = "Poco fa l'Associazione dei Produttori Cattolici si è presentata alla mia porta. Si lamentano che in città non c'è abbastanza @G$Goods$. Ho dovuto sopportare le loro lamentele per tre ore. Non posso ripassarci. Non potresti aiutarmi a trarmi fuori da questa situazione delicata?"
"0xf7c59efb" = "Maledizione! Ancora una volta la mia città ha esaurito @G$Goods$. A volte non riesco proprio a capire come i commercianti residenti portino avanti i loro affari. Finché non avrò risolto la faccenda, ti sarei grato se potessi aiutarmi."
"0xf7ca9ed0" = "Navi di scorta"
"0xf7d0d2b4" = "Hai occupato il consiglio cittadino. Da questo giorno questa città appartiene a %1. "
"0xf7d0d2b5" = "Hai cacciato il governatore dalla città. Da questo giorno questa città appartiene a %1. "
"0xf7d0d2b6" = "Hai cacciato il viceré dalla città. Da questo giorno questa città appartiene a %1. "
"0xf7db585d" = "Annulla"
"0xf7de865a" = "Salve, %1. Il marinaio %2 ha offerto i suoi servizi come capitano inesperto."
"0xf7eafb3a" = "IDM_CONTEST_01_2004_LOG_06_HDR"
"0xf7f34739" = "Una chiesa"
"0xf7fab5d2" = "Annessione"
"0xf7fe3fa8" = "Importo"
"0xf802b106" = "Ripara convoglio / nave"
"0xf8036ed5" = "Il bucaniere %1 %2 si è intrufolato nel porto della città e ha minacciato i mercanti in arrivo. Per almeno quattro settimane i mercanti forestieri faranno scalo nella città solo molto malvolentieri."
"0xf8200b14" = "verso %1 (%2)"
