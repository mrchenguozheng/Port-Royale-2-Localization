"0x13cd046e" = "Ogni volta che conquisti città nemiche per un viceré, lui ti concederà in cambio un appezzamento di terra. Su questa terra puoi costruire una città che apparterrà a te e in cui potrai costruire diversi edifici. In altre parole, qualsiasi viceré può aiutarti a diventare proprietario di una tua città. <n><n>Il tuo prossimo obiettivo è migliorare la tua reputazione con la Spagna, perché un viceré ti riceverà solo se hai una buona reputazione con la sua nazione.<n><n>Puoi controllare la tua reputazione con una nazione, per esempio, sotto il nome della città nella vista città. A Margarita, dove inizi il gioco, sono mostrate tre bandiere, che indicano che la tua reputazione con la Spagna è \"neutrale\".<n><n>Puoi migliorare la tua reputazione con una nazione portando a termine missioni per i suoi governatori, cacciando pirati o commerciando con le sue città e consegnando le merci di cui hanno bisogno.<n><n>Poiché Spagna e Francia sono in guerra, puoi ottenere dal governatore di Margarita una lettera di corsa contro la Francia. Con le lettere di corsa puoi migliorare rapidamente la tua reputazione.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Migliora la tua reputazione con la Spagna ad \"amichevole\"."
