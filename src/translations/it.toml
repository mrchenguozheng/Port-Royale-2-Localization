"0xeeced82e" = "@s$USER$, in Europa @n$Nation$ ha carenza di @G$Goods$. Sto quindi organizzando una spedizione in Europa. Comprerò tutta la @G$Goods$ che puoi fornire e sono disposto a offrirti un prezzo unitario di @g$FullPrice$. Ti interessa?"
"0xeeced82f" = "Salve. Sto organizzando una spedizione in Europa. Voglio sfruttare la carenza di @G$Goods$ che c'è là. Offro di comprare tutta la merce che puoi fornire e ti darò un ottimo prezzo per barile, diciamo @g$FullPrice$. Affare fatto?"
"0xeeced830" = "Salve a te, @s$USER$. Sto organizzando un convoglio per l'Europa, perché ho sentito che @G$Goods$ si vende a un prezzo molto alto. Offro un prezzo unitario di @g$FullPrice$ a chiunque possa consegnarmi @G$Goods$ . Affare fatto?"
