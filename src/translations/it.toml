"0x18546893" = "In questo scenario imparerai come combattere una battaglia in mare. Lo scenario inizia con una breve battaglia d'addestramento. Più avanti dovrai rintracciare e distruggere il convoglio di un pirata famoso.<n><n>Conoscerai anche il governatore di Cartagena, dove inizi lo scenario. Ti aiuterà a diventare abile nelle battaglie navali e più avanti ti affiderà la missione di dare la caccia a un certo pirata.<n><n>All'inizio dello scenario il tuo grado è Marinaio. Devi aver raggiunto questo grado per ricevere una missione dal governatore. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Fa' visita al governatore di Cartagena e porta a termine la missione che ti affida."
