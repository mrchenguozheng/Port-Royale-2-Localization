"0x2875b307" = "%1 %2 ha distrutto un convoglio appartenente al pirata %3."
"0x28812f6e" = "Ho sentito che vuoi metterti alla prova come comandante di una battaglia navale. Bene, ho un compito per te che potrebbe giovare a entrambi.<n>In questo momento due navi abbandonate galleggiano senza meta in mare. Voglio che ti sbarazzi di queste navi prima che inizino a rappresentare una minaccia per i miei mercanti.<n>Accetti questa missione?"
"0x28812f6f" = "Ora qualcosa di più difficile. Un uccellino mi ha detto dove sta attualmente vagando un convoglio pirata comandato da @P$PirateName$. Il convoglio è composto da una sola nave, quindi non dovrebbe essere troppo difficile per te distruggerlo.<n>Accetti questa missione?"
"0x28812f70" = "Hai già distrutto un convoglio pirata appartenente a @P$PirateName$. Tuttavia in un covo pirata ci sono di solito diversi convogli, tutti comandati da @P$PirateName$. Puoi eliminare il capo di una banda di pirati solo trovando e distruggendo il loro covo.<n>Ora è emerso un altro convoglio comandato da @P$PirateName$. Questo convoglio è composto da due navi, quindi devi essere ben preparato prima di impegnarti in combattimento.<n>Sei pronto?"
"0x2883fdae" = "Puoi attaccare questo covo pirata dal mare con un convoglio. Prima devi sconfiggere tutte le navi nel porto. "
"0x289d1ced" = "consumo giornaliero"
"0x28b1f98d" = "%1 %2 Hai anche un permesso per erigere edifici e creare attività a %3 e possiedi già un magazzino in città.<n><n>Poiché sei giovane e inesperto, hai raggiunto solo il grado di Mozzo. Pertanto non puoi ancora comandare altri convogli né acquistare altri permessi di costruzione in un'altra città.<n><n>Il tuo grado è determinato dai tuoi beni totali, che comprendono contante e proprietà e al momento ammontano a circa %4. Raggiungerai il grado successivo non appena i tuoi beni raggiungeranno %5.<n><n><n>Buona fortuna!"
"0x28c94158" = "Navi"
"0x28cc4ee4" = "Il convoglio non può salpare perché a bordo ci sono troppe merci. Vendi alcune merci o trasferiscile nel tuo magazzino per non superare la capacità di carico massima del convoglio."
"0x28ef24c0" = "debole"
"0x28ef24c1" = "normale"
