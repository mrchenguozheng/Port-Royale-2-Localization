"0x28f090e8" = "Lettere di corsa"
"0x293d8c9f" = "Eccellente! La tua città è ormai piuttosto grande. Presto i primi mercanti di altre città sbarcheranno per commerciare merci con la tua città.<n><n>Ma la tua città rischia anche di ricevere visite da personaggi meno graditi. Tra questi i pirati e i bucanieri delle nazioni con cui hai cattivi rapporti. Il tuo prossimo compito è quindi assumere soldati ed erigere cannoni portuali.<n><n>Per fortuna i cittadini della tua città possono organizzarsi in larga misura da soli. Devi solo dare loro alcune istruzioni e acquistare i materiali necessari. Dopodiché non ci sono costi aggiuntivi.<n><n>Puoi costruire cannoni portuali dal menu Costruzioni e puoi assumere soldati dal tuo palazzo.<n><n>Ricorda:<n>Anche i soldati hanno bisogno di alloggi! Tuttavia, a differenza dei lavoratori, i soldati richiedono solo uno spazio ciascuno.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Costruisci cinque cannoni portuali e aumenta i tuoi soldati a 300."
