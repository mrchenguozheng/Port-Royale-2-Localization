"0x34d36971" = "Alcuni aspetti della rotta commerciale hanno dovuto essere modificati.<n><n>In questa partita alcune città della rotta non sono ancora state scoperte e sono state rimosse, oppure vuoi commerciare merci in una città ma in quella città non c'è un magazzino. In tal caso, per le merci corrispondenti viene attivato il commercio del capitano per la città in questione."
