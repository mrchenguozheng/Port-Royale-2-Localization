"0x20eef526" = "<ts:80><ts:145><ts:210><n>Esito della battaglia:<n><n>"
"0x20ff905e" = "Equipaggio"
"0x2106ce9e" = "Un capitano esperto ti aspetta alla locanda."
"0x21117682" = "<n><n>Di solito puoi restituire un permesso di costruzione che hai ottenuto. In questo caso però non puoi, perché %1 è la città in cui hai iniziato il gioco."
"0x21117683" = "<n><n>Vuoi restituire il tuo permesso?<n>Ricorda che non posso pagarti nulla per questo!"
"0x211c8552" = "Tempo di gioco scaduto"
"0x2137ec23" = "Grazie. Ti pagherò prezzi alti per vino, attrezzi e spezie fino al @D$Date$. Incontra il mio emissario al mercato e consegna @a$Amount$ di ciascuno. Accetterà solo una consegna completa e ti pagherà sul posto."
"0x2137ec24" = "Suona bene. Allora viaggia nelle città dei nostri nemici e compravi merci importate. Consegna @a$Amount$ di ciascuna entro il @D$Date$ al mio emissario al mercato di @T$TOWN$, ti pagherà più del doppio del prezzo usuale."
"0x2137ec25" = "Sai qual è la cosa migliore? Comprare le merci importate in @n$Nation2$ e causare lì una carenza. Consegna @a$Amount$ di ciascuna al mercato. Il mio emissario aspetterà lì fino al @D$Date$ e ti pagherà un prezzo alto."
"0x215e37a6" = "Di recente ho origliato una conversazione in cui un mercante diceva che una delle sue navi era affondata. Non si preoccupava troppo della nave, era solo un vecchio barcone malandato. Ma a bordo c'era un baule speciale."
"0x215e37a7" = "Allora siamo d'accordo. Nell'ultimo viaggio su cui mi sono imbarcato, il capitano perse le staffe per un baule chissà perché, che poi gettò semplicemente in mare."
"0x215e37a8" = "Un uomo che un tempo era un buon amico è scappato con un mio costoso baule."
"0x2167838b" = "Acquisto di nave"
"0x21743bf7" = " Devo avere queste cose! Non conosciamo il punto esatto in cui la nave è affondata. @l$ChestPos$ Portami il baule entro il @D$EndDate$."
"0x21743bf8" = " Devi procurarmi le cose entro il @D$EndDate$. @l$ChestPos$"
"0x21743bf9" = " Solo di recente mi ha scritto che aveva gettato questo baule in mare. @l$ChestPos$ Devi riportarmi le mie cose! Puoi trovarmi qui fino al @D$EndDate$."
