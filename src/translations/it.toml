"0xe3d4a613" = "Dichiara %1 punti e guida la partita"
"0xe3de2671" = "Il tuo convoglio ha recuperato dal mare uno scrigno contenente uno dei documenti del governatore."
"0xe3de2672" = "Ora hai imbarcato tutti i documenti del governatore. Porta i documenti a @T$TOWN$ "
"0xe3e1d467" = "%1,<n><n>non puoi acquistare permessi perché la tua reputazione presso la mia nazione non è abbastanza alta e, inoltre, non hai fatto abbastanza per questa città.<n><n>Accresci la tua reputazione presso la mia nazione e commerci con la mia città per migliorare il tuo record commerciale, poi parleremo di nuovo."
"0xe3e1d468" = "%1,<n><n>la tua reputazione presso la mia nazione non è abbastanza alta, temo di non poterti vendere permessi.<n><n>Torna quando la tua reputazione sarà migliorata."
"0xe3e1d469" = "%1,<n><n>non hai fatto abbastanza commercio con questa città. Consegna merci richieste per migliorare il tuo record commerciale. Solo allora potrai comprare un permesso."
"0xe3e33a30" = "Sia %1 la tua nuova città. Ora puoi entrarvi come in qualsiasi altra città per erigervi edifici e fondarvi imprese.<n>L'intero distretto non è ancora a tua disposizione, ma se catturerai altre città ti darò la terra che ti serve."
"0xe3fa97eb" = "Allora è deciso. Porta @a$Amount$ utensili a @T$DestTown$. Al mercato riceverai @g$GoldPerBarrel$ per <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>. Le merci devono arrivare entro il @D$Date$."
"0xe3fa97ec" = "E sia. Consegna @a$Amount$ a @T$DestTown$. Gli utensili devono arrivare entro il @D$Date$. "
"0xe3fa97ed" = "Bene! Ti incarico di procurarti @a$Amount$ di utensili. Consegnali entro il @D$Date$ a @T$DestTown$. Al mercato ti saranno pagati @g$GoldPerBarrel$ per <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
