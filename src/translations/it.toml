"0x35f48fe3" = "[riddle:answer=Tampico;group=35f48fe3;clue=più occidentale,regione;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 3*`]Questa è la città più occidentale della regione."
"0x35f48fe4" = "[riddle:answer=Cancun;group=35f48fe4;clue=templi imponenti,angolo;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 2`]Tanto tempo fa qui viveva altra gente, che ai suoi dèi dedicava templi imponenti. Sopra si trova X, lassù in un angolo. Navigando a sud-est non lo trovi, te lo dico in anticipo."
"0x35f48fe5" = "[riddle:answer=-southwest;group=35f48fe5;clue=sud-ovest,angolo;level=direction;certainty=certain;source=original-en]Tanto tempo fa qui viveva altra gente, che ai suoi dèi dedicava templi imponenti. Sopra si trova X, lassù in un angolo. Navigando a sud-ovest non lo trovi, te lo dico in anticipo."
"0x35f48fe6" = "[riddle:answer=Havana;group=35f48fe6;clue=rum,sigaro;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 12`&cargo]Da X a Nombre la distanza non è molta: hai rum in abbondanza e un sigaro ti consola."
"0x35f4904e" = "[riddle:answer=Gibara;group=35f4904e;clue=scogliere,molto meglio;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 20*`]Se dalle scogliere a nord ti sporgi un po', presto in X starai molto meglio."
"0x35f4904f" = "[riddle:answer=Turk Islands;group=35f4904f;clue=isolette,corda;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 6`]Tre isolette circondano la zona: ma solo su una trovi la corda buona."
"0x35f49050" = "[riddle:answer=San Juan|San Thoma;group=35f49050,35f490bf;clue=isola,sud-est;level=town;certainty=either;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 1`]X sta sull'isola, piccola assai: ma a sud-est non ne trovi di più grandi ormai."
"0x35f49051" = "[riddle:answer=-north;group=35f49051;clue=frattura,fumo;level=direction;certainty=certain;source=original-en]Qui nella catena di isole vedrai una frattura: a ovest ci sono isole, a sud pure. A nord non c'è nulla, solo acqua e fumo."
"0x35f49052" = "[riddle:answer=Vera Cruz;group=35f49052,35f490c1,35f490c2,35f49130;clue=grande baia,più a ovest;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 27*`]In una grande baia giacciono alcune città, tre. X indica quella più a ovest."
"0x35f49053" = "[riddle:answer=Roatán;group=35f49053;clue=più a sud;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 13`]In una grande baia giacciono alcune città, tre. X indica quella più a sud."
"0x35f49054" = "[riddle:answer=Roatán;group=35f49054;clue=due isole,maggiore;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 21`]Una baia contiene due isole, una grande e una piccola. La città sulla maggiore è quella che X evoca."
"0x35f49055" = "[riddle:answer=Cayman;group=35f49055;clue=isola remota,lontana;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 25`]Un'isola remota, piccola e lontana: X non può essere che quella, è cosa certa e piana."
"0x35f49056" = "[riddle:answer=Port Royale;group=35f49056;clue=strade lastricate d'oro,porto maestoso;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 8`]X è una città dalle strade lastricate d'oro: il suo porto maestoso è uno spettacolo."
"0x35f49057" = "[riddle:answer=Santo Domingo;group=35f49057;clue=vulcano,sud-est;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 19*`]Quattro città si dispongono intorno a un vulcano: quella a sud-est è quella che ti aspetta."
"0x35f490bf" = "[riddle:copy=35f49050]"
"0x35f490c0" = "[riddle:answer=Guadeloupe|Martinique;group=35f490c0;clue=sabbie,merci di gran valore;level=town;certainty=either;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 18`&cargo]Sulle sue sabbie il mare ospita città di cui a nessuno importa; ma una di queste ha sempre prodotto merci di gran valore."
"0x35f490c1" = "[riddle:copy=35f49052]"
"0x35f490c2" = "[riddle:copy=35f49052]"
"0x35f490c3" = "[riddle:answer=Providence;group=35f490c3,35f490c4;clue=culla,penisola;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9]Un'isola giace qui, come in una culla: una penisola da nord si piega ad angolo."
"0x35f490c4" = "[riddle:copy=35f490c3]"
"0x35f490c5" = "[riddle:answer=Santa Marta;group=35f490c5;clue=Spiaggia bianca,giungla,sole;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 23`]Spiaggia bianca accanto alla giungla, un fiumiciattolo che nessuno conosce. Qui stai ben nascosta, in una baia che vede solo il sole."
"0x35f490c6" = "[riddle:answer=Maracaibo;group=35f490c6;clue=stretto,vascelli;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 5`]Qui sta la città che guarda lo stretto e custodisce la baia piena di vascelli."
"0x35f490c7" = "[riddle:answer=Caracas;group=35f490c7,35f49136;clue=scogliera,vascello naufragato;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 7`]Poco fuori dalla città, ai piedi di una scogliera, giacciono i resti di un vecchio vascello naufragato."
"0x35f490c8" = "[riddle:answer=Port of Spain;group=35f490c8;clue=Spagna,legname,grano;level=town;certainty=certain;source=original-en]La Spagna fondò qui un porto: troverai legname e mattoni, ma grano non ce n'è."
"0x35f49130" = "[riddle:copy=35f49052]"
"0x35f49131" = "[riddle:answer=east;group=35f49131;clue=più a est;level=direction;certainty=certain;source=original-en]In una grande baia giacciono alcune città, tre. X indica quella più a est."
"0x35f49132" = "[riddle:answer=Providence;group=35f49132,35f49133;clue=culla,la terra da nord;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9]Un'isola giace qui, come in una culla: la terra da nord si piega ad angolo."
"0x35f49133" = "[riddle:copy=35f49132]"
"0x35f49134" = "[riddle:answer=Cartagena;group=35f49134;clue=ponte,poco più avanti;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 16*`]Vieni da ovest, attraversi il ponte: la città con la X è solo poco più avanti."
"0x35f49135" = "[riddle:answer=Gibraltar;group=35f49135;clue=meraviglioso,scogliere imponenti;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 14*`]Oh, che luogo meraviglioso, adagiato in una baia, protetto da scogliere imponenti: questo è X, non c'è da dubitarne!"
"0x35f49136" = "[riddle:copy=35f490c7]"
"0x35f49137" = "[riddle:answer=southeast;group=35f49137;clue=palude,terraferma;level=direction;certainty=certain;source=original-en]Un fiume potente e profondo scorre verso est nella palude. Da lì a sud-est, talvolta sulla terraferma, fino alla città con la X, al confine, alla fine."
