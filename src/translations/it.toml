"0xdbd3f83d" = "%1,<n>che cosa vuoi da me? Se fossi entrato in città come un vero marinaio, avrei rivolto i miei cannoni contro di te, perché sei ostile alla mia nazione.<n><n> Ma ora che sei qui, devo comportarmi da gentiluomo."
