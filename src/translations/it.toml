"0xcf3f179d" = "La prosperità di @T$TargetTown$ mi sta molto a cuore, ma temo che l'economia della città sia in difficoltà da qualche tempo. Il problema è sempre lo stesso: i mercanti smettono di fare scalo in città perché la domanda è troppo bassa e le merci prodotte dalla città non vengono raccolte. Questo rende la città poco attraente per nuovi coloni. Mi aiuterai a rimettere in piedi la città?"
