"0x30bb44fc" = "Non sei tu il famoso @A$USER$? Potresti aiutarmi? Sono inseguito da un cacciatore di taglie, uno dei miei avversari me l'ha messo alle calcagna. "
"0x30bb44fd" = "Accomodati, @A$USER$. Mi chiamo @N$OwnerName$ e ho una questione importante di cui parlarti. Da dove comincio? Beh, ho litigato con mia moglie; mi ha accusato di esserle infedele, cosa che naturalmente è del tutto falsa. Comunque mi ha cacciato di casa, e non è il peggio: ha ingaggiato un cacciatore di taglie, così non posso più nemmeno entrare in città. Puoi aiutarmi?"
"0x30bb44fe" = "Sembri uno che sa tenere in riga una nave.<n>Devo andare a @T$Town$ con urgenza, per consegnare documenti che incriminano uno dei mercanti del posto. Purtroppo il mercante l'ha saputo e ora cerca di mettere le mani su quei documenti. Non potresti trovare un modo per portarmi a @T$Town$?"
