"0x132a8a31" = "%1 ha scatenato il bucaniere %2 contro le nostre città. Di recente ha attaccato %3, e ora è in rotta verso la sua città natale. Faresti un enorme favore a me e alla mia nazione se fermassi questo bucaniere."
