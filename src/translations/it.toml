"0x0711985e" = "Pirata Monco"
"0x07124c09" = "Obiettivo dello scenario non raggiunto"
"0x07242fbe" = "Lavoratore"
"0x07246168" = "Riparazione"
"0x072a9579" = "Ti sono molto grato per avermi portato le merci importate, perché noi del Nuovo Mondo non riceviamo rifornimenti dai convogli di trasporto della mia nazione ormai da molte settimane. Come ricompensa ti regalo due fluyt olandesi. Ti aspettano nel porto."
"0x0744a699" = "Non posso dirti quante altre città visiterà la flotta del tesoro. Possiamo solo dire con certezza che la flotta imbarca più oro a ogni città che visita. Non mi importa quando attacchi, perché puoi tenerti l'oro. Voglio solo che ti assicuri che la flotta del tesoro sparisca. L'ultima volta è stata a @T$StartTown$, e la sua prossima tappa è @T$DestTown$, dove resterà all'ancora per circa cinque giorni."
"0x0744a69a" = "Quindi devi agire in fretta. L'ultima volta è stata a @T$StartTown$, da lì è partita per @T$DestTown$, dove getterà l'ancora più a lungo del solito. Più a lungo rimandi l'attacco, più oro avrà a bordo. Puoi tenertelo tutto, ma la flotta del tesoro non deve mai raggiungere l'Europa."
"0x0744a69b" = "Allora è deciso, grazie. Se le mie informazioni sono corrette, la flotta del tesoro ha lasciato da poco @T$StartTown$ ed è in rotta verso @T$DestTown$. Lì getterà l'ancora più a lungo del solito. Ora affrettati e intercettala!"
"0x0746253d" = "Se vuoi che quanti più mercanti possibile visitino la tua città, non dovresti semplicemente rifornirla di certe merci. Idealmente dovresti scegliere merci prodotte nelle città vicine, perché i mercanti terranno conto della lunghezza del viaggio.<n><n>I mercanti che visitano la tua città comprano automaticamente le merci che sono abbondanti e quindi hanno prezzi bassi nella tua città. Puoi anche vendere direttamente alla tua città le merci che hai prodotto. Purché le merci non siano più care che in altre città, verranno acquistate regolarmente dai mercanti.<n><n>Il vantaggio è che ci sono sempre merci sufficienti per i tuoi cittadini e non devi nemmeno preoccuparti di trasportare le merci in altre città."
