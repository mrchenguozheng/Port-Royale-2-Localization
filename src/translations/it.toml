"0xfda277f4" = "%1 è piena e non ha più spazio su cui costruire un magazzino. Se vuoi comunque acquisire una posizione in questa città, puoi provare a persuadere uno dei commercianti locali a demolire una delle sue attività.<n><n>Le attività vengono demolite se il prezzo delle merci prodotte in città resta basso a lungo, cioè se c'è un'eccedenza della merce. Per ottenere questo, devi prima cominciare ad accumulare il prodotto. Poi vendi quantità sufficienti del prodotto al mercato cittadino per far scendere il prezzo a un livello basso.<n><n>Le merci prodotte vengono consegnate al mercato cittadino una volta al giorno. Se il prezzo è al minimo, l'attività riduce il numero dei suoi lavoratori. Puoi verificarlo cliccando sull'attività. Un'attività viene demolita quando 30 lavoratori sono stati licenziati."
"0xfda5ded4" = "La città è fiorente grazie a una scoperta d'oro"
"0xfdaf6463" = "Devo ringraziarti ancora, hai fatto tantissimo per la mia nazione. Come ricompensa ti darò la terra restante per la tua città %1. Ora possiedi l'intero distretto."
"0xfdb7f907" = "Un fuoco da campo rivela il covo dell'insegnante, non lontano dalla riva. Il tuo capitano rema verso la riva e viene accolto da un vecchio. Quando il vecchio vede tutto quel vino, si frega le mani dalla gioia."
"0xfdb7f908" = "Non lontano dalla riva il tuo convoglio scopre un piccolo accampamento di un eremita. Il tuo capitano rema verso la riva e incontra un vecchio che indossa un'uniforme da capitano ancora più vecchia di lui. Scorge i barili di rum ed è felicissimo."
"0xfdb7f909" = "Dopo un po' il tuo convoglio scopre un covo sulla terraferma. Il capitano rema verso la riva e si guarda intorno. Alla fine trova il vecchio maestro e gli spiega cosa lo porta lì. L'eremita accetta il cibo."
