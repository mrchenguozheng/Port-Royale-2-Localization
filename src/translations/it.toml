"0x0ea0e0ea" = " Porta a termine questa missione entro il @D$EndDate$."
"0x0eb34b66" = "In questo scenario imparerai come creare attività e scoprirai di cosa devi tener conto nel farlo. Costruirai anche zone residenziali per i tuoi nuovi lavoratori.<n><n>In Port Royale 2 puoi costruire in qualsiasi città in cui hai acquistato un permesso di costruzione. Più permessi hai, più costoso sarà il prossimo. Hai già un permesso nella città in cui hai iniziato il gioco, quindi puoi iniziare subito a costruire nuovi edifici lì.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Costruisci un impianto di produzione del cacao e una zona residenziale a Santa Marta."
"0x0ede126a" = "Ora sai come funzionano le battaglie navali. È anche possibile attaccare un'intera città per saccheggiarla o conquistarla per un'altra nazione. Tuttavia, per farlo, ti servono grandi convogli con navi potenti. Come puoi immaginare, attaccare una città danneggerà seriamente la tua reputazione con la nazione in questione e i suoi convogli militari ti daranno la caccia da quel momento.<n><n>In alternativa puoi attaccare un covo di pirati. I covi dei pirati si trovano di solito in luoghi segreti, ma ognuno di questi luoghi diventerà noto a un certo punto del gioco. Puoi poi attaccare un covo di pirati come attaccheresti una città, per distruggere l'intera banda di pirati.<n><n>La forza delle difese intorno a uno di questi covi dipende da quanto a lungo una banda di pirati è in libertà e da quanto con successo i suoi convogli hanno saccheggiato navi mercantili.<n><n>Il tuo compito finale in questo scenario sarà razziare un piccolo covo di pirati. Scopri dal governatore di @T$TOWN$ dove si trova il covo.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Distruggi il covo del pirata @P$PirateName$."
"0x0eecc4e8" = "Colonia inglese"
"0x0eecc4e9" = "Colonia francese"
"0x0eecc4ea" = "Colonia olandese"
