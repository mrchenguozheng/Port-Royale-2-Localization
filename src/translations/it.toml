"0xe1cdc367" = "Ora hai imparato alcuni comandi di base e sai come inviare un convoglio da una città all'altra. È molto importante, perché all'inizio ti guadagnerai da vivere trasportando e commerciando merci tra le città.<n><n>Nella seconda parte di questo scenario comprerai una nave e la aggiungerai al tuo convoglio esistente.<n><n>Ecco un altro suggerimento:<n><n>Puoi premere F1 in qualsiasi momento durante la partita per visualizzare una pagina di aiuto che spiega la configurazione di tastiera e mouse.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Il tuo convoglio con due navi deve raggiungere il porto della città di Cartagena."
