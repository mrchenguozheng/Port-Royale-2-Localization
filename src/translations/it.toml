"0xdef5305e" = "Saccheggiato: %1"
"0xdf10406e" = "Ben fatto! La tua città è già cresciuta un po'.<n><n>Non appena la tua città avrà più di 1.000 abitanti, diventerà interessante per i mercanti delle altre città, che potranno venire a commerciare le loro merci.<n><n>I mercanti visitano di solito una città se in essa c'è domanda di una certa merce, in altre parole se ci sono merci che non sono disponibili nella tua città.<n><n>Hai appena ricevuto un messaggio sul commercio e la produzione nella tua città. Per leggerlo, apri il registro.<n><n>Il tuo primo obiettivo è aumentare la popolazione della tua città a 1.000.<n><n>Nota: perché una città abbia più di 500 abitanti, deve avere una locanda!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumenta la popolazione della tua città a 1.000."
