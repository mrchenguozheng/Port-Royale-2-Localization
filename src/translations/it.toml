"0x3641d8d1" = "Grazie per avermi restituito mia moglie. Anche se ho molto apprezzato la pace e la quiete di questi ultimi giorni, non potevo semplicemente abbandonare mia moglie ai miei nemici. Come ricompensa, prendi questa mappa che mostra un covo contenente @a$Amount$ di merci."
"0x3641d8d2" = "Dunque non mi hai restituito mia moglie! Allora non posso ricompensarti. Però, detto tra noi, ti sono davvero molto grato."
"0x36573a59" = "Le tue truppe prendono presto il sopravvento. Improvvisamente sopra le mura della città viene issata una bandiera bianca: la guardia cittadina si è arresa!<n><n>Che cosa vuoi fare ora?"
"0x3657dd22" = "Mia moglie è felicissima che tu abbia trovato il suo cane. Prendi questa mappa che mostra un covo contenente @a$Amount$ di merci."
"0x3657dd23" = "Come? Vuoi dire che hai buttato il cane in mare? Sono comunque molto grato a te. Naturalmente non posso ricompensarti ufficialmente, ma un tempo nascosi un tesoro in un luogo segreto. Ecco una mappa."
"0x366de173" = "Oh, grazie per avermi riportato la mia amata figlia. Ecco una mappa. Vi ho segnato il punto dove un tempo nascosi molto tesoro."
"0x366de174" = "Che cosa hai fatto! Come hai potuto lasciare mia figlia in mano al nemico? Dirò a tutto @n$Nation$ che non ci si può fidare di te! (La reputazione presso @n$Nation$ è diminuita)"
