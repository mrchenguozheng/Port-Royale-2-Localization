"0xfb343dde" = "Mentre stai saccheggiando la città, una giovane donna ti corre incontro.<n>\"So che questo attacco viene condotto solo per ordine di mio padre! Ti ha detto che sono qui di mia volontà e che sono davvero innamorata del mio rapitore? Ti prego di non riportarmi indietro, ti ricompenserò!\".<n><n>Vuoi abbandonare la ragazza al suo destino qui a @T$TargetTown$?"
"0xfb343ddf" = "La figlia del governatore ti ringrazia e ti dà una mappa che mostra l'ubicazione di un covo contenente @a$Amount$ di merci."
"0xfb3648b2" = "Rotta commerciale attiva"
"0xfb399b9a" = "Un commerciante locale è disposto a venderti la zona residenziale per un prezzo di %1."
"0xfb3ffb48" = "Vorrei ringraziarti ancora una volta per aver avuto la generosità di cedermi uno dei tuoi convogli. Al momento è in fase di armamento e sarà pronto a salpare tra %1 giorni.<n><n>Se vuoi cedermi un altro convoglio, devi aspettare fino ad allora."
"0xfb425369" = "Supporto al design"
"0xfb4be839" = "Eccellente! Hai distrutto tutti i convogli pirata, così nessun pirata può sfuggire. Se distruggi tutti i convogli di una banda pirata prima di attaccare il loro covo, ci vorrà più tempo perché nuovi convogli pirata compaiano nei Caraibi.<n><n>Ora attacca il covo come faresti con una città, selezionando il tuo convoglio e poi facendo clic destro sul covo dei pirati. Se alcune navi pirata sono ancorate in porto, devi prima attaccarle per poter vincere la battaglia del porto.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Distruggi il covo dei pirati di Barbanera."
"0xfb514e13" = "Nuova città"
"0xfb5c8a98" = "Un blocco a @T$TOWN$"
"0xfb64ad02" = "Hai vinto "
"0xfbb36ec1" = "Devo ringraziarti ancora, hai fatto tantissimo per la mia nazione. Ti ricompenserò con altra terra per la tua città %1. Possiederai quindi il %2% del distretto."
"0xfbb97bb9" = "Ritira la ricompensa dal governatore."
