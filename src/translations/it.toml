"0xe37f3b10" = " Poiché le città appartenenti alla mia nazione non producono abbastanza, sono stato costretto a contare sulle consegne dalle città inglesi."
"0xe37f3b11" = " Poiché le città appartenenti alla mia nazione non producono abbastanza, sono stato costretto a contare sulle consegne dalle città francesi."
