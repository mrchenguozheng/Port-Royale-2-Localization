"0x21cae149" = "Molto bene! Ora devi rendere più potente il tuo convoglio, così potrai affrontare diversi convogli militari. Dovresti avere nel tuo convoglio almeno tre navi che siano fregate o navi più grandi.<n><n>Puoi catturare le navi o provare ad acquistarle nei cantieri delle città con governatore.<n><n>Rendi queste navi navi di scorta e assicurati che siano completamente armate e con equipaggio completo di marinai.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arma il tuo convoglio in modo che abbia almeno tre navi di scorta completamente armate e con equipaggio completo, fregate o navi più grandi. "
"0x21d142f5" = "Ripara il convoglio in questa città"
"0x21e727b4" = "Sono certo che tu abbia già sentito parlare del pirata @P$PirateName$. Ha già @I$NumConvoys$ convogli e non abbiamo ancora scoperto il suo covo. Per fortuna conosciamo l'ubicazione di uno dei suoi convogli. Forse è ancora nei paraggi. Voglio che tu distrugga questo convoglio. "
"0x21e727b5" = "Dobbiamo agire in fretta, perché ho appena saputo dove si trova uno dei convogli appartenenti al pirata @P$PirateName$. Trova e distruggi questo convoglio."
"0x21e727b6" = "Tutti i pirati hanno il proprio covo da cui inviano convogli a catturare bottino. Intanto il pirata @P$PirateName$ ha messo insieme una flotta di @I$NumConvoys$ convogli. Per caso abbiamo scoperto dove si trova da poco un capitano importante di questa banda e il suo convoglio. Voglio che tu trovi e distrugga questo convoglio."
