"0xe6490f96" = "Siamo nel 1676 nella città di governatorato olandese delle Isole Turks. L'Olanda possiede sette città, cinque delle quali coloniali, una di governatorato e una di vicereame.<n><n>L'Inghilterra possiede 14 città ed è in guerra con l'Olanda da molto tempo, e lo sarà ancora per molti mesi. Finché dura questa guerra, devi catturare città della Corona inglese per conto dell'Olanda.<n><n>Ma prima di poter attaccare qualsiasi città inglese, ti servono più capitali e più armi per il tuo convoglio. Il tuo primo obiettivo è sconfiggere tre convogli mercantili inglesi e catturare le loro navi.<n><n>Prima però devi ottenere una lettera di corsa dal governatore olandese delle Isole Turks.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Fai visita al governatore delle Isole Turks e ottieni una lettera di corsa contro l'Inghilterra."
"0xe64f1385" = "Molto bene! Hai distrutto uno dei convogli pirata di Barbanera. Ora va dal governatore di @T$TOWN$ e ritira la tua ricompensa.<n><n>Ha anche un'altra missione da farti compiere.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Compi un'altra missione per il governatore di @T$TOWN$."
"0xe65025c3" = "in 1 città"
"0xe6510ae7" = "Devi aumentare le scorte di frumento, mattoni, cotone, zucchero e tabacco a @a$Amount$ ciascuno entro il @D$EndDate$."
"0xe65524e7" = "Assicurati che la tua città abbia una scorta di @a$Amount$ di tutte le merci."
"0xe674b971" = "Mappa del tesoro"
"0xe67d58b9" = "Oro scoperto"
"0xe6851da5" = "Nell'ultimo scenario hai imparato che il tuo grado dipende dal tuo patrimonio totale. Il tuo patrimonio totale comprende il denaro contante nonché i tuoi edifici, le navi e le merci. Puoi controllare il tuo patrimonio totale in qualsiasi momento sotto \"Successi\" nel registro.<n><n>Puoi anche controllare la barra blu che indica la tua esperienza, sempre in fondo allo schermo nella visualizzazione del convoglio. Quando la barra raggiunge il bordo destro dello schermo, vieni promosso al grado successivo. Non puoi scendere sotto un grado una volta raggiunto.<n><n>Più alto è il tuo grado, più convogli puoi comandare e, quindi, maggiore sarà il numero di città in cui potrai in seguito fondare imprese. Dopo aver raggiunto un certo grado hai diritto a un numero illimitato di convogli e permessi di costruzione."
"0xe6d65f53" = "Abitanti"
"0xe6d9252d" = "%1, sei dunque il %2 di cui mio padre mi ha tanto parlato. Io sono %3. Non vuoi unirti a me e raccontarmi le tue avventure?"
"0xe6d9252e" = "Credo di aver già sentito parlare di te, %1. Io sono %3, la figlia del governatore. Ho sempre desiderato incontrare un %2. Ti prego, raccontami le tue avventure!"
"0xe6d9252f" = "Dunque sei tu il famoso %1! Dai racconti che ho sentito mi ero immaginata che fossi molto più alto. Ma ciò non ti rende meno interessante! Vieni qui e raccontami le tue avventure! Mio padre, il governatore, mi ha già parlato tanto di te."
"0xe6d92530" = "%1,<n>sono così felice di rivederti. Raccontami come stai da quando ci siamo visti l'ultima volta. Mi hai portato qualcosa?"
"0xe6d92531" = "%1,<n>è meraviglioso rivederti. Non ho smesso di pensarti dal nostro ultimo incontro. Entra in fretta, ho molto da raccontarti."
"0xe6d92532" = "%1,<n>sono così felice che tu sia venuto a trovarmi di nuovo. Ho raccontato le tue avventure a tutte le mie amiche. Ma ora devi raccontarmene altre, perché le ragazze muoiono dalla voglia di saperne di più. Entra in fretta."
