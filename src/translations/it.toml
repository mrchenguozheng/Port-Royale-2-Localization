"0x33e4a28d" = "Voglio che attacchi i convogli militari di @n$HostileNation$ e catturi due navi di tipo @S$ShipType$. Metti all'ancora le navi nel porto e poi torna da me."
"0x33e4a28e" = "Voglio che attacchi i convogli militari di @n$HostileNation$ e catturi due navi di tipo @S$ShipType$. Metti all'ancora le navi nel porto e poi torna da me."
