"0x1be7a5dc" = "Devi trovare un pacco. @l$Pos$ Restituiscilo a @N$OwnerName$ a @T$TOWN$ entro il @D$EndDate$. "
"0x1bf425d5" = "Purtroppo sei nemico della nazione a cui appartiene la città e sei quindi entrato di nascosto nel porto."
