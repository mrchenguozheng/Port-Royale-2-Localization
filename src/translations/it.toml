"0xdca0a525" = "Vendi"
"0xdcba5843" = "Sono lieto di vederti, @A$USER$, perché ho bisogno del tuo aiuto. Un tempo servivo sotto il pirata @P$PirateName$. Tuttavia sono rinsavito e ho fatto un patto con il governatore di @T$TargetTown$. Purtroppo i miei antichi compagni l'hanno saputo e hanno messo una taglia sulla mia testa. Puoi aiutarmi e portarmi a @T$TargetTown$?"
"0xdcba5844" = "Ho sentito che ci si può fidare di te, @A$USER$. Sono al servizio del governatore di @T$TargetTown$ e devo vederlo urgentemente per dargli informazioni molto riservate. Purtroppo certe persone sono decise a impedirmi di raggiungere @T$TargetTown$. Per questo ti chiedo se puoi concedermi un passaggio sicuro."
"0xdcba5845" = "Oh, sono perseguitato dalla sfortuna. Alcune settimane fa mi sono imbattuto in una nave appartenente al famigerato pirata @P$PirateName$. Tuttavia il capitano di quella nave doveva essere molto inesperto, perché siamo riusciti ad affondarla quasi senza sforzo.<n>Purtroppo quel povero capitano si è rivelato l'amato nipote del pirata @P$PirateName$. Da quando ha sentito il mio nome mi dà la caccia. Il mio equipaggio si è preso la mia nave ed è fuggito terrorizzato, e ora sono bloccato qui.<n>Puoi aiutarmi ad arrivare a @T$TargetTown$, la mia città natale?"
