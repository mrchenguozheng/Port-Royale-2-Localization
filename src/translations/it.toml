"0xde535352" = "Purtroppo a Tortuga è scoppiata una pestilenza. Infurierà in città per circa un mese. Lo status della città cala considerevolmente e i suoi cittadini muoiono ogni giorno. Molti cittadini, terrorizzati dalla malattia, fuggono.<n><n>Per te, come mercante, è interessante anche che la domanda di vestiti e legno raddoppia in città mentre infuria la pestilenza.<n><n>Il tuo compito ora è garantire che la città sia rifornita durante la pestilenza e che il numero di cittadini non diminuisca.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Il numero di cittadini (abitanti meno soldati) deve essere riportato a @I$Pop$ entro e non oltre 20 giorni dalla fine della pestilenza. Questo garantirà che tutte le imprese abbiano un organico completo di lavoratori."
