"0xda75935c" = "Catturare una città"
"0xda93dbe1" = "Molto bene! Non è stato affatto facile! L'Inghilterra ha ormai perso tanti convogli militari che le sue città possono essere catturate. In grato riconoscimento del tuo servizio, il governatore delle Isole Turks ti fornisce altre quattro caracche.<n><n>Puoi catturare le città di una nazione solo su ordine di un viceré. Un viceré ti ordinerà di catturare una città solo se la sua nazione è militarmente forte e la nazione nemica è militarmente debole.<n><n>Purtroppo l'Olanda non è abbastanza forte per poter catturare una città. Tuttavia puoi fare qualcosa al riguardo: fai visita al viceré olandese di Grand Bahama e cedigli uno dei tuoi convogli. Egli allestirà allora un nuovo convoglio militare, che accrescerà la potenza militare dell'Olanda.<n><n>Se vuoi cedere un convoglio a un viceré, il convoglio in questione deve avere esattamente cinque navi e almeno 150 cannoni.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aiuta il viceré ad accrescere la potenza militare dell'Olanda. Poi accetta una missione per catturare città per suo conto."
"0xdab4fea7" = "Edifici residenziali"
"0xdac343f7" = "IDM_CONTEST_01_2004_LOG_03_HDR"
"0xdac43b47" = "Mancanza di coloni"
"0xdacb8ff6" = "Qualità della vita nella tua città"
"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "Pulsante  "
"0xdaeb0484" = "Questa volta inizi lo scenario a Cartagena, una città di governatorato nel mezzo dei Caraibi.<n>Il tuo convoglio, composto da uno sloop, è in porto.<n>Devi prima armare il tuo convoglio, perché questo scenario comporterà battaglie navali.<n>Va ai moli e apri il menu Carico."
"0xdaeb0485" = "Come puoi vedere, non hai cannoni né munizioni a bordo del tuo convoglio. Hai anche bisogno di un equipaggio.<n>Imbarca l'equipaggio più numeroso e quanti più cannoni puoi, oltre a 10x10 di ciascuno dei tre tipi di munizioni per i tuoi cannoni.<n>Può darsi che non ci sia abbastanza spazio nel tuo convoglio, perché i cannoni sono pesanti. In tal caso puoi vendere parte delle merci che hai caricate."
"0xdaeb0486" = "Ben fatto! Ora il tuo convoglio è armato e pronto per una battaglia su piccola scala.<n>Guarda caso, il governatore di Cartagena ha ora la missione perfetta per te.<n>Clicca sull'edificio del governatore e accetta la sua missione."
"0xdaeb0487" = "I governatori propongono spesso missioni che, se portate a termine, miglioreranno la tua reputazione presso la loro nazione.<n>Hai anche il diritto di chiedere ai governatori lettere di corsa o di reclamare il riscatto per i bucanieri che hai catturato.<n>Ora usa il tuo convoglio per trovare le navi di cui ti ha parlato il governatore."
"0xdaeb0488" = "Molto bene, hai localizzato il convoglio.<n>Il passo successivo è preparare la nave al combattimento e ingaggiare la battaglia. Per farlo, apri l'elenco delle navi del tuo convoglio e seleziona il tuo sloop. Per dichiararlo nave da guerra, premi il pulsante accanto al cannone. Puoi poi \"attaccare\" il convoglio facendo clic con il tasto destro su di esso."
"0xdaeb0489" = "Questa è la vista della battaglia navale di Port Royale.<n>Mostra la tua nave e puoi vedere le navi abbandonate spostando la finestra di visualizzazione.<n>Ora disattiva la modalità pausa ed esercitati a navigare con il tasto destro del mouse. La finestra Eventi mostra la direzione del vento e la nave durante le battaglie navali."
"0xdaeb048a" = "Tutte le navi impegnate nella battaglia sono mostrate nella parte inferiore dello schermo. Qui puoi scegliere quale munizione usare. Seleziona le palle pesanti e affonda una delle navi nemiche.<n>Puoi sparare con il tasto sinistro del mouse, ma solo quando la tua nave è in buona posizione di tiro. I bersagli sono allora mostrati in rosso."
"0xdaeb048b" = "Bene! Arremba la seconda nave.<n>Per farlo, clicca sul pulsante \"Arremba\" in basso a destra nella visualizzazione della nave.<n>Poi dirigiti verso la nave nemica e speronala. Nota: il pulsante F1 è attivo anche durante le battaglie navali."
"0xdaeb048c" = "Di solito il nemico ha un equipaggio e a bordo della nave si scatena una battaglia tra il tuo equipaggio e il suo.<n>Quando la battaglia è finita, tutte le navi arrembate passano al vincitore.<n>Ora aggiungi la nave nemica al tuo convoglio e chiudi la finestra Trasferisci ."
"0xdaeb048d" = "Molto bene!<n>Ora rimanda il tuo convoglio a Cartagena."
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "Un convoglio appartenente al pirata %1 ha attaccato un mercante di %2."
"0xdb0108d5" = "Per prima cosa compra una nuova nave. Va al cantiere navale e compra una nave con quanti più cannoni possibile."
"0xdb0108d6" = "Seleziona il tuo convoglio e poi fai clic con il tasto destro sul porto per aggiungere la nuova nave al convoglio."
"0xdb0108d7" = "Tutti i convogli sono composti da navi mercantili e navi di scorta.<n>Se una nave del tuo convoglio deve partecipare a una battaglia, devi definirla come nave da guerra. <n>Apri l'elenco delle navi del tuo convoglio per visualizzare tutte le tue navi."
"0xdb0108d8" = "L'elenco Navi mostra tutte le navi del tuo convoglio. Lo stato di nave da guerra è mostrato nell'angolo in alto a destra di ogni nave. Se è visualizzato il simbolo del cannone, la nave è definita nave da guerra e partecipa alle battaglie. Cliccando su questo angolo si cambia direttamente lo stato.<n>Ma ora dovresti cliccare sulla tua nuova nave e selezionarla. "
"0xdb0108d9" = "I dettagli tecnici della nave, come la sua capacità di carico massima, sono mostrati qui come nel cantiere navale.<n>Puoi anche vedere il costo giornaliero di mantenimento della nave.<n>Ora converti la nave in nave da guerra spuntando il simbolo del cannone."
"0xdb0108da" = "Ben fatto!<n>Cannoni e marinai sono sempre divisi in parti uguali tra le navi di scorta di un convoglio.<n>Assicurati che le tue navi di scorta siano completamente armate e abbiano l'equipaggio al completo, poi fai visita al governatore e accetta la nuova missione che ti assegna."
"0xdb0108db" = "Ora porta a termine la missione che ti ha assegnato il governatore. "
"0xdb0108dc" = "Scegli tra le tue navi di scorta quella che vuoi comandare nella battaglia navale.<n><n>Puoi selezionare un'altra nave di scorta in qualsiasi momento cliccandoci sopra nell'elenco.<n><n>Ma attenzione: appena inizia la battaglia, ogni nave può essere selezionata una sola volta!"
"0xdb0108dd" = "Ben fatto! Hai distrutto il convoglio pirata.<n><n>Ora torna dal governatore di Cartagena, perché questo fa parte della tua missione.<n><n>Nota che le tue missioni sono registrate automaticamente nel tuo registro. Lì puoi consultarne i dettagli in qualsiasi momento, se necessario."
"0xdb04023a" = "Materiali da costruzione insufficienti"
"0xdb0e3d33" = "Ho la seguente missione per te.<n><n>"
"0xdb0e3d34" = "Potresti farmi un favore.<n><n>"
"0xdb0e3d35" = "C'è qualcosa che potresti fare per me.<n><n>"
"0xdb10f490" = "Dona"
"0xdb126f49" = "I tuoi punti<n>"
"0xdb170d26" = "Prima che il governatore ti affidi una nuova missione, assicurati che il tuo convoglio sia in perfetto ordine!<n>Se il tuo convoglio è danneggiato, va al cantiere navale e fallo riparare."
"0xdb170d27" = "Hai appena ricevuto un po' di denaro per aiutarti ad assicurarti che il tuo convoglio sia meglio equipaggiato.<n>Il tuo convoglio dovrebbe avere tre navi completamente armate e un equipaggio al completo.<n>Non dimenticare le munizioni e ricorda di definire le tue nuove navi come navi da guerra. Fallo ora."
"0xdb170d28" = "Eccellente!<n>Ora visita il governatore e compi la missione che ti assegna."
"0xdb2ae26e" = "Rifiuta"
"0xdb2d1177" = "Ora andrai a razziare un covo di pirati.<n>Prima assicurati che il tuo convoglio sia in perfetto ordine!<n>Potresti visitare altre città di governatorato per vedere se in uno dei cantieri navali è disponibile una nave più grande.<n>Lungo la strada, fai visita al governatore e ottieni qualche informazione sul covo dei pirati."
"0xdb2d1178" = "Le battaglie portuali sono simili a quelle navali, salvo che la battaglia è tra te e torri di cannoni molto solide invece che altre navi.<n>Per vincere una battaglia portuale devi distruggere tutte le torri.<n>A volte nel porto ci sono navi armate. In tal caso devi combattere le navi prima di poter attaccare il porto stesso."
"0xdb2d1179" = "Per concludere questo scenario, torna a Cartagena con il tuo convoglio."
"0xdb4287ac" = "Il governatore di Cartagena crede molto nel tuo potenziale e ti fa in dono @g$Gold$.<n><n>Suggerimento:<n>Acquista merci di cui una città ha grande abbondanza (la quantità non deve essere mostrata in rosso). Poi vendi queste merci in una città dove scarseggiano, per assicurarti un prezzo migliore.<n><n>Presto accrescerai così la tua ricchezza."
