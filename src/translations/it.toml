"0xf6a84efd" = "È l'anno 1570 e ci troviamo nei Caraibi. Il tuo obiettivo è passare da umile commerciante a influente uomo d'affari. Per aiutarti a raggiungere lo status che cerchi, puoi trasportare merci oltre a commerciare, costruire e dedicarti alla politica e alla pirateria.<n><n>Lo scenario seguente ti insegnerà le basi di come si gioca. Come per gli altri scenari, questo comporta diversi obiettivi. Devi raggiungere tutti i tuoi obiettivi per completare con successo lo scenario.<n><n>Ora puoi chiudere questa finestra con il pulsante Chiudi e consultare la finestra degli eventi in basso a sinistra.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Segui le istruzioni nella finestra degli eventi."
"0xf6bb9f8c" = "Prezzo"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "Scheda grafica"
"0xf6c77503" = "Il covo del pirata %1 è stato scoperto. Quale eroico avventuriero osa attaccarlo e distruggerlo?"
"0xf6ec5ddc" = "Stanno succedendo cose strane a Tortuga. A causa di una serie di eventi passati, quasi nessun mercante osa mettere piede in città. Il tuo compito è sostenere Tortuga il meglio possibile rifornendola di merci.<n><n>Ma il tuo capitale iniziale non è proprio spettacolare. Hai @g$StartGold$ contanti a disposizione. Tuttavia hai un convoglio commerciale ben equipaggiato in porto e alcune scorte di merci.<n><n>Il tuo primo obiettivo è aumentare il tuo contante fino a @g$GoldGoal$. Completa questo compito il più in fretta possibile, ma non puoi impiegare più di 40 giorni.<n><n>Un consiglio: non vendere le tue navi in nessuna circostanza. Puoi però contrarre prestiti.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumenta il tuo contante fino a @g$GoldGoal$ entro @D$EndDate$."
"0xf70feddb" = "Sei tornato nel porto di Cartagena e il tuo convoglio, la \"Santa Maria\", è selezionato.<n>Come vedi, il convoglio ha già alcune merci: cotone, carne e cacao.<n>Ora trova i moli nel porto e cliccaci sopra, perché vuoi vendere le merci."
"0xf70feddc" = "Ai moli puoi commerciare sia tra la città e il tuo magazzino sia tra la città e il tuo convoglio.<n>Ora vedi quali merci ha la città e quali merci ha il tuo convoglio. Usa le frecce per comprare e vendere (i prezzi sono mostrati sulle frecce).<n>Ora vendi il tuo cotone."
"0xf70feddd" = "Forse hai notato come è calato il prezzo del cotone quando ne hai venduto una parte.<n>Questo perché il prezzo è determinato dall'offerta e dalla domanda nella città.<n>Vendere le merci soddisfa la domanda e il prezzo cala. Se compri una merce, il suo prezzo sale.<n>Ora compra @a$SubGoal$ di grano."
"0xf70fedde" = "Nota come è appena salito il prezzo del grano? <n>Tieni però presente che il prezzo dipende non solo dall'offerta ma anche dalla tua reputazione nella città.<n>Clicca sul pulsante con l'edificio in basso a destra della finestra del commercio."
"0xf70feddf" = "Ora puoi commerciare tra il tuo magazzino e la città.<n>In ogni città in cui vuoi avviare la produzione di una merce, devi prima costruire un magazzino. Nella tua città iniziale possiedi già un magazzino.<n>Ora vendi tutte le merci che hai nel magazzino."
"0xf70fede0" = "Nella parte più alta della finestra del commercio hai tre pulsanti con i numeri 1, 10 e 100, che ti permettono di commerciare quantità maggiori di merci più rapidamente. Clicca sul pulsante 10 e osserva come cambiano i prezzi.<n>Non fa differenza se compri 10 x 1 merce o 1 x 10 merci: il prezzo totale è sempre lo stesso. Ora compra @a$SubGoal$ di rum."
"0xf70fede1" = "La colonna all'estrema destra del menu del commercio mostra i prezzi medi delle merci che hai comprato. Poiché vuoi vendere le merci con un guadagno, devi trovare una città in cui si paghi un prezzo più alto.<n>Ora apri il trasferimento tra la nave e il tuo magazzino cliccando sul quarto pulsante (con la gru) in basso a destra."
"0xf70fede2" = "In questa finestra puoi spostare merci tra il tuo convoglio e il tuo magazzino. Ora carica sul convoglio le merci rimaste nel magazzino, perché vuoi venderle in un'altra città.<n>Poi chiudi la finestra del commercio cliccando sul pulsante contrassegnato con \"X\" in basso a destra."
"0xf70fede3" = "Ora passa alla carta nautica e viaggia con il tuo convoglio verso Santa Marta. Non entrare a Santa Marta, ma fai clic destro sulla città non appena il convoglio la raggiunge. "
"0xf70fede4" = "Così si apre la finestra del commercio per Santa Marta.<n>Dunque non devi entrare in una città per commerciarvi.<n>Ora vendi tutte le merci che hai a bordo del convoglio.<n>Poi chiudi la finestra del commercio."
"0xf7110875" = "Sei sicuro di voler eliminare la partita salvata?"
"0xf725f22c" = "Il tuo convoglio è ora a Santa Marta. Clicca sul nome della città per visualizzare le informazioni sulla città.<n>Puoi farlo dalla carta nautica o entrando in città."
"0xf725f22d" = "Le informazioni sulla città mostrano le merci prodotte nella città.<n><n>È mostrato anche il tuo rapporto con la Spagna: questo rapporto è amichevole! Significa che nella città ti saranno pagati i prezzi migliori possibile.<n><n>Ora chiudi questa finestra e dai un'occhiata in giro per la città."
"0xf725f22e" = "Ora clicca sul simbolo degli abitanti sotto il nome della città, a sinistra dello schermo, per visualizzare le scorte di Santa Marta."
"0xf725f22f" = "Qui sono mostrate la quantità di merci in magazzino e la quantità di merci consumate nella città. Naturalmente il livello di consumo dipende dalla popolazione della città.<n>Il consumo ti dice quante merci possono essere consegnate regolarmente. Ora chiudi la finestra delle scorte."
"0xf725f230" = "Ora prova a concludere qualche affare redditizio.<n>Apri la finestra del commercio e compra tutto il cotone, lo zucchero e il cacao che puoi trasportare con il tuo convoglio, perché queste merci sono prodotte in questa città.<n>Poi torna a Cartagena e vendi queste merci con un guadagno."
"0xf725f231" = "Hai appena ricevuto due messaggi con alcuni consigli per commerciare con successo.<n>Apri il registro per leggere i messaggi.<n>"
"0xf725f232" = "Vendi il maggior numero possibile di merci sopra il prezzo medio e compra merci nuove. <n>Nota: i prezzi delle merci scarse in una città sono mostrati in rosso. Per queste merci otterrai sempre buoni prezzi.<n>"
"0xf725f233" = "Le città con governatore come Cartagena ricevono merci d'importazione dall'Europa.<n>Di solito puoi venderle con un guadagno alle città coloniali, come Santa Marta, Maracaibo o Gibilterra.<n>Ora commercia per conto tuo per un po'.<n>Il tuo obiettivo è guadagnare @g$GoldGoal$ in contanti con il commercio."
"0xf7346191" = "Mercante di %1"
"0xf73619d7" = "Il covo dei pirati è stato scoperto"
"0xf7370c4b" = "%1,<n>posso pensare a molte persone che preferirei vedere. Abbiamo affari da discutere? Entra, se devi."
"0xf73bf67d" = "Vai alla vista della città di Cartagena.<n>Di solito, per entrare in una città devi avere un convoglio ancorato in porto. Tuttavia hai un magazzino a Cartagena e puoi quindi entrare in questa città quando vuoi.<n>Clicca sul cantiere navale di Cartagena."
"0xf73bf67e" = "Nel cantiere navale compra una nave piccola. Non spendere troppo denaro, perché dovrai tenerne un po' per commerciare e per mantenere la nave."
"0xf73bf67f" = "Nell'ultimo scenario hai imparato come aggiungere navi a un convoglio facendo clic destro sul porto.<n>Ora però dovresti mettere insieme un nuovo convoglio assumendo un capitano alla locanda.<n>Trova la locanda (si trova al centro della città) e cliccaci sopra."
"0xf73bf680" = "I capitani si trovano sempre alla locanda. Se in città soggiorna un capitano, lo indica il terzo pulsante del menu della locanda.<n>Se hai altre navi o convogli in porto, devi dire al capitano dove esattamente deve essere impiegato.<n>Indica che deve comandare la tua nuova nave."
"0xf73bf681" = "Congratulazioni! Hai formato il tuo primo convoglio! Il tuo prossimo compito è aumentare la tua ricchezza fino a @g$GoldGoal$. Puoi controllare la tua ricchezza in qualsiasi momento sotto \"Successi\" nel registro.<n><n>Buona fortuna!"
"0xf73dab55" = "Grazie per aver completato l'ultima missione che ti ho affidato."
"0xf73dab56" = "Vorrei ringraziarti per aver completato la mia ultima missione."
"0xf73dab57" = "Sono grato per il tuo sostegno."
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "Inizi la tua carriera con <o:0xFFF2FAAD>%1<o> monete d'oro e una <o:0xFFF2FAAD>pinaccia<o> (60 tonnellate, max. 8 cannoni)."
"0xf7534d8f" = "Quando trasporti coloni in una città dove servono lavoratori, i coloni ti ringrazieranno pagandoti una tariffa quando sbarcano.<n><n>Per produrre merci coloniali come il cacao servono sempre alcuni utensili. Se questi utensili non sono disponibili, la produzione si ferma. Più avanti, quando saprai qualcosa in più su prezzi e quantità, potrai incaricare il magazziniere di comprare utensili regolarmente in città. Per ora però faresti meglio a comprare tu stesso gli utensili, per andare sul sicuro.<n><n>Questo è il tuo prossimo compito. Poi nulla ti impedirà di produrre cacao.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produci cacao e accumula una scorta di @a$AmountGoal$ nel tuo magazzino."
"0xf760fd2a" = "Grazie. Ecco i tuoi %1. Sono qui fino al %2. Fino ad allora puoi portarmi altre merci."
