"0xf46a87ef" = "Indietro"
"0xf4b112c8" = "Esci dal gioco"
"0xf4b68a6b" = "Congratulazioni! Hai completato con successo lo scenario e hai conquistato diverse città inglesi per conto dell'Olanda.<n><n>Puoi conquistare città allo stesso modo nella modalità libera. Ma ricorda di assicurarti che la nazione le cui città vuoi conquistare sia militarmente debole. Inoltre la nazione per cui vuoi conquistare le città deve essere militarmente forte e le due nazioni in questione devono essere in guerra.<n><n>Nota: di solito vieni ricompensato con un appezzamento di terra su cui puoi costruire le tue città quando conquisti città per un viceré. Tuttavia questa funzione è disattivata in questo scenario."
"0xf4c07868" = "Relitti trovati"
