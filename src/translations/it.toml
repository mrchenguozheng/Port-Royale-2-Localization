"0x077030da" = "Congratulazioni! Hai completato con successo questo scenario e ora hai un po' di esperienza con le battaglie navali e gli attacchi ai porti.<n><n>Assicurati sempre che le tue navi di scorta siano ben armate prima di attaccare un altro convoglio. Naturalmente dovresti anche riflettere con molta attenzione prima di decidere quali convogli attaccare. I convogli di trasporto dall'Europa e i convogli militari sono sempre molto potenti, e anche i pirati possono talvolta diventare avversari temibili.<n><n>Se attacchi dei mercanti senza aver prima ottenuto una lettera di corsa dal governatore di una nazione, questo ha una grande influenza sulla tua reputazione con tutte le nazioni. Nel peggiore dei casi, potenti convogli militari daranno la caccia al tuo convoglio.<n><n>Un consiglio: se catturi un convoglio commerciale senza affondarne le navi e ti limiti a saccheggiarlo, l'impatto negativo sulla tua reputazione è molto minore. "
