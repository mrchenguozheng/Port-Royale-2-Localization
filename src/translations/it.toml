"0xcff9644a" = "Il gioco \"Pirata Monco\" è un gioco d'azzardo con 32 carte. Ogni giocatore mette la propria posta nel piatto e riceve 5 carte, che l'altro giocatore non può vedere.<n><n>Prima, ogni giocatore deve dichiarare il numero di punti che pensa di poter vincere, dove ogni presa vinta vale un punto. Il giocatore che dichiara il numero più alto guida il gioco e decide il seme di briscola. Ora deve cercare di vincere almeno quel numero di punti.<n><n>Il giocatore che guida gioca le sue prime carte e l'altro deve rispondere giocando una carta dello stesso seme, se può. Il giocatore con la carta più alta vince il punto.<n><n>Se un giocatore non può rispondere al seme, può scartare qualsiasi carta o giocare una briscola.<n><n>La sequenza delle carte è I, II, III, IV, Pirata, Sposa, Governatore, Pappagallo. Una briscola batte tutte le altre carte.<n><n>Il giocatore che ha vinto il punto gioca la carta successiva. Si continua così finché qualcuno vince la partita.<n><n>Se chi guida riesce a vincere il numero di punti dichiarato, vince la partita e prende il piatto. Se non ci riesce, vince l'avversario."
