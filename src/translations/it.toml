"0x2e39d24e" = "Vedo che sei un uomo facoltoso, %1.<n><n>Normalmente ti chiederei un prestito, ma purtroppo posso fare questo genere di affari solo con i mercanti locali. Pertanto devi poter presentare un permesso di costruzione per la mia città."
