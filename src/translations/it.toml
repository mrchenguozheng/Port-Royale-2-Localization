"0x350099bd" = "%1 giorni"
"0x350993a3" = "Grazie! La mia bella nave mi è finalmente stata restituita. Purtroppo non posso darti oro, ma ho fatto consegnare un paio di merci molto belle per te al mercato di @T$Town$. "
