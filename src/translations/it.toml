"0x00cde503" = "<ts:20>Sei diventato nemico di una nazione per la prima volta. Ecco alcuni suggerimenti utili.<n>-<t>Diventi nemico solo se attacchi i convogli e le città di una nazione<n>-<t>Puoi corrompere i governatori delle nazioni per migliorare la tua reputazione. Tuttavia la tua reputazione migliora anche automaticamente di poco ogni giorno, man mano che le tue cattive azioni vengono lentamente dimenticate<n>-<t>Non puoi attraccare nel porto delle nazioni nemiche<n>-<t>Se ti dirigi comunque verso una città nemica, devi ancorare il convoglio in segreto: puoi allora entrare in città, ma non puoi commerciarvi."
