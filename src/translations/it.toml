"0x0376a611" = "Questo deve essere un luogo a sud."
"0x0376a612" = "Il luogo si trova nei Caraibi sudorientali."
"0x037a7660" = "Regole del gioco"
"0x03a3b601" = "Attacco ai pirati"
"0x03b332c8" = "Andreas Traxler"
"0x03b7e5f8" = "La città ha urgente bisogno di coloni."
"0x03c5bef1" = "<n><n>Il tuo convoglio è stato sciolto."
"0x03cad242" = "Prestito estinto"
"0x03ce7c8e" = "Obiettivo dello scenario"
"0x03d3dcd8" = "Durante il saccheggio della città, il tuo equipaggio scopre anche dove si nascondeva la moglie del governatore e \"libera\" la donna. In quel momento era in cucina.<n> \"Non riportarmi dal governatore a @T$TOWN$. Non l'ho mai amato, te lo giuro!\".<n><n>Vuoi portare questa donna con te e riconsegnarla al governatore nonostante le sue suppliche? "
"0x03d3dcd9" = "Durante il saccheggio della città, i tuoi uomini si imbattono in un ragazzino con un barboncino. Il ragazzo ti racconta che il governatore di @T$TOWN$ ha organizzato lui stesso il rapimento, per liberarsi del cane. Il capitano decide di portare Michelle a bordo della sua nave. Si chiede poi se valga la pena riportare il cane dal governatore di @T$TOWN$.<n><n>Vuoi gettare il cane in mare?"
"0x03d6dcdb" = "Caccia ai pirati"
"0x03dfeb8d" = "<c><o:0xFFFFE6A0>%1<n><o:0xFFEBF0A0>(città del giocatore)"
"0x03e1b0eb" = "Che sfortuna! Devo avere scorte regolari di merci coloniali per i convogli di trasporto dall'Europa, ma non abbiamo gli attrezzi per poter produrre queste merci. Non vorresti aiutarmi a rifornire una città di attrezzi?"
"0x03e1b0ec" = "Come può essere successo! Le scorte di attrezzi sono esaurite a @T$DestTown$ e ora la produzione di merci coloniali è minacciata. Mi aiuterai a risolvere questo dilemma?"
"0x03e1b0ed" = "Alla mia nazione mancano gli attrezzi. Dovremmo procurarceli dalle altre nazioni. Che ne pensi?"
"0x03e9fe1e" = "Tortuga in difficoltà"
"0x03efad5a" = "Non ci sono messaggi"
"0x03efff11" = "Mi hai reso così felice! Corri da mio padre, sarà al settimo cielo!"
"0x03f2ddbd" = " @A$USER$, vieni qui e siediti, ho degli affari da discutere con te.<n>Sto cercando di comprare @G$Goods$ per @n$HostileNation$. Come sai, @n$Nation$ e @n$HostileNation$ sono in guerra. Anzi, ora in @n$HostileNation$ è reato importare @G$Goods$ da @n$Nation$, e per questo si pagano buoni prezzi. Quindi vorrei chiederti se ti interesserebbe un po' di contrabbando?"
"0x03f2ddbe" = " @A$USER$, ti interesserebbe un po' di contrabbando? Sono qui per conto di un mercante di @T$TargetTown$. A causa della guerra, al momento nessuna merce può essere trasportata dalle città di @n$Nation$ a @T$TargetTown$. L'uomo che mi ha mandato è interessato a @G$Goods$. Ti pagherà @g$Price$ per ogni barile che gli consegni. Che ne dici?"
"0x03fb5c67" = "A causa del tuo rapporto sempre pessimo con %1, oggi %3 delle tue attività a %2 sono state confiscate."
"0x03fb5c68" = "<n>Ti consiglio di fare visita a uno dei miei governatori per migliorare il tuo rapporto con la mia nazione."
"0x03fb5c69" = "<n>Ti consiglio di farmi visita così possiamo discutere del tuo rapporto con la mia nazione."
"0x03fb5c6a" = "<n><n>%1, viceré di %2"
"0x04081363" = "Uno dei miei rivali in @n$HostileNation$ ha rubato i miei diari e ora vuole spedirli in Europa. È essenziale che non ci riesca. Per fortuna sono riuscito a corrompere il timoniere della nave che porta i diari in Europa. Ora mi serve il tuo aiuto."
"0x04081364" = "Siamo spiati da @n$HostileNation$ da molto tempo. Ho scoperto che tutte le informazioni raccolte sono state accuratamente registrate e ora stanno per essere inviate da @T$HostileTown$ in Europa. Voglio che mi aiuti a fare in modo che questi documenti non lascino mai i Caraibi."
"0x040bf5f1" = "Invia partita"
"0x04100fa0" = "%1: Attacco pirata"
"0x0420c2a2" = "<ts:20>Sai già come comprare e vendere merci nella finestra di commercio. Ecco altri consigli:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Il prezzo mostrato sulle frecce dipende dalla dimensione dell'unità<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Non importa se compri o vendi una merce 10 volte o se ne compri o vendi 10 in una volta sola. Il prezzo totale è lo stesso.<n><n><g:INTEXT_AUSRUF_800x600.screen>Un prezzo viene sempre mostrato, anche se una merce non è disponibile. È sempre il prezzo di un'unità di merce, indipendentemente dalla dimensione dell'unità impostata.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Puoi commerciare anche facendo clic sul simbolo di una merce. Quando lo fai, appare una piccola finestra con una barra di scorrimento. Puoi usarla per specificare quante merci vuoi comprare o vendere. Il prezzo unitario e il prezzo totale vengono poi mostrati subito."
"0x0424bb9a" = "Cronaca"
"0x0436c531" = "Hai trovato una nave molto speciale!<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Nave a vela a vapore<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>In vita tua non hai mai visto una nave simile! Sembra spinta non solo dalle vele sui due alberi, ma anche da uno strano meccanismo che usa il vapore per azionare due ruote a pale. A quanto pare questo permette alla nave di continuare a muoversi anche quando non c'è un alito di vento."
"0x044bc6d2" = "Il tuo capitano ha vinto il duello di spada contro %1. I tuoi uomini iniziano a cercare il tesoro dei pirati e trovano %2.<n><n>Hai distrutto il covo e messo fine al regno del pirata %3. "
"0x044bc6d3" = "Il tuo capitano ha vinto il duello di spada contro %1. I tuoi uomini iniziano a cercare il tesoro dei pirati e trovano %2. Hai distrutto il covo e hai eliminato con successo i pericoli che rappresentava, ma ci sono segni che potresti non aver distrutto tutte le navi. Le navi rimaste potrebbero cercare un nuovo covo."
"0x044e52eb" = "Scenari"
"0x045d87c5" = "Devi accumulare @g$GoldGoal$ di contante commerciando."
"0x04709af6" = "Missioni"
"0x0471f13a" = "Hai ricevuto un prestito del valore di %1. Il rimborso è di %2 e sarà dovuto il %3."
"0x04750e1c" = "Qualità della vita nelle città"
"0x0479b6bb" = "Partita salvata."
"0x0480889b" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Hai trovato una grande scorta di merci nel luogo descritto dal naufrago e le hai imbarcate."
"0x0480889c" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Scopri una grande scorta di merci nel luogo descritto dal naufrago.<n>Purtroppo il tuo convoglio non ha più spazio a bordo, quindi per ora dovrai lasciare le merci sul posto."
"0x04825ba0" = "Il convoglio non può salpare perché si trova attualmente in cantiere per le riparazioni. Aspetta che le riparazioni siano finite."
"0x04b51123" = "Spiacente, temo di non poterti più dare questa missione. Ci hai messo troppo tempo a pensarci."
"0x04d40792" = "prezzo di produzione attuale"
"0x04ddc375" = "%1 ti aspetta alla locanda."
"0x04e000d9" = "Il capitano %1 ha sostituito il capitano precedente."
"0x04e4fc22" = "Città - Commercio in magazzino"
"0x04e5002a" = "Uno sciopero dei lavoratori è stato istigato a Tortuga. Tutti i lavoratori hanno incrociato le braccia e ora sono in sciopero (ma continuano a generare costi per la tua attività).<n><n>Il tuo compito è mantenere ampie scorte delle merci che i lavoratori produrrebbero normalmente, per fare in modo che lo sciopero fallisca e che riprendano il lavoro.<n><n>Nota: la città produce grano, mattoni, cotone, zucchero e tabacco. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Le scorte delle merci prodotte in città devono essere @a$Amount$ per ogni merce entro il @D$EndDate$."
"0x04f319ed" = "Vai al mercato di @T$Town$ entro i prossimi 30 giorni per ritirare la tua ricompensa."
