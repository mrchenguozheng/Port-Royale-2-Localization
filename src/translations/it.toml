"0xcc0a1380" = "Trova il convoglio pirata comandato da @P$PirateName$, che si trova a circa 1 giorno di viaggio a nord-est di Providence. Distruggi questo convoglio.<n>Poi torna dal governatore di Cartagena."
"0xcc1709af" = "%1: ostile"
"0xcc2c64fb" = "Ti è stata assegnata la missione di scovare e distruggere uno dei convogli pirata di Barbanera.<n><n>Barbanera ha un covo segreto dove tiene diversi convogli, ciascuno composto da cinque navi completamente armate. Sarà una missione difficile per il convoglio che hai al momento.<n><n>Perciò dovresti prima aumentare la potenza di fuoco del tuo convoglio. Per ottenere abbastanza denaro per acquistare una nave più grande, puoi vendere le merci del tuo magazzino a @T$TOWN$ al miglior prezzo possibile. Segui i suggerimenti nella finestra Eventi, che ti dicono dove puoi vendere le merci a buon prezzo a nord e a est di @T$TOWN$.<n><n>Non perdere troppo tempo in questo, perché devi ancora compiere la missione del governatore!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vendi le merci nel tuo magazzino a @T$TOWN$ e aumenta il tuo denaro contante a @g$GoldGoal$."
"0xcc475a7d" = "Capomastro"
"0xcc528764" = "Edificio pubblico "
"0xcc56863a" = "Costi salariali al giorno"
"0xcc5bfb04" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Missione attuale<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0xcc72dc12" = "Consigli su acquisto e vendita di merci"
"0xcc823e54" = "Siamo in guerra con @n$TargetNation$ e, visti i recenti avvenimenti, è giunto il momento di reagire. Voglio che catturi o affondi navi militari per mio conto. Accetti questa missione?"
"0xcc823e55" = "Proprio di recente @n$TargetNation$ ha attaccato una delle nostre città. Ora sto pianificando la mia azione militare contro @n$TargetNation$ e mi chiedevo se ti piacerebbe farne parte? Voglio che affondi o catturi convogli militari. Tutto ciò che saccheggi è tuo, a me interessa solo indebolire @n$TargetNation$. Ti interessa?"
"0xcc823e56" = "Una delle nostre città è stata attaccata da @n$TargetNation$. Ora stiamo reagendo e affondando le loro navi. Mi piacerebbe molto mandarti in una zona specifica e autorizzarti a catturare o affondare navi militari."
"0xcc84b125" = "Agenzia di pubbliche relazioni"
"0xcc84b185" = "QA"
