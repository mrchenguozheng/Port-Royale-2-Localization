"0xe10e4380" = "Il tuo tempo è scaduto ma non hai raggiunto l'obiettivo finale dello scenario.<n><n>In modalità libera, il viceré di qualsiasi nazione può concederti in dono una città tua. Ma non è facile ottenerlo, perché devi sempre catturare città per ricevere un appezzamento di terra, e ciò naturalmente danneggerà la tua reputazione presso le altre nazioni. <n><n>Tutto ciò che hai imparato in questo scenario sullo sviluppo della tua città ti aiuterà a sviluppare imprese anche in altre città. La differenza principale è che non devi preoccuparti di difendere quelle città."
"0xe10f2f85" = "Allora non vedo l'ora di fare affari con te.<n>Consegna quante più @G$Goods$ puoi al mercato di @T$TOWN$. Anch'io riceverò diverse consegne là e ti pagherò subito @g$Price$.<n>Il convoglio di spedizione arriverà qui il @D$EndDate$. Garantisci a questo convoglio un passaggio sicuro verso l'Europa e ti pagherò il resto dell'oro."
