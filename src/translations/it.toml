"0x004b9030" = "Sai già che solo le navi di scorta possono partecipare alle battaglie navali. Le navi mercantili sconfitte finiscono sempre al vincitore, che può scegliere se saccheggiarle o conquistarle.<n><n>Non sei sempre tu a dare inizio alle battaglie navali che coinvolgono i tuoi convogli. Se uno dei tuoi convogli viene attaccato da pirati o da un convoglio militare di una nazione in cui la tua reputazione è molto bassa, puoi ingaggiare combattimento oppure il tuo convoglio può cercare di evitare la battaglia. Se vuoi evitare una battaglia, le tue navi di scorta devono cercare di impedire al nemico di avvicinarsi troppo alle tue navi mercantili.<n><n>Se questo fallisce, le tue navi di scorta saranno conquistate e le tue navi mercantili saccheggiate. Se un convoglio non ha navi da guerra, in caso di attacco può solo cercare di evitare la battaglia. Vantaggio: le navi mercantili vengono solo saccheggiate dal nemico e non conquistate.<n><n>Ora fa' visita al governatore. Ha una nuova missione per te. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Completa la prossima missione che ti affiderà il governatore."
