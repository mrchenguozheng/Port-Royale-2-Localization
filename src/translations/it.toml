"0x37d00ed9" = "Ora dovresti avere difese cittadine sufficienti per il momento. Adesso ingrandisci la tua città e migliora il suo aspetto. Costruisci una chiesa, oltre a più impianti di produzione e zone residenziali, per attirare più di 2.200 abitanti nella tua città.<n><n>Hai tempo fino al @D$EndDate$ per farlo. Lo scenario sarà poi concluso.<n><n>Non dimenticare di vendere con profitto le merci che produci! <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Costruisci una chiesa e porta la popolazione della tua città a 2.200. Hai tempo fino al @D$EndDate$."
