"0x13385f0f" = "Bel lavoro! Con la tua lettera di corsa sei ora ufficialmente al servizio dell'Olanda e coinvolto nella guerra contro l'Inghilterra. Questo significa che puoi attaccare navi mercantili inglesi senza che la tua reputazione subisca danni in Olanda, Francia o Spagna.<n><n>Naturalmente la tua reputazione con l'Inghilterra ne risentirà e, d'ora in poi, ogni volta che ti troverai in acque inglesi dovrai stare in guardia dai convogli militari che ti daranno la caccia!<n><n>Le città inglesi si trovano tutte a sudest delle Isole Turk. Naviga in questa direzione con il tuo convoglio e cerca convogli commerciali adatti da catturare. Vendi il bottino e le navi più piccole per aumentare la tua ricchezza.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Obiettivo dello scenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cattura tre convogli commerciali inglesi: abborda le loro navi e aggiungile al tuo convoglio. "
"0x133e8429" = "e il porto è abbastanza sicuro."
