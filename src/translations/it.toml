"0xcb2b0709" = "Che sciagura! Hai già fatto visita a @F$WifeName$ oggi? Puoi risparmiarti il disturbo, perché se n'è andata. Guarda, ho trovato una specie di lettera d'addio. Scrive che è stufa della sua vita noiosa e che è fuggita con un avventuriero. Devi salvarmi la mia amata figlia!"
"0xcb2b070a" = "La sciagura si è abbattuta e mi sembra che tu ci sia in pieno. Mia figlia è stata rapita dai pirati, ma qualcuno ti ha lasciato un messaggio con una mappa che mostra la posizione di un certo luogo. A me sembra una trappola, ma che dobbiamo fare? Devi salvare mia figlia!"
