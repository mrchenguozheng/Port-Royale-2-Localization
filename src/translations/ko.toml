"0x13601073" = "Thank you for bringing me the documents. As a reward, I am presenting you with a barque. You will find her in the harbor."
"0x13601074" = "Many thanks for your support and for returning my diaries. As a reward, I am presenting you with a barque. You will find her in the harbor."
"0x13601075" = "Thank you for bringing me the documents. As a reward, I am presenting you with a barque. You will find her in the harbor."
