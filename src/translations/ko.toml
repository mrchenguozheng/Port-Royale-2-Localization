"0xe5483876" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>좌클릭<f:fonts/Tiepolo_bold14x14aaFH.res><t>부대 선택<n><f:fonts/Tiepolo_black14x14aaFHk.res>우클릭<f:fonts/Tiepolo_bold14x14aaFH.res><t>부대 이동<n><f:fonts/Tiepolo_black14x14aaFHk.res>1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>부대 선택"
