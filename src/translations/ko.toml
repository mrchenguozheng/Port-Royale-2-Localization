"0x166c0814" = "%1,<n>그냥 말동무를 얻으려고 여관에서만 시간을 보내야 한다는 말씀입니까? 정말 좀 더 자주 찾아오셔야 합니다!"
"0x166c0815" = "%1,<n>말동무라도 얻으려고 찾아오는 무역상들을 종일 들이고 내보내고 있습니다. 조금 더 자주 들러 주실 수는 없나요?"
