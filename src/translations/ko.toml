"0xe6490f96" = "1676년, 네덜란드 총독 도시인 [town:Turk Islands]입니다. 네덜란드는 일곱 도시를 가지고 있으며 그중 다섯은 식민 도시, 하나는 총독 도시, 하나는 부왕 도시입니다.<n><n>잉글랜드는 열네 도시를 가지고 있고, 오래전부터 네덜란드와 전쟁 중이며 앞으로 여러 달 더 전쟁이 이어질 것입니다. 이 전쟁이 계속되는 동안 당신은 네덜란드를 대신해 잉글랜드 왕실의 도시들을 함락시켜야 합니다.<n><n>다만 잉글랜드 도시를 공격하려면 자본과 선단의 무장이 더 필요합니다. 첫 목표는 잉글랜드 교역 선단 세 개를 격파하고 그 배들을 나포하는 것입니다.<n><n>그에 앞서 터크 제도의 네덜란드 총독에게서 잉글랜드에 대한 사략 허가서를 받아야 합니다.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>터크 제도의 총독을 방문하고 잉글랜드에 대한 사략 허가서를 받으십시오."
"0xe64f1385" = "Very good! You have destroyed one of Blackbeard's pirate convoys. Now go to the Governor of @T$TOWN$ and collect your reward.<n><n>He also has another mission for you to accomplish.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplish another mission for the Governor of @T$TOWN$."
"0xe65025c3" = "in 1 town"
"0xe6510ae7" = "You must increase supplies of wheat, bricks, cotton, sugar and tobacco to @a$Amount$ each by @D$EndDate$."
