"0x19f413a1" = "이 시나리오에서는 첫 번째보다 할 일이 훨씬 많습니다. 성공적으로 교역하는 법과 첫 교역 이익을 내는 법을 배웁니다.<n><n>물자를 더 많이 운송할 수 있도록 두 번째 선단도 편성합니다.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>이벤트 창의 안내를 읽고 따르십시오."
