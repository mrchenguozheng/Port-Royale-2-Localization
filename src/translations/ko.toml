"0xe3922644" = "이 기구는 두 눈으로 동시에 먼 곳을 보는 쌍안 망원경입니다. 렌즈에 색 유리를 겹쳐 눈을 보호할 수 있습니다. 옆면에는 수수께끼 같은 문양이 희미하게 보입니다."
"0xe3922645" = "평범한 금 시계인데, 지금까지 본 어떤 것보다 작습니다. 문자판 뒤 원판에는 천천히 도는 것처럼 보이는 달이 있습니다. 뒷면에도 문양이 새겨져 있습니다."
"0xe3922646" = "이 등잔은 보통 등불과 비슷합니다. 다만 타는 심지 둘레에 거울이 많이 놓여 있어 빛이 한쪽으로만 나갑니다. 구멍 위에 부채 같은 장치를 쓰면 빛을 아주 빠르게 켜고 끌 수 있습니다."
"0xe3922647" = "앞뒤로 미끄러지는 자가 또 다른 자 안에 들어 있습니다. 여기에 투명한 재료로 만든 가동 눈금이 붙어 있습니다. 이 기구로 간단한 계산을 아주 빠르게 할 수 있습니다."
"0xe3922648" = "이 기묘한 기구는 화살처럼 생겼습니다. 물에 담그면 날개가 곧바로 돌기 시작합니다. 작은 눈금판이 회전 수를 세어 주어 배의 속도를 아주 정확히 계산할 수 있습니다."
"0xe3922649" = "이 기구는 회전하는 날개와 그 속도를 보여 주는 눈금판으로 되어 있습니다. 날개를 바람에 내밀면 바람의 방향과 세기를 읽을 수 있습니다. 아주 정교하게 만들어졌고, 낯선 기호가 새겨져 있습니다."
"0xe392264a" = "이 밧줄은 한동안 바닷물에 잠겨 있었을 텐데도 방금 만든 것처럼 보입니다. 촉감이 놀랍도록 매끄럽고, 매듭이 아주 단단하게 맺힙니다."
"0xe39226b2" = "이 책에는 아름다운 별자리 지도가 잔뜩 들어 있습니다. 큰 표에는 별마다 언제 어디서 뜨고 지는지가 정확히 적혀 있습니다."
"0xe39226b3" = "정교하게 새긴 둥근 원판 안에 작은 원판 여럿이 들어 있습니다. 날짜와 시각에 따라 별이 보이는 하늘 부분이 어디인지 알아보는 데 쓸 수 있습니다.<n>원판의 표시를 보면 이 기구로 어떤 지역에서 배의 위치를 재던 것임을 알 수 있습니다."
"0xe39226b4" = "손잡이를 돌리면 커다란 뿔에서 여자가 노래하는 부드러운 소리가 납니다. 바다에서 몇 주씩 지내는 선원에게 딱 맞는 물건입니다."
"0xe39226b5" = "커다란 둥근 유리가 황금 막대 끝에 붙어 있습니다. 지도 위에 대면 빛이 좋지 않아도 가장 가는 선까지 또렷하게 보입니다."
"0xe39226b6" = "작은 금속 탁자는 단단한 놋쇠로 되어 있고, 배가 앞뒤로 기울어도 표면이 항상 수평을 유지하도록 만들었습니다. 바깥쪽 금속 고리에는 방향을 가리키는 듯한 눈금이 새겨져 있습니다. 다만 이 탁자를 어느 지역에서 썼는지는 알 수 없습니다."
"0xe39226b7" = "작은 상자 안에 불을 아주 쉽게 붙일 수 있는 화려한 기구가 들어 있습니다. 이 상자는 수수께끼 같은 문양으로 덮여 있습니다."
"0xe39226b8" = "이 닻은 실용보다 장식에 가깝습니다. 기껏해야 나룻배를 묶어 두는 데 쓸 수 있습니다.<n>크기에 비해 무척 무겁고, 정교한 장식과 낯선 글자가 가득합니다."
"0xe39226b9" = "이 기구는 부싯돌이 달린 기름등잔입니다. 작은 바퀴를 돌리면 심지에 불똥이 튀어 강풍에도 불이 붙습니다."
"0xe39226ba" = "이 뿔나팔은 입으로 부는 대신 펌프처럼 생긴 장치로 부릅니다. 세계 눌러 보면 상상한 것보다 훨씬 큰 소리가 납니다."
"0xe39226bb" = "이 해도는 흔히 볼 수 있는 바다 해도와 아주 다릅니다. 무척 정밀하고 여러 색으로 그렸습니다. 다만 어느 지역을 그린 것인지는 알 수 없습니다."
"0xe39bb702" = "선단에 대포가 너무 많아 출항할 수 없습니다. 대포 일부를 팔거나 창고로 옮겨 최대 대포 수를 넘지 않게 하십시오."
"0xe3b79f69" = "게임 속도 줄이기"
"0xe3d0ea8e" = "<f:fonts/%1><o:0xFF000078>%2<o><f:fonts/%3>"
"0xe3d4a613" = "%1점을 선언하고 선도하기"
"0xe3de2671" = "당신의 선단이 바다에서 총독의 문서 한 부가 든 작은 함을 거두어 들였습니다."
"0xe3de2672" = "이제 총독의 문서를 모두 배에 실었습니다. 문서를 @T$TOWN$에 가져가십시오. "
"0xe3e1d467" = "%1,<n><n>제 나라에서 당신의 평판이 충분히 높지 않고, 이 도시를 위해서도 충분히 일하지 않았으므로 허가를 팔 수 없습니다.<n><n>제 나라에서 평판을 높이고 우리 도시와 교역해 거래 실적을 쌓으십시오. 그러면 다시 이야기하지요."
"0xe3e1d468" = "%1,<n><n>제 나라에서 당신의 평판이 충분히 높지 않아 허가를 팔 수 없습니다.<n><n>평판이 높아지면 다시 오십시오."
"0xe3e1d469" = "%1,<n><n>이 도시와의 교역 실적이 부족합니다. 수요가 있는 상품을 인도해 거래 실적을 높이십시오. 그래야 허가를 살 수 있습니다."
"0xe3e33a30" = "%1을(를) 당신의 새 마을로 드리겠습니다. 이제 다른 마을처럼 들어가 건물을 세우고 사업을 일으킬 수 있습니다.<n>아직 구역 전체를 주지는 못하지만, 마을을 더 점령하면 그에 필요한 땅을 드리겠습니다."
"0xe3fa97eb" = "그럼 정했습니다. @a$Amount$개의 도구를 @T$DestTown$에 가져오십시오. 시장에서 <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> 한 통마다 @g$GoldPerBarrel$을(를) 받게 됩니다. 물자는 @D$Date$까지 대야 합니다."
"0xe3fa97ec" = "좋습니다. @a$Amount$을(를) @T$DestTown$으로(로) 인도하십시오. 도구는 @D$Date$까지 도착해야 합니다. "
"0xe3fa97ed" = "잘 알겠습니다! @a$Amount$개의 도구를 구해 오는 일을 맡기겠습니다. @D$Date$까지 @T$DestTown$에 대십시오. 시장에서 <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> 한 통마다 @g$GoldPerBarrel$을(를) 받게 됩니다."
"0xe3fd8f38" = "개인 호위"
