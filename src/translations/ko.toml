"0x004b9030" = "아시다시피 해전에는 호위함만 참가할 수 있습니다. 패한 교역선은 언제나 승리자의 것이 되어, 승리자는 그것을 약탈하거나 나포할 수 있습니다.<n><n>당신의 선단이 관련된 해전이 항상 당신의 의사로 시작되는 것은 아닙니다. 선단이 해적이나, 당신의 평판이 매우 낮은 국가의 군용 선단에게 공격받으면 교전에 나서거나 선단이 싸움을 피하게 할 수 있습니다. 싸움을 피하려면 호위함이 적이 교역선에 너무 가까이 붙지 못하게 막아야 합니다.<n><n>이것이 실패하면 호위함은 나포되고 교역선은 약탈당합니다. 선단에 군함이 하나도 없으면 공격을 받았을 때 할 수 있는 일은 싸움을 피하는 것뿐입니다. 이점: 교역선은 적에게 약탈만 당하고 나포되지는 않습니다.<n><n>이제 총독을 만나러 가십시오. 새로운 임무가 준비되어 있습니다. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>총독이 맡기는 다음 임무를 완수하십시오."
