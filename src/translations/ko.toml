"0xf4e195bf" = "블랙비어드가 당신이 @T$TOWN$의 총독과 손잡았다는 것을 알아냈습니다.  그래서 @T$TOWN$을(를) 찾아오는 상인들을 겁주기 시작했습니다.  며칠 안에 @T$TOWN$에 감히 오려는 상인은 거의 없게 될 것입니다. <n><n>이것은 임시 수법일 뿐입니다. 당신의 임무는 @D$EndDate$까지 마을에 물자를 대는 것입니다. 마을 상태가 ‘번영하는 경제’ 아래로 떨어져서는 안 됩니다.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@D$EndDate$까지 @T$TOWN$에 물자를 대십시오. 마을 상태가 ‘번영하는 경제’ 아래로 떨어져서는 안 됩니다."
