"0x18546893" = "이 시나리오에서는 해전을 치르는 법을 배웁니다. 짧은 연습 해전으로 시작합니다. 나중에는 악명 높은 해적의 [term:en_convoy]을 추적해 격침해야 합니다.<n><n>시나리오를 시작하는 [town:Cartagena]의 총독도 알게 됩니다. 그는 해전에서 능력을 갖추도록 도와주고, 나중에는 어떤 해적을 추격하는 임무를 맡깁니다.<n><n>시나리오를 시작할 때 당신의 계급은 선원입니다. 총독에게 임무를 받으려면 이 계급에 올라 있어야 합니다. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>[town:Cartagena]의 총독을 방문하고 그가 맡기는 임무를 완수하십시오."
