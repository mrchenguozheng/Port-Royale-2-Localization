"0xdb2ae26e" = "거절"
"0xdb2d1177" = "이제 해적 은신처를 습격할 것입니다.<n>먼저 선단이 「말끔한 상태」인지 확인하십시오!<n>다른 총독 도시를 몇 곳 더 다니며 조선소에 더 큰 배가 있는지 볼 수도 있습니다.<n>가는 길에 총독을 찾아가 해적 은신처에 관한 정보를 얻으십시오."
"0xdb2d1178" = "항구 전투는 해전과 비슷하지만, 상대가 다른 배가 아니라 아주 튼튼한 포탑이라는 점이 다릅니다.<n>항구 전투에서 이기려면 모든 포탑을 파괴해야 합니다.<n>항구에 무장한 배가 있는 경우도 있습니다. 그렇다면 항구 자체를 공격하기 전에 그 배들과 먼저 싸워야 합니다."
"0xdb2d1179" = "이 시나리오를 끝내려면 선단을 이끌고 카르타헤나로 돌아가십시오."
