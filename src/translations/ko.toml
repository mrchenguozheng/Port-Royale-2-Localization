"0xd07dbe34" = "도시의 삶의 질을 좌우하는 가장 중요한 요인은 물자의 공급과 갖춘 물자의 종류입니다. 그러나 주민을 만족시키려고 모든 종류의 물자를 다 공급해야 하는 것은 아닙니다.<n><n>도시의 물자는 필수품, 원자재, 완제품, 식민지 물자, 수입품의 다섯 갈래로 나뉩니다. 거래 창에서도 같은 순서로 나옵니다. 각 갈래에서 두세 가지 물자를 넉넉히 공급하면 도시의 삶의 질이 좋아집니다. <n><n>도시의 삶의 질에 관한 소식을 방금 받았습니다. 기록에서 확인할 수 있습니다.<n><n>아직 도시가 작아서 삶의 질을 좋게 만들기는 특히 쉽습니다. 작은 도시의 주민은 요구가 많지 않기 때문입니다. 그러니 목표를 이루는 데 어려움은 없을 것입니다. 다만 인구가 2,000명 미만인 도시는 「호황」보다 위로 올라갈 수 없습니다.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>각 물자를 다섯 통씩 공급하십시오."
