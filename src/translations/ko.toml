"0x35f490c3" = "[riddle:answer=Providence;group=35f490c3,35f490c4;clue=요람,북쪽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9&authored]이곳에 섬 하나가 누워 있네, 마치 요람 속처럼. 북쪽에서 온 반도가 비스듬히 휘어 감싸네."
"0x35f490c4" = "[riddle:copy=0x35f490c3]"
"0x35f490c5" = "[riddle:answer=Santa Marta;group=35f490c5;clue=흰 모래,정글;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 23`&authored]정글 곁의 흰 모래, 아무도 모르는 작은 강. 그대는 이곳에 잘 숨었네, 해만 보는 만 속에."
"0x35f490c6" = "[riddle:answer=Maracaibo;group=35f490c6;clue=해협,만,배;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 5`&authored]이곳에 도시가 있네, 해협을 굽어보며. 배가 많아 드나드는 이 만을 지키고 있지."
"0x35f490c7" = "[riddle:answer=Caracas;group=35f490c7,35f49136;clue=절벽,난파선;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 7`&authored]도시에서 멀지 않은 절벽 아래에 낡은 난파선의 부서진 잔해가 있네."
"0x35f490c8" = "[riddle:answer=Port of Spain;group=35f490c8;clue=스페인,목재,벽돌,밀;level=town;certainty=certain;source=original-en&authored]스페인이 이곳에 항구를 세웠네. 목재와 벽돌은 찾을 수 있어도 밀은 없도다."
