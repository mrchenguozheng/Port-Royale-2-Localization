"0x100afa32" = "%1,<n>우리 성당은 늘 손질이 필요하고, 예배처로서 품위를 갖추어 꾸며야 하지만 로마는 멀기만 합니다. 우리 성당에 기부해 주시면 기도할 때 당신을 기억하겠습니다. 제 나라와 이 도시에서의 평판에도 도움이 될 것입니다.<n><n>기부하실 금액을 고르십시오."
