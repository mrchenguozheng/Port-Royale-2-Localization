"0xf90d7ea6" = "해적"
"0xf9125b3d" = "@P$PirateName$이(가) 지휘하는 해적 선단이 지금 카르타헤나 북서쪽, 벨리즈 마을 근처에서 날뛰고 있습니다. 임무는 그 선단을 격파하는 것입니다. 그런 다음 카르타헤나의 총독에게 돌아오십시오."
"0xf91ff4fd" = "도시"
"0xf921efc0" = "침몰한 선단의 잔해를 발견해 상품을 배에 실었습니다."
"0xf921efc1" = "가라앉은 운송 선단의 잔해를 찾았지만, 물건을 실을 자리가 없습니다."
"0xf9256ece" = "수리비"
"0xf9279095" = "간소한 잔치에는 밀, 과일, 고기, 럼주, 포도주를 각각 %1만큼 필요로 합니다."
"0xf9279096" = "중간 규모의 잔치에는 밀, 과일, 고기, 럼주, 포도주를 각각 %1만큼 필요로 합니다."
"0xf9279097" = "성대한 잔치에는 밀, 과일, 고기, 럼주, 포도주를 각각 %1만큼 필요로 합니다."
"0xf92c7177" = "기도"
"0xf92d7da5" = "%1%"
"0xf932eef8" = "축하합니다! 이 시나리오를 성공적으로 마쳤고, 이제 직접 마을을 세우는 법을 압니다.<n><n>자유 모드에서는 어느 나라의 부왕이든 당신에게 자기 마을을 선물할 수 있습니다. 다만 이루기 쉽지는 않습니다. 땅을 받으려면 늘 마을을 점령해야 하고, 그러면 다른 나라에서의 평판이 자연히 상하기 때문입니다. <n><n>이 시나리오에서 마을을 키우며 배운 것은 다른 마을에서 사업체를 키우는 데도 도움이 됩니다. 가장 큰 차이는 그 마을들을 지키는 일을 걱정하지 않아도 된다는 점입니다."
"0xf934d153" = "(효과 없음)"
"0xf93656ab" = "기지 준비"
"0xf93abe1a" = "\"우호적\"이 될 때까지 스페인에서의 평판을 올리십시오."
"0xf93ea2aa" = "토지 한 필지"
"0xf9404c18" = "그자의 선단이 대략 어디쯤 있는지 해도에 표시해 드릴 수 있습니다. @l$ConvoyPos$ 그 선단을 격파할지는 당신이 정하십시오. 다만 이 임무는 @D$EndDate$까지 마치셔야 합니다."
"0xf9404c19" = "블랙비어드의 선단 하나가 어디 있는지 알려 드릴 수 없습니다. 지금은 비밀 장소에 있기 때문입니다. 다만 이 임무에는 시간을 넉넉히 드리겠습니다. @D$EndDate$까지 선단 하나를 격파하십시오."
"0xf9462f72" = "산타마르타의 사업체는 일꾼을 정원까지 채워야 합니다."
"0xf94c02c2" = "제게 빌려주신 %1에 대한 대가로, 약속한 %3을(를) %2에 받으실 겁니다."
"0xf957684a" = "추천"
"0xf972b675" = "표류자"
"0xf9873e04" = "<n>일이 더 공식적으로 보이도록, @n$HostileNation$에 대한 사략 허가증을 드리겠습니다."
"0xf994c398" = "%1 파괴됨."
"0xf99f8b20" = "회의"
"0xf9a5a4d7" = "당신은 우리 나라와 그다지 좋은 관계가 아닙니다. 호의를 표하는 뜻으로 우리 나라에 %1(을)를 지불하고 평판을 높이시겠습니까?"
"0xf9aca27a" = "임무"
"0xf9b2188b" = "병"
"0xf9d3c192" = "%1와(과)의 관계"
"0xf9f6b6b0" = "선단의 선장은 적선에 있습니다. 그는 결투로 승부를 가리는 것이 어떻겠냐고 당신의 선장에게 제안합니다.<n><n>선원들을 아끼기 위해 당신의 선장이 제안을 받아들입니다."
"0xf9face8c" = "다음 지도"
"0xfa06dd38" = "해적 %1(이)가 공정한 결투에서 당신의 선장을 이겼습니다. 선장은 결과를 깔끔하게 인정하고 군사를 물리라고 명령합니다. "
"0xfa0b6d1f" = "시나리오 완료"
"0xfa2428fd" = "%1  (%2)"
"0xfa282fbe" = "잔액과 대출"
"0xfa463de9" = "단서를 얻었습니다.<n><n>"
"0xfa69f3c3" = "현상금 사냥꾼"
"0xfa69f551" = "목록에서 기능을 골라 키보드 설정을 바꾸십시오."
"0xfa6f79db" = "@D$EndDate$까지 @n$TargetNation$ 소속 군사 선단 @I$NumConvoys$개를 격파하십시오."
"0xfa80a0c0" = "%1 버커니어 %2(이)가 도시에 쥐떼를 일으켰습니다. 한 달 동안 밀, 과일, 옥수수, 고기 소비가 두 배로 늘어납니다."
"0xfaa1f6b4" = "최소"
"0xfaa28418" = "[term:fr_aise]"
"0xfab539b0" = "이 해적 은신처를 소탕해 주셔서 감사합니다. 은신처에 고생을 보상할 만큼의 금이 있었기를 바랍니다. 모든 나라가 당신께 감사하고 있습니다!  "
"0xfab62a0a" = "더 전할 소식은 없습니다. 다음에 다시 찾아오십시오."
"0xfabae878" = "<g:INTEXT_SPANIEN_800x600.screen>"
"0xfac6c05b" = "안녕하십니까! 선단은 항로에 올랐고, 머지않아 첫 상인들이 우리 발 앞에서 벌벌 떨게 될 것입니다! 첫 몫을 받으러 나중에 다시 오십시오."
"0xfac6c05c" = "안녕하십니까. 그런데 너무 이르게 오셨습니다! 아직 드릴 새 몫이 없습니다. 며칠만 더 기다려 주십시오!"
"0xfac6c05d" = "안녕하세요, %1. 새 몫을 준비했습니다. 이번에는 %2을(를) 받으십니다!"
"0xfad1c2f1" = "선박"
"0xfad1c30b" = "선종:"
"0xfad8c431" = "시나리오 완료"
"0xfae54e55" = "@N$ContactName$의 상자를 찾았습니다.<n><n>"
"0xfae663d9" = "%1 (%2일 전)"
"0xfaf356b7" = "%1-%2-%3"
"0xfaf87ec1" = "부두"
"0xfaf8f3b3" = "현지 상인이 %1의 값으로 사업체와 모든 경작지를 당신에게 팔겠다고 합니다."
"0xfafd13c9" = "세부 정보 켜기"
"0xfb08e668" = "결투 패배"
"0xfb0d31c7" = "주거 건물"
"0xfb203dad" = "난파선 위치"
"0xfb343dde" = "도시를 약탈하는 동안 한 젊은 여인이 당신에게 달려옵니다.<n>「이 공격이 아버지의 명령으로만 이루어진 것임을 압니다! 아버지가 제가 자발적으로 여기 있고, 저를 데려간 이와 진심으로 사랑에 빠졌다고 말했나요? 제발 저를 데려가지 말아 주세요. 보답하겠습니다!」.<n><n>@T$TargetTown$에서 총독의 딸을 운명에 맡기시겠습니까?"
"0xfb343ddf" = "총독의 딸이 감사 인사를 하고, @a$Amount$의 물품이 있는 은신처 위치를 표시한 지도를 줍니다."
"0xfb3648b2" = "무역로 활성"
"0xfb399b9a" = "현지 무역상이 그 주거 구역을 %1에 팔 의사가 있습니다."
"0xfb3ffb48" = "선단 하나를 흔쾌히 넘겨주신 데 대해 다시 한 번 감사드립니다. 지금 무장 중이며 %1일 뒤에 출항할 준비가 됩니다.<n><n>또 다른 선단을 넘기시려면 그때까지 기다리셔야 합니다."
"0xfb425369" = "디자인 지원"
"0xfb4be839" = "훌륭합니다! 해적 선단을 모두 격침해 어떤 해적도 도망칠 수 없게 되었습니다. 은신처를 공격하기 전에 해적 무리의 선단을 모두 격침하면, 카리브해에 새 해적 선단이 나타나기까지 시간이 더 오래 걸립니다.<n><n>이제 도시를 공격할 때처럼 선단을 선택하고 해적 은신처를 오른쪽 클릭하여 은신처를 공격하십시오. 항구에 해적선이 정박해 있다면 항구 전투에서 이기기 위해 먼저 그것들을 공격해야 합니다.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>검은 수염의 해적 은신처를 파괴하십시오."
"0xfb514e13" = "새 도시"
"0xfb5c8a98" = "@T$TOWN$ 봉쇄"
"0xfb64ad02" = "승리 "
"0xfbb36ec1" = "다시 한 번 감사드립니다. 우리 나라를 위해 정말 많은 일을 해 주셨습니다. 당신의 도시 %1에 추가 토지를 주겠습니다. 그러면 그 구역의 %2%를 소유하게 됩니다."
"0xfbb97bb9" = "총독에게 보상을 받으십시오."
"0xfbbba36d" = "더 할 말은 이것 하나뿐입니다. 경고합니다. 우리 나라의 군용 선단을 조심하십시오. 그들이 당신을 쫓고 있습니다!"
"0xfbbf60a0" = "돛대 3개"
