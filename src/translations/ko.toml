"0xdb170d27" = "선단을 더 잘 갖추도록 돕는 돈을 방금 받았습니다.<n>선단에는 충분히 무장한 배 세 척과 가득 찬 승조원이 있어야 합니다.<n>탄약도 잊지 말고, 새 배를 군함으로 지정하는 것도 잊지 마십시오. 지금 하십시오."
