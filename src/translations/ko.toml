"0xce4d9a57" = "도시의 교역"
"0xce75e5c4" = "이제 물품을 사고파는 법을 배웠습니다. 물품은 생산되는 도시에서 사는 것이 일반적으로 더 싸니, 항상 그곳에서 사십시오.<n><n>참고: 선단과 교역하려면 선단을 선택한 상태여야 하고, 부두에 들어가기 전에 이미 도시에 있어야 합니다.<n><n>이 시나리오 후반에는 직접 교역해 이익을 내야 합니다. 이벤트 창에 그 방법에 대한 팁이 있습니다.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>교역으로 현금 @g$GoldGoal$만큼을 벌어야 합니다."
