"0x00885bdb" = "훌륭합니다! 이제 당신에게도 도시가 생겼습니다! 이 도시에서는 당신 외에는 아무도 건설할 수 없습니다. <n><n>도시에는 이미 교역할 수 있는 부두와 당신의 궁전이 있습니다. 나머지는 직접 지어야 합니다.<n><n>선단을 이끌고 당신의 도시로 항해하십시오. 건물을 지으려면 목재와 벽돌이 필요하니 될 수 있는 대로 많이 실어 가십시오.<n><n>먼저 조선소를 지으십시오. 조선소에서는 자신의 배를 수리할 수 있습니다.<n><n>참고:<n> 호위함의 선원을 유지하는 데는 비용이 많이 듭니다. 이제 필요 없으니 선원을 해고하십시오.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>새 도시를 방문하고 조선소를 지으십시오."
