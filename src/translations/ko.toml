"0x204d1e7c" = "해적 은신처는 바다에서만 공격할 수 있습니다."
"0x20574fcc" = "%1, 당신이 %2 쪽을 위해 제 아버지의 사랑하는 도시를 함락했군요! 이제 당신과는 아무것도 함께하고 싶지 않습니다. 다시는 당신을 보지 않았으면 합니다. 당신은 제게 아무 의미도 없었고, 앞으로도 당신을 떠올리지 않을 것입니다.<n>당신이 조만간 마땅히 받아야 할 벌을 받기를 진심으로 바랍니다.<n><n>%3"
"0x20574fcd" = "%1, %2 쪽을 위해 합병을 수행함으로써 당신은 부왕을 내 아버지의 사랑하는 도시로 밀어냈고, 아버지는 이제 유럽으로 돌아가야 합니다.<n><n>이제 당신과는 아무것도 함께하고 싶지 않습니다. 다시는 당신을 보지 않았으면 합니다. 그리고 제가 늘 당신보다 여관의 무역상들에게 훨씬 더 관심이 있었음을 알아 두십시오. 당신은 제게 아무 의미도 없었고, 앞으로도 당신은 제 마음에 남지 않을 것입니다.<n><n>당신이 조만간 마땅히 받아야 할 벌을 받기를 진심으로 바랍니다.<n><n>%3"
"0x2065f070" = "Look here. I have just received a message from my ambassador informing me that %1 has made us a unexpected peace offering. This means that we will probably make peace as early as today. <n><n>Therefore, I can no longer assign you a mission to capture a town."
"0x207295a1" = "'%1'이라는 무역로가 이미 있습니다.<n><c>덮어쓰시겠습니까?"
