"0x0a49c903" = "Congratulations! You have successfully completed the second scenario. You have learned how to trade profitably, reached a higher rank and assembled a new convoy by hiring a new captain.<n><n>Note that the more experience captains have, the more expensive they are. They usually have very little experience at first but, over time, all captains gain experience in navigation, trade and combat, depending on how you employ them. You can check the current experience levels of your captains in the Overview for a convoy. To do so, click on a convoy and then on the \"Overview and Costs\" button.<n><n>In the next scenario, you'll establish your own businesses and produce goods. "
