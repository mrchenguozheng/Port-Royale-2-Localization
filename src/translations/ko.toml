"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "버튼  "
"0xdaeb0484" = "이번에는 카리브해 한가운데 있는 총독 도시 [town:Cartagena]에서 시나리오를 시작합니다.<n>슬루프로 이루어진 당신의 선단은 항구에 있습니다.<n>이 시나리오에는 해전이 있으므로 먼저 선단을 무장해야 합니다.<n>부두로 가서 화물 메뉴를 여십시오."
"0xdaeb0485" = "보시다시피 선단에는 대포도 탄약도 없습니다. 승조원도 필요합니다.<n>가능한 한 많은 승조원과 대포를, 그리고 세 종류 탄약을 각각 10x10씩 실으십시오.<n>대포는 무거우므로 선단에 공간이 모자랄 수 있습니다. 그렇다면 이미 실은 물자 일부를 팔면 됩니다."
"0xdaeb0486" = "잘하셨습니다! 이제 선단은 무장을 마쳐 작은 규모의 전투를 치를 준비가 되었습니다.<n>마침 카르타헤나 총독에게 당신에게 딱 맞는 임무가 있습니다.<n>총독의 건물을 눌러 그의 임무를 받으십시오."
"0xdaeb0487" = "총독들은 성공적으로 완수하면 자기 나라에서 당신의 평판이 올라가는 임무를 자주 제안합니다.<n>또한 총독에게 사략 허가장을 요구하거나, 나포한 버커니어의 몸값을 청구할 권리도 있습니다.<n>이제 총독이 알려 준 배들을 선단으로 찾아가십시오."
"0xdaeb0488" = "아주 좋습니다. 선단을 찾았습니다.<n>다음은 배를 전투 준비 상태로 만들고 교전을 준비하는 일입니다. 선단의 선박 목록을 열어 슬루프를 고르십시오. 대포 옆 단추를 눌러 군함으로 지정하면, 그 선단을 오른쪽 단추로 눌러 「공격」할 수 있습니다."
"0xdaeb0489" = "이것은 포트로열의 해전 화면입니다.<n>당신의 배가 보이고, 표시 창을 움직여 버려진 배들도 볼 수 있습니다.<n>이제 일시 정지 모드를 끄고 오른쪽 마우스로 조타를 연습하십시오. 사건 창에는 해전 중 바람의 방향과 배의 상태가 표시됩니다."
"0xdaeb048a" = "전투에 참가한 모든 배가 화면 아래에 표시됩니다. 여기서 어떤 탄약을 쓸지 고를 수 있습니다. 무거운 포탄을 골라 적선 한 척을 침몰시키십시오.<n>왼쪽 마우스로 쏠 수 있지만, 배가 좋은 사격 위치에 있을 때만 됩니다. 그때 표적이 빨갛게 표시됩니다."
"0xdaeb048b" = "좋습니다! 두 번째 배에 올라타십시오.<n>그러려면 배 표시 오른쪽 아래의 「나포」 단추를 누르십시오.<n>그런 뒤 적선 쪽으로 다가가 들이받으십시오. 참고로 해전 중에는 F1 단추도 쓸 수 있습니다."
"0xdaeb048c" = "보통 적에게도 승조원이 있어, 배 위에서 당신의 승조원과 그들의 승조원이 싸웁니다.<n>싸움이 끝나면 나포된 배는 모두 승리자의 것이 됩니다.<n>이제 적선을 선단에 넣고 이송 창을 닫으십시오."
"0xdaeb048d" = "아주 좋습니다!<n>이제 선단을 카르타헤나로 돌려보내십시오."
"0xdaeb9147" = "팀 플뢰거"
"0xdaed79ac" = "해적 %1의 선단이 %2 출신 상인을 공격했습니다."
"0xdb0108d5" = "먼저 새 배를 사십시오. 조선소로 가서 대포를 최대한 많이 단 배를 사십시오."
"0xdb0108d6" = "선단을 고른 뒤 항구를 오른쪽 단추로 눌러 새 배를 선단에 넣으십시오."
"0xdb0108d7" = "모든 선단은 교역선과 호위함으로 이루어집니다.<n>선단의 배가 전투에 참가하려면 군함으로 지정해야 합니다. <n>선단의 선박 목록을 열어 모든 배를 표시하십시오."
"0xdb0108d8" = "선박 목록에는 선단의 모든 배가 나옵니다. 군함 지정 상태는 배의 오른쪽 위 모서리에 표시됩니다. 대포 기호가 보이면 그 배는 군함으로 지정되어 전투에 참가합니다. 이 모서리를 누르면 상태가 바로 바뀝니다.<n>이제 새 배를 눌러 고르십시오. "
"0xdb0108d9" = "최대 적재량 같은 배의 기술 정보가 조선소에서처럼 여기에 표시됩니다.<n>배를 유지하는 데 드는 하루 비용도 볼 수 있습니다.<n>이제 대포 기호를 눌러 그 배를 군함으로 바꾸십시오."
"0xdb0108da" = "잘하셨습니다!<n>대포와 선원은 언제나 선단의 호위함에 똑같이 나뉩니다.<n>호위함이 충분히 무장하고 승조원도 가득 찼는지 확인한 뒤, 총독을 찾아가 그가 맡기는 새 임무를 받으십시오."
"0xdb0108db" = "이제 총독이 맡긴 임무를 완수하십시오. "
"0xdb0108dc" = "해전에서 조종할 배를 호위함 가운데에서 고르십시오.<n><n>목록에서 눌러 어느 단계에서든 다른 호위함을 고를 수 있습니다.<n><n>다만 주의하십시오. 전투가 시작되면 각 배는 한 번만 고를 수 있습니다!"
"0xdb0108dd" = "잘하셨습니다! 해적 선단을 격파했습니다.<n>이제 카르타헤나 총독에게 돌아가십시오. 그것도 임무의 일부입니다.<n><n>임무는 기록에 자동으로 남습니다. 필요할 때 언제든 기록에서 임무 내용을 확인할 수 있습니다."
