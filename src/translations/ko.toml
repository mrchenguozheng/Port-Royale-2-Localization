"0x383e31dd" = "Now take heed! I'm afraid my brother-in-law is a bit of a vagabond, no one knows exactly where he is."
"0x383e31de" = "I knew you'd be interested. @N$ContactName$ is away for much of the time."
"0x383e31df" = "True enough, I must put money aside for my old age. The trader @N$ContactName$ is a difficult man to find."
