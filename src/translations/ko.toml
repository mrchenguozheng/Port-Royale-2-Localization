"0xed5e6448" = "My thanks to you for destroying that pirate convoy. Here is a reward of @g$GoldReward$.<n>By the way: Whenever you accomplish a mission on my behalf, you automatically improve your reputation with my nation.<n>If, on the other hand, you have a low reputation with my nation, I'm afraid I cannot entrust any missions to you."
