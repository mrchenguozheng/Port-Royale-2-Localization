"0xe4233be0" = "이 시나리오에서는 네덜란드 식민지가 새 도시를 얻도록 도와야 합니다.<n:25>잘 무장한 선단과 얼마간의 시작 자본으로 시나리오를 시작합니다. 잉글랜드 교역선을 나포하면 곧바로 재산이 늘어 선단을 더 무장할 수 있게 됩니다.<n:25>나중에는 선단으로 잉글랜드 군용 선단을 공격해 잉글랜드의 방어를 약화시킨 뒤 그 도시들을 함락시킬 수 있게 됩니다."
