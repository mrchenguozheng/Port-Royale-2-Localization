"0x35f48fde" = "[riddle:copy=0x35f48fdd]"
"0x35f48fdf" = "[riddle:answer=Eleuthera;group=35f48fdf,35f48fe0,35f48fe1,35f48fe2;clue=점토 화덕,옥수수 빵,과일;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 26*`&authored]점토 화덕에 과일을 넣은 달콤한 옥수수 빵을 구워 보고 싶다면 이곳으로 오게."
