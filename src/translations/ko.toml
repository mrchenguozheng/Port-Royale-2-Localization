"0x35f48fe3" = "[riddle:answer=Tampico;group=35f48fe3;clue=가장 서쪽,지역;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 3*`&authored]이곳은 이 지역에서 가장 서쪽에 있는 도시라네."
"0x35f48fe4" = "[riddle:answer=Cancun;group=35f48fe4;clue=남동쪽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 2`&authored]오래전 이곳엔 다른 민족이 살았네. 거대한 신전에서 신들에게 찬미를 바쳤지. 그 위 구석진 곳에 X가 있네. 남동쪽으로 항해하면 헛수고라 일러 두네."
"0x35f48fe5" = "[riddle:answer=-southwest;group=35f48fe5;clue=남서쪽;level=direction;certainty=certain;source=original-en&authored]오래전 이곳엔 다른 민족이 살았네. 거대한 신전에서 신들에게 찬미를 바쳤지. 그 위 구석진 곳에 X가 있네. 남서쪽으로 항해하면 헛수고라 일러 두네."
"0x35f48fe6" = "[riddle:answer=Havana;group=35f48fe6;clue=럼주,시가;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 12`&cargo&authored]X에서 놈브레 데 디오스까지 멀지 않네. 럼주도 넉넉하고 시가도 즐길 수 있지."
"0x35f4904e" = "[riddle:answer=Gibara;group=35f4904e;clue=북쪽,절벽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 20*`&authored]북쪽 절벽에서 발을 헛디디면, X에 이르러 곧 기분이 훨씬 나아지리."
"0x35f4904f" = "[riddle:answer=Turk Islands;group=35f4904f;clue=작은 섬,밧줄;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 6`&authored]이 일대를 작은 섬 셋이 둘러싸고 있네. 그러나 밧줄을 찾을 수 있는 곳은 그중 하나뿐."
"0x35f49050" = "[riddle:answer=San Juan|San Thoma;group=35f49050,35f490bf;clue=남동쪽;level=town;certainty=either;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 1`&authored]X는 섬 위에 있네, 그 섬은 참으로 작지. 그러나 남동쪽을 보라, 그보다 큰 섬은 없도다."
"0x35f49051" = "[riddle:answer=-north;group=35f49051;clue=북쪽;level=direction;certainty=certain;source=original-en&authored]이 섬줄기에서 끊어진 곳이 보이네. 서쪽과 남쪽에는 섬이 있고, 북쪽에는 아무것도 없이 물과 연기뿐."
"0x35f49052" = "[riddle:answer=Vera Cruz;group=35f49052,35f490c1,35f490c2,35f49130;clue=셋,서쪽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 27*`&authored]큰 만에 도시 몇이 있으니 셋이로다. X는 그중 가장 서쪽을 가리키네."
"0x35f49053" = "[riddle:answer=Roatán;group=35f49053;clue=셋,남쪽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 13`&authored]큰 만에 도시 몇이 있으니 셋이로다. X는 그중 가장 남쪽을 가리키네."
"0x35f49054" = "[riddle:answer=Roatán;group=35f49054;clue=섬 둘,큰 섬;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 21`&authored]한 만에 섬 둘이 있으니 하나는 크고 하나는 작네. 큰 섬에 있는 도시가 X의 몫이리."
"0x35f49055" = "[riddle:answer=Cayman;group=35f49055;clue=멀리 떨어진,외딴;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 25`&authored]멀리 떨어진 섬, 작고 외딴 곳. X가 가리킬 다른 곳은 없도다."
"0x35f49056" = "[riddle:answer=Port Royale;group=35f49056;clue=금,항구;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 8`&authored]X는 금으로 길을 깐 도시라네. 그 위엄 있는 항구는 볼 만하지."
"0x35f49057" = "[riddle:answer=Santo Domingo;group=35f49057;clue=네 도시,화산,남동쪽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 19*`&authored]네 도시가 화산을 둘러싸고 있네. 남동쪽에 있는 도시가 네가 찾는 곳이라."
"0x35f490bf" = "[riddle:copy=0x35f49050]"
"0x35f490c0" = "[riddle:answer=Guadeloupe|Martinique;group=35f490c0;clue=모래,좋은 물건;level=town;certainty=either;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 18`&cargo&authored]그 모래 위에서 바다는 아무도 돌보지 않는 도시들을 품고 있네. 그러나 그중 하나는 늘 좋은 물건을 내놓았지."
