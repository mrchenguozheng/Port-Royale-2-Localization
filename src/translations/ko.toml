"0xe1cdc367" = "이제 기본 조작 몇 가지를 익혔고, 선단을 한 도시에서 다른 도시로 보내는 법도 압니다. 이것은 대단히 중요합니다. 처음에는 도시 사이에서 물자를 운송하고 교역해 생계를 꾸리게 되기 때문입니다.<n><n>이 시나리오의 두 번째 부분에서는 배 한 척을 사서 지금의 선단에 더하게 됩니다.<n><n>한 가지 요령을 더 알려 드리지요:<n><n>게임 중 언제든지 F1을 누르면 키보드와 마우스 설정을 설명하는 도움말 화면이 나타납니다.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>배 두 척으로 이루어진 선단이 [town:Cartagena] 항구에 닿아야 합니다."
