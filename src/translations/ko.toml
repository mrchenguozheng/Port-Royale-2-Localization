"0xd4cd0f3d" = "헨리 에이버리는 성공한 해적의 전형입니다. 당대에서 가장 부유한 배들을 나포하고도 당국의 추적을 따돌렸으며, 자기 재산을 누릴 만큼 오래 살았습니다.<n><n>에이버리의 젊은 시절은 베일에 싸여 있습니다. 다만 1694년 6월에 그가 「찰스」라는 사략선의 항해사였다는 사실은 알려져 있습니다. 그 배는 서인도 제도의 프랑스 식민지 마르티니크 소속 배들을 나포할 수 있도록 스페인에게 허가를 받은 상태였습니다. 어느 날 그는 반란을 이끌어 배를 장악했고, 선원 대부분이 그를 따랐습니다. 대포 46문을 갖춘 빠른 사략선으로서 해적선 노릇에 안성맞춤이던 그 배는 「팬시」로 이름이 바뀌었습니다. 1695년에 그는 최대의 업적, 곧 인도 보물 함대의 약탈에 성공했습니다. 다른 해적들과 손을 잡고 중무장한 인도 보물 함대를 공격해 배 두 척을 나포한 것입니다. 그 배들은 대모굴 황제 자신의 것이었고 상상할 수 없을 만큼 값진 보물을 싣고 있었습니다. <n><n>바하마 총독에게 뇌물을 주어 해적들을 보호하게 한 뒤, 에이버리는 선원들에게 몫을 나눠 주었고 그들은 뿔뿔이 흩어졌습니다. 일부는 잉글랜드에서 붙잡혔지만 에이버리는 아일랜드로 가서 흔적도 없이 사라졌습니다. 그가 숨어서 계속 재산을 누렸다고 짐작할 수밖에 없습니다."
"0xd4cd0f3e" = "역대 가장 유명한 해적 가운데 하나는 에드워드 티치(1718년 사망)로, 별명은 검은 수염입니다. 이름에서 알 수 있듯 그의 표식은 무시무시하게 땋아 내린 검은 수염이었습니다. 부하 300명과 함께 네덜란드 교역선을 개조한 「앤 여왕의 복수」를 타고 대양을 누볐으며, 왕립 해군의 군함과 맞서는 것도 두려워하지 않았습니다.<n><n>브리스틀에서 태어난 티치는 18개월 동안 주로 서인도 제도 북부와 북아메리카 연안에서 맹위를 떨쳤습니다. 그는 언제나 바하마와 가난한 노스캐롤라이나에서 피신할 곳을 찾을 수 있었습니다.<n><n>검은 수염이 그토록 유명해진 또 하나의 이유는 그가 두렵고 혈기 왕성하며 변덕스러운 버커니어의 전형에 꼭 들어맞았기 때문입니다. 그가 포수 이스라엘 핸즈를 아무 이유 없이 두 번이나 쏘아 불구로 만들었다는 이야기가 전하는데, 그것도 나머지 선원들에게 누가 우두머리인지 일러 주려는 것이었다고 합니다.<n><n>그의 마지막 순간은 1718년, 해적 사냥꾼 로버트 메이너드가 그의 슬루프를 추적해 낼 때에야 찾아왔습니다. 티치는 만취한 상태였는데도 악마처럼 싸웠고, 치열한 격투 끝에야 쓰러졌습니다. 그는 그 싸움에서 죽었고, 살아남은 선원 대부분은 교수형을 당했습니다."
"0xd4cd0f3f" = "발견 시대 초기에 이미 가진 재산을 더 늘리고 싶어 하던 사람들은 16세기 초부터 주로 카리브해에서 일궈진 사탕수수 농장이 더없이 좋은 투자처임을 알게 되었습니다.<n><n>그런 투자는 평균 10퍼센트의 이윤을 냈고, 가장 좋은 경우(1650년 무렵 바베이도스 같은 곳)에는 무려 50퍼센트에 이르기도 했습니다! 당연히 이런 농장에는 엄청난 수의 일꾼이 필요했고, 그래서 수십만 명의 노예가 아프리카에서 실려 왔습니다. 백인이 이미 여러 곳에서 원주민을 거의 다 몰살했기 때문입니다. <n><n>유럽인 자신들은 이 기후를 견디지 못했고, 그보다도 이런 궂은일을 하기에는 체면이 너무 높다고 여겼습니다. 농장 주인조차 런던이나 마드리드에 살면서 부하 몇 명에게 식민지의 일을 맡기기를 좋아했습니다. 18세기에 이르자 일부 섬에서는 흑인이 인구의 90퍼센트를 차지하게 되었습니다!"
"0xd4cd0f40" = "「검은 황금」의 거래는 이미 16세기 초에 시작되었습니다. 노예 상인들이 선호한 「상품」 공급지는 세네갈 강과 오늘날 카메룬으로 알려진 지역 사이에 뻗은 서아프리카 연안이었습니다. 이 지역은 운송 면에서 더없이 좋은 위치였을 뿐 아니라 안정된 경제·사회·정치 기반을 갖추고 있었습니다. 그래서 선원들이 직접 노예를 사냥할 필요 없이 지역 추장이나 다른 노예 상인에게서 희생자를 살 수 있었습니다.<n><n>특히 15세에서 35세 사이의 젊은 남자가 인기였는데, 이들은 주로 농장의 혹독한 노동에 투입될 예정이었기 때문입니다. 노예 다섯 명 가운데 한 명꼴로 최대 6주에 이르는 항해를 넘기지 못하고 죽었습니다. 주인의 야만적인 대우 때문에 죽은 이도 있고, 바다에서 사고로 목숨을 잃은 이도 있습니다. 이렇게 높은 죽음의 비율을 감안해 노예 상인들은 배에 최대한 많은 노예를 밀어 넣어 항해마다 이윤을 최대로 남기려 했습니다. 이 비참한 인간들은 몇 주씩 어둠 속에서 숯통에 든 정어리처럼 나란히 누워 서로 사슬로 묶인 채, 간신히 숨 쉴 만한 공기만을 나눠 가졌습니다.<n><n>이런 조건에서 이들 가운데 누군가가 항해를 견뎌 냈다는 것이 거의 믿기지 않을 정도입니다!  "
"0xd4cd0f41" = "북아메리카와 중앙아메리카에 백인 노예는 없었지만, 노예와 거의 다를 바 없는 조건에서 일한 유럽인은 얼마든지 있었습니다.<n><n>많은 젊은이(주로 교육을 받지 못한 하층민)가 이민을 원했지만 배 삯을 낼 돈이 없었습니다. 그래서 그들은 항해 비용을 빌리고, 그 빚을 일정 기간 사탕수수 농장 같은 곳에서 일해 갚기로 약조했습니다. <n><n>그러나 지극히 합리적으로 보이던 이 약정에도 함정이 있었습니다. 많은 농장주가 계약 노동자에게 고용 기간 동안 가능한 한 혹독하게 일을 시키려 했습니다. 여기에 대부분의 유럽인이 견디기 힘들어한 카리브해 기후까지 더해졌습니다.<n><n>이 「계약 노동」 제도는 고향에서 쫓겨난 죄수들에게도 흔히 쓰였습니다. 영국인은 이 방식을 나중에 특히 인도인에게 적용해 아프리카 식민지에서 강제 노동을 시켰습니다."
"0xd4cd0f42" = "아메리카 식민지가 번성하면서 대서양을 건너는 무역도 함께 번성했습니다. 엘리자베스 여왕 시대 이래 가장 강한 해양 국가였던 영국은 물자의 흐름을 장악해 자국 경제가 무역 이윤을 나눠 갖게 하는 데 큰 관심을 가졌습니다.<n><n>호국경 올리버 크롬웰 아래에서 1651년의 「제1차 항해법」은 식민지에서 유럽으로 물자를 운송할 때 오직 잉글랜드 배만 쓸 수 있다고 규정했습니다. 이 조치는 주로 새로 떠오르는 네덜란드의 힘을 겨냥한 것이었고, 자국 무역선단에 이익을 주었습니다.<n><n>1663년에는 이 법의 규정이 더욱 엄격해졌습니다. 유럽으로 물자를 운송하려는 식민지 배는 잉글랜드 항구에 들러 통행세를 내야 했습니다. 그러나 식민지 사이의 무역을 통제하려던 이 시도는 곧 좌초했습니다. 영국군이 해안선 전체를 감시하기는 어려웠으므로 결과는 밀무역의 번성이었습니다. <n><n>물자의 수출입 조건을 둘러싸고 모국과 계속 벌어진 이 갈등이, 특히 북아메리카 식민지에서 정착민들 사이에 별개의 정체성이 생겨나게 했고, 나중에는 독립 운동의 중요한 동기가 되었습니다."
"0xd4cd0f43" = "식민지 시대가 시작되면서 여러 가지 건강 문제가 생겼는데, 지중해나 연안을 따라 짧게 오가던 항해에서는 거의 알려지지 않았던 것들입니다. 카리브해와 북아메리카의 식민지로 가는 항해는 한두 달, 폭풍이나 무풍기를 만나면 그보다 더 오래 걸렸습니다. 넘어야 할 어려움이 많았던 것은 놀랄 일이 아닙니다. 더러운 옷과 형편없는 위생에서 나는 악취, 상하고 썩은 음식, 깨끗한 물의 부족, 배 안의 쥐, 그리고 단조로움과 배 안에 갇힌 답답함이 주는 심리적 부담이 있었습니다. 괴혈병이라는 무서운 유령이 모든 선원 위에 드리워 있었습니다. 비타민 부족으로 생기는 이 병은 머리카락과 이가 빠지는 증세로 나타나 많은 선원의 목숨을 앗아 갔습니다. 이 병을 처음으로 치료한 사람은 세계 일주 항해자 제임스 쿡(1728-1779)이었습니다. 그는 배를 깨끗하게 유지하라고 고집했을 뿐 아니라 선원들에게 김장용 양배추 절임과 신선한 과일을 나눠 주었습니다. 상륙하는 사람은 흑수열 같은 열대병과도 싸워야 했는데, 이는 말라리아의 가장 위험한 형태 가운데 하나입니다. 맥박이 빨라지고 열이 오르며 오한과 검은 오줌이 나오는 이 감염은 거의 언제나 치명적이었습니다."
"0xd4cd0f44" = "항해자와 지도 제작자가 새로 마주친 땅, 강, 정착지에 이름을 붙여야 했던 일에는 재미있는 일화가 많이 따릅니다. 발견 시대의 유럽 탐험가들이 아메리카에서 처음 붙인 이름 하나만 보아도 사연이 있습니다. 크리스토퍼 콜럼버스는 1492년 10월 12일 상륙한 섬을 살바도르(「구원자」)라고 불렀습니다. 항해 중에 선단을 질병과 폭풍에서 지켜 주신 것, 무엇보다 땅이 보이기 직전에 터질 뻔한 반란을 막아 주신 것에 주님께 감사드리려는 것이었습니다.<n><n>그 뒤 스페인 정복자들은 대개 종교적 의미를 담은 이름을 골랐습니다. 이를테면 「놈브레 데 디오스」(「하느님의 이름」)나 「트리니다드」(「삼위일체」) 같은 것입니다. 다른 경우에는 날짜나 지형을 보고 떠올린 이름을 붙였습니다. 이를테면 포르투갈 선원들은 1502년 새해 첫날 발견한 브라질 연안의 만을 「1월의 강」(히우지자네이루)이라 불렀고, 몬테비데오라는 도시 이름은 마젤란이 해안선을 처음 보고 외쳤다는 「몬테 비도 에우!」(「산이 보인다!」)에서 나왔습니다.<n><n>탐험가들이 자기 군주나 모국, 혹은 태어난 고장의 이름을 땅과 도시에 붙이는 것도 흔한 관례였습니다. 이는 바깥세상에 소유권을 분명히 알리는 구실을 했을 뿐 아니라, 이 먼 땅에서도 고향과 이어지는 끈을 만들었습니다.<n><n>그것도 안 되면 원주민 언어의 이름으로 돌아가면 되었습니다. 다만 대부분의 경우 그 뒤에 원주민을 쫓아내거나 몰살하는 것을 막지는 못했습니다.<n><n>제임스 쿡이 그 이상한 주머니 달린 짐승의 이름을 묻자 오스트레일리아 원주민이 「캥거루」(「강구루」)라고 답했고, 그것은 사실 「무슨 말을 하는 거지?」라는 뜻이었다는 이야기가 오늘날까지 전해집니다. 그게 전설이라 해도, 이런 우스운 오해는 분명히 있었을 것입니다. <n><n>도시, 산, 강의 이름 가운데 「좋은 아침입니다!」, 「다시 말씀해 주시겠습니까?」, 「저 좀 내버려 두세요!」라는 뜻인 것이 얼마나 많은지 알면 아마 놀랄 것입니다 ..."
"0xd4cd0f45" = "전 세계에 걸친 스페인 제국이 생겨나면서, 일상 행정은 물론 갑자기 닥칠 수 있는 위기를 처리할 만한 권한을 가진 식민지 당국을 세울 필요가 생겼습니다. 그래서 식민지에서 가장 중요한 총독들에게 부왕이라는 칭호를 내렸습니다.<n><n>제국이 절정에 이르렀을 때 이런 고위 인사는 신스페인(멕시코)과 페루에 둘 있었습니다. 18세기에는 누에바그라나다와 리오데라플라타의 부왕령이 더해졌습니다.<n><n> 아우디엔시아라 불리는 행정 평의회와 함께(흔히 갈등하면서) 일을 처리한 부왕의 임무에는 관리의 통상 업무가 포함되었습니다. 세금을 걷고 징수하며, 주민이 법을 지키게 하고, 식민지의 방비를 조직하는 일 등입니다. 그는 원주민을 보호하고 하급 성직자와 세속 고위 인사를 임명하는 책임도 졌습니다.<n><n>해외 영지의 경제적·정치적 중요성이 막대했으므로 왕실은 언제나 부왕의 행동을 지켜보았습니다. 부왕은 추가 수입을 얻을 상업 활동을 일절 할 수 없었습니다. 그와 별개로 부왕들 사이의 경쟁은 서로의 권력을 깎아 내리는 결과만 낳았습니다."
"0xd4cd0f46" = "유럽의 정복자들이 언제나 은과 금의 유혹에 귀를 기울였다는 것은 이미 잘 알려진 사실입니다. 그러나 그보다 거의 더 값진 것은 향신료였습니다. 후추나 육두구를 조금 얻으려고 사람들이 어떤 위험을 무릅썼는지 생각하면, 중세 유럽의 식탁이 얼마나 단조로웠을지 짐작하기 어렵지 않습니다.<n><n>그런 점에서 아메리카의 발견은 처음에는 몹시 실망스러운 일이었습니다. 사람들은 크리스토퍼 콜럼버스가 가져온 기이한 동물들을 흥미롭게 지켜보았고, 자기 나라의 영토가 넓어진 것과 그곳에 기독교가 퍼져 많은 영혼이 구원받으리라 여긴 것에 기뻐했습니다. 그러나 약속했던 금의 산은 좀처럼 찾기 어려웠습니다. 이 항해가 돈이 되기 시작한 것은 10년에서 20년이 지나 아메리카의 은이 물 밀 듯 유럽으로 밀려들 때였습니다. <n><n>그 가운데 한 항해에서 콜럼버스는 온 세상의 금과 은보다 값진 보물을 가져왔습니다. 1492년 11월 4일 원주민이 그에게 밤 맛이 나는 사과라 설명한 것을 내밀었고, 그 순간 그는 감자를 먹은 첫 유럽인이 되었습니다! 원주민이 이 식물을 부른 이름은 「바타테」였고, 그것이 오늘날 영어의 「potato」로 남아 있습니다.<n><n>오늘날 당연하게 여기는 다른 많은 것도 콜럼버스와 그 뒤를 이은 사람들이 처음 유럽으로 가져왔습니다. 담배, 토마토, 옥수수, 그리고 해먹입니다. 원주민들의 말로는 「하마카」였고, 영어 단어도 거기서 나왔습니다."
"0xd4cd0fae" = "신대륙의 발견이 알려지자 유럽 사람들의 상상력은 불붙었습니다. 이 아직 탐험되지 않은 땅에는 어떤 생물이 살고 있을까? 가장 믿기 어려운 소문이 떠돌았습니다. 어떤 섬에는 식인종이 득실거리고, 옆 섬에는 얼굴이 배에 붙은 머리 없는 생물이 산다는 것이었습니다.<n><n>남아메리카의 파타고니아는 대략 「큰발 달린 자들의 땅」이라는 뜻이고, 아마존이라는 이름은 그리스 신화의 여성 전사들을 탐험가들에게 떠올리게 한 여성 전사 무리에서 나왔습니다.<n><n>이런 소문 가운데 일부는 사실에 바탕을 두었지만, 다른 것은 오해와 잘못된 해석, 혹은 원주민 스스로 어디서인가 주워 들은 이야기에서 나왔습니다.<n><n>그러나 이런 소문 상당수는 사람들의 풍부한 상상력이 낳은 것이었고, 대개는 믿고 싶어서 믿은 것이었습니다. 정복자 여러 세대가 전설의 젊음의 샘과 에덴동산, 그리고 황금의 도시 엘도라도를 찾아 헤맨 것도 그렇게 설명할 수 있습니다. 원주민들이 이런 잘못된 믿음을 부추겼는데, 그들은 어디선가 들었다고 늘 장담하면서도 탐욕스러운 백인을 깊은 내륙으로 끌어들여 배와 떼어 놓으려고 시간을 벌고 있었을 뿐이었습니다."
"0xd4cd0faf" = "다채로운 인물이 많았던 탐험가와 정복자 명단에서 가장 눈부신 인물 가운데 하나는 잉글랜드의 작가이자 모험가인 월터 롤리 경(1554년경–1618)입니다. 그는 1580년 잉글랜드 점령에 반대해 일어난 아일랜드 반란을 진압하면서 처음 이름을 알렸습니다.<n><n>엘리자베스 1세의 총애를 받게 된 그는 그 영향력을 이용해 남아메리카의 전설적인 도시 엘도라도를 찾는 원정에 자금을 댔습니다. 여러 차례 원정이 값을 하는 것을 찾지 못하고 완전히 실패했는데도, 그는 뛰어난 언변으로 런던의 후원자들을 계속 붙들어 두었습니다. 마지막 상은 늘 다음 강어귀 너머에 있고 지금 포기할 수는 없다고 그들을 믿게 했습니다.<n><n>그러나 그의 신용도 결국 바닥을 드러냈습니다. 사람들은 그의 거창한 약속을 너무도 자주 들은 뒤에 그것이 허풍일 뿐임을 알게 되었습니다. 롤리는 마침내 엘리자베스의 총애에서 밀려났습니다. 뒤를 이은 제임스 1세는 이 혈기 왕성한 모험가를 자신의 온건한 외교 정책에 위협으로 여겨, 즉위하자마자 몹시 빈약한 이유로 그를 체포하고 사형을 선고했습니다. 형은 감형되었지만(물론 면제된 것은 아니었습니다!) 롤리는 런던탑에 갇혔습니다.<n><n>몇 년 뒤 나라 재정 사정으로 그 필요성을 깨달은 국왕은 월터 롤리 경에게 가이아나 원정을 다시 이끌도록 허락했습니다. 사형 선고를 받은 사람에게 다른 사람의 생사를 맡기고 금을 찾아 보내는 것은 어처구니없는 일이었습니다! 그러나 이 모순은 얼마 지나지 않아 스스로 풀렸습니다. 이미 열병에 시달리던 롤리는 마지막 원정이 실패로 끝나는 것을 지켜보아야 했습니다.<n><n>잉글랜드로 돌아오자 격노한 국왕은 1603년에 내린 롤리의 집행 유예를 끝내기로 했습니다. 월터 롤리 경은 얼마 뒤 처형되었습니다.  "
"0xd4cd0fb0" = "신대륙 원주민과 백인 선원의 첫 만남은 대체로 평화로웠습니다. 여러 곳에서 유럽인은 신으로 환영받았습니다. 여기저기서 그런 인상은 오래된 신화에 바탕을 두었지만, 대개 원주민은 「물 위의 집」(배)을 타고 반짝이는 갑옷을 입고 온 키 크고 금발인 낯선 이들에게 그저 압도되었을 뿐입니다.<n><n>콜럼버스와 코르테스 등 모든 탐험가는 이 환상을 이어 가는 것을 몹시 반가워했지만, 원주민이 야만적인 현실과 맞닥뜨리는 데는 오래 걸리지 않았습니다. 채울 수 없는 금에 대한 욕망, 원주민들이 「스페인 병」이라 부른 것에 이끌린 스페인인들은 주민을 학대하고 노예로 만들고 몰살했습니다. 아메리카에서는 그 전에 알려지지 않았던 말의 모습과 대포 소리는 극심한 공포를 불러일으켰고, 학살에서 살아남은 이들도 곧 천연두나 인플루엔자 같은 옮겨 온 병에 쓰러졌습니다.<n><n>곤솔로 오비에도나 후안 데 세풀베다 같은 유명한 지식인들은 원주민을 천하고 무지하며 열등하다고 묘사하는 끔찍한 인종주의 논리로 유럽인의 범죄를 정당화하려 했습니다.<n><n>믿음 때문에 과학자와 마녀를 화형에 처한 바로 그 사람들이 원주민의 「수의(獸의) 풍습」을 충격적으로 서술하는 솜씨에는 능했다는 것입니다. 우상 숭배와 인신 공양, 식인 풍습이 전적으로 상상은 아니었지만, 백인은 이후 이것을 원주민에게 온갖 잔혹한 제재를 가하는 포괄적인 구실로 삼았습니다."
"0xd4cd0fb1" = "널리 알려져 있듯 아메리카 식민지화의 초기 단계는 스페인과 포르투갈이 맡았습니다. 뒤에 네덜란드가, 그리고 가장 중요한 영국과 프랑스가 합류했습니다. 그다지 알려지지 않은 사실은, 강력한 독일 자금 후원자들이 없었다면 수많은 스페인 원정이 아예 이루어지지 못했으리라는 것입니다.<n><n>1500년 무렵에는 특히 상슈바벤과 아우크스부르크가 유럽의 가장 중요한 무역·금융 중심지로 성장했습니다. 푸거 가문과 벬저 가문의 상인들이 이곳에서 세계 정치에 막강한 영향력을 행사했습니다. 예를 들어 그들의 막대한 자금 지원 덕분에 스페인의 카를로스 국왕이 1519년 독일 황제가 될 수 있었습니다. 잉글랜드의 헨리 8세와 여러 교황도 「부자」 야코프 푸거를 기꺼이 친구로 두었습니다.<n><n>당연히 이 영리한 상인들에게도 이런 후원에는 다른 속내가 있었습니다. 그 대가로 그들은 특권을 받거나 왕실의 은 광산에 참여할 허가를 기대했습니다. 벬저 가문은 심지어 베네수엘라 북부 해안의 일부를 한동안 손에 넣어 「노이아우크스부르크」 같은 도시를 세우고, 그곳에서 내륙 깊숙이 보물을 찾는 원정(대개 헛수고였습니다)을 여러 차례 보냈습니다."
"0xd4cd0fb2" = "지구의 절반을 정복함으로써 스페인 왕실은 더없이 좋은 기회를 얻은 듯했습니다. 잉카·마야·아즈텍의 위대한 아메리카 문화가 멸망하고 페루와 멕시코에서 거대한 은광이 발견되기까지 여러 세기 동안 스페인의 지위는 흔들리지 않을 것처럼 보였습니다. 바로 그 막대한 부가 이 세계 강국의 몰락을 앞당겼다는 것이 거의 어처구니없게 느껴집니다.<n><n>배로 스페인에 보낸 보물의 상당 부분은 애초에 항해 자금을 댄 피레네 북쪽 상인들의 주머니로 곧장 들어갔습니다. 그러나 남은 것만으로도 이베리아 반도의 물가를 끌어올리기에 충분했습니다. 그곳 사람들은 분수에 넘게 살기 시작했습니다. 국가 예산의 균형을 맞추는 것보다 큰 규모로 궁정을 꾸리는 능력이 더 중요하게 여겨지던 시대였으므로, 사소한 재정 걱정에는 거의 신경을 쓰지 않았습니다.<n><n>사람들이 물건을 직접 만들기에는 너무 고상해졌기에, 물자는 외국 배로 갈수록 더 많이 실려 들어왔습니다. 아메리카 원정에 필요한 장비와 식량조차 자국 상인이 대는 일은 드물었습니다. 사람들은 자랑스럽게 말했습니다. 온 유럽이 스페인의 명령 아래에 있다고.<n><n>그러나 은의 흐름은 언젠가 마를 수밖에 없었고, 그 뒤의 냉엄한 각성은 긴 밤의 폭음 뒤에 오는 숙취와 비슷했습니다. 네덜란드와 영국이 스페인을 공해에서 몰아내려 했고, 개신교 「이단」과 투르크에 맞선 여러 종교 전쟁이 막대한 돈을 삼켰으며, 해가 지지 않는 거대 제국은 다스릴 수 없는 거인이 되어 있었습니다.<n><n> 1557년, 새 스페인 군주 펠리페 2세가 처음으로 국가 파산을 선언할 수밖에 없었을 때 위기는 모두에게 분명해졌습니다. 그 이전 어느 제국보다 큰 보물을 가졌던 대제국은 파산했습니다."
"0xd4cd0fb3" = "브라질에서 쓰는 말이 포르투갈어인데, 남아메리카 거의 모든 곳에서는 왜 스페인어를 쓸까요?<n><n>아프리카 연안을 따라 인도로 가는 항로를 찾아낸 스페인인과 포르투갈인 모두 자기들의 앞날이 대양 건너에 있다는 것을 일찍 깨달았습니다. 둘은 서로를 질투 어린 눈으로 지켜보며 물자와 신민, 땅을 찾는 과정에서 상대의 영역을 침범하지 않도록 견제했습니다.<n><n>당시에는 국제법 같은 것이 없었으므로 분쟁이 생기면 두 나라가 그 권위에 기꺼이 따르던 유일한 사람, 교황에게로 갔습니다. 가톨릭 교회로서도 스페인인과 포르투갈인이 서로 견제하느라 기운을 낭비하는 대신 미지의 땅에서 「이교도」의 기독교화에 열심히 나서 주기를 바랐습니다.<n><n>그래서 토르데시야스(1494년)와 사라고사(1529년)에서 공동 협상 끝에 특정 경도선 서쪽의 새로 발견된 영토는 스페인에, 그 밖의 모든 것은 포르투갈에 속한다는 데 합의했습니다. 그 경도선이 당시 미발견 상태였던 남아메리카를 가로질렀기에, 그 동쪽 부분인 오늘날 브라질의 일부가 포르투갈에 돌아갔습니다."
"0xd4cd0fb4" = "「해적」이라는 말을 처음 쓴 사람은 기원전 140년경의 로마 작가 폴리비오스였을 것입니다. 그 뒤로 이 두려운 바다 악당들을 가리키는 여러 말이 쓰였습니다. 코르세어, 프리부터, 버커니어, 필리버스터 ... 클라우스 슈퇴르테베커를 둘러싼 이들은 「비탈리아 형제단」으로 알려졌고, 바솔로뮤 로버츠는 자기와 살인 무리에게 「행운의 신사들」이라는 제법 얌전한 이름을 붙였습니다. 그러나 결국 배를 공격하러 허허벌판에서 나타난 자가 누구였든 상인에게는 별 차이가 없었습니다. <n><n>버커니어는 오랜 세월 세계 곳곳에서 인류의 골칫거리였습니다. 고대에 킬리키아 해적들은 지중해 전역에 그토록 공포를 퍼뜨려 로마 제국이 정기적으로 토벌 원정을 떠나야 했습니다. 자주 오가는 무역로 가까이에 숨은 섬과 들쭉날쭉한 해안선은 해적 활동에 더없이 좋은 자리였습니다. 암초와 조류, 나쁜 날씨 때문에 둔중한 교역선이 손쉬운 표적이 되는 곳은 이런 짓을 저지르고 나서 재빨리 숨을 수 있는 피난처가 되었습니다. 소아시아 해안은 고대에, 카리브해는 발견 시대에 똑같이 두려움의 대상이었고, 동남아시아 해적들은 거의 신화적인 지위를 얻었습니다.<n><n>말의 뿌리를 보면 「버커니어」는 원래 해군 선원이 아니라 개인 자격으로 노획물을 찾아 바다로 나선 뱃사람을 가리켰으므로 해적 행위를 하는 자로 여겨졌습니다. <n><n>그러나 사략 허가장이 발급되면서 카리브해 버커니어 일부는 합법성을 가장하게 되었습니다. 이 문서는 잉글랜드·프랑스·네덜란드 총독이 발급했고, 그 목적은 해적의 횡포를 적대 세력에게로 돌리는 것이었습니다.<n><n> 사략 허가장을 얼마나 쉽게 얻을 수 있는지는 총독에 따라 달랐습니다. 어떤 총독은 해적과 손잡는 것을 명예롭지 않게 여겼습니다. 다른 이들은 그보다 양심의 거리낌이 적었거나, 그저 부패했거나 겁이 많았을 것입니다."
"0xd4cd0fb5" = "「일곱 바다」는 사실 셋(곧 세 대양)에 지나지 않습니다. 남태평양과 북태평양, 남대서양과 북대서양, 북극해와 남극해, 그리고 인도양입니다.<n><n> 태평양이라는 이름은 페르난도 마젤란이 처음 세계 일주를 하면서 붙였습니다. 그가 이 거대한 바다를 건너는 여러 배고픈 주 동안 날씨가 좋은 것을 만나는 행운을 얻었기 때문입니다.<n><n>그리고 하나 더. 카리브해라는 이름은 인도 언어군에 속한 민족인 「카리베」에서 나왔으며, 그들이 정착한 영역은 안틸레스 제도에서 남아메리카 북부 해안을 따라 뻗어 있었습니다."
"0xd4cd0fb6" = "버뮤다 제도는 1503년 이 섬들을 발견한 스페인 탐험가 후안 베르무데스의 이름을 따서 붙여졌습니다. 모든 뱃사람이 「버뮤다 삼각지대」라 부르는 악명 높은 곳은 베르뮤다 제도와 푸에르토리코, 포트로더데일(플로리다) 사이의 바다를 아우르며, 이곳에서 불가사의한 해난 사고가 날 위험이 매우 높다고 합니다.<n><n>어떤 이들은 이 기이한 불가사의한 사건의 연속이 크리스토퍼 콜럼버스의 항해에서 시작되었다고 주장합니다. 스페인을 섬긴 제노바 출신 항해자는 1492년 9월 14일 배 세 척과 함께 바로 이 해역에 있었는데, 나침반 바늘이 미친 듯이 돌기 시작했습니다. 이것은 지리상의 북극과 자북극의 차이 때문이었습니다. 다음 날에는 하늘에 거대한 불꽃이 나타났습니다(아마 유성이었을 것입니다).<n><n>그러나 「버뮤다 삼각지대」라는 별명은 제2차 세계대전 뒤에야 생겼습니다. 북대서양 남서부의 이 해역에 대중의 이목을 끈 일련의 항공기 사고가 있었기 때문입니다.<n><n>불가사의한 사건을 따르는 사람들은 200건이 넘는 설명되지 않은 사고를 내세우지만, 그 경계를 다소 너그럽게 잡는 편입니다. 그 가운데 상당수는 이 해역에서 아예 일어나지도 않았고, 대부분은 지극히 논리적인 설명이 있습니다."
"0xd4cd0fb7" = "아메리카에서 스페인으로 정기적으로 출항하던 전설적인 보물 함대는 이베리아 반도 밖에서도 온갖 탐욕을 불러일으켰습니다. 특히 야심 찬 영국은 이것을 스페인의 바다 지배자, 세계의 여왕이라는 지위에 도전할 기회로 보았습니다.<n><n>섬나라로서 대규모 군사 작전을 벌이기에는 아직 너무 약했기에, 유럽 밖 먼 곳에서 경쟁자를 상대하는 편이 훨씬 합리적이었습니다. 상대가 공격받으리라 예상하지도, 공격 경고를 받지도 못할 곳이었기 때문입니다. 그곳에서 손쉽게 희생자를 약탈하고 곧장 사라지면 유럽에서는 몇 달 동안 그 일을 아무도 듣지 못했습니다.<n><n>가장 유명한 프랜시스 드레이크(1540-1596)를 비롯한 대담한 선장들은 엘리자베스 1세 여왕에게서 사략 허가장을 받았습니다. 이 사략 허가장은 일종의 백지 수표 같았고, 드레이크와 그 동료를 평범한 버커니어 위로 끌어올려 더 높은 권위를 위해 일하는 사설 약탈 귀족의 지위를 주는 약탈 면허였습니다. 그들은 그 일을 훌륭히 해냈습니다. 이베리아의 배와 주둔지 가운데 안전한 곳은 어디에도 없었습니다.<n><n>1578년 프랜시스 드레이크는 마젤란 해협을 지나 회오리처럼 아메리카 태평양 연안의 스페인 노획물을 찾아 나섰습니다. 그 전에는 아무도 감히 그런 일을 하지 못했습니다! 1580년 플리머스 항으로 돌아왔을 때 드레이크는 마젤란에 이어 세계 일주를 한 두 번째 선장이 되어 있었습니다. <n><n>한편 스페인의 펠리페 국왕은 분노로 끓어오르며 토르데시야스 조약을 흔들어 댔습니다. 1494년 교황 성하가 서반구를 스페인의 세력 범위에 속한다고 단호히 선언한 조약이었습니다. 그러나 로마 교황의 권위를 온전히 부정하고, 1582년 교황 그레고리오의 명으로 만들어졌다는 이유만으로 1753년까지 근대 그레고리력조차 받아들이지 않은 이 기이한 개신교 이단의 섬나라는 그런 항의에 흔들릴 리가 없었습니다.<n><n>다시 한 번 이 문제는 전쟁으로만 풀릴 것처럼 보였습니다. 펠리페의 무적함대가 1588년 잉글랜드로 출항했지만, 이때 기사 작위를 받은 프랜시스 드레이크 경의 지휘와 때맞춰 몰아친 몇 차례 폭풍 덕분에 영국은 스페인 함대를 격파했습니다. 그 뒤 수백 년 동안 아무도 영국의 최강 해양 국가 지위에 도전하지 못했습니다."
"0xd4cd101f" = "의심할 여지 없이 크리스토퍼 콜럼버스(1451-1506)의 아메리카 항해는 인류가 감행한 가장 위대한 모험 가운데 하나였습니다. 극적인 사건과 기묘한 우연이 얽힌 이런 이야기는 작가조차 감히 상상하기 어려울 정도입니다.<n><n>제노바 출신 항해자는 인도로 가는 서쪽 항로가 있다는 자기 생각을 스페인의 왕 부부 이사벨과 페르난도에게 설득하는 데는 성공했지만, 배에 탄 선원들의 동의를 얻을 수는 없었습니다. 실제로 선원 대부분은 강제로 끌려온 이들이었습니다. 왕실에 대한 잘못에 대한 벌로 팔로스 마을은 배 두 척과 선원을 내놓아야 했습니다.<n><n>콜럼버스의 계획이 알려지자 공포의 탄성이 터졌습니다. 선원들은 자기들이 미치광이의 지휘 아래 항해하고 있으며, 그 미치광이는 자기와 함께 타는 모두를 파멸로 이끌 뿐이라고 굳게 믿었습니다.<n><n>그러나 콜럼버스의 가장 큰 적은 미신이었습니다. 상상할 수 있는 온갖 무서운 이야기가 배에 올라탄 듯했고, 기이하거나 불길한 일은 선원들의 두려움을 키울 뿐이었습니다. 테네리페를 지나갈 때 화산이 폭발했고, 하늘에는 불기둥이 보였으며, 나침반 바늘까지 선원들을 골탕 먹이는 듯했습니다. 배가 무풍지대에 들어가면 그것도 나쁜 징조로 여겼습니다. 반대로 순조롭게 나아가면 바람이 늘 동에서 서로 불어 다시는 돌아올 수 없으리라는 뜻이었습니다.<n><n>여러 번 반란이 일어날 뻔했습니다. 어느 밤 선장은 자기 선실 밖에서 발소리와 웅성거림을 들었고, 그가 큰 소리로 기도를 시작하자에야 암살자들이 기세를 잃고 살금살금 물러났습니다.<n><n>가장 심각한 위기는 지평선에 섬으로 보이던 것이 또다시 착시에 지나지 않았음이 드러날 때마다 터졌습니다. 10월 10일에도 바로 그런 일이 있어 사태가 정점에 이르렀습니다. 콜럼버스는 어렵사리 사흘의 최후 통첩을 얻어 냈고, 선원들은 그 뒤에는 (가급적 선장 없이) 돌아가겠다고 했습니다. 그러나 운명은 다른 뜻이 있었습니다. 그 사흘 안에 실제로 육지가 보였습니다. 그 자리에 있던 누구도 아시아 대신 전혀 새롭고 미지의 대륙에 닿았으리라고는 꿈도 꾸지 못했습니다.<n><n>일본과 중국은 아직 수천 해리나 떨어져 있었고, 앞길에 낯선 대륙이 놓여 있던 놀라운 행운 덕분에 콜럼버스의 원정은 실패를 면했습니다. 선원들의 사기는 곧바로 올라갔습니다. 그들 가운데 누구도 반란을 생각한 적이 있다고 떠올리지 못했습니다 ..."
"0xd4cd1020" = "크리스토퍼 콜럼버스는 실제로 새로운 육지를 발견했습니다(정확히는 다시 발견했는데, 바이킹이 중세에 이미 아메리카 땅을 밟았기 때문입니다). 그러나 그는 인도로 가는 항로를 발견했다고 잘못 선언했습니다.<n><n>네 차례 항해 가운데 두 번째와 세 번째를 준비하면서 제노바 출신인 그는 피렌체의 아메리고 베스푸치와 협력했습니다. 서쪽의 이 땅들이 사실 새롭고 미지의 대륙에 속한다고 처음 제안한 사람이 바로 그였습니다. 이 놀라운 깨달음은 대중의 관심을 다시 불태웠고, 이 새 영토를 두고 말할 때면 베스푸치의 이름이 반드시 나왔습니다.<n><n>반대로 크리스토퍼 콜럼버스의 별은 기울고 있었습니다. 그동안 카리브해 정착민들의 고소로 그는 사슬에 묶여 본국으로 송환되기까지 했고, 1506년에 쓰라리고 병든 몸으로 죽었을 때도 마땅한 주목을 받지 못했습니다. 그러니 1년 뒤 이 미지의 땅에 이름을 제안하려던 남독일 지도 제작자 마르틴 발트제뮐러가 인기 있는 아메리고 베스푸치의 이름을 떠올린 것도 놀랄 일이 아닙니다. <n><n>발트제뮐러가 붙인 이름은 동료들에게 받아들여졌습니다. 그 대륙이 「콜롬비아」로 불렸다면 더 공정했을 것입니다."
"0xd4cd1021" = "스페인 통치 아래 크게 성장한 아메리카의 첫 지역은 히스파니올라였습니다. 크리스토퍼 콜럼버스가 1493년 이곳에 첫 유럽인 정착지를 세웠지만, 그가 유럽에서 돌아오기 전에 원주민이 이미 그곳을 밀어 버렸습니다.<n><n>그 뒤 여러 해 동안 스페인 왕실은 이 섬을 점점 더 장악했습니다. 첫 수도원과 첫 대성당이 세워졌고, 다른 지역으로 확대될 사회 제도도 이곳에서 처음 자리를 잡았습니다. 계급이 엄격히 나뉘고 가톨릭 교회와 긴밀히 얽힌 노예 소유 사회였습니다.<n><n>히스파니올라는 큰 기회를 제공하는 듯 보여 많은 진취적인 정착민을 대양 건너로 끌어들였습니다. <n><n>그러나 스페인은 오래지 않아 눈길을 다른 지역으로 돌렸습니다. 그때는 이미 대륙의 큰 왕국들이 발견되고 정복된 뒤였습니다. 그곳은 다스리기도 쉽고 금은 광상도 더 풍부하고 캐기 쉬웠습니다.<n><n>내던져 버린 장난감처럼 사람들은 히스파니올라에 흥미를 잃었습니다. 네덜란드·잉글랜드·프랑스 해적들이 번갈아 공격해 왔습니다. 1697년 프랑스가 섬 서쪽의 생도맹그(오늘날 아이티)를 장악하고 수익성 좋은 농장 경제를 세웠습니다. 카카오, 설탕, 인디고, 목화, 커피 생산 덕분에 생도맹그는 18세기에 신대륙에서 가장 이윤이 큰 식민지가 되었습니다.<n><n>프랑스 혁명의 여파로 일어난 역사상 유일하게 성공한 노예 반란은 결국 1804년 아이티의 독립으로 이어졌습니다. 반란자들은 이전 압제자들을 자기들이 당했던 방식 그대로 대했습니다. 「독립 선언을 위해서는 양피지 대신 백인의 가죽이, 잉크 단지 대신 그의 두개골이, 잉크 대신 그의 피가, 펜 대신 총검이 필요하다」고 당시 흑인 장군 부아롱-토네르가 선언했습니다."
"0xd4cd1022" = "카리브해의 대표적인 산물이지만 인류에 이로운지는 의심스러운 것이 럼주입니다. 사탕수수 당밀로 만든 이 술은 원래 「악마의 살인자」라는 다채로운 이름을 가졌고, 1650년 바베이도스에서 처음 언급되었습니다. 해적들의 전설적인 애호 음료로서 대개 사람들은 럼주를 역대 가장 무서운 해적 소굴 가운데 하나인 자메이카 섬과 떠올립니다. <n><n>노예 상인들은 아프리카 연안에서 산 인간 상품을 카리브해에서 많은 양의 당밀과 바꿔 팔았습니다. 이 당밀은 뉴잉글랜드에서 럼주로 정제된 뒤 바로 그 배들에 실려 아프리카로 운송되었습니다. 술은 아프리카에서 팔리고 빈 배에는 새 노예 화물이 실렸습니다. 이 치명적인 「삼각 무역」으로 선주들은 항해마다 배를 늘 가득 채울 수 있었습니다."
"0xd4cd1023" = "쿠바 다음으로 아메리카에서 가장 유명한 카리브해 섬은 아마 자메이카일 것입니다. 이름은 아라와크 인디언어의 「자이마카」에서 나왔고, 대략 「나무와 물의 땅」이라는 뜻입니다. 9년 전에 이 섬을 발견한 크리스토퍼 콜럼버스 자신은 1503년 북부 해안 앞에서 배가 난파했을 때 이 곳의 아름다운 경치와 주민의 다정함을 실컷 느낄 기회를 가졌습니다.<n><n>그는 그곳이 너무 마음에 들어 스페인 국왕에게서 섬 전체의 소유권을 넘겨받아 자기 것이라 선언했습니다. 그런데도 이 섬 낙원은 이후 수십 년 동안 상당히 방치되다 1655년 영국에 점령되었습니다. 그때까지 남은 아라와크인은 거의 없었는데, 그 부족이 유럽인이 옮겨 온 병에 특히 취약했기 때문입니다.<n><n>1661년 에드워드 도일리가 자메이카의 총사령관 겸 총독으로 임명되었습니다. 그의 권한 아래 수도 포트로열은 활기차고 방비가 두터운 해적들의 안식처로 바뀌었습니다. 「지구에서 가장 부유하고 가장 부패한 곳」이라 불렸고, 평소에는 평범한 상인이던 주민 다수가 자주 무리를 지어 스페인 해역에서 사설 약탈을 벌였습니다. 영국 정부는 처음에 이런 일을 단속할 뜻이 거의 없었습니다. 버커니어가 스페인 경쟁자를 견제해 주고 있었기 때문입니다.<n><n>전직 해적이었다는 점에서 의미가 큰 헨리 모건 경이 총독에 오른 뒤에야 자메이카에 문화와 질서가 돌아왔습니다. 모건은 해적 행위를 무자비하게 진압했고, 옛 동료들을 교수대에 보내는 데 주저하지 않았습니다.<n><n>그러나 영국의 통치가 다시 자리를 잡자마자 사탕수수 재배 외에 새롭고 돈이 되는 수입원이 발견되었습니다. 1672년 이후 잉글랜드 왕립 아프리카 회사가 독점권을 세우면서 포트로열은 세계 최대 노예 시장으로 성장했습니다."
"0xd4cd1024" = "신대륙에 도착한 지 겨우 2주 만에 크리스토퍼 콜럼버스는 서인도 제도에서 가장 큰 섬인 쿠바에 닿았습니다. 이곳에는 여러 부족이 살았습니다. 시보네이, 과나하타베이, 그리고 타이노족인데, 평화로운 성품에도 이들은 다른 원주민 부족과 똑같은 불행한 운명을 겪었습니다. 1511년 스페인에 맞서 4년 전쟁을 치른 뒤 정복되어 몰살당했습니다. 그 결과 흑인 노예가 대량으로 이곳에 들어왔습니다. 수도 아바나를 둔 이 섬은 일곱 개의 행정 구역(카빌도)으로 나뉘었고, 각 구역은 특별 평의회에 대표를 보냈습니다. 그 대표의 임무는 그 지역의 이해를 대변하는 것이었습니다.<n><n>쿠바 역사에서 주목할 점은 1762년부터 1763년까지 영국이 잠시 장악한 때를 빼면 이 섬이 비교적 오래 스페인 손에 남아 있었다는 것입니다. 식민지 시대에 쿠바가 스페인 제국의 가장 중요한 지역 가운데 하나가 아니었고(예컨대 광물 매장량이 거의 없었습니다), 대개 대륙으로 가는 도중 기착지로 쓰였기 때문일 것입니다. 어쨌든 남아메리카와 중앙아메리카 국가 대다수가 19세기 첫 4반세기에 독립을 위해 싸웠을 때도 스페인은 1898년 이 섬의 통치를 미국에 넘길 때까지 쿠바를 붙들고 있었습니다."
"0xd4cd1025" = "오늘날 당연하게 여기는 많은 것이 아메리카와의 무역을 통해 처음 유럽에 들어왔다는 것은 잘 알려져 있습니다. 그러나 문화 교류는 반대 방향으로도 이루어졌습니다.<n><n> 예를 들어 북아메리카 평원의 전형적인 원주민을 떠올리면, 스페인과 포르투갈인이 오기 전에 아메리카에 말이 없었다는 것이 잘 상상되지 않습니다. 많은 원주민이 말과 기수를 처음 보았을 때 두 존재가 하나로 붙어 자란 기이한 짐승이라 여겨 맹목적인 공포에 사로잡혀 달아났습니다.<n><n>흔히 브라질이나 과테말라 같은 나라와 떠올리는 커피는 아메리카 원산이 아니며, 이곳에 오기 전에 이미 세 대륙을 거쳤습니다. 아프리카(아마 에티오피아)에서 아랍 국가들을 거쳐 남서유럽에 도착했습니다. 이 식물이 아메리카에 처음 들어온 것은 18세기로, 그 음료의 인기가 높아져 재배를 늘려야 했기 때문입니다.<n><n>감자에서 유럽인은 카리브해에서 상상할 수 없이 값진 기본 식량을 발견했습니다. 반대로 밀은 스페인인과 영국인이 오기 전까지 아메리카에 없었습니다. 이들은 각각 1520년 멕시코에, 1777년 버지니아에 밀을 가져왔습니다. 처음에는 아메리카 기후가 밀 재배에 맞지 않는다고 여겼지만, 특히 북아메리카에서 이 작물이 가장 놀라운 성공을 거두었습니다. 오늘날 밀은 세계에서 재배 면적이 가장 큰 농작물입니다."
"0xd4cd1026" = "초콜릿 없는 삶을 상상할 수 있으십니까? 그렇게 상상해야 마땅합니다. 아메리카가 발견되기 전까지 카카오는 세계 다른 곳에 알려지지 않았기 때문입니다. 카카오라는 말은 아마 마야어에서 나왔고, 그 흔적을 처음 찾을 수 있는 곳도 마야어입니다. 그리스도 탄생 400년 전에 마야 상인들이 카카오를 마시고 있었다는 것은 거의 확실해 보입니다.<n><n>14세기 이래 중앙아메리카 대륙의 지배 세력이었던 아즈텍은 카카오에 종교적 의미까지 부여했습니다. 이 진미를 처음 접한 유럽인은 다시 한 번 크리스토퍼 콜럼버스였는데, 그것은 1502년 니카라과로 이끈 뒤의 항해에서였습니다.<n><n>그러나 카카오의 진짜 「발견자」는 아즈텍 왕국을 정복한 에르난 코르테스입니다. 그는 「소코아틀」(「초콜릿」이라는 말의 뿌리)이라 불린 음료의 조리법을 스페인으로 가져왔습니다. 처음에는 유럽인의 입에 너무 쓰게 느껴졌고, 설탕이나 바닐라를 넣기 시작한 뒤에야 뜨거운 초콜릿이 이베리아 상류층의 인기 음료가 되었습니다.<n><n>스페인은 그 조리법을 거의 백 년 동안 남에게 알리지 않았고, 그 뒤 뜨거운 초콜릿은 프랑스와 나머지 유럽으로 퍼졌습니다. 1700년 무렵 영국인이 우유를 더했습니다. 유럽에서 카카오가 완전히 자리를 잡은 것은 커피와 카카오를 함께 마시면 얼마나 맛있는지가 알려지면서였습니다."
"0xd4cd1027" = "해적 이야기를 할 때 현실과 전설을 구분하기 어려울 때가 있지만, 여성 해적이 있었다는 것은 다툼의 여지가 없습니다. 가장 눈부신 두 인물이 18세기 초 자메이카 섬에서 이 길로 나섰습니다.<n><n>앤 보니는 어린 나이에 배에 칼을 맞았다고 하며, 뱃사람과 함께 해적들의 안식처 뉴프로비던스(나소)로 달아났습니다. 그곳에서 그녀는 남편을 없애고 나포한 네덜란드 배에서 자기 경력을 시작했습니다. <n><n>그곳에서 그녀는 메리 리드를 만났습니다. 메리는 이미 남자로 변장하고 스페인 왕위 계승 전쟁에 참전했고, 상대를 죽이기 전에 가슴을 드러내 보여 자기들이 여자에게 졌음을 알게 했다고 합니다.<n><n>1720년 붙잡힌 뒤 그녀들이 교수대를 면한 이유는 임신 중이었기 때문입니다. 그녀들은 남자 동료 대부분보다 나은 처지였고, 앤 보니는 그들을 조소할 수밖에 없었습니다.<n><n>교수대로 끌려가던 악명 높은 「칼리코 잭」에게 그녀가 한 말은 이렇습니다. 「잭, 여기서 보니 안타깝습니다. 하지만 남자처럼 싸우기만 했어도 개처럼 목매달리려 여기 서 있지는 않았을 것입니다.」"
"0xd4cd1028" = "웨일스인 바솔로뮤 로버츠(1682년?–1722)는 가장 중요한 해적 가운데 한 사람일 뿐 아니라 몹시 이례적인 인물이기도 했습니다. 「검은 바트」로도 알려진 그는(에드워드 티치라는 별명의 「검은 수염」과 혼동하지 마십시오) 37세에야 해적이 되었지만, 범죄의 길로 들어선 것은 분명히 순조로웠습니다. 그가 타고 있던 배는 1719년 같은 웨일스인 하월 데이비스의 공격을 받았는데, 사실 그 배는 노예 수송선이었습니다.<n><n>로버츠는 데이비스와 운명을 함께하기로 했고, 몇 주 뒤 데이비스가 살해되자 선장 자리를 이어받았습니다. 바솔로뮤 로버츠는 술을 멀리하고 차를 좋아했다고 합니다.<n><n>자기를 악마의 화신으로 내세운 티치와 달리 로버츠는 좋은 옷을 좋아했고 도박을 싫어했으며 부하들에게 기도하라고 고집했습니다. 그러나 그렇다고 로버츠가 속으로 경건한 사람이었다는 뜻은 아닙니다. 그가 수많은 약탈 과정에서, 특히 포로에게 저지른 잔혹 행위에 관한 이야기는 이루 헤아릴 수 없습니다. 400척이 넘는 배를 노획하고 브라질에서 뉴펀들랜드와 서아프리카까지 활동 무대를 넓힌 그는 헨리 모건과 함께 중앙아메리카에서 가장 성공한 해적 가운데 한 사람이었습니다. <n><n>1722년 기니 연안 앞바다에서 영국 군함이 쏘아 댄 대포 소리는 그의 경력이 끝나고 일곱 바다의 가장 큰 위협 가운데 하나가 사라졌음을 알렸습니다."
"0xd4cd1090" = "17세기 가장 유명한 버커니어는 웨일스인 헨리 모건(1635-1688)으로, 서인도 제도의 스페인 식민지를 괴롭혀 이 지역에서 이베리아 강국의 권위를 뿌리째 흔들었습니다.<n><n>그의 삶은 영국·네덜란드·프랑스 정책 뒤에 도사린 다소 불온한 도덕을 잘 보여 줍니다. 이들은 해적 행위가 다른 강국에 타격을 주기만 한다면 눈감아 주기를 몹시 좋아했습니다.<n><n>1668년 버커니어 배의 지휘를 맡은 헨리 모건은 남아메리카 북부 해안에서 처음 횡포를 부리기 시작했습니다. 거의 2,000명을 지휘한 그는 1670년 8월 방비가 두터운 파나마 마을을 함락한 뒤 돌아오는 항해에서 노획물 대부분을 챙겨 달아났습니다. 그러나 스페인과 잉글랜드가 강화 조약을 맺은 뒤에 공격이 이루어졌기에 그는 체포되어 런던에서 재판을 받았습니다.<n><n>모건은 유죄 판결을 받지 않았습니다. 오히려 그 반대였습니다. 얼마 지나지 않아 외교의 바람이 다시 방향을 바꾸었기 때문입니다. 모건은 사면받았을 뿐 아니라 기사 작위까지 받았습니다. 헨리 경으로서 그는 자메이카의 새 총독에 임명되어 엄격한 법과 질서를 세웠고, 부유하고 존경받는 농장주로서 여생을 보냈습니다."
"0xd4cd1091" = "17세기 중엽 잠시 잉글랜드의 종교적 반대자들의 피난처가 되었던 바하마 제도는 1670년부터 앨버말 백작과, 이익을 보려고 찰스 2세에게서 이 제도에 대한 소유권을 넘겨받은 다른 신사들의 공식 지배 아래에 있었습니다.<n><n>그러나 약속과 달리 이들은 질서 있는 행정 체제를 세우는 데 거의 관심이 없었습니다. 오히려 그 반대였습니다. 카리브해 다른 곳과 마찬가지로 바하마, 특히 나소 마을이 자리한 뉴프로비던스 섬에는 해적 무리가 자리 잡았습니다. <n><n>무거운 군함이 들어올 수 없는 얕은 만은 수백 척의 슬루프와 해적 바크에 더없이 좋은 정박지였습니다. 스페인 해역에서 잦은 습격이 보복을 불렀고, 초대 총독 존 웬트워스는 이 섬들에 다시 법과 질서를 세우는 달갑지 않은 임무를 맡았습니다.<n><n>사정이 나아질 기미가 없자 잉글랜드의 조지 1세는 바하마를 다시 거두어 왕실 직할 식민지로 만들었습니다. 전직 버커니어이자 세계 일주 항해자였던 우즈 로저스가 1718년 중엽 초대 왕실 총독으로 임명되었습니다.<n><n>그는 당근과 채찍을 함께 쓰는 방식으로 그전까지 이어진 혼란을 끝냈습니다. 맹세하고 해적 행위를 그만두겠다는 모든 해적에게 일반 사면을 내걸었습니다. 그러지 않으려는 이들에게는 이를 드러낸 함대라는 벌이 기다리고 있었습니다.<n><n>이렇게 정상 상태가 회복된 뒤 이 제도는 1729년 자체 의회를 갖게 되었고, 그 뒤 백 년 동안 침공으로 인한 가끔의 소요를 빼면 바하마의 역사는 비교적 평온했습니다."
"0xd4cd1092" = "새로 얻은 식민지 거의 어디에서나 스페인은 출세의 기회가 거의 없는 경직된 사회 제도를 세웠습니다. 위계의 가장 꼭대기에는 유럽에서 태어난 같은 나라 사람들이 있었습니다.<n><n> 식민지에서 태어난 스페인인은 크리오요라 불렸습니다. 이들은 위계에서 이차적인 중요성만 인정받았지만 국가와 교회, 군대의 하급 직위 대부분을 차지했습니다.<n><n>따라서 유럽 혈통의 스페인인과 크리오요가 식민지의 엘리트 계급을 이루었습니다. 백인(주로 남자)과 원주민이 혼인해 태어난 자녀는 메스티소라 불렸습니다. 원래 그 땅의 주인이었던 원주민은 사회의 맨 아래 자리에 있었고, 유럽인이 그들을 완전히 몰살한 지역에서는 그 자리를 흑인 노예가 대신했습니다.<n><n>이 계급들이 인구에서 차지한 비율은 스페인 제국의 지역마다 크게 달랐습니다. 예를 들어 멕시코에서는 메스티소가 인구의 가장 큰 부분을 이루었습니다. 여러 섬에서는 흑인 노예가 수적으로 우세했습니다(그리고 주인의 손아귀에 있었습니다). 원주민 부족도 정글과 늪, 산악 지대가 안전한 피난처가 된 지역, 예컨대 볼리비아나 플로리다에서 살아남았습니다."
