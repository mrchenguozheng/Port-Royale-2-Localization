"0xcb2b0709" = "큰일입니다! 오늘 @F$WifeName$을 만나러 가셨습니까? 수고할 필요 없습니다, 그녀는 떠났습니다. 보십시오, 작별 편지를 하나 찾았습니다. 지루한 삶에 지쳤고 모험가와 함께 도망쳤다고 썼습니다. 내 사랑하는 딸을 구해 주십시오!"
