"0x2ee8bb8c" = "We are in the governor town of Cartagena in the Southern Caribbean.<n>You can enter the various buildings in a town and perform various actions, more about this later on.<n>First, look at the top of the screen. You can see a range of buttons and displays.<n>Now click on the button with the clock, to the very left of the screen."
"0x2ee8bb8d" = "This is the Chronicle. It contains a record of all the events and occurrences in the Caribbean, rather like a daily newspaper.<n>There are some buttons to right of the Chronicle window. You can use these to display information about the Caribbean. However, this is not important for the moment.<n>Now close the Chronicle by clicking on the button marked \"X\"."
"0x2ee8bb8e" = "At the top of the screen, beside the date, is the Log button and next to it, your cash.<n>The log keeps you up-to-date with any information concerning your successes and possessions. In addition, all the messages and missions that you receive are saved here.<n>Open the log. "
"0x2ee8bb8f" = "As you can see, the log immediately displays all the messages that you have received so far. At the moment, the log only displays the instructions for this scenario.<n>There are more buttons to the right of the Log window. Click on the third button. "
"0x2ee8bb90" = "This displays the tasks and missions that you have received. At the moment, only the scenario objective is displayed.<n>Using the two buttons at the very top of the Mission window, you can switch between current and completed missions.<n>Now close the log. You can also do this simply by right-clicking."
"0x2ee8bb91" = "Later on in the game, you can accept numerous missions in order to achieve fame and fortune.<n>First, let's take a look at the town. As you can see from the display at the top center of your screen, we are in Cartagena. The town has roughly 2,000 inhabitants.<n>Click on the button showing the name of the town."
"0x2ee8bb92" = "This opens a window that displays information about the town.<n>Cartagena is a governor town and belongs to Spain. You can also see the status of the town and the goods that can be produced there.<n>Now enter a building. To do this, close the town information display."
"0x2ee8bb93" = "You can use the arrow keys on your keyboard to move around the town view. Now take a look at the town center within the town walls. It contains buildings, such as the docks, the church and the governor's palace.<n>Click once on any of these buildings."
"0x2ee8bb94" = "The display at the bottom center of your screen changes when you click on a building. Depending on the type of building, you now receive information or you can do certain things.<n>There are buttons to the right of the building display. To leave the building, click on the button marked \"X\"."
"0x2ee8bb95" = "The buildings in which you can perform various actions are always located within the town walls. Your warehouse is an exception, and there will be more about this in the next scenario.<n>Now leave the building and use the arrow keys to display the harbor and the convoy named “Santa Maria”. Click on it."
"0x2ee8bbfd" = "As you can see, information on your convoy now appears in the bottom center of your screen.<n>The convoy has already loaded goods: 10 barrels of wheat and 15 barrels of corn.<n>There are several buttons to the right of the convoy display. Click on the second button (the one with the ship icon)."
"0x2ee8bbfe" = "This displays the number of ships in the convoy. A convoy can have up to 10 ships led by a captain.<n>Now let's send the convoy to another town.<n>Click on the button with the arrow in the top-right of your screen to leave the town and display the sea chart."
"0x2ee8bbff" = "The sea chart now appears. In the center of the screen, you will see the town of Cartagena.<n>You can use the arrow buttons to shift the area of the map that is displayed and view the entire game world.<n>Now look for the town of Port Royale on an island to the north and right-click on the town with your convoy selected."
"0x2ee8bc00" = "A route is plotted and your convoy sets off.<n>By right-clicking on Port Royale, you have selected it as your convoy's destination.<n>If the convoy is taking too long to reach the town, you can simply fast-forward the game by pressing the space bar (default setting). "
"0x2ef566b4" = "키보드"
"0x2ef8f665" = "%1에 오신 것을 환영합니다,<n><n>%2 주변에서 길을 더 빨리 찾을 수 있도록 조언을 몇 마디 드리겠습니다. 그러면 당신도 우리 나라가 이 도시와 다른 도시들을 키워 나가는 일을 도울 수 있을 것입니다.<n>총독 도시에 관한 기본 정보는 이미 알고 계실 것입니다. 이런 도시에는 유럽으로 수출할 식민지 물자가 끊임없이 필요합니다. 동시에 이런 도시는 보통 갖가지 사치품을 내놓는데, 다른 도시에 팔면 큰 이익을 얻을 수 있습니다.<n>한 가지 더 말씀드리지요. 총독이 때때로 임무를 맡긴다는 점이 흥미로우실 것입니다. 다만 견습 선원 계급에 오르기 전에는 임무를 받을 수 없습니다.<n><n>%3 %4, %5의 총독"
"0x2efebfdd" = "Since your convoy has arrived in Port Royale, you may now enter in the town. Just click on the town symbol (with the small houses)."
"0x2efebfde" = "You now see the familiar town view again, but this time it's of Port Royale. You can move through any town in which you have convoys or buildings.<n>Look for the shipyard in the harbor and click on it, because we want to buy a new ship."
"0x2efebfdf" = "The shipyard is now displayed in the selection window where the convoy was just displayed.<n>Have a look around the shipyard by clicking on the buttons to the right of the shipyard display.<n>Then return to the display \"Buy Ship\" and have a look at the ships that are available.<n>Buy any ship you want."
"0x2efebfe0" = "Congratulations! You have bought your first ship.<n>The ship will be delivered to the town's harbor.<n>Now leave the shipyard and click on the waters in the harbor. The selection window now displays the individual ships in the harbor.<n>Click on your new ship."
"0x2efebfe1" = "This displays the ship’s data, which you already saw in the shipyard.<n>Before you can do anything with an individual ship, you must add it to a convoy.<n>To do this, select your convoy again."
"0x2efebfe2" = "You now want to tell your convoy to interact with the harbor.<n>Right-click on the harbor.  "
"0x2efebfe3" = "A Transfer window opens, in which you can add individual ships to the convoy.<n>To do this, click on the single ship on the left and drag it to the convoy, so that the convoy consists of two ships.<n>Then close the Transfer window again using the \"X\" button on the right."
"0x2efebfe4" = "You can also assemble another convoy with a new ship by hiring a new captain at the inn.<n>However, you cannot do this at the moment because your rank is not high enough.<n>Now select the convoy’s list of ships. This is the second button."
"0x2efebfe5" = "You now have a convoy with two ships in the harbor of Port Royale.<n>You can click on the ships in the convoy’s ships list to find out details about the ships.<n>Now send the convoy back to your home town of Cartagena. To do this, go to the sea chart by clicking on the button with the arrow in the extreme top-right of your screen. "
"0x2efebfe6" = "Now find the town of Cartagena in the south and send your convoy there by right-clicking on the town.<n>This scenario will end as soon as the convoy arrives at the town."
