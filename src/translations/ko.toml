"0xcb8dd6d9" = "우리의 적 @n$HostileNation$은 무슨 짓이든 합니다. 내 아내가 납치되었고 석방 조건이 붙었습니다. 하지만 그녀가 어디 갇혀 있는지 나는 알고 있습니다. 공식적으로는 아무것도 할 수 없습니다, 이해하시겠지만, 당신이 그 도시를 공격해 아내를 데려올 수는 있습니다."
