"0xfda277f4" = "%1에는 이제 창고를 지을 자리가 없습니다. 그래도 이 도시에 발판을 마련하고 싶다면, 현지 무역상 하나를 설득해 그의 사업체 가운데 하나를 철거하게 할 수 있습니다.<n><n>사업체는 그곳에서 생산되는 상품의 가격이 오랜 기간 낮게 유지될 때, 즉 상품이 남아돌 때 철거됩니다. 그러려면 먼저 그 물품을 사재기해야 합니다. 그다음 도시 시장에서 충분한 양을 팔아 가격을 낮은 수준까지 끌어내리십시오.<n><n>생산된 상품은 하루에 한 번 도시 시장으로 넘어갑니다. 가격이 현재 최저라면 사업체는 일꾼 수를 줄입니다. 사업체를 클릭하면 이를 확인할 수 있습니다. 일꾼 30명이 감원되면 사업체가 철거됩니다."
