"0x084340c7" = "이 도전적인 시나리오는 도시의 무역과 생산, 물자 공급을 다룹니다.<n:25>토르투가에서는 이상한 일이 벌어지고 있습니다. 도시를 찾으려는 상인이 거의 없고, 여러 사건이 시민들의 삶을 힘들게 만들고 있습니다. 당신의 임무는 도시를 몰락에서 구하는 것입니다. 시나리오가 끝나면 점수가 표시됩니다. 점수는 당신의 속도와 시나리오가 끝날 때의 재산에 따라 정해집니다.<n:25>이 시나리오에서는 자유 모드의 모든 기능을 쓸 수 있지만, 달성해야 하는 고유의 목표도 있습니다."
