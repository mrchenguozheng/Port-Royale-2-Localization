"0xc558e134" = "가능한 한 많은 상인이 당신의 도시를 찾게 하려면, 특정 물품을 도시에 공급하지 않으면 됩니다. 이상적으로는 인근 도시에서 생산되는 물품을 고르는 것이 좋습니다. 상인들은 이동 거리를 고려하기 때문입니다.<n><n>도시를 찾은 상인은 도시에 넉넉하게 있고 따라서 가격이 낮은 물품을 자동으로 사들입니다. 생산한 물품을 자기 도시에 직접 팔아도 됩니다. 다른 도시보다 비싸지 않다면 상인들이 꾸준히 사 갑니다.<n><n>이 방식의 장점은 시민에게 항상 충분한 물품이 있고, 물품을 다른 도시로 운송할 걱정도 하지 않아도 된다는 점입니다."
