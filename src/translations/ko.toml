"0x171746e9" = "그대는 오래도록 충실히 내 나라를 섬겼으니, 이제 그 충성에 보답해야겠소. 그대가 자기 마을을 세울 수 있는 땅 한 구획을 주겠소."
"0x17328849" = "불명"
"0x1733ed83" = "이 시나리오에서 스페인 부왕은 당신에게 땅을 주어 자기 도시를 세우게 합니다. 목표는 당신의 도시 경제가 번성하기 시작하도록 만드는 것입니다.<n:25>다만 땅을 받기 전에, 부왕을 위해 도시들을 함락시켜 스페인에서의 평판을 높이고 부왕의 총애를 얻어야 합니다."
