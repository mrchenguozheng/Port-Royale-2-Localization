"0x35f48f6c" = "[riddle:answer=Corpus Christi;group=35f48f6c,35f48f74,35f48f75;clue=황량한,버림받은;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 4`&authored]그대가 찾는 도시는 황량한 곳, 세상 모든 것에서 멀리 떨어져 버림받은 듯한 곳이라네."
"0x35f48f6d" = "[riddle:answer=New Orleans;group=35f48f6d;clue=강물,곶;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 15*`&authored]들에서 흘러온 강물이 곶에서 갈라지네. 그곳에 살고 싶은 도시 하나 있도다."
"0x35f48f6e" = "[riddle:answer=Pensacola;group=35f48f6e;clue=네 도시,세 번째,동쪽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 9`&authored]한 만에 네 도시가 나란히 있네. 동쪽으로 항해하면 세 번째 도시에 닻을 내리리."
"0x35f48f6f" = "[riddle:answer=Fort Caroline;group=35f48f6f,35f48f71;clue=북쪽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 17`&authored]가장 북쪽 도시는 아닐세. 더 북쪽으로 가면 다른 도시가 하나 보일 뿐."
"0x35f48f70" = "[riddle:answer=St. Augustine;group=35f48f70,35f48f72,35f48f73;clue=pun:아우구스티누스,북쪽;level=town;certainty=certain;source=original-en&authored]거룩한 아우구스티누스가 이제 북쪽으로 향하네. 오래지 않아 그를 성안에서 만나리."
