"0xf8b3a303" = "마을 상태는 가난에서 부유까지 일곱 단계로 나아갈 수 있습니다. 가장 낮은 두 단계에서는 삶의 질이 너무 나빠 주민들이 마을을 떠납니다. 반대로 마을이 ‘번영하는 경제’, ‘부유’, ‘대부호’ 단계에 이르면 당신의 사업체가 효율 보너스를 받고 인력도 더 값싸게 쓸 수 있습니다. 가장 높은 단계에서는 마을이 스스로 정착민까지 내놓습니다.<n><n>각 상태 단계의 효과는 마을 정보에서 더 자세히 볼 수 있습니다. 마을 이름을 클릭하면 나타납니다.<n><n> 물건 군별로 두세 가지를 충분히 대 주면 마을의 삶의 질이 좋아집니다. 어떤 물건의 공급이 충분하다는 것은 마을 인구가 열흘을 버틸 양이 있다는 뜻입니다.<n><n>참고: 마을 상태는 하룻밤에 좋아지지 않습니다. 주민이 새 상황에 적응하는 데 시간이 걸립니다."
"0xf8bacb9a" = "여관"
"0xf8cc0545" = "판매된 상품"
"0xf8e13932" = "@T$TargetTown$에 물자를 대고 남는 물건을 사들이십시오. @D$EndDate$에 마을 상태가 ‘호황’이어야 하고, 현지 상인들의 사업체가 모두 최대 가동 중이어야 합니다."
"0xf8e13933" = "@T$TargetTown$에 물자를 대고 남는 물건을 사들이십시오. @D$EndDate$에 마을 상태가 ‘번영하는 경제’여야 하고, 현지 상인들의 사업체가 모두 최대 가동 중이어야 합니다."
"0xf8e34639" = "축복"
"0xf8e8a610" = "군사 취약점"
"0xf8f68c2a" = "사업체"
"0xf90d7ea2" = "잉글랜드"
