"0xf4b68a6b" = "축하합니다! 시나리오를 성공적으로 마치고 네덜란드 이름으로 잉글랜드 마을 여럿을 점령했습니다.<n><n>자유 모드에서도 같은 방식으로 마을을 점령할 수 있습니다. 다만 점령하려는 마을의 나라가 군사적으로 약해야 하며, 그 마을을 대신 점령해 줄 나라는 군사적으로 강해야 하고, 두 나라가 전쟁 중이어야 한다는 점을 잊지 마십시오.<n><n>참고: 총독을 위해 마을을 점령하면 보통 직접 마을을 세울 수 있는 땅을 상으로 받습니다. 다만 이 시나리오에서는 그 기능이 꺼져 있습니다."
