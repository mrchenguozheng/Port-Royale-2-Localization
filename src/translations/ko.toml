"0xd9720472" = " @A$USER$, I've been left in the lurch here. But I urgently need to get to @T$TargetTown$. Can you bring me there? I will pay you @g$Reward$!"
"0xd9720473" = " @A$USER$, I'm looking for a ride to @T$TargetTown$. I would be most grateful if you would offer me a berth on one of your ships. I will pay you @g$Reward$."
"0xd979efd5" = "So be it. Please start building a hospital in @T$Town$ by @D$EndDate$."
"0xd99426c9" = "Would you like to chance a little card game with me?<n><n>Then choose your stake! I’ll match it, and the winner takes all."
"0xd99426ca" = "I don't even need to ask you if you'll join me in a game, you're as cleaned out as a freshly scrubbed deck! Come back when your pockets are full."
"0xd99426cb" = "Oh no, not you again! I can still remember our last game. Do you still not have enough? Well, I won't be playing with you for the time being."
"0xd99426cc" = "Everyone has been given 5 cards. I'll call %1 points.<n><n>If you want to play, you must call one point higher."
"0xd99426cd" = "Then I'm in. %1 are trumps.<n>Here is my first card."
"0xd99426ce" = "You lead. Tell me which color you want as the trump suit (choose a card)."
"0xd99426cf" = "So %1 are trumps.<n>Play your first card."
"0xd99426d0" = "You have won 1 point.<n>Choose your next card."
"0xd99426d1" = "I have won 1 point.<n>And here is my card."
"0xd9942739" = "내가 부른 점수에 미치지 못했어. 내가 졌네."
"0xd994273a" = "I have reached the number of points I called. You have lost."
"0xd994273b" = "You cannot reach the number of points you called. You have lost the game."
"0xd994273c" = "You have reached the number of points you called. You're home and dry!"
"0xd994273d" = "So, that's my last point. You've lost the game!"
"0xd994273e" = "Damn, I should have won that point. I've lost the game."
"0xd994273f" = "Well, the game went in my favor after all. I'm afraid you've lost."
"0xd9942740" = "You have the luck of the devil!<n>That was my last game, I'm broke."
"0xd9942741" = "You've taken all my gold. Order me a bottle of rum, and then please leave me alone to drown my sorrows."
"0xd9942742" = "Now you've done it! I won’t be able to show my face at home tonight."
"0xd99427aa" = "You have won the game!"
"0xd99427ab" = "Do you want to chance another game?"
