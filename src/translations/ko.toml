"0xdd3808a0" = "입문 시나리오<n><n>Port Royale 2에서는 건축 허가를 받은 도시라면 어디든 지을 수 있습니다. 게임을 시작하는 도시에서는 언제나 건축이 허용됩니다.<n:25>이 시나리오는 건설과 생산을 소개합니다. 당신의 임무는 상업용 건물과 주거용 건물 여러 채를 짓는 것입니다. 시나리오의 여러 단계에서 원료와 정착민, 일꾼을 구해야 합니다. "
