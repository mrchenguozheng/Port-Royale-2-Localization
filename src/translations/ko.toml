"0xe6490f96" = "1676년, 네덜란드 총독 도시인 [town:Turk Islands]입니다. 네덜란드는 일곱 도시를 가지고 있으며 그중 다섯은 식민 도시, 하나는 총독 도시, 하나는 부왕 도시입니다.<n><n>잉글랜드는 열네 도시를 가지고 있고, 오래전부터 네덜란드와 전쟁 중이며 앞으로 여러 달 더 전쟁이 이어질 것입니다. 이 전쟁이 계속되는 동안 당신은 네덜란드를 대신해 잉글랜드 왕실의 도시들을 함락시켜야 합니다.<n><n>다만 잉글랜드 도시를 공격하려면 자본과 선단의 무장이 더 필요합니다. 첫 목표는 잉글랜드 교역 선단 세 개를 격파하고 그 배들을 나포하는 것입니다.<n><n>그에 앞서 터크 제도의 네덜란드 총독에게서 잉글랜드에 대한 사략 허가서를 받아야 합니다.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>터크 제도의 총독을 방문하고 잉글랜드에 대한 사략 허가서를 받으십시오."
"0xe64f1385" = "아주 잘했습니다! 블랙비어드의 해적 선단 하나를 격파했습니다. 이제 @T$TOWN$의 총독에게 가서 상을 받으십시오.<n><n>그에게 당신이 해야 할 다른 임무도 있습니다.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@T$TOWN$의 총독을 위해 다른 임무를 하나 해내십시오."
"0xe65025c3" = "1개 도시"
"0xe6510ae7" = "@D$EndDate$까지 밀, 벽돌, 목화, 설탕, 담배의 비축량을 각각 @a$Amount$까지 늘려야 합니다."
"0xe65524e7" = "도시가 모든 상품을 @a$Amount$씩 갖추도록 하십시오."
"0xe674b971" = "보물 지도"
"0xe67d58b9" = "금 발견"
"0xe6851da5" = "지난 시나리오에서 당신의 계급이 총자산에 달려 있다는 것을 배웠습니다. 총자산에는 현금과 건물, 배, 물자가 모두 들어갑니다. 총자산은 언제든 기록의 ‘성과’ 항목에서 볼 수 있습니다.<n><n>화면 아래 선단 표시에 늘 있는 파란 경험치 막대도 볼 수 있습니다. 이 막대가 화면 오른쪽 끝에 닿으면 다음 계급으로 올라갑니다. 한 번 올라간 계급은 떨어지지 않습니다.<n><n>계급이 높을수록 지휘할 수 있는 선단이 많아지고, 나중에 사업을 일으킬 수 있는 마을도 그만큼 늘어납니다. 어느 계급에 오르면 선단 수와 건축 허가에 제한이 없어집니다."
"0xe6d65f53" = "주민"
"0xe6d9252d" = "%1, 아버지가 그렇게 많이 이야기하시던 바로 그 %2분이시군요. 저는 %3입니다. 저와 함께 앉아 당신의 모험담을 들려주지 않으시겠습니까?"
"0xe6d9252e" = "%1, 당신 이야기는 이미 들었습니다. 저는 총독의 딸 %3입니다. %2을(를) 한 번 만나 보고 싶었어요. 어서 당신의 모험 이야기를 들려주세요!"
"0xe6d9252f" = "그래서 당신이 그 유명한 %1, 바로 이분이군요! 이야기를 그렇게 많이 들어서 훨씬 키가 클 거라고 생각했는데요. 그래도 하나도 덜 흥미롭지 않아요! 이리 오셔서 모험 이야기를 들려주세요! 총독인 아버지가 당신 얘기를 워낙 많이 했거든요."
"0xe6d92530" = "%1,<n>다시 만나 정말 반갑습니다. 지난번 이후 어떻게 지내셨는지 말씀해 주세요. 저를 위한 것은 가져오셨습니까?"
"0xe6d92531" = "%1,<n>다시 만나 정말 기쁩니다. 지난번 만남 이후로 당신 생각을 멈춘 적이 없어요. 얼른 들어오세요, 드릴 이야기가 많습니다."
"0xe6d92532" = "%1,<n>다시 찾아 주셔서 정말 기쁩니다. 당신의 모험담을 친구들에게 모두 이야기해 두었어요. 이제 더 들려주셔야 해요, 아가씨들이 더 많은 이야기를 기다리고 있거든요. 얼른 들어오세요."
