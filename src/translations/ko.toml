"0xf64f1e5a" = "아시다시피 우리는 전쟁 중입니다. @n$TargetNation$의 경제를 약화시키려 합니다. 무역선 @I$NumShips$척을 나포하거나 침몰시키십시오. 이 임무를 맡으시겠습니까? "
"0xf64f1e5b" = "@n$TargetNation$와(과) 전쟁 중입니다. 그래서 정해진 수만큼 무역선을 침몰시키거나 나포해 주시기 바랍니다. 그 배에서 약탈한 것은 모두 당신 것이니, 저는 @n$TargetNation$의 경제를 약화시키는 일만 생각하겠습니다. 함께하시겠습니까?"
"0xf64f1e5c" = "@n$TargetNation$과의 전쟁에서 우리를 도와주실 수 있을지 궁금했습니다. 특정 해역으로 보내 그곳에서 배를 나포하거나 침몰시키는 임무를 맡기고 싶습니다. "
"0xf651cc3f" = "네덜란드와 잉글랜드가 평화를 맺었으므로 더 이상 마을을 점령할 수 없습니다.<n><n>이 시나리오에서 꽤 멀리 왔지만, 네덜란드 이름으로 충분한 마을을 점령할 시간이 없었습니다.<n><n>자유 모드에서도 같은 방식으로 마을을 점령할 수 있습니다. 다만 먼저 점령하려는 마을의 나라가 군사적으로 약해야 합니다. 게다가 그 마을을 점령하려는 나라는 군사적으로 강해야 하고, 두 나라가 서로 전쟁 중이어야 합니다.<n><n>참고: 총독을 위해 마을을 점령하면 직접 마을을 세울 땅을 상으로 받습니다. 다만 이 시나리오에서는 그 기능이 꺼져 있습니다."
"0xf65a5a04" = "이제 잉글랜드 배와 마을을 공격해 %1에서 평판을 올릴 수 있습니다. 다른 나라에서의 평판은 떨어지지 않습니다."
"0xf65b6f4c" = "오늘 스페인 버커니어 %1이(가) 잉글랜드 군사 선단과 마주쳐 전사했습니다."
"0xf65b6f4d" = "오늘 스페인 버커니어 %1이(가) 프랑스 군사 선단과 마주쳐 전사했습니다."
"0xf65b6f4e" = "오늘 스페인 버커니어 %1이(가) 네덜란드 군사 선단과 마주쳐 전사했습니다."
"0xf662124e" = "해적 %1의 선단이 격파되었습니다."
"0xf669f78e" = "스페인 보물선단이 %1에 계류했습니다"
"0xf67158d8" = "자유 모드"
"0xf680e197" = "%1이(가) 시장에서 기다리고 있습니다."
"0xf6957b90" = "항구 내 선박"
"0xf69c4221" = "%1 공격"
"0xf6a84efd" = "1570년, 우리는 카리브해에 있습니다. 당신의 목표는 하찮은 상인에서 영향력 있는 사업가로 성장하는 것입니다. 그 지위에 이르도록 물자를 운송하고 교역하고 건설하며 정치와 해적질에도 나설 수 있습니다.<n><n>이어지는 시나리오는 게임을 하는 기본을 가르쳐 줍니다. 다른 시나리오와 마찬가지로 여러 가지 목표가 있습니다. 시나리오를 성공적으로 마치려면 모든 목표를 달성해야 합니다.<n><n>이제 닫기 버튼으로 이 창을 닫고 화면 왼쪽 아래의 이벤트 창을 보십시오.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>이벤트 창의 지시를 따르십시오."
"0xf6bb9f8c" = "가격"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "그래픽 카드"
"0xf6c77503" = "해적 %1의 은신처가 드러났습니다. 어떤 용감한 모험가가 나서서 그 은신처를 공격해 부수겠습니까?"
"0xf6ec5ddc" = "토르투가에서 이상한 일이 벌어지고 있습니다. 지난날 벌어진 여러 사건 때문에 도시에 발을 들이려는 상인이 거의 없습니다. 당신의 임무는 물자를 공급해 토르투가를 최대한 돕는 것입니다.<n><n>그러나 시작 자본이 그리 넉넉하지는 않습니다. 쓸 수 있는 현금은 @g$StartGold$입니다. 그래도 항구에는 잘 갖춘 교역 선단이 있고 물자도 얼마간 있습니다.<n><n>첫 목표는 현금을 @g$GoldGoal$까지 늘리는 것입니다. 이 일을 될 수 있는 대로 빨리 마치십시오. 다만 40일을 넘길 수는 없습니다.<n><n>한 가지 조언: 어떤 경우에도 배를 팔아서는 안 됩니다. 대신 돈을 빌릴 수는 있습니다.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@D$EndDate$까지 현금을 @g$GoldGoal$까지 늘리십시오."
"0xf70feddb" = "카르타헤나 항구로 돌아왔고, 당신의 선단 「산타 마리아」가 선택되어 있습니다.<n>보시다시피 선단에는 이미 물건이 좀 있습니다. 목화, 고기, 카카오입니다.<n>이제 항구의 부두를 찾아 클릭하십시오. 물건을 팔 생각이기 때문입니다."
"0xf70feddc" = "부두에서는 마을과 창고 사이, 마을과 선단 사이에서 모두 거래할 수 있습니다.<n>이제 마을에 어떤 물건이 있고 선단에 어떤 물건이 있는지 보입니다. 화살표로 사고팔 수 있습니다(값은 화살표에 표시됩니다).<n>이제 목화를 파십시오."
"0xf70feddd" = "목화를 조금 팔자 값이 내려간 것을 눈치채셨을 것입니다.<n>값은 마을의 수요와 공급이 정합니다.<n>물건을 팔면 수요가 채워져 값이 내려갑니다. 물건을 사면 값이 올라갑니다.<n>이제 밀을 @a$SubGoal$만큼 사십시오."
"0xf70fedde" = "밀 값이 방금 올라간 것이 보이십니까? <n>다만 값은 공급만이 아니라 마을에서의 당신 평판에도 달려 있습니다.<n>무역 창 오른쪽 아래에 있는 건물 버튼을 클릭하십시오."
"0xf70feddf" = "이제 창고와 마을 사이에서 거래할 수 있습니다.<n>물건 생산을 시작하려는 마을마다 먼저 창고를 지어야 합니다. 시작 마을에는 늘 창고가 이미 있습니다.<n>이제 창고에 있는 물건을 모두 파십시오."
"0xf70fede0" = "무역 창 맨 위에 1, 10, 100이 적힌 버튼 세 개가 있어, 많은 양의 물건을 더 빨리 거래할 수 있습니다. 10 버튼을 클릭해 값이 어떻게 바뀌는지 보십시오.<n>물건 하나를 10번 사는 것과 10개를 한 번에 사는 것은 다르지 않습니다. 총값은 늘 같습니다. 이제 럼주를 @a$SubGoal$만큼 사십시오."
"0xf70fede1" = "무역 메뉴 맨 오른쪽 열에는 당신이 산 물건의 평균 값이 표시됩니다. 이익을 남기고 팔려면 값을 더 높게 쳐 주는 마을을 찾아야 합니다.<n>이제 오른쪽 아래 네 번째 버튼(기중기 그림)을 클릭해 배와 창고 사이의 이전 창을 여십시오."
"0xf70fede2" = "이 창에서는 선단과 창고 사이에서 물건을 옮길 수 있습니다. 이제 창고에 남은 물건을 선단에 싣고 다른 마을에서 팔려고 합니다.<n>그런 다음 오른쪽 아래 ‘X’ 버튼을 클릭해 무역 창을 닫으십시오."
"0xf70fede3" = "이제 해도로 넘어가 선단과 함께 산타 마르타로 가십시오. 산타 마르타로 들어가지는 말고, 선단이 마을에 닿는 순간 마을을 오른쪽 클릭하십시오. "
"0xf70fede4" = "그러면 산타 마르타의 무역 창이 열립니다.<n>따라서 마을에 들어가지 않고도 그곳에서 거래할 수 있습니다.<n>이제 선단에 실린 물건을 모두 파십시오.<n>그런 다음 무역 창을 닫으십시오."
"0xf7110875" = "정말로 저장된 게임을 삭제하시겠습니까?"
"0xf725f22c" = "이제 선단이 산타 마르타에 있습니다. 마을 이름을 클릭하면 마을 정보가 나타납니다.<n>해도에서도, 마을에 들어가서도 할 수 있습니다."
"0xf725f22d" = "마을 정보에는 그 마을에서 생산되는 물건이 나옵니다.<n><n>스페인과의 관계도 표시됩니다. 이 관계는 우호적입니다! 그래서 이 마을에서 가장 좋은 값을 받게 됩니다.<n><n>이제 이 창을 닫고 마을을 둘러보십시오."
"0xf725f22e" = "이제 화면 왼쪽 마을 이름 아래 주민 아이콘을 클릭해 산타 마르타의 재고를 보십시오."
"0xf725f22f" = "여기에는 창고에 있는 물건의 양과 마을에서 소비되는 양이 나옵니다. 소비량은 당연히 마을 인구에 달려 있습니다.<n>이 소비량을 보면 규칙적으로 얼마나 대 줄 수 있는지 알 수 있습니다. 이제 재고 창을 닫으십시오."
"0xf725f230" = "이제 이익이 나는 거래를 해 보십시오.<n>무역 창을 열어 이 마을에서 생산되는 목화, 설탕, 카카오를 선단에 실을 수 있는 만큼 사십시오.<n>그런 다음 카르타헤나로 돌아가 그 물건들을 이익을 남겨 파십시오."
"0xf725f231" = "거래 요령이 담긴 쪽지 두 통을 방금 받았습니다.<n>기록을 열어 읽어 보십시오.<n>"
"0xf725f232" = "평균 값보다 비싸게 팔 수 있는 만큼 팔고 새 물건을 사십시오. <n>참고: 마을에 모자란 물건은 값이 빨갛게 표시됩니다. 그런 물건은 늘 좋은 값을 받습니다.<n>"
"0xf725f233" = "카르타헤나 같은 총독 관할 마을은 유럽에서 수입 물건을 받습니다.<n>이것은 보통 산타 마르타, 마라카이보, 지브롤터 같은 식민지 마을에 이익을 남겨 팔 수 있습니다.<n>이제 잠시 혼자 거래해 보십시오.<n>목표는 거래로 현금 @g$GoldGoal$을(를) 버는 것입니다."
"0xf7346191" = "%1에서 온 무역상"
"0xf73619d7" = "해적 은신처가 알려졌다"
"0xf7370c4b" = "%1,<n>차라리 다른 사람을 만나고 싶은 마음입니다. 논의할 일이 있습니까? 꼭 그래야 한다면 들어오십시오."
"0xf73bf67d" = "카르타헤나의 마을 화면으로 가십시오.<n>보통 마을에 들어가려면 항구에 선단이 정박해 있어야 합니다. 하지만 카르타헤나에는 창고가 있으므로 언제든 이 마을에 들어갈 수 있습니다.<n>카르타헤나의 조선소를 클릭하십시오."
"0xf73bf67e" = "조선소에서 작은 배 한 척을 사십시오. 거래와 배 유지에 쓸 돈을 남겨 두어야 하니 너무 많이 쓰지는 마십시오."
"0xf73bf67f" = "지난 시나리오에서는 항구를 오른쪽 클릭해 선단에 배를 더하는 법을 배웠습니다.<n>이번에는 여관에서 선장을 고용해 새 선단을 꾸리십시오.<n>여관(마을 한가운데에 있습니다)을 찾아 클릭하십시오."
"0xf73bf680" = "선장은 늘 여관에서 만날 수 있습니다. 마을에 머무는 선장이 있으면 여관 메뉴의 세 번째 버튼으로 알 수 있습니다.<n>항구에 다른 배나 선단이 있으면, 그 선장에게 어디에 배치될지 정확히 알려 주어야 합니다.<n>새 배의 선장을 맡기라고 지정하십시오."
"0xf73bf681" = "축하합니다! 첫 선단을 꾸렸습니다! 다음 과제는 재산을 @g$GoldGoal$까지 늘리는 것입니다. 재산은 기록의 ‘성과’에서 언제든 확인할 수 있습니다.<n><n>행운을 빕니다!"
