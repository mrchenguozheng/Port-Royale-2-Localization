"0xcdf0b22a" = "며칠 전 우리 도시 하나에서 시민이 전염병으로 죽었습니다. 숨기려 했지만 소식이 새어 나간 것 같습니다. 이제 많은 상인이 그 도시에 기항하지 않기로 했습니다. 훌륭한 교역 선단을 가지고 계시니, 당분간 그 도시에 물품을 공급해 주시겠습니까?"
