"0x2a78ce83" = "%1 (%2)"
"0x2a7f7e17" = "So be it. I hereby task you with attacking trading convoys belonging to @n$TargetNation$ and capturing or sinking @I$NumShips$ ships. You therefore only have until @D$EndDate$."
"0x2a7f7e18" = "I am delighted. I regret that I cannot allow you much time. You must accomplish this mission by @D$EndDate$.   Attack trading convoys belonging to @n$TargetNation$ and sink or capture @I$NumShips$ ships.   "
"0x2a8476a8" = "Production in town"
"0x2a8b96d0" = "Your troops break down the town gate and storm into the town. When the town's soldiers see this, they capitulate and your men begin looking for the treasure chamber without meeting any resistance. They loot %1. "
"0x2a9a8ab5" = "Last sea battle 1 day ago"
"0x2aa014d9" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
"0x2aaa4eed" = "You have no convoy in the town."
"0x2ac46b90" = "Error"
"0x2ad0de32" = "in the harbor"
"0x2ae68b1b" = "It gives me great satisfaction to hear that you have put Blackbeard in his place. As a reward, I am making you the gift of a Spanish galleon. It is awaiting you in the harbor. <n><n>And, while I’m at it, I might as well give you @g$Reward$."
"0x2ae68b1c" = "I am once again very satisfied to hear about your renewed defeat of the contemptible Blackbeard. I must also pass on my wife’s very special regards. She wishes to make you a gift of her Spanish galleon, and I don’t mean our cook!<n><n>In addition, I am rewarding you with @g$Reward$."
"0x2b0bca45" = "The ship carrying the spy set sail from @T$HostileTown$ in the direction of Europe and will leave the Caribbean in the east. Search the route for several documents and bring them to the Governor of @T$TOWN$ by @D$EndDate$."
