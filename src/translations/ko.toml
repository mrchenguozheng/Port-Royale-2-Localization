"0xf7534d8f" = "일꾼이 필요한 마을에 정착민을 실어다 주면, 정착민은 내릴 때 운임을 내고 고마워할 것입니다.<n><n>카카오 같은 식민지 물자를 생산하려면 늘 도구가 조금 필요합니다. 도구가 없으면 생산이 멈춥니다. 나중에 값과 수량에 대해 조금 더 알게 되면, 창고지기에게 마을에서 도구를 규칙적으로 사들이라고 지시할 수 있습니다. 다만 지금은 안전하게 직접 도구를 사 두십시오.<n><n>이것이 다음 과제입니다. 그러면 카카오 생산을 시작하는 데 아무 걸림돌도 없을 것입니다.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>카카오를 생산해 창고에 @a$AmountGoal$만큼 비축하십시오."
