"0xd5328f24" = "이 시나리오에서는 검은수염이라는 별명으로 알려진 악명 높은 해적 에드워드 티치를 추적해 처치해야 합니다. 아바나의 총독이 여러 가지 지시를 내리고 당신의 추적을 돕습니다.<n:25>이 시나리오에서는 자유 모드의 모든 기능을 쓸 수 있습니다. 다만 시나리오를 성공적으로 마치려면 수행해야 할 고유의 과제도 있습니다."
