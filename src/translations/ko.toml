"0xcff9644a" = "「외팔 해적」은 32장의 카드로 하는 운 게임입니다. 각자는 판돈을 걸고 5장씩 카드를 받으며, 상대는 그 카드를 볼 수 없습니다.<n><n>먼저 각자 자기가 딸 수 있다고 생각하는 점수를 선언합니다. 한 판을 이길 때마다 1점입니다. 더 높은 점수를 선언한 사람이 게임을 이끌며 으뜸패(트럼프)의 무늬를 정합니다. 그 사람은 이제 선언한 점수 이상을 따내야 합니다.<n><n>먼저 치는 사람이 카드를 내고, 상대는 같은 무늬의 카드를 낼 수 있으면 반드시 내야 합니다. 더 높은 카드를 낸 사람이 그 점을 가져갑니다.<n><n>같은 무늬를 낼 수 없으면 아무 카드나 버리거나 트럼프 카드를 내도 됩니다.<n><n>카드의 서열은 I, II, III, IV, 해적, 신부, 총독, 앵무새 순입니다. 트럼프 카드는 다른 모든 카드를 이깁니다.<n><n>점을 딴 사람이 다음 카드를 냅니다. 누군가 게임을 이길 때까지 이렇게 계속합니다.<n><n>선언한 사람이 그 점수를 따내면 게임을 이기고 판돈을 가져갑니다. 못 따내면 상대가 이깁니다."
