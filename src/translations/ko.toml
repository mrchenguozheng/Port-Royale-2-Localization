"0xfc3a99b8" = "선장 고용"
"0xfc3ac0b4" = "검은 수염의 은신처를 파괴했지만, 먼저 그의 선단을 모두 격침하지는 못했습니다."
"0xfc3fdd9b" = "토르투가의 인구를 회복하지 못했습니다.<n><n>도시의 상태가 「호황」 이상이 되면 새 일꾼을 고용할 수 있습니다. 정착민 가족의 형태로 도시에 새 일꾼을 보급할 수 있습니다. 이들은 유럽에서 총독이 있는 도시로 이동해 다른 도시로 갈 배를 기다립니다. 상태가 더 낮은 도시에서도 태워 갈 정착민을 찾을 수 있습니다."
