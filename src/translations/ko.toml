"0xf52fee2f" = "해적, 버커니어, 적국의 군사 선단과 싸우십시오.<n><n>버커니어가 되어 무역 선단을 사냥해 보십시오.<n><n>전설의 스페인 보물 선단을 찾아 나서십시오.<n><n>16가지 배를 지휘하십시오."
"0xf52fee30" = "다른 선장과 해적과의 결투에서 당신의 선장을 이끄십시오.<n><n>전투, 무역, 정치가 얽힌 수많은 임무를 해내십시오."
"0xf52fee31" = "건물 구성이 서로 다른 4개 나라의 마을을 찾아가 보십시오<n><n:10>다른 풍경을 지나며 다채로운 그래픽을 즐기십시오.<n><n:10>마음에 드는 나라를 위해 물자를 약탈하고 마을을 점령하십시오<n><n:10>직접 마을을 세우십시오<n><n:10>다른 상인에게서 사업체를 사서 물건을 독점하십시오<n><n:10><o:0xFFFFEB7D>…카리브해 전체를 휩쓸어 보십시오!"
