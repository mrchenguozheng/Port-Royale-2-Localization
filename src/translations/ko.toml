"0x386a053b" = "You have reached the highest rank!"
"0x386a3a7f" = " Look for him in the inns there. Believe me, you can take your time, but if you do happen to see him, send him my best regards and tell him he might like to remind my sister what he looks like!"
"0x386a3a80" = " I'm afraid I can't say when would be the best time to see him there. The best thing to do is just to look for him as often as possible in the inns there."
"0x386a3a81" = " No doubt you'll find him at an inn. But I'm sure he'll help you to find @N$TeacherName$."
