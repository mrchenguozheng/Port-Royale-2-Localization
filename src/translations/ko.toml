"0x007c2733" = "그렇다면 @D$EndDate$까지 @T$TargetTown$을(를) \"번영하는 경제\" 상태로 만드는 임무를 맡기겠네. 도시가 필요로 하는 물자를 가져다주고 남는 물자를 가져가게 해서, 현지 상인들이 다시 제대로 생산을 시작하도록 하게. "
