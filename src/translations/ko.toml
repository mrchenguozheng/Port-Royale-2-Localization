"0x35f49131" = "[riddle:answer=east;group=35f49131;clue=셋,동쪽;level=direction;certainty=certain;source=original-en&authored]큰 만에 도시 몇이 있으니 셋이로다. X는 그중 가장 동쪽을 가리키네."
"0x35f49132" = "[riddle:answer=Providence;group=35f49132,35f49133;clue=요람,북쪽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9&authored]이곳에 섬 하나가 누워 있네, 마치 요람 속처럼. 북쪽에서 온 땅이 비스듬히 휘어 감싸네."
"0x35f49133" = "[riddle:copy=0x35f49132]"
"0x35f49134" = "[riddle:answer=Cartagena;group=35f49134;clue=서쪽,다리;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 16*`&authored]그대는 서쪽에서 왔네, 다리 하나를 건넜지. X가 있는 도시는 조금만 더 가면 있네."
"0x35f49135" = "[riddle:answer=Gibraltar;group=35f49135;clue=만,절벽;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 14*`&authored]오, 놀라운 곳이로다. 만 속에 아늑히 자리했네. 높이 솟은 절벽이 지켜 주니, 여기가 X라네!"
