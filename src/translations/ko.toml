"0x00bff5f3" = "이제 [town:Cartagena]에서 건축 허가를 받았으니 그곳에 사업체를 세울 수 있습니다. 다음 목표는 [town:Cartagena]에 제직 공장 두 곳을 짓는 것입니다. 제직 공장은 면을 원료로 삼아 완제품을 만드는 사업체입니다.<n><n>창고에 원료를 늘 비축해 두어야 합니다. 그렇지 않으면 사업체가 물자를 생산하지 못합니다. 그래도 비용은 계속 나갑니다. 사업체마다 유지비를 내고 일꾼에게 품삯을 주어야 하기 때문입니다.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>시나리오 목표<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>[town:Cartagena]에 제직 공장 두 곳을 짓고 직물을 @a$AmountGoal$만큼 생산하십시오."
