"0x21117682" = "<n><n>보통은 취득한 건축 허가를 반납할 수 있습니다. 하지만 이번에는 안 됩니다. %1이(가) 게임을 시작한 마을이기 때문입니다."
"0x21117683" = "<n><n>허가를 반납하시겠습니까?<n>그 대가로는 아무것도 드릴 수 없다는 점을 기억하십시오!"
