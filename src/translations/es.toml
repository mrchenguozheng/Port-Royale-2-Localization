"0x35353f8f" = "Saquea la ciudad de @T$TargetTown$, que pertenece a @n$HostileNation$, y libera a la mujer del gobernador antes del @D$EndDate$."
"0x35353f90" = "Cuqui, el cursi caniche del gobernador de @T$TOWN$, permanece secuestrado en @T$TargetTown$. Saquea la ciudad y rescata al perro antes del @D$EndDate$."
"0x35353f91" = "Ataca la ciudad de @T$TargetTown$ perteneciente a @n$HostileNation$, antes del @D$EndDate$ y libera a la hija del gobernador."
"0x35392fbd" = "¡Enhorabuena! Has superado tu primera campaña. Ahora ya sabes cómo seleccionar y ampliar convoyes y cómo enviarlos a otras ciudades. También has aprendido a entrar en los edificios de una ciudad para realizar diversas acciones, como por ejemplo, comprar un nuevo barco.<n><n>En la siguiente campaña aprenderás la manera de hacer dinero para mantener y expandir tu imperio personal."
"0x353a3e45" = "Bibliotecas 2D y herramientas de pantalla"
"0x353cae5f" = "…a los numerosos participantes del foro de [town:Port Royale], cuyas ideas y sugerencias hicieron posible la segunda parte de [town:Port Royale].<n>...a los probadores beta de [town:Port Royale] 2, que mostraron un compromiso incansable con el proyecto durante la prueba beta abierta. Nicole Jeannette Pescher, Don Geraldo y BMP, por los logotipos que enviaron."
"0x35450579" = "He estado estudiando los nuevos objetos que has traído; tienen marcas y grabados que según sospecho forman una pista hacia un lugar en concreto. %1 Pero todavía no estoy segura. Espero que encuentres más objetos; de ese modo podré indicarte el lugar con mayor precisión."
"0x3545057e" = "He descubierto algo más sobre los objetos y el lugar en cuestión, y hay algo que puedo decir sin temor a equivocarme: %1. Lo que pueda haber allí no lo sé. Para ubicar la posición con mayor exactitud necesitaría más objetos."
"0x354505ea" = "Tengo buenas noticias: Gracias al último objeto que encontraste he podido establecer la posición exacta. Mira, te lo mostraré en la carta de navegación. %1<n>Pero ten cuidado, por favor, nadie sabe lo que puede haber allí."
