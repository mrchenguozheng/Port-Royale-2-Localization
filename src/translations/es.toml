"0xcdf0b227" = "Varios comerciantes han unido fuerzas y exigen una mayor protección en nuestras aguas. Para respaldar sus exigencias, han decidido dejar de abastecer pronto una de nuestras ciudades. ¿Puedes intervenir para ayudarme a mí y a los ciudadanos?"
"0xcdf0b228" = "Una de nuestras ciudades apenas ve ahora a un comerciante de un extremo al otro de la semana, porque se ha extendido el rumor de que una plaga ha azotado la ciudad. ¿Puedes ayudarme a acallar el rumor abasteciendo la ciudad con mercancías?"
"0xcdf0b229" = "La amenaza de una plaga se ha cernido sobre una de nuestras ciudades en las últimas semanas. Para colmo, ahora los comerciantes también evitan la ciudad. ¿Puedes ayudar a sostener la ciudad hasta que mejore la situación?"
"0xcdf0b22a" = "Un ciudadano murió de peste en una de nuestras ciudades hace unos días. Intentamos encubrirlo, pero me temo que la noticia se filtró. Ahora muchos comerciantes han decidido no recalar en la ciudad. Tienes una buena flota comercial. ¿No podrías abastecer la ciudad durante un tiempo?"
