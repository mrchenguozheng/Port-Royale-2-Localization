"0x0adb3fdd" = "Sabía que podía confiar en ti. El asunto atañe a la ciudad de @T$TargetTown$, que pertenece a @n$HostileNation$. Ataca la ciudad y, por lo que a mí respecta, sáqueala y luego busca a mi mujer. No tardes mucho, porque solo me han dado hasta el @D$EndDate$ para considerar sus condiciones.<n><n>Si todavía no posees una Patente de Corso contra @n$HostileNation$, yo te daré una."
"0x0adb3fde" = "Mi mujer se alegrará muchísimo. Cuqui, el caniche, está escondido en @T$TargetTown$. Saquea la ciudad de manera que parezca una misión militar y luego ponte a buscar al perro. Tienes hasta @D$EndDate$.<n>Créeme que a mí no me causará el menor placer volver a ver al condenado chucho, pero si no, mi mujer no cesará de lloriquear.<n><n>Si todavía no posees una Patente de Corso contra @n$HostileNation$, yo te daré una."
"0x0adb3fdf" = "Acordado entonces. Saquea @T$TargetTown$ y regresa con mi hija. Su cumpleaños es el @D$EndDate$ y en ocasión tal, ella debe estar de vuelta.<n><n>Si todavía no posees una Patente de Corso contra @n$HostileNation$, yo te daré una."
