"0x0f52782d" = "¡Enhorabuena! Ahora puedes producir tela a partir de algodón en [ref:Cartagena].<n><n>Como puedes imaginar, los costes de producir tela dependen en gran medida del precio que pagas por el algodón. Por eso solo puedes producir mercancías acabadas si tienes la seguridad de poder comprar las materias primas a un precio razonable. Como alternativa, puedes producir tú mismo las materias primas.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construye una instalación de producción de algodón en Santa Marta y comercia hasta aumentar tu efectivo a @g$GoldGoal$."
"0x0f5d7735" = "Muy al este de [ref:Charleston] se encuentran las islas Bermudas. ¡Mantente bien lejos de ellas! Hace dos meses, mi cuñado zarpó hacia allí para explorarlas, pero nunca regresó. Nadie sabe qué ocurre allí, pero una cosa es segura: ¡un destino terrible aguarda a todos los que se atreven a navegar demasiado cerca de esas islas!"
"0x0f5d7736" = "¿Has oído la última historia sobre las islas Bermudas? Un comerciante quiso usar la ruta que pasa por las islas para navegar a Europa, pero nunca llegó. Su hermano salió a buscarlo, pero no encontró más que unos restos de naufragio al sur de las islas."
"0x0f5d7737" = "Precisamente el otro día, un marinero de [ref:Port Royale] me contó que hace poco navegaron muy cerca de las islas Bermudas. Estuvieron a punto de acercarse demasiado, pues con sus propios ojos vio un enorme monstruo moverse en el agua. Escupía fuego y echaba humo por sus largas orejas. ¡Ay de quienes se atrevan a acercarse a este monstruo marino!"
