"0xe10e4380" = "Se te ha acabado el tiempo, pero no has alcanzado el objetivo final del escenario.<n><n>En el modo de juego libre, el virrey de cualquier nación puede regalarte tu propia ciudad. Pero no es tan fácil conseguirlo, porque siempre tienes que capturar ciudades para que se te conceda un terreno, y eso, naturalmente, dañará tu reputación ante las demás naciones. <n><n>Todo lo que hayas aprendido en este escenario sobre el desarrollo de tu ciudad te ayudará a desarrollar negocios en otras ciudades también. La principal diferencia es que no tendrás que preocuparte por defender esas ciudades."
"0xe10f2f85" = "Entonces espero hacer negocios contigo.<n>Entrega tanta @G$Goods$ como puedas en el mercado de @T$TOWN$. Yo también recibiré allí varias entregas y te pagaré @g$Price$ de inmediato.<n>El convoy expedicionario llegará aquí el @D$EndDate$. Garantiza a este convoy un paso seguro a Europa y te pagaré el resto del oro."
