"0xf64f1e5a" = "Como sabes, estamos en guerra. Para debilitar la economía de @n$TargetNation$, quiero que captures o hundas @I$NumShips$ barcos comerciales. ¿Aceptas esta misión? "
"0xf64f1e5b" = "Estamos en guerra con @n$TargetNation$. Por eso quiero que hundas o captures un número determinado de barcos comerciales. Todo lo que saquees de ellos es tuyo; lo único que me importa es debilitar la economía de @n$TargetNation$. ¿Puedo contar contigo?"
"0xf64f1e5c" = "Me preguntaba si podrías ayudarnos en nuestra guerra contra @n$TargetNation$. Me gustaría enviarte a una zona concreta y encargarte que captures o hundas barcos allí. "
"0xf651cc3f" = "Holanda e Inglaterra han hecho la paz, así que ya no puedes capturar más ciudades.<n><n>Llegaste bastante lejos en este escenario, pero no tuviste tiempo de capturar suficientes ciudades en nombre de Holanda.<n><n>Puedes capturar ciudades del mismo modo en el modo de juego libre. Sin embargo, primero debes asegurarte de que la nación cuyas ciudades quieres capturar sea militarmente débil. Además, la nación que quiere capturar esas ciudades debe ser militarmente fuerte y las dos naciones deben estar en guerra entre sí.<n><n>Nota: normalmente se te concede un terreno en el que puedes establecer tus propias ciudades siempre que captures ciudades para un virrey. Sin embargo, esta función está desactivada en este escenario."
"0xf65a5a04" = "Ahora puedes aumentar tu reputación en %1 atacando barcos y ciudades ingleses. Esto no reducirá tu reputación en las demás naciones."
