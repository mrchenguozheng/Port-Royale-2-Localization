"0xef9ba866" = "Robert Andreas Drude"
"0xefbbbbe9" = "Ahora es el momento de encontrar el escondite pirata de Barbanegra y poner fin a sus vilezas.  Cuando un pirata lleva un tiempo en libertad, será solo cuestión de tiempo hasta que se descubra su escondite. Pero usted también puede hacer algo para influir en ello: de vez en cuando, un convoy pirata regresa a su escondite para dejar el botín y hacer las reparaciones necesarias.<n>Si sigue a uno de estos convoyes piratas en la carta náutica y observa cómo se introduce en su escondite, es muy probable que descubra la ubicación del escondite. Una vez descubierto el escondite, puede destruirlo atacándolo desde el mar del mismo modo que ataca una ciudad.<n><n>Consejo:<n> @l$IslandPos$ Espere a que se acerque un convoy y obsérvelo mientras se introduce en su escondite.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Localice el escondite de Barbanegra."
"0xefc2e122" = "¿Todavía no me has devuelto mi barco? Por favor, amárralo en el puerto en cuanto lo encuentres y luego vuelve a verme."
