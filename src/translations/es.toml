"0xedad5b61" = "You didn't manage to increase the population of Tortuga to @I$Pop$ by no later than 20 days after the end of the plague. <n><n>As soon as a town's status reaches \"boom\" or higher, new workers can be hired. You can supply the town with new workers in the form of settler families. These travel from Europe to the governor towns, where they wait for a passage to other towns. You'll also find settlers waiting to be picked up in towns with a lower status."
"0xedc30aca" = "<ts:75><ts:150><ts:225><ts:300>Una plaga de ratas ha destruido alimentos en tus almacenes. Las plagas de ratas se producen con frecuencia si los comerciantes acumulan demasiada comida en sus almacenes.<n><n>Pérdidas:"
