"0xcde8b98e" = "mapa anterior"
"0xcdf0b227" = "Varios comerciantes han unido sus fuerzas y reclaman una mayor protección en nuestras aguas. Mis fuentes me han indicado que planean hacer presión interrumpiendo sus suministros a una de nuestras ciudades. ¿Puedes intervenir para ayudarnos a mí y a los ciudadanos?"
"0xcdf0b228" = "Una de nuestras ciudades está sufriendo una incómoda situación: Se ha extendido el rumor de que se ha producido un brote de peste en ella y los comerciantes la evitan como al demonio. ¿Puedes ayudarme a acallar los rumores suministrando productos a la ciudad?"
"0xcdf0b229" = "En las últimas semanas ha surgido la sombra amenazadora de la peste sobre una de nuestras ciudades. Para empeorar las cosas, los comerciantes han dado credibilidad a estos rumores y evitan la ciudad. ¿Puedes apoyar a la ciudad hasta que mejore la situación?"
"0xcdf0b22a" = "Hace unos días un ciudadano murió víctima de la peste en una de nuestras ciudades. Intentamos ocultarlo, pero me temo que la noticia se ha propagado. Ahora muchos comerciantes han decidido no venir a la ciudad. Tú posees una excelente flota comercial. ¿No podrías abastecer a la ciudad durante un tiempo?"
"0xcdfdf758" = "Tus buques de guerra han obligado a huir a los atacantes."
