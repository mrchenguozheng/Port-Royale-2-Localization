"0xea43addd" = "Se nos plantea una buena oportunidad: Una de las ciudades de @n$TargetNation$ desea alinearse con nuestra nación. Al parecer se halla continuamente sometida a varios conflictos de interés con su virrey. Quiero que apoyes a la ciudad hasta el momento en que decida cambiar su nacionalidad."
"0xea43adde" = "Ha surgido un problema con una ciudad de @n$TargetNation$. Hace ya mucho tiempo se firmó un acuerdo que disponía el traspaso pacífico de la ciudad a nuestra soberanía. Lamentablemente, @n$TargetNation$ ya no respeta el acuerdo. Quiero que apoyes a la ciudad hasta que se hayan resuelto las disputas."
"0xea43addf" = "Una ciudad de @n$TargetNation$ tiene serias disputas con su virrey. Conozco la causa de ello y estoy pensando en apoyar a la ciudad, para intentar que se rebele contra su nación y se declare bajo nuestra soberanía. Desearía que me ayudaras en esto."
