"0x31ed47e7" = "Un saboteador ha contaminado los suministros de alimentos en [ref:Tortuga]. Eso ha desencadenado de inmediato una hambruna en la ciudad.<n><n>Tu tarea es poner fin a esta hambruna lo antes posible.<n><n>Durante unas 2-3 semanas, debes asegurarte de que haya más mercancías disponibles que las que se consumen diariamente, en el mayor número posible de alimentos.<n><n>Consejo: entre los alimentos se incluyen el trigo, la fruta, el maíz y la carne.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La hambruna debe terminar antes del @D$EndDate$."
