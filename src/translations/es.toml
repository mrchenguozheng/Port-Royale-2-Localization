"0xe7bffbb6" = "Saboteadores extranjeros han destruido las existencias de la ciudad de Tortuga. El abastecimiento está gravemente amenazado y, con ello, la calidad de vida de los ciudadanos se ha visto deteriorada.<n><n>Tu objetivo consiste en dotar a la ciudad de reservas suficientes para que su situación económica pueda volver a mejorar.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La ciudad debe alcanzar una situación económica de \"en auge\" antes del @D$EndDate$."
