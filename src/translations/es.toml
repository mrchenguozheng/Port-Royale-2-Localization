"0x1b0a0b6d" = "You have reached the rank of “Sailor”. As of today, you must do something to maintain your high reputation with a nation.<n><n> You can improve your reputation with the nations by trading, donating to the church, organizing celebrations, destroying pirates as well as by accomplishing missions and Letters of Marque.<n><n>If your reputation with a nation does not improve, it diminishes by a very small amount every day. Note that the number of buildings you have built in the towns of a nation determines how low your reputation can become in this way.<n><n>Your reputation influences both the trading prices and the assignment of missions in the towns. If your reputation is low, you should also beware of military convoys!"
"0x1b33d8e6" = "¡Puede que se estén transportando productos desaprovechados!"
"0x1b407276" = "Producción"
"0x1b416d15" = "Bienes"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "El número de ciudadanos (la población menos el número de soldados) en Tortuga debe restablecerse a @I$Pop$ a más tardar el @D$EndDate$, para que todos los negocios tengan la plantilla completa de trabajadores."
"0x1b900424" = "Viajero"
"0x1ba04e6b" = "Un convoy militar de %1 ha sido destruido por barcos de %2."
"0x1ba7362a" = "Barcos militares de %1 han atacado un convoy comercial de %2."
"0x1bcad43f" = "Hoy, el bucanero %1 %2 ha entrado en la ciudad con nombre falso y ha sembrado un gran malestar entre los trabajadores. Ahora se niegan a trabajar durante dos semanas."
"0x1bccfb60" = "Precio total"
"0x1be1209e" = "Una nueva ciudad"
"0x1be7a5dc" = "Debes encontrar un paquete. @l$Pos$ Devuélvelo a @N$OwnerName$ en @T$TOWN$ antes de @D$EndDate$. "
"0x1bf425d5" = "Desgraciadamente, eres enemigo de la nación a la que pertenece la ciudad y por eso te has colado en el puerto."
"0x1c0b520a" = "No hay partidas guardadas"
"0x1c1160cb" = "Dirección técnica"
