"0x226068b3" = "Convoy en mal estado"
"0x227ca1f5" = "<f:fonts/Tiepolo_black13x13aaFHk.res>Proteger el puerto de la ciudad<n><f:fonts/Tiepolo_bold13x13aaFHk.res>(el convoy está en el puerto y hay un barco de escolta presente)"
"0x22a3b6d0" = "La caza del tesoro"
"0x22b99c70" = "¿Quieres demoler el almacén construido más recientemente?"
"0x22caa09f" = "%1. %2 %3"
"0x22e58881" = "Modo de ataque"
"0x22fffe32" = "Mi querido %1,<n>apenas puedo contener mi impaciencia. Por favor, corre al mercado y entrega las mercancías para la boda, para que podamos celebrar pronto el banquete."
"0x2310e7f4" = "Para mostrar el siguiente objetivo del escenario, debes cumplir tu misión de capturar las ciudades."
"0x2335f663" = "Gracias por devolverme el paquete. Aquí está tu recompensa de @g$Reward$."
"0x234d00d9" = "Hoy, el pirata %1 ha empezado a sembrar el caos en el Caribe."
"0x23652698" = "Desgraciadamente, no puedo decirte nada con certeza. Mi capitán de puerto me dio una descripción vaga del barco que pueden haber tomado. Un comerciante avistó este barco en el mar y me mostró el lugar. @l$Pos$ Registra esta zona; puede que encuentres una pista."
"0x23652699" = "La posición es @l$Pos$. Registra esta zona; puede que encuentres una pista. Por favor, tráeme a mi hija sana y salva."
"0x2365269a" = "La posición es @l$Pos$. Registra esta zona; quizá @F$WifeName$ intentaba decirnos algo cuando lo mencionó. Por favor, tráeme a mi hija sana y salva. Y si te cruzas con ese Casanova, dale saludos de mi parte."
"0x23815ece" = "¿Seguro que quieres salir de la partida actual y volver al menú principal?"
"0x2388c117" = "(las mercancías necesarias no se encuentran a bordo)"
"0x238c039b" = "Organizador de fiestas"
"0x239bed4a" = "No puedes añadir más de 10 barcos al convoy."
"0x23a8f980" = "Cargar / Guardar"
"0x23f0ed65" = "Estamos en guerra con @n$HostileNation$. Hace poco, uno de mis capitanes ideó una forma ingeniosa de desmoralizar a @n$HostileNation$. Propuso reunir un convoy militar formado por barcos de nuestro enemigo, para darle, por así decirlo, una cucharada de su propia medicina.<n>Parece que eres justo la persona adecuada para hacernos con esos barcos."
"0x23f0ed66" = "Como estamos de nuevo en guerra con @n$HostileNation$, quiero reunir un nuevo convoy para proteger mi ciudad. No tengo ningún deseo de esperar hasta que se me asigne un nuevo convoy militar desde Europa.<n>Por desgracia, mis recursos son actualmente muy limitados, así que se me ocurrió la idea de usar los barcos de nuestro enemigo. ¿Quieres ayudarme a capturar varios barcos del tipo @S$ShipType$?"
"0x23f33e8d" = "Convoy  "
