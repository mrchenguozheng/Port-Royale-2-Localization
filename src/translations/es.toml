"0x03ce7c8e" = "Objetivo del escenario"
"0x03d3dcd8" = "Mientras saqueabais la ciudad, tu tripulación descubrió también dónde se escondía la esposa del gobernador y «liberó» a la mujer. En ese momento estaba en la cocina.<n> «No me lleves de vuelta al gobernador de @T$TOWN$. Nunca lo amé, te lo juro».<n><n>¿Quieres llevarte a esta mujer y devolverla al gobernador a pesar de sus súplicas? "
"0x03d3dcd9" = "Mientras saqueáis la ciudad, tus hombres se topan con un jovencito que lleva un perro de raza. El chico te cuenta que el gobernador de @T$TOWN$ organizó él mismo el secuestro para deshacerse del perro. El capitán decide llevar a Michelle a bordo de su barco. Luego se pregunta si vale la pena devolver el perro al gobernador de @T$TOWN$.<n><n>¿Quieres arrojar el perro por la borda?"
"0x03d6dcdb" = "La caza del pirata"
"0x03dfeb8d" = "<c><o:0xFFFFE6A0>%1<n><o:0xFFEBF0A0>(ciudad del jugador)"
"0x03e1b0eb" = "¡Qué mala suerte! Necesito existencias regulares de mercancías coloniales para los convoyes de transporte procedentes de Europa, pero no tenemos las herramientas necesarias para producir esas mercancías. ¿No querrías ayudarme a abastecer de herramientas a una ciudad?"
"0x03e1b0ec" = "¡Cómo ha podido pasar! Las reservas de herramientas se han agotado en @T$DestTown$ y ahora la producción de mercancías coloniales está en peligro. ¿Me ayudarás a resolver este dilema?"
"0x03e1b0ed" = "A mi nación le faltan herramientas. Deberíamos conseguirlas de las otras naciones. ¿Qué opinas?"
"0x03e9fe1e" = "Misterio en [ref:Tortuga]"
"0x03efad5a" = "No hay mensajes"
"0x03efff11" = "¡Me has hecho muy feliz! Corre a ver a mi padre, estará encantado."
"0x03f2ddbd" = " @A$USER$, ven aquí y siéntate, tengo unos asuntos que tratar contigo.<n>Estoy intentando comprar @G$Goods$ para @n$HostileNation$. Como sabes, @n$Nation$ y @n$HostileNation$ están en guerra. De hecho, ahora importar @G$Goods$ desde @n$Nation$ es un delito punible en @n$HostileNation$, y por eso se están pagando buenos precios. Así que quería preguntarte si te interesaría dedicarte un poco al contrabando."
"0x03f2ddbe" = " @A$USER$, ¿te interesaría dedicarte un poco al contrabando? Vengo de parte de un comerciante de @T$TargetTown$. Debido a la guerra, actualmente no se puede transportar ninguna mercancía desde las ciudades de @n$Nation$ hasta @T$TargetTown$. El hombre que me envía está interesado en @G$Goods$. Te pagará @g$Price$ por cada barril que le entregues. ¿Qué me dices?"
"0x03fb5c67" = "Como consecuencia de tu persistente mala relación con %1, hoy se han confiscado %3 de tus negocios en %2."
"0x03fb5c68" = "<n>Te aconsejaría que visitaras a uno de mis gobernadores para mejorar tu relación con mi nación."
"0x03fb5c69" = "<n>Te aconsejaría que me visitaras para que podamos hablar de tu relación con mi nación."
"0x03fb5c6a" = "<n><n>%1, virrey de %2"
"0x04081363" = "Uno de mis rivales en @n$HostileNation$ ha robado mis diarios y ahora quiere enviarlos a Europa. Es vital que no lo consiga. Por suerte, pude sobornar al timonel del barco que lleva los diarios a Europa. Ahora necesito tu ayuda."
"0x04081364" = "Llevamos mucho tiempo siendo espiados por @n$HostileNation$. He descubierto que toda la información obtenida se ha registrado cuidadosamente y que ahora va a enviarse desde @T$HostileTown$ a Europa. Quiero que me ayudes a asegurarme de que estos documentos nunca salgan del Caribe."
"0x040bf5f1" = "Aceptar juego"
"0x04100fa0" = "%1: Ataque pirata."
"0x0420c2a2" = "<ts:20>Ya sabe cómo comprar y vender mercancías en la ventana de Comercio. Aquí tiene algunos consejos más:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>El precio mostrado en las flechas depende del tamaño de la unidad<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Da igual si compra o vende una mercancía 10 veces o si compra o vende 10 mercancías una sola vez. El precio total es el mismo.<n><n><g:INTEXT_AUSRUF_800x600.screen>Siempre se muestra un precio, aunque una mercancía no esté disponible. Se trata siempre del precio de una unidad de mercancía, independientemente del tamaño de unidad configurado.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>También puede comerciar haciendo clic en el símbolo de una mercancía. Al hacerlo aparece una pequeña ventana con una barra de desplazamiento. Puede usar esa barra para indicar cuántas mercancías quiere comprar o vender. A continuación se muestran de inmediato el precio unitario y el precio total."
"0x0424bb9a" = "Crónica"
"0x0436c531" = "¡Has encontrado un barco muy especial!<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Barco de vela impulsado por vapor<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>¡Jamás en tu vida habías visto un barco así! Parece moverse no solo gracias a las velas de sus dos mástiles, sino también gracias a un curioso mecanismo que utiliza vapor para accionar dos ruedas de paletas. Al parecer, eso permite que el barco siga avanzando incluso cuando no sopla ni una gota de viento."
"0x044bc6d2" = "Tu capitán ha ganado su combate de espadas contra %1. Tus hombres empiezan a buscar el tesoro pirata y encuentran %2.<n><n>Has destruido el escondite y has puesto fin al reinado del pirata %3. "
"0x044bc6d3" = "Tu capitán ha ganado su duelo a espada con %1. Tus hombres empiezan a buscar el tesoro pirata y encuentran %2. Aunque has destruido el escondite y has eliminado con éxito los peligros que suponía, hay indicios de que puede que no hayas destruido todos los barcos. Los barcos restantes podrían buscar un nuevo escondite."
