"0xf88d6ee5" = "Entrega cualquier cantidad de @G$Goods$ en el mercado de @T$TOWN$. Allí recibirás @g$Price$ por barril de inmediato. El @D$EndDate$, un convoy expedicionario recogerá las mercancías. Escolta el convoy hasta Europa y recibirás otros @g$Price$ por barril."
"0xf894bc2d" = "El convoy no puede zarpar porque algunos de tus barcos están en muy mal estado. Repara tu convoy en el astillero antes de volver a mandarlo al mar. Como alternativa, puedes sacar los barcos dañados del convoy y repararlos por separado."
"0xf89f542f" = " Has recibido <o:0xff1e1eff>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GOLD_800x600.screen>."
"0xf8af3810" = "No nos falta de nada."
"0xf8b3a303" = "El estado de una ciudad puede avanzar por siete niveles, de la pobreza a la riqueza. En los dos niveles más bajos, la calidad de vida es tan mala que los ciudadanos abandonan la ciudad con regularidad. En cambio, cuando una ciudad alcanza los niveles «Economía floreciente», «Riqueza» y «Opulencia», sus negocios reciben una bonificación de eficiencia y su mano de obra resulta más rentable. En el nivel más alto, la ciudad incluso produce sus propios colonos.<n><n>Encontrará más información sobre los efectos de cada nivel de estado en la información de la ciudad. Para mostrarla, haga clic en el nombre de la ciudad.<n><n> Un abastecimiento suficiente de dos o tres mercancías en cada grupo de mercancías garantiza una buena calidad de vida en su ciudad. El abastecimiento de una mercancía es suficiente si puede cubrir a la población de la ciudad durante diez días.<n><n>Nota: el estado de una ciudad no mejora de la noche a la mañana. Los ciudadanos tardan un tiempo en adaptarse a una nueva situación."
"0xf8bacb9a" = "Taberna"
"0xf8cc0545" = "Productos vendidos"
