"0x35f490c3" = "[riddle:answer=Providence;group=35f490c3,35f490c4;clue=norte;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9]Aquí yace una isla, como en una cuna. Una península del norte se curva en ángulo a su alrededor."
"0x35f490c4" = "[riddle:copy=0x35f490c3]"
"0x35f490c5" = "[riddle:answer=Santa Marta;group=35f490c5;clue=Blanca orilla,selva,solo ve el sol;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 23`]Blanca orilla junto a la selva, un riachuelo que nadie conoce. Aquí yaces bien oculta, en una bahía que solo ve el sol."
"0x35f490c6" = "[riddle:answer=Maracaibo;group=35f490c6;clue=estrecho,bahía,barcos;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 5`]Aquí está la ciudad, con vistas al estrecho. Protege la bahía, pues abunda en barcos."
"0x35f490c7" = "[riddle:answer=Caracas;group=35f490c7,35f49136;clue=naufragado,acantilado;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 7`]No lejos de la ciudad, al pie de un acantilado, yacen los maltrechos restos de un viejo barco naufragado."
"0x35f490c8" = "[riddle:answer=Port of Spain;group=35f490c8;clue=España,madera,ladrillos,trigo;level=town;certainty=certain;source=original-en]España estableció aquí un puerto en su día. Encontrarás madera y ladrillos, pero no hay trigo."
"0x35f49130" = "[riddle:copy=0x35f49052]"
"0x35f49131" = "[riddle:answer=east;group=35f49131;clue=tres,oriental;level=direction;certainty=certain;source=original-en]En una gran bahía hay varias ciudades, en total tres. X se refiere a la más oriental de ellas."
"0x35f49132" = "[riddle:answer=Providence;group=35f49132,35f49133;clue=norte;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9]Aquí yace una isla, como en una cuna. La tierra del norte se curva en ángulo a su alrededor."
"0x35f49133" = "[riddle:copy=0x35f49132]"
"0x35f49134" = "[riddle:answer=Cartagena;group=35f49134;clue=oeste;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 16*`]Vienes del oeste y cruzas el puente. La ciudad con la X está solo un poco más adelante."
"0x35f49135" = "[riddle:answer=Gibraltar;group=35f49135;clue=bahía,acantilados;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 14*`]¡Oh, qué lugar maravilloso! Enclavado en una bahía. Protegido por acantilados imponentes, este es X, lo digo yo."
"0x35f49136" = "[riddle:copy=0x35f490c7]"
"0x35f49137" = "[riddle:answer=southeast;group=35f49137;clue=sureste;level=direction;certainty=certain;source=original-en]Poderoso río que fluye muy profundo, hacia el este y hacia el pantano. Desde allí al sureste, a veces por tierra. Hasta la ciudad de la X, en el borde, al final."
