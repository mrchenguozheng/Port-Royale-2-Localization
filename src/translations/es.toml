"0x2ad0de32" = "en el puerto"
"0x2ae68b1b" = "Me llena de satisfacción saber que has puesto en su sitio a Barbanegra. Tengo para ti un galeón español como recompensa. Te está esperando en el puerto.<n><n>Y ya que estoy, creo que también mereces estos @g$Reward$."
"0x2ae68b1c" = "Parece increíble... Has vuelto a derrotar al abominable Barbanegra. Debo transmitirte también el especial agradecimiento de mi esposa. Desea hacerte entrega de su galeón español.<n><n>Creo, además, que te mereces una recompensa de @g$Reward$."
"0x2b0bca45" = "El barco en el que viaja el infiltrado zarpó de @T$HostileTown$ en dirección a Europa y dejará el Caribe por el este. Rastrea la ruta en busca de varios documentos y llévaselos al gobernador de @T$TOWN$ antes del @D$EndDate$."
