"0x0087e50b" = "+"
"0x00885bdb" = "¡Así se hace! ¡Ahora tienes tu propia ciudad! Tú eres el único que puede construir en ella.<n><n>La ciudad ya tiene algunos edificios, como la lonja, donde puedes comerciar, y tu palacio. El resto lo tienes que construir tú.<n><n>Navega con tu convoy rumbo a tu ciudad. Lleva toda la madera y ladrillos que puedas, necesitarás estos materiales para construir edificios.<n><n>Primero, construye un astillero para poder reparar tus barcos.<n><n>Ya sabes que es muy caro mantener a la tripulación de tus barcos escolta, por lo que tendrás que despedir a los marineros, dado que ya no los necesitas.<n>Esto puede provocar una caída de la moral, que solventarías bendiciendo el convoy en la iglesia.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visita tu nueva ciudad y construye un astillero."
