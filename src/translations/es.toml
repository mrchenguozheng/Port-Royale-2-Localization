"0xf52fee2f" = "Lucha contra piratas, bucaneros y convoyes militares de naciones enemigas.<n><n>Ponte a prueba cazando convoyes comerciales como bucanero.<n><n>Parte en busca de la legendaria flota de tesoros española.<n><n>Manda 16 tipos de barco diferentes."
"0xf52fee30" = "Guía a tu capitán en duelos con otros capitanes y piratas.<n><n>Cumple innumerables misiones de batallas, comercio y política."
"0xf52fee31" = "Visit towns in 4 different nations with different sets of buildings<n><n:10>Enjoy a rich variety of graphics as you move through different landscapes.<n><n:10>Loot and capture towns for your favorite nation<n><n:10>Build your own towns<n><n:10>Buy businesses from other traders and establish monopolies on goods<n><n:10><o:0xFFFFEB7D>...take the whole of the Caribbean by storm!"
