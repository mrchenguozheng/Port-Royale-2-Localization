"0x30a14cb4" = "No hay suficiente información"
"0x30a45770" = "¡Bienvenido!"
"0x30a8b565" = "Créditos"
"0x30bb44fc" = "¿No eres tú el famoso @A$USER$? Por favor ¿Podrías ayudarme? Me persigue un cazarrecompensas, uno de mis enemigos le puso tras mi pista. "
"0x30bb44fd" = "Por favor, coge un taburete, @A$USER$. Me llamo @N$OwnerName$ y tengo un asunto importante que discutir contigo. ¿Por dónde empiezo? Bien, tuve una discusión con mi mujer; me acusó de serle infiel. Es totalmente falso, pero eso no la impidió echarme de casa. Pero eso no es lo peor: Ha contratado a un cazarrecompensas, así que ni siquiera puedo entrar en la ciudad. Sospecho que sólo quiere librarse de mí y ha acudido a esta pantomima. ¿Puedes ayudarme?"
"0x30bb44fe" = "Pareces un tipo capaz de dirigir cualquier barco.<n>Tengo que viajar urgentemente a @T$Town$, para entregar unos documentos que incriminan a uno de los comerciantes locales de allí. Por desgracia, el comerciante se ha enterado y ahora intenta echarle mano a los documentos. ¿No podrías dar con la forma de llevarme a @T$Town$?"
