"0x273267f2" = "Oh, no me lo puedo creer. Unos borrachos han robado mi precioso barco. Lo llenaron de botellas de ron y se marcharon. ¿Puedes ayudarme a buscar mi barco?"
"0x273267f3" = "Debí imaginarlo. Mi hijo Boris, que no tiene cabeza, ha tomado prestado mi mejor barco. Ahora he descubierto que él y sus amigos han decidido irse de juerga. Sin duda han llenado la bodega de ron, y estoy seguro de que nunca volveré a ver mi barco. ¿Podrías recuperarlo por mí?"
"0x27344ff4" = "Muchas gracias por entregar a tiempo; el gobernador estará encantado. ¡El banquete de boda empieza hoy mismo!"
"0x273d7e0f" = "Todos tus marineros ya tienen la moral más alta posible."
