"0x1be1209e" = "Una nueva ciudad"
"0x1be7a5dc" = "Debes encontrar un paquete. @l$Pos$ Devuélveselo a @N$OwnerName$ en @T$TOWN$ antes del @D$EndDate$. "
"0x1bf425d5" = "Lamentablemente, eres considerado enemigo de la nación a la que pertenece esta ciudad y te ves obligado a colarte en el puerto sin ser advertido."
