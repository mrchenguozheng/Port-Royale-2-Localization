"0x19b399ce" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Cerrar diálogo/<n><t>Menú de opciones<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>Avance rápido <n><f:fonts/Tiepolo_black14x14aaFHk.res>Shift<f:fonts/Tiepolo_bold14x14aaFH.res><t>Centrar convoy<n><f:fonts/Tiepolo_black14x14aaFHk.res>Bloqueo mayúsculas <f:fonts/Tiepolo_bold14x14aaFH.res><t>Activar/desactivar centrado <n><f:fonts/Tiepolo_black14x14aaFHk.res>Teclas de flechas<f:fonts/Tiepolo_bold14x14aaFH.res><t>Mover<n><t>mostrar ventana<n><f:fonts/Tiepolo_black14x14aaFHk.res>CTRL + 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Guardar convoy<n><f:fonts/Tiepolo_black14x14aaFHk.res> 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Seleccionar convoy<n><f:fonts/Tiepolo_black14x14aaFHk.res> TAB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Siguiente convoy<n><f:fonts/Tiepolo_black14x14aaFHk.res>+ / -<f:fonts/Tiepolo_bold14x14aaFH.res><t>Velocidad de juego<n><f:fonts/Tiepolo_black14x14aaFHk.res>F5 <f:fonts/Tiepolo_bold14x14aaFH.res><t>Guardado rápido<n><t> (no disponible durante las batallas)"
