"0x080f2b29" = "<ts:20>Debería saber lo siguiente sobre las mercancías:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Hay cinco tipos distintos de mercancías: mercancías esenciales, materias primas, mercancías manufacturadas, mercancías coloniales y mercancías de importación<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Cada ciudad puede producir cinco mercancías<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Hay dos tipos de ciudad: ciudades coloniales y ciudades con gobernador o virrey<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Las ciudades con gobernador producen mercancías esenciales y mercancías manufacturadas. Además reciben entregas regulares de mercancías de importación desde Europa. Por eso estas ciudades son los mejores lugares para encontrar mercancías manufacturadas y mercancías de importación.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Las ciudades con gobernador necesitan materias primas para producir mercancías manufacturadas. También admiten mercancías coloniales. Estas se recogen de los convoyes de transporte procedentes de Europa.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Las ciudades coloniales producen mercancías esenciales, materias primas y mercancías coloniales. Cada mercancía colonial solo puede producirse en determinadas zonas del Caribe. El café, por ejemplo, solo está disponible en el sur y el oeste del Caribe.<n><n>Debería saber lo siguiente sobre los precios:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Cuanto mayor es la demanda de una mercancía y menor su oferta en una ciudad, más alto será el precio.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Cuanto mejor sea su reputación en una nación, más bajo será el precio al que podrá comprar mercancías en las ciudades pertenecientes a esa nación.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Solo debería comprar mercancías en las ciudades donde se producen.<n><n>La forma más rápida de conseguir dinero:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>comprar mercancías coloniales y materias primas en las ciudades coloniales<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>vender estas mercancías en las ciudades con gobernador y comprar allí productos manufacturados y mercancías de importación."
