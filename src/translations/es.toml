"0xd4cd0f3d" = "Henry Avery es el ejemplo perfecto del pirata de éxito. Capturó los barcos más ricos de su época, consiguió eludir a las autoridades y vivió lo suficiente para disfrutar de su riqueza.<n><n>Los primeros años de Avery están envueltos en el misterio. Sin embargo, sabemos que en junio de 1694 era oficial de un corsario llamado Charles, al que España había autorizado a capturar barcos de la colonia francesa de Martinica, en las Indias Occidentales. Un día lideró un motín y se hizo con el control del barco, tras lo cual la mayor parte de la tripulación se puso de su lado. El barco, un corsario rápido con 46 cañones e idóneo para el papel de nave pirata, fue rebautizado como Fancy. En 1695 consiguió llevar a cabo su mayor hazaña: el saqueo de la flota del tesoro indiana. En alianza con otros piratas, atacó una flota del tesoro indiana fuertemente armada y logró capturar dos barcos. Los barcos pertenecían al propio Gran Mogol y estaban cargados de tesoros inimaginables. <n><n>Tras sobornar al gobernador de las Bahamas para que ofreciera protección a los piratas, Avery pagó a la tripulación, que se dispersó por los cuatro rincones del mundo. Algunos fueron capturados en Inglaterra, pero Avery navegó hasta Irlanda, donde desapareció sin dejar rastro. Solo podemos suponer que siguió disfrutando de su riqueza en la clandestinidad."
"0xd4cd0f3e" = "Uno de los piratas más populares de todos los tiempos fue Edward Teach (muerto en 1718), alias Barbanegra, cuya seña de identidad, como su nombre indica, era su temible barba negra trenzada. Con una tripulación de 300 hombres, surcaba alta mar en su barco Queen Anne’s Revenge, un mercante neerlandés reconvertido, y no temía enfrentarse a los buques de guerra de la Royal Navy.<n><n>Durante un periodo de 18 meses, Teach, nacido en Bristol, sembró el caos, principalmente en la parte septentrional de las Indias Occidentales y a lo largo de la costa de Norteamérica. Siempre podía encontrar refugio en las Bahamas y en la empobrecida Carolina del Norte.<n><n>Otra razón por la que Barbanegra era tan famoso era que encajaba con el estereotipo del bucanero aterrador, sanguíneo y de mal carácter: al parecer, mutiló a su artillero Israel Hands disparándole dos veces, sin más motivo que recordar al resto de la tripulación quién mandaba.<n><n>Su última hora solo llegó en 1718, cuando el cazador de piratas Robert Maynard localizó su balandra. Pese a estar completamente ebrio, Teach luchó como un demonio y solo fue derrotado tras una encarnizada refriega. Murió en la batalla y la mayoría de los miembros supervivientes de su tripulación fueron ahorcados."
"0xd4cd0f3f" = "Quienes deseaban aumentar su riqueza en los primeros años de la Era de los Descubrimientos comprobaron que las plantaciones de azúcar desarrolladas desde principios del siglo XVI, principalmente en el Caribe, ofrecían excelentes oportunidades de inversión.<n><n>Estas inversiones rendían un beneficio medio del diez por ciento y, en los mejores casos (como en Barbados hacia 1650), ¡hasta un 50 por ciento! Naturalmente, estas plantaciones requerían enormes cantidades de trabajadores, así que se enviaron allí cientos de miles de esclavos desde África. Y es que para entonces el hombre blanco había casi exterminado por completo a la población indígena en muchos lugares. <n><n>Los propios europeos no podían soportar el clima y, además, se consideraban demasiado dignos para dedicarse a este tipo de trabajo de peón. Incluso los dueños de las plantaciones preferían vivir en Londres o Madrid y dejar que un par de sus secuaces organizaran el trabajo en las colonias. ¡En el siglo XVIII, la proporción de población negra en algunas islas había llegado al 90 por ciento!"
"0xd4cd0f40" = "El comercio del «oro negro» ya había comenzado a principios del siglo XVI. La fuente preferida de «mercancía» de los traficantes de esclavos era la costa de África Occidental que se extiende entre el río Senegal y lo que hoy se conoce como Camerún. No solo era una zona inmejorablemente situada desde el punto de vista del transporte, sino que además contaba con una infraestructura económica y sociopolítica estable. Eso significaba que los marineros no tenían que ir a cazar esclavos por su cuenta, sino que podían comprar a sus víctimas a los caciques locales o a otros traficantes de esclavos.<n><n>Los hombres jóvenes de entre 15 y 35 años eran especialmente codiciados, porque estaban destinados sobre todo al duro trabajo en las plantaciones. Aproximadamente uno de cada cinco esclavos ni siquiera sobrevivía a la travesía, que podía durar hasta seis semanas. Algunos morían a causa del trato bárbaro que les infligían sus amos, mientras que otros perecían por accidentes en el mar. Teniendo en cuenta esta elevada mortalidad, los traficantes procuraban que cada travesía resultara lo más rentable posible amontonando la mayor cantidad de esclavos en sus barcos. Durante semanas enteras, estas criaturas miserables yacían una junto a otra como sardinas en lata, encadenadas unas a otras, en la oscuridad y con apenas aire para respirar.<n><n>En esas condiciones, casi resulta increíble que alguno de ellos sobreviviera a estos viajes.  "
"0xd4cd0f41" = "Aunque no hubo esclavos blancos en Norteamérica y Centroamérica, sí abundaron los europeos que se encontraron trabajando en condiciones muy poco distintas de las de los esclavos.<n><n>Muchos jóvenes (sobre todo de las clases bajas sin instrucción) querían emigrar pero no tenían dinero para pagar la travesía. Por eso pedían prestado el dinero del pasaje, con el entendimiento de que luego saldarían la deuda trabajando durante cierto periodo en una plantación de azúcar (o en algo parecido). <n><n>Sin embargo, lo que parecía un acuerdo de lo más lógico tenía también una trampa: muchos dueños de plantaciones intentaban explotar a estos trabajadores por contrato todo lo posible durante su periodo de empleo. A ello se sumaba el clima caribeño, que a la mayoría de los europeos resultaba tan difícil de soportar.<n><n>Este sistema de «trabajo por contrato de servidumbre» se empleó también con frecuencia con convictos expulsados de sus países de origen. Los británicos lo usaron más tarde, sobre todo con los indios, a quienes obligaron a trabajar en las colonias africanas."
"0xd4cd0f42" = "A medida que florecían las colonias americanas, también lo hacía el comercio a través del Atlántico. Gran Bretaña, la nación marítima más poderosa desde tiempos de la reina Isabel, tenía un vivo interés en controlar el movimiento de mercancías, permitiendo así que la economía nacional participara de los beneficios del comercio.<n><n>Bajo el Lord Protector, Oliver Cromwell, la «Primera Ley de Navegación» de 1651 dispuso que solo se pudieran usar barcos ingleses para transportar mercancías desde las colonias a Europa. Esta medida iba dirigida principalmente contra el poder emergente de Holanda y beneficiaba a la flota mercante nacional.<n><n>En 1663, las disposiciones de esta ley se endurecieron aún más: los barcos coloniales que quisieran transportar mercancías a Europa tenían que hacer escala en puertos ingleses y pagar allí un peaje. Sin embargo, este intento de controlar el comercio entre las colonias pronto encalló. Como difícilmente cabía esperar que el ejército británico vigilara toda la costa, el resultado fue un floreciente contrabando. <n><n>Fue precisamente este conflicto permanente con la metrópoli en torno a las condiciones que regían la exportación e importación de mercancías el que, especialmente en las colonias norteamericanas, hizo que los colonos allí formaran una identidad propia y se convirtiera más tarde en una motivación importante del movimiento independentista."
"0xd4cd0f43" = "El comienzo de la era colonial trajo consigo numerosos problemas de salud, hasta entonces en gran medida desconocidos en travesías mucho más cortas, como las del Mediterráneo o a lo largo de la costa. Una travesía a las colonias del Caribe y Norteamérica duraba de uno a dos meses, o incluso más si el barco encontraba tormentas o periodos de calma. Las dificultades a superar no eran, pues, nada sorprendentes: el hedor de la ropa sucia y la escasa higiene personal, los alimentos contaminados y podridos, la falta de agua potable, las ratas a bordo, así como la tensión psicológica provocada por la monotonía y el encierro. El terrible espectro del escorbuto se cernía sobre todos los marineros: esta enfermedad, causada por la falta de vitaminas, se manifestaba con la caída del cabello y de los dientes y costó la vida a muchos marineros. Fue el circunnavegador James Cook (1728-1779) quien consiguió tratar por primera vez esta enfermedad. No solo insistió en que se mantuviera limpio el barco, sino que además proporcionó a su tripulación chucrut y fruta fresca. Quien desembarcaba también tenía que lidiar con enfermedades tropicales como la fiebre de aguas negras, una de las manifestaciones más peligrosas del paludismo: esta infección, cuyos síntomas incluyen la aceleración del pulso, fiebre, escalofríos y orina de color oscuro, era casi siempre mortal."
"0xd4cd0f44" = "Tras los muchos nombres que navegantes y cartógrafos tuvieron que idear para las nuevas extensiones de tierra, ríos y asentamientos hay anécdotas curiosas. Incluso el primer nombre que los exploradores europeos de la Era de los Descubrimientos pusieron en América cuenta su propia historia. Cristóbal Colón bautizó la isla en la que desembarcó el 12 de octubre de 1492 como Salvador, para dar gracias al Señor por haber protegido al convoy de enfermedades y tormentas durante el viaje de ida y, sobre todo, por haber impedido un motín que amenazaba con estallar, literalmente, en el último minuto antes de avistar tierra.<n><n>En los tiempos siguientes, los conquistadores españoles eligieron en su mayoría nombres de connotaciones religiosas, como «Nombre de Dios» o «Trinidad». En otros casos, la gente se inspiraba en la fecha o en sus observaciones del paisaje. Por ejemplo, unos marineros portugueses llamaron «Río de Enero» (Río de Janeiro) a una bahía de la costa brasileña que descubrieron el día de Año Nuevo de 1502, y el nombre de la ciudad de Montevideo remite a la presunta exclamación de Magallanes al ver por primera vez esa costa: «¡Monte vido eu!» («¡Veo un monte!»).<n><n>También era costumbre muy extendida que los exploradores pusieran a extensiones de tierra y ciudades el nombre de sus gobernantes, de su madre patria o de la ciudad de la que procedían. Esto no solo comunicaba al mundo exterior una clara declaración de posesión, sino que además creaba un vínculo con la patria incluso en estas tierras remotas.<n><n>Si todo fallaba, siempre se podía recurrir a los nombres de las lenguas indígenas (aunque, en la mayoría de los casos, eso no impidió que los colonizadores expulsaran o exterminaran después a los propios indígenas).<n><n>Hasta hoy persiste el mito de que, al preguntar James Cook cómo se llamaba aquel extraño marsupial, un aborigen australiano respondió «kangooroo» o «ganguru», lo que al parecer solo significaba «¿De qué estás hablando?». Aunque sea un mito, este tipo de malentendidos divertidos sin duda tuvo que darse. <n><n>Probablemente uno se sorprendería de cuántos nombres de ciudades, montes y ríos significan simplemente «¡buenos días!», «¿cómo dice?» o «¡déjame en paz!» ..."
"0xd4cd0f45" = "Surgido el imperio español repartido por todo el globo, se hizo necesario establecer autoridades coloniales con suficiente poder para ocuparse de los asuntos administrativos del día a día, así como de cualquier crisis que pudiera estallar repentinamente. Con ese fin, se confirió el título de virrey a los gobernadores más importantes de las colonias.<n><n>En la cúspide del imperio mundial había dos dignatarios de ese rango, en Nueva España (México) y en Perú. Los virreinatos de Nueva Granada y del Río de la Plata se añadieron durante el siglo XVIII.<n><n> Las obligaciones de un virrey, que desempeñaba junto (y a menudo en conflicto) con un consejo administrativo conocido como Audiencia, incluían las tareas normales de un cargo de gobierno: recaudar y cobrar impuestos, velar por que la población cumpliera la ley, organizar las defensas de la colonia, etc. También era responsable de proteger a la población indígena y del nombramiento de dignatarios eclesiásticos y seculares de menor rango.<n><n>Debido a la enorme importancia económica y política de sus posesiones de ultramar, la Corona siempre vigiló de cerca las actividades de sus virreyes. Se les prohibía dedicarse a actividades comerciales adicionales que les reportaran ingresos extra. Además, la rivalidad entre los virreyes solo servía para limitar mutuamente su poder."
"0xd4cd0f46" = "Ya es bien sabido que los conquistadores europeos siempre atendían el llamamiento de la plata y del oro. Sin embargo, casi más valiosas eran las especias. Difícilmente se puede imaginar lo insípida que debía de ser la dieta europea de la Edad Media si uno piensa en los peligros que la gente estaba dispuesta a afrontar con tal de conseguir un poco de pimienta o de nuez moscada.<n><n>En este sentido, el descubrimiento de América resultó extremadamente decepcionante al principio. La gente observó con interés los exóticos animales que Cristóbal Colón trajo consigo, se alegró de la ampliación de las posesiones de su país y de las muchas almas que imaginaba que se salvarían con la difusión del cristianismo allí. Sin embargo, las montañas de oro resultaron bastante más esquivas de lo prometido. Estos viajes solo empezaron a ser rentables diez o veinte años después, cuando una auténtica riada de plata americana comenzó a llegar a Europa. <n><n>En uno de esos viajes, Colón trajo un tesoro más preciado que todo el oro y la plata del mundo entero: el 4 de noviembre de 1492, los nativos le obsequiaron con lo que él describió como una manzana que sabía a castañas. En ese momento se convirtió en el primer europeo que comió una patata. La palabra india para esta planta era «batate» y perdura hoy en el inglés como «potato».<n><n>Muchas otras cosas que hoy damos por supuestas llegaron a Europa por primera vez con Colón y sus sucesores: el tabaco, el tomate, el maíz y la hamaca. O, como dirían los indígenas americanos: «hamaka» (de donde deriva la palabra inglesa)."
"0xd4cd0fae" = "Desde el momento en que se anunció, el descubrimiento del Nuevo Mundo encendió la imaginación del pueblo europeo. ¿Qué tipo de criaturas podrían habitar esos territorios inexplorados? Circulaban los rumores más increíbles: se decía que una isla rebosaba de caníbales y que la siguiente estaba llena de criaturas sin cabeza cuyo rostro se asomaba en el estómago.<n><n>El paisaje suramericano de la Patagonia significa más o menos «tierra de los pies grandes», mientras que el Amazonas debe su nombre a una horda de mujeres guerreras que, al parecer, recordaron a los exploradores las guerreras similares de la mitología griega.<n><n>Aunque algunos de estos rumores tenían una base real, otros se basaban en malentendidos e interpretaciones erróneas, o en historias que los propios indígenas simplemente habían oído en alguna parte.<n><n>Sin embargo, muchos de esos rumores eran sencillamente producto de la viva imaginación de la gente y, las más de las veces, la gente solo creía en ellos porque quería creer. Eso explicaría por qué generaciones enteras de conquistadores buscaron la legendaria Fuente de la Eterna Juventud, el Jardín del Edén y El Dorado, la ciudad de oro. Los indígenas los alentaron en sus creencias erróneas, asegurándoles una y otra vez que habían oído hablar de tal o cual lugar, cuando en realidad solo querían ganar tiempo para atraer a estos blancos codiciosos tierra adentro y cortarlos de sus barcos."
"0xd4cd0faf" = "Uno de los personajes más deslumbrantes de una lista de exploradores y conquistadores que incluía muchos otros personajes pintorescos fue el escritor y aventurero inglés sir Walter Raleigh (aprox. 1554-1618). Cobró protagonismo por primera vez en 1580, cuando derrotó una sublevación de rebeldes irlandeses que se oponían a la ocupación inglesa.<n><n>Se convirtió en favorito de la reina Isabel I y usó su influencia para financiar una expedición destinada a encontrar la legendaria ciudad de El Dorado en Sudamérica. Pese al fracaso total de varias expediciones, que no encontraron nada de valor, supo mantener el apoyo de sus inversores londinenses gracias a su singular capacidad de persuasión. Les hizo creer que el premio definitivo estaba siempre justo tras el siguiente estuario y que, por supuesto, no podía abandonar ahora.<n><n>Sin embargo, su crédito acabó agotándose. Demasiadas veces la gente había escuchado sus grandiosas promesas para descubrir después que eran pura palabrería. Raleigh acabó cayendo en desgracia ante Isabel. Su sucesor, Jacobo I, vio a este aventurero impetuoso como una amenaza para su política exterior más moderada y, nada más llegar al poder, lo mandó arrestar por motivos muy endebles y lo condenó a muerte. Su condena fue conmutada (¡ojo, no anulada!) y Raleigh fue encarcelado en la Torre de Londres.<n><n>Años más tarde, cuando el estado de las finanzas del país convenció al rey de que era necesario, este autorizó a sir Walter Raleigh a dirigir otra expedición a la Guayana. Era una situación absurda: ¡dar a un hombre condenado a muerte autoridad sobre la vida y la muerte de otros y enviarlo en busca de oro! Sin embargo, esta contradicción se resolvió relativamente pronto, pues Raleigh, para entonces consumido por la fiebre, vivió para ver su última expedición terminar en fracaso.<n><n>A su regreso a Inglaterra, el furioso rey decidió que la suspensión de la ejecución de Raleigh decretada en 1603 debía llegar a su fin. Sir Walter Raleigh fue ejecutado poco después.  "
"0xd4cd0fb0" = "Los primeros encuentros entre los habitantes nativos del Nuevo Mundo y los marineros blancos transcurrieron en general de forma pacífica. En muchos lugares, los europeos fueron recibidos como dioses. Aquí y allá esa impresión se basaba en viejos mitos, pero en la mayoría de los casos los indígenas simplemente quedaron impresionados por aquellos extranjeros altos y rubios que llegaban con armaduras relucientes sobre sus «casas de agua» (barcos).<n><n>Colón, Cortés y todos los demás exploradores se complacían en perpetuar esa ilusión, pero los indígenas pronto se enfrentaron a la brutal realidad: impulsados por su insaciable sed de oro, la «enfermedad española», como la llamaban los indígenas, los españoles maltrataron, esclavizaron y masacraron poblaciones enteras. La visión de caballos, hasta entonces desconocidos en América, y el estruendo de los cañones provocaban un pánico absoluto, y quienes sobrevivieron a la matanza pronto sucumbieron a la viruela, la gripe u otra enfermedad importada.<n><n>Intelectuales famosos como Gonzalo Oviedo o Juan de Sepúlveda intentaron justificar los crímenes cometidos por los europeos con argumentos racistas estremecedores que retrataban a la raza indígena americana como vil, ignorante e inferior.<n><n>Esos mismos hombres que mandaban quemar en la hoguera a científicos y brujas por sus creencias dominaban el arte de crear relatos escandalosos sobre las «costumbres bestiales» de los indígenas americanos: aunque las prácticas de la idolatría, el sacrificio humano y el canibalismo no eran en modo alguno imaginarias, a partir de entonces el hombre blanco las usó como justificación general para imponer a los indígenas las más brutales sanciones de todo tipo."
"0xd4cd0fb1" = "Como es sabido, la fase inicial de la colonización de América la llevaron a cabo España y Portugal. Más tarde se les unieron Holanda y, sobre todo, Inglaterra y Francia. Lo que es bastante menos conocido es que numerosas expediciones españolas nunca se habrían emprendido de no haber sido por sus poderosos financiadores alemanes.<n><n>Hacia el año 1500, la Alta Suabia y, en particular, Augsburgo se habían convertido en uno de los centros de comercio y finanzas más importantes de Europa. Desde allí, las familias de comerciantes Fugger y Welser ejercieron una poderosa influencia sobre la política mundial. Por ejemplo, fue su amplio apoyo financiero el que ayudó al rey Carlos de España a convertirse en emperador de Alemania en 1519. El rey Enrique VIII de Inglaterra y muchos de los papas se complacían en contar entre sus amigos a Jakob Fugger «el Rico».<n><n>Naturalmente, estos astutos comerciantes tenían sus propios motivos ocultos al prestar este tipo de apoyo. A cambio, esperaban que se les asignaran privilegios o permisos para participar en la minería real de plata. Los Welser incluso consiguieron hacerse temporalmente con parte de la costa norte de Venezuela, donde fundaron ciudades como «Nueva Augsburgo» y desde donde enviaron varias expediciones en busca de tesoros tierra adentro (en su mayoría infructuosas)."
"0xd4cd0fb2" = "Al conquistar medio mundo, la Corona española se encontró en disposición de aprovechar oportunidades únicas. A lo largo de varios siglos, hasta la desaparición de las grandes culturas americanas de los incas, mayas y aztecas y el descubrimiento de enormes yacimientos de plata en Perú y México, como muy tarde, la posición de España parecía inexpugnable. Casi parece absurdo que fuera precisamente esta riqueza inmensa la que precipitara la decadencia de esta potencia mundial.<n><n>Una gran parte de los tesoros enviados en barco de vuelta a España fue a parar directamente a los bolsillos de aquellos comerciantes al norte de los Pirineos que habían financiado los viajes en primer lugar. Sin embargo, el resto seguía siendo suficiente para disparar los precios en la península ibérica. Allí la gente empezó a vivir por encima de sus posibilidades: en una época en la que se consideraba más importante poder mantener corte a lo grande que equilibrar el presupuesto del Estado, se prestaba poca atención a las triviales preocupaciones financieras.<n><n>Las mercancías se importaban en cantidades cada vez mayores a bordo de barcos extranjeros, porque la gente se había vuelto demasiado refinada para producirlas en casa. Incluso el equipo y los víveres de las expediciones a América rara vez los proporcionaban los comerciantes nacionales. La gente comentaba con orgullo: toda Europa está a las órdenes de España.<n><n>Sin embargo, el flujo de plata tenía que agotarse tarde o temprano, y el duro despertar que siguió se parecería a la resaca tras una larga noche de juerga: los neerlandeses y los británicos intentaban expulsar a España de alta mar. Numerosas guerras religiosas contra los «heréticos» protestantes y contra los turcos habían devorado sumas enormes de dinero, y el vasto imperio en el que nunca se ponía el sol se había convertido en un colosso ingobernable.<n><n> La crisis fue evidente para todos en el año 1557, cuando el nuevo gobernante español, Felipe II, se vio obligado a declarar por primera vez la bancarrota del Estado. El gran imperio, que había reunido más tesoros que cualquier imperio anterior, estaba quebrado."
"0xd4cd0fb3" = "¿Por qué se habla portugués en Brasil, cuando casi en todas las demás partes de Sudamérica se habla español?<n><n>Pues tanto los españoles como los portugueses, que habían descubierto la ruta marítima a la India bordeando la costa africana, comprendieron pronto que su futuro estaba allende los océanos. Cada uno vigilaba celosamente al otro para asegurarse de que, en su caza de mercancías, súbditos y tierras, no invadiera el territorio del otro.<n><n>Como en aquella época no existía nada parecido al derecho internacional, en caso de conflicto acudían al papa, que era la única persona cuya autoridad ambas naciones estaban dispuestas a acatar. Por su parte, la Iglesia católica tenía interés en que españoles y portugueses persiguieran con celo la cristianización de los «paganos» en las tierras desconocidas, en lugar de malgastar energías complicándose la vida mutuamente.<n><n>Así, en las negociaciones conjuntas de Tordesillas (1494) y Zaragoza (1529) se acordó que los territorios recién descubiertos al oeste de una determinada línea de longitud pertenecerían a España y todos los demás a Portugal. Esa línea de longitud atravesaba la Sudamérica entonces aún por descubrir, de modo que su parte oriental, parte de lo que hoy es Brasil, quedó para Portugal."
"0xd4cd0fb4" = "Probablemente fue el escritor romano Polibio el primero que mencionó la palabra «pirata» (peirato) hacia el año 140 a.C. Desde entonces se han usado muchas palabras distintas para referirse a estos temibles malhechores del mar: corsarios, filibusteros, bucaneros, freebooters... Los hombres que rodeaban a Klaus Störtebeker eran conocidos como «La Hermandad Vitalien» y Bartholomew Roberts se dio a sí mismo y a su banda de matones el título bastante inocuo de «Caballeros de la Fortuna». En última instancia, sin embargo, daba igual al comerciante quién fuera el que surgiera de la nada para atacar su barco. <n><n>Los bucaneros han sido un azote para la humanidad a lo largo de los siglos en todos los rincones del mundo. En la Antigüedad, los piratas cilicios extendieron tal terror por todo el Mediterráneo que el Imperio romano se vio obligado a montar campañas periódicas contra ellos. Islas escondidas y costas quebradas situadas cerca de rutas comerciales muy transitadas proporcionaban los lugares ideales para la actividad pirata: aquellas zonas donde arrecifes, corrientes y mal tiempo convertían en presa fácil a los pesados barcos mercantes ofrecían un refugio al que se podía retirar rápidamente tras cometer la fechoría. La costa de Asia Menor era tan temida en la Antigüedad como el Caribe lo fue durante la Era de los Descubrimientos, mientras que los piratas del Sudeste Asiático alcanzaron un estatus casi mítico.<n><n>Según el origen de la palabra, un «bucanero» era en realidad un marinero que se hacía a la mar como particular, no como marino de la armada, en busca de botín y que, por lo tanto, se consideraba dedicado a la piratería. <n><n>Sin embargo, la expedición de patentes de corso dio a algunos de los bucaneros del Caribe una apariencia de legalidad. Estos documentos los expedían gobernadores ingleses, franceses o neerlandeses, y su propósito era dirigir el azote de la piratería contra los poderes adversarios.<n><n> La facilidad con que se podían obtener las patentes de corso dependía del gobernador en cuestión. Un gobernador consideraría deshonroso pactar con piratas. Otros eran bastante menos escrupulosos, o simplemente corruptos o cobardes."
"0xd4cd0fb5" = "Los «siete mares» en realidad son solo tres (concretamente, los tres océanos): el Pacífico norte y sur, el Atlántico norte y sur, los océanos Ártico y Antártico y el océano Índico.<n><n> El océano Pacífico debe su nombre a la primera vuelta al mundo de Fernando de Magallanes, que tuvo la fortuna de encontrar un tiempo favorable durante las muchas y hambrientas semanas que tardó en cruzar este vasto océano.<n><n>Y otra cosa: el Caribe toma su nombre de los «karibe» (o «karaibe»), pueblos de un grupo lingüístico indio cuyo territorio se extendía desde las Antillas a lo largo de la costa norte de Sudamérica."
"0xd4cd0fb6" = "Las islas Bermudas deben su nombre al explorador español Juan Bermúdez, que las descubrió en 1503. La infame zona conocida por todos los navegantes como «Triángulo de las Bermudas», en la que se dice que el riesgo de misteriosos accidentes marítimos es muy alto, abarca una superficie de mar entre las islas Bermudas, Puerto Rico y Fort Lauderdale (Florida).<n><n>Algunos sostienen que la extraña serie de acontecimientos inexplicables comenzó con el viaje de Cristóbal Colón: el marino genovés al servicio de España se encontraba con sus tres barcos, el 14 de septiembre de 1492, justo en esta zona, cuando la aguja de su brújula empezó a girar descontroladamente. Eso se debía a la diferencia entre el polo norte geográfico y el polo norte magnético. Al día siguiente apareció una enorme llama en el cielo (posiblemente un meteoro).<n><n>Sin embargo, el apodo «Triángulo de las Bermudas» solo surgió después de la Segunda Guerra Mundial, tras una serie de accidentes de aviación que atrajeron la atención del público hacia esta zona del suroeste del Atlántico Norte.<n><n>Los seguidores de los fenómenos misteriosos señalan más de 200 presuntos accidentes inexplicados, aunque interpretan las fronteras con bastante generosidad. La mayoría de estos sucesos, muchos de los cuales ni siquiera ocurrieron en la zona, tienen una explicación perfectamente lógica."
"0xd4cd0fb7" = "La legendaria flota del tesoro española, que zarpaba regularmente de América rumbo a España, también suscitó todo tipo de codicias más allá de la península ibérica. Fue principalmente una Inglaterra ambiciosa la que vio en ello una oportunidad de disputar a España su papel de dueña de los mares y reina del mundo.<n><n>Como el reino insular era aún demasiado débil para emprender campañas militares a gran escala, tenía mucho más sentido enfrentarse a su rival fuera de Europa, muy lejos, donde no esperaría ser atacada ni recibiría aviso alguno de un ataque. Allí se podía saquear a la víctima con facilidad y luego simplemente desaparecer, y nadie en Europa se enteraría de lo ocurrido hasta meses después.<n><n>A capitanes audaces, el más famoso de los cuales fue Francis Drake (1540-1596), Su Majestad Isabel I expidió patentes de corso. Estas patentes se parecían a una especie de cheque en blanco y eran una licencia para saquear que elevaba a Drake y a sus asociados por encima del nivel de los bucaneros corrientes y les confería el estatus de barones ladrones privados al servicio de una autoridad superior. Hicieron un trabajo excelente. En ninguna parte estaban seguros los barcos y las guarniciones ibéricas.<n><n>En 1578, Francis Drake atravesó el estrecho de Magallanes y partió como un torbellino en busca del botín español a lo largo de la costa pacífica de América. ¡Nadie se había atrevido nunca a hacerlo! A su regreso al puerto de Plymouth en 1580, Drake se había convertido en el segundo capitán, después de Magallanes, en dar la vuelta al mundo. <n><n>Mientras tanto, el rey Felipe de España hervía de rabia y agitaba el Tratado de Tordesillas, por el que Su Santidad el Papa había declarado firmemente en 1494 que el hemisferio occidental quedaba dentro de la esfera de influencia de España. Pero ¿qué efecto podía tener esa clase de protesta sobre esta peculiar nación insular de heréticos protestantes, que rechazaban por completo la autoridad del Papa en Roma y que incluso se negaron a adoptar el moderno calendario gregoriano hasta 1753, simplemente porque había sido desarrollado por orden del papa Gregorio en 1582?<n><n>Una vez más, parecía que el asunto solo podía resolverse por medio de la guerra. La Armada de Felipe zarpó hacia Inglaterra en 1588, pero bajo el mando de sir Francis Drake, que para entonces había sido armado caballero, y con la ayuda de varias tormentas oportunas, los ingleses consiguieron destruir la flota española. Durante cientos de años después, nadie desafió la posición de Gran Bretaña como principal potencia marítima."
"0xd4cd101f" = "Sin duda, los viajes de Cristóbal Colón (1451-1506) a América figuran entre las mayores aventuras jamás emprendidas por la humanidad. Ni siquiera un escritor se atrevería a imaginar semejante relato de acontecimientos dramáticos y coincidencias extrañas.<n><n>Aunque el navegante genovés había conseguido convencer a la pareja real Isabel y Fernando de España de su idea de que existía una ruta marítima occidental hacia la India, ciertamente no podía contar con el consentimiento de la tripulación a bordo. De hecho, la mayor parte de la tripulación fue reclutada a la fuerza: como castigo por delitos contra la Corona, se obligó a la villa de Palos a proporcionar dos barcos con tripulaciones.<n><n>La noticia del plan de Colón provocó muestras de horror. La tripulación estaba firmemente convencida de que navegaban al mando de un loco que solo podía acarrear la destrucción para sí mismo y para todos los que navegaran con él.<n><n>Sin embargo, el mayor enemigo de Colón era la superstición: todo relato de terror imaginable parecía haberse abierto camino a bordo, y cualquier suceso extraño o siniestro no hacía más que reforzar los temores de los marineros: un volcán entró en erupción cuando pasaban frente a Tenerife, luego vieron columnas de fuego en el cielo e incluso la aguja de la brújula parecía jugarles malas pasadas. Si los barcos quedaban calmados, se consideraba un mal presagio. En cambio, si avanzaban bien, eso significaba que el viento soplaba siempre de este a oeste y que nunca podrían darse la vuelta.<n><n>En muchas ocasiones, el motín pareció inevitable. Una noche, el capitán oyó pasos y murmullos fuera de su camarote, y solo cuando empezó a rezar en voz alta los asesinos perdieron el valor y se escabulleron.<n><n>Las crisis más graves siempre estallaban cuando lo que se creía una isla en el horizonte resultaba una vez más no ser más que una ilusión óptica. Fue precisamente un suceso así, el 10 de octubre, el que llevó la situación al límite. Con gran dificultad, Colón negoció un ultimátum de tres días, tras el cual la tripulación quería dar media vuelta (preferiblemente sin su capitán). Sin embargo, el destino tenía otros planes: efectivamente avistaron tierra dentro de esos tres días. Ninguno de los presentes habría podido soñar que, en lugar de Asia, habían tropezado con un continente completamente nuevo y desconocido.<n><n>Japón y China aún quedaban a miles de millas náuticas, y solo por la increíble buena fortuna de que un continente desconocido se interpusiera en su camino, la expedición de Colón se habría perdido. La moral de la tripulación se levantó de inmediato. Ninguno de ellos recordaba haber albergado jamás pensamientos de motín..."
"0xd4cd1020" = "Cristóbal Colón había descubierto efectivamente una nueva masa de tierra (o mejor dicho: redescubierto, pues los vikingos ya habían pisado suelo americano durante la Edad Media), pero anunció equivocadamente que había descubierto una ruta marítima hacia la India.<n><n>Mientras preparaba el segundo y el tercero de sus cuatro viajes, el genovés colaboró con Américo Vespucio, de Florencia. Fue este quien sugirió por primera vez que esas tierras al oeste pertenecían en realidad a un continente nuevo y desconocido. Esta revelación espectacular reavivó el interés del público, y siempre que se hablaba de estos nuevos territorios, el nombre de Vespucio salía a colación.<n><n>En cambio, la estrella de Cristóbal Colón estaba en declive. Mientras tanto, incluso había sido enviado de vuelta encadenado tras las quejas de los colonos del Caribe, y su muerte como un hombre amargado y enfermo en 1506 no atrajo la atención que merecía. No es de extrañar, por tanto, que el cartógrafo del sur de Alemania Martin Waldseemüller recurriera al popular nombre de Américo Vespucio como inspiración cuando, un año después, trató de proponer un nombre para estas tierras desconocidas. <n><n>El nombre de Waldseemüller fue aceptado por sus colegas. Habría sido más justo que el continente se bautizara «Columbia»."
"0xd4cd1021" = "La primera parte de América que alcanzó gran importancia bajo el dominio español fue La Española. Cristóbal Colón ya había fundado aquí el primer asentamiento europeo en 1493, aunque los indígenas lo habían arrasado antes incluso de que regresara de Europa.<n><n>En los años siguientes, la Corona española tomó un control cada vez mayor de esta isla. Se construyeron el primer monasterio y la primera catedral, y fue aquí donde se estableció por primera vez el sistema social que luego se extendería a las demás zonas: una sociedad esclavista, estrictamente dividida en clases y estrechamente vinculada a la Iglesia católica.<n><n>La Española parecía ofrecer enormes oportunidades y atrajo al otro lado del océano a muchos colonos emprendedores. <n><n>Sin embargo, no pasó mucho tiempo antes de que España dirigiera su atención a otras regiones: para entonces ya se habían descubierto y conquistado los grandes reinos del continente. Allí era más fácil gobernar y los yacimientos de oro y plata eran más ricos y más fáciles de extraer.<n><n>Como un juguete abandonado, la gente perdió el interés por La Española. Piratas neerlandeses, ingleses y franceses se turnaron para lanzar ataques. En 1697, los franceses se hicieron con el control de Saint-Domingue, la parte occidental de la isla (hoy Haití) y establecieron una economía de plantación muy rentable. La producción de cacao, azúcar, índigo, algodón y café convirtió Saint-Domingue en la colonia más rentable del Nuevo Mundo en el siglo XVIII.<n><n>La única revuelta de esclavos victoriosa de la historia, que estalló como consecuencia de la Revolución francesa, acabó llevando a la independencia de Haití en 1804. Los rebeldes trataron a sus antiguos opresores más o menos como ellos mismos habían sido tratados: «Para la declaración de independencia necesitamos la piel de un blanco como pergamino, su cráneo como tintero, su sangre como tinta y una bayoneta como pluma», anunció entonces el general negro Boisrond-Tonnerre."
"0xd4cd1022" = "Un producto típico del Caribe, aunque de dudoso beneficio para la humanidad, es el ron. Este licor destilado de la melaza de la caña de azúcar, que originalmente llevaba el colorido nombre de «matademonios», se mencionó por primera vez en Barbados en 1650. Como bebida predilecta legendaria de los piratas, la mayoría de la gente tiende a asociar el ron con la isla de Jamaica, uno de los refugios de piratas más temidos de todos los tiempos. <n><n>Los traficantes de esclavos vendían en el Caribe la mercancía humana que habían comprado en la costa africana a cambio de grandes cantidades de melaza. Esta melaza se refinaba en ron en Nueva Inglaterra y luego se transportaba a África en esos mismos barcos. El licor se vendía en África y los barcos vacíos se cargaban entonces con un nuevo cargamento de esclavos. Con este funesto «comercio triangular», los armadores se aseguraban de que sus barcos fueran siempre cargados a plena capacidad en cada travesía."
"0xd4cd1023" = "Después de Cuba, Jamaica es probablemente la más famosa de las islas del Caribe. Su nombre deriva del nombre indio arahuaco Xymaca, que significa más o menos «la tierra de madera y agua». El propio Cristóbal Colón, que había descubierto la isla nueve años antes, tuvo amplia oportunidad de experimentar la belleza del paisaje y la amabilidad de sus habitantes cuando su barco naufragó frente a la costa norte en 1503.<n><n>Ciertamente le gustó tanto que transfirió la propiedad de toda la isla del rey de España y la declaró suya. A pesar de ello, este paraíso insular quedó bastante desatendido durante las siguientes décadas, hasta que los británicos se apoderaron de él en 1655. Para entonces quedaban muy pocos arahuacos, pues su tribu resultó especialmente vulnerable a las enfermedades que traían consigo los europeos.<n><n>En 1661, Edward D'Oyley fue nombrado capitán general y gobernador de Jamaica. Bajo su autoridad, la capital, [ref:Port Royal], se transformó en un refugio vibrante y fuertemente defendido para piratas. Se decía que era «el lugar más rico y más corrupto de la tierra», y muchos de sus habitantes, que por lo demás eran comerciantes corrientes, se unían con frecuencia para realizar incursiones privadas en aguas españolas. Al principio, el Gobierno británico mostró poca disposición a poner coto a estas actividades, pues, después de todo, los bucaneros mantenían a raya a sus rivales españoles.<n><n>Solo después de que sir Henry Morgan asumiera el cargo de gobernador (lo que resultaba significativo por haber sido él mismo pirata) volvieron la cultura y el orden a Jamaica. Morgan reprimió la piratería sin piedad y no dudó en mandar a sus antiguos asociados al cadalso.<n><n>Sin embargo, no bien se hubo restablecido la autoridad británica, se descubrió una nueva y lucrativa fuente de ingresos además del cultivo de la caña de azúcar: a partir de 1672, [ref:Port Royal] se convirtió en el mayor mercado de esclavos del mundo, una vez que la Real Compañía Africana inglesa estableció allí su monopolio."
"0xd4cd1024" = "Apenas dos semanas después de su llegada al Nuevo Mundo, Cristóbal Colón llegó a Cuba, la isla más grande de las Antillas. Aquí vivían varias tribus: los ciboneyes, los guanahatabeyes y los tainos, que, pese a su carácter pacífico, corrieron la misma triste suerte que otras tribus indígenas americanas: en 1511, tras librar una guerra de cuatro años contra los españoles, fueron conquistados y exterminados. Eso tuvo como consecuencia la importación aquí de grandes cantidades de esclavos negros. La isla, con su capital [ref:Havana], se dividió en siete demarcaciones administrativas (cabildos), cada una de las cuales enviaba un diputado a un consejo especial. El deber del diputado era representar los intereses locales de su zona.<n><n>Lo llamativo en la historia de Cuba es que, aparte de un breve interludio de dominio británico entre 1762 y 1763, la isla permaneció en manos españolas durante un tiempo relativamente largo. Puede que se debiera a que Cuba no era una de las zonas más importantes del imperio español durante la época colonial (por ejemplo, apenas había yacimientos minerales) y se usaba generalmente como escala de camino al continente. En cualquier caso, mientras la gran mayoría de los países sudamericanos y centroamericanos luchaban por su independencia en el primer cuarto del siglo XIX, los españoles pudieron conservar Cuba hasta 1898, cuando cedieron el control de la isla a los Estados Unidos."
"0xd4cd1025" = "Es bien sabido que muchas cosas que hoy damos por sentadas llegaron por primera vez a Europa como resultado del comercio con América. Sin embargo, el intercambio cultural también funcionó en sentido contrario.<n><n> Por ejemplo, cuando uno se imagina al típico indígena de las llanuras norteamericanas, cuesta creer que en América no hubiera caballos antes de la llegada de españoles y portugueses. Muchos de los indígenas huyeron presos de un pánico ciego la primera vez que vieron un caballo con jinete, porque pensaron que era una bestia extraña compuesta de dos seres que se habían fundido en uno.<n><n>El café, que normalmente se asocia con países como Brasil y Guatemala, no es originario de América y ya había recorrido tres continentes antes de llegar allí: desde África (probablemente desde Etiopía), pasó por los países árabes antes de llegar al suroeste de Europa. La planta se introdujo por primera vez en América durante el siglo XVIII, cuando la creciente popularidad de la bebida hizo necesario aumentar el cultivo.<n><n>Con la patata, los europeos habían descubierto en el Caribe un alimento básico de un valor inimaginable. A la inversa, el trigo era desconocido en América hasta la llegada de españoles e ingleses, que llevaron este cultivo a México en 1520 y a Virginia en 1777, respectivamente. Aunque al principio se pensaba que el clima americano no era apto para cultivar trigo, fue sobre todo Norteamérica la que vivió el éxito más fenomenal de este cultivo. Hoy el trigo es el cultivo agrícola con la mayor superficie sembrada del mundo."
"0xd4cd1026" = "¿Se imagina la vida sin chocolate? Debería hacerlo, porque el cacao era desconocido en el resto del mundo antes del descubrimiento de América. La palabra cacao probablemente procede de la lengua maya, donde puede rastrearse por primera vez: parece seguro que los comerciantes mayas bebían cacao 400 años antes del nacimiento de Cristo.<n><n>Los aztecas, que eran la potencia dominante en el continente centroamericano desde el siglo XIV, incluso otorgaron un significado religioso al cacao. El primer europeo que entró en contacto con esta exquisitez fue, una vez más, Cristóbal Colón, aunque ello ocurrió en un viaje posterior, en 1502, que lo llevó a Nicaragua.<n><n>Sin embargo, el legítimo «descubridor» del cacao es Hernán Cortés, conquistador del reino azteca, que trajo de vuelta a España la receta de una bebida llamada xocoatl (de ahí la palabra «chocolate»). El sabor resultaba al principio demasiado amargo para el paladar europeo, y solo después de que la gente empezó a añadirle azúcar o vainilla el chocolate caliente se convirtió en una bebida popular entre las clases altas ibéricas.<n><n>Los españoles guardaron la receta para sí durante casi cien años, tras lo cual el chocolate caliente se extendió por Francia y el resto de Europa. Hacia el año 1700, los británicos añadieron leche. El definitivo despegue del cacao en Europa se produjo cuando se descubrió lo delicioso que sabían juntos el café y el cacao."
"0xd4cd1027" = "Aunque a veces resulta difícil distinguir entre realidad y leyenda cuando se habla de piratería, no se puede negar el hecho de que hubo mujeres piratas. Dos de las figuras más deslumbrantes emprendieron ese camino en la isla de Jamaica a principios del siglo XVIII.<n><n>Anne Bonny, de quien se decía que había recibido una cuchillada en el vientre siendo aún niña, se había fugado con un marinero al refugio de piratas de Nueva Providencia (Nassau). Allí consiguió deshacerse de su marido y empezar su propia carrera a bordo de un barco neerlandés apresado. <n><n>Allí conoció a Mary Read, que ya había luchado en las guerras de sucesión españolas disfrazada de hombre y que, según se dice, mostraba los pechos a sus adversarios antes de matarlos, para demostrarles que habían sido vencidos por una mujer.<n><n>Tras su captura en el año 1720, se libraron de ser enviadas al cadalso solo porque estaban embarazadas. Corrieron mejor suerte que la mayoría de sus compinches varones, sobre cuya cabeza Anne Bonny solo podía verter desprecio.<n><n>A continuación, las palabras que dirigió al infame «Calico Jack» camino del cadalso: «Siento verte aquí, Jack, pero si hubieras peleado como un hombre, no estarías aquí para que te ahorquen como a un perro»."
"0xd4cd1028" = "El galés Bartholomew Roberts (1682?-1722) no solo fue uno de los piratas más importantes, sino también uno muy insólito. Conocido también como «Black Bart» (que no debe confundirse con «Barbanegra», alias Edward Teach), se convirtió tarde a la piratería, a los 37 años, aunque el paso a las actividades criminales fue sin duda fluido: el barco en el que trabajaba y que fue atacado en 1719 por su compatriota galés Howell Davis era, de hecho, un barco negrero.<n><n>Roberts decidió unir su suerte a la de Davis, a cuyo asesinato unas semanas después, asumió el papel de capitán. Se dice que Bartholomew Roberts rehuía el alcohol y prefería el té.<n><n>A diferencia de Teach, que se presentaba como el mismísimo demonio encarnado, Roberts tenía predilección por la ropa elegante, no le gustaban los juegos de azar e insistía en que sus hombres rezaran. Sin embargo, ello no significaba en absoluto que Roberts fuera un hombre piadoso en el fondo. Son numerosos los relatos de las atrocidades que cometió, sobre todo contra prisioneros, durante sus incontables saqueos. Con un botín de más de 400 barcos y una zona de operaciones que se extendía desde Brasil hasta Terranova y África Occidental, fue, junto con Henry Morgan, uno de los piratas más exitosos de América Central. <n><n>El estruendo de los cañones de un buque de guerra británico frente a la costa de Guinea en 1722 marcó el final de su carrera y la desaparición de una de las mayores amenazas de los siete mares."
"0xd4cd1090" = "El bucanero más famoso del siglo XVII fue el galés Henry Morgan (1635-1688), que asoló las colonias españolas de las Antillas y con ello sacudió hasta los cimientos la autoridad de la gran potencia ibérica en la región.<n><n>Su vida ejemplifica la moral bastante dudosa que había detrás de la política de Inglaterra, Holanda y Francia, que se complacían en hacer la vista gorda ante la piratería siempre que esta causara daño a las demás grandes potencias.<n><n>Henry Morgan, a quien se puso al mando de un barco de bucaneros en 1668, empezó a sembrar el caos a lo largo de la costa norte de Sudamérica. Al mando de casi 2.000 hombres, capturó la ciudad fuertemente defendida de Panamá en agosto de 1670 y luego se escabulló con la mayor parte del botín en el viaje de vuelta. Sin embargo, como el ataque se produjo después de que España e Inglaterra habían firmado un tratado de paz, fue hecho prisionero y llevado a juicio en Londres.<n><n>Morgan no fue condenado, al contrario: no pasó mucho tiempo antes de que los vientos de la diplomacia cambiaran una vez más de dirección. No solo se indultó a Morgan, sino que se le armó caballero. Como sir Henry, fue nombrado nuevo gobernador de Jamaica, donde impuso un estricto orden y vivió los últimos años de su vida como un plantador rico y respetado."
"0xd4cd1091" = "Las Bahamas, que durante un breve periodo a mediados del siglo XVII sirvieron de refugio a disidentes religiosos de Inglaterra, quedaron oficialmente en 1670 bajo el control del conde de Albemarle y de otros caballeros que habían tomado posesión del archipiélago a manos del rey Carlos II con la esperanza de obtener beneficios.<n><n>Pese a sus promesas, sin embargo, estas personas mostraron escaso interés en establecer una administración civil bien ordenada. Ocurrió justo lo contrario: al igual que en otros lugares del Caribe, hordas de piratas se asentaron en las Bahamas, sobre todo en la isla de Nueva Providencia, donde se encontraba la villa de Nassau. <n><n>Las bahías poco profundas, en las que no podían internarse los pesados buques de guerra, ofrecían un fondeadero ideal para varios cientos de balandros y barcazas piratas. Las frecuentes incursiones en aguas españolas provocaron represalias, y John Wentworth, el primer gobernador, tuvo la ingrata tarea de restablecer el orden y la ley en las islas.<n><n>Como la situación no mostraba indicios de mejora, el rey Jorge I de Inglaterra confiscó de nuevo las Bahamas y las convirtió en colonia de la Corona. Woodes Rogers, antiguo bucanero y circunnavegador, fue nombrado primer gobernador real a mediados de 1718.<n><n>Combinando la zanahoria y el garrote, puso fin al caos que había imperado hasta entonces. Ofreció una amnistía general a todos los piratas dispuestos a renunciar a sus actividades bajo juramento. A todos los que no estaban dispuestos a hacerlo les esperaba el castigo en forma de una flota de barcos armados hasta los dientes.<n><n>Tras restablecerse así la normalidad, al archipiélago se le concedió su propio parlamento en 1729 y, durante los cien años siguientes, salvo disturbios ocasionales a causa de invasiones, la historia de las Bahamas transcurrió de forma relativamente tranquila."
"0xd4cd1092" = "En casi todas partes de sus colonias recién adquiridas, los españoles establecieron un rígido sistema social que ofrecía muy pocas oportunidades de ascenso. En lo más alto de la jerarquía estaban los compatriotas nacidos en Europa.<n><n> Los españoles nacidos en las colonias eran conocidos como criollos. Aunque en la jerarquía se les consideraba solo de importancia secundaria, ocupaban la mayoría de los cargos menores del Estado, la Iglesia y el ejército.<n><n>Los españoles de ascendencia europea y los criollos representaban, por tanto, la clase elitista de las colonias. A los hijos de matrimonios mixtos entre blancos (en su mayoría hombres) e indígenas se les llamaba mestizos. Los indígenas, dueños originales de la tierra, ocupaban la posición más baja de la sociedad, y en aquellas zonas donde los europeos los habían exterminado por completo, ese honor quedó reservado para los esclavos negros.<n><n>Las proporciones relativas de estas clases en la población variaban enormemente entre las distintas regiones del imperio español. En México, por ejemplo, los mestizos constituían el sector más numeroso de la población. En muchas islas, los esclavos negros eran superiores en número (y estaban a merced de sus amos). También consiguieron sobrevivir tribus indígenas en aquellas zonas donde la selva, los pantanos y las montañas ofrecían un refugio seguro, por ejemplo en Bolivia o Florida."
