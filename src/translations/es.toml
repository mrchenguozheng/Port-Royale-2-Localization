"0x39c75485" = "desconocida"
"0x39e32dc6" = "Te lo agradezco de veras. La ciudad en cuestión se llama @T$TargetTown$. Espero poder llegar a algún acuerdo con los comerciantes antes del @D$EndDate$. Hasta entonces, su situación económica no puede caer por debajo de \"Auge\", para que yo pueda negociar desde una posición más ventajosa."
"0x39e32dc7" = "La ciudad en cuestión es @T$TargetTown$. Suministra a la ciudad con todos los productos que necesite. Yo haré todo lo posible para acallar los rumores antes del @D$EndDate$ de una vez para siempre. Antes de ese momento, su situación económica no puede caer por debajo de \"Auge\"."
"0x39e32dc8" = "La ciudad en dificultades es @T$TargetTown$. Su situación económica no puede caer por debajo de \"Auge\" antes del @D$EndDate$, de lo contrario se produciría un éxodo de ciudadanos dejando la ciudad. Existe incluso el riesgo de que se desate allí la peste. ¡Debes asegurarte de suministrar a la ciudad con suficientes productos para evitar esto a tiempo!"
"0x39e32dc9" = "Bien. @T$TargetTown$ es la ciudad en cuestión. Suministra a la ciudad con todo lo que necesite antes del @D$EndDate$. Su situación económica no puede caer por debajo de \"Auge\". Debo ser sincero y decirte que la ciudad posiblemente podría verse asolada por la peste. Estate preparado para ello."
"0x39e7361e" = "%1 ha sido derrotado"
"0x39e9081a" = "Has descubierto el emplazamiento del escondite de Barbanegra. Si quieres información sobre los piratas que en él se ocultan, pulsa con el botón izquierdo sobre el símbolo del escondite en la carta de navegación.<n><n>Cuidado: Al destruir una guarida se aniquila a todos los piratas que hubiese en ella. Sin embargo, los convoyes piratas que no estuvieran en el escondite en ese momento no cometerán el error de volver y establecerán una nueva guarida en otro lugar.<n><n>Por eso, para acabar con la amenaza pirata de una vez por todas, tu primer objetivo consistirá en destruir todos los convoyes que se dirijan a la guarida. Lo ideal es esperar en las cercanías y destruir todos los buques que entren o salgan del escondite pirata.<n><n>Has recibido algo más de dinero para ayudarte en tu cometido.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destruir todos los convoyes del pirata Barbanegra que se encuentren en el mar. ¡No ataques su guarida!"
