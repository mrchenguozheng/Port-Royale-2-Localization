"0xce36d9cb" = "Convoy de la expedición"
"0xce43a07c" = "Has atacado un convoy perteneciente a una nación amiga. En esta campaña las naciones están en paz, por lo que no puedes atacar convoyes comerciales o militares."
"0xce4d9a57" = "Comerciar en la ciudad"
"0xce75e5c4" = "Ya has aprendido a comprar y vender mercancías. Siempre hay que comprar las mercancías en las ciudades donde se producen, porque normalmente allí son más baratas.<n><n>Ten en cuenta que si quieres comerciar con un convoy tendrás que seleccionarlo previamente y lógicamente, deberá estar atracado en la ciudad antes de poder acceder a la lonja.<n><n>Más adelante, en esta campaña, deberás conseguir beneficios comerciando tú solo. En la ventana de mensajes encontrarás pistas para hacerlo.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña <f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumenta tu riqueza hasta @g$GoldGoal$ comerciando."
