"0xea8b5027" = "Has causado grandes daños a mi nación, pero eres el único hombre que puede salvar nuestro destino. Te ofrezco nuestra amistad a cambio de %1. ¿Qué me dices?"
"0xea92b930" = "Soy el %1. ¿Te interesaría hacer negocios? Si me das un convoy, compartiré contigo el %2 de mi botín. Incluso podrás decirme en qué aguas prefieres que aceche. Puedes entregarme cualquier convoy con hasta 5 barcos."
