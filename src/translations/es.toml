"0x2a7f7e18" = "Me alegro mucho. Lamento no poder darte mucho tiempo. Debes cumplir esta misión antes de @D$EndDate$.   Ataca convoyes comerciales de @n$TargetNation$ y hunde o captura @I$NumShips$ barcos.   "
