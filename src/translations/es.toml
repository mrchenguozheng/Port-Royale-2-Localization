"0x077030da" = "¡Enhorabuena! Has superado esta campaña y ya tienes experiencia en batallas navales y ataques a tierra.<n><n>Antes de atacar a otro convoy asegúrate siempre de que tus buques escolta están perfectamente armados y en buen estado. Evidentemente, también deberás plantearte qué convoyes vas a atacar y si puedes salir victorioso de esos asaltos. Los convoyes de transporte procedentes de Europa y los convoyes militares siempre son muy fuertes. Los piratas también pueden resultar ser duros contrincantes.<n><n>Atacar a cualquier barco no pirata sin contar con una Patente de Corso dañará mucho tu reputación en todos los países. En el peor de los casos, poderosos convoyes militares intentarán dar caza a tu convoy.<n><n>Si atacas un convoy comercial y únicamente lo saqueas sin hundir sus barcos, el impacto negativo sobre tu reputación será mucho menor. "
