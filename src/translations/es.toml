"0xd44a911d" = "¡Enhorabuena! Ahora ya tienes experiencia en la producción de mercancías. También te habrás dado cuenta de que al principio no siempre es fácil obtener un beneficio vendiendo las mercancías que produces y a la vez mantener tu negocio a flote comerciando con otras mercancías.<n><n>Si estableces negocios en las campañas posteriores o en otras partidas, siempre deberás asegurarte de poder vender las mercancías producidas obteniendo un beneficio. Producir mercancías resulta caro y no siempre es fácil encontrar materias primas.<n><n>Por ello, lo primero antes de producir mercancías es comerciar para hacerte con una buena reserva financiera. "
