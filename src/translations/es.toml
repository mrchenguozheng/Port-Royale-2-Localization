"0xfb3ffb48" = "Me gustaría agradecerte de nuevo tu generosidad al entregarnos uno de tus convoyes. Estamos procediendo a prepararlo y estará listo para zarpar en %1 días.<n><n>Si quieres entregar otro convoy, tendrás que esperar hasta entonces."
"0xfb425369" = "Apoyo al diseño"
"0xfb4be839" = "¡Excelente! Has destruido todos los convoyes piratas. Gracias a tu acción, pasará mucho tiempo hasta que aparezcan nuevos convoyes piratas en el Caribe.<n><n>Ahora ataca la guarida pirata de la misma forma que atacarías una ciudad, seleccionando tu convoy y pulsando a continuación sobre el escondite pirata con el botón derecho del ratón. Si hay algún barco pirata anclado allí tendrás que destruirlo antes de poder atacar las defensas del puerto.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destruir la guarida del pirata Barbanegra."
