"0x27beb2d9" = "Saquea @a$Amount$ de especias, vino y herramientas de los convoyes de transporte de @n$HostileNation$. No debes capturar ni hundir ningún barco. Luego entrega estas mercancías en el mercado de @T$TOWN$ antes de @D$EndDate$. Después podrás recoger tu recompensa del gobernador."
"0x27e88b91" = "Construye una iglesia y aumenta la población de tu ciudad hasta 2.200. Tienes hasta @D$EndDate$."
