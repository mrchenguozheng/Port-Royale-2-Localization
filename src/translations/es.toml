"0xdfb549a4" = "Debilitada por la guerra, %1 no dispone de suficientes convoyes militares para proteger sus aguas. Quiero que aproveches esta oportunidad y tomes una de sus ciudades."
"0xdfb549a5" = "¡%1 no dispone de suficientes convoyes militares para proteger sus aguas! ¡Deberíamos ponernos en marcha al instante y tomar una de sus ciudades!<n>¿Puedo confiar en ti? "
"0xdfb9b5b7" = "¡Excelente! Ahora tienes @g$Gold$.<n><n>Cada país cuenta con convoyes militares para defender sus ciudades y proteger sus aguas territoriales. Cuantas más ciudades capture una nación, más convoyes militares necesitará para asegurarse su protección.<n><n>Si una nación pierde un convoy militar, su poder se verá debilitado. Como los convoyes militares son bastante agresivos con las ciudades y convoyes de una nación enemiga, es frecuente que una nación pierda un convoy militar completo.<n>Por ello suelen enviarse regularmente convoyes desde Europa para reforzar la fortaleza militar de una nación en el Nuevo Mundo.<n><n>Puedes verificar la fortaleza de una nación en el apartado \"Naciones\" de la Crónica. Si una nación se describe como débil, sus ciudades son susceptibles de ser capturadas.<n><n>Ahora debes derrotar a suficientes convoyes militares ingleses para hacer caer la capacidad militar de Inglaterra hasta \"débil\".<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Derrotar suficientes convoyes militares ingleses para conseguir que Inglaterra sea una nación \"débil\"."
