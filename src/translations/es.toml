"0x004b9030" = "Ya sabe que solo los barcos de escolta pueden participar en batallas navales. Los barcos mercantes vencidos siempre pasan al vencedor, que puede saquearlos o apresarlos.<n><n>Usted no siempre es el iniciador de las batallas navales en las que participan sus convoyes. Si un convoy suyo es atacado por piratas o por un convoy militar de una nación en la que su reputación es muy baja, puede entablar combate, o su convoy puede intentar evitar la batalla. Si quiere evitar una batalla, sus barcos de escolta deben intentar impedir que el enemigo se acerque demasiado a sus barcos mercantes.<n><n>Si eso falla, sus barcos de escolta serán apresados y sus barcos mercantes saqueados. Si un convoy no tiene buques de guerra, lo único que puede hacer en caso de ataque es intentar evitar la batalla. Ventaja: los barcos mercantes solo son saqueados por el enemigo y no apresados.<n><n>Ahora haga una visita al gobernador. Tiene una nueva misión para usted. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumpla la próxima misión que le asigne el gobernador."
