"0x004b9030" = "Ya sabes que sólo los buques escolta pueden participar en las batallas navales. Los barcos comerciales derrotados siempre son para el triunfador, que puede optar por saquearlos o capturarlos.<n><n>No siempre eres tú quien inicia las batallas navales. Uno de tus convoyes puede ser atacado por piratas o por un convoy militar de una nación en la que goces de mala reputación. En este caso puedes optar por entrar en combate o por intentar evitar la batalla. Si quieres evitar una batalla, tus buques escolta deben intentar evitar que el enemigo se acerque mucho a tus barcos mercantes.<n><n>Si aun así pierdes la batalla, tus buques escolta serán capturados y tus barcos comerciales saqueados. Si tu convoy no dispone de navíos de combate, lo único que puedes hacer en caso de ataque es intentar evitar la batalla. Afortunadamente, el enemigo saquea los barcos comerciales, pero no los captura.<n><n>Ahora, visita al gobernador, pues, tiene una nueva misión para ti. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumple la nueva misión asignada por el gobernador."
