"0xf52fee2f" = "Lucha contra piratas, bucaneros y convoyes militares de naciones enemigas.<n><n>Ponte a prueba cazando convoyes comerciales como bucanero.<n><n>Parte en busca de la legendaria flota de tesoros española.<n><n>Manda 16 tipos de barco diferentes."
"0xf52fee30" = "Guía a tu capitán en duelos con otros capitanes y piratas.<n><n>Cumple innumerables misiones de batallas, comercio y política."
"0xf52fee31" = "Visita ciudades de 4 naciones diferentes con distintos conjuntos de edificios<n><n:10>Disfruta de una rica variedad de gráficos mientras recorres paisajes distintos.<n><n:10>Saquea y captura ciudades para tu nación favorita<n><n:10>Construye tus propias ciudades<n><n:10>Compra negocios a otros comerciantes y establece monopolios de mercancías<n><n:10><o:0xFFFFEB7D>...¡toma el Caribe entero por asalto!"
