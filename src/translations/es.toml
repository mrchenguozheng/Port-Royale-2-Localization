"0x31074c51" = "¿Te has enterado de las noticias? Se ha desatado la peste en @T$Town$. Desde luego, esto se podría haber evitado si hubiera existido un hospital en la ciudad. Por desgracia, mi maestro constructor es un cobarde y tiene miedo de entrar en la ciudad para ordenar la construcción del hospital. Por eso propongo enviarte a ti. ¿Aceptas? ¡Estoy dispuesto a pagarte @g$Reward$ por tus esfuerzos!"
