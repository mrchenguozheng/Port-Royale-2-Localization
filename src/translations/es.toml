"0x334d5256" = "Reglas"
"0x3353aa4c" = "¡Excelente! Ahora debería tomar más ciudades inglesas en nombre de Holanda. Pero no se demore, porque solo puede tomar ciudades mientras Holanda e Inglaterra estén en guerra.<n><n>Como de costumbre, este tipo de misiones solo puede asignárselas el virrey de [ref:Grand Bahama]. Antes de que se le asignen más misiones para tomar ciudades, es posible que tenga que hacer algo para influir en la fuerza y la debilidad militares de las dos naciones. Ya sabe cómo hacerlo.<n><n>Como respaldo, el gobernador de las [ref:Turk Islands] le ha proporcionado tres carracas más.<n><n>En el puerto también hay disponibles muchos marineros y armas.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumpla dos misiones más para tomar ciudades para el virrey holandés antes de que termine la guerra entre Holanda e Inglaterra. Tiene hasta el @D$EndDate$. Después, el escenario habrá terminado."
