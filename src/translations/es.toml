"0x28f090e8" = "Patente de Corso"
"0x293d8c9f" = "¡Excelente! Su ciudad es ahora bastante grande. Pronto desembarcarán los primeros comerciantes de otras ciudades para comerciar mercancías con su ciudad.<n><n>Pero su ciudad también corre el peligro de recibir la visita de otros personajes menos deseables. Entre ellos figuran piratas y bucaneros de naciones con las que tiene una mala relación. Su siguiente tarea es, por tanto, contratar soldados y erigir cañones de puerto.<n><n>Afortunadamente, los ciudadanos de su ciudad pueden organizarse en gran medida por sí mismos. Solo tiene que darles algunas instrucciones y comprar los materiales necesarios. Después de eso, no hay costes adicionales.<n><n>Puede construir cañones de puerto desde el menú de Construcción y contratar soldados desde su palacio.<n><n>Recuerde:<n>¡Los soldados también necesitan alojamiento! Sin embargo, a diferencia de los trabajadores, los soldados solo necesitan una plaza de alojamiento cada uno.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construya cinco cañones de puerto y aumente sus soldados a 300."
