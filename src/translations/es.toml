"0x1c703500" = "El gobernador desea hablar contigo inmediatamente."
"0x1c74c605" = "Has huido con %1."
"0x1c7e1413" = "¡Gracias!<n> Naturalmente, primero necesitarás un permiso en la ciudad, pero puedes estar seguro de que recibirás uno.<n>Por supuesto, pagaré todos tus gastos tan pronto como se haya construido el colegio. El cumpleaños de mi mujer es el @D$EndDate$, asegúrate de que para entonces se hayan colocado los cimientos del colegio."
"0x1c7e1414" = "Muy bien. Comienza a construir el colegio antes del @D$EndDate$. Te pagaré entonces los gastos.<n>No olvides que necesitarás un permiso en @T$Town$ si quieres construir un colegio.<n>Recuerda: No le digas a mi hermana ni una palabra sobre esta misión."
"0x1c7e1415" = "¡Gracias! En @T$Town$ nunca se sabrá nada de este acuerdo. Comienza la construcción antes del @D$EndDate$. Te pagaré entonces los gastos.<n>No olvides que necesitarás un permiso en @T$Town$ si quieres construir un colegio."
"0x1c7e9deb" = "%1: Se han devuelto %2 del préstamo."
