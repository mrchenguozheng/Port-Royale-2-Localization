"0xfc3fdd9b" = "No has conseguido restablecer la población de [town:Tortuga].<n><n>En la próxima ocasión recuerda que se pueden contratar trabajadores en cuanto la situación económica de una ciudad sea como mínimo de \"auge\". Puedes abastecer la ciudad de trabajadores nuevos gracias a las familias de colonos. Los colonos viajan desde Europa hasta las ciudades del gobernador, donde esperan que alguien les transporte a otras ciudades. También encontrarás colonos a la espera de que alguien los recoja en las ciudades con mala situación económica."
