"0xf4b112c8" = "Salir del juego"
"0xf4b68a6b" = "¡Enhorabuena! Has superado la campaña y has capturado varias ciudades inglesas en nombre de Holanda.<n><n>Puedes capturar ciudades de la misma manera en otras partidas, pero asegúrate de que la nación cuyas ciudades quieres capturar sea militarmente débil. Además, la nación para la que quieres capturar ciudades debe ser fuerte y por supuesto las dos naciones tienen que estar en guerra.<n><n>Cuando capturas ciudades para un virrey se te suele recompensar con una hacienda donde puedes construir tu propia ciudad. Sin embargo, para que puedas céntrate en la conquista, esto no ocurre en esta campaña."
