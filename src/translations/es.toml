"0x084340c7" = "Esta campaña desafiante gira por completo en torno al comercio, la producción y el suministro de mercancías en una ciudad.<n:25>En [town:Tortuga] están pasando cosas muy extrañas: prácticamente ningún comerciante quiere visitar la ciudad y varios acontecimientos están dificultando la vida de sus ciudadanos. Tu tarea consiste en salvar la ciudad de la ruina. Al final de la campaña se mostrará tu puntuación, que depende de tu velocidad y de la riqueza que tengas al terminar.<n:25>En esta campaña puedes usar todas las opciones que ofrece el modo libre, pero además tendrás objetivos concretos que cumplir."
