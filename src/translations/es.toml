"0xcd01da76" = "Has empezado el juego con el rango de Marino en la ciudad española con gobernador de @T$TOWN$, donde ya tienes un almacén. También tienes un convoy en el puerto con dos barcos armados pero sin marineros.<n><n>El primer objetivo de esta campaña consiste en visitar al gobernador de @T$TOWN$ y aceptar su misión. Parece ser que la corona de España está teniendo problemas con el famoso pirata Edward Teach, más conocido como Barbanegra.<n><n>Ten mucho cuidado: En esta campaña las naciones están en paz. Esto significa que no debes atacar jamás un convoy que no sea pirata.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visita al gobernador de @T$TOWN$ y acepta la misión que te asigne."
