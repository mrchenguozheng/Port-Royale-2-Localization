"0x2a8b96d0" = "Tus tropas derriban la puerta de la ciudad e irrumpen en ella. Cuando los soldados de la ciudad lo ven, capitulan y tus hombres empiezan a buscar la cámara del tesoro sin encontrar resistencia. Saquean %1. "
