"0xe3de2672" = "Ya has subido a bordo todos los documentos del gobernador. Lleva los documentos recuperados a @T$TOWN$ "
"0xe3e1d467" = "%1,<n><n>No puedes comprar ningún permiso porque todavía no gozas de buena reputación en mi nación; además, no has hecho lo suficiente por esta ciudad.<n><n>Mejora tu reputación en mi nación, comercia con mi ciudad para mejorar tu historial comercial y vuelve más adelante."
"0xe3e1d468" = "%1,<n><n>Todavía no gozas de buena reputación en mi nación, así que me temo que no puedo venderte un permiso.<n><n>Vuelve cuando tu reputación haya mejorado."
"0xe3e1d469" = "%1,<n><n>No has comerciado lo suficiente con esta ciudad. Si quieres mejorar tu historial comercial, tráenos los productos que sean más demandados. Sólo cuando tu reputación sea suficientemente buena podrás comprar un permiso."
"0xe3e33a30" = "Que %1 sea tu nueva ciudad. Ahora puedes entrar en ella como en cualquier otra ciudad, construir edificios y crear negocios.<n>Todavía no eres propietario de toda la comarca, pero si consigues tomar más ciudades se te irán otorgando nuevas parcelas en la misma."
"0xe3fa97eb" = "Queda, pues, acordado. Lleva @a$Amount$ de herramientas a @T$DestTown$. En el mercado recibirás @g$GoldPerBarrel$ por <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>. Los productos deben entregarse antes del @D$Date$."
"0xe3fa97ec" = "Que así sea. Entrega @a$Amount$ en @T$DestTown$. Las herramientas deben llegar antes del @D$Date$. "
"0xe3fa97ed" = "¡Bien! Te encomiendo la tarea de obtener @a$Amount$ de herramientas. Entrégalas antes del @D$Date$ en @T$DestTown$. Tu contacto te pagará @g$GoldPerBarrel$ por <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> en el mercado."
