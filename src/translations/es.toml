"0x12c4aed2" = "Me estás haciendo un gran favor. Todo está en orden y ya he recibido el pago de @g$PriceBuy$ en depósito. Reúnete conmigo en el mercado, donde te entregaré los @a$Amount$ barriles de @G$Goods$. Después, lleva la mercancía a @T$Town$ antes del @D$EndDate$ y entrégaselos a @N$DestName$."
"0x12e312db" = "Parece mentira… Nos enfrentamos de nuevo a una escasez de los productos importados entregados por convoyes de transporte de @n$Nation$. ¿Podrías ayudarnos a mí y a mis amigos con este asunto?"
"0x12e312dd" = "La guerra con @n$HostileNation$ ha producido una escasez de productos importados en las colonias de @n$Nation$. Puesto que no parece haber ninguna escasez en @n$HostileNation$, podríamos atacar sus convoyes de transporte y obtener así los productos que escasean. Tú podrías encargarte de esta tarea. "
