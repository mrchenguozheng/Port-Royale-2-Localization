"0x132a8a31" = "%1 ha soltado al bucanero %2 para sabotear nuestras ciudades. No hace mucho atacó %3, y ahora está de camino a su ciudad natal. Me harías a mí y a mi nación un enorme favor si detuvieras a este bucanero en seco."
"0x132a8a32" = "Acabo de saber que el bucanero %1 salió hace poco de %2 para atacar una de nuestras ciudades. Espero que podamos detenerlo antes de que ataque. "
"0x132a8a33" = "Por orden de %2, el bucanero %1 va de camino para atacar nuestras ciudades. He sabido que se encuentra actualmente en %3 preparando su próxima acción."
"0x132e00ca" = "¡Me alegro mucho! A partir de hoy, las hostilidades entre nosotros son cosa del pasado."
"0x13385f0f" = "Nice work! With your Letter of Marque, you are now officially in the service of Holland and involved in the war with England. This means that you can attack English trading ships without your reputation suffering in Holland, France or Spain.<n><n>Naturally, your reputation with England will be damaged and, from now on, whenever you are in English waters, you should be on the lookout for the military convoys that will be pursuing you!<n><n>The English towns are all located to the southeast of the Turk Islands. Sail in this direction with your convoy and search for suitable trading convoys to capture. Sell the loot and the smaller ships to increase your wealth.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Capture three English trading convoys: Board their ships and add them to your convoy. "
"0x133e8429" = "en cuanto al puerto, es lo bastante seguro."
"0x13475956" = "Gestión del testeo y masterizado"
"0x13493847" = "El convoy está siendo reparado y no se puede enviar.<n>¿Quieres detener las reparaciones del convoy?<n>¡No recuperarás nada del oro!"
"0x13601073" = "Gracias por traerme los documentos. Como recompensa, te hago entrega de una barca. La encontrarás en el puerto."
"0x13601074" = "Muchas gracias por tu apoyo y por devolverme mis diarios. Como recompensa, te hago entrega de una barca. La encontrarás en el puerto."
