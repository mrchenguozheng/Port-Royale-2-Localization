"0x171746e9" = "Durante mucho tiempo has servido con lealtad a mi nación. Ha llegado el momento de que seas recompensado por ello: Te será otorgada una hacienda sobre la que podrás establecer tu propia ciudad."
"0x17328849" = "desconocido"
"0x1733ed83" = "Es la hora de afrontar el reto de dar nacimiento a una ciudad en el Caribe. Para ello, habrás de mejorar tu reputación en España y ganarte el aprecio de su virrey capturando ciudades en su nombre.<n:25>Cuando te sea asignada una hacienda sobre la que levantar los cimientos de tu nueva ciudad, habrás de levantarla desde cero e impulsar su economía para conseguir crear una metrópoli donde antes no había más que territorio salvaje."
