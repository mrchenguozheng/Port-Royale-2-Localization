"0xd4cd0f3d" = "Henry Avery es el ejemplo perfecto de un pirata con éxito: capturó los barcos más ricos de su época, consiguió esquivar a las autoridades y vivió lo suficiente como para disfrutar de su riqueza.<n><n>Los primeros años de su vida se hallan envueltos en el misterio, aunque sí sabemos que en junio de 1694 era marinero en un buque de guerra llamado Charles, al que los españoles habían dado permiso para capturar barcos pertenecientes a la colonia francesa de Martinica, en las Indias Occidentales. Un buen día se amotinó y se hizo con el control del barco, consiguiendo que la mayoría de la tripulación se pusiera de su lado. El barco, un veloz buque de guerra de 46 cañones que se adaptaba maravillosamente a su nuevo rol de barco pirata, fue rebautizado con el nombre de Fancy. En 1695 logró llevar a cabo su mayor hazaña: saquear la Flota del Tesoro de las Indias. Como parte de una alianza con otros piratas, atacó a la Flota del Tesoro de las Indias, poderosamente armada, y consiguió capturar dos barcos, pertenecientes al propio Gran Mogul, y que transportaban inimaginables tesoros. <n><n>Tras sobornar al gobernador de las Bahamas para que ofreciera protección a los piratas, Avery pagó lo que se debía a la tripulación, que entonces se dispersó por los cuatro confines de la tierra. Algunos fueron capturados en Inglaterra, pero Avery navegó hasta Irlanda, donde desapareció sin dejar rastro. Se cuenta que siguió disfrutando de sus riquezas en el anonimato."
"0xd4cd0f3e" = "Edward Teach, alias Barbanegra, muerto en 1718, fue uno de los piratas más populares de todos los tiempos; tal como indica su nombre, su sello personal era su temible barba negra trenzada. Con una tripulación de 300 hombres surcó los mares a bordo de su barco La Venganza de la Reina Anne, un antiguo barco comercial holandés, y no temía enfrentarse a los buques de la Marina de Guerra Británica.<n><n>Durante 18 meses, Teach, que había nacido en Bristol, causó estragos sobre todo en la parte norte de las Indias Occidentales y a lo largo de toda la costa de Norteamérica. Siempre se las ingenió para encontrar refugio en las Bahamas y en Carolina del Norte, una región asolada por la pobreza><n><n>A la fama de Barbanegra también contribuyó el hecho de que se ajustaba al estereotipo del temperamental y terrible pirata exaltado. Se cuenta que lisió a su artillero Israel Hands disparándole dos veces, únicamente para recordarle al resto de la tripulación quién se hallaba al mando.<n><n>Su hora le llegó en 1718, cuando el cazapiratas Robert Maynard localizó su balandro. A pesar de estar borracho como una cuba, Teach luchó como un demonio y solo consiguieron vencerle tras un arduo combate. Él murió en la batalla, y la mayor parte de su tripulación fue condenada a morir en la horca."
"0xd4cd0f3f" = "En los primeros años de la Época del Descubrimiento, los que deseaban seguir aumentando sus riquezas descubrieron que las plantaciones de azúcar que se habían ido desarrollando desde principios del siglo XVI, principalmente en el Caribe, ofrecían una excelente oportunidad de inversión.<n><n>Tales inversiones reportaban un beneficio medio del diez por ciento, y en el mejor de los casos (como ocurrió en Barbados allá por 1650) ¡De hasta un 50 por ciento! Naturalmente, esas plantaciones requerían de cantidades ingentes de trabajadores, por lo que se embarcó a cientos de miles de esclavos desde África, pues por aquel entonces, en muchos lugares los hombres blancos habían exterminado por completo a la población nativa americana. <n><n>Los propios europeos no podían soportar las condiciones climáticas, pero además su falsa dignidad les impedía realizar semejante trabajo de mulas. Incluso los dueños de las plantaciones preferían vivir en Londres o Madrid y dejar que un par de hombres de su confianza organizaran el trabajo en las colonias. ¡En el siglo XVIII la población negra de algunas islas llegaba al 90 por ciento!"
"0xd4cd0f40" = "El comercio del “oro negro” ya se había iniciado a principios del siglo XVI. La fuente de la \"mercancía\" preferida por los comerciantes de esclavos era la costa de África Occidental que se extendía entre el río Senegal y lo que hoy se conoce como Camerún. Esta área no solo se hallaba fantásticamente situada desde el punto de vista del transporte, sino que además poseía una economía y estructura sociopolítica estable. Esto significaba que los marineros no tenían que ir a la caza de esclavos ellos mismos, sino que podían comprar sus víctimas a los caciques locales o a otros comerciantes de esclavos.<n><n>Se buscaban sobre todo hombres jóvenes de edades comprendidas entre los 15 y 35 años, porque fundamentalmente se les destinaba al duro trabajo de las plantaciones. Aproximadamente una quinta parte de los esclavos no sobrevivía siquiera a la travesía, que podía prolongarse hasta seis semanas. Algunos morían a consecuencia del bárbaro trato que les propinaban sus amos, otros fallecían por accidentes acaecidos en la mar. Teniendo en cuenta este alto índice de mortalidad, los comerciantes de esclavos intentaban rentabilizar los viajes al máximo, abarrotando de esclavos los barcos. Durante semanas enteras aquellos pobres desgraciados viajaban codo con codo, encadenados los unos a los otros, en la oscuridad y sin apenas aire que respirar.<n><n>En tales condiciones, ¡Sorprende bastante que alguno de ellos sobreviviera a los viajes!  "
"0xd4cd0f41" = "Aunque en Norteamérica y Centroamérica no había esclavos blancos, sí hubo muchos europeos cuyas condiciones de trabajo diferían muy poco de las de los esclavos<n><n>Muchos jóvenes (sobre todo procedentes de las clases más desfavorecidas) deseaban emigrar, pero no contaban con el dinero para la travesía. Por tanto, pedían el dinero prestado para pagarse el pasaje, a condición de liquidar luego su deuda trabajando durante cierto tiempo en una plantación de azúcar (o en algún otro sitio parecido). <n><n>Sin embargo, lo que parecía ser un arreglo perfectamente lógico, también tenía su trampa: Muchos de los dueños de las plantaciones trataron de exprimir todo lo posible a estos trabajadores durante el tiempo en que estuvieran empleados. A ello había que añadir el clima del Caribe, que la mayoría de los europeos encontraban muy difícil de soportar.<n><n>Este sistema de “trabajo ligado por contrato” era también muy utilizado para los convictos que habían sido expulsados de sus países de origen. Más adelante los británicos emplearían el mismo método, sobre todo con los indios, a los que obligaron a trabajar en las colonias africanas."
"0xd4cd0f42" = "El florecimiento del comercio a través del océano Atlántico corría en paralelo al de las colonias americanas. Gran Bretaña - la nación marítima más poderosa desde los tiempos de la reina Isabel - tenía un vivo interés en controlar los desplazamientos de los productos, por lo que permitía que la economía doméstica compartiera los beneficios derivados del comercio.<n><n>Bajo el Lord Protector Oliver Cromwell, la “Primera Ley de Navegación” de 1651 decretó que únicamente podrían utilizarse barcos ingleses para transportar productos a Europa procedentes de las colonias. Esta medida apuntaba principalmente contra el poderío emergente de Holanda y beneficiaba a la flota comercial nacional.<n><n>En 1663 las estipulaciones de esta ley se hicieron aún más restrictivas: Los barcos coloniales que quisieran transportar productos a Europa debían solicitarlo a los puertos ingleses y pagarles un arancel. Sin embargo, este intento de controlar el comercio entre las colonias pronto encontró obstáculos. Dado que difícilmente se podía esperar que la armada británica pudiera vigilar todo el litoral, pronto surgió un floreciente comercio de contrabando. <n><n>Precisamente fue este conflicto con la madre patria respecto a las condiciones que regulaban la exportación e importación de productos lo que, en las colonias norteamericanas sobre todo, provocó que surgiera una identidad distinta entre los colonos allí asentados, lo cual más adelante se convertiría en una motivación importante de respaldo al movimiento independentista."
"0xd4cd0f43" = "El comienzo de la época colonial trajo consigo numerosos problemas de salud hasta entonces desconocidos en los viajes mucho más cortos que se realizaban por el Mediterráneo o a lo largo de la costa. La travesía a las colonias del Caribe y Norteamérica duraba de uno a dos meses, o incluso más si se desataban tormentas o periodos de tiempo en los que no soplaba el viento. Por tanto, no eran de sorprender las dificultades que habían de superarse: La fetidez de la ropa sucia y de la pobre higiene personal, la comida contaminada y podrida, la falta de agua limpia, las ratas a bordo así como el estrés psicológico provocado por la monotonía y el enclaustramiento. El terrible espectro del escorbuto se cernía sobre todos los marineros: Esta enfermedad, causada por la falta de vitaminas, se manifestaba en la pérdida de cabello y dientes y le costó la vida a muchos marineros. Fue James Cook (1728-1779), el primer marino que circunnavegó el globo terrestre, quien logró combatir esta enfermedad: no solo insistió en que el barco se mantuviera limpio, sino que además proveyó a su tripulación de chucrut y fruta fresca. Aquel que desembarcaba también debía enfrentarse a enfermedades tropicales como la fiebre hemoglobinúrica, una de las manifestaciones más peligrosas de la malaria: Esta infección, entre cuyos síntomas se cuentan la aceleración del pulso, fiebre, escalofríos y una orina de color oscuro, casi siempre era mortal."
"0xd4cd0f44" = "Son muchas las anécdotas interesantes que se esconden tras muchos de los nombres con los que marineros y cartógrafos tuvieron que ingeniárselas a la hora de bautizar los nuevos ríos, franjas de tierra y asentamientos. Incluso el primer nombre dado por los exploradores europeos de la Época del Descubrimiento en América tiene su propia historia. Cristóbal Colón bautizó la isla en la que tomó tierra el 12 de octubre de 1492 con el nombre de Salvador, para dar las gracias al Señor por haber protegido el convoy de la enfermedad y de las tormentas durante el viaje de ida y sobre todo por haber evitado que se produjera un motín que amenazó con estallar literalmente en el último minuto antes de que se avistara tierra.<n><n>En tiempos posteriores, los conquistadores españoles eligieron nombres que en su mayoría tenían connotaciones religiosas, como “Nombre de Dios” o “Trinidad”. En otros casos la gente se inspiró en la fecha o en el paisaje. Así, por ejemplo, los marineros portugueses bautizaron una bahía de la costa brasileña que habían descubierto el día de Año Nuevo de 1502 con el nombre de “Río de Enero” (Rio de Janeiro), y el nombre de la ciudad de Montevideo debe su nombre a Magallanes, quien al ver el litoral por vez primera, presuntamente exclamó: “¡Monte vido eu!” (“¡Veo una montaña!”).<n><n>También era muy común entre los exploradores bautizar franjas de tierra y ciudades con los nombres de sus gobernantes, su país natal o la ciudad de la que provenían. Así, no solo se transmitía al resto del mundo una clara declaración de ocupación, sino que además se creaba una ligazón con el país natal incluso en esas lejanas tierras.<n><n>Si todo lo demás fracasaba, uno siempre podía tomar prestado el nombre del idioma indio nativo (si bien en la mayoría de los casos tal cosa no disuadía a los colonizadores de proceder a continuación a la caza o exterminio de los propios nativos).<n><n>Hasta el día de hoy persiste la leyenda de que al preguntarle James Cook a un aborigen australiano por el nombre de un extraño marsupial, este le contestó “kangooroo” o “ganguru”, que presuntamente solo quería decir “¿Pero de qué está hablando?”. Incluso aunque fuera una leyenda, seguro que debieron darse este tipo de graciosos malentendidos. <n><n>Uno seguramente se sorprendería al saber cuántos nombres de ciudades, montañas y ríos solo significan “¡Buenos días!”, “¿Perdón, cómo dice?” o “¡Déjeme en paz!”..."
"0xd4cd0f45" = "Con el surgimiento de un imperio español que se extendía por toda la tierra, se hizo necesario establecer autoridades coloniales que contaran con el poder suficiente para tratar asuntos administrativos diarios así como cualquier crisis que pudiera desatarse por sorpresa. Con este propósito se concedía el título de virrey a los gobernadores más importantes de las colonias.<n><n>En lo más alto del imperio del nuevo mundo había dos dignatarios: Uno en Nueva España (Méjico) y otro en Perú. En el siglo XVIII se sumaron los virreinatos de Nueva Granada y Río de la Plata.<n><n> Los deberes de un virrey - que desempeñaba junto (y a menudo en conflicto) con un consejo administrativo denominado Audiencia - incluían las tareas habituales de un oficial del gobierno: Aumentar y recaudar los impuestos, garantizar que la población acatara la ley, organizar las defensas de la colonia, etc. También era responsabilidad suya la protección de la población nativa americana y el nombramiento de dignatarios eclesiásticos y seglares de menor rango.<n><n>Debido a la enorme importancia económica y política de sus posesiones de ultramar, la Corona siempre mantuvo un ojo avizor sobre las actividades desempeñadas por sus virreyes. Estos tenían prohibido involucrarse en ninguna actividad comercial extra que les reportara ingresos adicionales; muy al contrario, la rivalidad entre los virreyes solo tuvo como resultado la mutua restricción de su poder."
"0xd4cd0f46" = "Es un hecho bien conocido que los conquistadores europeos siempre respondieron a la llamada del oro y la plata. Sin embargo, las especias eran casi de mayor valor. Resulta difícil imaginar lo aburrida que debía de ser la dieta europea de la Edad Media cuando uno piensa en los peligros que la gente estaba dispuesta a correr con tal de obtener un poco de pimienta o de nuez moscada.<n><n>En este sentido, en un principio el descubrimiento de América fue muy frustrante. La gente observó con interés los exóticos animales que Cristóbal Colón trajo consigo, se regocijó con la expansión de las posesiones del país y con las muchas almas que imaginaron se salvarían gracias a la difusión por esas tierras de la Cristiandad. Sin embargo, las montañas de oro probaron ser más escurridizas de lo que se habían prometido. Estos viajes solo se hicieron provechosos diez o veinte años más tarde, cuando un verdadero flujo de plata americana empezó a arribar a Europa. <n><n>En uno de estos viajes, Colón trajo un tesoro más precioso que todo el oro y la plata del mundo: el 4 de noviembre de 1492, los nativos le hicieron entrega de lo que él describió como una manzana con sabor a castañas. En ese momento, ¡Era el primer europeo que probaba una patata! La palabra india para esta planta era “batate” y hasta el día de hoy se la conoce con el nombre de “patata”.<n><n>Muchas de las cosas que hoy día damos por sentadas las trajeron Colón y sus sucesores a Europa por vez primera: El tabaco, los tomates, el maíz, y la hamaca. O como decían los nativos americanos: “hamaka” (de la que deriva la palabra española)."
"0xd4cd0fae" = "Desde el momento en que se anunció, el descubrimiento del Nuevo Mundo desató la imaginación de las gentes de Europa: ¿Qué clase de criaturas podrían albergar esos territorios inexplorados? Circulaban los rumores más variopintos: Se decía que una isla estaba llena de caníbales, la otra de criaturas sin cabeza y con el rostro en el estómago.<n><n>La traducción del paisaje sudamericano de la Patagonia es más o menos la de “la tierra de los pies grandes”, mientras que el Amazonas debe su nombre a una horda de mujeres guerreras que presuntamente habrían evocado a los exploradores las mujeres guerreras de parecidas características de la mitología griega.<n><n>Mientras que en algunos de tales rumores había un trasfondo de verdad, otros se basaban en malentendidos y tergiversaciones, o en historias que los propios nativos americanos habían recogido en alguna parte.<n><n>No obstante, muchos de estos rumores eran simplemente producto de la vívida imaginación de las gentes y, las más de las veces, solo se los creían porque querían creérselos. Ello explicaría el hecho de que generaciones enteras de conquistadores buscaran la legendaria Fuente de la Juventud, el Jardín del Edén y Eldorado, la ciudad del oro. En sus equivocadas creencias les alentaban los nativos americanos, que constantemente les aseguraban haber oído algo en un sitio u otro, pero que en realidad solo deseaban ganar tiempo para persuadir a estos avariciosos hombres blancos de avanzar tierra adentro y aislarles así de sus barcos."
"0xd4cd0faf" = "Una de las figuras más deslumbrantes de una larga lista de exploradores y conquistadores que incluye a muchos otros pintorescos personajes fue el escritor y aventurero inglés Sir Walter Raleigh (aprox. 1554 – 1618). La primera vez que se hizo notar fue en 1580, cuando acabó con una sublevación de rebeldes irlandeses que se oponían a la ocupación inglesa.<n><n>Se convirtió en favorito de la reina Isabel I y usó su influencia para financiar una expedición en busca de la legendaria ciudad de Eldorado en Sudamérica. A pesar del total fracaso de varias expediciones que no encontraron nada de valor, se las ingenió para conservar el apoyo de sus promotores en Londres, haciendo uso de su infalible poder de persuasión. Les hizo creer que el premio final siempre se hallaba justamente más allá del siguiente estuario, por lo que no podía renunciar precisamente en ese momento.<n><n>No obstante, terminó perdiendo todo crédito. La gente había prestado oídos demasiadas veces a sus grandes promesas solo para terminar descubriendo que no eran más que palabrería. Raleigh cayó finalmente en desgracia con la reina Isabel. Su sucesor, Jaime I, pensando que este temperamental aventurero suponía una amenaza para su política exterior más moderada, le hizo arrestar por motivos poco convincentes y le sentenció a muerte tan pronto como accedió al poder. Su pena le fue conmutada (aunque para su desgracia no se la levantaron) y Raleigh fue encarcelado en la Torre de Londres.<n><n>Años más tarde, cuando el estado de las finanzas del país convencieron al rey de que ello era necesario, concedió el permiso a Sir Walter Raleigh de dirigir otra expedición a Guayana. Esta era una situación de lo más absurda: ¡Darle a un hombre que se hallaba sentenciado a muerte autoridad sobre la vida y la muerte de otros y enviarle en busca de oro! Sin embargo, esta contradicción se resolvió después por sí misma y relativamente pronto, ya que Raleigh, que por entonces ardía consumido por la fiebre, vivió para ver cómo su última expedición terminaba en fracaso.<n><n>Al regresar a Inglaterra, el furioso rey decidió que la suspensión del cumplimiento de la sentencia de Raleigh decretada en 1603 llegara ya a su fin. Sir Walter Raleigh fue ejecutado poco después.  "
"0xd4cd0fb0" = "Los primeros encuentros entre los habitantes nativos del Nuevo Mundo y los marineros blancos por lo general transcurrieron pacíficamente. En muchos lugares se recibía a los europeos como a dioses. Aquí y allá esta impresión se basaba en viejos mitos, pero en la mayoría de los casos simplemente se debía a que los nativos americanos se hallaban impresionados por esos extranjeros altos y rubios que llegaban con su brillante armadura en sus \"casas de agua\" (barcos).<n><n>Colón, Cortés y los demás exploradores estaban demasiado complacidos como para que tal ilusión se desvaneciera, si bien muy pronto los nativos americanos tuvieron que enfrentarse con la brutal realidad: Guiados por su insaciable codicia de oro - la \"enfermedad española\", tal como la denominaron los nativos americanos - los españoles abusaron, esclavizaron y masacraron a poblaciones enteras. La visión de los caballos, hasta ese momento desconocidos en América, y el ruido de los cañones causaron el pánico total y los que sobrevivieron a la masacre pronto sucumbieron ante la viruela, la gripe u otra enfermedad importada.<n><n>Intelectuales de renombre como Gonzalo Oviedo o Juan de Sepúlveda trataron de justificar los crímenes cometidos por los europeos echando mano de horribles argumentos racistas que retrataban a los nativos americanos como una raza vil, ignorante e inferior.<n><n>Los mismos hombres que habían hecho quemar en la hoguera a científicos y brujas a causa de sus creencias, eran muy versados en el arte de crear escandalosos informes sobre las \"costumbres bestiales\" de los nativos americanos: Aunque las prácticas de la idolatría, el sacrificio humano y el canibalismo no eran imaginarios, a partir de entonces los hombres blancos los usaron como justificación general para imponer a los nativos americanos las más brutales sanciones de todo tipo."
"0xd4cd0fb1" = "Como es comúnmente sabido, la primera fase de la colonización de América la emprendieron España y Portugal. Más adelante se les unió en tal empresa Holanda y, lo que es aún más importante, Inglaterra y Francia. Lo que ya no es tan sabido es que numerosas expediciones españolas nunca habrían tenido lugar si no se hubieran visto respaldadas por sus poderosos promotores alemanes (en aquella época, España y Alemania estaban bajo el reinado de Carlos I de España y V de Alemania).<n><n>Hacia 1500, Suavia del norte y sobre todo Augsburgo se habían convertido en uno de los centros comerciales y financieros más importantes de Europa. Desde aquí, las familias de comerciantes de Fugger y Welser ejercían una poderosa influencia sobre la política mundial. Por ejemplo, fue su amplio respaldo financiero el que ayudó al rey Carlos de España a convertirse en Emperador de Alemania en 1519. El rey Enrique VIII de Inglaterra y muchos de los Papas se alegraban de contar entre sus amigos con Jakob Fugger el “próspero”.<n><n>Naturalmente, estos astutos comerciantes tenían sus propios motivos ocultos para prestar tal apoyo: Esperaban a cambio que se les concedieran privilegios o permiso para participar en la real explotación minera de plata. Incluso los Welsers se las ingeniaron para adquirir temporalmente parte de la costa norte de Venezuela, en la que fundaron ciudades como “Nueva Augsburgo” y desde la que enviaron varias expediciones en la (casi siempre infructuosa) búsqueda de tesoros al corazón del territorio."
"0xd4cd0fb2" = "Con la conquista de la mitad del globo terrestre, la corona española se encontró en situación de poder servirse de oportunidades únicas. Durante un periodo de tiempo que duró varios siglos, hasta la desaparición de las grandes culturas americanas de los Incas, Mayas y Aztecas y el descubrimiento de inmensos depósitos de plata en Perú y México por parte de estos últimos, la situación de España parecía inconquistable. Por eso casi parece absurdo que fuera precisamente esa inmensa riqueza la que precipitara el declive de esta potencia mundial.<n><n>Una gran parte de los tesoros que se enviaban por barco de vuelta a España iban a parar directamente al bolsillo de aquellos comerciantes del norte de los Pirineos que habían financiado los viajes en primer lugar. Sin embargo, lo que quedaba era todavía suficiente para elevar los precios en la Península Ibérica. La gente empezó a vivir por encima de sus posibilidades: En una época en la que la habilidad para hallarse rodeado de admiradores a gran escala se consideraba más importante que el equilibrio del presupuesto del estado, la gente prestaba escasa atención a las triviales preocupaciones financieras.<n><n>Los productos se importaban incluso en cantidades cada vez mayores a bordo de barcos extranjeros, porque la gente se había vuelto demasiado refinada como para producirlos en casa. Incluso rara vez eran comerciantes nacionales los que proveían el equipo y las provisiones para las expediciones a América. La gente comentaba con orgullo: Toda Europa se halla bajo el dominio de España.<n><n>Sin embargo, el flujo de plata tenía que agotarse finalmente, y el brusco despertar que siguió fue como el de una resaca tras una larga noche de alegre borrachera: Los holandeses y los británicos querían apartar a España de los mares. Las numerosas guerras de religión contra los \"herejes\" protestantes y contra los turcos habían acabado con enormes sumas de dinero, y el vasto imperio sobre el que nunca se ponía el sol se había convertido en un coloso ingobernable.<n><n> La crisis se puso públicamente de manifiesto en 1557, cuando el nuevo gobernante español, Felipe II, se vio obligado a declarar por vez primera la bancarrota del estado. El gran imperio, que había poseído mayores tesoros que ningún otro imperio que le hubiera precedido, estaba arruinado."
"0xd4cd0fb3" = "¿Por qué el idioma que se habla en Brasil es el portugués cuando prácticamente en el resto de Sudamérica se habla español?<n><n>Bien, tanto los españoles como los portugueses, que habían descubierto la ruta marítima a India a lo largo de la costa africana, supieron reconocer muy pronto que su futuro les aguardaba cruzando los océanos. Cada uno de ellos se vigilaba celosamente para asegurarse de que el otro, en su búsqueda de productos, súbditos y tierra, no se entremetiera en su territorio.<n><n>Puesto que en aquel tiempo no había nada parecido a una ley internacional, en caso de conflicto acudían al Papa, que era la única persona a cuya autoridad ambas naciones estaban dispuestas a someterse. Por su parte, el interés de la iglesia católica era el de asegurarse que los españoles y los portugueses persiguieran con celo la Cristianización de los \"paganos\" en las tierras desconocidas, en vez de malgastar sus energías en complicarse la vida los unos a los otros.<n><n>Por tanto, durante las negociaciones conjuntas celebradas en Tordesillas (1494) y Zaragoza (1529) se acordó que los territorios recién descubiertos al oeste de una línea de longitud dada pertenecieran a España, y el resto a Portugal. Esta línea de longitud corta por lo que en ese tiempo era la Sudamérica sin descubrir, de modo que su lado este, parte de lo que hoy es Brasil, fue para Portugal."
"0xd4cd0fb4" = "Probablemente fue el escritor romano Polibio el primero que mencionó la palabra “pirata” (peirato), aproximadamente en el año 140 a.C. Desde entonces, se han empleado muchas palabras diferentes para referirse a esos terribles villanos: Corsarios, bucaneros, filibusteros... Los hombres que rodeaban a Klaus Störtebeker eran conocidos como “La hermandad para el Aprovisionamiento” y Bartholomew Roberts se daba a sí mismo y a su banda de secuaces asesinos el más bien inofensivo nombre de “Caballeros de Fortuna”. Pero al final al comerciante le daba un poco igual quién surgiera de la nada para atacar su barco. <n><n>A través de los tiempos los piratas habían sido un azote para la humanidad en todas las partes del mundo. En la Antigüedad, los piratas Cilicios infundieron tal terror a través de todo el Mediterráneo que el Imperio romano se vio obligado a montar frecuentes campañas para combatirlos. Las islas escondidas y los litorales dentados próximos a las rutas por las que se transitaba con más frecuencia ofrecían el lugar idóneo para ejercer la piratería: esas zonas en las que los arrecifes, las corrientes y las malas condiciones climáticas convertían a los voluminosos barcos mercantes en presa fácil, procuraban un refugio al que uno podía retirarse rápidamente una vez cometido el ultraje. La costa de Asia Menor era tan temida en la Antigüedad como lo fue el Caribe durante la Época del Descubrimiento, mientras los piratas del sureste asiático asumían un estatus casi legendario.<n><n>Según los orígenes de la palabra, un “corsario” era en realidad un marino que se hacía a la mar como individuo particular, no como soldado de la marina, en busca de un botín, y al que, por tanto, se le consideraba ocupado en prácticas de piratería. <n><n>No obstante, la emisión de Patentes de Corso dotó a algunos de los corsarios del Caribe de cierta legalidad. Estos documentos los emitían los gobernadores ingleses, franceses u holandeses, y su propósito era dirigir el azote de la piratería contra las potencias contrarias.<n><n> La facilidad con la que podían obtenerse estas Patentes de Corso dependía de cada gobernador en particular: Unos consideraban deshonroso pactar con los piratas, otros tenían menos escrúpulos, o simplemente eran más corruptos o cobardes."
"0xd4cd0fb5" = "En realidad, los “siete mares” son solo cinco (es decir, los cinco océanos): El Pacífico (norte y sur), el Atlántico (norte y sur), los océanos Ártico y Antártico, y el Océano Índico.<n><n>El Océano Pacífico debe su nombre a la primera circunnavegación del globo terrestre que llevó a cabo Fernando Magallanes, que tuvo la buena fortuna de encontrar un tiempo favorable durante las muchas semanas de hambruna que le llevó cruzar este vasto océano.<n><n>El nombre de Caribe deriva de los “Karibe” (o “Karaibe”), las gentes de un grupo de lengua nativa cuya área de asentamiento se extendía desde las Antillas a lo largo de la costa norte de Sudamérica."
"0xd4cd0fb6" = "Las islas Bermuda deben su nombre al explorador español Juan Bermúdez, quien las descubrió en 1503. La terrible zona conocida por todos los navegantes como “El triángulo de las Bermudas” - en la que se dice existe un alto riesgo de que ocurran misteriosos accidentes de navegación - cubre un área de mar comprendida entre Las Bermudas, Puerto Rico y Fort Lauderdale (Florida).<n><n>Algunos mantienen que la extraña serie de sucesos inexplicables se inició con el viaje de Cristóbal Colón. El 14 de septiembre de 1492 el navegante genovés al servicio de España se hallaba en esta zona con sus tres barcos, cuando la aguja de la brújula empezó a girar como loca. Esto lo provocó la diferencia entre el polo norte geográfico y el polo norte magnético. Al día siguiente, una inmensa llama apareció en el cielo (posiblemente un meteoro).<n><n>Sin embargo, el sobrenombre de “Triángulo de las Bermudas” solo surgió después de la Segunda Guerra Mundial, tras una serie de accidentes de avión que atrajo la atención del público hacia esa zona al suroeste del Atlántico norte.<n><n>Los adeptos a los sucesos extraños señalan más de 200 presuntos accidentes sin explicación, aunque interpretan esos límites un tanto generosamente. La mayoría de estos sucesos - muchos de ellos ni siquiera ocurrieron en esa zona - tienen una explicación perfectamente lógica."
"0xd4cd0fb7" = "La legendaria Flota del Tesoro Español, que emprendía con regularidad la travesía de América a España, también alimentó la codicia más allá de la Península Ibérica. Ante todo fue una ambiciosa Inglaterra la que vio en ello una oportunidad para combatir a España en su papel de dueña de los mares y reina del mundo.<n><n>Como el reino de la isla era todavía demasiado débil para involucrarse en campañas militares a gran escala, tenía mucho más sentido enredar a su rival fuera de Europa, bien lejos, donde no pudiera esperar ni ser atacada ni recibir ningún aviso de ataque. Allí uno podría saquear a la víctima con facilidad y luego desaparecer simplemente, y nadie en Europa sabría de lo sucedido durante meses.<n><n>Intrépidos capitanes, el más famoso de los cuales era Francis Drake (1540-1596), recibieron Patentes de Corso de Su Majestad Isabel I. Tales Patentes de Corso eran como una especie de cheque en blanco y una licencia para saquear que confería a Drake y a sus compinches un más alto grado que el de vulgares piratas, y les dotaba del estatus de príncipe de los ladrones al servicio de una más alta autoridad. E hicieron su trabajo maravillosamente bien: no había lugar alguno donde una guarnición o un barco españoles pudieran hallarse seguros.<n><n>En 1578, Francis Drake atravesó el Estrecho de Magallanes y se lanzó como un ciclón en pos del botín español a lo largo de la costa americana del Pacífico. ¡Nadie se había atrevido antes a tanto! A su regreso al puerto de Plymouth en 1580, Drake se había convertido en el segundo capitán después de Magallanes en navegar alrededor del mundo. <n><n>Mientras tanto, el rey Felipe de España rugía de ira y mostraba con rabia el Tratado de Tordesillas, bajo el cual Su Santidad el Papa había declarado firmemente en 1494 que el hemisferio occidental se hallaba bajo la esfera de influencia de España. – ¿Pero cómo una protesta como esa podría tener efecto alguno en esa peculiar nación isleña de herejes protestantes que rechazaban totalmente la autoridad del Papa de Roma y que incluso se negaron a adoptar el moderno calendario gregoriano hasta 1753, simplemente porque se había desarrollado bajo las órdenes del Papa Gregorio en 1582?<n><n>De nuevo, parecía que el asunto sólo podría resolverse por medio de una guerra. La Armada de Felipe emprendió rumbo a Inglaterra en 1588, pero bajo el mando de Sir Francis Drake - que por entonces había sido nombrado caballero - y con la ayuda de las oportunas tormentas que dañaron gravemente a la fuerza española, los ingleses lograron destruir la flota española. Durante cientos de años nadie osaría desafiar la posición de Gran Bretaña como primera potencia de los mares."
"0xd4cd101f" = "Sin duda, los viajes de Cristóbal Colón (1451-1506) a América se encuentran entre las aventuras más grandes jamás emprendidas por la humanidad. Ni siquiera un escritor podría atreverse a imaginar semejante relato de dramáticos acontecimientos y extrañas coincidencias. <n><n>Aunque el navegante genovés se las había ingeniado para convencer a la real pareja Isabel y Fernando de España de su idea de que existía una ruta marítima occidental a la India, ciertamente no podía confiar en el asentimiento de la tripulación de abordo. De hecho, la mayor parte de la tripulación se vio urgida a entrar en servicio: Como castigo por ofensas contra la Corona, se obligó a la ciudad de Palos a proporcionar dos barcos con tripulación<n><n>Las noticias del plan de Colón provocaron exclamaciones de horror. La tripulación se hallaba firmemente convencida de que navegaban a las órdenes de un loco que solo atraería la desgracia sobre sí y sobre todos los que con él navegaran.<n><n>Sin embargo, el mayor enemigo de Colón era la superstición: Parecía que todos los relatos de horror imaginables se hubieran conjurado a bordo y cualquier suceso extraño o siniestro sólo servía para reforzar los temores de los marineros: Un volcán entró en erupción a su paso por Tenerife, luego vieron columnas de fuego en el cielo, e incluso la aguja de la brújula parecía estar burlándose de la tripulación. Si los barcos estaban en calma, se veía como señal de mal agüero; por otra parte, si hacían buenos progresos, significaba que el viento siempre soplaba de este a oeste y que nunca serían capaces de regresar.<n><n>Fueron muchas las ocasiones en que pareció inevitable que estallara un motín. Una noche el capitán oyó pisadas y murmullos en el exterior de su camarote, y únicamente cuando empezó a rezar en voz alta los asesinos perdieron el coraje y se escabulleron.<n><n>Las crisis más serias siempre estallaban cuando lo que se creía una isla en el horizonte no era más que una ilusión óptica. Un incidente como este acaeció justamente el 10 de octubre y vino a sacar las cosas de quicio. Con gran dificultad, Colón negoció un ultimátum de tres días, transcurridos los cuales la tripulación quería dar la vuelta (preferiblemente sin su capitán). Sin embargo, el destino tenía otras intenciones: en esos tres días, de hecho, avistaron tierra. Ninguno de los allí presentes hubiera imaginado nunca que, en lugar de Asia, se habían tropezado con un continente completamente nuevo y desconocido.<n><n>Japón y China se hallaban a miles de millas de allí y si no hubiera sido por la increíble buena fortuna de que un continente extranjero se hallara en su camino, la expedición de Colón se habría perdido. La moral de la tripulación se elevó de inmediato. Ni uno de ellos se acordaba de haber rumiado siquiera la idea de amotinarse..."
"0xd4cd1020" = "Ciertamente, Cristóbal Colón había descubierto una nueva masa de tierra (o más bien redescubierto, porque los vikingos ya habían pisado suelo americano durante la Edad Media), pero erróneamente anunció que había descubierto una ruta marítima a la India.<n><n>Mientras se hallaba preparando el segundo y tercero de sus cuatro viajes, el genovés colaboró con Americo Vespucio, de Florencia. Fue él el primero en sugerir que estas tierras al oeste en realidad pertenecían a un continente nuevo y desconocido. Esta espectacular revelación despertó de nuevo el interés público y allá donde se discutiera sobre estos nuevos territorios, se mencionaba siempre el nombre de Vespucio.<n><n>Por el contrario, la estrella de Cristóbal Colón empezaba a declinar. Entretanto, incluso, se le había enviado encadenado de vuelta a casa tras recibirse quejas de los colonos del Caribe. Su muerte en 1506 como hombre enfermo y amargado no atrajo la atención que hubiera merecido. Por ello no es de sorprender que el cartógrafo del sur de Alemania Martín Waldseemüller buscara la inspiración en el popular nombre de Americo Vespucio cuando un año más tarde quiso sugerir un nombre para esas desconocidas tierras. <n><n>Los colegas de Waldseemüller aceptaron su sugerencia. Habría sido más justo bautizar el continente como “Columbia”."
"0xd4cd1021" = "La primera parte de América que creció y obtuvo una gran importancia bajo la corona española fue la Española. Ya en 1493 Cristóbal Colón había fundado el primer asentamiento europeo en estas tierras, aunque los nativos americanos lo exterminaron incluso antes de que Colón regresara de Europa.<n><n>En los años siguientes, la Corona española fue tomando creciente control sobre esta isla. Se construyeron el primer monasterio y la primera catedral y fue aquí donde primeramente se estableció el sistema social que había de extenderse a otras zonas: Una sociedad esclavista, estrictamente dividida en clases y estrechamente asociada a la iglesia católica.<n><n>La Española parecía ofrecer enormes oportunidades y atrajo a muchos colonos emprendedores del otro lado del océano. <n><n>Sin embargo, muy pronto dirigió España su atención a otras regiones: Por entonces se habían descubierto y conquistado los grandes reinos del continente, donde era más fácil gobernar y los depósitos de oro y plata eran más ricos y más fáciles de extraer.<n><n>Al igual que con un juguete roto, la gente perdió el interés por la Española. Los holandeses, ingleses y franceses se turnaron para lanzar sus ataques. En 1697, los franceses tomaron el control de Santo Domingo, la parte occidental de la isla (la actual Haití) y establecieron una rentable economía de plantaciones. En el siglo XVIII la producción de cacao, azúcar, índigo, algodón y café convirtieron a Santo Domingo en la colonia más rentable del Nuevo Mundo.<n><n>La única revuelta esclavista que triunfó en la historia y que se originó como consecuencia de la Revolución francesa llevó finalmente a la independencia de Haití en 1804. Los rebeldes trataron a sus antiguos opresores de forma muy parecida a como habían sido tratados ellos: \"Para la declaración de independencia necesitamos la piel de un hombre blanco como pergamino, su calavera como tintero, su sangre como tinta y una bayoneta como pluma\", anunció entonces el general negro Boisrond-Tonnerre."
"0xd4cd1022" = "El ron es un producto típico del Caribe, aunque sus beneficios para la humanidad sean más dudosos. Este alcohol hecho de melaza de caña de azúcar, en un principio llamado “mata-diablo”, aparece mencionado por primera vez en Barbados en 1650. Como la legendaria bebida preferida por los piratas, la mayoría de la gente tiende a asociar el ron con la isla de Jamaica, una de las guaridas piratas más temidas de todos los tiempos. <n><n>Los comerciantes de esclavos vendían en el Caribe la mercancía humana que habían adquirido en la costa africana a cambio de grandes cantidades de melaza; esta melaza se refinaba en forma de ron en Nueva Inglaterra, y luego se transportaba a África en los mismos barcos. El alcohol se vendía en África y en los barcos vacíos se embarcaba entonces una carga fresca de esclavos. Con este letal \"comercio triangular\" los dueños de los barcos se aseguraban de que sus barcos estuvieran siempre cargados en cada viaje."
"0xd4cd1023" = "Junto a Cuba, Jamaica es probablemente la más famosa de las islas del Caribe. Su nombre deriva del nombre indio Arawak Xymaca, que más o menos significa “la tierra de bosque y agua”. El propio Cristóbal Colón, que había descubierto la isla nueve años atrás, tuvo oportunidad de apreciar la belleza del paisaje y la afabilidad de sus habitantes cuando en 1503 su barco naufragó en la costa norte.<n><n>De hecho le gustó tanto que desposeyó al rey de España de la titularidad de la isla entera y la declaró de su propiedad. A pesar de ello, esta isla paradisíaca se vio bastante desatendida en las décadas siguientes, hasta que en 1655 los británicos se apoderaron de ella. En ese momento quedaban muy pocos Arawak, ya que su tribu resultó particularmente vulnerable a las enfermedades que los europeos habían traído consigo.<n><n>En 1661 Edward D'Oyley fue nombrado capitán general y gobernador de Jamaica. Bajo su autoridad, la capital de Port Royale se transformó para los piratas en un vibrante bastión fuertemente defendido. Se decía que era “el lugar más rico y corrupto de toda la tierra” y muchos de sus habitantes, que, por otro lado, no eran más que vulgares comerciantes, se solían coaligar para llevar a cabo asaltos privados en aguas españolas. En un primer momento, el gobierno británico mostró poca predisposición a poner orden en este tipo de eventos, ya que después de todo los corsarios mantenían en aprietos a sus rivales españoles.<n><n>Solo después de que Sir Henry Morgan fuera nombrado gobernador (cabe señalar, lo cual es muy sintomático, que él mismo hubiera sido anteriormente pirata) la cultura y el orden volvieron a reinar en Jamaica. Morgan suprimió la piratería de forma implacable y no vaciló a la hora de enviar al patíbulo a sus antiguos camaradas.<n><n>No obstante, apenas se había restablecido la autoridad británica cuando se descubrió una nueva y lucrativa fuente de ingresos, aparte de la que suponía la caña de azúcar: A partir de 1672, Port Royale se convirtió en el mayor mercado de esclavos del mundo, después de que la English Royal African Company estableciera un monopolio."
"0xd4cd1024" = "Tan solo dos semanas después de su llegada al Nuevo Mundo, Cristóbal Colón llegó a Cuba, la mayor isla de las Indias occidentales. Allí vivían varias tribus: Los Ciboney, los Guanahatabey y los Taínos, quienes, a pesar de su naturaleza pacífica, corrieron la misma suerte que otras tribus nativas americanas: En 1511, tras una guerra de cuatro años contra los españoles, fueron conquistados y exterminados. Ello hizo que se importaran allí grandes cantidades de esclavos negros. La isla, con su capital La Habana, estaba dividida en siete áreas administrativas (cabildos), cada una de las cuales enviaba un diputado a un consejo especial. El deber del diputado era el de representar los intereses locales de la zona.<n><n>Lo que es de destacar en la historia de Cuba es que, aparte de un breve interludio de dominio británico entre 1762 y 1763, la isla estuvo en manos españolas durante un periodo de tiempo relativamente largo. Ello puede que se debiera a que en la época colonial Cuba no era una de las zonas más importantes del imperio español (por ejemplo, apenas había depósitos minerales) y que en general se empleaba como escala de camino al continente. En cualquier caso, mientras que en el primer cuarto del siglo XIX la inmensa mayoría de los países sudamericanos y centroamericanos luchaba por su independencia, los españoles pudieron seguir en posesión de Cuba hasta 1898, cuando cedieron el control de la isla a los Estados Unidos."
"0xd4cd1025" = "Es un hecho bien sabido que muchas de las cosas que hoy damos por sentadas llegaron por primera vez a Europa como resultado del comercio con América. Sin embargo, el intercambio cultural funcionó al revés.<n><n> Por ejemplo, cuando uno visualiza al típico nativo americano de las planicies de Norteamérica, cuesta mucho imaginar que no hubiera caballos en América con anterioridad a la llegada de los españoles y portugueses. Muchos de los nativos americanos huían presas del pánico la primera vez que veían un caballo y su jinete, porque creían que se trataba de una extraña bestia compuesta de dos seres que habían crecido en uno solo.<n><n>El café, que se asocia normalmente a países como Brasil y Guatemala, no es originario de América y antes de llegar allí ya había viajado a través de tres continentes: Desde África (probablemente desde Etiopía) viajó a través de los países árabes antes de alcanzar el suroeste de Europa. La planta se introdujo por vez primera en América durante el siglo XVIII, cuando la creciente popularidad de la bebida hizo necesario aumentar el cultivo de la cosecha.<n><n>Con la patata los europeos habían descubierto en el Caribe un producto de alimentación básico de valor incalculable. Por el contrario, el trigo no se conoció en América hasta la llegada de los españoles y los ingleses, que llevaron este cultivo a Méjico en 1520 y a Virginia en 1777 respectivamente. Aunque la gente creyó en un principio que el clima americano no era el apropiado para cultivar trigo, fue sobre todo Norteamérica la que presenció el fenomenal éxito de este cultivo. Hoy en día, el trigo es el cultivo agrícola con el mayor número de hectáreas en cultivo de todo el mundo."
"0xd4cd1026" = "¿Puedes imaginarte la vida sin chocolate? Pues deberías, porque el cacao se desconocía en el resto del mundo antes del descubrimiento de América. La palabra cacao probablemente deriva de la lengua maya, en la que puede rastrearse su origen por primera vez: Parece un hecho contrastado que los comerciantes mayas ya bebían cacao 400 años antes del nacimiento de Cristo.<n><n>Los aztecas, que eran el poder dominante del continente centroamericano desde el siglo XIV, incluso atribuían al cacao un trasfondo religioso. El primer europeo que entró en contacto con este exquisito manjar fue una vez más Cristóbal Colón, aunque ello ocurrió en un viaje posterior realizado en 1502 que le llevó a Nicaragua.<n><n>Sin embargo, el verdadero \"descubridor\" del cacao es Hernán Cortés, conquistador del reino azteca, que trajo a España la receta de una bebida llamada xocoatl (de ahí la palabra “chocolate”). Al principio su sabor resultó demasiado amargo para el paladar europeo y hubo que esperar a que la gente empezara a añadirle azúcar o vainilla para que el chocolate caliente se convirtiera en una bebida popular entre las clases altas de la Península Ibérica.<n><n>Los españoles se guardaron la receta durante casi cien años, tras lo cual el chocolate caliente se extendió por Francia y el resto de Europa. Aproximadamente en el 1700, los británicos le añadieron leche. La última innovación introducida en Europa con respecto al cacao tuvo lugar con el descubrimiento del delicioso sabor de la mezcla del café y el cacao."
"0xd4cd1027" = "Aunque a veces resulta difícil distinguir entre realidad y leyenda cuando se habla de la piratería, lo que no admite discusión es que había mujeres piratas. Dos de las figuras femeninas más deslumbrantes comenzaron su carrera como piratas en la isla de Jamaica a principios del siglo XVIII.<n><n>Anne Bonney, de quien se decía había sido apuñalada en el estómago siendo aún una niña, se había fugado con un marino al refugio pirata de New Providence (Nassau). Allí se las apañó para deshacerse de su marido e iniciar su propia carrera a bordo de un barco holandés capturado. <n><n>Y allí conoció a Mary Read, que ya había luchado en las guerras españolas de sucesión disfrazada de hombre y de la que se decía mostraba sus pechos a sus adversarios antes de darles muerte para probarles que habían sido vencidos por una mujer.<n><n>Ambas fueron capturadas en 1720 y se libraron de ir al patíbulo porque estaban embarazadas. Les fue mejor que a la mayoría de sus amigos, sobre cuyas cabezas Anne Bonney solo derramó desdén.<n><n>Estas son las palabras que le dirigió al infame “Calico Jack” cuando este iba camino al patíbulo: “Siento verte aquí, Jack, pero si hubieras luchado como un hombre, no te colgarían como a un perro”."
"0xd4cd1028" = "El galés Bartholomew Roberts (1682? – 1722) fue uno de los piratas más importantes y también más peculiares que han existido. Conocido también como “Black Bart” (no confundir con Edward Teach alias “Barbanegra”), se convirtió tardíamente a la piratería, cuando contaba con 37 años de edad, si bien su conversión a la carrera criminal sin duda no fue brusca: El barco en el que trabajaba y que fue atacado en 1719 por su compatriota galés Howell Davis era de hecho un barco de esclavos.<n><n>Roberts decidió unir su suerte a la de Davis, y después de que éste fuera asesinado dos semanas más tarde, asumió el mando de capitán. Se dice que Bartholomew Roberts evitaba el alcohol y prefería el té.<n><n>Contrariamente a Teach, que gustaba de representarse a sí mismo como la encarnación del diablo, Roberts sentía inclinación por la ropa fina, le desagradaba el juego e insistía en que sus hombres dijeran sus oraciones. No obstante, ello no quiere decir en absoluto que Roberts fuera un hombre pío de corazón. Son muchos los relatos que se cuentan sobre las atrocidades que cometió, sobre todo con los prisioneros, durante sus innumerables hazañas de saqueo. Con un total de más de 400 barcos saqueados y un área de operaciones que se extendía desde Brasil hasta llegar a Terranova y África occidental, fue, junto con Henry Morgan, uno de los piratas más célebres de América Central. <n><n>En 1722, el rugido de los cañones procedente de un buque de guerra británico a la altura de la costa de Guinea señaló el fin de su carrera y con ello el de una de las mayores amenazas que surcaban los siete mares."
"0xd4cd1090" = "El corsario más famoso del siglo XVII fue el galés Henry Morgan (1635-1688), quien asedió las colonias españolas de las Indias occidentales e hizo temblar con ello los cimientos de la autoridad de la gran potencia ibérica en la región.<n><n>Su vida ejemplifica la moralidad más bien dudosa que se escondía tras las políticas de Gran Bretaña, Holanda y Francia, que estaban tan encantadas que hacían la vista gorda con respecto a la piratería mientras esta sirviera para infligir daño a las otras grandes potencias.<n><n>Henry Morgan, que fue puesto al mando de un barco corsario en 1668, comenzó primeramente causando estragos a lo largo de la costa norte de Sudamérica. Al mando de casi 2.000 hombres, en agosto de 1670 capturó la ciudad fuertemente defendida de Panamá, y luego se escapó con la mayor parte del botín en el viaje de regreso. Sin embargo, como el ataque tuvo lugar una vez que España e Inglaterra habían firmado un tratado de paz, se le hizo prisionero y fue llevado a juicio en Londres.<n><n>Morgan no fue condenado, muy al contrario: no hubo que esperar mucho para que los vientos de la diplomacia volvieran a cambiar de dirección. Morgan no solo fue absuelto, sino que se le nombró caballero. Sir Henry fue nombrado nuevo gobernador de Jamaica, donde impuso ley y orden estrictos y vivió el resto de su vida como respetado y acaudalado hacendado."
"0xd4cd1091" = "Las Bahamas, que a mediados del XVII y por un breve espacio de tiempo sirvió de refugio para disidentes religiosos procedentes de Inglaterra, se hallaban oficialmente desde 1670 bajo el mando del Conde de Albemarle y de otros caballeros que habían tomado posesión del grupo de islas de manos del rey Carlos II, con la esperanza de sacar beneficios.<n><n>Pero a pesar de sus promesas, estos individuos mostraron poco interés en establecer una administración civil bien organizada. Más bien fue todo lo contrario: al igual que en otros lugares del Caribe, se asentaron en las Bahamas hordas de piratas, sobre todo en la isla de Nueva Providencia, que albergaba la ciudad de Nassau. <n><n>Las bahías poco profundas en las que no podían adentrarse los pesados buques de guerra ofrecían un lugar de atraque ideal para varios cientos de balandros y barcas piratas. Los frecuentes asaltos en aguas españolas derivaron en represalias, y John Wentworth, el primer gobernador, tuvo la nada envidiable tarea de reinstaurar la ley y el orden en las islas.<n><n>Como la situación no mostraba signos de mejora, el rey Jorge I de Inglaterra volvió a confiscar las Bahamas y las convirtió en colonia de la corona. Woodes Rogers, el antiguo corsario y navegante que circunnavegó la tierra, fue nombrado primer gobernador real a mediados de 1718.<n><n>Usando la estrategia de la zanahoria y el palo, puso punto final al caos que había prevalecido hasta entonces. Ofreció una amnistía general a todos los piratas que estuvieran dispuestos a renunciar bajo juramento a sus actividades. Para todos aquellos no tan dispuestos, el castigo les aguardaba en forma de flota de barcos armados hasta los dientes.<n><n>Una vez restablecidas así las condiciones normales, se concedió al grupo de islas su propio parlamento en 1729, y durante los cien años siguientes - excepción hecha de ocasionales disturbios como resultado de invasiones - la historia de las Bahamas transcurrió relativamente sin incidentes."
"0xd4cd1092" = "Prácticamente en todas sus colonias recién adquiridas, los españoles establecieron un rígido sistema social que ofrecía muy pocas oportunidades de ascenso. En lo más alto de la jerarquía se hallaban aquellos compatriotas nacidos en Europa.<n><n> A los españoles nacidos en las colonias se les conocía como criollos; aunque solo se les consideraba de segunda importancia en la jerarquía, ocupaban la mayoría de los puestos menores del estado, la iglesia y el ejército.<n><n>Así pues, los españoles de descendencia europea y los criollos representaban la élite en las colonias. Los niños de matrimonios mixtos entre blancos (hombres en su mayoría) y nativos americanos eran conocidos como mestizos. Los nativos americanos, que originariamente poseían la tierra, ocupaban la posición más baja de la sociedad, y en las zonas en las que los europeos los habían exterminado por completo, tal honor les estaba reservado a los esclavos negros.<n><n>La proporción relativa de estas clases entre la población difería mucho entre las diversas regiones del imperio español. En Méjico, por ejemplo, los mestizos conformaban el mayor sector de la población. En muchas islas había esclavos negros en número superior (y a merced de sus amos). Las tribus nativas americanas también lograron sobrevivir en aquellas zonas donde las selvas, los pantanos y las regiones montañosas ofrecían un retiro seguro, como por ejemplo en Bolivia o Florida."
