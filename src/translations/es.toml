"0xdbd3f83d" = "%1,<n>¿Qué quieres de mí? Si hubieras arribado a mi ciudad como un verdadero marino, hubiera dirigido mis cañones contra ti, pues eres enemigo de mi país.<n><n> Pero ahora que estás aquí, debo comportarme como un caballero."
