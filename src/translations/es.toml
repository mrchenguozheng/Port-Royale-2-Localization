"0x0ce1a79e" = "Te encuentras en la ciudad colonial de Santa Marta. Pincha sobre el nombre de la ciudad para ver la información relativa a la misma."
"0x0ce1a79f" = "Las ciudades coloniales como Santa Marta pueden producir dos productos de primera necesidad, dos materias primas y un producto colonial.<n>En la última campaña averiguaste que en las ciudades con gobernador hay mucha demanda de materias primas y productos coloniales.<n>El primer producto colonial que quieres producir es el cacao.<n>Cierra la información de la ciudad."
"0x0ce1a7a0" = "Como los productos coloniales se envían a Europa desde las ciudades con gobernador, en ellas hay mucha demanda de cacao. Estas condiciones son buenas para tu primer negocio. Ahora, localiza el edificio del maestro constructor en el centro de la ciudad, y pulsa sobre él."
"0x0ce1a7a1" = "En el edificio del maestro constructor podrás solicitar un permiso de construcción para levantar un edificio nuevo.<n>Como verás, puedes elegir el tipo de edificio a construir usando los botones verticales a la izquierda del minimapa. Selecciona el tercer botón (negocios).<n>Pulsa sobre el botón Plantación de Cacao."
"0x0ce1a7a2" = "Ahora puedes ver qué materiales de construcción se necesitan y en qué cantidades, además del coste total de la construcción.<n>También puedes ver cuántos de los materiales de construcción están disponibles en tu almacén y cuántos tendrás que comprar en la ciudad, en caso de que estén disponibles.<n>De momento tienes suficientes materiales.<n>Coloca el cursor sobre un terreno donde se pueda construir (lo sabrás porque el puntero se pondrá verde) y pulsa el botón izquierdo del ratón."
"0x0ce1a7a3" = "Ahora se muestran los andamios de la planta de producción de cacao y comienza la construcción.<n>La construcción durará un par de días. Mientras tanto, tienes que buscar alojamiento para tus nuevos trabajadores.<n>Cierra el menú de Construcción, busca una zona residencial en Santa Marta y pulsa sobre ella. "
"0x0ce1a7a4" = "Esta zona residencial pertenece a un comerciante de la ciudad. Puedes comprobar cuántas zonas residenciales son propiedad de los comerciantes locales y cuántos inquilinos tienen. Pero lo que quieres ahora es construir tu propia zona residencial. Para hacerlo, abre el menú de construcción pulsando sobre el maestro constructor."
"0x0ce1a7a5" = "Elige una zona residencial en el menú de construcción y mira la ventana con los costes de construcción. <n>Puede que no tengas suficiente material de construcción en el almacén, pero puedes comprar los materiales que necesites en la ciudad siempre que haya suficientes existencias. <n>Si no hay, tendrás que buscarlas en otra ciudad.<n>Después, construye una zona residencial."
"0x0ce1a7a6" = "Un negocio puede emplear hasta a 30 trabajadores. Dado que la familia media de un trabajador se compone de cuatro miembros, por cada negocio que establezcas necesitarás 120 alojamientos. <n>Una zona residencial tiene espacio para 120 inquilinos, por lo que para cada negocio hace falta una zona residencial.<n>Ahora, cierra el menú de Construcción y pulsa sobre tu nueva zona residencial."
"0x0ce1a7a7" = "Las zonas residenciales no tienen determinado un plazo de construcción, porque al principio los inquilinos viven en tiendas.<n>Los propios inquilinos van convirtiendo la zona residencial en un edificio bastante grande.<n>El aspecto de una zona residencial depende de su antigüedad y de la situación económica de la ciudad.<n>Cierra el cuadro de diálogo de la zona residencial."
"0x0ce1a80f" = "Como sabes, tu primer edificio en una ciudad ha de ser siempre un almacén: No puedes construir ningún otro edificio mientras no hayas construido un almacén.<n>En la ciudad donde comienzas el juego siempre cuentas con un almacén ya construido. Localízalo en el mapa y pulsa sobre él. Es la que aparece en azul claro en el minimapa de la ciudad."
"0x0ce1a810" = "En la ventana del almacén podrás ver los edificios que tienes en la ciudad y lo que te cuesta mantenerlos.<n>También puedes ver la renta que te pagan tus inquilinos y qué mercancías producen tus negocios.<n>Después podrás darle instrucciones al encargado.<n>Echa un vistazo por el almacén y después ciérralo."
"0x0cee08cc" = "la presencia militar en esta ciudad podría ser mejor;"
"0x0cf75014" = "Cerrar"
"0x0cf7abef" = "Pulsa en tu plantación de cacao. La ventana de acciones siempre muestra todas las plantaciones de cacao que tienes en la ciudad.<n>Cuando hayas construido las instalaciones de producción, necesitarás 30 trabajadores; es decir, 30 colonos. Ahora, sal de la plantación, dirígete a la lonja del puerto y pulsa el botón \"Productos - Dotación\" (el botón de la parte inferior derecha de la ventana de acciones) para ver la dotación de la nave y sus pasajeros."
"0x0cf7abf0" = "Aquí podrás ver si hay colonos buscando trabajo en la ciudad, o si la ciudad necesita nuevos trabajadores. Esto último es lo que pasará cuando haya concluido la construcción de tu negocio.<n><n>Dirígete a las ciudades con gobernador más cercanas y trae colonos a Santa Marta hasta que tu negocio tenga una cuadrilla completa de trabajadores."
"0x0d0db040" = "Pincha en una de tus plantaciones de cacao."
"0x0d0db041" = "Ahora puedes ver cuánto cacao produce tu negocio al día y cuántas herramientas necesita.<n>Deberás acumular una reserva de @a$SubGoal$ herramientas en tu almacén; de allí es de donde se surten tus negocios de las mercancías que necesitan para realizar la producción. Si las mercancías necesarias se agotan en tu almacén, la producción se detendrá."
"0x0d0db042" = "Las herramientas son productos de importación. Esto significa que en las ciudades con gobernador es donde encontrarás la mayor reserva al mejor precio.<n>Puedes intentar conseguirlas en [town:Cartagena] al suroeste o en [town:Margarita], bastante al este."
"0x0d0db043" = "¡Perfecto!<n>Cuanto menor sea el precio al que consigas las materias primas o herramientas que compres para tus negocios, menores serán los costes de producción de las mercancías que produces y mayor beneficio podrás obtener de ellas.<n>Ahora, sigue produciendo cacao hasta que tengas una reserva de @a$AmountGoal$ en tu almacén."
"0x0d0f1795" = "Julio"
"0x0d0f1877" = "Junio"
"0x0d1098bd" = "%1,<n>eres nuevo aquí, ¿verdad? Pero ya he oído hablar de ti, y tu fama te precede. Ven a verme de vez en cuando, pues siempre hay trabajo por hacer."
"0x0d23b491" = "Navega con tu convoy hasta la ciudad de [town:Cartagena] y entra en ella.<n>Bajo el nombre de la ciudad, a su derecha, se desplegará un símbolo en forma de círculo.<n>Este círculo comienza siendo rojo para cualquier ciudad y va cambiando poco a poco a verde. De esta forma podrás consultar tu historial comercial en [town:Cartagena] hasta la fecha.<n>Ahora, abre la información de la ciudad."
"0x0d23b492" = "En el \"Historial Comercial\" podrás consultar qué porcentaje de la puntuación necesaria has conseguido hasta el momento. Si aparece el 100% podrás solicitar un permiso de construcción al maestro constructor.<n>Cierra la información de la ciudad."
"0x0d23b493" = "Los precios de las mercancías que escaseen en una ciudad se muestran en rojo en la ventana de comercio. Vendiendo estas mercancías a la ciudad mejoras su suministro y mejorarás tanto tu historial comercial en la ciudad como tu reputación con la nación a la que pertenezca.<n>Pincha una vez en la lonja para ver la información sobre la reserva de mercancías de la ciudad."
"0x0d23b494" = "Fíjate en qué mercancías faltan en la ciudad. Por ejemplo, en la ciudad siempre hará falta azúcar y algodón porque en ella se produce ron y ropa.<n>Pero también hay otras mercancías que escasean en la ciudad.<n>Dirígete a otras ciudades para comprar las mercancías que necesite [town:Cartagena] para mejorar tu historial comercial."
"0x0d23b495" = "¡Muy bien! Has incrementado considerablemente tu perfil en [town:Cartagena].<n>¡Pero ten cuidado de no acabar con las mercancías que escaseen en [town:Cartagena]! Los bienes que escasean se pueden reconocer fácilmente porque su reserva se muestra en rojo.<n>Incrementa tu puntuación de historial comercial al 85%."
"0x0d23b496" = "¡Así se hace! Ahora tienes una puntuación del 85% en [town:Cartagena]. ¡Sigue así!<n>Incrementa tu puntuación al 100%.<n>Por cierto, acabas de recibir un mensaje sobre \"promoción y rangos\"."
"0x0d23b497" = "¡Fenomenal! Ya has comerciado suficiente con [town:Cartagena].<n>Pero ahora hay otra tarea que hacer antes de poder conseguir tu permiso: Tu rango todavía es Marinero, así que sólo puedes conseguir un permiso de construcción.<n>Incrementar tu riqueza comerciando un poco más para promocionarte al siguiente rango. "
"0x0d23b498" = "¡Muy bien! Siendo Marino puedes conseguir dos permisos de construcción.<n>Ve a ver al maestro constructor de [town:Cartagena] y solicita un permiso de construcción.<n>Si no tienes suficiente oro tendrás que seguir comerciando. No te olvides de comerciar con las mercancías que produces en Santa Marta y que se van acumulando en tu almacén en aquella ciudad."
"0x0d2a3b89" = "Mantenimiento de barcos"
"0x0d39b8e2" = "Antes de poder construir otros edificios tienes que edificar un almacén en [town:Cartagena]."
"0x0d39b8e3" = "Ahora crea dos telares y construye dos zonas residenciales.<n>Si no hay suficiente material de construcción en la ciudad tendrás que comprarlo en otra y llevarlo a tu almacén. <n>¡No te olvides de negociar un buen precio!"
"0x0d39b8e4" = "Asegúrate de contar en el almacén con @a$SubGoal$ reservas de algodón para que cuando estén construidos, los telares puedan empezar directamente a hacer la ropa."
"0x0d39b8e5" = "Tu próximo objetivo consiste en producir tu propia reserva de @a$SubGoal$ de ropa para el almacén de [town:Cartagena], aunque deberás esperar a que estén construidos tus telares.<n>Para producir @a$SubGoal$ de ropa, necesitas exactamente @a$SubGoal$ de algodón."
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Militar<t>Tu convoy<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Pirata<t>Tu convoy<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "¡La partida guardada no es válida!"
"0x0d496e89" = "Pincha sobre los productos para activar o cancelar su compra."
"0x0d496e8a" = "Compra automática por parte del encargado"
"0x0d4fbd33" = "¡Muy bien!<n>Ahora deberías crear una plantación de algodón en Santa Marta para asegurarte de tener siempre suficiente materia prima para tus telares.<n>Una planta de producción puede suministrar suficiente materia prima para dos plantas de fabricación."
"0x0d4fbd34" = "Ahora asegúrate de que tus negocios de Santa Marta y [town:Cartagena] funcionen a pleno rendimiento.<n>No olvides que tus telares de [town:Cartagena] necesitan un suministro constante de algodón.<n>Sigue comerciando y vendiendo las mercancías que produces.<n>Esta campaña terminará en cuanto tengas @g$GoldGoal$."
"0x0d552127" = "La ciudad no puede ser atacada."
"0x0d578089" = "Ya has atacado la ciudad de %1 en el transcurso de los 30 últimos días. Por razones morales, el capitán se niega a atacarla de nuevo."
"0x0d58ea99" = "El corsario %1 %2 ha ahuyentado a %3 trabajadores y a sus familias. Muchos negocios de la ciudad han dejado de funcionar a plena capacidad."
"0x0d750c45" = "%1 convoyes"
"0x0d919a5a" = "%1,<n>sabes muy bien que en circunstancias normales te mandaría al infierno, pero en tiempos tan difíciles como estos sería capaz de vender mi alma al mismísimo diablo.<n><n>Así que entra, tengo algo que decirte."
"0x0d9c1799" = "Tu misión consiste en asegurar que la situación económica de la ciudad de @T$TargetTown$ descienda a “Recesión” antes del @D$EndDate$. Tienes dos opciones:<n><n>Puedes atacar la ciudad y saquear todos los productos para provocar una situación económica de “Recuperación” y conseguir así que la situación económica de la ciudad siga cayendo debido a la escasez de productos.<n><n>O bien puedes cortar el suministro de productos a la ciudad interceptando los convoyes comerciales. Ten en cuenta que si solo saqueas un convoy y no lo capturas, tu reputación en la nación en cuestión se resentirá en mucho menor grado."
"0x0d9c179a" = "¡Bien! Te asigno la misión de conseguir que la situación económica de @T$TargetTown$ caiga a un estado de “Recesión”. Tienes hasta el @D$EndDate$.<n><n>Para lograr tu objetivo, debes interceptar a todos los comerciantes que visiten la ciudad de forma que esta no reciba más productos y que su situación económica empeore lentamente.<n><n>No obstante, existe una forma de conseguirlo más rápidamente. Ello implica atacar y saquear la ciudad. Tu ataque provocará que la situación económica caiga rápidamente a “Recuperación” y la escasez resultante de productos en la ciudad hará que caiga aún más hasta que la ciudad esté en “Recesión”."
"0x0daa656f" = "Metralla"
"0x0dbd9444" = "No hay nada que puedas hacer por mí."
"0x0dbd9445" = "Lamentablemente, no tengo nada nuevo que contarte. Vuelve a intentarlo en otra ocasión."
"0x0dbd9446" = "Me temo que no tengo ninguna misión para ti. Vuelve dentro de unos días."
"0x0dc7ffd3" = "Está atacando un pirata"
"0x0de467bb" = "Organizador del banquete de boda"
"0x0e141340" = "Arma tu convoy de forma que disponga como mínimo de tres barcos escolta de tipo fragata o superior, perfectamente armados y con toda su tripulación."
"0x0e2cf5dd" = "Comercio y producción"
"0x0e321cfd" = "Mantenimiento del barco"
"0x0e539993" = "Batallas navales"
