"0x3641d8d1" = "Gracias por devolverme a mi esposa. Aunque he disfrutado mucho de la paz y la tranquilidad de estos últimos días, no podía simplemente abandonar a mi esposa en manos de mis enemigos. Como recompensa, toma este mapa que muestra un escondite con @a$Amount$ de mercancías."
"0x3641d8d2" = "Así que no me has devuelto a mi esposa. Entonces no puedo recompensarte. Sin embargo, entre tú y yo, en realidad te estoy muy agradecido."
"0x36573a59" = "Tus tropas pronto llevan la voz cantante. De repente se alza una bandera blanca sobre la muralla: la guardia de la ciudad ha capitulado.<n><n>¿Qué quieres hacer ahora?"
"0x3657dd22" = "Mi esposa está fuera de sí de alegría porque has encontrado a su perro. Toma este mapa que muestra un escondite con @a$Amount$ de mercancías."
"0x3657dd23" = "¿Qué? ¿Quieres decir que arrojaste el perro por la borda? Aun así te estoy muy agradecido. Naturalmente, no puedo recompensarte oficialmente, pero en su día escondí un tesoro en un lugar secreto. Aquí tienes un mapa."
"0x366de173" = "Oh, gracias por traerme de vuelta a mi querida hija. Aquí tienes un mapa. En él he marcado el lugar donde en su día escondí mucho tesoro."
"0x366de174" = "¡Qué has hecho! ¿Cómo has podido dejar a mi hija en manos del enemigo? ¡Le diré a todo @n$Nation$ que no se puede confiar en ti! (La reputación en @n$Nation$ ha disminuido)"
