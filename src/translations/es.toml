"0x0479b6bb" = "Partida guardada"
"0x0480889b" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Has encontrado un inmenso escondite de productos en el lugar que describió el náufrago. Sin más preámbulos, cargas los productos a bordo."
"0x0480889c" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Has encontrado un inmenso escondite de productos en el lugar que describió el náufrago.<n>Lamentablemente, tu convoy ya no cuenta con más espacio libre a bordo, así que por el momento tendrás que dejar los productos donde están."
"0x04825ba0" = "El convoy no puede zarpar porque en la actualidad está siendo reparado en el astillero. Espera hasta que las reparaciones hayan concluido."
"0x04b51123" = "Lo siento, me temo que ya no puedo encomendarte esta misión. Has tardado demasiado en considerarlo."
