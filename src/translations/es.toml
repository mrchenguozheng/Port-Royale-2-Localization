"0xd44a911d" = "¡Enhorabuena! Ya tienes algo de experiencia en la producción de mercancías. También habrás notado que no siempre es fácil vender con beneficio las mercancías que produces mientras mantienes tu negocio a flote comerciando otras mercancías.<n><n>Si estableces negocios en escenarios posteriores o en el modo de juego libre, siempre debes asegurarte de poder vender con beneficio las mercancías producidas. Producir mercancías es caro y no siempre es fácil encontrar las materias primas.<n><n>Por eso, primero deberías aumentar tus reservas financieras comerciando y luego empezar muy gradualmente a producir mercancías. "
