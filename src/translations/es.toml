"0x077030da" = "¡Enhorabuena! Ha completado con éxito este escenario y ahora tiene algo de experiencia en batallas navales y ataques a puertos.<n><n>Asegúrese siempre de que sus barcos de escolta estén bien armados antes de atacar otro convoy. Naturalmente, también debería pensarlo muy bien antes de decidir qué convoyes atacar. Los convoyes de transporte procedentes de Europa y los convoyes militares son siempre muy poderosos, y los piratas a veces también pueden convertirse en adversarios poderosos.<n><n>Si ataca a comerciantes sin haber obtenido antes una patente de corso del gobernador de una nación, eso influye enormemente en su reputación con todas las naciones. En el peor de los casos, convoyes militares poderosos perseguirán su convoy.<n><n>Un consejo: si apresa un convoy comercial sin hundir sus barcos y solo lo saquea, el impacto negativo en su reputación es mucho menor. "
