"0xfeab2fe1" = "Bien. El convoy de transporte saldrá del puerto de @T$TOWN$ el @D$DepartDate$. Navega por delante de él en dirección a Europa y asegura su ruta. Mantente muy atento a los convoyes militares de @n$HostileNation$. Tu misión se cumplirá si el convoy consigue abandonar las aguas del Nuevo Mundo sin ser atacado."
"0xfeab2fe2" = "Te estoy muy agradecido. Un convoy de transporte partirá de mi puerto el @D$DepartDate$. Quiero que lo protejas de los convoyes militares de @n$HostileNation$ y te asegures de que llega sano y salvo a Europa."
"0xfeab2fe3" = "Eres un hombre de acción. Un convoy de transporte llegará aquí en breve y partirá del puerto hacia Europa el @D$DepartDate$. Navega por delante y asegura su ruta para proteger el convoy de un ataque."
"0xfeadceb1" = "En la demo, solo puedes entrar en las ciudades que ya se mostraban al inicio del juego.<n><n>Sin embargo, puedes comerciar con cualquier ciudad enviando un convoy a la ciudad y haciendo clic derecho sobre ella mientras el convoy está seleccionado."
