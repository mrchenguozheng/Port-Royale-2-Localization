"0xe38974d7" = "Balance:"
"0xe3922641" = "La aguja de esta brújula tiene mucha libertad de movimientos y marca rápidamente la posición. Nunca antes habías visto una tan exacta.<n>La brújula ha sido fabricada a modo de pieza de joyería y su cara inferior contiene varios grabados."
"0xe3922642" = "El compás se adapta perfectamente a la mano y es muy fácil de usar. Aparentemente la pieza está totalmente fabricada en oro y está decorada con intrincados entramados."
"0xe3922643" = "Este sextante proporciona un rumbo preciso incluso en condiciones de mar gruesa. Algunas de las piezas del sextante se encuentran colocadas sobre unos muelles que permiten reducir las vibraciones fuertes."
"0xe3922644" = "Este doble catalejo permite ver en la distancia con ambos ojos a la vez. Puedes colocar cristales tintados sobre las lentes para protegerte los ojos. En uno de los lados se aprecia un misterioso grabado."
"0xe3922645" = "Se trata de un reloj de oro corriente, aunque más pequeño que cualquier otro que hayas podido ver. En uno de los discos situados tras la esfera se ve una luna que parece rotar lentamente. En el reverso del reloj se aprecian también algunos grabados."
"0xe3922646" = "Aunque a simple vista esta lámpara parece un farol normal y corriente, los cristales dispuestos alrededor de la mecha permiten que la luz brille únicamente en una dirección. Utilizando un instrumento semejante a un abanico desplegado sobre la apertura, puedes encender y apagar la luz con gran rapidez."
"0xe3922647" = "Una regla que se desliza de un lado a otro dentro de otra regla y sobre éstas, una escuadra deslizable. Este instrumento permite realizar cálculos simples con enorme rapidez."
"0xe3922648" = "Este extraño instrumento parece una flecha. Sus palas hacen que se ponga a rotar tan pronto como se introduce en el agua. Un pequeño cuadrante cuenta las revoluciones, permitiendo así calcular la velocidad del barco con gran precisión."
"0xe3922649" = "Este instrumento se compone de unas palas giratorias y de un cuadrante que muestra la velocidad giratoria de las palas. Al colocar dichas palas contra el viento, puedes leer la dirección y la velocidad del viento. El instrumento es fruto de un meticuloso trabajo de artesanía y está marcado con un símbolo desconocido."
"0xe392264a" = "Aunque es evidente que esta cuerda ha debido permanecer en el agua durante cierto tiempo, parece completamente nueva, es suave y permite hacer nudos fuertes."
"0xe39226b2" = "Un libro que contiene multitud de cartas estelares. Le acompañan tablas muy completas que especifican cuándo y dónde se alza y cae cada estrella."
"0xe39226b3" = "Un disco redondo, con refinados grabados, sobre el que se han colocado diversos discos más pequeños. Podrías utilizarlo para saber qué parte del cielo estrellado se encuentra visible en cada día y hora.<n>Las marcas del disco indican que se usó en su día para establecer la posición de un barco en una determinada región."
"0xe39226b4" = "Al girar la llave, un gran cuerno reproduce la agradable melodía del cántico de una mujer. El mayor consuelo para unos marineros que llevan semanas sin avistar tierra."
"0xe39226b5" = "Al colocarlo sobre un mapa, este gran cristal redondo montado sobre una varilla de oro permite ver claramente las líneas más finas incluso con poca luz."
"0xe39226b6" = "Esta pequeña mesa de metal es de bronce macizo y ha sido diseñada de tal modo que su superficie permanece siempre horizontal, al margen de la inclinación del barco. El anillo exterior de metal está grabado con marcas que parecen indicar las direcciones. Sin embargo, no es posible identificar la región en la que esta mesa se usó en su día."
"0xe39226b7" = "Una pequeña caja que contiene un instrumento ornamentado que sirve para encender fuego con enorme facilidad. La caja está recubierta de misteriosos grabados."
"0xe39226b8" = "Esta ancla es más decorativa que práctica. En el mejor de los casos, podría utilizarse para anclar un bote de remos.<n>Resulta enormemente pesada para lo pequeña que es y está revestida con complicados adornos y ornamentada con una inscripción enigmática."
"0xe39226b9" = "Este instrumento parece una lámpara de aceite con su propio mecanismo de encendido. Si giras la ruedecilla, la piedra de sílex produce unas chispas que alcanzan la mecha y permiten encender una llama incluso en condiciones de fuerte ventisca."
"0xe39226ba" = "Este cuerno no se sopla con la boca, sino con un instrumento similar a una bomba. Si lo aprietas con fuerza, el cuerno suena mucho más alto de lo que uno hubiera podido imaginar a simple vista."
"0xe39226bb" = "Este mapa no se parece a las cartas de navegación habituales. Es un mapa en gran detalle dibujado con varios colores. Sin embargo, no puedes identificar la zona que se muestra en el mapa."
"0xe39bb702" = "El convoy no puede zarpar porque lleva demasiados cañones a bordo. Para no exceder el número máximo de cañones permitidos, vende algunos o trasládalos a tu almacén."
