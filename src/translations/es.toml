"0x03b332c8" = "Andreas Traxler"
"0x03b7e5f8" = "La ciudad necesita colonos urgentemente."
"0x03c5bef1" = "<n><n>Tu convoy ha sido dispersado."
"0x03cad242" = "Préstamo amortizado"
"0x03ce7c8e" = "Objetivo de la campaña"
"0x03d3dcd8" = "Mientras saqueaban la ciudad, tu tripulación también descubrió dónde se escondía la mujer del gobernador y la “liberaron”. Estaba en la cocina en ese momento.<n>“¡No me lleven de vuelta con el gobernador de @T$TOWN$! Nunca le he amado, ¡lo juro!”.<n><n>¿Quieres llevarte a esta mujer contigo y entregársela de vuelta al gobernador a pesar de sus súplicas? "
"0x03d3dcd9" = "Mientras saqueaban la ciudad, tus hombres se encontraron con un muchacho que llevaba un caniche. El chico afirmó que el gobernador de @T$TOWN$ simuló él mismo el secuestro para deshacerse del perro. El capitán decide llevar a Cuqui a bordo de su barco. Luego se pregunta si merece la pena devolverle el perro al gobernador de @T$TOWN$.<n><n>¿Quieres tirar al perro por la borda?"
"0x03d6dcdb" = "La caza del pirata"
"0x03dfeb8d" = "<c><o:0xFFFFE6A0>%1<n><o:0xFFEBF0A0>(tu ciudad)"
"0x03e1b0eb" = "¡Qué mala suerte! Debo contar con existencias regulares de productos coloniales para los convoyes de transporte procedentes de Europa, pero en primer lugar carecemos de las herramientas para poder fabricar estos productos. ¿No querrías ayudarme a suministrar herramientas a la ciudad?"
"0x03e1b0ec" = "¿Cómo ha podido pasar esto? Se han interrumpido los suministros de herramientas a @T$DestTown$ y las existencias de la ciudad están bajo mínimos. Ahora la fabricación de productos coloniales está amenazada. ¿Me ayudarás a resolver este dilema?"
"0x03e1b0ed" = "Mi nación está sufriendo un desabastecimiento de herramientas. Deberíamos obtenerlas de otras naciones. ¿Qué piensas que podría hacerse?"
"0x03e9fe1e" = "Misterio en [town:Tortuga]"
"0x03efad5a" = "No hay mensajes"
"0x03efff11" = "¡Me has hecho tan feliz! ¡Corre a presentarte ante mi padre! ¡Le llenarás de dicha!"
"0x03f2ddbd" = " Hola, @A$USER$; ven aquí y siéntate, tengo algunos asuntos que discutir contigo.<n>Estoy intentando comprar @G$Goods$ para @n$HostileNation$. Como sabes, @n$Nation$ y @n$HostileNation$ están en guerra. De hecho, dado que ahora en @n$HostileNation$ es un delito punible importar @G$Goods$ de @n$Nation$, se están pagando muy buenos precios. Así que, ¿Estarías interesado en hacer un poco de contrabando?"
"0x03f2ddbe" = " Hola, @A$USER$. ¿Estarías interesado en un negocio realmente lucrativo? Estoy aquí en representación de un comerciante de @T$TargetTown$. Debido a la guerra, actualmente no puede transportarse ningún producto desde las ciudades de @n$Nation$ a @T$TargetTown$. El hombre que me envió está interesado en hacerse con @G$Goods$. Te pagará @g$Price$ por cada barril que le entregues. Efectivamente, hablamos de contrabando. ¿Qué contestas?"
"0x03fb5c67" = "Hoy %3 de tus negocios en %2 han sido expropiados por la pésima relación que mantienes con %1."
"0x03fb5c68" = "<n>Te sugiero que hagas una visita a uno de mis gobernadores para mejorar tus relaciones con mi país."
"0x03fb5c69" = "<n>Te sugiero que vengas a verme para hablar de tu relación con mi país."
"0x03fb5c6a" = "<n><n>%1, virrey de %2"
"0x04081363" = "Uno de mis rivales de @n$HostileNation$ ha conseguido hacerse con mis diarios y ahora quiere enviarlos a Europa. Es fundamental que no lo consiga, pues su contenido no debe caer en manos enemigas. Por suerte, pude sobornar al timonel del barco que lleva los diarios a Europa. Ahora necesito tu ayuda."
"0x04081364" = "@n$HostileNation$ nos ha estado espiando durante mucho tiempo. He descubierto que toda la información recabada ha sido registrada cuidadosamente y va a ser enviada a Europa desde @T$HostileTown$. Quiero que me ayudes a evitar que estos documentos lleguen a salir del Caribe."
"0x040bf5f1" = "Aceptar juego"
"0x04100fa0" = "%1: Ataque pirata."
"0x0420c2a2" = "<ts:20>Ya sabes cómo comprar y vender mercancías en la ventana de Comercio, pero seguro que estos trucos te resultan útiles:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>El precio que se muestra en las flechas depende del tamaño de la unidad de intercambio que selecciones<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Da igual si compras o vendes una mercancía 10 veces o si compras o vendes 10 mercancías sólo una vez. El precio total es el mismo, pero puede que comprar 5 barriles salga rentable y, sin embargo, al comprar 10 provoquemos escasez y salga mucho más caro.<n><n><g:INTEXT_AUSRUF_800x600.screen>Los precios provechosos de compra y venta de los artículos son iguales entre artículos del mismo grupo (Primera necesidad, materias primas, manufacturas, artículos coloniales e importaciones).<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>También puedes comerciar pulsando sobre el símbolo de una mercancía. Al hacerlo aparecerá una ventanita con una barra de desplazamiento. Puedes usar esta barra de desplazamiento para especificar la cantidad de mercancías que quieres comprar o vender. En ese momento se mostrarán inmediatamente tanto el precio individual como el precio total."
"0x0424bb9a" = "Crónica"
"0x0436c531" = "¡Has dado con un barco muy especial!<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Barco de vapor<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>¡Nunca antes habías visto un barco así! Aparentemente, no son sólo las velas de sus mástiles gemelos las que impulsan el barco, sino un curioso mecanismo que utiliza vapor para impulsar dos ruedas con palas. De esta forma, el barco se mueve aunque no sople una brizna de viento."
"0x044bc6d2" = "Tu capitán ha derrotado a %1 en justo duelo. Tus hombres se disponen a buscar el tesoro de los piratas y encuentran %2.<n><n>Has destruido la guarida y puesto fin a la carrera del pirata %3. "
"0x044bc6d3" = "Tu capitán ha derrotado a %1 en justo duelo. Tus hombres comienzan a buscar el tesoro del pirata y encuentran %2. Aunque has acabado con la guarida de los piratas y eliminado el peligro que presentaba, todo indica que no has acabado con todos sus barcos. Es posible que los barcos que quedan busquen una nueva guarida."
"0x044e52eb" = "Campañas"
