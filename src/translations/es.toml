"0xe10e4380" = "Se ha acabado el tiempo sin que alcanzases el objetivo final de la campaña.<n><n>En cualquier otra partida, puedes recibir una hacienda de manos de un virrey. Pero para ello tienes que capturar ciudades y, por tanto, se resentirá tu reputación entre las otras naciones. <n><n>Todo lo que hayas aprendido en esta campaña sobre el desarrollo de tu ciudad también te servirá para desarrollar negocios en otras ciudades. La principal diferencia estriba en que no tienes que preocuparte de defender esas ciudades."
"0xe10f2f85" = "¡Bien! Estoy deseando hacer negocios contigo.<n>Entrega tanta cantidad de @G$Goods$ como puedas en el mercado de @T$TOWN$. Estaré allí recibiendo diversas entregas y te pagaré @g$Price$ inmediatamente.<n>El convoy de la expedición llegará aquí el @D$EndDate$. Asegúrate de que este convoy llega sin sobresaltos a Europa y te pagaré el resto del oro."
