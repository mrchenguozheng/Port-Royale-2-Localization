"0x34d36971" = "Algunos aspectos de la ruta comercial tuvieron que modificarse.<n><n>En este juego, algunas de las ciudades de la ruta aún no han sido descubiertas y se han eliminado, o bien quieres comerciar mercancías en una ciudad, pero no hay almacén en esa ciudad. En ese caso, el comercio del capitán para la ciudad correspondiente se activa para las mercancías en cuestión."
