"0x35353f8f" = "Saquea la ciudad de @T$TargetTown$, que pertenece a @n$HostileNation$, y libera a la esposa del gobernador antes de @D$EndDate$."
"0x35353f90" = "La perrita Michelle, mimada mascota del gobernador de @T$TOWN$, está retenida en @T$TargetTown$. Saquea la ciudad y rescata al animal antes de @D$EndDate$."
"0x35353f91" = "Ataca la ciudad de @T$TargetTown$, que pertenece a @n$HostileNation$, antes de @D$EndDate$ para liberar a la hija menor del gobernador."
"0x35392fbd" = "¡Enhorabuena! Has completado con éxito tu primer escenario. Ahora sabes cómo seleccionar convoyes y enviarlos a otras ciudades. También has aprendido a entrar en los edificios de una ciudad para realizar diversas acciones, como comprar un barco.<n><n>La siguiente parte trata de ganar dinero comerciando con beneficio."
"0x353a3e45" = "Bibliotecas 2D y herramientas de pantalla"
"0x353cae5f" = "…a los numerosos participantes del foro de [ref:Port Royale], cuyas ideas y sugerencias hicieron posible la segunda parte de [ref:Port Royale].<n>...a los probadores beta de [ref:Port Royale] 2, que mostraron un compromiso incansable con el proyecto durante la prueba beta abierta. Nicole Jeannette Pescher, Don Geraldo y BMP, por los logotipos que enviaron."
"0x35450579" = "He examinado los nuevos artefactos y creo que los grabados indican un lugar concreto. %1 Pero aún no estoy seguro. Esperemos que encuentres aún más artefactos, porque estoy seguro de que podré precisar mejor la ubicación."
"0x3545057e" = "He averiguado algo más sobre los artefactos y el lugar especial. Una cosa ya puedo afirmar con certeza: %1 Qué guarda ese lugar, no lo sé. Para localizar la posición con más precisión, necesito más artefactos."
"0x354505ea" = "Tengo muy buenas noticias: con el último artefacto que encontraste, he podido determinar una posición exacta. Toma, te la marcaré en la carta náutica. %1<n>Ten cuidado, pues nadie sabe qué aguarda allí."
