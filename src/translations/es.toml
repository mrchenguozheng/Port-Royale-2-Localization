"0x070bef26" = "[term:de_general]"
"0x070c60f9" = "Te lo agradezco. Por favor, tráeme @a$Amount$ barriles de @G$Goods$. Tienes hasta el @D$Date$ para entregar los productos en el mercado. Allí recibirás @g$GoldPerBarrel$ por cada <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fa" = "Por favor, entrega @a$Amount$ de @G$Goods$ a mis emisarios en el mercado. Tienes hasta el @D$Date$. A la entrega recibirás @g$GoldPerBarrel$ por cada <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fb" = "Recorre las ciudades que pertenecen a @n$FoeNation$ y hazte con @G$Goods$. Entrega @a$Amount$ barriles de la mercancía en el mercado de mi ciudad antes del @D$Date$. Recibirás @g$GoldPerBarrel$ por cada <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x0710eed4" = "<n><n>Al cerrar esta ventana finalizará la campaña."
"0x0711985e" = "La Pocha del Pirata"
"0x07124c09" = "Objetivo no alcanzado"
"0x07242fbe" = "Trabajadores"
"0x07246168" = "Reparar "
"0x072a9579" = "Te estoy muy agradecido por haberme traído los productos importados, pues hace ya muchas semanas que los convoyes de transporte de mi nación no nos abastecen. Como recompensa, acepta por favor los dos filibotes mercantes que te aguardan en el puerto."
"0x0744a699" = "No puedo decirte cuántas ciudades más visitará la flota del Tesoro. Lo único que podemos decir con seguridad es que la flota lleva más oro a bordo con cada ciudad que visita. No me importa cuándo ataques, el oro que saques en limpio es cosa tuya. Todo lo que quiero que hagas es asegurar que la flota y sus riquezas nunca lleguen a España. Estuvo por última vez en @T$StartTown$. Mis informadores aseguran que su próximo puerto de escala es @T$DestTown$, donde permanecerá anclada unos cinco días."
"0x0744a69a" = "Así que debes actuar con rapidez. La última vez estaba en @T$StartTown$, desde allí se puso en camino a @T$DestTown$, donde permanecerá anclada más tiempo del habitual. Cuanto más aplaces tu ataque, más oro llevará a bordo. Puedes quedártelo todo, pero la flota del Tesoro nunca debe llegar a Europa."
"0x0744a69b" = "Queda entonces acordado, gracias. Si mi información es correcta, la flota del Tesoro partió hace poco tiempo de @T$StartTown$ y se halla camino de @T$DestTown$. Allí permanecerá anclada más tiempo del habitual. ¡Apresúrate ahora e intercéptala!"
"0x0746253d" = "Para que el mayor número posible de comerciantes visite tu ciudad no tienes más que dejar tu ciudad sin abastecimiento de ciertas mercancías. Lo ideal es que elijas aquellas mercancías que se producen en las ciudades cercanas, porque los comerciantes tienen en cuenta la distancia para decidir si viajan o no.<n><n>Los comerciantes que visitan una ciudad compran automáticamente las mercancías que abundan y que tienen buenos precios en tu ciudad. También puedes vender directamente a tu ciudad las mercancías que hayas producido. Los comerciantes las comprarán regularmente mientras no salgan más caras que en otras ciudades.<n><n>La ventaja de ello es que siempre dispones de productos suficientes para tus ciudadanos sin tener que preocuparte de transportarlos a otras ciudades."
