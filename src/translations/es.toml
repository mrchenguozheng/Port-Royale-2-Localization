"0xea92b930" = "Yo soy %1. ¿Te interesa hacer negocios? Si me das un convoy, compartiré contigo %2 de mi botín. Incluso puedes decirme en qué aguas quieres que opere. Puedes entregarme cualquier convoy con hasta 5 barcos."
