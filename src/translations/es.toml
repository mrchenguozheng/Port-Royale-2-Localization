"0xfc3a99b8" = "Contratar a un capitán"
"0xfc3ac0b4" = "Has destruido el escondite de Barbanegra, pero no conseguiste destruir antes todos sus convoyes."
"0xfc3fdd9b" = "No conseguiste restablecer la población de [ref:Tortuga].<n><n>En cuanto el estatus de una ciudad alcanza «Auge» o uno superior, se pueden contratar nuevos trabajadores. Puedes abastecer la ciudad de nuevos trabajadores en forma de familias de colonos. Estas viajan de Europa a las ciudades con gobernador, donde esperan un pasaje a otras ciudades. También encontrarás colonos esperando ser recogidos en ciudades con un estatus inferior."
