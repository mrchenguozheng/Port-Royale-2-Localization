"0x100afa32" = "%1,<n>Nuestra iglesia requiere un mantenimiento constante y debe ser decorada como corresponde a un lugar de culto, pero Roma queda muy lejos. Haz una donación a nuestra iglesia y te incluiremos en nuestras oraciones. Tanto tu reputación en mi país como en esta ciudad se beneficiarán de ello. <n><n>Elige la cantidad que quieres donar."
