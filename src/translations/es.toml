"0xe4233be0" = "En esta campaña tienes que ayudar a Holanda a hacerse con nuevas ciudades.<n:25>Empiezas la campaña con un convoy perfectamente armado y un pequeño capital inicial. Al capturar barcos comerciales ingleses incrementas inmediatamente tu riqueza y podrás equipar tu convoy con más armas.<n:25>Después, atacarás convoyes militares ingleses para debilitar las defensas de Inglaterra y así poder llevar a cabo tu objetivo: Asaltar y capturar sus ciudades."
