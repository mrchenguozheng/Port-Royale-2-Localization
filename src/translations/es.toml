"0xd5328f24" = "En esta campaña tienes que encontrar y hundir al infame pirata Edward Teach, también conocido como Barbanegra. Este pirata forjó su propia leyenda y acuñó su propio apodo, que cultivaba tanto como su terrorífica imagen para conseguir rendiciones más rápidas del enemigo. Para tu lucha con Barbanegra, el gobernador de [town:Havana] te dará varias instrucciones y te apoyará en tu búsqueda.<n:25>En esta campaña puedes usar todas las opciones que se ofrecen en el modo de juego libre. Sin embargo, para superar la campaña también tendrás que cumplir determinadas tareas."
