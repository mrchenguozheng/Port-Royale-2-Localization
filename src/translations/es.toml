"0x32f1c30f" = "Campaña de aprendizaje<n><n>En esta campaña se tratará el transporte de mercancías y el comercio. Aprenderás trucos para sacar buenos beneficios con el comercio y organizarás nuevos convoyes para ampliar tu flota comercial."
"0x33045442" = "Corsario %1 "
