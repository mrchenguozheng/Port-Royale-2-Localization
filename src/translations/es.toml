"0x061848e4" = "Has boicoteado la ciudad de @T$TargetTown$ y te doy las gracias en nombre de mi nación. Tengo una recompensa muy especial para ti. He convencido a un capitán de gran experiencia para que se una a ti. Se llama @N$CaptainName$ y te espera en la taberna."
"0x061b50a1" = "¿Deseas comprar una Patente de Corso contra %1 y perseguir los barcos de nuestros enemigos en nombre de Francia?"
"0x0625c88f" = "Naciones"
"0x062a6d44" = "¡Bien! El convoy zarpó de @T$HostileTown$ en dirección a Europa y dejará el Caribe por el este. Rastrea a fondo la ruta, encuentra los documentos y tráemelos de vuelta antes del @D$EndDate$."
"0x062a6d45" = "¡Me eres de gran ayuda! Si todo va según lo planeado, el timonel irá lanzando los libros por la borda, uno a uno. El barco ha zarpado de @T$HostileTown$, rumbo a Europa. Sigue el barco y recoge los libros. Tráemelos antes del @D$EndDate$."
"0x062a6d46" = "Excelente. El barco ya ha salido del puerto de @T$HostileTown$ rumbo a Europa. Lo que su capitán ignora es que lleva a bordo a un pasajero que me debe varios favores. Rastreará el barco en busca de documentos, se hará con ellos y los lanzará por la borda, uno a uno. Tu misión consiste en recoger los documentos y traérmelos antes del @D$EndDate$."
"0x063dfcc8" = "%1 ha sido derrotada"
"0x064021d3" = "Las defensas del puerto han sido destruidas y tu tripulación ha atracado en el puerto. La guardia de la ciudad brilla por su ausencia.<n><n>¿Qué quieres hacer ahora?"
