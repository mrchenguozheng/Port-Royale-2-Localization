"0xe821614a" = "<g:INTEXT_SCHATZKISTE_800x600.screen><n>Con tu mapa del tesoro, has encontrado un tesoro.<n>@g$Gold$"
"0xe830d90e" = "%1,<n>Me complacería venderte un permiso para construir edificios en esta ciudad. Sin embargo, con tu rango, solo puedes tener %2 permisos de construcción, y ya tienes esa cantidad.<n><n>Vuelve cuando tengas un rango superior. "
"0xe84690dc" = "Para cambiar los detalles, haz clic en la ciudad. Muévela y elimínala arrastrando con el ratón. "
"0xe8469fdd" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Crónica<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>Registro<n><f:fonts/Tiepolo_black14x14aaFHk.res>%3<f:fonts/Tiepolo_bold14x14aaFH.res><t>Lista de convoyes<n><f:fonts/Tiepolo_black14x14aaFHk.res>CTRL<f:fonts/Tiepolo_bold14x14aaFH.res><t>Tamaño de unidad en la<n><t>ventana de comercio<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Cerrar diálogo"
"0xe84971d5" = "Esposa"
"0xe84c0654" = "Me enfrento a un pequeño problema en @T$Town$. Prometí a mi esposa que me aseguraría de que se construyera una escuela allí. Por desgracia, las relaciones entre el maestro de obras y yo siguen siendo extremadamente hostiles. Jamás permitiría que me entrometiera en los asuntos de su ciudad. ¿No podrías construir la escuela por mí?"
"0xe84c0655" = "Me gustaría que construyeras una escuela en @T$Town$ para aumentar la riqueza de la ciudad. En realidad, @T$Town$ me importa poco, pero mi hermana vive allí y sencillamente no acepta que haya ciudades mejores."
"0xe84c0656" = "El virrey me ha ordenado apoyar a la ciudad de @T$Town$. Por lo tanto, me complacería pagar una escuela en la ciudad. Sin embargo, el concejo municipal ha rechazado mi oferta: no quieren que me entrometa y prefieren quedarse el oro directamente. Por eso quería preguntarte si podrías construir la escuela."
"0xe88ea6ee" = "Por nombre del convoy"
"0xe8925b0d" = "Duelo"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>Su capitán está a la izquierda. Lo controla de la siguiente manera:<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Atacar<f:fonts/Tiepolo_bold14x14aaFH.res><n>Para atacar, haga clic izquierdo en alguna parte del cuerpo de su adversario. Haga clic en distintas partes de su cuerpo para aumentar sus posibilidades de acertar.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Defender<f:fonts/Tiepolo_bold14x14aaFH.res><n>En cuanto el adversario se prepare para atacar, debe hacer clic con el botón derecho del ratón en el momento oportuno para repeler el ataque.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Ataques especiales<f:fonts/Tiepolo_bold14x14aaFH.res><n>Pulse el botón izquierdo del ratón justo antes de que su capitán haya vuelto a la posición inicial tras un ataque.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Resistencia<f:fonts/Tiepolo_bold14x14aaFH.res><n>Cada ataque reduce la resistencia de su capitán, que se recupera entre ataque y ataque.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Tiempo de reacción<f:fonts/Tiepolo_bold14x14aaFH.res><n>Cuantos más duelos haya ganado, más rápido deberá reaccionar."
"0xe8aae87c" = "(se ha cambiado la lista de ciudades, la ruta vuelve al principio)"
"0xe8b8bf24" = "%1: %2 rechazó el ataque"
"0xe8b8c0e4" = " %2 ha saqueado %1"
"0xe8d7e960" = "%1,<n>nos conocemos desde hace tanto tiempo ya y mi corazón anhela que seas solo mío. ¿No le pedirás a mi padre mi mano en matrimonio?"
"0xe8d7e961" = "%1,<n>necesito hablar contigo de algo. A mi padre le encantaría elegir a un noble distinguido para casar a su hija. Pero mi corazón te pertenece. ¿No le pedirás a mi padre mi mano en matrimonio?"
"0xe8d7e962" = "%1,<n>mi corazón da un salto de alegría cada vez que nos vemos. Pero mi padre amenaza con casarme con algún aspirante a noble. Tú eres el único que puede salvarme de este destino. ¿No le pedirás a mi padre mi mano en matrimonio?"
