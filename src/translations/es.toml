"0x334d5256" = "Reglas"
"0x3353aa4c" = "¡Excelente! Ahora debes capturar más ciudades inglesas en nombre de Holanda. Pero no te demores, porque sólo podrás capturar ciudades mientras Holanda e Inglaterra estén en guerra.<n><n>Como siempre, el virrey de [town:Grand Bahama] es el único que te puede asignar este tipo de misión. Puede que tengas que hacer algo para influir en el poder militar de ambas naciones destruyendo más convoyes militares ingleses y haciendo entrega de nuevos convoyes a los holandeses antes de que se te puedan asignar más misiones de capturar ciudades. Ya sabes cómo hacerlo.<n><n>El gobernador de [town:Turk Islands] te ha facilitado tres carracas más de refuerzo.<n><n>También hay muchos marineros y armas disponibles en el puerto.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumplir dos misiones más para capturar ciudades para el virrey holandés antes de que acabe la guerra entre Holanda e Inglaterra. Tienes hasta el @D$EndDate$."
