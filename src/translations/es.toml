"0x2a7f7e17" = "Que así sea. Por Ia presente te encomiendo la tarea de atacar convoyes comerciales pertenecientes a @n$TargetNation$ y capturar o hundir @I$NumShips$ barcos. Pero recuerda: Sólo tienes hasta el @D$EndDate$ para cumplir mi encargo."
