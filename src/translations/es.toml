"0xd8e39bc3" = "Ayuda al virrey de [town:Grand Bahama] a aumentar la fortaleza militar de Holanda entregándole un convoy, que debe constar de cinco barcos y al menos 150 cañones. Después, acepta la misión de capturar ciudades en su nombre."
