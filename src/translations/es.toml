"0x2a8476a8" = "Producción en la ciudad"
"0x2a8b96d0" = "Tus tropas derriban la puerta de la ciudad y entran al asalto en la ciudad. Al verlo, los soldados se rinden y tus hombres se lanzan a la búsqueda de la cámara del tesoro, sin encontrar resistencia. Saquean %1. "
