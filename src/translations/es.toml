"0xd07dbe34" = "El factor más importante que afecta a la calidad de vida en una ciudad es el nivel de suministro de productos. Sin embargo, para que los habitantes estén felices no es necesario que garantices el suministro de todos los productos.<n><n>Los productos de una ciudad pueden dividirse en cinco grupos: Productos de primera necesidad, materias primas, manufacturas, productos coloniales y productos de importación.<n>Estas mercancías se enumeran en la misma secuencia en la ventana de Comercio. Con una reserva suficiente de dos o tres productos de cada grupo garantizarás una buena calidad de vida en tu ciudad. <n><n>Acabas de recibir un mensaje sobre la calidad de vida en las ciudades. Puedes verlo en el diario.<n><n>Como tu ciudad aún es pequeña, resulta especialmente fácil conseguir una buena calidad de vida, porque los ciudadanos de las ciudades pequeñas no son demasiado exigentes. Esto significa que no deberías tener problemas para alcanzar tu objetivo. Sin embargo, una ciudad de menos de 2.000 habitantes no puede tener una situación mejor que “auge”.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Asegúrate de que tu ciudad tenga una reserva mínima de cinco barriles de cada producto."
