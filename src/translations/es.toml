"0xf9404c19" = "Me temo que no puedo decirte dónde encontrar uno de los convoyes de Barbanegra, pues actualmente están en un lugar secreto. Sin embargo, te doy mucho tiempo para esta misión. Tienes hasta @D$EndDate$ para destruir un convoy."
