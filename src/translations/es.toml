"0x2c4a7b42" = "Tu tarea era establecer cinco negocios distintos en [ref:Tortuga] y aumentar el número de ciudadanos hasta 1.500. No has cumplido esta tarea con éxito.<n><n>Consigue las materias primas que necesitas para construir los edificios. En cuanto la construcción esté en marcha, deberías empezar a conseguir las familias de colonos que necesitas. Necesitas 30 familias de colonos por cada negocio y eso te dará 120 ciudadanos nuevos."
