"0x2729c3f3" = "Guardia de la ciudad (total)"
"0x273267f2" = "No te lo vas a creer, ¡Esto es absurdo! Al parecer anoche un grupo de marineros no tuvo suficiente con la fiesta en la taberna y decidieron continuarla en un barco. ¿Y cuál mejor que el mío que estaba cargado de botellas de ron? Mis finanzas no van nada bien; si no lo recupero, será desastroso para mí. ¿Podrías ayudarme?"
"0x273267f3" = "La verdad es que el asunto resulta embarazoso. Mariano, el inútil de mi hijo, ha desaparecido con mi mejor barco. Parece ser que el plan lo tramaron entre él y sus amigos, pues se enteraron de que su cargamento consistía en gran cantidad de botellas de ron: Las ideas peregrinas son su especialidad. Así que esta excursión podría acabar francamente mal. Estoy harto; ¿Podrías tú recuperar mi barco?"
"0x27344ff4" = "Muchas gracias por hacer la entrega a tiempo, el gobernador estará encantado. ¡El banquete de bodas comenzará hoy mismo!"
"0x273d7e0f" = "Todos tus marineros tienen ya la máxima moral posible."
"0x274e9455" = "PRECAUCIÓN"
"0x2766d2e5" = "No tienes convoyes ni almacén en esta ciudad"
"0x2772293d" = "Ataque a %1"
"0x2796edbb" = "%1 ha sido capturada"
"0x27beb2d9" = "Saquea @a$Amount$ de especias, vino y herramientas de los convoyes de transporte de @n$HostileNation$. No debes capturar ni hundir ningún barco. Luego entrega estos productos en el mercado de @T$TOWN$ antes del @D$EndDate$. Después, puedes recoger tu recompensa de manos del gobernador."
"0x27e88b91" = "Construye una iglesia e incrementa la población de tu ciudad a 2.200 habitantes. Tienes hasta el @D$EndDate$."
"0x2806bf85" = "El convoy no puede zarpar porque hay demasiados marineros a bordo. Para no exceder la máxima tripulación permitida, despide a algunos marineros."
"0x282e1ded" = "Has de tomar, antes del %2, una ciudad colonial perteneciente a %3 y entrégasela a %1. La ciudad no debe ser sede de un gobernador o de un virrey."
"0x282e1dee" = "Has de tomar, antes del %2, cualquier ciudad perteneciente a %3 y entrégasela a %1."
"0x283d1810" = "Préstamo cobrado"
"0x2840c9a8" = "Bien. Tu misión es saquear @a$Amount$ de @G$Goods$ de los comerciantes ingleses. "
"0x2840c9a9" = "Bien. Tu misión es saquear @a$Amount$ de @G$Goods$ de los comerciantes franceses. "
"0x2840c9aa" = "Bien. Tu misión es saquear @a$Amount$ de @G$Goods$ de los comerciantes holandeses. "
"0x2840c9ab" = "Bien. Tu misión es saquear @a$Amount$ de @G$Goods$ de los comerciantes españoles. "
"0x284242c2" = "Objetivo de la campaña conseguido"
"0x2842ae4a" = "Patente de Corso"
"0x2875b307" = "El %1 %2 ha hundido un convoy perteneciente al pirata %3."
"0x28812f6e" = "¿Así que quieres ponerte a prueba y dirigir una batalla naval? Bueno, tengo un trabajo para ti que podría beneficiarnos a los dos.<n>En este preciso momento hay dos barcos abandonados flotando a la deriva. Quiero que te deshagas de ellos antes de que se conviertan en una amenaza para mis comerciantes.<n>¿Aceptas la misión?"
"0x28812f6f" = "Pasemos ahora a algo más difícil. Tengo datos fiables sobre la posición actual del convoy del pirata @P$PirateName$. El convoy sólo tiene un barco, así que destruirlo no tendría que ser demasiado difícil.<n>¿Aceptas la misión?"
"0x28812f70" = "Bueno, ya has destruido un convoy del pirata @P$PirateName$. Sin embargo, en las guaridas de estos piratas suele haber varios de estos convoyes, dirigidos por @P$PirateName$ en persona. Sólo puedes eliminar al líder de un grupo de piratas descubriendo y destruyendo su escondite.<n>Recientemente ha aparecido otro convoy capitaneado por @P$PirateName$. El convoy en cuestión consta de dos barcos, así que deberías prepararte adecuadamente antes de entrar en combate.<n>¿Estás listo?"
"0x2883fdae" = "Puedes atacar esta guarida pirata desde el mar con un convoy, pero antes deberás derrotar a todos los barcos que se encuentran en el puerto. "
"0x289d1ced" = "consumo diario"
"0x28b1f98d" = "%1 %2 También tienes un permiso para construir edificios y establecer negocios en %3 además de disponer ya de un almacén en la ciudad.<n><n>Dado que eres joven y tu carrera acaba de comenzar no has alcanzado más que el rango de Grumete. Por consiguiente, todavía no puedes capitanear nuevos convoyes o comprar nuevos permisos de construcción en otras ciudades.<n><n>Tu rango viene determinado por el valor total de tus activos, que incluyen dinero en efectivo y propiedades; en la actualidad dicho valor asciende a %4. Accederás al siguiente rango en cuanto tus activos sumen %5.<n><n><n>¡Buena suerte!"
"0x28c94158" = "Barcos"
"0x28cc4ee4" = "El convoy no puede zarpar porque lleva demasiadas mercancías a bordo. Para no exceder la máxima capacidad de carga del convoy, vende algunas mercancías o trasládalas a tu almacén."
