"0x386a053b" = "¡Has alcanzado el rango más alto!"
"0x386a3a7f" = " Búscale en las tabernas de allí. Créeme, puedes tomarte tu tiempo, pero si le ves por casualidad, salúdale afectuosamente de mi parte, ¡Y dile que quizá le gustaría recordarle a mi hermana el aspecto de su cara!"
"0x386a3a80" = " Me temo que no puedo decir cuál es el mejor momento para encontrarle. Lo mejor que se puede hacer es simplemente buscarle tantas veces como se pueda en las tabernas del lugar."
"0x386a3a81" = " Sin duda le encontrarás en una taberna. Pero estoy seguro de que te ayudará a encontrar a @N$TeacherName$."
