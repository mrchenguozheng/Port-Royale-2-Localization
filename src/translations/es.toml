"0x32f1c30f" = "Escenario introductorio<n><n>Este escenario introductorio gira en torno al transporte de mercancías y al comercio. Recibirás consejos sobre cómo obtener grandes beneficios comerciales y aprenderás a formar nuevos convoyes."
"0x33045442" = "Corsario %1 "
