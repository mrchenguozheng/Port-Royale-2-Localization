"0x361866c0" = "Un nuevo barco"
"0x3641d8d1" = "Gracias por devolverme a mi mujer. Aunque he disfrutado mucho de la paz y la tranquilidad de los últimos días, no podía abandonar a mi mujer así como así en manos de mis enemigos. Como recompensa, toma este mapa que muestra un escondite en el que encontrarás @a$Amount$ barriles de mercancías."
"0x3641d8d2" = "¡Que no me traes a mi mujer! Como comprenderás, no puedo recompensarte. Pero, entre tú y yo: Me quitas un peso de encima."
"0x36573a59" = "Tus tropas enseguida dan muestran de su superioridad. Repentinamente surge una bandera blanca por encima de la muralla de la ciudad: ¡la guardia se rinde!<n><n>¿Qué quieres hacer ahora?"
"0x3657dd22" = "Mi mujer está encantada de que hayas encontrado a su perro. Coge este mapa; muestra un escondite en el que encontrarás @a$Amount$ barriles de mercancías."
"0x3657dd23" = "¿Cómo? ¿Quieres decir que tiraste al perro por la borda? No sabes bien el favor que me has hecho. Es evidente que no puedo recompensarte oficialmente... Sin embargo, hace tiempo escondí un tesoro en un lugar secreto. Aquí tienes un mapa."
"0x366de173" = "Oh, gracias por devolverme a mi querida hija. Como agradecimiento, acepta este mapa: En él he marcado el lugar donde una vez oculté valiosos tesoros."
"0x366de174" = "¡Pero qué has hecho! ¿Cómo has podido dejar a mi hija en manos del enemigo? ¡Todo el mundo en @n$Nation$ sabrá que no se puede confiar en ti! (Tu reputación en @n$Nation$ ha empeorado)"
