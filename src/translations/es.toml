"0x28f090e8" = "Patente de Corso"
"0x293d8c9f" = "Ahora tu ciudad es lo bastante grande como para que acudan los primeros comerciantes para comprar y vender productos en tu ciudad.<n><n>Pero tu ciudad también está en peligro de recibir otras visitas menos deseables. Entre estos visitantes se incluyen los piratas y corsarios de las naciones con las que tengas malas relaciones.<n>Por ello, tu siguiente tarea consiste en contratar soldados y erigir torres con cañones en el puerto.<n><n>Afortunadamente, los ciudadanos de tu ciudad son capaces de organizarse bastante bien por sí solos. No tienes más que darles unas instrucciones y comprar los materiales que sean necesarios. Después no habrá más gastos extraordinarios.<n><n>Puedes construir cañones en el puerto usando el menú de construcción y contratar soldados en tu palacio.<n><n>Recuerda que los soldados también necesitan alojamiento aunque, a diferencia de los trabajadores, los soldados sólo necesitan un espacio cada uno.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construye cinco cañones en el puerto e incrementa tu número de soldados a 300."
