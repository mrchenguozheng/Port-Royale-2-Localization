"0xf6a84efd" = "Bienvenido a Port Royale 2<n> Estamos en el año 1570, en la ciudad caribeña de Cartagena. Comenzando como un humilde comerciante, pronto alcanzarás una posición influyente y poderosa como hombre de negocios. Para conseguirlo podrás dedicarte al transporte y comercio de mercancías y a la creación de negocios. También podrás participar en la política o dedicarte al combate naval y a la piratería.<n><n>La siguiente campaña te enseñará lo básico para jugar. Como en el caso de las demás campañas, ésta tiene distintos objetivos que deberás ir cumpliendo para avanzar.<n><n>Ahora puedes cerrar esta ventana con el botón „Cerrar“. Presta especial atención a la Ventana de mensajes, en la parte inferior izquierda de la pantalla, pues ella será tu guía.<n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la Campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Sigue las instrucciones de la Ventana de mensajes."
"0xf6bb9f8c" = "Precio"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "Tarjeta gráfica"
"0xf6c77503" = "El escondite del pirata %1 ha sido descubierto. ¿Qué heroico aventurero sé atreverá a atacar su guarida?"
"0xf6ec5ddc" = "En [town:Tortuga] están pasando cosas raras. Debido a una serie de acontecimientos, prácticamente no hay ningún comerciante que se atreva a pisar la ciudad. Tu tarea consiste en apoyar a [town:Tortuga] en todo lo posible, suministrando mercancías.<n><n>Tu capital inicial no es precisamente espectacular. Tienes @g$StartGold$. Sin embargo, cuentas con un convoy comercial perfectamente equipado esperándote en el puerto y con algunas reservas de mercancías.<n><n>Tu primer objetivo consiste en conseguir @g$GoldGoal$. Cumple esta tarea en un máximo de 40 días.<n><n>Un consejo: no vendas tus barcos. Lo que sí puedes hacer es pedir un préstamo.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Conseguir @g$GoldGoal$ antes del @D$EndDate$."
"0xf70feddb" = "Estás de vuelta en el puerto de [town:Cartagena] y tu convoy, el \"Santa María\", está seleccionado.<n>Como verás, el convoy ya tiene algunas mercancías: Algodón, carne y cacao.<n>Ahora busca la lonja en el puerto y pulsa sobre ella para vender estas mercancías."
"0xf70feddc" = "En la lonja puedes comerciar tanto entre la ciudad y tu almacén como entre la ciudad y tu convoy.<n>Ahora se ha abierto la ventana de comercio y puedes ver qué mercancías tiene la ciudad y cuáles tiene tu convoy, además de sus precios de compra y venta, que aparecen en los botones de flecha.<n>Ahora, vende tu algodón pulsando en el botón de flecha a la izquierda que aparece junto a este producto."
"0xf70feddd" = "Puede que te hayas dado cuenta de que el precio del algodón bajaba a medida que lo vendías.<n>Esto ocurre porque el precio se determina en función de la oferta y la demanda en la ciudad.<n>Al vender las mercancías se satisface la demanda y el precio cae. Si compras una mercancía, su precio sube.<n>Ahora, compra @a$SubGoal$ de trigo."
"0xf70fedde" = "¿Has visto que el precio del trigo acaba de subir? <n>Sin embargo, ten presente que el precio no sólo depende de la oferta, sino también de la reputación que tengas en la ciudad.<n>Pulsa sobre el botón con el icono de un edificio (Comercio entre ciudad y almacén) que figura en la parte inferior derecha de la ventana de Comercio."
"0xf70feddf" = "Ahora puedes comerciar entre tu almacén y la ciudad.<n>Tienes que construir un almacén en todas las ciudades en las que quieras establecer la producción de una mercancía y siempre tendrás un almacén en tu ciudad de inicio.<n>Ahora vende todas las mercancías que tengas en el almacén."
"0xf70fede0" = "En la parte superior de la ventana de Comercio tienes tres botones con los números 1, 10 y 100 para poder comerciar con grandes cantidades de producto con mayor rapidez. Pulsa en el botón 10 y observa cómo cambian los precios.<n>Da igual que compres 10 barriles de una vez o 1 barril 10 veces: el precio total es siempre el mismo. Pero ten cuidado, ¡A veces comprar 5 productos es rentable, pero 10 salen caros! Ahora, compra @a$SubGoal$ de ron."
"0xf70fede1" = "La columna del extremo de la derecha del menú de comercio muestra el precio medio que has pagado por unidad de las mercancías que tienes en tus bodegas. Como quieres vender las mercancías para sacar beneficio, tienes que encontrar una ciudad en la que se pague un precio más alto.<n>Ahora, abre la transferencia entre el barco y tu almacén pulsando en el cuarto botón (el de la grúa) en la parte inferior derecha (transferencia entre almacén y convoy)."
"0xf70fede2" = "En esta ventana puedes trasladar mercancías entre tu convoy y tu almacén. Como verás, han desaparecido los precios ya que no se trata de una operación comercial. Ahora, carga en el convoy las mercancías que queden en tu almacén para venderlas en otra ciudad.<n>Después, cierra la ventana de Comercio pulsando en el botón marcado con una \"X\" de la parte inferior derecha."
"0xf70fede3" = "Ahora pasa a la carta de navegación y viaja con tu convoy hasta Santa Marta. Cuando el convoy haya llegado, no pinches en la ciudad para entrar en ella: Pulsa sobre ella con el botón derecho del ratón. "
"0xf70fede4" = "Aquí se abre la ventana de Comercio para Santa Marta.<n>Como ves, no es necesario entrar en una ciudad para comerciar en ella.<n>Ahora, vende todas las mercancías que tengas a bordo de tu convoy.<n>Después, cierra la ventana de Comercio."
"0xf7110875" = "¿Seguro que quieres borrar la partida guardada?"
"0xf725f22c" = "Tu convoy sigue en Santa Marta. Pulsa sobre el nombre de la ciudad para visualizar la información de la misma.<n>Puedes hacerlo desde la carta de navegación o entrando en la ciudad."
"0xf725f22d" = "La información de la ciudad muestra los productos que se producen en ella.<n><n>También se muestra tu relación con España, que en este caso es amistosa. Esto significa que en esta ciudad se te pagarán los mejores precios posibles.<n><n>Ahora, cierra esta ventana y echa un vistazo a la ciudad pulsando sobre ella."
"0xf725f22e" = "Pulsa sobre el botón 'Productos y existencias' que está justo a la izquierda del botón con el nombre de la ciudad. Esto te permitirá ver las existencias de Santa Marta."
"0xf725f22f" = "Aquí se despliega la cantidad de producto en reserva y la cantidad de productos que consume la ciudad. Evidentemente, el nivel de consumo depende de la población de la ciudad.<n>El consumo te da una pista sobre la cantidad de mercancías que pueden entregarse de forma regular. Ahora, cierra la ventana de Existencias."
"0xf725f230" = "Ahora intenta hacer algunos negocios rentables.<n>Abre la ventana de comercio y compra todo el algodón, azúcar y cacao que puedas transportar en tu convoy, porque estas mercancías se producen en esta ciudad.<n>Luego vuelve a [town:Cartagena] y vende estas mercancías con beneficio."
"0xf725f231" = "Acabas de recibir en el diario una serie de mensajes con trucos muy útiles para que tu actividad comercial sea todo un éxito.<n>Abre el diario para leer estos mensajes.<n>"
"0xf725f232" = "Vende todas las mercancías que puedas por encima del precio al que las has comprado (la columna más a la derecha) y compra nuevos productos. <n>Presta atención a los precios de productos marcados en rojo: Esto indica que escasean en esta ciudad y que vendiéndolos sacarás buenos precios.<n>"
"0xf725f233" = "Las ciudades con gobernador como [town:Cartagena] reciben productos de importación (especias, vino y herramientas) de Europa.<n>Normalmente puedes obtener un enorme beneficio vendiendo estos productos en las ciudades coloniales como Santa Marta, Maracaibo o Gibraltar.<n>Ahora, comercia un rato tú solo.<n>Tu objetivo es incrementar tu capital hasta @g$GoldGoal$ a través del comercio."
"0xf7346191" = "Comerciante de %1"
"0xf73619d7" = "Descubierto el escondite de un pirata"
"0xf7370c4b" = "%1,<n>se me ocurre mucha otra gente con la que preferiría estar. ¿Tenemos asuntos que tratar? Entra, si no queda más remedio."
"0xf73bf67d" = "Dirígete a la vista de la ciudad para ver [town:Cartagena].<n>Por lo general, para poder entrar en una ciudad tienes que tener anclado un convoy en el puerto. Sin embargo, como tienes un almacén en [town:Cartagena], podrás entrar en esta ciudad siempre que quieras.<n>Pulsa sobre el astillero de [town:Cartagena]."
"0xf73bf67e" = "Compra un barco pequeño en los astilleros. No te gastes demasiado dinero, porque también necesitarás dinero para comerciar y mantener tu barco."
"0xf73bf67f" = "En la última campaña aprendiste a incorporar barcos a un convoy pulsando sobre el puerto con el botón derecho del ratón.<n>Pero lo que tienes que hacer ahora es montar un nuevo convoy contratando a un capitán en la taberna.<n>Encuentra la taberna (está en el centro de la ciudad) y pulsa sobre ella."
"0xf73bf680" = "Para encontrar capitanes hay que ir a la taberna. Para saber si hay un capitán en la ciudad, pulsa en el tercer botón del menú de la Taberna.<n>Si tienes otros barcos o convoyes en el puerto, tienes que especificarle al nuevo capitán a cuál será asignado. Si le indicas un convoy que ya tiene capitán, el anterior será despedido.<n>Dile al nuevo capitán que va a capitanear tu nuevo barco."
"0xf73bf681" = "¡Enhorabuena! ¡Has formado tu primer convoy! Tu próxima tarea consiste en incrementar tu riqueza a @g$GoldGoal$. En cualquier momento podrás consultar a cuánto asciende tu fortuna en el apartado \"Logros\" del diario.<n><n>¡Buena suerte!"
"0xf73dab55" = "Gracias por completar la última misión que te encomendé."
"0xf73dab56" = "Desearía darte las gracias por haber completado mi última misión."
"0xf73dab57" = "Te estoy agradecido por tu apoyo."
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "Inicias tu carrera con <o:0xFFF2FAAD>%1<o> doblones y una pinaza <o:0xFFF2FAAD><o> (60 toneladas, máx. 8 cañones)."
"0xf7534d8f" = "Si trasladas a los colonos a una ciudad donde hacen falta trabajadores, los colonos te lo agradecerán pagándote cuando desembarquen.<n><n>Siempre hace falta una pequeña cantidad de herramientas para producir artículos coloniales como el cacao. Si no hay herramientas, la producción se detiene. Más tarde, cuando te hayas familiarizado algo más con los precios y cantidades, podrás dar instrucciones al encargado para que compre regularmente herramientas en la ciudad. Pero de momento serás tú personalmente quien compre las herramientas en la lonja.<n><n>Ésta es tu próxima tarea. Después no habrá nada que te impida producir cacao.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Producir cacao y almacenar @a$AmountGoal$ en tu almacén."
"0xf760fd2a" = "Gracias. Aquí tienes tus %1. Estaré aquí hasta %2. Hasta entonces puedes seguir trayéndome más mercancía."
"0xf76d173f" = "%1 ha sido capturada."
