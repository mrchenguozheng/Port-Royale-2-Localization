"0xdf10406e" = "Perfecto. Tu ciudad ya ha crecido un poco.<n><n>En cuanto tenga más de 1.000 habitantes, tu ciudad resultará interesante para los comerciantes de otras ciudades, que podrán venir para vender y comprar mercancías.<n><n>Los comerciantes suelen visitar una ciudad cuando hay demanda de un determinado producto; es decir, si hay algún producto que no esté disponible en tu ciudad.<n><n>Acabas de recibir un mensaje sobre el comercio y la producción en tu ciudad. Abre el diario.<n><n>Tu primer objetivo consiste en incrementar la población de tu ciudad hasta 1.000 habitantes.<n><n>Ten en cuenta que para que una ciudad sobrepase los 500 habitantes, debe tener una taberna.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Incrementar la población de tu ciudad a 1.000 habitantes."
