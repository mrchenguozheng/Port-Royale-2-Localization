"0x1844fb51" = "El convoy de tu adversario no cuenta con buques escolta que le defiendan. Por consiguiente, te apoderas del barco mercante sin necesidad de luchar.<n><n>Ahora tienes que decidir con qué mercancías quieres quedarte y si quieres capturar el barco o simplemente saquearlo."
"0x1844fb52" = "El convoy de tu adversario no cuenta con buques escolta que le defiendan. Por consiguiente, te apoderas de los barcos mercantes sin necesidad de luchar.<n><n>Ahora tienes que decidir con qué mercancías quieres quedarte y si quieres capturar los barcos o simplemente saquearlos."
"0x184aee4b" = "Compatibles"
"0x18546893" = "En esta campaña librarás batallas en el mar. La campaña comienza con una breve batalla de entrenamiento. Posteriormente, tendrás que seguir y destruir el convoy de un famoso pirata.<n><n>También conocerás al gobernador de [town:Cartagena], ciudad en la que comienza la campaña. Él te ayudará a convertirte en un experto en batallas navales; después te asignará la misión de atrapar a un pirata.<n><n>Empiezas la campaña con rango de Marinero. Has alcanzado este rango para que el gobernador pueda asignarte una misión. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visita al gobernador de [town:Cartagena] y cumple la misión que te asigne."
