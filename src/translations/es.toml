"0x0e636f4c" = "No se necesitan trabajadores en la ciudad."
"0x0e7a4720" = "No queda más que una cabaña abandonada en la que en su día se alojó el capitán. Todo indica que ha sido capturado y su convoy hundido."
"0x0e8bfce9" = "Por rango del capitán"
"0x0e96019a" = "carestía de %1 "
"0x0ea0e0e8" = "Bien, en marcha pues. Dirígete a las aguas cercanas a la ciudad de @T$TargetTown$."
"0x0ea0e0ea" = " Completa esta misión antes del @D$EndDate$."
"0x0eb34b66" = "En esta campaña aprenderás a establecer negocios y descubrirás cuáles son los elementos que debes tener en cuenta al hacerlo. También construirás viviendas para tus nuevos trabajadores.<n><n>En [town:Port Royale] 2 puedes construir en cualquier ciudad en la que hayas comprado un permiso de construcción. Ten en cuenta que cuantos más permisos tengas, más caro será el siguiente que adquieras. Ya cuentas con el permiso de la ciudad en la que empezaste el juego, así que puedes empezar inmediatamente a construir edificios allí.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construir una planta de producción de cacao y una zona residencial en Santa Marta."
"0x0ede126a" = "Ahora ya sabes cómo entablar batallas navales. También es posible atacar una ciudad para saquearla o capturarla en nombre de otra nación. Pero para hacerlo necesitas grandes convoyes con potentes barcos. Como te podrás imaginar, atacar una ciudad daña considerablemente tu reputación en la nación a la que pertenece, y a partir de ese momento sus buques de guerra te perseguirán.<n><n>También puedes asaltar guaridas de piratas. Normalmente, las guaridas de los piratas están en lugares secretos, pero en algún momento acaban siendo descubiertas. Las guaridas de los piratas se toman al asalto de la misma forma que las ciudades.<n><n>El poder de las defensas que rodean estos escondites depende del tiempo que los piratas lleven en acción y del éxito que haya tenido saqueando los barcos de los comerciantes.<n><n>Tu última misión en esta campaña consiste en atacar por sorpresa una pequeña guarida pirata. Descubrirás dónde está el escondite gracias al gobernador de @T$TOWN$.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destruir el escondite pirata de @P$PirateName$."
"0x0eecc4e8" = "Colonia inglesa"
"0x0eecc4e9" = "Colonia francesa"
"0x0eecc4ea" = "Colonia holandesa"
"0x0eecc4eb" = "Colonia española"
"0x0f1ade15" = "Ahora tienes que crear puestos de trabajo y construir viviendas en la ciudad.<n><n>Primero tendrás que construir cuatro plantas de producción, porque los colonos sólo querrán quedarse en tu ciudad si pueden encontrar trabajo en ella. Decide qué tipo de fábricas quieres construir. Pero asegúrate de producir las mercancías con cuya venta puedas sacar beneficio en otras ciudades, porque los costes de producción son altos y vives de los beneficios que sacas con la venta de tus productos.<n><n>Cuatro plantas de producción dan empleo a 120 trabajadores. Como cada trabajador es cabeza de una familia de cuatro miembros, tienes que dar alojamiento a 480 ciudadanos; es decir, necesitas cuatro zonas de viviendas.<n><n>En cuanto estén listas tus plantas de producción y las viviendas podrás traer colonos de otras ciudades. Normalmente encontrarás colonos desocupados en las ciudades con gobernador. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Incrementa la población de tu ciudad a 480 habitantes."
"0x0f22fe50" = "Costes operativos del barco"
"0x0f26cfe7" = "Se desata una tormenta tropical"
"0x0f3a5490" = "IDM_CONTEST_01_2004_POPUP_HDR"
"0x0f3f777d" = "Duelo a espada"
"0x0f432e25" = "Palanquetas"
"0x0f4c7b2b" = "Balance"
"0x0f52782d" = "¡Enhorabuena! Ahora puedes fabricar ropa en [town:Cartagena].<n><n>Como te imaginarás, el coste de producción de la ropa depende en gran medida del precio que pagues por el algodón. Por ello, sólo puedes producir manufacturas a bajo coste si puedes comprar materias primas a un precio razonable. También puedes producir tú mismo las materias primas.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construir una planta de producción de algodón en Santa Marta y comerciar hasta conseguir @g$GoldGoal$."
"0x0f5d7735" = "Muy al este de [town:Charleston] se encuentran las islas Bermudas. ¡Mantente bien alejado de ellas! Hace dos meses mi cuñado se dirigió hasta allí para explorar la zona y nunca más regresó. Nadie sabe qué es lo que allí acontece, pero una cosa es segura: ¡Un sombrío destino aguarda a los que osan navegar demasiado cerca de las islas!"
"0x0f5d7736" = "¿Conoces la última historia que se cuenta sobre las Bermudas? Un comerciante quiso utilizar la ruta que lleva más allá de las islas para navegar hasta Europa, pero nunca llegó. Su hermano salió en su busca y no encontró más que restos de un naufragio al sur de las islas."
"0x0f5d7737" = "Todos recordamos la extraña historia que contaba un marino de [town:Port Royale]. Parece ser que se acercaron demasiado a las islas Bermudas y tuvieron un encuentro bastante perturbador: En medio de la noche cerrada, unas luces tenues parecían flotar sobre el agua. Tratando de no llamar su atención, viraron y se alejaron de la zona. Aquel lugar está maldito."
