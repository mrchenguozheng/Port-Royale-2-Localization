"0x30bb44fc" = "¿No eres tú el famoso @A$USER$? ¿Podrías ayudarme, por favor? Me persigue un cazarrecompensas; uno de mis adversarios lo ha puesto tras de mí. "
"0x30bb44fd" = "Acércate una silla, @A$USER$. Me llamo @N$OwnerName$ y tengo un asunto importante que tratar contigo. ¿Por dónde empiezo? Bueno, tuve una discusión con mi esposa; me acusó de serle infiel, lo cual es completamente falso, por supuesto. En fin, me echó de casa, y eso no es lo peor: ha contratado a un cazador de recompensas, así que ya ni siquiera puedo entrar en la ciudad. ¿Puedes ayudarme?"
"0x30bb44fe" = "Pareces alguien capaz de llevar un barco con mano firme.<n>Tengo que viajar urgentemente a @T$Town$ para entregar unos documentos que incriminan a uno de los comerciantes de allí. Por desgracia, el comerciante se ha enterado y ahora intenta hacerse con los documentos. ¿No podrías encontrar la forma de llevarme a @T$Town$?"
