"0xedad5b61" = "No has conseguido incrementar la población de Tortuga a @I$Pop$ antes de que transcurrieran 20 días desde el final de la peste. <n><n>En la próxima ocasión, recuerda que se pueden contratar trabajadores en cuanto la situación económica de una ciudad sea como mínimo de \"auge\". Puedes abastecer la ciudad de trabajadores nuevos gracias a las familias de colonos. Los colonos viajan desde Europa hasta las ciudades del gobernador, donde esperan que alguien les transporte a otras ciudades. También encontrarás colonos a la espera de que alguien los recoja en las ciudades con mala situación económica."
"0xedc30aca" = "<ts:75><ts:150><ts:225><ts:300>Una plaga de ratas ha destruido víveres en tus almacenes. Las plagas de ratas se producen cuando los comerciantes acumulan demasiada comida en sus almacenes.<n><n>Pérdidas:"
"0xedffe567" = "Seleccionar mosqueteros"
