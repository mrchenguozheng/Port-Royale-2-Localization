"0x0adb3fdd" = "Sabía que podía confiar en ti. Se trata de la ciudad de @T$TargetTown$, que pertenece a @n$HostileNation$. Ataca la ciudad y sáquela todo lo que quieras, luego busca a mi esposa. No tardes, pues solo tengo hasta @D$EndDate$ para pensarlo.<n><n>Si aún no tienes una patente de corso contra @n$HostileNation$, te daré una."
"0x0adb3fde" = "Mi esposa se llenará de alegría. La perrita Michelle está escondida en @T$TargetTown$. Saquea la ciudad para que parezca una misión militar y luego busca al perro. Tienes hasta @D$EndDate$.<n>Créeme, volver a ver al perro no me dará ningún placer, pero los lloriqueos de mi esposa no dan muestras de amainar.<n><n>Si aún no tienes una patente de corso contra @n$HostileNation$, te daré una."
"0x0adb3fdf" = "Entonces queda acordado. Saquea @T$TargetTown$ y devuélveme a mi hija. Su cumpleaños es el @D$EndDate$ y debe estar de vuelta aquí para esta ocasión especial.<n><n>Si aún no tienes una patente de corso contra @n$HostileNation$, te la daré."
