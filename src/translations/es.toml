"0xc9500bee" = "¡Enhorabuena! Has alcanzado tu objetivo y has conseguido más dinero, subiendo así de rango.<n><n>Tu rango siempre vendrá determinado por el total de bienes que tengas, siendo necesario para subir de rango incrementar tus bienes hasta determinadas cantidades. En el cómputo de tus bienes, además del dinero, se tiene en cuenta el valor de tus propiedades.<n>En cualquier momento podrás consultar tu rango y a cuánto asciende tu riqueza en el apartado \"Logros\" del diario. Cuando incrementes tu rango, se te informará desde la ventana de mensajes.<n><n>Cuanto mayor sea tu rango, más convoyes podrás dirigir y en mayor número de ciudades podrás establecer negocios.<n><n>Ahora que tienes un mayor rango, organiza otro convoy y sigue comerciando para incrementar aún más tu riqueza.<n><n>En cualquier momento puedes consultar a cuánto asciende tu riqueza colocando el cursor sobre la barra azul que se muestra bajo esta ventana. Esta misma barra, además, te indica cuanto te falta para alcanzar el siguiente rango.<n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Organizar un segundo convoy para aumentar tu riqueza a @g$GoldGoal$ doblones."
