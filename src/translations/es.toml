"0x24695110" = "Gracias. Soy un comerciante de @T$Town$. Como mis perseguidores no saben dónde estoy, es seguro que intentarán atraparme en mi ciudad natal. Comienza allí tu búsqueda y acaba con los cazarrecompensas. Debo partir de aquí a más tardar el @D$EndDate$. Si cumples la misión antes de esa fecha, te pagaré @g$Reward$."
"0x24695111" = "Debo regresar urgentemente a @T$Town$, pues tengo que ocuparme allí de algunos asuntos antes de desaparecer del mapa. Por desgracia, un cazarrecompensas con el que deberás acabar vigila las rutas de acceso a @T$Town$. Te recompensaré con @g$Reward$ si cumples la misión antes del @D$EndDate$."
"0x24695112" = "¡Gracias! Sospecho que un cazarrecompensas vigila la entrada al puerto de @T$Town$.<n>Esto es lo que haremos: Extenderé el rumor de que voy a embarcar en uno de tus barcos y pondrás rumbo a @T$Town$; allí observarás lo que ocurre.<n> Deberás informarme antes del @D$EndDate$ por si hay moros en la costa. Entonces te pagaré una recompensa de@g$Reward$."
"0x246aece6" = "%1: Hambruna."
"0x2478c95f" = "¡Enhorabuena! Has superado esta campaña y has librado al Caribe del azote de un famoso pirata.<n><n>Durante el juego irán surgiendo escondites piratas, según vayan siendo descubiertos. Sin embargo, el número de convoyes piratas depende de su éxito. Ten presente que los piratas sólo quieren saquear los convoyes comerciales y se muestran muy cautelosos con los convoyes militares. Por eso evitan las aguas transitadas por demasiados convoyes militares.<n><n>En el modo de juego libre también puedes atrapar piratas y acabar con sus escondites. "
"0x24802954" = "%1: Barco hundido"
"0x2487ab5c" = "Balance"
"0x248f1e26" = "Guarida del pirata %1"
"0x24901249" = "%1 marineros de un total de %2 quieren unirse a ti y participar en tus aventuras."
"0x24a0f898" = "Astillero"
"0x24b0fd83" = "Bonificación"
"0x24c12812" = "¡Enhorabuena! ¡Se te ha confiado la misión de capturar ciudades!<n><n>Como capturar una ciudad puede ser una tarea difícil, debes empezar por una ciudad inglesa que tenga un pequeño número de torres defensivas en el puerto. La ciudad de @T$SampleTown$ es el objetivo perfecto.<n><n>Para atacar una ciudad, activa la opción Atacar Ciudades de convoy. Para hacerlo, selecciona tu convoy y pulsa el botón Modo de Ataque.<n><n>Puedes atacar una ciudad desde el mar o desde tierra. Sólo debes arriesgarte a atacar desde tierra si tus marineros superan en número a los defensores de la ciudad. En este caso, también debes poder armar a la mitad de tus marineros con sables y a la otra mitad con mosquetes.<n><n>En el caso de que en el puerto de una ciudad haya un convoy militar, deberás derrotarlo antes de atacar la ciudad.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumple tu misión de capturar ciudades."
"0x24e18ac4" = "[ref:0x101874f6]"
"0x24ec3366" = "¡Perfecto! Tu convoy ya está armado y listo para perseguir a uno de los convoyes del pirata Barbanegra.<n><n>La ventana de mensajes te proporciona pistas diarias para ayudarte a descubrir la localización del convoy pirata. Encontrar piratas puede resultar difícil, porque después de saquear un barco regresan rápidamente a su escondite.<n><n>Recuerda que un convoy pirata puede tener un máximo de cinco barcos de guerra. Refuerza tu convoy si crees que no es suficientemente potente; ya sabes cómo echarle mano a más oro.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumplir la misión que te ha asignado el gobernador de @T$TOWN$."
"0x250c7a12" = "Entrega @a$Amount$ antes del @D$Date$. Puedes entregar los productos en el mercado y recibirás un pago inmediato de @g$GoldPerBarrel$ por cada <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> de @G$Goods$."
"0x250c7a13" = "Estoy encantado. Entrega por favor @a$Amount$ en el mercado. Allí recibirás tu pago de @g$GoldPerBarrel$ por cada <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> hasta el @D$Date$."
"0x250c7a14" = "Por favor, reúnete con mi emisario en el mercado. Entrega @a$Amount$ de @G$Goods$ antes del @D$Date$, te ofrecerá un buen precio."
"0x2540ea42" = "Texto adicional (cronista)"
"0x2546beb9" = "¿Así que @N$OwnerName$ te envió a verme? Sí, conozco a ese viejo capitán del que hablas, seguro que puede enseñarle un par de cosas a tu tripulación. ¿Aunque por qué tendría yo que ayudarte? Pero no quiero poner dificultades, entiendo que has debido de tardar cierto tiempo en dar conmigo. Si me haces un pequeño favor, te diré adónde se ha retirado el capitán."
"0x2546beba" = "No conozco a ningún @N$OwnerName$, pero es cierto que sé dónde se encuentra @N$TeacherName$. Supongo que podría decírtelo, si estuviera predispuesto a ello. ¿Qué gano yo con todo esto? Negociemos… "
"0x2546bebb" = "¡Me importa un bledo si te envía @N$OwnerName$ o el mismísimo diablo! Tengo un problema. Y hasta que se resuelva, no estoy interesado en oír nada más. Te propongo una cosa: Que tú me encuentres un cofre, y yo te diré dónde se esconde ese viejo chiflado @N$TeacherName$."
