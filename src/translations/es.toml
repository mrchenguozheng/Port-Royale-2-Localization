"0xfb343ddf" = "La hija del gobernador te da las gracias y te entrega un mapa que muestra la ubicación de un escondite con @a$Amount$ de mercancías."
"0xfb3648b2" = "Ruta activada"
"0xfb399b9a" = "Un comerciante local está dispuesto a venderte la zona residencial por %1."
"0xfb3ffb48" = "Quiero darte las gracias una vez más por ser tan generoso como para cederme uno de tus convoyes. Ahora se está armando y estará listo para zarpar en %1 días.<n><n>Si quieres cederme otro convoy, deberás esperar hasta entonces."
"0xfb425369" = "Apoyo al diseño"
"0xfb4be839" = "¡Excelente! Has destruido todos los convoyes piratas, de modo que ningún pirata puede escapar. Si destruyes todos los convoyes de una banda de piratas antes de atacar su escondite, tardarán más en aparecer nuevos convoyes piratas en el Caribe.<n><n>Ahora ataca el escondite igual que atacarías una ciudad: selecciona tu convoy y luego haz clic derecho sobre el escondite pirata. Si hay algunos barcos piratas fondeados en el puerto, primero debes atacarlos antes de poder ganar la batalla portuaria.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destruye el escondite pirata de Barbanegra."
"0xfb514e13" = "Nueva ciudad"
"0xfb5c8a98" = "Bloqueo en @T$TOWN$"
"0xfb64ad02" = "Has ganado"
"0xfbb36ec1" = "Debo darte las gracias una vez más; has hecho tanto por mi nación. Te recompensaré con tierra adicional para tu ciudad %1. Entonces poseerás el %2% del distrito."
"0xfbb97bb9" = "Recoge tu recompensa de manos del gobernador."
"0xfbbba36d" = "No tengo nada más que decirte, aparte de esta advertencia: ¡cuidado con los convoyes militares de mi nación, porque te están cazando!"
"0xfbbf60a0" = "3 mástiles"
"0xfbd9dc10" = "Activo durante %1 días. Beneficio diario medio %2."
"0xfbd9dc11" = "Última batalla naval hace %1 días"
"0xfbdd7fd6" = "Mar"
"0xfc1051ba" = "Los piratas han superado las defensas portuarias de la ciudad y han saqueado diversos productos terminados."
