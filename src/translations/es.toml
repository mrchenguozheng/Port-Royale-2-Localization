"0xcc0a1380" = "Encuentra el convoy pirata comandado por @P$PirateName$, que se encuentra aproximadamente a 1 día de viaje al noreste de Providencia. Destruye este convoy.<n>Luego vuelve al gobernador de [ref:Cartagena]."
"0xcc1709af" = "%1 te es ahora hostil"
"0xcc2c64fb" = "Se te ha asignado la misión de localizar y destruir uno de los convoyes piratas de Barbanegra.<n><n>Barbanegra tiene un escondite secreto donde guarda varios convoyes, cada uno compuesto por cinco barcos completamente armados. Será una misión difícil para el convoy que tienes ahora.<n><n>Por eso, primero deberías aumentar la potencia de fuego de tu convoy. Para conseguir suficiente dinero y comprar un barco más grande, puedes vender las mercancías de tu almacén en @T$TOWN$ al mejor precio que consigas. Sigue los consejos de la ventana de eventos, que te indican dónde puedes vender las mercancías a buen precio al norte y al este de @T$TOWN$.<n><n>¡No dediques demasiado tiempo a esto, pues después aún tienes que cumplir la misión del gobernador!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vende las mercancías de tu almacén en @T$TOWN$ y aumenta tu efectivo hasta @g$GoldGoal$."
"0xcc475a7d" = "Maestro constructor"
"0xcc528764" = "Edificio de la comunidad"
"0xcc56863a" = "Costes salariales diarios"
"0xcc5bfb04" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Misión actual<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0xcc72dc12" = "Trucos de compraventa"
"0xcc823e54" = "Estamos en guerra con @n$TargetNation$ y, a la luz de los últimos acontecimientos, ha llegado el momento de contraatacar. Quiero que captures o hundas barcos militares en mi nombre. ¿Aceptas esta misión? "
"0xcc823e55" = "Hace poco, @n$TargetNation$ atacó una de nuestras ciudades. Ahora estoy planeando mi propia acción militar contra @n$TargetNation$ y me preguntaba si te gustaría formar parte de ella. Quiero que hundas o captures convoyes militares. Todo lo que saquees de ellos es tuyo; lo único que me importa es debilitar a @n$TargetNation$. ¿Te interesa?"
"0xcc823e56" = "Una de nuestras ciudades ha sido atacada por @n$TargetNation$. Ahora estamos contraatacando y hundiendo sus barcos. Me gustaría mucho enviarte a una zona concreta y autorizarte a capturar o hundir barcos militares. "
