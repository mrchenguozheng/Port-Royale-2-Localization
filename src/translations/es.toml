"0xdd3808a0" = "Escenario introductorio<n><n>En [ref:Port Royale] 2 puedes construir en cualquier ciudad en la que tengas permiso de construcción. Siempre tienes permiso para construir en la ciudad en la que empiezas el juego.<n:25>Este escenario te introduce en la construcción y la producción. Tu tarea es levantar varios edificios comerciales y residenciales. En los distintos pasos del escenario tendrás que encontrar materias primas, colonos y trabajadores. "
