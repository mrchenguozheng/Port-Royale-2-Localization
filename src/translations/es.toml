"0xe3922641" = "La aguja de esta brújula se mueve con mucha libertad y se asienta en su posición muy rápidamente. Nunca has visto una brújula tan precisa.<n>La brújula está forjada como una joya y la parte inferior está adornada con diversos grabados."
"0xe3922642" = "El par de compases se ajusta maravillosamente a tu mano y es muy fácil de usar. Parece estar hecho enteramente de oro y está decorado con un patrón intrincado."
"0xe3922643" = "Este sextante proporciona una orientación precisa incluso en mares agitados. Algunas piezas del sextante están montadas sobre muelles, lo que ayuda a reducir las vibraciones fuertes."
"0xe3922644" = "Este instrumento es un catalejo doble que te permite ver a lo lejos con ambos ojos a la vez. Puedes deslizar cristales de color sobre la lente para protegerte los ojos. En el lateral se distingue un grabado misterioso."
"0xe3922645" = "Este es un reloj de oro corriente, pero es más pequeño que cualquier otro que hayas visto. En un disco detrás de la esfera, también distingues una luna que parece girar lentamente. También hay algunos grabados en la parte posterior del reloj."
"0xe3922646" = "Esta lámpara es similar a una linterna normal. Sin embargo, alrededor de la mecha encendida hay muchos espejos dispuestos para que la luz brille en una sola dirección. Mediante un dispositivo parecido a un ventilador sobre la abertura, puedes encender y apagar muy rápidamente la luz emitida."
"0xe3922647" = "Una regla que puede deslizarse hacia delante y hacia atrás está encajada dentro de otra regla. A ella va sujeto un soporte deslizante de material transparente. Podrías usar este dispositivo para realizar cálculos sencillos muy rápidamente."
"0xe3922648" = "Este extraño dispositivo parece una flecha. Las paletas hacen que gire en cuanto lo sostienes en el agua. Un pequeño cuadrante cuenta cada revolución, lo que te permite calcular con mucha precisión la velocidad del barco."
"0xe3922649" = "Este instrumento consta de paletas giratorias y un cuadrante que muestra la velocidad de rotación de las paletas. Al sostener las paletas al viento, puedes leer la dirección y la velocidad del viento. El instrumento está fabricado con esmero y lleva marcado un símbolo desconocido."
"0xe392264a" = "Aunque esta cuerda debe de haber estado expuesta al agua de mar durante algún tiempo, parece como si acabara de hacerse. Se siente maravillosamente suave y hace nudos muy fuertes."
"0xe39226b2" = "Este folio contiene multitud de hermosas cartas estelares. Una gran tabla específica con precisión cuándo y dónde sale y se pone cada estrella."
"0xe39226b3" = "Un disco redondo finamente grabado, en el que van montados varios discos redondos más pequeños. Podrías usarlo para ver qué parte del cielo estrellado es visible en cada momento, según la fecha y la hora.<n>Las marcas del disco muestran que este instrumento servía antaño para determinar la posición de un barco en una región concreta."
"0xe39226b4" = "Al girar una manivela, un gran cuerno emite los dulces tonos de una mujer cantando. Justo lo que necesitan los marineros que pasan semanas en el mar."
"0xe39226b5" = "Un gran trozo de vidrio redondeado está montado en el extremo de una varilla dorada. Si lo sostienes sobre un mapa, las líneas más finas se ven con claridad incluso con poca luz."
"0xe39226b6" = "Esta pequeña mesa metálica está hecha de latón macizo y está construida de tal modo que su superficie permanece siempre horizontal, independientemente del cabeceo del barco. El anillo metálico exterior lleva grabadas unas marcas que parecen indicar direcciones. Sin embargo, no puedes identificar la región en la que esta mesa se usó antaño."
"0xe39226b7" = "Una pequeña caja contiene un dispositivo ornamentado que sirve para encender fuego con mucha facilidad. Esta caja está cubierta de grabados misteriosos."
"0xe39226b8" = "Esta ancla es más decorativa que práctica. En el mejor de los casos, serviría para anclar un bote de remos.<n>Es muy pesada para su tamaño y está cubierta de intrincadas decoraciones y letras desconocidas."
"0xe39226b9" = "Este dispositivo es como una lámpara de aceite con su propio pedernal. Si giras la pequeña rueda, saltan chispas sobre una mecha y pueden encender una llama incluso con fuerte viento."
"0xe39226ba" = "Este cuerno no se hace sonar con la boca, sino mediante un dispositivo parecido a una bomba. Si lo presionas con fuerza, el cuerno suena más alto de lo que habrías creído posible."
"0xe39226bb" = "Esta carta parece muy diferente de las cartas náuticas corrientes que hay disponibles. Es muy detallada y se ha trazado con varios colores. Sin embargo, no puedes identificar qué zona se muestra en la carta."
"0xe39bb702" = "El convoy no puede zarpar porque hay demasiados cañones a bordo. Vende algunos de tus cañones o llévalos a tu almacén para no superar el número máximo de cañones."
