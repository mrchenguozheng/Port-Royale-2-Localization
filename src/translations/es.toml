"0xe84971d5" = "Esposa"
"0xe84c0654" = "Me enfrento con un pequeño problema en @T$Town$. Le prometí a mi mujer que me encargaría de que se construyera allí un colegio. Por desgracia, mis relaciones con el maestro albañil están bastante enrarecidas. Nunca me permitiría interferir en los asuntos de su ciudad. ¿No podrías construir el colegio por mí?"
"0xe84c0655" = "Me gustaría que construyeras un colegio en @T$Town$ para aumentar la riqueza de la ciudad. En realidad @T$Town$ no significa nada para mí, pero mi hermana vive allí y simplemente no acepta que hay ciudades mejores."
"0xe84c0656" = "El virrey me ha dado instrucciones de que apoye a la ciudad de @T$Town$. Por esa razón me gustaría pagar la construcción de un colegio en la ciudad. Sin embargo, el consejo de la ciudad ha rechazado mi oferta; no quieren que yo interfiera y preferirían coger el oro directamente. Por eso quería preguntarte si tú podrías construir el colegio."
"0xe88ea6ee" = "Por nombre del convoy"
"0xe8925b0d" = "Duelo"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>Tu capitán está situado a la izquierda. Le controlas de la siguiente manera:<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Ataque<f:fonts/Tiepolo_bold14x14aaFH.res><n>Para atacar, pincha sobre una parte del cuerpo del adversario con el botón izquierdo del ratón. Pincha cada vez en distintas partes de su cuerpo para aumentar tus posibilidades de acertar.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Defensa<f:fonts/Tiepolo_bold14x14aaFH.res><n>Tan pronto como tu adversario se disponga a atacar, pulsa el botón derecho del ratón en el momento justo para repeler el ataque.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Ataques especiales<f:fonts/Tiepolo_bold14x14aaFH.res><n>Si atacas de nuevo con el botón izquierdo del ratón justo antes de que tu capitán regrese a su posición inicial tras un ataque, encadenarás un ataque especial. Puedes hacerlo varias veces seguidas.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Energía<f:fonts/Tiepolo_bold14x14aaFH.res><n>Con cada ataque se reduce la energía de tu capitán, que se recupera entre ataque y ataque. Si se queda sin energía, no podrá realizar ataques hasta que se recupere.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Tiempo de reacción<f:fonts/Tiepolo_bold14x14aaFH.res><n>Cuantos más duelos ganes, más rápida será tu reacción."
"0xe8aae87c" = "(se ha cambiado la lista de ciudades, la ruta vuelve al principio)"
"0xe8b8bf24" = "%1: %2 rechazó el ataque"
"0xe8b8c0e4" = " %2 ha saqueado %1"
"0xe8d7e960" = "%1,<n>hace tiempo que nos conocemos y mi corazón anhela que seas sólo mío. ¿Le pedirás a mi padre que te conceda mi mano?"
"0xe8d7e961" = "%1,<n>necesito hablar contigo. Mi padre no desea otra cosa que encontrar a un noble rico con el que desposar a su hija. Pero mi corazón es todo tuyo. Te ruego que le solicites mi mano."
"0xe8d7e962" = "%1,<n>mi corazón rebosa de alegría cada vez que nos vemos. Pero mi padre amenaza con desposarme con algún pisaverde. Sólo tú puedes evitarlo. ¿Me pedirás en matrimonio?"
