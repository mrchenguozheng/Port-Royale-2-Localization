"0x2ad0de32" = "en el puerto"
"0x2ae68b1b" = "Me produce una gran satisfacción saber que has puesto a Barbanegra en su sitio. Como recompensa, te hago entrega de un galeón español. Te espera en el puerto. <n><n>Y, ya que estoy, bien puedo darte @g$Reward$."
"0x2ae68b1c" = "Una vez más estoy muy satisfecho de saber que has vuelto a derrotar al despreciable Barbanegra. También debo transmitirte los saludos muy especiales de mi esposa. Desea hacerte el regalo de su galeón español, ¡y no me refiero a nuestra cocinera!<n><n>Además, te recompenso con @g$Reward$."
"0x2b0bca45" = "El barco que lleva al espía zarpó de @T$HostileTown$ rumbo a Europa y abandonará el Caribe por el este. Registra la ruta en busca de varios documentos y llévalos al gobernador de @T$TOWN$ antes de @D$EndDate$."
