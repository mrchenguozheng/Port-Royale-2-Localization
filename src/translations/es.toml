"0xf52fee2f" = "Lucha contra piratas, corsarios y convoyes militares de naciones enemigas<n><n>Prueba tu suerte como corsario y aborda convoyes comerciales.<n><n>Parte en busca de la legendaria Flota del Tesoro Española.<n><n>Ponte al mando de 16 tipos de barcos diferentes."
"0xf52fee30" = "Guía la espada de tu capitán en duelos con otros capitanes y piratas.<n><n>Lleva a cabo incontables misiones, pelea en numerosas batallas y participa en la vida comercial y política de las naciones."
"0xf52fee31" = "Visita las ciudades de 4 naciones diferentes, con conjuntos arquitectónicos distintos<n><n:10>Disfruta de la enorme variedad de los gráficos a lo largo de diferentes paisajes.<n><n:10>Saquea y captura ciudades en nombre del país de tu elección<n><n:10>Construye tus propias ciudades<n><n:10>Compra negocios a otros comerciantes y crea monopolios de productos<n><n:10><o:0xFFFFEB7D>...¡Conviértete en el amo de todo el Caribe!"
