"0x15d8bad1" = "¡Bien! La ciudad en cuestión es @T$TargetTown$. Para meterlos en cintura, el virrey de @n$TargetNation$ ha prohibido a todos los comerciantes negociar en la ciudad. Si conseguimos restaurar la riqueza mediante al aprovisionamiento de la ciudad, seguro que podremos contar con la lealtad de sus ciudadanos. Tienes hasta el @D$EndDate$ para completar esta misión."
"0x15d8bad2" = "La ciudad en cuestión es @T$TargetTown$. Se ha prohibido la entrada a todos los comerciantes. Tu misión consiste en abastecer a la ciudad para restaurar su riqueza. De esta forma haremos patente nuestro interés en @T$TargetTown$. Tienes hasta el @D$EndDate$ para cumplir tu misión."
"0x15d8bad3" = "La cuestión es la siguiente: El virrey ha prohibido a todos los comerciantes acceder a la ciudad de @T$TargetTown$, con lo que pretende ejercer presión sobre el consejo de la ciudad. Si consigues suministrar a @T$TargetTown$ mercancías suficientes para restaurar su riqueza antes del @D$EndDate$, no tengo la menor duda de que conseguiré granjearme su Lealtad."
