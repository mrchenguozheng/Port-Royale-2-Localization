"0xdf10406e" = "¡Bien hecho! Tu ciudad ya ha crecido un poco.<n><n>En cuanto tu ciudad tenga más de 1.000 habitantes, resultará interesante para comerciantes de otras ciudades, que pueden venir a comerciar sus mercancías.<n><n>Los comerciantes suelen visitar una ciudad si en ella hay demanda de una determinada mercancía, es decir, si hay mercancías que no están disponibles en tu ciudad.<n><n>Acabas de recibir un mensaje sobre el comercio y la producción en tu propia ciudad. Para leerlo, abre el registro.<n><n>Tu primer objetivo es aumentar la población de tu ciudad hasta 1.000.<n><n>Nota: ¡Si una ciudad debe tener más de 500 habitantes, necesita una posada!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumenta la población de tu ciudad hasta 1.000."
