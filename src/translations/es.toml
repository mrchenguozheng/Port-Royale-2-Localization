"0x17839498" = "Reducir el precio en un 5%"
"0x178491f6" = "Aumentar el precio en un 5%"
"0x17885da0" = "Has encontrado una balsa llena de supervivientes de un naufragio; has recogido a @I$Settlers$ colonos. Te han pedido que se les desembarque en una ciudad en la que haya escasez de trabajadores, para poder empezar una nueva vida."
"0x17a97ba2" = "Batallas navales"
"0x17abb14d" = "en cuanto al puerto, está muy mal defendido."
"0x17ae0013" = "Me llegan noticias desde una de las últimas ciudades en las que hizo escala el último convoy procedente de Europa. Parece que mi ciudad se va a quedar sin productos importados en las próximas semanas, pues han agotado las existencias.<n><n>¿Puedes ayudarme? No puedo depender tan solo de la vaga posibilidad de que otros comerciantes lleven estos productos a la ciudad."
"0x17ae0014" = "Como sabes, @n$Nation1$ y @n$Nation2$ están en guerra.<n>Por esta razón, en las próximas semanas no podré recibir importaciones procedentes de Europa con las que abastecer a mi ciudad, lo que me obliga a comprar todos los productos en @n$Nation2$.<n><n>Ya he empleado a otros comerciantes para hacerlo, pero me gustaría poder confiar también en tu ayuda."
"0x17ae0015" = "¿Qué cree @n$Nation2$ que está haciendo? Me acabo de enterar por un informador de que los convoyes de transporte de Europa que se encuentran camino de mi ciudad están siendo atacados y saqueados. ¿Me ayudarás a adquirir los productos de importación que necesitamos?"
