"0x31ed47e7" = "Un saboteador extranjero ha contaminado las reservas de alimentos de Tortuga, lo que ha desatado una hambruna en la ciudad.<n><n>Tu misión consiste en terminar con la hambruna lo antes posible.<n><n>Durante 2 o 3 semanas tendrás que asegurarte de que la cantidad disponible de alimentos sea superior a las que se consume a diario.<n><n>Recuerda que los alimentos son el trigo, la fruta, el maíz y la carne.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La hambruna tiene que terminar antes del @D$EndDate$."
