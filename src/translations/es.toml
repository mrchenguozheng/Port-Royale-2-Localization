"0xcb6604a0" = "hundido"
"0xcb674ff0" = "Te doy las gracias en nombre de mi nación. Ahora el convoy será puesto a punto y se reunirá la tripulación. Estará listo para zarpar en 15 días.<n><n>Si quieres entregar otro convoy, deberás esperar hasta entonces."
