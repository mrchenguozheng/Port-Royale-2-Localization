"0x37baebd9" = "Taberna"
"0x37d00ed9" = "De momento ya deberías tener suficientes defensas para la ciudad. Ahora, incrementa el tamaño de tu ciudad y mejora su aspecto. Construye una iglesia, más plantas de producción y más zonas residenciales para atraer a más de 2.200 habitantes a tu ciudad.<n><n>Tienes hasta el @D$EndDate$ para hacerlo. Después terminará la campaña.<n><n>¡No te olvides de sacar beneficio vendiendo las mercancías que produces! <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construir una iglesia e incrementar la población de tu ciudad hasta 2.200 habitantes. Tienes hasta el @D$EndDate$."
