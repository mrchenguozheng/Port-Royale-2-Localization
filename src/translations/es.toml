"0xf64f1e5a" = "Como sabes, estamos en guerra una vez más. Nos hemos marcado como prioridad debilitar la economía de @n$TargetNation$. Para ello me gustaría que captures o hundas @I$NumShips$ barcos de comerciantes enemigos. ¿Aceptas esta misión? "
"0xf64f1e5b" = "Estamos en guerra con @n$TargetNation$. Como medida de estrangulamiento, quiero que hundas o captures un número específico de barcos comerciales del enemigo; esto dañará su economía y predispondrá a sus comerciantes en contra de la guerra. Todo lo que saquees será para ti, lo único que me importa es debilitar la economía de @n$TargetNation$. ¿Puedo contar contigo a bordo?"
"0xf64f1e5c" = "Me preguntaba si podrías ayudarnos en nuestra guerra contra @n$TargetNation$. Me gustaría enviarte a una zona en particular y encomendarte la tarea de capturar o hundir barcos allí. "
"0xf651cc3f" = "Holanda e Inglaterra han firmado la paz, así que no puedes seguir capturando ciudades inglesas.<n><n>Has llegado bastante lejos en esta campaña, pero no has tenido tiempo de capturar suficientes ciudades en nombre de Holanda.<n><n>Recuerda que puedes capturar ciudades de la misma forma en cualquier otra partida. Pero debes asegurarte primero de que la nación cuyas ciudades quieras capturar sea militarmente débil. Además, la nación para la que quieras capturar ciudades tendrá que ser fuerte y por supuesto las dos naciones deben estar en guerra.<n><n>No olvides que al conquistar un par de ciudades en nombre de un virrey se te suele entregar una hacienda donde poder establecer tu propia ciudad, aunque en esta campaña no fuera así."
"0xf65a5a04" = "Ahora, si atacas ciudades y barcos ingleses, podrás mejorar tu reputación en %1. Esto no empeorará tu reputación en los otros países."
