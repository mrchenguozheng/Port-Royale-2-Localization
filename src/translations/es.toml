"0x062a6d45" = "¡Me eres de gran ayuda! Si todo sale según lo previsto, el timonel arrojará los libros por la borda en secreto, uno tras otro. El barco ha zarpado de @T$HostileTown$ rumbo a Europa. Sigue el barco y recoge los libros. Tráemelos antes de @D$EndDate$."
"0x062a6d46" = "Excelente. El barco ya ha zarpado del puerto de @T$HostileTown$ rumbo a Europa. Sin embargo, lleva a bordo un pasajero que aún me debe un favor. Registrará el barco en busca de documentos y los arrojará en secreto por la borda, uno tras otro. Tu misión es recoger los documentos y traérmelos antes del @D$EndDate$."
