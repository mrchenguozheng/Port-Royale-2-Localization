"0x39e32dc6" = "Muy amable. La ciudad en cuestión se llama @T$TargetTown$. Espero llegar a un acuerdo con los comerciantes antes de @D$EndDate$. Hasta entonces, la ciudad no puede caer por debajo del estatus \"Auge\", para que yo pueda negociar desde una posición más fuerte."
"0x39e32dc7" = "La ciudad en cuestión es @T$TargetTown$. Abastécela con todas las mercancías que necesita. Haré todo lo posible por acallar el rumor antes de @D$EndDate$, de una vez por todas. Hasta entonces, la ciudad no puede caer por debajo del estatus \"Auge\"."
"0x39e32dc8" = "La ciudad en apuros es @T$TargetTown$. Su estatus no puede caer por debajo de \"Auge\" antes de @D$EndDate$; de lo contrario, demasiados ciudadanos abandonarán la ciudad. Incluso hay riesgo de que estalle allí una epidemia. Debes asegurarte de abastecer la ciudad con suficientes mercancías a tiempo para evitarlo."
"0x39e32dc9" = "Bien. @T$TargetTown$ es la ciudad en cuestión. Abastécela con todo lo que necesita antes de @D$EndDate$. Su estatus no puede caer por debajo de \"Auge\". Debo ser sincero contigo: es muy posible que la ciudad se vea afectada por una epidemia. Estate preparado."
"0x39e7361e" = "%1 ha sido derrotado"
"0x39e9081a" = "You have discovered the location of Blackbeard's hideout. For information on the pirate gang, left-click on the hideout symbol on the sea chart.<n><n>Beware: When you destroy a hideout, the pirate gang is annihilated. However, any pirate convoys that were not in the hideout at the time are informed and they then set up a new hideout.<n><n>Your first objective is therefore to destroy all of the convoys belonging to the hideout. Ideally, you should lie in wait for any convoys that sail into or out of the hideout and attack them.<n><n>You have received some more cash to support you in your quest.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destroy all of Blackbeard’s pirate convoys that are currently at sea. Do not attack his hideout!"
