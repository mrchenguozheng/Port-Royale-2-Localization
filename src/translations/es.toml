"0xfda277f4" = "%1 is full and no longer has any space on which to build a warehouse. If you want to gain a foothold in this town in spite of this, you can try to persuade one of the local traders to demolish one of his businesses.<n><n>Businesses are demolished if the price in the town for the goods produced remains at a low level over a long period, that is, if there is a surplus of the good. To achieve this, you must first start to hoard the product. Then sell sufficient quantities of the product at the town market to drive the price down to a low level.<n><n>The goods produced are delivered to the town market once a day. If the price is currently minimal, the business reduces its complement of workers. You can check this by clicking on the business. A business is demolished once 30 workers have been made redundant."
"0xfda5ded4" = "La ciudad prospera gracias al descubrimiento de oro"
"0xfdaf6463" = "Debo darte las gracias una vez más; has hecho tanto por mi nación. Como recompensa, te daré el terreno restante para tu ciudad %1. Ahora posees todo el distrito."
"0xfdb7f907" = "Una hoguera delata el escondite del maestro, no muy lejos de la orilla. Tu capitán rema hasta la costa y lo recibe un anciano. Cuando el anciano ve todo el vino, se frota las manos de alegría."
"0xfdb7f908" = "No muy lejos de la orilla, tu convoy descubre el pequeño campamento de un ermitaño. Tu capitán rema hasta la costa y se encuentra con un anciano que lleva un uniforme de capitán aún más viejo que él. Ve los barriles de ron y se alegra muchísimo."
"0xfdb7f909" = "Al cabo de un rato, tu convoy descubre un escondite en tierra. El capitán rema hasta la orilla y echa un vistazo. Por fin encuentra al viejo maestro y le explica qué lo lleva allí. El ermitaño acepta la comida."
