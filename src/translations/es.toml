"0xfeab2fe1" = "Bien. El convoy de transporte zarpará del puerto de @T$TOWN$ el @D$DepartDate$. Navega por delante de él en dirección a Europa y asegura su ruta. Mantente al acecho contra convoyes militares de @n$HostileNation$. Cumplirás tu misión si el convoy logra salir de las aguas del Nuevo Mundo sin ser atacado."
