"0x37d00ed9" = "Ahora ya deberías tener suficientes defensas en la ciudad por el momento. Ahora aumenta el tamaño de tu ciudad y mejora su aspecto. Construye una iglesia, así como más instalaciones de producción y zonas residenciales, para atraer a más de 2.200 habitantes a tu ciudad.<n><n>Tienes hasta el @D$EndDate$ para hacerlo. Después terminará el escenario.<n><n>¡No olvides vender con beneficio las mercancías que produces! <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construye una iglesia y aumenta la población de tu ciudad hasta 2.200. Tienes hasta el @D$EndDate$."
