"0xda68e605" = "Fecha límite para la entrega de mercancías: %1"
"0xda75935c" = "Capturar una ciudad"
"0xda93dbe1" = "¡Muy bien! ¡No ha sido poca hazaña! Inglaterra ha perdido ya tantos convoyes militares que sus ciudades pueden ser tomadas. En agradecimiento por sus servicios, el gobernador de las [ref:Turk Islands] le entrega cuatro carracas más.<n><n>Solo se pueden tomar las ciudades de una nación por orden de un virrey. Un virrey solo le ordenará tomar una ciudad si su propia nación es militarmente fuerte y la nación enemiga es militarmente débil.<n><n>Lamentablemente, Holanda no es lo bastante fuerte como para tomar una ciudad. Sin embargo, usted puede hacer algo al respecto: haga una visita al virrey holandés en [ref:Grand Bahama] y entréguele uno de sus convoyes. Él formará entonces un nuevo convoy militar, lo que aumentará la fuerza militar de Holanda.<n><n>Si quiere entregar un convoy a un virrey, el convoy en cuestión debe tener exactamente cinco barcos y al menos 150 cañones.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Ayude al virrey a aumentar la fuerza militar de Holanda. Acepte después una misión para tomar ciudades en su nombre."
"0xdab4fea7" = "Viviendas"
"0xdac343f7" = "Comercio libre y seguridad"
"0xdac43b47" = "Falta de colonos"
"0xdacb8ff6" = "[term:en_quality_of_life] en tu ciudad"
"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "Tecla"
"0xdaeb0484" = "Esta vez empiezas el escenario en [ref:Cartagena], una ciudad con gobernador en pleno Caribe.<n>Tu convoy, compuesto por una balandra, está en el puerto.<n>Primero debes armar tu convoy, porque este escenario incluirá batallas navales.<n>Ve a los muelles y abre el menú de carga."
"0xdaeb0485" = "Como puedes ver, tu convoy no lleva cañones ni munición a bordo. También te falta tripulación.<n>Embarca a la tripulación más numerosa y tantos cañones como puedas, así como 10x10 de cada uno de los tres tipos de munición para tus cañones.<n>Puede que no haya suficiente espacio en tu convoy, porque los cañones pesan mucho. Si es así, puedes vender parte de las mercancías que has cargado."
"0xdaeb0486" = "¡Bien hecho! Tu convoy está ahora armado y listo para una batalla a pequeña escala.<n>Y resulta que el gobernador de [ref:Cartagena] tiene ahora la misión perfecta para ti.<n>Haz clic en el edificio del gobernador y acepta su misión."
"0xdaeb0487" = "Los gobernadores proponen a menudo misiones que mejorarán tu reputación con su nación si las cumples con éxito.<n>También tienes derecho a pedir a los gobernadores patentes de corso o a reclamar rescate por los bucaneros que hayas capturado.<n>Ahora usa tu convoy para encontrar los barcos de los que te habló el gobernador."
"0xdaeb0488" = "Muy bien, has localizado el convoy.<n>Tu siguiente paso es preparar tu barco para el combate. Para ello, abre la lista de barcos de tu convoy y selecciona tu balandra. Para declararla barco de guerra, pulsa el botón que hay junto al cañón. Después puedes «atacar» el convoy haciendo clic derecho sobre él."
"0xdaeb0489" = "Esta es la vista de batalla naval de [ref:Port Royale].<n>Muestra tu barco, y puedes ver los barcos abandonados moviendo la ventana de visualización.<n>Ahora desactiva el modo de pausa y practica la navegación con el botón derecho del ratón. La ventana de eventos muestra la dirección del viento y del barco durante las batallas navales."
"0xdaeb048a" = "Todos los barcos que participan en la batalla se muestran en la parte inferior de la pantalla. Aquí puedes elegir qué munición usar. Selecciona las balas de cañón pesadas y hunde uno de los barcos enemigos.<n>Puedes disparar con el botón izquierdo del ratón, pero solo cuando tu barco esté en una buena posición de tiro. Entonces los objetivos se muestran en rojo."
"0xdaeb048b" = "¡Bien! Aborda el segundo barco.<n>Para ello, haz clic en el botón \"Abordar\" en la parte inferior derecha de la visualización del barco.<n>Luego avanza hacia el barco enemigo y embístelo. Ten en cuenta que el botón F1 también está activo durante las batallas navales."
"0xdaeb048c" = "Normalmente, el enemigo tiene tripulación y se libra una batalla a bordo del barco entre tu tripulación y la suya.<n>Cuando la batalla termina, todos los barcos abordados quedan en manos del vencedor.<n>Ahora añade el barco enemigo a tu convoy y cierra la ventana de transferencia."
"0xdaeb048d" = "¡Muy bien!<n>Ahora envía tu convoy de vuelta a [ref:Cartagena]."
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "Un convoy del pirata %1 ha atacado a un comerciante de %2."
"0xdb0108d5" = "Primero, compra un barco nuevo. Ve al astillero y compra un barco con tantos cañones como sea posible."
"0xdb0108d6" = "Selecciona tu convoy y luego haz clic derecho en el puerto para añadir el nuevo barco al convoy."
"0xdb0108d7" = "Todos los convoyes se componen de barcos comerciales y barcos de escolta.<n>Si uno de los barcos de tu convoy va a participar en una batalla, debes definirlo como buque de guerra. <n>Abre la lista de barcos de tu convoy para ver todos tus barcos."
"0xdb0108d8" = "La lista de barcos muestra todos los barcos de tu convoy. El estado de barco de guerra se muestra en la esquina superior derecha de un barco. Si aparece el símbolo de un cañón, el barco está definido como barco de guerra y participa en las batallas. Al hacer clic en esa esquina se cambia el estado directamente.<n>Pero ahora deberías hacer clic en tu nuevo barco y seleccionarlo. "
"0xdb0108d9" = "Los detalles técnicos del barco, como su capacidad máxima de carga, se muestran aquí igual que en el astillero.<n>También puedes ver el coste diario de mantener el barco.<n>Ahora convierte el barco en buque de guerra marcando el símbolo del cañón."
"0xdb0108da" = "¡Bien hecho!<n>Los cañones y los marineros siempre se reparten por igual entre los barcos de escolta de un convoy.<n>Asegúrate de que tus barcos de escolta estén completamente armados y con la tripulación completa, y luego visita al gobernador y acepta la nueva misión que te asigne."
"0xdb0108db" = "Ahora cumple la misión que te ha asignado el gobernador. "
"0xdb0108dc" = "Elige entre tus barcos de escolta el barco que quieres controlar en la batalla naval.<n><n>Puedes seleccionar otro barco de escolta en cualquier momento haciendo clic en él en la lista.<n><n>Pero cuidado: en cuanto empiece la batalla, cada barco solo se puede seleccionar una vez."
"0xdb0108dd" = "¡Bien hecho! Has destruido el convoy pirata.<n>Ahora vuelve al gobernador de [ref:Cartagena], porque forma parte de tu misión.<n><n>Ten en cuenta que tus misiones se registran automáticamente en tu diario. Allí puedes consultar los detalles de tu misión en cualquier momento si es necesario."
"0xdb04023a" = "No tienes suficientes materiales de construcción"
"0xdb0e3d33" = "Tengo la siguiente misión para ti.<n><n>"
"0xdb0e3d34" = "Podrías hacerme un favor.<n><n>"
"0xdb0e3d35" = "Hay algo que podrías hacer por mí.<n><n>"
"0xdb10f490" = "Donar"
"0xdb126f49" = "Tu puntuación<n>"
"0xdb170d26" = "Antes de que el gobernador te asigne una nueva misión, asegúrate de que tu convoy esté en condiciones.<n>Si tu convoy está dañado, ve al astillero y haz que lo reparen."
"0xdb170d27" = "Acabas de recibir algo de dinero para ayudarte a equipar mejor tu convoy.<n>Tu convoy debería tener tres barcos completamente armados y una tripulación completa.<n>No olvides la munición y recuerda definir tus nuevos barcos como buques de guerra. Hazlo ahora."
"0xdb170d28" = "¡Excelente!<n>Ahora visita al gobernador y cumple la misión que te asigne."
"0xdb2ae26e" = "Rechazar"
"0xdb2d1177" = "Ahora vas a asaltar un escondite pirata.<n>Primero asegúrate de que tu convoy esté en condiciones.<n>Podrías visitar más ciudades con gobernador para ver si hay un barco más grande disponible en alguno de los astilleros.<n>De camino, visita al gobernador y obtén información sobre el escondite pirata."
"0xdb2d1178" = "Las batallas portuarias son similares a las batallas navales, salvo que la batalla es entre tú y torres de cañón muy sólidas en lugar de otros barcos.<n>Para ganar una batalla portuaria, tienes que destruir todas las torres.<n>A veces hay barcos armados en el puerto. En ese caso, primero debes combatir contra los barcos antes de poder atacar el puerto propiamente dicho."
"0xdb2d1179" = "Para terminar este escenario, vuelve a [ref:Cartagena] con tu convoy."
"0xdb4287ac" = "El gobernador de [ref:Cartagena] cree que tienes un gran potencial y te hace un regalo de @g$Gold$.<n><n>Consejo:<n>Compra mercancías de las que hay abundancia en una ciudad (la cantidad no debe mostrarse en rojo). Luego véndelas en una ciudad donde escaseen, para asegurarte un mejor precio.<n><n>Así aumentarás pronto tu riqueza."
