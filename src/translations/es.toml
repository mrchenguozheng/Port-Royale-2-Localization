"0x2f40c20b" = "No has terminado a tiempo con la hambruna de [town:Tortuga]. Para terminar con la hambruna debes asegurarte de que haya un mínimo de tres tipos de alimentos disponibles en la ciudad para el consumo diario. Si consiguieras los cuatro tipos de alimentos, la hambruna terminaría aún antes."
