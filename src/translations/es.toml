"0x2c4a7b42" = "Tenías que establecer cinco negocios distintos en [town:Tortuga] e incrementar el número de ciudadanos a 1.500, pero no lo has conseguido.<n><n>Para acabar con éxito consigue las materias primas que necesites para construir los edificios: Madera y ladrillos. En cuanto la construcción esté en marcha, tendrás que empezar a atraer a la ciudad a las familias de colonos que necesites. Necesitas 30 familias de colonos para cada negocio, con lo que tendrás 120 ciudadanos nuevos."
