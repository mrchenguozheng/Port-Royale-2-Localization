"0xce36d9cb" = "Convoy de la expedición"
"0xce43a07c" = "Has atacado un convoy de una nación amiga. En este escenario, las naciones están en paz, lo que significa que no debes atacar bajo ningún concepto a comerciantes ni a convoyes militares."
"0xce4d9a57" = "Comerciar en la ciudad"
"0xce75e5c4" = "Ya has aprendido a comprar y vender mercancías. Siempre deberías comprar mercancías en las ciudades donde se producen, pues generalmente son más baratas allí.<n><n>Nota: Si quieres comerciar con un convoy, debes haberlo seleccionado y ya debe estar en la ciudad antes de entrar en los muelles.<n><n>Más adelante en este escenario, deberías obtener beneficios comerciando por tu cuenta. La ventana de eventos contiene consejos para ello.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Debes reunir @g$GoldGoal$ en efectivo mediante el comercio."
