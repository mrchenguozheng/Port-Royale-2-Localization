"0xeeced82e" = "Hola, @s$USER$. Parece que @n$Nation$ sufre una escasez de @G$Goods$ en sus territorios europeos. Por eso estoy organizando una expedición a Europa. Compraré tanta cantidad de @G$Goods$ como puedas ofrecer, y estoy dispuesto a pagarte @g$FullPrice$ por barril. ¿Te interesa?"
"0xeeced82f" = "Salud. Estoy organizando una expedición a Europa. El momento es muy bueno, porque podemos sacar provecho de la escasez de @G$Goods$ que sufren allí. Te ofrezco comprarte tantas mercancías como puedas suministrar y a un precio muy bueno: Digamos @g$FullPrice$ por barril. ¿Trato hecho?"
"0xeeced830" = "Bienvenido, @s$USER$. Estoy organizando un convoy a Europa; por lo visto los precios de las importaciones de @G$Goods$ están son muy elevados. Ofrezco @g$FullPrice$ por barril a quienquiera que pueda entregarme @G$Goods$. ¿Hacemos un trato?"
