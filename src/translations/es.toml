"0xd979efd5" = "Así sea. Empieza a construir un hospital en @T$Town$ antes de @D$EndDate$."
"0xd99426c9" = "¿Te atreves a jugar una partidita de cartas conmigo?<n><n>¡Entonces elige tu apuesta! Igualaré la cantidad y el ganador se lo lleva todo."
"0xd99426ca" = "Ni siquiera necesito preguntarte si jugarás conmigo; estás tan sin blanca como una cubierta recién fregada. Vuelve cuando tengas los bolsillos llenos."
"0xd99426cb" = "Oh no, tú otra vez no. Aún recuerdo nuestra última partida. ¿Todavía no has tenido bastante? Bueno, por ahora no pienso jugar contigo."
"0xd99426cc" = "Todos han recibido 5 cartas. Anuncio %1 puntos.<n><n>Si quieres jugar, debes anunciar un punto más."
"0xd99426cd" = "Entonces me apunto. %1 son triunfos.<n>Aquí está mi primera carta."
