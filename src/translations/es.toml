"0xf7c59ef9" = "Hay escasez de @G$Goods$ para procesar en mi ciudad. Las existencias de los distintos negocios ya son muy bajas. ¿Podrías ayudarme?"
"0xf7c59efa" = "Hace poco tuvo la Asociación de Productores Católicos en mi puerta. Se quejaban de que no hay suficiente @G$Goods$ en la ciudad. Tuve que soportar sus quejas durante tres horas. No puedo pasar por eso otra vez. ¿No podrías ayudarme a salir de esta delicada situación?"
"0xf7c59efb" = "¡Maldición! Una vez más, mi ciudad se ha quedado sin @G$Goods$. A veces no alcanzo a entender cómo los comerciantes residentes siguen con sus negocios. Hasta que haya resuelto este asunto, te agradecería que me ayudaras."
