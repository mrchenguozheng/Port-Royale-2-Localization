"0x13385f0f" = "¡Buen trabajo! Con su patente de corso, ahora está oficialmente al servicio de Holanda y participa en la guerra con Inglaterra. Eso significa que puede atacar barcos mercantes ingleses sin que su reputación sufra en Holanda, Francia o España.<n><n>Naturalmente, su reputación con Inglaterra se verá perjudicada y, a partir de ahora, siempre que esté en aguas inglesas debería estar atento a los convoyes militares que lo perseguirán.<n><n>Las ciudades inglesas se encuentran todas al sureste de las [ref:Turk Islands]. Navegue en esa dirección con su convoy y busque convoyes comerciales adecuados para apresar. Venda el botín y los barcos más pequeños para aumentar su riqueza.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aprese tres convoyes comerciales ingleses: aborde sus barcos y añádelos a su convoy. "
