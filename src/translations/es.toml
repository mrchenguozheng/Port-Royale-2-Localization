"0xdcba5843" = "Me alegro de verte, @A$USER$, pues necesito tu ayuda. Una vez estuve al servicio del pirata @P$PirateName$. Pero no tardé en pensármelo mejor e hice un trato con el gobernador de @T$TargetTown$. Por desgracia, mis antiguos camaradas se han enterado de ello y han puesto precio a mi cabeza. ¿Puedes ayudarme y llevarme a @T$TargetTown$?"
"0xdcba5844" = "Me han dicho que eres de toda confianza, @A$USER$. Estoy al servicio del gobernador de @T$TargetTown$ y debo verle urgentemente para transmitirle una información muy confidencial. Por desgracia, hay ciertas personas de importancia interesadas en evitar que llegue a @T$TargetTown$. Me pregunto si tú podrías garantizarme una travesía segura."
"0xdcba5845" = "Ay, las desgracias se abaten sobre mí. Hace varias semanas tropecé con un barco que pertenecía al célebre pirata @P$PirateName$. Sin embargo, el capitán de ese barco debía de ser muy inexperto, pues conseguimos hundirlo sin apenas esfuerzo.<n>Por desgracia, ese desventurado resultó ser el amado sobrino del pirata @P$PirateName$, que desde que conoció mi identidad me viene persiguiendo. Mi tripulación se ha apoderado de mi barco y ha huido presa del pánico y ahora me encuentro aquí abandonado.<n>¿Puedes ayudarme a llegar a @T$TargetTown$, mi ciudad natal?"
