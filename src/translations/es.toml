"0xea43addd" = "Esta es una buena oportunidad para nosotros. Una ciudad de @n$TargetNation$ desea alinearse con nuestra nación porque parece estar continuamente acosada por diversos conflictos. Quiero que apoyes a la ciudad hasta que decida cambiar de nacionalidad."
"0xea43adde" = "A problem has arisen regarding a town belonging to @n$TargetNation$. A written agreement setting out the peaceful handover of the town to our nation was signed long ago. Regrettably, @n$TargetNation$ is no longer honoring the agreement. I want you to support the town until such time as the disputes have been resolved."
"0xea43addf" = "Una ciudad de @n$TargetNation$ mantiene una disputa grave con su virrey. Sé cuál es el motivo y ahora planeo apoyar a la ciudad para tentarla a ponerse de nuestra parte. Tú podrías ayudarme a hacerlo."
