"0x132a8a31" = "%1 ha soltado al bucanero %2 para sabotear nuestras ciudades. No hace mucho atacó %3, y ahora está de camino a su ciudad natal. Me harías a mí y a mi nación un enorme favor si detuvieras a este bucanero en seco."
