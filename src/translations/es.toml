"0x0ea0e0e8" = "Bueno, ponte en marcha. Dirígete a las aguas alrededor de la ciudad de @T$TargetTown$."
"0x0ea0e0ea" = " Completa esta misión antes del @D$EndDate$."
"0x0eb34b66" = "En este escenario aprenderás a establecer negocios y a averiguar qué debes tener en cuenta al hacerlo. También construirás zonas residenciales para tus nuevos trabajadores.<n><n>En [ref:Port Royale] 2 puedes construir en cualquier ciudad en la que hayas comprado un permiso de construcción. Cuantos más permisos tengas, más caro será el siguiente. Ya tienes un permiso en la ciudad donde empezaste el juego, así que puedes empezar a construir edificios nuevos allí de inmediato.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construye una instalación de producción de cacao y una zona residencial en Santa Marta."
"0x0ede126a" = "Ahora ya sabe cómo funcionan las batallas navales. También es posible atacar una ciudad entera para saquearla o tomarla en nombre de otra nación. Sin embargo, para ello necesita grandes convoyes con barcos poderosos. Como puede imaginar, atacar una ciudad dañará seriamente su reputación con la nación en cuestión, y sus convoyes militares lo perseguirán a partir de entonces.<n><n>Como alternativa, puede atacar un escondite pirata. Los escondites piratas suelen estar en lugares secretos, pero en algún momento del juego se conocerá cada uno de ellos. Entonces podrá atacar un escondite pirata del mismo modo que ataca una ciudad, para destruir a toda la banda de piratas.<n><n>La fuerza de las defensas que rodean uno de estos escondites depende del tiempo que una banda de piratas haya estado en libertad y de lo exitosos que hayan sido sus convoyes al saquear barcos mercantes.<n><n>Su tarea final en este escenario será asaltar un pequeño refugio de piratas. Averigüe dónde se encuentra el escondite preguntando al gobernador de @T$TOWN$.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destruya el escondite pirata de @P$PirateName$."
"0x0eecc4e8" = "Colonia inglesa"
"0x0eecc4e9" = "Colonia francesa"
"0x0eecc4ea" = "Colonia holandesa"
"0x0eecc4eb" = "Colonia española"
"0x0f1ade15" = "Ahora debería crear puestos de trabajo en la ciudad y construir zonas residenciales.<n><n>Como los colonos solo querrán quedarse en su ciudad si encuentran trabajo allí, primero debería construir cuatro instalaciones de producción. Decida qué tipo de instalaciones de producción quiere construir. Pero asegúrese de producir solo mercancías que pueda vender con beneficio en otras ciudades, porque los costes de producción son elevados y depende de los beneficios que obtenga al vender las mercancías.<n><n>Cuatro instalaciones de producción ofrecen trabajo a 120 trabajadores. Como cada uno de estos trabajadores pertenece a una familia de cuatro miembros, debe proporcionar vivienda para 480 ciudadanos, es decir, cuatro zonas residenciales.<n><n>En cuanto estén listas sus instalaciones de producción y sus zonas residenciales, puede intentar traer colonos de otras ciudades a la suya. Los colonos normalmente esperan trabajo en las ciudades con gobernador. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumente la población de su ciudad a 480."
