"0xdcba5843" = "Me alegro de verte, @A$USER$, pues necesito tu ayuda. En otro tiempo serví bajo el pirata @P$PirateName$. Sin embargo, entré en razón e hice un trato con el gobernador de @T$TargetTown$. Por desgracia, mis antiguos camaradas se han enterado y han puesto precio a mi cabeza. ¿Puedes ayudarme y llevarme a @T$TargetTown$?"
"0xdcba5844" = "He oído que se puede confiar en ti, @A$USER$. Estoy al servicio del gobernador de @T$TargetTown$ y debo verlo urgentemente para darle una información muy delicada. Por desgracia, ciertas personas están empeñadas en impedirme llegar a @T$TargetTown$. Por eso te pregunto si puedes concederme un salvoconducto."
"0xdcba5845" = "Oh, estoy plagado de desgracias. Hace varias semanas me topé con un barco del famoso pirata @P$PirateName$. Sin embargo, el capitán de ese barco debía de ser muy inexperto, pues conseguimos hundirlo casi sin esfuerzo.<n>Por desgracia, ese pobre capitán resultó ser el sobrino favorito del pirata @P$PirateName$. Desde que oyó mi nombre, me persigue sin descanso. Mi tripulación se ha llevado mi barco y ha huido despavorida, y ahora estoy varado aquí.<n>¿Puedes ayudarme a llegar a @T$TargetTown$, mi ciudad natal?"
