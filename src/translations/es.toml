"0x34d36971" = "Ha sido necesario modificar la ruta comercial.<n><n>En esta partida, algunas de las ciudades de la ruta aún no han sido descubiertas y han sido eliminadas de la ruta; también es posible que la ruta intente interactuar con un almacén en una ciudad en la que no tienes. En este caso, el capitán llevará a cabo el comercio de los productos en cuestión."
