"0x163fff71" = "%1,<n>qué detalle pasarte por aquí. ¿Quieres que te ponga al corriente de las últimas noticias?"
"0x163fff72" = "%1,<n>me alegro de volver a verte. En los últimos días me he estado informando y tengo cosas que contarte."
