"0x00c59673" = "Ataque de un convoy militar"
"0x00cde503" = "<ts:20>Por primera vez, te has convertido en enemigo declarado de un país. Aquí tienes algunos consejos útiles.<n>-<t>Sólo te conviertes en enemigo si atacas los convoyes y las ciudades de un país<n>-<t>Para mejorar tu reputación, puedes sobornar a los gobernadores de las naciones. Tu reputación también irá mejorando automáticamente día a día, a medida que tus actos hostiles se vayan olvidando<n>-<t>No puedes atracar en los puertos de los países enemigos<n>-<t>Si, a pesar de ello, navegas rumbo a una ciudad enemiga, deberás anclar tu convoy en secreto: podrás entrar en la ciudad, pero no podrás comerciar en ella."
