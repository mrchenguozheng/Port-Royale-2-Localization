"0x080f2b29" = "<ts:20>Debes saber lo siguiente sobre las mercancías:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Hay cinco tipos distintos de mercancías que podrás ver agrupadas en la ventana de comercio: productos de primera necesidad, materias primas, manufacturas, productos coloniales y productos de importación (o de lujo)<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Cada ciudad puede producir cinco mercancías<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Hay dos tipos de ciudad: Las ciudades coloniales y las ciudades con gobernador o virrey<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Las ciudades con gobernador producen productos de primera necesidad y manufacturas. También reciben entregas regulares de productos de importación procedentes de Europa. Por ello, estas ciudades son el mejor lugar para encontrar manufacturas e importaciones.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Las ciudades con gobernador necesitan materias primas para producir manufacturas y productos coloniales, que son muy demandados para su exportación a Europa.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Las ciudades coloniales producen productos de primera necesidad, materias primas y productos coloniales. Cada producto colonial sólo puede producirse en determinadas zonas del Caribe. Por ejemplo, el café sólo está disponible al sur y al oeste del Caribe.<n><n>Deberías saber lo siguiente sobre los precios:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Cuanto mayor sea la demanda de una mercancía y menor la oferta en la ciudad, mayor será el precio.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Cuanto mejor sea tu reputación en un país, menor será el precio al que podrás comprar mercancías en las ciudades pertenecientes a ese país.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Debes comprar las mercancías sólo en las ciudades en que se producen.<n><n>La forma más rápida de conseguir dinero:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Compra productos coloniales y materias primas en las ciudades coloniales,<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Vende las mercancías coloniales en las ciudades con Gobernador y compra manufacturas e importaciones en ellas."
