"0x31ed47e7" = "A saboteur has contaminated the food supplies in Tortuga. This has immediately triggered a famine in the town.<n><n>Your task is to end this famine as quickly as possible.<n><n>For about 2-3 weeks, you must ensure that more goods are available than are consumed per day for as many foodstuffs as possible.<n><n>Hint: The foodstuffs include wheat, fruit, corn and meat.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>The famine must end by @D$EndDate$."
