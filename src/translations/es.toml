"0x00776793" = "Borrar registro"
"0x007c2733" = "Entonces te encargo llevar @T$TargetTown$ al estatus \"Economía próspera\" antes de @D$EndDate$. Lleva a la ciudad las mercancías que necesita y retira las mercancías excedentes, para que los comerciantes residentes vuelvan a producir como es debido. "
