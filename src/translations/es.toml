"0xe7519201" = "Entonces tenemos un trato. Tráeme @a$Amount$ de @G$Goods$ al mercado. Te esperaré allí hasta @D$EndDate$. Debes entregar las mercancías en un solo envío."
"0xe77b3422" = "No tengo más noticias para ti. Vuelve a verme cuando hayas cumplido la misión que te encargué."
