"0x132a8a31" = "%1 ha dado carta blanca al corsario %2 para que sabotee nuestras ciudades. Hace poco atacó %3, y ahora se dirige a su ciudad natal. Nos harías un gran favor a mí y a mi país si consiguieras acabar con sus correrías."
"0x132a8a32" = "Acabo de enterarme de que el corsario %1 acaba de partir de %2 para atacar una de nuestras ciudades. Espero que podamos detenerle antes de que actúe. "
"0x132a8a33" = "A las órdenes de %2, el corsario %1 se dispone a atacar nuestras ciudades. He podido saber que actualmente se encuentra en %3 preparando su próxima acción."
"0x132e00ca" = "¡Perfecto! A partir de hoy, nuestra enemistad es cosa del pasado."
"0x13385f0f" = "¡Buen trabajo! Ahora, con tu patente de corso, estás oficialmente al servicio de Holanda y metido en la guerra con Inglaterra. Así, ya puedes atacar barcos comerciales ingleses sin que por ello se resienta tu reputación en Holanda, Francia o España.<n><n>Como es natural, tu reputación en Inglaterra se verá dañada, y a partir de ahora, siempre que estés en aguas inglesas tendrás que estar atento a la presencia de posibles convoyes militares al acecho.<n><n>Todas las ciudades inglesas están al sudeste de [town:Turk Islands]. Navega con tu convoy en ese rumbo y busca convoyes militares que puedas capturar. Vende el botín y los barcos menores para aumentar tu riqueza.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Captura tres convoyes comerciales ingleses, aborda sus barcos e incorpóralos a tu convoy. "
"0x133e8429" = "en cuanto al puerto, es lo bastante seguro."
"0x13475956" = "Gestión del testeo y masterizado"
"0x13493847" = "El convoy está siendo reparado y no puedes disponer de él.<n>¿Quieres detener las reparaciones?<n>Recuerda que no recuperarás nada de lo que has pagado."
"0x13601073" = "Muchas gracias por traerme los documentos. En agradecimiento, acepta un regalo: En el puerto encontrarás una bricbarca."
"0x13601074" = "Muchas gracias por tu apoyo y por devolverme mis diarios. Como recompensa, he pedido que te sea entregada una bricbarca que encontrarás en el puerto."
