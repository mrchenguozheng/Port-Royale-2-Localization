"0xcff9644a" = "El juego «Pirata Manco» es un juego de azar con 32 cartas. Cada jugador pone su apuesta en el bote y recibe 5 cartas, que el otro jugador no puede ver.<n><n>Primero, cada jugador debe anunciar el número de puntos que cree que puede ganar, donde cada baza ganada equivale a un punto. El jugador que anuncia el número de puntos más alto lleva la partida y decide el palo de triunfo. Ahora debe intentar ganar al menos ese número de puntos.<n><n>El jugador que lleva la partida juega sus primeras cartas y el otro debe seguir jugando una carta del mismo palo, si puede. El jugador con la carta más alta gana el punto.<n><n>Si un jugador no puede seguir el palo, puede descartar cualquier carta o jugar una carta de triunfo.<n><n>La secuencia de las cartas es I, II, III, IV, Pirata, Novia, Gobernador, Loro. Una carta de triunfo supera a todas las demás cartas.<n><n>El jugador que ha ganado el punto juega la siguiente carta. Se continúa así hasta que alguien gane la partida.<n><n>Si el que lleva la partida consigue ganar el número de puntos que anunció, gana la partida y se lleva el bote. Si no lo consigue, gana su adversario."
