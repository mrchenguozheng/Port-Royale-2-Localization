"0x1f32f588" = "Objetivo de la campaña no conseguido"
"0x1f36e96b" = "Esperamos la llegada en breve de un convoy de transporte. Uno de nuestros espías me ha revelado que nuestro enemigo planea atacar este convoy en su viaje de regreso a Europa. ¿Puedes proteger el convoy en su camino de vuelta a casa? "
"0x1f36e96c" = "Hay un asunto que inquieta mucho. Mi mujer quiere viajar a Europa en el próximo convoy, para visitar a su familia. El problema es que según nuestros espías, @n$HostileNation$ se ha enterado de ello y planea interceptar el convoy. ¿Puedes garantizar a mi mujer una travesía segura?"
"0x1f36e96d" = "Necesito enviar con urgencia unos importantes documentos a Europa. Como actualmente estamos en guerra con @n$HostileNation$ y no puedo correr ningún riesgo, quiero disponer de una escolta adicional. ¿Podrías proporcionar tú esa protección? "
"0x1f6696d2" = "Lo siento, finalmente no puedo encomendarte esta misión. Acabo de ser informado de que el problema ha dejado de serlo."
"0x1f851477" = "El convoy que debía llevar a cabo esta misión ha sido destruido."
"0x1f890b43" = "El encargo"
"0x1f9a14b7" = "<n><n>Para atacar la guarida tendrás que enviar un convoy allí, del mismo modo en que lo enviarías a una ciudad. ¡Pero cuidado! Cualquier convoy pirata que haya escapado del combate o no se encuentre en la guarida cuando la conquistes será alertado y establecerá una nueva guarida."
"0x1fb02f3a" = "Guardar"
"0x1fcb6529" = "Finalizar batalla naval"
"0x1fd35f28" = "Animación"
"0x1fdba107" = " Su salario diario es de %1."
"0x1fe06eb2" = "Capacidad<n>%1%"
"0x1fe25594" = "Tras atravesar las defensas, tu convoy atraca en el puerto y los marineros se dirigen a la ciudad. Por el camino se encuentran con el comandante al mando de la guardia de la ciudad, quien se niega a dejar libre el paso y exige batirse en un duelo justo. Tu capitán acepta el reto."
"0x1fea1f37" = "¿Quieres finalizar esta partida y cargar la partida guardada?"
"0x1ff731c7" = "Guardar ruta comercial"
"0x200d4e11" = "%1 %2 %3"
"0x20252656" = "Descubrimiento de oro en %1"
"0x20413ba0" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
"0x204cf373" = "Apoyar a la ciudad"
"0x204d1e7c" = "Las guaridas de los piratas sólo pueden ser atacadas desde el mar"
"0x20574fcc" = "¡%1, has tomado la amada ciudad de mi padre para entregársela a %2! Como comprenderás, no quiero saber nada más de ti y espero no volver a verte en mi vida. Debes saber que jamás significaste nada para mí y que no dedicaré ni un minuto más de mi tiempo a pensar en ti.<n>Sinceramente, espero que antes o después recibas el castigo que mereces.<n><n>%3"
"0x20574fcd" = "%1, al llevar a cabo la anexión para %2, has obligado al virrey a trasladarse a la amada ciudad de mi padre, que ahora se ve obligado a volver a Europa.<n><n>No quiero saber nada más de ti. Espero no volver a verte nunca. También quiero que sepas que los parroquianos de la taberna me interesaron siempre muchísimo más que tú. Jamás significaste nada para mí y a partir de hoy ocuparás el último lugar en mis pensamientos.<n><n>Espero que antes o después recibas el castigo que mereces.<n><n>%3"
"0x2065f070" = "Mira esto. Acabo de recibir un mensaje de mi embajador en el que me informa de que %1 nos brinda una inesperada oferta de paz. Esto significa que probablemente hoy mismo se firme el armisticio. <n><n>Por lo tanto, ya no puedo asignarte la misión de tomar una de sus ciudades."
"0x207295a1" = "Ya existe una ruta comercial con el nombre de%1'.<n><c>¿Quieres sobrescribirla?"
"0x2077407d" = "%1,<n>me alegro de que hayas venido. Entra, veamos si tengo algo para ti."
"0x207a9d35" = "El comandante al mando de la guardia de la ciudad hace una llamada a tu capitán desde el muro de la ciudad y le propone poner fin a la batalla y batirse en duelo con él. Tu capitán acepta para evitar más bajas."
"0x207b620f" = "Una vez que tus tropas han echado abajo la puerta de la ciudad, se enfrentan con el comandante al mando de la guardia de la ciudad, quien reta a tu capitán a un duelo."
"0x208aca1b" = " Estate al acecho de convoyes ingleses en la zona y destruye @I$NumConvoys$ de ellos."
"0x208aca1c" = " Estáte al acecho de convoyes franceses en la zona y destruye @I$NumConvoys$ de ellos."
"0x208aca1d" = " Estáte al acecho de convoyes holandeses en la zona y destruye @I$NumConvoys$ de ellos."
"0x208aca1e" = " Estáte al acecho de convoyes españoles en la zona y destruye @I$NumConvoys$ de ellos."
"0x209d658e" = "Fecha"
"0x20abe2eb" = "Alan Wild"
"0x20b21199" = "Vender"
"0x20b2119a" = "Devolver"
"0x20ccd2d7" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen>"
"0x20d2607a" = "¡Así se hace! [town:Tortuga] vuelve a gozar de una situación económica de \"auge\". Has cumplido la tarea en @I$Days$ días."
"0x20de74a6" = "Persecución de barcos"
"0x20e2a2f4" = "Media para 1 día. Beneficios medios diarios %1."
"0x20eedea9" = "No fue posible guardar la ruta comercial."
"0x20eef526" = "<ts:80><ts:145><ts:210><n>Resultado de la batalla:<n><n>"
"0x20ff905e" = "Tripulación"
"0x2106ce9e" = "En la taberna encontrarás a un capitán experimentado."
"0x21117682" = "<n><n>Por lo general, siempre podrás devolver un permiso de construcción que hayas adquirido. Sin embargo, en este caso no puedes hacerlo porque %1 es la ciudad en la que empezaste el juego."
"0x21117683" = "<n><n>¿Quieres devolver tu permiso?<n>¡Recuerda que no te pagaré nada por ello!"
"0x211c8552" = "Fin del tiempo de juego"
"0x2137ec23" = "Gracias. Te pagaré precios un alto precio por el vino, las herramientas y especias hasta el @D$Date$. Reúnete en el mercado con mi emisario y entrega @a$Amount$ de cada. Él solo aceptará una entrega completa y te pagará en el momento."
"0x2137ec24" = "Eso suena bien. Viaja, pues, a las ciudades de nuestros enemigos y compra allí todos los artículos de importación. Entrega @a$Amount$ de cada antes del @D$Date$ a mi emisario en el mercado de @T$TOWN$, él pagará más del doble del precio habitual."
"0x2137ec25" = "¿Sabes qué sería lo mejor? Comprar todos los artículos de importación en @n$Nation2$ y provocar allí un desabastecimiento. Entrega @a$Amount$ de cada en el mercado. Mi emisario esperará allí hasta el @D$Date$ y te pagará un alto precio."
"0x215e37a6" = "Hace poco oí por casualidad una conversación en la que un comerciante mencionaba que se había hundido uno de sus barcos. No estaba demasiado preocupado por el barco, ya que solo era una vieja tina desvencijada. Pero contenía un cofre especial a bordo."
"0x215e37a7" = "Tenemos, pues, un acuerdo. En el último viaje en el que me alisté, por alguna razón el capitán perdió los estribos a causa de un cofre, del que entonces se deshizo arrojándolo por la borda."
"0x215e37a8" = "Un hombre que una vez fue un buen amigo se ha escapado con un caro cofre de mi propiedad."
"0x2167838b" = "Compra de barcos"
"0x21743bf7" = " ¡Debo recuperarlo! No sabemos el lugar exacto en el que se hundió el barco. @l$ChestPos$ Tráeme el cofre antes del @D$EndDate$."
"0x21743bf8" = " Tienes que conseguirme el cofre antes del @D$EndDate$. @l$ChestPos$"
"0x21743bf9" = " Hace muy poco me escribió para contarme que había lanzado este cofre por la borda. @l$ChestPos$ ¡Tienes que recuperar mis cosas! Podrás encontrarme aquí hasta el @D$EndDate$."
"0x217923cb" = "Fin de la entrega de mercancías: %1"
"0x2190d204" = "Un comerciante local está dispuesto a pagarte %1 por el negocio."
"0x21a69afe" = "Director de márqueting"
"0x21b0dfff" = "%1 saquea %2"
"0x21b3050a" = "Un convoy militar ha destruido las defensas del puerto de la ciudad y ha saqueado sus productos. La situación económica de la villa se ha visto seriamente afectada."
"0x21bdc952" = "siguiente gráfico"
"0x21bf83f0" = "Mostrar permanentemente información de los barcos"
"0x21c2f2cf" = "<n><o:0xffC00000>Misión no cumplida. <o:0xff000000>"
"0x21cae149" = "¡Muy bien! Ahora tienes que conseguir que tu convoy sea más potente para poder capturar varios convoyes militares. Como mínimo, tu convoy debe disponer de tres barcos de la clase fragatas o más grandes.<n><n>Puedes capturar los barcos o intentar comprarlos en los astilleros de las ciudades con gobernador.<n><n>Convierte estos barcos en barcos escolta y asegúrate de que estén perfectamente armados y con toda su tripulación de marineros.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arma tu convoy para que disponga al menos de tres barcos escolta, como mínimo del tamaño de una fragata, perfectamente armados y con toda su tripulación. "
"0x21d142f5" = "Reparar el convoy en esta ciudad"
"0x21e727b4" = "Estoy seguro de que habrás oído hablar del pirata @P$PirateName$. Ya tiene @I$NumConvoys$ convoyes y todavía no hemos descubierto su guarida. Afortunadamente, conocemos el paradero de uno de sus convoyes. A lo mejor aún está cerca de aquí. Quiero que destruyas este convoy. "
"0x21e727b5" = "Debemos actuar con rapidez: Acabo de enterarme del paradero de uno de los convoyes del pirata @P$PirateName$. Encuentra y destruye este convoy."
"0x21e727b6" = "Todos los piratas tienen una guarida desde la que envían convoyes a capturar botines; es lo habitual. Pero el pirata @P$PirateName$ empieza a ser preocupante. Ha reunido una flota de @I$NumConvoys$ convoyes. Hemos descubierto por casualidad el reciente paradero de un importante capitán de esta banda y su convoy. Quiero que encuentres y destruyas este convoy."
