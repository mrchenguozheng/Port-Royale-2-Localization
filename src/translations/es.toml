"0xc558e134" = "Si quieres que el mayor número posible de comerciantes visite tu ciudad, sencillamente no deberías abastecerla de determinadas mercancías. Lo ideal es elegir mercancías que se producen en ciudades cercanas, porque los comerciantes tendrán en cuenta la duración del trayecto.<n><n>Los comerciantes que visitan tu ciudad compran automáticamente las mercancías que abundan y que, por lo tanto, tienen precios bajos en tu ciudad. Puedes vender directamente a tu ciudad las mercancías que hayas producido. Mientras no sean más caras que en otras ciudades, los comerciantes las comprarán con regularidad.<n><n>La ventaja de esto es que siempre habrá suficientes mercancías disponibles para tus ciudadanos y además no tendrás que preocuparte por transportarlas a otras ciudades."
