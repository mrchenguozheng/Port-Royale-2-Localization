"0xf92d7da5" = "%1%"
"0xf932eef8" = "¡Enhorabuena! Has superado esta campaña y ya sabes cómo construir tu ciudad y convertirla en un próspero lugar.<n><n>En cualquier otra partía puedes recibir una hacienda de manos de un virrey, pero para ello tienes que capturar ciudades y, por tanto, se resentirá tu reputación en las otras naciones.<n><n>Todo lo que hayas aprendido en esta campaña sobre el desarrollo de tu ciudad también te ayudará a desarrollar negocios en otras ciudades. La diferencia principal estriba en que no tienes que preocuparte de defender esas ciudades."
