"0x13cd046e" = "Cuando captures ciudades enemigas para un virrey, éste te recompensará con una hacienda. En ella podrás levantar tu propia ciudad<n><n>Tu próximo objetivo consiste en mejorar tu reputación en España, porque un virrey sólo te recibirá cuando goces de buena reputación en su nación.<n><n>En la vista de la ciudad, bajo el nombre de la misma, podrás comprobar la reputación de la que gozas en cualquier nación. En [town:Margarita], donde empiezas el juego, se ven tres banderas que muestran tu relación con España.<n><n>Puedes mejorar tu reputación en cualquier nación cumpliendo misiones para sus gobernadores, cazando piratas o comerciando con sus ciudades y suministrándoles las mercancías que necesiten.<n><n>Como España y Francia están en guerra, el gobernador de [town:Margarita] puede darte una Patente de Corso con la que podrías mejorar rápidamente tu reputación.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Mejorar tu relación con España hasta que sea \"amistosa\"."
"0x13d92dd7" = "%1 (%2)"
"0x13ec9ac1" = "Has realizado una acción que impide conseguir los objetivos de la campaña.<n><n>Para evitar esto, sigue las instrucciones de la Ventana de mensajes."
"0x1401d917" = " @s$USER$, Tengo una información que estoy seguro vale @g$Price$. Mi cuñado conoce a @N$TeacherName$, un capitán retirado."
"0x1401d918" = "Siéntate aquí junto a mí y sírveme un poco de ron, tengo noticias para ti. En mi último viaje conocí a @N$ContactName$. Era amigo y estudiante del legendario @N$TeacherName$. "
"0x1401d919" = " @s$USER$, siéntate a mi lado, sé dónde puedes conseguir adiestramiento para uno de tus capitanes. ¿Te acuerdas de @N$TeacherName$? "
