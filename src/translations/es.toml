"0x0087e50b" = "+"
"0x00885bdb" = "¡Bien hecho! ¡Ahora tienes una ciudad propia! Nadie más que tú puede construir en esta ciudad. <n><n>La ciudad ya tiene algunos edificios, como los muelles, donde puedes comerciar, y tu palacio. El resto debes construirlo tú.<n><n>Navega con tu convoy hasta tu ciudad. Lleva toda la madera y todos los ladrillos que puedas, porque los necesitarás para levantar edificios.<n><n>Primero, construye un astillero, donde podrás reparar tus propios barcos.<n><n>Nota:<n> Mantener la tripulación de tus barcos de escolta cuesta mucho. Deberías licenciar a la tripulación, pues ya no la necesitas.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visita tu nueva ciudad y construye un astillero."
"0x009aa6c5" = "%1 (hace 1 día)"
