"0x0a49c903" = "¡Enhorabuena! Has completado con éxito el segundo escenario. Has aprendido a comerciar con beneficio, has alcanzado un rango superior y has reunido un nuevo convoy contratando a un nuevo capitán.<n><n>Ten en cuenta que cuanto más experiencia tienen los capitanes, más caros son. Al principio suelen tener muy poca experiencia, pero, con el tiempo, todos los capitanes adquieren experiencia en navegación, comercio y combate, según cómo los emplees. Puedes consultar los niveles de experiencia actuales de tus capitanes en el resumen de un convoy. Para ello, haz clic en un convoy y luego en el botón «Resumen y costes».<n><n>En el siguiente escenario establecerás tus propios negocios y producirás mercancías. "
