"0x24646e83" = "Torre de cañón"
"0x24695110" = "Gracias. Soy un comerciante de @T$Town$. Como mis perseguidores no saben dónde me alojo, seguro que intentarán atraparme en mi ciudad natal. Empieza a buscarme allí y mata a los cazadores de recompensas. Debo marcharme de aquí a más tardar el @D$EndDate$. Si cumples la misión antes, te pagaré @g$Reward$."
"0x24695111" = "Debo volver a @T$Town$ con urgencia, pues tengo unos asuntos que resolver allí antes de poder marcharme para siempre. Desgraciadamente, un cazarrecompensas vigila las rutas de acceso a @T$Town$, y debes matarlo. Te recompensaré con @g$Reward$ si cumples la misión antes de @D$EndDate$."
"0x24695112" = "¡Gracias! Sospecho que un cazador de recompensas vigila la entrada del puerto de @T$Town$.<n>Esto es lo que haremos: correré la voz de que me dirijo a bordo de uno de tus barcos; entonces tú zarpas rumbo a @T$Town$ y ves qué pasa.<n>Avísame a más tardar el @D$EndDate$ de que la costa está despejada y entonces te pagaré una recompensa de @g$Reward$."
"0x246aece6" = "%1: Hambruna."
"0x2478c95f" = "¡Enhorabuena! Has completado con éxito este escenario y has librado el Caribe del azote de un famoso pirata.<n><n>A lo largo de la partida aparecerán escondites piratas por sí solos. Sin embargo, el número de convoyes piratas depende de lo exitosos que sean. Ten en cuenta que los piratas solo quieren saquear convoyes comerciales y recelan mucho de los convoyes militares. Por eso evitan las aguas donde hay demasiados convoyes militares en circulación.<n><n>También puedes dar caza a los piratas y descubrir sus escondites en el modo de juego libre. "
"0x24802954" = "%1: Barco hundido"
"0x2487ab5c" = "Balance"
"0x248f1e26" = "Guarida del pirata %1"
"0x24901249" = "%1 de %2 marineros quieren unirse a tus aventuras."
"0x24a0f898" = "Astillero"
"0x24b0fd83" = "Bonificación"
"0x24c12812" = "¡Enhorabuena! Se le ha confiado una misión para tomar ciudades.<n><n>Como las ciudades pueden estar muy fuertemente defendidas, debería elegir una ciudad inglesa con un número mínimo de torres de cañón en su puerto. La ciudad de @T$SampleTown$ es un objetivo perfecto.<n><n>Para atacar una ciudad, active la opción Atacar ciudades para su convoy. Para ello, seleccione su convoy y haga clic en el botón Modo de ataque.<n><n>Puede atacar una ciudad desde el mar o desde tierra. Sin embargo, solo debería arriesgar un ataque desde tierra si sus marineros superan en número a los soldados de la ciudad. En ese caso, también debería poder armar a la mitad de sus marineros con sables y a la otra mitad con mosquetes.<n><n>Nota: si hay un convoy militar en el puerto de una ciudad, debe derrotar ese convoy antes de atacar la ciudad.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumpla su misión de tomar ciudades."
"0x24e18ac4" = "<f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x24ec3366" = "¡Excelente! Ahora tu convoy está armado y listo para localizar uno de los convoyes piratas de Barbanegra.<n><n>La ventana de eventos ofrece indicaciones diarias que te ayudarán a descubrir la ubicación del convoy pirata, siempre que la ubicación esté en alta mar. Encontrar piratas puede ser difícil, porque siempre regresan a su escondite tras saquear con éxito un barco mercante.<n><n>Recuerda que un convoy pirata puede tener hasta cinco barcos de guerra. Refuerza tu convoy si no crees que sea lo bastante potente. Ya sabes cómo hacerte con oro.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumple la misión que te ha encomendado el gobernador de @T$TOWN$."
"0x250c7a12" = "Entrega @a$Amount$ antes de @D$Date$. Puedes entregar las mercancías en el mercado y recibirás un pago inmediato de @g$GoldPerBarrel$ por cada <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> de @G$Goods$."
"0x250c7a13" = "Me alegro mucho. Entrega @a$Amount$ en el mercado. Allí recibirás tu pago de  @g$GoldPerBarrel$ por cada <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> hasta @D$Date$."
"0x250c7a14" = "Reúnete con mi emisario en el mercado. Entrega @a$Amount$ de @G$Goods$ antes de @D$Date$; te ofrecerá un buen precio."
"0x2540ea42" = "Texto adicional (cronista)"
"0x2546beb9" = "¿Así que @N$OwnerName$ te ha enviado a verme? Sí, conozco a ese viejo capitán; sin duda podría enseñar una o dos cosas a tu tripulación. Pero ¿por qué debería ayudarte? No quiero ponerme difícil, y reconozco que habrás tardado tiempo en encontrarme. Si me haces un pequeño favor, te diré dónde se ha retirado el capitán."
"0x2546beba" = "No conozco a ningún @N$OwnerName$, pero desde luego sé dónde está @N$TeacherName$. Supongo que podría decírtelo, si me apeteciera. ¿Qué tal si me haces un favor y yo te lo devuelvo? "
"0x2546bebb" = "Me da igual si te envía @N$OwnerName$ o el jorobado Gran Visir de Taipéi. Tengo un problema. Y hasta que se resuelva, no me interesa oír hablar de nada más. Tengo una propuesta: ¿qué tal si me encuentras un baúl? Y yo te diré dónde se esconde este viejo loco de @N$TeacherName$."
