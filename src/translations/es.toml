"0xe1cdc367" = "Ya has aprendido algunos de los controles básicos y sabes cómo enviar un convoy de una ciudad a otra. Esto es muy importante, porque al principio te ganarás la vida transportando y comerciando mercancías entre las ciudades.<n><n>En la segunda parte de este escenario comprarás un barco y lo añadirás a tu convoy actual.<n><n>Otro consejo:<n><n>Puedes pulsar F1 en cualquier momento del juego para ver una página de ayuda que explica la configuración del teclado y del ratón.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Tu convoy con dos barcos debe llegar al puerto de la ciudad de [ref:Cartagena]."
