"0xf4e195bf" = "Barbanegra ha descubierto que colaboras con el gobernador de @T$TOWN$. Por eso ha empezado a aterrorizar a los comerciantes que visitan @T$TOWN$. En pocos días, apenas habrá comerciantes que se atrevan a venir a @T$TOWN$. <n><n>Esto es solo una táctica temporal. Tu tarea es abastecer la ciudad de mercancías hasta el @D$EndDate$. El estatus de la ciudad no debe caer por debajo de «Economía floreciente».<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Abastece @T$TOWN$ de mercancías hasta el @D$EndDate$. El estatus de la ciudad no debe caer por debajo de «Economía floreciente»."
