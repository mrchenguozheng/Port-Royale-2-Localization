"0x2e114d05" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_Kaperbrief_800x600.screen> Patente de corso"
"0x2e26c37d" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Has descubierto un enorme alijo de mercancías y las llevas a bordo."
"0x2e26c37e" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Has descubierto un enorme alijo de mercancías, pero no tienes espacio para llevarlas a bordo."
"0x2e351896" = "MBA Studios"
"0x2e39d24e" = "Veo que eres un hombre acaudalado, %1.<n><n>Normalmente te pediría un préstamo, pero desgraciadamente solo puedo hacer este tipo de negocios con comerciantes locales. Por lo tanto, debes poder presentar un permiso de construcción para mi ciudad."
"0x2e544e31" = "Sassenbach Advertising"
"0x2e6c240e" = "Almacén de un comerciante local"
"0x2e811b0e" = "<g:INTEXT_HOLLAND_800x600.screen>"
"0x2e9966b2" = "Selecciona otro barco…   %1"
"0x2ea2e114" = "Cronista"
"0x2eba542c" = "Ingresos"
"0x2ebaaed0" = "Mercado"
"0x2ec0079c" = "Ataque desde tierra"
"0x2ee7d67a" = "Virrey de %1"
"0x2ee8bb8c" = "Estamos en la ciudad con gobernador de [ref:Cartagena], en el Caribe meridional.<n>Puedes entrar en los distintos edificios de una ciudad y realizar diversas acciones; hablaremos más de ello más adelante.<n>Primero, mira la parte superior de la pantalla. Puedes ver una serie de botones e indicadores.<n>Ahora haz clic en el botón con el reloj, en el extremo izquierdo de la pantalla."
"0x2ee8bb8d" = "Esta es la Crónica. Contiene un registro de todos los acontecimientos y sucesos del Caribe, más o menos como un periódico diario.<n>A la derecha de la ventana de la Crónica hay algunos botones. Puedes usarlos para mostrar información sobre el Caribe. Sin embargo, por el momento esto no es importante.<n>Ahora cierra la Crónica haciendo clic en el botón marcado con «X»."
"0x2ee8bb8e" = "En la parte superior de la pantalla, junto a la fecha, está el botón del diario y, a su lado, tu efectivo.<n>El diario te mantiene al día de cualquier información sobre tus éxitos y posesiones. Además, todos los mensajes y misiones que recibes se guardan aquí.<n>Abre el diario. "
"0x2ee8bb8f" = "Como puedes ver, el diario muestra de inmediato todos los mensajes que has recibido hasta ahora. Por el momento, solo muestra las instrucciones de este escenario.<n>Hay más botones a la derecha de la ventana del diario. Haz clic en el tercer botón. "
"0x2ee8bb90" = "Aquí se muestran las tareas y misiones que has recibido. Por el momento solo se muestra el objetivo del escenario.<n>Con los dos botones de la parte superior de la ventana de misiones puedes alternar entre las misiones actuales y las completadas.<n>Ahora cierra el registro. También puedes hacerlo simplemente con el botón derecho."
"0x2ee8bb91" = "Más adelante en la partida podrás aceptar numerosas misiones para alcanzar fama y fortuna.<n>Primero, echemos un vistazo a la ciudad. Como puedes ver en el indicador de la parte superior central de la pantalla, estamos en [ref:Cartagena]. La ciudad tiene unos 2.000 habitantes.<n>Haz clic en el botón que muestra el nombre de la ciudad."
"0x2ee8bb92" = "Esto abre una ventana que muestra información sobre la ciudad.<n>[ref:Cartagena] es una ciudad con gobernador y pertenece a España. También puedes ver el estatus de la ciudad y las mercancías que se pueden producir allí.<n>Ahora entra en un edificio. Para ello, cierra la información de la ciudad."
"0x2ee8bb93" = "Puedes usar las teclas de flecha del teclado para moverte por la vista de la ciudad. Ahora echa un vistazo al centro de la ciudad, dentro de las murallas. Contiene edificios como los muelles, la iglesia y el palacio del gobernador.<n>Haz clic una vez en cualquiera de estos edificios."
"0x2ee8bb94" = "La visualización en la parte inferior central de la pantalla cambia cuando haces clic en un edificio. Según el tipo de edificio, recibirás información o podrás hacer ciertas cosas.<n>Hay botones a la derecha de la visualización del edificio. Para salir del edificio, haz clic en el botón marcado \"X\"."
"0x2ee8bb95" = "Los edificios en los que puedes realizar diversas acciones se encuentran siempre dentro de las murallas de la ciudad. Tu almacén es una excepción, y hablaremos más de ello en el siguiente escenario.<n>Ahora sal del edificio y usa las teclas de flecha para mostrar el puerto y el convoy llamado «Santa Maria». Haz clic en él."
"0x2ee8bbfd" = "Como puedes ver, ahora aparece información sobre tu convoy en la parte inferior central de la pantalla.<n>El convoy ya ha cargado mercancías: 10 barriles de trigo y 15 barriles de maíz.<n>Hay varios botones a la derecha de la visualización del convoy. Haz clic en el segundo botón (el que tiene el icono de un barco)."
"0x2ee8bbfe" = "Esto muestra el número de barcos del convoy. Un convoy puede tener hasta 10 barcos dirigidos por un capitán.<n>Ahora enviemos el convoy a otra ciudad.<n>Haz clic en el botón con la flecha en la parte superior derecha de la pantalla para salir de la ciudad y mostrar la carta náutica."
"0x2ee8bbff" = "Ahora aparece la carta náutica. En el centro de la pantalla verás la ciudad de [ref:Cartagena].<n>Puedes usar los botones de flecha para desplazar la zona del mapa que se muestra y ver todo el mundo del juego.<n>Ahora busca la ciudad de [ref:Port Royale] en una isla al norte y haz clic derecho sobre la ciudad con tu convoy seleccionado."
"0x2ee8bc00" = "Se traza una ruta y tu convoy parte.<n>Al hacer clic derecho en [ref:Port Royale], lo has seleccionado como destino de tu convoy.<n>Si el convoy tarda demasiado en llegar a la ciudad, puedes simplemente avanzar el juego rápidamente pulsando la barra espaciadora (ajuste predeterminado). "
"0x2ef566b4" = "Teclado"
"0x2ef8f665" = "Te doy la bienvenida a %1,<n><n>Quisiera darte algunos consejos para que puedas orientarte más rápido en la región alrededor de %2 y así ayudar a mi nación a expandir esta ciudad y otras.<n>Seguro que ya conoces la información básica sobre las ciudades con gobernador: necesitan un suministro constante de mercancías coloniales para exportarlas a Europa. Al mismo tiempo, estas ciudades suelen ofrecer una surtida gama de mercancías de lujo, que pueden venderse con un buen beneficio en otras ciudades.<n>Solo una cosa más: puede que te interese saber que los gobernadores asignan misiones de vez en cuando. Sin embargo, no puedes aceptar misiones hasta que hayas alcanzado el rango de Grumete.<n><n>%3 %4, gobernador de %5"
"0x2efebfdd" = "Como tu convoy ha llegado a [ref:Port Royale], ahora puedes entrar en la ciudad. Solo tienes que hacer clic en el símbolo de la ciudad (con las casitas)."
"0x2efebfde" = "Ahora vuelves a ver la conocida vista de la ciudad, pero esta vez es [ref:Port Royale]. Puedes moverte por cualquier ciudad en la que tengas convoyes o edificios.<n>Busca el astillero en el puerto y haz clic en él, porque queremos comprar un barco nuevo."
"0x2efebfdf" = "Ahora el astillero se muestra en la ventana de selección donde antes se mostraba el convoy.<n>Echa un vistazo al astillero haciendo clic en los botones a la derecha del panel del astillero.<n>Después vuelve al panel «Comprar barco» y mira los barcos disponibles.<n>Compra el barco que quieras."
"0x2efebfe0" = "¡Enhorabuena! Has comprado tu primer barco.<n>El barco se entregará al puerto de la ciudad.<n>Ahora sal del astillero y haz clic en las aguas del puerto. La ventana de selección muestra ahora los barcos individuales del puerto.<n>Haz clic en tu nuevo barco."
"0x2efebfe1" = "Esto muestra los datos del barco, que ya viste en el astillero.<n>Antes de poder hacer algo con un barco individual, debes añadirlo a un convoy.<n>Para ello, selecciona de nuevo tu convoy."
"0x2efebfe2" = "Ahora quieres indicar a tu convoy que interactúe con el puerto.<n>Haz clic derecho en el puerto.  "
"0x2efebfe3" = "Se abre una ventana de transferencia, en la que puedes añadir barcos individuales al convoy.<n>Para ello, haz clic en el barco suelto a la izquierda y arrástralo hasta el convoy, de modo que el convoy quede formado por dos barcos.<n>Luego cierra de nuevo la ventana de transferencia con el botón \"X\" de la derecha."
"0x2efebfe4" = "También puedes formar otro convoy con un barco nuevo contratando a un nuevo capitán en la posada.<n>Sin embargo, no puedes hacerlo en este momento porque tu rango no es lo bastante alto.<n>Ahora selecciona la lista de barcos del convoy. Es el segundo botón."
"0x2efebfe5" = "Ahora tienes en el puerto de [ref:Port Royale] un convoy con dos barcos.<n>Puedes hacer clic en los barcos de la lista de barcos del convoy para conocer detalles sobre ellos.<n>Ahora envía el convoy de vuelta a tu ciudad natal, [ref:Cartagena]. Para ello, ve a la carta náutica pulsando el botón con la flecha en el extremo superior derecho de la pantalla. "
"0x2efebfe6" = "Ahora busca la ciudad de [ref:Cartagena], al sur, y envía tu convoy allí haciendo clic derecho sobre la ciudad.<n>Este escenario terminará en cuanto el convoy llegue a la ciudad."
"0x2f0127e1" = "Pasas un día muy agradable con %1 y le cuentas tus aventuras."
"0x2f0127e2" = "Pasas una tarde muy agradable con %1 y te olvidas por un tiempo de tus asuntos comerciales."
"0x2f0127e3" = "Pasas la velada con %1 y deseas que vuestro tiempo juntos no termine nunca."
