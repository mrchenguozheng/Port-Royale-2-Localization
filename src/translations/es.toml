"0xdfb9b5b7" = "¡Excelente! Ahora dispone de @g$Gold$.<n><n>Cada nación tiene convoyes militares para defender sus ciudades y proteger las aguas que las rodean. Cuantas más ciudades ocupe una nación, más convoyes militares necesita para garantizar que estén suficientemente protegidas.<n><n>Si una nación pierde un convoy militar, su fuerza militar se debilita. Dado que los convoyes militares son bastante agresivos con las ciudades y convoyes de la nación enemiga durante una guerra, una nación puede perder de vez en cuando un convoy militar. Por eso se envían regularmente convoyes desde Europa para reforzar la fuerza militar de una nación en el Nuevo Mundo.<n><n>Puede consultar la fuerza de una nación en «Naciones», en la Crónica. Si una nación aparece descrita como débil, sus ciudades pueden ser tomadas.<n><n>Ahora debería derrotar suficientes convoyes militares ingleses para que la fuerza de Inglaterra se califique como «débil».<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Derrote suficientes convoyes militares ingleses para que Inglaterra se califique como «débil»."
