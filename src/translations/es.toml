"0xcc04e86c" = "Mantenimiento"
"0xcc0a1380" = "Busca el convoy pirata capitaneado por @P$PirateName$, que se encuentra aproximadamente a un día al noreste de la isla de Providencia. Destrúyelo.<n>Después, vuelve ante el gobernador de [town:Cartagena]."
"0xcc1709af" = "%1 te es ahora hostil"
"0xcc2c64fb" = "Se te ha asignado la misión de seguir y destruir uno de los convoyes piratas del temible Barbanegra.<n><n>Barbanegra tiene un escondite secreto donde se ocultan sus convoyes, cada uno de ellos compuesto por cinco barcos perfectamente pertrechados. Va a ser una misión difícil de cumplir con el convoy que posees actualmente.<n><n>Por ello tienes que empezar por incrementar la potencia de fuego de tu convoy. Para conseguir dinero suficiente como para comprar barcos más potentes puedes vender las mercancías de tu almacén de @T$TOWN$ al mejor precio que puedas conseguir. Sigue las pistas de la ventana de mensajes, que te informarán de los lugares en los que puedes vender mercancías a buen precio al norte y este de @T$TOWN$.<n><n>¡Actúa rápido, porque después tendrás cumplir la misión del gobernador!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vender las mercancías de tu almacén de @T$TOWN$ e incrementar tu riqueza hasta alcanzar @g$GoldGoal$."
"0xcc475a7d" = "Maestro constructor"
"0xcc528764" = "Edificio de la comunidad"
"0xcc56863a" = "Costes salariales diarios"
"0xcc5bfb04" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Misión actual<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0xcc72dc12" = "Trucos de compraventa"
"0xcc823e54" = "La guerra con @n$TargetNation$ nos ha dado varios disgustos recientemente. A la luz de los recientes acontecimientos, ha llegado la hora de que nos venguemos. Quiero que captures o hundas barcos militares en mi nombre. ¿Aceptas esta misión? "
"0xcc823e55" = "Recientemente, @n$TargetNation$ atacó una de nuestras ciudades. Ahora estoy planeando mi propia acción militar contra @n$TargetNation$ y me estaba preguntando si te gustaría tomar parte de ella. Quiero que hundas o captures convoyes militares. Todo lo que consigas será para ti; a mí lo único que me interesa es debilitar a @n$TargetNation$. ¿Te interesa?"
"0xcc823e56" = "Una de nuestras ciudades ha sido atacada por @n$TargetNation$. Como venganza, hemos iniciado una campaña de hundimiento de sus barcos. Desearía enviarte a una zona en particular y autorizarte a capturar o hundir barcos militares. "
