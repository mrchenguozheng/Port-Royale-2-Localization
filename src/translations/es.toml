"0xda75935c" = "Capturar una ciudad"
"0xda93dbe1" = "¡Muy bien! Ahora que Inglaterra ha perdido muchos convoyes militares ya puedes capturar alguna de sus ciudades. En agradecimiento por tus servicios, el gobernador de [town:Turk Islands] te facilita cuatro carracas más.<n><n>Sólo puedes capturar ciudades por orden del virrey de una nación enemiga. Un virrey sólo te pedirá que captures una ciudad si su nación es militarmente fuerte y la del enemigo es débil.<n><n>Lamentablemente, Holanda no es suficientemente fuerte como para poder capturar una ciudad. Pero puedes hacer algo para intentar remediarlo: Visita al virrey holandés en [town:Grand Bahama] y entrégale uno de tus convoyes para incrementar el poder de Holanda.<n><n>Si quieres entregarle un convoy a un virrey, el convoy debe contar con cinco barcos y un mínimo de 150 cañones.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Ayuda al virrey a incrementar la fortaleza militar de Holanda. Después, acepta la misión de capturar ciudades en su nombre."
"0xdab4fea7" = "Viviendas"
"0xdac343f7" = "IDM_CONTEST_01_2004_LOG_03_HDR"
"0xdac43b47" = "Falta de colonos"
"0xdacb8ff6" = "[term:en_quality_of_life] en tu ciudad"
"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "Tecla"
"0xdaeb0484" = "Esta vez comienzas la campaña en [town:Cartagena], una ciudad con gobernador emplazada en medio del Caribe.<n>Tu convoy, consistente en un balandro, se encuentra en el puerto.<n>Lo primero que harás será armar tu convoy, porque en esta campaña habrá batallas navales.<n>Ve a la lonja y abre el menú Productos - Dotación."
"0xdaeb0485" = "Como verás, no llevas ni cañones ni munición a bordo de tu convoy, por lo que deberás equiparlos. También necesitarás tripulación.<n>Embarca tantos tripulantes y cañones como puedas y por lo menos 10x10 de cada uno de los tres tipos de munición para tus cañones.<n>Puede que no tengas suficiente espacio en tu convoy porque los cañones son pesados. Si es así, vende algunas de las mercancías que hayas cargado."
"0xdaeb0486" = "¡Perfecto! Ahora tu convoy está armado y listo para una batalla a pequeña escala.<n>Según parece, el gobernador de [town:Cartagena] tiene la misión perfecta para ti.<n>Pulsa sobre el palacio del gobernador y acepta su misión."
"0xdaeb0487" = "Los gobernadores suelen proponer misiones que, si logras cumplir, mejoran tu reputación en su país.<n>También pueden venderte Patentes de Corso o pedirles rescate por los corsarios que hayas capturado.<n>Ahora, usa tu convoy para encontrar los barcos de los que el gobernador te ha hablado."
"0xdaeb0488" = "Muy bien, ya has localizado el convoy.<n>Ahora prepara tu barco para entrar en acción. Para hacerlo, abre la lista de barcos de tu convoy (composición del convoy) y selecciona tu balandro. Para declararlo como navío de combate, pulsa el botón que hay junto al cañón. Después, puedes \"atacar\" el convoy pulsando sobre él con el botón derecho del ratón."
"0xdaeb0489" = "Esta es la vista de batalla naval de [town:Port Royale].<n>Muestra tu barco, y puedes ver los barcos abandonados moviendo la ventana de visualización.<n>Ahora desactiva el modo de pausa y practica la navegación con el botón derecho del ratón. La ventana de eventos muestra la dirección del viento y del barco durante las batallas navales."
"0xdaeb048a" = "En la ventana de acciones se muestran todos los barcos que participan en la batalla, tanto los tuyos (en la primera fila) como los de tu enemigo. Además, en ella podrás elegir la munición que quieras: Ahora, elige las bolas de cañón y hunde uno de los barcos enemigos.<n>Para disparar, tienes que tener una buena posición de tiro, algo que sabrás porque el barco objetivo quedará rodeado por un marcador rojo. Puedes disparar con el botón izquierdo del ratón, aunque recuerda que tener una buena posición de tiro no implica que vayas a acertar: Has de encontrar el momento justo de alineación de tu barco. Ahora continúa y hunde el barco."
"0xdaeb048b" = "¡Perfecto! Ahora aborda el segundo barco.<n>Para hacerlo, pulsa el botón \"Abordar\" que aparece en la ventana de acciones, junto a los tipos de munición.<n>Después, dirígete al barco enemigo y atácalo. Recuerda que el botón F1 también está activo durante las batallas navales para que consultes la pantalla de ayuda."
"0xdaeb048c" = "Normalmente, la tripulación del enemigo luchará contra la tuya a bordo del barco.<n>Al terminar la batalla, todos los barcos abordados son para el vencedor, sea quien sea el que haya realizado el abordaje.<n>Se ha abierto la ventana de transferencia, desde la que se controla la transferencia de mercancías, dotación y barcos a tu convoy desde los convoyes vencidos. Incorpora el barco enemigo a tu convoy y cierra la ventana de Transferencia."
"0xdaeb048d" = "¡Muy bien!<n>Ahora envía tu convoy de vuelta a [town:Cartagena]."
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "Un convoy perteneciente al pirata %1 ha atacado a un mercader de %2."
"0xdb0108d5" = "Vamos a comprar otro barco. Dirígete al astillero y compra un barco con tanta capacidad para cañones como puedas permitirte."
"0xdb0108d6" = "Selecciona tu convoy y pulsa sobre el puerto con el botón derecho del ratón para abrir la ventana de transferencia e incorporar el barco nuevo al convoy."
"0xdb0108d7" = "Todos los convoyes se componen de barcos de comercio y buques escolta.<n>Si uno de los barcos de tu convoy va a entrar en batalla, tienes que definirlo como navío de combate, con lo que automáticamente entra en la categoría de buque escolta.<n>Ahora abre la composición del convoy para mostrar todos tus barcos."
"0xdb0108d8" = "La composición del convoy muestra todos los barcos de tu convoy. El estatus de navío de combate se muestra en el extremo superior derecho del icono de cada barco. Si aparece un símbolo de cañón, el barco está definido como barco de guerra y participa en las batallas. Si pulsas sobre esta esquina cambiarás directamente el estatus.<n>Pero ahora debes pulsar sobre tu nuevo barco y seleccionarlo. "
"0xdb0108d9" = "Aquí, como en el astillero, se muestran los datos técnicos del barco como, por ejemplo, su capacidad de carga máxima.<n>También puedes ver el coste diario de mantenimiento del barco.<n>Ahora, convierte el barco en navío de combate activando el símbolo del cañón."
"0xdb0108da" = "¡Así se hace!<n>Los cañones y marineros siempre se dividen equitativamente entre los buques escolta de un convoy.<n>Asegúrate de que tus barcos escolta están completamente armados y cuentan con toda la tripulación y después hazle una visita al gobernador y acepta la nueva misión que te encomiende."
"0xdb0108db" = "Ahora cumple la misión que el gobernador te ha encomendado. "
"0xdb0108dc" = "Selecciona entre tus buques escolta el barco que quieres controlar en la batalla naval.<n><n>En cualquier momento de la batalla naval puedes seleccionar otro de tus barcos con sólo pulsar sobre él en la lista.<n><n>El que tuvieses seleccionado previamente huirá de la batalla y ya no estará disponible para utilizarlo durante el resto de la batalla."
"0xdb0108dd" = "¡Así se hace! Has destruido el convoy pirata.<n><n>Ahora, vuelve ante el gobernador de [town:Cartagena], porque forma parte de tu misión.<n><n>Tus misiones se registran automáticamente en el diario. Si lo necesitas, allí podrás ver los pormenores de la misión en cualquier momento."
"0xdb04023a" = "No tienes suficientes materiales de construcción"
"0xdb0e3d33" = "Tengo una misión para ti.<n><n>"
"0xdb0e3d34" = "Podrías hacerme un favor.<n><n>"
"0xdb0e3d35" = "Hay algo que podrías hacer por mí.<n><n>"
"0xdb10f490" = "Donar"
"0xdb126f49" = "Tu puntuación<n>"
"0xdb170d26" = "¡Antes de que el gobernador te asigne una nueva misión, asegúrate de que tu convoy se encuentra en plena forma!<n>Si tiene daños (lo podrás ver mirando la barra roja de la ventana de acciones del convoy), dirígete al astillero para repararlo."
"0xdb170d27" = "Acabas de recibir un dinero con el que podrás equipar mejor tu convoy.<n>Tu convoy debe tener tres barcos completamente armados y toda la tripulación.<n>No te olvides de la munición, y acuérdate de definir tus barcos nuevos como navíos de combate. Hazlo ahora."
"0xdb170d28" = "Perfecto.<n>Ahora, visita al gobernador y cumple la misión que te asigne."
"0xdb2ae26e" = "Rechazar"
"0xdb2d1177" = "Vas a atacar por sorpresa una guarida pirata.<n>Recuerda que tu convoy ha de estar en perfecto estado.<n>Podrías visitar alguna ciudad con gobernador para ver si en alguno de los astilleros encuentras un barco más grande disponible.<n>Por el camino, hazle una visita al gobernador y consigue información sobre el escondite de los piratas."
"0xdb2d1178" = "Las batallas portuarias son parecidas a las batallas navales, salvo por el hecho de que en este caso te enfrentas a sólidas (e inmóviles) torres de cañón y no a barcos.<n>Para ganar una batalla portuaria tienes que destruir todas las torres.<n>A veces hay barcos armados en el puerto que saldrán a interceptarte. En tal caso, debes luchar contra ellos y vencerles antes de poder atacar el propio puerto."
"0xdb2d1179" = "Para acabar esta campaña, vuelve a [town:Cartagena] con tu convoy."
"0xdb4287ac" = "El gobernador de [town:Cartagena] cree que tienes un gran potencial y ha decidido hacerte entrega de @g$Gold$.<n><n>Pista:<n>Compra las mercancías que abunden en una ciudad (su cantidad no debe aparecer en rojo). Después, vende estas mercancías en una ciudad donde escaseen para asegurarte el mejor precio.<n><n>De esta forma, pronto incrementarás tu riqueza."
