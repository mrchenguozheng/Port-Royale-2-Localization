"0xde535352" = "Lamentablemente, se ha desatado la peste en Tortuga. Asolará la ciudad durante aproximadamente un mes. La situación económica de la ciudad empeorará considerablemente y muchos de sus ciudadanos caerán víctimas de la enfermedad. Además, hay muchos ciudadanos que huirán aterrorizados de la enfermedad.<n><n>Como comerciante, te interesa saber que la demanda de prendas de vestir y madera se duplica durante la peste.<n><n>Ahora tu tarea consiste en asegurarte de que la ciudad esté abastecida y de que el número de ciudadanos no disminuye.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>El número de ciudadanos (habitantes menos soldados) debe volver a ser de @I$Pop$ como máximo 20 días después del final de la peste. Con esto te asegurarás de que todos los negocios cuenten con una cuadrilla completa de trabajadores."
