"0xe6393b08" = "Convoy en el mar"
"0xe6490f96" = "Corre el año 1676 en la ciudad del gobernador holandés de las [town:Turk Islands]. Holanda posee siete ciudades, cinco de las cuales son coloniales, una es ciudad de gobernador y otra ciudad de virrey.<n><n>Inglaterra posee 14 ciudades y lleva mucho tiempo en guerra con Holanda, y lo seguirá estando durante muchos meses. Mientras dure esta guerra, debe tomar ciudades de la Corona inglesa en nombre de Holanda.<n><n>Pero antes de poder atacar ninguna ciudad inglesa, necesita más capital y más armas para su convoy. Su primer objetivo es derrotar tres convoyes comerciales ingleses y apresar sus barcos.<n><n>Primero, no obstante, debe obtener una patente de corso del gobernador holandés en las [town:Turk Islands].<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visite al gobernador de las [town:Turk Islands] y obtenga una patente de corso contra Inglaterra."
"0xe64f1385" = "¡Muy bien! Has destruido uno de los convoyes del pirata Barbanegra. Ahora, preséntate ante el gobernador de @T$TOWN$ y cobra tu recompensa.<n><n>Además, es posible que tenga otra misión para ti.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumplir otra misión para el gobernador de @T$TOWN$."
"0xe65025c3" = "en 1 ciudad"
"0xe6510ae7" = "Tienes que incrementar cada una de las reservas de trigo, ladrillos, algodón, azúcar y tabaco hasta @a$Amount$ antes del @D$EndDate$."
"0xe65524e7" = "Asegúrate de que tu ciudad cuenta con una reserva de @a$Amount$ unidades de todas las mercancías."
"0xe674b971" = "Mapa del tesoro"
"0xe67d58b9" = "Se ha descubierto oro"
"0xe6851da5" = "En la última campaña ya viste que tu rango depende del total de tus bienes. El total de tus bienes comprende dinero, edificios, barcos y mercancías. En cualquier momento del juego podrás comprobar el total de los bienes que posees en el apartado de \"Logros\" del diario de a bordo.<n><n>También puedes consultar la barra azul que indica tu experiencia y que siempre se encuentra en la parte inferior de la pantalla, en el display del convoy. Cuando la barra alcance el extremo derecho de la pantalla serás promocionado al rango siguiente. No puedes bajar de rango una vez que lo hayas conseguido.<n><n>Cuanto más alto sea el rango, más convoyes podrás dirigir y en más ciudades podrás establecer negocios. Al alcanzar un determinado rango tendrás derecho a un número ilimitado de convoyes y permisos de construcción."
"0xe6d65f53" = "Habitantes"
"0xe6d9252d" = "%1, así que tú eres el %2 del que tanto me ha hablado mi padre. Yo soy %3. ¿No querrás acompañarme y contarme tus aventuras?"
"0xe6d9252e" = "He oído hablar de ti, %1. Yo soy %3, la hija del Gobernador. Siempre quise conocer a un %2. ¡Por favor, háblame de tus aventuras!"
"0xe6d9252f" = "¡Así que tú eres el famoso %1! ¡He oído hablar tanto de ti! Te hacía más alto... ¡Pero bueno, eso no te resta interés! ¡Qué emocionante! Ven y háblame de tus aventuras. Mi padre, el Gobernador, está emocionado con tus andanzas."
"0xe6d92530" = "%1,<n>me alegro tanto de volver a verte... ¿Cómo te ha ido todo desde la última vez que nos vimos? ¿Me has traído algo?"
"0xe6d92531" = "%1,<n>Es maravilloso volver a verte. Desde la última vez que nos vimos no he dejado de pensar en ti. Ven, entra. Tengo un montón de cosas que contarte."
"0xe6d92532" = "¡%1,<n>me alegro tanto de que hayas vuelto! Les he hablado a todas mis amigas de ti. Pero tienes que contarme más cosas, porque las chicas están impacientes por conocer tus nuevas aventuras. ¡Vamos, entra!"
