"0xfc64ab0e" = "Ahora puedes aumentar tu reputación en %1 atacando barcos y ciudades franceses. Esto no disminuirá tu reputación en las demás naciones."
"0xfc692ef1" = "<n><n>Sin embargo, si al menos un barco de tu convoy sobrevive a la batalla, el capitán también sobrevive."
"0xfc71eb4b" = "Qué desgracia me ha ocurrido. Desde el estallido de la guerra con @n$FoeNation$, no he podido acumular suficientes mercancías coloniales para los convoyes de transporte. ¿Puedes ayudarme proporcionándome un gran cargamento de @G$Goods$?"
"0xfc71eb4c" = "Desde que entramos en guerra con @n$FoeNation$, se ha prohibido a sus comerciantes entregar @G$Goods$ en las ciudades de mi nación. Ahora me enfrento a una escasez significativa de mercancías. Tienes muchos barcos y conoces bien los mares. ¿No podrías asegurarme un gran cargamento de @G$Goods$?"
"0xfc72151e" = "Transferencia entre almacén y convoy"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Por cañones"
"0xfc910833" = "Viviendas disponibles"
"0xfc9a5f7d" = "Ha sido un placer hacer negocios contigo. ¡Buen día!"
"0xfc9a5f7e" = "Las mercancías se han enviado a tu almacén. ¡Buen día!"
"0xfc9a5f7f" = "Las mercancías se han cargado en tu convoy. Adiós, %1."
"0xfc9cf623" = "Completada"
"0xfca882e8" = "As you know, the Spanish treasure fleet always takes a different route when collecting treasures from its colonies and shipping them to Europe. The fleet avoids being ambushed by only ever staying a short time at each town. However, this time Spain has committed a serious blunder, by allowing us to find out the route the Spanish treasure fleet is following at this very moment. Your orders couldn't be simpler. Destroy every last ship!"
"0xfca882e9" = "We are at war with Spain and must ensure that the Spanish treasure fleet never reaches Europe. Luckily, we have learned which town the fleet will be calling at next. We will sabotage the fleet at this town so that it has to prolong its stay in the harbor. This should give you enough time to intercept the fleet and prevent it from reaching Europe. Do you accept this mission?"
"0xfca882ea" = "You don't get opportunities like this every day! Today one of my informants told me the route the Spanish treasure fleet is currently following. But that's not all. We have learned that the fleet will be lying at anchor for longer than usual at the next town it visits. Since we are at war with Spain, we should give the viceroy something to smile about and make sure the treasure fleet never reaches its destination in Europe. Will you intercept the fleet for my nation?"
"0xfcc82d44" = "Infante"
"0xfcd6fdec" = "Veo que todavía no has cumplido mi última misión. Termina este trabajo, pues tengo más encargos para ti."
"0xfcded04c" = "IDM_CONTEST_01_2004_LOG_01_TEXT"
"0xfce1cfd1" = "Me temo que no tengo uso para ti en este momento.<n> Solo puedo encargarte capturar una ciudad si una nación hostil está debilitada y tengo suficientes convoyes militares disponibles para proteger mis ciudades."
"0xfce38f12" = "Comandante de la ciudad"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "Ambiente"
"0xfd1be8e3" = "El bucanero %1 %2 se ha infiltrado en la ciudad y ha destruido grandes existencias de mercancías de varios comerciantes de la ciudad. El ayuntamiento se niega a aceptar responsabilidad."
