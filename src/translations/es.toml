"0xf214f69c" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has rescatado a un náufrago de @n$DestNation$. @N$Name$ te ofrece una gran recompensa si lo desembarcas en la próxima ciudad perteneciente a su nación."
"0xf214f69d" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has rescatado al comerciante @N$Name$ de @T$DestTown$. Te promete una gran recompensa si lo devuelves a su ciudad natal."
"0xf214f69e" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has rescatado al experimentado capitán @N$Name$. Pide que lo desembarques en una ciudad perteneciente a @n$DestNation$."
"0xf214f69f" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has recogido a @I$Sailors$ marineros náufragos, que parecen conocer a parte de la tripulación. La fiesta de bienvenida eleva la moral de la tripulación."
"0xf214f6a0" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has recogido a un marinero de @n$Nation$. Para agradecerte el rescate, te dice dónde puedes encontrar muchos barriles de valiosos restos. @l$DebrisPos$"
"0xf214f6a1" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has rescatado a un sacerdote de @n$DestNation$. No puede pagarte por llevarlo a una ciudad perteneciente a su nación, pero promete interceder por ti para mejorar tu reputación en @n$DestNation$."
"0xf22583c4" = "¿Quieres comprar una patente de corso por %1 y cazar los barcos de nuestros enemigos en nombre de Holanda?"
"0xf22a4fad" = "Hay una plaga de ratas en %1. Durante un mes, el consumo de trigo, fruta, maíz y carne es el doble. "
"0xf22b236f" = "No has entregado las mercancías a tiempo."
"0xf22d73b9" = "Necesita herramientas para producir mercancías coloniales. Del mismo modo, necesita materias primas para producir mercancías manufacturadas. Las mercancías manufacturadas incluyen, por ejemplo, la cuerda y el paño. Las materias primas para ambas son el cáñamo y el algodón.<n><n>Ahora que ya sabe cómo construir instalaciones de producción, debería comprar un permiso de construcción en una ciudad con gobernador y construir allí instalaciones para producir mercancías manufacturadas. Sin embargo, antes de poder comprar un permiso de construcción, debe haber acreditado un historial comercial probado con la ciudad, lo que significa que debe venderle mercancías cuando escasean.<n><n>¡Pero cuidado! Si acapara mercancías escasas en una ciudad, eso tiene un efecto negativo en su historial comercial con la ciudad. Las mercancías que escasean en una ciudad se muestran en rojo en la ventana de Comercio.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Mejore su historial comercial en [ref:Cartagena] para poder comprar allí un permiso de construcción."
"0xf24b293b" = "Cargar / Guardar"
"0xf253afcd" = "Solo puedes entrar en una ruta comercial si el capitán del convoy tiene %1 puntos de experiencia. Actualmente tiene %2 puntos."
"0xf2590753" = "Gracias. Parece que no vamos a recibir mercancías importadas de Europa en un futuro próximo. Como actualmente estamos en guerra con @n$HostileNation$, tenemos la oportunidad de saquear mercancías de los convoyes de transporte de nuestros enemigos, sin capturar ni hundir sus barcos.<n>Por favor, consigue @a$Amount$ de cada una de las mercancías especias, vino y herramientas y entrégalas a mi comerciante en el mercado antes del @D$EndDate$."
"0xf2590754" = "Tu misión es atacar y saquear los convoyes de transporte de @n$HostileNation$, sin capturar ni hundir sus barcos. Luego debes entregar las mercancías en el mercado. Tienes hasta @D$EndDate$."
"0xf2590755" = "Que así sea. Ve en busca de los convoyes de transporte pertenecientes a @n$HostileNation$ y saquea @a$Amount$ de las mercancías importadas que llevan a bordo. Después tendrás hasta el @D$EndDate$ para entregar las mercancías a un comerciante que te esperará en el mercado. Un consejo: debido a la situación tan tensa que existe actualmente en la región, solo puedes saquear los barcos, ¡y no debes capturarlos ni hundirlos!"
