"0xc58b0f44" = "Gracias por hacerme este favor.<n><n>Y ahora, nuestro acuerdo. El viejo capitán se llama @N$TeacherName$ y se ha retirado no lejos de aquí.<n><n>@l$TeacherPos$<n><n>Mira a lo largo de aquella costa y le encontrarás.<n><n>Lleva contigo @a$Amount$ de ron, o de lo contrario no se prestará a ayudarte."
