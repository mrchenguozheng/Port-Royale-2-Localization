"0x19f413a1" = "En esta campaña hay bastante más que hacer que en la primera. Vas a comerciar y lo que es más importante, a obtener beneficios de ese comercio.<n><n>También vas a ampliar tu flota, formando un segundo convoy para poder transportar más mercancías.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Lee y sigue las instrucciones y consejos de la ventana de mensajes."
"0x1a106105" = "El convoy todavía no ha sido atacado."
"0x1a2ebe80" = "Lamentablemente, no dispones de convoyes adecuados en el puerto. El convoy debe contar exactamente con 5 barcos y tener 150 cañones a bordo. Vuelve cuando hayas formado dicho convoy."
"0x1a3808bb" = "El comerciante se llama @N$Name$ y su ciudad natal @T$Town$. Si logras destruir su convoy antes del @D$EndDate$, te recompensaré con una generosa aportación de mercancías."
"0x1a444b3b" = "No puedo encomendarte en mi nombre la toma de una ciudad perteneciente a otra nación porque ahora no estamos en guerra. Sin embargo, la situación puede cambiar con rapidez. Vuelve cuando así sea."
"0x1a444b3c" = "Estamos en guerra con %1 y te has asegurado de que a %1 sólo le quede una ciudad. No podemos tomarla y por ello no puedo encomendarte la misión de capturar ninguna ciudad en este momento. <n><n>Pero vuelve por aquí cuando cambie la situación."
"0x1a444b3d" = "Con gusto te encomendaría la toma de una ciudad de %1. Dispongo de suficientes convoyes militares para proteger cualquier área de nueva conquista.<n><n>Sin embargo, %1 todavía es muy fuerte.<n><n>Podrías ayudarnos destruyendo convoyes militares de %1 y debilitando así su posición.<n><n>Cuando lo hayas conseguido, vuelve y te encomendaré una misión."
"0x1a444b3e" = "Con gusto te encomendaría la toma de una ciudad de %1, ya que dispongo de suficientes convoyes militares para proteger cualquier área recientemente conquistada.<n><n>Sin embargo, %1 todavía es muy fuerte.<n><n>Podrías ayudarnos destruyendo convoyes militares de %1 y debilitando así su posición.<n><n>Cuando lo hayas conseguido, vuelve y te encomendaré una misión.<n><n><n>Nuestros funcionarios mantienen actualizada la información referente a la fuerza de todas las naciones del Caribe en la Crónica; consúltala cuando quieras. "
