"0xcc823e54" = "Estamos en guerra con @n$TargetNation$ y, a la luz de los últimos acontecimientos, ha llegado el momento de contraatacar. Quiero que captures o hundas barcos militares en mi nombre. ¿Aceptas esta misión? "
"0xcc823e55" = "Just recently, @n$TargetNation$ attacked one of our towns. Now I'm planning my own military action against @n$TargetNation$ and was wondering if you'd like to be part of it? I want you to sink or capture military convoys. Everything you loot from them is yours to keep, all I care about is weakening @n$TargetNation$. Are you interested?"
"0xcc823e56" = "Una de nuestras ciudades ha sido atacada por @n$TargetNation$. Ahora estamos contraatacando y hundiendo sus barcos. Me gustaría mucho enviarte a una zona concreta y autorizarte a capturar o hundir barcos militares. "
