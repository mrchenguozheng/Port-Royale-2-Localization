"0x05478cea" = "Mi hija ya me dijo que vendrías. A veces es demasiado impetuosa; pero eso ya lo sabes y yo no puedo oponerme a sus deseos. Creo que eres el hombre adecuado para ella, así que: ¿Quieres a %1 por esposa? "
"0x05633055" = "Tus edificios"
"0x05716a06" = "Tu próxima batalla va a ser algo más emocionante porque esta vez el enemigo no va a quedarse quieto sin hacer nada. Tu misión consiste en perseguir y hundir a un pirata en nombre del gobernador.<n><n>Pero primero tienes que armar tu convoy: Compra un barco, incorpóralo a tu convoy y ármalo con cañones, sables y marineros.<n><n>En cualquier momento durante la batalla naval podrás pulsar la tecla F1 para mostrar la configuración del teclado y del ratón. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arma tu convoy y cumple la nueva misión que el gobernador de [town:Cartagena] te ha asignado."
"0x058ca789" = "Visita al gobernador de @T$TOWN$ y acepta su misión."
"0x05980d2c" = "El nivel de dificultad determina los precios de los productos y el daño que se inflige en las batallas navales.<n><n>Además, en el nivel de dificultad fácil el maestro constructor será menos exigente con tu historial comercial a la hora de concederte un permiso de construcción."
"0x05ae35b1" = "¡Perfecto! Ahora visita al virrey de España en [town:Port Royale] y acepta la misión de capturar una ciudad francesa.<n><n>Normalmente, para que un virrey te conceda una hacienda, tienes que capturar dos ciudades. Sin embargo, en esta ocasión sólo tendrás que capturar una ciudad para España.<n><n>Puedes elegir qué ciudad capturar. Es aconsejable elegir una ciudad que tenga una pequeña cantidad de cañones en el puerto. Ahora mismo, la ciudad francesa que sería el objetivo ideal es @T$SampleTown$.<n><n>Como recompensa por capturar una ciudad, el virrey te concederá una hacienda. Recuerda que no puedes hablar con un virrey si no tienes como mínimo el rango de Contramaestre.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visita al virrey español en [town:Port Royale] y acepta la misión de capturar una ciudad. Podrás aceptar la parcela que te ofrece cuando hayas cumplido la misión."
