"0x3933132f" = "Oh, @s$USER$, ¿qué hago? Un comerciante de @T$Town$ no para de entrometerse en mis negocios y quitarme los beneficios. Lleva meses así. ¿Puedes ayudarme a deshacerme de su convoy?"
"0x39331330" = "¿Puedes ayudarme a organizar un pequeño acto de represalia? Estoy bastante seguro de que un comerciante de @T$Town$ fue responsable de sabotear algunos de mis barcos. Ahora solo puedo sentarme y esperar a que mis barcos vuelvan del astillero. Quiero que destruyas un convoy de mi implacable adversario. ¡Te recompensaré generosamente!"
"0x39331331" = "¿No eres tú @A$USER$? Puede que tenga una tarea para ti.<n>Hace mucho tiempo presté una suma considerable a un comerciante de  @T$Town$ y casi igual tiempo hace que debería haberla devuelto. El caso es que no lo hizo, y no creo que se le ocurra hacerlo en el futuro.<n>Por eso quiero darle una lección. ¿Atacarías uno de sus convoyes por mí? ¡Te recompensaré espléndidamente!"
