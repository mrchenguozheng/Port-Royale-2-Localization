"0xf4da7469" = "y"
"0xf4e195bf" = "Barbanegra ha descubierto que estás colaborando con el gobernador de @T$TOWN$ y ha empezado a hostigar a los comerciantes que visitan @T$TOWN$. En unos días prácticamente no habrá ningún comerciante que se atreva a ir a @T$TOWN$.<n><n>No es más que una táctica temporal. Tu tarea consiste en abastecer la ciudad de mercancías hasta el @D$EndDate$. La situación económica de la ciudad no debe bajar de \"prosperidad\".<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Abastecer @T$TOWN$ de mercancías hasta el @D$EndDate$. La situación económica de la ciudad no debe bajar de \"prosperidad\"."
