"0xc9500bee" = "Congratulations! You have achieved your objective and made more money. You have also reached a higher rank.<n><n>Your rank is always determined by your total assets. These comprise cash as well as property, such as goods and ships. You can check your wealth at any time under \"Successes\" in the log. This will also tell you when you'll reach the next rank.<n><n>The higher your rank, the more convoys you can command and, therefore, the greater the number of towns in which you can establish businesses later.<n><n>Now that you have a higher rank, you should assemble another convoy and continue trading to increase your wealth.<n><n>You can check your wealth at any time by positioning your cursor on the blue bar indicating your wealth, which is displayed under this window. <n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Assemble a second convoy and increase your total assets to @g$GoldGoal$."
