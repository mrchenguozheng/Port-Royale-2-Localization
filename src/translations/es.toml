"0x04ddc375" = "%1 te está esperando en la taberna."
"0x04e000d9" = "El capitán %1 ha sustituido al capitán anterior."
"0x04e4fc22" = "Comercio entre la ciudad y el almacén"
"0x04e5002a" = "Agentes enemigos han instigado una huelga en [town:Tortuga]. Todos los trabajadores han dejado las herramientas y se niegan a trabajar, aunque siguen generando costes para tu negocio.<n><n>Tu tarea consiste en mantener una buena reserva de las mercancías que normalmente producen las plantas de producción ahora paradas para asegurarte de que la huelga sea un fracaso y los obreros vuelvan al trabajo.<n><n>Antes de la huelga la ciudad producía trigo, ladrillos, algodón, azúcar y tabaco.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La reserva de mercancías producidas en la ciudad debe ser de @a$Amount$ por producto antes del @D$EndDate$."
"0x04f319ed" = "Dirígete al mercado de @T$Town$ en un plazo de 30 días para recoger tu recompensa."
