"0x305f2287" = "Hace poco, mi nación ha perdido su última ciudad con gobernador a manos de sus enemigos.<n><n>Si esas naciones enemigas se debilitan hundiendo sus convoyes militares, podremos recuperar algunas ciudades.<n><n>Para evitar problemas con las demás naciones, te expediré una patente de corso contra nuestros enemigos."
