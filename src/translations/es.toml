"0xcff2c8f5" = "Entregas:"
"0xcff9644a" = "\"La Pocha del Pirata\" es un juego de azar con 32 cartas. Cada jugador coloca su apuesta en el platillo y recibe 5 cartas que el otro jugador no puede ver<n><n>En primer lugar, cada jugador debe cantar el número de puntos que cree que va a ganar; cada turno ganado vale un punto. El jugador que canta el mayor número de puntos empieza el juego y decide el palo que pinta. A continuación debe intentar ganar al menos ese número de puntos.<n><n>El jugador que sale primero juega su primera carta y el otro debe seguir con una carta del mismo palo, si es que puede. El jugador con la carta más alta gana el punto.<n><n>Si un jugador no puede seguir el palo del jugador que ha salido, puede elegir echar otra carta o un triunfo.<n><n>El orden de las cartas, de menor a mayor valor, es el siguiente: I, II, III, IV, Pirata, Novia, Gobernador y Loro. Un triunfo gana a todas las demás cartas, excepto a otro triunfo de mayor valor.<n><n>El jugador que ha ganado el punto juega la siguiente carta. El juego continúa hasta que gana uno de los jugadores.<n><n>Si el que inició la partida consigue ganar los puntos que cantó, gana el juego y se lleva la apuesta del platillo. Si no, gana su oponente."
