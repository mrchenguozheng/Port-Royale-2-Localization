"0x15d892f9" = "Tiepolo_bold14x14aaFH.res"
"0x15d8bad1" = "¡Bien! La ciudad en cuestión es @T$TargetTown$. Para someterla, el virrey de @n$TargetNation$ ha prohibido a todos los comerciantes navegar hacia la ciudad. Si conseguimos restaurar la riqueza abasteciéndola, podemos contar sin duda con la lealtad de sus ciudadanos. Tienes hasta el @D$EndDate$ para cumplir esta misión."
"0x15d8bad2" = "Me refiero a la ciudad de @T$TargetTown$. Se ha prohibido a todos los comerciantes navegar hacia esa ciudad. Tu misión es abastecerla para restaurar su riqueza. Así podemos dejar claro nuestro interés en @T$TargetTown$. Tienes hasta @D$EndDate$ para cumplir tu misión."
"0x15d8bad3" = "El asunto es este: el virrey ha prohibido a todos los comerciantes navegar hacia la ciudad de @T$TargetTown$. Con ello quiere ejercer presión sobre el concejo municipal. Si consigues abastecer @T$TargetTown$ de suficientes mercancías para que la riqueza se restablezca antes del @D$EndDate$, no dudo que podré gestionar un cambio pacífico de lealtad nacional."
"0x15e96b4c" = "Guardar"
"0x15f470e9" = "Fin de la batalla"
"0x15f6d04b" = "Has ganado la batalla naval. ¿Quieres cancelar el ataque?"
"0x15fd96d6" = "Has comprado un permiso de construcción y ahora puedes construir en esta ciudad. Tu primer edificio debe ser un almacén.<n><n>Nota: Cuantos más permisos de construcción tengas, más caro será el siguiente y más tardará en mejorar tu historial comercial en otras ciudades."
"0x1605422d" = "Guarida"
"0x161f0ab3" = "Rango"
"0x1629fb20" = "%1,<n>ahí estás de nuevo. Ven, puede que tenga noticias para ti."
"0x1629fb21" = "%1,<n>esta vez no has estado fuera mucho tiempo. ¿No tienes nada más que hacer?"
"0x1629fb22" = "%1,<n>no esperaba volver a verte tan pronto. Creo que todavía no tengo noticias para ti."
"0x162a5cb6" = "Escondite de mercancías"
"0x163fff71" = "%1,<n>qué amable de tu parte venir. ¿Quieres que te cuente las últimas novedades que he oído?"
"0x163fff72" = "%1,<n>me alegro de volver a verte. En los últimos días he preguntado por ahí y puede que ahora tenga noticias para ti."
"0x163fff73" = "%1,<n>ahí estás de nuevo, me alegro de verte. Creo que puedo tener información para ti."
"0x165603c2" = "%1,<n>ha pasado bastante tiempo, pero me alegra volver a verte. Tengo noticias para ti."
"0x165603c3" = "%1,<n>estaba a punto de salir a visitar a alguien, porque por aquí me aburro bastante. Pero ahora estás aquí. Ven, tengo algo que decirte."
"0x165603c4" = "%1,<n>ahí estás, me preguntaba dónde habías estado todo este tiempo. Tengo noticias para ti."
"0x1659b12c" = "Ahora tienes oro suficiente para aumentar la potencia de fuego de tu convoy. Busca en los astilleros de las ciudades con gobernador el barco más potente que puedas permitirte.<n><n>Después añade este barco a tu convoy y embarca más cañones y marineros. Si no tienes oro suficiente, comercia un poco más.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumenta la potencia de fuego de tu convoy hasta al menos 90 cañones."
"0x165fc28e" = "Visita tu nueva ciudad y construye un astillero."
"0x16656b80" = "%1 %2<g:scripts/intext_herz_800x600.screen>"
"0x1666a42c" = "%1, me alegro de verte."
"0x1666a42d" = "Te estaba esperando, %1."
"0x1666a42e" = "Me alegro de verte, %1."
"0x166c0813" = "%1,<n>¿eres tú? Apenas te reconozco. Entiendo que tus aventuras te ocupan mucho tiempo. Sin embargo, bien podrías visitarme más a menudo."
"0x166c0814" = "%1,<n>¿quieres que me pase todo el tiempo en la posada solo para tener algo de compañía? ¡De verdad que deberías visitarme más a menudo!"
"0x166c0815" = "%1,<n>dejo que todos los comerciantes de paso entren y salgan aquí todo el día, solo para tener algo de compañía. ¿No podrías pasarte más a menudo?"
"0x1680be32" = "Capacidad total"
"0x1688414b" = "Saqueo sobre la flota del Tesoro"
"0x16cc82c9" = "Entrega @G$Goods$ antes de @D$EndDate$ a una persona en @T$TargetTown$. Después se te pagará @g$Price$ por cada barril entregado."
"0x16e90f87" = "Has encontrado el paquete perdido. Llévalo a @N$OwnerName$ en @T$TOWN$ antes de @D$EndDate$. "
"0x16fcf40f" = "Préstamos"
"0x17081769" = "Capacidad máxima:"
"0x170f1419" = "%1 %2 ha superado las defensas portuarias de la ciudad y la ha saqueado."
"0x171746e9" = "Has servido a mi nación durante mucho tiempo y con fidelidad; ahora debo recompensarte por tu lealtad. Te daré una parcela de tierra en la que puedas fundar tu propia ciudad."
"0x17328849" = "desconocido"
"0x1733ed83" = "En este escenario, el virrey español te concede un terreno en el que puedes construir tu propia ciudad. El objetivo de este escenario es conseguir que la economía de tu ciudad empiece a florecer.<n:25>Sin embargo, antes de recibir un terreno, debes mejorar tu reputación ante España y hacerte popular entre el virrey español capturando ciudades en su nombre."
"0x1742a5e4" = "Hora"
"0x17677dab" = "Previsión"
"0x17839498" = "Reducir el precio en un 5%"
"0x178491f6" = "Aumentar el precio en un 5%"
"0x17885da0" = "Has encontrado a unos náufragos en una balsa y has recogido a @I$Settlers$ colonos. Esperan que se les desembarque en una ciudad donde falte mano de obra."
"0x17a97ba2" = "Batallas navales"
"0x17abb14d" = "en cuanto al puerto, está muy mal defendido."
"0x17ae0013" = "El último convoy procedente de Europa me informó de que a mi ciudad le va a faltar mercancías de importación en las próximas semanas.<n><n>¿Puedes ayudarme? No puedo contar con que otros comerciantes traigan estas mercancías a la ciudad."
"0x17ae0014" = "Como sabes, @n$Nation1$ y @n$Nation2$ están en guerra.<n>Por eso, durante las próximas semanas seguiré sin recibir mercancías importadas de Europa. Por lo tanto, no tengo más remedio que comprar las mercancías en @n$Nation2$.<n><n>Ya he empleado a otros comerciantes para hacerlo, pero me gustaría poder contar también con tu ayuda."
"0x17ae0015" = "¿Qué se cree que está haciendo @n$Nation2$? Acabo de saber por un informante que los convoyes de transporte procedentes de Europa con destino a mi ciudad están siendo atacados y saqueados. ¿Me ayudarás a comprar las mercancías de importación que necesitamos?"
"0x17d31860" = "Productos comprados"
"0x17d5b880" = "No puedes disolver el convoy porque todavía hay mercancías o carga a bordo."
"0x17f39d18" = "Convoyes en espera"
"0x1813d72e" = "%1. %2"
"0x183f926a" = "Gobernador %1"
"0x1844fb4f" = "Tras derrotar los barcos de escolta de tu adversario, te apoderas de un barco comercial.<n><n>Ahora debes decidir qué mercancías quieres llevarte y si quieres capturar los barcos o limitarte a saquearlos."
"0x1844fb50" = "Tras derrotar los barcos de escolta de tu adversario, te apoderas de %1 barcos comerciales.<n><n>Ahora debes decidir qué mercancías quieres llevarte y si quieres capturar los barcos o limitarte a saquearlos."
"0x1844fb51" = "El convoy de tu adversario no tiene barcos de escolta para defenderse. Por lo tanto, te apoderas del barco comercial sin combatir.<n><n>Ahora debes decidir qué mercancías quieres llevarte y si quieres capturar el barco o limitarte a saquearlo."
"0x1844fb52" = "El convoy de tu adversario no tiene barcos de escolta para defenderse. Por lo tanto, te apoderas de los barcos comerciales sin combatir.<n><n>Ahora debes decidir qué mercancías quieres llevarte y si quieres capturar los barcos o limitarte a saquearlos."
"0x184aee4b" = "Compatibles"
"0x18546893" = "En este escenario aprenderás a librar una batalla en alta mar. El escenario comienza con una breve batalla de práctica. Más tarde tendrás que localizar y destruir el convoy de un famoso pirata.<n><n>También conocerás al gobernador de [ref:Cartagena], ciudad donde empiezas el escenario. Él te ayudará a destacar en las batallas navales y más adelante te encargará la misión de dar caza a cierto pirata.<n><n>Tu rango al empezar el escenario es Marinero. Debes haber alcanzado este rango para que el gobernador te encomiende una misión. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visita al gobernador de [ref:Cartagena] y cumple la misión que te encomiende."
