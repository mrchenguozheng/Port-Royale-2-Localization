"0x030bb0b2" = "Como sabes, estamos en guerra con @n$HostileNation$.<n><n>Sería un buen momento para llenar nuestros almacenes con mercancías de las que @n$HostileNation$ tiene abundancia.<n><n>Quiero que captures una cantidad considerable de una mercancía concreta para mí.  "
"0x030bb0b4" = "Como estamos en guerra con @n$HostileNation$, el virrey me ha ordenado que me asegure de que nuestros enemigos sufran escasez de mercancías.<n><n>Por eso tengo una misión de saqueo para ti. ¿Aceptas?"
