"0x007c2733" = "Entonces te encargaré que apoyes a @T$TargetTown$ para que su situación económica sea de \"Prosperidad\" antes del @D$EndDate$. Suministra a la ciudad con los productos que necesite y llévate los productos sobrantes, para que los comerciantes residentes empiecen de nuevo a producir como es debido. "
