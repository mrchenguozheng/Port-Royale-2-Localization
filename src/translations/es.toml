"0xde535352" = "Lamentablemente, ha estallado una plaga en [ref:Tortuga]. Asolará la ciudad durante aproximadamente un mes. El estado de la ciudad cae considerablemente y sus ciudadanos mueren cada día. Muchos ciudadanos, aterrados por la enfermedad, están huyendo.<n><n>Para usted, como comerciante, también es interesante que la demanda de ropa y madera se duplica en la ciudad mientras dura la plaga.<n><n>Su tarea ahora es asegurar que la ciudad esté abastecida durante la plaga y que el número de ciudadanos no disminuya.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>El número de ciudadanos (habitantes menos soldados) debe restablecerse a @I$Pop$ a más tardar 20 días después del final de la plaga. Así se garantizará que todos los negocios cuenten con la totalidad de sus trabajadores."
