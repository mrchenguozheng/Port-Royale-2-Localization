"0xf8e13933" = "Abastece de mercancías a @T$TargetTown$ y compra el excedente. El @D$EndDate$, el estatus de la ciudad debe ser \"Economía próspera\" y todos los negocios de los comerciantes locales deben funcionar a plena capacidad."
