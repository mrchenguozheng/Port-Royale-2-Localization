"0x072a9579" = "Te estoy muy agradecido por traerme las mercancías de importación, pues nosotros en el Nuevo Mundo llevamos muchas semanas sin recibir suministros de los convoyes de transporte de mi nación. Como recompensa, te hago entrega de dos buques flauta comerciales holandeses. Te esperan en el puerto."
"0x0744a699" = "No puedo decirte cuántas ciudades más visitará la flota del tesoro. Lo único que podemos afirmar con certeza es que la flota carga más oro a bordo con cada ciudad que visita. Me da igual cuándo ataques, porque puedes quedarte con el oro. Lo único que quiero es que te asegures de que la flota del tesoro desaparezca. La última vez estuvo en @T$StartTown$, y su próxima escala es @T$DestTown$, donde estará fondeada unos cinco días."
"0x0744a69a" = "Así que debes actuar rápido. Estuvo por última vez en @T$StartTown$; desde allí zarpó hacia @T$DestTown$, donde anclará más tiempo de lo habitual. Cuanto más retrases el ataque, más oro llevará a bordo. Puedes quedarte con todo, pero la flota del tesoro no debe llegar nunca a Europa."
"0x0744a69b" = "Entonces queda acordado, gracias. Si mi información es correcta, la flota del tesoro salió hace poco de @T$StartTown$ y está de camino a @T$DestTown$. Allí anclará más tiempo de lo habitual. Ahora date prisa e intercéptala."
"0x0746253d" = "Si quieres que el mayor número posible de comerciantes visite tu ciudad, sencillamente no deberías abastecerla de determinadas mercancías. Lo ideal es elegir mercancías que se producen en ciudades cercanas, porque los comerciantes tendrán en cuenta la duración del trayecto.<n><n>Los comerciantes que visitan tu ciudad compran automáticamente las mercancías que abundan y que, por lo tanto, tienen precios bajos en tu ciudad. Puedes vender directamente a tu ciudad las mercancías que hayas producido. Mientras no sean más caras que en otras ciudades, los comerciantes las comprarán con regularidad.<n><n>La ventaja de esto es que siempre habrá suficientes mercancías disponibles para tus ciudadanos y además no tendrás que preocuparte por transportarlas a otras ciudades."
