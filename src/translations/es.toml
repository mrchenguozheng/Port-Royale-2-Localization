"0x1f32f588" = "Escenario fallido"
"0x1f36e96b" = "En breve llegará aquí un convoy de transporte. Un espía me ha dicho que nuestro enemigo planea atacar este convoy en su viaje de regreso a Europa. ¿Puedes proteger el convoy en su camino de vuelta? "
"0x1f36e96c" = "Tengo un problema. Mi esposa quiere viajar a Europa en el próximo convoy para visitar a su familia. Desgraciadamente, @n$HostileNation$ se ha enterado y planea interceptar el convoy. ¿Puedes garantizar a mi esposa un pasaje seguro?"
"0x1f36e96d" = "Pronto enviaré documentos importantes a Europa. Como estamos actualmente en guerra con @n$HostileNation$, no quiero correr riesgos y deseo organizar una escolta adicional. ¿Podrías proporcionarla tú? "
"0x1f6696d2" = "Lo siento, resulta que al final no puedo darte esta misión. Acabo de recibir un mensaje que me dice que el problema ya no existe."
"0x1f851477" = "El convoy que debía llevar a cabo esta misión ha sido destruido."
"0x1f890b43" = "El encargo"
"0x1f9a14b7" = "<n><n>Para atacar el escondite, debes enviar allí un convoy igual que lo enviarías a una ciudad. ¡Cuidado! Cualquier convoy pirata que no esté en el escondite cuando ataques recibirá el aviso y establecerá un nuevo escondite."
"0x1fb02f3a" = "Guardar"
"0x1fcb6529" = "Finalizar batalla naval"
"0x1fd35f28" = "Animación"
"0x1fdba107" = " Su salario diario es de %1."
"0x1fe06eb2" = "Capacidad<n>%1%"
"0x1fe25594" = "Tras superar las defensas portuarias, tu convoy atraca y los marineros avanzan por la ciudad. De camino se encuentran con el comandante de la guardia de la ciudad. Se niega a ceder el paso a menos que sea derrotado en un duelo justo. Tu capitán acepta el desafío."
"0x1fea1f37" = "¿Terminar esta partida y cargar la partida guardada?"
"0x1ff731c7" = "Guardar ruta comercial"
"0x200d4e11" = "%1 %2 %3"
"0x20252656" = "Descubrimiento de oro en %1"
"0x20413ba0" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
"0x204cf373" = "Apoyar a la ciudad"
"0x204d1e7c" = "Solo se puede atacar un escondite pirata desde el mar."
"0x20574fcc" = "%1, ¡has capturado la amada ciudad de mi padre para %2! No quiero saber nada más de ti. Espero no volver a verte nunca. Deberías saber que nunca significaste nada para mí y que no te dedicaré ni un pensamiento en el futuro.<n>Espero sinceramente que, tarde o temprano, recibas el castigo que tanto te mereces.<n><n>%3"
"0x20574fcd" = "%1, al llevar a cabo la anexión para %2, has obligado al virrey a trasladarse a la amada ciudad de mi padre, que ahora debe regresar a Europa.<n><n>No quiero saber nada más de ti. Espero no volver a verte nunca. También quiero que sepas que siempre me interesaron mucho más los comerciantes de la posada que tú. Nunca significaste nada para mí y a partir de ahora serás lo último en lo que piense.<n><n>Espero sinceramente que, tarde o temprano, recibas el castigo que tanto te mereces.<n><n>%3"
"0x2065f070" = "Mira esto. Acabo de recibir un mensaje de mi embajador informándome de que %1 nos ha hecho una inesperada oferta de paz. Eso significa que probablemente haremos la paz hoy mismo. <n><n>Por lo tanto, ya no puedo asignarte una misión para capturar una ciudad."
"0x207295a1" = "Ya existe una ruta comercial con el nombre '%1'.<n><c>¿Quieres sobrescribirla?"
"0x2077407d" = "%1,<n>me alegra que hayas venido. Entra y veré si tengo algo para ti."
"0x207a9d35" = "El comandante de la guardia de la ciudad llama a tu capitán desde la muralla, pidiéndole que suspenda la batalla y se bata en duelo con él. Para evitar más pérdidas, tu capitán acepta."
"0x207b620f" = "Después de que tus tropas hayan destruido la puerta de la ciudad, se enfrentan al comandante de la guardia de la ciudad. Este desafía a tu capitán a un duelo."
"0x208aca1b" = " Vigila los convoyes ingleses de la zona y destruye @I$NumConvoys$ de ellos."
"0x208aca1c" = " Vigila los convoyes franceses de la zona y destruye @I$NumConvoys$ de ellos."
"0x208aca1d" = " Vigila los convoyes holandeses de la zona y destruye @I$NumConvoys$ de ellos."
"0x208aca1e" = " Vigila los convoyes españoles de la zona y destruye @I$NumConvoys$ de ellos."
"0x209d658e" = "Fecha"
"0x20abe2eb" = "Alan Wild"
"0x20b21199" = "Vender"
"0x20b2119a" = "Devolver"
"0x20ccd2d7" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen>"
"0x20d2607a" = "¡Bien hecho! [ref:Tortuga] vuelve a tener el estatus \"auge\". Has completado esta tarea en @I$Days$ días."
"0x20de74a6" = "Persecución de barcos"
"0x20e2a2f4" = "Promedio de 1 día. Beneficio diario medio %1."
"0x20eedea9" = "No fue posible guardar la ruta comercial."
"0x20eef526" = "<ts:80><ts:145><ts:210><n>Resultado de la batalla:<n><n>"
"0x20ff905e" = "Tripulación"
"0x2106ce9e" = "Un capitán experimentado espera en la taberna."
"0x21117682" = "<n><n>Normalmente puedes devolver un permiso de construcción que hayas adquirido. Sin embargo, en este caso no puedes hacerlo porque %1 es la ciudad donde empezaste el juego."
"0x21117683" = "<n><n>¿Quieres devolver tu permiso?<n>Recuerda que no puedo pagarte nada por él!"
"0x211c8552" = "Fin del tiempo de juego"
"0x2137ec23" = "Gracias. Te pagaré precios altos por vino, herramientas y especias hasta @D$Date$. Reúnete con mi emisario en el mercado y entrega @a$Amount$ de cada uno. Solo aceptará una entrega completa y te pagará en el acto."
"0x2137ec24" = "Suena bien. Entonces viaja a las ciudades de nuestros enemigos y acapara allí mercancías de importación. Entrega @a$Amount$ de cada una antes de @D$Date$ a mi emisario en el mercado de @T$TOWN$; te pagará más del doble del precio habitual."
"0x2137ec25" = "¿Sabes qué sería lo mejor? Acaparar las mercancías de importación en @n$Nation2$ y provocar allí una escasez. Entrega @a$Amount$ de cada una en el mercado. Mi emisario te esperará allí hasta @D$Date$ y te pagará un precio alto."
"0x215e37a6" = "Hace poco oí por casualidad una conversación en la que un comerciante mencionó que uno de sus barcos se había hundido. No le preocupaba demasiado el barco, pues no era más que un cascarón viejo y destartalado. Pero llevaba a bordo un cofre especial."
"0x215e37a7" = "Entonces tenemos un trato. En el último viaje en el que me enrolé, el capitán perdió los estribos por un cofre, no sé por qué, y luego lo tiró por la borda."
"0x215e37a8" = "Un hombre que antaño fue un buen amigo se ha fugado con un valioso cofre mío."
"0x2167838b" = "Compra de barcos"
"0x21743bf7" = " ¡Debo recuperar estas cosas! No sabemos el punto exacto donde se hundió el barco. @l$ChestPos$ Tráeme el cofre antes de @D$EndDate$."
"0x21743bf8" = " Debes conseguirme las cosas antes de @D$EndDate$. @l$ChestPos$"
"0x21743bf9" = " Hace poco me escribió para contarme que había arrojado este cofre por la borda. @l$ChestPos$ ¡Debes traerme mis cosas! Puedes encontrarme aquí hasta @D$EndDate$."
"0x217923cb" = "Fin de la entrega de mercancías: %1"
"0x2190d204" = "Un comerciante local está dispuesto a pagarte %1 por el negocio."
"0x21a69afe" = "Director de marketing"
"0x21b0dfff" = "%1 saquea %2"
"0x21b3050a" = "Un convoy militar ha destruido las defensas portuarias de la ciudad y ha saqueado mercancías. El estatus de la ciudad también ha caído."
"0x21bdc952" = "siguiente gráfico"
"0x21bf83f0" = "Mostrar permanentemente información de los barcos"
"0x21c2f2cf" = "<n><o:0xffC00000>Misión no cumplida. <o:0xff000000>"
"0x21cae149" = "¡Muy bien! Ahora tienes que hacer más potente tu convoy para poder enfrentarte a varios convoyes militares a la vez. Deberías tener en tu convoy al menos tres barcos que sean fragatas o naves mayores.<n><n>Puedes capturar esos barcos o intentar comprarlos en los astilleros de las ciudades con gobernador.<n><n>Convierte estos barcos en barcos de escolta y asegúrate de que estén completamente armados y con la tripulación completa de marineros.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arma tu convoy de modo que tenga al menos tres barcos de escolta completamente armados y con tripulación completa, que sean fragatas o naves mayores. "
"0x21d142f5" = "Reparar el convoy en esta ciudad"
"0x21e727b4" = "Estoy seguro de que ya has oído hablar del pirata @P$PirateName$. Ya tiene @I$NumConvoys$ convoyes y todavía no hemos descubierto su escondite. Afortunadamente, sabemos dónde está uno de sus convoyes. Quizá siga cerca. Quiero que destruyas este convoy. "
"0x21e727b5" = "Debemos actuar rápido, pues acabo de saber dónde está uno de los convoyes del pirata @P$PirateName$. Encuentra y destruye este convoy."
"0x21e727b6" = "Todos los piratas tienen su propio escondite, desde el que envían convoyes para hacerse botín. Mientras tanto, el pirata @P$PirateName$ ha reunido una flota de @I$NumConvoys$ convoyes. Por casualidad, hemos descubierto el paradero reciente de un capitán importante de esta banda y de su convoy. Quiero que encuentres y destruyas ese convoy."
"0x21f9ce44" = "Hambruna en %1"
"0x2204d118" = "Negocios utilizables / total"
