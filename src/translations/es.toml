"0x2ee7d67a" = "Virrey de %1"
"0x2ee8bb8c" = "Nos encontramos en la ciudad de [town:Cartagena], al sur del Caribe.<n>En la vista principal puedes ver la ciudad y los edificios que la componen, así como los barcos atracados en puerto.<n>Para empezar, fíjate en la parte superior de la pantalla. Allí verás una serie de botones y marcadores.<n>Ahora, pulsa el botón con el reloj que está en el extremo izquierdo de la pantalla (Crónica)."
"0x2ee8bb8d" = "Has abierto la Crónica. Aquí se apuntan todos los acontecimientos importantes que ocurran en el Caribe para cuando quieras consultarlos.<n>A la derecha de la ventana de la Crónica verás una serie de botones que te permiten seleccionar la información que deseas ver en cada momento. En muchas ventanas del juego encontrarás botones con opciones a la derecha.<n>Ahora, cierra la Crónica pulsando sobre el botón marcado con una \"X\"."
"0x2ee8bb8e" = "En la parte superior de la pantalla, junto a la fecha, se encuentra el botón del Diario. Junto a él, una cifra que muestra tu dinero en efectivo.<n>El diario te mantiene informado sobre todo lo que se refiere a tus logros y posesiones, además de almacenar los mensajes y misiones que recibas para futura referencia.<n>Ahora, abre el diario. "
"0x2ee8bb8f" = "Como puedes ver, el diario muestra inmediatamente todos los mensajes que hayas recibido. Por ahora sólo encontrarás las instrucciones correspondientes a esta campaña.<n>A la derecha de la ventana del diario hay más botones. Pulsa el tercero empezando por arriba (misiones). "
"0x2ee8bb90" = "Esta es la ventana de misiones. Aquí se muestran las tareas y misiones que hayas recibido. De momento sólo se muestra el objetivo de la campaña.<n>Con los dos botones que están junto al título de la ventana puedes pasar de la misión actual a las ya cumplidas.<n>Ahora, cierra el diario; además de con el botón de la \"X\", también puedes hacerlo con sólo pulsar el botón derecho del ratón (en cualquier parte)."
"0x2ee8bb91" = "Más adelante en la partida podrás aceptar numerosas misiones para alcanzar fama y fortuna.<n>Primero, echemos un vistazo a la ciudad. Como puedes ver en el indicador de la parte superior central de la pantalla, estamos en [town:Cartagena]. La ciudad tiene unos 2.000 habitantes.<n>Haz clic en el botón que muestra el nombre de la ciudad."
"0x2ee8bb92" = "Se acaba de abrir la ventana que muestra información sobre la ciudad.<n>En ella puedes ver que [town:Cartagena] es una ciudad con gobernador, que pertenece a España, su situación económica actual y los productos que pueden producirse en ella.<n>Ahora, cierra la ventana de información de la ciudad."
"0x2ee8bb93" = "Perfecto. Puedes usar las teclas de cursor o llevar el cursor hasta el borde de la pantalla para moverte por la vista de la ciudad. En el centro de la ciudad, dentro de las murallas, encontrarás edificios como la lonja, la iglesia o el palacio del gobernador.<n>Pulsa una vez sobre cualquiera de estos edificios."
"0x2ee8bb94" = "La ventana de acciones, en la parte inferior central de la pantalla, cambia al pulsar sobre un edificio. Dependiendo del tipo de edificio de que se trate, recibirás información o podrás ejecutar determinadas acciones.<n>A la derecha de la ventana de acciones verás una serie de botones. Para salir del edificio, pulsa sobre el botón marcado con una \"X\"."
"0x2ee8bb95" = "Los edificios públicos, en los que puedes realizar varios tipos de acciones, siempre están dentro de los muros de la ciudad.<n>Ahora, sal del edificio y mueve la vista de la ciudad para mostrar el puerto. En él se encuentra anclado el convoy “Santa María”, de tu propiedad. Pulsa sobre él."
"0x2ee8bbfd" = "Como puedes ver, ahora la información sobre tu convoy aparece en la Ventana de acciones.<n>El convoy ya tiene mercancías cargadas: 10 barriles de trigo y 15 de maíz.<n>A la derecha de la ventana del convoy hay varios botones. Pulsa el segundo, el que muestra el icono del barco (Composición del convoy)."
"0x2ee8bbfe" = "Aquí puedes ver todos los barcos del convoy. Un convoy está dirigido por un único capitán y puede tener un máximo de 10 barcos.<n>Vamos a enviar el convoy a otra ciudad.<n>Pulsa el botón con la flecha (Carta de navegación) que encontrarás en la parte superior derecha de la pantalla para dejar la ciudad."
"0x2ee8bbff" = "Esta es la carta de navegación. En el centro de la pantalla verás la ciudad de [town:Cartagena].<n>Puedes mover la vista de la carta de navegación igual que la de la ciudad para cambiar la zona del mapa que se muestra y ver todo el mundo del juego.<n>Busca la ciudad de [town:Port Royale] en una isla al norte y con tu convoy seleccionado, pulsa sobre la ciudad con el botón derecho del ratón."
"0x2ee8bc00" = "Ahora se ha trazado una ruta y tu convoy se ha puesto en marcha.<n>Al pulsar con el botón derecho sobre [town:Port Royale], has seleccionado esta ciudad como destino para tu convoy.<n>Si el convoy tarda demasiado en llegar a la ciudad, puedes hacer que el juego avance rápidamente con solo mantener pulsada la tecla de avance rápido; normalmente la barra espaciadora. "
"0x2ef566b4" = "Teclado"
"0x2ef8f665" = "Bienvenido a %1,<n><n>Me gustaría ofrecerte algunos consejos para que puedas orientarte con facilidad por la región de %2; de este modo, podrás ayudar a mi país a desarrollar esta y otras ciudades.<n>Las ciudades de los gobernadores necesitan un constante suministro de mercancías coloniales para exportarlas a Europa. A su vez, estas ciudades suelen ofrecer bienes de lujo diversos que pueden venderse a otras ciudades sacando un buen beneficio.<n>Sólo una cosa más: quizá te interese saber que de vez en cuando los gobernadores asignan misiones. Pero no podrás aceptar misiones hasta haber alcanzado el rango de Grumete.<n><n>%3 %4, gobernador de %5"
"0x2efebfdd" = "Sólo podrás entrar en aquellas ciudades en la que tengas un barco o un almacén. Como tu convoy ha llegado a [town:Port Royale], ya puedes entrar en la ciudad. Sólo tienes que pulsar sobre el símbolo de la ciudad, formado por un grupo de pequeños edificios."
"0x2efebfde" = "De nuevo en la vista de la ciudad, aunque esta vez se trata de [town:Port Royale]. Puedes moverte por cualquier ciudad en la que tengas convoyes o edificios.<n>Busca el astillero en el puerto y pulsa sobre él, porque vamos a comprar un nuevo navío."
"0x2efebfdf" = "Ahora, en la ventana de acción aparecen las opciones del astillero.<n>En él podrás comprar, vender y reparar barcos.<n>Selecciona \"Comprar Barco\" y echa un vistazo a los barcos disponibles.<n>Compra el barco que más te apetezca y no exceda tu presupuesto."
"0x2efebfe0" = "¡Enhorabuena! Has comprado tu primer barco.<n>El barco ya ha sido entregado en el puerto de la ciudad.<n>Ahora, sal del astillero y pulsa en las aguas del puerto. La ventana de acciones mostrará cada uno de los barcos de tu propiedad que hay en el puerto sin asignar a un convoy.<n>Pulsa en tu nuevo barco."
"0x2efebfe1" = "Ahora se muestran los datos del barco que ya habías visto en el astillero.<n>No puedes dar órdenes ni hacer uso de un barco sin añadirlo antes a un convoy.<n>Para hacerlo, vuelve a seleccionar tu convoy."
"0x2efebfe2" = "Ahora que tienes tu convoy seleccionado, nuestro objetivo es asignarle el nuevo barco que hemos comprado.<n>Para ello, pulsa con el botón derecho sobre las aguas del puerto.  "
"0x2efebfe3" = "Muy bien. Se ha abierto la Ventana de transferencia de barcos, desde la que puedes incorporar los barcos al convoy.<n>Para hacerlo, pulsa sobre el barco de la izquierda y arrástralo hasta el convoy; de esta forma, el convoy contará con dos barcos.<n>Después, vuelve a cerrar la ventana de Transferencia con el botón \"X\" de la derecha."
"0x2efebfe4" = "Si lo que hubiésemos querido fuese crear un nuevo convoy con nuestro barco nuevo, tendríamos que haber contratado a un capitán en la taberna.<n>Esto podrás hacerlo en cuanto asciendas de rango.<n>Ahora, selecciona la composición del convoy: Es el segundo botón a la derecha de la ventana de acciones del convoy."
"0x2efebfe5" = "Ahora tienes un convoy con dos barcos en el puerto de [town:Port Royale].<n>Puedes pulsar sobre los barcos de la composición del convoy para obtener datos sobre estos.<n>Ahora, envía tu convoy de vuelta a tu hogar en [town:Cartagena]. Para hacerlo, dirígete a la carta de navegación pulsando el botón de la flecha (Carta de navegación) que figura en el extremo superior derecho de tu pantalla o con la tecla \"retroceso\" del teclado. "
"0x2efebfe6" = "Ahora, localiza la ciudad de [town:Cartagena], en el sur, y envía tu convoy allí pulsando sobre la ciudad con el botón derecho del ratón.<n>La campaña terminará en cuanto tu convoy llegue a la ciudad."
"0x2f0127e1" = "Pasas un día muy agradable con %1 y le cuentas tus aventuras."
"0x2f0127e2" = "Pasas una tarde muy agradable con %1 y te olvidas momentáneamente de tus asuntos."
"0x2f0127e3" = "Pasas la tarde con %1 y deseas que ese momento no acabe nunca."
"0x2f08cdb5" = "Te estaba esperando, %1. ¿Tienes algo para mí?"
"0x2f08cdb6" = "Aquí tienes, %1. ¿Traes todas las mercancías?"
"0x2f08cdb7" = "Saludos, %1. ¿Me has traído algo?"
