"0xf353a9ce" = "Me alegro de verte, @A$USER$. He perdido un paquete muy importante en un desafortunado accidente cuando navegaba hacia aquí. ¿Podrías buscarlo?"
"0xf353a9cf" = "¡Salud! ¿Tienes un barco? Hace poco perdí el mío en una tormenta. Afortunadamente pude salvarme, pero perdí un cofre que contenía muchos de mis efectos personales más preciados. ¿Podrías zarpar y comprobar si mi cofre aún sigue flotando por alguna parte? Te recompensaré generosamente, pues el cofre tiene un gran valor para mí."
