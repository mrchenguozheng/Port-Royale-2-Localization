"0xfc5c9324" = "<gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Gold_X3_800x600.screen>"
"0xfc64ab0e" = "Ahora puedes aumentar tu reputación en %1 atacando barcos y ciudades franceses. Esto no disminuirá tu reputación en las demás naciones."
"0xfc692ef1" = "<n><n>Sin embargo, si al menos un barco de tu convoy sobrevive a la batalla, el capitán también sobrevive."
"0xfc71eb4b" = "Qué desgracia me ha ocurrido. Desde el estallido de la guerra con @n$FoeNation$, no he podido acumular suficientes mercancías coloniales para los convoyes de transporte. ¿Puedes ayudarme proporcionándome un gran cargamento de @G$Goods$?"
"0xfc71eb4c" = "Desde que entramos en guerra con @n$FoeNation$, se ha prohibido a sus comerciantes entregar @G$Goods$ en las ciudades de mi nación. Ahora me enfrento a una escasez significativa de mercancías. Tienes muchos barcos y conoces bien los mares. ¿No podrías asegurarme un gran cargamento de @G$Goods$?"
"0xfc72151e" = "Transferencia entre almacén y convoy"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Por cañones"
"0xfc910833" = "Viviendas disponibles"
"0xfc9a5f7d" = "Ha sido un placer hacer negocios contigo. ¡Buen día!"
"0xfc9a5f7e" = "Las mercancías se han enviado a tu almacén. ¡Buen día!"
"0xfc9a5f7f" = "Las mercancías se han cargado en tu convoy. Adiós, %1."
"0xfc9cf623" = "Completada"
"0xfca882e8" = "Como sabes, la flota del tesoro española siempre toma una ruta distinta al recoger los tesoros de sus colonias y transportarlos a Europa. La flota evita las emboscadas permaneciendo siempre poco tiempo en cada ciudad. Sin embargo, esta vez España ha cometido un grave error, al permitirnos averiguar la ruta que sigue la flota del tesoro española en este mismo momento. Tus órdenes no pueden ser más sencillas. ¡Destruye hasta el último barco!"
"0xfca882e9" = "Estamos en guerra con España y debemos asegurarnos de que la flota del tesoro española nunca llegue a Europa. Por suerte, hemos averiguado a qué ciudad se dirigirá la flota a continuación. Sabotearemos la flota en esa ciudad para que tenga que prolongar su estancia en el puerto. Eso debería darte tiempo suficiente para interceptar la flota e impedirle llegar a Europa. ¿Aceptas esta misión?"
"0xfca882ea" = "¡No todos los días se presenta una oportunidad como esta! Hoy uno de mis informantes me ha revelado la ruta que sigue actualmente la flota del tesoro española. Pero eso no es todo. Hemos sabido que la flota estará fondeada más tiempo de lo habitual en la próxima ciudad que visite. Como estamos en guerra con España, deberíamos dar al virrey algo de lo que alegrarse y asegurarnos de que la flota del tesoro nunca llegue a su destino en Europa. ¿Interceptarás la flota por mi nación?"
"0xfcc82d44" = "Infante"
"0xfcd6fdec" = "Veo que todavía no has cumplido mi última misión. Termina este trabajo, pues tengo más encargos para ti."
"0xfcded04c" = "España debe estar pertrechada, así que asegura población y mercancías. Construye 20 casas señoriales y 20 negocios a pleno rendimiento en:<n>[ref:Havana], [ref:Margarita], [ref:Guadeloupe], [ref:St. Juan], [ref:Port Royale], [ref:Cartagena], [ref:Biloxi], [ref:St. Augustine], [ref:Grand Bahama] y [ref:Turk Islands]."
"0xfce1cfd1" = "Me temo que no tengo uso para ti en este momento.<n> Solo puedo encargarte capturar una ciudad si una nación hostil está debilitada y tengo suficientes convoyes militares disponibles para proteger mis ciudades."
"0xfce38f12" = "Comandante de la ciudad"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "Ambiente"
"0xfd1be8e3" = "El bucanero %1 %2 se ha infiltrado en la ciudad y ha destruido grandes existencias de mercancías de varios comerciantes de la ciudad. El ayuntamiento se niega a aceptar responsabilidad."
"0xfd1f0281" = "Materias primas y producción"
"0xfd26f2aa" = "El convoy @C$Convoy$ ha recogido a un náufrago. Llévalo a @T$DestTown$."
"0xfd26f2ab" = "El convoy @C$Convoy$ ha recogido a un náufrago. Llévalo a una ciudad de @n$DestNation$."
"0xfd26feb4" = "@N$Name$ se ha lanzado al mar furioso porque has sido demasiado lento."
"0xfd2f55fd" = "Fecha"
"0xfd40a541" = "<n><f:fonts/Tiepolo_black14x14aaFHk.res>Pérdidas<t><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen> %1<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen> %2<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_MANN_800x600.screen> %3<n>(aprox. %4)"
"0xfd4ed860" = "Tus tropas derriban la puerta de la ciudad y toman al comandante como rehén. Cuando los soldados de la ciudad lo ven, capitulan.<n><n>¿Qué quieres hacer ahora?"
"0xfd518241" = "Ciudad con gobernador de %1"
"0xfd638295" = "El juego se está cargando..."
"0xfd6477c9" = "Aumenta la potencia de fuego de tu convoy hasta al menos 90 cañones."
"0xfd69d24a" = "%1:%2:%3"
"0xfd6d4abb" = "Has realizado una acción que te impide completar el escenario con éxito.<n><n>Sigue las instrucciones de la ventana de eventos."
"0xfd9349ac" = "Expropiación"
"0xfda0635d" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>LMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Disparar andanada<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Fijar rumbo<n><f:fonts/Tiepolo_black14x14aaFHk.res>1,2,3<f:fonts/Tiepolo_bold14x14aaFH.res><t>Elegir munición<n><f:fonts/Tiepolo_black14x14aaFHk.res>4<f:fonts/Tiepolo_bold14x14aaFH.res><t>Listo para abordar<n><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Disparar cañones"
"0xfda277f4" = "%1 está llena y ya no tiene espacio para construir un almacén. Si aun así quiere hacerse un hueco en esta ciudad, puede intentar convencer a uno de los comerciantes locales de que derribe uno de sus negocios.<n><n>Los negocios se derriban si el precio de las mercancías producidas en la ciudad se mantiene bajo durante un periodo prolongado, es decir, si hay un excedente de la mercancía. Para lograrlo, primero debe empezar a acaparar el producto. Luego venda cantidades suficientes de ese producto en el mercado de la ciudad para hacer bajar el precio hasta un nivel bajo.<n><n>Las mercancías producidas se entregan al mercado de la ciudad una vez al día. Si el precio es mínimo en ese momento, el negocio reduce su plantilla de trabajadores. Puede comprobarlo haciendo clic en el negocio. Un negocio se derriba cuando se han despedido 30 trabajadores."
"0xfda5ded4" = "La ciudad prospera gracias al descubrimiento de oro"
"0xfdaf6463" = "Debo darte las gracias una vez más; has hecho tanto por mi nación. Como recompensa, te daré el terreno restante para tu ciudad %1. Ahora posees todo el distrito."
"0xfdb7f907" = "Una hoguera delata el escondite del maestro, no muy lejos de la orilla. Tu capitán rema hasta la costa y lo recibe un anciano. Cuando el anciano ve todo el vino, se frota las manos de alegría."
"0xfdb7f908" = "No muy lejos de la orilla, tu convoy descubre el pequeño campamento de un ermitaño. Tu capitán rema hasta la costa y se encuentra con un anciano que lleva un uniforme de capitán aún más viejo que él. Ve los barriles de ron y se alegra muchísimo."
"0xfdb7f909" = "Al cabo de un rato, tu convoy descubre un escondite en tierra. El capitán rema hasta la orilla y echa un vistazo. Por fin encuentra al viejo maestro y le explica qué lo lleva allí. El ermitaño acepta la comida."
"0xfdc606cf" = "A la caza del pirata"
"0xfdcdfd58" = " Está encantado de enseñar a tu joven capitán todos sus trucos del oficio."
"0xfdcdfd59" = " Por lo tanto, enseñará al joven capitán todo lo que sabe sobre cómo ganar batallas."
"0xfdcdfd5a" = " Está encantado de enseñar al capitán todo sobre el arte de la navegación."
