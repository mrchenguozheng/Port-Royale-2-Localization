"0x05716a06" = "Tu siguiente batalla va a ser un poco más difícil, porque esta vez el enemigo se resistirá. Tu misión es localizar y matar a un pirata para el gobernador.<n><n>Pero primero tienes que armar tu convoy para la batalla. Compra un barco, añádelo a tu convoy y embarca nuevas armas y marineros.<n><n>Puedes pulsar el botón F1 en cualquier momento de la batalla naval para ver la configuración del teclado y del ratón. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arma tu convoy y cumple la nueva misión que te ha encomendado el gobernador de [ref:Cartagena]."
"0x058ca789" = "Visita al gobernador de @T$TOWN$ y acepta su misión."
"0x05980d2c" = "El nivel de dificultad determina los precios de las mercancías y el daño infligido en las batallas navales.<n><n>Además, con un nivel de dificultad bajo, no necesitas un historial comercial tan bueno en una ciudad antes de poder comprar un permiso de construcción."
"0x05ae35b1" = "¡Muy bien! Ahora haga una visita al virrey español en [ref:Port Royale] y acepte una misión para tomar una ciudad francesa.<n><n>Normalmente hay que tomar dos ciudades antes de que un virrey le conceda un terreno. Sin embargo, en este escenario tiene una pequeña bonificación y solo debe tomar una ciudad para España.<n><n>Puede decidir qué ciudad tomar. Es buena idea elegir una ciudad con un número mínimo de cañones de puerto. Una ciudad francesa que en estos momentos sería un objetivo ideal es @T$SampleTown$.<n><n>A cambio de tomar una ciudad, el virrey le concederá un terreno. Nota: no puede hablar con un virrey a menos que tenga al menos el rango de Contramaestre.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visite al virrey español en [ref:Port Royale] y acepte una misión para tomar una ciudad. Después de cumplir esta misión, podrá aceptar su regalo de un terreno."
