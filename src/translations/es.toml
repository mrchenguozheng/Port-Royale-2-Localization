"0x0ce1a79f" = "Colonial towns like Santa Marta can produce two essential goods, two raw materials and one colonial good.<n>In the last scenario, you learned that there is a particularly high demand for raw materials and colonial goods in governor towns.<n>You want to produce the colonial good cocoa first.<n>Now close the town information."
"0x0ce1a7a0" = "Como las mercancías coloniales se envían a Europa desde las ciudades con gobernador, la demanda de cacao en estas ciudades es alta. Estas condiciones son buenas para tu primer negocio. Ahora localiza y haz clic en el edificio del maestro de obras, en el centro de la ciudad."
"0x0ce1a7a1" = "At the master builder's, you can apply for permission to construct a new building or return your building permit. This is not what you want to do now of course!<n>Look at the different buildings you can construct. You can also use the buttons on the right of the Master Builder window.<n>Click on the Cocoa Plantation button."
"0x0ce1a7a2" = "You can now see how many building materials are required and what the construction costs will be.<n>You can also see how many building materials you currently have in your warehouse and how many you'll have to buy from the town.<n>You have enough materials at present.<n>Position your cursor on an available construction site and left-click on it."
"0x0ce1a7a3" = "The scaffolding of the cocoa production facility is now displayed and construction begins.<n>It will take a couple of days for construction to be completed. In the meantime, you should organize accommodation for your new workers.<n>Close the Construction menu and look for a residential area in Santa Marta. "
"0x0ce1a7a4" = "Esta zona residencial pertenece a un comerciante de la ciudad. Puedes comprobar cuántas zonas residenciales poseen los comerciantes locales y cuántos inquilinos tienen. Quieres construir tu propia zona residencial. Para ello, abre el menú de construcción."
"0x0ce1a7a5" = "Select a residential area in the Construction menu and look at the construction costs display. <n>You may not have enough building materials in storage. However, you can buy any materials that you need in the town if they are in sufficient supply. <n>Otherwise, you'll have to source them in another town.<n>Then build a residential area."
"0x0ce1a7a6" = "A business can employ 30 workers. Since there are four family members in an average worker's family, living quarters for 120 people are required for each business you establish. <n>A residential area has space for 120 tenants and so one residential area is required for each business.<n>Now close the Construction menu and click on your new residential area."
"0x0ce1a7a7" = "There is no construction period for a residential area because the tenants live in tents at first.<n>Over time, the tenants themselves develop the residential area into a very sizeable building.<n>The appearance of a residential area depends on how old it is and on the status of the town.<n>Close the residential area dialog."
"0x0ce1a80f" = "Como sabes, tu primer edificio en una ciudad siempre debe ser un almacén. No puedes construir ningún otro edificio hasta que lo hayas construido.<n>Ya tienes un almacén en la ciudad donde empezaste el juego. Encuéntralo y haz clic en él. Se muestra en azul claro en la pantalla."
"0x0ce1a810" = "In the warehouse, you can see which buildings you own in the town and what it costs to maintain them.<n>You can also see how much rent your tenants pay you and what goods your businesses are producing.<n>Later, you'll be able to give the storekeeper instructions.<n>Have a look around the warehouse and then close it."
"0x0cee08cc" = "la presencia militar en esta ciudad podría ser mejor"
"0x0cf75014" = "Cerrar"
"0x0cf7abef" = "Click on your cocoa plantation. The display always shows all of your cocoa plantations in the town.<n>Once your production facilities are constructed, you’ll need 30 workers, that is, 30 settlers. Now leave the plantation, go to the docks in the harbor and press the “Cargo” button (the bottom button on the right)."
"0x0cf7abf0" = "Here you can see if there are any settlers waiting to be hired in the town or if the town needs new workers. This will be the case as soon as construction of your business has been completed.<n>Go to the surrounding governor towns and bring settlers to Santa Marta until your business is employing a full complement of workers."
"0x0d0db040" = "Pincha en una de tus plantaciones de cacao."
"0x0d0db041" = "Ahora puedes ver cuánto cacao produce tu negocio cada día y cuántas herramientas requiere.<n>Ahora acumula un suministro de @a$SubGoal$ de herramientas en tu almacén, porque tu almacén abastece de mercancías a tus negocios."
"0x0d0db042" = "Las herramientas son mercancías de importación. Esto significa que encontrarás la mayor oferta y los precios más bajos en las ciudades con gobernador.<n>Podrías intentar conseguirlas en Cartagena, al suroeste, o muy al este, en Margarita ."
"0x0d0db043" = "¡Bien hecho!<n>Cuanto menor sea el precio medio de las materias primas que necesitas, menores serán tus costes de producción de las mercancías que fabricas.<n>Ahora sigue produciendo cacao hasta tener un suministro de @a$AmountGoal$ en tu almacén."
"0x0d0f1795" = "Julio"
"0x0d0f1877" = "Junio"
"0x0d1098bd" = "%1,<n>eres nuevo por aquí, ¿verdad? Pero ya he oído hablar de ti, y tu buena fama te precede. Deberías visitarme de vez en cuando, pues siempre hay algún trabajo que hacer."
"0x0d23b491" = "Sail with your convoy to the town of Cartagena and enter the town.<n>A small circle symbol is displayed below the town name on the right of the screen. This shows your trading record in Cartagena up to now.<n>Things are a little easier for you in this scenario because you have received a bonus.<n>Now open the town information."
"0x0d23b492" = "En \"Historial comercial\" puedes comprobar ahora qué porcentaje de la puntuación requerida has alcanzado. Si aquí se muestra 100%, puedes solicitar un permiso al maestro de obras.<n>Cierra la información de la ciudad."
"0x0d23b493" = "The prices of goods that are scarce in a town are shown in red in the trade window. If you sell these goods, you will improve both your trading record in the town and your reputation with the nation to which the town belongs.<n>Click once on the docks to display information on the stock of goods in the town."
"0x0d23b494" = "Fíjate en qué mercancías escasean en la ciudad. Por ejemplo, la ciudad siempre necesitará azúcar y algodón porque produce ron y prendas de vestir.<n>Pero también hay otras mercancías escasas en la ciudad.<n>Ve a otras ciudades para comprar las mercancías que necesita Cartagena y mejora tu historial comercial."
"0x0d23b495" = "No está mal. Has aumentado considerablemente tu perfil en Cartagena.<n>Pero ten cuidado de no acaparar mercancías escasas en Cartagena. Puedes reconocer fácilmente las mercancías escasas porque sus existencias se muestran en rojo.<n>Aumenta tu puntuación de historial comercial hasta el 85%."
"0x0d23b496" = "¡Bien hecho! Ahora tienes una puntuación del 85% en Cartagena. ¡Sigue así!<n>Aumenta tu puntuación hasta el 100%.<n>Por cierto, acabas de recibir un mensaje sobre \"ascensos y rangos\"."
"0x0d23b497" = "¡Excelente! Ya has comerciado lo suficiente con Cartagena.<n>Desgraciadamente, tu rango sigue siendo marinero raso y solo se te puede conceder un permiso.<n>Para ascender al siguiente rango, debes aumentar tu riqueza comerciando un poco más. "
"0x0d23b498" = "¡Muy bien! Como marinero, se te pueden conceder dos permisos de construcción.<n>Ve al maestro de obras de Cartagena y solicita un permiso.<n>Si no tienes suficiente oro, debes comerciar un poco más. No olvides comerciar las mercancías que produces en Santa Marta."
"0x0d2a3b89" = "Mantenimiento de barcos"
"0x0d39b8e2" = "Primero debes construir un almacén en Cartagena antes de poder construir cualquier otro edificio."
"0x0d39b8e3" = "Ahora establece dos telares y construye dos zonas residenciales.<n>Si no hay suficientes materiales de construcción en la ciudad, debes comprarlos en otra ciudad y entregarlos en tu almacén del puerto. <n>No olvides negociar un precio antes de desprenderte de tu preciado oro."
"0x0d39b8e4" = "Deberías asegurarte de tener un suministro de @a$SubGoal$ de algodón en el almacén cuando se hayan construido tus telares, para que los nuevos negocios puedan empezar a tejer tela a partir del algodón de inmediato."
"0x0d39b8e5" = "Tu siguiente objetivo es producir tu propio suministro de @a$SubGoal$ de tela para el almacén de Cartagena y esperar a que se construyan tus telares.<n>Para @a$SubGoal$ de tela, necesitas exactamente @a$SubGoal$ de algodón."
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Militar<t>Tus barcos de escolta y comerciales<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Pirata<t>Tus barcos de escolta y comerciales<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "¡La partida guardada no es válida!"
"0x0d496e89" = "Haz clic en las mercancías para activar o cancelar la compra."
"0x0d496e8a" = "Compra automática por parte del encargado"
"0x0d4fbd33" = "¡Muy bien!<n>Para asegurarte de tener siempre suficientes materias primas para tus telares, ahora deberías establecer un negocio de algodón en Santa Marta.<n>Una instalación de producción puede abastecer de materias primas suficientes a dos instalaciones de fabricación."
"0x0d4fbd34" = "Now ensure that your businesses in Santa Marta and Cartagena are operating at full steam.<n>Don't forget that your weaving mills in Cartagena require a constant supply of cotton.<n>Continue to trade and sell the goods you produce.<n>This scenario will end as soon as you have increased your cash to @g$GoldGoal$."
"0x0d552127" = "La ciudad no puede ser atacada."
"0x0d578089" = "Ya atacaste la ciudad de %1 en los últimos 30 días. El capitán se niega a volver a atacarla por motivos morales."
"0x0d58ea99" = "El bucanero %1 %2 ha captado ilegalmente a %3 trabajadores y sus familias. Muchos negocios de la ciudad ya no funcionan a plena capacidad."
"0x0d750c45" = "%1 convoyes"
"0x0d919a5a" = "%1,<n>sabes muy bien que en circunstancias normales te mandaría al infierno, pero en tiempos desesperados como estos, vendería mi alma al mismísimo diablo.<n><n>Así que pasa, tengo algo que decirte."
"0x0d9c1799" = "Your task is to ensure that the town of @T$TargetTown$ declines in status to “Recession” by @D$EndDate$. You have two options here:<n><n>Either attack the town and loot all the goods to bring about the status “Recovery”. The town’s status will then continue to decline due to the scarcity of goods.<n><n>Alternatively, you can cut off the supply of goods to the town by intercepting trading convoys. Note:  If you only loot a convoy and do not capture it, your reputation with the nation in question will suffer to a much lesser extent."
"0x0d9c179a" = "Good! I am assigning you the mission of causing the town of @T$TargetTown$ to fall into a state of “Recession”. You have until @D$EndDate$.<n><n>To achieve your objective, you must intercept all traders visiting the town so that it receives no more goods and its status slowly starts to decline.<n><n>However, there is a way of making this happen faster. This involves attacking and looting the town. Your attack will cause the status to drop rapidly to “Recovery” and the resulting scarcity of goods in the town will then cause it to drop even further until the town is in “Recession”."
