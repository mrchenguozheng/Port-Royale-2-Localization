"0xe37f3b10" = " Ya que las ciudades que pertenecen a mi nación no producen lo suficiente, me vi obligado a depender de las entregas procedentes de ciudades inglesas."
"0xe37f3b11" = " Ya que las ciudades que pertenecen a mi nación no producen lo suficiente, me vi obligado a depender de las entregas procedentes de ciudades francesas."
