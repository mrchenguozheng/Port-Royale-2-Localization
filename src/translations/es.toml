"0xe3e1d467" = "%1,<n><n>No puedes comprar permisos porque tu reputación en mi nación no es lo bastante alta y, además, no has hecho lo suficiente por esta ciudad.<n><n>Aumenta tu reputación en mi nación y comercia con mi ciudad para mejorar tu historial comercial, y entonces volveremos a hablar."
"0xe3e1d468" = "%1,<n><n>Tu reputación en mi nación no es lo bastante alta; me temo que no puedo venderte ningún permiso.<n><n>Vuelve cuando haya mejorado tu reputación."
"0xe3e1d469" = "%1,<n><n>No has comerciado lo suficiente con esta ciudad. Entrega mercancías que estén en demanda para mejorar tu historial comercial. Solo entonces podrás comprar un permiso."
"0xe3e33a30" = "Que %1 sea tu nueva ciudad. Ahora puedes entrar en ella como en cualquier otra ciudad para erigir edificios y establecer negocios.<n>El distrito completo todavía no está disponible para ti, pero, si capturas más ciudades, te daré la tierra que necesitas para ello."
"0xe3fa97eb" = "Entonces queda acordado. Lleva @a$Amount$ herramientas a @T$DestTown$. En el mercado, recibirás @g$GoldPerBarrel$ por <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>. Las mercancías deben entregarse antes de @D$Date$."
"0xe3fa97ec" = "Así sea. Entrega @a$Amount$ en @T$DestTown$. Las herramientas deben llegar antes de @D$Date$. "
"0xe3fa97ed" = "¡Bien! Te encargo conseguir @a$Amount$ de herramientas. Llévalas antes de @D$Date$ a @T$DestTown$. Se te pagará @g$GoldPerBarrel$ por <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> en el mercado."
