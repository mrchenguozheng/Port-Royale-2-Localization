"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "Tecla"
"0xdaeb0484" = "Esta vez empiezas el escenario en Cartagena, una ciudad con gobernador en pleno Caribe.<n>Tu convoy, compuesto por una balandra, está en el puerto.<n>Primero debes armar tu convoy, porque este escenario incluirá batallas navales.<n>Ve a los muelles y abre el menú de carga."
"0xdaeb0485" = "As you can see, you have no cannons or ammunition on board your convoy. You are also in need of a crew.<n>Take on board the largest crew and as many cannons as you can, as well as 10x10 of each of the three types of ammunition for your cannons.<n>There may not be enough space in your convoy because cannons are heavy. If this is the case, you can sell some of the goods you have loaded."
"0xdaeb0486" = "¡Bien hecho! Tu convoy está ahora armado y listo para una batalla a pequeña escala.<n>Y resulta que el gobernador de Cartagena tiene ahora la misión perfecta para ti.<n>Haz clic en el edificio del gobernador y acepta su misión."
"0xdaeb0487" = "Governors often propose missions that will improve your reputation with their nation if they are successfully accomplished.<n>You are also entitled to ask governors for Letters of Marque or claim ransom for buccaneers whom you have captured.<n>Now use your convoy to find the ships the governor told you about."
"0xdaeb0488" = "Very good, you have located the convoy.<n>Your next step is to clear your ship for action and prepare to engage in combat. To do so, open the list of ships in your convoy and select your sloop. To declare it as a warship, press the button next to the cannon. You can then \"attack\" the convoy by right-clicking on it."
"0xdaeb0489" = "Esta es la vista de batalla naval de Port Royale.<n>Muestra tu barco, y puedes ver los barcos abandonados moviendo la ventana de visualización.<n>Ahora desactiva el modo de pausa y practica la navegación con el botón derecho del ratón. La ventana de eventos muestra la dirección del viento y del barco durante las batallas navales."
"0xdaeb048a" = "All ships engaged in the battle are displayed at the bottom of the screen. Here you can use which ammunition you want to use. Select the heavy cannonballs and sink one of the enemy ships.<n>You can fire with the left mouse button, but only when your ship is in a good firing position. Targets are then shown in red."
"0xdaeb048b" = "¡Bien! Aborda el segundo barco.<n>Para ello, haz clic en el botón \"Abordar\" en la parte inferior derecha de la visualización del barco.<n>Luego avanza hacia el barco enemigo y embístelo. Ten en cuenta que el botón F1 también está activo durante las batallas navales."
"0xdaeb048c" = "Normalmente, el enemigo tiene tripulación y se libra una batalla a bordo del barco entre tu tripulación y la suya.<n>Cuando la batalla termina, todos los barcos abordados quedan en manos del vencedor.<n>Ahora añade el barco enemigo a tu convoy y cierra la ventana de transferencia."
"0xdaeb048d" = "¡Muy bien!<n>Ahora envía tu convoy de vuelta a Cartagena."
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "Un convoy del pirata %1 ha atacado a un comerciante de %2."
"0xdb0108d5" = "Primero, compra un barco nuevo. Ve al astillero y compra un barco con tantos cañones como sea posible."
"0xdb0108d6" = "Selecciona tu convoy y luego haz clic derecho en el puerto para añadir el nuevo barco al convoy."
"0xdb0108d7" = "Todos los convoyes se componen de barcos comerciales y barcos de escolta.<n>Si uno de los barcos de tu convoy va a participar en una batalla, debes definirlo como buque de guerra. <n>Abre la lista de barcos de tu convoy para ver todos tus barcos."
"0xdb0108d8" = "The Ships list displays all of the ships in your convoy. The warship status is displayed in the top right corner of a ship. If a cannon symbol is displayed, the ship is defined as a warship and it takes part in battles. Clicking on this corner changes the status directly.<n>But you should now click on your new ship and select it. "
"0xdb0108d9" = "Los detalles técnicos del barco, como su capacidad máxima de carga, se muestran aquí igual que en el astillero.<n>También puedes ver el coste diario de mantener el barco.<n>Ahora convierte el barco en buque de guerra marcando el símbolo del cañón."
"0xdb0108da" = "¡Bien hecho!<n>Los cañones y los marineros siempre se reparten por igual entre los barcos de escolta de un convoy.<n>Asegúrate de que tus barcos de escolta estén completamente armados y con la tripulación completa, y luego visita al gobernador y acepta la nueva misión que te asigne."
"0xdb0108db" = "Ahora cumple la misión que te ha asignado el gobernador. "
"0xdb0108dc" = "Elige entre tus barcos de escolta el barco que quieres controlar en la batalla naval.<n><n>Puedes seleccionar otro barco de escolta en cualquier momento haciendo clic en él en la lista.<n><n>Pero cuidado: en cuanto empiece la batalla, cada barco solo se puede seleccionar una vez."
"0xdb0108dd" = "¡Bien hecho! Has destruido el convoy pirata.<n>Ahora vuelve al gobernador de Cartagena, porque forma parte de tu misión.<n><n>Ten en cuenta que tus misiones se registran automáticamente en tu diario. Allí puedes consultar los detalles de tu misión en cualquier momento si es necesario."
"0xdb04023a" = "No tienes suficientes materiales de construcción"
"0xdb0e3d33" = "Tengo la siguiente misión para ti.<n><n>"
"0xdb0e3d34" = "Podrías hacerme un favor.<n><n>"
"0xdb0e3d35" = "Hay algo que podrías hacer por mí.<n><n>"
