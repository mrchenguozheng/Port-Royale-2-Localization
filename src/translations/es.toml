"0x19f413a1" = "En este escenario tendrás mucho más que hacer que en el primero. Aprenderás a comerciar con éxito y a obtener tus primeros beneficios comerciales.<n><n>También formarás un segundo convoy para poder transportar más mercancías.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Lee y sigue las indicaciones de la ventana de eventos."
"0x1a106105" = "El convoy todavía no ha sido atacado."
"0x1a2ebe80" = "Desgraciadamente, no te queda ningún convoy adecuado anclado en el puerto. El convoy debe constar exactamente de 5 barcos y llevar 150 cañones a bordo. Vuelve cuando hayas reunido un convoy así."
"0x1a3808bb" = "El comerciante se llama @N$Name$ y su ciudad natal es @T$Town$. Si consigues destruir su convoy antes de @D$EndDate$, te recompensaré generosamente con mercancías."
"0x1a444b3b" = "No puedo encargarte que captures en mi nombre una ciudad de otra nación, porque en este momento no estamos en guerra. Sin embargo, las cosas pueden cambiar muy rápido. Vuelve a verme si es así."
"0x1a444b3c" = "Estamos en guerra con %1 y has conseguido que a %1 solo le quede una ciudad. No podemos tomar esa ciudad, así que por ahora no puedo encargarte la captura de ninguna. <n><n>Pero vuelve cuando cambie la situación."
"0x1a444b3d" = "Con gusto te encargaría capturar una ciudad de %1. Tengo suficientes convoyes militares para proteger cualquier zona recién conquistada.<n><n>Sin embargo, %1 sigue siendo demasiado fuerte para tal empresa.<n><n>Podrías ayudar a debilitar a %1 destruyendo sus convoyes militares.<n><n>Después vuelve a verme y puede que tenga una misión para ti."
"0x1a444b3e" = "Con gusto te encargaría capturar una ciudad de %1. Tengo suficientes convoyes militares para proteger cualquier zona recién conquistada.<n><n>Sin embargo, %1 sigue siendo demasiado fuerte para tal empresa.<n><n>Podrías ayudar a debilitar a %1 destruyendo sus convoyes militares.<n><n>Después vuelve a verme y puede que tenga una misión para ti.<n><n><n>Puedes consultar la fuerza de una nación en «Naciones», dentro de la Crónica. "
