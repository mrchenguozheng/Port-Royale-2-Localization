"0xed34fe04" = "Convoy militar"
"0xed5e6448" = "Te agradezco que hayas destruido ese convoy pirata. Aquí tienes una recompensa de @g$GoldReward$.<n>Por cierto: siempre que cumples una misión por mí, mejoras automáticamente tu reputación con mi nación.<n>Si, por el contrario, tienes una reputación baja con mi nación, me temo que no podré confiarte ninguna misión."
"0xed5e6449" = "Te doy las gracias por destruir el convoy pirata. Aquí tienes una recompensa de @g$GoldReward$. Si la suerte nos acompaña, pronto descubriremos la ubicación del escondite pirata. Entonces podremos destruirlo."
"0xed6ee3f7" = "%1 ha sido ascendido"
"0xed88c9e3" = "%1,<n><n>Un préstamo de %2 vencía el %3. La suma se cobró hoy.<n><n>El tesorero de %4"
"0xeda0288d" = "Cerrar diálogo / opciones"
"0xeda49c74" = "Número de permisos"
"0xedad5b61" = "No conseguiste aumentar la población de [ref:Tortuga] hasta @I$Pop$ a más tardar 20 días después del fin de la epidemia. <n><n>En cuanto el estatus de una ciudad alcanza «Auge» o uno superior, se pueden contratar nuevos trabajadores. Puedes abastecer la ciudad de nuevos trabajadores en forma de familias de colonos. Estas viajan de Europa a las ciudades con gobernador, donde esperan un pasaje a otras ciudades. También encontrarás colonos esperando ser recogidos en ciudades con un estatus inferior."
"0xedc30aca" = "<ts:75><ts:150><ts:225><ts:300>Una plaga de ratas ha destruido alimentos en tus almacenes. Las plagas de ratas se producen con frecuencia si los comerciantes acumulan demasiada comida en sus almacenes.<n><n>Pérdidas:"
"0xedffe567" = "Seleccionar mosqueteros"
"0xee00c4df" = "<n><n>Normalmente puedes devolver un permiso de construcción que hayas adquirido. Sin embargo, en este caso no puedes hacerlo porque %1 es la ciudad donde empezaste el juego."
"0xee00c4e0" = "<n><n>Un comerciante local te ofrece %1 por tu permiso y tus edificios. ¿Quieres aceptar la oferta? Recuerda que entonces perderás todos tus edificios en esta ciudad."
