"0x22fffe32" = "Querido %1,<n>Apenas puedo contener mi impaciencia. Por favor, dirígete rápidamente al mercado y entrega todo lo requerido para la boda, para que pronto podamos celebrar el banquete."
"0x2310e7f4" = "Para mostrar el siguiente objetivo de la campaña debes cumplir tu misión de capturar las ciudades."
"0x2335f663" = "Gracias por devolverme el paquete. Aquí tienes tu recompensa de @g$Reward$."
"0x234d00d9" = "Hoy, el pirata %1 comenzó a sembrar el caos en el Caribe."
"0x23652698" = "Por desgracia, no puedo decirte nada demasiado concreto. El comandante del puerto me dio una vaga descripción del barco en el que sospechamos que huyeron. Un comerciante divisó este barco en el mar y me mostró el lugar. @l$Pos$ Es posible que rastreando esta zona encuentres una pista."
"0x23652699" = "@l$Pos$ Rastrea esta zona, quizá encuentres una pista. Por favor, haz lo que sea necesario para devolverme a mi hija sana y salva."
"0x2365269a" = "@l$Pos$ Rastrea esta zona, quizá @F$WifeName$ intentaba decirnos algo cuando lo mencionó. Por favor, devuélveme a mi hija sana y salva. Y si te encuentras con ese Don Juan de pacotilla, dale muchos recuerdos de mi parte… Que no se olvide de mí."
"0x23815ece" = "¿Estás seguro de que quieres salir del juego y volver al menú principal?"
"0x2388c117" = "(las mercancías necesarias no se encuentran a bordo)"
"0x238c039b" = "Organizador de fiestas"
"0x239bed4a" = "No puedes incorporar más de 10 barcos a tu convoy"
"0x23a8f980" = "Cargar / Guardar"
"0x23f0ed65" = "Estamos en guerra con @n$HostileNation$. Hace poco a uno de mis capitanes se le ocurrió una manera más ingeniosa de desmoralizar a @n$HostileNation$. Sugirió armar un convoy militar que incluyera los barcos de nuestro enemigo, con el objeto de darles a probar su propia medicina, por así decir.<n>Precisamente tú pareces el hombre que podría procurarnos estos barcos."
"0x23f0ed66" = "Una vez más ha estallado la guerra con @n$HostileNation$. Para hacer frente a lo que esto implica, quiero armar un nuevo convoy para proteger mi ciudad y no tengo el menor deseo de esperar hasta que me asignen un nuevo convoy militar desde Europa.<n>Por desgracia, actualmente mis recursos son muy limitados, por lo que se me ocurrió la idea de obtener los barcos de la misma fuente de nuestros problemas: Utilizaré los barcos de nuestro enemigo. ¿Quieres ayudarme a capturar varios navíos de la clase @S$ShipType$?"
