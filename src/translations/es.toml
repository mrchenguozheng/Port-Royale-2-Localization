"0x15ba13dc" = " @s$USER$, he oído que estás interesado en mapas del tesoro. No importa el cómo, pero estoy en posesión de un trozo que casa con el de un mapa que posees. Te lo daré por @g$Price$."
"0x15ba13dd" = "Buenas, @s$USER$. He oído que tienes en tu poder un mapa del tesoro incompleto, ¿No es así? Me gustaría ofrecerte otro trozo que pertenece a tu mapa. Solo pido @g$Price$ por él."
