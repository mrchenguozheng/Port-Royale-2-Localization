"0x1ca41002" = "Campaña completada"
"0x1ca50773" = "¡Buen trabajo! Ahora tienes un convoy impresionante.<n><n>Tu próxima tarea es todo un reto: Atacarás y derrotarás a un convoy militar inglés. El gobernador de [town:Turk Islands] te ha facilitado otro barco de refuerzo. Localízalo en el puerto de [town:Turk Islands] e incorpóralo a tu convoy.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destruir un convoy militar inglés."
"0x1ce621bb" = "Viviendas de un comerciante local"
"0x1ce62aab" = "Misiones en curso"
"0x1ce81e5e" = "Tipo de juego"
"0x1cf07333" = "Bien hecho, has alcanzado tu primer objetivo en @I$Days$ días. Tu siguiente objetivo consiste en incrementar el número de ciudadanos que viven en la ciudad. Para hacerlo, establece cinco negocios, uno de cada tipo permitido en la ciudad.<n><n>Recuerda que sólo hay un pequeño número de comerciantes que visitan [town:Tortuga] y que debes asegurarte personalmente de que la ciudad tenga suficientes reservas, para que su situación económica sea suficientemente buena como para poder acoger nuevos colonos. También tendrás que garantizar el alojamiento para todos los ciudadanos.<n><n>Tienes 60 días para alcanzar este objetivo. Cuanto antes lo alcances, mejor.<n><n>Recuerda que los soldados forman parte de la población de una ciudad, pero no cuentan como ciudadanos. Sólo puedes incrementar el número de ciudadanos de una ciudad creando puestos de trabajo.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Establece cinco negocios distintos en [town:Tortuga] y aumenta el número de habitantes hasta 1.500 antes del @D$EndDate$. ¡No te olvides del alojamiento! Hace falta una zona residencial para cada negocio."
"0x1d01f111" = "Efectos"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Un capitán con larga experiencia debió estar al mando del barco que aquí se hundió. El cofre no contiene oro, pero en su interior encuentras el diario que el capitán @L$RandLName$ redactó con sumo celo. Gracias a ello, la experiencia del capitán del convoy @C$Convoy$ aumenta dos puntos."
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>El cofre del tesoro está vacío, pero ha servido de boya para una cuerda. No muy por debajo de la superficie descubres un escondrijo con cañones. Tu tripulación subirá a bordo tantos cañones como pueda"
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Hay muchos barriles de ron flotando alrededor en las aguas. Tus hombres recogen todos los que puedan llevarse en tu convoy."
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Tu convoy ha encontrado un gran cofre de madera. Inmediatamente es izado a bordo y abierto por tus hombres. Al fin un tesoro de verdad, piensa el capitán mientras echa un vistazo a @g$Gold$."
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Flotando en el agua hay un cofre viejo, de madera casi totalmente podrida. Quizá un día tuvo algo dentro, pero ahora no queda más que un pestilente hedor. Aun así, se eleva la moral de tu tripulación porque finalmente ha concluido la búsqueda del tesoro."
"0x1d19d29c" = "Nuevo permiso de construcción en %1"
"0x1d6d7bd9" = "en cuanto al puerto, cuenta con grandes defensas."
"0x1db06b05" = "El paquete perdido"
"0x1db7f908" = "Lamentablemente no has tenido tiempo suficiente para conseguir @g$GoldGoal$.<n><n>Puedes intentarlo otra vez, pero no olvides vender las mercancías de tu almacén en [town:Tortuga] en las ciudades donde escaseen y busca mercancías que puedas comprar a buen precio.<n><n>También puedes conseguir un préstamo del tesorero de [town:Tortuga]."
