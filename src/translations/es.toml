"0xf7c59ef9" = "Tenemos un problema con los suministros en mi ciudad y hay escasez de @G$Goods$ para las manufacturas. Las existencias de los diversos negocios ya están muy bajas y nos arriesgamos a que se detenga la producción. ¿Podrías ayudarme?"
"0xf7c59efa" = "Hace poco vino a verme una representación de los patrones de manufactura locales. Se quejan de que no hay suficiente @G$Goods$ en la ciudad. Tuve que sufrir sus quejas durante tres horas; no sé si podría soportarlo de nuevo. ¿No podrías ayudarme a acabar con esta carestía?"
"0xf7c59efb" = "¡Maldita sea! Siempre la misma historia: Mi ciudad se ha vuelto a quedar sin @G$Goods$. A veces no logro entender el modo en que los comerciantes locales llevan sus negocios. Te estaría muy agradecido si pudieras ayudarme hasta que se solucione este asunto."
