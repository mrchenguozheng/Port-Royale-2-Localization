"0x2e39d24e" = "Veo que eres un hombre acaudalado, %1.<n><n>Normalmente te pediría un préstamo, pero desgraciadamente solo puedo hacer este tipo de negocios con comerciantes locales. Por lo tanto, debes poder presentar un permiso de construcción para mi ciudad."
"0x2e544e31" = "Sassenbach Advertising"
"0x2e6c240e" = "Almacén de un comerciante local"
"0x2e811b0e" = "<g:INTEXT_HOLLAND_800x600.screen>"
"0x2e9966b2" = "Selecciona otro barco…   %1"
"0x2ea2e114" = "Cronista"
"0x2eba542c" = "Ingresos"
"0x2ebaaed0" = "Mercado"
"0x2ec0079c" = "Ataque desde tierra"
"0x2ee7d67a" = "Virrey de %1"
"0x2ee8bb8c" = "We are in the governor town of Cartagena in the Southern Caribbean.<n>You can enter the various buildings in a town and perform various actions, more about this later on.<n>First, look at the top of the screen. You can see a range of buttons and displays.<n>Now click on the button with the clock, to the very left of the screen."
"0x2ee8bb8d" = "This is the Chronicle. It contains a record of all the events and occurrences in the Caribbean, rather like a daily newspaper.<n>There are some buttons to right of the Chronicle window. You can use these to display information about the Caribbean. However, this is not important for the moment.<n>Now close the Chronicle by clicking on the button marked \"X\"."
"0x2ee8bb8e" = "En la parte superior de la pantalla, junto a la fecha, está el botón del diario y, a su lado, tu efectivo.<n>El diario te mantiene al día de cualquier información sobre tus éxitos y posesiones. Además, todos los mensajes y misiones que recibes se guardan aquí.<n>Abre el diario. "
"0x2ee8bb8f" = "Como puedes ver, el diario muestra de inmediato todos los mensajes que has recibido hasta ahora. Por el momento, solo muestra las instrucciones de este escenario.<n>Hay más botones a la derecha de la ventana del diario. Haz clic en el tercer botón. "
"0x2ee8bb90" = "This displays the tasks and missions that you have received. At the moment, only the scenario objective is displayed.<n>Using the two buttons at the very top of the Mission window, you can switch between current and completed missions.<n>Now close the log. You can also do this simply by right-clicking."
"0x2ee8bb91" = "Later on in the game, you can accept numerous missions in order to achieve fame and fortune.<n>First, let's take a look at the town. As you can see from the display at the top center of your screen, we are in Cartagena. The town has roughly 2,000 inhabitants.<n>Click on the button showing the name of the town."
"0x2ee8bb92" = "Esto abre una ventana que muestra información sobre la ciudad.<n>Cartagena es una ciudad con gobernador y pertenece a España. También puedes ver el estatus de la ciudad y las mercancías que se pueden producir allí.<n>Ahora entra en un edificio. Para ello, cierra la información de la ciudad."
"0x2ee8bb93" = "Puedes usar las teclas de flecha del teclado para moverte por la vista de la ciudad. Ahora echa un vistazo al centro de la ciudad, dentro de las murallas. Contiene edificios como los muelles, la iglesia y el palacio del gobernador.<n>Haz clic una vez en cualquiera de estos edificios."
"0x2ee8bb94" = "La visualización en la parte inferior central de la pantalla cambia cuando haces clic en un edificio. Según el tipo de edificio, recibirás información o podrás hacer ciertas cosas.<n>Hay botones a la derecha de la visualización del edificio. Para salir del edificio, haz clic en el botón marcado \"X\"."
"0x2ee8bb95" = "The buildings in which you can perform various actions are always located within the town walls. Your warehouse is an exception, and there will be more about this in the next scenario.<n>Now leave the building and use the arrow keys to display the harbor and the convoy named “Santa Maria”. Click on it."
"0x2ee8bbfd" = "Como puedes ver, ahora aparece información sobre tu convoy en la parte inferior central de la pantalla.<n>El convoy ya ha cargado mercancías: 10 barriles de trigo y 15 barriles de maíz.<n>Hay varios botones a la derecha de la visualización del convoy. Haz clic en el segundo botón (el que tiene el icono de un barco)."
"0x2ee8bbfe" = "Esto muestra el número de barcos del convoy. Un convoy puede tener hasta 10 barcos dirigidos por un capitán.<n>Ahora enviemos el convoy a otra ciudad.<n>Haz clic en el botón con la flecha en la parte superior derecha de la pantalla para salir de la ciudad y mostrar la carta náutica."
"0x2ee8bbff" = "The sea chart now appears. In the center of the screen, you will see the town of Cartagena.<n>You can use the arrow buttons to shift the area of the map that is displayed and view the entire game world.<n>Now look for the town of Port Royale on an island to the north and right-click on the town with your convoy selected."
"0x2ee8bc00" = "Se traza una ruta y tu convoy parte.<n>Al hacer clic derecho en Port Royale, lo has seleccionado como destino de tu convoy.<n>Si el convoy tarda demasiado en llegar a la ciudad, puedes simplemente avanzar el juego rápidamente pulsando la barra espaciadora (ajuste predeterminado). "
"0x2ef566b4" = "Teclado"
"0x2ef8f665" = "Welcome to %1,<n><n>I'd like to give you some words of advice to enable you to find your way in the region around %2 more quickly, so you can assist my nation in expanding this and other towns.<n>I'm sure you are already familiar with the basic information about governor towns: They need a constant supply of colonial goods for export to Europe. At the same time, these towns usually offer an assortment of luxury goods, which can be sold for a handsome profit to other towns.<n>Just one more thing: You might be interested to know that governors assign missions from time to time. However, you cannot accept missions until you have reached the rank of Ship's Boy.<n><n>%3 %4, Governor of %5"
"0x2efebfdd" = "Como tu convoy ha llegado a Port Royale, ahora puedes entrar en la ciudad. Solo tienes que hacer clic en el símbolo de la ciudad (con las casitas)."
"0x2efebfde" = "Ahora vuelves a ver la conocida vista de la ciudad, pero esta vez es Port Royale. Puedes moverte por cualquier ciudad en la que tengas convoyes o edificios.<n>Busca el astillero en el puerto y haz clic en él, porque queremos comprar un barco nuevo."
"0x2efebfdf" = "The shipyard is now displayed in the selection window where the convoy was just displayed.<n>Have a look around the shipyard by clicking on the buttons to the right of the shipyard display.<n>Then return to the display \"Buy Ship\" and have a look at the ships that are available.<n>Buy any ship you want."
"0x2efebfe0" = "¡Enhorabuena! Has comprado tu primer barco.<n>El barco se entregará al puerto de la ciudad.<n>Ahora sal del astillero y haz clic en las aguas del puerto. La ventana de selección muestra ahora los barcos individuales del puerto.<n>Haz clic en tu nuevo barco."
"0x2efebfe1" = "Esto muestra los datos del barco, que ya viste en el astillero.<n>Antes de poder hacer algo con un barco individual, debes añadirlo a un convoy.<n>Para ello, selecciona de nuevo tu convoy."
"0x2efebfe2" = "Ahora quieres indicar a tu convoy que interactúe con el puerto.<n>Haz clic derecho en el puerto.  "
"0x2efebfe3" = "Se abre una ventana de transferencia, en la que puedes añadir barcos individuales al convoy.<n>Para ello, haz clic en el barco suelto a la izquierda y arrástralo hasta el convoy, de modo que el convoy quede formado por dos barcos.<n>Luego cierra de nuevo la ventana de transferencia con el botón \"X\" de la derecha."
"0x2efebfe4" = "También puedes formar otro convoy con un barco nuevo contratando a un nuevo capitán en la posada.<n>Sin embargo, no puedes hacerlo en este momento porque tu rango no es lo bastante alto.<n>Ahora selecciona la lista de barcos del convoy. Es el segundo botón."
"0x2efebfe5" = "You now have a convoy with two ships in the harbor of Port Royale.<n>You can click on the ships in the convoy’s ships list to find out details about the ships.<n>Now send the convoy back to your home town of Cartagena. To do this, go to the sea chart by clicking on the button with the arrow in the extreme top-right of your screen. "
"0x2efebfe6" = "Ahora busca la ciudad de Cartagena, al sur, y envía tu convoy allí haciendo clic derecho sobre la ciudad.<n>Este escenario terminará en cuanto el convoy llegue a la ciudad."
"0x2f0127e1" = "Pasas un día muy agradable con %1 y le cuentas tus aventuras."
"0x2f0127e2" = "Pasas una tarde muy agradable con %1 y te olvidas por un tiempo de tus asuntos comerciales."
"0x2f0127e3" = "Pasas la velada con %1 y deseas que vuestro tiempo juntos no termine nunca."
