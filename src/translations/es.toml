"0xfda277f4" = "No hay suelo disponible en %1 para construir un almacén. Si a pesar de todo quieres tomar posiciones en esta ciudad, puedes intentar convencer a uno de los comerciantes locales para que derribe uno de sus negocios.<n><n>Los negocios se derriban cuando el precio de las mercancías que se producen en la ciudad se mantiene bajo durante un largo período de tiempo; es decir, cuando hay superávit de la mercancía. Para conseguirlo, debes empezar por acaparar el producto. A continuación, vende una cantidad suficiente del producto en el mercado de la ciudad para que el precio baje.<n><n>Las mercancías producidas se entregan en el mercado de la ciudad una vez al día. Si en ese momento el precio ya está en su mínimo, el negocio reducirá su número de trabajadores. Puedes comprobarlo pulsando sobre el negocio. Un negocio se derriba cuando se ha despedido a sus 30 trabajadores."
"0xfda5ded4" = "La ciudad está floreciendo gracias al descubrimiento de oro."
"0xfdaf6463" = "Una vez más debo agradecerte todo lo que has hecho por mi nación. Como recompensa, te daré el resto de tierras de tu ciudad %1. Ahora eres propietario de toda la comarca."
"0xfdb7f907" = "Una hoguera pone al descubierto la guarida del profesor, no lejos de la orilla. Tu capitán rema a tierra y se encuentra con un viejo. Cuando el viejo ve todo el vino, se frota las manos con júbilo."
"0xfdb7f908" = "No lejos de la costa, tu convoy descubre el pequeño campamento de un ermitaño. Tu capitán rema a tierra y se encuentra con un viejo que lleva un uniforme de capitán que tiene incluso más años que él. Ve los barriles de ron y se muestra encantado."
"0xfdb7f909" = "Después de unos minutos tu convoy descubre una guarida en tierra. El capitán rema a tierra y echa un vistazo alrededor. Finalmente encuentra al viejo maestro y explica qué es lo que le trae allí. El ermitaño acepta la comida."
