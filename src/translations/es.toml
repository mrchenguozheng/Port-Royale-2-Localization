"0xcf3f179d" = "El bienestar de @T$TargetTown$ me importa mucho, pero me temo que la economía de la ciudad lleva algún tiempo en dificultades. El problema es siempre el mismo: los comerciantes dejan de visitar la ciudad porque la demanda es demasiado baja y las mercancías que produce no se recogen. Eso hace que la ciudad resulte poco atractiva para nuevos colonos. ¿Me ayudarás a que la ciudad vuelva a ponerse en pie?"
