"0xd9720471" = "Saludos. ¿Tienes un barco que pueda llevarme a @T$TargetTown$? Necesito llegar allí urgentemente antes de @D$EndDate$. Te pagaré @g$Reward$ si me llevas a tiempo."
"0xd9720472" = " @A$USER$, me han dejado plantado aquí. Pero necesito llegar urgentemente a @T$TargetTown$. ¿Puedes llevarme? Te pagaré @g$Reward$."
