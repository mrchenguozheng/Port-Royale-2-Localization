"0xcac5b30b" = "Orar"
"0xcacc4fa8" = "Encuentra y destruye la flota del tesoro española. La última vez estuvo en @T$StartTown$; desde allí zarpó hacia @T$DestTown$."
"0xcb2b0709" = "¡Qué calamidad! ¿Ya has visitado hoy a @F$WifeName$? Puedes ahorrarte la molestia, porque se ha ido. Mira, encontré una especie de carta de despedida. Escribe que está harta de su vida aburrida y que se ha fugado con un aventurero. ¡Debes rescatar a mi amada hija!"
"0xcb2b070a" = "¡El desastre ha llegado y me parece que estás en el centro de todo! Mi hija ha sido secuestrada por piratas, pero alguien te ha dejado un mensaje con un mapa que muestra la ubicación de un lugar concreto. Me parece una trampa, pero ¿qué vamos a hacer? ¡Tienes que rescatar a mi hija!"
"0xcb2b070b" = "¡Ja! ¡Mi hija, y tu esposa, se ha fugado con uno de mis oficiales de la guardia de la ciudad! ¡Debí imaginarlo! Ahora ambos han desaparecido, llevándose uno de mis barcos. Debes devolverme a mi hija y hacerla entrar en razón. Curiosamente, encontré un mapa en el que está marcado un lugar en los aposentos de mi hija."
