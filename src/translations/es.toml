"0x2e351896" = "MBA Studios"
"0x2e39d24e" = "Veo que eres un hombre rico, %1.<n><n>En circunstancias normales te pediría un préstamo, pero lamentablemente sólo puedo hacer ese tipo de negocios con los comerciantes locales. Por lo tanto, tendrás que mostrarme un permiso de construcción para mi ciudad."
"0x2e544e31" = "Sassenbach Advertising"
"0x2e6c240e" = "Almacén de un comerciante local"
"0x2e811b0e" = "<g:INTEXT_HOLLAND_800x600.screen>"
"0x2e9966b2" = "Selecciona otro barco… %1"
"0x2ea2e114" = "Cronista"
"0x2eba542c" = "Ingresos"
"0x2ebaaed0" = "Mercado"
