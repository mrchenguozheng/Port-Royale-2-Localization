"0xfe5c7df0" = "Construye cinco negocios diferentes y edificios residenciales en [ref:Tortuga], y aumenta la población hasta 1.500 antes de @D$EndDate$."
"0xfe6a6de4" = "Empezaré los preparativos de inmediato. Entrega las mercancías a más tardar el %1."
