"0xe6393b08" = "Convoy en el mar"
"0xe6490f96" = "Corre el año 1676 en la ciudad del gobernador holandés de las [ref:Turk Islands]. Holanda posee siete ciudades, cinco de las cuales son coloniales, una es ciudad de gobernador y otra ciudad de virrey.<n><n>Inglaterra posee 14 ciudades y lleva mucho tiempo en guerra con Holanda, y lo seguirá estando durante muchos meses. Mientras dure esta guerra, debe tomar ciudades de la Corona inglesa en nombre de Holanda.<n><n>Pero antes de poder atacar ninguna ciudad inglesa, necesita más capital y más armas para su convoy. Su primer objetivo es derrotar tres convoyes comerciales ingleses y apresar sus barcos.<n><n>Primero, no obstante, debe obtener una patente de corso del gobernador holandés en las [ref:Turk Islands].<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visite al gobernador de las [ref:Turk Islands] y obtenga una patente de corso contra Inglaterra."
"0xe64f1385" = "¡Muy bien! Has destruido uno de los convoyes piratas de Barbanegra. Ahora ve al gobernador de @T$TOWN$ y cobra tu recompensa.<n><n>También tiene otra misión para que cumplas.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumple otra misión para el gobernador de @T$TOWN$."
"0xe65025c3" = "en 1 ciudad"
"0xe6510ae7" = "Debes aumentar los suministros de trigo, ladrillos, algodón, azúcar y tabaco hasta @a$Amount$ de cada uno antes de @D$EndDate$."
"0xe65524e7" = "Asegúrate de que tu ciudad tenga un suministro de @a$Amount$ de todas las mercancías."
"0xe674b971" = "Mapa del tesoro"
"0xe67d58b9" = "Se ha descubierto oro"
"0xe6851da5" = "En el último escenario aprendiste que tu rango depende de tus bienes totales. Tus bienes totales comprenden tu efectivo, así como tus edificios, barcos y mercancías. Puedes consultar tus bienes totales en cualquier momento en «Éxitos», dentro del registro.<n><n>También puedes consultar la barra azul que indica tu experiencia, que aparece siempre en la parte inferior de la pantalla, en la vista del convoy. Cuando la barra llega al borde derecho de la pantalla, asciendes al siguiente rango. Una vez alcanzado un rango, no puedes bajar de él.<n><n>Cuanto más alto sea tu rango, más convoyes podrás mandar y, por lo tanto, mayor será el número de ciudades en las que podrás establecer negocios más adelante. Cuando alcanzas cierto rango, tienes derecho a un número ilimitado de convoyes y permisos de construcción."
"0xe6d65f53" = "Habitantes"
"0xe6d9252d" = "%1, así que tú eres el %2 del que tanto me ha hablado mi padre. Yo soy %3. ¿No quieres acompañarme y contarme tus aventuras?"
"0xe6d9252e" = "Creo que ya he oído hablar de ti, %1. Soy %3, la hija del gobernador. Siempre quise conocer a un %2. Por favor, ¡cuéntame tus aventuras!"
"0xe6d9252f" = "¡Así que tú eres el famoso %1! Te había imaginado mucho más alto, por todas las historias que he oído sobre ti. Pero eso no te hace menos interesante. ¡Ven aquí y cuéntame tus aventuras! Mi padre, el gobernador, ya me ha hablado muchísimo de ti."
"0xe6d92530" = "%1,<n>me alegra tanto volver a verte. Cuéntame cómo has estado desde la última vez. ¿Me has traído algo?"
"0xe6d92531" = "%1,<n>qué gusto volver a verte. No he dejado de pensar en ti desde nuestro último encuentro. Entra rápido, tengo mucho que contarte."
"0xe6d92532" = "%1,<n>me alegra tanto que hayas venido a visitarme de nuevo. He contado tus aventuras a todas mis amigas. Pero ahora debes contarme más, porque las chicas ansían más información. Entra rápido."
"0xe6dea2e1" = "Sede del virrey %1 "
