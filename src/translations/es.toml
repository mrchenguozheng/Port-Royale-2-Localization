"0xd3ac63e7" = "¿Has oído hablar de Henry Avery? Posiblemente sea uno de los piratas con mejor final de la historia."
"0xd3ac63e8" = "¿Quieres conocer la historia real de Barbanegra?"
"0xd3ac63e9" = "Las plantaciones de caña de azúcar labraron muchas fortunas y fueron determinantes en configurar la población de muchas islas del Caribe. ¿Quieres que te hable de ello?"
"0xd3ac63ea" = "¿Conoces la terrible verdad sobre el tráfico de esclavos? Podría hablarte sobre el tema."
"0xd3ac63eb" = "¿Sabes que también hubo europeos trabajando en condiciones de esclavitud en el Caribe?"
"0xd3ac63ec" = "Cuando los ingleses trataron de gravar fuertemente el comercio con las Indias, lo que consiguieron fue dar alas al contrabando y plantar el germen de lo que serían los Estados Unidos de América…"
"0xd3ac63ed" = "El mar tiene más riesgos de los que aparenta; entre otros, terribles enfermedades que diezmaban a las tripulaciones. Podría contarte algo sobre ello."
"0xd3ac63ee" = "Muchos de los nuevos descubrimientos geográficos de las Indias deben su nombre a curiosas asociaciones. ¿Quieres oír algunos ejemplos?"
"0xd3ac63ef" = "Los virreyes eran hombres con gran poder en el Caribe, pero tenían fuertes restricciones a sus actos. Tal vez te interese que te lo cuente…"
"0xd3ac63f0" = "Del nuevo mundo se trajeron muchas cosas que cambiaron la vida en Europa, no sólo oro y riquezas. Si te apetece, podría hablarte de estos descubrimientos."
"0xd3ac6458" = "El nuevo mundo dio origen a gran cantidad de leyendas y relatos fantásticos, algunas de las cuales fueron difundidas por interés. ¿Quieres oír algunas anécdotas?"
"0xd3ac6459" = "Sir Walter Raleigh, el escritor y aventurero inglés, fue un hombre interesante pero extremadamente desafortunado… Podría contarte sus desventuras persiguiendo leyendas en el Nuevo Mundo."
"0xd3ac645a" = "La población indígena americana fue la gran perjudicada por la colonización del Nuevo Mundo. ¿Quieres saber por qué?"
"0xd3ac645b" = "Resulta un dato poco conocido el importante apoyo alemán a las primeras expediciones al nuevo mundo y sus primeras colonias en Venezuela…"
"0xd3ac645c" = "El gran volumen de riquezas que los españoles obtenían de las Américas les permitió ser el mayor imperio que el mundo había conocido, pero también aceleró el declive de este mismo imperio. ¿Quieres conocer las razones de esta aparente contradicción?"
"0xd3ac645d" = "¿Nunca te has preguntado por qué en Brasil se habla portugués cuando en el resto de América la lengua nacional es el español? Podría contarte el porqué..."
"0xd3ac645e" = "La piratería no es un fenómeno que naciese en el Caribe… De hecho los piratas llevan miles de años extendiendo el terror por los mares."
"0xd3ac645f" = "¿Alguna vez has oído hablar de “los siete mares”? ¡Si quieres, te podría explicar por qué este término es incorrecto!"
"0xd3ac6460" = "Una misteriosa leyenda rodea las islas de las Bermudas y al supuesto 'triángulo' del que son vértice. Se dice que decenas de barcos y personas han desaparecido en él."
"0xd3ac6461" = "Los ingleses labraron su poderío en el Caribe mediante la piratería, el mimo a su flota y en algunos casos, la suerte."
"0xd3ac64c9" = "El gran viaje del descubrimiento no fue la emocionante y aventurera excursión que podríamos pensar hoy en día. Estuvo a punto de acabar en motín en varias ocasiones y el mismo descubrimiento de América fue totalmente accidental."
"0xd3ac64ca" = "El nombre de América procede del apellido de una persona, lo cual resulta chocante pensando que esa persona no es Cristóbal Colón."
"0xd3ac64cb" = "La Española fue la primera colonia de importancia en el Caribe, aunque sus comienzos fueron muy duros. Al final, acabó en el olvido hasta que fue capturada por los franceses, que la dieron un nuevo auge. "
"0xd3ac64cc" = "El ron, la bebida pirata por excelencia, tiene muchas historias detrás de su comercio. Aparte de sus poco beneficiosos efectos sobre la salud, formaba parte de un mortal triángulo comercial."
"0xd3ac64cd" = "Déjame contarte un poco sobre Jamaica, la isla en la que se encuentra la ciudad de [town:Port Royale]."
"0xd3ac64ce" = "El hecho de que Cuba no fuese una de las posesiones más importantes del imperio español es probablemente la causa de que fuese el último pedazo de América en manos españolas."
"0xd3ac64cf" = "Muchas nuevas maravillas llegaron a Europa desde el Nuevo Mundo… Pero también ocurrió al revés y el intercambio cultural cambió fantásticamente al continente americano."
"0xd3ac64d0" = "El cacao y el producto por excelencia que de él se obtiene, el chocolate, eran grandes desconocidos en Europa que tardaron bastante tiempo en extender su popularidad por el Viejo Continente"
"0xd3ac64d1" = "La piratería, aun siendo fundamentalmente negocio masculino, conoció también terribles y legendarias figuras femeninas entre sus filas."
"0xd3ac64d2" = "¿Alguna vez has oído hablar del pirata galés Bartholomew Roberts? Ser el prototipo del 'pirata refinado' no le impidió ser sanguinario, asaltar más de 400 barcos y acabar su vida a sangre y fuego. "
"0xd3ac653a" = "Henry Morgan fue un exitoso corsario que causó estragos en las colonias españolas. Sin embargo, acabó su vida como gobernador y no dudó en castigar con dureza a sus antiguos colegas de profesión."
"0xd3ac653b" = "Las Bahamas fueron en su día territorio amigable para los piratas y corsarios, que campaban a sus anchas en ellas."
"0xd3ac653c" = "Las colonias españolas tenían un rígido sistema social que dejaba muy poca opción al cambio o a la mejora personal. En la cúspide del mismo, los españoles venidos de Europa miraban con superioridad a sus propios hijos nacidos en América (los criollos) y mucho más a los mestizos y nativos."
"0xd3c78e1d" = "Sería un placer poder encomendarte la misión de tomar una ciudad de %1, pero, lamentablemente, %1 todavía tiene muchos convoyes militares y su posición no es lo bastante débil.<n><n> En cualquier caso, tampoco dispongo de suficientes convoyes militares para proteger nuevas áreas conquistadas.<n><n>¿Podrías proporcionarme alguno? "
"0xd3c78e1e" = "Sería un placer poder encomendarte la misión de capturar una ciudad de %1, pero, lamentablemente, no dispongo de suficientes convoyes militares para proteger nuevas áreas conquistadas.<n><n>¿Podrías proporcionarme alguno?   "
"0xd3c78e1f" = "No estamos en guerra con ninguna otra nación, pero no estaría mal que como precaución incrementásemos nuestra fuerza militar con nuevos convoyes. <n><n>Tal vez tú podrías proporcionarnos alguno.  "
