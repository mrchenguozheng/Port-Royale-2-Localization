"0x35f48f74" = "La ciudad que buscas es un lugar desolado, apartado de todo el mundo, como abandonado o caído en desgracia."
"0x35f48f75" = "La ciudad que buscas es un lugar desolado, apartado de todo el mundo, como abandonado o caído en desgracia."
"0x35f48fdd" = "Una ciudad solitaria está al oeste del cabo. "
"0x35f48fde" = "Una ciudad solitaria está al oeste del cabo."
"0x35f48fdf" = "Deberías viajar aquí si quieres hornear pan de maíz dulce coloreado con fruta en el horno de barro."
"0x35f48fe0" = "Deberías viajar aquí si quieres hornear pan de maíz dulce coloreado con fruta en el horno de barro."
"0x35f48fe1" = "Deberías viajar aquí si quieres hornear pan de maíz dulce coloreado con fruta en el horno de barro."
"0x35f48fe2" = "Deberías viajar aquí si quieres hornear pan de maíz dulce coloreado con fruta en el horno de barro."
"0x35f48fe3" = "Esta es la ciudad más occidental de la región."
"0x35f48fe4" = "Hubo antaño aquí otra gente que vivió, y en sus grandes templos a los dioses alabó. Sobre ello está la X, arriba en un rincón. Navegarás hacia el sureste en vano, te advierto."
"0x35f48fe5" = "Hubo antaño aquí otra gente que vivió, y en sus grandes templos a los dioses alabó. Sobre ello está la X, arriba en un rincón. Navegarás hacia el suroeste en vano, te advierto."
"0x35f48fe6" = "La distancia de X a Nombre no es grande; tienes mucho ron y puedes disfrutar de un cigarro."
"0x35f4904e" = "Si al borde de los acantilados del norte te tambaleas, entonces en X muy pronto te sentirás sin duda mucho mejor."
"0x35f4904f" = "Tres pequeñas islas rodean esta zona, pero solo en una se encuentran cuerdas."
"0x35f49050" = "La X está en la isla, que es realmente pequeña. Pero mira hacia el sureste: no hay ninguna más grande."
"0x35f49051" = "Aquí, en la cadena de islas, verás una brecha. Al oeste hay islas y al sur también. Al norte no hay nada, solo agua y humo."
"0x35f49052" = "En una gran bahía hay varias ciudades, en total tres. X se refiere a la más occidental de ellas."
"0x35f49053" = "En una gran bahía hay varias ciudades, en total tres. X se refiere a la más meridional de ellas."
"0x35f49054" = "Una bahía contiene dos islas, una grande y otra pequeña. La ciudad de la más grande debe caer bajo X."
"0x35f49055" = "Una isla lejana, pequeña y remota. No hay ningún otro lugar que X pueda señalar."
"0x35f49056" = "X es una ciudad con calles pavimentadas de oro. Su majestuoso puerto es digno de contemplar."
"0x35f49057" = "Cuatro ciudades se alzan alrededor de un volcán. La ciudad del sureste es la que buscas."
"0x35f490bf" = "La X está en la isla, que es realmente pequeña. Pero mira hacia el sureste: no hay ninguna más grande."
"0x35f490c0" = "Sobre sus arenas, el mar alberga ciudades de las que a nadie le importa. Pero una de ellas en particular siempre ha producido mercancías selectas."
"0x35f490c1" = "En una gran bahía hay varias ciudades, en total tres. X se refiere a la más occidental de ellas."
"0x35f490c2" = "En una gran bahía hay varias ciudades, en total tres. X se refiere a la más occidental de ellas."
"0x35f490c3" = "Aquí yace una isla, como en una cuna. Una península del norte se curva en ángulo a su alrededor."
"0x35f490c4" = "Aquí yace una isla, como en una cuna. Una península del norte se curva en ángulo a su alrededor."
"0x35f490c5" = "Blanca orilla junto a la selva, un riachuelo que nadie conoce. Aquí yaces bien oculta, en una bahía que solo ve el sol."
"0x35f490c6" = "Aquí está la ciudad, con vistas al estrecho. Protege la bahía, pues abunda en barcos."
"0x35f490c7" = "No lejos de la ciudad, al pie de un acantilado, yacen los maltrechos restos de un viejo barco naufragado."
"0x35f490c8" = "España estableció aquí un puerto en su día. Encontrarás madera y ladrillos, pero no hay trigo."
"0x35f49130" = "En una gran bahía hay varias ciudades, en total tres. X se refiere a la más occidental de ellas."
"0x35f49131" = "En una gran bahía hay varias ciudades, en total tres. X se refiere a la más oriental de ellas."
"0x35f49132" = "Aquí yace una isla, como en una cuna. La tierra del norte se curva en ángulo a su alrededor."
"0x35f49133" = "Aquí yace una isla, como en una cuna. La tierra del norte se curva en ángulo a su alrededor."
"0x35f49134" = "Vienes del oeste y cruzas el puente. La ciudad con la X está solo un poco más adelante."
"0x35f49135" = "Oh, qué lugar maravilloso. Enclavado en una bahía. Protegido por acantilados imponentes, este es X, lo digo yo!"
"0x35f49136" = "No lejos de la ciudad, al pie de un acantilado, yacen los maltrechos restos de un viejo barco naufragado."
"0x35f49137" = "Poderoso río que fluye muy profundo, hacia el este y hacia el pantano. Desde allí al sureste, a veces por tierra. Hasta la ciudad de la X, en el borde, al final."
