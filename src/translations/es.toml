"0x00bff5f3" = "Ahora tienes permiso de construcción para [ref:Cartagena] y puedes establecer negocios allí. Tu siguiente objetivo es construir dos telares en [ref:Cartagena]. Un telar es un negocio que produce mercancías acabadas y requiere algodón como materia prima.<n><n>Siempre debes tener en tu almacén una reserva de materias primas, o el negocio no podrá producir ninguna mercancía. Sin embargo, los costes seguirán siendo altos, porque tienes que pagar los gastos de mantenimiento de cada negocio y pagar a tus trabajadores.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construye dos telares en la ciudad de [ref:Cartagena] y produce @a$AmountGoal$ de tela."
