"0xfb343dde" = "Mientras estás saqueando la ciudad, una joven se te acerca corriendo.<n>\"¡Veo la mano de mi padre detrás de este ataque! ¿Te contó que estoy aquí por mi propia voluntad y que estoy verdaderamente enamorada de mi secuestrador? ¡Te ruego que no me lleves de vuelta, te recompensaré!\".<n><n>¿Quieres abandonar a la hija a su destino aquí en @T$TargetTown$?"
"0xfb343ddf" = "La hija del gobernador te da las gracias y te entrega un mapa que muestra la localización de un escondite en el que encontrarás @a$Amount$ barriles con mercancías."
"0xfb3648b2" = "Ruta activada"
