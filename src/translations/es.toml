"0x084340c7" = "Este desafiante escenario gira en torno al comercio, la producción y el abastecimiento de mercancías en una ciudad.<n:25>En [ref:Tortuga] están ocurriendo cosas extrañas: apenas hay comerciantes que quieran visitar la ciudad y varios acontecimientos les complican la vida a sus ciudadanos. Tu tarea es salvar la ciudad de la ruina. Al final del escenario se mostrará tu puntuación. Depende de tu rapidez y de tu riqueza al final del escenario.<n:25>En este escenario puedes usar todas las opciones del modo de juego libre, pero también tendrás objetivos específicos que cumplir."
