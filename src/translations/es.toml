"0x165603c3" = "%1,<n>me iba ahora mismo de visita. Aquí me aburro tanto... Pero bueno, ahora que estás aquí, ven, tengo algo que contarte."
"0x165603c4" = "%1,<n>Has aparecido... Empezaba a preguntarme donde has estado todo este tiempo. Tengo algo que contarte."
"0x1659b12c" = "Ya tienes dinero suficiente como para incrementar la potencia de ataque de tu convoy. Busca en los astilleros de las ciudades con gobernador el barco más potente que puedas permitirte.<n><n>Después, incorpora este barco a tu convoy y embarca más cañones y marineros. Comercia un poco más si aún no tienes dinero suficiente.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Incrementa la potencia de ataque de tu convoy a un mínimo de 90 cañones."
