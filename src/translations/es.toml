"0xd07dbe34" = "Los factores más importantes que influyen en la calidad de vida de una ciudad son el suministro y la variedad de mercancías disponibles. Sin embargo, no tienes que garantizar el suministro de todo tipo de mercancías para mantener felices a los habitantes.<n><n>Las mercancías de una ciudad se pueden dividir en cinco grupos: mercancías esenciales, materias primas, mercancías acabadas, mercancías coloniales y mercancías de importación. Aparecen en ese mismo orden en la ventana de comercio. Un suministro suficiente de dos o tres mercancías de cada grupo garantizará una buena calidad de vida en tu ciudad. <n><n>Acabas de recibir un mensaje sobre la calidad de vida en las ciudades. Puedes consultarlo en el registro.<n><n>Como tu ciudad aún es pequeña, es especialmente fácil lograr una buena calidad de vida, porque los ciudadanos de las ciudades pequeñas no son demasiado exigentes. Eso significa que no deberías tener problemas para lograr tu objetivo. Sin embargo, una ciudad con menos de 2.000 habitantes no puede superar el estatus «Auge».<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Asegúrate de que tu ciudad tenga un suministro de cinco barriles de cada mercancía."
