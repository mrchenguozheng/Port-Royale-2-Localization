"0x11e79f57" = "Campaña de aprendizaje<n><n>En [town:Port Royale] 2 tu objetivo consiste en alcanzar fama y fortuna; comenzando como un humilde comerciante, pronto alcanzarás una posición influyente y poderosa como hombre de negocios. Para conseguirlo podrás dedicarte al transporte y comercio de mercancías, la creación de negocios, participar en la política o dedicarte al combate naval y la piratería.<n:25>En esta campaña de aprendizaje se te mostrará como empezar a jugar cumpliendo los diversos objetivos que se plantearán."
