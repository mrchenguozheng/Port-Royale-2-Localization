"0x34242510" = "Octubre"
"0x3426834a" = "Mantén a un pirata a tu servicio que disponga de más de 20 barcos y que te haya entregado al menos @g$PirateGold$ del botín.<n>No obstante, para completar esta misión primero debes cumplir todas las demás tareas."
"0x3427201a" = "Cañones"
