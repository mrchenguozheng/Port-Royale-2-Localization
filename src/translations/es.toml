"0xccfee7c3" = "%1<n>huido"
"0xcd01da76" = "Empiezas el juego con el rango de marinero en la ciudad con gobernador española de @T$TOWN$, donde ya tienes un almacén. También tienes en el puerto un convoy con dos barcos armados pero sin marineros.<n><n>El primer objetivo de este escenario es visitar al gobernador de @T$TOWN$ y aceptar su misión. Tiene problemas con el famoso pirata Edward Teach, más conocido como Barbanegra, y quiere que le ayudes.<n><n>Importante: En este escenario las naciones están en paz. Esto significa que nunca debes atacar un convoy perteneciente a una nación.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visita al gobernador de @T$TOWN$ y acepta la misión que te asigne."
