"0xca4930db" = "Saludos, @A$USER$. Tengo un problema: Debo entregar un gran envío de @G$Goods$ en @T$Town$, pero mi capitán me ha fallado en el último momento. Te propongo el siguiente plan: Tú me pagas un depósito de @g$PriceBuy$, transportas @a$Amount$ barriles a @T$Town$ y allí recibirás @g$PriceSell$ a cambio. ¿Qué me contestas?"
"0xca4930dc" = "Me alegro de verte, @A$USER$. Me han dicho que dispones de una importante flota comercial, ¿Verdad? Precisamente tengo que enviar @A$Amount$ barriles de @G$Goods$.<n>¿Qué te parece si me pagas un depósito de @g$PriceBuy$ y llevas los productos a @T$Town$? Allí podrás vender los productos por @g$PriceSell$."
"0xca4930dd" = "Estoy en una situación un tanto complicada. Tengo hasta el @D$EndDate$ para entregar @a$Amount$ de @G$Goods$ en @T$Town$, pero mi convoy ya está en camino con otra entrega de productos. Te haré la siguiente oferta: págame un depósito de @g$PriceBuy$ y entrega tú los productos. A cambio recibirás entonces @g$PriceSell$. ¿Qué dices a esto?"
"0xca6a6869" = "Guardar"
"0xca6f7275" = "Hemos conseguido descubrir la guarida del pirata %1. %2, ¿Te gustaría atacar la guarida y acabar con esa chusma de una vez para siempre devolviendo así la paz a nuestros mares?"
"0xca6f7276" = "¿Sabías que finalmente hemos descubierto el lugar donde se esconde el pirata %1? %2 %3 anda buscando un gran héroe dispuesto a acabar con él. ¿Qué te parece?"
"0xca6f7277" = "Hemos descubierto la base de operaciones del famoso pirata %1. %2 deberíamos acabar con esa canalla de inmediato, y creo que tú serías la persona adecuada para hacerlo."
"0xca6f7278" = "Gozas de muy buena reputación en mi país. Sin embargo, sé cómo podrías mejorar aún más tu reputación.<n><n>Hace poco descubrimos la guarida del pirata %1. %2<n><n>¿Quién sabe? Tú podrías ser la persona que finalmente nos libere del azote de semejante calaña. "
"0xcab1988a" = "%1 ataca"
"0xcac5b30b" = "Orar"
"0xcacc4fa8" = "Encuentra y destruye a la flota del Tesoro Español. La última vez estaba en @T$StartTown$, desde allí zarpó hacia @T$DestTown$."
"0xcb2b0709" = "¡Qué desastre! ¿Aún no has visitado hoy a @F$WifeName$? Pues puedes ahorrarte las molestias, porque se ha ido. Mira, encontré esta especie de carta de despedida. Dice que está harta de su aburrida vida y que se ha fugado con un aventurero. ¡Tienes que rescatar a mi amada hija!"
"0xcb2b070a" = "Se ha producido una catástrofe, y me parece que tú estás metido de lleno. Mi hija ha sido secuestrada por unos piratas, pero alguien te ha dejado un mensaje con un mapa que muestra la localización de un punto en particular. A mí me parece una trampa, ¿pero qué podemos hacer? ¡Tienes que rescatar a mi hija!"
"0xcb2b070b" = "¡Ultraje! ¡Mi hija, tu mujer, se ha fugado con uno de mis oficiales de la guardia de la torre! ¡Debí habérmelo imaginado! ¡Ahora han desaparecido los dos, tras robarme uno de mis barcos! ¡Debes devolverme a mi hija y hacerla entrar en razón! Sospecho que sólo se trata de una llamada de atención, porque en los aposentos de mi hija encontré un mapa en el que está marcado un lugar."
"0xcb3b9785" = "Nuevo nombre"
"0xcb3c204b" = "Un nuevo permiso de construcción"
"0xcb4ef185" = "Asalto"
"0xcb6604a0" = "hundido"
"0xcb674ff0" = "Te doy las gracias en nombre de mi nación. Ahora procederemos a preparar el convoy y reunir a la tripulación. Estará listo para zarpar en 15 días.<n><n>Si quieres entregar otro convoy, tendrás que esperar hasta entonces."
"0xcb6c23d8" = "Comprar"
"0xcb6f7f0c" = "Entrega de herramientas"
"0xcb7ef0e8" = "Historial comercial al %1"
"0xcb853f07" = "Tu capitán ha derrotado al comandante en el duelo. Tus marineros se abren paso a la cámara del tesoro y escapan con %1.<n><n>Elige ahora los bienes que quieres saquear del almacén de la ciudad."
"0xcb8dbdae" = "mosqueteros enemigos"
"0xcb8dd6d9" = "Nuestro enemigo, @n$HostileNation$, no se detendrá ante nada. Han raptado a mi mujer y han fijado ciertas condiciones para su liberación. No obstante, sé dónde la mantienen secuestrada. Como podrás comprender, oficialmente tengo las manos atadas, pero tú podrías atacar la ciudad y traerla de vuelta."
"0xcb8dd6da" = "Me alegro de verte.<n>Hace poco mi mujer recibió un caniche bastante cursi de París. El condenado animal me saca de quicio, pero mi mujer está embelesada con el perro.<n>Alguien se enteró de ello, secuestró al perro y se lo entregó a nuestros enemigos para chantajearnos.<n><n>¿Podrías hacerme el favor de rescatar al caniche?"
"0xcb8dd6db" = "Hace un tiempo mi hija menor se fugó con un aventurero, según se dijo por entonces. Ahora he descubierto que está viviendo en @T$TargetTown$ y que va a casarse con el comandante de la ciudad. Conozco a mi hija y sé que nunca haría una cosa así por propia voluntad. No veo cómo podría sugerirle al virrey que atacara una ciudad para rescatar a mi hija... Pero, ¿Para qué están los amigos?"
"0xcb9b3a82" = "Se ha desatado una plaga de ratas"
