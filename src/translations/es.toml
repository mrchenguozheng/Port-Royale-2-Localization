"0x13cd046e" = "Siempre que tome ciudades enemigas para un virrey, este le concederá un terreno a cambio. En ese terreno puede construir una ciudad que será suya y en la que podrá levantar distintos edificios. En otras palabras, cualquier virrey puede ayudarle a convertirse en propietario de su propia ciudad. <n><n>Su siguiente objetivo es mejorar su reputación con España, porque un virrey solo lo recibirá si tiene buena reputación con su nación.<n><n>Puede consultar su reputación con una nación, por ejemplo, bajo el nombre de la ciudad en la vista de la ciudad. En [ref:Margarita], donde empieza el juego, se muestran tres banderas, lo que indica que su reputación con España es «neutral».<n><n>Puede mejorar su reputación con una nación cumpliendo misiones para sus gobernadores, cazando piratas o comerciando con sus ciudades y entregando las mercancías que necesitan.<n><n>Como España y Francia están en guerra, puede obtener del gobernador de [ref:Margarita] una patente de corso contra Francia. Con las patentes de corso puede mejorar su reputación rápidamente.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Mejore su reputación con España hasta «amistosa»."
