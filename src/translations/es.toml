"0x0ce1a79e" = "Estás en la ciudad colonial de Santa Marta. Haz clic en el nombre de la ciudad para mostrar su información."
"0x0ce1a79f" = "Las ciudades coloniales como Santa Marta pueden producir dos mercancías esenciales, dos materias primas y una mercancía colonial.<n>En el último escenario aprendiste que en las ciudades con gobernador hay una demanda especialmente alta de materias primas y mercancías coloniales.<n>Primero quieres producir la mercancía colonial cacao.<n>Ahora cierra la información de la ciudad."
"0x0ce1a7a0" = "Como las mercancías coloniales se envían a Europa desde las ciudades con gobernador, la demanda de cacao en estas ciudades es alta. Estas condiciones son buenas para tu primer negocio. Ahora localiza y haz clic en el edificio del maestro de obras, en el centro de la ciudad."
"0x0ce1a7a1" = "En casa del maestro de obras puedes solicitar permiso para construir un nuevo edificio o devolver tu permiso de construcción. Por supuesto, ahora no es eso lo que quieres hacer.<n>Mira los distintos edificios que puedes construir. También puedes usar los botones a la derecha de la ventana del maestro de obras.<n>Haz clic en el botón «Plantación de cacao»."
"0x0ce1a7a2" = "Ahora puedes ver cuántos materiales de construcción se necesitan y cuáles serán los costes de construcción.<n>También puedes ver cuántos materiales de construcción tienes actualmente en tu almacén y cuántos tendrás que comprar en la ciudad.<n>Por el momento tienes materiales suficientes.<n>Sitúa el cursor sobre un solar de construcción disponible y haz clic con el botón izquierdo."
"0x0ce1a7a3" = "Ahora se muestra el andamiaje de la instalación de producción de cacao y comienza la construcción.<n>La construcción tardará un par de días en completarse. Mientras tanto, deberías organizar el alojamiento de tus nuevos trabajadores.<n>Cierra el menú de construcción y busca una zona residencial en Santa Marta. "
"0x0ce1a7a4" = "Esta zona residencial pertenece a un comerciante de la ciudad. Puedes comprobar cuántas zonas residenciales poseen los comerciantes locales y cuántos inquilinos tienen. Quieres construir tu propia zona residencial. Para ello, abre el menú de construcción."
"0x0ce1a7a5" = "Selecciona una zona residencial en el menú de construcción y observa la indicación de los costes de construcción. <n>Puede que no tengas suficientes materiales de construcción en el almacén. Sin embargo, puedes comprar en la ciudad los materiales que necesites si hay suficiente suministro. <n>De lo contrario, tendrás que conseguirlos en otra ciudad.<n>Después construye una zona residencial."
"0x0ce1a7a6" = "Un negocio puede emplear a 30 trabajadores. Como la familia media de un trabajador tiene cuatro miembros, se necesitan viviendas para 120 personas por cada negocio que establezcas. <n>Una zona residencial tiene espacio para 120 inquilinos, así que se necesita una zona residencial por cada negocio.<n>Ahora cierra el menú de construcción y haz clic en tu nueva zona residencial."
"0x0ce1a7a7" = "Una zona residencial no tiene periodo de construcción, porque al principio los inquilinos viven en tiendas de campaña.<n>Con el tiempo, los propios inquilinos convierten la zona residencial en un edificio considerable.<n>El aspecto de una zona residencial depende de su antigüedad y del estatus de la ciudad.<n>Cierra el diálogo de la zona residencial."
"0x0ce1a80f" = "Como sabes, tu primer edificio en una ciudad siempre debe ser un almacén. No puedes construir ningún otro edificio hasta que lo hayas construido.<n>Ya tienes un almacén en la ciudad donde empezaste el juego. Encuéntralo y haz clic en él. Se muestra en azul claro en la pantalla."
"0x0ce1a810" = "En el almacén puedes ver qué edificios posees en la ciudad y cuánto cuesta mantenerlos.<n>También puedes ver cuánto alquiler te pagan los inquilinos y qué mercancías producen tus negocios.<n>Más adelante podrás dar instrucciones al almacenista.<n>Echa un vistazo al almacén y luego ciérralo."
"0x0cee08cc" = "la presencia militar en esta ciudad podría ser mejor"
"0x0cf75014" = "Cerrar"
"0x0cf7abef" = "Haz clic en tu plantación de cacao. La pantalla muestra siempre todas tus plantaciones de cacao de la ciudad.<n>Una vez construidas tus instalaciones de producción, necesitarás 30 trabajadores, es decir, 30 colonos. Ahora sal de la plantación, ve a los muelles del puerto y pulsa el botón «Carga» (el botón inferior de la derecha)."
"0x0cf7abf0" = "Aquí puedes ver si hay colonos esperando ser contratados en la ciudad o si la ciudad necesita nuevos trabajadores. Ese será el caso en cuanto se haya completado la construcción de tu negocio.<n>Ve a las ciudades con gobernador de los alrededores y trae colonos a Santa Marta hasta que tu negocio tenga la plantilla completa de trabajadores."
"0x0d0db040" = "Pincha en una de tus plantaciones de cacao."
"0x0d0db041" = "Ahora puedes ver cuánto cacao produce tu negocio cada día y cuántas herramientas requiere.<n>Ahora acumula un suministro de @a$SubGoal$ de herramientas en tu almacén, porque tu almacén abastece de mercancías a tus negocios."
"0x0d0db042" = "Las herramientas son mercancías de importación. Esto significa que encontrarás la mayor oferta y los precios más bajos en las ciudades con gobernador.<n>Podrías intentar conseguirlas en [ref:Cartagena], al suroeste, o muy al este, en [ref:Margarita] ."
"0x0d0db043" = "¡Bien hecho!<n>Cuanto menor sea el precio medio de las materias primas que necesitas, menores serán tus costes de producción de las mercancías que fabricas.<n>Ahora sigue produciendo cacao hasta tener un suministro de @a$AmountGoal$ en tu almacén."
"0x0d0f1795" = "Julio"
"0x0d0f1877" = "Junio"
"0x0d1098bd" = "%1,<n>eres nuevo por aquí, ¿verdad? Pero ya he oído hablar de ti, y tu buena fama te precede. Deberías visitarme de vez en cuando, pues siempre hay algún trabajo que hacer."
"0x0d23b491" = "Navega con tu convoy hasta la ciudad de [ref:Cartagena] y entra en la ciudad.<n>Debajo del nombre de la ciudad, a la derecha de la pantalla, se muestra un pequeño símbolo circular. Este indica tu historial comercial en [ref:Cartagena] hasta la fecha.<n>En este escenario las cosas te resultan un poco más fáciles porque has recibido una bonificación.<n>Ahora abre la información de la ciudad."
"0x0d23b492" = "En \"Historial comercial\" puedes comprobar ahora qué porcentaje de la puntuación requerida has alcanzado. Si aquí se muestra 100%, puedes solicitar un permiso al maestro de obras.<n>Cierra la información de la ciudad."
"0x0d23b493" = "Los precios de las mercancías escasas en una ciudad se muestran en rojo en la ventana de comercio. Si vendes esas mercancías, mejorarás tanto tu historial comercial en la ciudad como tu reputación ante la nación a la que pertenece.<n>Haz clic una vez en los muelles para ver información sobre las existencias de mercancías de la ciudad."
"0x0d23b494" = "Fíjate en qué mercancías escasean en la ciudad. Por ejemplo, la ciudad siempre necesitará azúcar y algodón porque produce ron y prendas de vestir.<n>Pero también hay otras mercancías escasas en la ciudad.<n>Ve a otras ciudades para comprar las mercancías que necesita [ref:Cartagena] y mejora tu historial comercial."
"0x0d23b495" = "No está mal. Has aumentado considerablemente tu perfil en [ref:Cartagena].<n>Pero ten cuidado de no acaparar mercancías escasas en [ref:Cartagena]. Puedes reconocer fácilmente las mercancías escasas porque sus existencias se muestran en rojo.<n>Aumenta tu puntuación de historial comercial hasta el 85%."
"0x0d23b496" = "¡Bien hecho! Ahora tienes una puntuación del 85% en [ref:Cartagena]. ¡Sigue así!<n>Aumenta tu puntuación hasta el 100%.<n>Por cierto, acabas de recibir un mensaje sobre \"ascensos y rangos\"."
"0x0d23b497" = "¡Excelente! Ya has comerciado lo suficiente con [ref:Cartagena].<n>Desgraciadamente, tu rango sigue siendo marinero raso y solo se te puede conceder un permiso.<n>Para ascender al siguiente rango, debes aumentar tu riqueza comerciando un poco más. "
"0x0d23b498" = "¡Muy bien! Como marinero, se te pueden conceder dos permisos de construcción.<n>Ve al maestro de obras de [ref:Cartagena] y solicita un permiso.<n>Si no tienes suficiente oro, debes comerciar un poco más. No olvides comerciar las mercancías que produces en Santa Marta."
"0x0d2a3b89" = "Mantenimiento de barcos"
"0x0d39b8e2" = "Primero debes construir un almacén en [ref:Cartagena] antes de poder construir cualquier otro edificio."
"0x0d39b8e3" = "Ahora establece dos telares y construye dos zonas residenciales.<n>Si no hay suficientes materiales de construcción en la ciudad, debes comprarlos en otra ciudad y entregarlos en tu almacén del puerto. <n>No olvides negociar un precio antes de desprenderte de tu preciado oro."
"0x0d39b8e4" = "Deberías asegurarte de tener un suministro de @a$SubGoal$ de algodón en el almacén cuando se hayan construido tus telares, para que los nuevos negocios puedan empezar a tejer tela a partir del algodón de inmediato."
"0x0d39b8e5" = "Tu siguiente objetivo es producir tu propio suministro de @a$SubGoal$ de tela para el almacén de [ref:Cartagena] y esperar a que se construyan tus telares.<n>Para @a$SubGoal$ de tela, necesitas exactamente @a$SubGoal$ de algodón."
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Militar<t>Tus barcos de escolta y comerciales<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Pirata<t>Tus barcos de escolta y comerciales<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "¡La partida guardada no es válida!"
"0x0d496e89" = "Haz clic en las mercancías para activar o cancelar la compra."
"0x0d496e8a" = "Compra automática por parte del encargado"
"0x0d4fbd33" = "¡Muy bien!<n>Para asegurarte de tener siempre suficientes materias primas para tus telares, ahora deberías establecer un negocio de algodón en Santa Marta.<n>Una instalación de producción puede abastecer de materias primas suficientes a dos instalaciones de fabricación."
"0x0d4fbd34" = "Ahora asegúrate de que tus negocios en Santa Marta y [ref:Cartagena] funcionen a pleno rendimiento.<n>No olvides que tus telares de [ref:Cartagena] necesitan un suministro constante de algodón.<n>Sigue comerciando y vendiendo las mercancías que produces.<n>Este escenario terminará en cuanto hayas aumentado tu efectivo hasta @g$GoldGoal$."
"0x0d552127" = "La ciudad no puede ser atacada."
"0x0d578089" = "Ya atacaste la ciudad de %1 en los últimos 30 días. El capitán se niega a volver a atacarla por motivos morales."
"0x0d58ea99" = "El bucanero %1 %2 ha captado ilegalmente a %3 trabajadores y sus familias. Muchos negocios de la ciudad ya no funcionan a plena capacidad."
"0x0d750c45" = "%1 convoyes"
"0x0d919a5a" = "%1,<n>sabes muy bien que en circunstancias normales te mandaría al infierno, pero en tiempos desesperados como estos, vendería mi alma al mismísimo diablo.<n><n>Así que pasa, tengo algo que decirte."
"0x0d9c1799" = "Tu tarea es conseguir que el estatus de la ciudad de @T$TargetTown$ caiga hasta «Recesión» antes del @D$EndDate$. Tienes dos opciones:<n><n>Atacar la ciudad y saquear todas las mercancías para provocar el estatus «Recuperación». Después, el estatus de la ciudad seguirá cayendo debido a la escasez de mercancías.<n><n>O bien cortar el suministro de mercancías a la ciudad interceptando convoyes comerciales. Nota: si solo saqueas un convoy y no lo capturas, tu reputación ante la nación en cuestión sufrirá mucho menos."
"0x0d9c179a" = "¡Bien! Te encargo la misión de hacer que la ciudad de @T$TargetTown$ caiga en un estado de «Recesión». Tienes hasta el @D$EndDate$.<n><n>Para lograr tu objetivo, debes interceptar a todos los comerciantes que visiten la ciudad, de modo que no reciba más mercancías y su estatus empiece a caer lentamente.<n><n>Sin embargo, hay una forma de conseguirlo más rápido. Consiste en atacar la ciudad y saquearla. Tu ataque hará que el estatus caiga rápidamente a «Recuperación» y la escasez de mercancías que se producirá en la ciudad lo hará caer aún más, hasta que la ciudad esté en «Recesión»."
"0x0daa656f" = "Metralla"
"0x0dbd9444" = "No hay nada que puedas hacer por mí."
"0x0dbd9445" = "Desgraciadamente, no tengo noticias para ti por ahora. Vuelve a intentarlo más tarde."
"0x0dbd9446" = "Me temo que no tengo misiones para ti. Vuelve a verme dentro de unos días."
