"0x350099bd" = "%1 días"
"0x350993a3" = "¡Gracias! No pensé que recuperaría mi barco; temía que esos borrachos acabasen destrozándolo contra unos bajíos. Lamentablemente, no estoy en condiciones de recompensarte con oro... Pero he ordenado que te entreguen un par de mercancías que sospecho te gustarán. Puedes recogerlas en el mercado de @T$Town$. "
"0x350e2781" = "Ciudad"
"0x35239275" = " Debemos aprovecharnos rápidamente de esta escasez. ¿Me ayudarás a hacerlo?"
