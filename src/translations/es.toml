"0xf9256ece" = "Costes de reparación"
"0xf9279095" = "Para una fiesta modesta, necesitas %1 de cada uno de los siguientes productos: trigo, fruta, carne, ron y vino."
"0xf9279096" = "Para una fiesta mediana, necesitas %1 de cada uno de los siguientes productos: trigo, fruta, carne, ron y vino."
