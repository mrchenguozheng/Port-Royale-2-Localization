"0xe6851da5" = "In the last scenario, you learned that your rank depends on your total assets. Your total assets comprise your cash as well as your buildings, ships and goods. You can check your total assets at any time under \"Successes\" in the log.<n><n>You can also check the blue bar indicating your experience, which is always at the bottom of the screen in the convoy display. When the bar reaches the right edge of the screen, you are promoted to the next rank. You cannot drop below a rank once you have reached it.<n><n>The higher your rank, the more convoys you can command and, therefore, the greater the number of towns in which you can establish businesses later. After you reach a certain rank, you are entitled to an unlimited number of convoys and building permits."
"0xe6d65f53" = "Habitantes"
"0xe6d9252d" = "%1, así que tú eres el %2 del que tanto me ha hablado mi padre. Yo soy %3. ¿No quieres acompañarme y contarme tus aventuras?"
"0xe6d9252e" = "Creo que ya he oído hablar de ti, %1. Soy %3, la hija del gobernador. Siempre quise conocer a un %2. Por favor, ¡cuéntame tus aventuras!"
"0xe6d9252f" = "¡Así que tú eres el famoso %1! Te había imaginado mucho más alto, por todas las historias que he oído sobre ti. Pero eso no te hace menos interesante. ¡Ven aquí y cuéntame tus aventuras! Mi padre, el gobernador, ya me ha hablado muchísimo de ti."
"0xe6d92530" = "%1,<n>me alegra tanto volver a verte. Cuéntame cómo has estado desde la última vez. ¿Me has traído algo?"
"0xe6d92531" = "%1,<n>qué gusto volver a verte. No he dejado de pensar en ti desde nuestro último encuentro. Entra rápido, tengo mucho que contarte."
"0xe6d92532" = "%1,<n>me alegra tanto que hayas venido a visitarme de nuevo. He contado tus aventuras a todas mis amigas. Pero ahora debes contarme más, porque las chicas ansían más información. Entra rápido."
