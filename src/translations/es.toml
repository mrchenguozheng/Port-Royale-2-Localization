"0x00cde503" = "<ts:20>Te has convertido en enemigo de una nación por primera vez. Aquí tienes algunos consejos útiles.<n>-<t>Solo te conviertes en enemigo si atacas los convoyes y las ciudades de una nación<n>-<t>Puedes sobornar a los gobernadores de las naciones para mejorar tu reputación. Sin embargo, tu reputación también mejora automáticamente un poco cada día, a medida que tus malas acciones caen lentamente en el olvido<n>-<t>No puedes atracar en el puerto de naciones enemigas<n>-<t>Si aun así navegas hacia una ciudad enemiga, debes fondear tu convoy en secreto: entonces puedes entrar en la ciudad, pero no puedes comerciar allí."
