"0xca19aeae" = "Tras el comerciante"
"0xca4930db" = "Saludos, @A$USER$. Debo entregar un gran cargamento de @G$Goods$ en @T$Town$, pero, desgraciadamente, mi capitán me ha fallado. Te propongo el siguiente plan: me pagas una fianza de @g$PriceBuy$, transportas @a$Amount$ a @T$Town$ y allí recibirás @g$PriceSell$ a cambio. ¿Qué dices?"
"0xca4930dc" = "Me alegra verte, @A$USER$. Tienes una gran flota comercial, ¿verdad? Es que tengo que enviar @A$Amount$ de @G$Goods$.<n>¿Qué tal si me pagas una fianza de @g$PriceBuy$ y llevas las mercancías a @T$Town$? Allí podrás venderlas por @g$PriceSell$."
"0xca4930dd" = "I'm in an awkward position. I have until @D$EndDate$ to deliver @a$Amount$ of @G$Goods$ to @T$Town$, but my convoy is already underway with another delivery of goods. I'll make you the following offer: Pay me a surety of @g$PriceBuy$ and deliver the goods. You will then receive @g$PriceSell$ in return. What do you say to that?"
"0xca6a6869" = "Guardar"
"0xca6f7275" = "Hemos conseguido descubrir el escondite pirata de %1.  %2 ¿Te gustaría atacar el escondite y destruir a esta banda de una vez por todas, devolviendo así cierta paz a nuestras aguas?"
"0xca6f7276" = "¿Has oído que por fin hemos descubierto dónde está el escondite del pirata %1? %2 %3 busca un héroe valiente para destruirlo. ¿Estás a la altura de la tarea?"
"0xca6f7277" = "La ubicación de la base desde la que opera el famoso pirata %1 ya no es un misterio. %2 Deberíamos destruir esta banda sin más demora. Creo que eres justo el hombre para este trabajo."
"0xca6f7278" = "Tienes una muy buena reputación con mi nación. Sin embargo, conozco una forma de mejorarla aún más.<n><n>El escondite del pirata %1 fue descubierto hace poco.  %2<n><n>Quizá seas tú quien finalmente nos libre a todos del azote de esta banda. "
"0xcab1988a" = "%1 ataca"
"0xcac5b30b" = "Orar"
"0xcacc4fa8" = "Encuentra y destruye la flota del tesoro española. La última vez estuvo en @T$StartTown$; desde allí zarpó hacia @T$DestTown$."
"0xcb2b0709" = "¡Qué calamidad! ¿Ya has visitado hoy a @F$WifeName$? Puedes ahorrarte la molestia, porque se ha ido. Mira, encontré una especie de carta de despedida. Escribe que está harta de su vida aburrida y que se ha fugado con un aventurero. ¡Debes rescatar a mi amada hija!"
"0xcb2b070a" = "¡El desastre ha llegado y me parece que estás en el centro de todo! Mi hija ha sido secuestrada por piratas, pero alguien te ha dejado un mensaje con un mapa que muestra la ubicación de un lugar concreto. Me parece una trampa, pero ¿qué vamos a hacer? ¡Tienes que rescatar a mi hija!"
"0xcb2b070b" = "Ha! My daughter, and your wife, has eloped with one of my officers of the town guard! I might have guessed! Now they are both missing, having stolen one of my ships! You must return my daughter to me and make her see reason! Strangely enough, I came across a map on which a place is marked in my daughter's apartments."
"0xcb3b9785" = "Nuevo nombre"
"0xcb3c204b" = "Un nuevo permiso de construcción"
"0xcb4ef185" = "Asalto"
"0xcb6604a0" = "hundido"
"0xcb674ff0" = "Te doy las gracias en nombre de mi nación. Ahora el convoy será puesto a punto y se reunirá la tripulación. Estará listo para zarpar en 15 días.<n><n>Si quieres entregar otro convoy, deberás esperar hasta entonces."
"0xcb6c23d8" = "Comprar"
"0xcb6f7f0c" = "Entrega de herramientas"
"0xcb7ef0e8" = "Historial comercial al %1"
"0xcb853f07" = "Tu capitán ha ganado su duelo con el comandante. Tus marineros se dirigen a la cámara del tesoro y se llevan %1.<n><n>Ahora elige qué mercancías quieres saquear del almacén de la ciudad."
"0xcb8dbdae" = "mosqueteros enemigos"
"0xcb8dd6d9" = "Nuestro enemigo, @n$HostileNation$, no se detendrá ante nada. Mi esposa ha sido secuestrada y se han puesto ciertas condiciones para su liberación. Sin embargo, sé dónde la tienen retenida. Oficialmente, no puedo hacer nada, ¿entiendes? Pero tú podrías atacar la ciudad y traérmela."
"0xcb8dd6da" = "I am glad to see you.<n>My wife recently received a groomed poodle from Paris. The wretched animal has driven me to distraction, but my wife is besotted with the dog.<n>Somebody learned of this, kidnapped the dog and handed it over to our enemies as a way of blackmailing us.<n><n>Can you rescue the poodle for me?"
"0xcb8dd6db" = "Some time ago, my youngest daughter ran off with some sort of passing adventurer, it was said at the time. I have now discovered that she is living in @T$TargetTown$ and that she is to marry the commander of the town. I know my daughter, she would never do such a thing of her own free will! I can hardly suggest to the viceroy that we have to attack a town to rescue my daughter? But how about you?"
