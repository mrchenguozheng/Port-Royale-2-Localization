"0x343cc312" = "Demasiada gente en el convoy"
"0x343e9f4b" = "¡Enhorabuena! Ahora ya estás familiarizado con los rudimentos básicos para construir una ciudad.<n><n>En cuanto esté construida, tu planta de producción empezará a contratar trabajadores. Cada colono que espera en el puerto para ser contratado puede convertirse en un trabajador y cuatro ciudadanos; es decir, que un colono en realidad representa a toda una familia de ciudadanos.<n><n>Asegúrate de que haya suficientes colonos disponibles para garantizar la mano de obra de tus negocios. Los convoyes de transporte llevan colonos desde Europa hasta las ciudades con gobernador, y después los comerciantes los llevan a otras ciudades<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Asegúrate de tener suficientes trabajadores para tu negocio de Santa Marta."
"0x344b915f" = "El mercader del gobernador"
"0x34669be1" = "[town:Tortuga] no ha alcanzado a tiempo una situación económica de \"bienestar\". Para acabar con éxito, ten en cuenta que cada mercancía influye sobre la situación económica de una ciudad. Si hay reservas suficientes de una mercancía para 10 días, la mercancía tendrá el mejor efecto posible sobre la calidad de vida de los ciudadanos y, con ello, sobre la situación económica de la ciudad. "
