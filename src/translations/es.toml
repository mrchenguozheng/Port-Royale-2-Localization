"0xf93abe1a" = "Mejora tu relación con España hasta que esta alcance el grado de \"amistosa\"."
"0xf93ea2aa" = "Una parcela"
"0xf9404c18" = "Puedo marcar en la carta de navegación la localización aproximada de su convoy. @l$ConvoyPos$ Tú decides si hundes o no este convoy. Sin embargo, debes cumplir esta misión antes del @D$EndDate$."
"0xf9404c19" = "Me temo que no puedo decirte dónde encontrar uno de los convoyes de Barbanegra, porque actualmente se encuentran en un lugar secreto. Sin embargo, te doy mucho tiempo para cumplir esta misión. Tienes hasta el @D$EndDate$ para destruir un convoy."
