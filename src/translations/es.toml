"0x35f49051" = "[riddle:answer=-north;group=35f49051;clue=norte;level=direction;certainty=certain;source=original-en]Aquí, en la cadena de islas, verás una brecha. Al oeste hay islas y al sur también. Al norte no hay nada, solo agua y humo."
