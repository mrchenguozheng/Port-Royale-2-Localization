"0x0a49c903" = "¡Enhorabuena! Has superado la segunda campaña. Has aprendido a sacar beneficios del comercio, has conseguido mayor rango y has organizado un segundo convoy contratando a un nuevo capitán.<n><n>Ten presente que cuanta más experiencia tenga un capitán, más caro resultará contratarlo. Normalmente al principio tienen poca experiencia, pero con el tiempo la van ganando gracias a la navegación, el comercio y el combate, dependiendo de cómo los emplees. En la \"Vista general\" del convoy puedes comprobar el nivel de experiencia de tus capitanes. Para hacerlo, pulsa sobre un convoy y después en el botón \"Vista general y Costes\".<n><n>En la siguiente campaña establecerás tus propios negocios y producirás mercancías para obtener aún más beneficios del comercio. "
