"0xed5e6449" = "Te doy las gracias por destruir el convoy pirata. Aquí tienes una recompensa de @g$GoldReward$. Si la suerte nos acompaña, pronto descubriremos la ubicación del escondite pirata. Entonces podremos destruirlo."
