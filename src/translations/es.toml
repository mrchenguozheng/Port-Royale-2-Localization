"0xc558e134" = "Para conseguir que el mayor número posible de comerciantes visite tu ciudad no tienes más que dejar tu ciudad sin abastecimiento de ciertas mercancías. Lo ideal es que elijas aquellas mercancías que se producen en las ciudades cercanas, porque los comerciantes a la hora de decidir si viajan o no, los comerciantes tienen en cuenta la distancia.<n><n>Los comerciantes que visitan una ciudad compran automáticamente las mercancías que abundan y que tienen mejores precios. También puedes vender directamente a tu ciudad las mercancías que hayas producido. Los comerciantes las comprarán regularmente mientras no salgan más caras que en otras ciudades.<n><n>La ventaja de ello es que siempre dispones de productos suficientes para tus ciudadanos sin tener que preocuparte de transportarlos a otras ciudades."
