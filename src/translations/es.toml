"0x1b0a0b6d" = "Has alcanzado el rango de «Marinero». A partir de hoy, debes hacer algo para mantener tu alta reputación ante una nación.<n><n> Puedes mejorar tu reputación con las naciones comerciando, donando a la iglesia, organizando festejos, destruyendo piratas, así como cumpliendo misiones y patentes de corso.<n><n>Si tu reputación ante una nación no mejora, disminuye una cantidad muy pequeña cada día. Ten en cuenta que el número de edificios que hayas construido en las ciudades de una nación determina hasta qué punto puede bajar tu reputación de esta forma.<n><n>Tu reputación influye tanto en los precios comerciales como en la asignación de misiones en las ciudades. Si tu reputación es baja, también deberías cuidarte de los convoyes militares."
"0x1b33d8e6" = "¡Puede que se estén transportando productos desaprovechados!"
"0x1b407276" = "Producción"
"0x1b416d15" = "Bienes"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "El número de ciudadanos (la población menos el número de soldados) en [ref:Tortuga] debe restablecerse a @I$Pop$ a más tardar el @D$EndDate$, para que todos los negocios tengan la plantilla completa de trabajadores."
"0x1b900424" = "Viajero"
"0x1ba04e6b" = "Un convoy militar de %1 ha sido destruido por barcos de %2."
"0x1ba7362a" = "Barcos militares de %1 han atacado un convoy comercial de %2."
"0x1bcad43f" = "Hoy, el bucanero %1 %2 ha entrado en la ciudad con nombre falso y ha sembrado un gran malestar entre los trabajadores. Ahora se niegan a trabajar durante dos semanas."
"0x1bccfb60" = "Precio total"
"0x1be1209e" = "Una nueva ciudad"
"0x1be7a5dc" = "Debes encontrar un paquete. @l$Pos$ Devuélvelo a @N$OwnerName$ en @T$TOWN$ antes de @D$EndDate$. "
"0x1bf425d5" = "Desgraciadamente, eres enemigo de la nación a la que pertenece la ciudad y por eso te has colado en el puerto."
"0x1c0b520a" = "No hay partidas guardadas"
"0x1c1160cb" = "Dirección técnica"
"0x1c16ab5a" = "Al almacén:"
"0x1c394b47" = "Experiencia en combate naval"
"0x1c4cc4f1" = "%1: Reparaciones concluidas."
"0x1c703500" = "El gobernador quiere hablar contigo urgentemente."
"0x1c74c605" = "Has huido con %1."
"0x1c7e1413" = "¡Gracias!<n> Naturalmente, primero necesitarás un permiso en la ciudad, pero seguro que lo consigues.<n>Por supuesto, pagaré todos tus gastos en cuanto se construya la escuela. El cumpleaños de mi esposa es el @D$EndDate$; procura que para entonces esté colocada la primera piedra de la escuela."
"0x1c7e1414" = "Eso está bien. Empieza a construir la escuela antes de @D$EndDate$. Entonces pagaré tus gastos.<n>No olvides que necesitarás un permiso en @T$Town$ si quieres construir una escuela.<n>No digas ni una palabra sobre esta misión a mi hermana."
"0x1c7e1415" = "¡Gracias! @T$Town$ no se enterará de nuestro acuerdo. Empieza la construcción antes de @D$EndDate$. Entonces pagaré tus gastos.<n>No olvides que necesitarás un permiso en @T$Town$ si quieres construir una escuela."
"0x1c7e9deb" = "%1: Se han devuelto %2 del préstamo."
"0x1c83647f" = "Armas y munición:"
"0x1ca41002" = "Escenario completado"
"0x1ca50773" = "¡Buen trabajo! Ahora tienes un convoy imponente.<n><n>Tu siguiente tarea no será fácil, pues consiste en atacar y derrotar un convoy militar inglés. El gobernador de las [ref:Turk Islands] te ha facilitado otro barco como refuerzo. Localízalo en el puerto de las [ref:Turk Islands] y añádelo a tu convoy.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destruye un convoy militar inglés."
"0x1ce621bb" = "Viviendas de un comerciante local"
"0x1ce62aab" = "Misiones en curso"
"0x1ce81e5e" = "Tipo de juego"
"0x1cf07333" = "Bien hecho, alcanzó su primer objetivo en @I$Days$ días. Su siguiente objetivo es aumentar el número de ciudadanos que viven en la ciudad. Para ello, establezca cinco negocios, uno de cada tipo permitido en la ciudad.<n><n>Recuerde que solo unos pocos comerciantes visitan [ref:Tortuga], y debe asegurarse de que la ciudad tenga suministros suficientes para que su estado sea lo bastante alto como para admitir nuevos colonos. Además, no olvide garantizar que haya espacio vital suficiente para los ciudadanos.<n><n>Tiene 60 días para alcanzar este objetivo. Cuanto antes lo logre, mejor.<n><n>Consejo: los soldados forman parte de la población de una ciudad, pero no cuentan como ciudadanos. Solo puede aumentar el número de ciudadanos de una ciudad creando puestos de trabajo.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Establezca cinco negocios distintos en [ref:Tortuga] y aumente el número de habitantes a 1.500 antes del @D$EndDate$. ¡No olvide proporcionar espacio vital suficiente! Se necesita una zona residencial por cada negocio."
"0x1d01f111" = "Efectos"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>El barco que se hundió aquí debía de estar al mando de un capitán muy experimentado. El baúl no contiene oro, pero encuentras un diario cuidado con esmero que pertenece al capitán @L$RandLName$. En consecuencia, la experiencia del capitán del convoy @C$Convoy$ aumenta en dos puntos."
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>El cofre del tesoro está vacío; sin embargo, servía de boya para una cuerda. No muy por debajo de la superficie, descubres un escondite con cañones. Tu tripulación sube a bordo tantos cañones como puede."
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>En las aguas de alrededor flota una gran cantidad de barriles de ron. Tus hombres recogen tantos como puede transportar tu convoy."
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Tu convoy ha encontrado un gran cofre de madera. Lo suben a bordo de inmediato y lo abren. Por fin un tesoro de verdad, piensa el capitán al vislumbrar @g$Gold$."
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Un viejo cofre de madera, casi completamente podrido, flota en el agua. Sea lo que sea lo que contuvo, ahora no queda nada salvo un olor repugnante. Aun así, la moral de tu tripulación sube, porque la búsqueda del tesoro por fin ha terminado."
"0x1d19d29c" = "Nuevo permiso de construcción en %1"
"0x1d6d7bd9" = "en cuanto al puerto, cuenta con grandes defensas."
"0x1db06b05" = "El paquete perdido"
"0x1db7f908" = "Desgraciadamente, no tuviste tiempo suficiente para reunir @g$GoldGoal$ en efectivo.<n><n>Vende las mercancías de tu almacén de [ref:Tortuga] en las ciudades donde escasean y estate atento a las mercancías que puedas comprar a buen precio.<n><n>También puedes pedir un préstamo al tesorero de [ref:Tortuga]."
