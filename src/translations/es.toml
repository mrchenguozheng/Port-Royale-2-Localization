"0xf88d6ee5" = "Entrega cualquier cantidad de @G$Goods$ al mercado de @T$TOWN$. Allí recibirás de inmediato @g$Price$ por barril. El @D$EndDate$, un convoy de expedición recogerá la mercancía. Escolta el convoy a Europa y recibirás además @g$Price$ por barril."
"0xf894bc2d" = "El convoy no puede zarpar porque algunos de tus barcos se encuentran en pésimas condiciones. Antes de ordenar su partida tendrás que repararlo en el astillero o retirar del convoy los barcos dañados y repararlos por separado."
"0xf89f542f" = " Has recibido <o:0xff1e1eff>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GOLD_800x600.screen>."
"0xf8af3810" = "No nos falta de nada."
"0xf8b3a303" = "La situación económica de una ciudad puede ascender desde la pobreza hasta la riqueza en seis niveles. En los dos niveles más bajos, la calidad de vida es tan mala que los ciudadanos abandonan regularmente la ciudad. Sin embargo, cuando una ciudad alcanza los niveles de \"prosperidad\", \"abundancia\" y \"riqueza\", tus negocios reciben una bonificación de eficacia y tus trabajadores resultan más rentables. En el nivel más alto, una ciudad llega incluso a producir sus propios colonos.<n><n>En la información de la ciudad encontrarás más información sobre los efectos de cada nivel de situación económica. Para mostrarla sólo tienes que pulsar sobre el nombre de la ciudad.<n><n>Una reserva suficiente de dos o tres mercancías por cada grupo de productos garantiza una buena calidad de vida en tu ciudad. Se considera que hay suficientes reservas de un producto en una ciudad cuando puede abastecer a la población durante diez días.<n><n>Nota: La situación económica de una ciudad no mejora de un día para otro. Los ciudadanos de una ciudad tardan un tiempo en adaptarse a la nueva situación."
"0xf8bacb9a" = "Taberna"
"0xf8cc0545" = "Productos vendidos"
"0xf8e13932" = "Suministra productos a @T$TargetTown$ y compra todos los productos sobrantes. El @D$EndDate$, la situación económica de la ciudad debe ser de \"Auge\" y todos los negocios de los comerciantes locales deben estar funcionando a pleno rendimiento."
"0xf8e13933" = "Suministra productos a @T$TargetTown$ y compra todos los productos sobrantes. El @D$EndDate$, la situación económica de la ciudad debe ser de \"Prosperidad\" y todos los negocios de los comerciantes locales deben estar funcionando a pleno rendimiento."
