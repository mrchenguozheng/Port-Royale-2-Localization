"0x343cc312" = "Demasiada gente en el convoy"
"0x343e9f4b" = "¡Enhorabuena! Ya conoces lo básico sobre cómo construir una ciudad.<n><n>En cuanto se construye tu instalación de producción, empieza automáticamente a emplear trabajadores. Cada colono que espera en el puerto para ser contratado puede convertirse en un trabajador y cuatro ciudadanos. Eso significa que un colono representa en realidad una familia de colonos entera.<n><n>Para asegurarte de que tus negocios tengan suficientes trabajadores, debes garantizar que haya suficientes colonos disponibles para trabajar. Los convoyes de transporte llevan colonos de Europa a las ciudades con gobernador, y luego los comerciantes los llevan a las demás ciudades<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Asegúrate de tener suficientes trabajadores para tu negocio en Santa Marta."
"0x344b915f" = "El mercader del gobernador"
"0x34669be1" = "[ref:Tortuga] no alcanzó el estatus \"riqueza\" a tiempo. Cada mercancía influye en el estatus de una ciudad. Si hay suficiente suministro de una mercancía para 10 días, esa mercancía tendrá el mejor efecto posible sobre la calidad de vida de los ciudadanos y, por lo tanto, sobre el estatus de la ciudad. "
