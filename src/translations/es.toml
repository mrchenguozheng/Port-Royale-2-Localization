"0xc9500bee" = "¡Enhorabuena! Has logrado tu objetivo y has ganado más dinero. También has alcanzado un rango superior.<n><n>Tu rango siempre se determina por tus bienes totales. Estos comprenden el efectivo, así como la propiedad, como mercancías y barcos. Puedes consultar tu riqueza en cualquier momento en «Éxitos», dentro del registro. Eso también te indicará cuándo alcanzarás el siguiente rango.<n><n>Cuanto más alto sea tu rango, más convoyes podrás mandar y, por lo tanto, mayor será el número de ciudades en las que podrás establecer negocios más adelante.<n><n>Ahora que tienes un rango superior, deberías reunir otro convoy y seguir comerciando para aumentar tu riqueza.<n><n>Puedes consultar tu riqueza en cualquier momento situando el cursor sobre la barra azul que indica tu riqueza, que se muestra debajo de esta ventana. <n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Reúne un segundo convoy y aumenta tus bienes totales hasta @g$GoldGoal$."
