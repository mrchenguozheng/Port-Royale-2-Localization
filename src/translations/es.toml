"0xe1cdc367" = "Ahora ya conoces lo básico del funcionamiento del juego y sabes cómo enviar un convoy de una ciudad a otra; son conceptos muy importantes, porque al principio construirás tu fortuna transportando mercancías y comerciando con ellas entre las ciudades.<n><n>En la segunda parte de esta campaña comprarás un barco y lo incorporarás a tu convoy existente.<n><n>Aquí tienes otro consejo:<n><n>En cualquier momento durante la partida puedes pulsar la tecla “F1” para que se muestre una página de ayuda que explica la configuración del teclado y del ratón.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Tu convoy con dos barcos debe llegar al puerto de la ciudad de [town:Cartagena]."
