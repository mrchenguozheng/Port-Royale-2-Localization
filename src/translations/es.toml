"0xf6a84efd" = "It is the year 1570 and we find ourselves in the Caribbean. Your objective is to rise from being a humble trader to become an influential businessman. To help you achieve the status you seek, you can transport goods as well as trade, build, and engage in politics and piracy.<n><n>The following scenario will teach you the basics of how to play the game. As with the other scenarios, this involves several different objectives. You must achieve all of your objectives to successfully complete the scenario.<n><n>You can now close this window using the Close button and refer to the Event window in the bottom-left of your screen.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Follow the instructions in the Event window."
"0xf6bb9f8c" = "Precio"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "Tarjeta gráfica"
"0xf6c77503" = "Se ha descubierto el escondite del pirata %1. ¿Qué aventurero heroico se atreve a atacar y destruir el escondite?"
"0xf6ec5ddc" = "Strange things are happening in Tortuga. Due to a number of events that have happened in the past, hardly a single trader dares set foot in the town. Your task is to support Tortuga as best you can by supplying goods.<n><n>But your starting capital is not exactly spectacular. You have @g$StartGold$ cash available. Nonetheless, you have a well-equipped trading convoy in the harbor and some stores of goods.<n><n>Your first objective is to increase your cash to @g$GoldGoal$. Complete this task as fast as possible, but you cannot take longer than 40 days.<n><n>A word of advice: Under no circumstances should you sell your ships. However, you can take out loans.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Increase your cash to @g$GoldGoal$ by @D$EndDate$."
"0xf70feddb" = "Estás de vuelta en el puerto de Cartagena y tu convoy, el \"Santa Maria\", está seleccionado.<n>Como puedes ver, el convoy ya lleva algunas mercancías: algodón, carne y cacao.<n>Ahora busca los muelles en el puerto y haz clic en ellos, porque quieres vender las mercancías."
"0xf70feddc" = "En los muelles puedes comerciar tanto entre la ciudad y tu almacén como entre la ciudad y tu convoy.<n>Ahora puedes ver qué mercancías tiene la ciudad y qué mercancías tiene tu convoy. Usa las flechas para comprar y vender (los precios se muestran en las flechas).<n>Ahora vende tu algodón."
"0xf70feddd" = "Habrás notado cómo bajó el precio del algodón cuando vendiste una parte.<n>Esto se debe a que el precio lo determinan la oferta y la demanda en la ciudad.<n>Vender las mercancías satisface la demanda y el precio baja. Si compras una mercancía, su precio subirá.<n>Ahora compra @a$SubGoal$ de trigo."
"0xf70fedde" = "¿Ves cómo acaba de subir el precio del trigo? <n>Ten en cuenta, no obstante, que el precio depende no solo de la oferta, sino también de tu reputación en la ciudad.<n>Haz clic en el botón del edificio situado en la parte inferior derecha de la ventana de comercio."
"0xf70feddf" = "Ahora puedes comerciar entre tu almacén y la ciudad.<n>En toda ciudad en la que quieras establecer la producción de una mercancía, primero debes construir un almacén. Siempre tendrás ya un almacén en tu ciudad inicial.<n>Ahora vende todas las mercancías que tienes en el almacén."
"0xf70fede0" = "You have three buttons with the numbers 1, 10 and 100 at the very top of the Trade window to allow you to trade larger quantities of goods more quickly. Click on the button 10 and watch how the prices change.<n>It makes no difference whether you buy 10 x 1 good or 1 x 10 goods: The total price is always the same. Now buy @a$SubGoal$ of rum."
"0xf70fede1" = "The column in the far right of the trade menu displays the average prices for the goods you have bought. Since you want to sell the goods at a profit, you must find a town where a higher price will be paid.<n>Now open the transfer between the ship and your warehouse by clicking on the fourth button (with the crane) on the bottom right."
"0xf70fede2" = "En esta ventana puedes trasladar mercancías entre tu convoy y tu almacén. Ahora carga en el convoy las mercancías que queden en tu almacén, porque quieres venderlas en otra ciudad.<n>Luego cierra la ventana de comercio haciendo clic en el botón marcado \"X\" en la parte inferior derecha."
"0xf70fede3" = "Ahora cambia a la carta náutica y viaja con tu convoy a Santa Marta. No entres en Santa Marta; haz clic derecho en la ciudad en cuanto el convoy llegue. "
"0xf70fede4" = "Esto abrirá la ventana de comercio de Santa Marta.<n>Por lo tanto, no tienes que entrar en una ciudad para comerciar en ella.<n>Ahora vende todas las mercancías que llevas a bordo de tu convoy.<n>Luego cierra la ventana de comercio."
"0xf7110875" = "¿Seguro que quieres eliminar la partida guardada?"
"0xf725f22c" = "Tu convoy está ahora en Santa Marta. Haz clic en el nombre de la ciudad para mostrar la información de la ciudad.<n>Puedes hacerlo desde la carta náutica o entrando en la ciudad."
"0xf725f22d" = "La información de la ciudad muestra las mercancías que se producen en ella.<n><n>También se muestra tu relación con España: ¡esta relación es amistosa! Esto significa que en la ciudad se te pagarán los mejores precios posibles.<n><n>Ahora cierra esta ventana y echa un vistazo a la ciudad."
"0xf725f22e" = "Ahora haz clic en el símbolo de habitantes situado bajo el nombre de la ciudad, a la izquierda de la pantalla, para mostrar las existencias de Santa Marta."
"0xf725f22f" = "Esto muestra la cantidad de mercancías almacenadas y la cantidad consumida en la ciudad. Naturalmente, el nivel de consumo depende de la población de la ciudad.<n>El consumo te indica cuántas mercancías se pueden entregar con regularidad. Ahora cierra la ventana de existencias."
"0xf725f230" = "Ahora intenta hacer algunos negocios rentables.<n>Abre la ventana de comercio y compra todo el algodón, azúcar y cacao que puedas transportar en tu convoy, porque estas mercancías se producen en esta ciudad.<n>Luego vuelve a Cartagena y vende estas mercancías con beneficio."
"0xf725f231" = "Acabas de recibir dos mensajes con algunos consejos para comerciar con éxito.<n>Abre el diario para leer los mensajes.<n>"
"0xf725f232" = "Vende tantas mercancías como puedas por encima del precio medio y compra mercancías nuevas. <n>Nota: Los precios de las mercancías escasas en una ciudad se muestran en rojo. Siempre obtendrás buenos precios por estas mercancías.<n>"
"0xf725f233" = "Las ciudades con gobernador, como Cartagena, reciben mercancías de importación de Europa.<n>Normalmente puedes venderlas con beneficio en ciudades coloniales, como Santa Marta, Maracaibo o Gibraltar.<n>Ahora comercia por tu cuenta durante un tiempo.<n>Tu objetivo es obtener @g$GoldGoal$ en efectivo mediante el comercio."
"0xf7346191" = "Comerciante de %1"
"0xf73619d7" = "Descubierto el escondite de un pirata"
"0xf7370c4b" = "%1,<n>se me ocurren muchas personas a las que preferiría ver. ¿Tenemos algún asunto que tratar? Pasa, si es necesario."
"0xf73bf67d" = "Ve a la vista de la ciudad de Cartagena.<n>Normalmente, debes tener un convoy anclado en el puerto para entrar en una ciudad. Sin embargo, tienes un almacén en Cartagena y, por lo tanto, puedes entrar en esta ciudad cuando quieras.<n>Haz clic en el astillero de Cartagena."
"0xf73bf67e" = "En el astillero, compra un barco pequeño. No gastes demasiado dinero, porque necesitarás conservar algo para comerciar y para mantener tu barco."
"0xf73bf67f" = "En el escenario anterior aprendiste a añadir barcos a un convoy haciendo clic derecho en el puerto.<n>Ahora, sin embargo, debes reunir un nuevo convoy contratando a un capitán en la taberna.<n>Encuentra la taberna (está en el centro de la ciudad) y haz clic en ella."
"0xf73bf680" = "Captains are always to be found at the inn. If there is a captain staying in the town, this will be indicated by the third button in the Inn menu.<n>If you have other ships or convoys in the harbor, you must tell the captain where exactly he is to be employed.<n>Specify that he is to captain your new ship."
"0xf73bf681" = "¡Enhorabuena! ¡Has formado tu primer convoy! Tu siguiente tarea es aumentar tu riqueza hasta @g$GoldGoal$. Puedes consultar tu riqueza en cualquier momento en \"Éxitos\", dentro del diario.<n><n>¡Buena suerte!"
"0xf73dab55" = "Gracias por completar la última misión que te encargué."
"0xf73dab56" = "Quiero darte las gracias por completar mi última misión."
"0xf73dab57" = "Te estoy agradecido por tu apoyo."
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "Empiezas tu carrera con <o:0xFFF2FAAD>%1<o> piezas de oro y una <o:0xFFF2FAAD>pinaza<o> (60 toneladas, máx. 8 cañones)."
"0xf7534d8f" = "When you carry settlers to a town where workers are needed, the settlers will thank you by paying you a fare when they disembark.<n><n>A small number of tools is always required to produce colonial goods like cocoa. If these tools are not available, production stops. Later, when you know a little more about prices and quantities, you can instruct the storekeeper to purchase tools regularly in the town. However, you should purchase the tools yourself for the moment, to be on the safe side.<n><n>This is your next task. Then there will be nothing to stop you from producing cocoa.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Scenario objective<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produce cocoa and build up a supply of @a$AmountGoal$ in your warehouse."
"0xf760fd2a" = "Gracias. Aquí están tus %1. Estoy aquí hasta %2. Hasta entonces puedes traerme más mercancías."
