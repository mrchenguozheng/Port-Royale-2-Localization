"0xd92d797c" = "Un comerciante rival ha convencido a muchos trabajadores para que se vayan de la ciudad<n><n>Tu misión consiste en encontrar colonos como para que todos los negocios de la ciudad cuenten con una cuadrilla completa de trabajadores antes del @D$EndDate$.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>El número de ciudadanos (habitantes menos soldados) debe volver a ser de @I$Pop$ antes del @D$EndDate$."
"0xd95aa48e" = "Me temo que has tardado mucho en dar una respuesta. Habla primero con mi hija y averigua si todavía te quiere."
"0xd95fcda8" = "Cerrar"
"0xd9720471" = "Salud. He oído hablar mucho de tu flota ¿Tienes un barco que me pueda llevar a @T$TargetTown$? Necesito urgentemente llegar allí antes del @D$EndDate$. Te pagaré @g$Reward$ si me llevas allí a tiempo."
"0xd9720472" = " Hola @A$USER$. Tengo un serio problema; me han dejado en la estacada, varado en esta ciudad. Pero necesito urgentemente llegar a @T$TargetTown$. ¿Puedes llevarme allí? ¡Te pagaré @g$Reward$!"
"0xd9720473" = " Hola @A$USER$. Me ha surgido una emergencia y estoy buscando que alguien me lleve a @T$TargetTown$. Te quedaría absolutamente agradecido si me ofrecieras un camarote en uno de tus barcos. Te pagaré @g$Reward$."
"0xd979efd5" = "Pues que así sea. Por favor, empieza a construir un hospital en @T$Town$ antes del @D$EndDate$."
"0xd99426c9" = "¿Te apetece echar una partida de cartas?<n><n>¡Pues haz tu apuesta! ¡Yo la igualaré y el que gane se lo lleva todo!"
"0xd99426ca" = "Ni siquiera voy a molestarme en preguntarte si quieres jugar. Veo que eres pobre como las ratas. Vuelve cuando tengas dinero."
"0xd99426cb" = "¡Tú! ¡Otra vez! Todavía me acuerdo de nuestra última partida. ¿Es que no tuviste bastante? En fin, por el momento no voy a jugar contigo."
"0xd99426cc" = "Bien, tenemos nuestras 5 cartas. Yo canto %1 puntos.<n><n>Si quieres elegir el pinte, tienes que cantar un punto más."
"0xd99426cd" = "Entonces juego. Pintan %1.<n>Aquí está mi primera carta."
"0xd99426ce" = "Tú empiezas. Dime qué palo es el que pinta (elige una carta)."
"0xd99426cf" = "Así que %1 son los triunfos.<n>Juega tu primera carta."
"0xd99426d0" = "Has ganado 1 punto.<n>Elige tu siguiente carta."
"0xd99426d1" = "He ganado 1 punto.<n>Y aquí está mi carta."
"0xd9942739" = "No he conseguido ganar los puntos que canté. He perdido."
"0xd994273a" = "He conseguido ganar los puntos que canté. Has perdido."
"0xd994273b" = "No puedes conseguir los puntos que cantaste. Has perdido la partida."
"0xd994273c" = "Has conseguido ganar los puntos que cantaste. ¡Has ganado!"
"0xd994273d" = "Y aquí está mi último punto. ¡Has perdido la partida!"
"0xd994273e" = "¡Maldita sea, debía haber ganado ese punto! He perdido la partida."
"0xd994273f" = "Bueno, al final la suerte se ha puesto de mi parte. Me temo que has perdido."
"0xd9942740" = "¡Tienes una suerte del demonio!<n>Esa era mi última partida. Estoy sin blanca."
"0xd9942741" = "Te has quedado con todo mi oro. Invítame a una botella de ron y déjame ahogar mis penas a solas."
"0xd9942742" = "¡Ya lo has conseguido! ¿Con qué cara crees que voy a aparecer hoy en casa?"
"0xd99427aa" = "¡Has ganado la partida!"
"0xd99427ab" = "¿Quieres jugar otra partida?"
