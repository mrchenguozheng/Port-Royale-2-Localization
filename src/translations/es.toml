"0x391f78da" = "Guardado rápido"
"0x3933132f" = "Ay, @s$USER$... Tengo un gran problema. Un comerciante de @T$Town$ está comerciando agresivamente con mis clientes y proveedores, arrebatándome las ganancias. Esta situación ya dura meses. ¿Puedes ayudarme a deshacerme de su convoy?"
"0x39331330" = "¿Puedes ayudarme a llevar a cabo un pequeño acto de venganza? Estoy casi seguro de que un comerciante de @T$Town$ fue el responsable del sabotaje de varios de mis barcos. Ahora sólo puedo esperar sentado en lo que mis barcos regresan del astillero. Quiero que destruyas uno de sus convoyes para que sepa con quién se la está jugando. ¡Te recompensaré generosamente!"
"0x39331331" = "¿Tú no eres @A$USER$? Puede que tenga un trabajo para ti.<n>Hace mucho tiempo concedí un préstamo de gran cuantía a un comerciante de @T$Town$. El caso es que el plazo de devolución del mismo hace ya largo tiempo que expiró y ni me lo ha devuelto ni hay visos de que vaya a hacerlo.<n>No puedo permitir que salga impune o todo el mundo creerá que puede dejar de pagarme sus deudas ¿Atacarías uno de sus convoyes? ¡Te recompensaré generosamente!"
