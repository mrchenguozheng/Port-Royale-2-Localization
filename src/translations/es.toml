"0xcb8dd6d9" = "Nuestro enemigo, @n$HostileNation$, no se detendrá ante nada. Mi esposa ha sido secuestrada y se han puesto ciertas condiciones para su liberación. Sin embargo, sé dónde la tienen retenida. Oficialmente, no puedo hacer nada, ¿entiendes? Pero tú podrías atacar la ciudad y traérmela."
"0xcb8dd6da" = "Me alegro de verte.<n>Mi esposa recibió hace poco una perrita de raza procedente de París. El maldito animal me tiene fuera de mí, pero mi esposa está loca por el perro.<n>Alguien se enteró de esto, secuestró al perro y lo entregó a nuestros enemigos como forma de chantajearnos.<n><n>¿Puedes rescatar al perro por mí?"
"0xcb8dd6db" = "Hace algún tiempo, mi hija menor se fugó con una especie de aventurero de paso, según se dijo entonces. Ahora he descubierto que vive en @T$TargetTown$ y que va a casarse con el comandante de la ciudad. Conozco a mi hija; jamás haría algo así por voluntad propia. Difícilmente puedo sugerir al virrey que tengamos que atacar una ciudad para rescatar a mi hija. Pero... ¿y tú?"
