"0xdeeff94e" = " Contenía una nueva colección de moda femenina de París."
"0xdeeff94f" = " Se usaba para guardar pétalos de rosa perfumados."
"0xdeeff950" = " Al parecer contenía un bonito juego de té en miniatura para muñecas."
"0xdeeff951" = " El cofre contenía muñecos de peluche rosas."
"0xdeeff952" = " Al parecer el cofre contenía, entre otras cosas, una colección de pintalabios de París."
"0xdeeff953" = " Al parecer se usaba para guardar plumeros de colores vivos."
"0xdeeff954" = " El cofre contenía varios uniformes de criada."
"0xdeeff955" = " El cofre contiene muchas cosas útiles, como látigos, velas y polveras."
"0xdeeff956" = " El cofre contenía cosas insólitas, incluido un kit holandés para cultivar tulipanes."
"0xdeeff957" = " Se usaba para guardar largas botas de charol y gorras de cuero."
"0xdeeff9bf" = " Estaba repleto de faldas de rafia y cera para bigotes de caballero."
"0xdeeff9c0" = " El cofre contenía un uniforme de general, un traje indígena, prendas de trabajador y un traje de cuero."
"0xdeeff9c1" = " Estaba repleto de muñecas y boas de plumas."
"0xdeeff9c2" = " El cofre se usaba para guardar largas pelucas francesas."
"0xdeeff9c3" = " Parece que el cofre contenía pinturas de toreros españoles."
"0xdeeff9c4" = " Al parecer el cofre contenía, entre otras cosas, una caja de galletas de menta de Inglaterra."
"0xdeeff9c5" = " Parece que el cofre se había usado para guardar unas medias estampadas de tigre, pijamas de seda y calzones de montar."
"0xdeeff9c6" = " El cofre estaba lleno de mullidos cojines."
"0xdeeff9c7" = " También contenía gorros con orejeras."
"0xdeeff9c8" = " Lo principal que contenía el cofre era una funda bordada para mantener calientes las baguettes."
"0xdeeffa30" = " Lo más valioso del cofre era una larga falda escocesa de tartán hecha de piel de oso."
"0xdeeffa31" = " En particular, el cofre contenía zapatos de tacón inusualmente grandes."
"0xdeeffa32" = " El cofre contenía pequeños tutús de ballet y pañuelos perfumados."
