"0xf214f69c" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has rescatado a un náufrago de @n$DestNation$. @N$Name$ te ofrece una gran recompensa si le desembarcas en la próxima ciudad perteneciente a su nación."
"0xf214f69d" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has rescatado al comerciante @N$Name$ de @T$DestTown$. Te promete una gran recompensa si le devuelves a su ciudad natal."
"0xf214f69e" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has rescatado al renombrado capitán @N$Name$. Pide que se le desembarque en una ciudad que pertenezca a @n$DestNation$."
"0xf214f69f" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has recogido a @I$Sailors$ marineros que habían naufragado Al parecer conocen a algunos miembros de tu tripulación. La fiesta de bienvenida eleva la moral de la tripulación."
"0xf214f6a0" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has recogido a un marinero de @n$Nation$. Para darte las gracias por haberle rescatado, te informa de dónde puedes encontrar muchos barriles con restos de valor. @l$DebrisPos$"
"0xf214f6a1" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Has rescatado a un sacerdote de @n$DestNation$. No puede pagarte para que le lleves a una ciudad que pertenezca a su nación, pero promete intervenir en tu favor para mejorar tu reputación en @n$DestNation$."
"0xf22583c4" = "¿Deseas comprar una Patente de Corso contra %1 y perseguir los barcos de nuestros enemigos en nombre de Holanda?"
"0xf22a4fad" = "Una plaga de ratas en %1 está acabando con toda la comida almacenada. Será necesario duplicar el suministro de trigo, fruta, maíz y carne durante un mes. "
"0xf22b236f" = "No has entregado los productos a tiempo."
"0xf22d73b9" = "Para producir artículos coloniales necesitas herramientas. De igual forma, necesitas materias primas para producir productos manufacturados como cuerda o ropa. Las materias primas necesarias para producirlos son el cáñamo y el algodón respectivamente.<n><n>Ahora que ya sabes construir plantas de producción, debes comprar un permiso de construcción en una ciudad con gobernador y construir instalaciones en ellas para producir artículos terminados. Sin embargo, deberás contar con un buen historial comercial en esa ciudad antes de poder comprar un permiso de construcción; esto significa que deberás llevar a la ciudad mercancías que escaseen en ella.<n><n>¡Ten cuidado, porque comprar mercancías que escaseen en una ciudad tendrá un efecto negativo sobre tu historial comercial! Las mercancías que escasean en una ciudad se muestran en rojo en la ventana de Comercio.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Mejorar tu historial comercial en [town:Cartagena] para poder comprar allí un permiso de construcción."
"0xf24b293b" = "Cargar / Guardar"
"0xf253afcd" = "Sólo puedes asignar una ruta comercial a esta nave si el capitán del convoy tiene %1 puntos de experiencia. En la actualidad tiene %2 puntos."
"0xf2590753" = "Muchas gracias. Tal y como están las cosas, parece que a corto plazo será difícil recibir suministros importados desde Europa. Pero podemos aprovechar la guerra con @n$HostileNation$ para saquear productos sus convoyes de transporte. Es importante no capturar ni hundir sus barcos.<n>Por favor, consigue @a$Amount$ de cada uno de los productos: Especias, vino y herramientas, y entrégaselos a mi comerciante en el mercado antes del @D$EndDate$."
"0xf2590754" = "Tu misión es atacar y saquear los convoyes de transporte pertenecientes a @n$HostileNation$, sin capturar ni hundir sus barcos. Luego debes entregar los productos en el mercado. Tienes hasta el @D$EndDate$."
"0xf2590755" = "Que así sea. Ve en busca de los convoyes de transporte de @n$HostileNation$ y saquea @a$Amount$ de los productos importados que se hallen a bordo. Luego tienes hasta el @D$EndDate$ para entregar los productos al comerciante que te estará esperando en el mercado. Un pequeño consejo: Debido a la situación tan tensa que se vive actualmente en la región, solo puedes saquear los barcos; ¡No debes capturar ni hundir barco alguno!"
"0xf2593b17" = "He ganado %1."
