"0x305f2287" = "Recientemente, mi nación perdió la última ciudad con gobernador a manos del enemigo.<n><n>Si conseguimos hundir algunos de sus convoyes militares, el enemigo se verá debilitado y podremos recuperar algunas de nuestras ciudades.<n><n>Para evitar problemas con el resto de las naciones, te proporcionaré una Patente de Corso contra nuestros enemigos."
