"0xf69c4221" = "Ataque a %1"
"0xf6a84efd" = "Estamos en el año 1570 y nos encontramos en el Caribe. Tu objetivo es dejar de ser un humilde comerciante y convertirte en un influyente hombre de negocios. Para ayudarte a alcanzar la posición que buscas, puedes transportar mercancías y comerciar, construir y dedicarte a la política y a la piratería.<n><n>El siguiente escenario te enseñará lo básico sobre cómo jugar. Como en los demás escenarios, implica varios objetivos distintos. Debes cumplirlos todos para completar el escenario con éxito.<n><n>Ahora puedes cerrar esta ventana con el botón Cerrar y consultar la ventana de eventos, en la esquina inferior izquierda de la pantalla.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Sigue las instrucciones de la ventana de eventos."
"0xf6bb9f8c" = "Precio"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "Tarjeta gráfica"
"0xf6c77503" = "Se ha descubierto el escondite del pirata %1. ¿Qué aventurero heroico se atreve a atacar y destruir el escondite?"
"0xf6ec5ddc" = "Están ocurriendo cosas extrañas en [ref:Tortuga]. Debido a una serie de sucesos del pasado, apenas se atreve un solo comerciante a poner un pie en la ciudad. Su tarea es apoyar a [ref:Tortuga] lo mejor que pueda abasteciéndola de mercancías.<n><n>Pero su capital inicial no es precisamente espectacular. Dispone de @g$StartGold$ en efectivo. No obstante, tiene en el puerto un convoy comercial bien equipado y algunas existencias de mercancías.<n><n>Su primer objetivo es aumentar su efectivo hasta @g$GoldGoal$. Complete esta tarea lo más rápido posible, pero no puede tardar más de 40 días.<n><n>Un consejo: bajo ningún concepto venda sus barcos. Eso sí, puede solicitar préstamos.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumente su efectivo hasta @g$GoldGoal$ antes del @D$EndDate$."
"0xf70feddb" = "Estás de vuelta en el puerto de [ref:Cartagena] y tu convoy, el \"Santa Maria\", está seleccionado.<n>Como puedes ver, el convoy ya lleva algunas mercancías: algodón, carne y cacao.<n>Ahora busca los muelles en el puerto y haz clic en ellos, porque quieres vender las mercancías."
"0xf70feddc" = "En los muelles puedes comerciar tanto entre la ciudad y tu almacén como entre la ciudad y tu convoy.<n>Ahora puedes ver qué mercancías tiene la ciudad y qué mercancías tiene tu convoy. Usa las flechas para comprar y vender (los precios se muestran en las flechas).<n>Ahora vende tu algodón."
"0xf70feddd" = "Habrás notado cómo bajó el precio del algodón cuando vendiste una parte.<n>Esto se debe a que el precio lo determinan la oferta y la demanda en la ciudad.<n>Vender las mercancías satisface la demanda y el precio baja. Si compras una mercancía, su precio subirá.<n>Ahora compra @a$SubGoal$ de trigo."
"0xf70fedde" = "¿Ves cómo acaba de subir el precio del trigo? <n>Ten en cuenta, no obstante, que el precio depende no solo de la oferta, sino también de tu reputación en la ciudad.<n>Haz clic en el botón del edificio situado en la parte inferior derecha de la ventana de comercio."
"0xf70feddf" = "Ahora puedes comerciar entre tu almacén y la ciudad.<n>En toda ciudad en la que quieras establecer la producción de una mercancía, primero debes construir un almacén. Siempre tendrás ya un almacén en tu ciudad inicial.<n>Ahora vende todas las mercancías que tienes en el almacén."
"0xf70fede0" = "En la parte superior de la ventana de comercio tienes tres botones con los números 1, 10 y 100, que te permiten comerciar cantidades mayores de mercancías con más rapidez. Pulsa el botón 10 y observa cómo cambian los precios.<n>Da igual comprar 10 x 1 mercancía o 1 x 10 mercancías: el precio total siempre es el mismo. Ahora compra @a$SubGoal$ de ron."
"0xf70fede1" = "La columna del extremo derecho del menú de comercio muestra los precios medios de las mercancías que has comprado. Como quieres venderlas con beneficio, debes encontrar una ciudad donde paguen un precio más alto.<n>Ahora abre el traspaso entre el barco y tu almacén pulsando el cuarto botón (con la grúa) abajo a la derecha."
"0xf70fede2" = "En esta ventana puedes trasladar mercancías entre tu convoy y tu almacén. Ahora carga en el convoy las mercancías que queden en tu almacén, porque quieres venderlas en otra ciudad.<n>Luego cierra la ventana de comercio haciendo clic en el botón marcado \"X\" en la parte inferior derecha."
"0xf70fede3" = "Ahora cambia a la carta náutica y viaja con tu convoy a Santa Marta. No entres en Santa Marta; haz clic derecho en la ciudad en cuanto el convoy llegue. "
"0xf70fede4" = "Esto abrirá la ventana de comercio de Santa Marta.<n>Por lo tanto, no tienes que entrar en una ciudad para comerciar en ella.<n>Ahora vende todas las mercancías que llevas a bordo de tu convoy.<n>Luego cierra la ventana de comercio."
"0xf7110875" = "¿Seguro que quieres eliminar la partida guardada?"
"0xf725f22c" = "Tu convoy está ahora en Santa Marta. Haz clic en el nombre de la ciudad para mostrar la información de la ciudad.<n>Puedes hacerlo desde la carta náutica o entrando en la ciudad."
"0xf725f22d" = "La información de la ciudad muestra las mercancías que se producen en ella.<n><n>También se muestra tu relación con España: ¡esta relación es amistosa! Esto significa que en la ciudad se te pagarán los mejores precios posibles.<n><n>Ahora cierra esta ventana y echa un vistazo a la ciudad."
"0xf725f22e" = "Ahora haz clic en el símbolo de habitantes situado bajo el nombre de la ciudad, a la izquierda de la pantalla, para mostrar las existencias de Santa Marta."
"0xf725f22f" = "Esto muestra la cantidad de mercancías almacenadas y la cantidad consumida en la ciudad. Naturalmente, el nivel de consumo depende de la población de la ciudad.<n>El consumo te indica cuántas mercancías se pueden entregar con regularidad. Ahora cierra la ventana de existencias."
"0xf725f230" = "Ahora intenta hacer algunos negocios rentables.<n>Abre la ventana de comercio y compra todo el algodón, azúcar y cacao que puedas transportar en tu convoy, porque estas mercancías se producen en esta ciudad.<n>Luego vuelve a [ref:Cartagena] y vende estas mercancías con beneficio."
"0xf725f231" = "Acabas de recibir dos mensajes con algunos consejos para comerciar con éxito.<n>Abre el diario para leer los mensajes.<n>"
"0xf725f232" = "Vende tantas mercancías como puedas por encima del precio medio y compra mercancías nuevas. <n>Nota: Los precios de las mercancías escasas en una ciudad se muestran en rojo. Siempre obtendrás buenos precios por estas mercancías.<n>"
"0xf725f233" = "Las ciudades con gobernador, como [ref:Cartagena], reciben mercancías de importación de Europa.<n>Normalmente puedes venderlas con beneficio en ciudades coloniales, como Santa Marta, Maracaibo o Gibraltar.<n>Ahora comercia por tu cuenta durante un tiempo.<n>Tu objetivo es obtener @g$GoldGoal$ en efectivo mediante el comercio."
"0xf7346191" = "Comerciante de %1"
"0xf73619d7" = "Descubierto el escondite de un pirata"
"0xf7370c4b" = "%1,<n>se me ocurren muchas personas a las que preferiría ver. ¿Tenemos algún asunto que tratar? Pasa, si es necesario."
"0xf73bf67d" = "Ve a la vista de la ciudad de [ref:Cartagena].<n>Normalmente, debes tener un convoy anclado en el puerto para entrar en una ciudad. Sin embargo, tienes un almacén en [ref:Cartagena] y, por lo tanto, puedes entrar en esta ciudad cuando quieras.<n>Haz clic en el astillero de [ref:Cartagena]."
"0xf73bf67e" = "En el astillero, compra un barco pequeño. No gastes demasiado dinero, porque necesitarás conservar algo para comerciar y para mantener tu barco."
"0xf73bf67f" = "En el escenario anterior aprendiste a añadir barcos a un convoy haciendo clic derecho en el puerto.<n>Ahora, sin embargo, debes reunir un nuevo convoy contratando a un capitán en la taberna.<n>Encuentra la taberna (está en el centro de la ciudad) y haz clic en ella."
"0xf73bf680" = "Siempre se pueden encontrar capitanes en la posada. Si hay un capitán alojado en la ciudad, lo indicará el tercer botón del menú de la posada.<n>Si tienes otros barcos o convoyes en el puerto, debes decirle al capitán exactamente dónde debe ser empleado.<n>Indica que debe mandar tu nuevo barco."
"0xf73bf681" = "¡Enhorabuena! ¡Has formado tu primer convoy! Tu siguiente tarea es aumentar tu riqueza hasta @g$GoldGoal$. Puedes consultar tu riqueza en cualquier momento en \"Éxitos\", dentro del diario.<n><n>¡Buena suerte!"
"0xf73dab55" = "Gracias por completar la última misión que te encargué."
"0xf73dab56" = "Quiero darte las gracias por completar mi última misión."
"0xf73dab57" = "Te estoy agradecido por tu apoyo."
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "Empiezas tu carrera con <o:0xFFF2FAAD>%1<o> piezas de oro y una <o:0xFFF2FAAD>pinaza<o> (60 toneladas, máx. 8 cañones)."
"0xf7534d8f" = "Cuando llevas colonos a una ciudad donde se necesitan trabajadores, los colonos te lo agradecen pagándote un pasaje al desembarcar.<n><n>Siempre se necesita una pequeña cantidad de herramientas para producir mercancías coloniales como el cacao. Si no hay herramientas disponibles, la producción se detiene. Más adelante, cuando sepas algo más sobre precios y cantidades, podrás indicar al almacenista que compre herramientas periódicamente en la ciudad. Sin embargo, por ahora deberías comprar tú mismo las herramientas, para ir sobre seguro.<n><n>Esta es tu siguiente tarea. Después nada te impedirá producir cacao.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produce cacao y reúne en tu almacén una reserva de @a$AmountGoal$."
"0xf760fd2a" = "Gracias. Aquí están tus %1. Estoy aquí hasta %2. Hasta entonces puedes traerme más mercancías."
