"0x35f48f6c" = "La ciudad que buscas es un lugar desolado, apartado de todo el mundo, como abandonado o caído en desgracia."
"0x35f48f6d" = "Un río salvaje divide el cabo. Allí yace una ciudad en la que te alojarás con gusto."
"0x35f48f6e" = "Cuatro ciudades comparten la bahía. Navega hacia el este, debes atracar en la tercera."
"0x35f48f6f" = "No puede ser la ciudad más septentrional, pero más al norte solo verás otra."
"0x35f48f70" = "San Agustín navega ahora hacia el norte, muy pronto lo encontrarás en la ciudad."
"0x35f48f71" = "No puede ser la ciudad más septentrional, pero más al norte solo verás otra."
"0x35f48f72" = "San Agustín navega ahora hacia el norte, muy pronto lo encontrarás en la ciudad."
