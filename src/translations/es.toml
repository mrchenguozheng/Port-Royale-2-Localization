"0x0e141340" = "Arma tu convoy para que tenga al menos tres barcos de escolta completamente armados y con tripulación completa, todos del tipo fragata o superior."
"0x0e2cf5dd" = "Comercio y producción"
"0x0e321cfd" = "Mantenimiento del barco"
