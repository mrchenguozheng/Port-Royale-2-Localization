"0x1b0a0b6d" = "Has alcanzado el rango de “Marinero”. A partir de hoy, deberás hacer algo para mantener alta tu reputación dentro de un país.<n><n> Puedes mejorar tu reputación comerciando, haciendo donaciones a la iglesia, organizando fiestas, acabando con los piratas o cumpliendo misiones y consiguiendo Patentes de Corso.<n><n>Si tu reputación en un país dado no mejora, ésta irá cayendo poco a poco cada día. Ten presente que el número de edificios que hayas construido en las ciudades de un país determinará la medida en la que tu reputación podrá caer de esta forma.<n><n>Tu reputación influirá tanto en los precios del comercio como en las asignaciones de misiones en las ciudades. ¡Si no gozas de buena reputación, también deberás tener cuidado con los convoyes militares!"
"0x1b33d8e6" = "¡Puede que se estén transportando productos desaprovechados!"
"0x1b407276" = "Producción"
"0x1b416d15" = "Bienes"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "El número de ciudadanos (la población menos el número de soldados) de [town:Tortuga] tiene que volver a ser de @I$Pop$ antes del @D$EndDate$ para garantizar que todos los negocios tengan una cuadrilla completa de trabajadores."
"0x1b900424" = "Viajero"
"0x1ba04e6b" = "Un convoy militar de %1 fue destruido por los buques propiedad de %2."
"0x1ba7362a" = "Buques militares pertenecientes a %1 han atacado un convoy comercial propiedad de %2."
"0x1bcad43f" = "Hoy, el corsario %1 %2 se infiltró en la ciudad bajo una falsa identidad para instigar una rebelión entre los trabajadores. Ahora, estos han decidido dejar de trabajar durante dos semanas."
