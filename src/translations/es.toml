"0xfc5c9324" = "<gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Gold_X3_800x600.screen>"
"0xfc64ab0e" = "Ahora, si atacas ciudades y barcos franceses, podrás mejorar tu reputación en %1. Esto no empeorará tu reputación en los otros países."
"0xfc692ef1" = "<n><n>Sin embargo, si al menos uno de los barcos del convoy sobrevive a la batalla, el capitán sobrevive con él."
"0xfc71eb4b" = "Tengo un problema bastante complicado. Desde el estallido de la guerra con @n$FoeNation$, no he podido acumular suficientes productos coloniales para los convoyes de transporte. ¿Puedes ayudarme suministrándome un gran envío de @G$Goods$?"
"0xfc71eb4c" = "Desde que estamos en guerra con @n$FoeNation$, a sus comerciantes se les ha prohibido entregar @G$Goods$ a las ciudades que pertenecen a mi nación. Ahora me enfrento a una importante escasez de esta mercancía. Tú tienes muchos barcos y conoces bien los mares. ¿No podrías asegurarme un gran envío de @G$Goods$?"
"0xfc72151e" = "Transferencia entre almacén y convoy"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Por cañones"
"0xfc910833" = "Viviendas disponibles"
"0xfc9a5f7d" = "Ha sido un placer hacer negocios contigo. ¡Que tengas un buen día!"
"0xfc9a5f7e" = "Hemos enviado las mercancías a tu almacén. ¡Que tengas un buen día!"
"0xfc9a5f7f" = "Hemos cargado las mercancías en tu convoy. Adiós, %1."
"0xfc9cf623" = "Completada"
"0xfca882e8" = "Como sabes, la flota del Tesoro Español siempre toma una ruta diferente cuando recoge tesoros de sus colonias y los envía a Europa. La flota evita las emboscadas permaneciendo poco tiempo en cada ciudad. Sin embargo, esta vez España ha cometido un error garrafal al permitirnos descubrir la ruta que en este mismo momento está siguiendo la flota española del tesoro. Tus órdenes no podrían ser más simples. ¡Destruye todos y cada uno de los barcos!"
"0xfca882e9" = "Estamos en guerra con España y debemos asegurarnos de que la flota del Tesoro Español nunca llegue a Europa. Por suerte, nos hemos enterado de la próxima ciudad en la que se detendrá. Sabotearemos la flota en esa ciudad de forma que tenga que prolongar su estancia en el puerto. Eso debería procurarte el tiempo suficiente para interceptar la flota y evitar que llegue a Europa. ¿Aceptas esta misión?"
"0xfca882ea" = "¡No se te presentan oportunidades como esta todos los días! Hoy uno de mis informadores me reveló la ruta que actualmente sigue la flota del Tesoro Español. Pero eso no es todo. Nos hemos enterado de que la flota permanecerá anclada más tiempo del habitual en la próxima ciudad que visite. Puesto que estamos en guerra con España, deberíamos darle al virrey alguna alegría y asegurar que la flota del tesoro nunca llegue a su destino en Europa. ¿Interceptarás la flota para mi nación?"
"0xfcc82d44" = "Infante"
"0xfcd6fdec" = "Veo que todavía nos has completado mi última misión. Acaba el trabajo, pues tengo más trabajo para ti."
"0xfcded04c" = "IDM_CONTEST_01_2004_LOG_01_TEXT"
"0xfce1cfd1" = "Me temo que por el momento no tengo nada para ti.<n> Sólo puedo encargarte la captura de una ciudad si uno de los países hostiles da muestras de debilidad y yo dispongo de suficientes convoyes militares para proteger mis ciudades."
"0xfce38f12" = "Comandante de la ciudad"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "Ambiente"
"0xfd1be8e3" = "El corsario %1 %2 se introdujo furtivamente en la ciudad y destruyó gran parte de las mercancías de varios comerciantes de la ciudad. El consejo de la ciudad se niega a aceptar ninguna responsabilidad."
"0xfd1f0281" = "Materias primas y producción"
"0xfd26f2aa" = "El convoy @C$Convoy$ ha recogido a un náufrago. Llévale a @T$DestTown$."
"0xfd26f2ab" = "El convoy @C$Convoy$ ha recogido a un náufrago. Llévale a una ciudad perteneciente a @n$DestNation$."
