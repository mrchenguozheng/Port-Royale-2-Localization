"0x31074c51" = "¿Te has enterado de que ha estallado una epidemia en @T$Town$? Ciertamente se podría haber evitado si hubiera habido un hospital en la ciudad. Por desgracia, mi maestro de obras es un cobarde y teme entrar en la ciudad para encargar el hospital. Por eso propongo enviarte a ti. ¿Aceptas? ¡Estoy dispuesto a pagarte @g$Reward$ por tus esfuerzos!"
