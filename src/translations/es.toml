"0xef9ba866" = "Robert Andreas Drude"
"0xefbbbbe9" = "Ha llegado el momento de encontrar la guarida de Barbanegra y poner fin a sus tropelías. Cuando un pirata anda suelto durante mucho tiempo es sólo cuestión de tiempo que se descubra su escondite.<n>Pero también puedes hacer algo para acelerarlo: Los convoyes piratas regresan de vez en cuando a su guarida para descargar el botín y hacer las reparaciones necesarias.<n>Si sigues de cerca uno de estos convoyes piratas en la carta de navegación, es muy probable que descubras el emplazamiento del escondite. Una vez que lo hayas descubierto, puedes destruirlo atacando desde el mar de la misma forma que atacas cualquier ciudad.<n><n>Hace poco fue avistado un convoy pirata: @l$IslandPos$ Encuentralo y descubre su guarida.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo de la campaña<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Localizar la guarida de Barbanegra."
