"0x2875b307" = "%1 %2 ha destruido un convoy del pirata %3."
"0x28812f6e" = "He oído que quieres ponerte a prueba como comandante de una batalla naval. Pues tengo una tarea para ti que podría beneficiarnos a ambos.<n>Ahora mismo hay dos barcos abandonados que flotan a la deriva en alta mar. Quiero que te deshagas de esos barcos antes de que empiecen a suponer una amenaza para mis comerciantes.<n>¿Aceptas esta misión?"
"0x28812f6f" = "Ahora algo bastante más difícil. Alguien me ha soplado dónde anda ahora por los mares un convoy pirata al mando de @P$PirateName$. El convoy consta de un solo barco, así que no debería resultarte demasiado difícil destruirlo.<n>¿Aceptas esta misión?"
"0x28812f70" = "Ya has destruido un convoy pirata perteneciente a @P$PirateName$. Sin embargo, normalmente hay varios convoyes en un escondite pirata, todos al mando de @P$PirateName$. Solo puedes eliminar al líder de una banda de piratas si encuentras y destruyes su escondite.<n>Ahora ha aparecido otro convoy al mando de @P$PirateName$. Este convoy consta de dos barcos, así que debes estar bien preparado antes de entrar en combate.<n>¿Estás listo?"
"0x2883fdae" = "Puedes atacar este escondite pirata desde el mar con un convoy. Primero debes derrotar todos los barcos del puerto. "
"0x289d1ced" = "consumo diario"
"0x28b1f98d" = "%1 %2 También tienes permiso para levantar edificios y establecer negocios en %3 y ya posees un almacén en la ciudad.<n><n>Como eres joven e inexperto, solo has alcanzado el rango de Grumete. Por lo tanto, aún no puedes mandar más convoyes ni comprar permisos de construcción adicionales en otra ciudad.<n><n>Tu rango se determina por tus bienes totales, que comprenden el efectivo y la propiedad y ascienden actualmente a unos %4. Alcanzarás el siguiente rango en cuanto tus bienes lleguen a %5.<n><n><n>¡Buena suerte!"
"0x28c94158" = "Barcos"
"0x28cc4ee4" = "El convoy no puede zarpar porque hay demasiadas mercancías a bordo. Vende algunas de tus mercancías o llévalas a tu almacén para no superar la capacidad máxima de carga del convoy."
"0x28ef24c0" = "débil"
"0x28ef24c1" = "[term:fr_medium]"
