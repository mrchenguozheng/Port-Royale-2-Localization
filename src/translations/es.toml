"0xeeced82e" = "@s$USER$, en Europa, @n$Nation$ sufre escasez de @G$Goods$. Por eso estoy organizando una expedición a Europa. Compraré todo el @G$Goods$ que puedas suministrar y estoy dispuesto a ofrecerte un precio unitario de @g$FullPrice$. ¿Te interesa?"
"0xeeced82f" = "Saludos. Estoy organizando una expedición a Europa. Quiero aprovechar la escasez de @G$Goods$ que hay allí. Me ofrezco a comprar todas las mercancías que puedas suministrar y te daré un precio muy bueno por barril, digamos @g$FullPrice$. ¿Hacemos trato?"
"0xeeced830" = "Saludos, @s$USER$. Estoy organizando un convoy a Europa, pues he oído que @G$Goods$ se está vendiendo a un precio muy alto. Ofrezco un precio unitario de @g$FullPrice$ a quien pueda entregarme @G$Goods$ . ¿Hacemos trato?"
