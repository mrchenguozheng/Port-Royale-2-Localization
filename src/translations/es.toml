"0xf932eef8" = "¡Enhorabuena! Has completado con éxito este escenario y ahora sabes cómo construir tu propia ciudad.<n><n>En el modo de juego libre, el virrey de cualquier nación puede regalarte tu propia ciudad. Pero no es fácil conseguirlo, porque siempre tienes que capturar ciudades para recibir un terreno, y eso, naturalmente, dañará tu reputación ante las demás naciones. <n><n>Todo lo que hayas aprendido en este escenario sobre el desarrollo de tu ciudad te ayudará a desarrollar negocios en otras ciudades también. La principal diferencia es que no tendrás que preocuparte por defender esas ciudades."
