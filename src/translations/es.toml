"0xe78e5c6d" = "hay muy pocos soldados en esta ciudad"
"0xe799be68" = "El bucanero %1 %2 ha contaminado grandes cantidades de comida en la ciudad. Como resultado, ha estallado una hambruna. Mientras la hambruna arrasa, subirá el precio del trigo, la fruta, el maíz y la carne."
"0xe79fc3ee" = "Por tripulación"
"0xe7a9acfb" = "¿Quieres comprar una patente de corso por %1 y cazar los barcos de nuestros enemigos en nombre de España?"
"0xe7b85cf1" = "¿Quieres demoler este negocio?"
"0xe7ba475b" = "Aprendizaje: Batallas navales"
"0xe7bffbb6" = "En [ref:Tortuga], los almacenes de la ciudad han sido destruidos por saboteadores. Se han perdido muchos de los suministros de la ciudad y, como consecuencia, la calidad de vida de sus ciudadanos ha caído drásticamente.<n><n>Tu objetivo es reponer los suministros de la ciudad lo antes posible para que su estatus pueda volver a subir.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo del escenario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La ciudad debe alcanzar el estatus «Auge» antes del @D$EndDate$."
"0xe7c31648" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Elige un edificio<n><n><f:fonts/Tiepolo_bold14x14aaFH.res>Tu primer edificio en esta ciudad debe ser un almacén"
"0xe7c31649" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Elige un edificio"
"0xe7d6570d" = "Tu reputación en los países"
"0xe7ecbb16" = "Perseguir a un convoy pirata"
"0xe80564ba" = "Anexionar"
