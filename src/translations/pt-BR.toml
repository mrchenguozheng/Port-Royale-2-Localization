"0x2ee8bb8c" = "Estamos na cidade com governador de Cartagena, no sul do Caribe.<n>Você pode entrar nos vários edifícios de uma cidade e realizar diversas ações; falaremos mais sobre isso adiante.<n>Primeiro, observe a parte superior da tela. Você vê uma série de botões e exibições.<n>Agora clique no botão com o relógio, bem à esquerda da tela."
"0x2ee8bb8d" = "Esta é a Crônica. Ela contém um registro de todos os eventos e acontecimentos do Caribe, como um jornal diário.<n>Há alguns botões à direita da janela da Crônica. Você pode usá-los para exibir informações sobre o Caribe. No entanto, isso não é importante no momento.<n>Agora feche a Crônica clicando no botão marcado “X”."
"0x2ee8bb8e" = "No topo da tela, ao lado da data, está o botão Diário e, ao lado dele, seu dinheiro.<n>O diário mantém você atualizado sobre qualquer informação relativa aos seus sucessos e posses. Além disso, todas as mensagens e missões que você recebe ficam salvas aqui.<n>Abra o diário. "
"0x2ee8bb8f" = "Como pode ver, o diário exibe imediatamente todas as mensagens que você recebeu até agora. No momento, ele mostra apenas as instruções deste cenário.<n>Há mais botões à direita da janela do Diário. Clique no terceiro botão. "
"0x2ee8bb90" = "Isso exibe as tarefas e missões que você recebeu. No momento, apenas o objetivo do cenário é mostrado.<n>Usando os dois botões no topo da janela de Missões, você pode alternar entre missões atuais e concluídas.<n>Agora feche o diário. Você também pode fazer isso simplesmente com o botão direito."
"0x2ee8bb91" = "Mais adiante no jogo, você poderá aceitar inúmeras missões para alcançar fama e fortuna.<n>Primeiro, vamos dar uma olhada na cidade. Como pode ver pela exibição no centro superior da tela, estamos em Cartagena. A cidade tem cerca de 2.000 habitantes.<n>Clique no botão que mostra o nome da cidade."
"0x2ee8bb92" = "Isso abre uma janela que exibe informações sobre a cidade.<n>Cartagena é uma cidade com governador e pertence à Espanha. Você também pode ver o status da cidade e as mercadorias que podem ser produzidas lá.<n>Agora entre em um edifício. Para isso, feche a exibição de informações da cidade."
"0x2ee8bb93" = "Você pode usar as teclas de seta do teclado para se mover pela vista da cidade. Agora observe o centro da cidade dentro das muralhas. Ele contém edifícios como as docas, a igreja e o palácio do governador.<n>Clique uma vez em qualquer um desses edifícios."
"0x2ee8bb94" = "A exibição no centro inferior da tela muda quando você clica em um edifício. Dependendo do tipo de edifício, você recebe informações ou pode realizar certas ações.<n>Há botões à direita da exibição do edifício. Para sair do edifício, clique no botão marcado “X”."
"0x2ee8bb95" = "Os edifícios nos quais você pode realizar diversas ações estão sempre dentro das muralhas da cidade. Seu armazém é uma exceção, e falaremos mais sobre isso no próximo cenário.<n>Agora saia do edifício e use as teclas de seta para exibir o porto e o comboio chamado “Santa Maria”. Clique nele."
"0x2ee8bbfd" = "Como pode ver, as informações do seu comboio agora aparecem no centro inferior da tela.<n>O comboio já carregou mercadorias: 10 barris de trigo e 15 barris de milho.<n>Há vários botões à direita da exibição do comboio. Clique no segundo botão (o que tem o ícone de navio)."
"0x2ee8bbfe" = "Isso exibe o número de navios do comboio. Um comboio pode ter até 10 navios liderados por um capitão.<n>Agora vamos enviar o comboio a outra cidade.<n>Clique no botão com a seta no canto superior direito da tela para sair da cidade e exibir a carta marítima."
"0x2ee8bbff" = "A carta marítima agora aparece. No centro da tela, você verá a cidade de Cartagena.<n>Você pode usar os botões de seta para deslocar a área do mapa exibida e ver todo o mundo do jogo.<n>Agora procure a cidade de Port Royale em uma ilha ao norte e clique com o botão direito na cidade com seu comboio selecionado."
"0x2ee8bc00" = "Uma rota é traçada e seu comboio parte.<n>Ao clicar com o botão direito em Port Royale, você a selecionou como destino do seu comboio.<n>Se o comboio estiver demorando muito para chegar à cidade, você pode simplesmente acelerar o jogo pressionando a barra de espaço (configuração padrão). "
"0x2ef566b4" = "Teclado"
"0x2ef8f665" = "Bem-vindo a %1,<n><n>Gostaria de lhe dar alguns conselhos para que você encontre seu caminho mais rapidamente na região ao redor de %2, e possa ajudar minha nação a expandir esta e outras cidades.<n>Tenho certeza de que você já conhece as informações básicas sobre cidades com governador: elas precisam de um fornecimento constante de mercadorias coloniais para exportação à Europa. Ao mesmo tempo, essas cidades geralmente oferecem uma variedade de mercadorias de luxo, que podem ser vendidas com bom lucro a outras cidades.<n>Só mais uma coisa: talvez lhe interesse saber que os governadores atribuem missões de tempos em tempos. No entanto, você não pode aceitar missões até alcançar o posto de grumete.<n><n>%3 %4, governador de %5"
"0x2efebfdd" = "Como seu comboio chegou a Port Royale, agora você pode entrar na cidade. Basta clicar no símbolo da cidade (com as casinhas)."
"0x2efebfde" = "Você agora vê novamente a familiar vista da cidade, mas desta vez é Port Royale. Você pode se movimentar por qualquer cidade onde tenha comboios ou edifícios.<n>Procure o estaleiro no porto e clique nele, pois queremos comprar um novo navio."
"0x2efebfdf" = "O estaleiro agora é exibido na janela de seleção onde o comboio estava.<n>Dê uma olhada no estaleiro clicando nos botões à direita da exibição do estaleiro.<n>Depois volte à exibição “Comprar navio” e observe os navios disponíveis.<n>Compre o navio que quiser."
"0x2efebfe0" = "Parabéns! Você comprou seu primeiro navio.<n>O navio será entregue ao porto da cidade.<n>Agora saia do estaleiro e clique nas águas do porto. A janela de seleção agora exibe os navios individuais no porto.<n>Clique no seu novo navio."
"0x2efebfe1" = "Isso exibe os dados do navio, que você já viu no estaleiro.<n>Antes de poder fazer qualquer coisa com um navio individual, você deve adicioná-lo a um comboio.<n>Para isso, selecione novamente seu comboio."
"0x2efebfe2" = "Agora você quer dizer ao seu comboio para interagir com o porto.<n>Clique com o botão direito no porto.  "
"0x2efebfe3" = "Abre-se uma janela de Transferência, na qual você pode adicionar navios individuais ao comboio.<n>Para isso, clique no navio isolado à esquerda e arraste-o até o comboio, para que o comboio passe a ter dois navios.<n>Depois feche novamente a janela de Transferência com o botão “X” à direita."
"0x2efebfe4" = "Você também pode montar outro comboio com um novo navio contratando um novo capitão na estalagem.<n>No entanto, não pode fazer isso no momento porque seu posto não é alto o bastante.<n>Agora selecione a lista de navios do comboio. Este é o segundo botão."
"0x2efebfe5" = "Agora você tem um comboio com dois navios no porto de Port Royale.<n>Você pode clicar nos navios da lista de navios do comboio para saber detalhes sobre eles.<n>Agora envie o comboio de volta à sua cidade natal, Cartagena. Para isso, vá à carta marítima clicando no botão com a seta no extremo superior direito da tela. "
"0x2efebfe6" = "Agora encontre a cidade de Cartagena ao sul e envie seu comboio para lá clicando com o botão direito na cidade.<n>Este cenário terminará assim que o comboio chegar à cidade."
