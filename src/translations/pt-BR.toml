"0xcc1709af" = "%1: Hostil"
"0xcc2c64fb" = "Você recebeu a missão de localizar e destruir um dos comboios piratas de Barba Negra.<n><n>Barba Negra tem um esconderijo secreto onde mantém vários comboios, cada um composto por cinco navios totalmente armados. Será uma missão difícil para o comboio que você tem no momento.<n><n>Portanto, você deve primeiro aumentar o poder de fogo do seu comboio. Para conseguir dinheiro suficiente para comprar um navio maior, você pode vender as mercadorias do seu armazém em @T$TOWN$ pelos melhores preços que conseguir. Siga as dicas na janela de Eventos, que indicam onde vender as mercadorias por um bom preço ao norte e a leste de @T$TOWN$.<n><n>Não gaste muito tempo com isso, pois você ainda tem de cumprir a missão do governador depois!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Venda as mercadorias do seu armazém em @T$TOWN$ e aumente seu dinheiro para @g$GoldGoal$."
