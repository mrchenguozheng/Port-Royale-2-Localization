"0x03f2ddbd" = " @A$USER$, venha cá e sente-se, tenho um negócio para discutir com você.<n>Estou tentando comprar @G$Goods$ para @n$HostileNation$. Como sabe, @n$Nation$ e @n$HostileNation$ estão em guerra. De fato, agora é crime em @n$HostileNation$ importar @G$Goods$ de @n$Nation$, e bons preços estão sendo pagos por isso. Então gostaria de perguntar se você se interessaria por um pouco de contrabando?"
"0x03f2ddbe" = " @A$USER$, se interessaria por um pouco de contrabando? Estou aqui em nome de um comerciante de @T$TargetTown$. Devido à guerra, no momento nenhuma mercadoria pode ser transportada das cidades de @n$Nation$ para @T$TargetTown$. O homem que me enviou está interessado em @G$Goods$. Ele pagará @g$Price$ por cada barril que você entregar. O que me diz?"
