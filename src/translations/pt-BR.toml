"0x004b9030" = "Você já sabe que apenas navios de escolta podem participar de batalhas navais. Os navios mercantes derrotados sempre ficam com o vencedor, que pode escolher saqueá-los ou capturá-los.<n><n>Você nem sempre é o iniciador das batalhas navais envolvendo seus comboios. Se um dos seus comboios for atacado por piratas ou por um comboio militar de uma nação em que sua reputação é muito baixa, você pode entrar em combate ou seu comboio pode tentar evitar a batalha. Se quiser evitar uma batalha, seus navios de escolta devem tentar impedir que o inimigo se aproxime demais dos seus navios mercantes.<n><n>Se isso falhar, seus navios de escolta serão capturados e seus navios mercantes saqueados. Se um comboio não tiver navios de guerra, tudo o que ele pode fazer em caso de ataque é tentar evitar uma batalha. Vantagem: os navios mercantes são apenas saqueados pelo inimigo e não capturados.<n><n>Agora faça uma visita ao governador. Ele tem uma nova missão para você. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumpra a próxima missão que o governador lhe atribuir."
