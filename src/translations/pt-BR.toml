"0x1b0a0b6d" = "Você alcançou o posto de “marinheiro”. A partir de hoje, você deve fazer algo para manter sua alta reputação com uma nação.<n><n> Você pode melhorar sua reputação com as nações negociando, doando à igreja, organizando celebrações, destruindo piratas, bem como cumprindo missões e com Cartas de corso.<n><n>Se sua reputação com uma nação não melhorar, ela diminuirá em uma quantidade muito pequena todos os dias. Note que o número de edifícios que você construiu nas cidades de uma nação determina quão baixa sua reputação pode ficar dessa forma.<n><n>Sua reputação influencia tanto os preços comerciais quanto a atribuição de missões nas cidades. Se sua reputação for baixa, você também deve tomar cuidado com comboios militares!"
"0x1b33d8e6" = "Mercadorias não utilizadas podem ser transportadas!"
"0x1b407276" = "Produção"
"0x1b416d15" = "Patrimônio"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "O número de cidadãos (a população menos o número de soldados) em Tortuga deve ser restaurado para @I$Pop$ até @D$EndDate$, no mais tardar, para garantir que todos os negócios tenham um quadro completo de trabalhadores."
