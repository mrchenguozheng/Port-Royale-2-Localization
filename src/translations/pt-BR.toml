"0x080f2b29" = "<ts:20>Você deve saber o seguinte sobre as mercadorias:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Existem cinco tipos diferentes de mercadorias: mercadorias essenciais, matérias-primas, produtos acabados, mercadorias coloniais e mercadorias de importação<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Cada cidade pode produzir cinco mercadorias<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Existem dois tipos de cidade: cidades coloniais e cidades com governador ou vice-rei<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Cidades com governador produzem mercadorias essenciais e produtos acabados. Também recebem entregas regulares de mercadorias de importação da Europa. Portanto, essas cidades são os melhores lugares para encontrar produtos acabados e mercadorias de importação.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Cidades com governador precisam de matérias-primas para produzir produtos acabados. Também recebem mercadorias coloniais. Estas são recolhidas dos comboios de transporte vindos da Europa.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Cidades coloniais produzem mercadorias essenciais, matérias-primas e mercadorias coloniais. Cada mercadoria colonial só pode ser produzida em certas áreas do Caribe. O café, por exemplo, só está disponível no sul e no oeste do Caribe.<n><n>Você deve saber o seguinte sobre os preços:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Quanto maior a demanda por uma mercadoria e menor sua oferta em uma cidade, mais alto será o preço.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Quanto melhor sua reputação em uma nação, mais baixo será o preço pelo qual você poderá comprar mercadorias nas cidades dessa nação.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Você só deve comprar mercadorias nas cidades onde elas são produzidas.<n><n>A maneira mais rápida de ganhar dinheiro:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>compre mercadorias coloniais e matérias-primas em cidades coloniais<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>venda essas mercadorias em cidades com governador e compre lá produtos acabados e mercadorias de importação."
