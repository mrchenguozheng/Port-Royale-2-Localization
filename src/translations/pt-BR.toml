"0xcb2b0709" = "Que calamidade! Você já visitou @F$WifeName$ hoje? Pode poupar o esforço, pois ela se foi. Olhe, encontrei uma espécie de carta de despedida. Ela escreve que está farta de sua vida monótona e que fugiu com um aventureiro. Você deve resgatar minha amada filha!"
"0xcb2b070a" = "O desastre aconteceu e parece que você está no meio dele. Minha filha foi sequestrada por piratas, mas alguém deixou para você uma mensagem com um mapa mostrando a localização de um ponto específico. Parece-me uma armadilha, mas o que devemos fazer? Você tem de resgatar minha filha!"
