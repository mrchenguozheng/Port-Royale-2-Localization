"0xf22d73b9" = "Você precisa de ferramentas para produzir mercadorias coloniais. Da mesma forma, precisa de matérias-primas para produzir mercadorias acabadas. Mercadorias acabadas incluem, por exemplo, corda e tecido. As matérias-primas para elas são cânhamo e algodão.<n><n>Agora que você sabe construir instalações de produção, deve comprar uma licença de construção em uma cidade de governador e construir lá instalações para produzir mercadorias acabadas. No entanto, antes de poder comprar uma licença de construção, você deve ter estabelecido um histórico comercial comprovado com a cidade, o que significa que deve vender mercadorias à cidade quando estiverem em falta.<n><n>Mas cuidado! Se você comprar mercadorias escassas em uma cidade, isso tem um efeito negativo no seu histórico comercial com a cidade! Mercadorias escassas em uma cidade são exibidas em vermelho na janela de Comércio.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Melhore seu histórico comercial em Cartagena para que possa comprar uma licença de construção lá."
