"0x04e5002a" = "Uma greve de trabalhadores foi instigada em Tortuga. Todos os trabalhadores largaram as ferramentas e agora estão em greve (mas ainda geram custos para o seu negócio).<n><n>Sua tarefa é manter estoques abundantes das mercadorias que os trabalhadores normalmente produziriam, para garantir que a greve fracasse e que eles voltem ao trabalho.<n><n>Observação: a cidade produz trigo, tijolos, algodão, açúcar e tabaco. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Os estoques das mercadorias produzidas na cidade devem ser de @a$Amount$ para cada mercadoria até @D$EndDate$."
