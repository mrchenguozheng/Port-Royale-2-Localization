"0xdad6e283" = "Botão  "
"0xdaeb0484" = "Desta vez, você começa o cenário em Cartagena, uma cidade com governador no meio do Caribe.<n>Seu comboio, composto por uma escuna, está no porto.<n>Primeiro você deve armar seu comboio, pois este cenário envolverá batalhas navais.<n>Vá às docas e abra o menu Carga."
"0xdaeb0485" = "Como pode ver, você não tem canhões nem munição a bordo do comboio. Também precisa de tripulação.<n>Embarque a maior tripulação e o maior número de canhões que puder, além de 10x10 de cada um dos três tipos de munição para os canhões.<n>Pode não haver espaço suficiente no comboio, pois canhões são pesados. Nesse caso, você pode vender parte das mercadorias que carregou."
"0xdaeb0486" = "Muito bem! Seu comboio está agora armado e pronto para uma batalha de pequena escala.<n>Por coincidência, o governador de Cartagena tem a missão perfeita para você.<n>Clique no edifício do governador e aceite a missão dele."
"0xdaeb0487" = "Os governadores costumam propor missões que melhorarão sua reputação com a nação deles se forem cumpridas com sucesso.<n>Você também tem direito a pedir Cartas de corso aos governadores ou a exigir resgate por bucaneiros que capturou.<n>Agora use seu comboio para encontrar os navios sobre os quais o governador falou."
"0xdaeb0488" = "Muito bem, você localizou o comboio.<n>Seu próximo passo é preparar o navio para o combate. Para isso, abra a lista de navios do seu comboio e selecione sua escuna. Para declará-la navio de guerra, pressione o botão ao lado do canhão. Você pode então “atacar” o comboio clicando nele com o botão direito."
"0xdaeb0489" = "Esta é a Vista de Batalha Naval de Port Royale.<n>Ela mostra seu navio, e você pode ver os navios abandonados movendo a janela de exibição.<n>Agora desative o modo de pausa e pratique a navegação com o botão direito do mouse. A janela de Eventos exibe a direção do vento e do navio durante as batalhas navais."
"0xdaeb048a" = "Todos os navios envolvidos na batalha são exibidos na parte inferior da tela. Aqui você pode escolher qual munição usar. Selecione as balas de canhão pesadas e afunde um dos navios inimigos.<n>Você pode disparar com o botão esquerdo do mouse, mas só quando seu navio estiver em uma boa posição de tiro. Os alvos são então mostrados em vermelho."
"0xdaeb048b" = "Bom! Aborde o segundo navio.<n>Para isso, clique no botão “Abordar” no canto inferior direito da exibição do navio.<n>Depois avance em direção ao navio inimigo e abalroe-o. Observação: o botão F1 também está ativo durante as batalhas navais."
"0xdaeb048c" = "Normalmente, o inimigo tem tripulação e ocorre uma batalha a bordo do navio entre a sua tripulação e a dele.<n>Quando a batalha termina, todos os navios abordados passam para o vencedor.<n>Agora adicione o navio inimigo ao seu comboio e feche a janela de Transferência ."
"0xdaeb048d" = "Muito bem!<n>Agora envie seu comboio de volta a Cartagena."
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "Um comboio do pirata %1 atacou um comerciante de %2."
"0xdb0108d5" = "Primeiro, compre um novo navio. Vá ao estaleiro e compre um navio com o maior número possível de canhões."
"0xdb0108d6" = "Selecione seu comboio e clique com o botão direito no porto para adicionar o novo navio ao comboio."
"0xdb0108d7" = "Todos os comboios são compostos por navios mercantes e navios de escolta.<n>Se um navio do seu comboio for participar de uma batalha, você deve defini-lo como navio de guerra. <n>Abra a lista de navios do seu comboio para exibir todos os seus navios."
"0xdb0108d8" = "A lista de Navios exibe todos os navios do seu comboio. O status de navio de guerra é mostrado no canto superior direito do navio. Se um símbolo de canhão for exibido, o navio está definido como navio de guerra e participa das batalhas. Clicar nesse canto altera o status diretamente.<n>Mas agora você deve clicar no seu novo navio e selecioná-lo. "
"0xdb0108d9" = "Os detalhes técnicos do navio, como sua capacidade máxima de carga, são exibidos aqui como no estaleiro.<n>Você também pode ver o custo diário de manutenção do navio.<n>Agora converta o navio em navio de guerra marcando o símbolo do canhão."
"0xdb0108da" = "Muito bem!<n>Canhões e marinheiros são sempre divididos igualmente entre os navios de escolta de um comboio.<n>Certifique-se de que seus navios de escolta estejam totalmente armados e com tripulação completa; depois visite o governador e aceite a nova missão que ele lhe atribuir."
"0xdb0108db" = "Agora cumpra a missão que o governador lhe atribuiu. "
"0xdb0108dc" = "Selecione entre seus navios de escolta o navio que deseja controlar na batalha naval.<n><n>Você pode selecionar outro navio de escolta a qualquer momento clicando nele na lista.<n><n>Mas atenção: assim que a batalha começar, cada navio só poderá ser selecionado uma vez!"
"0xdb0108dd" = "Well done! You have destroyed the pirate convoy.<n><n>Now return to the Governor of Cartagena because this is part of your mission.<n><n>Note that your missions are automatically recorded in your log. You can view the details of your mission there at any time if necessary."
