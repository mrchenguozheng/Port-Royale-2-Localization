"0x0f52782d" = "Parabéns! Agora você pode produzir tecido a partir de algodão em Cartagena.<n><n>Como pode imaginar, os custos de produção de tecido dependem em grande parte do preço que você paga pelo algodão. Por esse motivo, você só pode produzir produtos acabados se tiver certeza de poder comprar as matérias-primas a um preço razoável. Alternativamente, você pode produzir as matérias-primas você mesmo.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construa uma instalação de produção de algodão em Santa Marta e negocie para aumentar seu dinheiro para @g$GoldGoal$."
"0x0f5d7735" = "Muito a leste de Charleston ficam as Ilhas Bermudas. Passe bem longe delas! Há dois meses, meu cunhado navegou até lá para explorá-las, mas nunca voltou. Ninguém sabe o que acontece lá, mas uma coisa é certa: um destino terrível espera todos os que ousarem navegar perto demais das ilhas!"
"0x0f5d7736" = "Você ouviu a história mais recente sobre as Ilhas Bermudas? Um comerciante quis usar a rota que passa pelas ilhas para navegar até a Europa, mas nunca chegou lá. Seu irmão saiu à sua procura, mas só encontrou alguns pedaços de destroços ao sul das ilhas."
"0x0f5d7737" = "Outro dia, um marinheiro de Port Royale me contou que recentemente navegaram muito perto das Ilhas Bermudas. Quase chegaram perto demais, pois com os próprios olhos ele viu um enorme monstro se movendo na água. Ele cuspia fogo e fumaça saía de suas longas orelhas. Ai daqueles que ousarem se aproximar deste monstro marinho!"
