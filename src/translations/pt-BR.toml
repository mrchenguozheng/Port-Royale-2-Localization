"0x1f36e96b" = "Um comboio de transporte chegará aqui em breve. Um espião me disse que nosso inimigo planeja atacar esse comboio em sua viagem de volta à Europa. Você pode proteger o comboio no caminho de casa? "
"0x1f36e96c" = "Tenho um problema. Minha esposa quer viajar para a Europa no próximo comboio, para visitar a família. Infelizmente, @n$HostileNation$ soube disso e planeja interceptar o comboio. Você pode garantir uma passagem segura para minha esposa?"
"0x1f36e96d" = "Em breve enviarei documentos importantes para a Europa. Como estamos atualmente em guerra com @n$HostileNation$, não vou correr riscos e quero organizar uma escolta adicional. Você poderia fornecer essa escolta? "
