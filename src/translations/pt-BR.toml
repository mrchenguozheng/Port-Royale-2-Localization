"0xf64f1e5b" = "Estamos em guerra com @n$TargetNation$. Por isso, quero que você afunde ou capture um número específico de navios mercantes. Tudo o que saquear deles será seu; só me importo em enfraquecer a economia de @n$TargetNation$. Posso contar com você?"
"0xf64f1e5c" = "Eu estava me perguntando se você poderia nos ajudar em nossa guerra contra @n$TargetNation$. Gostaria de enviá-lo a uma área específica e encarregá-lo de capturar ou afundar navios lá. "
"0xf651cc3f" = "A Holanda e a Inglaterra fizeram paz, então você não pode mais capturar cidades.<n><n>Você chegou bastante longe neste cenário, mas não teve tempo de capturar cidades suficientes em nome da Holanda.<n><n>Você pode capturar cidades da mesma forma no modo livre. No entanto, primeiro deve ter certeza de que a nação cujas cidades quer capturar está militarmente fraca. Além disso, a nação que quer capturar essas cidades deve estar militarmente forte, e as duas nações devem estar em guerra entre si.<n><n>Observação: normalmente, você recebe um lote de terra no qual pode estabelecer suas próprias cidades sempre que captura cidades para um vice-rei. No entanto, esse recurso está desativado neste cenário."
"0xf65a5a04" = "Agora você pode aumentar sua reputação em %1 atacando navios e cidades inglesas. Isso não diminuirá sua reputação nas outras nações."
"0xf65b6f4c" = "Hoje, o bucaneiro espanhol %1 encontrou um comboio militar inglês e foi morto."
"0xf65b6f4d" = "Hoje, o bucaneiro espanhol %1 encontrou um comboio militar francês e foi morto."
"0xf65b6f4e" = "Hoje, o bucaneiro espanhol %1 encontrou um comboio militar holandês e foi morto."
"0xf662124e" = "O comboio do pirata %1 foi destruído."
"0xf669f78e" = "A frota do tesouro espanhol atracou na cidade de %1"
"0xf67158d8" = "Modo livre"
"0xf680e197" = "%1 está esperando por você no mercado."
"0xf6957b90" = "Navios no porto"
"0xf69c4221" = "Ataque a %1"
"0xf6a84efd" = "É o ano de 1570 e estamos no Caribe. Seu objetivo é subir de um humilde comerciante a um empresário influente. Para ajudá-lo a alcançar o status que deseja, você pode transportar mercadorias e negociar, construir e participar de política e pirataria.<n><n>O cenário a seguir ensinará os fundamentos de como jogar. Como nos outros cenários, isso envolve vários objetivos diferentes. Você deve alcançar todos os seus objetivos para concluir o cenário com sucesso.<n><n>Agora você pode fechar esta janela com o botão Fechar e consultar a janela de Eventos no canto inferior esquerdo da tela.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Siga as instruções na janela de Eventos."
"0xf6bb9f8c" = "Preço"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "Placa de vídeo"
"0xf6c77503" = "O esconderijo do pirata %1 foi descoberto. Qual aventureiro heroico se atreve a atacar e destruir o esconderijo?"
"0xf6ec5ddc" = "Coisas estranhas estão acontecendo em Tortuga. Devido a uma série de eventos ocorridos no passado, quase nenhum comerciante se atreve a pôr os pés na cidade. Sua tarefa é apoiar Tortuga o melhor que puder, abastecendo-a com mercadorias.<n><n>Mas seu capital inicial não é exatamente espetacular. Você tem @g$StartGold$ em dinheiro disponível. Ainda assim, você tem um comboio mercante bem equipado no porto e alguns estoques de mercadorias.<n><n>Seu primeiro objetivo é aumentar seu dinheiro para @g$GoldGoal$. Conclua esta tarefa o mais rápido possível, mas não pode levar mais de 40 dias.<n><n>Um conselho: em hipótese alguma venda seus navios. No entanto, você pode fazer empréstimos.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumente seu dinheiro para @g$GoldGoal$ até @D$EndDate$."
"0xf70feddb" = "Você está de volta ao porto de Cartagena e seu comboio, o “Santa Maria”, está selecionado.<n>Como pode ver, o comboio já tem algumas mercadorias: algodão, carne e cacau.<n>Agora encontre as docas no porto e clique nelas, porque você quer vender as mercadorias."
"0xf70feddc" = "Nas docas, você pode negociar tanto entre a cidade e seu armazém quanto entre a cidade e seu comboio.<n>Agora você pode ver quais mercadorias a cidade tem e quais mercadorias seu comboio tem. Use as setas para comprar e vender (os preços são mostrados nas setas).<n>Agora venda seu algodão."
"0xf70feddd" = "Você deve ter notado como o preço do algodão caiu quando vendeu um pouco.<n>Isso acontece porque o preço é determinado pela oferta e pela demanda na cidade.<n>Vender as mercadorias satisfaz a demanda e o preço cai. Se você comprar uma mercadoria, o preço dela sobe.<n>Agora compre @a$SubGoal$ de trigo."
"0xf70fedde" = "Notou como o preço do trigo acabou de subir? <n>Observe, porém, que o preço depende não apenas da oferta, mas também da sua reputação na cidade.<n>Clique no botão com o edifício no canto inferior direito da janela de Comércio."
"0xf70feddf" = "Agora você pode negociar entre seu armazém e a cidade.<n>Em toda cidade em que quiser montar a produção de uma mercadoria, você deve primeiro construir um armazém. Na sua cidade inicial, você sempre já possui um armazém.<n>Agora venda todas as mercadorias que você tem no armazém."
"0xf70fede0" = "Você tem três botões com os números 1, 10 e 100 no topo da janela de Comércio, para negociar quantidades maiores de mercadorias mais rapidamente. Clique no botão 10 e observe como os preços mudam.<n>Não faz diferença comprar 10 x 1 mercadoria ou 1 x 10 mercadorias: o preço total é sempre o mesmo. Agora compre @a$SubGoal$ de rum."
"0xf70fede1" = "A coluna na extrema direita do menu de comércio mostra os preços médios das mercadorias que você comprou. Como você quer vender as mercadorias com lucro, precisa encontrar uma cidade onde se pague um preço mais alto.<n>Agora abra a transferência entre o navio e seu armazém clicando no quarto botão (com o guindaste) no canto inferior direito."
"0xf70fede2" = "Nesta janela, você pode mover mercadorias entre seu comboio e seu armazém. Agora carregue no comboio as mercadorias restantes do seu armazém, pois você quer vendê-las em outra cidade.<n>Em seguida, feche a janela de Comércio clicando no botão marcado com “X” no canto inferior direito."
"0xf70fede3" = "Agora vá para a carta náutica e viaje com seu comboio para Santa Marta. Não entre em Santa Marta, mas clique com o botão direito na cidade assim que o comboio chegar."
"0xf70fede4" = "Isso abrirá a janela de Comércio de Santa Marta.<n>Portanto, você não precisa entrar em uma cidade para negociar lá.<n>Agora venda todas as mercadorias que você tem a bordo do comboio.<n>Depois feche a janela de Comércio."
"0xf7110875" = "Tem certeza de que deseja excluir o jogo salvo?"
"0xf725f22c" = "Seu comboio está agora em Santa Marta. Clique no nome da cidade para exibir as informações da cidade.<n>Você pode fazer isso na carta náutica ou entrando na cidade."
"0xf725f22d" = "As informações da cidade mostram as mercadorias produzidas nela.<n><n>Sua relação com a Espanha também é exibida: essa relação é amigável! Isso significa que você receberá os melhores preços possíveis na cidade.<n><n>Agora feche esta janela e dê uma olhada pela cidade."
"0xf725f22e" = "Agora clique no símbolo de Habitantes sob o nome da cidade, à esquerda da tela, para exibir o estoque de Santa Marta."
"0xf725f22f" = "Isso mostra a quantidade de mercadorias em estoque e a quantidade consumida na cidade. Naturalmente, o nível de consumo depende da população da cidade.<n>O consumo indica quantas mercadorias podem ser entregues regularmente. Agora feche a janela de Estoque."
"0xf725f230" = "Agora tente fazer alguns negócios lucrativos.<n>Abra a janela de Comércio e compre o máximo de algodão, açúcar e cacau que seu comboio puder transportar, pois essas mercadorias são produzidas nesta cidade.<n>Depois volte a Cartagena e venda essas mercadorias com lucro."
"0xf725f231" = "Você acabou de receber duas mensagens com dicas para negociar com sucesso.<n>Abra o registro para ler as mensagens.<n>"
"0xf725f232" = "Venda o máximo de mercadorias que puder acima do preço médio e compre novas mercadorias. <n>Observação: os preços das mercadorias escassas em uma cidade são exibidos em vermelho. Você sempre obterá bons preços por essas mercadorias.<n>"
"0xf725f233" = "Cidades de governador como Cartagena recebem mercadorias importadas da Europa.<n>Normalmente, você pode vendê-las com lucro em cidades coloniais, como Santa Marta, Maracaibo ou Gibraltar.<n>Agora negocie por conta própria por um tempo.<n>Seu objetivo é ganhar @g$GoldGoal$ em dinheiro com o comércio."
"0xf7346191" = "Comerciante de %1"
"0xf73619d7" = "O esconderijo pirata ficou conhecido"
"0xf7370c4b" = "%1,<n>consigo pensar em muitas pessoas que preferiria ver. Temos negócios a tratar? Entre, se for necessário."
"0xf73bf67d" = "Vá para a visão da cidade de Cartagena.<n>Normalmente, você precisa ter um comboio ancorado no porto para entrar em uma cidade. No entanto, você tem um armazém em Cartagena e pode entrar nessa cidade quando quiser.<n>Clique no estaleiro de Cartagena."
"0xf73bf67e" = "No estaleiro, compre um navio pequeno. Não gaste muito dinheiro, pois precisará guardar algum para negociar e para manter seu navio."
"0xf73bf67f" = "No cenário anterior, você aprendeu a adicionar navios a um comboio clicando com o botão direito no porto.<n>Agora, porém, você deve montar um novo comboio contratando um capitão na estalagem.<n>Encontre a estalagem (localizada no centro da cidade) e clique nela."
"0xf73bf680" = "Capitães sempre podem ser encontrados na estalagem. Se houver um capitão hospedado na cidade, isso será indicado pelo terceiro botão no menu da Estalagem.<n>Se você tiver outros navios ou comboios no porto, deve dizer ao capitão exatamente onde ele será empregado.<n>Especifique que ele deve comandar seu novo navio."
"0xf73bf681" = "Parabéns! Você formou seu primeiro comboio! Sua próxima tarefa é aumentar sua riqueza para @g$GoldGoal$. Você pode verificar sua riqueza a qualquer momento em “Êxitos” no registro.<n><n>Boa sorte!"
"0xf73dab55" = "Obrigado por cumprir a última missão que lhe dei."
"0xf73dab56" = "Gostaria de agradecer por cumprir minha última missão."
"0xf73dab57" = "Sou grato pelo seu apoio."
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "Você começa sua carreira com <o:0xFFF2FAAD>%1<o> moedas de ouro e uma <o:0xFFF2FAAD>pinaza<o> (60 toneladas, máx. 8 canhões)."
"0xf7534d8f" = "Quando você transporta colonos para uma cidade que precisa de trabalhadores, os colonos agradecem pagando uma passagem ao desembarcar.<n><n>Uma pequena quantidade de ferramentas é sempre necessária para produzir mercadorias coloniais como cacau. Se essas ferramentas não estiverem disponíveis, a produção para. Mais tarde, quando souber um pouco mais sobre preços e quantidades, você poderá instruir o armazeneiro a comprar ferramentas regularmente na cidade. No entanto, por enquanto você deve comprar as ferramentas pessoalmente, para maior segurança.<n><n>Esta é sua próxima tarefa. Depois nada o impedirá de produzir cacau.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produza cacau e acumule um estoque de @a$AmountGoal$ em seu armazém."
