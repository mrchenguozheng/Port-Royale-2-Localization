"0xe6d9252f" = "Então você é o famoso %1! Eu imaginava você muito mais alto, por todas as histórias que ouvi sobre você. Mas isso não o torna menos interessante! Venha aqui e me conte suas aventuras! Meu pai, o governador, já falou tanto de você."
