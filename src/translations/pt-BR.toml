"0xcd01da76" = "Você começa o jogo com o posto de Marinheiro na cidade do governador espanhol de @T$TOWN$, onde já possui um armazém. Também tem no porto um comboio com dois navios armados, mas sem marinheiros.<n><n>O primeiro objetivo deste cenário é visitar o governador de @T$TOWN$ e aceitar sua missão. Ele está tendo problemas com o notório pirata Edward Teach, mais conhecido como Barba Negra, e quer a sua ajuda.<n><n>Importante: neste cenário, as nações estão em paz. Isso significa que você nunca deve atacar um comboio de qualquer nação.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visite o governador de @T$TOWN$ e aceite a missão que ele lhe atribuir."
