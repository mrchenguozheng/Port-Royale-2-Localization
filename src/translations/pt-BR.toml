"0x20574fcc" = "%1, você capturou a amada cidade do meu pai para %2! Não quero mais nada com você. Espero nunca mais vê-lo. Saiba que você nunca significou nada para mim e que não dedicarei um pensamento a você no futuro.<n>Espero sinceramente que, mais cedo ou mais tarde, você receba o castigo que tanto merece.<n><n>%3"
"0x20574fcd" = "%1, ao realizar a anexação para %2, você forçou o vice-rei a se mudar para a amada cidade do meu pai, que agora deve retornar à Europa.<n><n>Não quero mais nada com você. Espero nunca mais vê-lo. Também quero que saiba que eu sempre me interessei muito mais pelos comerciantes da estalagem do que por você. Você nunca significou nada para mim e será a última coisa na minha mente de agora em diante.<n><n>Espero sinceramente que, mais cedo ou mais tarde, você receba o castigo que tanto merece.<n><n>%3"
"0x2065f070" = "Veja bem. Acabei de receber uma mensagem do meu embaixador informando que %1 nos fez uma oferta de paz inesperada. Isso significa que provavelmente faremos a paz ainda hoje. <n><n>Portanto, não posso mais lhe atribuir uma missão para capturar uma cidade."
"0x207295a1" = "Já existe uma rota comercial com o nome “%1”.<n><c>Quer sobrescrevê-la?"
"0x2077407d" = "%1,<n>fico contente que tenha vindo. Entre e verei se tenho algo para você."
"0x207a9d35" = "O comandante da guarda da cidade chama seu capitão do alto da muralha, pedindo que ele cancele a batalha e lute em duelo com ele. Para evitar mais perdas, seu capitão concorda."
"0x207b620f" = "Depois que suas tropas destroem o portão da cidade, elas são confrontadas pelo comandante da guarda da cidade. Ele desafia seu capitão para um duelo."
