"0xd07dbe34" = "Os fatores mais importantes que influenciam a qualidade de vida em uma cidade são o suprimento e a variedade de mercadorias disponíveis. No entanto, você não precisa garantir o suprimento de todos os tipos de mercadorias para manter os habitantes felizes.<n><n>As mercadorias de uma cidade podem ser divididas em cinco grupos: mercadorias essenciais, matérias-primas, produtos acabados, mercadorias coloniais e mercadorias importadas. Elas são listadas nessa mesma ordem na janela de Comércio. Um suprimento suficiente de duas a três mercadorias em cada grupo garantirá uma boa qualidade de vida na sua cidade. <n><n>Você acaba de receber uma mensagem sobre a qualidade de vida nas cidades. Pode exibi-la no diário.<n><n>Como sua cidade ainda é pequena, é especialmente fácil alcançar uma boa qualidade de vida, pois os cidadãos de cidades pequenas não são muito exigentes. Isso significa que você não deve ter problemas para alcançar seu objetivo. No entanto, uma cidade com menos de 2.000 habitantes não pode subir acima do status “auge”.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Garanta que sua cidade tenha um suprimento de cinco barris de cada mercadoria."
