"0x0d58ea99" = "O bucaneiro %1 %2 raptou %3 trabalhadores e suas famílias. Muitos negócios na cidade já não operam com capacidade total."
"0x0d750c45" = "comboios de %1"
"0x0d919a5a" = "%1,<n>você sabe muito bem que, em circunstâncias normais, eu lhe mandaria para o inferno, mas em tempos desesperados como estes, eu venderia minha alma ao próprio diabo.<n><n>Então entre, tenho algo para lhe dizer."
"0x0d9c1799" = "Sua tarefa é garantir que o status da cidade de @T$TargetTown$ caia para “Recessão” até @D$EndDate$. Você tem duas opções:<n><n>Atacar a cidade e pilhar todas as mercadorias para provocar o status “Recuperação”. O status da cidade continuará então a cair devido à escassez de mercadorias.<n><n>Ou cortar o fornecimento de mercadorias à cidade, interceptando comboios mercantes. Observação: se você apenas saquear um comboio e não o capturar, sua reputação com a nação em questão sofrerá muito menos."
"0x0d9c179a" = "Bom! Estou lhe atribuindo a missão de fazer a cidade de @T$TargetTown$ cair em estado de “Recessão”. Você tem até @D$EndDate$.<n><n>Para alcançar seu objetivo, você deve interceptar todos os comerciantes que visitam a cidade, para que ela não receba mais mercadorias e seu status comece lentamente a cair.<n><n>No entanto, há uma maneira de fazer isso acontecer mais rápido. Trata-se de atacar e pilhar a cidade. Seu ataque fará o status cair rapidamente para “Recuperação”, e a consequente escassez de mercadorias na cidade fará com que ele caia ainda mais, até que a cidade esteja em “Recessão”."
