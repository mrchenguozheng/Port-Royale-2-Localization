"0xdcba5843" = "Que bom vê-lo, @A$USER$, pois preciso da sua ajuda. Certa vez servi sob o pirata @P$PirateName$. No entanto, caí em mim e fiz um acordo com o governador de @T$TargetTown$. Infelizmente, meus antigos companheiros souberam disso e colocaram um preço pela minha cabeça. Você pode me ajudar e me levar a @T$TargetTown$?"
"0xdcba5844" = "Ouvi dizer que se pode confiar em você, @A$USER$. Estou a serviço do governador de @T$TargetTown$ e preciso vê-lo com urgência para lhe entregar informações altamente sensíveis. Infelizmente, certas partes insistem em me impedir de chegar a @T$TargetTown$. Por isso, pergunto se você pode me conceder passagem segura."
"0xdcba5845" = "Oh, sou perseguido pelo infortúnio. Há várias semanas, encontrei um navio do notório pirata @P$PirateName$. No entanto, o capitão desse navio devia ser muito inexperiente, pois conseguimos afundá-lo quase sem esforço.<n>Infelizmente, esse infeliz capitão era o amado sobrinho do pirata @P$PirateName$. Desde que ouviu meu nome, ele vem me caçando. Minha tripulação tomou meu navio e fugiu apavorada, e agora estou encalhado aqui.<n>Você pode me ajudar a chegar a @T$TargetTown$, minha cidade natal?"
