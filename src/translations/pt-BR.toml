"0x0420c2a2" = "<ts:20>Você já sabe comprar e vender mercadorias na janela de Comércio. Aqui estão mais algumas dicas:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>O preço mostrado nas setas depende do tamanho da unidade<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Não importa se você compra ou vende uma mercadoria 10 vezes, ou compra ou vende 10 mercadorias de uma só vez. O preço total é o mesmo.<n><n><g:INTEXT_AUSRUF_800x600.screen>Um preço é sempre mostrado, mesmo que uma mercadoria não esteja disponível. Ele é sempre o preço por unidade, independentemente do tamanho de unidade definido.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Você também pode negociar clicando no símbolo de uma mercadoria. Ao fazer isso, aparece uma pequena janela com uma barra de rolagem. Você pode usar essa barra para especificar quantas mercadorias quer comprar ou vender. O preço unitário e o preço total são exibidos imediatamente."
"0x0424bb9a" = "Crônica"
"0x0436c531" = "Você encontrou um navio muito especial!<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Navio à vela a vapor<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>Nunca em sua vida você viu um navio assim! Parece ser movido não apenas pelas velas de seus dois mastros, mas também por um curioso mecanismo que usa vapor para acionar duas rodas de pás. Aparentemente, isso permite que o navio continue se movendo mesmo sem uma brisa de vento."
"0x044bc6d2" = "Seu capitão venceu o duelo de sabre contra %1. Seus homens começam a procurar o tesouro pirata e encontram %2.<n><n>Você destruiu o esconderijo e encerrou o reinado do pirata %3. "
"0x044bc6d3" = "Seu capitão venceu o duelo de sabre contra %1. Seus homens começam a procurar o tesouro pirata e encontram %2. Embora você tenha destruído o esconderijo e eliminado com sucesso os perigos que ele representava, há indícios de que talvez não tenha destruído todos os navios. Os navios restantes podem procurar um novo esconderijo."
