"0xc9500bee" = "Parabéns! Você alcançou seu objetivo e ganhou mais dinheiro. Também subiu de posto.<n><n>Seu posto é sempre determinado pelo seu patrimônio total. Ele inclui dinheiro em espécie e propriedades, como mercadorias e navios. Você pode verificar sua riqueza a qualquer momento em “Sucessos”, no diário. Isso também lhe diz quando alcançará o próximo posto.<n><n>Quanto mais alto seu posto, mais comboios você pode comandar e, portanto, maior o número de cidades onde poderá estabelecer negócios mais tarde.<n><n>Agora que tem um posto mais alto, você deve montar outro comboio e continuar comerciando para aumentar sua riqueza.<n><n>Você pode verificar sua riqueza a qualquer momento posicionando o cursor sobre a barra azul que indica seu patrimônio, exibida abaixo desta janela. <n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Monte um segundo comboio e aumente seu patrimônio total para @g$GoldGoal$."
