"0x293d8c9f" = "Excelente! Sua cidade agora é bastante grande. Em breve, os primeiros comerciantes de outras cidades desembarcarão para negociar mercadorias com sua cidade.<n><n>Mas sua cidade também corre o risco de ser visitada por personagens menos desejáveis, incluindo piratas e bucaneiros de nações com as quais você tem um relacionamento ruim. Sua próxima tarefa é, portanto, contratar soldados e erguer canhões de porto.<n><n>Felizmente, os cidadãos da sua cidade podem se organizar em grande medida. Você só precisa dar algumas instruções e comprar os materiais necessários. Depois disso, não há custos extras.<n><n>Você pode construir canhões de porto no menu de Construção e contratar soldados no seu palácio.<n><n>Lembre-se:<n>Os soldados também precisam de moradia! No entanto, ao contrário dos trabalhadores, os soldados só precisam de um espaço cada.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construa cinco canhões de porto e aumente seus soldados para 300."
