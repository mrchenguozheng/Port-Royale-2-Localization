"0x3353aa4c" = "Excelente! Agora você deve capturar mais cidades inglesas em nome da Holanda. Mas não demore, pois só é possível capturar cidades enquanto Holanda e Inglaterra estiverem em guerra.<n><n>Como de costume, missões desse tipo só podem ser atribuídas pelo vice-rei em Grande Bahama. Antes que lhe sejam atribuídas mais missões de captura de cidades, talvez você precise fazer algo para influenciar as forças e fraquezas militares das duas nações. Você já sabe como fazer isso.<n><n>Como reforço, o governador das Ilhas Turcas lhe forneceu mais três carracas.<n><n>Também há muitos marinheiros e armas disponíveis no porto.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumpra mais duas missões de captura de cidades para o vice-rei holandês antes do fim da guerra entre Holanda e Inglaterra. Você tem até @D$EndDate$. O cenário terminará depois disso."
