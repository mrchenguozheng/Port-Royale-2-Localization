"0x28812f6e" = "Ouvi dizer que você quer se testar como comandante de uma batalha naval. Bem, tenho uma tarefa que pode beneficiar a nós dois.<n>Dois navios abandonados estão flutuando sem rumo no mar neste momento. Quero que você se livre desses navios antes que comecem a representar uma ameaça aos meus comerciantes.<n>Você aceita esta missão?"
"0x28812f6f" = "Agora algo um pouco mais difícil. Um passarinho me contou onde um comboio pirata comandado por @P$PirateName$ está navegando atualmente. O comboio é composto por apenas um navio, então não deve ser difícil para você destruí-lo.<n>Você aceita esta missão?"
"0x28812f70" = "Você já destruiu um comboio pirata de @P$PirateName$. No entanto, geralmente há vários comboios em um esconderijo de piratas, todos comandados por @P$PirateName$. Você só pode eliminar o líder de uma gangue de piratas encontrando e destruindo o esconderijo deles.<n>Outro comboio comandado por @P$PirateName$ surgiu agora. Este comboio é composto por dois navios, então você deve estar bem preparado antes de entrar em combate.<n>Está pronto?"
"0x2883fdae" = "Você pode atacar este esconderijo de piratas pelo mar com um comboio. Primeiro, deve derrotar todos os navios no porto. "
"0x289d1ced" = "consumo diário"
"0x28b1f98d" = "%1 %2 Você também tem uma licença para erguer edifícios e estabelecer negócios em %3 e já possui um armazém na cidade.<n><n>Como você é jovem e inexperiente, só alcançou o posto de grumete. Portanto, ainda não pode comandar mais comboios nem comprar licenças de construção adicionais em outra cidade.<n><n>Seu posto é determinado pelo seu patrimônio total, que inclui dinheiro e propriedades e atualmente soma cerca de %4. Você alcançará o próximo posto assim que seu patrimônio chegar a %5.<n><n><n>Boa sorte!"
