"0x1c7e1413" = "Obrigado!<n> Naturalmente, primeiro você precisará de uma licença na cidade, mas certamente a receberá.<n>É claro que pagarei todas as suas despesas assim que a escola estiver construída. O aniversário da minha esposa é em @D$EndDate$; garanta que a pedra fundamental da escola seja colocada até lá."
"0x1c7e1414" = "Isso é bom. Comece a construir a escola até @D$EndDate$. Então pagarei suas despesas.<n>Não se esqueça de que precisará de uma licença em @T$Town$ se quiser construir uma escola.<n>Não diga uma palavra sobre esta missão à minha irmã."
"0x1c7e1415" = "Obrigado! @T$Town$ não saberá do nosso acordo. Comece a construção até @D$EndDate$. Então pagarei suas despesas.<n>Não se esqueça de que precisará de uma licença em @T$Town$ se quiser construir uma escola."
"0x1c7e9deb" = "%1: Valor do empréstimo %2 reembolsado."
"0x1c83647f" = "Armas e munições:"
"0x1ca41002" = "Cenário concluído"
"0x1ca50773" = "Bom trabalho! Agora você tem um comboio impressionante.<n><n>Sua próxima tarefa não será fácil, pois envolve atacar e derrotar um comboio militar inglês. O governador das Ilhas Turcas lhe forneceu outro navio como reforço. Localize-o no porto das Ilhas Turcas e adicione-o ao seu comboio.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destrua um comboio militar inglês."
"0x1ce621bb" = "Área residencial de um comerciante local"
"0x1ce62aab" = "Missões atuais"
"0x1ce81e5e" = "Tipo de jogo"
"0x1cf07333" = "Muito bem, você alcançou seu primeiro objetivo em @I$Days$ dias. Seu próximo objetivo é aumentar o número de cidadãos que vivem na cidade. Para isso, estabeleça cinco negócios, um de cada tipo permitido na cidade.<n><n>Lembre-se de que apenas um pequeno número de comerciantes visita Tortuga, e você deve garantir que a cidade tenha suprimentos suficientes, para que seu status seja alto o bastante para permitir que você receba novos colonos. Além disso, não se esqueça de garantir que haja espaço de moradia suficiente para os cidadãos.<n><n>Você tem 60 dias para alcançar este objetivo. Quanto mais cedo conseguir, melhor.<n><n>Dica: os soldados fazem parte da população de uma cidade, mas não contam como cidadãos! Você só pode aumentar o número de cidadãos em uma cidade criando empregos.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Estabeleça cinco negócios diferentes em Tortuga e aumente o número de habitantes para 1.500 até @D$EndDate$. Não se esqueça de fornecer espaço de moradia suficiente! É necessária uma área residencial para cada negócio."
"0x1d01f111" = "Sons"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>O navio que afundou aqui devia estar sob o comando de um capitão muito experiente. O baú não contém ouro, mas você encontra um diário cuidadosamente guardado pertencente ao capitão @L$RandLName$. Como resultado, a experiência do capitão do comboio @C$Convoy$ aumenta em dois pontos."
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>O baú do tesouro está vazio, mas servia de boia para uma corda. Não muito abaixo da superfície, você descobre um esconderijo com canhões. Sua tripulação leva o máximo possível desses canhões a bordo."
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Um grande número de barris de rum está flutuando nas águas ao redor. Seus homens recolhem o máximo que seu comboio pode transportar."
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Seu comboio encontrou um grande baú de madeira. Ele é imediatamente trazido a bordo e aberto. Finalmente um verdadeiro tesouro, pensa o capitão ao vislumbrar os @g$Gold$."
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Um baú de madeira velho e quase completamente apodrecido flutua na água. O que quer que tenha contido, nada resta agora além de um cheiro repugnante. Apesar disso, o moral da sua tripulação aumenta, porque a busca pelo tesouro finalmente chegou ao fim."
"0x1d19d29c" = "Licença de construção em %1"
"0x1d6d7bd9" = "e o porto é fortemente defendido."
"0x1db06b05" = "Encontrar o pacote"
"0x1db7f908" = "Infelizmente, você não teve tempo suficiente para ganhar @g$GoldGoal$ em dinheiro.<n><n>Venda as mercadorias do seu armazém em Tortuga nas cidades onde elas estão em falta e fique atento a mercadorias que possa comprar a um bom preço.<n><n>Você também pode obter um empréstimo com o tesoureiro em Tortuga."
