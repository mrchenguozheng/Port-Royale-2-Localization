"0x0f1ade15" = "Agora você deve criar empregos na cidade e construir áreas residenciais.<n><n>Como os colonos só querem ficar na sua cidade se encontrarem trabalho lá, primeiro construa quatro instalações de produção. Decida que tipo de instalações de produção quer construir. Mas garanta que produzirá apenas mercadorias que possa vender com lucro em outras cidades, porque os custos de produção são altos e você depende do lucro da venda das mercadorias.<n><n>Quatro instalações de produção oferecem empregos para 120 trabalhadores. Como cada um desses trabalhadores faz parte de uma família de quatro pessoas, você deve fornecer moradia para 480 cidadãos, ou seja, quatro áreas residenciais.<n><n>Assim que suas instalações de produção e áreas residenciais estiverem prontas, você pode tentar trazer colonos de outras cidades para a sua própria cidade. Os colonos geralmente esperam por trabalho em cidades com governador. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumente a população da sua cidade para 480."
