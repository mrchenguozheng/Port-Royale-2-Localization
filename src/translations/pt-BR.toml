"0x2e39d24e" = "Vejo que você é um homem rico, %1.<n><n>Normalmente eu lhe pediria um empréstimo, mas infelizmente só posso fazer esse tipo de negócio com comerciantes locais. Portanto, você precisa apresentar uma licença de construção para a minha cidade."
