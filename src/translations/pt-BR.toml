"0x0480889b" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Você encontrou um enorme esconderijo de mercadorias no local descrito pelo náufrago e as levou a bordo."
"0x0480889c" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Você descobre um enorme esconderijo de mercadorias no local descrito pelo náufrago.<n>Infelizmente, seu comboio não tem mais espaço a bordo, então terá de deixar as mercadorias para trás por enquanto."
"0x04825ba0" = "O comboio não pode zarpar porque está atualmente no estaleiro para reparos. Espere até que os reparos terminem."
"0x04b51123" = "Desculpe, receio que não possa mais lhe dar esta missão. Você demorou demais para pensar."
