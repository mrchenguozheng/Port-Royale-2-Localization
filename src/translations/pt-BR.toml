"0x00885bdb" = "Muito bem! Agora você tem uma cidade própria! Ninguém além de você pode construir nesta cidade. <n><n>A cidade já tem alguns edifícios, como as docas, onde você pode negociar, e seu palácio. O resto você deve construir sozinho.<n><n>Navegue com seu comboio até sua cidade. Leve o máximo de madeira e tijolos que puder, pois precisará deles para construir edifícios.<n><n>Primeiro, construa um estaleiro, onde poderá reparar seus próprios navios.<n><n>Observação:<n> Custa muito manter a tripulação dos seus navios de escolta. Você deve dispensar a tripulação, já que não precisa mais dela.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visite sua nova cidade e construa um estaleiro."
