"0xfc64ab0e" = "Agora você pode aumentar sua reputação em %1 atacando navios e cidades francesas. Isso não diminuirá sua reputação nas outras nações."
"0xfc692ef1" = "<n><n>No entanto, se pelo menos um navio do seu comboio sobreviver à batalha, o capitão também sobrevive."
"0xfc71eb4b" = "Que infortúnio me acometeu. Desde o início da guerra com @n$FoeNation$, não consegui acumular mercadorias coloniais suficientes para os comboios de transporte. Você pode me ajudar fornecendo um grande carregamento de @G$Goods$?"
"0xfc71eb4c" = "Desde que entramos em guerra com @n$FoeNation$, seus comerciantes estão proibidos de entregar @G$Goods$ às cidades da minha nação. Agora enfrento uma escassez significativa de mercadorias. Você tem muitos navios e conhece bem os mares. Não poderia me garantir um grande carregamento de @G$Goods$?"
"0xfc72151e" = "Armazém - transferência para comboio"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Por canhões"
"0xfc910833" = "Edifícios residenciais disponíveis"
"0xfc9a5f7d" = "Foi um prazer fazer negócios com você. Bom dia!"
"0xfc9a5f7e" = "As mercadorias foram enviadas para o seu armazém. Bom dia!"
"0xfc9a5f7f" = "As mercadorias foram carregadas no seu comboio. Adeus, %1."
"0xfc9cf623" = "Concluído"
"0xfca882e8" = "Como você sabe, a frota do tesouro espanhol sempre segue uma rota diferente ao recolher tesouros de suas colônias e enviá-los para a Europa. A frota evita emboscadas permanecendo apenas pouco tempo em cada cidade. No entanto, desta vez a Espanha cometeu um erro grave, permitindo que descobríssemos a rota que a frota do tesouro espanhol segue neste exato momento. Suas ordens não poderiam ser mais simples. Destrua todos os navios, até o último!"
"0xfca882e9" = "Estamos em guerra com a Espanha e devemos garantir que a frota do tesouro espanhol nunca chegue à Europa. Felizmente, descobrimos em qual cidade a frota fará escala em seguida. Sabotaremos a frota nessa cidade para que ela tenha de prolongar sua estadia no porto. Isso deve lhe dar tempo suficiente para interceptar a frota e impedir que chegue à Europa. Você aceita esta missão?"
"0xfca882ea" = "Você não recebe oportunidades assim todos os dias! Hoje, um dos meus informantes me contou a rota que a frota do tesouro espanhol segue atualmente. Mas isso não é tudo. Descobrimos que a frota ficará ancorada por mais tempo que o habitual na próxima cidade que visitar. Como estamos em guerra com a Espanha, devemos dar ao vice-rei algo para sorrir e garantir que a frota do tesouro nunca chegue ao seu destino na Europa. Você interceptará a frota pela minha nação?"
"0xfcc82d44" = "Guerreiro de sabre"
"0xfcd6fdec" = "Vejo que você ainda não cumpriu minha última missão. Conclua este trabalho, pois tenho mais tarefas para você."
"0xfcded04c" = "IDM_CONTEST_01_2004_LOG_01_TEXT"
"0xfce1cfd1" = "Receio não ter utilidade para você no momento.<n> Só posso encarregá-lo de capturar uma cidade se uma nação hostil estiver enfraquecida e eu tiver comboios militares suficientes disponíveis para proteger minhas cidades."
"0xfce38f12" = "Comandante da cidade"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "Atmosfera"
"0xfd1be8e3" = "O bucaneiro %1 %2 entrou furtivamente na cidade e destruiu grandes estoques de mercadorias de vários comerciantes locais. O conselho da cidade se recusa a assumir a responsabilidade."
"0xfd1f0281" = "Matérias-primas e produção"
