"0x1be7a5dc" = "Você deve encontrar um pacote. @l$Pos$ Devolva-o para @N$OwnerName$ em @T$TOWN$ até @D$EndDate$. "
"0x1bf425d5" = "Infelizmente, você é inimigo da nação à qual a cidade pertence e, portanto, entrou furtivamente no porto."
