"0xcdf0b227" = "Vários comerciantes se uniram e exigem maior proteção em nossas águas. Para reforçar suas exigências, decidiram em breve parar de abastecer uma das nossas cidades. Você pode intervir para ajudar a mim e aos cidadãos?"
"0xcdf0b228" = "Uma de nossas cidades agora quase não recebe comerciantes de uma semana para a outra, porque se espalhou o rumor de que a peste atingiu a cidade. Você pode me ajudar a abafar o rumor fornecendo mercadorias à cidade?"
"0xcdf0b229" = "A ameaça da peste pairou sobre uma de nossas cidades nas últimas semanas. Para piorar, os comerciantes agora também estão evitando a cidade. Você pode ajudar a sustentar a cidade até a situação melhorar?"
