"0xfb425369" = "Apoio ao design"
"0xfb4be839" = "Excelente! Você destruiu todos os comboios piratas para que nenhum dos piratas possa escapar. Se você destruir todos os comboios de uma gangue pirata antes de atacar o esconderijo deles, levará mais tempo para novos comboios piratas aparecerem no Caribe.<n><n>Agora ataque o esconderijo da mesma forma como atacaria uma cidade: selecione seu comboio e clique com o botão direito no esconderijo pirata. Se alguns navios piratas estiverem ancorados no porto, você deve primeiro atacá-los antes de poder vencer a batalha portuária.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destrua o esconderijo pirata do Barba Negra."
