"0xe84c0654" = "Estou diante de um pequeno problema em @T$Town$. Prometi à minha esposa que cuidaria para que uma escola fosse construída lá. Infelizmente, as relações entre mim e o mestre de obras continuam extremamente hostis. Ele nunca permitiria que eu interferisse nos assuntos da sua cidade. Você não poderia construir a escola para mim?"
"0xe84c0655" = "Eu gostaria que você construísse uma escola em @T$Town$ para aumentar a riqueza da cidade. Na verdade, @T$Town$ não significa nada para mim, mas minha irmã mora lá e simplesmente não aceita que existam cidades melhores."
"0xe84c0656" = "O vice-rei me instruiu a apoiar a cidade de @T$Town$. Portanto, eu teria prazer em pagar por uma escola na cidade. No entanto, o conselho da cidade rejeitou minha oferta; eles não querem que eu interfira e preferem receber o ouro diretamente. Por isso, eu queria perguntar se você poderia construir a escola."
"0xe88ea6ee" = "Por nome do comboio"
"0xe8925b0d" = "Duelo"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>Seu capitão está à esquerda. Você o controla assim:<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Atacar<f:fonts/Tiepolo_bold14x14aaFH.res><n>Para atacar, clique com o botão esquerdo em uma parte do corpo do adversário. Clique em diferentes partes do corpo dele para aumentar suas chances de acertar.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Defender<f:fonts/Tiepolo_bold14x14aaFH.res><n>Assim que o adversário se preparar para atacar, você deve clicar com o botão direito no momento certo para aparar o ataque.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Ataques especiais<f:fonts/Tiepolo_bold14x14aaFH.res><n>Pressione o botão esquerdo do mouse pouco antes de seu capitão voltar à posição inicial após um ataque.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Resistência<f:fonts/Tiepolo_bold14x14aaFH.res><n>Cada ataque reduz a resistência do seu capitão, que se recupera entre os ataques.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Tempo de reação<f:fonts/Tiepolo_bold14x14aaFH.res><n>Quanto mais duelos você vencer, mais rápido precisará reagir."
