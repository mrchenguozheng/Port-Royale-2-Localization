"0xe6490f96" = "É 1676 na cidade do governador holandês das Ilhas Turcas. A Holanda possui sete cidades, cinco das quais são cidades coloniais, uma é cidade de governador e uma é cidade de vice-rei.<n><n>A Inglaterra possui 14 cidades e está em guerra com a Holanda há muito tempo, e continuará por muitos meses. Enquanto essa guerra durar, você deve capturar cidades da Coroa inglesa em nome da Holanda.<n><n>Mas antes de poder atacar qualquer cidade inglesa, você precisa de mais capital e mais armas para seu comboio. Seu primeiro objetivo é derrotar três comboios mercantes ingleses e capturar seus navios.<n><n>Primeiro, porém, você deve obter uma Carta de corso com o governador holandês nas Ilhas Turcas.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Faça uma visita ao governador das Ilhas Turcas e obtenha uma Carta de corso contra a Inglaterra."
"0xe64f1385" = "Muito bom! Você destruiu um dos comboios piratas do Barba Negra. Agora vá ao governador de @T$TOWN$ e receba sua recompensa.<n><n>Ele também tem outra missão para você cumprir.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumpra outra missão para o governador de @T$TOWN$."
"0xe65025c3" = "em 1 cidade"
