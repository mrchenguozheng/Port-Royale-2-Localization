"0x03d3dcd8" = "Ao pilhar a cidade, sua tripulação também descobriu onde a esposa do governador estava escondida e “libertou” a mulher. Naquele momento, ela estava na cozinha.<n> “Não me leve de volta para o governador em @T$TOWN$. Eu nunca o amei, juro!”.<n><n>Quer levar esta mulher com você e devolvê-la ao governador, apesar dos apelos dela?"
