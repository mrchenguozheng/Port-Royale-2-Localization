"0x077030da" = "Parabéns! Você concluiu este cenário com sucesso e agora tem alguma experiência em batalhas navais e ataques a portos.<n><n>Certifique-se sempre de que seus navios de escolta estejam bem armados antes de atacar outro comboio. Naturalmente, você também deve pensar com muito cuidado antes de decidir quais comboios atacar. Comboios de transporte vindos da Europa e comboios militares são sempre muito poderosos, e os piratas às vezes também podem se tornar adversários poderosos.<n><n>Se você atacar comerciantes sem primeiro obter uma Carta de corso do governador de uma nação, isso terá grande influência na sua reputação com todas as nações. Na pior das hipóteses, comboios militares poderosos perseguirão o seu comboio.<n><n>Um conselho: se você capturar um comboio mercante sem afundar seus navios e apenas saqueá-lo, o impacto negativo na sua reputação será muito menor. "
