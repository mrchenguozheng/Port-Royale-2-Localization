"0xdfb9b5b7" = "Excelente! Agora você tem @g$Gold$.<n><n>Cada nação tem comboios militares para defender suas cidades e proteger as águas ao redor delas. Quanto mais cidades uma nação ocupa, mais comboios militares ela precisa para garantir proteção adequada.<n><n>Se uma nação perde um comboio militar, sua força militar fica enfraquecida. Como os comboios militares são bastante agressivos contra as cidades e comboios da nação inimiga durante uma guerra, uma nação pode perder um comboio militar de tempos em tempos. Por isso, comboios são enviados regularmente da Europa para reforçar a força militar de uma nação no Novo Mundo.<n><n>Você pode verificar a força de uma nação em “Nações” na Crônica. Se uma nação for descrita como fraca, suas cidades poderão ser capturadas.<n><n>Agora você deve derrotar comboios militares ingleses suficientes para que a força da Inglaterra seja classificada como “fraca”.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Derrote comboios militares ingleses suficientes para que a Inglaterra seja classificada como “fraca”."
