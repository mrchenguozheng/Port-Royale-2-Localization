"0x0adb3fdd" = "Eu sabia que podia confiar em você. Trata-se da cidade de @T$TargetTown$, que pertence a @n$HostileNation$. Atace a cidade e a saqueie, não me importo, depois procure minha esposa. Não demore, pois só tenho até @D$EndDate$ para pensar.<n><n>Se você ainda não possui uma Carta de corso contra @n$HostileNation$, eu lhe darei uma."
"0x0adb3fde" = "Minha esposa ficará radiante. O poodle Michelle está escondido em @T$TargetTown$. Saqueie a cidade para que pareça uma missão militar e depois procure o cachorro. Você tem até @D$EndDate$.<n>Acredite, não será nenhum prazer rever o cachorro, mas o choramingo da minha esposa não dá sinais de diminuir.<n><n>Se você ainda não possui uma Carta de corso contra @n$HostileNation$, eu lhe darei uma."
