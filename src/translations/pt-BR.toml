"0xf8b3a303" = "O status de uma cidade pode avançar por sete níveis, da pobreza à riqueza. Nos dois níveis mais baixos, a qualidade de vida é tão ruim que os cidadãos deixam a cidade regularmente. Por outro lado, quando uma cidade alcança os níveis “economia florescente”, “riqueza” e “opulência”, seus negócios recebem um bônus de eficiência e sua mão de obra é mais econômica. No nível mais alto, uma cidade até produz seus próprios colonos.<n><n>Você encontrará mais informações sobre os efeitos de cada nível de status nas informações da cidade. Para exibi-las, clique no nome da cidade.<n><n> Um abastecimento suficiente de duas a três mercadorias em cada grupo de mercadorias garantirá uma boa qualidade de vida na sua cidade. O abastecimento de uma mercadoria é suficiente se puder atender a população da cidade por dez dias.<n><n>Observação: o status de uma cidade não melhora da noite para o dia. Leva um tempo até os cidadãos se adaptarem a uma nova situação."
