"0xfd26feb4" = "@N$Name$ pulou ao mar furioso porque você demorou demais."
"0xfd2f55fd" = "Data do jogo"
"0xfd40a541" = "<n><f:fonts/Tiepolo_black14x14aaFHk.res>Perdas<t><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen> %1<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen> %2<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_MANN_800x600.screen> %3<n>(aprox. %4)"
"0xfd4ed860" = "Suas tropas arrombam o portão da cidade e fazem o comandante refém. Quando os soldados da cidade veem isso, eles se rendem.<n><n>O que você quer fazer agora?"
