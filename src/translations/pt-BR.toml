"0x24c12812" = "Parabéns! Você recebeu a missão de capturar cidades!<n><n>Como as cidades podem ser muito bem defendidas, você deve escolher uma cidade inglesa com o mínimo de torres de canhão no porto. A cidade de @T$SampleTown$ é um alvo perfeito.<n><n>Para atacar uma cidade, ative a opção Atacar cidades para seu comboio. Para isso, selecione seu comboio e clique no botão Modo de ataque.<n><n>Você pode atacar uma cidade pelo mar ou por terra. No entanto, só deve arriscar um ataque por terra se seus marinheiros forem em maior número que os soldados da cidade. Nesse caso, você também deve poder armar metade dos marinheiros com cutelos e metade com mosquetes.<n><n>Observação: se houver um comboio militar no porto de uma cidade, você deve derrotá-lo antes de atacar a própria cidade.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumpra sua missão de capturar cidades."
"0x24e18ac4" = "<f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x24ec3366" = "Excelente! Agora seu comboio está armado e pronto para localizar um dos comboios piratas de Barba Negra.<n><n>A janela de Eventos fornece dicas diárias para ajudá-lo a descobrir a localização do comboio pirata, desde que o local esteja no mar. Encontrar piratas pode ser difícil, porque eles sempre voltam ao esconderijo depois de um saque bem-sucedido a um navio mercante.<n><n>Lembre-se de que um comboio pirata pode ter até cinco navios de guerra. Reforce seu comboio se achar que ele não é poderoso o suficiente. Você já sabe como conseguir algum ouro.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Cumpra a missão atribuída pelo governador de @T$TOWN$."
"0x250c7a12" = "Entregue @a$Amount$ até @D$Date$. Você pode entregar as mercadorias no mercado e receberá pagamento imediato de @g$GoldPerBarrel$ por cada <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> de @G$Goods$."
"0x250c7a13" = "Fico encantado. Por favor, entregue @a$Amount$ no mercado. Lá você receberá o pagamento de @g$GoldPerBarrel$ por cada <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> até @D$Date$."
"0x250c7a14" = "Por favor, encontre meu emissário no mercado. Entregue @a$Amount$ de @G$Goods$ até @D$Date$; ele lhe oferecerá um bom preço."
