"0xfda0635d" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>LMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Disparar bordada<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Definir rumo<n><f:fonts/Tiepolo_black14x14aaFHk.res>1,2,3<f:fonts/Tiepolo_bold14x14aaFH.res><t>Selecionar munição<n><f:fonts/Tiepolo_black14x14aaFHk.res>4<f:fonts/Tiepolo_bold14x14aaFH.res><t>Pronto para abordar<n><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Disparar canhões"
"0xfda277f4" = "%1 está cheia e não tem mais espaço para construir um armazém. Se, apesar disso, você quiser se estabelecer nesta cidade, pode tentar convencer um dos comerciantes locais a demolir um de seus negócios.<n><n>Os negócios são demolidos se o preço das mercadorias produzidas na cidade permanecer baixo por um longo período, ou seja, se houver excedente da mercadoria. Para conseguir isso, você deve primeiro começar a acumular o produto. Depois, venda quantidades suficientes do produto no mercado da cidade para derrubar o preço a um nível baixo.<n><n>As mercadorias produzidas são entregues ao mercado da cidade uma vez por dia. Se o preço estiver no mínimo, o negócio reduz sua equipe de trabalhadores. Você pode verificar isso clicando no negócio. Um negócio é demolido quando 30 trabalhadores são dispensados."
"0xfda5ded4" = "A cidade está florescendo devido a uma descoberta de ouro"
"0xfdaf6463" = "Preciso agradecer mais uma vez; você fez muito pela minha nação. Como recompensa, vou lhe dar as terras restantes para sua cidade %1. Agora você possui todo o distrito."
"0xfdb7f907" = "Uma fogueira revela o esconderijo do professor, não muito longe da costa. Seu capitão rema até a praia e é recebido por um velho. Quando o velho vê todo aquele vinho, esfrega as mãos de alegria."
"0xfdb7f908" = "Não muito longe da costa, seu comboio descobre o acampamento de um pequeno eremita. Seu capitão rema até a praia e encontra um velho usando um uniforme de capitão ainda mais velho que ele. Ele avista os barris de rum e fica encantado."
"0xfdb7f909" = "Depois de um tempo, seu comboio descobre um esconderijo em terra. O capitão rema até a praia e olha ao redor. Finalmente encontra o velho mestre e explica o que o traz ali. O eremita aceita a comida."
"0xfdc606cf" = "Caça aos piratas"
"0xfdcdfd58" = " Ele fica feliz em ensinar ao seu jovem capitão todos os seus truques do ofício."
"0xfdcdfd59" = " Ele ensinará ao jovem capitão tudo o que sabe sobre vencer batalhas."
"0xfdcdfd5a" = " Ele fica feliz em ensinar ao capitão tudo sobre a arte da navegação."
