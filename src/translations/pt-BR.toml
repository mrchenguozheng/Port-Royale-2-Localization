"0x0a49c903" = "Parabéns! Você concluiu o segundo cenário com sucesso. Aprendeu a negociar com lucro, alcançou um posto mais alto e montou um novo comboio contratando um novo capitão.<n><n>Observe que, quanto mais experiência têm os capitães, mais caros eles são. Normalmente, eles têm muito pouca experiência no início, mas, com o tempo, todos os capitães ganham experiência em navegação, comércio e combate, dependendo de como você os emprega. Você pode verificar os níveis de experiência atuais dos seus capitães na Visão geral de um comboio. Para isso, clique em um comboio e depois no botão “Visão geral e custos”.<n><n>No próximo cenário, você estabelecerá seus próprios negócios e produzirá mercadorias. "
