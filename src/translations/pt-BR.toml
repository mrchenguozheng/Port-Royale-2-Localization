"0xcff9644a" = "O jogo “Pirata de Um Braço” é um jogo de azar com 32 cartas. Cada jogador coloca sua aposta no pote e recebe 5 cartas, que o outro jogador não pode ver.<n><n>Primeiro, cada jogador deve declarar o número de pontos que acha que pode ganhar, sendo cada vaza ganha igual a um ponto. O jogador que declarar o maior número de pontos abre o jogo e decide o naipe de trunfo. Ele deve então tentar ganhar pelo menos esse número de pontos.<n><n>O jogador que abre joga suas primeiras cartas e o outro deve responder com uma carta do mesmo naipe, se puder. O jogador com a carta mais alta ganha o ponto.<n><n>Se um jogador não puder responder ao naipe, pode descartar qualquer carta ou jogar uma carta de trunfo.<n><n>A sequência das cartas é I, II, III, IV, Pirata, Noiva, Governador, Papagaio. Uma carta de trunfo vence todas as outras.<n><n>O jogador que ganhou o ponto joga a próxima carta. Vocês continuam assim até alguém vencer o jogo.<n><n>Se quem abriu conseguir ganhar o número de pontos que declarou, vence o jogo e leva o pote. Se não conseguir, seu oponente vence."
