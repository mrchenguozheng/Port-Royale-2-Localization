"0x05478cea" = "Minha filha já mencionou que você viria. Ela pode ser muito impetuosa às vezes, sabe. Mas não posso ficar no caminho dos desejos da minha filha, e acredito que você seja o homem certo para ela. Portanto, devo lhe perguntar: você aceita %1 como esposa?"
