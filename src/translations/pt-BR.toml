"0xda93dbe1" = "Muito bem! Isso não foi tarefa fácil! A Inglaterra perdeu agora tantos comboios militares que suas cidades podem ser capturadas. Em grato reconhecimento por seus serviços, o governador das Ilhas Turcas lhe fornece mais quatro carracas.<n><n>Você só pode capturar cidades de uma nação por ordem de um vice-rei. Um vice-rei só lhe ordenará capturar uma cidade se a própria nação dele estiver militarmente forte e a nação inimiga estiver militarmente fraca.<n><n>Infelizmente, a Holanda não é forte o suficiente para capturar uma cidade. No entanto, você pode fazer algo a respeito: visite o vice-rei holandês em Grande Bahama e entregue um dos seus comboios a ele. Ele montará então um novo comboio militar, o que aumentará a força militar da Holanda.<n><n>Se quiser entregar um comboio a um vice-rei, o comboio em questão deve ter exatamente cinco navios e pelo menos 150 canhões.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Ajude o vice-rei a aumentar a força militar da Holanda. Depois aceite uma missão para capturar cidades em nome dele."
