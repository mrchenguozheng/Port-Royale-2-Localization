"0xdb170d27" = "Você acaba de receber algum dinheiro para ajudá-lo a garantir que seu comboio esteja melhor equipado.<n>Seu comboio deve ter três navios totalmente armados e tripulação completa.<n>Não esqueça a munição e lembre-se de definir seus novos navios como navios de guerra. Faça isso agora."
