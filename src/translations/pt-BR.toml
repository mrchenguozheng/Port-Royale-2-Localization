"0x072a9579" = "Sou muito grato por me trazer as mercadorias importadas, pois nós no Novo Mundo não recebemos suprimentos dos comboios de transporte da minha nação há muitas semanas. Como recompensa, apresento-lhe duas escunas comerciais holandesas. Elas o esperam no porto."
"0x0744a699" = "Não posso dizer quantas cidades mais a frota do tesouro visitará. O que podemos afirmar com certeza é que a frota embarca mais ouro a cada cidade que visita. Não me importa quando você atacar, porque pode ficar com o ouro. Tudo o que quero é que a frota do tesouro desapareça. Ela esteve por último em @T$StartTown$, e seu próximo porto de escala é @T$DestTown$, onde ficará ancorada por cerca de cinco dias."
"0x0744a69a" = "Portanto, você deve agir rápido. Ela esteve por último em @T$StartTown$, de onde partiu para @T$DestTown$, onde ancorará por mais tempo que o habitual. Quanto mais você adiar o ataque, mais ouro ela terá a bordo. Você pode ficar com tudo, mas a frota do tesouro nunca deve chegar à Europa."
"0x0744a69b" = "Então está combinado, obrigado. Se minha informação estiver correta, a frota do tesouro partiu recentemente de @T$StartTown$ e está a caminho de @T$DestTown$. Lá ancorará por mais tempo que o habitual. Agora apresse-se e intercepte-a!"
"0x0746253d" = "Se você quer que o maior número possível de comerciantes visite sua cidade, simplesmente não deve abastecê-la com certas mercadorias. O ideal é escolher mercadorias produzidas em cidades próximas, porque os comerciantes levarão em conta a distância da viagem.<n><n>Os comerciantes que visitam sua cidade compram automaticamente as mercadorias abundantes e, portanto, baratas na sua cidade. Você também pode vender diretamente à sua cidade as mercadorias que produziu. Enquanto elas não forem mais caras que nas outras cidades, serão compradas regularmente pelos comerciantes.<n><n>A vantagem é que sempre haverá mercadorias suficientes para seus cidadãos, e você também não precisará se preocupar em transportá-las para outras cidades."
