"0x21117682" = "<n><n>Normalmente você pode devolver uma licença de construção que adquiriu. No entanto, não pode fazê-lo neste caso, porque %1 é a cidade onde você começou o jogo."
"0x21117683" = "<n><n>Quer devolver sua licença?<n>Lembre-se de que não posso lhe pagar nada por ela!"
"0x211c8552" = "Tempo de jogo esgotado"
"0x2137ec23" = "Obrigado. Pagarei preços altos por vinho, ferramentas e especiarias até @D$Date$. Encontre meu emissário no mercado e entregue @a$Amount$ de cada. Ele só aceitará uma entrega completa e pagará na hora."
"0x2137ec24" = "Isso soa bem. Então viaje às cidades dos nossos inimigos e compre mercadorias de importação lá. Entregue @a$Amount$ de cada até @D$Date$ ao meu emissário no mercado de @T$TOWN$; ele pagará mais que o dobro do preço habitual."
"0x2137ec25" = "Você sabe o que seria melhor? Comprar as mercadorias importadas em @n$Nation2$ e causar escassez lá. Entregue @a$Amount$ de cada no mercado. Meu emissário esperará lá até @D$Date$ e lhe pagará um preço alto."
"0x215e37a6" = "Recentemente ouvi por acaso uma conversa em que um comerciante mencionou que um dos seus navios afundou. Ele não se preocupou muito com o navio, pois era apenas um casco velho e frágil. Mas havia um baú especial a bordo."
"0x215e37a7" = "Então temos um acordo. Na última viagem em que me alistei, o capitão perdeu a paciência por causa de um baú, por algum motivo, e simplesmente o jogou ao mar."
"0x215e37a8" = "Um homem que já foi um bom amigo fugiu com um baú caro meu."
"0x2167838b" = "Compra de navio"
"0x21743bf7" = " Preciso dessas coisas! Não sabemos o local exato onde o navio afundou. @l$ChestPos$ Traga-me o baú até @D$EndDate$."
"0x21743bf8" = " Você deve me trazer as coisas até @D$EndDate$. @l$ChestPos$"
"0x21743bf9" = " Recentemente ele me escreveu dizendo que jogou este baú ao mar. @l$ChestPos$ Você deve me devolver minhas coisas! Pode me encontrar aqui até @D$EndDate$."
