"0x0ce1a79e" = "Você está na cidade colonial de Santa Marta. Clique no nome da cidade para exibir as informações da cidade."
"0x0ce1a79f" = "Cidades coloniais como Santa Marta podem produzir duas mercadorias essenciais, duas matérias-primas e uma mercadoria colonial.<n>No cenário anterior, você aprendeu que há uma demanda particularmente alta por matérias-primas e mercadorias coloniais em cidades com governador.<n>Primeiro, você quer produzir a mercadoria colonial cacau.<n>Agora feche as informações da cidade."
"0x0ce1a7a0" = "Como as mercadorias coloniais são enviadas para a Europa a partir de cidades com governador, a demanda por cacau nessas cidades é alta. Essas condições são boas para o seu primeiro negócio. Agora localize e clique no edifício do mestre de obras no centro da cidade."
"0x0ce1a7a1" = "No mestre de obras, você pode solicitar permissão para construir um novo edifício ou devolver sua licença de construção. É claro que não é isso que você quer fazer agora!<n>Veja os diferentes edifícios que pode construir. Você também pode usar os botões à direita da janela do mestre de obras.<n>Clique no botão Plantações de cacau."
"0x0ce1a7a2" = "Agora você pode ver quantos materiais de construção são necessários e quais serão os custos de construção.<n>Também pode ver quantos materiais de construção tem atualmente no seu armazém e quantos precisará comprar da cidade.<n>No momento, você tem materiais suficientes.<n>Posicione o cursor em um terreno de construção disponível e clique com o botão esquerdo."
"0x0ce1a7a3" = "O andaime da instalação de produção de cacau já é exibido e a construção começa.<n>A construção levará alguns dias para ser concluída. Enquanto isso, você deve organizar acomodações para seus novos trabalhadores.<n>Feche o menu de Construção e procure uma área residencial em Santa Marta. "
"0x0ce1a7a4" = "Esta área residencial pertence a um comerciante da cidade. Você pode verificar quantas áreas residenciais são propriedade de comerciantes locais e quantos inquilinos elas têm. Você quer construir sua própria área residencial. Para isso, abra o menu de Construção."
"0x0ce1a7a5" = "Selecione uma área residencial no menu de Construção e observe a exibição dos custos de construção.<n>Talvez você não tenha materiais de construção suficientes armazenados. No entanto, pode comprar na cidade os materiais de que precisar, se houver fornecimento suficiente. <n>Caso contrário, terá de obtê-los em outra cidade.<n>Depois, construa uma área residencial."
"0x0ce1a7a6" = "Um negócio pode empregar 30 trabalhadores. Como há quatro membros em uma família média de trabalhadores, são necessárias moradias para 120 pessoas para cada negócio que você estabelecer. <n>Uma área residencial tem espaço para 120 inquilinos e, portanto, é necessária uma área residencial para cada negócio.<n>Agora feche o menu de Construção e clique na sua nova área residencial."
"0x0ce1a7a7" = "Não há período de construção para uma área residencial, porque os inquilinos vivem em tendas no início.<n>Com o tempo, os próprios inquilinos transformam a área residencial em um edifício considerável.<n>A aparência de uma área residencial depende da idade dela e do status da cidade.<n>Feche a janela da área residencial."
"0x0ce1a80f" = "Como você sabe, seu primeiro edifício em uma cidade deve ser sempre um armazém. Você não pode construir nenhum outro edifício até ter construído este.<n>Você já tem um armazém na cidade onde começou o jogo. Encontre-o e clique nele. Ele é mostrado em azul-claro na tela."
"0x0ce1a810" = "No armazém, você pode ver quais edifícios possui na cidade e quanto custa mantê-los.<n>Também pode ver quanto de aluguel seus inquilinos lhe pagam e quais mercadorias seus negócios produzem.<n>Mais tarde, você poderá dar instruções ao lojista.<n>Dê uma olhada ao redor do armazém e depois feche-o."
"0x0cee08cc" = "a presença militar nesta cidade poderia ser melhor"
"0x0cf75014" = "Fechar"
"0x0cf7abef" = "Clique na sua plantação de cacau. A exibição sempre mostra todas as suas plantações de cacau na cidade.<n>Depois que suas instalações de produção estiverem construídas, você precisará de 30 trabalhadores, ou seja, 30 colonos. Agora saia da plantação, vá às docas no porto e pressione o botão “Carga” (o botão inferior à direita)."
"0x0cf7abf0" = "Here you can see if there are any settlers waiting to be hired in the town or if the town needs new workers. This will be the case as soon as construction of your business has been completed.<n><n>Go to the surrounding governor towns and bring settlers to Santa Marta until your business is employing a full complement of workers."
"0x0d0db040" = "Clique em uma das suas plantações de cacau."
"0x0d0db041" = "Agora você pode ver quanto cacau seu negócio produz por dia e quantas ferramentas isso requer.<n>Agora acumule um estoque de @a$SubGoal$ de ferramentas no seu armazém, porque seu armazém fornece mercadorias aos seus negócios."
"0x0d0db042" = "Ferramentas são mercadorias importadas. Isso significa que você encontrará o fornecimento mais abundante e os preços mais baixos em cidades com governador.<n>Você pode tentar obtê-las em Cartagena, a sudoeste, ou bem a leste, em Margarita."
"0x0d0db043" = "Muito bem!<n>Quanto menor o preço médio das matérias-primas de que você precisa, menores serão seus custos de produção das mercadorias que produz.<n>Agora continue produzindo cacau até ter um estoque de @a$AmountGoal$ no seu armazém."
"0x0d0f1795" = "Julho"
"0x0d0f1877" = "Junho"
"0x0d1098bd" = "%1,<n>você é novo por aqui, não é? Mas já ouvi falar de você, e sua boa fama o precede. Você deveria me visitar de vez em quando, pois sempre há algum trabalho a fazer."
"0x0d23b491" = "Navegue com seu comboio até a cidade de Cartagena e entre na cidade.<n>Um pequeno símbolo circular é exibido abaixo do nome da cidade, à direita da tela. Ele mostra seu histórico comercial em Cartagena até agora.<n>As coisas são um pouco mais fáceis para você neste cenário porque recebeu um bônus.<n>Agora abra as informações da cidade."
"0x0d23b492" = "Em “Histórico comercial”, você pode verificar qual porcentagem da pontuação necessária já alcançou. Se 100% for exibido aqui, você poderá solicitar uma licença ao mestre de obras.<n>Feche as informações da cidade."
"0x0d23b493" = "Os preços das mercadorias escassas em uma cidade são mostrados em vermelho na janela de comércio. Se você vender essas mercadorias, melhorará tanto seu histórico comercial na cidade quanto sua reputação com a nação à qual a cidade pertence.<n>Clique uma vez nas docas para exibir informações sobre o estoque de mercadorias da cidade."
"0x0d23b494" = "Observe quais mercadorias faltam na cidade. Por exemplo, a cidade sempre precisará de açúcar e algodão, porque produz rum e roupas.<n>Mas também há outras mercadorias escassas na cidade.<n>Vá a outras cidades para comprar as mercadorias de que Cartagena precisa e melhore seu histórico comercial."
"0x0d23b495" = "Nada mal! Você aumentou consideravelmente seu perfil em Cartagena.<n>Mas cuidado para não comprar mercadorias escassas em Cartagena! Você pode reconhecer facilmente as mercadorias escassas porque os estoques delas são exibidos em vermelho.<n>Aumente sua pontuação de histórico comercial para 85%."
"0x0d23b496" = "Muito bem! Agora você tem uma pontuação de 85% em Cartagena. Continue com o bom trabalho!<n>Aumente sua pontuação para 100%.<n>A propósito, você acabou de receber uma mensagem sobre “promoção e postos”."
"0x0d23b497" = "Excelente! Agora você negociou o suficiente com Cartagena.<n>Infelizmente, seu posto ainda é marinheiro comum e, portanto, só pode receber uma licença.<n>Para ser promovido ao próximo posto, você deve aumentar seu patrimônio negociando mais um pouco. "
"0x0d23b498" = "Muito bem! Como marinheiro, você pode receber duas licenças de construção.<n>Vá ao mestre de obras em Cartagena e solicite uma licença.<n>Se não tiver ouro suficiente, você deve negociar mais. Não se esqueça de negociar as mercadorias que está produzindo em Santa Marta."
"0x0d2a3b89" = "Manutenção do navio"
"0x0d39b8e2" = "Primeiro você deve construir um armazém em Cartagena antes de poder construir qualquer outro edifício."
"0x0d39b8e3" = "Agora estabeleça duas tecelagens e construa duas áreas residenciais.<n>Se não houver materiais de construção suficientes na cidade, você deve comprá-los em outra cidade e entregá-los no seu armazém nas docas. <n>Não se esqueça de negociar um preço antes de se desfazer do seu precioso ouro!"
"0x0d39b8e4" = "Você deve garantir um estoque de @a$SubGoal$ de algodão no armazém quando suas tecelagens estiverem construídas, para que os novos negócios possam começar a tecer tecido a partir do algodão imediatamente."
"0x0d39b8e5" = "Seu próximo objetivo é produzir seu próprio estoque de @a$SubGoal$ de tecido para o armazém em Cartagena e aguardar a construção das suas tecelagens.<n>Para @a$SubGoal$ de tecido, você precisa exatamente de @a$SubGoal$ de algodão."
