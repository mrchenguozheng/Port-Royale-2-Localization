"0x23f0ed65" = "Estamos em guerra com @n$HostileNation$. Um dos meus capitães recentemente teve uma ideia engenhosa para desmoralizar @n$HostileNation$. Ele sugeriu montar um comboio militar composto por navios do inimigo, para lhes dar uma dose do próprio remédio, por assim dizer.<n>Você parece ser exatamente o homem certo para nos conseguir esses navios."
"0x23f0ed66" = "Como estamos mais uma vez em guerra com @n$HostileNation$, quero montar um novo comboio para proteger minha cidade. Não tenho nenhum desejo de esperar até receber um novo comboio militar da Europa.<n>Infelizmente, meus recursos estão bastante limitados no momento, então tive a ideia de usar os navios do inimigo. Você deseja me ajudar a capturar vários navios do tipo @S$ShipType$?"
