"0x31ed47e7" = "Um sabotador contaminou o suprimento de alimentos em Tortuga. Isso desencadeou imediatamente uma fome na cidade.<n><n>Sua tarefa é acabar com essa fome o mais rápido possível.<n><n>Durante cerca de 2 a 3 semanas, você deve garantir que haja mais mercadorias disponíveis do que consumidas por dia, para o maior número possível de gêneros alimentícios.<n><n>Dica: os alimentos incluem trigo, frutas, milho e carne.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>A fome deve terminar até @D$EndDate$."
