"0x24695110" = "Obrigado. Sou um comerciante de @T$Town$. Como meus perseguidores não sabem onde estou hospedado, certamente tentarão me pegar na minha cidade natal. Comece sua busca lá e mate os caçadores de recompensas. Devo partir daqui até @D$EndDate$, no mais tardar. Se você cumprir a missão antes disso, pagarei @g$Reward$."
"0x24695111" = "Preciso voltar urgentemente para @T$Town$, pois tenho negócios a resolver lá antes de poder desaparecer de vez. Infelizmente, as rotas de acesso a @T$Town$ estão sendo vigiadas por um caçador de recompensas, que você deve matar. Eu o recompensarei com @g$Reward$ se cumprir a missão antes de @D$EndDate$."
"0x24695112" = "Obrigado! Suspeito que um caçador de recompensas esteja vigiando a entrada do porto de @T$Town$.<n>Faremos o seguinte: espalharei o boato de que estou embarcando em um dos seus navios, e então você zarpa para @T$Town$ e vê o que acontece.<n>Avise-me até @D$EndDate$, no mais tardar, que o caminho está livre, e então pagarei uma recompensa de @g$Reward$."
"0x246aece6" = "%1: Fome"
"0x2478c95f" = "Parabéns! Você concluiu este cenário com sucesso e livrou o Caribe da praga de um pirata famoso.<n><n>Ao longo do jogo, esconderijos de piratas surgirão por conta própria. No entanto, o número de comboios piratas depende do sucesso deles. Note que os piratas só querem saquear comboios mercantes e são muito cautelosos com comboios militares. Por esse motivo, evitam águas onde haja comboios militares demais.<n><n>Você também pode caçar piratas e desalojar seus esconderijos no modo livre. "
