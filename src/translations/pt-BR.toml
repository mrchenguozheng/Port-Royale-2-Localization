"0xe10e4380" = "Seu tempo acabou, mas você não alcançou o objetivo final do cenário.<n><n>No modo livre, o vice-rei de qualquer nação pode lhe conceder o presente de uma cidade própria. Mas isso não é fácil de conseguir, pois você sempre precisa capturar cidades para receber um lote de terra, e isso naturalmente prejudicará sua reputação com outras nações.<n><n>Tudo o que você aprender neste cenário sobre desenvolver sua cidade também o ajudará a desenvolver negócios em outras cidades. A principal diferença é que você não precisa se preocupar em defender essas cidades."
