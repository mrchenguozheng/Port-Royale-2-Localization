"0x1ba7362a" = "Navios militares de %1 atacaram um comboio mercante de %2."
"0x1bcad43f" = "Hoje, o bucaneiro %1 %2 entrou na cidade sob nome falso e causou grande agitação entre os trabalhadores. Agora eles se recusam a trabalhar por duas semanas."
"0x1bccfb60" = "Preço total"
