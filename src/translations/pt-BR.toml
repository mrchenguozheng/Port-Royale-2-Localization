"0x273267f2" = "Ah, não posso acreditar. Bêbados roubaram meu belo navio. Encheram-no com garrafas de rum e fugiram. Você pode me ajudar a procurar meu navio?"
"0x273267f3" = "Eu devia saber. Meu filho imprestável, Boris, pegou emprestado meu melhor navio. Agora descobri que ele e os amigos decidiram sair em uma farra. Sem dúvida, encheram o porão de rum e tenho certeza de que nunca mais verei meu navio. Você poderia recuperá-lo para mim?"
