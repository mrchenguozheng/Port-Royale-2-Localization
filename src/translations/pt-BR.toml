"0xdb2d1178" = "As batalhas portuárias são semelhantes às batalhas navais, exceto pelo fato de a batalha ocorrer entre você e torres de canhão muito sólidas, em vez de outros navios.<n>Para vencer uma batalha portuária, você deve destruir todas as torres.<n>Às vezes há navios armados no porto. Nesse caso, você deve lutar contra os navios antes de poder atacar o porto em si."
