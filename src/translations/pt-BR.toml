"0x05716a06" = "Sua próxima batalha será um pouco mais difícil, porque desta vez o inimigo vai resistir. Sua missão é localizar e matar um pirata para o governador.<n><n>Mas primeiro você precisa armar seu comboio para a batalha. Compre um navio, adicione-o ao seu comboio e embarque novas armas e marinheiros.<n><n>Você pode pressionar a tecla F1 a qualquer momento durante a batalha naval para exibir a configuração de teclado e mouse. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arme seu comboio e cumpra a nova missão atribuída pelo governador de Cartagena."
"0x058ca789" = "Visite o governador de @T$TOWN$ e aceite a missão dele."
"0x05980d2c" = "O nível de dificuldade determina os preços das mercadorias e o dano infligido nas batalhas navais.<n><n>Além disso, com um nível de dificuldade baixo, você não precisa de um histórico comercial tão bem-sucedido em uma cidade antes de poder comprar uma licença de construção."
"0x05ae35b1" = "Muito bem! Agora visite o vice-rei espanhol em Port Royale e aceite uma missão para capturar uma cidade francesa.<n><n>Normalmente, você precisa capturar duas cidades antes que um vice-rei lhe conceda um terreno. No entanto, neste cenário, você tem um pequeno bônus e só precisa capturar uma cidade para a Espanha.<n><n>Você decide qual cidade capturar. É uma boa ideia escolher uma cidade com o menor número de canhões de porto. Uma cidade francesa que seria um alvo ideal no momento é @T$SampleTown$.<n><n>Em troca da captura de uma cidade, o vice-rei lhe concederá um terreno. Observação: você não pode falar com um vice-rei a menos que tenha pelo menos o posto de contramestre.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Visite o vice-rei espanhol em Port Royale e aceite uma missão para capturar uma cidade. Depois de cumprir essa missão, você poderá aceitar o presente dele: um terreno."
