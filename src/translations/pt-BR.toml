"0xe1cdc367" = "Você agora conheceu alguns dos controles básicos e sabe como enviar um comboio de uma cidade para outra. Isso é muito importante, pois no começo você viverá transportando e negociando mercadorias entre as cidades.<n><n>Na segunda parte deste cenário, você comprará um navio e o adicionará ao seu comboio existente.<n><n>Mais uma dica:<n><n>Você pode pressionar F1 a qualquer momento durante o jogo para exibir uma página de ajuda que explica a configuração do teclado e do mouse.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Seu comboio com dois navios deve chegar ao porto da cidade de Cartagena."
