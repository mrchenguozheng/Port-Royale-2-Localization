"0x03e1b0eb" = "Que azar! Preciso de estoques regulares de mercadorias coloniais para os comboios de transporte vindos da Europa, mas não temos ferramentas para produzi-las. Não gostaria de me ajudar a abastecer uma cidade com ferramentas?"
