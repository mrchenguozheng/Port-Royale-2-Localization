"0xe67d58b9" = "Ouro descoberto"
"0xe6851da5" = "No cenário anterior, você aprendeu que seu posto depende do seu patrimônio total. Seu patrimônio total inclui seu dinheiro, bem como seus edifícios, navios e mercadorias. Você pode verificar seu patrimônio total a qualquer momento em “Êxitos” no registro.<n><n>Você também pode verificar a barra azul que indica sua experiência, sempre na parte inferior da tela, na exibição do comboio. Quando a barra chega à borda direita da tela, você é promovido ao próximo posto. Você não pode cair abaixo de um posto depois de alcançá-lo.<n><n>Quanto mais alto seu posto, mais comboios você pode comandar e, portanto, maior o número de cidades nas quais poderá estabelecer negócios depois. Depois de alcançar certo posto, você tem direito a um número ilimitado de comboios e licenças de construção."
