"0x30bb44fd" = "Por favor, sente-se, @A$USER$. Meu nome é @N$OwnerName$ e tenho um assunto importante a tratar com você. Por onde começo? Bem, tive uma discussão com minha esposa; ela me acusou de ser infiel, o que obviamente é completamente falso. Enfim, ela me expulsou de casa, e isso não é o pior: ela contratou um caçador de recompensas, então não posso mais nem entrar na cidade. Você pode me ajudar?"
"0x30bb44fe" = "Você parece alguém que sabe comandar um navio.<n>Preciso viajar com urgência para @T$Town$, para entregar documentos que incriminam um dos comerciantes locais. Infelizmente, o comerciante soube disso e agora tenta pôr as mãos nos documentos. Você não poderia encontrar uma forma de me levar a @T$Town$?"
