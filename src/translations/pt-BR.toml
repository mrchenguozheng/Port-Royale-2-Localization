"0xde535352" = "Infelizmente, irrompeu uma peste em Tortuga. Ela assolará a cidade por cerca de um mês. O status da cidade cai bastante e seus cidadãos morrem todos os dias. Muitos cidadãos, apavorados com a doença, estão fugindo.<n><n>Para você, como comerciante, também é interessante que a demanda por roupas e madeira dobra na cidade enquanto a peste assola.<n><n>Sua tarefa agora é garantir o abastecimento da cidade durante a peste e evitar que o número de cidadãos caia.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>O número de cidadãos (habitantes menos soldados) deve ser restaurado para @I$Pop$ até 20 dias após o fim da peste. Isso garantirá que todos os negócios tenham sua equipe completa de trabalhadores."
