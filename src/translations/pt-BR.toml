"0x084340c7" = "Este cenário desafiador gira em torno do comércio, da produção e do abastecimento de mercadorias em uma cidade.<n:25>Coisas estranhas estão acontecendo em Tortuga: quase nenhum comerciante quer visitar a cidade e vários eventos tornam a vida difícil para seus cidadãos. Sua tarefa é salvar a cidade da ruína. No final do cenário, sua pontuação será exibida. Ela depende da sua rapidez e da sua riqueza no final do cenário.<n:25>Neste cenário, você pode usar todas as opções oferecidas no modo livre, mas também terá objetivos específicos a cumprir."
