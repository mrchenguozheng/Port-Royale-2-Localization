"0xdf10406e" = "Muito bem! Sua cidade já cresceu um pouco.<n><n>Assim que sua cidade tiver mais de 1.000 habitantes, ela será interessante para comerciantes de outras cidades, que poderão vir negociar suas mercadorias.<n><n>Os comerciantes costumam visitar uma cidade quando há demanda por certa mercadoria, ou seja, quando faltam alguns produtos na sua cidade.<n><n>Você acabou de receber uma mensagem sobre comércio e produção na sua própria cidade. Para lê-la, abra o registro.<n><n>Seu primeiro objetivo é aumentar a população da sua cidade para 1.000.<n><n>Observação: Para uma cidade ter mais de 500 habitantes, ela precisa ter uma estalagem!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aumente a população da sua cidade para 1.000."
