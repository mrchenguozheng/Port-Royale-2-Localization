"0xcc823e55" = "Recentemente, @n$TargetNation$ atacou uma das nossas cidades. Agora estou planejando minha própria ação militar contra @n$TargetNation$ e me perguntei se você gostaria de participar. Quero que você afunde ou capture comboios militares. Tudo o que saquear deles é seu para ficar; só me importo em enfraquecer @n$TargetNation$. Está interessado?"
