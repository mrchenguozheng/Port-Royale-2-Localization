"0xd44a911d" = "Parabéns! Você agora tem alguma experiência na produção de mercadorias. Também deve ter notado que não é sempre fácil vender com lucro as mercadorias que produziu enquanto mantém seu negócio à tona comercializando outras mercadorias.<n><n>Se você estabelecer negócios em cenários posteriores ou no modo livre, deve sempre garantir que possa vender com lucro as mercadorias produzidas. Produzir mercadorias é caro, e encontrar as matérias-primas nem sempre é fácil.<n><n>Por isso, você deve primeiro acumular suas reservas financeiras por meio do comércio e só então começar muito gradualmente a produzir mercadorias. "
