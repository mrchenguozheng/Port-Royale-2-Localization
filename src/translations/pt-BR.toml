"0x39e32dc6" = "Muito obrigado. A cidade em questão chama-se @T$TargetTown$. Espero poder chegar a um acordo com os comerciantes antes de @D$EndDate$. Até lá, a cidade não pode cair abaixo do status “Auge”, para que eu possa negociar de uma posição mais forte."
"0x39e32dc7" = "A cidade em questão é @T$TargetTown$. Abasteça a cidade com todas as mercadorias de que ela precisa. Farei o possível para silenciar o boato até @D$EndDate$, de uma vez por todas. Até lá, a cidade não pode cair abaixo do status “Auge”."
"0x39e32dc8" = "A cidade em dificuldade é @T$TargetTown$. Seu status não pode cair abaixo de “Auge” antes de @D$EndDate$, caso contrário cidadãos demais deixarão a cidade. Há até o risco de uma praga eclodir lá. Você deve garantir que abastecerá a cidade com mercadorias suficientes a tempo de evitar isso!"
"0x39e32dc9" = "Bom. @T$TargetTown$ é a cidade em questão. Abasteça a cidade com tudo o que ela precisa até @D$EndDate$. Seu status não pode cair abaixo de “Auge”. Devo ser honesto e lhe dizer que é bem possível que a cidade seja atingida por uma praga. Esteja preparado."
"0x39e7361e" = "%1 derrotado"
"0x39e9081a" = "Você descobriu a localização do esconderijo de Barba Negra. Para informações sobre a gangue de piratas, clique com o botão esquerdo no símbolo do esconderijo na carta marítima.<n><n>Atenção: quando você destrói um esconderijo, a gangue de piratas é aniquilada. No entanto, quaisquer comboios piratas que não estavam no esconderijo naquele momento são informados e então estabelecem um novo esconderijo.<n><n>Seu primeiro objetivo é, portanto, destruir todos os comboios pertencentes ao esconderijo. O ideal é ficar à espera de comboios que entram ou saem do esconderijo e atacá-los.<n><n>Você recebeu mais algum dinheiro para apoiá-lo em sua busca.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destrua todos os comboios piratas de Barba Negra que estão no mar. Não ataque o esconderijo dele!"
