"0x03fb5c6a" = "<n><n>%1, vice-rei de %2"
"0x04081363" = "Um dos meus rivais em @n$HostileNation$ roubou meus diários e agora quer enviá-los para a Europa. É fundamental que ele não consiga. Por sorte, consegui subornar o timoneiro do navio que transporta os diários para a Europa. Agora preciso da sua ajuda."
"0x04081364" = "Somos espionados por @n$HostileNation$ há muito tempo. Descobri que todas as informações obtidas foram cuidadosamente registradas e agora serão enviadas de @T$HostileTown$ para a Europa. Quero que você me ajude a garantir que esses documentos nunca deixem o Caribe."
