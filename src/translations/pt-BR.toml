"0xe3922641" = "A agulha desta bússola gira com muita liberdade e se posiciona muito rapidamente. Você nunca viu uma bússola tão precisa.<n>A bússola é trabalhada como uma joia e a parte inferior é adornada com várias gravuras."
"0xe3922642" = "O compasso fica lindamente na sua mão e é muito fácil de usar. Parece ser feito inteiramente de ouro e decorado com um padrão complexo."
"0xe3922643" = "Este sextante proporciona uma marcação precisa mesmo em mar agitado. Partes do sextante são montadas sobre molas, o que ajuda a reduzir vibrações fortes."
"0xe3922644" = "Este instrumento é um binóculo duplo que permite ver ao longe com os dois olhos ao mesmo tempo. Você pode deslizar vidro colorido sobre a lente para proteger os olhos. Uma gravura misteriosa é visível na lateral."
"0xe3922645" = "Este é um relógio de ouro comum, mas menor do que qualquer outro que você já viu. No disco atrás do mostrador, você também nota uma lua que parece girar lentamente. Há também algumas gravuras na parte de trás do relógio."
"0xe3922646" = "Esta lâmpada é semelhante a uma lanterna comum. No entanto, muitos espelhos estão dispostos ao redor do pavio em chamas para que a luz brilhe em apenas uma direção. Usando um dispositivo parecido com um leque sobre a abertura, você pode acender e apagar a luz muito rapidamente."
"0xe3922647" = "Uma régua que desliza para frente e para trás está encaixada em outra régua. Um suporte deslizante de material transparente está preso a ela. Você poderia usar este dispositivo para fazer cálculos simples muito rapidamente."
"0xe3922648" = "Este estranho dispositivo parece uma flecha. As pás fazem com que ele gire assim que você o segura na água. Um pequeno mostrador conta cada volta, permitindo calcular a velocidade do navio com muita precisão."
"0xe3922649" = "Este instrumento consiste em pás giratórias e um mostrador que exibe a velocidade de rotação das pás. Segurando as pás ao vento, você pode ler a direção e a velocidade do vento. O instrumento é meticulosamente trabalhado e marcado com um símbolo desconhecido."
"0xe392264a" = "Embora esta corda deva ter sido exposta à água do mar por algum tempo, parece recém-fabricada. É maravilhosamente lisa ao toque e forma nós muito fortes."
"0xe39226b2" = "Este fólio contém uma infinidade de belas cartas estelares. Uma grande tabela especifica com precisão quando e onde cada estrela nasce e se põe."
"0xe39226b3" = "Um disco redondo, finamente gravado, no qual estão encaixados vários discos redondos menores. Você poderia usá-lo para ver qual parte do céu estrelado está visível no momento, dependendo da data e da hora.<n>Marcas no disco mostram que este instrumento foi usado para determinar a posição de um navio em uma região específica."
"0xe39226b4" = "Quando você gira uma manivela, um grande trompa emite os tons suaves de uma mulher cantando. Exatamente o que os marinheiros precisam depois de semanas no mar."
"0xe39226b5" = "Um grande pedaço de vidro arredondado está montado na ponta de uma haste dourada. Se você o segurar sobre um mapa, as linhas mais finas ficam claramente visíveis mesmo com pouca luz."
"0xe39226b6" = "Esta pequena mesa de metal é feita de latão maciço e é construída de modo que sua superfície permaneça sempre horizontal, independentemente do balanço do navio. O anel externo de metal é gravado com marcas que parecem indicar direções. No entanto, você não consegue identificar a região em que a mesa foi usada."
"0xe39226b7" = "Uma pequena caixa contém um dispositivo ornamentado que pode ser usado para acender um fogo com muita facilidade. Esta caixa está coberta de gravuras misteriosas."
"0xe39226b8" = "Esta âncora é mais decorativa do que prática. Na melhor das hipóteses, poderia ancorar um barco a remo.<n>É muito pesada para o seu tamanho e está coberta de decorações complexas e letras desconhecidas."
"0xe39226b9" = "Este dispositivo é como uma lâmpada de óleo com seu próprio sílex. Se você girar a pequena roda, faíscas voam sobre um pavio e podem acender uma chama mesmo com vento forte."
"0xe39226ba" = "Esta trompa não é tocada com a boca, mas com um dispositivo parecido com uma bomba. Se você pressioná-lo com força, a trompa soa mais alto do que você acreditaria ser possível."
"0xe39226bb" = "Esta carta parece muito diferente das cartas náuticas comuns disponíveis. É muito detalhada e foi desenhada com várias cores. No entanto, você não consegue identificar qual área está mostrada na carta."
"0xe39bb702" = "O comboio não pode zarpar porque há canhões demais a bordo. Venda alguns dos seus canhões ou transfira-os para o seu armazém para não ultrapassar o número máximo de canhões."
