"0x0eb34b66" = "Neste cenário, você aprenderá a estabelecer negócios e descobrirá o que precisa levar em conta ao fazê-lo. Também construirá áreas residenciais para seus novos trabalhadores.<n><n>Em Port Royale 2, você pode construir em qualquer cidade onde tenha comprado uma licença de construção. Quanto mais licenças você tiver, mais cara será a próxima. Você já tem uma licença na cidade onde começou o jogo, então pode começar a construir novos edifícios lá imediatamente.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construa uma instalação de produção de cacau e uma área residencial em Santa Marta."
"0x0ede126a" = "Agora você sabe como funcionam as batalhas navais. Também é possível atacar uma cidade inteira para pilhá-la ou capturá-la em nome de outra nação. No entanto, para isso, você precisa de grandes comboios com navios poderosos. Como pode imaginar, atacar uma cidade prejudicará seriamente sua reputação com a nação em questão, e seus comboios militares o perseguirão a partir de então.<n><n>Alternativamente, você pode atacar um esconderijo de piratas. Os esconderijos de piratas geralmente ficam em locais secretos, mas cada um desses locais se tornará conhecido em algum momento do jogo. Você poderá então atacar um esconderijo de piratas da mesma forma que ataca uma cidade, para destruir toda a gangue.<n><n>A força das defesas ao redor de um desses esconderijos depende de há quanto tempo uma gangue de piratas está à solta e com que sucesso seus comboios saquearam navios mercantes.<n><n>Sua tarefa final neste cenário será invadir um pequeno covil de piratas. Descubra com o governador de @T$TOWN$ onde fica o esconderijo.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Destrua o esconderijo do pirata @P$PirateName$."
"0x0eecc4e8" = "Colônia inglesa"
"0x0eecc4e9" = "Colônia francesa"
