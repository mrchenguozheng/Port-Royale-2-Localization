"0x0d4fbd33" = "Muito bem!<n>Para garantir que sempre tenha matérias-primas suficientes para suas tecelagens, agora você deve estabelecer um negócio de algodão em Santa Marta.<n>Uma instalação de produção pode fornecer matérias-primas suficientes para duas instalações de fabricação."
"0x0d4fbd34" = "Agora garanta que seus negócios em Santa Marta e Cartagena operem a todo vapor.<n>Não se esqueça de que suas tecelagens em Cartagena exigem um fornecimento constante de algodão.<n>Continue negociando e vendendo as mercadorias que produz.<n>Este cenário terminará assim que você aumentar seu dinheiro para @g$GoldGoal$."
