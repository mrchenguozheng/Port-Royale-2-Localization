"0xd4cd0f3d" = "Henry Avery é um exemplo perfeito do pirata bem-sucedido. Ele capturou os navios mais ricos de sua época, conseguiu escapar das autoridades e viveu o suficiente para desfrutar de sua riqueza.<n><n>Os primeiros anos de Avery estão envoltos em mistério. No entanto, sabemos que em junho de 1694 ele era imediato de um corsário chamado Charles, que recebera permissão da Espanha para capturar navios pertencentes à colônia francesa da Martinica, nas Índias Ocidentais. Um dia, liderou um motim e tomou o controle do navio, e a maior parte da tripulação ficou do seu lado. O navio, um corsário rápido com 46 canhões e ideal para o papel de navio pirata, foi rebatizado de Fancy. Em 1695, conseguiu realizar seu maior feito: o saque da frota do tesouro indiana. Como parte de uma aliança com outros piratas, atacou uma frota do tesouro indiana fortemente armada e conseguiu capturar dois navios. Os navios pertenciam ao próprio Grande Mogol e estavam carregados de tesouros inimagináveis. <n><n>Depois de subornar o governador das Bahamas para oferecer proteção aos piratas, Avery pagou a tripulação, que então se dispersou pelos quatro cantos do mundo. Alguns foram capturados na Inglaterra, mas Avery navegou para a Irlanda, onde desapareceu sem deixar rastro. Só podemos supor que continuou a desfrutar de sua riqueza escondido."
"0xd4cd0f3e" = "Um dos piratas mais populares de todos os tempos foi Edward Teach (morto em 1718), conhecido como Barba Negra, cuja marca registrada, como o nome indica, era sua temível barba negra trançada. Com uma tripulação de 300 homens, navegava pelos mares em seu navio, Queen Anne’s Revenge, um navio mercante holandês convertido, e não temia enfrentar os navios de guerra da Marinha Real.<n><n>Durante 18 meses, Teach, nascido em Bristol, causou estragos principalmente no norte das Índias Ocidentais e ao longo da costa da América do Norte. Sempre conseguia refúgio nas Bahamas e na empobrecida Carolina do Norte.<n><n>Outro motivo pelo qual Barba Negra era tão famoso era que correspondia ao estereótipo do bucaneiro terrível, sanguíneo e temperamental: diz-se que aleijou seu artilheiro Israel Hands com dois tiros, sem outra razão além de lembrar ao resto da tripulação quem estava no comando.<n><n>Sua última hora só chegou em 1718, quando o caçador de piratas Robert Maynard localizou sua escuna. Apesar de estar completamente bêbado, Teach lutou como um demônio e só foi derrotado após uma luta amarga. Morreu na batalha, e a maioria dos sobreviventes de sua tripulação foi enforcada."
"0xd4cd0f3f" = "Aqueles que ansiavam por aumentar a riqueza que já possuíam nos primeiros anos da Era das Descobertas descobriram que as plantações de açúcar desenvolvidas desde o início do século XVI, principalmente no Caribe, ofereciam excelentes oportunidades de investimento.<n><n>Esses investimentos rendiam um lucro médio de dez por cento e, nos melhores casos (como em Barbados por volta de 1650), até 50 por cento! Naturalmente, essas plantações exigiam um número enorme de trabalhadores, e por isso centenas de milhares de escravos foram transportados da África para lá. Isso porque o homem branco já havia, a essa altura, quase exterminado a população indígena em muitos lugares. <n><n>Os próprios europeus não suportavam o clima e, além disso, eram demasiado dignos para se envolver nesse tipo de trabalho braçal. Até os donos de plantações preferiam viver em Londres ou Madri e deixar que alguns de seus capangas organizassem o trabalho nas colônias. No século XVIII, a proporção de negros na população de algumas ilhas chegara a 90 por cento!"
"0xd4cd0f40" = "O comércio do “ouro negro” já havia começado no início do século XVI. A fonte preferida de “mercadoria” dos traficantes de escravos era a costa da África Ocidental que se estendia entre o rio Senegal e o que hoje é conhecido como Camarões. Essa área não só era ideal do ponto de vista do transporte, como também possuía uma infraestrutura econômica e sociopolítica estável. Isso significava que os marinheiros não precisavam caçar escravos eles mesmos, mas podiam comprar suas vítimas aos chefes locais ou a outros traficantes.<n><n>Homens jovens entre 15 e 35 anos eram especialmente procurados, pois se destinavam principalmente ao trabalho pesado nas plantações. Aproximadamente um em cada cinco escravos nem sobrevivia à travessia, que podia durar até seis semanas. Alguns morriam em consequência do tratamento bárbaro imposto por seus senhores, enquanto outros pereciam em acidentes no mar. Levando em conta essa alta taxa de mortalidade, os traficantes procuravam tornar cada viagem o mais lucrativa possível, apertando o maior número de escravos que conseguiam em seus navios. Durante semanas a fio, essas criaturas miseráveis ficavam lado a lado como sardinhas em lata, acorrentadas umas às outras, no escuro e com ar mal suficiente para respirar.<n><n>Nessas condições, é quase incrível que alguma delas tenha sobrevivido a essas viagens!  "
"0xd4cd0f41" = "Embora não houvesse escravos brancos na América do Norte e Central, havia muitos europeus que se viam trabalhando em condições que diferiam muito pouco das dos escravos.<n><n>Muitos jovens (predominantemente das classes baixas sem instrução) queriam emigrar, mas não tinham dinheiro para pagar a travessia. Tomavam emprestado, portanto, o dinheiro para pagar a passagem, com o entendimento de que depois quitariam a dívida trabalhando por um certo período em uma plantação de açúcar (ou algo semelhante). <n><n>No entanto, o que parecia um arranjo perfeitamente lógico também tinha uma armadilha: muitos donos de plantações tentavam fazer esses trabalhadores contratados trabalhar o máximo possível durante seu período de emprego. A isso se somava o clima caribenho, que a maioria dos europeus achava tão difícil de suportar.<n><n>Esse sistema de “trabalho sob contrato” também era usado com frequência para condenados expulsos de seus países natais. Os britânicos usaram esse método mais tarde, sobretudo contra os indianos, que forçaram a trabalhar nas colônias africanas."
"0xd4cd0f42" = "À medida que as colônias americanas floresciam, o comércio através do Oceano Atlântico também prosperava. A Grã-Bretanha, a nação marítima mais poderosa desde os tempos da Rainha Elizabeth, tinha grande interesse em controlar a circulação de mercadorias, permitindo assim que a economia doméstica participasse dos lucros comerciais.<n><n>Sob o Lorde Protetor, Oliver Cromwell, o “Primeiro Ato de Navegação” de 1651 decretou que somente navios ingleses podiam ser usados para transportar mercadorias das colônias para a Europa. Essa medida visava principalmente o poder emergente da Holanda e beneficiava a frota mercante doméstica.<n><n>Em 1663, as disposições desse ato tornaram-se ainda mais rigorosas: navios coloniais que desejassem transportar mercadorias para a Europa tinham de escalar em portos ingleses e pagar um pedágio ali. No entanto, essa tentativa de controlar o comércio entre as colônias logo encalhou. Como era pouco provável que o exército britânico vigiasse toda a costa, o resultado foi um florescente comércio de contrabando. <n><n>Foi precisamente esse conflito contínuo com a metrópole a respeito das condições que regiam a exportação e a importação de mercadorias que, especialmente nas colônias da América do Norte, resultou na formação de uma identidade separada entre os colonos de lá e mais tarde se tornaria uma motivação significativa por trás do movimento de independência."
"0xd4cd0f43" = "O início da era colonial trouxe consigo numerosos problemas de saúde, até então em grande parte desconhecidos nas viagens muito mais curtas pelo Mediterrâneo ou ao longo da costa. Uma travessia para as colônias no Caribe e na América do Norte levava de um a dois meses, ou até mais se o navio encontrasse tempestades ou períodos sem vento. As dificuldades a superar não eram, portanto, nada surpreendentes: o fedor de roupas sujas e de higiene pessoal precária, alimentos contaminados e podres, falta de água limpa, ratos a bordo, bem como o desgaste psicológico causado pela monotonia e pela febre de cabine. O terrível espectro do escorbuto pairava sobre todo marinheiro: essa doença, causada pela falta de vitaminas, manifestava-se na perda de cabelo e de dentes e custou a vida de muitos marinheiros. Foi o circum-navegador James Cook (1728-1779) quem primeiro conseguiu tratar essa doença. Ele não só insistia que o navio fosse mantido limpo, como também fornecia à tripulação chucrute e frutas frescas. Quem desembarcasse também tinha de enfrentar doenças tropicais como a febre da água negra, uma das manifestações mais perigosas da malária: essa infecção, cujos sintomas incluem aceleração do pulso, febre, tremores e urina escura, era quase sempre fatal."
"0xd4cd0f44" = "Há anedotas interessantes por trás dos muitos nomes que os navegadores e cartógrafos tiveram de inventar para as novas faixas de terra, rios e povoados. Até o primeiro nome dado pelos exploradores europeus da Era das Descobertas na América conta sua própria história. Cristóvão Colombo batizou a ilha em que desembarcou em 12 de outubro de 1492 de Salvador (“Salvador”). Era uma forma de agradecer ao Senhor por proteger o comboio de doenças e tempestades durante a viagem de ida e, sobretudo, por impedir um motim que ameaçava irromper literalmente no último minuto antes de avistarem terra.<n><n>Nos tempos seguintes, os conquistadores espanhóis escolhiam em geral nomes com conotações religiosas, como “Nombre de Dios” (“O Nome de Deus”) ou “Trinidad” (“Trindade”). Em outros casos, as pessoas se inspiravam na data ou nas observações da paisagem. Por exemplo, marinheiros portugueses batizaram uma baía na costa brasileira que descobriram no Dia de Ano Novo de 1502 de “Rio de Janeiro”, e o nome da cidade de Montevidéu remete à suposta exclamação de Magalhães ao ver a costa pela primeira vez: “Monte vido eu!” (“Vejo um monte!”).<n><n>Também era costume popular entre exploradores batizar faixas de terra e cidades com os nomes de seus governantes, de sua pátria ou da cidade de onde vinham. Isso não só comunicava ao mundo exterior uma declaração clara de posse, como também criava um vínculo com a terra natal mesmo nessas terras distantes.<n><n>Se tudo o mais falhasse, sempre se podia recorrer aos nomes das línguas indígenas (embora, na maioria dos casos, isso não tenha impedido os colonizadores de depois expulsar ou exterminar os próprios nativos).<n><n>Até hoje persiste o mito de que, ao ser perguntado por James Cook como se chamava aquele estranho marsupial, um aborígene australiano respondeu “kangooroo” ou “ganguru”, que supostamente significava apenas “Do que você está falando?”. Mesmo que seja um mito, esse tipo de mal-entendido engraçado certamente deve ter acontecido. <n><n>Provavelmente nos surpreenderíamos ao saber quantos nomes de cidades, montanhas e rios significam simplesmente “bom dia!”, “como?” ou “deixe-me em paz!”..."
"0xd4cd0f45" = "Com o surgimento de um império espanhol que se estendia pelo globo, tornou-se necessário estabelecer autoridades coloniais com poderes suficientes para tratar de assuntos administrativos cotidianos e de quaisquer crises que pudessem surgir repentinamente. Para isso, o título de vice-rei era conferido aos governadores mais importantes das colônias.<n><n>No auge do império mundial, havia dois desses dignitários, na Nova Espanha (México) e no Peru. Os vice-reinados de Nova Granada e do Rio da Prata foram acrescentados durante o século XVIII.<n><n> As funções de um vice-rei (também conhecido como virrey), que ele exercia em conjunto (e frequentemente em conflito) com um conselho administrativo chamado Audiencia, incluíam as tarefas normais de um funcionário do governo: arrecadar e cobrar impostos, garantir que a população obedecesse à lei, organizar as defesas da colônia e assim por diante. Ele também era responsável por proteger a população indígena e pela nomeação de dignitários eclesiásticos e seculares de menor importância.<n><n>Devido à enorme importância econômica e política de suas possessões ultramarinas, a Coroa sempre manteve um olho atento nas atividades de seus vice-reis. Eles eram proibidos de se envolver em quaisquer atividades comerciais extras que lhes renderiam renda adicional. Além disso, a rivalidade entre os vice-reis só resultava na restrição mútua de seu poder."
"0xd4cd0f46" = "Já é fato bem conhecido que os conquistadores europeus sempre atendiam ao chamado da prata e do ouro. No entanto, quase de maior valor eram as especiarias. É difícil imaginar quão monótona deve ter sido a dieta europeia da Idade Média, se pensarmos nos perigos que as pessoas estavam dispostas a enfrentar para obter um pouco de pimenta ou noz-moscada.<n><n>Nesse aspecto, a descoberta da América revelou-se extremamente decepcionante no início. As pessoas notaram com interesse os animais exóticos que Cristóvão Colombo trouxe consigo, alegraram-se com a expansão das possessões de seu país e com as muitas almas que imaginavam ser salvas pela difusão do cristianismo ali. No entanto, as montanhas de ouro mostraram-se bem mais esquivas do que fora prometido. Essas viagens só se tornaram lucrativas dez a vinte anos depois, quando uma verdadeira enxurrada de prata americana começou a chegar à Europa. <n><n>Em uma dessas viagens, Colombo trouxe de volta um tesouro mais precioso que todo o ouro e prata do mundo inteiro: em 4 de novembro de 1492, os nativos presentearam-no com o que ele descreveu como uma maçã que sabia a castanhas. Naquele momento, ele se tornou o primeiro europeu a comer uma batata! A palavra indígena para essa planta era “batate”, e ela sobrevive até hoje no idioma inglês como “potato”.<n><n>Muitas outras coisas que hoje consideramos normais foram trazidas primeiro à Europa por Colombo e seus sucessores: tabaco, tomate, milho e a rede de dormir. Ou, como diriam os nativos americanos: “hamaka” (da qual deriva a palavra inglesa)."
"0xd4cd0fae" = "Desde o momento em que foi anunciada, a descoberta do Novo Mundo inflamou a imaginação do povo da Europa. Que tipo de criaturas poderiam habitar esses territórios inexplorados? Circulavam os rumores mais inacreditáveis: dizia-se que uma ilha fervilhava de canibais, outra de criaturas sem cabeça cujos rostos ficavam no estômago.<n><n>A paisagem sul-americana da Patagônia traduz-se aproximadamente como “terra dos pés grandes”, enquanto o Amazonas deve seu nome a uma horda de guerreiras que supostamente lembraram aos exploradores guerreiras semelhantes da mitologia grega.<n><n>Embora alguns desses rumores tivessem um fundamento factual, outros se baseavam em mal-entendidos e interpretações errôneas, ou em histórias que os próprios nativos americanos simplesmente tinham ouvido em algum lugar.<n><n>No entanto, muitos desses rumores eram simplesmente produto da imaginação fértil das pessoas e, na maioria das vezes, elas só acreditavam neles porque queriam. Isso explicaria por que gerações inteiras de conquistadores procuraram a lendária Fonte da Juventude, o Jardim do Éden e Eldorado, a cidade de ouro. Eram encorajados em suas crenças errôneas pelos nativos americanos, que lhes asseguravam constantemente que tinham ouvido falar de um lugar ou outro, mas que apenas desejavam ganhar tempo para atrair esses brancos gananciosos para o interior e separá-los de seus navios."
"0xd4cd0faf" = "Uma das figuras mais deslumbrantes numa lista de exploradores e conquistadores que incluía muitos outros personagens pitorescos foi o escritor e aventureiro inglês Sir Walter Raleigh (aprox. 1554 – 1618). Ele ganhou destaque pela primeira vez em 1580, quando derrotou uma revolta de rebeldes irlandeses contrários à ocupação inglesa.<n><n>Tornou-se favorito da Rainha Elizabeth I e usou sua influência para financiar uma expedição em busca da lendária cidade de Eldorado, na América do Sul. Apesar do fracasso total de várias expedições em encontrar qualquer coisa de valor, conseguiu manter o apoio de seus financiadores em Londres usando seus poderes únicos de persuasão. Fez-lhes crer que o prêmio final sempre estava logo além do próximo estuário e que ele não poderia desistir agora.<n><n>No entanto, seu crédito acabou por se esgotar. Muitas vezes as pessoas tinham ouvido suas promessas grandiosas apenas para descobrir depois que não passavam de conversa fiada. Raleigh finalmente caiu em desgraça com Elizabeth. Seu sucessor, Jaime I, via esse aventureiro sanguíneo como uma ameaça à sua política externa mais moderada e mandou prendê-lo com bases muito frágeis e condená-lo à morte assim que chegou ao poder. Sua sentença foi comutada (atenção: não foi anulada!) e Raleigh foi encarcerado na Torre de Londres.<n><n>Anos mais tarde, quando o estado das finanças do país convenceu o rei de que era necessário, ele deu a Sir Walter Raleigh permissão para liderar outra expedição à Guiana. Era uma situação absurda: dar a um homem, ele próprio condenado à morte, autoridade sobre a vida e a morte de outros e enviá-lo em busca de ouro! No entanto, essa contradição resolveu-se relativamente pouco depois, pois Raleigh, já então consumido pela febre, viveu para ver sua última expedição terminar em fracasso.<n><n>Ao voltar para a Inglaterra, o rei furioso decidiu que a suspensão da execução de Raleigh, decretada em 1603, deveria agora chegar ao fim. Sir Walter Raleigh foi executado pouco depois.  "
"0xd4cd0fb0" = "Os primeiros encontros entre os habitantes nativos do Novo Mundo e os navegadores brancos transcorreram geralmente em paz. Em muitos lugares, os europeus foram recebidos como deuses. Aqui e ali, essa impressão se baseava em velhos mitos, mas na maioria dos casos os nativos americanos ficaram simplesmente impressionados com os estranhos louros altos que chegavam em “casas de água” (navios) com armaduras cintilantes.<n><n>Colombo, Cortés e todos os outros exploradores ficaram só demasiado contentes em perpetuar essa ilusão, mas os nativos americanos logo se depararam com a realidade brutal: movidos por sua sede insaciável de ouro, a “doença espanhola”, como os nativos a chamavam, os espanhóis abusaram, escravizaram e massacraram populações inteiras. A visão de cavalos, até então desconhecidos na América, e o som dos canhões causaram pânico total, e os que sobreviveram ao massacre logo sucumbiram à varíola, à gripe ou a outra doença importada.<n><n>Intelectuais famosos como Gonzalo Oviedo ou Juan de Sepúlveda tentaram justificar os crimes cometidos pelos europeus com argumentos racistas de arrepiar, que retratavam a raça nativa americana como baixa, ignorante e inferior.<n><n>Os mesmos homens que mandavam queimar cientistas e bruxas na fogueira por causa de suas crenças eram versados na arte de criar relatos chocantes sobre os “costumes bestiais” dos nativos americanos: embora as práticas de idolatria, sacrifício humano e canibalismo não fossem de modo algum imaginárias, passaram a ser usadas pelo homem branco como justificativa geral para impor aos nativos americanos as mais brutais sanções de todo tipo."
"0xd4cd0fb1" = "Como se sabe, a fase inicial da colonização da América foi empreendida pela Espanha e por Portugal. Mais tarde juntaram-se a eles a Holanda e, sobretudo, a Inglaterra e a França. O que é bem menos conhecido é que numerosas expedições espanholas nunca teriam sido realizadas sem seus poderosos financiadores alemães.<n><n>Por volta do ano 1500, a Alta Suábia e, em particular, Augsburgo haviam-se tornado um dos centros mais importantes de comércio e finanças da Europa. Dali, as famílias mercadoras Fugger e Welser exerciam poderosa influência sobre a política mundial. Por exemplo, foi seu amplo apoio financeiro que ajudou o rei Carlos da Espanha a se tornar Imperador da Alemanha em 1519. O rei Henrique VIII da Inglaterra e muitos dos papas tinham prazer em contar Jakob Fugger, o “Rico”, entre seus amigos.<n><n>Naturalmente, esses comerciantes astutos tinham seus próprios motivos ocultos ao conceder esse tipo de apoio. Em troca, esperavam receber privilégios ou permissão para participar da mineração real de prata. Os Welser chegaram até a adquirir temporariamente parte da costa norte da Venezuela, onde fundaram cidades como “Nova Augsburgo” e de onde enviaram várias expedições em busca de tesouros no interior (em sua maioria infrutíferas)."
"0xd4cd0fb2" = "Ao conquistar metade do globo, a Coroa espanhola viu-se capaz de aproveitar oportunidades únicas. Ao longo de vários séculos, até o declínio das grandes culturas americanas dos incas, maias e astecas e a descoberta de enormes depósitos de prata no Peru e no México, no mais tardar, a posição da Espanha parecia inexpugnável. Parece quase absurdo que tenha sido precisamente essa imensa riqueza a precipitar o declínio dessa potência mundial.<n><n>Grande parte dos tesouros enviados de navio de volta à Espanha foi diretamente para os bolsos daqueles comerciantes ao norte dos Pireneus que haviam financiado as viagens em primeiro lugar. No entanto, o restante ainda era suficiente para elevar os níveis de preços na península Ibérica. As pessoas de lá começaram a viver acima de suas posses: numa época em que a capacidade de manter uma corte em grande escala era considerada mais importante do que equilibrar o orçamento do Estado, davam pouca atenção a preocupações financeiras triviais.<n><n>Mercadorias eram importadas em quantidades cada vez maiores a bordo de navios estrangeiros, pois as pessoas haviam-se tornado refinadas demais para produzi-las em casa. Até o equipamento e as provisões para as expedições à América raramente eram fornecidos pelos comerciantes domésticos. As pessoas comentavam com orgulho: toda a Europa está ao comando da Espanha.<n><n>No entanto, o fluxo de prata tinha de secar eventualmente, e o rude despertar que se seguiu assemelhar-se-ia a uma ressaca depois de uma longa noite de bebedeira: os holandeses e os britânicos tentavam expulsar a Espanha dos mares. Numerosas guerras religiosas contra os “hereges” protestantes e contra os turcos devoraram somas enormes de dinheiro, e o vasto império sobre o qual o sol nunca se punha transformara-se num colosso ingovernável.<n><n> A crise tornou-se evidente para todos no ano de 1557, quando o novo governante espanhol, Filipe II, foi forçado a declarar falência do Estado pela primeira vez. O grande império, que possuíra tesouros maiores do que qualquer império anterior, estava quebrado."
"0xd4cd0fb3" = "Por que a língua falada no Brasil é o português, quando em quase toda a América do Sul é o espanhol?<n><n>Bem, tanto os espanhóis quanto os portugueses, que haviam descoberto a rota marítima para a Índia ao longo da costa africana, reconheceram cedo que seu futuro estava do outro lado dos oceanos. Cada um vigiava o outro com ciúmes, para garantir que, em sua busca por mercadorias, súditos e terras, não invadisse o território alheio.<n><n>Como naquela época não existia algo como o direito internacional, em caso de conflito recorriam ao Papa, que era a única pessoa a cuja autoridade as duas nações estavam dispostas a se submeter. Por sua parte, a Igreja Católica tinha interesse em garantir que espanhóis e portugueses buscassem com zelo a cristianização dos “pagãos” nas terras desconhecidas, em vez de gastar suas energias tornando a vida difícil uns para os outros.<n><n>Chegou-se, portanto, a um acordo durante negociações conjuntas em Tordesilhas (1494) e Saragoça (1529): os territórios recém-descobertos a oeste de uma determinada linha de longitude pertenceriam à Espanha, e todos os outros a Portugal. Essa linha de longitude atravessava o que então era a América do Sul ainda não descoberta, de modo que seu lado oriental, parte do atual Brasil, coube a Portugal."
"0xd4cd0fb4" = "Foi provavelmente o escritor romano Políbio quem mencionou pela primeira vez a palavra “pirata” (peirato) por volta de 140 a.C. Desde então, muitas palavras diferentes foram usadas para designar esses temíveis vilões dos mares: corsários, freebooters, bucaneiros, flibusteiros... Os homens que cercavam Klaus Störtebeker eram conhecidos como “A Irmandade Vitaliana”, e Bartholomew Roberts deu a si mesmo e à sua banda de assassinos o título bastante inócuo de “Cavalheiros da Fortuna”. No fim, porém, pouco importava ao comerciante quem surgia do nada para atacar seu navio. <n><n>Os bucaneiros têm sido um flagelo para a humanidade através dos tempos em todos os cantos do mundo. Na Antiguidade, os piratas cilícios espalharam tanto terror por todo o Mediterrâneo que o Império Romano foi forçado a montar campanhas regulares contra eles. Ilhas escondidas e costas recortadas situadas perto de rotas comerciais muito percorridas ofereciam os locais ideais para a atividade pirata: as áreas onde recifes, correntes e mau tempo tornavam presas fáceis os pesados navios mercantes forneciam um refúgio ao qual se podia recuar rapidamente depois de cometido o ultraje. A costa da Ásia Menor era tão temida na Antiguidade quanto o Caribe o foi durante a Era das Descobertas, enquanto os piratas do Sudeste Asiático assumiram um status quase mítico.<n><n>Segundo a origem da palavra, um “bucaneiro” era na verdade um marinheiro que navegava como particular, não como marinheiro da marinha, em busca de pilhagem e que, portanto, era considerado envolvido em pirataria. <n><n>No entanto, a emissão de Cartas de corso deu a alguns dos bucaneiros do Caribe uma aparência de legalidade. Esses documentos eram emitidos por governadores ingleses, franceses ou holandeses, e seu propósito era direcionar o flagelo da pirataria contra as potências adversárias.<n><n> A facilidade com que se obtinham Cartas de corso dependia do governador em particular. Um governador consideraria desonroso firmar um pacto com piratas. Outros eram bastante menos escrupulosos, ou simplesmente corruptos ou covardes."
"0xd4cd0fb5" = "Os “os sete mares” são na verdade apenas três (ou seja, os três oceanos): o Pacífico Norte e Sul, o Atlântico Norte e Sul, os Oceanos Ártico e Antártico e o Oceano Índico.<n><n> O Oceano Pacífico deve seu nome à primeira circum-navegação do globo por Fernão de Magalhães, que teve a boa sorte de encontrar tempo favorável durante as muitas semanas de fome que levou para atravessar esse vasto oceano.<n><n>E outra coisa: o Caribe deriva seu nome dos “Karibe” (ou “Karaibe”), povos de um grupo linguístico indígena cuja área de assentamento se estendia das Antilhas ao longo da costa norte da América do Sul."
"0xd4cd0fb6" = "As Ilhas Bermudas recebem o nome do explorador espanhol Juan Bermúdez, que as descobriu em 1503. A infame área conhecida por todos os navegadores como “Triângulo das Bermudas”, na qual se diz que o risco de acidentes marítimos misteriosos é muito alto, abrange uma área do mar entre as Ilhas Bermudas, Porto Rico e Fort Lauderdale (Flórida).<n><n>Algumas pessoas sustentam que a estranha série de acontecimentos inexplicáveis começou com a viagem de Cristóvão Colombo: o navegador genovês a serviço da Espanha viu-se com seus três navios em 14 de setembro de 1492 exatamente nessa área, quando a agulha de sua bússola começou a girar descontroladamente. Isso era causado pela diferença entre o polo norte geográfico e o polo norte magnético. No dia seguinte, uma chama enorme apareceu no céu (possivelmente um meteoro).<n><n>No entanto, o apelido “Triângulo das Bermudas” só surgiu após a Segunda Guerra Mundial, depois de uma série de acidentes aéreos que chamaram a atenção do público para essa área no sudoeste do Atlântico Norte.<n><n>Os seguidores de acontecimentos misteriosos apontam para mais de 200 supostos acidentes inexplicados, embora interpretem as fronteiras com bastante generosidade. A maioria desses eventos, muitos dos quais nem sequer ocorreram na área, tem uma explicação perfeitamente lógica."
"0xd4cd0fb7" = "A lendária frota de tesouros espanhola, que regularmente partia da América para a Espanha, também despertou todo tipo de cobiça para além da península Ibérica. Foi uma Inglaterra ambiciosa que viu nisso uma oportunidade de contestar o papel da Espanha como senhora dos mares e rainha do mundo.<n><n>Como o reino insular ainda era fraco demais para se envolver em campanhas militares de grande escala, fazia muito mais sentido enfrentar sua rival fora da Europa, bem longe, onde ela não esperaria ser atacada nem receberia qualquer aviso de ataque. Lá, podia-se saquear a vítima com facilidade, desaparecer simplesmente, e ninguém na Europa ficaria sabendo dos acontecimentos por meses.<n><n>Capitães ousados, o mais famoso dos quais foi Francis Drake (1540-1596), receberam Cartas de corso de Sua Majestade Elizabeth I. Essas Cartas de corso assemelhavam-se a uma espécie de cheque em branco e eram uma licença para saquear que elevava Drake e seus associados acima do nível dos bucaneiros comuns e lhes conferia o status de barões ladrões privados a serviço de uma autoridade superior. Fizeram um trabalho excelente. Em nenhum lugar os navios e guarnições ibéricas estavam seguros.<n><n>Em 1578, Francis Drake atravessou o Estreito de Magalhães e partiu como um turbilhão à caça de pilhagem espanhola ao longo da costa do Pacífico da América. Ninguém jamais ousara fazer isso antes! Ao retornar ao porto de Plymouth em 1580, Drake tornara-se o segundo capitão depois de Magalhães a navegar ao redor do mundo. <n><n>Enquanto isso, o rei Filipe da Espanha fervia de raiva e brandia o Tratado de Tordesilhas, pelo qual Sua Santidade o Papa declarara categoricamente em 1494 que o hemisfério ocidental estava dentro da esfera de influência da Espanha. – Mas como esse tipo de protesto poderia afetar essa peculiar nação insular de hereges protestantes, que rejeitavam completamente a autoridade do Papa em Roma e que até se recusavam a adotar o moderno calendário gregoriano até 1753, puramente porque ele fora desenvolvido por ordens do Papa Gregório em 1582?<n><n>Mais uma vez, parecia que a questão só poderia ser resolvida por meio da guerra. A Armada de Filipe partiu para a Inglaterra em 1588, mas sob o comando de Sir Francis Drake, que a essa altura já havia sido nomeado cavaleiro, e com a ajuda de várias tempestades oportunas, os ingleses conseguiram destruir a frota espanhola. Por centenas de anos depois disso, ninguém desafiaria a posição da Grã-Bretanha como a principal potência marítima."
"0xd4cd101f" = "Sem dúvida, as viagens de Cristóvão Colombo (1451-1506) à América figuraram entre as maiores aventuras já empreendidas pela humanidade. Nem mesmo um escritor ousaria imaginar tal história de acontecimentos dramáticos e coincidências estranhas.<n><n>Embora o navegador genovês tivesse conseguido convencer o casal real Isabel e Fernando da Espanha de sua ideia de que havia uma rota marítima ocidental para a Índia, ele certamente não podia contar com a anuência da tripulação a bordo. De fato, a maior parte da tripulação foi convocada à força: como punição por delitos contra a Coroa, a cidade de Palos foi obrigada a fornecer dois navios com tripulações.<n><n>A notícia do plano de Colombo provocou expressões de horror. A tripulação estava firmemente convencida de que navegava sob o comando de um louco que só poderia trazer destruição a si mesmo e a todos os que navegassem com ele.<n><n>No entanto, o maior inimigo de Colombo era a superstição: toda história de horror imaginável parecia ter chegado a bordo, e qualquer acontecimento estranho ou sinistro apenas reforçava os medos dos marinheiros: um vulcão entrou em erupção quando passavam por Tenerife, depois viram colunas de fogo no céu, e até a agulha da bússola parecia pregar peças na tripulação. Se os navios ficassem encalhados por falta de vento, isso era visto como mau presságio. Por outro lado, se avançassem bem, isso significava que o vento sempre soprava de leste para oeste e que nunca poderiam dar meia-volta.<n><n>Muitas vezes, um motim pareceu inevitável. Certa noite, o capitão ouviu passos e murmúrios do lado de fora de sua cabine, e só quando começou a rezar em voz alta os assassinos perderam a coragem e se esgueiraram embora.<n><n>As crises mais graves sempre irrompiam quando o que se pensava ser uma ilha no horizonte revelava-se mais uma vez nada além de uma ilusão de ótica. Foi justamente uma ocorrência assim, em 10 de outubro, que levou a situação ao limite. Com grande dificuldade, Colombo negociou um ultimato de três dias, após os quais a tripulação queria dar meia-volta (de preferência sem seu capitão). No entanto, o destino tinha outros planos: eles de fato avistaram terra dentro desses três dias. Nenhum dos presentes poderia ter sonhado que, em vez da Ásia, haviam tropeçado num continente completamente novo e desconhecido.<n><n>O Japão e a China ainda estavam a milhares de milhas náuticas de distância, e somente pela incrível boa sorte de um continente estrangeiro estar em seu caminho a expedição de Colombo não se perdeu. O moral da tripulação elevou-se imediatamente. Nenhum deles conseguia se lembrar de ter algum dia nutrido pensamentos de motim..."
"0xd4cd1020" = "Cristóvão Colombo havia de fato descoberto uma nova massa de terra (ou melhor: redescoberto, pois os vikings já haviam pisado em solo americano durante a Idade Média), mas anunciou equivocadamente que descobrira uma rota marítima para a Índia.<n><n>Ao preparar a segunda e a terceira de suas quatro viagens, o genovês colaborou com Américo Vespúcio, de Florença. Foi ele quem primeiro sugeriu que essas terras a oeste pertenciam de fato a um continente novo e desconhecido. Essa percepção espetacular reacendeu o interesse do público, e sempre que alguém discutia esses novos territórios, o nome Vespúcio certamente era mencionado.<n><n>Em contrapartida, a estrela de Cristóvão Colombo estava em declínio. Nesse meio tempo, ele chegara até a ser enviado de volta acorrentado após queixas dos colonos caribenhos, e sua morte como um homem amargurado e doente, em 1506, não atraiu a atenção que merecia. Não é de surpreender, portanto, que o cartógrafo do sul da Alemanha Martin Waldseemüller tenha recorrido ao nome popular de Américo Vespúcio como inspiração quando tentou sugerir um nome para essas terras desconhecidas um ano depois. <n><n>O nome de Waldseemüller foi aceito por seus colegas. Teria sido mais justo se o continente tivesse sido batizado de “Colômbia”."
"0xd4cd1021" = "A primeira parte da América que ascendeu a grande importância sob o domínio espanhol foi Hispaniola. Cristóvão Colombo já havia fundado aqui o primeiro assentamento europeu em 1493, embora ele tenha sido exterminado pelos nativos americanos antes mesmo de seu retorno da Europa.<n><n>Ao longo dos anos seguintes, a Coroa espanhola assumiu o controle crescente dessa ilha. O primeiro mosteiro e a primeira catedral foram construídos, e foi aqui que se estabeleceu pela primeira vez o sistema social que seria estendido às outras áreas: uma sociedade escravocrata, estritamente dividida em classes e estreitamente associada à Igreja Católica.<n><n>Hispaniola parecia oferecer oportunidades enormes e atraiu muitos colonos empreendedores através do oceano. <n><n>No entanto, não demorou muito para que a Espanha dirigisse sua atenção para outras regiões: a essa altura, os grandes reinos do continente já haviam sido descobertos e conquistados. Ali, era mais fácil governar, os depósitos de ouro e prata eram mais ricos e mais fáceis de extrair.<n><n>Como um brinquedo jogado de lado, as pessoas perderam o interesse por Hispaniola. Piratas holandeses, ingleses e franceses se revezaram em ataques. Em 1697, os franceses assumiram o controle de Saint-Domingue, a parte ocidental da ilha (hoje Haiti) e estabeleceram uma economia de plantation lucrativa. A produção de cacau, açúcar, anil, algodão e café fez de Saint-Domingue a colônia mais lucrativa do Novo Mundo no século XVIII.<n><n>A única revolta escrava bem-sucedida da história, que eclodiu em consequência da Revolução Francesa, acabou levando à independência do Haiti em 1804. Os rebeldes trataram seus antigos opressores exatamente como eles mesmos haviam sido tratados: “Para a declaração de independência, precisamos da pele de um homem branco para o pergaminho, seu crânio como tinteiro, seu sangue como tinta e uma baioneta como pena”, anunciou na época o general negro Boisrond-Tonnerre."
"0xd4cd1022" = "Um produto tipicamente caribenho, embora de benefício duvidoso para a humanidade, é o rum. Essa aguardente feita do melaço de cana-de-açúcar, que originalmente tinha o colorido nome de “mata-diabo”, foi mencionada pela primeira vez em Barbados em 1650. Como a lendária bebida preferida dos piratas, a maioria das pessoas tende a associar o rum à ilha da Jamaica, um dos covis de piratas mais temidos de todos os tempos. <n><n>Os traficantes de escravos vendiam a mercadoria humana que haviam comprado na costa africana no Caribe por grandes quantidades de melaço. Esse melaço era refinado em rum na Nova Inglaterra e depois transportado para a África nos mesmos navios. A aguardente era vendida na África, e os navios vazios eram então carregados com uma nova carga de escravos. Com esse fatal “comércio triangular”, os donos de navios garantiam que suas embarcações estivessem sempre totalmente carregadas em todas as viagens."
"0xd4cd1023" = "Depois de Cuba, a Jamaica é provavelmente a mais famosa das ilhas caribenhas. Seu nome deriva do nome indígena arawak Xymaca, que significa aproximadamente “a terra da madeira e da água”. O próprio Cristóvão Colombo, que descobrira a ilha nove anos antes, teve ampla oportunidade de experimentar a beleza da paisagem e a simpatia de seus habitantes quando seu navio naufragou ao largo da costa norte em 1503.<n><n>De fato, ele gostou tanto que transferiu a propriedade de toda a ilha do Rei da Espanha e a declarou como sua. Apesar disso, esse paraíso insular ficou bastante negligenciado nas décadas seguintes, até ser tomado pelos britânicos em 1655. Muito poucos arawaks ainda restavam nessa altura, pois sua tribo mostrou-se especialmente suscetível às doenças que os europeus trouxeram consigo.<n><n>Em 1661, Edward D'Oyley foi nomeado capitão-geral e governador da Jamaica. Sob sua autoridade, a capital Port Royal transformou-se num refúgio vibrante e fortemente defendido para piratas. Dizia-se que era “o lugar mais rico e mais corrupto da Terra”, e muitos dos habitantes, que de resto eram comerciantes comuns, reuniam-se frequentemente para realizar incursões privadas em águas espanholas. No início, o governo britânico mostrou pouca disposição para refrear essas atividades, pois, afinal, os bucaneiros mantinham seus rivais espanhóis à distância.<n><n>Foi só depois que Sir Henry Morgan assumiu o cargo de governador (fato significativo por ele próprio ter sido pirata) que a cultura e a ordem retornaram à Jamaica. Morgan reprimiu impiedosamente a pirataria e não hesitou em mandar seus antigos associados para a forca.<n><n>No entanto, mal a autoridade britânica fora restabelecida, descobriu-se uma nova e lucrativa fonte de renda além do cultivo de cana-de-açúcar: depois de 1672, Port Royal transformou-se no maior mercado de escravos do mundo, uma vez que a English Royal African Company estabeleceu um monopólio."
"0xd4cd1024" = "Apenas duas semanas após sua chegada ao Novo Mundo, Cristóvão Colombo chegou a Cuba, a maior ilha das Índias Ocidentais. Aqui viviam várias tribos, os ciboneys, os guanahatabeys e os taínos, que, apesar de sua natureza pacífica, sofreram todos o mesmo destino infeliz das outras tribos nativas americanas: em 1511, após travar uma guerra de quatro anos contra os espanhóis, foram conquistados e exterminados. Isso resultou então na importação de grandes números de escravos negros para cá. A ilha, com sua capital Havana, foi dividida em sete áreas administrativas (cabildos), cada uma das quais enviava um deputado a um conselho especial. O dever do deputado era representar os interesses locais da área.<n><n>O que é notável na história de Cuba é que, exceto por um breve interlúdio de controle britânico de 1762 a 1763, a ilha permaneceu em mãos espanholas por um tempo relativamente longo. Isso pode ter sido porque Cuba não era uma das áreas mais importantes do império espanhol durante a era colonial (por exemplo, quase não havia depósitos minerais) e era geralmente usada como escala a caminho do continente. De qualquer forma, enquanto a grande maioria dos países da América do Sul e Central lutava por sua independência no primeiro quarto do século XIX, os espanhóis conseguiram manter Cuba até 1898, quando cederam o controle da ilha aos Estados Unidos."
"0xd4cd1025" = "É sabido que muitas coisas que hoje consideramos normais chegaram primeiro à Europa como resultado do comércio com a América. No entanto, o intercâmbio cultural funcionou no sentido inverso.<n><n> Por exemplo, quando se imagina o típico nativo americano das planícies norte-americanas, é difícil imaginar que não havia cavalos na América antes da chegada dos espanhóis e dos portugueses. Muitos dos nativos americanos fugiram em pânico cego na primeira vez que viram um cavalo e seu cavaleiro, pois pensaram que se tratava de uma fera estranha composta por dois seres que haviam crescido juntos.<n><n>O café, que normalmente se associa a países como Brasil e Guatemala, não é originário da América e já havia viajado por três continentes antes de chegar ali: da África (provavelmente da Etiópia), passou pelos países árabes antes de chegar ao sudoeste da Europa. A planta foi introduzida pela primeira vez na América durante o século XVIII, quando a popularidade crescente da bebida tornou necessário aumentar o cultivo.<n><n>Na batata, os europeus haviam descoberto no Caribe um alimento básico de valor inimaginável. Por outro lado, o trigo era desconhecido na América até a chegada dos espanhóis e dos ingleses, que levaram essa cultura ao México em 1520 e à Virgínia em 1777, respectivamente. Embora as pessoas originalmente achassem que o clima americano não era adequado para o cultivo de trigo, foi na América do Norte em particular que se registrou o sucesso mais fenomenal dessa cultura. Hoje, o trigo é a cultura agrícola com a maior área cultivada do mundo."
"0xd4cd1026" = "Você consegue imaginar a vida sem chocolate? Certamente deveria, porque o cacau era desconhecido no resto do mundo antes da descoberta da América. A palavra cacau provavelmente se origina da língua maia, à qual pode ser rastreada pela primeira vez: parece certo que comerciantes maias bebiam cacau 400 anos antes do nascimento de Cristo.<n><n>Os astecas, que eram a potência dominante no continente centro-americano desde o século XIV, chegaram a atribuir um significado religioso ao cacau. O primeiro europeu a entrar em contato com essa iguaria foi, mais uma vez, Cristóvão Colombo, embora isso tenha acontecido numa viagem posterior, em 1502, que o levou à Nicarágua.<n><n>No entanto, o legítimo “descobridor” do cacau é Hernán Cortés, conquistador do reino asteca, que trouxe de volta à Espanha a receita de uma bebida chamada xocoatl (daí a palavra “chocolate”). O sabor era inicialmente amargo demais para o paladar europeu, e só depois que as pessoas começaram a acrescentar açúcar ou baunilha é que o chocolate quente se tornou uma bebida popular entre as classes altas ibéricas.<n><n>Os espanhóis guardaram a receita para si por quase cem anos, depois dos quais o chocolate quente se espalhou pela França e pelo restante da Europa. Por volta do ano 1700, os britânicos acrescentaram leite. O avanço definitivo do cacau na Europa ocorreu quando se descobriu quão deliciosos eram o café e o cacau juntos."
"0xd4cd1027" = "Embora às vezes seja difícil distinguir entre realidade e lenda quando se fala de pirataria, não há como contestar o fato de que havia mulheres piratas. Duas das figuras mais deslumbrantes seguiram esse caminho na ilha da Jamaica durante o início do século XVIII.<n><n>Anne Bonny, de quem se dizia ter sido apunhalada no estômago ainda criança, fugira com um marinheiro para o refúgio pirata de New Providence (Nassau). Ali, conseguiu livrar-se do marido e iniciar sua própria carreira a bordo de um navio holandês capturado. <n><n>Ali, conheceu Mary Read, que já havia lutado nas Guerras de Sucessão Espanholas disfarçada de homem e que, segundo dizem, mostrava os seios aos adversários antes de matá-los, para provar-lhes que haviam sido vencidos por uma mulher.<n><n>Após sua captura no ano de 1720, elas só escaparam de ser enviadas à forca porque estavam grávidas. Tiveram melhor sorte do que a maioria de seus comparsas homens, sobre cujas cabeças Anne Bonny só podia derramar desprezo.<n><n>Abaixo estão as palavras que ela dirigiu ao infame “Calico Jack” a caminho da forca: “Sinto muito em vê-lo aqui, Jack, mas se você tivesse lutado como um homem, não estaria aqui para ser enforcado como um cão”."
"0xd4cd1028" = "O galês Bartholomew Roberts (1682? – 1722) não foi apenas um dos piratas mais importantes, mas também um muito incomum. Também conhecido como “Black Bart” (não confundir com “Barba Negra”, alias Edward Teach), ele converteu-se tarde à pirataria, aos 37 anos de idade, embora a transição para atividades criminosas tenha sido sem dúvida tranquila: o navio em que trabalhava e que foi atacado em 1719 por seu compatriota galês Howell Davis era na verdade um navio negreiro.<n><n>Roberts decidiu unir seu destino ao de Davis, após cujo assassinato algumas semanas depois ele assumiu o papel de capitão. Diz-se que Bartholomew Roberts evitava o álcool e preferia chá.<n><n>Em contraste com Teach, que se apresentava como o próprio diabo encarnado, Roberts tinha predileção por roupas finas, não gostava de jogos de azar e insistia que seus homens fizessem suas orações. No entanto, isso certamente não significava que Roberts fosse um homem piedoso no fundo. Há numerosos relatos das atrocidades que cometeu, especialmente contra prisioneiros, durante suas incontáveis façanhas de saque. Com um butim de mais de 400 navios e uma área de atuação que se estendia do Brasil até a Terra Nova e a África Ocidental, ele foi, junto com Henry Morgan, um dos piratas mais bem-sucedidos da América Central. <n><n>O troar dos canhões de um navio de guerra britânico ao largo da costa da Guiné em 1722 sinalizou o fim de sua carreira e a eliminação de uma das maiores ameaças dos sete mares."
"0xd4cd1090" = "O bucaneiro mais famoso do século XVII foi o galês Henry Morgan (1635-1688), que atormentou as colônias espanholas nas Índias Ocidentais, abalando assim até os alicerces a autoridade da grande potência ibérica na região.<n><n>Sua vida exemplifica a moral bastante duvidosa por trás da política da Grã-Bretanha, da Holanda e da França, que ficavam só demasiado felizes em fazer vista grossa à pirataria, desde que ela causasse danos às outras grandes potências.<n><n>Henry Morgan, que recebeu o comando de um navio bucaneiro em 1668, começou a semear o caos ao longo da costa norte da América do Sul. No comando de quase 2.000 homens, capturou a fortemente defendida cidade do Panamá em agosto de 1670, e depois fugiu com a maior parte do butim na viagem de volta. No entanto, como o ataque ocorreu depois que Espanha e Inglaterra assinaram um tratado de paz, ele foi feito prisioneiro e levado a julgamento em Londres.<n><n>Morgan não foi condenado, muito pelo contrário: não demorou muito para que os ventos da diplomacia mudassem novamente de direção. Morgan não só foi perdoado, como foi feito cavaleiro. Como Sir Henry, foi nomeado o novo governador da Jamaica, onde impôs lei e ordem estritas e viveu os anos restantes de sua vida como um plantador rico e respeitado."
"0xd4cd1091" = "As Bahamas, que por um breve período em meados do século XVII serviram de refúgio para dissidentes religiosos da Inglaterra, ficaram a partir de 1670 oficialmente sob o controle do Conde de Albemarle e de outros senhores que haviam tomado a propriedade do grupo de ilhas do Rei Carlos II na esperança de obter lucros.<n><n>Apesar de suas promessas, no entanto, esses indivíduos mostraram pouco interesse em estabelecer uma administração civil bem ordenada. Deu-se exatamente o contrário: como em outros lugares do Caribe, hordas de piratas se instalaram nas Bahamas, especialmente na ilha de New Providence, onde ficava a cidade de Nassau. <n><n>As baías rasas, nas quais os pesados navios de guerra não podiam entrar, ofereciam um ancoradouro ideal para centenas de escunas e barcas piratas. As frequentes incursões em águas espanholas resultaram em represálias, e John Wentworth, o primeiro governador, teve a tarefa ingrata de restabelecer a lei e a ordem nas ilhas.<n><n>Como a situação não mostrava sinais de melhoria, o Rei Jorge I da Inglaterra confiscou novamente as Bahamas e as transformou numa Colônia da Coroa. Woodes Rogers, ex-bucaneiro e circum-navegador, foi nomeado o primeiro governador real em meados de 1718.<n><n>Usando a abordagem de cenoura e porrete, ele pôs fim ao caos que até então prevalecia. Ofereceu anistia geral a todos os piratas dispostos a renunciar às suas atividades sob juramento. Para todos os que não estivessem dispostos a isso, aguardava o castigo na forma de uma frota de navios armados até os dentes.<n><n>Depois que as condições normais foram assim restabelecidas, o grupo de ilhas recebeu seu próprio parlamento em 1729 e, ao longo dos cem anos seguintes, com exceção de distúrbios ocasionais por invasões, a história das Bahamas permaneceu relativamente tranquila."
"0xd4cd1092" = "Em quase todos os lugares de suas colônias recém-adquiridas, os espanhóis estabeleceram um rígido sistema social que oferecia pouquíssimas oportunidades de ascensão. No topo da hierarquia estavam os compatriotas nascidos na Europa.<n><n>Os espanhóis nascidos nas colônias ficaram conhecidos como criollos. Embora fossem considerados apenas de importância secundária na hierarquia, ocupavam a maioria dos cargos inferiores no Estado, na Igreja e no exército.<n><n>Os espanhóis de ascendência europeia e os criollos representavam, portanto, a classe de elite nas colônias. Os filhos de casamentos mistos entre brancos (principalmente homens) e nativos americanos eram conhecidos como mestiços. Os nativos americanos, que originalmente possuíam a terra, ocupavam a posição mais baixa da sociedade, e nas áreas onde haviam sido completamente exterminados pelos europeus, essa honra era reservada aos escravos negros.<n><n>As proporções relativas dessas classes na população diferiam enormemente entre as várias regiões do império espanhol. No México, por exemplo, os mestiços formavam a maior parte da população. Em muitas ilhas, os escravos negros estavam presentes em números superiores (e à mercê de seus senhores). As tribos nativas americanas também conseguiram sobreviver nas áreas onde selvas, pântanos e regiões montanhosas ofereciam um refúgio seguro, por exemplo, na Bolívia ou na Flórida."
