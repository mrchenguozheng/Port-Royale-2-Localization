"0x21c2f2cf" = "<n><o:0xffC00000>Missão não cumprida. <o:0xff000000>"
"0x21cae149" = "Muito bem! Agora você deve tornar seu comboio mais poderoso para poder enfrentar vários comboios militares. Você deve ter pelo menos três navios no seu comboio que sejam fragatas ou navios maiores.<n><n>Você pode capturar os navios ou tentar comprá-los nos estaleiros das cidades com governador.<n><n>Torne esses navios navios de escolta e garanta que estejam totalmente armados e com tripulação completa de marinheiros.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Arme seu comboio para que ele tenha pelo menos três navios de escolta totalmente armados e com tripulação completa, que sejam fragatas ou navios maiores. "
"0x21d142f5" = "Reparar comboio nesta cidade"
"0x21e727b4" = "Tenho certeza de que você já ouviu falar do pirata @P$PirateName$. Ele já tem @I$NumConvoys$ comboios e ainda não descobrimos seu esconderijo. Felizmente, sabemos o paradeiro de um de seus comboios. Talvez ele ainda esteja por perto. Quero que você destrua este comboio. "
"0x21e727b5" = "Devemos agir rápido, pois acabei de saber o paradeiro de um dos comboios do pirata @P$PirateName$. Encontre e destrua este comboio."
"0x21e727b6" = "Todos os piratas têm seu próprio esconderijo, de onde enviam comboios para capturar despojos. Enquanto isso, o pirata @P$PirateName$ acumulou uma frota de @I$NumConvoys$ comboios. Por acaso, descobrimos o paradeiro recente de um capitão importante dessa gangue e de seu comboio. Quero que você encontre e destrua este comboio."
