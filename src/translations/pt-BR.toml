"0x13cd046e" = "Sempre que você capturar cidades inimigas para um vice-rei, ele lhe concederá um terreno em troca. Nesse terreno, você pode construir uma cidade que pertencerá a você e na qual poderá construir diferentes edifícios. Em outras palavras, qualquer vice-rei pode ajudá-lo a se tornar proprietário da sua própria cidade. <n><n>Seu próximo objetivo é melhorar sua reputação com a Espanha, porque um vice-rei só o receberá se você tiver uma boa reputação com a nação dele.<n><n>Você pode verificar sua reputação com uma nação, por exemplo, sob o nome da cidade na vista da cidade. Em Margarita, onde você começa o jogo, três bandeiras são exibidas, indicando que sua reputação com a Espanha é “neutra”.<n><n>Você pode melhorar sua reputação com uma nação cumprindo missões para seus governadores, caçando piratas ou negociando com suas cidades e entregando as mercadorias de que precisam.<n><n>Como a Espanha e a França estão em guerra, você pode obter uma Carta de corso contra a França com o governador de Margarita. Você pode melhorar rapidamente sua reputação com Cartas de corso.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objetivo do cenário<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Melhore sua reputação com a Espanha para “amistosa”."
