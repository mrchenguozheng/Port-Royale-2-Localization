"0xcc823e54" = "我們正與@n$TargetNation$交戰，鑑於最近發生的事，反擊的時刻終於到了。我要你替我俘獲或擊沉他們的軍艦。你接受這項任務嗎？"
"0xcc823e55" = "就在不久前，@n$TargetNation$襲擊了我們的一座城鎮。我正打算對@n$TargetNation$採取軍事行動，不知你想不想參與？我要你擊沉或俘獲他們的軍事船隊。你從它們身上繳獲的一切都歸你自己，我只在乎削弱@n$TargetNation$。你有興趣嗎？"
"0xcc823e56" = "我們的一座城鎮遭到了@n$TargetNation$襲擊。我們正在反擊，擊沉他們的船隻。我很想把你派往某個特定區域，授權你俘獲或擊沉那裏的軍艦。"
