"0xe799be68" = "%1私掠者%2汙染了城鎮裏的大量食物，結果爆發了饑荒。饑荒期間，小麥、水果、玉米和肉類的價格都會上漲。"
"0xe79fc3ee" = "按船員"
"0xe7a9acfb" = "你想花%1買一份私掠許可證，以西班牙之名追獵我們敵人的船隻嗎？"
"0xe7b85cf1" = "你要拆除這家產業嗎？"
"0xe7ba475b" = "海戰"
"0xe7bffbb6" = "[town:Tortuga]的庫存被破壞者摧毀，城鎮的大量物資已經損失，市民的生活品質因此大幅下降。<n><n>你的目標是儘快補足物資，好讓城鎮的狀態重新回升。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>該城鎮必須在@D$EndDate$之前達到「繁榮」狀態。"
"0xe7c31648" = "<f:fonts/Tiepolo_black14x14aaFHk.res>選擇一座建築<n><n><f:fonts/Tiepolo_bold14x14aaFH.res>你在這座城鎮的第一座建築必須是倉庫"
