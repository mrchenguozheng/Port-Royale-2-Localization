"0x20eef526" = "<ts:80><ts:145><ts:210><n>戰鬥結果：<n><n>"
"0x20ff905e" = "船員"
"0x2106ce9e" = "一位經驗豐富的船長正在旅店等你。"
"0x21117682" = "<n><n>你手上的建築許可通常是可以交還的。但這次不行，因為%1正是你遊戲開始時所在的城鎮。"
"0x21117683" = "<n><n>你要交還許可嗎？<n>我可不會為此付你一個子兒！"
"0x211c8552" = "遊戲時間結束"
"0x2137ec23" = "謝謝。在@D$Date$之前，我會用高價收購葡萄酒、工具和香料。到市場找我的特使，每樣交@a$Amount$桶。他只接受一次交齊，屆時當場付款。"
"0x2137ec24" = "聽著不錯。那就去我們敵人的城鎮，把進口貨物買下來。在@D$Date$之前，把每樣@a$Amount$桶交給@T$TOWN$市場的我的特使，他給的價錢是平時的兩倍還多。"
"0x2137ec25" = "你知道最划算的做法是什麼嗎？去@n$Nation2$把進口貨物全部買走，讓那邊缺貨。再把每樣@a$Amount$桶送到市場。我的特使會一直等到@D$Date$，並給你高價。"
"0x215e37a6" = "我最近無意中聽到一段對話，一個商人提到他有艘船沉了。他倒不太在意那艘船，那不過是一條搖搖晃晃的老破船。但船上有一隻特別的箱子。"
"0x215e37a7" = "那就這麼說定了。上一趟我受僱上船的航程裏，船長不知為何為一個箱子大發脾氣，順手就把它扔進了海里。"
"0x215e37a8" = "一個曾經的好友，帶著我一隻貴重的箱子跑了。"
"0x2167838b" = "購買船隻"
"0x21743bf7" = "這些東西我一定要！我們不知道船沉的確切位置。@l$ChestPos$在@D$EndDate$之前把箱子給我帶回來。"
"0x21743bf8" = "你必須在@D$EndDate$之前把東西給我帶回來。@l$ChestPos$"
"0x21743bf9" = "他最近才寫信告訴我，說把這個箱子扔下了海。@l$ChestPos$你必須把我的東西帶回來！在@D$EndDate$之前我都在這兒。"
"0x217923cb" = "貨物移交結束：%1"
"0x2190d204" = "一位本地商人願意出%1買下你的這家產業。"
"0x21a69afe" = "市場總監"
"0x21b0dfff" = "%1洗劫了%2"
"0x21b3050a" = "一支軍事船隊摧毀了城鎮的港口防線，洗劫了貨物。城鎮的狀態也隨之下降。"
"0x21bdc952" = "下一張圖表"
"0x21bf83f0" = "常駐船隻信息顯示"
"0x21c2f2cf" = "<n><o:0xffC00000>任務未完成。<o:0xff000000>"
"0x21cae149" = "很好！現在你得讓船隊更加強大，才能同時應付幾支軍事船隊。船隊裏至少要有三艘巡防艦或更大的船。<n><n>你可以俘獲這些船，也可以去總督城的船塢買。<n><n>把這些船設為護航船，確保武器齊備、水手配足。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>武裝你的船隊，使其擁有至少三艘武器齊備、水手配足的護航船，且為巡防艦或更大的船。"
"0x21d142f5" = "在此城鎮維修船隊"
"0x21e727b4" = "你肯定已經聽說過海盜@P$PirateName$了。他已經有@I$NumConvoys$支船隊，而我們還沒查出他的藏身處。好在我們掌握了他其中一支船隊的下落，也許它還在附近。我要你摧毀這支船隊。"
"0x21e727b5" = "我們必須抓緊，我剛得知海盜@P$PirateName$的一支船隊的下落。找到它並摧毀它。"
"0x21e727b6" = "每個海盜都有自己的藏身處，從那裏派出船隊去搶東西。而海盜@P$PirateName$已經聚起了@I$NumConvoys$支船隊。我們碰巧查到了這夥人一位重要船長及其船隊的下落。我要你找到並摧毀這支船隊。"
