"0xdbd3f83d" = "%1，<n>你到底想從我這裏得到什麼？要是你像個真正的水手那樣開進城來，我早就把炮口對準你了——你與我的國家為敵。<n><n>不過既然你已經進來了，我總得像個紳士那樣行事。"
