"0xc557fe31" = "%1爆發了瘟疫。生活品質下降，一個月內衣物和木材的需求會翻上一倍。瘟疫持續期間，城鎮裏每天都有市民死去，商人也不願再駛往這座城鎮。"
"0xc558e134" = "如果想讓儘可能多的商人來你的城鎮光顧，最簡單的辦法就是某些貨物乾脆不往城鎮裏供應。最好挑那些鄰近城鎮生產的貨物，因為商人會把路程遠近算進去。<n><n>來你的城鎮的商人會自動買走那些貨源充足、因而在你城鎮裏價格低廉的貨物。你也可以把城鎮裏生產的貨物直接賣給你的城鎮。只要價格不比別的城鎮高，商人就會定期買走。<n><n>這樣做的好處是市民的日常所需總有著落，你也不必操心把這些貨物運到別的城鎮去。"
