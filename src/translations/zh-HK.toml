"0xf214f6a0" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>你救起一名來自@n$Nation$的水手。為感謝你救了他，他告訴你哪裏能找到許多桶貴重的殘骸貨物。@l$DebrisPos$"
"0xf214f6a1" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>你救起一名來自@n$DestNation$的神父。他付不起船費請你送他回本國城鎮，但他答應替你出面說情，好讓你在@n$DestNation$的聲望有所改善。"
