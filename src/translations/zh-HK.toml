"0xce43a07c" = "你襲擊了一支屬於友好國家的船隊。本劇本中各國處於和平狀態，也就是說，你絕不可襲擊貿易船隊或軍事船隊。"
"0xce4d9a57" = "城鎮貿易"
"0xce75e5c4" = "你已經學會如何買賣貨物。買賣時務必在貨物產地購入，那裏的價格通常更低。<n><n>注意：若要與船隊交易，你必須先選中它，並在進入碼頭之前讓它已經進入城鎮。<n><n>本劇本稍後，你要靠獨自貿易賺取利潤。事件窗口裏會給你相關提示。<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>你必須通過貿易賺到@g$GoldGoal$現金。"
