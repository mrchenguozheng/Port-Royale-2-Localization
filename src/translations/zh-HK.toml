"0x24695110" = "謝謝。我是@T$Town$的商人。追我的人不知道我藏在哪裏，肯定會在我的故鄉逮我。先去那兒查，把賞金獵人幹掉。我最遲必須在@D$EndDate$之前離開。你若能在此之前完成任務，我就付你@g$Reward$。"
"0x24695111" = "我必須趕回@T$Town$，那裏有件事要在我遠走高飛前辦完。可惜通往@T$Town$的幾條路都被一個賞金獵人盯上了，你得把他殺掉。你若能在@D$EndDate$之前完成任務，我就賞你@g$Reward$。"
"0x24695112" = "謝謝！我懷疑有個賞金獵人正盯著@T$Town$港口的入口。<n>咱們這麼辦：我放出風聲，說我要上你的一艘船，然後你開往@T$Town$，看看會發生什麼。<n>最遲在@D$EndDate$之前告訴我港口已經安全無虞，我就付你@g$Reward$。"
"0x246aece6" = "%1：饑荒"
"0x2478c95f" = "恭喜！你成功完成了這個劇本，為加勒比除掉了一個臭名昭著的海盜。<n><n>隨著遊戲推進，海盜藏身處會自行出現。不過海盜船隊的數量取決於他們襲擊的成果。注意海盜只盯貿易船隊，對軍事船隊十分忌憚，所以他們會避開軍事船隊出沒太多的海域。<n><n>在自由模式下，你也可以主動追殺海盜、燒掉他們的藏身處。"
"0x24802954" = "%1：船隻沉沒"
"0x2487ab5c" = "結算"
"0x248f1e26" = "海盜%1的藏身處"
"0x24901249" = "%2名水手中，有%1人想跟你一起去冒險。"
"0x24a0f898" = "船塢"
"0x24b0fd83" = "特長"
"0x24c12812" = "恭喜！你被委派了一項攻佔城鎮的任務！<n><n>城鎮可能防守森嚴，所以你該挑一座港口炮塔最少的英格蘭城鎮。@T$SampleTown$是個完美的目標。<n><n>要攻打城鎮，先為船隊啟用「攻擊城鎮」選項：選中船隊，點擊「攻擊模式」按鈕。<n><n>你可以從海上或陸上攻打城鎮。但只有在水手人數壓過守軍時，才可從陸上強攻；而且還得讓一半水手裝備彎刀、一半裝備火槍。<n><n>注意：如果城鎮港口裏有軍事船隊，你必須先打敗這支船隊，才能攻打城鎮本身。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>完成攻佔城鎮的任務。"
"0x24e18ac4" = "[ref:0x101874f6]"
"0x24ec3366" = "太好了！你的船隊已經武裝齊備，可以去追查黑鬍子的一支海盜船隊了。<n><n>「事件」窗口每天都會給些提示，前提是它所在的位置在海上。找海盜可不容易，因為每次搶商船得手，他們都會退回藏身處。<n><n>記住，一支海盜船隊最多能有五艘軍艦。要是你覺得船隊不夠強，就去加強它。反正你已經知道怎麼弄到錢了。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFHk.res><n><n><c>完成@T$TOWN$總督交給你的任務。"
"0x250c7a12" = "在@D$Date$之前交付@a$Amount$桶。你可以在市場交貨，每交付一<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>@G$Goods$，當場就能拿到@g$GoldPerBarrel$。"
"0x250c7a13" = "太好了。請把@a$Amount$桶送到市場。在那裏，每交付一<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>就能拿到@g$GoldPerBarrel$，一直到@D$Date$。"
"0x250c7a14" = "請到市場去找我的特使。在@D$Date$之前交給他@a$Amount$桶@G$Goods$，他會給你一個好價錢。"
"0x2540ea42" = "附加文本（編年史）"
"0x2546beb9" = "哦，@N$OwnerName$派你來找我？這位老船長我確實認識，他肯定能教會你船員一些東西。可我為什麼要幫你呢？算了，我不刁難你——我知道你找我也花了些工夫。你幫我個小忙，我就告訴你那船長退隱何處。"
"0x2546beba" = "我不認識什麼@N$OwnerName$，但我確實知道@N$TeacherName$在哪兒。我大概可以告訴你，要是我願意的話。這樣吧，你幫我一把，我也幫你一把，如何？"
"0x2546bebb" = "我不在乎是@N$OwnerName$派你來的，還是台北那個駝背大宰相派來的！我有個麻煩事。在解決之前，別的什麼都別跟我提。我有個提議：你幫我找個箱子，我就告訴你那個瘋老頭@N$TeacherName$躲在哪兒。"
