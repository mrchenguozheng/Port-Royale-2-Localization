"0x3933132f" = "啊，@s$USER$，我該怎麼辦？@T$Town$的一個商人總來插手我的生意，把我的利潤搶走，這事已經鬧了幾個月。你能幫我除掉他的船隊嗎？"
"0x39331330" = "你能幫我安排一次小小的報復嗎？我十分確定是@T$Town$的一個商人破壞了我幾艘船。現在我只能坐著等船從船塢回來。我要你摧毀這個狠心對頭的一支船隊。我會重重謝你！"
"0x39331331" = "你不是@A$USER$嗎？我這裏或許有個活兒給你。<n>很久以前，我借給一位來自@T$Town$的商人一大筆錢，他也早該還了。可他就是沒還，看樣子往後也不會還。<n>所以，我要給他一個教訓！你願意替我襲擊他的一支船隊嗎？我會重重酬謝！"
