"0xe1cdc367" = "你已經學會了一些基本操作，也知道如何把一支船隊從一座城鎮派往另一座城鎮了。這非常重要，因為在最初階段，你要靠在這些城鎮之間運輸和貿易貨物來謀生。<n><n>在這個劇本的第二部分，你將買下一艘船，把它編入你現有的船隊。<n><n>再給你一個提示：<n><n>遊戲過程中按住 F1 不放，就會顯示一頁幫助，說明鍵盤和鼠標的設置方式。<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>讓你那支由兩艘船組成的船隊抵達[town:Cartagena]港。"
