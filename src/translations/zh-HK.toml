"0x273267f2" = "哦，真是難以置信。那幫酒鬼偷走了我漂亮的船。他們把船塞滿了朗姆酒瓶，然後跑掉了。你能幫我把船找回來嗎？"
"0x273267f3" = "我就知道會這樣。我那個沒用的兒子鮑里斯把我最好的船借走了。我剛發現，他和幾個朋友已經決定出去玩一趟。不用說，他們肯定把貨艙裝滿了朗姆酒，我敢說再也見不到我的船了。你能幫我把船要回來嗎？"
"0x27344ff4" = "多謝你按時送到，總督一定會很高興的。婚宴今天就要開始了！"
