"0xe4233be0" = "在這個劇本中，你必須幫助荷蘭殖民地獲取新的城鎮。<n:25>劇本開始時你有一支裝備精良的船隊和一筆啟動資金。搶下英格蘭的商船就能立刻增厚你的財富，好為船隊配更多軍械。<n:25>之後，你的船隊將襲擊英格蘭的軍事船隊以削弱其防禦，進而攻佔他們的城鎮。"
