"0x3353aa4c" = "太好了！現在你該替荷蘭去攻佔更多英格蘭城鎮了。但別磨蹭，只有荷蘭與英格蘭交戰期間才能攻佔城鎮。<n><n>和往常一樣，這類任務只有[town:Grand Bahama]的副王才能派給你。在你能再接到攻佔城鎮的任務之前，或許得先做點什麼去影響兩國的軍事強弱。你已經知道該怎麼做了。<n><n>作為後援，[town:Turk Islands]總督又給了你三艘卡拉克帆船。<n><n>港口裏還可以招募到大量水手、購置武器。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在荷蘭與英格蘭的戰爭結束之前，再為荷蘭副王完成兩座城鎮的攻佔任務。期限是@D$EndDate$。之後劇本即告結束。"
