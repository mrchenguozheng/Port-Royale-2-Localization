"0xf64f1e5a" = "你知道，我們正在交戰。為了削弱@n$TargetNation$的經濟，我要你俘獲或擊沉@I$NumShips$艘商船。你接受這項任務嗎？"
"0xf64f1e5b" = "我們正與@n$TargetNation$交戰，因此我要你擊沉或俘獲一定數量的商船。你從它們身上搶到的一切都歸你自己，我只想削弱@n$TargetNation$的經濟。可以指望你嗎？"
"0xf64f1e5c" = "不知道你能否在我們對@n$TargetNation$的戰爭中幫上一把。我想派你前往某片特定海域，讓你俘獲或擊沉那裏的船隻。"
"0xf651cc3f" = "荷蘭與英格蘭已經議和，因此你再也無法攻佔任何城鎮。<n><n>你在這個劇本里走得相當遠，但沒能及時為荷蘭攻佔足夠多的城鎮。<n><n>在自由模式中，你也可以用同樣的辦法攻佔城鎮。不過你必須先確認：你想攻打城鎮的那個國家在軍事上處於弱勢。此外，想要攻佔這些城鎮的那個國家必須軍事強大，而且這兩個國家必須彼此交戰。<n><n>注意：當你為一位副王攻打城鎮時，通常會獲得一塊土地，供你自己建造城鎮。不過本劇本中這項功能已被關閉。"
"0xf65a5a04" = "你現在可以通過襲擊英格蘭的船隻和城鎮來提升在%1的聲望，這不會削減你在其他國家的聲望。"
