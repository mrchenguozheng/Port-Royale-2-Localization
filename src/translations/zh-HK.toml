"0x2ee8bb8c" = "我們現在位於南加勒比的總督城[town:Cartagena]。<n>你可以走進城鎮裏的各種建築，做各種事情，稍後再細說。<n>先看看屏幕上方，那兒有一排按鈕和顯示欄。<n>現在點最左邊那個帶時鐘的按鈕。"
"0x2ee8bb8d" = "這就是編年史，記著加勒比發生的所有事件和軼事，就像一份日報。<n>編年史窗口右側有幾個按鈕，可以用來查看加勒比的相關信息，不過現在還用不上。<n>現在點標著「X」的按鈕關閉編年史。"
"0x2ee8bb8e" = "屏幕頂部、日期旁邊是日誌按鈕，它右邊就是你的現金。<n>日誌會告訴你所有與成就和財產有關的信息，你收到的所有消息和任務也都存在這裏。<n>打開日誌。"
"0x2ee8bb8f" = "你看，日誌立刻列出了你至今收到的所有消息。目前裏面只有本劇本的說明。<n>日誌窗口右側還有別的按鈕。點第三個。"
"0x2ee8bb90" = "這裏顯示的是你收到的任務。目前只顯示劇本目標。<n>任務窗口最上方有兩個按鈕，可以在進行中的任務和已完成的任務之間切換。<n>現在關掉日誌。右鍵點擊也一樣。"
"0x2ee8bb91" = "遊戲中你可以接受許多任務，去博取名聲和財富。<n>先看看城鎮吧。屏幕上方中央的顯示欄告訴你，我們現在在[town:Cartagena]，這座城鎮約有 2,000名居民。<n>點那個顯示城鎮名稱的按鈕。"
"0x2ee8bb92" = "這會打開一個顯示城鎮信息的窗口。<n>[town:Cartagena]是總督城，歸屬西班牙。你還能在這裏看到城鎮狀態和當地能生產的貨物。<n>現在進入一座建築。先把城鎮信息顯示關掉。"
"0x2ee8bb93" = "你可以用鍵盤方向鍵在城鎮視圖裏移動。現在看看城牆內的城鎮中心，那裏有各種建築，比如船塢、教堂和總督宮殿。<n>在其中任意一座上點一下。"
"0x2ee8bb94" = "點擊建築後，屏幕下方中央的顯示欄會隨之改變。視建築類型而定，你會看到信息，或者可以做些事情。<n>建築顯示欄右側有幾個按鈕。要離開建築，點標著「X」的那個。"
"0x2ee8bb95" = "能進行各種操作的建築都在城牆之內。你的倉庫是個例外，下個劇本再說。<n>現在離開建築，用方向鍵找到港口，以及名為「聖瑪麗亞」的船隊。點它一下。"
"0x2ee8bbfd" = "你看，現在屏幕下方中央顯示的是船隊信息。<n>船隊已經裝好貨：10桶小麥和 15桶玉米。<n>船隊顯示欄右側有幾個按鈕。點第二個（帶船圖標的那個）。"
"0x2ee8bbfe" = "這裏顯示船隊裏的船隻數量。一支船隊最多有 10艘船，由一位船長統領。<n>現在把這支船隊派往另一座城鎮。<n>點屏幕右上角那個帶箭頭的按鈕離開城鎮，打開海圖。"
"0x2ee8bbff" = "海圖打開了。屏幕中央是[town:Cartagena]城鎮。<n>你可以用方向按鈕平移地圖顯示的區域，瀏覽整個遊戲世界。<n>現在到北邊的島上找到[town:Port Royale]，在選中船隊的情況下右鍵點擊該城鎮。"
"0x2ee8bc00" = "航線規劃好了，船隊啟航。<n>在[town:Port Royale]上右鍵點擊，就把它設成了船隊的目的地。<n>如果船隊趕到城鎮太慢，可以按空格鍵快進遊戲（默認設置）。"
"0x2ef566b4" = "鍵盤"
"0x2ef8f665" = "歡迎來到%1。<n><n>我先給你幾條忠告，好讓你更快熟悉%2一帶的情況，這樣才能幫我的國家把這座城鎮和其他城鎮發展起來。<n>我想總督城的基本情況你已經很瞭解了：它們需要源源不斷的殖民地貨物出口到歐洲。同時，這些城鎮通常也備有各類奢侈品，賣到別的城鎮能賺上一筆。<n>還有一點：你或許想先知道，總督時不時會派任務給你，不過在達到見習水手等級之前，你還不能接受任務。<n><n>%3 %4，%5的總督"
"0x2efebfdd" = "你的船隊已經抵達[town:Port Royale]，現在可以進城了。點一下城鎮符號（那排小房子）就行。"
"0x2efebfde" = "現在又看到熟悉的城鎮視圖了，不過這次是[town:Port Royale]。凡是擁有你船隊或建築的城鎮，你都可以前往。<n>在港口裏找到船塢並點它一下，我們要買一艘新船。"
"0x2efebfdf" = "船塢現在顯示在剛才船隊所在的這個選擇窗口裏。<n>點船塢顯示欄右側的按鈕，在船塢裏逛一逛。<n>然後回到「購買船隻」這一欄，看看有哪些船可選。<n>買你想要的任何一艘。"
"0x2efebfe0" = "恭喜！你買下了第一艘船。<n>船會被送到城鎮的港口。<n>現在離開船塢，點擊港口裏的水面。選擇窗口會逐一顯示港口中的船隻。<n>點你的新船。"
"0x2efebfe1" = "這裏顯示船隻的數據，你在船塢裏已經見過了。<n>要對單艘船做任何事，你得先把它編入一支船隊。<n>為此，重新選中你的船隊。"
"0x2efebfe2" = "現在你要讓船隊與港口互動。<n>在港口上點擊右鍵。"
"0x2efebfe3" = "「轉運」窗口打開了，可以把單艘船加入船隊。<n>點左邊那艘單獨的船，把它拖到船隊上，這樣船隊就有兩艘船了。<n>然後用右邊的「X」按鈕關掉轉運窗口。"
"0x2efebfe4" = "你還可以在旅店僱一位新船長，用新船再組一支船隊。<n>不過現在還不行，你的等級不夠。<n>現在選中船隊的船隻列表，就是第二個按鈕。"
"0x2efebfe5" = "現在[town:Port Royale]的港口裏有一支兩艘船的船隊了。<n>你可以在船隻列表裏點船，查看每艘船的詳情。<n>現在把船隊派回你的母城[town:Cartagena]。為此，點屏幕最右上角那個帶箭頭的按鈕打開海圖。"
"0x2efebfe6" = "在南方找到[town:Cartagena]城鎮，右鍵點擊它，把船隊派過去。<n>船隊一到城鎮，本劇本就結束。"
"0x2f0127e1" = "你和%1愉快地度過了一天，還跟她講了自己的冒險經歷。"
"0x2f0127e2" = "你和%1度過了一個愉快的下午，暫時把生意拋在腦後。"
"0x2f0127e3" = "你和%1共度良宵，恨不得這一刻永不結束。"
