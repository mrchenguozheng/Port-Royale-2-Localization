"0xc58b0f44" = "謝謝你幫我這個忙。<n><n>現在來談談我們的約定。老船長名叫@N$TeacherName$，退休後住得不遠。<n><n>@l$TeacherPos$<n><n>沿那附近的海岸找找就能找到他。<n><n>帶上@a$Amount$桶朗姆酒，不然他不會願意幫忙。"
