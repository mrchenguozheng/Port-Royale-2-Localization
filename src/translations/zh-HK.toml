"0xf6a84efd" = "1570年，我們來到加勒比海。你的目標是從一個默默無聞的小商人，成長為一位舉足輕重的實業家。為了幫你取得所追求的地位，你可以既跑運輸、又做貿易，還能搞建築、參與政治與海盜活動。<n><n>接下來的劇本會教你遊戲的基本玩法。與其他劇本一樣，這裏包含若干個不同的目標。你必須完成全部目標，才能順利通關。<n><n>你現在可以點「關閉」按鈕關掉這個窗口，然後查看屏幕左下角的事件窗口。<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>按照事件窗口裏的指示去做。"
