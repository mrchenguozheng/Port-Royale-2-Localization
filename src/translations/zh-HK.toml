"0xf214f69c" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>你救起一名來自@n$DestNation$的落難者@N$Name$。只要你把他送到他所屬國家的下一座城鎮上岸，他就給你豐厚酬謝。"
