"0xe830d90e" = "%1，<n>我很樂意賣給你一張在這座城鎮建造的建築許可。不過以你現在的等級，最多隻能持有%2張建築許可，而你已經持有這麼多了。<n><n>等你等級提升後再來吧。"
"0xe84690dc" = "要更改詳情，請點擊該城鎮。用鼠標拖動即可移動和刪除。"
"0xe8469fdd" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>編年史<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>日誌<n><f:fonts/Tiepolo_black14x14aaFHk.res>%3<f:fonts/Tiepolo_bold14x14aaFH.res><t>船隊列表<n><f:fonts/Tiepolo_black14x14aaFHk.res>CTRL<f:fonts/Tiepolo_bold14x14aaFH.res><t>單位規模（<n><t>貿易窗口）<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>關閉對話框"
"0xe84971d5" = "妻子"
"0xe84c0654" = "我在@T$Town$遇到了一點小麻煩。我向妻子承諾過，一定會在那兒建起一所學校。可惜我與總建築師的關係極度惡劣，他絕不會允許我插手他城鎮的事務。你能不能替我把學校建起來？"
"0xe84c0655" = "我希望你能在@T$Town$建一所學校，好提高這座城鎮的富裕程度。其實@T$Town$對我來說毫無意義，但我妹妹就住在那兒，她怎麼也不肯承認還有更好的城鎮。"
"0xe84c0656" = "副王已指示我支援@T$Town$這座城鎮，所以我很樂意出錢幫它建一所學校。可鎮議會拒絕了我的提議——他們不想讓我插手，寧願直接把錢收走。所以我想問問，你能不能把這所學校建起來。"
"0xe88ea6ee" = "按船隊名稱"
"0xe8925b0d" = "決鬥"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>你的船長在左側。你可以這樣操控他：<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>攻擊<f:fonts/Tiepolo_bold14x14aaFH.res><n>要攻擊，就在對手身體的某一部分上點擊左鍵。點擊他身體的不同部位，可以提高你命中的機會。<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>防禦<f:fonts/Tiepolo_bold14x14aaFH.res><n>對手一準備攻擊，你就必須在恰當時機點擊右鍵，把這一擊擋開。<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>特殊攻擊<f:fonts/Tiepolo_bold14x14aaFH.res><n>在船長於一次攻擊後回到起始位置的瞬間之前，按下左鍵。<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>耐力<f:fonts/Tiepolo_bold14x14aaFH.res><n>每次攻擊都會消耗你船長的耐力，而在兩次攻擊之間耐力會恢復。<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>反應速度<f:fonts/Tiepolo_bold14x14aaFH.res><n>你贏下的決鬥越多，需要的反應就越快。"
"0xe8aae87c" = "（城鎮列表已更改，貿易路線已重置）"
"0xe8b8bf24" = "%1：進攻被%2擊退"
"0xe8b8c0e4" = "%1被%2洗劫"
"0xe8d7e960" = "%1，<n>我們相識至今已經這麼久，我的心日夜盼著你只屬於我。你願不願意去向我父親求婚，求他把我許配給你？"
"0xe8d7e961" = "%1，<n>我有件事要和你說。我父親最想做的，就是挑一位品貌出眾的貴族迎娶他的女兒。可我的心早就屬於你。你願不願意去向我父親求婚，求他把我許配給你？"
"0xe8d7e962" = "%1，<n>每次見到你，我的心都會雀躍。可我父親正打算把我嫁給某個自命不凡的貴族。只有你能救我脫離這場命運。你願不願意去向我父親求婚，求他把我許配給你？"
