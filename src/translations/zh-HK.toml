"0x31074c51" = "你聽說@T$Town$爆發瘟疫了嗎？要是城裏早有一座醫院，這場病本來完全可以避免。可惜我那位總建築師是個懦夫，不敢進城去接下醫院的興建。所以我打算派你去。你接受嗎？為此我願意付給你@g$Reward$！"
