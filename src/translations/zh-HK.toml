"0xdf10406e" = "幹得漂亮！你的城鎮已經有點規模了。<n><n>一旦你的城鎮人口超過 1000，其他城鎮的商人就會對你產生興趣，他們可能前來交易貨物。<n><n>通常，如果某座城鎮對某種貨物有需求——換句話說，如果有些貨物在你這裏買不到——商人就會到這座城鎮來做買賣。<n><n>你剛剛收到一條關於自己城鎮貿易與生產的消息。要查看它，請打開日誌。<n><n>你的第一個目標，是把城鎮人口增加到 1000人。<n><n>注意：一座城鎮要擁有超過 500名居民，就必須有一家旅店！<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>把城鎮人口增加到 1000人。"
