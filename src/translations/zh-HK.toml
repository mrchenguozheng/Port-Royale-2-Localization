"0x0420c2a2" = "<ts:20>你已經知道如何在「貿易」窗口裏買賣貨物了。這裏再補幾條技巧：<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>箭頭上標出的價格取決於單位數量<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>把一種貨物分10次買賣，和一次買賣 10 單位，總價是一樣的。<n><n><g:INTEXT_AUSRUF_800x600.screen>即使某種貨物沒有貨，價格也照樣顯示。這個價格永遠按一個單位算，與你設定的單位數量無關。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>你也可以直接點擊貨物的圖標來交易。這樣會彈出一個帶滾動條的小窗口，拖動滾動條即可指定你要買賣的貨物數量，單價與總價會立即顯示出來。"
