"0xd07dbe34" = "影響城鎮生活品質最重要的因素是貨物的供應與種類。不過，要讓居民滿意，並不需要保證所有各類貨物的供應。<n><n>城鎮裏的貨物可分為五類：生活必需品、原料、製成品、殖民地貨物和進口貨物。貿易窗口裏也是按這個順序排列的。每一類備足兩到三種貨物，就能讓城鎮的生活品質不錯。<n><n>你剛收到一條關於城鎮生活品質的消息，可以在日誌裏查看。<n><n>你的城鎮規模還小，取得良好生活品質格外容易，因為小城的市民要求不算高。也就是說，你達成目標應該不會有困難。不過，人口不足 2,000 的城鎮無法升到「繁榮」之上的等級。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>確保你的城鎮備有每種貨物各五桶。"
