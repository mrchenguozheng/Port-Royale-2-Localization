"0xf253afcd" = "只有當船隊船長攢夠%1點經驗，你才能開闢這條貿易路線。他目前有%2點。"
"0xf2590753" = "謝謝。看來短期內我們都別想再從歐洲收到進口貨物了。由於我們正與@n$HostileNation$交戰，倒是有機會從敵人的運輸船隊上搶些貨物，而且不必俘獲或擊沉他們的船。<n>請在@D$EndDate$之前，把香料、葡萄酒和工具各弄到@a$Amount$桶，交給市場上我的商人。"
"0xf2590754" = "你的任務是襲擊並洗劫@n$HostileNation$的運輸船隊，但不得俘獲或擊沉其中的船隻。之後你還得把貨物送到市場。期限是@D$EndDate$。"
"0xf2590755" = "就這麼辦。去尋找@n$HostileNation$的運輸船隊，搶下船上@a$Amount$桶進口貨物。之後你須在@D$EndDate$之前把貨物交給一位商人，他會在市場上等你。忠告一句：眼下這一帶局勢極其緊張，你只能搶船上的貨物，既不能俘獲也不能擊沉！"
