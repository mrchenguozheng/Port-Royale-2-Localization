"0x19f413a1" = "這個劇本里你要做的事，比第一個劇本多得多。你會學會怎麼做生意賺到第一桶金。<n><n>你還將組建第二支船隊，以便運載更多貨物。<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>閱讀並照做「事件」窗口裏的提示。"
"0x1a106105" = "這支船隊還沒打過海戰。"
"0x1a2ebe80" = "可惜港口裏沒有符合要求的船隊了。船隊必須正好由 5艘船組成，且船上共帶 150 門炮。等你湊齊這樣的船隊再來。"
"0x1a3808bb" = "那商人叫@N$Name$，老家在@T$Town$。你若能在@D$EndDate$之前毀掉他的船隊，我就重重賞你一批貨物。"
"0x1a444b3b" = "眼下我們並未開戰，所以我不能派你替我去攻佔別國的城鎮。不過情況也許很快就會變化。真有變化再來找我。"
"0x1a444b3c" = "我們正與%1交戰，而你已讓%1只剩下一座城鎮。這我們無法接受，所以眼下我不能派你攻佔任何城鎮。<n><n>不過情況一變，還請再來。"
"0x1a444b3d" = "我很願意派你去攻佔%1的一座城鎮。我手頭的軍事船隊足夠守住任何新佔下的地盤。<n><n>不過%1目前對這項任務來說還是太強了。<n><n>你可以摧毀%1的軍事船隊，助我削弱他們。<n><n>然後再來找我，也許就有新任務給你。"
"0x1a444b3e" = "我很願意派你去攻佔%1的一座城鎮。我手頭的軍事船隊足夠守住任何新佔下的地盤。<n><n>不過%1目前對這項任務來說還是太強了。<n><n>你可以摧毀%1的軍事船隊，助我削弱他們。<n><n>然後再來找我，也許就有新任務給你。<n><n><n>你可以在「編年史」的「國家」一欄裏查看某國的實力。"
