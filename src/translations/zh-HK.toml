"0x17328849" = "未知"
"0x1733ed83" = "在本劇本中，西班牙副王會賜你一塊土地，<n:25>你可以在上面建起自己的城鎮。本劇本的目標，是讓你的城鎮經濟開始繁榮起來。不過在拿到土地之前，你得先提升與西班牙的聲望，並替那位西班牙副王攻下城鎮，以博取他的好感。"
