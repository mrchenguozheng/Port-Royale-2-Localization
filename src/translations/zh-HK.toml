"0xe38974d7" = "結算："
"0xe3922641" = "這副羅盤的指針轉動得非常靈活，幾乎立刻就穩定下來。你從沒見過這麼準確的羅盤。<n>羅盤打造得如同珠寶，底面還刻著各式各樣的花紋。"
"0xe3922642" = "這副圓規握在手中極為妥帖，也很好使。它似乎通體純金，還飾著精細的紋樣。"
"0xe3922643" = "即便在風浪極大的海上，這具六分儀也能給出準確的方位。六分儀的部分構件裝在彈簧上，有助於削弱強烈的震動。"
"0xe3922644" = "這件儀器是一副雙筒望遠鏡，能讓你同時用雙眼望向遠處。你可以把有色玻璃滑到鏡頭上以保護眼睛。側面還能辨認出一道神秘的刻紋。"
"0xe3922645" = "這是一隻普通的金錶，但比你見過的任何一隻都要小。錶盤後面的圓盤上，還看得見一輪似乎緩緩旋轉的月亮。表背也刻著一些花紋。"
"0xe3922646" = "這盞燈與普通提燈相似，但燃燒的燈芯四周裝了許多鏡子，使光線只能朝一個方向照射。藉助罩在開口處、形狀像風扇的裝置，你可以極快地開關射出的光。"
"0xe3922647" = "一把可以來回滑動的尺子嵌在另一把尺子裏，上面還裝著一個透明材料製成的滑動遊標。藉助這件裝置，你可以很快完成簡單的計算。"
"0xe3922648" = "這件奇特的裝置看起來像一支箭。一放進水裏，它上面的葉片就會帶著它旋轉。一個小轉盤會數清每一圈的圈數，讓你得以非常準確地算出船速。"
"0xe3922649" = "這件儀器由旋轉葉片和一個刻度盤組成，刻度盤顯示葉片的轉速。把葉片舉到風中，你就能讀出風向和風速。儀器做工極為精細，上面還刻著一個不明符號。"
"0xe392264a" = "這根繩子想必在海水裏泡過一段時間，卻看起來像剛做出來的一樣。手感異常光滑，打出的結也極其牢靠。"
"0xe39226b2" = "這部對開本里收著大量精美的星圖。一張大表精確地列出了每一顆具體的星何時在何地升起、何時落下。"
"0xe39226b3" = "一枚雕刻精細的圓盤，上面嵌著若干較小的圓盤。按日期與時刻，就能看出當前哪一片星空可見。<n>盤上的刻度表明，這件儀器曾用於測定某片海域中的船位。"
"0xe39226b4" = "你轉動把手，一隻大號號角就會發出女子歌唱般悅耳的聲響。對於在海上漂泊數週的水手來說，再合適不過了。"
"0xe39226b5" = "一根金杆的末端裝著一大塊打磨成弧形的玻璃。把它懸在地圖上方，即便光線再差，也能清楚看見最細的線條。"
"0xe39226b6" = "這張小金屬桌由實心黃銅製成，構造使得無論船身如何傾斜，檯面始終保持水平。外圈的金屬環上刻著似乎標示方向的刻度，但你無法判斷這張桌子曾在哪片海域使用。"
"0xe39226b7" = "一隻小盒子裏裝著一件華美的裝置，可以很方便地生火。盒面上滿是神秘的刻紋。"
"0xe39226b8" = "這隻錨與其說實用，不如說裝飾。它頂多能用來泊一艘划艇。<n>以它的尺寸而言算是很重了，上面佈滿精細的裝飾和不明文字。"
"0xe39226b9" = "這件裝置類似自帶火石的油燈。轉動小輪，火星便飛向燈芯，即便在大風裏也能點起火苗。"
"0xe39226ba" = "這隻號角不是用嘴吹的，而是藉助一個類似打氣筒的裝置。你用力按下它，發出的聲響會比想象中更響亮。"
"0xe39226bb" = "這張海圖與市面上普通的海圖很不一樣。它十分精細，還用上了好幾種顏色繪製。不過你認不出它畫的是哪一片海域。"
"0xe39bb702" = "船隊無法啟航，因為船上火炮太多。賣掉一些火炮，或把它們移進倉庫，別讓火炮數量超過上限。"
