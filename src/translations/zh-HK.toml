"0xcb853f07" = "你的船長在決鬥中擊敗了指揮官。你的水手闖進寶庫，捲走%1。<n><n>現在挑挑你想從城鎮倉庫裏搶走哪些貨物。"
"0xcb8dbdae" = "敵方火槍手"
"0xcb8dd6d9" = "我們的敵人@n$HostileNation$什麼事都做得出來。我妻子被人綁架了，對方還開出了釋放她的條件。不過我恰好知道她被關在哪裏。明面上我什麼也做不了——你明白的——但你可以攻下那座城鎮，把她帶回來給我。"
"0xcb8dd6da" = "很高興見到你。<n>我妻子最近從巴黎得到一隻修剪過的貴賓犬。這隻討厭的畜生把我折騰得快瘋了，可我妻子卻迷上了它。<n>有人聽說了這件事，綁走這條狗，轉交給我們的敵人，用來勒索我們。<n><n>你能替我把那條貴賓犬救回來嗎？"
"0xcb8dd6db" = "不久前，我最小的女兒據說是跟一個路過的冒險傢俬奔了。如今我發現她住在@T$TargetTown$，而且要嫁給城鎮的指揮官。我瞭解自己的女兒，她絕不會自願做出這種事！我總不能去跟副王說，為了救我女兒得攻打一座城鎮吧？可換了你呢？"
