"0x03d3dcd9" = "洗劫城鎮時，你的人遇見一個牽著貴賓犬的少年。那孩子告訴你，是@T$TOWN$的總督自己策劃了這起綁架，為的就是除掉這條狗。船長於是把米歇爾帶上船，接著琢磨到底值不值得把狗送回@T$TOWN$的總督那裏。<n><n>你要把這條狗扔下海嗎？"
