"0x239bed4a" = "船隊最多隻能加入 10艘船。"
"0x23a8f980" = "讀取 / 保存"
"0x23f0ed65" = "我們正與@n$HostileNation$交戰。我手下一位船長剛想出一個妙計，好讓@n$HostileNation$灰心喪氣：把從敵人手裏奪來的船編成一支軍事船隊，讓他們也嚐嚐自己的滋味。<n>看來只有你能替我們把這些船奪過來。"
"0x23f0ed66" = "我們又與@n$HostileNation$開戰了，我想編一支新船隊來保衛我的城鎮。我可不想幹等著歐洲給我派一支新的軍事船隊。<n>可惜我眼下資源有限，才想出用敵人的船來充數的辦法。你願意幫我奪幾艘@S$ShipType$級的船嗎？"
