"0x35f490c5" = "[riddle:answer=Santa Marta;group=35f490c5;clue=白沙,叢林,只有陽光;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 23`]叢林旁一段白沙，一條無名的細河。你在這裏藏得很好，藏進只有陽光才見的海灣。"
"0x35f490c6" = "[riddle:answer=Maracaibo;group=35f490c6;clue=海峽,海灣,船;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 5`]城鎮就在這裏，俯瞰著海峽。它守著這座海灣，因為往來船隻極多。"
"0x35f490c7" = "[riddle:answer=Caracas;group=35f490c7,35f49136;clue=沉船,崖底;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 7`]離城鎮不遠，崖底躺著一艘老沉船的殘骸，破敗不堪。"
"0x35f490c8" = "[riddle:answer=Port of Spain;group=35f490c8;clue=西班牙,木料,磚石,小麥;level=town;certainty=certain;source=original-en]西班牙曾在這裏建過一座港口。你能找到木料和磚石，卻找不到小麥。"
"0x35f49130" = "[riddle:copy=0x35f49052]"
"0x35f49131" = "[riddle:answer=east;group=35f49131;clue=三座,東;level=direction;certainty=certain;source=original-en]一座大灣裏散著幾座城鎮，共三座。X 指的就是其中最東的那座。"
"0x35f49132" = "[riddle:answer=Providence;group=35f49132,35f49133;clue=北;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9]這裏臥著一座島，宛如襁褓。那片陸地自北方伸來，繞成一個彎角。"
"0x35f49133" = "[riddle:copy=0x35f49132]"
"0x35f49134" = "[riddle:answer=Cartagena;group=35f49134;clue=西;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 16*`]你自西邊而來，走過那座橋。帶 X 的城鎮就在前方不遠處。"
"0x35f49135" = "[riddle:answer=Gibraltar;group=35f49135;clue=海灣,峭壁;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 14*`]啊，多麼奇妙的地方。靜靜臥在一座海灣裏。高聳的峭壁護著它——這就是 X，我說得沒錯！"
"0x35f49136" = "[riddle:copy=0x35f490c7]"
"0x35f49137" = "[riddle:answer=southeast;group=35f49137;clue=東南;level=direction;certainty=certain;source=original-en]一條水勢深沉的急流奔湧，向東流入沼澤。自那裏轉向東南，有時還需走陸路。通往那座帶 X 的城鎮，盡頭便是。"
