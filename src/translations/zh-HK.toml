"0x04e5002a" = "[town:Tortuga]爆發了工人罷工。所有工人都放下工具罷工了（不過他們仍讓你的產業照付開銷）。<n><n>你的任務是維持工人平常生產的那些貨物的充足庫存，讓罷工失敗、讓他們復工。<n><n>注意：城鎮生產小麥、磚塊、棉花、糖和菸草。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>你必須在@D$EndDate$之前，讓鎮內每一種貨物的庫存都達到@a$Amount$桶。"
