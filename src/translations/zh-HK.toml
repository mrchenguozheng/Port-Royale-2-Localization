"0x178491f6" = "漲價 5%"
"0x17885da0" = "你遇到一夥漂在木筏上的落難者，救起了@I$Settlers$名移民。他們盼著被送上一座缺人手的城鎮。"
"0x17a97ba2" = "海戰"
"0x17abb14d" = "而且港口的防守極為薄弱。"
"0x17ae0013" = "歐洲來的最後一支船隊通知我，未來幾周我的城鎮會缺進口貨物。<n><n>你能幫我嗎？我不能指望別的商人把這些貨運來。"
"0x17ae0014" = "你知道，@n$Nation1$和@n$Nation2$正在交戰。<n>所以未來幾周，我照樣拿不到歐洲的進口貨物，只能到@n$Nation2$把貨物買下來。<n><n>我已經僱了幾個商人去辦，也希望你能幫上一把。"
"0x17ae0015" = "@n$Nation2$這是在打什麼主意？我剛從線人那兒聽說，從歐洲駛往我的城鎮的運輸船隊正遭襲被搶。你願意幫我買齊所需的進口貨物嗎？"
"0x17d31860" = "已購貨物"
