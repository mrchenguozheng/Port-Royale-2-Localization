"0x0436c531" = "你找到了一艘非同尋常的船！<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>蒸汽動力帆船<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>你這輩子從沒見過這樣的船！它似乎不光靠兩根桅杆上的帆驅動，還有一套奇怪的裝置，用蒸汽帶動兩隻明輪。據說這樣一來，即便一絲風都沒有，這船照樣能走。"
