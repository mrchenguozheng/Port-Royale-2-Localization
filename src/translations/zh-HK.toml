"0xfb3ffb48" = "我要再次感謝你如此慷慨地交出一支船隊。它正在裝配，預計%1天后就能出海。<n><n>如果你還想再交出一支船隊，就得等到那以後。"
"0xfb425369" = "設計支持"
"0xfb4be839" = "太棒了！你把所有海盜船隊都消滅了，現在一個海盜也逃不掉。如果在攻打某個海盜團的藏身處之前，先把它所有的船隊全部摧毀，新的海盜船隊在加勒比海出現就會更慢一些。<n><n>現在像攻打城鎮那樣去攻擊藏身處：先選中你的船隊，然後右鍵點擊海盜藏身處。如果港口裏停泊著一些海盜船，你必須先攻下它們，才能贏下這場港口之戰。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>摧毀黑鬍子的海盜藏身處。"
