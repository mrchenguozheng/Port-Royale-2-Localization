"0x28f090e8" = "私掠許可證"
"0x293d8c9f" = "太棒了！你的城鎮現在規模不小了。很快，第一批來自其他城鎮的商人就會登陸，來與你的城鎮交易貨物。<n><n>不過你的城鎮也可能招來一些不受歡迎的客人，其中包括與你關係不睦的國家的海盜和私掠者。所以你的下一個任務是招募士兵、修築港口炮。<n><n>幸而城鎮裏的市民基本上能自己組織起來。你只要給他們一些指示、買齊所需材料就行，之後就不再有額外開銷。<n><n>你可以在「建造」菜單裏修築港口炮，也可以在宮殿裏招募士兵。<n><n>記住：<n>士兵也需要住處！不過與工人不同，士兵每人只佔一個空間。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>建造五門港口炮，並把士兵人數增加到 300人。"
