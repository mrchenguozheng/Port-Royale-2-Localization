"0x05ae35b1" = "很好！現在去拜訪[town:Port Royale]的西班牙副王，接受一項攻佔法國城鎮的任務。<n><n>通常你得攻佔兩座城鎮，副王才會賞你一塊地。不過在本劇本中你有點額外的優待，只需為西班牙攻佔一座城鎮。<n><n>攻哪座城鎮由你決定。最好挑一座港口炮最少的城鎮。眼下最理想的目標之一是法國城鎮@T$SampleTown$。<n><n>作為攻佔城鎮的回報，副王會賞你一塊地。注意：你的等級至少要達到水手長等級才能與副王對話。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>拜訪[town:Port Royale]的西班牙副王並接受攻佔城鎮的任務。完成這個任務後，就能收下他送的土地。"
