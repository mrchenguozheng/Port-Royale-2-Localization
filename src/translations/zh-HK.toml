"0x343e9f4b" = "恭喜！你現在已瞭解城鎮建設的基本門道。<n><n>生產設施一旦建成，就會自動開始僱傭工人。每個在港口待聘的移民都可以變成一名工人和四名市民。也就是說，一名移民實際上代表的是一整戶移民家庭。<n><n>要讓你的產業有足夠的工人，就得保證有足夠多的移民可供僱傭。運輸船隊把移民從歐洲運到總督城，再由商人運往其他城鎮<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>確保你在聖瑪爾塔的產業有足夠的工人。"
