"0x0ea0e0e8" = "那就快去吧。動身前往@T$TargetTown$一帶的海域。"
"0x0ea0e0ea" = "在@D$EndDate$之前完成這項任務。"
"0x0eb34b66" = "在這個劇本里，你將學會如何開設產業，以及為此需要考慮哪些因素。你還會為新來的工人建造居住區。<n><n>在 Port Royale 2 中，你可以在任何一座你已購得建築許可的城鎮裏動工。你的許可越多，下一張就越貴。你在遊戲開局所在的那座城鎮裏已經有一張許可，所以可以立刻開始在那裏建造新建築。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在聖瑪爾塔建造一座可可生產設施和一座居住區。"
"0x0ede126a" = "現在你已經知道海戰是怎麼打了。你也可以攻打整座城鎮，將其洗劫一空，或代表他國予以攻佔。但要這麼做，你得擁有由強力艦船組成的大型船隊。可以想象，攻打一座城鎮會嚴重損害你與該國的關係，而它的軍事船隊此後也會一路追獵你。<n><n>你也可以選擇攻打海盜藏身處。海盜藏身處通常設在隱秘地點，但這些地點在遊戲進程中的某個時刻都會為人所知。屆時你就可以像攻打城鎮那樣攻打海盜藏身處，把整個海盜團一網打盡。<n><n>這些藏身處的防禦強度，取決於該海盜團逍遙法外的時長，以及他們的船隊劫掠商船的成功程度。<n><n>這個劇本的最後一項任務，是突襲一個小海盜窩。去向@T$TOWN$的總督打聽藏身處的位置。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>摧毀@P$PirateName$的海盜藏身處。"
"0x0eecc4e8" = "英格蘭殖民地"
"0x0eecc4e9" = "法國殖民地"
"0x0eecc4ea" = "荷蘭殖民地"
"0x0eecc4eb" = "西班牙殖民地"
"0x0f1ade15" = "現在你應當在城鎮裏創造就業崗位，並建造居住區。<n><n>移民只有在這座城鎮裏能找到工作時，才會願意留下來，所以你首先得建造四座生產設施。先想清楚要建哪一種生產設施。但務必確保你只生產那些能在其他城鎮賣出利潤的貨物，因為生產成本很高，而你全靠賣貨賺來的利潤過活。<n><n>四座生產設施可以提供 120個崗位。由於這些工人各自都是四口之家的一員，你必須為 480名居民提供住處——換句話說，就是四個居住區。<n><n>生產設施和居住區一旦就緒，你就可以試著從其他城鎮引來移民。移民通常是在總督城裏等著找工作。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>把城鎮人口增加到 480人。"
"0x0f22fe50" = "船隻運營費用"
"0x0f26cfe7" = "新的風暴"
"0x0f3a5490" = "IDM_CONTEST_01_2004_POPUP_HDR"
"0x0f3f777d" = "劍鬥"
"0x0f432e25" = "鏈球"
"0x0f4c7b2b" = "結算"
"0x0f52782d" = "恭喜！你現在可以用棉花在[town:Cartagena]生產布料了。<n><n>不難想象，生產布料的成本在很大程度上取決於你為棉花支付的價錢。因此，只有當你有把握能以合理價格購進原料時，才可以生產製成品。另一個辦法是自己生產這些原料。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在聖瑪爾塔建一座棉花生產設施，並通過貿易把現金增加到@g$GoldGoal$。"
"0x0f5d7735" = "在[town:Charleston]以東很遠的地方就是百慕大群島。務必繞開它們！兩個月前，我姐夫駛往那裏探查，卻再也沒有回來。沒人知道那邊有什麼，但有一點可以肯定：膽敢駛得太近的人，都會遭遇可怕的命運！"
"0x0f5d7736" = "你聽說過百慕大群島最新的傳聞嗎？一個商人想借道群島附近航線前往歐洲，卻始終沒有抵達。他的兄弟出發去找他，只在群島以南找到幾塊殘骸。"
"0x0f5d7737" = "就在前幾天，[town:Port Royale]的一名水手告訴我，他們最近駛得離百慕大群島很近，差點靠得太近——他親眼看見水中有一個巨大的怪物在移動。它噴吐火焰，長耳裏冒出濃煙。膽敢靠近這頭海怪的，必遭橫禍！"
