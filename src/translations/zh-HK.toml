"0x1f36e96b" = "一支運輸船隊很快就要抵達這裏。我的密探告訴我，敵人打算在這支船隊返回歐洲的途中伏擊它。你能護送它平安回家嗎？"
"0x1f36e96c" = "我有個麻煩。我妻子想搭下一支船隊去歐洲，探望她的家人。可惜@n$HostileNation$已經得知此事，正打算攔截船隊。你能保證我妻子平安通行嗎？"
"0x1f36e96d" = "我不久後要把重要文件送往歐洲。眼下我們正與@n$HostileNation$交戰，我不敢冒任何風險，想再加派一支護航隊伍。你能提供這支護航嗎？"
"0x1f6696d2" = "抱歉，看來這任務終究還是不能交給你。我剛收到消息，說這個問題已經不存在了。"
"0x1f851477" = "本該執行這項任務的船隊已被摧毀。"
"0x1f890b43" = "貨物需求"
"0x1f9a14b7" = "<n><n>要攻打藏身處，你得像派船隊去城鎮那樣，派一支船隊過去。小心！進攻時凡是不在藏身處裏的海盜船隊都會收到消息，然後另立新的藏身處。"
"0x1fb02f3a" = "保存"
"0x1fcb6529" = "結束海戰"
"0x1fd35f28" = "動畫美術"
"0x1fdba107" = "他的日薪是%1。"
"0x1fe06eb2" = "容量<n>%1%"
"0x1fe25594" = "突破港口防線後，你的船隊靠岸，水手們穿過城鎮。途中，他們遇上城鎮衛隊的指揮官。除非在公平決鬥中擊敗他，否則他不肯讓路。你的船長接下了挑戰。"
"0x1fea1f37" = "結束本局並讀取存檔？"
"0x1ff731c7" = "保存貿易路線"
"0x200d4e11" = "%1 %2 %3"
"0x20252656" = "在%1發現金礦"
"0x20413ba0" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
"0x204cf373" = "支援城鎮"
"0x204d1e7c" = "海盜藏身處只能從海上來攻。"
"0x20574fcc" = "%1，你替%2奪下了我父親心愛的那座城鎮！我不想再與你有一絲瓜葛，只盼從此再不相見。你要明白，你從來就不曾對我意味著什麼，今後我也不會再為你費心思。<n>我衷心希望，你早晚會受到你罪有應得的那份懲罰。<n><n>%3"
"0x20574fcd" = "%1，你為%2強行吞併了這座城鎮，逼得副王搬去我父親的故鄉，他如今只能返回歐洲。<n><n>我不想再與你有一絲瓜葛，只盼從此再不相見。我還要讓你知道，我一直更留意旅店裏的商人，而不是你。你從來就不曾對我意味著什麼，從今往後你只會是我最不在意的人。<n><n>我衷心希望，你早晚會受到你應得的懲罰。<n><n>%3"
"0x2065f070" = "聽著。我剛收到大使的來信，說%1向我們遞上了和談的橄欖枝。這意味著我們今天就有可能議和。<n><n>所以，我不能再派你攻打城鎮的任務了。"
"0x207295a1" = "已有名為「%1」的貿易路線。<n><c>要覆蓋它嗎？"
"0x2077407d" = "%1，<n>很高興你來了。進來吧，我看看有沒有事給你做。"
"0x207a9d35" = "城鎮衛隊的指揮官站在城牆上向你的船長喊話，要他停戰，改與他單獨決鬥。為避免更多傷亡，你的船長答應了。"
"0x207b620f" = "你的部隊攻破城門後，迎面撞上城鎮衛隊的指揮官。他向你的船長提出決鬥。"
"0x208aca1b" = "在這一帶搜尋英格蘭船隊，摧毀其中@I$NumConvoys$支。"
"0x208aca1c" = "在這一帶搜尋法國船隊，摧毀其中@I$NumConvoys$支。"
