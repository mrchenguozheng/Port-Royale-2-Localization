"0x20ccd2d7" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen>"
"0x20d2607a" = "幹得漂亮！[town:Tortuga]又恢復了「繁榮」狀態。你在@I$Days$天內完成了這項任務。"
"0x20de74a6" = "追擊船隻"
