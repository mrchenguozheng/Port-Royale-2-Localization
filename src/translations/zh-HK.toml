"0x39e32dc6" = "多謝了。那座城鎮名叫@T$TargetTown$。我希望能趕在@D$EndDate$之前和那裏的商人談妥條件。在此之前，這座城鎮的狀態不能跌到「繁榮」以下，那我談判時才更有底氣。"
"0x39e32dc7" = "那座城鎮就是@T$TargetTown$。請把它需要的各種貨物一應供應充足。我會在@D$EndDate$之前想盡辦法徹底平息這個傳聞。在此之前，城鎮狀態不能跌到「繁榮」以下。"
"0x39e32dc8" = "陷入困境的那座城鎮是@T$TargetTown$。在@D$EndDate$之前，它的狀態不能跌到「繁榮」以下，否則太多市民會離城而去，那裏甚至有爆發瘟疫的風險。你必須及時給城鎮供應足夠的貨物，阻止這一幕！"
"0x39e32dc9" = "很好，出問題的城鎮是@T$TargetTown$。你要在@D$EndDate$之前把它需要的東西全部供應到位，狀態不能跌到「繁榮」以下。老實告訴你，這座城鎮很可能會鬧瘟疫。你要有心理準備。"
"0x39e7361e" = "%1已被擊敗"
"0x39e9081a" = "你已發現了黑鬍子藏身處的位置。要查看這夥海盜的資料，請在海圖上左鍵點擊藏身處的標記。<n><n>當心：摧毀藏身處會把這夥海盜一網打盡。但當時不在藏身處裏的海盜船隊會得到消息，隨後另立新的藏身處。<n><n>所以你的首要目標是摧毀屬於該藏身處的所有船隊。最好埋伏起來，襲擊進出藏身處的船隊。<n><n>我們又撥給你一筆錢，助你完成這趟差事。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>摧毀黑鬍子所有在海上的海盜船隊。不要攻打他的藏身處！"
