"0xdd14592b" = "突破港口防禦之後，你的船隊靠岸，水手們下船去搜尋海盜寶藏。他們突然撞上海盜%1，對方向你船長提出決鬥。"
"0xdd22ec49" = "你的新船已經在港口裏。基礎船員也已經上船了。"
"0xdd379158" = "在@D$Date$之前，把@a$Amount$桶[term:en_tools]送到@T$DestTown$的市場。每賣出一<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>，你就能拿到@g$GoldPerBarrel$。"
"0xdd3808a0" = "序章<n><n>在 Port Royale 2 中，凡是持有建築許可的城鎮你都能建造。而遊戲起始的那座城鎮，你本來就擁有建築許可。<n:25>這個劇本會教你建造與生產。你的任務是建起若干商業建築和住宅建築。在劇本的各個步驟中，你得自行尋找原料移民和工人。"
