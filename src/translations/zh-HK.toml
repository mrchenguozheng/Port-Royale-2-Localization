"0x27beb2d9" = "從@n$HostileNation$的運輸船隊上各劫掠@a$Amount$桶香料、葡萄酒和工具。你不得俘獲或擊沉任何船隻。之後在@D$EndDate$之前把這些貨物送到@T$TOWN$的市場。完成後，你可以去總督那裏領取獎勵。"
