"0xdcba5843" = "見到你真高興，@A$USER$，因為我需要你的幫助。我曾在海盜@P$PirateName$手下效力。不過後來我醒悟過來，與@T$TargetTown$的總督做了一筆交易。可惜我昔日的同夥得知此事後，懸賞要我的命。你能幫我一把，把我送到@T$TargetTown$嗎？"
"0xdcba5844" = "我聽說你值得信賴，@A$USER$。我如今在@T$TargetTown$總督手下效力，必須儘快見到他，向他遞交一份極其敏感的情報。不幸的是，有些人鐵了心要阻止我抵達@T$TargetTown$。因此我想問你，能否讓我平安通行。"
"0xdcba5845" = "唉，我真是禍不單行。幾周前，我撞見了一艘屬於惡名昭著的海盜@P$PirateName$的船。可這艘船的船長想必是個雛兒，因為我們幾乎沒費什麼勁就把它沉了。<n>不幸的是，這個倒黴船長偏偏是海盜@P$PirateName$寵愛的侄子。自從他聽說過我的名字，就一路追殺我。我的船員們搶走了我的船，驚慌逃散，於是我現在被困在了這裏。<n>你能幫我回到我的故鄉@T$TargetTown$嗎？"
