"0x080f2b29" = "<ts:20>關於貨物，你需要知道以下這些：<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>貨物分五大類：生活必需品、原料、製成品、殖民地貨物和進口貨物<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>每座城鎮能生產五種貨物<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>城鎮分兩類：殖民地城鎮，以及設有總督的城鎮<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>總督城生產生活必需品和製成品，同時定期收到從歐洲運來的進口貨物。所以這兩樣東西在總督城最容易買到。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>總督城需要原料來生產製成品，同時也收購殖民地貨物。這些貨物由從歐洲運來的運輸船隊送達。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>殖民地城鎮生產生活必需品、原料和殖民地貨物。每種殖民地貨物只能在加勒比的特定區域生產。比如咖啡，就只有加勒比的南部和西部出產。<n><n>關於價格，你需要知道以下這些：<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>某種貨物需求越大、在某鎮供應越少，價格就越高。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>你在某國的聲望越好，在該國城鎮裏買貨的價格就越低。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>只應該在貨物的產地城鎮進貨。<n><n>最快的賺錢路子：<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>在殖民地城鎮買進殖民地貨物和原料<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>到總督城賣掉這些貨，再買進製成品和進口貨物。"
