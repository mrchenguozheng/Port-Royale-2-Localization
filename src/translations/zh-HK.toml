"0xd9942740" = "你真是鴻運當頭！<n>這是我的最後一局，我輸光了。"
"0xd9942741" = "你把我的金子全拿走了。給我上一瓶朗姆酒，然後讓我一個人借酒消愁吧。"
"0xd9942742" = "這下你可把我害慘了！今晚我都沒臉回家見人了。"
"0xd99427aa" = "你贏了這一局！"
"0xd99427ab" = "要不要再來一局？"
