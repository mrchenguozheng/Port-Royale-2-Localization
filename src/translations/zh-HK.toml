"0xf4e195bf" = "黑鬍子發現你在與@T$TOWN$的總督合作。於是他開始恐嚇前來@T$TOWN$的商人。不出幾天，就幾乎沒有商人敢再前往@T$TOWN$了。<n><n>這不過是他的臨時手段。你的任務是持續為該城鎮供應貨物，直到@D$EndDate$。城鎮狀態不得降到「興旺」之下。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>持續向@T$TOWN$供應貨物直到@D$EndDate$。城鎮狀態不得降到「興旺」之下。"
