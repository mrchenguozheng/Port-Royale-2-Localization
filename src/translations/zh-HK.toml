"0x1b0a0b6d" = "你已經晉升為「水手」。從今天起，你必須做點什麼，才能保住與該國的高聲望。<n><n>提升聲望的辦法有：貿易、向教堂捐獻、籌辦慶典、清剿海盜，以及完成總督任務和私掠許可證。<n><n>若聲望沒有改善，它每天都會略微下降。注意：你在某國城鎮裏建造的房屋數量，決定了這套機制下聲望能跌到多低。<n><n>聲望既影響貿易價格，也決定城鎮給不給你派任務。聲望低了，也得提防軍事船隊！"
"0x1b33d8e6" = "可能有閒置貨物被運走！"
"0x1b407276" = "生產"
"0x1b416d15" = "資產"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "最遲須在@D$EndDate$之前，把[town:Tortuga]的市民人數（總人口減去士兵數）恢復到@I$Pop$，這樣各產業才能配齊工人。"
"0x1b900424" = "旅行者"
"0x1ba04e6b" = "一支屬於%1的軍事船隊，被%2的船隻摧毀了。"
"0x1ba7362a" = "屬於%1的軍艦襲擊了屬於%2的貿易船隊。"
"0x1bcad43f" = "今天，%1的私掠者%2用假名潛入城鎮，在工人中掀起了極大的騷亂。他們現在拒絕幹活，整整兩週。"
"0x1bccfb60" = "總價"
"0x1be1209e" = "你自己的城鎮"
"0x1be7a5dc" = "你必須找到那個包裹。@l$Pos$在@D$EndDate$之前送到@T$TOWN$的@N$OwnerName$手裏。"
"0x1bf425d5" = "可惜你與這座城鎮所屬的國家為敵，只好偷偷潛進了港口。"
"0x1c0b520a" = "沒有可用的存檔"
"0x1c1160cb" = "技術主管"
