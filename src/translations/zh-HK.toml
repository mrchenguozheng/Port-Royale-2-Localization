"0x00885bdb" = "幹得好！你現在有了自己的城鎮！除了你，誰也不能在這座城裏動工。<n><n>城裏已經有一些建築，比如可以交易的碼頭，以及你的宮殿。其餘的都得你自己蓋。<n><n>駕船隊駛向你的城鎮。木材和磚塊能帶多少帶多少，因為建造房屋要用到它們。<n><n>先建一座船塢，這樣你就能維修自己的船了。<n><n>注意：<n>維持護航船上的船員開銷很大。如果不再需要他們，就把他們解散掉吧。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>去你的新城走一趟，建起一座船塢。"
