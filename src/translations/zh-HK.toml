"0x2875b307" = "%1 %2 摧毀了海盜%3的一支船隊。"
"0x28812f6e" = "聽說你想檢驗一下自己作為海戰指揮官的本事。好，我有個任務，對你我都有好處。<n>此刻有兩艘被遺棄的船在海上漫無目的地漂流。我要你在它們威脅到我的商人之前把它們清除掉。<n>你接受這個任務嗎？"
"0x28812f6f" = "現在來件難一點的。有隻小鳥告訴我，@P$PirateName$指揮的一支海盜船隊正在海上游蕩。船隊只有一艘船，摧毀它對你來說應該不算太難。<n>你接受這個任務嗎？"
"0x28812f70" = "你已經摧毀過@P$PirateName$的一支海盜船隊。不過一個海盜藏身處通常有好幾支船隊，全都由@P$PirateName$指揮。要徹底除掉一個海盜團伙的頭目，只能找到並摧毀他們的藏身處。<n>又一支由@P$PirateName$指揮的船隊出現了。這支船隊有兩艘船，開戰前你必須做好準備。<n>你準備好了嗎？"
"0x2883fdae" = "你可以率領一支船隊從海上攻擊這個海盜藏身處。你必須先消滅港口裏的所有船隻。"
"0x289d1ced" = "每日消耗"
"0x28b1f98d" = "%1 %2 你還持有建築許可，可在%3建造房屋、開辦產業，並且你已在該城鎮擁有一座倉庫。<n><n>你年輕且缺乏經驗，目前只達到見習水手等級，因此還不能指揮更多貿易船隊，也不能在其他城鎮再購買建築許可。<n><n>你的等級由總資產決定，包括現金與船隻等財產，目前約為%4；總資產達到%5時，你就會晉升下一級。<n><n><n>祝你好運！"
"0x28c94158" = "船隻"
"0x28cc4ee4" = "船隊無法起航，因為船上的貨物太多了。賣掉一些貨物，或把它們挪進倉庫，別超過船隊的最大載貨量。"
