"0xd44a911d" = "恭喜！你現在有了一些生產貨物的經驗。你可能也注意到了，想在維持其他貨物貿易的同時把自己生產出來的貨物高價賣出，並不總是件容易的事。<n><n>如果你在後續劇本或自由模式中開設產業，就必須始終確保產出的貨物能盈利賣出。生產貨物的成本很高，而找到原料也並非總是容易。<n><n>正因如此，你應當先通過貿易積累起財務儲備，然後才非常緩慢地開始生產貨物。"
