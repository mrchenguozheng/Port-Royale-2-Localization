"0x05716a06" = "你下一場戰鬥會難一些，因為這次敵人會還手。你的任務是替總督追蹤並殺死一名海盜。<n><n>但首先你得為戰鬥武裝船隊。買一艘船，把它編入船隊，再裝上新的武器和水手。<n><n>海戰期間隨時按住 F1 就能查看鍵鼠設置。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>武裝你的船隊，完成[town:Cartagena]總督交給你的新任務。"
