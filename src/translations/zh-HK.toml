"0xcdf0b227" = "一些商人聯合起來，要求在我們的海域獲得更充分的保護。為了讓這些要求更有分量，他們決定近期停止為我們的某座城鎮供貨。你能出手相助，幫我和市民們解圍嗎？"
"0xcdf0b228" = "我們的某座城鎮現在整週都幾乎見不到一個商人，因為有傳言說那座城鎮爆發了瘟疫。你能幫我平息謠言，給那座城鎮供貨嗎？"
"0xcdf0b229" = "近幾周來，瘟疫的威脅一直懸在我們的某座城鎮上空。更糟的是，商人如今也對該城敬而遠之。你能幫助扶持這座城鎮，直到情況好轉嗎？"
"0xcdf0b22a" = "幾天前，我們的一座城鎮有位市民死於瘟疫。我們試圖隱瞞，但消息還是傳出去了。如今許多商人決定不再前往那座城鎮。你有一支出色的貿易船隊，能否替那座城鎮供貨一段時間？"
"0xcdfdf758" = "你的軍艦逼退了來犯者。"
