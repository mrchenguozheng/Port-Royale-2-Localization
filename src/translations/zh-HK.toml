"0x0ce1a79e" = "你現在身處殖民地城鎮聖瑪爾塔。點擊城鎮名稱，即可顯示城鎮信息。"
"0x0ce1a79f" = "像聖瑪爾塔這樣的殖民地城鎮，能生產兩種生活必需品、兩種原料和一種殖民地貨物。<n>上一劇本中你已經瞭解到，總督城對原料和殖民地貨物的需求格外旺盛。<n>你打算先生產可可這種殖民地貨物。<n>現在關閉城鎮信息。"
"0x0ce1a7a0" = "殖民地貨物是從總督城運往歐洲的，因此這些城鎮對可可的需求很高。條件正適合你開辦第一家產業。現在找出並點擊城鎮正中的總建築師建築。"
"0x0ce1a7a1" = "在總建築師處，你可以申請建造新建築的許可，也可以交還建築許可。當然，你現在不想這麼做！<n>看看你可以建造哪些建築。窗口右側的按鈕也可以使用。<n>點擊「可可種植園」按鈕。"
"0x0ce1a7a2" = "你現在能看到需要多少建築材料、建造要花多少錢。<n>你也能看到倉庫裏現有多少建築材料，以及還需向城鎮購買多少。<n>你目前的材料充足。<n>把鼠標移到可用的建造位置上，左鍵點擊。"
"0x0ce1a7a3" = "可可生產設施的腳手架已經搭好，開工了。<n>建造需要幾天時間才能完工。在此期間，你該為新來的工人安排住處。<n>關閉建造菜單，在聖瑪爾塔尋找一處住宅區。"
"0x0ce1a7a4" = "這處住宅區屬於城裏的一位商人。你可以查看當地商人擁有多少住宅區、共有多少住戶。你想自己建一處住宅區。為此，打開建造菜單。"
"0x0ce1a7a5" = "在建造菜單中選中住宅區，查看建造費用顯示。<n>你的庫存裏可能沒有足夠的建築材料。不過，只要城鎮供應充足，你可以在城裏買到任何需要的材料。<n>否則，你就得去別的城鎮弄貨。<n>然後建起一處住宅區。"
"0x0ce1a7a6" = "一家[term:en_business]可僱用 30名工人。普通工人家庭平均有四口人，所以每開一家產業，就需要能容納 120人的住處。<n>一處住宅區可容納 120名住戶，因此每家產業需要配一處住宅區。<n>現在關閉建造菜單，點擊你新建的住宅區。"
"0x0ce1a7a7" = "住宅區沒有建造期，因為住戶一開始是住在帳篷裏的。<n>隨著時間推移，住戶們自己會把住宅區發展成一座相當可觀的建築。<n>住宅區的外觀取決於它的年頭和城鎮的狀態。<n>關閉住宅區對話框。"
"0x0ce1a80f" = "你已經知道，在城鎮裏建造的第一座建築必須是倉庫。在建成之前你無法建造其他任何建築。<n>你在遊戲起始的那座城鎮裏已經有一座倉庫。找出它並點擊它，它在屏幕上顯示為淺藍色。"
"0x0ce1a810" = "在倉庫裏，你可以看到自己在城中擁有哪些建築，以及維護它們要花多少錢。<n>你還能看到住戶向你支付的租金，以及各家產業正在生產哪些貨物。<n>之後你就能向店主下達指令了。<n>在倉庫裏四處看看，然後關閉它。"
"0x0cee08cc" = "這座城鎮的駐軍狀況還有待加強"
"0x0cf75014" = "關閉"
"0x0cf7abef" = "點擊你的可可種植園。這個界面總會顯示你在該城的所有可可種植園。<n>生產設施建成後，你需要 30名工人，也就是 30名移民。現在離開種植園，前往港口的碼頭，按下「貨物」按鈕（右下角那個）。"
"0x0cf7abf0" = "在這裏你能看到城裏是否有待僱的移民，或者城鎮是否需要新工人。你的產業一建成，就會是這個情況。<n><n>去周邊總督城，把移民帶到聖瑪爾塔，直到你的產業配齊工人。"
"0x0d0db040" = "點擊你的可可種植園之一。"
"0x0d0db041" = "你現在能看到你的產業每天生產多少可可，以及這需要多少工具。<n>現在往倉庫裏囤夠@a$SubGoal$桶[term:en_tools]，因為你的倉庫要為產業供應貨物。"
"0x0d0db042" = "工具屬於進口貨物。這意味著在總督城裏貨源最充足、價格最低。<n>你可以去西南方的[town:Cartagena]，或者東邊很遠的[town:Margarita]找找貨源。"
"0x0d0db043" = "幹得好！<n>你所需原料的平均價格越低，所產貨物的生產成本就越低。<n>現在繼續生產可可，直到倉庫裏囤夠@a$AmountGoal$。"
"0x0d0f1795" = "7月"
"0x0d0f1877" = "6月"
"0x0d1098bd" = "%1，<n>你是新來這裏的吧？不過我已經聽說過你了，你的名聲傳在前頭。你該時不時來拜訪我，總有活兒要幹。"
"0x0d23b491" = "駕著你的船隊前往[town:Cartagena]鎮並進入城鎮。<n>屏幕右側的鎮名下方會顯示一個小圓形圖標，它顯示你至今在卡塔赫納的貿易記錄。<n>本劇本里你較為順利，因為你得到了一份加成。<n>現在打開城鎮信息。"
"0x0d23b492" = "在「貿易記錄」下，你現在可以查看所要求分數的完成百分比。這裏顯示 100% 時，你就可以向總建築師申請許可證。<n>關閉城鎮信息。"
"0x0d23b493" = "貿易窗口裏，該城鎮稀缺貨物的價格以紅色顯示。賣出這些貨物，能同時提升你在城鎮的貿易記錄，以及與城鎮所屬國家的聲望。<n>點擊一次碼頭，查看城鎮貨物的庫存信息。"
"0x0d23b494" = "記下城鎮缺哪些貨物。例如，這座城鎮總會需要糖和棉花，因為它出產朗姆酒和衣物。<n>不過城鎮裏還有其他稀缺貨物。<n>去其他城鎮買進[town:Cartagena]需要的貨物，提升你的貿易記錄。"
"0x0d23b495" = "不錯！你在[town:Cartagena]的聲望提升了不少。<n>但當心別在[town:Cartagena]大量買進稀缺貨物！稀缺貨物很容易辨認，它們的庫存是以紅色顯示的。<n>把你的貿易記錄分數提升到 85%。"
"0x0d23b496" = "幹得好！你在[town:Cartagena]已經有 85% 的分數了。繼續保持！<n>把分數提升到 100%。<n>順便一提，你剛收到一條關於「晉升與等級」的消息。"
"0x0d23b497" = "太棒了！你與[town:Cartagena]的交易量已經足夠。<n>可惜你的等級仍是普通水手，所以只能獲發一張許可證。<n>要升到下一等級，你得再通過貿易增加財富。"
"0x0d23b498" = "很好！作為水手，你可以獲發兩張建築許可。<n>去[town:Cartagena]的總建築師那裏申請建築許可。<n>如果你的錢不夠，那就再交易一些。別忘了賣掉你在聖瑪爾塔生產的貨物。"
"0x0d2a3b89" = "船隻維護費"
"0x0d39b8e2" = "你必須先在[town:Cartagena]建起一座倉庫，之後才能建造其他任何建築。"
"0x0d39b8e3" = "現在開設兩座織造廠，並建起兩處住宅區。<n>如果城裏建築材料不足，你得去別的城鎮買來，運到碼頭處的倉庫。<n>別忘了在花掉寶貴的金幣之前先談好價錢！"
"0x0d39b8e4" = "你要確保在織造廠建成之時，倉庫裏備有@a$SubGoal$的棉花，好讓新產業一開張就能用棉花織布。"
"0x0d39b8e5" = "你的下一個目標是為[town:Cartagena]的倉庫自產@a$SubGoal$的布料，並等織造廠建成。<n>每@a$SubGoal$布料，正好需要@a$SubGoal$棉花。"
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>軍事<t>你的護航船與商船<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>海盜<t>你的護航船與商船<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "存檔無效！"
"0x0d496e89" = "點擊貨物可開啟或取消購買。"
"0x0d496e8a" = "倉庫管理員自動購買"
"0x0d4fbd33" = "很好！<n>為了讓織造廠始終有足夠的原料，你現在應該在聖瑪爾塔開設一家棉花產業。<n>一座生產設施足以供應兩座製造設施的原料。"
"0x0d4fbd34" = "現在讓你在聖瑪爾塔和[town:Cartagena]的產業全速運轉。<n>別忘了[town:Cartagena]的織造廠需要棉花持續供應。<n>繼續交易，賣出你生產的貨物。<n>一旦你的現金增加到@g$GoldGoal$，本劇本即告結束。"
"0x0d552127" = "該城鎮不可進攻"
"0x0d578089" = "你在過去 30天裏已經襲擊過%1這座城鎮。船長出於道義理由拒絕再次進攻。"
"0x0d58ea99" = "%1私掠者%2撬走了%3名工人及其家屬。城裏許多產業如今都無法滿負荷運轉了。"
"0x0d750c45" = "%1支船隊"
"0x0d919a5a" = "%1，<n>換作平時，我早叫你見鬼去了，但眼下這種危難時候，我連靈魂都肯賣給魔鬼本人。<n><n>那就進來吧，我有件事要告訴你。"
"0x0d9c1799" = "你的任務，是設法讓@T$TargetTown$在@D$EndDate$之前把城鎮狀態降到「衰退」。你有兩個選擇：<n><n>其一，攻打該城鎮並搶光全部貨物，把城鎮狀態打成「復甦」。此後由於貨物匱乏，城鎮狀態還會繼續下滑。<n><n>其二，你也可以通過攔截貿易船隊來切斷對該城鎮的貨物供應。注意：如果你只搶掠一支船隊而不俘獲它，你與相關國家的聲望所受損害會小得多。"
"0x0d9c179a" = "很好！我要交給你的任務是讓@T$TargetTown$陷入「衰退」狀態。你的期限是@D$EndDate$。<n><n>要達成目標，你必須攔截所有前往該城鎮的商人，讓它再也收不到任何貨物，城鎮狀態隨之緩慢下滑。<n><n>不過，也有辦法讓這一切來得更快：那就是攻打併洗劫這座城鎮。你的進攻會讓城鎮狀態迅速跌到「復甦」，而隨之而來的貨物匱乏會讓它繼續下探，直到跌入「衰退」。"
"0x0daa656f" = "霰彈"
"0x0dbd9444" = "我沒什麼事需要你做。"
"0x0dbd9445" = "很遺憾，我現在沒有消息可告訴你。過些時候再來吧。"
"0x0dbd9446" = "恐怕我這裏沒有委託給你。幾天後再來找我。"
