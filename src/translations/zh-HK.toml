"0xdfb549a4" = "我們正與%1交戰，但敵人的軍事船隊不足以守衛它的海域。我要你抓住這個機會，攻佔一座城鎮。"
"0xdfb549a5" = "%1的軍事船隊不足以守衛它的海域！那就立刻出發，攻佔一座城鎮！！<n>我能指望你嗎？"
"0xdfb9b5b7" = "太棒了！你現在有@g$Gold$了。<n><n>每個國家都有軍事船隊，用來保衛自己的城鎮、保護城鎮周圍的水域。一個國家佔領的城鎮越多，需要的軍事船隊就越多，才能確保這些城鎮都得到足夠的保護。<n><n>一個國家若損失了一支軍事船隊，其軍事實力就會削弱。由於戰爭期間軍事船隊對敵國的城鎮和船隊相當激進，一個國家時不時就會損失一支軍事船隊。因此，歐洲方面會定期派出船隊，為該國家在新大陸的軍事實力提供增援。<n><n>你可以在編年史的「國家」一欄查看某個國家的實力。如果一個國家被描述為「虛弱」，它的城鎮就可以被攻佔。<n><n>你現在要擊敗足夠多的英格蘭軍事船隊，讓英格蘭的實力被評為「虛弱」。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>擊敗足夠多的英格蘭軍事船隊，讓英格蘭被評為「虛弱」。"
