"0xfc5c9324" = "<gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Gold_X3_800x600.screen>"
"0xfc64ab0e" = "你現在可以通過襲擊法國的船隻和城鎮來提升在%1的聲望，這不會削減你在其他國家的聲望。"
"0xfc692ef1" = "<n><n>不過，只要你的船隊裏有至少一艘船在戰役中存活，船長也會活下來。"
"0xfc71eb4b" = "什麼倒黴事落到我頭上了。自從與@n$FoeNation$開戰以來，我一直無法為運輸船隊備足殖民地貨物。你能幫我弄一大批@G$Goods$來嗎？"
"0xfc71eb4c" = "自從我們與@n$FoeNation$開戰，他們的商人就被禁止向我國城鎮運送@G$Goods$。我現在面臨嚴重的貨物短缺。你有那麼多船，又熟悉海路，能幫我弄一大批@G$Goods$來嗎？"
"0xfc72151e" = "倉庫 - 船隊轉運"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "按火炮數"
"0xfc910833" = "可建造的住宅建築"
"0xfc9a5f7d" = "和你做生意很愉快。祝你安好！"
"0xfc9a5f7e" = "貨物已經送進你的倉庫。祝你安好！"
"0xfc9a5f7f" = "貨物已經裝上你的船隊。再見，%1。"
"0xfc9cf623" = "已完成"
"0xfca882e8" = "你知道，西班牙寶藏船隊每次從殖民地收取珍寶運往歐洲時，都會走不同的航線。它只在每座城鎮短暫停留，以避開埋伏。不過這一次西班牙犯了個嚴重的錯誤，讓我們查到了西班牙寶藏船隊此刻正在走的航線。你的命令再簡單不過：把每一艘船都摧毀！"
"0xfca882e9" = "我們正與西班牙交戰，必須確保西班牙寶藏船隊永遠到不了歐洲。幸運的是，我們已經查明船隊下一站會停靠哪座城鎮。我們要在那座城鎮搞破壞，迫使它延長停泊時間。這應該能給你足夠的時間去截住船隊，阻止它抵達歐洲。你接受這項任務嗎？"
"0xfca882ea" = "這種機會可不是天天都有！今天我的一個線人告訴我西班牙寶藏船隊眼下正在走的航線。但這還不是全部。我們得知船隊會在下一座訪問的城鎮停泊得比平時更久。既然我們正與西班牙交戰，也該讓副王高興一下，絕不能讓寶藏船隊抵達它在歐洲的目的地。你願意為我國截住這支船隊嗎？"
"0xfcc82d44" = "軍刀戰士"
"0xfcd6fdec" = "看來你還沒完成我上一個委託。把這件事辦完，因為我還有更多活兒交給你。"
"0xfcded04c" = "IDM_CONTEST_01_2004_LOG_01_TEXT"
"0xfce1cfd1" = "恐怕我現在用不上你。<n>只有當敵國實力削弱、而且我有足夠的軍事船隊保衛我的城鎮時，我才能委託你攻佔城鎮。"
"0xfce38f12" = "城鎮指揮官"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "環境音"
"0xfd1be8e3" = "%1私掠者%2偷偷潛入城鎮，毀掉了城鎮裏好幾位商人的大量存貨。鎮議會拒絕承擔賠償責任。"
"0xfd1f0281" = "原料與生產"
"0xfd26f2aa" = "船隊@C$Convoy$救起了一名落難者。把他送到@T$DestTown$。"
"0xfd26f2ab" = "船隊@C$Convoy$救起了一名落難者。把他送到@n$DestNation$的一座城鎮。"
"0xfd26feb4" = "@N$Name$因為你動作太慢，一怒之下跳海了。"
"0xfd2f55fd" = "遊戲日期"
"0xfd40a541" = "<n><f:fonts/Tiepolo_black14x14aaFHk.res>損失<t><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen> %1<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen> %2<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_MANN_800x600.screen> %3<n>（約%4）"
"0xfd4ed860" = "你的部隊攻破城門，抓走了城鎮指揮官作為人質。城鎮的士兵一見如此便投降了。<n><n>你現在想做什麼？"
"0xfd518241" = "%1的總督城"
"0xfd638295" = "正在載入遊戲…"
"0xfd6477c9" = "把你船隊的火力提升到至少 90 門火炮。"
"0xfd69d24a" = "%1:%2:%3"
"0xfd6d4abb" = "你採取的行動使你無法成功完成本劇本。<n><n>請遵循「事件」窗口裏的說明。"
"0xfd9349ac" = "沒收"
"0xfda0635d" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>左鍵<f:fonts/Tiepolo_bold14x14aaFH.res><t>齊射<n><f:fonts/Tiepolo_black14x14aaFHk.res>右鍵<f:fonts/Tiepolo_bold14x14aaFH.res><t>設定航向<n><f:fonts/Tiepolo_black14x14aaFHk.res>1,2,3<f:fonts/Tiepolo_bold14x14aaFH.res><t>選擇彈藥<n><f:fonts/Tiepolo_black14x14aaFHk.res>4<f:fonts/Tiepolo_bold14x14aaFH.res><t>準備登船<n><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>開炮"
"0xfda277f4" = "%1已經滿了，再也沒有空間可以建造倉庫。如果你仍想在這座城鎮站穩腳跟，可以試著說服當地一位商人拆掉他自己的一處產業。<n><n>如果某種商品在城裏的價格長期維持在低位，也就是說該商品出現了過剩，對應的產業就會被拆除。要造成這種局面，你必須先開始囤積該產品，然後在城鎮市場賣出足夠多的量，把價格壓到低位。<n><n>本地生產的商品每天一次送到城鎮市場。如果價格目前處於最低水平，該產業就會削減工人編制。點擊該產業即可查看這一點。一旦有 30名工人被裁減，該產業就會被拆除。"
"0xfda5ded4" = "因發現金礦，這座城鎮日益繁榮"
"0xfdaf6463" = "我必須再次感謝你，你為我國做了這麼多。作為獎賞，我把城鎮%1剩下的土地也給你。現在你擁有整個區域了。"
"0xfdb7f907" = "一堆營火暴露了老師的藏身處，就在離岸不遠的地方。你的船長划船上岸，遇見一位老人。老人看到所有的葡萄酒，欣喜地搓起了手。"
"0xfdb7f908" = "離岸不遠，你的船隊發現了一處小小的隱士營地。你的船長划船上岸，遇見一位老人，他身上的船長制服比他自己還要舊。他一眼看見那些朗姆酒桶，欣喜不已。"
"0xfdb7f909" = "過了一陣子，你的船隊在陸地上發現了一處藏身處。船長划船上岸四處查看，終於找到了那位老人並說明來意。隱士收下了食物。"
"0xfdc606cf" = "追捕海盜"
"0xfdcdfd58" = "他很樂意把自己那一套生意門道全教給你的年輕船長。"
"0xfdcdfd59" = "因此他會把自己所知的取勝之道全部教給這位年輕船長。"
"0xfdcdfd5a" = "他很樂意把航海的門道全都教給這位船長。"
"0xfdd49861" = "海難殘骸"
