"0x072a9579" = "你替我把這些進口貨物帶回來，我感激不盡——新世界這邊已經好幾個星期沒得到我國的運輸船隊補給了。作為報答，我送你兩艘荷蘭笛型商船。它們正在港口等你。"
"0x0744a699" = "我沒法告訴你寶藏船隊還會造訪多少座城鎮。能肯定的是，船隊每造訪一座城鎮，船上裝的黃金就更多一些。你什麼時候動手都行，拿到手的黃金全歸你。我只要你確保寶藏船隊消失。它上一站是@T$StartTown$，下一站是@T$DestTown$，會在那裏拋錨約五天。"
"0x0744a69a" = "所以你得抓緊動手。它上一站是@T$StartTown$，正駛向@T$DestTown$，會在那裏停留得比平時更久。你拖得越久，它船上的黃金就越多。這些錢你可以全拿走，但寶藏船隊絕不能抵達歐洲。"
"0x0744a69b" = "那就說定了，謝謝。如果我的情報沒錯，寶藏船隊最近已離開@T$StartTown$，正駛向@T$DestTown$，會在那裏停留得比平時更久。現在趕緊去截住它！"
"0x0746253d" = "如果想讓儘可能多的商人來你的城鎮光顧，最簡單的辦法就是某些貨物乾脆不往城鎮裏供應。最好挑那些鄰近城鎮生產的貨物，因為商人會把路程遠近算進去。<n><n>來你的城鎮的商人會自動買走那些貨源充足、因而在你城鎮裏價格低廉的貨物。你也可以把城鎮裏生產的貨物直接賣給你的城鎮。只要價格不比別的城鎮高，商人就會定期買走。<n><n>這樣做的好處是市民的日常所需總有著落，你也不必操心把這些貨物運到別的城鎮去。"
