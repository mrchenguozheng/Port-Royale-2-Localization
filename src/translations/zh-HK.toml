"0xd4b8ac66" = "你好！我正在起草一篇新的歷史隨筆。"
"0xd4cd0f3d" = "亨利 艾弗裏是成功海盜的典型範例。他劫獲了當時最富有的船隻，成功躲避當局追捕，並且活得足夠久，得以享受自己的財富。<n><n>艾弗裏早年的經歷籠罩在迷霧之中。不過我們知道，1694年6月，他還是一艘名叫「查爾斯」號的私掠船上的大副；該船獲得西班牙方面許可，可以緝拿西印度群島法屬馬提尼克殖民地的船隻。一天，他煽動譁變奪下這艘船，大部分船員隨即站在了他一邊。這是一艘快速私掠船，裝有 46 門火炮，極適合改作海盜船，隨後被改名為「範西」。1695年，他完成了自己最了不起的壯舉：劫掠印度寶藏船隊。作為與其他海盜結盟的一部分，他襲擊了一支重裝戒備的印度寶藏船隊，併成功奪走兩艘船。這兩艘船屬於莫臥兒皇帝本人，船上滿載著難以想象的財富。<n><n>在買通巴哈馬總督為海盜提供庇護之後，艾弗裏付清了船員工錢，船員們隨後四散天涯。其中一些人在英格蘭被捕，但艾弗裏航往愛爾蘭，從此杳無音訊。我們只能推測，他此後一直在隱居中享受自己的財富。"
"0xd4cd0f3e" = "有史以來最受歡迎的海盜之一，是愛德華 蒂奇（卒於 1718年），也就是黑鬍子。正如其名所示，他的標誌特徵是那條駭人的黑色辮須。他率領 300名船員，駕著「安妮女王復仇號」在公海上馳騁——那是一艘改裝的荷蘭商船——面對皇家海軍軍艦也毫無懼色。<n><n>在 18個月裏，蒂奇大肆劫掠，主要在西印度群島北部和北美沿岸。他總能在巴哈馬和貧困的北卡羅來納找到藏身之處。<n><n>黑鬍子之所以如此出名，還有一個原因：他完美契合了那個可怕、熱血又暴躁的私掠者刻板印象。據說他的炮手伊斯雷爾 漢斯被他連開兩槍打傷，理由無非是要提醒其餘船員，這裏誰說了算。<n><n>他的末日直到 1718年才到來，當時的捕海盜人羅伯特 梅納德追蹤到了他的單桅帆船。儘管已經爛醉如泥，蒂奇仍像惡魔一樣戰鬥，經過苦戰才被擊敗。他戰死沙場，倖存船員中的大部分被處以絞刑。"
"0xd4cd0f3f" = "在地理大發現的頭幾年，那些想讓既有財富增值的人發現，自 16 世紀初以來主要在加勒比地區開發起來的糖種植園，提供了極好的投資機會。<n><n>這些投資的平均回報率為 10%，而在最好的情況下（例如 1650年前後的巴巴多斯）甚至可達 50%！自然，這些種植園需要大量勞力，於是數十萬奴隸從非洲被運往那裏。這是因為白人此時已在許多地方几乎把美洲原住民屠戮殆盡。<n><n>歐洲人自己受不了這種氣候；除此之外，他們也太有身份，不肯幹這種驢一樣的粗活。就連種植園主也更願意住在倫敦或馬德里，派幾個手下去殖民地組織勞作。到 18 世紀，某些島嶼的人口中黑人比例已達 90%！"
"0xd4cd0f40" = "「黑色黃金」的買賣早在 16 世紀初就已開始。奴隸販子偏愛的「貨物」來源，是西非從塞內加爾河延伸到今日喀麥隆之間的海岸。這一地區不僅在運輸上位置得天獨厚，還具備穩定的經濟與社會政治基礎設施。這意味著水手們不必自己去獵捕奴隸，而是可以向當地酋長或其他奴隸販子買下他們的受害者。<n><n>15 至 35 歲的年輕男子尤其搶手，因為他們註定主要會被送進種植園從事苦役。大約每五個奴隸裏就有一個連橫渡都撐不過去，而航程最長可達六週。有些人死於主人施加的野蠻折磨，另一些人則葬身海上事故。考慮到如此高的死亡率，奴隸販子便想方設法讓每次航行儘可能賺錢，往船上儘可能多地塞進奴隸。一連幾個星期，這些可憐的生物像罐頭裏的沙丁魚一樣肩挨肩躺著，彼此鎖在一起，置身黑暗之中，空氣稀薄得幾乎無法呼吸。<n><n>在這種條件下，他們之中居然有人能活著走完這段航程，幾乎難以置信！"
"0xd4cd0f41" = "儘管北美和中美洲沒有白人奴隸，卻有大量歐洲人發現自己的勞動條件與奴隸相差無幾。<n><n>許多年輕男子（大多來自未受教育的底層階級）想移民，卻沒錢支付橫渡的費用。於是他們借錢支付船款，約定日後再到糖種植園（或類似的地方）做工一段時間來還債。<n><n>然而，這份看似完全合理的安排也有陷阱：許多種植園主在他們受僱期間使足了勁壓榨他們。更別提加勒比的氣候，大多數歐洲人都難以忍受。<n><n>這種「契約勞工」制度也被頻繁用於那些被逐出本國的囚犯。英國人後來也用過這一手段，最突出的例子是對付印度人——他們強迫印度人在非洲殖民地勞作。"
"0xd4cd0f42" = "隨著美洲殖民地繁榮起來，跨大西洋的貿易也隨之興盛。自伊麗莎白女王時代以來最強大的航海國家大不列顛，對管控貨物流動懷有濃厚興趣，好讓本國經濟分得貿易利潤。<n><n>在護國公奧利弗 克倫威爾治下，1651年的《第一航海條例》規定只有英國船隻才能把貨物從殖民地運往歐洲。這項措施主要針對正在崛起的荷蘭，並讓本國貿易船隊受益。<n><n>1663年，該條例的規定變得更嚴：殖民地船隻若想把貨運往歐洲，必須先到英國港口停靠並繳納稅費。然而，這種管控殖民地貿易的企圖很快擱淺了。英國陸軍根本不可能監視整條海岸線，結果走私貿易反而蓬勃發展起來。<n><n>正是這種圍繞貨物進出口條件的持續衝突，使殖民者，尤其是在北美殖民地，逐漸形成了獨立的認同，日後成為獨立運動的一項重要推動力。"
"0xd4cd0f43" = "殖民時代伊始，也帶來了眾多健康問題——這些在地中海或沿岸那些短得多的航程中基本不會遇到。前往加勒比和北美殖民地的橫渡要花上一到兩個月，遇上風暴或無風的時段還更久。因此要克服的困難並不出人意料：骯髒衣物與個人衛生不良的惡臭、受汙染而腐敗的食物、清潔水源的缺乏、船上的老鼠，以及單調生活和幽閉恐懼帶來的心理壓力。壞血病的可怕陰影籠罩著每一個海員：這種由維生素缺乏引起的疾病，表現為脫髮和掉牙，奪去了許多水手的性命。最先成功治療此病的是環球航行者詹姆斯 庫克（1728-1779）。他不僅堅持把船保持乾淨，還給船員提供酸菜和新鮮水果。上岸的人還得應付黑尿熱這類熱帶疾病，它是瘧疾最危險的表現形式之一：這種感染的症狀包括脈搏加快、發熱、發抖和尿液顏色加深，幾乎總是致命。"
"0xd4cd0f44" = "航海家和製圖師為新發現的大片陸地、河流和聚落想出的眾多地名背後，藏著許多有趣的軼事。甚至連大航海時代的歐洲探險家們為美洲各地取的第一批名字，也各自講述著一段故事。1492年10月12日，克里斯托弗 哥倫布把他登陸的那座島命名為薩爾瓦多（意即「救世主」）。這是為了感謝上帝在遠航途中護佑船隊免受疾病與風暴侵襲，尤其是感謝祂在最緊要關頭——就在陸地望見的前一刻——阻止了一場即將爆發的譁變。<n><n>在此之後的日子裏，西班牙征服者們大多選擇帶有宗教含義的名字，例如「上帝之名」（Nombre de Dios）或「三位一體」（Trinidad）。有時人們也會從日期出發，或根據自己對地貌的觀察來命名。例如葡萄牙水手在1502年元旦發現巴西海岸的一處海灣，便把它命名為「一月之河」（Rio de Janeiro）；而蒙得維的亞這個名字，則源自麥哲倫據說第一次望見海岸時那句驚呼：「Monte vido eu！」（「我看見一座山！」）<n><n>探險家們還常常習慣性地用他們的統治者、母國或故鄉城鎮來為遠方的土地和城鎮命名。這不僅向外界清楚地宣示了領土歸屬，也讓他們即使身處這些偏遠的土地上，仍與自己的祖國保持著一份聯繫。<n><n>實在無計可施時，人們總還能退回到當地原住民的語言上去取名（儘管在多數情況下，這並沒有阻止殖民者事後把原住民趕走或滅絕）。<n><n>直到今天仍流傳著這樣一個神話：詹姆斯 庫克問一名澳大利亞原住民那種奇特的袋獸叫什麼，對方回答說「kangooroo」或「ganguru」——據說這個詞其實只是「你在說什麼？」的意思。即便這只是個神話，這類令人忍俊不禁的誤解肯定確實發生過。<n><n>人們大概會驚訝於，城鎮、山脈與河流的眾多名字，其實就意味著「早上好！」 「對不起，請再說一遍？」或者「別來煩我！」……"
"0xd4cd0f45" = "隨著一個橫跨全球的西班牙帝國崛起，有必要設立擁有足夠權力的殖民當局，既處理日常行政事務，也應對任何可能突然出現的危機。為此，殖民地裏最重要的總督被授予了「副王」（viceroy）的頭銜。<n><n>在世界帝國的鼎盛時期，這樣的大員有兩位，分別駐於新西班牙（墨西哥）和秘魯。新格拉納達與拉普拉塔兩個副王區則在 18 世紀增設。<n><n>副王（西班牙語亦稱 virrey）要與一個叫作 Audiencia 的行政理事會共同履職（且雙方常常衝突），職責包括政府官員的日常事務：徵收與催繳稅款、確保民眾遵守法律、組織殖民地防務等等。他還負責保護美洲原住民人口，並任命較低一級的教會與世俗官員。<n><n>由於海外屬地具有極大的經濟與政治重要性，王室始終對其副王的動向嚴加監視。他們被禁止從事任何能帶來額外收入的商業活動。除此之外，副王之間的競爭只會導致彼此權力的相互掣肘。"
"0xd4cd0f46" = "歐洲征服者總是追逐白銀與黃金的召喚，這早已是眾所周知的常識。然而幾乎比金銀更有價值的，卻是香料。若想到人們甘冒何等危險只為獲取一小撮胡椒或肉豆蔻，就很難想象中世紀歐洲的飲食該是何等寡淡。<n><n>在這方面，發現美洲一開始令人極度失望。人們懷著興趣打量克里斯托弗 哥倫布帶回家的奇異動物，為本國疆域的擴張和想象中基督教傳播將拯救的眾多靈魂而欣喜。然而黃金之山遠比許諾的更難尋覓。這些航程要到十至二十年後才真正獲利——那時美洲的白銀才如洪流般湧入歐洲。<n><n>在這些航程中的一次，哥倫布帶回了一件比全世界所有金銀都更珍貴的寶物：1492年11月4日，原住民送給他一樣東西，他形容那像蘋果、味道卻像栗子。就在那一刻，他成了第一個吃土豆的歐洲人！這種植物的印第安語名稱是「batate」，而它以「potato」之名一直活到今天的英語裏。<n><n>我們今天視為理所當然的許多東西，也都是哥倫布及其後繼者最早帶到歐洲的：菸草、番茄、玉米，以及吊床。用美洲原住民的話說，就是「hamaka」（英語的吊床一詞即由此而來）。"
"0xd4cd0fae" = "新世界的發現一經宣佈，便點燃了歐洲人的想象力。這些未經探索的土地上究竟藏著什麼樣的生靈？各種最難以置信的傳聞四處流傳：據說有一座島上遍是食人族，另一座島則住著無頭怪，它們的臉長在肚子上。<n><n>南美洲巴塔哥尼亞的地名大致可譯為「大腳者的土地」，而亞馬遜河的名字則源於一支女戰士族群——據說她們讓探險者想起了希臘神話中類似的女性戰士。<n><n>這些傳聞中有些確有事實依據，另一些則源於誤解與誤讀，或是原住民自己不知從哪兒聽來的故事。<n><n>不過，這些傳聞中有許多不過是人們豐富想象力的產物；而更多時候，人們之所以相信它們，只因為他們願意相信。這就解釋了為什麼一代又一代的征服者會去尋找傳說中的青春泉、伊甸園，以及黃金之城埃爾多拉多。原住民非但沒有糾正他們的迷思，反而不斷鼓勵——總是向他們保證說自己聽說過某個地方；他們不過是想拖延時間，好把這些貪婪的白人誘到內陸深處，與他們的船隻斷絕聯繫。"
"0xd4cd0faf" = "在一份群英薈萃的探險家與征服者名單中，最耀眼的人物之一，是英國作家兼冒險家沃爾特 雷利爵士（約1554— 1618年）。他於1580年首次嶄露頭角，當時他平定了愛爾蘭反叛者針對英格蘭佔領的起義。<n><n>他成了伊麗莎白一世女王的寵臣，並藉助自己的影響力出資資助了一場遠征，去尋找南美洲那座傳說中的黃金之城埃爾多拉多。儘管數次遠征搜尋有價之物都以徹底失敗告終，他卻憑著獨特的說服力，保住了倫敦那些出資人的支持。他讓他們相信，最豐厚的獎賞永遠就在下一個河口的那一邊，而他現在無論如何都不可能放棄。<n><n>然而他的信譽最終還是走到了盡頭。人們聽了太多他那些不切實際的承諾，後來才發現不過是一派空言。雷利終於失寵於伊麗莎白。她的繼任者詹姆斯一世視這位熱血冒險家為對自己較為溫和的對外政策的威脅，幾乎沒抓到什麼把柄便將其逮捕，並在即位後不久判處他死刑。判決後來被改為了緩刑（注意，並沒有被撤銷！），雷利被囚禁在倫敦塔中。<n><n>多年之後，當國家財政的狀況促使國王認為有必要時，他准許沃爾特 雷利爵士率領另一次遠征前往圭亞那。這是個荒謬的處境：把一個自己已被判死刑的人，賦予決定他人生死的權力，再派出去尋找黃金！不過這個矛盾不久便自行化解了——此時已被熱病折磨的雷利，活著看到了他的最後一次遠征以失敗告終。<n><n>回到英格蘭後，怒不可遏的國王認定：雷利在1603年獲得的緩刑如今該結束了。不久之後，沃爾特 雷利爵士被處決。"
"0xd4cd0fb0" = "新大陸的原住民與白人航海者之間的最初接觸，一般來說都是和平的。在許多地方，歐洲人被當作神祇般迎接。這種印象的來源，一部分來自古老傳說，但更多時候，只是因為那些金髮高個的陌生人乘坐熠熠生輝的「水上房屋」（船隻）而來，讓原住民大為震撼。<n><n>哥倫布、科爾特斯以及所有其他探險家，都樂見其成地維持著這個誤會，但原住民很快就面對了殘酷的事實：西班牙人被永無止境的黃金欲所驅動，一場原住民稱之為「西班牙病」的噩夢就此展開——他們凌虐、奴役並屠殺整族整族的人口。美洲此前從未見過馬匹——那高頭大馬的模樣；火炮的轟鳴更令人失聲驚惶。倖存下來的那些人也很快死於天花、流感，或其他某種被帶進來的疾病。<n><n>貢薩洛 奧維耶多、胡安 德 塞普爾維達之類的名士，曾試圖用駭人聽聞的種族主義論調為歐洲人所犯的罪行開脫，把美洲原住民的種族描繪成卑劣、無知且低人一等。<n><n>同樣這些人——他們曾因為他人的信仰而把科學家和女巫綁上火刑柱，也深諳炮製駭人聽聞的「野蠻習俗」故事之道：偶像崇拜、活人獻祭和食人這些做法固然並非虛構，但從今以後，白人卻乾脆把這一整套清單當作一攬子萬能的藉口，用來為對原住民施加各種最殘暴的懲罰開脫。"
"0xd4cd0fb1" = "眾所周知，美洲殖民的早期階段是由西班牙和葡萄牙開啟的。後來加入的是荷蘭，而最重要的是英格蘭與法國。但鮮為人知的是：若不是那些財力雄厚的德國金融贊助者，西班牙的許多次遠征根本不會成行。<n><n>到 1500年，上施瓦本和奧格斯堡已發展成為歐洲最重要的貿易與金融中心之一。福格與韋爾澤這兩大商人家族，從這裏對世界政治施加著強大的影響。例如，正是他們大量的資金支持，幫助西班牙的卡洛斯國王於 1519年成為德國皇帝。英格蘭的亨利八世國王和多位教宗，都很樂於把「富有的」雅各布 福格算作自己的朋友。<n><n>這些精明的商人當然也有自己的私下盤算。作為回報，他們期待獲得特權，或獲准參與王室的白銀開採。韋爾澤家族甚至一度取得了委內瑞拉北部海岸的一部分，在那裏建起了「新奧格斯堡」這樣的城鎮，並從那裏派出多支探險隊，深入內陸尋寶（大多一無所獲）。"
"0xd4cd0fb2" = "西班牙王室在征服了半個地球之後，發現自己享有一種獨特的機會。在長達幾個世紀的時間裏——直到印加、瑪雅與阿茲特克這些偉大美洲文明的消亡，以及後來在秘魯和墨西哥發現巨型銀礦藏為止——西班牙的地位看上去堅不可摧。然而恰恰是這份龐大的財富，促成了這個世界強國的衰落，這幾乎顯得荒謬。<n><n>用船運回西班牙的財寶中，很大一部分直接流進了比利牛斯山以北那些商人的口袋——正是他們出資資助了這些航程。但剩下的部分，仍足以把伊比利亞半島的物價推高。那裏的人開始過著入不敷出的生活：在一個把大規模排場看得比平衡國家預算更重要的年代，人們根本不怎麼理會那些瑣碎的財務問題。<n><n>貨物以越來越多的數量由外國船運來，因為人們已經講究到不肯自己生產這些東西了。連前往美洲的探險隊所需裝備與給養，也很少由本國商人提供。人們自豪地感嘆：整個歐洲都在聽命於西班牙。<n><n>然而白銀的洪流終究會枯竭，隨之而來的當頭棒喝，活像通宵痛飲之後的那陣宿醉：荷蘭人和英國人正在把西班牙逐出公海。針對新教「異端」和土耳其人的一場場宗教戰爭吞掉了鉅額錢財，而這個日不落的龐大帝國已經長成一個無法治理的巨怪。<n><n>1557年，危機已為所有人所察覺：西班牙的新君主菲利普二世被迫首次宣佈國家破產。這個曾經擁有比此前任何帝國都更多財富的大帝國，窮了。"
"0xd4cd0fb3" = "為什麼巴西說的語言是葡萄牙語，而南美洲幾乎其他所有地方說的卻是西班牙語？<n><n>這話說來話長。西班牙人與葡萄牙人——後者早已探明沿非洲海岸通往印度的航路——都很早就認識到，自己的未來在海外。雙方各自警惕地監視著對方，確保自己在追逐貨物、臣民與土地時，不會侵佔對方的勢力範圍。<n><n>由於當時根本不存在什麼國際法，一旦發生衝突，兩國就去找教皇裁決——因為他是唯一一個兩國都願意接受其權威的人。就天主教教會而言，它也樂見西班牙人和葡萄牙人熱心推動對「異教徒」的基督教化，而不是把精力浪費在彼此為難上。<n><n>於是雙方在托爾德西利亞斯（1494年）與薩拉戈薩（1529年）的聯合談判中達成協議：某條經線以西新發現的領土歸西班牙所有，以東的所有領土歸葡萄牙所有。這條經線切過當時尚未被發現的南大陸，於是它東側、也就是今日巴西的一部分歸了葡萄牙。"
"0xd4cd0fb4" = "「pirate」（peirato）這個詞，大概最早是羅馬作家波利比烏斯在公元前 140年前後提出的。此後，人們用過許多不同的詞來指稱這些可怕的海上惡徒：corsair、freebooter、buccaneer、filibuster……克勞斯 施托特貝克爾周圍那幫人被稱為「維塔利安兄弟會」，而巴塞洛繆 羅伯茨則給自己和那夥殺人不眨眼的暴徒取了個聽起來無害的稱號——「幸運紳士」。可對那個商人來說，出手的究竟是誰其實根本無所謂：反正總有人會從虛空裏冒出來，襲擊他的船。<n><n>世世代代以來，私掠者都是人類在世界各地的禍害。在古代，奇裏乞亞海盜在整個地中海製造瞭如此徹底的恐怖，以至於羅馬帝國不得不週期性地對他們發動討伐。那些隱蔽的島嶼與嶙峋的海岸線緊鄰繁忙的貿易路線，是海盜活動的絕佳據點：在暗礁、暗流與惡劣天氣讓笨重的商船輕易成為獵物的地方，就有可供作案的巢穴，犯下暴行之後可以迅速撤回去。古代的小亞細亞海岸之可怕，不亞於大航海時代的加勒比；而東南亞的海盜則近乎神話般的存在。<n><n>從詞源上說，「buccaneer」原意是一個以私人身份出海、而非作為海軍水手航行的海員，為的是尋找戰利品，因此被視為從事海盜活動。<n><n>然而，私掠許可證的頒發，讓加勒比的某些私掠者看上去多少有了幾分合法性。這些文件由英國、法國或荷蘭的總督簽發，目的是把海盜之禍引向敵對勢力。<n><n>「私掠許可證能多容易拿到，取決於具體是哪位總督。」，取決於具體是哪位總督。有的總督認為與海盜訂立約定是不名譽的；另一些則沒那麼講究，或者乾脆就是腐敗或膽怯。"
"0xd4cd0fb5" = "所謂「七大洋」，其實只有三個（即三大洋）：北太平洋與南太平洋、北大西洋與南大西洋、北冰洋與南極洋，以及印度洋。<n><n>太平洋的名字，要歸功於費爾南多 麥哲倫環球航行的壯舉：在橫渡這片遼闊大洋的漫長而飢餓的日子裏，他運氣極好，一路遇上了好天氣。<n><n>還有一點：加勒比之名源自「Karibe」（或作「Karaibe」），那是某個印第安語系民族的稱呼，他們的地盤從安的列斯群島一路沿著南美洲北岸鋪開。"
"0xd4cd0fb6" = "百慕大群島得名於西班牙探險家胡安 貝爾穆德斯，他於 1503年發現了它們。而那個所有航海人都耳熟能詳的、據說神秘海難事故發生率極高的惡名區域——「百慕大三角」——涵蓋的是百慕大群島、波多黎各與勞德代爾堡（佛羅里達）之間的一片海域。<n><n>有些人堅持認為，這一連串離奇事件要從克里斯托弗 哥倫布的航程算起：1492年9月14日，這位為西班牙效力的熱那亞航海家發現自己的三艘船正好位於這片海域，而他的羅盤指針此時開始瘋狂旋轉。這是地理北極與磁北極之間的差異造成的。第二天，天空中出現了一道巨大的火焰（可能是流星）。<n><n>然而「百慕大三角」這個稱呼其實是在第二次世界大戰之後才出現的：接連發生的一系列飛機失事事故，才把公眾的注意力引向北大西洋西南部的這片海域。<n><n>這些離奇事件的信徒列舉了 200多起所謂無法解釋的事故，不過他們對邊界劃得頗為寬鬆。這些事件中的大多數——其中相當多甚至壓根沒發生在這一帶——都有完全合理的解釋。"
"0xd4cd0fb7" = "那支定期從美洲駛往西班牙的傳奇西班牙寶藏船隊，在伊比利亞半島之外也激起了各式各樣的貪念。主要是雄心勃勃的英格蘭看到了一個機會，要與西班牙爭奪海上霸主和世界女王的地位。<n><n>這個島國當時還沒有強到足以投入大規模軍事行動，因此把戰場擺到歐洲之外的遙遠地方要明智得多——在那裏，她既不會料到遭人襲擊，也不會收到任何襲擊的預警。在那裏，你可以輕而易舉地搶光受害者，然後從容消失，歐洲幾個月之內都不會聽說這件事。<n><n>那些膽大的船長——其中最著名的是弗朗西斯 德雷克（1540— 1596年）——由伊麗莎白一世女王親自頒發私掠許可證。這種私掠許可證形如一張空白支票，是一份搶劫許可：它把德雷克及其同夥凌駕於普通海盜之上，使他們成為效忠更高權威的私掠男爵。他們也把這份差事幹得相當漂亮。伊比利亞的船隊與守軍，沒有一處是安全的。<n><n>1578年，弗朗西斯 德雷克穿越麥哲倫海峽，像旋風一樣沿著美洲太平洋海岸搜尋西班牙的財富。此前從未有人膽敢這樣做！1580年他返回普利茅斯港時，已成為繼麥哲倫之後第二位環航世界的船長。<n><n>與此同時，西班牙國王菲利普暴跳如雷，援引了托爾德西利亞斯條約——教宗陛下曾在1494年斷然宣佈西半球屬於西班牙的勢力範圍。可是，對這個奇特的異教新教島國而言，這種抗議又能有什麼作用呢？它完全拒絕承認羅馬教宗的權威，甚至直到 1753年才肯採用現代的格里高利曆，僅僅因為這套曆法是教宗格里高利在 1582年下令制定的。<n><n>又一次，看來這件事只能靠戰爭來解決。菲利普的無敵艦隊於 1588年駛向英格蘭，但在此時已受封為爵士的弗朗西斯 德雷克爵士指揮下，再加上幾場來得正是時候的風暴相助，英格蘭人成功摧毀了西班牙艦隊。在此後數百年的時間裏，再也沒有人敢挑戰大不列顛作為海上霸主的地位。"
"0xd4cd101f" = "克里斯托弗 哥倫布（1451— 1506年）前往美洲的航程，無疑躋身人類歷史上最偉大的冒險之列。即便是作家，也幾乎不敢想象出這樣一部由戲劇性事件與離奇巧合構成的故事。<n><n>這位熱那亞航海家雖然說服了西班牙王室夫婦伊莎貝拉與斐迪南，相信存在一條通往印度的西行航路，卻顯然無法指望船上的船員們會同意。事實上，大多數船員都是被強徵來的：作為對王室不敬行為的懲罰，帕洛斯城被迫提供兩艘船和船員。<n><n>哥倫布計劃的消息引發了種種驚恐的議論。船員們堅信，他們是在一個瘋子的指揮下航行，這個人只會給他自己以及所有跟他一起出海的人帶來毀滅。<n><n>然而，哥倫布最大的敵人是迷信：各種能想象到的恐怖故事彷彿都跟著上了船，任何怪異的或不祥的事件只會加深水手們的恐懼——駛過特內里費島時火山噴發，隨後他們看到天空中出現火柱，甚至連羅盤的指針都像是在跟船員們耍花招。船隻若遇風平浪靜，就被視為不祥之兆。反過來，如果他們進展順利，就意味著風總是從東往西吹，他們永遠都無法掉頭返航。<n><n>很多次，譁變似乎都不可避免。一天夜裏，船長聽見艙外有腳步聲和低語，直到他開始大聲祈禱，那些刺客才失去勇氣，悄悄溜走。<n><n>最嚴重的危機總是發生在這樣的時刻：地平線上那個被當成島嶼的東西，結果又一次不過是一場海市蜃樓。10月10日發生的正是這樣一件事，把事情推到了緊要關頭。哥倫布費盡周折談成了一個最後通牒：三天之後，船員們就要調頭返航（最好是不帶船長一起）。然而命運另有安排：他們確實在這三天裏看見了陸地。在場的人誰也想不到，他們找到的不是亞洲，而是一塊全新且未知的大陸。<n><n>日本與中國仍在數千海里之外，若非命運之神給了他們難以置信的好運，讓一塊外來大陸恰好橫在航路上，哥倫布的遠征早已全軍覆沒。船員的士氣立刻大振。他們中誰也想不起自己曾有過譁變的念頭……"
"0xd4cd1020" = "克里斯托弗 哥倫布確實發現了一塊新大陸——更準確地說，是重新發現了它，因為中世紀時維京人早已踏上過美洲的土地。但他錯誤地宣稱，自己發現的是一條通往印度的航路。<n><n>在準備他那四次航行中的第二與第三次時，這位熱那亞人與來自佛羅倫薩的亞美利哥 韋斯普奇合作。正是後者最先提出：西邊這些土地其實屬於一塊全新且未知的大陸。這一驚人的判斷重新點燃了公眾的興趣，從此每逢談起這些新領土，人們必然會提到韋斯普奇這個名字。<n><n>相比之下，哥倫布的星光正在黯淡。與此同時，他甚至因加勒比殖民者的控訴被押上鎖鏈送回國內；1506年，他這個滿腹怨氣又身染重病的人就此死去，卻並沒有得到應有的關注。因此，一年後當南德意志製圖師馬丁 瓦爾德澤米勒要為這些未知土地想出一個名字時，轉而取材於那個當時廣為流傳的名字「亞美利哥 韋斯普奇」，也就不足為奇了。<n><n>瓦爾德澤米勒擬定的名字被同行採納了。不過，若把那塊大陸命名為「哥倫比亞」，本會更公平一些。"
"0xd4cd1021" = "在西班牙統治下最先取得重要地位的美洲地區，是伊斯帕尼奧拉島。克里斯托弗 哥倫布早在 1493年就在這裏建立了第一座歐洲殖民點，儘管在他從歐洲返回之前，這地方就已經被原住民夷為平地。<n><n>在此之後的日子裏，西班牙王室逐步加強了對這座島嶼的控制。第一座修道院和第一座主教座堂建了起來，日後將被推廣到其他地區的社會制度，也正是在這裏初步成形：一個蓄奴的社會，等級劃分極為嚴格，與天主教會緊密結合。<n><n>伊斯帕尼奧拉似乎提供了巨大的機會，吸引了許多雄心勃勃的移民渡海而來。<n><n>然而沒過多久，西班牙就把目光轉向了別處：此時大陸上的那些宏大國度已經被發現並征服了。在這裏統治更容易，金銀礦藏也更富、更易開採。<n><n>伊斯帕尼奧拉就像一件被丟到一旁的玩具，人們對它失去了興趣。荷蘭、英國和法國的海盜輪番發起攻擊。1697年，法國人控制了島上的西部聖多明各（今日海地），並建立起了賺錢的種植園經濟。可可、糖、靛藍、棉花和咖啡的產量，讓聖多明各在 18 世紀成為新世界最賺錢的殖民地。<n><n>歷史上唯一一次成功的奴隸起義，起因是法國大革命，最終導致海地在 1804年獨立。起義者對待昔日壓迫者的方式，與壓迫者當初對待他們的方式如出一轍：「為了宣佈獨立，我們需要一張白人的皮當羊皮紙，用他的顱骨作墨水瓶，用他的血作墨水，再用一把刺刀作筆」黑人將軍布瓦隆-東內爾當時這樣宣佈。"
"0xd4cd1022" = "朗姆酒是加勒比的典型產物，儘管它對人類是否真有好處很值得懷疑。這種用甘蔗糖蜜釀成的烈酒，最初有個聳人聽聞的名字——「撒旦殺手」，早在 1650年就已在巴巴多斯被人提及。作為海盜傳奇性的首選飲品，大多數人都會把朗姆酒與牙買加島聯繫起來，它曾是最令人膽寒的海盜巢穴之一。<n><n>奴隸販子把他們在非洲海岸買來的人口貨物，在加勒比大量換成糖蜜。這些糖蜜在新英格蘭被蒸餾成朗姆酒，然後又由同一批船運回非洲。烈酒在非洲就地賣掉，空船再裝上新鮮的一船奴隸。通過這套致命的「三角貿易」，船主們確保自己的船在每一次航程中都是滿載。"
"0xd4cd1023" = "除古巴之外，牙買加大概是加勒比最著名的島嶼了。它的名字源自阿拉瓦克語中的 Xymaca，大致意思是「森林與水之鄉」。九年前親手發現該島的克里斯托弗 哥倫布，在 1503年船隻於北岸失事時，有充分機會體驗這裏的風光之美與居民的友善。<n><n>他喜愛此地至此，竟把整座島嶼的所有權從西班牙國王手裏轉到了自己名下，宣佈歸己所有。儘管如此，在接下來的幾十年裏，這座天堂般的島嶼一直無人問津，直到 1655年被英國人奪走。那時阿拉瓦克人已經所剩無幾，因為他們這個族群對歐洲人帶來的疾病格外缺乏抵抗力。<n><n>1661年，愛德華 多伊利被任命為牙買加的總督兼軍事長官。在他治下，首都[town:Port Royal]被改造成了一座活力十足、防禦森嚴的海盜避風港。據說這裏是「地球上最富有也最腐敗的地方」，許多原本只是普通商人的居民，常結夥到西班牙海域去幹私掠勾當。起初英國政府對這類勾當並不怎麼管，畢竟這些私掠者替它牽制著西班牙的對手。<n><n>直到亨利 摩根爵士出任總督——這件事本身就耐人尋味，因為他自己從前也是海盜——牙買加才重新找回文化和秩序。摩根毫不留情地鎮壓海盜，把自己昔日的那幫同夥送上絞刑架時也毫不遲疑。<n><n>然而，英國的權威剛剛恢復，人們就發現了一門比不斷增長的甘蔗生意更賺錢的新生意：1672年之後，皇家非洲公司取得壟斷，[town:Port Royal]發展成為世界上最大的奴隸市場。"
"0xd4cd1024" = "克里斯托弗 哥倫布抵達新大陸僅僅兩週，便到達了西印度群島最大的島嶼——古巴。這裏生活著若干族群：西博尼人、瓜納哈塔貝人和泰諾人。儘管他們性情溫和，卻都與其他美洲原住民族落得同樣的結局：1511年，在與西班牙人打完四年戰爭之後，他們被征服並滅絕。此後，大批黑人奴隸被輸入此地。這座島嶼連同其首府[town:Havana]，被劃分為七個行政管區（cabildos），各管區派出一名代表參加一個專門的議會。代表的職責是維護本地區的利益。<n><n>古巴的歷史引人注目之處在於：除了 1762年至 1763年一段短暫的英國佔領期外，這座島嶼在西班牙人手中握有相當長的時間。這或許是因為在殖民時代，古巴並非西班牙帝國最重要的地區之一（比如那裏幾乎沒有任何礦藏），而它通常只是駛往大陸途中的中轉站。無論如何，當南美和中美洲絕大多數國家都在 19 世紀第一個四分之一世紀裏為獨立而戰時，西班牙人卻一直守住了古巴，直到 1898年，才把該島的控制權讓給美國。"
"0xd4cd1025" = "眾所周知，如今我們視為理所當然的許多東西，最初都是通過與美洲的貿易才抵達歐洲的。然而，文化交流也有反過來的方向。<n><n>比如，當你想象北美平原上典型的美洲原住民時，很難想象在西班牙人和葡萄牙人到來之前，美洲是沒有馬的。許多原住民第一次看到騎手與馬匹時都驚慌逃散，因為在他們看來，這是一種由兩個生命長成一體的怪物。<n><n>咖啡，人們通常把它和巴西、危地馬拉這樣的國家聯繫在一起，其實並非美洲原生；在到達美洲之前，它已經跨越了三個大洲：它從非洲（很可能是埃塞俄比亞）出發，經由阿拉伯諸國傳入南歐。這種植物是在 18 世紀才被引入美洲的——當時這種飲料日益流行，人們不得不擴大對它的種植。<n><n>在歐洲人於加勒比發現的土豆，是一種價值難以想象的基本主食。反過來，小麥在美洲一直無人知曉，直到西班牙人和英國人的到來：他們分別在 1520年和 1777年把這種作物帶到墨西哥和弗吉尼亞。儘管人們最初認為美洲的氣候並不適合種小麥，但恰恰是北美大陸見證了這種作物最為驚人的成功。如今，小麥是全世界播種面積最大的農作物。"
"0xd4cd1026" = "你能想象沒有巧克力的生活嗎？你大概真該想象一下，因為在美洲被發現之前，可可對世界其他地方來說都是聞所未聞的。「cocoa」這個詞很可能源自瑪雅語，最早可以追溯到瑪雅語：幾乎可以肯定，瑪雅商人在基督誕生前 400年就在喝可可了。<n><n>阿茲特克人自 14 世紀起就是中美洲大陸上的主導力量，他們甚至賦予可可宗教意義。第一位接觸這種美味的歐洲人又一次是克里斯托弗 哥倫布，不過那是 1502年的一次後續航程，目的地是尼加拉瓜。<n><n>不過，可可當之無愧的「發現者」是阿茲特克王國的征服者埃爾南 科爾特斯，他把一種叫作 xocoatl 的飲品的配方帶回了西班牙（「chocolate」一詞即由此而來）。那味道對歐洲人的舌頭來說起初太苦，直到人們開始加入糖或香草，熱巧克力才在伊比利亞的上流社會流行開來。<n><n>西班牙人把這份配方秘而不宣了將近一百年，此後熱巧克力才傳遍法國和歐洲其他地區。大約在 1700年，英國人往裏面加了牛奶。可可在歐洲的最終突破，發生在人們發現咖啡與可可搭配起來竟如此美味的時候。"
"0xd4cd1027" = "談論海盜時，事實與傳說往往難以分辨，但海上有過女海盜這一點卻是不容爭辯的。18 世紀初，有兩位最耀眼的人物在牙買加島上踏上了這條路。<n><n>據說安妮 博尼小時候就曾被人一刀捅進肚子，後來跟一名水手私奔到了新普羅維登斯（拿騷）這座海盜窩。在那裏，她設法甩掉了丈夫，並在一艘被繳獲的荷蘭船上開啟了自己的職業生涯。<n><n>在那裏，她遇見了瑪麗 雷德——後者早在西班牙王位繼承戰爭中就曾女扮男裝作戰，據說還在殺死對手之前袒胸露乳，好讓對方明白自己是被一個女人打敗的。<n><n>1720年被俘之後，兩人之所以沒有被送上絞架，只因為她們正懷著身孕。她們的運氣比大多數男同夥都好得多，而安妮 博尼對那些人，則只能報以鄙夷。<n><n>下面便是那位臭名昭著的「花布傑克」被押赴刑場時，她對他說的話：「真遺憾在這裏看到你，傑克；但如果你當初像個男人那樣拼命，你現在就不會像條狗一樣被吊在這裏了。」"
"0xd4cd1028" = "威爾士人巴塞洛繆 羅伯茨（1682？— 1722年），不僅是最重要的海盜之一，也是一位極不尋常的海盜。他又名「黑巴特」（別與「黑鬍子」愛德華 蒂奇混為一談），37 歲時才轉而去做海盜，不過這一步的過渡無疑順滑得很：1719年，他供職的那艘船被他的威爾士同鄉豪厄爾 戴維斯襲擊——那實際上是一艘奴隸船。<n><n>羅伯茨決定與戴維斯共進退；幾周後戴維斯遇害，他便接任了船長之位。據說巴塞洛繆 羅伯茨不碰酒，只喝茶。<n><n>與把自己打扮成魔鬼化身的蒂奇不同，羅伯茨偏愛精緻衣裳，厭惡賭博，還堅持要求手下船員做禱告。當然，這絕不代表羅伯茨是個內心虔誠的人。關於他在無數次劫掠中犯下的暴行——尤其是對俘虜的暴行——流傳著大量傳說。總計劫走 400餘艘船，活動範圍從巴西一路延伸到紐芬蘭與西非海岸；他與亨利 摩根並列為中美洲最成功的海盜。<n><n>1722年，一艘英國軍艦在幾內亞海岸外開炮的轟鳴，宣告了他職業生涯的終點，也宣告了七大洋上最大禍患之一的消亡。"
"0xd4cd1090" = "17 世紀最著名的私掠者是威爾士人亨利 摩根（1635— 1688年），他在西印度群島的西班牙殖民地肆虐，從根本上動搖了這個伊比利亞大國的地區權威。<n><n>他的一生，例證了英國、荷蘭與法國政策背後那頗為曖昧的道德觀：只要海盜行為能傷害到其他列強，他們便樂得睜一隻眼閉一隻眼。<n><n>1668年，摩根受命指揮一艘海盜船，最初在南美洲北岸一帶大肆破壞。1670年8月，他率領近 2,000人攻下了防守嚴密的重鎮巴拿馬城，隨後在返航途中帶著大部分戰利款溜之大吉。然而由於這次襲擊發生在西班牙與英國簽訂和平條約之後，他被俘，並被押往倫敦受審。<n><n>摩根最終並未被判有罪，恰恰相反：沒過多久，外交的風向便再度轉變。摩根不僅被赦免，還被授以騎士爵位。作為「亨利爵士」，他被任命為牙買加的新任總督，在那裏厲行法紀，以一位富有而受人敬重的種植園主的身份度過餘生。"
"0xd4cd1091" = "巴哈馬群島在 17 世紀中葉曾短暫充當英格蘭宗教異議者的避難所，而從 1670年起，它正式歸奧伯馬爾伯爵等一批紳士管轄——他們從查理二世國王手中買下了這組島嶼，指望從中獲利。<n><n>然而儘管他們信誓旦旦，這些人對建立一套井然有序的民政管理卻興趣寥寥。恰恰相反：與加勒比其他地方的遭遇一樣，大批海盜在巴哈馬安家落戶，尤其集中在新普羅維登斯島——拿騷鎮就在這座島上。<n><n>那些重型軍艦無法駛入的淺水海灣，為數百艘單桅帆船和海盜雙桅船提供了理想的停泊處。他們在西班牙海域的頻繁劫掠招來了報復，首任總督約翰 溫特沃思面臨著一項棘手任務：在這些島嶼上重新建立法律與秩序。<n><n>眼看情況毫無好轉，英格蘭的喬治一世國王再度沒收了巴哈馬，把它改為王室直轄殖民地。1718年中，前私掠者兼環球航行家伍茲 羅傑斯被任命為首位皇家總督。<n><n>他軟硬兼施，結束了此前一直瀰漫的混亂。他宣佈大赦：凡願意宣誓放棄海盜活動的海盜，一律既往不咎。至於不肯就範者，等待他們的是一支全副武裝的艦隊的懲罰。<n><n>就這樣恢復正常秩序之後，這組島嶼於 1729年獲得了自己的議會；在此後的一百年裏，除了偶爾因入侵而起的動盪之外，巴哈馬的歷史相對平靜。"
"0xd4cd1092" = "在新獲得的殖民地，幾乎處處都是西班牙人建立起來的僵硬社會等級，幾乎不給人任何上升機會。等級的最頂端，是那些出生於歐洲的同胞。<n><n>出生在殖民地的西班牙人被稱為克里奧爾人。儘管在等級表中他們只被視為次要，卻佔據了國家、教會與軍隊中絕大多數較低的位置。<n><n>因此，歐洲血統的西班牙人與克里奧爾人構成了殖民地的精英階層。白人（多數是男性）與原住民通婚所生的子女被稱為混血兒（mestizos）。原本擁有這片土地的原住民，處於社會的最底層；而在那些已被歐洲人徹底滅絕的原住民所在地區，這份「榮耀」則留給了黑人奴隸。<n><n>這些階層在人口中的相對比例，在西班牙帝國的各個地區差異極大。例如在墨西哥，混血兒構成了人口中最大的部分。在許多島上，黑人奴隸的人數更多（並任由主人擺佈）。而在叢林、沼澤與山區提供了安全退避之所的地方——比如玻利維亞或佛羅里達——一些原住民族群也得以倖存。"
