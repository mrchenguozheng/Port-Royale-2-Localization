"0xf932eef8" = "恭喜！你已順利完成這個劇本，現在明白瞭如何建造自己的城鎮。<n><n>在自由模式中，任何一位副王都可能把一座屬於你的城鎮賞賜給你。但這並不容易做到，因為你必須不斷攻佔城鎮才能獲得土地，而這自然會損害你與其他國家的關係。<n><n>這個劇本里你學到的所有城鎮發展心得，同樣會幫助你在其他城鎮開設店鋪。唯一的區別是，你不必再為那些城鎮的防守操心。"
