"0xf22d73b9" = "你要有工具才能生產殖民地貨物。同理，你要有原料才能生產製成品。製成品例如繩索和布料，而它們的原料則是大麻和棉花。<n><n>既然你已經知道怎麼建生產設施了，就應當到總督城去買一份建築許可，並在那裏建起生產製成品的設施。不過在你能夠買到建築許可之前，你必須先與該城鎮建立一份有口皆碑的貿易記錄——也就是說，當城鎮裏某種貨物緊缺時，你要賣貨給它。<n><n>但要當心！如果你在某座城鎮裏大量收購緊缺貨物，這會損害你與該城鎮的貿易記錄！城鎮中緊缺的貨物，在貿易窗口裏是以紅色顯示的。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>改善你在[town:Cartagena]的貿易記錄，以便能在那裏購買建築許可。"
