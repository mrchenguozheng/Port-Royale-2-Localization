"0x305f2287" = "我國最近把最後一座總督城丟給了敵人。<n><n>只要擊沉這些敵國的軍事船隊、削弱他們，我們就能奪回一些城鎮。<n><n>為免和其他國家起衝突，我給你簽發一份針對敵人的私掠許可證。"
