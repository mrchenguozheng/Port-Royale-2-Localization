"0xde535352" = "不幸的是，[town:Tortuga]爆發了瘟疫。它將在城裏肆虐大約一個月。城鎮狀態大幅下滑，居民每天都在死去。許多居民被這場疾病嚇得倉皇出逃。<n><n>對你這個商人來說還有一點值得留意：瘟疫肆虐期間，城裏的衣物和木材需求翻了一倍。<n><n>你現在的任務，是保證瘟疫期間城鎮供應不斷，並保證居民人數不下降。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>必須在瘟疫結束後不遲於 20天內，把居民人數（常住人口減去士兵）恢復到@I$Pop$。這將確保所有產業都有充足的工人。"
