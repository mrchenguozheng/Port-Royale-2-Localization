"0xf4b68a6b" = "恭喜！你已順利完成這個劇本，並代表荷蘭攻佔了幾座英國城鎮。<n><n>在自由模式中，你也可以用同樣的辦法攻佔城鎮。但請務必記住：你想攻打城鎮的那個國家，必須在軍事上處於弱勢。此外，你打算為其攻打城鎮的那個國家必須軍力強大，而且這兩個國家必須處於交戰狀態。<n><n>注意：當你為一位副王攻打城鎮時，通常會獲得一塊土地，供你自己建造城鎮。不過本劇本中這項功能已被關閉。"
