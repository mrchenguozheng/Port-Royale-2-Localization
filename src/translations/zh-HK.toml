"0xe3de2671" = "你的船隊從海上打撈起一隻箱子，裏面裝著一份總督的文件。"
"0xe3de2672" = "你已經把總督的文件全部裝上船了。把文件送到@T$TOWN$。"
"0xe3e1d467" = "%1，<n><n>你現在買不了許可證，因為你在我國的聲望還不夠高，何況你為這座城鎮做的事也太少。<n><n>提升你在我國的聲望，並多與我的城鎮貿易以改善貿易記錄，我們再來談。"
"0xe3e1d468" = "%1，<n><n>恐怕你在我國的聲望不夠高，我沒法賣給你許可證。<n><n>等你聲望提升了再來。"
"0xe3e1d469" = "%1，<n><n>你與這座城鎮的交易太少了。送來這座城鎮需要的貨物以改善貿易記錄，之後你才能購買許可證。"
"0xe3e33a30" = "就讓%1成為你的新城吧。現在你就能像進出其他城鎮一樣進出它，在那裏建起建築、開辦產業。<n>整片區域暫時還不歸你使用，但若你攻佔更多城鎮，我會把所需的土地交給你。"
"0xe3fa97eb" = "那就說定了。把@a$Amount$桶工具送到@T$DestTown$。在市場上，每一<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>你能拿到@g$GoldPerBarrel$。貨物必須在@D$Date$前送到。"
"0xe3fa97ec" = "就這麼辦。把@a$Amount$桶送到@T$DestTown$。工具必須在@D$Date$前送到。"
"0xe3fa97ed" = "好！我交給你去採購@a$Amount$桶工具。在@D$Date$前把它們送到@T$DestTown$。在市場上，每一<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>付你@g$GoldPerBarrel$。"
