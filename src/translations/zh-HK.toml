"0xfb343dde" = "你正在洗劫城鎮時，一名年輕女子跑向你。<n>「我知道這次襲擊只是奉我父親的命令！難道他沒告訴你，我是自願留在這裏，而且我真心愛著綁架我的這個人？我求你別把我帶回去，我會報答你的！」<n><n>你要把總督的女兒丟在@T$TargetTown$，任她自生自滅嗎？"
"0xfb343ddf" = "總督的女兒向你道謝，並給了你一張地圖，上面標著一個藏有@a$Amount$桶貨物的藏身處位置。"
