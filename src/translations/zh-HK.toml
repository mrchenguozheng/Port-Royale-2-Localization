"0x077030da" = "恭喜！你已成功完成這個劇本，現在對海戰和攻港都有所體會了。<n><n>襲擊另一支船隊前，務必確認護航船已武裝妥當。當然，決定打哪支船隊之前也要仔細權衡。來自歐洲的運輸船隊和軍事船隊一向非常強大，海盜有時也會變成難纏的對手。<n><n>如果沒先從某國總督手裏拿到私掠許可證就襲擊商人，這會嚴重影響你在所有國家的關係。最壞的情況是，強大的軍事船隊會追獵你的船隊。<n><n>一句忠告：如果你俘獲一支貿易船隊而不擊沉它的船、只是洗劫，對聲望的負面影響會小得多。"
