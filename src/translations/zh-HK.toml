"0x183f926a" = "總督%1"
"0x1844fb4f" = "你擊潰了對手的護航船，搶下一艘商船。<n><n>現在你得決定取走哪些貨物，以及是俘獲這艘船，還是隻搶貨不俘船。"
"0x1844fb50" = "你擊潰了對手的護航船，搶下了%1艘商船。<n><n>現在你得決定取走哪些貨物，以及是俘獲這些船，還是隻搶了貨就放它們走。"
"0x1844fb51" = "對手的船隊沒有護航船保護。你兵不血刃就搶下了這艘商船。<n><n>現在你得決定取走哪些貨物，以及是俘獲這艘船，還是隻搶了貨。"
"0x1844fb52" = "對手的船隊沒有護航船保護。你兵不血刃就搶下了這些商船。<n><n>現在你得決定取走哪些貨物，以及是俘獲這些船，還是隻搶了貨。"
"0x184aee4b" = "兼容"
"0x18546893" = "在本劇本中，你將學會怎麼打一場海戰。劇本一開始是一場簡短的海戰演練。之後你得追蹤並摧毀一支惡名昭彰的海盜的船隊。<n><n>你還會認識[town:Cartagena]的總督——劇本就從這座城開始。他會帶你在海戰中積累經驗，日後還會交給你一項追捕某位海盜的任務。<n><n>劇本開始時你的等級是水手。必須達到這個等級，總督才會給你派任務。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>拜訪[town:Cartagena]總督，完成他交給你的任務。"
