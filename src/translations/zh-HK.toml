"0xcc0a1380" = "找到海盜@P$PirateName$指揮的船隊，它位於普羅維登斯東北約一天航程處。摧毀這支船隊。<n>然後回去見[town:Cartagena]的總督。"
"0xcc1709af" = "%1：敵對"
"0xcc2c64fb" = "你已接受任務：追蹤並摧毀黑鬍子的一支海盜船隊。<n><n>黑鬍子有一處秘密藏身處，裏面藏著好幾支船隊，每支都由五艘全副武裝的船隻組成。以你現有的船隊，這會是一份艱難的任務。<n><n>所以你得先提升船隊的火力。要湊夠錢買更大的船，可以把@T$TOWN$倉庫裏的貨物按你能拿到的最好價錢賣掉。照著「事件」窗口的提示做，它會告訴你@T$TOWN$東北方向的哪裏能賣出好價錢。<n><n>別在這上面花太多時間，之後你還得完成總督的任務！<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFHk.res><n><n><c>賣掉你在@T$TOWN$倉庫裏的貨物，把現金增加到@g$GoldGoal$。"
