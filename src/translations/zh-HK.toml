"0xcac5b30b" = "祈禱"
"0xcacc4fa8" = "找到並摧毀西班牙的寶藏船隊。它最後一次停在@T$StartTown$，此後便駛向@T$DestTown$。"
"0xcb2b0709" = "真是倒黴！今天你去見過@F$WifeName$了嗎？省省力氣吧，她已經不在了。你看，我找到了一封像是告別信的東西。信上說，她受夠了這種乏味的生活，跟一個冒險傢俬奔了。你必須替我救回我的寶貝女兒！"
"0xcb2b070a" = "大禍臨頭，而我看你正身處風暴中心。我女兒被海盜劫走了，不過有人給你留了一條消息，還附了一張地圖，標出某個地點。在我看來這多半是個陷阱，可我們又能怎麼辦？你必須救回我女兒！"
"0xcb2b070b" = "哈！我女兒，也就是你老婆，跟我衛隊的一名軍官私奔了！我早該想到的！現在兩個人都不見了，還順走了我一艘船！你必須把我女兒帶回來，讓她回心轉意！說來也怪，我在我女兒的住處裏找到一張地圖，上面標著一個地方。"
"0xcb3b9785" = "新名稱"
