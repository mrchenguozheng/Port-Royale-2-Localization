"0xf52fee2f" = "與海盜、私掠者以及敵國軍事船隊交戰。<n><n>以私掠者身份去追獵貿易船隊試試身手。<n><n>出海尋找傳說中的西班牙寶藏船隊。<n><n>指揮 16 種不同類型的船隻。"
"0xf52fee30" = "帶著你的船長與其他船長和海盜一決高下。<n><n>完成無數涉及戰鬥、貿易與政治的任務。"
