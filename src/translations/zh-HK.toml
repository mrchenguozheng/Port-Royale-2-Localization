"0x1c4cc4f1" = "%1：船隻已維修"
"0x1c703500" = "總督有急事要和你談。"
"0x1c74c605" = "你帶著%1逃之夭夭。"
"0x1c7e1413" = "謝謝！<n>當然，你得先在城鎮取得建築許可，不過你肯定能拿到。<n>學校一建成，我就付清你所有的費用。我妻子的生日是@D$EndDate$，務必在那之前打好學校的地基。"
"0x1c7e1414" = "很好。在@D$EndDate$之前開工建學校，錢我就付給你。<n>想建學校，可別忘了在@T$Town$取得建築許可。<n>這事別讓我妹妹知道。"
"0x1c7e1415" = "謝謝！@T$Town$不會知道我們的交易。在@D$EndDate$之前開工，錢我隨後付清。<n>想建學校，可別忘了在@T$Town$取得建築許可。"
"0x1c7e9deb" = "%1：已償還貸款額%2。"
"0x1c83647f" = "武器與彈藥："
"0x1ca41002" = "劇本已完成"
"0x1ca50773" = "幹得漂亮！你現在有一支像樣的船隊了。<n><n>下一項任務可不輕鬆：要攻打併擊敗一支英格蘭軍事船隊。[town:Turk Islands]的總督已為你增派了一艘船作為後援，去[town:Turk Islands]的港口找到它，把它併入船隊。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFHk.res><n><n><c>摧毀一支英格蘭軍事船隊。"
"0x1ce621bb" = "本地商人的住宅區"
"0x1ce62aab" = "當前任務"
"0x1ce81e5e" = "遊戲類型"
"0x1cf07333" = "幹得好，你在@I$Days$天內達到了第一個目標。下一個目標是增加居住在這座城鎮裏的市民人數。為此要開設五家產業，城鎮允許的種類各一家。<n><n>別忘了，來[town:Tortuga]的商人很少，你得保證城鎮貨源充足、狀態足夠高，才能接納新的移民。也別忘了給市民留出足夠的居住空間。<n><n>你有 60天達成這個目標，越快越好。<n><n>提示：士兵計入城鎮的人口，但不算市民！增加市民人數的唯一辦法就是創造工作。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在[town:Tortuga]開設五家不同的產業，並在@D$EndDate$之前把居民人數增加到 1,500。別忘了提供足夠的居住空間！每家產業都要配一處住宅區。"
"0x1d01f111" = "音效"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>在這裏沉沒的那艘船，船長必定是個經驗豐富的老手。箱子裏沒有金幣，只有一本保存得極好的日記，屬於船長@L$RandLName$。於是船隊@C$Convoy$的船長經驗提升了兩點。"
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>寶箱是空的，不過它曾被用作纜繩上的浮標。離水面不遠的地方，你發現一處堆著火炮的藏點。船員們儘可能多地把火炮搬上了船。"
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>周圍海面上漂著大量朗姆酒桶。你的人馬儘量多地打撈，能裝上船的都裝上。"
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>船隊發現了一口大木箱，立刻搬上船打開。船長一眼瞥見@g$Gold$，心想：這回可真是實打實的寶藏。"
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>水面上漂著一隻又老又朽、幾乎散架的木箱。裏面曾經裝過什麼，如今已無從得知，只留下一股惡臭。即便如此，船員們還是鬆了口氣——尋寶的折騰總算結束了。"
"0x1d19d29c" = "%1的建築許可"
"0x1d6d7bd9" = "而且港口的防守十分森嚴。"
"0x1db06b05" = "找到包裹"
"0x1db7f908" = "可惜你的時間不夠，沒能攢到@g$GoldGoal$現金。<n><n>把[town:Tortuga]倉庫裏的貨物賣到缺貨的城鎮去，同時留意那些能低價買進的貨物。<n><n>你也可以向[town:Tortuga]的財務主管借一筆款。"
