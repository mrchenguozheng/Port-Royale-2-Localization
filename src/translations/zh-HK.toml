"0xf8b3a303" = "城鎮狀態共分七級，從蕭條一直升到富有。在最低的兩級，生活品質糟糕到居民經常離城而去。反過來，當一座城鎮達到「興旺」 「富裕」和「富有」這些級別時，你的產業會獲得效率加成，你的勞動力也會變得更划算。而在最高一級，城鎮甚至能自行生產移民。<n><n>關於每一級狀態的具體影響，你可以在城鎮信息裏查到。點擊城鎮名稱即可打開。<n><n>每一組貨物中，有兩到三種貨物供應充足，就能確保城鎮的生活品質良好。所謂某種貨物供應充足，是指它能維持城鎮人口十天的用量。<n><n>注意：城鎮狀態不會一夜之間提升。城鎮居民適應新情況需要一段時間。"
