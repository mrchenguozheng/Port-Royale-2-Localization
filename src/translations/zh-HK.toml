"0xf353a9cf" = "你好！你有自己的船嗎？我的船在最近一場風暴裏丟了。所幸我保住了性命，可裝著我許多最珍貴私人物品的箱子卻沒了。你能出海去看看我的箱子是否還漂在海上某處嗎？我會重重酬謝，那箱子對我意義重大。"
