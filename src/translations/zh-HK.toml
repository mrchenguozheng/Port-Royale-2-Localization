"0xcff9644a" = "「獨臂海盜」是一款用 32張牌玩的機會遊戲。每位玩家把賭注放進底池，並拿到 5張對方看不見的牌。<n><n>首先，每位玩家都要報出自己認為能贏的點數，每贏一墩得一分。報點數更高的玩家先出牌，並決定主花色。他必須設法贏到至少自己報的那麼多分。<n><n>先出牌的玩家打出手牌，另一位玩家若做得到，必須跟出同花色的牌。牌最大者贏得這一分。<n><n>若某玩家無法跟花色，可以棄掉任意一張牌，或打出一張主牌。<n><n>牌的順序是 I、II、III、IV、海盜、新娘、總督、鸚鵡。主牌壓過其他所有牌。<n><n>贏得這一分的玩家再出下一張牌。如此繼續，直到有人贏下整局。<n><n>若先手者成功贏到了自己報的點數，他即獲勝並拿走底池；若沒有，則對手獲勝。"
