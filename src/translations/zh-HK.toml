"0xcd01da76" = "你以水手身份在西班牙總督城@T$TOWN$起步，那裏已經有一座屬於你的倉庫。你的港口裏還有一支船隊，配有兩艘武裝船，卻沒有水手。<n><n>本劇本的第一個目標，是拜訪@T$TOWN$的總督並接下他的任務。他正被臭名昭著的海盜愛德華 蒂奇（即黑鬍子）攪得不得安寧，想請你出手相助。<n><n>注意：本劇本中各國處於和平狀態。這意味著你絕不可攻擊任何國家的船隊。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>拜訪@T$TOWN$的總督，接下他交給你的任務。"
