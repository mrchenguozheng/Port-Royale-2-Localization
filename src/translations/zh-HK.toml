"0x19b399ce" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFHk.res><t>關閉窗口/<n><t>選項菜單<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFHk.res><t>快進<n><f:fonts/Tiepolo_black14x14aaFHk.res>Shift<f:fonts/Tiepolo_bold14x14aaFHk.res><t>船隊居中<n><f:fonts/Tiepolo_black14x14aaFHk.res>Caps Lock<f:fonts/Tiepolo_bold14x14aaFHk.res><t>居中開關<n><f:fonts/Tiepolo_black14x14aaFHk.res>方向鍵<f:fonts/Tiepolo_bold14x14aaFHk.res><t>移動<n><t>顯示窗口<n><f:fonts/Tiepolo_black14x14aaFHk.res>CTRL + 1..0<f:fonts/Tiepolo_bold14x14aaFHk.res><t>保存船隊<n><f:fonts/Tiepolo_black14x14aaFHk.res> 1..0<f:fonts/Tiepolo_bold14x14aaFHk.res><t>調回船隊<n><f:fonts/Tiepolo_black14x14aaFHk.res> TAB<f:fonts/Tiepolo_bold14x14aaFHk.res><t>下一支船隊<n><f:fonts/Tiepolo_black14x14aaFHk.res>+ / -<f:fonts/Tiepolo_bold14x14aaFHk.res><t>遊戲速度<n><f:fonts/Tiepolo_black14x14aaFHk.res>F5 <f:fonts/Tiepolo_bold14x14aaFHk.res><t>快速存檔<n><t>（戰鬥中不可用）"
