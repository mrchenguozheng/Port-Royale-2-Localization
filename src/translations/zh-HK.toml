"0xca6f7278" = "你在我國的聲望很高。不過我知道還有一個辦法，能讓你聲望更高。<n><n>海盜%1的藏身處不久前被發現了。%2<n><n>也許你正是那個能替我們除掉這夥禍害的人。"
