"0xfc3fdd9b" = "你沒能恢復[town:Tortuga]的人口。<n><n>城鎮的狀態一旦達到「繁榮」或更高，就可以僱用新工人。你可以用移民家庭的形式為城鎮補充人手。他們從歐洲前往總督城，在那裏等候前往其他城鎮的船位。在狀態較低的城鎮裏，你也會找到等待被接走的移民。"
