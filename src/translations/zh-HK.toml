"0xe6393b08" = "海上船隊"
"0xe6490f96" = "1676年，荷蘭人統治的[town:Turk Islands]上。荷蘭擁有七座城鎮，其中五座是殖民地城鎮，一座是總督城，一座是副王城。<n><n>英國擁有 14座城鎮，並且與荷蘭打了很久的仗，而且這場戰爭還會再持續許多個月。只要戰爭還在繼續，你就必須代表荷蘭去奪取英國王室手中的城鎮。<n><n>但在你攻打任何英國城鎮之前，你的船隊還需要更多資金和更多武裝。你的第一個目標，是擊敗三支英國貿易船隊並繳獲它們的船。<n><n>不過首先，你必須從[town:Turk Islands]的荷蘭總督那裏取得一份私掠許可證。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>拜訪[town:Turk Islands]總督，取得針對英國的私掠許可證。"
"0xe64f1385" = "很好！你已經摧毀了黑鬍子的一支海盜船隊。現在去@T$TOWN$的總督那裏領取報酬。<n><n>他還另有一件委託要交給你。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>再為@T$TOWN$的總督完成一件委託"
"0xe65025c3" = "在1座城鎮裏"
"0xe6510ae7" = "你必須在@D$EndDate$之前，把小麥、磚塊、棉花、糖和菸草的儲備各增加到@a$Amount$桶。"
"0xe65524e7" = "確保你的城鎮各類貨物各備有@a$Amount$桶。"
"0xe674b971" = "藏寶圖"
"0xe67d58b9" = "發現金礦"
"0xe6851da5" = "在上一個劇本里，你已經得知自己的等級取決於總資產。總資產包括你的現金，以及你的建築、船隻和貨物。你可以隨時在日誌的「成就」一欄查看總資產。<n><n>你還可以查看那條表示你經驗值的藍條，它始終位於屏幕底部的船隊面板中。當這條藍條抵達屏幕右邊緣時，你就被提升到下一個等級。一旦達到某個等級，你就不會再掉下去。<n><n>等級越高，你能指揮的船隊就越多，因而你日後能夠開設店鋪的城鎮數量也越多。達到一定等級後，你還可以享有數量無限的船隊和建築許可。"
"0xe6d65f53" = "居民"
"0xe6d9252d" = "%1，原來你就是%2，我父親跟我講過你的好多事。我是%3。你願不願意過來，跟我說說你的歷險故事？"
"0xe6d9252e" = "%1，我想我早就聽說過你了。我是總督的女兒%3。我一直想見一見%2。求你說說你的歷險故事吧！"
"0xe6d9252f" = "原來你就是那位大名鼎鼎的%1！我聽說了那麼多關於你的故事，想當然以為你高大得多。不過這絲毫不減你的魅力！過來給我講講你的歷險故事吧！我父親總督早就把你的事講了一大堆。"
"0xe6d92530" = "%1，<n>真高興又見到你。說說我們分別後你過得怎麼樣。有給我帶東西嗎？"
"0xe6d92531" = "%1，<n>真高興又見到你。上次見面之後，我滿腦子都是你。快進來吧，我有好多話想告訴你。"
"0xe6d92532" = "%1，<n>你又來看我，我真高興。你的歷險故事我已經講給所有朋友聽了。不過現在你得再多講一些，姑娘們都還等著聽後續呢。快進來吧。"
