"0x30bb44fc" = "你不就是那位大名鼎鼎的@A$USER$嗎？能幫我個忙嗎？有個賞金獵人正在追我，是我一個仇家把他僱來的。"
"0x30bb44fd" = "@A$USER$，請坐。我叫@N$OwnerName$，有件要緊事想跟你商量。從哪說起呢？我跟妻子吵了一架，她指控我對她不忠，這當然是胡說八道。總之，她把我趕出了家門，這還不算最糟：她還僱了個賞金獵人，害得我現在連城都進不去。你能幫我嗎？"
"0x30bb44fe" = "你看起來像是個能鎮得住場面的人。<n>我必須趕去@T$Town$，送一份能扳倒當地某位商人的文件。不幸那商人已經聽到風聲，正想搶先拿到文件。你能不能想個辦法把我送到@T$Town$？"
