"0x31ed47e7" = "一名破壞者汙染了[town:Tortuga]的糧食供應，城中當即爆發饑荒。<n><n>你的任務是儘快結束這場饑荒。<n><n>大約兩三週的時間裏，你要讓儘可能多的食物做到每日供應多於消耗。<n><n>提示：食物包括小麥、水果、玉米和肉類。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>饑荒必須在@D$EndDate$前結束。"
