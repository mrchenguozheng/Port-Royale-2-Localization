"0x163fff71" = "%1，<n>你來了正好。要不要聽聽我最近打聽到的消息？"
"0x163fff72" = "%1，<n>又見到你真高興。這兩天我四處打聽，現在也許有些消息要告訴你。"
"0x163fff73" = "%1，<n>又見到你，我很高興。我想我有些消息要告訴你。"
"0x165603c2" = "%1，<n>過了挺久了，不過見到你真高興。我有些消息要告訴你。"
"0x165603c3" = "%1，<n>我正打算出門拜訪一個人，這地方實在悶得慌。偏你來了。來，我有話跟你說。"
"0x165603c4" = "%1，<n>你來得正好，我正琢磨你這些天跑哪兒去了。我有消息告訴你。"
"0x1659b12c" = "你現在有足夠的錢給船隊增加火力了。去總督所在城鎮的船塢看看，挑一艘你買得起的最強戰船。<n><n>然後把這艘船併入船隊，多帶些火炮和水手上船。錢不夠就再多做幾筆生意。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>把船隊的火力提升到至少 90 門火炮。"
"0x165fc28e" = "去你的新城鎮，建一座船塢。"
"0x16656b80" = "%1 %2<g:scripts/intext_herz_800x600.screen>"
