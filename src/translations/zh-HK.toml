"0xd9fb62e7" = "你的船隊撈到一隻漂流瓶。瓶中有一張地圖，標出了某個特定地點的位置。"
"0xd9fb62e8" = "[ref:0xd9fb62e7]"
"0xd9fb62e9" = "船隊發現了一隻漂流瓶，裏面塞著一張匆忙寫就的字條：「救救我！我猜他們打算把我帶到這個地點！」<n>字條還附了一張地圖，標出了某個特定地點的位置。"
"0xd9fb8936" = "前任船長"
"0xd9ffa15a" = "新遊戲"
"0xda291187" = "悄然靠岸"
"0xda32e71d" = "軍艦狀態開關"
"0xda34f229" = "走私"
"0xda669628" = "逃脫<t>%1<t>%2<t>%3<n>"
"0xda68e605" = "貨物移交結束：%1"
"0xda75935c" = "攻佔城鎮"
"0xda93dbe1" = "非常好！這可不是件容易的事！英格蘭已經損失瞭如此之多的軍事船隊，以至於它的城鎮可以被攻佔了。為感謝你所提供的服務，[town:Turk Islands]的總督再給你四艘大帆船。<n><n>只有奉副王之命，你才能攻佔他國城鎮。而副王只有在自身國家軍事強大、敵國軍事虛弱的情況下，才會命你攻城。<n><n>不幸的是，荷蘭目前的實力還不足以攻佔城鎮。不過你可以為此做點事：去拜訪[town:Grand Bahama]的荷蘭副王，把你的一支船隊移交給他。這樣他就會組建一支新的軍事船隊，從而增強荷蘭的軍事實力。<n><n>如果你想把船隊移交給一位副王，這支船隊必須恰好有五艘船，並且至少配備 150 門火炮。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>幫助副王增強荷蘭的軍事實力，然後接受一項代表他攻城掠地的任務。"
"0xdab4fea7" = "住宅建築"
"0xdac343f7" = "IDM_CONTEST_01_2004_LOG_03_HDR"
"0xdac43b47" = "移民不足"
"0xdacb8ff6" = "你城鎮的[term:en_quality_of_life]"
"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "按鈕"
"0xdaeb0484" = "這一次，你在加勒比海腹地的總督城[town:Cartagena]開始這個劇本。<n>你那隻由一艘單桅帆船組成的船隊正在港口裏。<n>你必須先為船隊武裝起來，因為這個劇本會涉及海戰。<n>去碼頭，打開貨物菜單。"
"0xdaeb0485" = "可以看到，你的船隊上沒有火炮，也沒有彈藥。你還缺一批船員。<n>儘可能多地裝載船員和火炮，並按每種 10×10 的數量帶上三類火炮彈藥。<n>火炮很重，船隊的空間可能不夠。若真不夠，你可以賣掉一部分已裝上的貨物。"
"0xdaeb0486" = "做得好！你的船隊已經武裝完畢，可以打一場小規模的海戰了。<n>巧的是，[town:Cartagena]的總督正好有一件委託要交給你。<n>點擊總督府，接受他的委託。"
"0xdaeb0487" = "總督們常常會給出一些委託，你要是辦成了，聲望就會提升，在該國的地位也就更高。<n>你也可以向總督索取私掠許可證，或者為你俘獲的海盜索要贖金。<n>現在用你的船隊去找總督提到的那幾艘船。"
"0xdaeb0488" = "很好，你已經找到那支船隊了。<n>下一步是把你的船整備到可以作戰的狀態。為此打開船隊的船隻列表，選中你的單桅帆船。要把它定為軍艦，請按火炮旁邊的那個按鈕。隨後右鍵點擊那支船隊，即可對它發起「攻擊」。"
"0xdaeb0489" = "這就是 Port Royale 的海戰視圖。<n>它會顯示你的船，移動顯示窗口還可以查看那些被棄置的船隻。<n>現在關閉暫停模式，用鼠標右鍵練習航行。海戰期間，事件窗口會顯示風向和船隻。"
"0xdaeb048a" = "參戰的所有船隻都顯示在屏幕底部。你可以在此選擇要使用的彈藥。選中重型炮彈，擊沉一艘敵船。<n>你可以用鼠標左鍵開火，但只有在你的船處於良好射擊位置時才可行。此時目標會顯示為紅色。"
"0xdaeb048b" = "很好！登上第二艘船。<n>為此請點擊船隻顯示區右下角的「登船」按鈕。<n>然後駛向敵船撞它。注意：海戰期間按住 F1 也能看到這頁幫助。"
"0xdaeb048c" = "通常敵船上都有船員，於是雙方船員會在船上展開戰鬥。<n>戰鬥結束後，所有被登上的船隻都歸勝者所有。<n>現在把這艘敵船加入你的船隊，然後關閉轉運窗口。"
"0xdaeb048d" = "非常好！<n>現在讓你的船隊返回[town:Cartagena]。"
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "屬於海盜%1的一支船隊襲擊了一名來自%2的商人。"
"0xdb0108d5" = "先買一艘新船。去船塢挑一艘儘可能多裝火炮的船。"
"0xdb0108d6" = "選中你的船隊，然後右鍵點擊港口，把新船加入船隊。"
"0xdb0108d7" = "所有船隊都由商船和護航船組成。<n>若船隊中的某艘船要參戰，就必須把它定為軍艦。<n>打開船隊的船隻列表，即可看到你所有的船。"
"0xdb0108d8" = "船隻列表會顯示船隊中的全部船隻。軍艦狀態顯示在船隻的右上角。若出現火炮圖標，就說明該船已被定為軍艦，會參與戰鬥。點擊這個角落即可直接切換狀態。<n>不過現在你應該點擊你的新船並選中它。"
"0xdb0108d9" = "船隻的技術參數（比如最大載貨量）會像在船塢裏一樣顯示在這裏。<n>你還能看到維持這艘船的每日開銷。<n>現在勾選火炮圖標，把這艘船轉為軍艦。"
"0xdb0108da" = "做得好！<n>船隊中的火炮和船員始終由各艘護航船平均分配。<n>確保你的護航船全部武裝到位、船員滿編，然後去拜訪總督，接受他交給你的新委託。"
"0xdb0108db" = "現在去完成總督交給你的委託。"
"0xdb0108dc" = "從你的護航船中選出你希望指揮的那一艘參加海戰。<n><n>在任意階段，你都可以點擊列表中的另一艘護航船來更換選擇。<n><n>但要注意：戰鬥一旦開始，每艘船隻能被選中一次！"
"0xdb0108dd" = "做得好！你已經消滅了這支海盜船隊。<n><n>現在返回[town:Cartagena]總督處，因為這屬於委託的一部分。<n><n>注意，你的委託會自動記錄進日誌。必要的時候，你隨時可以在那裏查看詳情。"
"0xdb04023a" = "建築材料不足"
"0xdb0e3d33" = "我有一件委託想交給你。<n><n>"
"0xdb0e3d34" = "你幫我個忙吧。<n><n>"
"0xdb0e3d35" = "有件事想請你去辦。<n><n>"
"0xdb10f490" = "捐贈"
"0xdb126f49" = "你的點數<n>"
"0xdb170d26" = "在總督交給你新委託之前，先確保你的船隊狀態良好！<n>如果船隊有損傷，就去船塢把它修好。"
"0xdb170d27" = "你剛收到一筆錢，用來幫你的船隊把裝備配得更齊。<n>你的船隊應當有三艘武裝齊全的船，船員也要滿編。<n>別忘了彈藥，也記得把你的新船定為軍艦。現在就去做。"
"0xdb170d28" = "非常好！<n>現在去拜訪總督，完成他交給你的委託。"
"0xdb2ae26e" = "拒絕"
"0xdb2d1177" = "你即將去襲擊一處海盜藏身處。<n>先確保你的船隊狀態良好！<n>你可以多跑幾座總督城，看看有沒有船塢裏備著更大的船。<n>路上順便拜訪總督，從他那裏打聽一些關於海盜藏身處的消息。"
"0xdb2d1178" = "港口戰鬥與海戰類似，區別只在於對手不是別的船，而是極其堅固的炮塔。<n>要贏下一場港口戰鬥，你必須摧毀所有炮塔。<n>港口裏有時會有武裝船隻。這種情況下，你必須先解決這些船，才能攻擊港口本身。"
"0xdb2d1179" = "要結束這個劇本，就帶著你的船隊返回[town:Cartagena]。"
"0xdb4287ac" = "[town:Cartagena]總督認為你潛力非凡，賞給你@g$Gold$。<n><n>提示：<n>在供應充足的城鎮裏購入貨物（數量不能顯示為紅色），再到缺貨的城鎮賣出，這樣才能賣上更好的價錢。<n><n>用這個辦法，你很快就能增厚自己的財富。"
