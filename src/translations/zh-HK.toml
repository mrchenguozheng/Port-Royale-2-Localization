"0x22fffe32" = "親愛的%1，<n>我實在等不及了。快去市場把婚禮用的貨送到，好讓宴席早些開席。"
"0x2310e7f4" = "要顯示下一個劇本目標，你必須完成攻佔城鎮的任務。"
"0x2335f663" = "謝謝你把包裹給我帶回來。這是給你的報酬@g$Reward$。"
"0x234d00d9" = "今天，海盜%1開始在加勒比地區大肆作亂。"
"0x23652698" = "很遺憾，我沒法告訴你確切情況。我的港務長只含糊描述了他們可能搶走的那艘船。有個商人在海上看見過那艘船，指給我看了位置。@l$Pos$搜搜這一帶，也許能找到線索。"
"0x23652699" = "位置是@l$Pos$。搜搜這一帶，也許能找到線索。請把我女兒平安帶回來。"
"0x2365269a" = "位置是@l$Pos$。搜搜這一帶，@F$WifeName$提起它時，也許是在暗示我們什麼。請把我女兒平安帶回來。要是碰上那個卡薩諾瓦，替我向他問好。"
"0x23815ece" = "確定要退出當前遊戲並返回主菜單嗎？"
