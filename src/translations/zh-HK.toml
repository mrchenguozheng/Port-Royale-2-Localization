"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "顯卡"
"0xf6c77503" = "海盜%1的藏身處已被發現。哪位英勇的冒險家敢去攻毀它？"
"0xf6ec5ddc" = "[town:Tortuga]正在發生一些怪事。由於過去發生的一連串事件，如今幾乎沒有任何商人敢踏入這座城鎮。你的任務是盡你所能供應貨物，以扶持[town:Tortuga]。<n><n>但你手上的啟動資金並不算可觀。你手頭有@g$StartGold$現金。不過，港口裏停著一支裝備齊全的貿易船隊，還有一些貨物存貨。<n><n>你的第一個目標，是把現金增加到@g$GoldGoal$。儘快完成這項任務，但耗時不得超過 40天。<n><n>一句忠告：無論如何都不要賣掉你的船。不過，你可以去貸款。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在@D$EndDate$之前把現金增加到@g$GoldGoal$。"
"0xf70feddb" = "你已經回到[town:Cartagena]的港口，你的船隊「聖瑪麗亞」也已選定。<n>正如你所見，船隊裏已經有了一些貨物：棉花、肉和可可。<n>現在去港口裏找到碼頭並點擊它，因為你打算把這些貨物賣掉。"
"0xf70feddc" = "在碼頭，你可以進行城鎮與倉庫之間、以及城鎮與船隊之間的交易。<n>現在你能看到城鎮有哪些貨物、船隊有哪些貨物。用箭頭買入賣出（價格顯示在箭頭上）。<n>現在賣掉你的棉花。"
"0xf70feddd" = "你可能已經注意到，你一賣出棉花，棉花的價格就下跌了。<n>這是因為價格由城鎮的供求關係決定。<n>賣出貨物滿足了需求，價格便會下跌；買入某種貨物，它的價格就會上升。<n>現在買入@a$SubGoal$小麥。"
"0xf70fedde" = "注意到小麥的價格剛剛上漲了嗎？<n>不過要注意，價格不只取決於供應量，還取決於你在這座城鎮的聲望。<n>點擊貿易窗口右下角那個帶房屋圖標的按鈕。"
"0xf70feddf" = "現在你可以在倉庫與城鎮之間進行交易。<n>想在某座城鎮生產某種貨物，就必須先在那裏建一座倉庫。你的起始城鎮裏必定已經有一座倉庫。<n>現在把倉庫裏的所有貨物都賣掉。"
"0xf70fede0" = "貿易窗口最上方有三個分別標著 1、10 和 100 的按鈕，方便你更快地大批量交易。點擊 10 號按鈕，看價格如何變化。<n>買 10 件 x 1 種貨和買 1 件 x 10 種貨沒有區別：總價始終相同。現在買入@a$SubGoal$朗姆酒。"
"0xf70fede1" = "貿易菜單最右邊那一列顯示你買下這些貨物的平均價格。既然你想賺取差價，就得找到一個能賣出更高價格的城鎮。<n>現在點擊右下角第四個按鈕（帶起重機圖標的那個），打開船隻與倉庫之間的轉運界面。"
"0xf70fede2" = "在這個窗口裏，你可以在船隊與倉庫之間調動貨物。現在把倉庫裏剩下的貨物都裝上船隊，因為你打算到另一座城鎮去賣。<n>然後點擊右下角標著「X」的按鈕關閉貿易窗口。"
"0xf70fede3" = "現在切換到海圖，駕船隊前往聖瑪爾塔。不要進入聖瑪爾塔，而要在船隊抵達城鎮時立刻右擊城鎮名稱。"
"0xf70fede4" = "這會打開聖瑪爾塔的貿易窗口。<n>因此你不必進入城鎮就能在那裏交易。<n>現在把船隊上所有的貨物都賣掉。<n>然後關閉貿易窗口。"
"0xf7110875" = "你確定要刪除這個存檔嗎？"
"0xf725f22c" = "你的船隊現在位於聖瑪爾塔。點擊城鎮名稱即可查看城鎮信息。<n>你可以在海圖上直接這麼做，也可以進入城鎮後再看。"
"0xf725f22d" = "城鎮信息會顯示這座城鎮出產哪些貨物。<n><n>你與西班牙的關係也會一併顯示：這層關係是友好的！這意味著你在這座城鎮能拿到最有利的價格。<n><n>現在關閉這個窗口，在城裏四處看看。"
"0xf725f22e" = "現在點擊屏幕左側城鎮名稱下方的「居民」圖標，查看聖瑪爾塔的庫存。"
"0xf725f22f" = "這裏會顯示庫存貨物的數量和城鎮消耗貨物的數量。當然，消耗水平取決於城鎮的人口。<n>消耗量能告訴你每種貨物可以穩定供應多少。現在關閉庫存窗口。"
"0xf725f230" = "現在試著做幾筆有利可圖的買賣。<n>打開貿易窗口，儘可能多地買入你的船隊裝得下的棉花、糖和可可，因為這些貨物正是這座城鎮出產的。<n>然後返回[town:Cartagena]，把這些貨物高價賣出。"
"0xf725f231" = "你剛收到兩條消息，裏面有些成功貿易的訣竅。<n>打開日誌來讀一讀這些消息。<n>"
"0xf725f232" = "儘量把貨物以高於平均價的價格賣出去，再買入新的貨物。<n>注意：某座城鎮裏稀缺的貨物，其價格會以紅色顯示。這類貨物你總能賣出好價錢。<n>"
"0xf725f233" = "像[town:Cartagena]這樣的總督城會收到從歐洲運來的進口貨物。<n>你通常能把它們高價賣給殖民地城鎮，比如聖瑪爾塔、馬拉開波或直布羅陀。<n>接下來自己先做一段時間買賣吧。<n>你的目標是通過貿易賺到@g$GoldGoal$現金。"
"0xf7346191" = "%1的商人"
"0xf73619d7" = "海盜藏身處已曝光"
"0xf7370c4b" = "%1，<n>我能想到很多我更想見的人。我們有事要談嗎？你要是非進來不可，就進來吧。"
"0xf73bf67d" = "切換到[town:Cartagena]的城鎮視圖。<n>通常你想進入一座城鎮，得先有船隊停泊在港口。不過你在[town:Cartagena]有倉庫，因此隨時都可以進入這座城鎮。<n>點擊[town:Cartagena]的船塢。"
"0xf73bf67e" = "在船塢裏買一艘小船。別花太多錢，因為還要留些錢用來貿易和維持你的船。"
"0xf73bf67f" = "上一個劇本里，你學會了通過右擊港口把船隻加入船隊。<n>不過這一次，你該到旅店僱一名船長，組建一支新船隊。<n>找到旅店（位於城鎮中心）並點擊它。"
"0xf73bf680" = "船長總能在旅店裏找到。如果城裏有船長住著，旅店菜單裏的第三個按鈕就會有所提示。<n>如果你在港口裏還有別的船隻或船隊，你必須告訴船長他具體要在哪艘船上任職。<n>指定由他指揮你的新船。"
"0xf73bf681" = "恭喜！你已經組建了第一支船隊！下一個任務是把你的財富提升到@g$GoldGoal$。你隨時可以在日誌的「成就」裏查看自己的財富。<n><n>祝你好運！"
"0xf73dab55" = "謝謝你完成我最近交辦的那個任務。"
"0xf73dab56" = "我想為你完成我上一個任務而道謝。"
"0xf73dab57" = "我很感激你的支持。"
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "你將帶著<o:0xFFF2FAAD>%1<o> 枚金幣和一艘<o:0xFFF2FAAD>輕型帆船<o> 開始生涯。（60 噸，最多 8 門火炮）"
"0xf7534d8f" = "當你把移民運到缺人的城鎮時，他們會在下船時付給你一筆運費，以此向你致謝。<n><n>生產可可這類殖民地貨物，始終需要少量工具。一旦沒有工具，生產就會停下來。等你略微摸清價格與數量之後，可以指派店老闆定期在城裏採購工具。不過眼下為了穩妥，工具還是你自己買。<n><n>這就是你的下一項任務。做完之後，就再沒有什麼能阻止你生產可可了。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>劇本目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>生產可可，並在倉庫中囤到@a$AmountGoal$。"
