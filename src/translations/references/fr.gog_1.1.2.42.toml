"0x084340c7" = "Ce scénario est difficile, et concerne le commerce, la production et l'approvisionnement des marchandises dans une ville.<n:25>Des choses étranges se passent à Tortuga : les marchands sont réticents à venir en ville, et différents événements rendent la vie difficile aux citoyens. Votre tâche est de sauver la ville de la faillite. A la fin du scénario, votre score s'affichera. Il sera fonction de votre rapidité et de votre richesse à la fin du scénario.<n:25>Dans ce scénario, vous avez accès à toutes les options proposées dans les parties libres mais vous avez aussi des objectifs spécifiques à atteindre."
