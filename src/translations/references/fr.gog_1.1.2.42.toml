"0x20ff905e" = "Equipage"
"0x2106ce9e" = "Un capitaine expérimenté attend à l'auberge."
"0x21117682" = "<n><n>Vous pouvez normalement rendre un permis de construire que vous avez gagné. Mais vous ne pouvez pas le faire dans ce cas parce que %1 est la ville où vous avez commencé le jeu."
"0x21117683" = "<n><n>Voulez-vous rendre votre permis ?<n>Rappelez-vous que je ne peux rien vous payer pour ce permis !"
"0x211c8552" = "Durée de partie terminé"
"0x2137ec23" = "Merci. Je payerai un prix élevé pour du vin, des outils et des épices jusqu'au @D$Date$. Rencontrez mon émissaire au marché et livrez-lui @a$Amount$ de chaque. Il n'acceptera qu'une cargaison complète, il vous payera seulement alors."
"0x2137ec24" = "Cela me semble bien. Donc, voyagez vers les villes de nos ennemis pour y acheter les marchandises d'import. Livrez @a$Amount$ de chaque avant le @D$Date$ à mon émissaire au marché de @T$TOWN$, il vous en payera plus du double du prix."
"0x2137ec25" = "Savez-vous quelle serait la meilleure chose à faire ? Acheter les marchandises importées à @n$Nation2$ et provoquer là-bas une rupture de stock. Livrez @a$Amount$ de chaque au marché. Mon émissaire vous y attendra jusqu'au @D$Date$ et payera un bon prix."
"0x215e37a6" = "J'ai récemment surpris une conversation, dans laquelle un marchand disait qu'un de ses navires avait coulé. Il ne s'inquiétait pas pour le bateau en lui-même, c'était un vieux rafiot, mais plutôt pour un coffre spécial qu'il transportait."
"0x215e37a7" = "Nous sommes donc d'accord. Dans la dernière traversée où je me suis engagé, le capitaine a perdu son sang-froid à cause d'un coffre qu'il venait juste de jeter par-dessus bord."
"0x215e37a8" = "Un homme qui fut naguère un bon ami s'est enfui avec un de mes coffres les plus onéreux."
"0x2167838b" = "Achat du navire"
"0x21743bf7" = "Je dois récupérer ces objets ! Nous ne savons pas exactement où le navire a coulé. @l$ChestPos$ Rapportez-moi le coffre avant le @D$EndDate$."
"0x21743bf8" = " Vous devez m'apportez les objets avant le @D$EndDate$. @l$ChestPos$"
"0x21743bf9" = "Il ne m'a dit que récemment qu'il avait jeté le coffre par-dessus bord. @l$ChestPos$ Vous devez me rapporter ces objets ! Vous me trouverez ici jusqu'au @D$EndDate$."
"0x217923cb" = "Date butoir de livraison : %1"
"0x2190d204" = "Un marchand local est prêt à vous payer %1 pour le commerce."
"0x21a69afe" = "Responsable gestion"
"0x21b0dfff" = "%1 pille %2"
"0x21b3050a" = "Un convoi militaire a détruit les défenses du port de la ville et a pillé des marchandises. Le niveau de la ville a chuté."
"0x21bdc952" = "Graphique suivant"
"0x21bf83f0" = "Affichage des informations des navires"
"0x21c2f2cf" = "<n><o:0xffC00000>Echec de la mission. <o:0xff000000>"
"0x21cae149" = "Très bien ! Vous devez maintenant renforcer votre convoi pour attaquer plusieurs convois militaires. Vous devez avoir au moins trois frégates ou mieux dans votre convoi.<n><n>Vous pouvez capturer les navires ou les acheter dans les chantiers navals des villes principales.<n><n>Définissez-les comme des navires de guerre et assurez-vous qu'ils sont armés et disposent d'équipages complets.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Armez votre convoi de telle sorte qu'il dispose d'au moins trois frégates de guerre ou mieux. "
"0x21d142f5" = "Réparer le convoi dans cette ville"
"0x21e727b4" = "Je suis sûr que vous avez déjà entendu parler du pirate @P$PirateName$. Il a déjà @I$NumConvoys$ convois et nous n'avons toujours pas découvert son repaire. Par chance, nous connaissons la position d'un de ses convois. Peut-être est-il toujours dans ce secteur. Je veux que vous le détruisiez. "
"0x21e727b5" = "Nous devons agir vite, car je viens d'être informé de la position d'un des convois du pirate @P$PirateName$. Trouvez et détruisez ce convoi."
"0x21e727b6" = "Tous les pirates ont leur propre repaire, d'où partent des convois pour attaquer des navires. A ce jour, le pirate @P$PirateName$ a mis sur pied une flotte de @I$NumConvoys$ convois. Par chance, nous avons découvert la position d'un important capitaine de sa meute et de son convoi. Je veux que vous trouviez et que vous détruisiez ce convoi."
"0x21f9ce44" = "Famine à %1"
"0x2204d118" = "Entreprises / total"
"0x22163917" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_SCHIFF_800x600.screen>"
