"0x273267f2" = "Oh, je n'arrive pas à y croire. Des ivrognes ont volé mon beau navire. Ils l'ont rempli de bouteilles de rhum et sont partis. Pouvez-vous m'aider à retrouver mon navire ?"
"0x273267f3" = "Par tous les diables : mon ivrogne de fils Boris est parti avec mon plus beau navire. J'ai découvert qu'il partait faire la bringue avec plusieurs de ses amis. Tels que je les connais, la soute doit être remplie de rhum et je ne reverrai jamais mon navire. Pouvez-vous m'aider à le retrouver ?"
"0x27344ff4" = "Merci d'avoir tout rapporté à temps. Le gouverneur sera ravi. Le banquet est prêt à commencer tout de suite !"
