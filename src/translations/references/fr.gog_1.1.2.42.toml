"0xe6490f96" = "Nous sommes en 1676, dans la ville hollandaise des îles Turk. La Hollande possède déjà sept villes, cinq sont des villes coloniales, une abrite un gouverneur et la dernière un vice-roi.<n><n>L'Angleterre possède 14 villes et est en guerre avec la Hollande depuis longtemps. La guerre va perdurer encore plusieurs mois. Tant que dure la guerre, vous devez capturer des villes à la couronne anglaise au nom de la Hollande.<n><n>Mais avant d'attaquer des villes anglaises, il vous faudra plus d'argent et plus d'armes. Votre premier objectif consiste à vaincre trois convois marchands anglais et à capturer leurs navires.<n><n>Tout d'abord, vous devez obtenir une Lettre de marque du gouverneur hollandais des îles Turk.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Allez voir le gouverneur des îles Turk et obtenez une Lettre de marque contre l'Angleterre."
"0xe64f1385" = "Très bien ! Vous avez détruit un des convois de pirate de Barbe Noire. Allez maintenant voir le gouverneur de @T$TOWN$ et obtenez votre récompense.<n><n>Il a une nouvelle mission pour vous.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplissez une autre mission pour le gouverneur de @T$TOWN$."
"0xe65025c3" = "dans 1 ville"
"0xe6510ae7" = "Vous devez monter vos réserves de blé, de coton, de sucre et de tabac à @a$Amount$ chacun avant le @D$EndDate$."
"0xe65524e7" = "Assurez-vous que votre ville dispose de @a$Amount$ de toutes les marchandises."
"0xe674b971" = "Carte au trésor"
"0xe67d58b9" = "Or découvert"
"0xe6851da5" = "Dans le dernier scénario, vous avez appris que votre statut dépend directement de vos actifs. Vos actifs ne se limitent pas à votre trésorerie, mais comprennent également vos bâtiments, vos navires et vos marchandises. Vous pouvez voir vos actifs actuels à tout moment sous \"Victoires\" dans le journal.<n><n>Vous pouvez également regarder la jauge bleue qui représente votre expérience, toujours affichée en bas de l'écran dans la fenêtre des convois. Quand la jauge se remplit jusqu'au bout, vous passez au statut suivant. Vous ne pouvez pas perdre votre statut lorsque vous l'avez atteint.<n><n>Plus votre statut est élevé, plus vous pouvez commander de convois. En conséquence, vous pourrez également par la suite construire des bâtiments dans un plus grand nombre de villes. Lorsque vous atteignez un statut très élevé, vous pouvez avoir autant de convois et de permis de construire que vous le souhaitez."
"0xe6d65f53" = "Habitants"
"0xe6d9252d" = "%1, ainsi vous êtes le %2 dont mon père me parle tant. Je suis %3. Vous voulez bien me raconter un peu vos aventures ?"
"0xe6d9252e" = "Je crois avoir déjà entendu parler de vous, %1. Je suis %3, la fille du gouverneur. J'ai toujours voulu rencontrer un %2. Venez, parlez-moi de vos aventures !"
"0xe6d9252f" = "Ainsi, vous êtes le célèbre %1 ! Je vous aurais cru plus grand, à en croire les histoires que j'ai entendues sur vous. Mais cela ne vous rend pas moins intéressant ! Venez et parlez-moi de vos aventures ! Mon père, le gouverneur, m'a déjà tellement parlé de vous."
"0xe6d92530" = "%1,<n>je suis heureuse de vous revoir. Dites-moi comment vous allez depuis notre dernière rencontre. Avez-vous ramené un cadeau pour moi ?"
"0xe6d92531" = "%1,<n>c'est un plaisir de vous revoir. Je n'ai pas cessé de penser à vous depuis notre dernière rencontre. Venez vite, j'ai beaucoup à vous dire."
"0xe6d92532" = "%1,<n>je suis très heureuse que vous soyez revenu me voir. J'ai parlé à mes amies de vos aventures, vous devez absolument m'en dire plus, elles sont impatientes que je leur en dise plus. Venez vite."
