"0x1666a42e" = "Je suis heureux de vous voir, %1."
"0x166c0813" = "%1,<n>c'est bien vous ? Je vous ai à peine reconnu. Je comprends que vos aventures vous prennent du temps, mais vous devriez quand même passer plus souvent me voir."
