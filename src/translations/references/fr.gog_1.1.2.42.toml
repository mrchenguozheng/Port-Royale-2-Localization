"0xf214f69c" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Vous avez sauvé un naufragé originaire de @n$DestNation$. @N$Name$ vous propose une importante récompense si vous le ramenez à terre non loin d'une ville appartenant à sa nation."
"0xf214f69d" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Vous avez sauvé le marchand @N$Name$ de @T$DestTown$. Il vous promet une importante récompense si vous le ramenez dans sa ville d'origine."
"0xf214f69e" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Vous avez sauvé le célèbre capitaine @N$Name$. Il demande que vous le déposiez à terre non loin d'une ville appartenant à @n$DestNation$."
"0xf214f69f" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Vous avez trouvé @I$Sailors$ marins naufragés dont certains sont bien connus de l'équipage. Le moral de l'équipage en est fortement conforté."
"0xf214f6a0" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Vous avez sauvé un marin originaire de @n$Nation$. Pour vous remercier, il vous indique où trouver plusieurs tonneaux de marchandises précieuses. @l$DebrisPos$"
"0xf214f6a1" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Vous avez sauvé un prêtre venant de @n$DestNation$. Il ne peut pas vous payer pour l'amener à une ville appartenant à sa nation, mais il promet d'intervenir pour améliorer votre réputation envers @n$DestNation$."
"0xf22583c4" = "Voulez-vous acheter une Lettre de marque pour %1 et chasser les navires de notre ennemi au nom de la Hollande ?"
"0xf22a4fad" = "%1 est infestée par les rats. La consommation de blé, de fruits, de maïs et de viande sera doublée pendant un mois."
"0xf22b236f" = "Vous n'avez pas livré à temps les marchandises."
"0xf22d73b9" = "Il vous faut des outils pour produire des marchandises coloniales. Et il vous faut des matières premières pour produire des produits finis. Parmi les produits finis, on trouve par exemple des vêtements et des cordes. Les matières premières pour les produire sont le chanvre et le coton.<n><n>Maintenant que vous savez construire des centres de production, vous devriez acheter un permis de construire dans une ville principale, car ce sont elles qui produisent les produits finis. Mais avant de pouvoir acheter un permis de construire, vous devez avoir une bonne réputation commerciale avec la ville. En clair, vous devez y vendre des marchandises dont elle a besoin.<n><n>Mais attention, si vous achetez des marchandises dont la ville manque, cela aura un impact négatif sur votre réputation commerciale avec la ville ! Les marchandises dont manque la ville sont indiquées en rouge dans la fenêtre de commerce.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Améliorez votre réputation commerciale avec Cartagène afin de pouvoir y acheter un permis de construire."
"0xf24b293b" = "Charger/Sauvegarder"
"0xf253afcd" = "Vous ne pouvez emprunter une route commerciale que si votre capitaine a %1 points d'expérience. Il a %2 points actuellement."
"0xf2590753" = "Merci. Il semble que nous risquons de ne pas recevoir de nombreuses marchandises en provenance d'Europe dans un proche avenir. Comme nous sommes en guerre avec @n$HostileNation$, nous avons la possibilité de piller les marchandises transportées par les convois de l'ennemi, sans capturer ni couler leurs navires.<n>Trouvez-moi @a$Amount$ d'épices, de vin et d'outils, et livrez-les à mon marchand, au marché, d'ici le @D$EndDate$."
"0xf2590754" = "Votre mission consiste à attaquer et à piller les convois de marchandises appartenant à @n$HostileNation$, sans capture ni couler les navires. Vous devez ramener les marchandises au marché, avant le @D$EndDate$."
"0xf2590755" = "Qu'il en soit ainsi. Partez à la recherche des convois de marchandises appartenant à @n$HostileNation$ et pillez @a$Amount$ de marchandises importées à bord. Vous avez jusqu'au @D$EndDate$ pour livrer les marchandises à un marchand, qui vous attendra au marché. Un conseil : la situation est très tendue, contentez-vous donc de piller les navires. Ne les capturez pas et ne les coulez pas !"
