"0x061848e4" = "Vous avez saboté la ville de @T$TargetTown$ et je vous en remercie au nom de ma nation. J'ai une récompense très spéciale pour vous. J'ai en effet persuadé un capitaine très expérimenté de se joindre à vous. Il s'agit de @N$CaptainName$ et vous le trouverez à l'auberge."
"0x061b50a1" = "Voulez-vous acheter une Lettre de marque pour %1 et chasser les navires de notre ennemi au nom de la France ?"
"0x0625c88f" = "Nations"
"0x062a6d44" = "Excellent ! Le convoi est parti de @T$HostileTown$ en direction de l'Europe et quittera les Caraïbes par l'est. Surveillez la route et ramenez-moi les documents avant le @D$EndDate$."
"0x062a6d45" = "Votre aide me sera utile ! Si tout se passe comme prévu, le chef de bord va jeter les journaux par dessus bord, l'un après l'autre. Le navire est parti de @T$HostileTown$, en destination de l'Europe. Suivez sa piste et trouvez les journaux. Ramenez-les moi avant le @D$EndDate$."
"0x062a6d46" = "Excellent. Le navire a déjà quitté le port de @T$HostileTown$ pour l'Europe. Mais il y a un passager à bord qui me doit un service. Il fouillera le navire et jettera les documents à la mer, l'un après l'autre. Votre mission consiste à les retrouver et à me les ramener avant le @D$EndDate$."
