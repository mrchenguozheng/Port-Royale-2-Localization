"0xd06e1e7e" = "Quitter la ville"
"0xd07dbe34" = "Les facteurs les plus importants qui influent sur la qualité de vie dans une ville sont le ravitaillement et l'éventail de marchandises disponibles. Vous n'avez toutefois pas à ravitailler votre ville de toutes sortes de marchandises pour garder les habitants heureux.<n><n>Les marchandises dans une ville peuvent être classées dans cinq groupes : les marchandises essentielles, les matières premières, les produits finis, les marchandises coloniales et les marchandises importées. Elles sont présentées dans le même ordre dans la fenêtre de Commerce. Il suffit d'entreposer suffisamment de 2 à 3 marchandises de chaque groupe pour améliorer la qualité de vie dans la ville. <n><n>Vous venez de recevoir un message sur le sujet. Vous pouvez le lire dans le journal.<n><n>Comme votre ville est encore petite, il est assez facile d'obtenir une bonne qualité de vie, car les citoyens n'en attendent pas trop. Cela signifie que vous ne devriez pas avoir trop de problèmes à atteindre votre objectif. Toutefois, une ville de moins de 2000 habitants ne peut pas se développer plus qu'au niveau “boum”.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif du scénario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Assurez-vous que vous avez cinq tonneaux de chaque marchandise dans la ville."
