"0x004b9030" = "Vous savez déjà que seuls les navires d'escorte participent aux combats navals. Les navires marchands du vaincu tombent toujours entre les mains du vainqueur, qui peut alors choisir de les piller ou de les capturer.<n><n>Vous n'êtes pas toujours celui qui initie le combat. Si l'un de vos convois est attaqué par des pirates ou un convoi militaire appartenant à une nation qui vous considère comme un pirate, vous pouvez choisir de combattre ou de fuir. Si vous essayez de fuir, vos navires d'escorte doivent empêcher l'ennemi de s'approcher trop près de vos navires marchands.<n><n>S'ils échouent, les navires d'escorte sont capturés et les navires marchands pillés. Si un convoi ne compte aucun navire de guerre, tout ce qu'il peut faire, c'est tenter de fuir. Avantage : les navires marchands ne sont jamais capturés, seulement pillés.<n><n>Allez rendre visite au gouverneur. Il a une nouvelle mission pour vous. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplissez la mission qui vous est confiée par le gouverneur."
