"0x2ee8bb8c" = "Nous sommes dans la ville principale de Carthagène, dans le sud des Caraïbes.<n>Vous pouvez entrer dans les différents bâtiments de la ville et y entreprendre des actions, mais nous en reparlerons.<n>Commencez par regarder en haut de l'écran. Vous y voyez plusieurs boutons et fenêtres.<n>Cliquez sur le bouton avec l'horloge, complètement à gauche."
"0x2ee8bb8d" = "Il s'agit des Chroniques. Vous y trouverez un journal de tous les événements qui se produisent dans les Caraïbes, un peu comme dans un quotidien.<n>Sur la droite de la fenêtre Chroniques, vous pouvez voir des boutons. Il permettent de voir des informations sur les Caraïbes. Mais nous le verrons plus tard.<n>Fermez la fenêtre en cliquant sur le bouton \"X\"."
"0x2ee8bb8e" = "En haut de l'écran, sous la date, vous trouverez le bouton Journal et à côté, la somme dont vous disposez.<n>Le Journal vous informe de tout ce qui a trait à vos succès et possessions. De plus, tous les messages et informations sur vos missions y sont consignés.<n>Ouvrez le Journal. "
"0x2ee8bb8f" = "Comme vous pouvez le voir, le Journal vous présente tous les messages que vous avez déjà reçus. Pour l'instant, il ne s'agit que des instructions pour le scénario.<n>Il y a d'autres boutons sur la droite de la fenêtre Journal. Cliquez sur le troisième. "
"0x2ee8bb90" = "Cette fenêtre vous présente les tâches et missions qui vous ont été confiées. Pour l'instant, vous n'y voyez que l'Objectif.<n>Les deux boutons tout en haut de la fenêtre Mission vous permettent d'afficher les missions en cours et les missions terminées.<n>Fermez le Journal. Il suffit d'appuyer sur le bouton droit de la souris."
"0x2ee8bb91" = "Au cours de la partie, vous pourrez accepter de nombreuses missions pour la gloire ou la fortune.<n>Commençons par regarder la ville. Vous pouvez voir dans la fenêtre en haut et au centre de l'écran que nous sommes à Carthagène. La ville compte environ 2000 habitants.<n>Cliquez sur le bouton qui indique le nom de la ville."
"0x2ee8bb92" = "Une fenêtre s'affiche et présente des informations sur la ville.<n>Carthagène est une ville principale (elle abrite un gouverneur) et elle appartient à l'Espagne. Vous pouvez également y voir le statut de la ville et les marchandises qu'elle produit.<n>Entrez dans un bâtiment. Pour cela, fermez la fenêtre d'informations sur la ville."
"0x2ee8bb93" = "Vous pouvez vous promener dans la ville en utilisant les touches Flèches du clavier. Allez voir le centre de la ville, à l'intérieur de ses murs. Vous y voyez des bâtiments, comme les docks, l'église et le palais du gouverneur.<n>Cliquez une fois sur un de ces bâtiments."
"0x2ee8bb94" = "La fenêtre en bas et au centre de l'écran change quand vous cliquez sur un bâtiment. Selon son type, vous verrez des informations ou vous pourrez agir.<n>Des boutons sont à droite de la fenêtre Bâtiment. Pour sortir du bâtiment, cliquez sur le bouton \"X\"."
"0x2ee8bb95" = "Les bâtiments dans lesquels vous pouvez faire des choses sont toujours situés dans l'enceinte d'une ville. La seule exception, ce sont vos entrepôts, mais nous en reparlerons dans le prochain scénario.<n>Quittez le bâtiment et utilisez les Flèches pour voir le port et le convoi nommé “Santa Maria”. Cliquez dessus."
"0x2ee8bbfd" = "Vous voyez maintenant des informations sur votre convoi en bas et au centre de l'écran.<n>Le convoi est déjà chargé : 10 tonneaux de blé et 15 de maïs.<n>Il y a plusieurs boutons sur la droite de la fenêtre. Cliquez sur le deuxième (celui avec un navire)."
"0x2ee8bbfe" = "Cela vous indique le nombre de navires qui composent le convoi. Un convoi peut compter jusqu'à 10 navires, commandés par un capitaine.<n>Nous allons envoyer le convoi dans une autre ville.<n>Cliquez sur le bouton avec une flèche en haut à droite de l'écran, pour quitter la ville et voir la carte maritime."
"0x2ee8bbff" = "La carte maritime s'est ouverte. Au centre de l'écran, vous pouvez voir la ville de Carthagène.<n>Vous pouvez utiliser les touches Flèches pour voir une autre région de la carte.<n>Cherchez la ville de Port Royale, sur une île vers le nord, et cliquez sur la ville avec le bouton droit de la souris, votre convoi étant sélectionné."
"0x2ee8bc00" = "Une route est définie et votre convoi lève l'ancre.<n>En cliquant avec le bouton droit sur Port Royale, vous avez sélectionné la ville comme destination du convoi.<n>Si le convoi met trop longtemps pour rejoindre la ville, vous pouvez accélérer la vitesse du jeu en appuyant sur la barre d'espace (par défaut)."
"0x2ef566b4" = "Clavier"
"0x2ef8f665" = "Bienvenue à %1,<n><n>Je souhaitais vous donner quelques conseils pour vous aider à vous familiariser avec la région de %2 le plus rapidement possible, afin que vous puissiez aider ma nation à développer nos villes.<n>Je suis certain que vous connaissez déjà la plupart des choses à savoir sur les villes de gouverneur : elles doivent en permanence disposer de marchandises coloniales à exporter vers l'Europe. De plus, ces villes proposent généralement des biens de luxe, qui peuvent être revendues avec une marge importante dans d'autres villes.<n>Une dernière chose : vous serez sans doute intéressé de savoir que les gouverneurs peuvent confier des missions de temps en temps. Vous ne pourrez toutefois pas accepter de missions tant que vous n'aurez pas atteint au moins le grade de Mousse.<n><n>%3 %4, Gouverneur de %5."
"0x2efebfdd" = "Comme votre convoi est arrivé à Port Royale, vous pouvez maintenant entrer dans la ville. Cliquez sur le symbole de la ville (les petites maisons)."
"0x2efebfde" = "Vous voyez à nouveau la vue de la ville, mais cette fois, vous êtes à Port Royale. Vous pouvez vous déplacer dans toutes les villes où vous avez des bâtiments ou des convois.<n>Cherchez le chantier naval du port et cliquez dessus, pour acheter un nouveau navire."
"0x2efebfdf" = "Le chantier naval est affiché dans la fenêtre de sélection, là où était le convoi.<n>Faites un tour du chantier naval en cliquant sur les boutons à droite de la fenêtre.<n>Revenez à la fenêtre \"Acheter un navire\" et regardez quels navires sont proposés.<n>Achetez celui qui vous plaît."
"0x2efebfe0" = "Félicitations ! Vous avez acheté votre premier navire. <n>Il sera livré dans le port de la ville.<n>Quittez le chantier naval et cliquez sur les eaux du port. La fenêtre de sélection présente les navires du port individuellement.<n>Cliquez sur le nouveau navire."
"0x2efebfe1" = "Vous pouvez maintenant voir des informations sur le navire, les mêmes que celles présentées dans le chantier naval.<n>Avant que vous puissiez faire quelque chose de ce navire, vous devez l'ajouter dans un convoi.<n>Pour cela, sélectionnez votre convoi."
"0x2efebfe2" = "Le convoi doit interagir avec le port.<n>Cliquez avec le bouton droit de la souris sur le port.  "
"0x2efebfe3" = "Une fenêtre de Transfert s'affiche, qui permet d'ajouter des navires au convoi.<n>Il suffit de cliquer sur un navire à gauche et de l'amener sur le convoi.<n>Fermez alors la fenêtre de Transfert en cliquant sur le bouton \"X\"."
"0x2efebfe4" = "Vous pouvez également créer un nouveau convoi en y ajoutant le nouveau navire et en recrutant un capitaine à l'auberge.<n>Cela n'est toutefois pas possible pour l'instant, car votre statut n'est pas assez élevé.<n>Cliquez sur le deuxième bouton, pour afficher la liste des navires du convoi."
"0x2efebfe5" = "Vous avez maintenant un convoi de deux navires dans le port de Port Royale.<n>Vous pouvez cliquer sur les navires dans la liste des navires du convoi pour afficher des détails sur chacun d'eux.<n>Renvoyez le convoi à Carthagène. Pour cela, affichez la carte maritime en cliquant sur le bouton avec une flèche tout en haut à droite de l'écran. "
"0x2efebfe6" = "Trouvez la ville de Carthagène, au sud, et envoyez-y votre convoi en cliquant sur la ville avec le bouton droit de la souris.<n>Ce scénario sera terminé dès que le convoi arrivera à la ville."
"0x2f0127e1" = "Vous avez passé une très agréable journée avec %1 et vous lui avez raconté vos aventures."
"0x2f0127e2" = "Vous avez passé un très agréable après-midi avec %1 et vous oubliez vos affaires pendant quelques temps."
