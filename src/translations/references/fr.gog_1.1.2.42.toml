"0xc557fe31" = "La peste s'est déclarée à %1. La qualité de vie a chuté et la demande de bois et de garnitures sera doublée pendant un mois. Tant que la peste perdure, des citoyens vont mourir tous les jours et les marchands refuseront de venir dans la ville."
"0xc558e134" = "Si vous voulez voir autant de marchands venir dans votre ville que possible, vous devriez ne pas ravitailler du tout la ville avec certaines marchandises. Choisissez dans l'idéal des marchandises produites par les villes proches, car les marchands prennent la distance en considération.<n><n>Les marchands qui visitent la ville achètent automatiquement les marchandises en abondance (et dont le prix est bas). Vous pouvez également vendre directement les marchandises produites par la ville. Tant que ces marchandises ne sont pas plus chères que celles des autres villes, elles seront régulièrement achetées par des marchands.<n><n>L'avantage, c'est qu'il y aura toujours des marchandises pour vos citoyens et que vous n'aurez pas à transporter vous-même les marchandises dans d'autres villes."
