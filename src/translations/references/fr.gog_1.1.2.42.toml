"0x03f2ddbd" = " @A$USER$, venez et asseyez-vous, j'ai des choses à vous dire.<n>J'essaye d'acheter @G$Goods$ pour @n$HostileNation$. Comme vous le savez, @n$Nation$ et @n$HostileNation$ sont en guerre. En fait, c'est un crime pour @n$HostileNation$ d'importer @G$Goods$ venant de @n$Nation$, et donc les prix sont en conséquence du risque. Je voulais savoir si vous seriez intéressé par un peu de contrebande ?"
"0x03f2ddbe" = " @A$USER$, seriez-vous intéressé par un peu de contrebande? Je suis le représentant de @T$TargetTown$. A cause de la guerre, aucune marchandise provenant des villes de @n$Nation$ ne peut être importée à @T$TargetTown$. L'homme qui m'envoie recherche ceci : @G$Goods$. Il vous paiera @g$Price$ pour chaque tonneau que vous lui livrerez. Qu'en pensez-vous ?"
"0x03fb5c67" = "En raison de vos mauvaises relations avec %1, %3 de vos entreprises de %2 ont été saisies aujourd'hui."
"0x03fb5c68" = "<n>Je vous conseille d'aller rencontrer un de mes gouverneurs, dans le but d'améliorer vos relations avec ma nation."
"0x03fb5c69" = "<n>Je vous conseille vivement de venir me rencontrer, que nous discutions de vos relations avec ma nation."
"0x03fb5c6a" = "<n><n>%1, vice-roi de %2"
"0x04081363" = "Un de mes rivaux, citoyen de @n$HostileNation$, a dérobé mes journaux et veut les envoyer en Europe. Il est essentiel qu'il n'y parvienne pas. Heureusement, j'ai graissé la patte du second du navire qui transporte les documents vers l'Europe. Mais j'ai besoin de votre aide."
"0x04081364" = "Nous sommes espionnés par @n$HostileNation$ depuis un certain temps. J'ai découvert que toutes les informations nous concernant sont sur le point d'être expédiées vers l'Europe depuis @T$HostileTown$. Je veux que vous m'aidiez à m'assurer que ces documents ne quitteront jamais les Caraïbes."
"0x040bf5f1" = "Soumettre une partie"
"0x04100fa0" = "%1: Attaque de pirates"
"0x0420c2a2" = "<ts:20>Vous savez déjà acheter et vendre des marchandises dans la fenêtre Commerce. Voici d'autres conseils :<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Le prix indiqué sur les flèches ne change pas<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Peu importe que vous achetiez 10 fois 1 unité de marchandise ou 1 fois 10 unités, le prix total sera le même.<n><n><g:INTEXT_AUSRUF_800x600.screen>Un prix est toujours indiqué, même si la marchandise n'est pas disponible. Le prix est toujours indiqué à l'unité, peu importe le nombre d'unités à vendre ou à acheter.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Vous pouvez également commercer en cliquant sur l'icône d'une marchandise. Dans ce cas, une petite fenêtre avec une barre s'affiche. Déplacez le marqueur sur la barre pour indiquer combien de marchandises acheter ou vendre. Le prix individuel et le prix total sont immédiatement affichés."
"0x0424bb9a" = "Chroniques"
"0x0436c531" = "Vous avez trouvé un navire spécial !<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Un navire à vapeur<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>Vous n'avez jamais vu un tel navire de toute votre vie ! Il semble que ce navire ne soit pas propulsé que par les voiles de ses deux mâts, mais aussi par un étrange mécanisme qui utilise la vapeur pour alimenter deux roues à aubes. Cela permet au navire d'avancer même s'il n'y a pas un souffle de vent."
"0x044bc6d2" = "Votre capitaine a gagné son duel à l'épée contre %1. Vos hommes se mettent à la recherche du trésor des pirates et trouvent %2.<n><n>Vous avez détruit le repaire et mis fin au règne du pirate %3."
"0x044bc6d3" = "Votre capitaine a gagné son duel à l'épée contre %1. Vos hommes se mettent à la recherche du trésor des pirates et trouvent %2. Bien que vous ayez éliminé le repaire et le danger qu'il représentait, il est évident que vous n'avez pas détruit tous les navires. Les survivants sont à la recherche d'un nouveau repaire."
"0x044e52eb" = "Scénarios"
"0x045d87c5" = "Vous devez gagner @g$GoldGoal$ en commerçant."
