"0x0480889b" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Vous avez trouvé une énorme cache de marchandises à l'endroit que le naufragé vous avait indiqué, et vous emPinassez les marchandises à bord."
"0x0480889c" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Vous avez trouvé une énorme cache de marchandises à l'endroit que le naufragé vous avait indiqué.<n>Malheureusement votre convoi n'a pas assez de place pour l'emPinasser, vous êtes donc obligé de laisser sur place les marchandises pour l'instant."
"0x04825ba0" = "Le convoi ne peut pas prendre la mer parce qu'il est dans le chantier naval pour réparation. Attendez que les réparations soient terminées."
"0x04b51123" = "Désolé, j'ai bien peur de ne plus pouvoir vous donner cette mission. Vous avez réfléchi trop longtemps."
"0x04d40792" = "Coût de production actuel"
"0x04ddc375" = "%1 vous attend à l'auberge."
"0x04e000d9" = "Capitaine %1 a remplacé le précédent capitaine."
"0x04e4fc22" = "Ville - Entrepôt commerce"
"0x04e5002a" = "Une grève des ouvriers a commencé à Tortuga. Tous les ouvriers ont arrêté le travail (mais ils continuent à coûter de l'argent à vos entreprises).<n><n>Votre tâche est de maintenir l'approvisionnement des marchandises qu'ils sont censés produire normalement, afin que la grève échoue et que les ouvriers reprennent le travail.<n><n>Note : La ville produit du blé, des briques, du coton, du sucre et du tabac. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Les stocks de marchandises produites par la ville doivent être portés à @a$Amount$ pour chacun d'entre eux avant le @D$EndDate$."
"0x04f319ed" = "Allez au marché de @T$Town$ avant 30 jours pour y trouver votre récompense."
