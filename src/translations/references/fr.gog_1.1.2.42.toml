"0xdb126f49" = "Vos points<n>"
"0xdb170d26" = "Avant que le gouverneur vous confie une nouvelle mission, assurez-vous que le convoi est en état de naviguer !<n>Si le convoi est endommagé, allez au chantier naval et réparez-le."
"0xdb170d27" = "Vous venez de recevoir de l'argent pour vous aider à équiper votre convoi.<n>Votre convoi doit maintenant compter trois navires armés et leurs équipages au complet.<n>N'oubliez pas les munitions et de définir les nouveaux navires comme des navires de guerre."
"0xdb170d28" = "Excellent !<n>Allez voir le gouverneur et accomplissez la mission qu'il vous confie."
"0xdb2ae26e" = "Refuser"
"0xdb2d1177" = "Vous allez lancer un raid contre un repaire de pirate.<n>Assurez-vous que votre convoi est en état de naviguer !<n>Vous pouvez également vous rendre dans d'autres villes principales pour voir si d'autres gros navires sont disponibles dans un chantier naval.<n>En chemin, allez voir le gouverneur et obtenez des informations sur le repaire du pirate."
"0xdb2d1178" = "Les combats contre des ports sont identiques aux combats navals, à cette différence que vous affrontez des tours résistantes et immobiles et pas d'autres navires.<n>Pour gagner une bataille contre un port, vous devez détruire toutes les tours.<n>Il y a parfois des navires de guerre dans le port. Dans ce cas, vous devez combattre les navires avant d'attaquer le port."
"0xdb2d1179" = "Pour terminer le scénario, retournez à Carthagène avec votre convoi."
"0xdb4287ac" = "Le gouverneur de Carthagène pense que vous avez beaucoup de potentiel et vous accorde une subvention de @g$Gold$.<n><n>Conseil :<n>achetez des marchandises qui sont disponibles en nombre dans la ville (la quantité ne doit pas être indiquée en rouge). Allez ensuite vendre ces marchandises dans une ville qui manque de ces marchandises pour en obtenir un bon prix.<n><n>Vous augmenterez ainsi rapidement vos finances."
