"0xe1cdc367" = "Vous avez appris certains des contrôles élémentaires du jeu et vous savez envoyer un convoi d'une ville vers une autre. C'est un élément très important, puisque vous commencerez par gagner votre vie en transportant et en faisant le commerce de marchandises entre les villes.<n><n>Dans la deuxième partie du scénario, vous achèterez un navire et vous l'ajouterez à votre convoi.<n><n>Voici un conseil supplémentaire :<n><n>Vous pouvez appuyer à tout moment sur la touche F1 pour afficher une page d'aide, qui présente les contrôles clavier et souris.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Votre convoi de deux navires doit rejoindre le port de Carthagène."
