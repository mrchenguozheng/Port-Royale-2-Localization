"0xf9279095" = "Pour un festin modeste vous avez besoin de %1 de chacune de ces marchandises : blé, fruits, viande, rhum et vin."
"0xf9279096" = "Pour un festin moyen vous avez besoin de %1 de chacune de ces marchandises : blé, fruits, viande, rhum et vin."
"0xf9279097" = "Pour un festin majestueux vous avez besoin de %1 de chacune de ces marchandises : blé, fruits, viande, rhum et vin."
"0xf92c7177" = "Prier"
"0xf92d7da5" = "%1%"
"0xf932eef8" = "Félicitations ! Vous avez terminé avec succès ce scénario et savez désormais comment développer votre ville.<n><n>En mode de jeu libre, le vice-roi de toute nation peut vous offrir votre propre ville. Mais cela ne sera pas facile à obtenir, car vous devrez toujours capturer des villes pour avoir droit à des terres, et cela nuira forcément à votre réputation avec les autres nations. <n><n>Tout ce que vous avez appris lors de ce scénario sur le développement de votre ville vous aidera à développer vos entreprises dans d'autres villes également. La principale différence, c'est que vous n'avez pas à les défendre."
"0xf934d153" = "(pas d'effet)"
"0xf93abe1a" = "Améliorez votre réputation avec l'Espagne pour devenir \"ami\"."
"0xf93ea2aa" = "Un bout de terre"
"0xf9404c18" = "Je peux signaler la position approximative de son convoi sur la carte. @l$ConvoyPos$ A vous de voir si vous allez couler le convoi ou pas. Mais vous devez terminer la mission avant le @D$EndDate$."
"0xf9404c19" = "J'ai peur de ne pas pouvoir vous dire où trouver un des convois de Barbe Noire, car ils sont pour l'instant bien cachés. Mais je vous laisse largement le temps de les trouver. Vous avez jusqu'au @D$EndDate$ pour détruire un convoi."
"0xf9462f72" = "Votre commerce à Santa Marta doit disposer du nombre maximal d'ouvriers."
"0xf94c02c2" = "Pour le prêt de %1 que vous m'avez accordé, vous toucherez la somme de %3 le %2."
"0xf957684a" = "Recommandée"
"0xf972b675" = "Naufragé"
"0xf9873e04" = "<n>Pour que les choses soient plus officielles, je vous donne une Lettre de Marque visant @n$HostileNation$."
"0xf994c398" = "%1 détruit."
"0xf99f8b20" = "Rencontre"
"0xf9a5a4d7" = "Vous n'êtes pas spécialement en bons termes avec ma nation. Voulez-vous améliorer votre réputation en payant %1 à ma nation comme preuve de bonne volonté ?"
"0xf9aca27a" = "Missions"
"0xf9b2188b" = "Une bouteille"
"0xf9d3c192" = "Votre relation avec %1"
"0xf9f6b6b0" = "Le capitaine du convoi est sur le navire ennemi. Il propose à votre capitaine de décider de l'issue de la bataille au cours d'un duel.<n><n>Pour protéger les marins, votre capitaine accepte le défi."
"0xf9face8c" = "Carte suivante"
"0xfa06dd38" = "Le pirate %1 a vaincu votre capitaine au cours d'un duel loyal. Noblemment, le capitaine accepte le résultat et ordonne la retraite."
"0xfa0b6d1f" = "Scénario terminé"
"0xfa2428fd" = "%1  (%2)"
"0xfa282fbe" = "Bilan"
"0xfa463de9" = "Vous avez reçu un indice.<n><n>"
"0xfa69f3c3" = "Chasseur de primes"
"0xfa69f551" = "Sélectionnez une fonction dans la liste pour changer la configuration du clavier."
"0xfa6f79db" = "Détruisez @I$NumConvoys$ convois militaires envoyés par @n$TargetNation$ avant le @D$EndDate$."
"0xfa80a0c0" = "Le boucanier %1, %2, a déclenché une infestation de rats dans la ville. La consommation de blé, de fruits, de maïs et de viande sera deux fois plus élevée pendant un mois."
"0xfaa1f6b4" = "Min."
"0xfaa28418" = "Fortune"
"0xfab539b0" = "Je vous remercie d'avoir nettoyé ce repaire de pirate. J'espère que vous y avez trouvé assez d'or pour rembourser vos frais. Toutes les nations vous sont reconnaissantes."
"0xfab62a0a" = "Je n'ai aucune autre nouvelle pour vous. Revenez me voir une prochaine fois."
"0xfabae878" = "<g:INTEXT_SPANIEN_800x600.screen>"
"0xfac6c05b" = "Salutations ! Le convoi est en route et bientôt nous ferons trembler les marchands ! Revenez plus tard et vous aurez votre première part."
"0xfac6c05c" = "Bonne journée, mais j'ai peur que vous arriviez trop tôt ! Je n'ai pas de butin pour vous. Soyez patient encore quelques jours !"
"0xfac6c05d" = "Bonjour, %1. J'ai votre part ici. Cette fois, vous avez droit à %2 !"
"0xfad1c2f1" = "Navires"
"0xfad1c30b" = "Type de navire :"
"0xfad8c431" = "Scénario terminé"
"0xfae54e55" = "Vous avez découvert le coffre de @N$ContactName$.<n><n>"
"0xfae663d9" = "%1 (il y a %2 jours)"
"0xfaf356b7" = "%1-%2-%3"
"0xfaf87ec1" = "Docks"
"0xfaf8f3b3" = "Un marchand local est prêt à vous vendre son commerce et tous les champs pour un prix de %1."
"0xfafd13c9" = "Informations ON"
"0xfb08e668" = "Duel perdu"
"0xfb0d31c7" = "Bâtiments résidentiels"
"0xfb203dad" = "Position de l'épave"
"0xfb343dde" = "Alors que vous pillez la ville, une jeune femme arrive droit sur vous.<n>\"Je sais que c'est mon père qui est à l'origine de cette attaque ! Vous a-t-il dit que je suis ici de mon plein gré et que j'aime profondément cet homme ? Je vous supplie de ne pas me ramener. Je vous donnerai une récompense !\".<n><n>Allez-vous laisser la fille du gouverneur vivre sa vie à @T$TargetTown$ ?"
"0xfb343ddf" = "La fille du gouverneur vous remercie et vous donne une carte qui indique l'emplacement d'une cache contenant pour @a$Amount$ de marchandises."
"0xfb3648b2" = "Route commerciale active"
"0xfb399b9a" = "Un marchand local est prêt à vous céder la zone résidentielle au prix suivant : %1."
"0xfb3f51e3" = "+++EMPTY+++"
"0xfb3ffb48" = "Je voulais vous remercier une fois encore de m'avoir généreusement offert un de vos convois. Il est en cours d'armement et sera paré à naviguer dans %1 jours.<n><n>Si vous voulez m'offrir un autre convoi, vous devrez attendre que ce délai soit écoulé."
"0xfb425369" = "Assistant de conception"
"0xfb4be839" = "Excellent ! Vous avez détruit tous les convois pirates, de sorte qu'aucun n'en réchappera. Si vous détruisez tous les convois avant d'attaquer le repaire, il faudra plus longtemps avant que de nouveaux convois pirates apparaissent dans les Caraïbes.<n><n>Attaquez maintenant le repaire de la même façon que vous attaqueriez une ville, en sélectionnant votre convoi puis en cliquant sur le repaire avec le bouton droit de la souris. Si des navires pirates sont déjà dans le port, vous devez les attaquer en premier avant d'attaquer le port.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Détruisez le repaire de Barbe Noire."
"0xfb514e13" = "Nouvelle ville"
"0xfb5c8a98" = "Blocus de @T$TOWN$"
"0xfb64ad02" = "Vous avez gagné"
"0xfbb36ec1" = "Je vous remercie une fois encore. Vous avez beaucoup fait pour ma nation. Je vous récompense en vous attribuant des terres supplémentaires, pour votre ville de %1. Vous posséderez ainsi %2% de sa superficie totale."
"0xfbb97bb9" = "Allez demander votre récompense au gouverneur"
"0xfbbba36d" = "Je n'ai rien de plus à vous dire, sinon de faire attention aux convois militaire de ma nation, car ils vous recherchent !"
"0xfbbf60a0" = "3 mâts"
"0xfbd9dc10" = "Active pour %1 jours. Profit journalier moyen %2."
"0xfbd9dc11" = "Dernière bataille navale il y a %1 jours"
"0xfbdd7fd6" = "Mar"
