"0x3641d8d1" = "Merci de m'avoir ramené mon épouse. J'ai apprécié la paix et la quiétude de ces derniers jours, mais je ne pouvais pas l'abandonner aux mains de mes ennemis. En récompense, acceptez cette carte qui indique une cache, dans laquelle vous trouverez pour @a$Amount$ en marchandises."
