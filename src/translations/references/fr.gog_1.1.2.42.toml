"0x36573a59" = "Vos troupes prennent rapidement le dessus. Soudain un drapeau blanc apparaît sur les remparts de la ville : les gardes de la ville ont capitulé !<n><n>Que voulez-vous faire maintenant ?"
"0x3657dd22" = "Ma femme est ravie que vous ayez retrouvé son chien. Prenez cette carte qui signale une cache contenant @a$Amount$ en marchandises."
"0x3657dd23" = "Quoi ? Vous avez jeté le chien à la mer ? Je vous en suis en fait très reconnaissant. Mais je ne peux pas officiellement vous récompenser, mais j'ai caché un trésor à un endroit secret, dans ma jeunesse. Voici la carte."
"0x366de173" = "Oh, merci de m'avoir ramené ma fille adorée. Voici une carte. Vous y trouverez l'endroit où j'ai caché de nombreux trésors."
"0x366de174" = "Qu'avez-vous fait ! Comment avez-vous pu laisser ma fille entre les mains de l'ennemi ? Je dirai à tous les gouverneurs de @n$Nation$ que vous n'êtes pas digne de confiance ! (Réputation avec @n$Nation$ a diminué)"
