"0xf8707567" = "Ventes :"
"0xf880e055" = " Envoyez un capitaine qui n'a pas beaucoup d'expérience en commerce."
"0xf880e056" = "  Envoyez un capitaine qui n'a pas beaucoup d'expérience du combat."
"0xf880e057" = "  Envoyez un capitaine qui n'a pas beaucoup d'expérience en navigation."
"0xf88d5e17" = "Stat. population"
"0xf88d6ee5" = "Livrez n'importe quelle cargaison de @G$Goods$ au marché de @T$TOWN$. Vous y serez payé @g$Price$ par tonneau sur-le-champ. Le @D$EndDate$, un convoi expéditionnaire va venir chercher les marchandises. Escortez le convoi jusqu'en Europe et vous toucherez @g$Price$ de plus par tonneau."
"0xf894bc2d" = "Le convoi ne peut pas prendre la mer, certains de vos navires sont en mauvais état. Faites réparer votre convoi dans le chantier naval avant de reprendre la mer. Vous pouvez faire réparer les navires endommagés et utiliser le reste du convoi pendant les réparations."
"0xf89f542f" = "Vous avez reçu <o:0xff1e1eff>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GOLD_800x600.screen>."
"0xf8af3810" = "Nous avons tout ce dont nous avons besoin ici."
"0xf8b3a303" = "L'état d'une ville peut progresser de sept niveaux, de pauvre à riche. Dans les deux niveaux les plus faibles, la qualité de vie est tellement mauvaise que des citoyens quittent régulièrement la ville. En revanche, quand la ville atteint les niveaux \"économie florissante\", \"aisée\" ou \"riche\", vos commerces bénéficient d'un bonus et la main d'oeuvre moins coûteuse. Au plus haut niveau, la ville produit même ses propres colons.<n><n>Vous trouverez plus d'informations sur les effets de chaque état de ville dans les informations de la ville. Pour les afficher, cliquez sur le nom de la ville.<n><n>Il faut deux ou trois marchandises de chaque groupe de marchandises pour assurer un bon niveau de qualité de vie dans la ville. Le ravitaillement d'une ville est satisfaisant s'il permet de subvenir aux besoins de la population pendant dix jours.<n><n>Remarque : l'état d'une ville ne s'améliore pas du jour au lendemain. Il faut du temps pour que les citoyens de la ville s'adaptent à la nouvelle situation."
"0xf8bacb9a" = "Auberge"
"0xf8cc0545" = "Marchandises vendues"
"0xf8e13932" = "Approvisionnez @T$TargetTown$ de marchandises et achetez ses surplus. Au @D$EndDate$, le statut de la ville doit atteindre le statut \"Boum\" et toutes les entreprises des marchands locaux doivent travailler au maximum de leurs capacités."
"0xf8e13933" = "Approvisionnez @T$TargetTown$ de marchandises et achetez ses surplus. Au @D$EndDate$, le statut de la ville doit être \"Economie florissante\" et toutes les entreprises des marchands locaux doivent travailler au maximum de leurs capacités."
