"0x13cc600d" = "Responsable gestion Ascaron UK"
"0x13cd046e" = "Lorsque vous capturez des villes ennemies pour un vice-roi, il vous offre des terres. Sur ces terres, vous pouvez construire une ville qui vous appartient et différents bâtiments. En d'autres termes, un vice-roi peut vous donner les moyens de devenir propriétaire de votre ville. <n>Votre prochain objectif consiste à améliorer votre réputation avec l'Espagne, car un vice-roi ne vous recevra que si vous avez une excellente réputation auprès de sa nation.<n>Vous pouvez voir votre réputation avec une nation sous le nom de la ville, par exemple. A Margarita, où vous commencez la partie, trois drapeaux sont affichés, ce qui indique que votre réputation auprès de l'Espagne est \"neutre\".<n>Vous pouvez améliorer votre réputation auprès d'une nation en accomplissant des missions pour ses gouverneurs, en chassant des pirates ou en commerçant dans ses villes, en leur vendant les marchandises dont elles ont besoin.<n>Comme l'Espagne et la France sont en guerre, vous pouvez obtenir une Lettre de marque contre la France du gouverneur de Margarita. Les Lettres de marque sont un moyen rapide d'améliorer votre réputation.<n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Améliorer votre réputation avec l'Espagne, jusqu'à \"ami\"."
"0x13d92dd7" = "%1 (%2)"
"0x13ec9ac1" = "L'une de vos actions vous empêche de parvenir à terminer le scénario.<n><n>Suivez les instructions qui sont données dans la fenêtre Evénement."
"0x1401d917" = " @s$USER$, j'ai quelques informations dont je suis sûr qu'elles valent @g$Price$ pour vous. Mon beau-frère connaît @N$TeacherName$, un capitaine à la retraite."
"0x1401d918" = "Asseyez-vous auprès de moi et servez-moi un peu de rhum, j'ai des nouvelles pour vous. Durant mon dernier voyage, j'ai rencontré @N$ContactName$. C'était un ami et un disciple du légendaire @N$TeacherName$. "
"0x1401d919" = " @s$USER$, asseyez-vous auprès de moi, je sais où vous pouvez entraîner l'un de vos capitaine. Vous rappelez-vous @N$TeacherName$ ? "
