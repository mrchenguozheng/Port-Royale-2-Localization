"0xcd01da76" = "Vous commencez la partie avec le statut de Marin dans la ville espagnole de @T$TOWN$, où vous possédez déjà un entrepôt. Vous avez également un convoi dans le port, avec deux navires armés, mais pas d'équipage.<n><n>Le premier Objectif consiste à rendre visite au gouverneur de @T$TOWN$ et d'accepter sa mission. Il a des problèmes avec l'infâme pirate Edward Teach, également connu sous le nom de Barbe Noire, et il veut que vous l'aidiez.<n><n>Important : les nations sont en paix dans ce scénario. Cela signifie que vous ne devez jamais attaquer un convoi qui appartient à une nation.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Allez voir le gouverneur de @T$TOWN$ et acceptez la mission qu'il vous confie."
