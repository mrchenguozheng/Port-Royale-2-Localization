"0xc9500bee" = "Félicitations ! Vous avez atteint votre objectif et vous avez gagné plus d'argent. Vous avez également atteint un statut supérieur.<n><n>Votre statut est toujours déterminé par vos actifs. Dans vos actifs, on retrouve non seulement l'argent dont vous disposez, mais aussi vos biens, marchandises et navires. Vous pouvez voir votre richesse à tout moment dans la section \"Victoires\" du journal. Vous y verrez également quand vous atteindrez le statut suivant.<n><n>Plus votre statut est élevé, plus vous pouvez contrôler un grand nombre de convois et plus vous pouvez établir d'entreprises dans différentes villes.<n><n>Votre statut étant plus élevé, vous pouvez créer un nouveau convoi et continuer à commercer, pour augmenter votre richesse.<n><n>Vous pouvez voir votre richesse à tout moment en plaçant le curseur sur la barre bleue qui représente votre richesse, qui est affiché sous cette fenêtre. <n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Créez un deuxième convoi et gagnez @g$GoldGoal$."
