"0x00885bdb" = "Parfait ! Vous avez maintenant votre propre ville ! Personne d'autre que vous ne pourra rien y construire. <n><n>La ville a déjà quelques bâtiments, notamment des docks, où vous pouvez commercer, et un palais. Le reste, vous devrez le construire.<n><n>Envoyez votre convoi dans cette ville. Emportez autant de bois et de briques que possible, pour construire des bâtiments.<n><n>Commencez pas construire un chantier naval, pour pouvoir réparer vos navires.<n><n>Remarque :<n> entretenir l'équipage des navires d'escorte coûte cher. Renvoyez-les, car ils ne vous serviront plus.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Allez dans votre nouvelle ville et construisez un chantier naval."
