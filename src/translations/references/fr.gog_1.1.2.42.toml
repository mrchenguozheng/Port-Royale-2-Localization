"0xe37f3b10" = "Comme les villes de ma nation n'en produisent pas assez, j'ai été contraint de m'approvisionner auprès de villes anglaises."
"0xe37f3b11" = "Comme les villes de ma nation n'en produisent pas assez, j'ai été contraint de m'approvisionner auprès de villes françaises."
"0xe37f3b12" = "Comme les villes de ma nation n'en produisent pas assez, j'ai été contraint de m'approvisionner auprès de villes hollandaises."
"0xe37f3b13" = "Comme les villes de ma nation n'en produisent pas assez, j'ai été contraint de m'approvisionner auprès de villes espagnoles."
"0xe386ebc4" = "Responsable AQ"
"0xe38814c2" = "Etat du convoi"
"0xe38974d7" = "Solde :"
"0xe3922641" = "L'aiguille de la boussole est libre et se mettra rapidement en place. Vous n'avez jamais vu une boussole aussi précise.<n>La boussole est décorée comme un bijou précieux et on peut voir sur son socle de nombreuses gravures."
"0xe3922642" = "Cette paire de boussoles tient bien en main et est très facile à utiliser. Elles semblent fabriquées en or massif et sont décorées de motifs complexes."
"0xe3922643" = "Ce sextant vous permet de vérifier votre cap même dans une mer houleuse. Certains éléments sont montés sur ressort, afin de limiter les gênes causées par les vibrations."
"0xe3922644" = "Cet instrument est une double longue vue, qui vous permet d'observer loin vers l'horizon avec les deux yeux en même temps. Il est même possible d'y adjoindre des lentilles colorées pour protéger les yeux. Une mystérieuse gravure est visible sur le flanc."
"0xe3922645" = "C'est une montre en or classique, mais vous n'en aviez jamais vu de plus petite. Sur un disque sous le verre, vous pouvez remarquer une lune qui semble tourner lentement. Il y a aussi des gravures sur l'arrière de la montre."
"0xe3922646" = "Cette lampe ressemble à une lanterne classique. Mais plusieurs miroirs ont été ajoutés, de telle sorte que le faisceau lumineux soit concentré et dirigé dans une seule direction. Un petit appareil sous l'ouverture permet également d'allumer et d'éteindre très rapidement la lampe."
"0xe3922647" = "Une règle qui peut glisser à l'intérieur d'une autre règle. Une glissière faite dans un matériau transparent y est associée. Vous pourriez utiliser cet outil pour effectuer très rapidement des calculs simples."
"0xe3922648" = "Cet étrange appareil ressemble à une flèche. Mais l'empennage est ainsi fait que lorsque vous plongez cet appareil dans l'eau, il se met à tourner sur lui-même. Un petit compteur sert à déterminer le nombre de rotations, et ainsi à estimer très rapidement et très précisément la vitesse du navire."
"0xe3922649" = "Cet instrument consiste principalement à une sorte d'hélice et d'un compteur qui affiche la vitesse de rotation de l'hélice. Quand vous placez l'hélice dans le vent, vous pouvez ainsi déterminer la direction et la vitesse du vent. Cet instrument a été fabriqué avec beaucoup de soin et il est marqué d'un étrange symbole."
"0xe392264a" = "Bien que cette corde semble avoir été exposée très longtemps à de l'eau de mer, elle a l'air pratiquement neuve. Elle est merveilleusement douce au toucher et permet de faire des noeuds très solides."
"0xe39226b2" = "Ce classeur contient de nombreuses cartes stellaires. Une grande table indique avec exactitude où et quand chaque étoile individuelle se lève ou se couche."
"0xe39226b3" = "Un disque parfaitement rond, finement gravé, qui comprend plusieurs disques plus petits. Vous pouvez vous en servir pour savoir quelle partie de la voûte céleste est visible, selon la date et l'heure.<n>Des marques sur le disque indiquent que cet instrument a été utilisé pour déterminer la position d'un navire dans une région donnée."
"0xe39226b4" = "Lorsque vous tournez une manivelle, une grande corne émet les douces tonalités d'une femme qui chante. Parfait pour des marins en mer pendant des semaines sans voir la terre."
"0xe39226b5" = "Un gros disque de verre arrondi est monté à l'extrémité d'une baguette en or. Si vous le tenez au-dessus d'une carte, les lignes les plus fines deviennent parfaitement visibles, même quand la lumière est faible."
"0xe39226b6" = "Cette petite table en métal semble fabriquée de cuivre massif. Elle est ainsi construite que son plateau reste toujours à l'horizontale, quel que soit le tangage du navire. Le cerclage métallique de la table est gravé de marques qui semblent autant de directions à suivre. Mais vous ne pouvez malheureusement pas identifier la région dans laquelle cette carte a été utilisée auparavant."
"0xe39226b7" = "Une petite boîte qui contient un étrange appareil orné, qui permet d'allumer très facilement un feu. La boîte est couverte de mystérieuses gravures."
"0xe39226b8" = "Cette ancre est plus décorative que pratique. Au mieux, elle permettrait de mouiller l'ancre avec une Pinasse.<n>Elle est toutefois très lourde pour sa taille, et elle est couverte d'étranges décorations et de lettres inconnues."
"0xe39226b9" = "Cet appareil ressemble à une lampe à pétrole à laquelle on aurait greffé un silex. Si vous tournez une petite roue, des étincelles jaillissent et permettent d'allumer une flamme, même par gros temps."
"0xe39226ba" = "Cette corne n'est pas utilisée en soufflant avec la bouche, mais en appuyant sur une sorte de pompe. Si vous appuyez assez fort, la corne sonne si fort que c'en est proprement incroyable."
"0xe39226bb" = "Cette carte est très différente de toutes les cartes maritimes que vous avez vues. Elle est très détaillée et en plusieurs couleurs. Vous n'avez malheureusement pas à identifier quelle région elle cartographie."
"0xe39bb702" = "Le convoi ne peut pas prendre la mer, il y a trop de canons à bord. Vendez-les ou déplacez-les dans l'entrepôt pour ne pas excéder le nombre maximum autorisé de canons à bord."
