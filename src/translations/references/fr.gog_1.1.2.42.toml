"0xe7ba475b" = "Combats navals"
"0xe7bffbb6" = "A Tortuga, les stocks de la ville ont été détruits par des saboteurs. Une partie des marchandises de la ville a été perdue, et donc la qualité de vie de nos citoyens a baissé de façon significative.<n><n>Votre objectif est de réapprovisionner les entrepôts de la ville le plus rapidement possible de façon à remonter son statut.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif <f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La ville doit atteindre le statut \"boum\" avant le @D$EndDate$."
