"0x080f2b29" = "<ts:20>Vous devez savoir les choses suivantes sur les marchandises :<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Il y a cinq types de marchandises : les marchandises essentielles, les matières premières, les produits finis, les marchandises coloniales et les marchandises importées<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Chaque ville peut produire cinq marchandises<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Il y a deux types de ville : les villes coloniales et les villes principales (avec un gouverneur ou un vice-roi)<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Les villes principales produisent les marchandises essentielles et les produits finis. Elles sont également régulièrement fournies en marchandises importées d'Europe. Ce sont donc les villes où vous trouverez des produits finis et des marchandises importées.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Les villes principales ont besoin de matières premières pour fabriquer les produits finis. Elles ont également besoin de marchandises coloniales, qui sont entreposées en attendant de partir pour l'Europe.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Les villes coloniales produisent des marchandises essentielles, des matières premières et des marchandises coloniales. Chaque type de marchandise coloniale ne peut être produite que dans certaines régions des Caraïbes. Ainsi, le Café n'est disponible qu'au sud et dans l'ouest des Caraïbes.<n><n>Vous devez également savoir les choses suivantes sur les prix :<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Plus la demande pour une marchandise est importante et moins il y en a dans une ville, plus le prix de la marchandise est élevé.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Meilleure est votre réputation auprès de la nation à laquelle appartient la ville, moins vous payerez cher vos marchandises.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Vous ne devriez acheter des marchandises que dans les villes où elles sont produites.<n><n>Le moyen le plus rapide pour gagner de l'argent :<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>achetez des marchandises coloniales et des matières premières dans les villes coloniales<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>vendez ces marchandises dans les villes principales et achetez-y des produits finis et des marchandises importées."
