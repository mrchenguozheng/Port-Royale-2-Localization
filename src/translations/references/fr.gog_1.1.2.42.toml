"0xea7ede96" = "Trouvez le repaire de Barbe Noire. @l$IslandPos$"
"0xea8b5027" = "Vous avez grandement affaibli ma nation, mais vous êtes également le seul qui pourrait nous sauver. Je vous offre notre amitié en échange de %1. Qu'en dites-vous ?"
"0xea92b930" = "Je suis %1. Vous voulez faire des affaires ? Si vous me donnez un convoi, je vous donnerai %2 de mon butin. Vous pouvez même choisir dans quelles eaux je dois oeuvrer. Vous pouvez me confier n'importe quel convoi qui compte au moins 5 navires."
