"0x00cde503" = "<ts:20>Vous venez pour la première fois de venir l'ennemi d'une nation. Voici quelques conseils utiles.<n>-<t>Vous ne devenez ennemi d'une nation que si vous attaquez ses convois ou ses villes<n>-<t>Vous pouvez graisser la patte des gouverneurs, pour améliorer votre réputation. Votre réputation s'améliore également tous les jours simplement parce que vos actes sont peu à peu oubliés<n>-<t>Vous ne pouvez pas vous rendre dans les ports appartenant aux nations ennemies<n>-<t>Si vous vous rendez dans une ville ennemie tout de même, vous devez y amarrer votre convoi en secret : vous pourrez entrer dans la ville, mais pas y commercer."
