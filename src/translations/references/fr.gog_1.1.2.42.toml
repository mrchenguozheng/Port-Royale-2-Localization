"0xf7c59ef9" = "Ma ville manque de @G$Goods$ à traiter. Les stocks des commerçants sont au plus bas. Pouvez-vous m'aider ?"
"0xf7c59efa" = "J'ai reçu récemment la visite de l'Association des Producteurs catholiques. Ils se plaignent que la ville manque de @G$Goods$. J'ai dû les écouter râler pendant trois heures. Je refuse de recommencer. Pouvez-vous m'aider à me sortir de cette situation délicate ?"
"0xf7c59efb" = "Malédiction ! Une fois encore, ma ville connaît une pénurie de @G$Goods$. J'ai parfois du mal à comprendre comment les marchands locaux gèrent leurs affaires. Tant que je n'ai pas résolu ce problème, je souhaite que vous m'aidiez."
