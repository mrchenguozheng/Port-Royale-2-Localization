"0x27beb2d9" = "Pillez @a$Amount$ d'épices, de vin et d'outils sur des convois de marchandises appartenant à @n$HostileNation$. Vous ne devez ni détruire ni couler les navires. Rapportez ensuite les marchandises au marché de @T$TOWN$ avant le @D$EndDate$. Vous pourrez ensuite aller réclamer votre récompense au gouverneur."
