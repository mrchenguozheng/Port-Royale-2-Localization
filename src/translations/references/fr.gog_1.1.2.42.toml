"0xea43addd" = "C'est une excellente opportunité qui se présente à nous. Une ville appartenant à @n$TargetNation$ souhaite rejoindre notre nation, car elle semble perpétuellement soumise à divers conflits d'intérêts. Je veux que vous souteniez cette ville jusqu'à ce qu'elle décide de changer d'allégeance."
"0xea43adde" = "Nous avons un grave problème à régler à propos d'une ville appartenant à @n$TargetNation$. Un accord écrit devait nous permettre de prendre possession pacifiquement de la ville. Malheureusement, @n$TargetNation$ ne souhaite plus honorer cet accord. Je veux que vous souteniez cette ville jusqu'à ce que cette dispute soit résolue."
"0xea43addf" = "Une ville appartenant à @n$TargetNation$ a de graves conflits d'intérêts avec son vice-roi. J'en connais la raison et j'envisage de soutenir la ville, afin de la pousser à nous rejoindre. Voudriez-vous m'aider dans cette entreprise ?"
