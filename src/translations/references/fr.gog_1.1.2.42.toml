"0x30bb44fc" = "N'êtes-vous pas le célèbre @A$USER$ ? Pouvez-vous m'aider ? Je suis poursuivi par un chasseur de primes que mes ennemis ont mis sur ma trace."
"0x30bb44fd" = "Prenez une chaise, @A$USER$. Je suis @N$OwnerName$ et j'ai une affaire importante à discuter avec vous. Par où commencer ? Bon, je me suis disputé avec ma femme. Elle m'accusait de l'avoir trompée, ce qui n'est évidemment pas vrai. Enfin, elle m'a jeté dehors et ce n'est pas le pire. Elle a même engagé un chasseur de primes, je ne peux même plus rentrer dans la ville. Pouvez-vous m'aider ?"
"0x30bb44fe" = "Vous semblez être quelqu'un qui sait naviguer.<n>Je dois aller à @T$Town$ de toute urgence, pour livrer des documents qui incriminent un des marchands locaux. Malheureusement, ce marchand l'a appris et il veut récupérer les documents. Pouvez-vous trouver un moyen de m'amener à @T$Town$ ?"
