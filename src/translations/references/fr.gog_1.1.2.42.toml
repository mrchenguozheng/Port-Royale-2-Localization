"0x178491f6" = "Augmenter les prix de 5%"
"0x17885da0" = "Vous rencontrez des naufragés sur un radeau et sauvez @$Settlers$ colons. Ils espèrent être débarqués dans une ville qui manque de main d'œuvre."
"0x17a97ba2" = "Batailles navales"
"0x17abb14d" = "et le port est très peu défendu."
"0x17ae0013" = "Le dernier convoi venant d'Europe m'a informé que nous allions manquer de marchandises importées les prochaines semaines.<n><n>Pouvez-vous m'aider ? Je ne peux pas compter sur l'aide des autres marchands pour m'apporter ces marchandises des autres villes."
"0x17ae0014" = "Comme vous le savez, @n$Nation1$ et @n$Nation2$ sont en guerre.<n>Pour cette raison, je ne serai pas fourni en marchandises venant d'Europe pendant les prochaines semaines. Je n'ai donc plus le choix que d'acheter les marchandises à @n$Nation2$.<n><n>J'ai déjà engagé quelques marchands pour le faire mais j'aimerais aussi pouvoir compter sur votre aide."
"0x17ae0015" = "Mais à quoi joue @n$Nation2$ ? Je viens juste d'apprendre d'un informateur qu'un convoi de transport venant d'Europe vers ma ville a été attaqué et pillé. M'aideriez-vous à acheter les marchandises importées dont j'ai besoin ?"
