"0xd034f206" = "trouvez le coffre avant le @D$EndDate$ pour @N$ContactName$ à @T$ContactTown$. @l$ChestPos$"
"0xd05d4cc0" = "Trouvez et détruisez un convoi appartenant au pirate Barbe Noire."
