"0xd9720471" = "Bienvenue. Avez-vous un navire qui peut m'amener à @T$TargetTown$ ? Je dois y aller d'urgence, avant le @D$EndDate$. Je vous paierai @g$Reward$ si vous m'y amenez à temps."
"0xd9720472" = " @A$USER$, je suis coincé ici. Mais je dois rejoindre d'urgence @T$TargetTown$. Pouvez-vous m'amener là-bas ? Je vous paierai @g$Reward$!"
"0xd9720473" = " @A$USER$, je cherche quelqu'un pour m'amener à @T$TargetTown$. Je serais très reconnaissant si vous me permettiez d'utiliser un de vos navires. Je vous paierai @g$Reward$."
"0xd979efd5" = "Qu'il en soit ainsi. Construisez un hôpital à @T$Town$ avant le @D$EndDate$."
"0xd99426c9" = "Voulez-vous tenter une petite partie de cartes avec moi ?<n><n>Alors misez ! Je miserai aussi et le vainqueur remportera tout."
"0xd99426ca" = "Je n'ai même pas besoin de vous demander si vous voulez jouer avec moi, vous êtes nettoyé comme un navire en cale sèche ! Revenez quand vos poches seront pleines."
"0xd99426cb" = "Oh non, encore vous ! Je me souviens encore de notre dernière partie ! Ca ne vous a pas suffit ? En tout cas, je ne joue plus avec vous pour l'instant."
"0xd99426cc" = "Tout le monde a reçu 5 cartes. J'annonce %1 points.<n><n>Si vous voulez jouer, vous devez annoncer un point de plus."
"0xd99426cd" = "C'est bon pour moi. Atout %1.<n>Voilà ma première carte."
