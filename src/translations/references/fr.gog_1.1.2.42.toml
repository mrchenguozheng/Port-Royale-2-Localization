"0xca4930db" = "Salutations, @A$USER$. Je dois livrer un gros chargement de @G$Goods$ à @T$Town$, mais malheureusement, mon capitaine n'est pas disponible. Voilà ma proposition : vous me laissez une somme en gage, @g$PriceBuy$, vous transportez @a$Amount$ à @T$Town$ et vous y toucherez @g$PriceSell$ en échange des marchandises. Qu'en dites-vous ?"
"0xca4930dc" = "Je suis heureux de vous voir, @A$USER$. Vous avez une grande flotte marchande, n'est-ce pas ? J'ai en effet une cargaison de @A$Amount$ de @G$Goods$ à livrer.<n>Si vous me laissez @g$PriceBuy$ en gage et que vous emmenez les marchandises à @T$Town$, vous y toucherez @g$PriceSell$."
"0xca4930dd" = "Je suis dans une position difficile. J'ai jusqu'au @D$EndDate$ pour livrer @a$Amount$ de @G$Goods$ à @T$Town$, mais mon convoi est déjà en route avec une autre cargaison. Je vous propose le marché suivant : donnez-moi @g$PriceBuy$ en gage et livrez les marchandises. Vous serez alors payé @g$PriceSell$. C'est un marché tentant, non ?"
"0xca6a6869" = "Sauvegarder"
"0xca6f7275" = "Nous avons pu découvrir l'emplacement du repaire du pirate %1. %2 Pourquoi n'iriez-vous pas attaquer ce repaire afin de détruire ce pirate une fois pour toutes, afin de restaurer un peu la paix dans nos eaux ?"
"0xca6f7276" = "Avez-vous appris que nous avions enfin découvert où était installé le repaire du pirate %1 ? %2 %3 cherche un héros courageux pour l'attaquer. Etes-vous à la hauteur ?"
"0xca6f7277" = "La base d'opérations de cet infâme pirate de %1 n'est plus un secret. %2 Nous devrions aller détruire ce repaire sans attendre. Je crois que vous êtes l'homme de la situation."
"0xca6f7278" = "Vous avez une très bonne réputation avec ma nation. Mais je connais un moyen de l'améliorer encore.<n><n>Le repaire du pirate %1 a été découvert il y a peu.  %2<n><n>Peut-être êtes-vous celui qu'il nous faut pour nous débarrasser définitivement de ce fléau. "
"0xcab1988a" = "%1 attaque"
"0xcac5b30b" = "Prier"
"0xcacc4fa8" = "Trouvez et détruisez la flotte du trésor espagnole. Elle était dernièrement à @T$StartTown$, de là elle navigue vers @T$DestTown$."
"0xcb2b0709" = "Quelle calamité ! Avez-vous déjà vu @F$WifeName$ aujourd'hui ? Epargnez-vous ce trajet, elle n'est pas là. Regardez, j'ai trouvé une sorte de lettre d'adieu. Elle indique qu'elle en a assez de sa vie morne et qu'elle s'est enfuie avec un aventurier. Vous devez sauver ma fille chérie !"
"0xcb2b070a" = "Le malheur frappe et il me semble que vous êtes au cœur de la tempête. Ma fille, kidnappée par des pirates. Un message qui vous est adressé. Une carte qui signale un emplacement précis. Tout cela me semble être un piège. Mais que faire ? Vous devez sauver ma fille !"
"0xcb2b070b" = "Ha ! Ma fille, votre épouse, enfuie avec un des officiers de ma garde ! J'aurai dû m'en douter ! Ils ont disparu tous les deux, à bord d'un de mes navires qu'ils ont volé ! Vous devez ramener ma fille et lui rendre sa raison ! Par un complet hasard, j'ai trouvé une carte dans les appartements de ma fille, où est indiqué un lieu précis."
