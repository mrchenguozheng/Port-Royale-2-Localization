"0x11e79f57" = "Scénario d'introduction<n><n>Dans Port Royale 2, votre objectif consiste à grimper dans l'échelle sociale, pour passer du rang d'humble marchand à celui d'homme d'affaires influent. Pour parvenir à atteindre ce statut, vous pouvez transporter des marchandises, commercer, construire et même faire de la politique ou devenir pirate.<n:25>Le scénario d'introduction vous apprendra les principes élémentaires nécessaires pour jouer. Ce scénario, comme les autres, comprend plusieurs objectifs."
