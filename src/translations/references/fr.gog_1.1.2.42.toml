"0x305f2287" = "Ma nation a récemment perdu sa dernière ville où était installé un gouverneur.<n><n>Si les nations ennemies sont affaiblies en perdant des convois militaires, nous pourrons leur en reprendre.<n><n>Pour vous évitez des ennuis avec les nations neutres, je vous donne une Lettre de marque contre nos ennemis."
