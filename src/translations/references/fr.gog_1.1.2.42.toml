"0xcc0a1380" = "Trouvez le convoi pirate commandé par @P$PirateName$, à environ 1 jour au nord-est de Providence. Détruisez ce convoi.<n>Retournez ensuite voir le gouverneur de Carthagène."
"0xcc1709af" = "%1: Hostile"
"0xcc2c64fb" = "Vous avez pour mission de pourchasser et de détruire un des convois de Barbe Noire.<n><n>Barbe Noire a déjà un repaire où il conserve plusieurs convois, de cinq navires armés chacun. C'est une mission difficile pour le convoi dont vous disposez pour l'heure.<n><n>En conséquence, vous devez commencer par augmenter votre puissance de feu. Pour avoir l'argent nécessaire à acheter un plus gros navire, vous pouvez vendre les marchandises de votre entrepôt de @T$TOWN$ aux meilleurs prix possibles. Suivez les conseils donnés dans la fenêtre d'Evénément, qui vous précisera où vendre des marchandises à un bon prix, au nord et à l'est de @T$TOWN$.<n><n>Ne perdez pas trop de temps à marchander, car vous devez également accomplir la mission du gouverneur !<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vendez les marchandises de votre entrepôt dans la ville de @T$TOWN$ et disposez de @g$GoldGoal$."
"0xcc475a7d" = "Maître des constructions"
"0xcc528764" = "Bâtiment de la communauté"
"0xcc56863a" = "Salaires par jour"
"0xcc5bfb04" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Mission actuelle<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0xcc72dc12" = "Conseils sur l'achat et la vente"
"0xcc823e54" = "Nous sommes en guerre avec @n$TargetNation$ et, à la lumière des récents événements, il est temps pour nous de riposter. Je veux que vous capturiez ou couliez des navires militaires en mon nom. Acceptez-vous cette mission ?"
"0xcc823e55" = "Il n'y a pas longtemps, @n$TargetNation$ a attaqué une de nos villes. J'envisage de mener une action militaire contre @n$TargetNation$ et je me demandais si vous accepteriez d'en faire partie ? Je veux que vous couliez ou capturiez des convois militaires. Tout ce que vous trouverez est à vous, je ne m'intéresse qu'à affaiblir @n$TargetNation$. Cela vous intéresse ?"
"0xcc823e56" = "Une de nos villes a été attaquée par @n$TargetNation$. Nous ripostons en coulant ses navires. Je souhaite vous envoyer dans une région en particulier, où vous auriez mon autorisation de couler ou de capturer des navires militaires. "
