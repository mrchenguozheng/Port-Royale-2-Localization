"0xeda49c74" = "Permis de construire"
"0xedad5b61" = "Vous n'avez pas réussi à porter la population de Tortuga à @I$Pop$ en moins de 20 jours après la peste. <n><n>Dès que la ville atteint le statut \"boum\" ou supérieur, de nouveaux ouvriers peuvent être engagés. Vous pouvez procurer à la ville de nouveaux ouvriers grâce à des familles de colons. Celles-ci viennent d'Europe pour s'installer dans les villes principales, où elles attendent d'être transférées vers d'autres villes. Vous trouverez aussi des colons qui attendent dans des villes d'un statut inférieur."
"0xedc30aca" = "<ts:75><ts:150><ts:225><ts:300>Des rats ont détruit la nourriture de vos entrepôts. Les rats frappent souvent les marchands qui entreposent trop de nourriture dans leurs entrepôts.<n><n>Pertes :"
"0xedffe567" = "Sélectionner un Mousquetaire"
