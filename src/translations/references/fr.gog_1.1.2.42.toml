"0x00bff5f3" = "Vous avez maintenant un permis de construire pour Carthagène et vous pouvez y créer des entreprises. Votre prochain objectif consiste à construire deux tisseries à Carthagène. Une tisserie permet de fabriquer des produits finis et nécessite du coton comme matières premières.<n><n>Vous devez toujours disposer d'un stock de matières premières dans votre entrepôt pour vos entreprises, car sinon elles ne produiront rien. Même si elles ne produisent rien, vous devrez payer les coûts de maintenance et les ouvriers.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construire deux tisseries à Cartagena et produire @a$AmountGoal$ vêtements."
