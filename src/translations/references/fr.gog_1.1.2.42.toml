"0x31ed47e7" = "Un saboteur a contaminé la réserve de nourritures de Tortuga. Cela a déclenché un famine dans la ville.<n><n>Votre tâche est de mettre fin à cette famine le plus rapidement possible.<n><n>Pendant 2 à 3 semaines, vous devez vous assurer que l'approvisionnement en nourriture est au-dessus de la consommation quotidienne.<n><n>Astuce : la nourriture consiste en du blé, des fruits, du maïs ou de la viande.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif <f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La famine doit être endiguée avant le @D$EndDate$."
