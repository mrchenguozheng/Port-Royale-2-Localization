"0x2ae68b1c" = "Je suis très heureux de voir que vous avez de nouveau triomphé de Barbe Noire. Ma femme vous fait passer le bonjour. Elle souhaite vous offrir un galion espagnol. Il vous attend dans le port. <n><n>Et tant que j'y suis, je vous offre également @g$Reward$."
