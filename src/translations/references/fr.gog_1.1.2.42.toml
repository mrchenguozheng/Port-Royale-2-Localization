"0x3933132f" = "Oh, @s$USER$, que dois-je faire ? Un marchand de @T$Town$ se mêle de mes affaires et mes bénéfices chutent. Cela dure depuis des mois. Pouvez-vous m'aider à me débarrasser de son convoi ?"
"0x39331330" = "Pouvez-vous m'aider à organiser une petite vengeance ? Je suis certain qu'un marchand de @T$Town$ était à l'origine du sabotage de certains de mes navires. Je ne peux rien faire tant que mes navires ne sont pas sortis du chantier naval. Je veux que vous détruisiez un convoi appartenant à ce maudit saboteur ! Je vous récompenserai royalement !"
"0x39331331" = "Ne seriez-vous pas @A$USER$ ? J'ai peut-être une mission pour vous.<n>Il y a longtemps, j'ai prêté une somme considérable à un marchand de @T$Town$ et il aurait dû me rembourser depuis fort longtemps. Je commence à penser qu'il ne souhaite pas me rembourser du tout, en fait.<n>Il est temps de lui donner une leçon ! Voulez-vous bien attaquer un de ses convois pour moi ? Vous en serez largement récompensé !"
