"0x0eb34b66" = "Dans ce scénario, vous apprendrez à établir des entreprises et les facteurs à considérer lorsque vous vous lancez dans la production. Vous devrez également construire des zones résidentielles pour vos nouveaux ouvriers.<n><n>Dans Port Royale 2, vous pouvez construire dans toutes les villes où vous avez acheté un permis de construire. Plus vous avez de permis, plus le suivant coûtera cher. Vous disposez toujours d'un permis de construire dans la ville où vous commencez la partie, vous pouvez donc y construire immédiatement des bâtiments.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construisez une plantation de cacao et une zone résidentielle à Santa Marta."
"0x0ede126a" = "Vous savez maintenant comment combattre en mer. Il est également possible d'attaquer une ville entière pour la piller ou la capturer au profit d'une autre nation. Il vous faudra toutefois pour cela de grands convois composés de puissants navires. Comme vous pouvez l'imaginer, attaquer une ville a une influence particulièrement négative sur votre réputation auprès de sa nation, qui enverra des convois militaires à votre poursuite à compter de ce moment.<n><n>Vous pouvez également attaquer un repaire de pirate. Les repaires de pirates sont généralement cachés, mais vous découvrirez ces lieux au fur et à mesure de votre progression dans la partie. Vous pouvez attaquer un repaire de pirates comme une ville, pour détruire tout le groupe de pirates.<n><n>La puissance des défenses d'un repaire de pirate est directement liée au temps d'activité de ces pirates et de leurs succès.<n><n>Votre dernière mission dans ce scénario consiste à lancer une attaque contre un petit repaire de pirate. Trouvez où il se trouve en allant voir le gouverneur de @T$TOWN$.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif du scénario<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Détruisez le repaire du pirate @P$PirateName$."
"0x0eecc4e8" = "Colonie anglaise"
"0x0eecc4e9" = "Colonie française"
"0x0eecc4ea" = "Colonie allemande"
"0x0eecc4eb" = "Colonie espagnole"
"0x0f1ade15" = "Vous devez maintenant créer des emplois dans la ville et construire des zones résidentielles.<n><n>Comme les colons ne voudront rester dans la ville que s'ils ont du travail, commencez par construire quatre centres de production. Choisissez le type de marchandises à produire, en prenant garde de ne choisir que des marchandises que vous pourrez vendre en faisant des profits, car les coûts de production sont élevés.<n><n>Quatre centres de production, cela fait 120 ouvriers. Comme chaque ouvrier représente une famille de quatre personnes, vous devez construire des logements pour 480 citoyens, soit quatre zones résidentielles.<n><n>Dès que les centres de production et les zones résidentielles sont construits, vous pouvez amener des colons dans votre ville. Vous trouverez le plus souvent les colons dans les villes principales. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La population de la ville doit atteindre 480 personnes."
"0x0f22fe50" = "Coût d'entretien du navire"
"0x0f26cfe7" = "Nouvelle tornade"
"0x0f3f777d" = "Duel à l'épée"
"0x0f432e25" = "Chaînes"
"0x0f4c7b2b" = "Bilan"
"0x0f52782d" = "Félicitations ! Vous pouvez maintenant produire des vêtements à partir de coton à Carthagène.<n><n>Comme vous pouvez l'imaginer, les coûts de production sont directement liés au prix auquel vous achetez le coton. Pour cette raison, vous ne devriez fabriquer des produits finis que si vous êtes certain de pouvoir acheter les matières premières associées à un prix raisonnable. Vous pouvez également choisir de produire les matières premières vous-même.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construisez une plantation de coton à Santa Marta et commercez pour gagner @g$GoldGoal$."
"0x0f5d7735" = "A l'est de Charleston se trouvent les îles Bermudes. Evitez-les soigneusement ! Il y a deux mois, mon beau-frère est parti pour les explorer, mais il n'est jamais revenu. Personne ne sait ce qui s'y passe, mais une chose est sûre : un destin terrible frappe tous ceux qui s'en approchent de trop près."
"0x0f5d7736" = "Avez-vous entendu les dernières histoires concernant les Bermudes ? Un marchand voulait utiliser une route qui passait à travers les îles pour rejoindre l'Europe, mais il n'est jamais arrivé. Son frère est parti à sa recherche, mais n'a rien trouvé que quelques morceaux d'épave au sud des îles."
"0x0f5d7737" = "L'autre jour, un marin de Port Royal m'a dit qu'il avait navigué non loin des Bermudes. Presque trop près, car de ses yeux, il a vu un monstre énorme qui avançait dans l'eau. Il crachait du feu et de la fumée sortait de ses longues oreilles. Le malheur attend quiconque ose approcher ce monstre des mers !"
