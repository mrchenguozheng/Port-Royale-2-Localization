"0x24b0fd83" = "Fonction"
"0x24c12812" = "Félicitations ! On vous a confié pour mission de capturer des villes !<n><n>Les villes peuvent être bien défendue, vous devriez donc choisir une ville qui compte aussi peu de tours de canons que possible. La ville de @T$SampleTown$ est une cible parfaite.<n><n>Pour attaquer une ville, activez l'option Attaque de villes pour votre convoi. Pour cela, sélectionnez le convoi, puis cliquez sur le bouton Mode d'attaque.<n><n>Vous pouvez attaquer une ville par la mer ou par la terre. Toutefois, vous ne devriez lancer une attaque par la terre que si vous avez beaucoup plus de marins que la ville compte de soldats. Vous devriez également équiper la moitié des marins avec des coutelas et l'autre moitié avec des mousquets dans ce cas.<n><n>Remarque : s'il y a un convoi militaire dans le port de la ville, vous devez triompher du convoi avant d'attaquer la ville.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplissez votre mission pour capturer des villes."
"0x24e18ac4" = "<f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x24ec3366" = "Excellent ! Votre convoi est maintenant armé et prêt à poursuivre un des convois de Barbe Noire.<n><n>La fenêtre Evénement vous donnera des conseils quotidiens pour vous aider à découvrir l'emplacement du convoi pirate, pour peu qu'il soit en mer. Trouver des pirates peut être difficile, car ils retournent toujours dans leur repaire après un raid réussi contre un navire marchand.<n><n>Souvenez-vous qu'un convoi pirate peut compter jusqu'à cinq navires de guerre. Renforcez votre convoi si vous pensez qu'il n'est pas assez puissant. Vous savez déjà comment mettre la main sur un peu d'or.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplissez la mission qui vous a été confiée par le gouverneur de @T$TOWN$."
"0x250c7a12" = "Livrez-en @a$Amount$ avant le @D$Date$. Vous pouvez déposer les marchandises au marché, où vous serez immédiatement payé @g$GoldPerBarrel$ pour chaque tonneau <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> de @G$Goods$."
"0x250c7a13" = "J'en suis ravi. Livrez-en @a$Amount$ au marché. Vous toucherez @g$GoldPerBarrel$ pour chaque tonneau <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> jusqu'au @D$Date$."
"0x250c7a14" = "Allez voir mon émissaire au marché. Livrez @a$Amount$ tonneaux de @G$Goods$ avant le @D$Date$, il vous en donnera un bon prix."
"0x2540ea42" = "Texte supplémentaire (chronique)"
"0x2546beb9" = "Alors, @N$OwnerName$ vous envoie me trouver ? Oui, je connais ce vieux capitaine, il peut sûrement apprendre une ou deux choses à votre équipage. Mais pourquoi vous aiderai-je ? Mais je ne vais pas être désagréable, j'apprécie le fait que vous ayez passé autant de temps à me chercher. Si vous me donnez un petit coup de main, je vous dirai où le capitaine s'est retiré."
"0x2546beba" = "Je ne connais aucun @N$OwnerName$, mais je sais où est @N$TeacherName$. Je suppose que je pourrais vous le dire, si je le voulais. Et si nous faisions affaires ? "
"0x2546bebb" = "Il m'importe peu que ce soit @N$OwnerName$ qui vous envoie ou bien le Grand Vizir de Taipei ! J'ai un problème. Et, tant qu'il ne sera pas résolu, je ne serai pas enclin à entendre parler d'autre chose. Je vous fais une proposition : vous retrouvez mon coffre, et je vous dirai où se cache ce vieux fou de @N$TeacherName$."
