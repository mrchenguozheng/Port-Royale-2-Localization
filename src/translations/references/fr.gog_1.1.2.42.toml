"0x32f1c30f" = "Scénario d'introduction<n><n>Ce scénario d'introduction détaille le transport de marchandises et le commerce. Des conseils vous seront donnés qui vous aideront à faire d'importants profits et vous apprendrez à créer de nouveaux convois."
