"0x0769a667" = "Yanco"
"0x077030da" = "Félicitations ! Vous avez terminé le scénario et vous savez maintenant comment combattre en mer ou contre un port.<n><n>Assurez-vous toujours que vos navires d'escorte sont bien armés avant d'attaquer un autre convoi. Bien sûr, vous devez également réfléchir sérieusement avant de choisir les convois que vous attaquez. Les convois de marchandises qui viennent d'Europe et les convois militaires sont toujours très puissants et les pirates sont parfois des adversaires dangereux.<n><n>Si vous attaquez des marchands sans avoir d'abord obtenu une Lettre de marque d'un gouverneur, cela aura une influence très négative sur votre réputation dans toutes les nations. Au pire, de puissants convois militaires risquent de se lancer à votre poursuite.<n><n>Un conseil : si vous capturez un convoi sans couler ses navires et seulement en les pillant, l'impact sur votre réputation sera bien plus réduit."
