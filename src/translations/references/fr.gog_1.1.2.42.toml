"0x20ccd2d7" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen>"
"0x20d2607a" = "Beau travail ! Tortuga a de nouveau le statut \"boum\". Vous avez accompli cette tâche en @I$Days$ jours."
"0x20de74a6" = "Poursuite de navires"
"0x20e2a2f4" = "Moyenne pour 1 jour. Profit journalier moyen %1."
