"0x3353aa4c" = "Excellent ! Vous devriez capturer d'autres villes anglaises au nom de la Hollande. Faites vite, car vous ne pouvez capturer de villes que tant que dure la guerre.<n><n>Comme toujours, les missions de ce type ne sont proposées que par le vice-roi de Grand Bahama. Avant de pouvoir obtenir de nouvelles missions de ce type, vous devrez peut-être vous assurer que vos ennemis sont toujours faibles et votre nation toujours forte. Vous savez comment procéder.<n><n>Pour vous aider, le gouverneur des îles Turk vous a fourni trois nouveaux carracks.<n><n>Il y a également de nombreux marins et de nombreuses armes disponibles dans le port.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Accomplissez deux nouvelles missions pour capturer des villes au nom du vice-roi hollandais avant la fin de la guerre entre la Hollande et l'Angleterre. Vous avez jusqu'au @D$EndDate$. Le scénario prendra alors fin."
