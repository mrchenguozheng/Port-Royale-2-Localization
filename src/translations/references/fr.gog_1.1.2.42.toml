"0xcb6604a0" = "coulé"
"0xcb674ff0" = "Je vous remercie au nom de ma nation. Le convoi doit être préparé et l'équipage rassemblé. Il sera prêt à naviguer dans 15 jours.<n><n>Si vous voulez m'offrir un autre convoi, attendez que ce délai soit écoulé."
