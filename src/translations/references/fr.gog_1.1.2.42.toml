"0x12e312db" = "Une fois encore, nous sommes confrontés à une pénurie de marchandises importées livrées par des convois de marchandises appartenant à @n$Nation$. Pouvez-vous nous aider avec cette affaire ?"
"0x12e312dd" = "En raison de la guerre avec @n$HostileNation$, il y a une pénurie de marchandises importées dans les colonies de @n$Nation$. Il ne semble pas y avoir une telle pénurie dans les colonies de @n$HostileNation$, nous pourrions donc attaquer leurs convois de marchandises et nous procurer ces biens de la sorte. Vous pourriez vous en charger."
