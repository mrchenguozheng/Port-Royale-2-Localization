"0x03ce7c8e" = "Objectif"
"0x03d3dcd8" = "Alors qu'ils pillaient la ville, vos hommes ont découvert où la femme du gouverneur se cachait et ils l'ont \"libérée\". Elle se trouvait dans une cuisine.<n>\"Ne me ramenez pas au Gouverneur de @T$TOWN$. Je ne l'ai jamais aimé, je vous le jure !\"<n><n>Allez-vous ramener cette femme au gouverneur malgré ses suppliques ?"
"0x03d3dcd9" = "Alors qu'il pillait la ville, votre équipage rencontre un jeune garçon avec un caniche. Ce dernier vous raconte que c'est le Gouverneur de @T$TOWN$ qui a organisé la disparition, pour se débarrasser du chien. Ayant pris le chien à bord, vous vous demander s'il faut vraiment ramener ce chien au Gouverneur de @T$TOWN$.<n><n>Voulez-vous jeter le chien à la mer ?"
"0x03d6dcdb" = "Chasse au pirate"
"0x03dfeb8d" = "<c><o:0xFFFFE6A0>%1<n><o:0xFFEBF0A0>(ville du joueur)"
"0x03e1b0eb" = "Quelle malchance ! Je me dois d'avoir des stocks réguliers de biens des colonies pour les transports d'Europe, mais nous n'avons pas les outils nécessaires à produire ces biens. Voulez-vous m'aider à fournir une ville en outils adéquats ?"
"0x03e1b0ec" = "Comment cela a-t-il pu se produire ! Notre approvisionnement en outils chute à @T$DestTown$ et maintenant la production de la colonie est en péril. Pourriez-vous nous aider pour résoudre se problème ?"
"0x03e1b0ed" = "Ma nation manque d'outils. Nous pourrions les obtenir des autres nations. Qu'en pensez-vous ?"
