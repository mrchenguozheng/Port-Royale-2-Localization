"0xdd3808a0" = "Scénario d'introduction<n><n>Dans Port Royale 2, vous pouvez construire des bâtiments dans n'importe quelle ville pour laquelle vous possédez un permis de construire. Vous avez toujours l'autorisation de construire dans la ville où vous commencez la partie.<n:25>Ce scénario vous présente les principes de construction et de production. Votre mission consiste à construire plusieurs bâtiments commerciaux et résidentiels. Dans les différentes étapes du scénario, vous devrez trouver des matières premières, des colons et des ouvriers. "
