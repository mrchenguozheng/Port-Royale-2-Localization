"0x1b0a0b6d" = "Vous avez atteint le grade de \"Marin\". A compter de maintenant, vous devez faire quelque chose pour conserver votre réputation élevée avec une nation.<n><n>Vous pouvez améliorer votre réputation avec les nations en commerçant avec elles, en donnant à l'Eglise, en organisant des fêtes, en détruisant des pirates et en accomplissant des missions ou Lettres de marque.<n><n>Si votre réputation avec une nation ne s'améliore pas, elle diminue peu à peu tous les jours. Remarquez que le nombre de bâtiments que vous avez construits dans les villes d'une nation détermine le niveau le plus bas que votre réputation peut atteindre.<n><n>Votre réputation influe sur les prix de vente et sur les missions que vous pouvez obtenir. Si votre réputation est basse, vous devriez également prendre garde aux convois militaires !"
"0x1b33d8e6" = "Les marchandises inutilisées peuvent être transportées !"
"0x1b407276" = "Production"
"0x1b416d15" = "Actifs"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "Le nombre de citoyens (la population moins le nombre de soldats) à Tortuga doit être rétabli à @I$Pop$ avant le @D$EndDate$ pour que les entreprises puissent avoir assez d'ouvriers."
"0x1b900424" = "Voyageur"
"0x1ba04e6b" = "Un convoi militaire appartenant à %1 a été détruit par des navires de %2."
"0x1ba7362a" = "Des navires de guerre appartenant à %1 ont attaqué un convoi de marchandises appartenant à %2."
"0x1bcad43f" = "Aujourd'hui, %2 le boucanier %1 est entré dans la ville sous un faux nom et a déclenché plusieurs émeutes d'ouvriers sous de faux prétextes. Les ouvriers ont décidé de ne pas travailler pendant les deux semaines à venir."
"0x1bccfb60" = "Prix total"
"0x1be1209e" = "Votre propre ville"
"0x1be7a5dc" = "Vous devez trouver un paquet. @l$Pos$ Ramenez-le à @N$OwnerName$ dans la ville de @T$TOWN$ avant le @D$EndDate$. "
"0x1bf425d5" = "Vous êtes malheureusement un ennemi de la nation à laquelle appartient la ville et vous vous êtes en conséquence infiltré dans le port."
"0x1c0b520a" = "Aucune partie sauvegardée disponible"
"0x1c1160cb" = "Direction technique"
"0x1c16ab5a" = "Transférer à l'entrepôt :"
"0x1c394b47" = "Expérience de combat naval"
"0x1c4cc4f1" = "%1: Navire réparé"
"0x1c703500" = "Le Gouverneur veut vous parler d'urgence."
"0x1c74c605" = "Vous repartez avec %1."
"0x1c7e1413" = "Merci !<n> Naturellement, il vous faut un permis dans la ville, mais vous en recevrez un.<n>Je paierai toutes les dépenses dès que l'école sera construite. L'anniversaire de mon épouse est le @D$EndDate$, et je veux que la construction de l'école ait commencé d'ici là."
"0x1c7e1414" = "C'est parfait. Commencez la construction de l'école avant le @D$EndDate$. Je vous paierai bien entendu.<n>N'oubliez pas qu'il vous faut un permis à @T$Town$ si vous voulez y construire une école.<n>Ne dites pas un mot de cette mission à ma soeur."
"0x1c7e1415" = "Merci ! @T$Town$ ne saura jamais rien de notre accord. Commencez la construction avant le @D$EndDate$. Je vous paierai alors pour toutes vos dépenses.<n>N'oubliez pas qu'il vous faudra un permis à @T$Town$ pour y construire une école."
"0x1c7e9deb" = "%1: Montant de l'emprunt %2 remboursé."
"0x1c83647f" = "Armes et munitions :"
"0x1ca41002" = "Scénario terminé"
"0x1ca50773" = "Parfait ! Vous avez maintenant un convoi impressionnant.<n><n>Votre prochaine tâche ne sera pas facile, car elle implique d'attaquer et de vaincre un convoi militaire anglais. Le gouverneur des îles Turk vous a fourni un nouveau navire en soutien. Localisez-le dans le port des îles Turk et ajoutez-le au convoi.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Détruisez un convoi militaire anglais."
"0x1ce621bb" = "Zone résidentielle d'un marchand local"
"0x1ce62aab" = "Missions en cours"
"0x1ce81e5e" = "Type"
"0x1cf07333" = "Bien joué, vous avez atteint l'objectif en @I$Days$ jours. Votre prochain objectif est d'augmenter le nombre de citoyens vivant en ville. Pour cela, créez quatre entreprises, une de chaque type permis en ville.<n><n>Souvenez-vous que seul un petit nombre de marchands passe à Tortuga, et vous devez vous assurer que la ville est suffisemment bien approvisionnée, et aussi que son statut soit assez élevé pour y attirer les de nouveaux colons. De plus, assurez-vous qu'il y a assez d'espace vital pour vos citoyens.<n><n>Vous avez 60 jours pour atteindre cet objectif. Plus vous ferez vite, mieux cela sera.<n><n>Astuce : les soldats sont comptés dans la population, mais ne sont comptés pas en tant que citoyens ! Vous pouvez uniquement augmenter le nombre de vos citoyens en créant des emplois.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Créer quatre entreprises différents à Tortuga et porter le nombre de citoyens à 1500 avant le @D$EndDate$. N'oubliez pas de fournir assez d'espace vital ! Chaque entreprise nécessite une zone résidentielle."
"0x1d01f111" = "Sons"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Le navire qui a coulé ici devait être commandé par un capitaine très expérimenté. Le coffre ne contient pas d'or, mais un journal de bord tenu à jour très méticuleusement, appartenant au capitaine @L$RandLName$. Cela contribue à améliorer l'expérience du capitaine du convoi @C$Convoy$ de deux points."
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Le coffre au trésor est vide, mais il servait de bouée, attachée à une corde. Non loin sous la surface, vous découvrez un repaire où sont entreposés plusieurs canons. Votre équipage remonte autant de ces canons que possible."
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Un grand nombre de tonneaux de rhum flottent dans les environs. Vos hommes en récupèrent autant que le convoi peut en emporter."
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Votre convoi a découvert un large coffre en bois. Il est immédiatement remonté à bord et ouvert. Enfin de vrais trésors, pense le capitaine, en y découvrant @g$Gold$."
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Un vieux coffre en bois pratiquement en miettes flotte sur l'eau. Quoi qu'il ait contenu par le passé, il n'en reste rien qu'une odeur pestilentielle. Mais malgré cela, le moral de l'équipage s'améliore : la chasse au trésor est enfin terminée."
"0x1d19d29c" = "Permis de construire dans %1"
"0x1d6d7bd9" = "et le port est lourdement défendu."
"0x1db06b05" = "Trouvez le paquet"
"0x1db7f908" = "Malheureusement, vous n'avez pas assez de temps pour accumuler @g$GoldGoal$ dans vos caisses.<n><n>Vendez les marchandises de votre entrepôt situé Tortuga dans les villes qui sont en rupture de stock et soyez à l'affût des marchandises que vous pourriez acheter à bon prix.<n><n>Vous pouvez aussi emprunter au Trésorier de Tortuga."
