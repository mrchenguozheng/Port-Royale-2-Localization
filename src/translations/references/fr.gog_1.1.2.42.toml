"0xfc5c9324" = "<gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Gold_X3_800x600.screen>"
"0xfc64ab0e" = "Vous pouvez maintenant améliorer votre réputation envers %1 en attaquant les navires français et leurs villes. Cela ne diminuera pas votre réputation dans les autres nations."
"0xfc692ef1" = "<n><n>Cependant, si au moins un navire de votre convoi survit à la bataille, le capitaine s'en tire aussi."
"0xfc71eb4b" = "Quel malheur m'accable. Depuis le début de la guerre contre @n$FoeNation$, je n'ai pas réussi à accumuler suffisamment de marchandises coloniales pour les convois de marchandises. Pourriez-vous m'aider en me fournissant une importante cargaison de @G$Goods$ ?"
"0xfc71eb4c" = "Depuis que nous sommes en guerre contre @n$FoeNation$, ses marchands n'ont plus le droit de livrer de @G$Goods$ aux villes de ma nation. J'ai un gros problème de pénurie. Vous avez beaucoup de navires et vous connaissez bien la mer. Pouvez-vous m'aider à trouver une grosse cargaison de @G$Goods$ ?"
"0xfc72151e" = "Entrepôt - Convoi"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Par canons"
"0xfc910833" = "Bâtiments résidentiels disponibles"
"0xfc9a5f7d" = "C'était un plaisir de faire des affaires avec vous. Bonne journée !"
"0xfc9a5f7e" = "Les marchandises ont été expédiées dans votre entrepôt. Bonne journée !"
"0xfc9a5f7f" = "Les marchandises ont été chargées sur votre convoi. Au revoir, %1."
"0xfc9cf623" = "Terminé"
"0xfca882e8" = "Comme vous savez, la flotte du trésor espagnole prend toujours une route différente quand elle collecte les trésors de ses colonies et quand elle revient en Europe. La flotte se protège des embuscades en ne restant que quelques temps dans chaque ville. Quoi qu'il en soit, cette fois l'Espagne a commis une sérieuse erreur, en nous ayant permis de connaître la voie que va suivre la flotte du trésor espagnole à ce moment précis. Vos ordres ne peuventpas être plus simples. Détruisez-la jusqu'au dernier navire !"
"0xfca882e9" = "Nous sommes en guerre contre l'Espagne et nous devons nous assurer que la flotte du trésor espagnole ne regagne jamais l'Europe. Heureusement, nous avons appris le nom de la ville dans laquelle elle va accoster. Nous allons saboter la flotte dans cette ville, comme cela elle devra rester plus longtemps au port. Cela vous donnera le temps de l'intercepter et l'empêchera de regagner l'Europe. Acceptez-vous cette mission ?"
"0xfca882ea" = "Vous n'aurez pas une opportunité comme ça tous les jours ! Aujourd'hui un de mes informateurs m'a indiqué la route que suit la flotte du trésor espagnole. Mais ce n'est pas tout. Nous avons appris que la flotte va jeter l'ancre pour plus de temps que d'habitude dans la prochaine ville qu'elle visitera. Comme nous sommes en guerre contre l'Espagne, nous devrions faire plaisir au Vice-roi et faire en sorte que la flotte du trésor espagnole ne regagne jamais l'Europe. Allez-vous intercepter la flotte pour ma nation ?"
"0xfcc82d44" = "Sabreur"
"0xfcd6fdec" = "Je vois que vous n'avez pas terminé ma précédente mission. Terminez-la et j'en aurai d'autres pour vous."
"0xfce1cfd1" = "Je crains de n'avoir rien pour vous en ce moment.<n> Je ne peux vous demander de capturer une ville que si une nation ennemie est affaiblie et que je dispose de suffisamment de convois militaires pour protéger mes villes."
"0xfce38f12" = "Gouverneur de la ville"
"0xfcf185ae" = "+++EMPTY+++"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "Ambiance"
"0xfd1be8e3" = "Le boucanier %1, %2, s'est introduit dans la ville et a détruit de nombreux entrepôts de marchandises appartenant à plusieurs des marchands. Le conseil de la ville refuse d'être considéré responsable."
"0xfd1f0281" = "Matières premières et Production"
"0xfd26f2aa" = "Le convoi @C$Convoy$ a trouvé un naufragé. Amenez-le à @T$DestTown$."
"0xfd26f2ab" = "Le convoi @C$Convoy$ a trouvé un naufragé. Amenez-le à une ville appartenant à @n$DestNation$."
"0xfd26feb4" = "Hum, @N$Name$ a sauté à la mer parce que vous étiez trop lent."
"0xfd2f55fd" = "Date"
"0xfd40a541" = "<n><f:fonts/Tiepolo_black14x14aaFHk.res>Losses<t><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen> %1<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen> %2<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_MANN_800x600.screen> %3<n>(approx. %4)"
"0xfd4ed860" = "Vos troupes enfoncent la porte de la ville et prennent le commandant en otage. Les soldats capitulent.<n><n>Que voulez-vous faire maintenant ?"
"0xfd518241" = "Ville principale de %1"
"0xfd638295" = "Chargement en cours..."
"0xfd6477c9" = "Augmentez la puissance de feu de votre convoi. Il vous faut au moins 90 canons."
"0xfd69d24a" = "%1:%2:%3"
"0xfd6d4abb" = "L'une de vos actions vous empêche de parvenir à terminer le scénario.<n><n>Suivez les instructions qui sont données dans la fenêtre Evénement."
"0xfd9349ac" = "Confiscation"
"0xfda0635d" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>BGS<f:fonts/Tiepolo_bold14x14aaFH.res><t>Tirer une bordée<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Définir une route<n><f:fonts/Tiepolo_black14x14aaFHk.res>1,2,3<f:fonts/Tiepolo_bold14x14aaFH.res><t>Munitions<n><f:fonts/Tiepolo_black14x14aaFHk.res>4<f:fonts/Tiepolo_bold14x14aaFH.res><t>Paré à l'abordage<n><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Tirer"
"0xfda277f4" = "Il n'y a plus de place à %1 où construire un entrepôt. Si vous voulez tout de même vous installer dans cette ville, vous pouvez peut-être persuader un des marchands locaux de détruire un de ses commerces.<n><n>Des commerces sont 'détruits' lorsque le prix des marchandises qu'ils produisent reste longtemps trop bas dans la ville. C'est généralement le cas lorsque ladite marchandise est proposée en abondance. Pour y parvenir, vous devez commencer par engranger un stock important de cette marchandise. Vendez ensuite suffisamment de cette marchandise sur le marché pour réduire le prix à un niveau peu élevé.<n><n>Les marchandises produites sont livrées une fois par jour au marché. Si le prix est au minimum, le commerce réduira ses effectifs. Vous le verrez si vous cliquez sur le commerce. Un commerce est 'détruit' lorsqu'il a licencié 30 ouvriers."
"0xfda5ded4" = "La ville est florissante grâce à la découverte d'or"
"0xfda71da4" = "+++EMPTY+++"
"0xfdaf6463" = "Je vous remercie une fois encore. Vous avez beaucoup fait pour ma nation. Je vous récompense en vous attribuant les dernières terres disponibles pour votre ville de %1. Vous possédez toute sa superficie."
"0xfdb7f907" = "Un feu de camp révèle la cachette du professeur, pas très loin de la plage. Votre capitaine rame jusqu'à la plage et il rencontre le vieil homme. Quand le vieil homme voit le vin, il se frotte les mains en jubilant."
"0xfdb7f908" = "Non loin de la plage, votre convoi découvre le petit camp de l'ermite. Votre capitaine rame jusqu'à la plage et il rencontre le vieil homme qui porte un uniforme de capitaine sûrement plus vieux que lui. Il observe les tonneaux de rhum et semble enchanté."
"0xfdb7f909" = "Après un moment, Votre convoi découvre une cachette à terre. Votre capitaine rame jusqu'à la plage et regarde autour de lui. Il trouve finalement le vieux maître et lui explique se qui l'amène. L'ermite accepte la nourriture."
"0xfdc606cf" = "Chasse au pirate"
"0xfdcdfd58" = " Il est heureux d'enseigner toutes les astuces du commerce à votre capitaine."
"0xfdcdfd59" = " Il enseigne tous ce qu'il faut à votre capitaine pour gagner les batailles."
"0xfdcdfd5a" = " Il est heureux d'enseigner tout sur l'art de la navigation."
"0xfdd49861" = "Epave"
