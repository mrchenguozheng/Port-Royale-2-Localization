"0xe3de2671" = "Votre convoi a retrouvé en mer une cassette contenant un des documents du gouverneur."
"0xe3de2672" = "Vous avez maintenant à bord tous les documents du gouverneur. Ramenez les documents à @T$TOWN$."
"0xe3e1d467" = "%1,<n><n>Vous ne pouvez pas acheter de permis parce que votre réputation n'est pas assez élevée dans ma nation, de plus vous n'avez pas assez fait de choses pour cette ville.<n><n>Améliorez votre réputation dans ma nation et faites du commerce dans ma ville pour augmenter votre réputation commerciale, et alors revenez me voir."
"0xe3e1d468" = "%1,<n><n>Votre réputation dans ma nation n'est pas assez élevée, j'ai bien peur de ne pas pouvoir vous vendre un permis de construire.<n><n>Revenez me voir quand votre réputation se sera améliorée."
"0xe3e1d469" = "%1,<n><n>Vous n'avez pas fait assez de commerce dans cette ville. Livrez des marchandises qui y sont demandées pour améliorer votre réputation commerciale. Alors seulement vous pourrez acheter un permis."
"0xe3e33a30" = "Faites de %1 votre nouveau port d'attache. Vous pouvez y venir à votre guise pour y construire des bâtiments et mettre sur pied des entreprises.<n>Vous n'avez pas encore accès à toute la ville, mais si vous capturez de nouvelles villes, je vous donnerais les terres nécessaires."
"0xe3fa97eb" = "Voilà le marché. Apportez @a$Amount$ d'outils à @T$DestTown$. Au marché, vous toucherez @g$GoldPerBarrel$ par <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>. La marchandise doit être livrée avant le @D$Date$."
"0xe3fa97ec" = "Qu'il en soit ainsi. Livrez @a$Amount$ à @T$DestTown$. Les outils doivent arriver avant le @D$Date$. "
"0xe3fa97ed" = "Bien ! Je vous donne pour mission de vous procurer @a$Amount$ d'outils. Livrez-les avant le @D$Date$ à @T$DestTown$. Vous serez payé @g$GoldPerBarrel$ par <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> au marché."
