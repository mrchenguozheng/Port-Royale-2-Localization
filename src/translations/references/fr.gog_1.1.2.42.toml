"0xdcba5843" = "Je suis heureux de vous voir, @A$USER$, car j'ai besoin de votre aide. J'ai autrefois servi sous les ordres du pirate @P$PirateName$. Mais, ayant retrouvé mes sens, j'ai passé un accord avec le Gouverneur de @T$TargetTown$. Par malchance, mes anciens camarades l'ont appris et ma tête est mise à prix. Pouvez-vous m'aider en m'amenant à @T$TargetTown$ ?"
"0xdcba5844" = "On m'a dit que vous étiez un homme de parole, @A$USER$. Je suis au service du Gouverneur de @T$TargetTown$ et je dois le voir de toute urgence pour lui transmettre des informations importantes. Malheureusement, certains tiers préfèreraient m'empêcher de rejoindre @T$TargetTown$. Je m'enquiers donc de vos capacités à me mener à bon port."
"0xdcba5845" = "Oh, la malchance m'en veut personnellement. Il y a quelques semaines, j'ai croisé la route d'un navire appartenant au célèbre pirate @P$PirateName$. Mais le capitaine de ce navire devait être fort inexpérimenté, car nous l'avons coulé presque sans le vouloir.<n>Malheureusement, ce triste sire n'était nulle autre que le neveu préféré du pirate @P$PirateName$. Depuis qu'il a appris mon nom, il me pourchasse. Mon équipage a pris mon navire et s'est enfui. Me voilà bloqué ici.<n>Pouvez-vous m'aider à rejoindre @T$TargetTown$, ma ville d'origine ?"
