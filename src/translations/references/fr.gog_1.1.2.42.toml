"0xe84690dc" = "Pour changer les informations, cliquez sur la ville. Sélectionnez et effacez en effectuant des glisser-déplacer à la souris."
"0xe8469fdd" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Chroniques<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>Journal<n><f:fonts/Tiepolo_black14x14aaFHk.res>%3<f:fonts/Tiepolo_bold14x14aaFH.res><t>Liste des convois<n><f:fonts/Tiepolo_black14x14aaFHk.res>CTRL<f:fonts/Tiepolo_bold14x14aaFH.res><t>Taille de l'unité en <n><t>Fenêtre de Commerce<n><f:fonts/Tiepolo_black14x14aaFHk.res>BDS<f:fonts/Tiepolo_bold14x14aaFH.res><t>Fermer la fenêtre"
"0xe84971d5" = "Epouse"
"0xe84c0654" = "J'ai un petit problème avec la ville de @T$Town$. J'avais promis à mon épouse qu'une école y serait construite. Malheureusement, mes relations tendues avec le maître constructeur de la ville et il ne me laissera pas la construire. Voulez-vous bien construire l'école pour moi ?"
"0xe84c0655" = "Je voudrais que vous construisiez une école à @T$Town$ pour augmenter la richesse de la ville. En fait, @T$Town$ ne représente rien pour moi, mais ma soeur y vit et elle refuse d'accepter que d'autres villes soient plus civilisées."
"0xe84c0656" = "Le vice-roi m'a donné l'ordre de soutenir la ville de @T$Town$. Je serais heureux d'offrir une école à la ville. Mais le conseil de la ville refuse mon aide. Ils ne veulent pas que j'interfère et préfère prendre l'argent. Je me demandais donc si vous accepteriez de construire cette école pour moi."
"0xe88ea6ee" = "Par nom de convoi"
"0xe8925b0d" = "Duel"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>Votre capitaine est sur la gauche. Vous le contrôlez de la manière suivante :<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Attaquer<f:fonts/Tiepolo_bold14x14aaFH.res><n>Pour attaquer, cliquez avec la souris sur une partie de l'anatomie de votre adversaire. Changez de partie ciblée régulièrement pour augmenter vos chances de toucher.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Défendre<f:fonts/Tiepolo_bold14x14aaFH.res><n>Dès que l'adversaire se prépare à attaquer, vous devez cliquer avec le bouton droit de la souris au bon moment pour parer l'attaque.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Attaques spéciales<f:fonts/Tiepolo_bold14x14aaFH.res><n>Appuyez sur le bouton gauche de la souris juste avant que votre capitaine se replace après une attaque.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Endurance<f:fonts/Tiepolo_bold14x14aaFH.res><n>Chaque attaque réduit l'endurance du capitaine, il la récupère entre les attaques.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Temps de réaction<f:fonts/Tiepolo_bold14x14aaFH.res><n>Plus vous avez gagné de duels, plus votre temps de réaction est court."
