"0x2842ae4a" = "Lettre de marque"
"0x2875b307" = "%1 %2 a détruit un convoi appartenant au pirate %3."
"0x28812f6e" = "J'ai appris que vous vouliez tester vos capacités à commander des navires au combat. J'ai justement une tâche pour vous.<n>Deux navires abandonnés sont perdus en mer. Je veux que vous les couliez avant qu'ils ne représentent une menace pour la navigation. <n>Acceptez-vous cette mission ?"
"0x28812f6f" = "J'ai maintenant une tâche un peu plus difficile pour vous. Un petit oiseau m'a annoncé que le convoi pirate de @P$PirateName$ est actuellement en mer. Ce convoi ne comporte qu'un seul navire. Vous ne devriez pas avoir trop de mal à le détruire.<n>Acceptez-vous cette mission ?"
"0x28812f70" = "Vous avez déjà détruit un convoi pirate appartenant à @P$PirateName$. Mais il y a souvent plusieurs convois dans un repaire de pirates, tous commandés par @P$PirateName$. Vous ne pouvez éliminer le chef d'un groupe de pirates qu'en trouvant et en détruisant son repaire.<n>Un autre convoi, commandé par @P$PirateName$ a été aperçu. Ce convoi comprend deux navires, et vous devez être prêt avant d'engager le combat.<n>Etes-vous prêt ?"
"0x2883fdae" = "Vous pouvez attaquer ce repaire de pirates par la mer avec un convoi. Tout d'abord vous devez vaincre tous les navires présents dans le port."
"0x289d1ced" = "Consommation journalière"
"0x28b1f98d" = "%1 %2 Vous avez aussi un permis pour construire des bâtiments et créer des entreprises à %3 et vous possédez déjà un entrepôt en ville.<n><n>Comme vous êtes jeune et inexpérimenté, vous n'avez atteint que le statut de mousse. Pour cette raison, vous ne pouvez pas encore commander d'autres convois ou acheter des permis de construire dans d'autres villes.<n><n>Votre statut est déterminé par vos actifs, ce qui comprend votre argent, vos propriétés et navires (soit un montant actuel d'environ %4). Vous atteignez le statut suivant dès que votre richesse atteint %5.<n><n><n>Bonne chance !"
"0x28c94158" = "Navires"
"0x28cc4ee4" = "Le convoi ne peut pas prendre la mer, il y a trop de marchandises à bord. Vendez-les ou transférez-les dans l'entrepôt pour ne pas excéder le poids maximum autorisé pour ce convoi."
