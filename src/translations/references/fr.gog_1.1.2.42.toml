"0xce43a07c" = "Vous avez attaqué un convoi appartenant à une nation alliée. Dans ce scénario, les nations sont en paix, ce qui signifie que vous ne devez en aucun cas attaquer les convois marchands ou militaires."
"0xce4d9a57" = "Commerce en ville"
"0xce75e5c4" = "Vous savez maintenant acheter et vendre des marchandises. Vous devez toujours acheter les marchandises où elles sont produites, car elles y sont meilleur marché.<n><n>Remarque : si vous voulez commercer avec un convoi, vous devez le sélectionner et il doit être dans la ville avant que vous entriez dans les docks.<n><n>Plus tard dans le scénario, vous pourrez faire des profits en commerçant vous même. La fenêtre Evénement vous présente des conseils pour y parvenir.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Vous devez gagner @g$GoldGoal$ en commerçant."
