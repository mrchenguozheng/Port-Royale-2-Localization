"0x05478cea" = "Ma fille m'avait déjà prévenu de votre arrivée. Elle sait être impétueuse, lorsqu'elle le veut. Mais je ne saurai me dresser en travers des souhaits de ma fille et je pense que vous êtes l'homme qu'il lui faut. Ainsi, je vous le demande : voulez-vous prendre %1 pour épouse ? "
"0x05633055" = "Vos bâtiments"
"0x05716a06" = "Votre prochain combat sera un peu plus difficile, car cette fois l'ennemi va riposter. Votre mission consiste à retrouver et à éliminer un pirate pour le gouverneur.<n><n>Vous devrez d'abord armer votre convoi. Achetez un navire, ajoutez-le au convoi et prenez des armes et des marins à bord.<n><n>Vous pouvez appuyer sur la touche F1 à tout moment lors du combat naval pour afficher la configuration des contrôles. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Armez votre convoi et accomplissez la nouvelle mission qui vous a été confiée par le gouverneur de Carthagène."
"0x058ca789" = "Allez voir le gouverneur de @T$TOWN$ et accepter sa mission."
"0x05980d2c" = "Le niveau de difficulté détermine le prix des marchandises et les points de dégâts infligés pendant les batailles navales.<n><n>De plus, si le niveau de difficulté est bas, vous n'avez pas besoin d'avoir une réputation commerciale très élevée dans une ville avant de pouvoir acheter un permis de construire."
"0x05ae35b1" = "Très bien ! Allez maintenant voir le vice-roi espagnol à Port Royale et acceptez une mission visant à capturer une ville française.<n><n>En temps normal, il faut capturer deux villes avant de se voir accorder des terres. Mais dans ce scénario, vous avez un bonus et il vous suffira de capturer une seule ville pour l'Espagne.<n><n>Vous pouvez choisir la ville à capturer. Il est préférable de choisir une ville qui dispose de peu de canons. Une ville française qui serait un excellent choix pour l'instant serait @T$SampleTown$.<n><n>Pour vous remercier d'avoir capturé la ville, le vice-roi vous donnera un peu de terres. Remarque : vous ne pouvez pas parler avec un vice-roi tant que vous n'avez pas atteint le statut de Maître d'équipage au moins.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Allez voir le vice-roi espagnol de Port Royale et acceptez la mission de capturer une ville. Lorsque vous avez accompli cette mission, vous pouvez accepter son cadeau."
"0x05b43b45" = "Coûts : %1"
