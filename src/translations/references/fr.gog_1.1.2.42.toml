"0xde34d355" = "Plus de puissance de feu"
"0xde535352" = "Malheureusement, la peste s'est déclarée à Tortuga. Elle va faire rage en ville pendant un mois. Le statut de la ville va considérablement s'abaisser, et des citoyens vont mourir tous les jours. De nombreux citoyens paniquent et s'enfuient.<n><n>En tant que marchand, il est intéressant pour vous que la demande en ville de vêtements et de bois ait doublé pendant l'épidémie.<n><n>Votre objectif est d'assurer l'approvisionnement de la ville pendant la peste, et d'éviter les morts autant que possible.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Le nombre de citoyens (habitants moins les soldats) doit être rétabli à @I$Pop$ en moins de 20 jours après la fin de la peste. Cela permettra à toutes les entreprises d'avoir assez d'ouvriers."
