"0x23f0ed65" = "Nous sommes en guerre avec @n$HostileNation$. Un de mes capitaines a récemment pensé à un excellent moyen de démoraliser @n$HostileNation$. Il suggère que nous préparions un convoi militaire avec des navires pris à l'ennemi, afin de les faire goûter à leur propre médecine, pour ainsi dire.<n>Vous êtes l'homme qu'il nous faut pour capturer ces navires."
"0x23f0ed66" = "Nous voici de nouveau en guerre contre @n$HostileNation$. Je veux assembler un nouveau convoi pour protéger ma ville. Je n'ai aucun désir d'attendre qu'un convoi militaire me soit envoyé depuis l'Europe.<n>Mais mes ressources sont très limitées, et j'ai donc eu l'idée de capturer des navires ennemis pour le faire. Souhaitez-vous m'aider en capturant quelques navires de type @S$ShipType$ ?"
