"0xdef5305e" = "Pillés : %1"
"0xdf10406e" = "Excellent ! Votre ville s'est déjà un peu développée.<n><n>Dès que votre ville compte plus de 1000 habitants, elle commencera à attirer des marchands d'autres villes, qui viendront acheter et vendre.<n><n>Les marchands ne viennent généralement que si la ville manque d'une marchandise en particulier, donc, si cette marchandise n'est pas disponible.<n><n>Vous venez de recevoir un message sur le commerce et la production dans votre ville. Pour le lire, ouvrez le journal.<n><n>Votre premier objectif est d'augmenter la population de votre ville pour qu'elle atteigne 1000 habitants.<n><n>Remarque : si une ville veut avoir plus de 500 habitants, elle doit avoir une auberge !<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>La population de votre ville doit dépasser plus de 1000 habitants."
