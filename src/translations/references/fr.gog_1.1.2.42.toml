"0x226068b3" = "Mauvais état"
"0x227ca1f5" = "<f:fonts/Tiepolo_black13x13aaFHk.res>Protéger le port de la ville<n><f:fonts/Tiepolo_bold13x13aaFHk.res>(convoi dans le port avec un navire d'escorte)"
"0x22a3b6d0" = "Chasse au trésor"
"0x22b99c70" = "Voulez-vous démolir l'entrepôt le plus récemment construit ?"
"0x22caa09f" = "%1. %2 %3"
"0x22e58881" = "Mode combat"
"0x22fffe32" = "Mon cher %1,<n>j'ai du mal à contenir mon impatience. Venez vite au marché et livrez les marchandises nécessaires aux noces, que notre banquet puisse vite avoir lieu."
"0x2310e7f4" = "Pour afficher le prochain objectif de mission, vous devez capturer les villes."
"0x2335f663" = "Merci de m'avoir ramener le paquet. Voici une récompense de @g$Reward$."
"0x234d00d9" = "Aujourd'hui, le pirate %1 a commencé à mettre les Caraïbes à feu et à sang."
"0x23652698" = "Malheureusement, je ne peux rien vous dire de précis. Le responsable du port m'a donné une vague description du navire qu'ils auraient pris. Un marchand a vu ce navire en mer et m'a indiqué l'endroit. @l$Pos$ Fouillez le secteur et vous trouverez peut-être un indice."
"0x23652699" = "La position est @l$Pos$. Fouillez la zone, vous trouverez peut-être un indice. Ramenez-moi ma fille saine et sauve."
"0x2365269a" = "La position est @l$Pos$. Fouillez la zone, il se peut que @F$WifeName$ essayait de nous dire quelque chose en en parlant. Ramenez-moi ma fille saine et sauve. Et si vous rencontrez ce Casanova, présentez-lui mes respects."
"0x23815ece" = "Voulez-vous vraiment quitter la partie en cours et retourner au menu principal ?"
