"0x19f413a1" = "Vous avez beaucoup plus de choses à faire dans ce scénario que dans le premier. Vous apprendrez à gagner de l'argent en faisant du commerce.<n><n>Vous apprendrez également à créer un nouveau convoi pour transporter plus de marchandises.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Suivez les instructions données dans la fenêtre Evénement."
