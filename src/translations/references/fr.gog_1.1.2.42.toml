"0xf4b68a6b" = "Félicitations ! Vous avez terminé le scénario avec succès, en capturant plusieurs villes anglaises pour la Hollande.<n><n>Vous pouvez capturer des villes de la même façon en mode de jeu libre. Mais attention, souvenez-vous que les nations dont vous voulez capturer les villes doivent être militairement faibles. De plus, la nation pour laquelle vous voulez capturer une ville doit être forte et les deux nations doivent être en guerre.<n><n>Remarque : vous obtenez souvent en récompense des terres où construire vos propres villes. Mais cette fonction a été désactivée dans ce scénario."
