"0x1f36e96b" = "Un convoi de marchandises va bientôt arriver. Un espion m'a dit que nos ennemis envisagent de l'attaquer pendant le voyage du retour vers l'Europe. Pouvez-vous assurer la sécurité du convoi ? "
"0x1f36e96c" = "J'ai un problème. Ma femme veut emprunter le prochain convoi vers l'Europe pour aller rendre visite à sa famille. Malheureusement, @n$HostileNation$ l'a appris et envisage d'intercepter le convoi. Pouvez-vous faire en sorte que le convoi ne soit pas attaqué ?"
"0x1f36e96d" = "Je dois prochainement envoyer des documents importants en Europe. Comme nous sommes actuellement en guerre avec @n$HostileNation$, je ne veux prendre aucun risque et il me faut une escorte supplémentaire. Voulez-vous escorter le convoi ?"
"0x1f6696d2" = "Je suis désolé, mais il semble que je ne peux pas vous donner cette mission finalement. Je viens de recevoir un message qui m'informe de la disparition du problème."
"0x1f851477" = "Le convoi qui devait accomplir cette mission a été détruit."
"0x1f890b43" = "Demande de marchandises"
"0x1f9a14b7" = "<n><n>Pour attaquer le repaire, vous devez y envoyer un convoi comme s'il s'agissait d'une ville. Mais attention ! Les convois pirates qui ne sont pas dans le repaire lors de l'attaque seront prévenus et installerons un nouveau repaire."
"0x1fb02f3a" = "Sauvegarder"
"0x1fcb6529" = "Fin du combat naval"
"0x1fd35f28" = "Animation"
"0x1fdba107" = " Son salaire journalier est de %1."
"0x1fe06eb2" = "Capacité<n>%1%"
"0x1fe25594" = "Après avoir percé les défenses du port, votre convoi accoste et les marins se répandent dans la ville à la recherche de la salle au trésor. En chemin, ils rencontrent le commandant des gardes de la ville qui refuse de céder le passage à moins d'être vaincu dans un duel loyal. Votre capitaine relève le défi."
"0x1fea1f37" = "Arrêter cette partie et charger la partie sauvegardée ?"
"0x1ff731c7" = "Sauvegarder la route commerciale"
"0x200d4e11" = "%1 %2 %3"
"0x20252656" = "Or découvert à %1"
"0x20413ba0" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
"0x204cf373" = "Soutenez la ville"
"0x204d1e7c" = "Un repaire de pirates ne peut être attaqué que par la mer."
"0x20574fcc" = "%1, vous avez capturé la ville chérie de mon père pour %2 ! Je ne veux plus rien avoir à faire avec vous. J'espère ne jamais vous revoir. Vous devez savoir que vous n'avez jamais compté pour moi et que je ne penserai jamais plus à vous.<n>J'espère sincèrement que tôt ou tard, vous subirez le châtiment que vous méritez.<n><n>%3"
"0x20574fcd" = "%1, en annexant la ville pour %2, vous avez forcé le vice-roi à venir s'installer dans la ville de mon père, qui est contraint de retourner en Europe.<n><n>Je ne veux plus rien avoir à faire avec vous. J'espère ne jamais vous revoir. Vous devez savoir que les marchands de l'auberge sont beaucoup plus intéressants que vous et que vous n'avez jamais compté pour moi.<n>J'espère sincèrement que tôt ou tard, vous subirez le châtiment que vous méritez.<n><n>%3"
"0x2065f070" = "Regardez. Je viens de recevoir un message de mon ambassadeur, qui m'annonce que %1 nous a proposé la paix. Cela signifie sans doute que sommes en paix à compter d'aujourd'hui.<n><n>En conséquence, je ne peux plus vous confier de mission visant à capturer une ville."
"0x207295a1" = "Une route commerciale nommée '%1' existe déjà.<n><c>Voulez-vous l'écraser ?"
"0x2077407d" = "%1,<n>je suis heureux que vous soyez venu. Entrez, je vais voir si j'ai quelque chose pour vous."
"0x207a9d35" = "Le commandant des gardes de la ville demande à parler à votre capitaine depuis les remparts. Il lui propose d'arrêter les combats et de disputer un duel contre lui. Pour éviter d'autres pertes, votre capitaine accepte."
"0x207b620f" = "Après que vos troupes aient détruit la porte de la ville, elles se retrouvent confrontées au commandant de la garde. Il défit votre capitaine en duel."
"0x2088fb2f" = "+++EMPTY+++"
"0x208aca1b" = "Recherchez les convois anglais dans la zone et détruisez-en @I$NumConvoys$."
"0x208aca1c" = "Recherchez les convois français dans la zone et détruisez-en @I$NumConvoys$."
"0x208aca1d" = "Recherchez les convois hollandais dans la zone et détruisez-en @I$NumConvoys$."
