"0xe10e4380" = "Le temps est écoulé et vous n'avez pas atteint votre objectif.<n><n>En mode de jeu libre, le vice-roi de toute nation peut vous offrir votre propre ville. Mais cela ne sera pas facile à obtenir, car vous devrez toujours capturer des villes pour avoir droit à des terres, et cela nuira forcément à votre réputation avec les autres nations. <n><n>Tout ce que vous avez appris lors de ce scénario sur le développement de votre ville vous aidera à développer vos entreprises dans d'autres villes également. La principale différence, c'est que vous n'avez pas à les défendre."
"0xe10f2f85" = "Ce sera un plaisir de faire des affaires avec vous.<n>Livrez autant de @G$Goods$ que vous le pouvez au marché de @T$TOWN$. J'y attendrai plusieurs livraisons et je vous paierai @g$Price$ sur-le-champ.<n>Le convoi expéditionnaire arrivera sur les lieux le @D$EndDate$. Faites en sorte que ce convoi arrive sain et sauf en Europe et je vous donnerai le reste de l'or."
