"0x1a2ebe80" = "Vous n'avez malheureusement pas de convoi qui le permette dans le port. Le convoi doit compter exactement 5 navires et 150 canons. Revenez quand vous aurez assemblé un tel convoi."
"0x1a3808bb" = "Le marchand s'appelle @N$Name$ et il est originaire de @T$Town$. Si vous parvenez à détruire son convoi d'ici au @D$EndDate$, je vous récompenserai royalement."
"0x1a444b3b" = "Je ne peux pas vous confier comme mission de capturer une ville ennemie, car nous ne sommes pas actuellement en guerre. Mais les choses peuvent changer très vite. Revenez me voir le cas échéant."
"0x1a444b3c" = "Nous sommes en guerre avec %1 et vous vous êtes assuré que %1 n'ait plus qu'une ville. Nous ne pouvons pas leur prendre et je ne peux donc pas vous confier comme mission de capturer une nouvelle ville.<n><n>Mais revenez si la situation change."
"0x1a444b3d" = "Je vous confierai volontiers comme tâche de capturer une ville appartenant à %1. Je dispose de suffisamment de convois militaires pour protéger toute nouvelle zone capturée.<n><n>Toutefois, %1 est encore trop forte pour une telle entreprise.<n><n>Vous pourriez aider à affaiblir %1 en détruisant ses convois militaires.<n><n>Revenez ensuite à moi et il y aura peut-être une mission pour vous."
"0x1a444b3e" = "Je vous confierai volontiers comme tâche de capturer une ville appartenant à %1. Je dispose de suffisamment de convois militaires pour protéger toute nouvelle zone capturée.<n><n>Toutefois, %1 est encore trop forte pour une telle entreprise.<n><n>Vous pourriez aider à affaiblir %1 en détruisant ses convois militaires.<n><n>Revenez ensuite à moi et il y aura peut-être une mission pour vous.<n><n><n>Vous pouvez vérifier la puissance d'une nation dans les Chroniques, sous \"Nations\"."
