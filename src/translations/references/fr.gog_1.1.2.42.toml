"0x343e9f4b" = "Félicitations ! Vous savez maintenant construire des bâtiments dans une ville.<n><n>Dès que votre plantation sera construite, elle commencera automatiquement à employer des ouvriers. Chaque colon attend au port d'être engagé et d'être converti en un ouvrier et quatre citoyens. Cela signifie dans les faits qu'un colon représente en fait une famille entière.<n><n>Pour vous assurer que vos entreprises disposent de suffisamment d'ouvriers, vous devez faire en sorte que des colons soient disponibles pour être engagés. Des convois de transport amènent des colons d'Europe dans les villes principales, puis sont ensuite convoyés dans les autres villes par des marchands.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Assurez-vous d'avoir suffisamment d'ouvriers pour votre entreprise de Santa Marta."
