"0x0adb3fdd" = "Je savais que je pouvais compter sur vous. Il s'agit de la ville de @T$TargetTown$, qui appartient à @n$HostileNation$. Attaquez la ville et pillez-la tant que vous voulez, puis retrouvez mon épouse. Ne tardez pas, je n'ai que jusqu'au @D$EndDate$ pour leur répondre.<n><n>Si vous ne possédez pas de Lettre de Marque visant @n$HostileNation$, je vous en donnerai une."
"0x0adb3fde" = "Ma femme sera ravie. Son caniche Michelle est cachée dans @T$TargetTown$. Pillez la ville pour que cela ressemble à une mission militaire, puis cherchez le chien. Vous avez jusqu'au @D$EndDate$.<n>Croyez-moi, revoir ce chien ne me fera pas vraiment plaisir, mais j'en ai assez d'entendre ma femme pleurnicher.<n><n>Si vous ne possédez pas de Lettre de Marque visant @n$HostileNation$, je vous en donnerai une."
"0x0adb3fdf" = "Nous sommes donc d'accord. Pillez @T$TargetTown$ et ramenez-moi ma fille. Son anniversaire est le @D$EndDate$ et je veux qu'elle soit rentrée d'ici là.<n><n>Si vous ne possédez pas de Lettre de Marque visant @n$HostileNation$, je vous en donnerai une."
