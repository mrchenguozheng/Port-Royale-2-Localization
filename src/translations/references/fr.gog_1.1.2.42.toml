"0x0d48f0cd" = "Partie sauvegardée invalide !"
"0x0d496e89" = "Cliquez sur les marchandises pour activer ou annuler l'achat."
"0x0d496e8a" = "Achat automatique par le gérant"
"0x0d4fbd33" = "Fort bien !<n>Pour vous assurer que vous disposerez toujours de suffisamment de matières premières pour vos tisseries, vous devriez établir une plantation de coton à Santa Marta.<n>Une plantation peut subvenir aux besoins de deux centres de production associés."
"0x0d4fbd34" = "Assurez-vous que vos entreprises de Santa Marta et de Carthagène travaillent à plein régime.<n>N'oubliez pas que vos tisseries de Carthagène ont besoin d'être continuellement fournies en coton.<n>Continuez de commercer et de vendre les marchandises que vous produisez.<n>Ce scénario prendra fin quand vous aurez gagné @g$GoldGoal$."
"0x0d552127" = "La ville ne peut pas être attaquée"
"0x0d578089" = "Vous avez déjà attaqué la ville de %1 il y a moins de 30 derniers jours. Le capitaine refuse de l'attaquer à nouveau pour des raisons d'éthique."
"0x0d58ea99" = "Le boucanier %1, %2, a capturé %3 ouvriers et leurs familles. Plusieurs entreprises de la ville ne fonctionnent plus à plein régime."
"0x0d750c45" = "%1 convois"
"0x0d919a5a" = "%1,<n>vous savez fort bien que je vous enverrais au diable dans des circonstances normales, mais en des périodes telles que celle-ci, je vendrais mon âme au diable.<n><n>Entrez, j'ai quelque chose à vous dire."
"0x0d9c1799" = "Votre mission consiste à vous assurer que la ville de @T$TargetTown$ décline et entre en état de “Récession” d'ici au @D$EndDate$. Vous avez deux solutions :<n><n>Vous pouvez attaquer la ville et piller toutes les marchandises pour faire passer l'état de la ville à “Récupération”. L'état de la ville continuera à décliner en raison de la pénurie de marchandises.<n><n>Vous pouvez sinon la couper de tout approvisionnement externe en interceptant les convois de marchandises. Remarque : si vous pillez un convoi mais que vous ne le capturez pas, votre réputation envers la nation en question souffrira moins."
"0x0d9c179a" = "Parfait ! Je vous confie la mission de faire tomber la ville de @T$TargetTown$ en état de “Récession”. Vous avez jusqu'au @D$EndDate$.<n><n>Pour y parvenir, vous devez intercepter tous les convois de marchandises qui s'y rendent pour qu'elle soit coupée de tout approvisionnement extérieur et que son état commence lentement à décliner.<n><n>Il y a une autre méthode pour y parvenir plus rapidement. Il suffit d'attaquer et de piller la ville. L'état de la ville à la suite de l'attaque chutera à “Récupération” et la pénurie de marchandises continuera à décliner jusqu'à ce que la ville soit en “Récession”."
