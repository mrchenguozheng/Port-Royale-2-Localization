"0xdfb549a4" = "Nous sommes en guerre contre %1, et notre ennemi n'a pas assez de convois militaires pour se protéger. Je veux que vous en profitiez pour capturer une de ses villes."
"0xdfb549a5" = "%1 n'a pas suffisamment de convois militaires pour protéger ses eaux ! Nous devrions y aller immédiatement pour capturer une ville !!<n>Puis-je compter sur vous ? "
"0xdfb9b5b7" = "Excellent ! Vous avez maintenant @g$Gold$.<n><n>Chaque nation a des convois militaires pour défendre ses villes et ses eaux territoriales. Plus une nation a de villes, plus elle a besoin de convois militaires pour s'assurer qu'elles sont correctement protégées.<n><n>Si une nation perd un convoi militaire, sa force militaire est affaiblie. Les convois militaires attaquant souvent des villes ou des convois ennemis en tant de guerre, une nation peut perdre régulièrement un convoi militaire. C'est pour cette raison que des convois sont régulièrement envoyés d'Europe pour renforcer la puissance militaire d'une nation au Nouveau Monde.<n><n>Vous pouvez voir l'état actuel de la puissance militaire d'une nation dans \"Nations\" dans les Chroniques. Si une nation est considérée comme faible, ses villes peuvent être capturées.<n><n>Vous devez triompher de suffisamment de convois militaires anglais pour que la puissance militaire anglaise devienne \"faible\".<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Triomphez de suffisamment de convois militaires anglais pour que l'Angleterre devienne \"faible\"."
