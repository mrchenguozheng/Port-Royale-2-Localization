"0xcdf0b227" = "Des marchands ont rejoint nos forces et nous demandent une meilleure protection dans nos eaux. Pour que l'on accède à leur demande, ils ont décidé d'arrêter d'approvisionner prochainement nos villes. Pouvez-vous intervenir pour m'aider moi et mes citoyens ?"
"0xcdf0b228" = "Une de nos villes voit sa fréquentation par les marchands considérablement baisser, tout cela à cause d'une rumeur de peste. Pouvez-vous m'aider à étouffer cette rumeur en approvisionnant en marchandises la ville ?"
"0xcdf0b229" = "Une rumeur selon laquelle la peste va se déclarer dans une de nos villes est apparue. Et pour couronner le tout, les marchands passent au large. Pouvez-vous nous aider à soutenir la ville le temps que la situation s'améliore ?"
"0xcdf0b22a" = "Un citoyen est mort de la peste il y a quelques jours dans l'une de nos villes. Nous avons essayé de le cacher, mais j'ai bien peur que cela se soit su. Maintenant de nombreux marchands ont décidé de ne plus aller dans cette ville. Vous avez une bonne flotte marchande. Pouvez-vous approvisionner la ville pour un temps ?"
"0xcdfdf758" = "Vos navires de guerre ont forcé les attaquants à s'enfuir."
