"0x184aee4b" = "Compatible"
"0x18546893" = "Dans ce scénario, vous allez apprendre à combattre en mer. Ce scénario commence par un combat d'entraînement. Par la suite, vous devrez rechercher et détruire le convoi d'un pirate.<n><n>Vous allez également rencontrer le gouverneur de Carthagène au début du scénario. Il vous aidera à prendre de l'expérience en combat et vous donnera pour mission de pourchasser un pirate.<n><n>Votre statut au début du scénario est Marin. Vous devez avoir atteint ce statut pour pouvoir demander une mission au gouverneur. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Rendez visite au gouverneur de Carthagène et accomplissez la mission qu'il vous confie."
