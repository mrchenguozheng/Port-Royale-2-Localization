"0xcb853f07" = "Votre capitaine a gagné son duel contre le commandant. Vos marins ont trouvé la salle au trésor et en sont ressortis avec %1.<n><n>Choisissez quelles marchandises vous voulez récupérer dans les entrepôts de la ville."
"0xcb8dbdae" = "Mousquetaires ennemis"
"0xcb8dd6d9" = "Notre ennemi, @n$HostileNation$, est prêt à tout. Mon épouse a été enlevée et on cherche à m'imposer des conditions pour la libérer. J'ai toutefois appris où elle est détenue. Officiellement, je ne peux rien faire, mais vous, vous pouvez attaquer la ville et me ramener mon épouse."
"0xcb8dd6da" = "Je suis content de vous voir.<n>Ma femme a reçu récemment un caniche directement de Paris. Ce satané animal est une vraie peste, mais ma femme l'adore.<n>Quelqu'un l'a appris et a kidnappé le chien, avant de le livrer à l'ennemi pour un quelconque odieux chantage.<n><n>Voulez-vous bien libérer ce caniche pour moi ?"
"0xcb8dd6db" = "Il n'y a pas longtemps, ma benjamine s'est enfuie avec un aventurier de passage, du moins à ce qu'on m'a dit. J'ai découvert qu'elle habitait maintenant à @T$TargetTown$ et qu'elle doit épouser le commandant de la ville. Je connais ma fille et elle ne ferait jamais une chose pareille de son plein gré ! Je ne peux pas demander au vice-roi d'attaquer une ville pour sauver ma fille, mais vous, vous pourriez la sauver."
