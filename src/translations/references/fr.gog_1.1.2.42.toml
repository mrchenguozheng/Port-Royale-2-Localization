"0x17328849" = "inconnu"
"0x1733ed83" = "Dans ce scénario, le vice-roi espagnol vous offre des terres où vous pourrez construire votre propre ville. L'Objectif, c'est de vous assurer que l'économie de votre ville devienne florissante.<n:25>Toutefois, avant de bénéficier de vos terres, vous devez améliorer votre réputation auprès de l'Espagne et capturer des villes au nom du vice-roi espagnol."
