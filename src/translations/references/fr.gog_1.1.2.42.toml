"0xe8b8c0e4" = "%1 pillé par %2"
"0xe8d7e960" = "%1,<n>nous nous connaissons depuis longtemps maintenant et mon coeur vous désire vous et rien que vous. Pourquoi ne demandez-vous pas ma main ?"
"0xe8d7e961" = "%1,<n>je dois vous parler d'une chose importante. Mon père ne souhaite rien de plus que me marier avec un gentilhomme noble. Mais mon coeur vous appartient. Voulez-vous bien demander ma main ?"
"0xe8d7e962" = "%1,<n>mon coeur bondit de joie à chaque fois que nous nous voyons. Mais mon père menace de me marier à je-ne-sais quel noble. Vous êtes le seul à pouvoir m'éviter ce cruel destin. Ne voulez-vous pas demander ma main ?"
