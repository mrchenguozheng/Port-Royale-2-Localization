"0xd92d797c" = "Un marchand d'une nation différente a embrigadé un nombre considérable d'ouvriers. Ces ouvriers ont quitté la ville avec leurs familles.<n><n>Maintenant votre tâche est de recruter assez de colons pour que chaque entreprise puisse avoir le nombre maximum d'ouvriers avant le @D$EndDate$.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Le nombre de citoyens (les habitants moins les soldats) doit être porté à @I$Pop$ avant le @D$EndDate$."
