"0xf353a9cf" = "Salutations ! Possédez-vous un navire ? J'ai perdu le mien lors d'une récente tempête. Par chance, j'ai réussi à m'en sortir. Mais j'ai perdu une cassette qui contenait plusieurs effets personnels d'une grande valeur, pour moi. Pourriez-vous aller voir si ma cassette ne serait pas encore récupérable ? Je vous récompenserai magnifiquement, car cette cassette a beaucoup de valeur à mes yeux."
