"0xe5483876" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>BGS<f:fonts/Tiepolo_bold14x14aaFH.res><t>Sélectionner une unité<n><f:fonts/Tiepolo_black14x14aaFHk.res>BDS<f:fonts/Tiepolo_bold14x14aaFH.res><t>Envoyer une unité<n><f:fonts/Tiepolo_black14x14aaFHk.res>1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Sélectionner une unité"
