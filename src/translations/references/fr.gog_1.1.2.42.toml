"0xc58b0f44" = "Merci de m'avoir fait cette faveur.<n><n>Maintenant, notre contrat. Le vieux capitaine s'appelle @N$TeacherName$ et il s'est retiré pas très loin d'ici.<n><n>@l$TeacherPos$<n><n>Cherchez le long de la côte ici et vous le trouverez.<n><n>Apportez @a$Amount$ de rhum avec vous sinon il ne vous aidera pas."
