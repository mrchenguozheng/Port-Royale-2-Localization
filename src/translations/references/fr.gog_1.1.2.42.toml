"0x293d8c9f" = "Excellent ! Votre ville est maintenant assez grande. Bientôt, les premiers marchands viendront échanger leurs marchandises.<n><n>Mais elle risque également d'attirer l'attention d'autres personnes, moins désirables. Il peut notamment s'agir de pirates, ou de boucaniers à la solde d'une nation qui ne vous aime pas. Vous allez donc devoir engager des soldats et mettre en place des canons.<n><n>Fort heureusement, les citoyens de votre ville savent s'organiser seuls. Vous n'avez qu'à leur donner les instructions nécessaires et acheter les matériaux. Après, cela ne vous coûtera plus rien.<n><n>Vous pouvez construire des canons portuaires dans le menu de construction et engager des soldats au palais.<n><n>Souvenez-vous :<n>les soldats ont besoin d'un endroit pour vivre ! Mais à la différence des ouvriers, ils ne comptent que pour 1.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construisez cinq canons portuaires et engagez 300 soldats."
