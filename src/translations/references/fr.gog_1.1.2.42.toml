"0x15d8bad1" = "Parfait ! La ville en question est @T$TargetTown$. Pour les mettre à genoux, le vice-roi de @n$TargetNation$ a interdit à tous les marchands de se rendre dans cette ville. Si nous parvenions à restaurer sa richesse en l'approvisionnant, nous pourrons certainement compter sur l'allégeance des citoyens. Vous avez jusqu'au @D$EndDate$ pour accomplir cette mission."
"0x15d8bad2" = "Je parle de la ville de @T$TargetTown$. Aucun marchand n'a la permission de se rendre dans cette ville. Votre mission consiste à la ravitailler pour lui rendre sa prospérité. Ainsi, nous prouverons notre intérêt pour @T$TargetTown$. Vous avez jusqu'au @D$EndDate$ pour accomplir cette mission."
"0x15d8bad3" = "L'affaire est la suivante : le vice-roi a interdit à tous les marchands de se rendre dans la ville de @T$TargetTown$. Il compte ainsi faire pression sur le conseil de la ville. Si vous parvenez à ravitailler @T$TargetTown$ avec suffisamment de marchandises pour que sa prospérité soit rétablie avant le @D$EndDate$, je n'ai aucun doute sur mes capacité à organiser un changement d'allégeance pacifique."
"0x15e96b4c" = "Sauvegarder"
"0x15f470e9" = "Terminer le combat naval"
"0x15f6d04b" = "Vous avez gagné le combat naval. Voulez-vous cesser l'attaque ?"
"0x15fd96d6" = "Vous avez acheté un permis de construire et vous pouvez maintenant l'utiliser dans cette ville. Votre première construction doit être un entrepôt.<n><n>Note : plus vous avez de permis de construire, plus le suivant sera cher plus vous aurez de mal à améliorer votre réputation commerciale dans les autres villes."
"0x1605422d" = "Repaire"
"0x161f0ab3" = "Statut"
"0x1629fb20" = "%1,<n>vous revoilà. Venez, j'ai des nouvelles pour vous."
"0x1629fb21" = "%1,<n>vous n'êtes pas parti longtemps. N'avez-vous rien d'autre à faire ?"
"0x1629fb22" = "%1,<n>je ne pensais pas vous revoir si vite. Je crains de n'avoir rien à vous dire de nouveau pour l'instant."
"0x162a5cb6" = "Cache de marchandises"
"0x163fff71" = "%1,<n>un plaisir de vous voir. Dois-je vous informer des dernières nouvelles ?"
"0x163fff72" = "%1,<n>c'est un plaisir de vous revoir. Ces derniers jours, j'ai posé des questions et j'ai peut-être des informations pour vous."
"0x163fff73" = "%1,<n>vous revoilà, je suis contente de vous voir. Je crois que j'ai des informations pour vous."
"0x165603c2" = "%1,<n>cela faisait longtemps, mais je suis heureuse de vous voir. J'ai des nouvelles pour vous."
"0x165603c3" = "%1,<n>j'allais partir rendre visite à quelqu'un, car j'avoue que je m'ennuie par ici. Mais comme vous êtes ici. Venez, j'ai quelque chose à vous dire."
"0x165603c4" = "%1,<n>vous voilà, je me demandais où vous étiez passé. J'ai des nouvelles pour vous."
"0x1659b12c" = "Vous avez maintenant assez d'or pour augmenter la puissance de feu de votre convoi. Regardez dans les chantiers navals des villes principales pour y acheter le navire le plus puissant que vous pouvez acheter.<n><n>Ajoutez ensuite ce navire à votre convoi, achetez des canons et recrutez des marins. Si vous n'avez pas assez d'or, continuez de commercer.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Augmentez la puissance de feu du convoi pour qu'il dispose d'au moins 90 canons."
"0x165fc28e" = "Allez dans votre nouvelle ville et construisez un chantier naval."
