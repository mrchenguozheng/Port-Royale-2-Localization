"0xe4233be0" = "Dans ce scénario, vous devez aider les colonies hollandaises à acquérir de nouvelles villes.<n:25>Vous commencez le scénario avec un convoi bien armé et un capital de départ important. En capturant des navires marchands anglais, vous gagnerez des trésors qui vous permettront de mieux équiper votre convoi.<n:25>Par la suite, votre convoi attaquera des convois militaires anglais pour affaiblir les défenses anglaises et vous pourrez capturer leurs villes."
