"0xda75935c" = "Capture d'une ville"
"0xda93dbe1" = "Très bien ! Ce n'était pas un mince exploit ! L'Angleterre a perdu tellement de convois militaires que ses villes peuvent être capturées. En reconnaissance de vos services, le gouverneur des îles Turk vous a confié quatre carracks supplémentaires.<n><n>Vous ne pouvez capturer des villes qu'au nom d'un vice-roi. Le vice-roi ne vous donnera l'ordre de capturer une ville que si sa nation est forte et la nation ennemie est faible.<n><n>Malheureusement, la Hollande n'est pas assez forte pour capturer une ville. Toutefois, vous pouvez aider à y remédier : rendez visite au vice-roi de Grand Bahama et offrez-lui un de vos convois. Il mettra sur pied un nouveau convoi militaire, ce qui augmentera la puissance militaire hollandaise.<n><n>Si vous voulez donner un convoi à un vice-roi, ce convoi doit se composer exactement de 5 navires et de 150 canons.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Aidez le vice-roi à augmenter la puissance militaire hollandaise. Acceptez ensuite une mission visant à capturer des villes en son nom."
"0xdab4fea7" = "Bâtiments résidentiels"
"0xdac43b47" = "Manque de colons"
"0xdacb8ff6" = "Qualité de vie dans votre ville"
"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "Bouton"
"0xdaeb0484" = "Cette fois, vous commencez le scénario à Carthagène, une ville principale au coeur des Caraïbes. <n>Votre convoi, constitué d'un sloop, est dans le port.<n>Vous devez d'abord armer votre convoi, puisque vous allez combattre. <n>Allez sur les docks et ouvrez le menu Cargaison."
"0xdaeb0485" = "Comme vous pouvez le voir, vous n'avez ni canon, ni munitions à bord. Vous devez également trouver un équipage.<n>Engagez autant d'hommes que possible et ajoutez autant de canons que vous le pouvez, ainsi que 10x10 unités de chacun des trois types de munitions disponibles.<n>Vous risquez de ne pas avoir assez de place dans votre convoi, n'hésitez donc pas à vendre certaines des marchandises qui sont à bord."
"0xdaeb0486" = "Parfait ! Votre convoi est armé et paré au combat.<n>Il se trouve justement que le gouverneur de Carthagène a la mission parfaite pour vous.<n>Cliquez sur le bâtiment du gouverneur et acceptez sa mission."
"0xdaeb0487" = "Les gouverneurs proposent souvent des missions qui permettent d'améliorer votre réputation auprès de leur nation lorsque vous les accomplissez.<n>Vous pouvez également demander aux gouverneurs des Lettres de marque, ou réclamer des rançons pour les boucaniers que vous avez capturés.<n>Utilisez maintenant votre convoi pour trouver les navires dont vous a parlé le gouverneur."
"0xdaeb0488" = "Très bien, vous avez localisé le convoi.<n>L'étape suivante consiste à préparer votre navire pour l'action et engager le combat. Pour cela, ouvrez la liste des navires de votre convoi et sélectionnez votre sloop. Pour le faire basculer en mode navire de guerre, cliquez sur le bouton à côté du canon. Vous pouvez maintenant \"attaquer\" le convoi en cliquant dessus avec le bouton droit de la souris."
"0xdaeb0489" = "Voici la vue de combat naval de Port Royale.<n>Vous y voyez votre navire et les navires abandonnés en faisant défiler la fenêtre.<n>Désactivez la pause et entraînez-vous à naviguer en utilisant le bouton droit de la souris. La fenêtre d'événement affiche la direction du vent et du navire lors des combats navals."
"0xdaeb048a" = "Tous les navires qui participent au combat sont présentés en bas de l'écran. Vous pouvez y choisir les munitions à utiliser. Sélectionnez les boulets lourds et coulez un des navires ennemis.<n>Vous pouvez tirer en utilisant le bouton gauche de la souris, mais seulement lorsque votre navire est dans la bonne position de tir. Les cibles sont alors affichées en rouge."
"0xdaeb048b" = "Parfait ! Lancez l'abordage contre le second navire.<n>Pour cela, cliquez sur le bouton \"Aborder\" en bas à droit de l'icone du navire.<n>Approchez alors du navire ennemi et rentrez-lui dedans. Remarque : la touche F1 est également active lors des combats navals."
"0xdaeb048c" = "D'habitude, le navire ennemi dispose d'un équipage et un combat se déroule alors à bord du navire entre les deux équipages.<n>Lorsque la bataille est terminée, tous les navires qui ont été abordés tombent sous la coupe du vainqueur.<n>Ajoutez le navire ennemi à votre convoi et fermez la fenêtre de Transfert."
"0xdaeb048d" = "Excellent !<n>Renvoyez votre convoi à Carthagène."
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "Un convoi du pirate %1 a attaqué un marchand de %2."
"0xdb0108d5" = "Tout d'abord, achetez un nouveau navire. Retournez au chantier naval et achetez un navire avec autant de canons que possible."
"0xdb0108d6" = "Sélectionnez votre convoi et cliquez sur le port avec le bouton droit de la souris pour ajouter le nouveau navire au convoi."
"0xdb0108d7" = "Tous les convois se composent de navires marchands et de navires d'escorte.<n>Si un des navires du convoi doit participer à une bataille, vous devez le définir comme étant un navire de guerre. <n>Ouvrez la liste des navires du convoi pour voir tous les navires."
"0xdb0108d8" = "La liste des navires présente tous les navires du convoi. L'état Navire de guerre est indiqué dans l'angle supérieur droit du navire. Si un canon est affiché, le navire est en état navire de guerre et il participe aux batailles. Cliquez à cet endroit pour changer l'état du navire.<n>Pour l'instant, sélectionnez votre nouveau navire. "
"0xdb0108d9" = "Les caractéristiques du navire, comme sa cargaison maximale, sont présentées comme au chantier naval.<n>Vous pouvez également voir le coût de maintenance quotidien du navire.<n>Transformez le navire en navire de guerre en cliquant sur le canon."
"0xdb0108da" = "Parfait !<n>Les canons et les marins sont toujours répartis en nombres égaux dans les navires d'escorte d'un convoi.<n>Assurez-vous que les navires d'escorte ont autant de canons et d'équipage que possible, puis retournez voir le gouverneur et acceptez la nouvelle mission qu'il vous confie."
"0xdb0108db" = "Accomplissez la mission que vous a donnée le gouverneur. "
"0xdb0108dc" = "Sélectionnez le navire que vous voulez contrôler lors du combat naval dans vos navires d'escorte.<n><n>Vous pouvez changer de navire contrôlé à tout moment en le sélectionnant dans la liste.<n><n>Mais attention : dès que le combat commence, vous ne pouvez sélectionner qu'une seule fois chaque navire !"
"0xdb0108dd" = "Excellent ! Vous avez détruit le convoi pirate.<n><n>Retournez voir le gouverneur de Carthagène parce que votre mission vous y oblige.<n><n>Remarquez que vos missions sont automatiquement enregistrées dans le journal. Vous pouvez y voir les détails de votre mission à tout moment si nécessaire."
