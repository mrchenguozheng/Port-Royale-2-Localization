"0x0a49c903" = "Félicitations, vous avez terminé le deuxième scénario ! Vous avez appris à gagner de l'argent en commerçant, vous avez atteint un statut plus élevé et vous avez créé un nouveau convoi en engageant un capitaine.<n><n>Remarquez que plus les capitaines sont expérimentés, plus ils sont chers. La plupart du temps, ils sont assez peu expérimentés, mais au fil du temps, ils gagnent de l'expérience en naviguant, en combattant ou en commerçant, en fonction de ce que vous leur demandez de faire. Vous pouvez voir l'expérience de vos capitaines en observant l'Aperçu d'un convoi. Pour cela, cliquez sur un convoi et cliquez sur le bouton \"Aperçu et coûts\".<n><n>Dans le prochain scénario, vous allez établir vos propres entreprises et produire des marchandises."
