"0xeeced82e" = "Ha, @s$USER$, en Europe, @n$Nation$ manque cruellement de @G$Goods$. J'organise en conséquence une expédition vers l'Europe. J'achèterai autant de @G$Goods$ que vous pourrez m'en offrir au prix de @g$FullPrice$. Cela vous intéresse-t-il ?"
