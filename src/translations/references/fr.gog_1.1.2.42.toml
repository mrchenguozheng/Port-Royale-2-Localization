"0x19b399ce" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Fermer la fenêtre/<n><t>Options menu<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>Avance rapide<n><f:fonts/Tiepolo_black14x14aaFHk.res>Maj<f:fonts/Tiepolo_bold14x14aaFH.res><t>Centrer le convoi<n><f:fonts/Tiepolo_black14x14aaFHk.res>Verrou maj<f:fonts/Tiepolo_bold14x14aaFH.res><t>Centrer on/off<n><f:fonts/Tiepolo_black14x14aaFHk.res>Touches flèches<f:fonts/Tiepolo_bold14x14aaFH.res><t>Se déplacer<n><t>Afficher la fenêtre<n><f:fonts/Tiepolo_black14x14aaFHk.res>Ctrl + 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Sauvegarder le convoi<n><f:fonts/Tiepolo_black14x14aaFHk.res> 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Retrouver le convoi<n><f:fonts/Tiepolo_black14x14aaFHk.res> Tab<f:fonts/Tiepolo_bold14x14aaFH.res><t>Convoi suivant<n><f:fonts/Tiepolo_black14x14aaFHk.res>+ / -<f:fonts/Tiepolo_bold14x14aaFH.res><t>Vitesse du jeu<n><f:fonts/Tiepolo_black14x14aaFHk.res>F5 <f:fonts/Tiepolo_bold14x14aaFH.res><t>Sauvegarde rapide<n><t> (indisponible pendant les batailles)"
