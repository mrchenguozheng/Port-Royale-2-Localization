"0x37d00ed9" = "Vous devriez avoir des défenses suffisantes pour l'instant. Développez la ville de nouveau, en construisant une église et d'autres centres de production et des zones résidentielles pour attirer plus de 2200 habitants dans la ville.<n><n>Vous avez jusqu'au @D$EndDate$, après quoi le scénario s'arrête.<n><n>N'oubliez pas de vendre les marchandises produites pour en tirer un profit ! <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Construisez une église et augmentez les population de la ville pour qu'elle dépasse 2200 habitants. Vous avez jusqu'au @D$EndDate$."
