"0x070bef26" = "Général"
"0x070c60f9" = "Je vous remercie. Ramenez-moi @a$Amount$ de @G$Goods$. Vous avez jusqu'au @D$Date$ pour livrer ces marchandises au marché. Vous y toucherez @g$GoldPerBarrel$ pour chaque <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fa" = "Livrez @a$Amount$ de @G$Goods$ à mes émissaires au marché. Vous avez jusqu'au @D$Date$. A la livraison, vous toucherez @g$GoldPerBarrel$ pour chaque <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fb" = "Allez dans des villes appartenant à @n$FoeNation$ et trouvez du @G$Goods$. Livrez-en @a$Amount$ au marché de ma ville d'ici au @D$Date$. Vous toucherez @g$GoldPerBarrel$ pour chaque <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x0710eed4" = "<n><n>Le scénario est fini quand vous fermez cette fenêtre."
"0x0711985e" = "Pirate manchot"
"0x07124c09" = "Objectifs du scénario non achevés"
"0x07242fbe" = "Ouvrier"
"0x07246168" = "Réparer"
"0x072a9579" = "je vous suis très reconnaissant de m'avoir ramené ces marchandises, car nous autres du Nouveau Monde ne recevons aucun ravitaillement de ma nation depuis déjà plusieurs semaines. En récompense, je vous offre deux Flûtes marchandes hollandaises. Elles vous attendent au port."
"0x0744a699" = "Je ne peux pas vous dire combien d'autres villes la flotte du trésor a visitées. Tout ce que je peux vous dire, c'est qu'à chaque fois qu'elle visite une ville elle amasse plus d'or dans ses cales. Vous attaquez quand vous voulez, et vous pouvez garder l'or. Tout ce que je vous demande c'est de vous assurer que la flotte du trésor disparaisse. Elle était à @T$StartTown$, et sa prochaine escale sera dans le port de @T$DestTown$, où l'ancre sera jetée pour à peu près cinq jours."
"0x0744a69a" = "Donc vous devez agir vite. Elle était à @T$StartTown$, de là elle va aller à@T$DestTown$, où elle va jeter l'ancre plus longtemps que d'habitude. Plus vous retardez l'attaque, plus d'or elle aura à son bord. Vous pouvez garder le tout, mais la flotte du trésor ne doit plus jamais revenir en Europe."
"0x0744a69b" = "C'est d'accord alors, merci. Si mes informations sont exactes, la flotte du trésor a récemment quitté @T$StartTown$ et est en chemin pour @T$DestTown$. Elle va y jeter l'ancre plus longtemps que d'habitude. Maintenant, pressez vous pour l'intercepter !"
"0x0746253d" = "Si vous voulez voir autant de marchands venir dans votre ville que possible, vous devriez ne pas ravitailler du tout la ville avec certaines marchandises. Choisissez dans l'idéal des marchandises produites par les villes proches, car les marchands prennent la distance en considération.<n><n>Les marchands qui visitent la ville achètent automatiquement les marchandises en abondance (et dont le prix est bas). Vous pouvez également vendre directement les marchandises produites par la ville. Tant que ces marchandises ne sont pas plus chères que celles des autres villes, elles seront régulièrement achetées par des marchands.<n><n>L'avantage, c'est qu'il y aura toujours des marchandises pour vos citoyens et que vous n'aurez pas à transporter vous-même les marchandises dans d'autres villes."
