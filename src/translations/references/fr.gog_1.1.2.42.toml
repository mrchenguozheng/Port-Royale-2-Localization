"0x2e39d24e" = "Je vois que vous êtes un homme aisé, %1.<n><n>En temps normal, je vous demanderai un prêt, mais malheureusement, je réserve cet honneur aux marchands locaux. Si vous pouviez produire un permis de construire dans cette ville, les choses pourraient changer."
