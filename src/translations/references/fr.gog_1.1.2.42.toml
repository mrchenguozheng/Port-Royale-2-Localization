"0x39e32dc6" = "Merci. La ville en question s'appelle @T$TargetTown$. J'espère pouvoir faire un arrangement avec les marchands avant le @D$EndDate$. Avant cela la ville doit atteindre le statut \"Boum\", comme cela je serai en position de force pour négocier."
"0x39e32dc7" = "La ville en question est @T$TargetTown$. Approvisionnez la ville avec toutes les marchandises dont elle a besoin. Je ferai mon maximum pour étouffer la rumeur avant le @D$EndDate$ une fois pour toutes. Mais avant, la ville ne doit pas descendre en dessous du statut \"Boum\"."
"0x39e32dc8" = "La ville en difficulté est @T$TargetTown$. Son statut ne doit pas descendre en dessous de \"Boum\" avant le @D$EndDate$, autrement trop de citoyens quitteront la ville. Il y a aussi un grand risque que la peste s'y déclare. Vous devez assurer l'approvisionnement de la ville pour éviter cela !"
"0x39e32dc9" = "Bien. @T$TargetTown$ est la ville en question. Approvisionnez la ville pour tout ce dont elle a besoin jusqu'au @D$EndDate$. Son statut ne doit pas descendre en dessous de \"Boum\". Je dois être honnête avec vous, il y a un grand risque que la peste se déclare en ville. Préparez-vous à cette éventualité."
"0x39e7361e" = "%1 vaincu"
"0x39e9081a" = "Vous avez découvert l'emplacement du repaire de Barbe Noire. Pour en savoir plus sur les pirates, cliquez sur le symbole du repaire dans la carte.<n><n>Attention : quand vous détruisez un repaire, le gang est éliminé, mais si des convois pirates n'étaient pas dans le repaire, ils en sont informés et vont s'installer dans un nouveau repaire.<n><n>Votre premier objectif est donc de détruire tous les convois appartenant au repaire. Dans l'idéal, vous devriez attendre un peu, pour surprendre les convois qui entrent et sortent du repaire et les détruire.<n><n>Vous avez reçu un peu d'argent pour vous aider dans votre quête.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Détruisez tous les convois de Barbe Noire qui sont actuellement en mer. N'attaquez pas son repaire !"
