"0x132a8a31" = "%1 a lancé %2 le boucanier dans des missions de sabotage contre nos villes. Il vient d'attaquer %3, et il retourne actuellement vers son port d'attache. Vous me rendriez un grand service si vous mettiez fin aux agissements de ce boucanier."
"0x132a8a32" = "Je viens juste d'apprendre que le boucanier %1 avait récemment quitté %2 pour attaquer une de nos villes. J'espère que nous pourrons l'arrêter avant qu'il ne frappe. "
"0x132a8a33" = "Suivant les ordres de %2, le boucanier %1 s'apprête à attaquer nos villes. J'ai appris qu'il était à %3 pour préparer sa prochaine attaque."
"0x132e00ca" = "Je suis ravi ! A compter de ce jour, la hache de guerre est enterrée entre nous."
"0x13385f0f" = "Bon travail ! Avec votre Lettre de marque, vous êtes maintenant officiellement au service de la Hollande et en guerre contre l'Angleterre. Cela signifie que vous pouvez attaquer les navires marchands anglais sans que votre réputation auprès de la Hollande, de la France et de l'Espagne n'en souffre.<n><n>Evidemment, votre réputation avec l'Angleterre en sera perturbée et quand vous serez dans les eaux anglaises, méfiez-vous des convois militaires qui vous poursuivront !<n><n>Les villes anglaises sont toutes situées au sud-est des îles Turk. Voguez dans cette direction avec votre convoi et cherchez des convois à attaquer. Revendez le butin et les petits navires pour augmenter votre richesse.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Capturez trois convois marchands anglais : abordez leurs navires et ajoutez-les à votre convoi."
"0x133e8429" = "et le port est suffisamment défendu."
"0x13475956" = "Gestion du bêta test"
"0x13493847" = "Le convoi est en réparation et ne peut être envoyé quelque part.<n>Voulez-vous interrompre la réparation du convoi ?<n>Vous ne récupérerez pas votre or !"
"0x13601073" = "Merci de m'avoir amené les documents. En récompense, je vous offre une Pinasse. Vous la trouverez au port."
"0x13601074" = "Je vous remercie pour votre aider et pour avoir ramené mes journaux. En récompense, je vous offre une Pinasse. Vous la trouverez au port."
"0x13601075" = "Merci de m'avoir amené les documents. En récompense, je vous offre une Pinasse. Vous la trouverez au port."
