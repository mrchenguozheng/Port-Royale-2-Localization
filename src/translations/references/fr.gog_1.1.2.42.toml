"0xcff9644a" = "Le \"Pirate manchot\" est un jeu de chance qui se joue avec 32 cartes. Chaque joueur mise et reçoit 5 cartes, qu'il est le seul à voir.<n><n>Tout d'abord, chaque joueur annonce le nombre de points qu'il compte faire, chaque pli vaut un point. Le joueur qui annonce le plus grand nombre de points commence la partie et décide de la couleur d'atout. Il doit tenter de réaliser le nombre de points qu'il a annoncé.<n><n>Le joueur qui commence abat sa première carte et les autres joueurs doivent jouer une carte de la même couleur, s'ils le peuvent. Le joueur qui pose la carte la plus forte marque le point.<n><n>Si le joueur ne peut pas jouer la couleur demandée, il peut jouer la couleur d'atout ou se défausser d'une carte.<n><n>L'ordre des cartes est le suivant : I, II, III, IV, le Pirate, la Promise, le Gouverneur et le Perroquet. Un atout est plus fort que toutes les autres cartes.<n><n>Le joueur qui remporte le pli, relance la partie. La partie continue jusqu'à ce qu'un joueur remplisse son pari et gagne.<n><n>Si le meneur réussit à faire le nombre de points annoncés, il gagne et remporte la mise, sinon l'adversaire est victorieux."
"0xcffb6ca7" = "Protégez la route"
