"0xef9ba866" = "Robert Andreas Drude"
"0xefbbbbe9" = "Il est maintenant temps de trouver le repaire de Barbe Noire et de mettre un terme à ses actes barbares. Lorsqu'un pirate est en activité depuis un certain temps, son repaire sera forcément découvert. Vous pouvez également influer sur la vitesse de cette découverte : en effet, un convoi pirate va toujours retourner à son repaire pour y déposer son butin et réparer.<n>Si vous suivez un de ces convois sur la carte et que vous voyez où il disparaît, vous avez probablement trouvé son repaire. Lorsque vous avez découvert le repaire, vous pouvez le détruire en l'attaquant par la mer comme si vous attaquiez une ville.<n><n>Conseil :<n> @l$IslandPos$ Attendez qu'un convoi approche et observez-le disparaître dans son repaire.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Localisez le repaire de Barbe Noire."
