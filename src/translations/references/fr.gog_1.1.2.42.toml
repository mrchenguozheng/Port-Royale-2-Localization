"0x24695110" = "Merci. Je suis un marchand de @T$Town$. Mes poursuivants ne savent pas où je me cache, et ils tenteront probablement de me retrouver dans ma ville d'origine. Commencez vos recherches là-bas et éliminez les chasseurs de primes. Je dois partir d'ici au plus tard le @D$EndDate$. Si vous accomplissez cette mission avant cette date, je vous paierai @g$Reward$."
"0x24695111" = "Je dois rentrer à @T$Town$ de toute urgence, car j'y ai une affaire pressante. Malheureusement, toutes les routes menant à @T$Town$ sont surveillées par un chasseur de primes, que vous devez tuer. Je vous récompenserai avec @g$Reward$ si vous accomplissez cette mission avant le @D$EndDate$."
"0x24695112" = "Merci ! Je pense qu'un chasseur de primes surveillent l'entrée du port de @T$Town$.<n>Voilà ce que nous allons faire : je vais répandre la rumeur selon laquelle je serais sur un de vos navires, puis vous partirez pour @T$Town$ et verrez ce qui se passe.<n>Faites-moi votre rapport avant le @D$EndDate$ et je vous récompenserai avec @g$Reward$."
"0x246aece6" = "%1: Famine"
"0x2478c95f" = "Félicitations ! Vous avez terminé ce scénario et vous avez débarrassé les Caraïbes d'un infâme pirate.<n><n>Au cours de la partie, vous découvrirez des repaires de pirates. Le nombre de convois pirates dépend directement du succès de leurs raids. Remarquez que les pirates s'intéressent surtout aux convois marchands et évitent les convois militaires. C'est pour cette raison qu'ils évitent les eaux où il y a trop de convois militaires.<n><n>Vous pouvez également pourchasser des pirates et détruire leurs repaires en mode de jeu libre. "
"0x24802954" = "%1: Navire coulé"
"0x2487ab5c" = "Bilan"
