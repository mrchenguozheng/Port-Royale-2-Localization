"0xd4cd0f3d" = "Henry Avery est un parfait exemple de pirate qui a réussi. Il a capturé les navires les plus riches de son temps, tout en évitant les autorités et il a vécu suffisamment longtemps pour profiter de ses richesses.<n><n>La jeunesse d'Avery est voilée de mystère. On sait toutefois qu'en juin 1694, il était membre de l'équipage d'un corsaire nommé Charles, qui avait reçu des Espagnols la permission de capturer des navires appartenant à la colonie française de Martinique, dans les Antilles. Un jour, il mena un groupe de mutins et s'empara du navire, un rapide navire corsaire armé de 46 canons, idéal pour la piraterie et renommé Fancy. En 1695, il parvint à accomplir son plus grand exploit : le pillage de la flotte au trésor indienne. Allié à plusieurs autres pirates, il attaque une flotte de gallions indiens lourdement armés et à capturer deux navires. Ces navires appartenaient au Grand Mogul en personne et étaient chargés de trésors incroyables. <n><n>Après avoir payé le gouverneur des Bahamas pour qu'il offre sa protection aux pirates, Avery paya son équipage qui se dispersa autour du monde. Certains furent capturés en Angleterre, mais Avery partit en Irlande, où il disparut sans laisser de traces. La légende veut qu'il profita discrètement de sa fortune."
"0xd4cd0f3e" = "L'un des pirates les plus célèbres de tous les temps est sans doute Edward Teach (mort en 1718), alias Barbe Noire, dont le trait marquant, comme l'indique son nom, était sa terrifiante barbe noire. Disposant d'un équipage de 300 hommes et d'un navire marchand hollandais converti, le Queen Anne’s Revenge, il n'hésitait pas à s'attaquer aux navires de guerre de la marine royale anglaise.<n><n>Pendant 18 mois, Teach, qui était né à Bristol, sema le chaos dans le nord des Antilles et tout le long de la côte de l'Amérique du Nord. Il parvenait toujours à se réfugier aux Bahamas ou en Caroline du Nord, régions d'une grande pauvreté.<n><n>Barbe Noire est d'autant plus célèbre qu'il répondait à tous les stéréotypes du boucanier : terrifiant, colérique et violent. On dit qu'il aurait massacré son canonnier Israel Hands en l'abattant de deux balles, juste pour rappeler au reste de l'équipage que c'était lui le chef.<n><n>Il finit par trépasser en 1718 lorsque le chasseur de pirates Robert Maynard pista son sloop. Bien qu'il ait été complètement saoûl, Teach combattit comme un démon et ne fut vaincu qu'au terme d'un terrible combat. Il fut tué durant la bataille et la plupart des survivants de son équipage furent pendus."
"0xd4cd0f3f" = "Ceux qui voulaient accroître leur richesse dans les premières années de l'Age de la Découverte investissaient le plus souvent dans des plantations de cannes à sucre, qui s'étaient beaucoup développées dès le début du 16e siècle, notamment dans les Caraïbes.<n><n>En moyenne, ces investissements avaient un rendement d'environ 10 pourcent, et dans les meilleurs cas (comme à la Barbade aux environs de 1650) jusqu'à 50 pourcent ! Evidemment, ces plantations nécessitaient beaucoup de bras et des centaines de milliers d'esclaves furent envoyés d'Afrique. Il faut dire que l'homme blanc avait pratiquement complètement exterminé les populations indigènes. <n><n>Les Européens ne pouvaient pas endurer le climat torride et de plus, ils se seraient sentis indignés de faire le travail réclamé aux esclaves. Même les propriétaires des plantations préféraient vivre à Londres ou à Madrid et ils laissaient à quelques hommes de confiance le soin d'organiser le travail dans les colonies. Au 18e siècle, dans certaines îles, les noirs représentaient jusqu'à 90 pourcent de la population !"
"0xd4cd0f40" = "Ce commerce de \"l'ébène\" avait déjà commencé au début du 16e siècle. Les marchands d'esclaves se procuraient leur \"marchandise\" le long des côtes de l'Afrique de l'ouest, entre le Sénégal et ce qu'on appelle aujourd'hui le Cameroun. Non seulement cette zone était parfaitement située pour les marchands, mais elle possédait également une infrastructure sociopolitique et économique stable. En clair, les marins ne devaient pas partir à la recherche d'esclaves eux-mêmes, mais ils les achetaient directement aux chefs locaux ou à d'autres marchands d'esclaves.<n><n>Les \"marchandises\" les plus recherchées étaient les jeunes hommes de 15 à 35 ans, destinés au dur labeur dans les plantations. Environ un esclave sur cinq ne survivait pas à la traversée, qui pouvait durer jusqu'à six semaines. Certains mourraient des traitements barbares que leur infligeaient leurs maîtres, d'autres périssaient dans des accidents en mer. En raison de ce fort taux de mortalité, les marchands d'esclaves cherchaient à maximiser les profits réalisés à chaque voyage en entassant autant d'esclaves que possible dans leurs navires. Pendant des semaines, les pauvres hères étaient là, comme des sardines en boîte, enchaînés les uns aux autres, dans le noir et pratiquement sans air à respirer.<n><n>Dans de telles conditions, il est même surprenant qu'autant survécurent à ces voyages !"
"0xd4cd0f41" = "Bien qu'il n'y ait pas eu d'esclaves blancs en Amérique du Nord ou en Amérique Centrale, de nombreux Européens travaillaient dans des conditions similaires à celles des esclaves.<n><n>De nombreux jeunes gens (principalement issus des milieux les plus défavorisés) voulaient émigrer mais n'avaient pas assez d'argent pour payer la traversée. Ils empruntaient alors l'argent nécessaire pour payer le voyage, et ils devaient rembourser cette dette en travaillant un certain temps dans une plantation de cannes à sucre (ou équivalent).<n><n>Mais cet arrangement parfaitement logique était piégé : la plupart des propriétaires de plantation épuisaient ces ouvriers autant que possible durant leur période de contrat. Il faut ajouter un climat que la plupart des Européens ont un grand mal à supporter.<n><n>Ce système de \"travailleur forcé\" fut largement utilisé également pour les bagnards exilés loin de leur pays. Les Anglais utilisèrent également cette méthode par la suite, notamment contre les Indiens, qu'ils obligeaient à travailler dans des colonies africaines."
"0xd4cd0f42" = "Les colonies américaines allaient florissantes, tout comme le commerce atlantique. La Grande Bretagne, qui était la nation maritime la plus puissante depuis l'époque de la reine Elizabeth, prêtait un intérêt marqué au contrôle des routes commerciales, dans le but de permettre à son économie domestiques de tirer sa part des profits.<n><n>Sous le gouvernement du Lord Protector Oliver Cromwell, le “First Navigation Act” de 1651 décrétait que seuls des navires anglais pouvaient transporter des marchandises des colonies vers l'Europe. Cette mesure visait principalement la Hollande, une puissance émergente, dans le but de favoriser la flotte commerciale anglaise.<n><n>En 1663, des amendements furent apportés pour rendre cette loi encore plus stricte : les navires marchands qui transportaient des marchandises à destination de l'Europe devaient s'arrêter dans les ports anglais et y payer un droit de passage. Mais cette tentative de contrôler le commerce entre les colonies et le reste du monde allait bientôt se retourner contre son instigatrice. L'armée britannique ne pouvant que difficilement surveiller toute la côte, la contrebande se développa.<n><n>C'est précisément cette querelle commerciale entre les colons et la mère-patrie, qui voulait contrôler les exportations et les importations de marchandises, qui allait donner naissance à l'identité américaine, et qui par la suite devint un des motifs principaux du mouvement indépendantiste."
"0xd4cd0f43" = "Les débuts de l'âge colonial furent à l'origine de nombreux problèmes sanitaires, jusqu'alors pratiquement inconnus en raison de la brièveté des voyages maritimes à travers la Méditerranée ou le long des côtes. Traversée l'Atlantique pour rejoindre les Antilles ou l'Amérique du Nord pouvait prendre de un à deux mois, ou même plus si le navire était confronté à des tempêtes ou que le vent se montrait rare. Les difficultés à surmonter furent en conséquence peu surprenante : la saleté des vêtements, le manque d'hygiène, la nourriture pourrie ou contaminée, le manque d'eau pure, les rats, le stress induit par la monotonie et la fièvre... Le terrible spectre du scorbut planait sur tous les marins. Cette maladie, engendrée par le manque de vitamines, se manifestait par la perte de cheveux et de dents, et elle emporta plus d'un marin. C'est James Cook (1728-1779), le premier capitaine à avoir fait le tour du monde, qui parvint à traiter cette maladie. Il insista non seulement pour que son navire reste propre, mais il donnait à son équipage du chou et des fruits à manger. Ceux qui descendaient à terre devaient également survivre aux maladies tropicales, comme la fièvre noire, qui est une des manifestations les plus dangereuse de la malaria. Cette infection, dont les symptômes sont une augmentation du pouls, de la fièvre, des tremblements et une urine très foncée, était pratiquement toujours fatale."
"0xd4cd0f44" = "Il y a de nombreuses anecdotes à raconter sur les marins et les cartographes qui découvrirent les nouvelles terres, fleuves et colonies. Même le premier nom donné par les explorateurs européens lors de la découverte de l'Amérique a sa petite histoire. Christophe Colomb donna à l'île sur laquelle il accosta le 12 octobre 1492 le nom de Salvador (“Sauveur“). Il voulait ainsi rendre grâce à Dieu de l'avoir protéger des maladies et des tempêtes durant son voyage, et plus que tout, d'avoir empêcher une mutinerie qui menaçait de se déclencher quelques minutes à peine avant que la terre soit découverte.<n><n>Par la suite, les Conquistadors espagnols choisirent principalement des noms aux connotations religieuses, à l'instar du “Nombre de Dios” (“Le nom de Dieu“) ou de “Trinidad” (la “Trinité”). En d'autres occasions, ils cherchèrent leur inspiration dans la date ou leurs observations des lieux. Ainsi, les marins portugais donnèrent à une baie de la côte brésilienne, qu'ils découvrirent le jour de l'an 1502, la \"Rivière de janvier\" (Rio de Janeiro), et le nom de la cité de Montevideo est une référence à l'exclamation qu'aurait poussée Magellan en voyant la côte pour la première fois : “Monte vido eu !” (“Je vois une montagne !”).<n><n>Il était également de coutume pour les explorateurs de nommer les régions et les villes d'après ceux de leurs dirigeants, de leur terre natale ou de leur ville d'origine. Cela permettait non seulement de définir un titre de propriété, mais cela assurait un lien entre le pays d'origine et ces terres lointaines.<n><n>Si leur imagination ne suffisait pas, les explorateurs pouvaient toujours se contenter des noms donnés par les tribus indigènes (bien que cela ne les ait pas empêché de les chasser ou de les exterminer par la suite).<n><n>A ce jour, la légende veut encore que lorsque James Cook demande à un aborigène australien comment s'appelait un étrange marsupial, ce dernier ait répondu “kangooroo” ou “ganguru”, ce qui aurait signifié “De quoi parlez-vous ?”. Ce n'est sans doute qu'un mythe, mais de telles incompréhensions amusantes ont sans aucun doute eu lieu. <n><n>On serait sans doute surpris du nombre de villes, de montagnes ou de fleuves dont le nom signifie réellement “Bonjour !”, “Pardonnez-moi ?” ou “Laissez-moi tranquille !” ..."
"0xd4cd0f45" = "Avec l'émergence d'un empire espagnol qui s'étendait partout dans le monde, il devint nécessaire d'établir des autorités coloniales avec suffisamment de pouvoirs pour gérer les affaires administratives quotidiennes et les crises qui pouvaient survenir brutalement. C'est pour cette raison que le titre de vice-roi fut conféré aux gouverneurs les plus importants des colonies.<n><n>Au sommet de sa puissance, l'empire espagnol comptait deux dignitaires portant ce titre. Un en Nouvelle Espagne (le Mexique) et un second au Pérou. Les vice-royautés de la Nouvelle Grenade et du Rio de la Plate furent ajoutées au 18e siècle.<n><n>Les devoirs du vice-roi (qu'on appelait également virrey) étaient conjointement (ou conflictuellement) exercés avec un conseil administratif, l'Audienca. Ils comportaient toutes les activités classiques d'un officiel de l'état : la levée et la collecte d'impôts, l'observation de la loi par les citoyens, l'organisation des défenses de la colonie, etc. Le vice-roi devait également protéger la population indigène et nommer les prêtres et autres dignitaires.<n><n>En raison de l'énorme importance économique et politique de ses possessions coloniales, la Couronne gardait un oeil attentif sur les activités des vice-rois. Ils n'avaient ainsi pas le droit de participer à des activités commerciales qui leur auraient permis de gagner des revenus supplémentaires. Pour le reste, les rivalités entre les différents vice-rois limitèrent grandement leurs pouvoirs."
"0xd4cd0f46" = "Tout le monde sait que les conquérants européens répondaient toujours à l'appel de l'argent et de l'or. Et pourtant, les épices avaient pratiquement plus de valeur. Il est difficile d'imaginer à quel point la nourriture européenne pouvait être morne au Moyen Age, si l'on considère les dangers que des gens étaient prêts à braver pour se procurer du poivre ou de la muscade.<n><n>De ce point de vue, la découverte de l'Amérique se révéla de prime abord très décevante. Les gens découvrirent avec stupéfaction les animaux exotiques rapportés par Christophe Colomb. Ils se réjouirent de voir les possessions de leur pays considérablement augmentées et qu'un nombre considérable d'âmes seraient sauvées des limbes par le développement de la Chrétienté. Mais les montagnes d'or promises tardèrent à se montrer. Les voyages vers l'Amérique ne devinrent véritablement rentables que dix à vingt ans plus tard, lorsqu'un véritable flot d'argent américain commença à arriver en Europe.<n><n>Lors d'un de ses voyages, Christophe Colomb rapporta un trésor plus précieux que tout l'or et l'argent du monde : le 4 novembre 1492, les indigènes lui présentèrent ce qu'il décrivit comme une pomme qui avait le goût de châtaignes. Il devint alors le premier Européen à manger une pomme de terre ! Le mot indien pour la décrire était “batate” et il survit encore aujourd'hui.<n><n>Un grand nombre de choses que nous considérons aujourd'hui comme acquises ont été rapportées en Europe par Colomb et ses successeurs : le tabac, les tomates, le maïs ou encore le hamac, que les indigènes appelaient le “hamaka”."
"0xd4cd0fae" = "Dès que sa découverte fut annoncée, le Nouveau Monde enflamma l'imagination des peuples européens. Quelles sortes de créatures pouvaient vivre dans ces territoires inexplorés ? Les rumeurs les plus folles circulaient : une île serait habitée de cannibales, une autre de créatures sans têtes dont les visages seraient au niveau de l'estomac...<n><n>La région de Patagonie, en Amérique du Sud, signifie grossièrement “la terre des hommes aux grands pieds”, tandis que l'Amazone tire son nom d'une horde de femmes guerrières qui auraient rappelé aux explorateurs les amazones de la mythologie grecque.<n><n>Il y a sans aucun doute des faits à l'origine de certaines de ces rumeurs, tandis que d'autres sont simplement des histoires que les indigènes avaient eux-mêmes entendues ailleurs.<n><n>Dans la plupart des cas, ces rumeurs étaient simplement le fruit de l'imagination des gens, et plus souvent qu'on le pense, les gens n'y croyaient que parce qu'ils le voulaient bien. Cela expliquerait pourquoi des générations entières de conquistadors sont parties à la recherche de la légendaire Fontaine de jouvence, du Jardin d'Eden ou de l'Eldorado, la cité d'or. Ils étaient même encouragés dans leurs croyances par les indigènes, qui les assuraient toujours qu'ils avaient entendu parler de l'un ou de l'autre, dans le seul but de gagner du temps et de les attirer loin à l'intérieur des terres, isolés de leurs navires."
"0xd4cd0faf" = "L'un des explorateurs et des conquérants les plus célèbres parmi tant d'autres personnages hauts en couleurs était l'écrivain et l'aventurier anglais, Sir Walter Raleigh (1554 – 1618). Il fut remarqué tout d'abord en 1580, pour avoir écrasé une émeute de rebelles irlandais opposés à l'occupation anglaise. <n><n>Il devint un des favoris de la reine Elizabeth I et il se servit de son influence pour financer une expédition dans le but de trouver la légendaire cité d'Eldorado en Amérique du Sud. Malgré l'échec complet de plusieurs expéditions, il parvint à conserver le soutien de ses financiers londoniens grâce à ses pouvoirs de persuasion hors du commun. Il parvenait à leur faire croire à chaque fois qu'il n'était qu'à un estuaire du but et qu'il ne pouvait pas s'arrêter là.<n><n>Mais son crédit finit par se tarir. Trop souvent, des personnes avaient écouté ses fausses promesses pour ne découvrir par la suite que du vent. Raleigh finit par tomber en disgrâce auprès d'Elizabeth. James I, qui lui succéda, considérait cet aventurier au sang chaud comme une menace pour sa politique extérieure peu audacieuse, et le fit arrêter puis condamner à mort pour des motifs douteux. La condamnation fut commuée (mais pas levée) et Raleigh fut emprisonné dans la Tour de Londres.<n><n>Des années plus tard, quand l'état des finances de l'état l'y contraignit, le roi donna à Sir Walter Raleigh la permission de mener une nouvelle expédition en Guyane. La situation était absurde : donner à un homme, lui-même condamné à mort, le droit de vie ou de mort sur d'autres personnes et l'envoyer à la recherche d'or ! Mais cela ne devait pas durer longtemps. Raleigh, malade, allait voir sa dernière expédition se solder par un échec.<n><n>A son retour en Angleterre, le roi furieux décida que la grâce accordée en 1603 à Raleigh n'avait plus lieu d'être. Sir Walter Raleigh fut exécuté peu après.  "
"0xd4cd0fb0" = "Les premières rencontres entre les indigènes qui habitaient le Nouveau Monde et les marins blancs se déroulèrent dans l'ensemble sans heurts. A plusieurs reprises, les Européens furent même accueillis comme des dieux. C'était parfois le fait d'anciens mythes, mais dans la plupart des cas, les Amérindiens furent simplement impressionnés par les grands étrangers blonds en armure brillante qui arrivaient sur leurs \"maisons sur l'eau\".<n><n>Colomb, Cortez et tous les autres explorateurs se firent une joie de perpétrer cette illusion, mais les Amérindiens allaient bien vite être confrontés à la brutale réalité : poussés par leur insatiable appétit pour l'or, la \"maladie espagnole\" comme l'appelaient les Amérindiens, les Espagnols abusèrent des indigènes, massacrèrent et réduisirent en esclavage des populations entières. La vue des chevaux, jusqu'alors inconnus en Amérique, et le son des canons causèrent de véritables paniques et ceux qui survécurent au massacre succombèrent bien vite de la grippe, de la variole ou d'autres maladies importées d'Europe.<n><n>De célèbres intellectuels comme Gonzolo Oviedo ou Juan de Sepulveda tentèrent de justifier les crimes commis par les Européens en usant d'arguments racistes qui dépeignaient les Amérindiens comme une race ignorante et inférieure.<n><n>Ces mêmes hommes, qui avaient fait brûler des scientifiques et des \"sorcières\" en raison de leurs croyances, étaient bien versés dans l'art de romancer les \"coutumes bestiales\" des Amérindiens. Bien entendu, certaines pratiques idolâtres, les sacrifices humains et la cannibalisme existaient véritablement, mais ils furent utilisés par l'homme blanc comme justificatifs aux sanctions les plus brutales dont firent l'objet les Amérindiens."
"0xd4cd0fb1" = "Comme on le sait généralement, les premières phases de la colonisation de l'Amérique furent l'oeuvre de l'Espagne et du Portugal. Ils furent par la suite rejoints par la Hollande et, de façon plus marquée, par l'Angleterre et la France. On sait toutefois moins que les nombreuses expéditions espagnoles n'auraient sans doute jamais eu lieu si de puissants financiers allemands ne les avaient pas subventionnées.<n><n>En 1500, le Schwab et Augsbourg en particulier étaient devenus d'importants centres financiers et d'échanges en Europe. C'est de là que les puissantes familles marchandes des Fugger et des Welser influaient sur la politique mondiale. Ainsi, c'est grâce à leur soutien financier que le roi Charles d'Espagne devint l'Empereur d'Allemagne en 1519. Le roi Henry VIII d'Angleterre et plusieurs Papes furent heureux de compter parmi leurs amis Jakob Fugger le \"Riche\".<n><n>Bien évidemment, ces marchands astucieux avaient leurs propres raisons d'offrir leur soutien financier. En échange, ils escomptaient profiter de privilèges ou de la permission d'exploiter les mines d'argent royales. Les Welser parvinrent même à acquérir temporairement toute la côte nord du Venezuela, où ils fondirent des villes comme la “Nouvelle Augsbourg” depuis lesquelles partirent plusieurs expéditions (le plus souvent infructueuses) vers l'intérieur des terres à la recherche de trésors."
"0xd4cd0fb2" = "Ayant conquis la moitié du globe, la couronne d'Espagne se retrouva devant des opportunités uniques. Pendant plusieurs siècles, à compter de la défaite des grandes cultures américaines Inca, Maya et Aztèque, qui avaient notamment découvert de nombreux gisements d'argent au Pérou et au Mexique, la situation de l'Espagne semblait inexpugnable. Il semble presque absurde de voir que c'est précisément cette immense richesse qui précipita le déclin de cette puissance mondiale.<n><n>Une grande partie des trésors renvoyés en Espagne retombait directement dans les poches de marchands étrangers qui avaient financé les voyages à l'origine. Mais la richesse qui restait suffisait largement à pousser l'inflation dans la péninsule ibérique. Les gens vivaient au-delà de leurs moyens. A cette époque où il importait plus de pouvoir se pavaner à la cour que d'équilibrer le budget de l'état, les gens ne faisaient guère attention aux basses préoccupations matérielles.<n><n>Les marchandises commencèrent à être importées dans une proportion toujours croissante, les gens estimant qu'il était indigne de les produire eux-mêmes. Même l'équipement et les provisions nécessaires aux expéditions vers l'Amérique étaient rarement fournis par les marchands espagnols. Comme le disait le peuple avec fierté : toute l'Europe est au service de l'Espagne.<n><n>Mais les flots d'argent devaient finir par se tarir et le réveil allait être douloureux après une telle euphorie : les Hollandais et les Britanniques tentaient de prendre la place de l'Espagne sur les mers. Plusieurs guerres de religion contre les \"hérétiques\" protestants et contre les Turcs avaient dévoré des sommes considérables et le vaste empire, sur lequel le soleil ne se couchait jamais, était devenu un colosse ingouvernable.<n><n>La crise était évidente pour tout le monde dès l'année 1557, date à laquelle le nouveau dirigeant espagnol, Philippe II, fut contraint de déclarer la faillite de l'état. Le grand empire, qui avait possédé les plus grands trésors jamais engrangés par un empire avant lui, n'avait plus un sou en poche."
"0xd4cd0fb3" = "Comment se fait-il que la langue officielle du Brésil soit le Portugais, et non pas l'Espagnol comme presque partout ailleurs en Amérique du Sud ?<n><n>Tant les Espagnols que les Portugais, qui avaient découvert la route des Indes le long de la côte africaine, savaient que leur avenir se dessinait de l'autre côté des océans. Les deux pays se surveillaient mutuellement pour s'assurer que, dans leur chasse au trésor, aux sujets et à la terre, ils n'allaient pas empiéter sur le territoire de l'autre.<n><n>Comme il n'y avait à l'époque rien qui ressemblait à ce qu'on appelle aujourd'hui le Droit international, en cas de conflit, les deux pays se tournaient vers le Pape, seule autorité à laquelle les deux nations pouvaient accepter de demander conseil. Pour sa part, l'église Catholique avait intérêt à ce que tant les Espagnols que les Portugais poursuivent avec zèle la Christianisation des \"athées\" dans les terres inconnues, plutôt qu'ils ne gaspillent leur énergie à se chamailler.<n><n>Des accords furent donc conclus lors de négociations à Tordesillas (1494) et à Saragosse (1529), dans le but que les territoires nouvellement découverts à l'ouest d'une ligne de longitude définie appartiendrait à l'Espagne et les autres au Portugal. La ligne de longitude traversait une Amérique du Sud encore inconnue de telle sorte qu'à son est se trouvait la région qu'on appelle le Brésil, qui tomba dans l'escarcelle du Portugal."
"0xd4cd0fb4" = "C'est probablement l'écrivain romain Polybius qui utilisa le premier le mot de “pirate” (peirato), environ 140 ans avant JC. Depuis lors, de nombreux mots servent à décrire ces larrons des mers : corsaires, boucaniers, flibustiers... Les hommes qui entouraient Klaus Störtebeker étaient connus sous le nom de “Confrérie des Vitaliens” et Bartholomew Roberts avaient choisi pour lui-même et sa bande de bandits meurtriers le titre incongru de “Gentilshommes de Fortune”. Au final, toutefois, peu importait au marchand qui sortait de la brume pour attaquer son navire. <n><n>Les boucaniers ont été un fléau pour l'être humain depuis les temps les plus anciens. Dans l'antiquité, les pirates Siciliens répandaient une telle terreur dans la Méditerranée que l'Empire romain fut contraint de mener régulièrement campagne contre eux. Des îles inconnues, des baies perdues dans les côtes non loin des routes de commerce fréquentées... autant de refuges idéaux pour les pirates. Les récifs, les courants, le mauvais temps, autant de conditions difficiles qui faisaient des lourds navires marchands des proies faciles et qui permettaient aux pirates de rapidement battre en retraite une fois leurs rapines terminées. Les côtes d'Asie Mineure étaient considérées durant l'antiquité tout aussi dangereuses que les Caraïbes durant l'Age de la découverte, et les pirates d'Asie du Sud-est sont devenus légendaires.<n><n>D'après son étymologie, le mot \"boucanier\" désignait un marin qui partait individuellement en mer, sans faire partie d'une flotte, à la recherche d'un butin et qui était en conséquence considéré comme un pirate. <n><n>Toutefois, à travers les Lettres de Marque, certains des boucaniers des Caraïbes avaient une activité presque légale. Ces documents étaient écrits par les gouverneurs anglais, français ou hollandais et leur objectif était simple : canaliser les actes de piraterie vers les puissances ennemies.<n><n>Il était plus ou moins facile d'obtenir une Lettre de Marque, selon le gouverneur. Certains gouverneurs estimaient déshonorable de passer un pacte avec des pirates. D'autres étaient moins scrupuleux, quand ils n'étaient pas simplement lâches ou corrompus."
"0xd4cd0fb5" = "Les “sept mers” ne sont en fait que trois (plus précisément, les trois océans) : le Pacifique Nord et Sud, l'Atlantique Nord et Sud, les océans arctique et antarctique, et enfin l'océan Indien.<n><n>Le Pacifique est ainsi nommé car lors du premier tour du monde accompli par Fernando Magellan, ce dernier ne rencontra que des conditions favorables pendant les longues semaines dont il eut besoin pour traverser ce vaste océan.<n><n>Les Caraïbes tiennent pour leur part leur nom de “Karibe” (ou “Karaibe”), le nom des peuples d'un groupe ethnique indien, qui s'étaient installés tout le long des Antilles et sur la côte nord de l'Amérique du Sud."
"0xd4cd0fb6" = "Les îles Bermudes sont ainsi nommées d'après l'explorateur espagnol Juan Bermúdez, qui les découvrit en 1503. La tristement célèbre zone connue des marins sous le nom de \"Triangle des Bermudes\", où l'on dit que les risques qu'un accident survienne sont nettement plus élevés qu'ailleurs, couvrent une zone qui s'étend entre les Bermudes, Puerto Rico et Fort Lauderdale (en Floride).<n><n>Certaines personnes maintiennent que d'étranges séries d'événements inexplicables commencèrent dès le voyage de Christophe Colomb : le navigateur génois, au service de l'Espagne, se trouva avec ses trois navires dans la région le 14 septembre 1492, et il explique que sa boussole se mit à tournoyer furieusement. Scientifiquement, il s'agissait simplement des interférences entre le pôle nord géographique et le pôle nord magnétique. Le jour suivant, il raconte avoir vu une gigantesque flamme dans le ciel (sans doute une météorite).<n><n>Toutefois, le surnom de \"Triangle des Bermudes\" n'est apparu que durant la 2e Guerre Mondiale, à la suite d'une série d'accidents d'avion qui attira l'attention du public sur cette zone, au sud-ouest de l'Atlantique Nord.<n><n>Les experts en événements inexpliqués vous diront que plus de 200 accidents inexpliqués y ont eu lieu, encore qu'ils interprètent souvent les frontières de cette zone assez généreusement. La plupart de ces accidents, dont un très grand nombre n'ont pas eu lieu dans la zone, ont une explication parfaitement rationnelle."
"0xd4cd0fb7" = "La légendaire flotte au trésor espagnole, qui faisait régulièrement la navette entre l'Amérique et l'Espagne, fut également l'objet de nombreux intérêts au-delà de l'Espagne. C'était notamment le cas de l'ambitieuse Angleterre, qui y voyait une opportunité de contester le rôle de maîtresse des mers à l'Espagne.<n><n>Le royaume insulaire n'était pas encore de force à s'engager dans de longues campagnes militaires et il semblait bien plus avisé d'attaquer sa rivale loin d'Europe, où elle ne s'attendrait pas à une attaque et ne pourrait pas en être prévenue. Il était possible, si loin de tout, d'attaquer sa proie, de la piller et de disparaître sans que personne en Europe n'en soit averti avant plusieurs mois.<n><n>Des capitaines audacieux, parmi lesquels le très célèbre Francis Drake (1540-1596), se virent attribuer des Lettres de Marque par la reine Elizabeth I. Ces Lettres de Marque était une sorte de permis de piller et de carte blanche qui élevaient Drake et ses associés à un titre bien plus prestigieux que simples boucaniers, en leur conférant un statut de barons du vol au service d'une autorité supérieure. Ils en firent excellent usage. Les navires et les garnisons espagnoles n'étaient plus en sécurité nulle part.<n><n>En 1578, Francis Drake traversa le Détroit de Magellan et partit à la chasse aux Espagnols tout le long de la côte pacifique de l'Amérique. Personne n'avait jamais osé un tel exploit auparavant ! Lorsqu'il revint au port de Plymouth en 1580, Drake fut le deuxième capitaine après Magellan à avoir fait le tour du monde. <n><n>Dans le même temps, le roi Philippe d'Espagne bouillait de rage et brandissait le Traité de Tordesillas, selon lequel sa Sainteté le Pape avait sans sourciller déclaré en 1494 que l'hémisphère ouest était sous la sphère d'influence de l'Espagne. Mais comment ce type de protestation aurait-il pu changer quoi que ce soit sur cette étrange île nation de protestants hérétiques, qui avait rejeté l'autorité du Pape de Rome et qui avait même refusé d'adopter le calendrier grégorien jusqu'en 1753, simplement sous prétexte qu'il avait été conçu à la demande du Pape Grégoire en 1582 ?<n><n>Une fois encore, la dispute ne semblait pouvoir être résolue que par la guerre. L'Armada de Philippe leva l'ancre pour l'Angleterre en 1588, mais commandés par Sir Francis Drake, désormais anobli, et profitant d'orages soudains, les Anglais parvinrent à détruite la flotte espagnole. Pendant des siècles, personne n'oserait défier la Grande Bretagne sur les mers."
"0xd4cd101f" = "Sans aucun doute, les voyages de Christophe Colomb (1451-1506) vers l'Amérique comptent parmi les plus grandes aventures jamais entreprises par l'homme. Même un écrivain aurait pu imaginer de raconter autant d'événements dramatiques et de coïncidences étranges.<n><n>Si le navigateur génois avait réussi à convaincre Isabelle et Ferdinand d'Espagne qu'il pouvait y avoir une route maritime vers l'Inde en passant par l'ouest, il ne profitait assurément pas du même crédit auprès de son équipage. De fait, la plus grande partie de son équipage fut contrainte de monter sur les navires : pour la punir de ses affronts envers la couronne, la ville de Palos fut obligée de fournir deux navires avec leurs équipages.<n><n>Le plan de Colomb provoqua des tensions considérables. L'équipage était fermement convaincu qu'il naviguait sous les ordres d'un fou qui n'allait attirer sur lui et ceux qui le suivait que la mort ou pire encore.<n><n>Mais le pire ennemi de Colomb était la superstition : à croire que les plus sinistres récits d'horreur avaient réussi à prendre part au voyage. Pire, des événements de mauvais augures ponctuèrent le voyage et renforcèrent les peurs des marins : un volcan entra en éruption alors qu'ils naviguaient au large de Tenerife, projetant des colonnes de flammes dans le ciel, la boussole qui commença à danser la gigue... Si les navires n'avançaient plus en raison d'un temps plat, c'était encore un mauvaise augure. Et si le vent était bon et qu'ils avançaient vite, cela signifiait que le vent soufflait seulement d'est en ouest et qu'ils ne pourraient jamais rentrer.<n><n>A plus d'une occasion, la mutinerie semblait inévitable. Une nuit, le capitaine entendit des bruits de pas et des voix devant sa cabine. Lorsqu'il commença à prier à haute voix, ses assassins perdirent courage et filèrent.<n><n>Les crises les plus sérieuses éclataient toujours lorsqu'on pensait voir une île à l'horizon, mais qu'il ne s'agissait finalement que d'une illusion d'optique. C'est à la suite d'un tel événement que les choses atteignirent leur paroxysme, le 10 octobre. Colomb négocia trois jours. A l'issue de ces trois jours, si l'équipage désirait rentrer (sans doute sans leur capitaine), il le pourrait. Mais le destin en avait décidé autrement : ils virent effectivement terre au cours de ces trois jours. Mais aucun de ceux qui étaient présents n'auraient pu imaginer qu'au lieu de l'Asie, ils allaient tomber sur un continent tout entier, complètement inconnu.<n><n>Le Japon et la Chine étaient encore à des milliers de kilomètres de là, et si par une bonne fortune incroyable, l'expédition de Colomb n'avait pas rencontré ce continent étranger, elle aurait probablement été perdue. Le moral de l'équipage remonta immédiatement. Aucun d'eux ne sembla plus se souvenir qu'à un quelconque moment, il avait songé à se mutiner..."
"0xd4cd1020" = "Christophe Colomb avait effectivement découvert un nouveau continent (ou plutôt redécouvert, puisque des Vikings avaient déjà posé le pied en Amérique durant le Moyen Age), mais il annonça par erreur avoir découvert une nouvelle route maritime vers les Indes.<n><n>Tout en préparant le second et le troisième de ses quatre voyages, le Génois collabora avec Amerigo Vespucci, un Italien originaire de Florence. C'est lui qui le premier suggéra que ces terres à l'ouest appartenait en fait à un nouveau continent inconnu. Cette réalisation spectaculaire enflamma de nouveau l'intérêt public et quiconque parlait de ces nouvelles terres mentionnait forcément le nom de Vespucci.<n><n>De son côté, l'étoile de Christophe Colomb était sur le déclin. Durant la même période, il avait même été renvoyé chez lui enchaîné à cause de plaintes de colons antillais. Sa mort, dans la maladie et la solitude en 1506, passa complètement inaperçue. Il n'est donc pas surprenant que le cartographe allemand Martin Waldseemüller s'inspira du populaire nom d'Amerigo Vespucci quand il proposa un nom pour ces terres inconnues un an plus tard. <n><n>Le nom proposé par Waldseemüller fut accepté par ses collègues, mais il aurait sans doute été plus juste que le nouveau continent prenne le nom de \"Colombie\"."
"0xd4cd1021" = "La première région qui prit de l'importance sous la férule espagnole fut Hispaniola. Christophe Colomb y avait déjà établi la première colonie européenne en 1493, mais elle avait été massacrée par les Amérindiens avant même qu'il soit rentré en Europe.<n><n>Dans les années qui suivirent, la couronne espagnole prit de plus en plus le contrôle de cette île. Le premier monastère et la première cathédrale du Nouveau Monde y furent bâtis. C'est sur cette île que le système social et la nouvelle \"civilisation\" allait rayonner : une société qui comptait des esclaves, strictement divisée en classes et très proche de l'église Catholique.<n><n>Hispaniola semblait offrir de grandes opportunités et attira de nombreux colons entreprenants. <n><n>Il ne fallut toutefois pas longtemps avant que l'Espagne se tourne vers d'autres régions : les grands royaumes du continent avaient été découverts et conquis. Il y était plus facile de régner et les gisements d'or et d'argent étaient plus riches et plus faciles à exploiter.<n><n>Comme un jouet abandonné, Hispaniola fut oubliée. Les pirates hollandais, anglais et français lançaient tour à tour leurs attaques. En 1697, les Français prirent le contrôle de Saint Domingue, la partie occidentale de l'île (Haïti aujourd'hui) et établirent une rentable économie agricole. La production de cacao, de sucre, d'indigo, de coton et de café fit de Saint Domingue la colonie la plus rentable de tout le Nouveau Monde au 18e siècle.<n><n>La seule révolte d'esclaves à avoir abouti, qui fut déclenchée à la suite de la Révolution française, permit à Haïti de prendre son indépendance en 1804. Les rebelles traitèrent leurs anciens oppresseurs à peu près comme ils avaient été traités : \"Pour la déclaration d'indépendance, il nous faut la peau d'un homme blanc pour le parchemin, son crâne comme encrier, son sang comme encre et une baïonette comme plume\", annonça alors le général noir, Boisrond-Tonnerre."
"0xd4cd1022" = "Produit typique des Caraïbes, d'un bénéfice douteux pour l'être humain, le rhum est fabriqué à partir de cannes à sucre. A l'origine, cet alcool portait le nom pittoresque de \"tueur de diable\", et fut créé à la Barbade en 1650. Boisson légendaire des pirates, le rhum est généralement associé à la Jamaïque, qui était probablement un des repaires de pirates les plus craints de tous les temps. <n><n>Les marchands d'esclaves vendaient leurs marchandises achetées sur la côte africaine contre de grandes quantités de molasses. Ces molasses étaient ensuite raffinées et transformées en rhum en Nouvelle Angleterre, puis convoyés vers l'Afrique. L'alcool était vendu sur place et les navires embarquaient une nouvelle cargaison d'esclaves. Ce fameux \"triangle d'ébène\" permettait aux propriétaires des navires de s'assurer qu'ils ne voyageaient jamais à vide."
"0xd4cd1023" = "Après Cuba, la Jamaïque est sans doute l'île la plus célèbre des Caraïbes. Son nom est dérivé du nom indien Arawak, Xymaca, qui signifie grossièrement \"le pays du bois et de l'eau\". Christophe Colomb en personne, qui découvrit l'île neuf ans auparavant, avait largement eu le temps de profiter de la beauté des lieux et de l'hospitalité de ses habitants lorsque son navire s'échoua sur sa côte nord en 1503.<n><n>Il aimait tellement les lieux qu'il décida de la retirer au roi d'Espagne et de la déclarer sienne. Cela n'empêcha pas ce paradis insulaire d'être négligé pendant quelques décennies avant d'être capturé par les Anglais, en 1655. Il ne restait déjà plus beaucoup d'Arawaks, car la tribu s'était montrée particulièrement sensible aux maladies importées par les Européens.<n><n>En 1661, Edward D'Oyley fut nommé capitaine-général et gouverneur de la Jamaïque. Sous son autorité, la capitale de Port Royal fut transformé en un havre de paix lourdement défendu pour les pirates. On disait qu'il s'agissait de l'endroit \"le plus riche et le plus corrompu sur Terre\" et nombre de ses habitants, en temps normal de paisibles marchands, participaient souvent aux raids des pirates contre les eaux espagnoles. Au début, le gouvernement britannique sembla peu enclin à réguler ces actes, car après tout, les boucaniers gardaient les rivaux espagnols sur la défensive.<n><n>Ce n'est que lorsque Sir Henry Morgan prit le poste de gouverneur (en sachant qu'il était lui-même un ancien pirate) que l'ordre et la loi revinrent en Jamaïque. Morgan se montra impitoyable envers les pirates et n'hésitait pas une seconde à pendre ses anciens associés.<n><n>Néanmoins, à peine l'autorité britannique avait-elle été rétablie sur l'île qu'une nouvelle source de revenus lucrative en plus de la canne à sucre fut découverte : à compter de 1672, Port Royal devint le plus important marché aux esclaves du monde, car la Compagnie Royale Anglaise d'Afrique venait d'en obtenir le monopole."
"0xd4cd1024" = "A peine deux semaines après son arrivée au Nouveau Monde, Christophe Colomb avait atteint Cuba, la plus grande île des Antilles. Plusieurs tribus y vivaient : les Ciboney, les Guanahatabey et les Tainos, qui, malgré leur nature pacifique, souffrirent toutes du même sort malheureux que les autres tribus amérindiennes : en 1511, après quatre ans de guerre contre les Espagnols, ils furent conquis et exterminés. Par la suite, de grand nombre d'esclaves noirs furent importés pour servir de main d'oeuvre. L'île, dont la capitale est Havane, fut divisée en sept régions administratives (cabildos), et chacune envoyait un député à un conseil spécial. Le travail du député consistait à représenter les intérêts locaux dans la zone.<n><n>Le plus remarquable dans l'histoire de Cuba, c'est qu'en dehors d'un bref interlude durant lequel l'île fut contrôlée par les Britanniques (1672-1763), elle est restée très longtemps entre les mains de l'Espagne. Est-ce parce que Cuba n'a jamais été une des zones les plus importantes de l'empire Espagnol durant la période coloniale (il faut dire qu'il n'y avait pratiquement pas de gisements de minerais) et qu'il s'agissait généralement seulement d'un arrêt avant de rejoindre le continent ? Quoi qu'il en soit, alors que la très grande majorité des pays d'Amérique du Sud et d'Amérique Centrale obtinrent de force leur indépendance au début du 19e siècle, les Espagnols conservèrent Cuba jusqu'en 1898, date à laquelle ils cédèrent le contrôle de l'île aux USA."
"0xd4cd1025" = "La plupart des gens savent que des choses que nous considérons aujourd'hui comme acquises en Europe sont originaires d'Amérique. Mais bien entendu, ces échanges allaient dans les deux sens.<n><n>Ainsi, quand on pense aux Indiens d'Amérique du Nord, il est difficile d'imaginer que les premiers chevaux sont arrivés en Amérique après les Espagnols et les Portugais. Un grand nombre d'Amérindiens se sont enfuis en courant la première fois qu'ils virent des cavaliers : ils pensaient que l'homme et sa monture ne faisaient qu'un.<n><n>Le café, que l'on associe normalement à des pays comme le Brésil et le Guatemala, n'est pas du tout originaire d'Amérique, mais d'Afrique (sans doute d'Ethiopie). Après avoir traversé les pays arabes, il arriva en Europe du Sud. La plante fut introduite en Amérique au 18e siècle, période au cours de laquelle la popularité de cette boisson impliqua de développer sa culture.<n><n>Si avec la pomme de terre, les Européens découvrirent aux Caraïbes une plante d'une valeur incroyable, le blé était inconnu en Amérique jusqu'à ce que les Espagnols l'introduisent au Mexique en 1520 et les Anglais en Virginie en 1777. On pensait à l'origine que le climat américain n'était pas du tout adapté à la culture du blé, mais c'est pourtant en Amérique du Nord que les récoltes furent les plus stupéfiantes. De nos jours, le blé est la culture à laquelle est consacrée le plus de terres agricoles au monde."
"0xd4cd1026" = "Pourriez-vous imaginer notre vie sans le chocolat ? Hé bien, jusqu'à la découverte de l'Amérique, le cacao était inconnu dans le monde. Le mot cacao est probablement d'origines Maya : on sait que certains Mayas buvaient du cacao 400 ans avant Jésus Christ.<n><n>Les Aztèques, qui étaient la puissance dominante en Amérique Centrale depuis le 14e siècle, conféraient même une signification religieuse au cacao. Le premier Européen à découvrir cette denrée fut, une fois encore, Christophe Colomb, lors d'un de ses voyages ultérieurs, en 1502, qui l'amena au Nicaragua.<n><n>Toutefois, le véritable \"découvreur\" du cacao est Hernan Cortés, conquérant du royaume Aztèque, qui ramena en Espagne la recette d'une boisson nommée xocoatl (d'où provient le mot “chocolat”). Le goût était à l'origine beaucoup trop amer pour les palais européens et ce ne fut que lorsque les gens ajoutèrent du sucre ou de la vanille que le chocolat chaud devint une boisson populaire dans les classes aisées de la péninsule ibérique.<n><n>Les Espagnols gardèrent jalousement la recette pendant près d'un siècle, puis le chocolat chaud fut découvert en France et dans le reste de l'Europe. Vers 1700, les Anglais ajoutèrent le lait. La dernière grande révolution du cacao en Europe fut de découvrir à quel point le café et le cacao étaient délicieux réunis."
"0xd4cd1027" = "S'il est parfois difficile de distinguer la réalité de la légende quand on parle de piraterie, il n'y a aucun doute sur le fait qu'il existait des femmes pirates. Deux des plus célèbres devinrent pirates sur l'île de la Jamaïque au début du 18e siècle.<n><n>Anne Bonny, dont on dit qu'elle prit un coup de couteau dans le ventre quand elle était enfant, était arrivée avec un marin au repaire de pirates de Nouvelle Providence (Nassau). Elle parvint à se débarrasser de son mari et commença sa carrière à bord d'un navire hollandais capturé.<n><n>Elle rencontra alors Mary Read, qui avait déjà combattu lors des Guerres de Succession espagnoles, déguisée en homme, et dont on dit qu'elle montrait ses seins à ses adversaires avant de les tuer, pour leur prouver qu'ils avaient été battus par une femme.<n><n>Après leur capture en 1720, elles n'échappèrent à la pendaison que parce qu'elles étaient enceintes. Elles s'en sortirent bien mieux que la plupart de leurs acolytes masculins, à propos desquels Anne Bonny ne pouvait que se moquer.<n><n>Voici ce qu'elle aurait dit au tristement célèbre “Calico Jack”, en route pour la pendaison : “Désolée de te voir là, Jack, mais si tu t'étais battu comme un homme, tu serais pas là à être pendu comme un chien”."
"0xd4cd1028" = "Le gallois Bartholomew Roberts (1682? – 1722) fut non seulement un des plus grands pirates de son temps, mais aussi un des plus surprenants. Connu sous le nom de “Bart le noir”, il devint pirate sur le tard, à 37 ans, encore que sa transition vers la piraterie se fit probablement en douceur : le navire sur lequel il travaillait et qui fut attaqué en 1719 par un autre gallois, Howell Davis, était en effet un navire d'esclaves.<n><n>Roberts décida de partir avec Davis, et deux semaines plus tard, après le meurtre de ce dernier, il devint capitaine. On dit que Bartholomew Roberts évitait l'alcool et préférait le thé.<n><n>A la différence de Teach, qui aimait à se faire passer pour le diable en personne, Roberts aimait les vêtements élégants, n'aimait pas les jeux d'argent et insistait pour que ses hommes disent leurs prières. Cela ne veut pas pour autant dire que Roberts était un homme pieux. Il existe de nombreux récits qui retracent les atrocités qu'il a commises, notamment envers des prisonniers, lors de ses innombrables exploits. On dénombre à son actif plus de 400 navires attaqués sur une zone allant du Brésil à Terre-neuve jusqu'à l'Afrique de l'Ouest. Avec Henry Morgan, il compte sans aucun doute parmi les pirates ayant le mieux réussi en Amérique Centrale. <n><n>Le rugissement des canons d'un navire de guerre anglais, le long des côtes de Guinée en 1722, annonça la fin de sa carrière et l'élimination d'un des plus terribles pirates ayant sillonné les sept mers."
"0xd4cd1090" = "Le plus célèbre des boucaniers du 17e siècle est le Gallois Henry Morgan (1635-1688), qui s'attaqua aux colonies espagnoles des Antilles, faisant trembler jusqu'à ses fondations l'autorité de la grande puissance ibérique.<n><n>Ses aventures montrent bien à quel point Anglais, Français et Hollandais se préoccupaient peu de morale quand la politique était de la partie. Aucun d'entre eux ne faisaient grand cas des pirates et de la piraterie, tant qu'elle visait seulement les autres.<n><n>Henry Morgan, qui prit le commandement d'un navire boucanier en 1668, commença par semer le chaos le long de la côte nord de l'Amérique du Sud. A la tête de presque 2000 hommes, il captura la ville bien défendue de Panama en août 1670, avant de dépenser la plus grande partie de son butin pendant le voyage du retour. Mais comme l'attaque avait eu lieu après la signature d'un traité de paix entre l'Espagne et l'Angleterre, il fut arrêté et jugé à Londres.<n><n>Morgan ne fut pas condamné, bien au contraire : il ne fallut pas longtemps avant que les vents de la diplomatie ne tournent encore. Non seulement Morgan fut pardonné, mais il fut également nommé chevalier. Sir Henry fut alors nommé gouverneur de la Jamaïque, où il imposa l'ordre et le strict respect de la loi. Il y termina sa vie riche et respecté."
"0xd4cd1091" = "Les Bahamas servirent pendant une courte période au milieu du 17e siècle de refuge aux exilés religieux anglais. A compter de 1670, les îles furent officiellement sous le contrôle du Comte d'Albemarle et de quelques autres gentilshommes qui les achetèrent au Roi Charles II, dans l'espoir d'y faire des profits.<n><n>Malgré leurs promesses, ces individus ne s'investirent guère pour mettre en place une administration civile bien organisée. Plutôt même le contraire, en fait : comme en d'autres endroits des Caraïbes, des hordes de pirates s'installèrent aux Bahamas, notamment sur l'île de Nouvelle Providence, qui abritait la ville de Nassau. <n><n>Ces baies peu profondes, qui interdisaient l'approche des lourds navires de guerre, étaient un lieu de mouillage idéal pour les centaines de sloops et de pinasses pirates. Les fréquents raids menés dans les eaux espagnoles déclenchèrent des représailles et John Wentworth, le premier gouverneur, eut la mission peu enviable de restaurer l'ordre et la loi dans les îles.<n><n>La situation ne semblant guère s'améliorer, le roi George I d'Angleterre confisqua les Bahamas et en fit une colonie de la couronne. Woodes Rogers, ancien boucanier ayant accompli un tour du monde, fut le premier gouverneur nommé par le roi, en 1718.<n><n>En se servant du bâton et de la carotte, il ramena l'ordre là où le chaos régnait. Il promit l'amnistie générale pour tous les pirates qui accepteraient de renoncer sous serment à leurs activités répréhensibles. Ceux qui refusaient étaient attendus par une flotte de navires de guerre lourdement armés. <n><n>Une fois des conditions normales rétablies, le groupe d'îles eut le droit de nommer son propre parlement en 1729 et dans les siècles qui suivirent, en dehors de quelques invasions occasionnelles, la vie aux Bahamas fut relativement tranquille."
"0xd4cd1092" = "Presque partout dans leurs nouvelles colonies, les Espagnols mirent en place un système social rigide qui n'offrait que peu de chances d'évoluer dans l'échelle sociale. En haut de la hiérarchie, on retrouvait les Espagnols nés en Espagne.<n><n>On donna aux Espagnols nés dans les colonies le nom de Créoles. Bien qu'ils fussent considérés comme de moindre importance, ils occupaient toutefois la plupart des positions subalternes de l'état, de l'église et de l'armée.<n><n>Les Espagnols nés en Europe et les Créoles représentaient l'élite des colonies. Les enfants nés de mariages mixtes étaient appelés Mestizos. Les peuples du cru, anciens propriétaires des lieux, n'occupaient que les positions les plus basses de la société et là où ils avaient été totalement exterminés, cet \"honneur\" échouait aux esclaves noirs.<n><n>La répartition entre ces différentes couches sociales changeait grandement d'un endroit à l'autre dans le vaste empire espagnol. Au Mexique, par exemple, les Mestizos étaient largement majoritaires. Sur de nombreuses îles, ce sont les esclaves noirs qui étaient les plus nombreux (et livrés au bon vouloir de leurs maîtres). Les tribus indiennes survivaient principalement dans les régions marécageuses, montagneuses ou dans les jungles, par exemple en Bolivie et en Floride, où elles étaient relativement à l'abri."
