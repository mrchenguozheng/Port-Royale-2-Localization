"0xe0538e7e" = "Nous sommes en guerre avec @n$HostileNation$ et je prépare un sabotage visant une ville appartenant à nos ennemis. Acceptez-vous de m'aider à la couper de tout approvisionnement pour réduire son état ?"
"0xe0538e7f" = "J'ai l'intention de pousser à la faillite économique une des villes de notre ennemi. Nous pourrions mettre en place un blocus devant une ville appartenant à @n$HostileNation$ jusqu'à ce qu'elle entre en \"Récession\"."
