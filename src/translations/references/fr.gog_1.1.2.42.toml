"0x0ce1a79e" = "Vous êtes dans la ville coloniale de Santa Marta. Cliquez sur le nom de la ville pour afficher des informations à son sujet."
"0x0ce1a79f" = "Les villes coloniales comme Santa Marta peuvent produire deux marchandises essentielles, deux types de matières premières et une marchandise coloniale.<n>Au cours du dernier scénario, vous avez appris que la demande de matières premières et de marchandises coloniales est importante dans les villes principales.<n>Vous allez donc produire pour commencer des marchandises coloniales : du cacao.<n>Fermez la fenêtre d'informations de la ville."
"0x0ce1a7a0" = "Comme les marchandises coloniales sont expédiées vers l'Europe depuis les villes principales, la demande en cacao est forte dans ces villes. Les conditions sont donc idéales pour lancer votre premier commerce. Localisez et cliquez sur le bâtiment du maître des constructions, au centre de la ville."
"0x0ce1a7a1" = "Dans ce bâtiment, vous pouvez demander de nouveaux permis de construire ou les revendre. Vous ne voulez évidemment pas revendre les vôtres !<n>Regardez les différents bâtiments que vous pouvez construire. Vous pouvez également utiliser les boutons qui sont sur la droite de la fenêtre du maître des constructions.<n>Cliquez sur la Plantation de cacao."
"0x0ce1a7a2" = "Vous pouvez voir maintenant les ressources nécessaires et les coûts de construction.<n>Vous verrez également de combien de ressources de construction vous disposez dans l'entrepôt et combien vous devrez en acheter dans la ville.<n>Vous en avez suffisamment pour l'instant.<n>Placez le curseur sur un site de construction disponible et cliquez dessus."
"0x0ce1a7a3" = "Les échafaudages sont en place et la construction de la plantation de cacao commence.<n>Il faudra quelques jours avant qu'elle soit achevée. Vous pouvez pendant ce temps préparer les habitations de vos nouveaux ouvriers.<n>Fermez le menu de construction et cherchez une zone résidentielle à Santa Marta. "
"0x0ce1a7a4" = "Cette zone résidentielle appartient à un marchand de la ville. Vous pouvez voir combien de zones résidentielles appartiennent à des marchands locaux et combien de locataires elles abritent. Vous voulez construire votre propre zone résidentielle. Pour cela, ouvrez le menu de construction."
"0x0ce1a7a5" = "Sélectionnez une zone résidentielle dans le menu de construction et regardez combien cela vous coûtera à construire. <n>Vous n'avez pas suffisamment de ressources en stock pour la construction, mais vous pouvez les acheter dans la ville si elle dispose des ressources nécessaires. <n>Sinon, vous devrez les acheter dans une autre ville.<n>Construisez une zone résidentielle."
"0x0ce1a7a6" = "Une entreprise peut employer 30 ouvriers. Comme il y a en moyenne quatre personnes dans une famille d'ouvrier, vous devez créer une zone résidentielle qui pourra abriter 120 personnes pour chacun de vos commerces. <n>Une zone résidentielle permet d'accueillir 120 habitants, en conséquence, prévoyez une zone résidentielle pour chacune de vos entreprises.<n>Fermez le menu de construction et cliquez sur votre nouvelle zone résidentielle."
"0x0ce1a7a7" = "Il n'y a pas de délai de construction pour une zone résidentielle, puisque les habitants s'y installent tout de suite dans des tentes.<n>Au fil du temps, les habitants développent la zone résidentielle par eux-mêmes, jusqu'à ce qu'elle soit très importante.<n>L'apparence de la zone résidentielle dépend de son ancienneté et du statut de la ville.<n>Fermez la boîte de dialogue de la zone résidentielle."
"0x0ce1a80f" = "Comme vous le savez, votre premier bâtiment dans une ville doit toujours être un entrepôt. Vous ne pouvez pas construire d'autres bâtiments tant que vous n'avez pas d'entrepôt.<n>Vous avez déjà un entrepôt dans la ville où vous avez commencé la partie. Trouvez-le et cliquez dessus. Il s'affiche en bleu clair à l'écran."
"0x0ce1a810" = "Dans l'entrepôt, vous pouvez voir quels bâtiments vous possédez dans la ville et ce que coûte leur entretien.<n>Vous pouvez également voir combien vous touchez en loyers et les marchandises qui sont produites par vos entreprises et commerces.<n>Vous pourrez par la suite donner des instructions au gérant de l'entrepôt.<n>Regardez ce que l'entrepôt vous donne comme informations, puis fermez la fenêtre."
"0x0cee08cc" = "La présence militaire dans cette ville pourrait être meilleure"
"0x0cf75014" = "Fermer"
"0x0cf7abef" = "Cliquez sur votre plantation de cacao. Vous pouvez voir dans cet écran toutes vos plantations de cacao en ville.<n>Lorsque vos centres de production sont construits, vous avez besoin de 30 ouvriers (donc de 30 colons) pour y travailler. Quittez la plantation, allez aux docks et cliquez sur le bouton \"Cargaison\" (en bas à droite)."
"0x0cf7abf0" = "Vous pouvez voir combien de colons cherchent un emploi dans la ville ou si la ville a besoin de nouveaux ouvriers.<n>Ce sera le cas dès que votre plantation sera construite.<n>Allez dans les villes principales avoisinantes et faites venir des colons à Santa Marta jusqu'à ce que votre plantation dispose du maximum d'ouvriers."
"0x0d0b8e3a" = "+++EMPTY+++"
"0x0d0db040" = "Cliquez sur une de vos plantations de cacao."
"0x0d0db041" = "Vous pouvez maintenant voir combien de cacao votre plantation produit chaque jour et de combien d'outils elle a besoin.<n>Entreposez @a$SubGoal$ outils dans votre entrepôt, car c'est lui qui fournit des marchandises à vos commerces."
"0x0d0db042" = "Les outils sont des marchandises importées. Vous en trouverez donc en abondance et à bon prix dans les villes principales.<n>Vous pouvez essayer d'en trouver à Carthagène, au sud-ouest, ou à l'est, à Margarita ."
"0x0d0db043" = "Excellent !<n>Plus le prix moyen des matières premières nécessaires est bas, plus vos coûts de production seront faibles.<n>Vous pouvez continuer à produire du cacao jusqu'à en avoir @a$AmountGoal$ dans l'entrepôt."
"0x0d0f1795" = "Juillet"
"0x0d0f1877" = "Juin"
"0x0d1098bd" = "%1,<n>Vous êtes nouveau par ici, non ? Mais j'ai déjà entendu parler de vous et votre réputation vous précède. Vous devriez venir me voir de temps à autre, il y a toujours du travail à accomplir."
"0x0d23b491" = "Envoyez votre convoi à Carthagène et entrez dans la ville.<n>Un petit cercle est affiché sous le nom de la ville, à droite de l'écran. Cela vous indique votre l'état de votre réputation commerciale avec Carthagène à ce jour.<n>Nous vous avons facilité les choses dans ce scénario, en vous conférant un bonus.<n>Ouvrez la fenêtre d'informations sur la ville."
"0x0d23b492" = "\"Réputation commerciale\" vous permet de voir le pourcentage du score à atteindre que vous avez déjà obtenu. Si vous voyez 100%, vous pouvez demander un permis au maître des constructions de la ville.<n>Fermez la fenêtre d'informations sur la ville."
"0x0d23b493" = "Les prix des marchandises qui sont rares dans la ville sont affichés en rouge dans la fenêtre de commerce. Si vous vendez ce type de marchandises, vous améliorez votre réputation commerciale avec la ville et la nation à laquelle elle appartient.<n>Cliquez sur les docks pour afficher des informations sur les stocks de marchandises disponibles dans la ville."
"0x0d23b494" = "Cherchez les marchandises dont la ville manque. Par exemple, la ville aura toujours besoin de sucre et de coton, car elle produit du rhum et des vêtements.<n>Mais il y a d'autres marchandises dont la ville manque.<n>Allez dans d'autres villes et achetez ce dont Carthagène a besoin pour améliorer votre réputation commerciale."
"0x0d23b495" = "Bien ! Vous avez considérablement amélioré votre réputation auprès de Carthagène.<n>Mais attention à ne pas acheter les marchandises dont Carthagène manque ! Vous pouvez facilement les reconnaître car les quantités disponibles sont indiquées en rouge.<n>Augmentez votre réputation commerciale jusqu'à 85%."
"0x0d23b496" = "Parfait ! Vous avez maintenant une réputation commerciale de 85% à Carthagène. Continuez comme ça !<n>Faites monter votre réputation à 100%.<n>Au fait, vous venez de recevoir un message sur les \"Promotions et statuts\"."
"0x0d23b497" = "Excellent ! Vous avez suffisamment commercé avec Carthagène.<n>Malheureusement, votre statut est toujours celui de Marin ordinaire et vous n'avez droit qu'à un seul permis de construire.<n>Pour être promu au statut suivant, vous devez accroître votre richesse en continuant de commercer. "
"0x0d23b498" = "Parfait ! En tant que Marin, vous avez droit à deux permis de construire.<n>Allez voir le maître des constructions de Carthagène et demandez un permis.<n>Si vous n'avez pas assez d'or, vous devrez encore commercer. N'oubliez pas de vendre les marchandises que vous produisez à Santa Marta."
"0x0d2a3b89" = "Ent. du navire"
"0x0d39b8e2" = "Vous devez d'abord construire un entrepôt à Carthagène, avant de pouvoir construire d'autres bâtiments."
"0x0d39b8e3" = "Construisez deux tisseries et deux zones résidentielles.<n>S'il n'y a pas suffisamment de matériaux de construction dans la ville, vous devrez les acheter dans d'autres villes et les livrer à votre entrepôt aux docks. <n>N'oubliez pas de négocier un bon prix avant de gaspiller votre or !"
"0x0d39b8e4" = "Vous pouvez vous assurer que vous disposez d'au moins @a$SubGoal$ de coton dans l'entrepôt avant que les tisseries soient construites, de sorte que vos nouvelles entreprises puissent se mettre au travail dès qu'elles seront bâties."
"0x0d39b8e5" = "Votre prochain objectif consiste à produire @a$SubGoal$ vêtements pour votre entrepôt de Carthagène et d'attendre que vos tisseries soient construites.<n>Pour produire @a$SubGoal$ vêtements, vous avez besoin de @a$SubGoal$ de coton."
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Militaire<t>Vos navires marchands et d'escorte<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
