"0xfc3fdd9b" = "Vous n'avez pas réussi à rétablir la population de Tortuga.<n><n>Dès que la ville atteint le statut \"boum\" ou supérieur, de nouveaux ouvriers peuvent être engagés. Vous pouvez procurer à la ville de nouveaux ouvriers grâce à des familles de colons. Celles-ci viennent d'Europe pour s'installer dans les villes principales, où elles attendent d'être transférées vers d'autres villes. Vous trouverez aussi des colons qui attendent dans des villes d'un statut inférieur."
