"0xe799be68" = "Le boucanier %1, %2, a contaminé d'importantes réserves de nourriture dans la ville. Une famine s'est déclarée. Tant que la famine dure, le prix du blé, des fruits, du maïs et de la viande va monter."
"0xe79fc3ee" = "Par équipage"
