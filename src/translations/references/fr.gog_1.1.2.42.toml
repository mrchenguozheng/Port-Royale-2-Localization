"0xf64f1e5a" = "Comme vous le savez, nous sommes en guerre. Pour affaiblir l'économie de @n$TargetNation$, je veux que vous capturiez ou couliez @I$NumShips$ navires marchands. Acceptez-vous cette mission ? "
"0xf64f1e5b" = "Nous sommes en guerre contre @n$TargetNation$. Je veux que vous capturiez ou couliez un nombre spécifique de navires marchands. Tout ce que vous pillerez sera à vous, tout ce qui m'importe est d'affaiblir l'économie de @n$TargetNation$. Puis-je compter sur vous ?"
"0xf64f1e5c" = "Je me demandais si vous pourriez nous aider dans notre guerre contre @n$TargetNation$. Je voudrais vous envoyer dans une zone spécifique pour y couler ou y capturer des navires. "
"0xf651cc3f" = "La Hollande et l'Angleterre ont signé la paix. Vous ne pouvez plus capturer de villes.<n><n>Vous avez été loin dans ce scénario, mais vous n'avez pas capturé suffisamment de villes pour la Hollande. <n><n>Vous pouvez capturer des villes de la même manière quand vous jouez une partie libre. Mais vous devez d'abord vous assurer que la puissance militaire de la nation visée est faible. De plus, la nation qui veut capturer ces villes doit être forte militairement et les deux nations doivent être en guerre.<n><n>Remarque : vous obtenez souvent des terres lorsque vous capturez des villes pour un vice-roi, où établir vos propres villes. Mais cette fonction est désactivée dans ce scénario."
"0xf65a5a04" = "Vous pouvez maintenant améliorer votre réputation envers %1 en attaquant les navires anglais et leurs villes. Cela ne diminuera pas votre réputation dans les autres nations."
"0xf65b6f4c" = "Aujourd'hui, le boucanier espagnol %1 a croisé la route d'un convoi militaire anglais et a été tué."
"0xf65b6f4d" = "Aujourd'hui, le boucanier espagnol %1 a croisé la route d'un convoi militaire français et a été tué."
"0xf65b6f4e" = "Aujourd'hui, le boucanier espagnol %1 a croisé la route d'un convoi militaire hollandais et a été tué."
"0xf662124e" = "Le convoi de pirate %1 a été détruit."
"0xf669f78e" = "La flotte du trésor espagnole s'est amarrée à la ville de %1"
"0xf67158d8" = "Jeu libre"
"0xf680e197" = "%1 vous attend au marché."
"0xf6957b90" = "Navires dans le port"
"0xf69c4221" = "Attaque contre %1"
"0xf6a84efd" = "Nous sommes en l'an de grâce 1570, dans les Caraïbes. Votre objectif consiste à grimper dans l'échelle sociale, pour passer du rang d'humble marchand à celui d'homme d'affaires influent. Pour parvenir à atteindre ce statut, vous pouvez transporter des marchandises, commercer, construire et même faire de la politique ou devenir pirate.<n><n>Le scénario suivant vous apprendra les principes élémentaires nécessaires pour jouer. Ce scénario, comme les autres, comprend plusieurs objectifs.<n><n>Vous pouvez maintenant fermer cette fenêtre en cliquant sur le bouton Fermer et vous référer à la fenêtre Evénement, en bas à gauche de l'écran.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Suivez les instructions données dans la fenêtre Evénement."
"0xf6bb9f8c" = "Prix"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "Carte graphique"
"0xf6c77503" = "Le repaire du pirate %1 a été découvert. Quel aventurier héroïque osera attaquer et détruire ce repaire ?"
"0xf6ec5ddc" = "Des choses étranges se passent à Tortuga. Des événements par le passé ont fait que les marchands sont maintenant réticents à mettre les pieds en ville. Votre tâche est de soutenir Tortuga en lui fournissant des marchandises.<n><n>Mais votre capital de départ n'est pas phénoménal. Vous avez @g$StartGold$ de disponible dans votre caisse. Néanmoins, vous êtes assez bien équipé en convois marchands dans le port et vous avez quelques entrepôts de marchandise.<n><n>Votre premier objectif est de porter votre réserve d'argent à @g$GoldGoal$. Atteignez cet objectif le plus rapidement possible, sans que cela prenne plus de 40 jours.<n><n>Un petit conseil : ne vendez en aucun cas vos navires. Cependant, vous pouvez emprunter de l'argent.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Portez votre réserve d'argent à  @g$GoldGoal$ avant le @D$EndDate$."
"0xf70feddb" = "Vous êtes de retour à Carthagène et votre convoi, la \"Santa Maria\", est sélectionné.<n>Comme vous pouvez le voir, le convoi a déjà certaines marchandises : du coton, de la viande et du cacao.<n>Trouvez les docks au port et cliquez dessus, pour vendre vos marchandises."
"0xf70feddc" = "Sur les docks, vous pouvez vendre et acheter des marchandises tant avec votre entrepôt qu'avec votre convoi.<n>Vous pouvez voir les marchandises dont dispose la ville et celles qui sont dans votre convoi. Utilisez les flèches pour acheter et vendre (les prix sont indiqués sur les flèches).<n>Vendez votre coton."
"0xf70feddd" = "Vous pouvez remarquer que le prix du coton a baissé quand vous en avez vendu.<n>C'est parce que le prix est déterminé en fonction de l'offre et de la demande dans la ville.<n>Vendez des marchandises pour répondre à la demande et le prix baisse. Si vous en achetez, le prix montera.<n>Achetez @a$SubGoal$ de blé."
"0xf70fedde" = "Vous avez vu le prix du blé monter ? <n>Remarquez toutefois que le prix n'est pas lié qu'aux stocks, mais aussi à votre réputation dans la ville.<n>Cliquez sur le bouton avec un bâtiment en bas à droite de la fenêtre de Commerce."
"0xf70feddf" = "Vous pouvez maintenant échanger des marchandises entre votre entrepôt et la ville.<n>Dans chaque ville où vous souhaitez produire une marchandise, vous devez construire un entrepôt. Vous possédez toujours un entrepôt dans votre ville de départ.<n>Vendez toutes les marchandises qui sont dans l'entrepôt."
"0xf70fede0" = "Il y a trois boutons marqués 1, 10 et 100 en haut de la fenêtre de Commerce, qui permettent de vendre ou d'acheter plus rapidement de grosses quantités de marchandises. Cliquez sur le bouton 10 et remarquez le prix changer.<n>Peu importe que vous achetiez 10 x 1 marchandise ou 1 x 10 marchandises : le prix total sera le même. Achetez @a$SubGoal$ de rhum."
"0xf70fede1" = "La colonne tout à fait à droite du menu de commerce vous présente les prix moyens pour les marchandises que vous achetez. Comme vous voulez vendre plus cher vos marchandises, vous devez trouver une ville qui les achètera plus cher que vous les avez payées.<n>Ouvrez la fenêtre de Transfert entre vos navires et l'entrepôt, en cliquant sur le quatrième bouton (avec une grue), en bas à droite."
"0xf70fede2" = "Dans cette fenêtre, vous pouvez transférer des marchandises entre votre convoi et votre entrepôt. Chargez toutes les marchandises qui sont encore dans l'entrepôt dans votre convoi, car vous allez les vendre dans une autre ville.<n>Fermez la fenêtre de Commerce en cliquant sur le bouton \"X\"."
"0xf70fede3" = "Affichez la carte maritime et envoyez votre convoi à Santa Marta. N'entrez pas à Santa Marta, mais cliquez avec le bouton droit de la souris sur la ville dès que le convoi y arrive. "
"0xf70fede4" = "Cela vous permet d'ouvrir la fenêtre de Commerce de Santa Marta.<n>Ainsi, vous n'avez pas besoin d'entrer dans une ville pour y commercer.<n>Vendez toutes les marchandises que vous avez dans le convoi.<n>Fermez la fenêtre de Commerce."
"0xf7110875" = "Etes-vous certain de vouloir supprimer la partie sauvegardée ?"
"0xf725f22c" = "Votre convoi est à Santa Marta. Cliquez sur le nom de la ville pour obtenir des informations à son sujet.<n>Vous pouvez le faire depuis la carte maritime ou en entrant dans la ville."
"0xf725f22d" = "Vous y voyez les marchandises qui sont produites dans la ville.<n><n>Vos relations avec l'Espagne y sont également affichées : vous êtes considéré comme un ami ! Cela signifie que vous y obtiendrez les meilleurs prix possibles.<n><n>Fermez la fenêtre et promenez-vous dans la ville."
"0xf725f22e" = "Cliquez sur le symbole des habitants sous le nom de la ville, à gauche de l'écran pour voir les stocks de Santa Marta."
"0xf725f22f" = "Vous y voyez la quantité de marchandises en stock et celle consommée par la ville. Naturellement, le niveau de consommation est lié à la population de la ville.<n>Cela vous permet de savoir combien de marchandises peuvent être régulièrement livrées dans la ville. Fermez la fenêtre des Stocks."
"0xf725f230" = "Il est temps de faire des profits conséquents.<n>Ouvrez la fenêtre de Commerce et achetez autant de coton, de sucre et de cacao que vous pouvez en transporter, car ces marchandises sont produites dans cette ville.<n>Retournez ensuite à Carthagène et vendez ces produits en faisant un profit."
"0xf725f231" = "Vous venez de recevoir deux messages avec des conseils pour vous aider à devenir riche en commerçant.<n>Ouvrez le journal pour lire les messages.<n>"
"0xf725f232" = "Vendez autant de marchandises que vous le pouvez au-dessus du prix moyen et achetez de nouvelles marchandises.<n>Remarque : les prix des marchandises dont manque la ville sont indiqués en rouge. Vous obtiendrez toujours d'excellents prix pour ces marchandises.<n>"
"0xf725f233" = "Les villes principales comme Carthagène reçoivent régulièrement des marchandises importées d'Europe.<n>Vous pouvez généralement les revendre en faisant des bénéfices dans des villes coloniales, comme Santa Marta, Maracaibo ou Gibraltar.<n>Faites un peu de commerce tout seul.<n>Votre objectif est de gagner @g$GoldGoal$ en commerçant."
"0xf7346191" = "Marchand de %1"
"0xf73619d7" = "Le repaire des pirates a été découvert"
"0xf7370c4b" = "%1,<n>il y a bien d'autres personnes que j'aurai préféré voir. Nous devons parler ? Entrez, si vous le devez."
"0xf73bf67d" = "Allez dans la vue de la ville de Carthagène.<n>Généralement, vous devez ancrer votre convoi dans le port pour entrer dans la ville. Toutefois, comme vous avez un entrepôt à Carthagène, vous pouvez y entrer quand vous voulez.<n>Cliquez sur le chantier naval de Carthagène."
"0xf73bf67e" = "Au chantier naval, achetez un petit navire. Ne dépensez pas trop d'argent, car vous aurez besoin d'argent pour commercer et entretenir vos navires."
"0xf73bf67f" = "Au cours du dernier scénario, vous avez appris à ajouter des navires dans un convoi en cliquant sur le port avec le bouton droit de la souris.<n>Vous allez maintenant créer un nouveau convoi en engageant un capitaine à l'auberge.<n>Trouvez l'auberge (au centre de la ville) et cliquez dessus."
"0xf73bf680" = "Vous trouverez toujours les capitaines dans les auberges. S'il y a un capitaine dans la ville, cela vous sera indiqué par le troisième bouton de menu de l'auberge.<n>Si vous avez d'autres navires ou convois dans le port, vous devez dire au capitaine auquel vous allez l'affecter.<n>Précisez-lui qu'il sera le capitaine de votre nouveau navire."
"0xf73bf681" = "Félicitations ! Vous avez créé votre premier convoi ! Votre prochaine mission consiste à gagner @g$GoldGoal$. Vous pouvez savoir à tout moment combien vous avez d'argent en regardant la section \"Victoires\" du Journal.<n><n>Bonne chance !"
"0xf73dab55" = "Merci d'avoir accompli la dernière mission que je vous ai donnée."
"0xf73dab56" = "Je veux vous remercier pour avoir accompli ma dernière mission."
"0xf73dab57" = "Je vous suis reconnaissant pour votre soutien."
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "Vous débutez votre carrière avec <o:0xFFF2FAAD>%1<o> pièces d'or et une <o:0xFFF2FAAD>Caravelle<o> (60 tonnes, 8 canons maximum)."
"0xf7534d8f" = "Lorsque vous transportez des colons dans une ville qui en manque, les colons vous remercieront en vous payant le voyage.<n><n>Il faut également quelques outils pour produire des marchandises coloniales, comme le cacao. Si ces outils ne sont pas disponibles, la production s'interrompt. Quand vous en saurez plus sur les prix et les quantités, vous pourrez donner des ordres au gérant de l'entrepôt pour qu'il achète régulièrement des outils en ville. Mais pour éviter de prendre des risques, commencez par les acheter vous-même.<n><n>C'est votre nouvelle mission. Plus rien ne vous empêchera ensuite de produire du cacao.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Objectif<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produisez du cacao et stockez @a$AmountGoal$ de cacao dans l'entrepôt."
"0xf760fd2a" = "Merci. Voici vos %1. Je reste jusqu'au %2. Vous pouvez me rapporter d'autres marchandises jusqu'à cette date."
