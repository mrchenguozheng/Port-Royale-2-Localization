"0xed34fe04" = "Convoi militaire"
"0xed5e6448" = "Je vous remercie d'avoir détruit ce convoi pirate. Voici une récompense de @g$GoldReward$.<n>Au fait : à chaque fois que vous accomplissez une mission pour moi, vous améliorez votre réputation auprès de ma nation.<n>Si, en revanche, votre réputation avec ma nation est faible, je ne pourrais vous confier aucune mission."
"0xed5e6449" = "Je vous remercie d'avoir détruit ce convoi pirate. Voici une récompense de @g$GoldReward$. Si la chance est de votre côté, nous découvrirons bientôt le repaire de ce pirate. Nous pourrons alors le détruire."
"0xed6ee3f7" = "%1 est promu"
"0xed88c9e3" = "%1,<n><n>Un paiement de %2 devait être payé à %3. La somme a été prise sur le compte.<n><n>Le trésorier de %4"
