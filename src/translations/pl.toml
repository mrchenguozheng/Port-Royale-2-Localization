"0x34ac2ac7" = "Zniszcz wszystkie pirackie konwoje Czarnobrodego na morzu. Nie atakuj jego kryjówki!"
"0x34bc8fad" = "%1: Brakuje surowców"
"0x34c2fbaa" = "Całkowity czas gry"
"0x34d0f9eb" = "%1.%2.%3"
"0x34d36971" = "Niektóre elementy szlaku kupieckiego muszą zostać zmienione.<n><n>W tej grze, niektóre miasta na szlaku nie zostały jeszcze odkryte i zostały usunięte, albo chcesz handlować towarami w mieście, w którym nie ma magazynu. W takim przypadku zostaje aktywowany handel odpowiednimi towarami przy udziale kapitana."
"0x34f151a7" = "Projekt podręcznika i okładki"
"0x350099bd" = "%1 dni"
"0x350993a3" = "Dziękuję ci! Mój piękny statek nareszcie wrócił do mnie. Niestety, nie mogę dać ci złota, ale dostarczę dla ciebie trochę znakomitych towarów na rynek miasta @T$Town$. "
"0x350e2781" = "Miasto"
"0x35239275" = " Musimy szybko uzupełnić te niedobory. Czy pomożesz mi to zrobić?"
"0x3526e1e7" = "Enter"
"0x352df805" = "Kapitulacja"
"0x35353f8f" = "Splądruj miasto @T$TargetTown$, którym rządzi @n$HostileNation$ i uwolnij żonę gubernatora, zanim nadejdzie @D$EndDate$."
"0x35353f90" = "Ta rozpieszczona pudliczka Misia, która należy do gubernatora miasta @T$TOWN$ jest trzymana dla okupu w mieście @T$TargetTown$. Splądruj miasto i uratuj psa, zanim nadejdzie @D$EndDate$."
"0x35353f91" = "Zaatakuj miasto @T$TargetTown$, którego władcą jest @n$HostileNation$, zanim nadejdzie @D$EndDate$, aby uwolnić młodszą córkę gubernatora."
"0x35392fbd" = "Gratulacje, udało ci się pomyślnie ukończyć pierwszy scenariusz. Teraz umiesz wybierać konwoje i wysyłać je do innych miast. Nauczyłeś się także, jak wchodzić do budynków w mieście, aby wykonywać różne akcje, takie jak kupowanie statków.<n><n>Następny rozdział poświęcony jest zdobywaniu pieniędzy przez umiejętne handlowanie."
"0x353a3e45" = "Biblioteka grafiki płaskiej i narzędzia ekranu"
"0x353cae5f" = "…wielu uczestników forum Port Royale, których pomysły i propozycje sprawiły, że powstała druga część Port Royale.<n>...beta-testerów Port Royale 2, którzy okazali niesłabnące poświęcenie dla projektu przez cały czas testowania wersji beta. Nicole Jeannette Pescher, Don Geraldo i BMP z beta-testów za logo, które przysłali."
"0x35450579" = "Zbadałam nowe artefakty i myślę, że wyryte na nich znaki wskazują jakieś miejsce. %1 Ale nie jestem jeszcze pewna. Mam nadzieję, że znajdziesz jeszcze jakieś artefakty, bowiem z pewnością wtedy uda mi się dokładniej ustalić to położenie."
"0x3545057e" = "Dowiedziałam się czegoś więcej o artefaktach i o tym specjalnym miejscu. Teraz mogę powiedzieć na pewno jedno: %1 Nie wiem, co tam się znajduje. Potrzebuję więcej artefaktów, aby dokładniej ustalić to położenie."
"0x354505ea" = "Mam dla ciebie kilka bardzo dobrych wieści: dzięki ostatniemu artefaktowi jaki znalazłeś, udało mi się ustalić dokładne położenie tego miejsca. Tutaj, zaznaczę je na twojej mapie morskiej. %1<n>Proszę, uważaj na siebie, bo nikt nie wie, co cię tam czeka."
