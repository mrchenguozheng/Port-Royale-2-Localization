"0xef77d11d" = "%1 pirat %2 zniszczył umocnienia nadbrzeżne miasta i splądrował miasto. Status miasta pogorszył się."
"0xef795016" = "Miasto otrząsa się po ataku."
"0xef88a0d4" = "Och, słuchaj. Właśnie otrzymałem wiadomość od mojego kuriera. Misja, którą miałem ci dać, jest już nieważna. Chyba zbyt długo leżała na moim biurku!"
"0xef95e919" = "Zabrany rozbitek"
"0xef95e91a" = "Zabrani rozbitkowie"
"0xef9ba866" = "Robert Andreas Drude"
"0xefbbbbe9" = "Nadszedł czas, aby znaleźć piracką kryjówkę Czarnobrodego i położyć kres jego nikczemnym uczynkom. Gdy pirat od pewnego czasu działa na jakimś obszarze, jest tylko kwestią czasu, zanim jego kryjówka zostanie odkryta. Ale ty także możesz na to wpłynąć: od czasu do czasu piracki konwój wraca do swojej kryjówki, aby wyładować łupy i dokonać niezbędnych napraw.<n>Jeśli podążysz za jednym z tych pirackich konwojów na mapie morskiej i zobaczysz jak znika w swojej kryjówce, jest bardzo prawdopodobne, że udało ci się odkryć położenie kryjówki. Gdy odnajdziesz kryjówkę, możesz ją zniszczyć atakując z morza w ten sam sposób, w jaki atakuje się miasto.<n><n>Wskazówka:<n> @l$IslandPos$ Czekaj, aż konwój zbliży się i obserwuj jak znika w swojej kryjówce.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Znaleźć kryjówkę Czarnobrodego."
"0xefc2e122" = "Jeszcze nie odzyskałeś mojego statku? Proszę, zacumuj go w porcie, gdy tylko go znajdziesz, a potem wróć do mnie."
