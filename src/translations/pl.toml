"0xcff9644a" = "Gra „Jednoręki Pirat” to gra hazardowa z 32 kartami. Każdy gracz wykłada swoją stawkę i dostaje 5 kart, których nie widzi drugi gracz.<n><n>Najpierw każdy gracz musi zalicytować pewną liczbę punktów, które zamierza wygrać. Każde rozdanie warte jest jeden punkt. Gracz, który wylicytuje najwyższą liczbę punktów prowadzi w grze i wybiera atut. Gracz musi teraz spróbować wygrać co najmniej zalicytowaną liczbę punktów.<n><n>Gracz, który prowadzi, pierwszy zagrywa swoją kartę, a drugi gracz musi odpowiedzieć zagrywając kartą tego samego koloru, jeśli może. Gracz, który zagrał najwyższą kartę wygrywa punkt.<n><n>Jeśli gracz nie może zagrać karty w odpowiednim kolorze, może odrzucić dowolną kartę, albo zagrać atut.<n><n>Sekwencja kart jest następująca: I, II, III, IV, Pirat, Narzeczona, Gubernator, Papuga. Atut przebija wszystkie inne karty.<n><n>Gracz, który zdobył punkt, zagrywa następną kartę. Gracze kontynuują rozgrywkę, aż któryś z nich wygra grę.<n><n>Jeśli prowadzącemu grę uda się zdobyć zalicytowaną liczbę punktów, wygrywa grę i zabiera pulę. Jeśli to mu się nie uda, wygrywa jego przeciwnik."
