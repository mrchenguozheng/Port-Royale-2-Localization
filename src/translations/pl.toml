"0xd5f46344" = "Im dłużej patrzę na te artefakty, tym silniejsze mam wrażenie, że mają one specjalne znaczenie, wykraczające poza ich zastosowanie praktyczne. Na niektórych z nich znalazłam dziwne ryty. Może znajdziesz jeszcze więcej artefaktów. To by nam pomogło."
