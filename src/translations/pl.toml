"0x0ce1a79e" = "Znajdujesz się w kolonialnym mieście Santa Marta. Kliknij na nazwie miasta, aby wyświetlić informacje o nim."
"0x0ce1a79f" = "Miasta kolonialne, takie jak Santa Marta, mogą produkować dwa towary podstawowe, dwa surowce i jeden towar kolonialny.<n>W ostatnim scenariuszu dowiedziałeś się, że w miastach gubernatorskich jest szczególnie wysoki popyt na surowce i dobra kolonialne.<n>Najpierw spróbujemy wyprodukować towar kolonialny - kakao.<n>Teraz zamknij okno informacji o mieście."
"0x0ce1a7a0" = "Ponieważ towary kolonialne są transportowane z miast gubernatorskich do Europy, w takich miastach popyt na kakao jest wysoki. To dobre warunki do założenia twojego pierwszego przedsiębiorstwa. Teraz znajdź w centrum miasta siedzibę mistrza budowlanego i kliknij na niej."
"0x0ce1a7a1" = "U mistrza budowlanego możesz wystąpić o zezwolenie na postawienie nowego budynku, albo oddać swoje zezwolenie. Oczywiście, teraz nie rób tego!<n>Obejrzyj różne budynki, jakie możesz postawić. Możesz także używać przycisków po prawej stronie okna mistrza budowlanego.<n>Kliknij na przycisku plantacji kakao."
"0x0ce1a7a2" = "Zobaczysz jak wiele materiałów budowlanych będzie potrzebnych i jakie będą koszty budowy.<n>Możesz także sprawdzić, ile materiałów budowlanych masz obecnie w swoim magazynie i ile trzeba będzie kupić od miasta.<n>W tej chwili masz dość materiałów.<n>Umieść swój kursor na dostępnym polu budowy i kliknij na nim."
"0x0ce1a7a3" = "Pojawią się rusztowania przedsiębiorstwa produkcji kakao i budowa rozpocznie się.<n>Ukończenie budowy zabierze kilka dni. W międzyczasie powinieneś zorganizować mieszkania dla swoich nowych pracowników.<n>Zamknij menu budowy i poszukaj obszarów mieszkalnych w mieście Santa Marta. "
"0x0ce1a7a4" = "Ten obszar mieszkalny należy do kupca z miasta. Możesz sprawdzić ile obszarów mieszkalnych należy do miejscowych kupców i ile jest w nich mieszkańców. Spróbuj zbudować własny obszar mieszkalny. W tym celu otwórz menu budowy."
"0x0ce1a7a5" = "Wybierz obszar mieszkalny w menu budowy i spójrz na koszty konstrukcji. <n>Być może w magazynie masz za mało materiałów budowlanych. Możesz jednak kupić dowolne potrzebne materiały w mieście, o ile miasto posiada odpowiednie zapasy. <n>W innym przypadku konieczne będzie zaopatrzenie się w innym mieście.<n>Następnie wybuduj obszar mieszkalny."
"0x0ce1a7a6" = "Przedsiębiorstwo zapewnia zatrudnienie dla 30 pracowników. Ponieważ przeciętna rodzina pracownika składa się z czterech członków rodziny, dla każdego założonego przez ciebie przedsiębiorstwa będą potrzebne kwatery mieszkalne dla 120 ludzi. <n>Obszar mieszkalny ma miejsce dla 120 mieszkańców, a zatem każde przedsiębiorstwo wymaga jednego obszaru mieszkalnego.<n>Teraz zamknij menu budowy i kliknij na swoim nowym obszarze mieszkalnym."
"0x0ce1a7a7" = "Budowa obszaru mieszkalnego nie zabiera czasu, ponieważ mieszkańcy początkowo mieszkają w namiotach.<n>Z biegiem czasu sami mieszkańcy zmienią obszar mieszkalny w spory budynek.<n>Wygląd obszaru mieszkalnego zależy od jego wieku i od statusu miasta.<n>Zamknij okno dialogowe mieszkalnego."
"0x0ce1a80f" = "Jak wiesz, twoim pierwszym budynkiem w mieście zawsze musi być magazyn. Nie możesz stawiać innych budynków, dopóki nie wybudujesz magazynu.<n>Posiadasz już magazyn w mieście, w którym rozpoczynasz grę. Znajdź go i kliknij na nim. Magazyn jest pokazany na ekranie w kolorze jasnoniebieskim."
"0x0ce1a810" = "W magazynie możesz sprawdzić jakie budynki w mieście należą do ciebie i jakie są koszty ich utrzymania.<n>Możesz także zobaczyć jak duży czynsz płacą ci twoi mieszkańcy i jakie towary produkują twoje przedsiębiorstwa.<n>Później będziesz mógł wydawać polecenia magazynierowi.<n>Rozejrzyj się po magazynie, a potem zamknij go."
"0x0cee08cc" = "obecność wojskowa w tym mieście mogłaby być lepsza"
"0x0cf75014" = "Zamknij"
"0x0cf7abef" = "Kliknij na swojej plantacji kakao. W tym oknie zawsze zobaczysz wszystkie swoje plantacje kakao w mieście.<n>Po zakończeniu budowy twoich przedsiębiorstw, będziesz potrzebował 30 pracowników, to jest 30 osadników. Teraz opuść plantację, przejdź do doków w porcie i naciśnij przycisk „Ładunek” (przycisk na dole, po prawej stronie)."
"0x0cf7abf0" = "Tutaj możesz zobaczyć ilu osadników czeka na wynajęcie w mieście, albo przekonać się, czy miasto potrzebuje nowych pracowników. Tak się stanie, gdy tylko zakończy się budowa twojego przedsiębiorstwa.<n>Wybierz się do okolicznych miast gubernatorskich i sprowadzaj osadników do miasta Santa Marta, aż twoje przedsiębiorstwo zatrudni pełną obsadę pracowników."
"0x0d0db040" = "Kliknij na jednej ze swoich plantacji kakao."
"0x0d0db041" = "Zobaczysz, ile kakao twoje przedsiębiorstwo produkuje każdego dnia i ile potrzebuje narzędzi.<n>Teraz zakup zapas @a$SubGoal$ narzędzi do swojego magazynu, ponieważ twój magazyn dostarcza towary do przedsiębiorstw."
"0x0d0db042" = "Narzędzia to towary importowane. Oznacza to, że największy ich zapas i najniższe ceny znajdziesz w miastach gubernatorskich.<n>Możesz spróbować zdobyć ich trochę w Cartagenie na południowym zachodzie, albo na dalekim wschodzie w mieście Margarita."
"0x0d0db043" = "Dobra robota!<n>Im niższą średnią cenę zapłacisz za potrzebne surowce, tym niższe będą koszty produkcji dóbr, jakie wytwarzasz.<n>Teraz kontynuuj produkcję kakao, aż zgromadzisz zapas @a$AmountGoal$ w swoim magazynie."
"0x0d0f1795" = "Lipiec"
"0x0d0f1877" = "Czerwiec"
"0x0d1098bd" = "%1,<n>jesteś tutaj nowy, nieprawdaż? Ale słyszałem już o tobie, a twoje dobre imię cię wyprzedza. Powinieneś odwiedzać mnie od czasu do czasu, ponieważ zawsze jest coś do zrobienia."
"0x0d23b491" = "Pożegluj ze swoim konwojem do Cartageny i wejdź do miasta.<n>Symbol kółeczka jest wyświetlony poniżej nazwy miasta, po prawej stronie ekranu. Oznacza twój dotychczasowy rejestr handlowy z Cartageną.<n>W tym scenariuszu będzie ci trochę łatwiej, ponieważ otrzymałeś premię.<n>Teraz otwórz okno informacji o mieście."
"0x0d23b492" = "Pod zakładką „Rejestr handlowy” możesz sprawdzić jaki procent wymaganego wyniku udało ci się już uzyskać. Jeśli zobaczysz tam 100%, możesz zgłosić się o zezwolenie do mistrza budowlanego.<n>Zamknij okno informacji o mieście."
"0x0d23b493" = "Ceny towarów, których brakuje w mieście, są pokazane na czerwono w oknie handlu. Jeśli sprzedasz te towary, poprawisz swój rejestr handlowy z miastem i reputację w narodzie, do którego należy to miasto.<n>Kliknij na dokach, aby wyświetlić informacje o zapasach towarów w mieście."
"0x0d23b494" = "Zwróć uwagę jakich towarów brakuje w mieście. Na przykład, to miasto zawsze potrzebuje cukru i bawełny, ponieważ produkuje rum i ubrania.<n>Ale w mieście brakuje także innych towarów.<n>Wybierz się do innych miast, aby kupić towary, których potrzebuje Cartagena i poprawić w ten sposób swój rejestr handlowy."
"0x0d23b495" = "Nieźle! Udało ci się znacząco poprawić swój profil w Cartagenie.<n>Uważaj jednak, żeby nie wykupić żadnego towaru, którego w Cartagenie brakuje! Łatwo możesz rozpoznać takie towary, ponieważ ich zapasy są wyświetlone na czerwono.<n>Zwiększ swój wynik rejestru handlowego do 85%."
"0x0d23b496" = "Dobra robota! Teraz masz wynik 85% w Cartagenie. Trzymaj tak dalej!<n>Zwiększ swój wynik do 100%.<n>Przy okazji, właśnie otrzymałeś komunikat o „awansach i rangach”."
"0x0d23b497" = "Doskonale! Wystarczająco pohandlowałeś z Cartageną.<n>Niestety, twoja ranga to nadal „Zwykły żeglarz”, a zatem możesz uzyskać tylko jedno zezwolenie na budowę.<n>Aby uzyskać awans na następną rangę, musisz zwiększyć swój majątek handlując jeszcze trochę. "
"0x0d23b498" = "Bardzo dobrze! Jako Żeglarz masz prawo do dwóch zezwoleń na budowę.<n>Udaj się do mistrza budowlanego w Cartagenie i poproś o zezwolenie.<n>Jeśli masz za mało złota, musisz pohandlować jeszcze trochę. Nie zapominaj handlować towarami, które produkujesz w mieście Santa Marta."
"0x0d2a3b89" = "Utrzymanie statku"
"0x0d39b8e2" = "Zanim będziesz mógł postawić jakiekolwiek inne budynki w Cartagenie, musisz najpierw zbudować magazyn."
"0x0d39b8e3" = "Teraz postaw dwa młyny tkackie i zbuduj dwa obszary mieszkalne.<n>Jeśli w mieście nie ma odpowiedniej ilości  materiałów budowlanych, to będziesz musiał je zakupić w innym mieście i dostarczyć do twojego magazynu, który znajduje się w dokach. <n>Nie zapomnij potargować się o cenę, zanim rozstaniesz się z cennym złotem!"
"0x0d39b8e4" = "Zadbaj o zabezpieczenie zapasu @a$SubGoal$ bawełny w magazynie do czasu wybudowania twoich warsztatów tkackich, aby nowe przedsiębiorstwa mogły od razu zacząć tkać sukno z bawełny."
"0x0d39b8e5" = "Twoim następnym celem jest wyprodukowanie własnych zapasów @a$SubGoal$ sukna do magazynu w Cartagenie i oczekiwanie na wybudowanie twoich warsztatów tkackich.<n>Aby uzyskać @a$SubGoal$ sukna, potrzebujesz dokładnie @a$SubGoal$ bawełny."
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Wojskowy<t>Twoja eskorta i statki kupieckie<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Pirat<t>Twoja eskorta i statki kupieckie<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "Niewłaściwy zapis gry!"
"0x0d496e89" = "Klikaj na towarach, aby aktywować lub anulować zakup."
"0x0d496e8a" = "Automatyczne zakupy przez magazyniera"
"0x0d4fbd33" = "Bardzo dobrze!<n>Aby sprawić, żeby zawsze wystarczało surowca do twoich warsztatów tkackich, teraz musisz założyć przedsiębiorstwo produkcji bawełny w mieście Santa Marta.<n>Jedno przedsiębiorstwo produkcyjne może dostarczyć surowców dla dwóch przetwórni."
"0x0d4fbd34" = "Teraz zadbaj o to, by twoje przedsiębiorstwa w Santa Marta i Cartagenie pracowały z pełną parą.<n>Nie zapominaj, że twoje warsztaty tkackie w Cartagenie wymagają stałych dostaw bawełny.<n>Kontynuuj produkcję i sprzedawaj wyprodukowane przez siebie dobra.<n>Ten scenariusz zakończy się, gdy zwiększysz swoją gotówkę do @g$GoldGoal$."
"0x0d552127" = "Miasto nie może zostać zaatakowane"
"0x0d578089" = "Zaatakowałeś już miasto %1 w ciągu ostatnich 30 dni. Kapitan odmawia ponownego ataku z powodów moralnych."
"0x0d58ea99" = "%1 pirat %2 zabrał %3 robotników wraz z ich rodzinami. Wiele przedsiębiorstw w mieście nie działa z pełną wydajnością."
"0x0d750c45" = "%1 konwojów"
"0x0d919a5a" = "%1,<n>wiesz dobrze, że w normalnych okolicznościach posłałbym cię do diabła, ale w tak trudnych czasach, sam jestem gotów sprzedać swoją duszę diabłu.<n><n>Wchodź, zatem. Mam ci coś do powiedzenia."
"0x0d9c1799" = "Twoje zadanie polega na sprawieniu, by status miasta @T$TargetTown$ spadł do stanu „Recesja”, zanim nadejdzie @D$EndDate$. Masz dwie możliwości:<n><n>możesz zaatakować miasto i splądrować wszystkie jego towary, aby doprowadzić do stanu „Odnowa”. Status miasta będzie dalej pogarszał się z powodu niedoboru towarów.<n><n>Możesz także odciąć dopływ towarów do miasta przechwytując konwoje kupieckie. Uwaga: Jeśli będziesz tylko plądrował konwoje, ale nie przejmował ich, twoja reputacja w odpowiednim narodzie ucierpi w znacznie mniejszym stopniu."
"0x0d9c179a" = "Dobrze! Przydzielam ci misję, której celem jest sprawienie, by status miasta @T$TargetTown$ spadł do stanu „Recesji”. Masz czas, zanim nadejdzie @D$EndDate$.<n><n>Aby osiągnąć swój cel, musisz przechwycić wszystkich kupców odwiedzających miasto. W ten sposób nie będą do niego docierały towary i jego status zacznie powoli pogarszać się.<n><n>Istnieje jednak szybszy sposób. Oznacza zaatakowanie i splądrowanie miasta. Twój atak spowoduje, że status miasta szybko spadnie do stanu „Odnowa”, a powstały w jego rezultacie niedobór towarów w mieście zapewni dalsze pogarszanie się statusu, aż miasto znajdzie się w „Recesji”."
"0x0daa656f" = "Szrapnele"
"0x0dbd9444" = "Nic nie możesz dla mnie zrobić."
"0x0dbd9445" = "Niestety, w tej chwili nie mam żadnych wieści dla ciebie. Spróbuj później."
"0x0dbd9446" = "Obawiam się, że nie mam żadnych misji dla ciebie. Wróć do mnie za kilka dni."
"0x0dc7ffd3" = "Pirat atakuje"
"0x0de467bb" = "Organizator wesel"
"0x0e141340" = "Uzbrój swój konwój, aby miał przynajmniej trzy w pełni uzbrojone i obsadzone statki eskorty typu fregata lub lepszego."
"0x0e2cf5dd" = "Handel i produkcja"
"0x0e321cfd" = "Utrzymanie statku"
"0x0e539993" = "Bitwy morskie"
"0x0e60a698" = "Dziękuję ci za twój łaskawy datek."
"0x0e60a699" = "Dziękuję ci za twój łaskawy i hojny datek."
"0x0e632146" = "%1 - nastawienie wobec ciebie: %2"
"0x0e636f4c" = "Twoje miasto nie potrzebuje pracowników."
"0x0e7a4720" = "Wszystko, co zostało po kapitanie piratów, to samotny kapelusz. Widocznie został schwytany, a konwój zatonął."
"0x0e8bfce9" = "Według rangi kapitana"
"0x0e96019a" = "Mało towaru: %1"
"0x0ea0e0e8" = "Cóż, zatem idźmy dalej. Kieruj się na wody wokół miasta @T$TargetTown$."
"0x0ea0e0ea" = " Ukończ tę misję, zanim nadejdzie @D$EndDate$."
"0x0eb34b66" = "W tym scenariuszu nauczysz się zakładać przedsiębiorstwa i dowiesz się, co trzeba wziąć pod uwagę, gdy to robisz. Zbudujesz także obszary mieszkalne dla swoich nowych pracowników.<n><n>W grze Port Royale 2, możesz budować w każdym mieście, w którym zakupisz zezwolenie na budowę. Im więcej posiadasz zezwoleń, tym droższe będzie następne. Masz już jedno zezwolenie na budowę w mieście, w którym zaczynasz grę, zatem możesz od razu rozpocząć tam budowę nowych budynków.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zbuduj jedno przedsiębiorstwo produkcji kakao i jeden obszar mieszkalny w mieście Santa Marta."
"0x0ede126a" = "Teraz już wiesz jak toczą się bitwy morskie. Możliwe jest także zaatakowanie całego miasta, aby splądrować je lub przejąć w imieniu innego narodu. Jednak, aby to zrobić, musisz mieć wielkie konwoje z potężnymi statkami. Jak można sobie wyobrazić, atakowanie miasta poważnie naruszy twoją reputację w odpowiednim narodzie, a jego konwoje wojskowe zaczną cię od tej chwili ścigać.<n><n>Możesz także zaatakować kryjówkę piratów. Kryjówki piratów zwykle znajdują się w ukrytych lokacjach, ale każda z tych lokacji w pewnym momencie gry stanie się znana. Potem będziesz mógł zaatakować kryjówkę piracką w taki sam sposób, w jaki atakuje się miasto i zniszczyć całą bandę piratów.<n><n>Obrona takiej kryjówki zależy od tego, jak długo działała banda piratów i jak wiele konwojów kupieckich udało im się złupić.<n><n>Twoim ostatnim zadaniem w tym scenariuszu jest zaatakowanie małej kryjówki piratów. Dowiedz się, gdzie znajduje się kryjówka od gubernatora miasta @T$TOWN$.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n> <c>Zniszczyć kryjówkę pirata zwanego @P$PirateName$."
"0x0eecc4e8" = "Angielska kolonia"
"0x0eecc4e9" = "Francuska kolonia"
"0x0eecc4ea" = "Holenderska kolonia"
"0x0eecc4eb" = "Hiszpańska kolonia"
"0x0f1ade15" = "Teraz powinieneś stworzyć miejsca pracy w mieście i zbudować obszary mieszkalne.<n><n>Ponieważ osadnicy będą chcieli pozostać w twoim mieście, tylko jeśli znajdą tam pracę, powinieneś najpierw zbudować cztery przedsiębiorstwa produkcyjne. Zdecyduj, jakiego rodzaju przedsiębiorstwa chcesz zbudować. Pamiętaj jednak, aby produkować towary, które będziesz mógł sprzedawać z zyskiem w innych miastach, ponieważ koszty produkcji są wysokie, a polegasz na zyskach ze sprzedaży dóbr.<n><n>Cztery przedsiębiorstwa produkcyjne zapewniają pracę dla 120 pracowników. Ponieważ każdy z tych pracowników reprezentuje rodzinę złożoną z czterech osób, musisz zapewnić kwatery mieszkalne dla 480 obywateli, innymi słowy – cztery obszary mieszkalne.<n><n>Gdy twoje przedsiębiorstwa będą i obszary mieszkalne będą gotowe, możesz spróbować sprowadzić osadników z innych miast do twojego. Osadnicy zwykle czekają na pracę w miastach gubernatorskich. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zwiększ populację swojego miasta do 480."
