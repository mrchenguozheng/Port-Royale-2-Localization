"0xed34fe04" = "Konwój wojskowy"
"0xed5e6448" = "Moje podziękowania za zniszczenie tego pirackiego konwoju. Oto nagroda w wysokości @g$GoldReward$.<n>Przy okazji: gdy wypełnisz misję w moim imieniu, automatycznie poprawisz swoją reputację w moim narodzie.<n>Z drugiej strony, jeśli masz złą reputację w moim narodzie, obawiam się, że w takim przypadku nie będę mógł ci powierzyć żadnych misji."
"0xed5e6449" = "Moje podziękowania za zniszczenie tego pirackiego konwoju. Oto nagroda w wysokości @g$GoldReward$. Jeśli dopisze ci szczęście, wkrótce odkryjesz położenie kryjówki piratów. Gdy tak się stanie, zniszcz ją."
"0xed6ee3f7" = "%1 dostaje awans"
"0xed88c9e3" = "%1,<n><n>Termin spłaty pożyczka w wysokości %2 upływał w dniu %3. Cała suma została spłacona dzisiaj.<n><n>Skarbnik z: %4"
"0xeda0288d" = "Zamknij okno dialogowe/opcje"
"0xeda49c74" = "Zezwolenia na budowę"
"0xedad5b61" = "Nie udało ci się zwiększyć populacji Tortugi do @I$Pop$ w ciągu 20 dni po zakończeniu plagi. <n><n>Nowych robotników można najmować, gdy miasto osiągnie status „nagłego rozwoju” lub wyższy. Możesz dostarczać miastu nowych robotników w formie rodzin osadniczych. Przybywają z Europy do miast gubernatorskich, gdzie czekają na podróż do innych miast. Znajdziesz także osadników czekających na zabranie w miastach o niższym statusie."
"0xedc30aca" = "<ts:75><ts:150><ts:225><ts:300>Plaga szczurów zniszczyła jedzenie w twoich magazynach. Plagi szczurów powtarzają się regularnie, gdy kupcy gromadzą w swoich magazynach zbyt dużo żywności.<n><n>Straty:"
"0xedffe567" = "Wybierz muszkietera"
"0xee00c4df" = "<n><n>Zwykle możesz oddać zdobyte zezwolenie na budowę. Jednak w tym przypadku nie możesz tego zrobić, ponieważ %1 to miasto, w którym rozpocząłeś grę."
"0xee00c4e0" = "<n><n>Miejscowy kupiec oferuje ci %1 za twoje zezwolenie i budynki. Czy przyjmiesz tę ofertę? Pamiętaj, że wtedy stracisz wszystkie swoje budynki w tym mieście."
"0xee0f745a" = "<g:INTEXT_SCHATZKISTE_800x600.screen>"
"0xee286d68" = "%1,<n>dziękuję ci za przejęcie jednego z miast naszego wroga. "
"0xee286d69" = "%1,<n>dałem ci już misję. Wykonaj tę misję, ponieważ mam dla ciebie więcej pracy."
"0xee286d6a" = "%1,<n>twoja misja polegała na przejęciu miasta, ale zawiodłeś. Mam nadzieję, że następnym razem będziesz trzymał się naszej umowy."
