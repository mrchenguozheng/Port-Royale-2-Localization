"0xccdf1d34" = "Odkryto kryjówkę piratów."
"0xccfee7c3" = "%1<n>uciekły"
"0xcd01da76" = "Rozpoczynasz grę z rangą Żeglarza w hiszpańskim mieście gubernatorskim @T$TOWN$, gdzie masz już magazyn. W porcie masz także konwój z dwoma uzbrojonymi statkami, ale bez żeglarzy.<n><n>Pierwszym celem tego scenariusza jest odwiedzenie gubernatora miasta @T$TOWN$ i przyjęcie jego misji. Gubernator ma problem z głośnym piratem, Edwardem Teachem, lepiej znanym jako Czarnobrody i chce, żebyś mu pomógł.<n><n>Ważne: W tym scenariuszu panuje pokój między narodami. Oznacza to, że nie wolno ci atakować konwoju należącego do jakiegoś narodu.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Odwiedź gubernatora miasta @T$TOWN$ i przyjmij misję, jaką ci zleci."
