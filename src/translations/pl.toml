"0x1401d917" = " @s$USER$, mam pewne wiadomości, które z pewnością będą dla ciebie warte @g$Price$. Mój szwagier zna człowieka imieniem @N$TeacherName$, dawnego kapitana."
"0x1401d918" = "Usiądź obok mnie i nalej mi trochę rumu. Mam dla ciebie pewne wieści. Podczas mojej ostatniej podróży spotkałem człowieka imieniem @N$ContactName$. Był przyjacielem i uczniem legendarnego mistrza zwanego @N$TeacherName$. "
"0x1401d919" = " @s$USER$, usiądź obok mnie. Wiem, gdzie możesz znaleźć nauczyciela dla jednego ze swoich kapitanów. Czy pamiętasz, kim był @N$TeacherName$? "
