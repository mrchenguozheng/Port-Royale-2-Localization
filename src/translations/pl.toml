"0xfbd9dc11" = "Ostatnia bitwa morska %1 dni temu"
"0xfbdd7fd6" = "Mar"
"0xfc1051ba" = "Piraci przebili się przez umocnienia nadbrzeżne miasta i splądrowali różne produkty."
"0xfc2e7559" = "Plądruj"
"0xfc30a7c8" = "Automatyczny zakup broni/amunicji"
