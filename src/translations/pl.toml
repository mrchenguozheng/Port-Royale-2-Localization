"0xd3ac63e7" = "Z radością opowiem ci o życiu pirata Henry'ego Avery'ego."
"0xd3ac63e8" = "Czy słyszałeś o znanym piracie Edwardzie Teachu, znanym jako Czarnobrody?"
"0xd3ac63e9" = "Mógłbym ci coś opowiedzieć o plantacjach trzciny cukrowej."
"0xd3ac63ea" = "Opowiem ci, czego dowiedziałem się o handlu niewolnikami. Przekonałem się o tym na własne oczy."
"0xd3ac63eb" = "Czy kiedykolwiek spotkałeś się z określeniem „praca zakontraktowana”? Mogę ci coś o tym opowiedzieć."
"0xd3ac63ec" = "Pozwól sobie opowiedzieć o Akcie Nawigacyjnym."
"0xd3ac63ed" = "Sam znasz trudy morskich podróży i z pewnością wiesz coś o chorobach, jakie trapią żeglarzy?"
"0xd3ac63ee" = "Mam dla ciebie pewne ciekawe informacje o nazwach nadawanych nowym odkryciom geograficznym."
"0xd3ac63ef" = "Z chęcią podzielę się z tobą informacjami o wicekrólach z Nowego Świata."
"0xd3ac63f0" = "Z przyjemnością opowiem ci o kilku szczególnie interesujących odkryciach w Nowym Świecie."
"0xd3ac6458" = "Mógłbym ci wyjawić kilka źródeł pochodzenia mitów i legend."
"0xd3ac6459" = "Z pewnością zechcesz posłuchać o sir Walterze Raleigh’u, angielskim pisarzu i poszukiwaczu przygód."
"0xd3ac645a" = "Pozwól, że opowiem ci trochę o tym jak Europejczycy traktowali rdzennych Amerykanów."
"0xd3ac645b" = "Mam dla ciebie kilka informacji o udziale Niemców w wyprawach i o pierwszych Niemcach w Wenezueli."
"0xd3ac645c" = "Pozwól sobie opowiedzieć o hiszpańskich bogactwach."
"0xd3ac645d" = "Właśnie dowiedziałem się czegoś o Traktacie z Tordesillas."
"0xd3ac645e" = "Z pewnością stanąłeś już twarzą w twarz z piratem, albo dostałeś list kaperski?"
"0xd3ac645f" = "Czy kiedykolwiek spotkałeś się z określeniem „siedem mórz”? Opowiem ci, dlaczego jest błędne!"
"0xd3ac6460" = "Czy kiedykolwiek zwiedziłeś wyspy Bermudy, daleko na północnym wschodzie? Mogę ci coś o nich opowiedzieć."
"0xd3ac6461" = "Z rozkoszą opowiem ci trochę o wzroście potęgi Anglii na Nowym Świecie."
"0xd3ac64c9" = "Opowiem ci trochę o wielkiej podróży Kolumba przez Atlantyk i o odkryciu Ameryki."
"0xd3ac64ca" = "Skąd Ameryka wzięła swoją nazwę? Mogę ci odpowiedzieć na to pytanie."
"0xd3ac64cb" = "Opowiem ci o Hispanioli, pierwszej kolonii w Ameryce, która stała się bardzo ważna pod rządami Hiszpanów. "
"0xd3ac64cc" = "Jestem pewien, że handlujesz także rumem? Mogę ci coś o tym opowiedzieć."
"0xd3ac64cd" = "Może opowiem ci coś o Jamajce, wyspie, na której znajduje się miasto Port Royale?"
"0xd3ac64ce" = "Pozwól, że opowiem ci o Kubie, największej wyspie w Indiach Zachodnich."
"0xd3ac64cf" = "Wiesz, że wiele rzeczy, które teraz są dość powszechne w Europie, po raz pierwszy odkryto w Ameryce. Ale czy znasz jakieś „podarunki”, które Europa sprowadziła do Nowego Świata?"
"0xd3ac64d0" = "Czy kiedykolwiek handlowałeś kakao? Opowiem ci trochę o tej roślinie."
"0xd3ac64d1" = "Możesz w to nie uwierzyć, ale są także kobiety-piratki!"
"0xd3ac64d2" = "Czy kiedykolwiek słyszałeś o walijskim piracie Bartholomew Robertsie? "
"0xd3ac653a" = "Zdobyłem dla ciebie pewne informacje o piracie Henrym Morganie. Opowiem ci o tym."
"0xd3ac653b" = "Mam dla ciebie pewne wiadomości o Bahamach."
"0xd3ac653c" = "Opowiem ci trochę o systemie społecznym panującym w koloniach hiszpańskich."
"0xd3c78e1d" = "Z chęcią zlecę ci przejęcie miasta, którego właścicielem jest %1, ale niestety %1 ma nadal zbyt wiele konwojów wojskowych, a zatem nie jest wystarczająco słaba.<n><n> Tak czy inaczej, nie mam tylu konwojów wojskowych, by wystarczyło ich do zabezpieczenia nowych przejętych obszarów.<n><n>Czy możesz oddać mi jeden z twoich konwojów? "
"0xd3c78e1e" = "Chętnie zleciłbym ci przejęcie miasta, którym włada %1, ale niestety mam za mało konwojów wojskowych do obrony nowych przejętych obszarów.<n><n>Czy możesz oddać mi jeden z twoich konwojów?   "
"0xd3c78e1f" = "Nie prowadzimy wojny z żadnym państwem, ale nie możemy powiększać naszej siły militarnej dodatkowymi konwojami. <n><n>Czy możesz oddać mi jeden z twoich konwojów?  "
