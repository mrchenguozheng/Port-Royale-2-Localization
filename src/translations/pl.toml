"0xf4024494" = "Zaopatruj miasto @T$TargetTown$, którego właścicielem jest @n$TargetNation$, w towary, aby miasto osiągnęło status „Kwitnąca ekonomia” i miało ponad 2000 mieszkańców, zanim nadejdzie @D$EndDate$."
