"0xe0ed29ee" = "Atak na hiszpańską flotę skarbów"
"0xe0f66b24" = "Szaleje zaraza"
"0xe10e4380" = "Czas się skończył, ale nie udało ci się wypełnić celu ostatniego scenariusza.<n><n>W trybie wolnej gry, wicekról dowolnego narodu może podarować ci jego własne miasto. Niełatwo to jednak osiągnąć, ponieważ zawsze musisz przejąć miasto, aby otrzymać w nagrodę ziemię, a to naturalnie pogorszy twoją reputację wśród innych narodów. <n><n>Wszystko, czego nauczyłeś się w tym scenariuszu na temat rozwoju własnego miasta, pomoże ci rozwijać przedsiębiorstwa także w innych miastach. Główna różnica polega na tym, że nie musisz przejmować się obroną tych miast."
"0xe10f2f85" = "A zatem z radością zawrę z tobą układ.<n>Dostarcz tyle towaru: @G$Goods$, ile się da na rynek w mieście @T$TOWN$. Otrzymam tam także kilka innych dostaw i natychmiast zapłacę ci @g$Price$.<n>Konwój ekspedycyjny przybędzie tam w dniu: @D$EndDate$. Zapewnij bezpieczną podróż tego konwoju do Europy, a wypłacę ci resztę złota."
