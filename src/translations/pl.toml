"0x36132c58" = "Gubernator"
"0x361866c0" = "Nowy statek"
"0x3641d8d1" = "Dziękuję ci za sprowadzenie do mnie mojej żony. Chociaż w ciągu ostatnich dni bardzo cieszyła mnie cisza i spokój, nie mogę po prostu porzucić swojej małżonki na pastwę moich wrogów. W nagrodę, weź tę mapę, która pokazuje kryjówkę zawierającą @a$Amount$ dóbr."
"0x3641d8d2" = "A zatem, nie sprowadziłeś do mnie mojej żony! Wobec tego nie mogę cię nagrodzić. Ale, między nami mówiąc, jestem ci bardzo wdzięczny."
"0x36573a59" = "Twoi żołnierze szybko zdobywają przewagę. Nagle nad murem miasta pojawia się biała flaga: straż miejska poddała się!<n><n>Co chcesz teraz zrobić?"
"0x3657dd22" = "Moja żona nie będzie posiadała się z radości, gdy dowie się, że znalazłeś jej pieska. Weź tę mapę, która pokazuje kryjówkę zawierającą @a$Amount$ dóbr."
"0x3657dd23" = "Co takiego? Chcesz powiedzieć, że wyrzuciłeś psa za burtę? Tym niemniej, jestem ci bardzo wdzięczny. Naturalnie, nie mogę cię nagrodzić oficjalnie, ale kiedyś ukryłem skarb w tajemnym miejscu. Oto mapa."
"0x366de173" = "Och, dziękuję ci za sprowadzenie mojej ukochanej córki. Oto mapa. Zaznaczyłem na niej miejsce, gdzie kiedyś ukryłem wielkie skarby."
"0x366de174" = "Coś ty zrobił! Jak mogłeś zostawić moją córkę w rękach wrogów? Cała @n$Nation$ dowie się, że nie można ci ufać! (Reputacja, jaką darzy cię @n$Nation$ pogorszyła się)"
"0x36a25de1" = "Żołnierze nie są potrzebni"
"0x36a747a2" = "Twój konwój składający się z dwóch statków musi dotrzeć do portu Cartagena."
