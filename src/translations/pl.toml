"0xf5078fac" = "Klikaj na statkach i przesuwaj je za pomocą myszy"
"0xf52fee2f" = "Prowadź bitwy z piratami, korsarzami i konwojami wojskowymi wrogich państw.<n><n>Spróbuj swoich sił ścigając konwoje kupieckie jako korsarz.<n><n>Wyrusz na poszukiwanie legendarnej hiszpańskiej floty skarbów.<n><n>Dowodź 16 różnymi typami statków."
"0xf52fee30" = "Kontroluj swojego kapitana podczas pojedynków z innymi kapitanami i piratami.<n><n>Wypełniaj niezliczone misje biorąc udział w bitwach, handlu i polityce."
"0xf52fee31" = "Odwiedzaj miasta 4 różnych narodów z odmiennym stylem zabudowy<n><n:10>Podziwiaj grafikę różnych obszarów, po których możesz podróżować.<n><n:10>Plądruj i przejmuj miasta dla narodu, który wybierzesz<n><n:10>Buduj własne miasta<n><n:10>Buduj przedsiębiorstwa dla innych kupców i twórz monopole towarów<n><n:10><o:0xFFFFEB7D>...podbij szturmem całe Karaiby!"
