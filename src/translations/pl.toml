"0xfeab2fe1" = "Dobrze. Konwój transportowy opuści port @T$TOWN$ w dniu: @D$DepartDate$. Pożegluj przed nim w kierunku Europy i zabezpiecz szlak. Wypatruj konwojów wojskowych, które wysłała @n$HostileNation$. Twoja misja zostanie wykonana, jeśli konwojowi uda się opuścić wody Nowego Świata i nie zostanie zaatakowany."
"0xfeab2fe2" = "Jestem ci bardzo wdzięczny. Konwój transportowy opuści mój port w dniu: @D$DepartDate$. Chcę, żebyś chronił go przed konwojami wojskowymi, które wysłała @n$HostileNation$ i upewnił się, że konwój bezpiecznie dotrze do Europy."
"0xfeab2fe3" = "Jesteś człowiekiem czynu. Niebawem przybędzie tu konwój transportowy. W dniu: @D$DepartDate$ opuści port w drodze do Europy. Pożegluj przed nim i zabezpiecz jego szlak, chroniąc konwój przed atakami."
"0xfeadceb1" = "W wersji demonstracyjnej możesz wchodzić tylko do miast, które były widoczne na początku gry.<n><n>Możesz jednak handlować z dowolnym miastem wysyłając do niego konwój i klikając prawym przyciskiem myszy na mieście, gdy konwój jest wybrany."
