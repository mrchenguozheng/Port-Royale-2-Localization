"0xec45c63b" = "Gracze dostają 5 kart. Licytuję 1 punkt.<n><n>Jeśli chcesz grać, musisz zalicytować jeden punkt więcej."
"0xec656430" = "Możesz poprawić swoją reputację, jaką darzy cię %1, atakując hiszpańskie statki i miasta. To nie pogorszy twojej reputacji w pozostałych państwach."
