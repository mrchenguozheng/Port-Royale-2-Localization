"0xd7ce1a20" = "%1,<n><n>Możesz kupić zezwolenie na budowę w tym mieście. Gdyby twoja reputacja w moim narodzie była wyższa, zaproponowałbym ci lepszą cenę.<n><n>Obecna cena zezwolenia na budowę wynosi %2."
