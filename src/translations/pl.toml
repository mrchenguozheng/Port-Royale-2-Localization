"0x03c5bef1" = "<n><n>Twój konwój został rozwiązany."
"0x03cad242" = "Pożyczka spłacona"
"0x03ce7c8e" = "Cel scenariusza"
"0x03d3dcd8" = "Podczas plądrowania miasta twoja załoga odkryła miejsce, gdzie przetrzymywana była żona gubernatora, po czym „uwolniła” kobietę. W tym czasie porwana przebywała w kuchni.<n> „Nie zabierajcie mnie z powrotem do gubernatora miasta @T$TOWN$. Nigdy go nie kochałam, przysięgam!”.<n><n>Czy chcesz zabrać tę kobietę ze sobą i sprowadzić ją do gubernatora pomimo jej błagań? "
"0x03d3dcd9" = "Podczas plądrowania miasta, twoi ludzie napotkali młodego chłopaka z pudlem. Chłopiec powiedział ci, że gubernator miasta @T$TOWN$ sam zaaranżował porwanie, pragnąc pozbyć się psa. Kapitan postanowił zabrać Misię na pokład swojego statku. Potem jednak zaczął zastanawiać się, czy warto oddawać psa gubernatorowi miasta @T$TOWN$.<n><n>Czy chcesz wyrzucić psa za burtę?"
"0x03d6dcdb" = "Łowy na piratów"
"0x03dfeb8d" = "<c><o:0xFFFFE6A0>%1<n><o:0xFFEBF0A0>(miasto gracza)"
"0x03e1b0eb" = "Co za pech! Muszę utrzymywać zapasy dóbr kolonialnych dla konwojów transportowych z Europy, ale nie mamy narzędzi, żeby w ogóle wyprodukować te towary. Czy pomożesz mi zaopatrzyć miasto w narzędzia?"
"0x03e1b0ec" = "Jak to mogło się stać! W mieście @T$DestTown$ kończą się zapasy narzędzi, co zagraża produkcji towarów kolonialnych. Czy pomożesz mi rozwiązać ten problem?"
"0x03e1b0ed" = "Moim ludziom brakuje narzędzi. Powinniśmy nabyć je u innych narodów. Co o tym myślisz?"
"0x03e9fe1e" = "Tortuga w kłopotach"
"0x03efad5a" = "Nie ma komunikatów"
"0x03efff11" = "Tak bardzo mnie uszczęśliwiłeś! Pobiegnij do mojego ojca. Nie posiądzie się z radości!"
"0x03f2ddbd" = " @A$USER$, podejdź tutaj i usiądź. Muszę omówić z tobą pewien interes.<n>Próbuję kupić towar: @G$Goods$, który ma otrzymać @n$HostileNation$. Jak wiesz, @n$Nation$ i @n$HostileNation$ prowadzą ze sobą wojnę. Prawdę mówiąc, obecnie @n$HostileNation$ grozi karą za importowanie towaru: @G$Goods$, którego miejscem pochodzenia jest @n$Nation$. Oczywiście, kupcy dobrze płacą za takie towary. Chciałbym zatem cię spytać, czy byłbyś zainteresowany małym przemytem?"
"0x03f2ddbe" = " @A$USER$, interesuje cię mały przemyt? Jestem tu w imieniu kupca z miasta @T$TargetTown$. Z powodu wojny, obecnie nie można transportować do miasta @T$TargetTown$ żadnych towarów z miast, którymi włada @n$Nation$. Człowieka, który mnie wysłał, interesuje towar: @G$Goods$. Zapłaci ci @g$Price$ za każdą beczkę, jaką mu dostarczysz. Co na to powiesz?"
"0x03fb5c67" = "Ponieważ %1 od dłuższego czasu pozostaje z tobą w złych stosunkach, %3 z twoich przedsiębiorstw w mieście %2 zostało dzisiaj przejętych."
"0x03fb5c68" = "<n>Radzę złożyć wizytę jednemu z moich gubernatorów, co może poprawi stosunki z moim narodem."
"0x03fb5c69" = "<n>Doradzam złożenie mi wizyty, podczas której będziemy mogli omówić twoje stosunki z moim narodem."
"0x03fb5c6a" = "<n><n>%1, wicekról, którego mianowała %2"
"0x04081363" = "Jeden z moich rywali z miasta @n$HostileNation$ wykradł moje pamiętniki i teraz chce wysłać je do Europy. Niezwykle ważne jest, aby to mu się nie udało. Na szczęście, zdołałem przekupić sternika okrętu wiozącego pamiętniki do Europy. Teraz potrzebuję twojej pomocy."
"0x04081364" = "Od dłuższego czasu szpieguje nas @n$HostileNation$. Odkryłem, że wszystkie zbierane informacje były pieczołowicie spisywane i teraz mają zostać wysłane z miasta @T$HostileTown$ do Europy. Chcę, żebyś pomógł mi sprawić, by te dokumenty nigdy nie opuściły Karaibów."
"0x040bf5f1" = "Poddaj grę"
"0x04100fa0" = "%1: Atak piratów"
"0x0420c2a2" = "<ts:20>Wiesz już jak kupować i sprzedawać towary w oknie handlu. Oto kilka następnych wskazówek:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Cena pokazana na strzałkach zależy od wielkości jednostki<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Nie ma znaczenia, czy kupujesz lub sprzedajesz jeden towar 10 razy, czy też kupujesz lub sprzedajesz 10 towarów za jednym razem. Cena całkowita jest taka sama.<n><n><g:INTEXT_AUSRUF_800x600.screen>Cena jest zawsze widoczna, nawet jeśli towar nie jest dostępny. Jest to zawsze cena podstawowej jednostki towaru, bez względu na wielkość ustawionego rozmiaru jednostki obrotu handlowego.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Możesz także handlować klikając na symbolu towaru. Gdy to zrobisz, pojawi się okienko z suwakiem. Możesz użyć tego suwaka, aby określić jak wiele towaru chcesz kupić lub sprzedać. Natychmiast zostanie wyświetlona cena jednostkowa wraz z ceną całkowitą."
"0x0424bb9a" = "Kronika"
"0x0436c531" = "Znalazłeś wyjątkowy statek!<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Statek żaglowo-parowy<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>W całym swoim życiu nie widziałeś takiego statku! Wydaje się być napędzany nie tylko przez żagle na jego dwóch masztach, ale także przez osobliwy mechanizm, który za pomocą pary obraca dwa koła łopatkowe. Wydaje się, że umożliwia to statkowi poruszanie się, nawet gdy nie wieje najsłabszy wiatr."
"0x044bc6d2" = "Twój kapitan zwyciężył walkę szermierczą z piratem zwanym %1. Twoi ludzie zaczynają szukać skarbu piratów i znajdują %2.<n><n>Zniszczyłeś kryjówkę i zakończyłeś działalność pirata o imieniu %3. "
"0x044bc6d3" = "Twój kapitan zwyciężył walkę szermierczą z piratem zwanym %1. Twoi ludzie zaczynają szukać skarbu piratów i znajdują %2. Chociaż zniszczyłeś kryjówkę i udało ci się zlikwidować zagrożenie jakie stanowiła, są pewne oznaki, że nie zniszczyłeś wszystkich statków. Pozostałe statki mogą poszukać nowej kryjówki."
"0x044e52eb" = "Scenariusze"
"0x045d87c5" = "Musisz handlując zgromadzić @g$GoldGoal$, w gotówce."
"0x04709af6" = "Misje"
"0x0471f13a" = "Otrzymałeś pożyczkę w wysokości %1. Suma do spłaty wynosi %2 i musi zostać oddana, zanim nadejdzie %3."
"0x04750e1c" = "Jakość życia w miastach"
"0x0479b6bb" = "Gra zapisana"
"0x0480889b" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Odkryłeś wielki skład towarów w miejscu, które opisał rozbitek i zabierasz dobra na pokład."
"0x0480889c" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Odkryłeś wielki skład towarów w miejscu, które opisał rozbitek.<n>Niestety, twój konwój nie ma już miejsca na pokładzie, więc musisz na razie zostawić te dobra."
"0x04825ba0" = "Konwój nie może postawić żagli, ponieważ aktualnie znajduje się w stoczni, gdzie przechodzi naprawy. Poczekaj aż naprawy zostaną ukończone."
"0x04b51123" = "Przykro mi, obawiam się, że nie mogę już dać ci tej misji. Zbyt dużo czasu zajęło ci podjęcie decyzji."
"0x04d40792" = "aktualna cena produkcji"
"0x04ddc375" = "%1 czeka na ciebie w tawernie."
"0x04e000d9" = "Kapitan %1 zastąpił poprzedniego kapitana."
"0x04e4fc22" = "Miasto – Handel przez magazyn"
"0x04e5002a" = "W Tortudze rozpoczął się strajk pracowników. Wszyscy pracownicy odrzucili narzędzia i strajkują (ale nadal liczą się do kosztów utrzymania twoich przedsiębiorstw).<n><n>Twoim zadaniem jest utrzymanie obfitych zapasów towarów, które normalnie produkowaliby twoi pracownicy, aby doprowadzić do załamania strajku i wznowienia pracy.<n><n>Uwaga: Miasto produkuje pszenicę, cegły, bawełnę, cukier i tytoń. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zapasy towarów produkowanych w mieście muszą osiągnąć stan @a$Amount$ każdego towaru, zanim nadejdzie @D$EndDate$."
"0x04f319ed" = "Jeśli chcesz odebrać swoją nagrodę, w ciągu następnych 30 dni udaj się na rynek miasta @T$Town$."
