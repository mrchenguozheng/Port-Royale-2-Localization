"0x00bff5f3" = "Teraz masz zezwolenie na budowę w Cartagenie i możesz zakładać tam przedsiębiorstwa. Twoim następnym celem jest wybudowanie dwóch warsztatów tkackich w Cartagenie. Warsztat tkacki to przedsiębiorstwo, które produkuje towary finalne i potrzebuje bawełny jako surowca.<n><n>Zawsze musisz mieć zapas surowców w swoim magazynie, albo przedsiębiorstwo nie będzie w stanie produkować żadnych towarów. Jednak koszty nadal będą wysokie, ponieważ musisz płacić za utrzymanie każdego przedsiębiorstwa i opłacać swoich pracowników.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zbuduj dwa warsztaty tkackie w Cartagenie i wyprodukuj @a$AmountGoal$ sukna."
"0x00c0bb39" = "normalne"
"0x00c59673" = "Atak na konwój wojskowy"
"0x00cde503" = "<ts:20>Po raz pierwszy stajesz się wrogiem jakiegoś państwa. Oto kilka przydatnych wskazówek.<n>-<t>Staniesz się wrogiem jakiegoś państwa, gdy zaatakujesz konwój lub miasto należące do niego<n>-<t>Możesz przekupywać gubernatorów państw, w celu poprawienia swojej reputacji. Jednak, twoja reputacja poprawia się także samoczynnie odrobinę z każdym minionym dniem, ponieważ twoje złe uczynki są powoli zapominane<n>-<t>Nie możesz zawijać do portów wrogich narodów<n>-<t>Jeśli pomimo tego pożeglujesz do wrogiego miasta, musisz zakotwiczyć swój konwój w tajemnicy: potem możesz wejść do miasta, ale nie możesz w nim handlować."
