"0x3933132f" = "Och, @s$USER$, co mam robić? Kupiec z miasta @T$Town$ stale wtrąca się do mojego interesu i pozbawia mnie dochodów. To trwa od miesięcy. Czy pomożesz mi pozbyć się jego konwoju?"
"0x39331330" = "Czy pomożesz mi zorganizować małą akcję odwetową? Jestem przekonany, że kupiec z miasta @T$Town$ sabotował kilka z moich statków. Teraz mogę tylko siedzieć i czekać, aż moje statki wrócą ze stoczni. Chcę, żebyś zniszczył konwój należący do mojego bezlitosnego przeciwnika. Nagrodzę cię sowicie!"
"0x39331331" = "Czy ty jesteś @A$USER$? Być może mam zadanie dla ciebie.<n>Dość dawno temu udzieliłem sporej pożyczki kupcowi z miasta @T$Town$ i minęło już tyle czasu, że powinien to spłacić. Cóż, nie zrobił tego i nie sądzę, żeby miał zamiar zrobić to w przyszłości.<n>W związku z tym, chcę dać mu nauczkę! Czy zaatakujesz dla mnie jeden z jego konwojów? Nagrodzę cię hojnie!"
