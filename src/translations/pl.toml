"0x02387a4e" = "Nie udało ci się zwiększyć zapasów pszenicy, cegieł, bawełny, cukru i tytoniu do 150 beczek. Kupuj towary w pobliskich miastach i dostarczaj je natychmiast do swojego magazynu w Tortudze. Gdy zgromadzisz je wszystkie, sprzedaj je miastu."
