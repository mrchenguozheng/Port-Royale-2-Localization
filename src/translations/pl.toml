"0x061848e4" = "Dokonałeś sabotażu w mieście @T$TargetTown$, za co dziękuję ci w imieniu mojego narodu. Mam dla ciebie wyjątkową nagrodę. Przekonałem bardzo doświadczonego kapitana, żeby dołączył do ciebie. Nazywa się @N$CaptainName$ i czeka na ciebie w tawernie."
"0x061b50a1" = "Czy chcesz kupić list kaperski za %1 i ścigać statki naszych wrogów w imieniu Francji?"
"0x0625c88f" = "Narody"
"0x062a6d44" = "Dobrze! Konwój wyruszył z miasta @T$HostileTown$ w kierunku Europy i opuści Karaiby na wschodzie. Przeszukaj cały szlak i sprowadź do mnie znalezione dokumenty, zanim nadejdzie @D$EndDate$."
"0x062a6d45" = "Jesteś bardzo pomocny! Jeśli wszystko pójdzie według planu, sternik w tajemnicy wyrzuci książki za burtę, jedna po drugiej. Statek wyruszył z miasta @T$HostileTown$ i kieruje się do Europy. Popłyń za statkiem i zbierz książki. Sprowadź je do mnie, zanim nadejdzie @D$EndDate$."
"0x062a6d46" = "Doskonale. Statek opuścił już wybrzeże miasta @T$HostileTown$ i kieruje się do Europy. Unosi jednak pasażera, który nadal jest mi winien przysługę. Ten człowiek znajdzie na statku dokumenty i zacznie w tajemnicy wyrzucać je za burtę, jeden po drugim. Twoje zadanie polega na znalezieniu dokumentów i sprowadzeniu ich do mnie, zanim nadejdzie @D$EndDate$."
"0x063dfcc8" = "Miasto %1 pokonane"
"0x064021d3" = "Fortyfikacje portu zostały zniszczone i twoja załoga przybija do nadbrzeża. Nigdzie nie widać straży miejskiej.<n><n>Co chcesz teraz zrobić?"
