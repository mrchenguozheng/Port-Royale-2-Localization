"0xdf2e2303" = "Miasto @T$TargetTown$ teraz należy do naszego narodu, za co należy dziękować tobie. Mistrz budowlany w mieście przygotował zatem dla ciebie zezwolenie na budowę i kilka budynków w mieście."
