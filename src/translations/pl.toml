"0x35f4904f" = "[riddle:answer=Turk Islands;group=35f4904f;clue=Trzy małe wyspy, liny;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 6`&authored]Trzy małe wyspy ten obszar otaczają, ale tylko na jednej te liny splatają."
"0x35f49050" = "[riddle:answer=San Juan|San Thoma;group=35f49050,35f490bf;clue=wyspie, południowym wschodzie;level=town;certainty=either;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 1`&authored]X leży na wyspie, jest naprawdę mała. Ale na południowym wschodzie większa się nie znajdowała."
"0x35f49051" = "[riddle:answer=-north;group=35f49051;clue=wyrwa, północ, łańcuchu wysp;level=direction;certainty=certain;source=original-en&authored]Tu, w łańcuchu wysp znajduje się wyrwa. Na zachód i na południe są wyspy, ale każdy doda, że na północ nic nie ma, tylko niebo i woda."
"0x35f49052" = "[riddle:answer=Vera Cruz;group=35f49052,35f490c1,35f490c2,35f49130;clue=trzy, zachód;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 27*`&authored]W dużej zatoce leży kilka miast, razem trzy. X to najbardziej na zachód leżące wśród nich."
"0x35f49053" = "[riddle:answer=Roatán;group=35f49053;clue=trzy, południe;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 13`&authored]W dużej zatoce leży kilka miast, razem trzy. X to najbardziej na południe leżące wśród nich."
"0x35f49054" = "[riddle:answer=Roatán;group=35f49054;clue=dwie wyspy, większej;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 21`&authored]Zatoka otacza dwie wyspy, dużą i małą. X miastu na większej wyspie będzie przypadało."
"0x35f49055" = "[riddle:answer=Cayman;group=35f49055;clue=daleka i mała, morze;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 25`&authored]Wyspa daleka i mała, otoczona przez morze. Tylko tam X znajdować się może."
"0x35f49056" = "[riddle:answer=Port Royale;group=35f49056;clue=złoto, port;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 8`&authored]X to miasto o ulicach, które zdobi złoto. Jego piękny port ucieszy twe oko."
"0x35f49057" = "[riddle:answer=Santo Domingo;group=35f49057;clue=wulkanu, południowy wschód;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 19*`&authored]Cztery miasta rozsiadły się w wulkanu stóp. Jedź do miasta na południowy wschód."
"0x35f490bf" = "[riddle:copy=0x35f49050]"
"0x35f490c0" = "[riddle:answer=Guadeloupe|Martinique;group=35f490c0;clue=wyspach, towary;level=town;certainty=either;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 18`&cargo&authored]Na wyspach wśród morza różne miasta się schowały. Ale jedno wśród nich ma zawsze najlepsze towary."
"0x35f490c1" = "[riddle:copy=0x35f49052]"
"0x35f490c2" = "[riddle:copy=0x35f49052]"
"0x35f490c3" = "[riddle:answer=Providence;group=35f490c3,35f490c4;clue=kołysce, półwysep;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9&authored]Tam, jak w kołysce złożona, wyspa sobie leży. Na północ półwysep kręty w morze bieży."
"0x35f490c4" = "[riddle:copy=0x35f490c3]"
"0x35f490c5" = "[riddle:answer=Santa Marta;group=35f490c5;clue=dżunglą, zatoka, słońce;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 23`&authored]Biały pas za dżunglą, rzeka mało znana. Tam miejsce ukryte, zatoka tylko przez słońce oglądana."
"0x35f490c6" = "[riddle:answer=Maracaibo;group=35f490c6;clue=zatoki, statków;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 5`&authored]Tu miasto wspaniałe się znajduje. Strzeże zatoki, gdzie wiele statków żegluje."
"0x35f490c7" = "[riddle:answer=Caracas;group=35f490c7,35f49136;clue=urwiska, szczątki, okręciska;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 7`&authored]Niedaleko od miasta, na dnie urwiska, leżą smutne szczątki starego okręciska."
"0x35f490c8" = "[riddle:answer=Port of Spain;group=35f490c8;clue=port, pszenicy;level=town;certainty=certain;source=original-en&authored]Hiszpania niegdyś port tu wzniosła w chwale. Jest tu drewno i cegły, lecz pszenicy wcale."
"0x35f49130" = "[riddle:copy=0x35f49052]"
"0x35f49131" = "[riddle:answer=east;group=35f49131;clue=trzy, wschód;level=direction;certainty=certain;source=original-en&authored]W dużej zatoce leży kilka miast, razem trzy. X to najbardziej na wschód leżące wśród nich."
"0x35f49132" = "[riddle:answer=Providence;group=35f49132,35f49133;clue=kołysce, ziemia;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9&authored]Tam, jak w kołysce złożona, wyspa sobie leży. Na północ ziemia kręta się w morze bieży."
"0x35f49133" = "[riddle:copy=0x35f49132]"
"0x35f49134" = "[riddle:answer=Cartagena;group=35f49134;clue=most, zachodu;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 16*`&authored]Przybywasz z zachodu, most musisz przekroczyć. Nieco dalej miasto X ucieszy twe oczy."
"0x35f49135" = "[riddle:answer=Gibraltar;group=35f49135;clue=klify, brzegu, zatoki;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 14*`&authored]Och, cóż za wspaniałe miejsce. Przy samym brzegu zatoki się mieści. Strzegą je wysokie klify – to X z opowieści!"
"0x35f49136" = "[riddle:copy=0x35f490c7]"
"0x35f49137" = "[riddle:answer=southeast;group=35f49137;clue=moczary, południowy wschód;level=direction;certainty=certain;source=original-en&authored]Potężna rzeka i bardzo głęboka, płynie na wschód wpływając prosto na moczary. Stąd na południowy wschód, czasem przez kraj stary. I wreszcie, na koniec biegu swego pędzi - tam X się znajduje, na samej krawędzi."
