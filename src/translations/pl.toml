"0x070c60f9" = "Dziękuję ci. Proszę, sprowadź mi @a$Amount$ towaru: @G$Goods$. Musisz dostarczyć towar na rynek, zanim nadejdzie @D$Date$. Tam otrzymasz @g$GoldPerBarrel$ za każdą <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fa" = "Proszę, dostarcz @a$Amount$ towaru: @G$Goods$ do moich wysłanników na rynku. Musisz to zrobić, zanim nadejdzie @D$Date$. Po dostawie otrzymasz @g$GoldPerBarrel$ za każdą <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x070c60fb" = "Pożegluj do miast, których właścicielem jest @n$FoeNation$ i zbierz @G$Goods$. Dostarcz @a$Amount$ na rynek w moim mieście, zanim nadejdzie @D$Date$. Otrzymasz @g$GoldPerBarrel$ za każdą <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0x0710eed4" = "<n><n>Gdy zamkniesz to okno, scenariusz zostanie zakończony."
"0x0711985e" = "Jednoręki Pirat"
"0x07124c09" = "Cel scenariusza nie został wypełniony"
"0x07242fbe" = "Pracownik"
"0x07246168" = "Napraw"
"0x072a9579" = "Jestem ci wielce wdzięczny za sprowadzenie towarów importowanych, bowiem my w Nowym Świecie już od wielu tygodni nie dostajemy dostaw z konwojów transportowych mojego kraju. W nagrodę daję ci dwie holenderskie fleuty kupieckie. Statki czekają w porcie."
"0x0744a699" = "Nie mogę ci powiedzieć, ile jeszcze miast odwiedzi flota skarbów. Możemy stwierdzić na pewno, że flota zabiera na pokład coraz więcej złota po wizycie w każdym kolejnym mieście. Nie dbam o to, kiedy zaatakujesz, ponieważ możesz zatrzymać złoto. Chcę tylko, żebyś sprawił, by flota skarbów zniknęła. Ostatnio była w mieście @T$StartTown$, a jej następnym portem będzie @T$DestTown$, gdzie postoi na kotwicy przez jakieś pięć dni."
"0x0744a69a" = "Musisz więc działać szybko. Ostatnio była w mieście @T$StartTown$, skąd wyruszyła do miasta @T$DestTown$, gdzie zakotwiczy dłużej niż zwykle. Im dłużej będziesz wstrzymywał swój atak, tym więcej złota znajdzie się na pokładzie. Możesz zatrzymać łup, ale flota skarbów nie ma prawa dotrzeć do Europy."
"0x0744a69b" = "A zatem, wszystko ustalone, dziękuję ci. Jeśli moje informacje są prawidłowe, flota skarbów niedawno opuściła miasto @T$StartTown$ i jest w drodze do miasta @T$DestTown$. Tam zatrzyma się na kotwicy dłużej niż zwykle. Teraz pośpiesz się i przechwyć tę flotę!"
"0x0746253d" = "Jeśli chcesz, aby twoje miasto odwiedzało jak najwięcej kupców, nie wystarczy tylko zaopatrywać miasta w pewne towary. Powinieneś wybierać towary, które są produkowane w pobliskich miastach, ponieważ kupcy biorą pod uwagę długość swoich podróży.<n><n>Kupcy, którzy odwiedzają twoje miasto, będą automatycznie kupowali towary, których jest w nim dużo, a zatem mają niską cenę w twoim mieście. Możesz także sprzedawać bezpośrednio w swoim mieście towary, które wyprodukowałeś. Dopóki towary nie są droższe niż w innych miastach, będą regularnie kupowane przez kupców.<n><n>Korzyść jaka z tego płynie, polega na tym, że twoim mieszkańcom nigdy nie zabraknie towarów i nie musisz przejmować się transportowaniem dóbr do innych miast."
