"0xdca0a525" = "Sprzedaj"
"0xdcba5843" = "Cieszę, że cię widzę, @A$USER$, bowiem potrzebuję twojej pomocy. Niegdyś służyłem pod piratem imieniem @P$PirateName$. Jednak, posłuchałem głosu rozsądku i zawarłem układ z gubernatorem miasta @T$TargetTown$. Niestety, moi dawni kamraci dowiedzieli się o tym i wyznaczyli cenę za moją głowę. Czy pomożesz mi i zawieziesz mnie do miasta @T$TargetTown$?"
"0xdcba5844" = "@A$USER$! Słyszałem, że można ci ufać. Pozostaję w służbie gubernatora miasta @T$TargetTown$ i muszę pilnie się z nim zobaczyć, aby przekazać mu pewne niezmiernie istotne informacje. Niestety, pewne osoby zamierzają uniemożliwić mi dotarcie do miasta @T$TargetTown$. Z tego powodu pytam cię, czy zechcesz udzielić mi pomocy, abym mógł odbyć bezpieczną podróż?"
"0xdcba5845" = "Och, nęka mnie nieszczęście. Kilka tygodni temu natrafiłem na statek należący do znanego pirata imieniem @P$PirateName$. Jednak kapitan tego statku musiał być bardzo niedoświadczony, ponieważ udało nam się zatopić go prawie bez wysiłku.<n>Niestety, ten niefortunny kapitan okazał się ukochanym siostrzeńcem pirata znanego jako @P$PirateName$. Od kiedy usłyszał moje nazwisko, stale mnie ściga. Moja załoga przejęła mój statek, po czym uciekła przerażona i tak tu utknąłem.<n>Czy pomożesz mi dotrzeć do mojego macierzystego miasta @T$TargetTown$?"
