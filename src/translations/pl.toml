"0x0161ec82" = " @s$USER$, z pewnością zainteresuje cię mapa skarbu, prawda? Obawiam się, że mogę dać ci tylko jej niewielki kawałek, ale jestem pewien, że znajdziesz kilka pozostałych fragmentów. Przecież tyle podróżujesz.<n>Proszę tylko o @g$Price$ za to."
"0x0161ec83" = "Witaj, @s$USER$. Wyglądasz na człowieka, którego zainteresowałaby mapa skarbu. Mam tutaj część większej mapy. Nie powiem ci, gdzie znaleźć pozostałe części, ale z pewnością po świecie krążą inne fragmenty tej mapy. Musisz tylko wypatrywać ich uważnie.<n>W każdym razie, możesz mieć ten kawałek za @g$Price$."
