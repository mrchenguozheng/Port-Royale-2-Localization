"0xf39b47d9" = "<c><ts:175>%2<t><gs:TEXTFLUSS_KEINEHOEHE>%1"
"0xf3a8eed8" = "Nasze skarbonki z datkami są pełne po brzegi. Wpadnij ponownie za kilka tygodni."
