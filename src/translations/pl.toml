"0xee3b5f78" = "Obrona miasta"
"0xee4e882d" = "Paź"
"0xee7aaf49" = "Znajdź i zniszcz konwój, którym dowodzi pirat @P$PirateName$, zanim nadejdzie @D$EndDate$. Ostatnia znana pozycja jednego z jego konwojów została zaznaczona na twojej mapie morskiej. @l$Pos$"
