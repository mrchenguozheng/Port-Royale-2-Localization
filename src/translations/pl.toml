"0x0087e50b" = "+"
"0x00885bdb" = "Dobra robota! Teraz masz miasto, które należy do ciebie! Tylko ty możesz budować w tym mieście. <n><n>Miasto ma już kilka budynków, takich jak doki, gdzie możesz handlować oraz twój pałac. Resztę musisz wybudować samodzielnie.<n><n>Pożegluj ze swoim konwojem do twojego miasta. Zabierz jak najwięcej drewna i cegieł, ponieważ to będzie potrzebne do stawiania budynków.<n><n>Najpierw zbuduj stocznię, w której będziesz mógł naprawiać własne statki.<n><n>Uwaga:<n> Utrzymywanie załogi na statkach eskorty dużo kosztuje. Powinieneś zwolnić załogę, ponieważ już jej nie potrzebujesz.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Odwiedź swoje nowe miasto i zbuduj stocznię."
"0x009aa6c5" = "%1 (1 dzień temu)"
"0x009dba4d" = "Nie możesz zlikwidować tej części dużego przedsiębiorstwa, ponieważ jest to budowa, do której nie masz praw."
"0x009eb936" = "Nadmiar osadników"
