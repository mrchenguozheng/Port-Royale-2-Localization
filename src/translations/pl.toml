"0xec815821" = "Powrót do gry"
"0xec86613a" = "Dostarcz @a$Amount$ towaru: @G$Goods$ na rynek w mieście @T$TOWN$, zanim nadejdzie @D$EndDate$. Tam otrzymasz @g$Price$ za beczkę."
"0xecb4ae47" = "Funkcja"
"0xece9a5c9" = "Nie załadowałeś całej ładowni swojego statku.<n>Czy na pewno chcesz zakończyć transfer?"
