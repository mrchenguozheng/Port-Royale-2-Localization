"0xcf3f179d" = "Dobrobyt miasta @T$TargetTown$ leży mi na sercu, ale obawiam się, że od pewnego czasu gospodarka miasta boryka się z kłopotami. Problem jest zawsze ten sam: kupcy przestali odwiedzać miasto, ponieważ popyt jest zbyt niski i dobra wyprodukowane w mieście nie są zabierane. To sprawia, że miasto nie jest atrakcyjne dla nowych osadników. Czy pomożesz mi ponownie postawić miasto na nogi?"
