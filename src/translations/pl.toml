"0xf62f66aa" = "Dzisiaj, francuski pirat %1 napotkał konwój wojskowy z Anglii i został zabity."
"0xf62f66ac" = "Dzisiaj, francuski pirat %1 napotkał konwój wojskowy z Holandii i został zabity."
