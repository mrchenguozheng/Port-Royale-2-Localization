"0xda75935c" = "Przejęcie miasta"
"0xda93dbe1" = "Bardzo dobrze! To nie był prosty wyczyn! Anglia straciła teraz tak wiele konwojów wojskowych, że można przechwytywać jej miasta. W uznaniu twojej służby, gubernator Wysp Turk przyznał ci cztery następne karaki.<n><n>Możesz przejmować miasta jakiegoś narodu tylko z rozkazu wicekróla. Wicekról poleci ci przejęcie miasta, tylko jeśli jego własny naród jest silny militarnie, a naród wroga jest militarnie słaby.<n><n>Niestety, Holandia nie jest dość silna, aby przejąć miasto. Możesz jednak coś z tym zrobić: odwiedź holenderskiego wicekróla na Wielkich Bahamach i przekaż mu jeden z twoich konwojów. Wicekról następnie utworzy nowy konwój wojskowy, który zwiększy siłę militarną Holandii.<n><n>Jeśli chcesz przekazać konwój wicekrólowi, odpowiedni konwój musi mieć dokładnie pięć statków i co najmniej 150 dział.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Pomóż wicekrólowi zwiększyć siłę militarną Holandii. Następnie przyjmij misję przejęcia miast w jego imieniu."
"0xdab4fea7" = "Budynki mieszkalne"
"0xdac343f7" = "IDM_CONTEST_01_2004_LOG_03_HDR"
"0xdac43b47" = "Za mało osadników"
"0xdacb8ff6" = "Jakość życia w twoim mieście"
"0xdad55b61" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KNOTEN_800x600.screen>"
"0xdad6e283" = "Klawisz  "
"0xdaeb0484" = "Tym razem, rozpoczynasz scenariusz w Cartagenie, mieście gubernatorskim pośrodku Karaibów.<n>Twój konwój, który składa się ze slupa, znajduje się w porcie.<n>Najpierw musisz uzbroić swój konwój, ponieważ w tym scenariuszu odbędą się bitwy morskie.<n>Idź do doków i otwórz menu ładunku."
"0xdaeb0485" = "Jak widzisz, na pokładzie swojego konwoju nie ma żadnych dział, ani amunicji. Potrzebujesz także załogi.<n>Weź na pokład największą załogę i tyle dział, ile się da, a także 10x10 jednostek każdego z trzech rodzajów amunicji do swoich dział.<n>W twoim konwoju może zabraknąć miejsca, ponieważ działa są ciężkie. Jeśli tak się stanie, możesz sprzedać część załadowanych towarów."
"0xdaeb0486" = "Dobra robota! Twój konwój jest już uzbrojony i gotowy do niewielkiej potyczki.<n>Tak się składa, że gubernator Cartageny ma teraz dla ciebie doskonałą misję.<n>Kliknij na siedzibie gubernatora i przyjmij jego misję."
"0xdaeb0487" = "Gubernatorowie często proponują misje, które poprawią twoją reputację w ich narodzie, jeśli zostaną pomyślnie wypełnione.<n>Możesz także prosić gubernatorów o listy kaperskie, albo o prawo do zatrzymania łupów na piratach, których statki przechwycisz.<n>Teraz użyj swojego konwoju, aby znaleźć statki, o których powiedział ci gubernator."
"0xdaeb0488" = "Bardzo dobrze, znalazłeś konwój.<n>Twój następny krok to wybranie statku do akcji i przygotowanie się do walki. Aby to zrobić, otwórz listę statków w twoim konwoju i wybierz swojego slupa. Aby wyznaczyć go na okręt wojenny, wciśnij przycisk obok działa. Potem możesz „zaatakować” konwój klikając na nim prawym przyciskiem myszy."
"0xdaeb0489" = "To jest widok bitwy morskiej gry Port Royale.<n>Widać na nim twój statek. Przesuwając okno podglądu możesz zobaczyć także porzucone statki.<n>Teraz wyłącz tryb pauzy i przećwicz nawigację za pomocą prawego przycisku myszy. W oknie wydarzeń pokazany jest kierunek wiatru i kurs statku biorącego udział w bitwie morskiej."
"0xdaeb048a" = "Wszystkie statki biorące udział w bitwie pokazane są na dole ekranu. Tutaj możesz wybrać amunicję, jakiej chcesz użyć. Wybierz ciężkie kule armatnie i zatop jeden z wrogich statków.<n>Możesz odpalić za pomocą lewego przycisku myszy, ale tylko wtedy, gdy twój statek znajdzie się w dobrej pozycji strzeleckiej. Gdy tak się stanie, cele pokazywane są na czerwono."
"0xdaeb048b" = "Dobrze! Dokonaj abordażu drugiego statku.<n>Aby to zrobić, kliknij na przycisku „Abordaż” na dole, po prawej stronie okna statku.<n>Następnie popłyń w kierunku wrogiego statku i staranuj go. Zapamiętaj: Przycisk F1 jest aktywny także podczas bitew morskich."
"0xdaeb048c" = "Zazwyczaj wróg ma załogę i na pokładzie statku dochodzi do bitwy między twoją załogą a wrogami.<n>Gdy bitwa dobiegnie końca, wszystkie statki, na których doszło do abordażu, przypadają zwycięzcy.<n>Teraz dodaj wrogi statek do swojego konwoju i zamknij okno transferu."
"0xdaeb048d" = "Bardzo dobrze!<n>Teraz wyślij swój konwój z powrotem do Cartageny."
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "Konwój, którym dowodzi pirat %1 zaatakował kupca z: %2."
"0xdb0108d5" = "Najpierw kup nowy statek. Przejdź do stoczni i kup statek z jak największą liczbą dział."
"0xdb0108d6" = "Wybierz swój konwój, a potem kliknij prawym przyciskiem myszy na porcie, aby dodać nowy statek do konwoju."
"0xdb0108d7" = "Wszystkie konwoje składają się ze statków kupieckich i statków eskorty.<n>Jeśli jakiś statek z twojego konwoju ma wziąć udział w bitwie, musisz wyznaczyć go na okręt wojenny. <n>Otwórz listę statków w swoim konwoju, aby wyświetlić wszystkie twoje statki."
"0xdb0108d8" = "Na liście statków wymienione są wszystkie statki w twoim konwoju. Status okrętu wojennego jest wyświetlony w prawym górnym rogu statku. Jeśli widoczny jest symbol działa, statek został wyznaczony na okręt wojenny i bierze udział w bitwach. Klikaj na tym rogu ekranu, aby bezpośrednio zmieniać ten status.<n>Ale teraz powinieneś kliknąć na swoim nowym statku i wybrać go. "
"0xdb0108d9" = "Podobnie jak w stoczni, zobaczysz wyświetlone detale techniczne statku, takie jak maksymalna pojemność ładunkowa.<n>Możesz także sprawdzić dzienny koszt utrzymania statku.<n>Teraz zmień statek w okręt wojenny zaznaczając symbol działa."
"0xdb0108da" = "Dobra robota!<n>Działa i żeglarze są zawsze dzielone po równo między statkami eskorty w konwoju.<n>Upewnij się, że twoje statki eskorty są w pełni uzbrojone i mają pełną załogę, a potem odwiedź gubernatora i przyjmij nową misję, którą ci zleci."
"0xdb0108db" = "Teraz wypełnij misję zleconą ci przez gubernatora. "
"0xdb0108dc" = "Wybierz spośród swoich statków eskorty statek, który chcesz kontrolować podczas bitwy morskiej.<n><n>Możesz w dowolnej chwili wybrać inny statek eskorty klikając na nim na liście statków.<n><n>Uważaj jednak: gdy zacznie się bitwa, każdy statek może być wybrany tylko raz!"
"0xdb0108dd" = "Dobra robota! Zniszczyłeś konwój piratów.<n>Teraz wróć do gubernatora Cartageny, ponieważ jest to częścią twojej misji.<n><n>Zauważ, że twoje misje są automatycznie zapisywane w dzienniku. Jeśli trzeba, w dowolnej chwili możesz tu obejrzeć szczegóły dotyczące twojej misji."
"0xdb04023a" = "Za mało materiałów budowlanych"
"0xdb0e3d33" = "Mam dla ciebie następującą misję.<n><n>"
"0xdb0e3d34" = "Mógłbyś wyświadczyć mi przysługę.<n><n>"
"0xdb0e3d35" = "Jest coś, co mógłbyś dla mnie zrobić.<n><n>"
"0xdb10f490" = "Datek"
"0xdb126f49" = "Twoje punkty<n>"
"0xdb170d26" = "Zanim gubernator przydzieli ci nową misję, zadbaj, by twoje statki były w dobrym stanie żeglownym!<n>Jeśli twój konwój jest uszkodzony, przejdź do stoczni i napraw go."
"0xdb170d27" = "Właśnie otrzymałeś trochę pieniędzy, które pomogą ci lepiej wyposażyć twój konwój. <n>Twój konwój powinien mieć trzy w pełni uzbrojone statki i pełną załogę.<n>Nie zapomnij o amunicji i pamiętaj, aby wyznaczyć swoje nowe statki na okręty wojenne. Zrób to teraz."
"0xdb170d28" = "Doskonale!<n>Teraz odwiedź gubernatora i wykonaj misję, którą ci zleci."
"0xdb2ae26e" = "Odmów"
"0xdb2d1177" = "Teraz dokonasz najazdu na kryjówkę piratów.<n>Najpierw sprawdź, czy twój konwój jest w stanie „żeglownym”!<n>Powinieneś odwiedzić kilka innych miast gubernatorskich, aby sprawdzić, czy w jednej z ich stoczni nie jest dostępny większy statek.<n>Po drodze składaj wizyty gubernatorom i zbieraj informacje o kryjówce piratów."
"0xdb2d1178" = "Bitwy portowe są podobne do bitew na otwartym morzu, z tą różnicą, że bitwa toczy się między tobą, a bardzo solidnymi wieżami strzelniczymi, zamiast z innymi statkami.<n>Aby zwyciężyć w bitwie portowej, musisz zniszczyć wszystkie wieże.<n>Czasami w porcie są uzbrojone statki. W takim przypadku musisz zwalczyć te statki, zanim przystąpisz do ataku na sam port."
"0xdb2d1179" = "Aby ukończyć ten scenariusz, wróć ze swoim konwojem do Cartageny."
"0xdb4287ac" = "Gubernator Cartageny uważa, że masz wielki potencjał i podarowuje ci @g$Gold$.<n><n>Wskazówka:<n>Kupuj towary, których jest dużo w mieście (ilość nie może być wyświetlona na czerwono). Następnie sprzedaj te towary w mieście, gdzie jest ich mało. Zapewni to, że otrzymasz za nie lepszą cenę.<n><n>W ten sposób wkrótce powiększysz swój majątek."
"0xdb4eeb89" = "Wybierz konwój"
"0xdb5dde0a" = "dummy"
