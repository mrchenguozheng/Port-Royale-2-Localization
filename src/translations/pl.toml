"0x319f6d80" = "%1 %2 zaatakował miasto, ale nie zdołał przebić się przez umocnienia nadbrzeżne."
"0x31a36a2e" = "Wykonaj dwie następne misje przejęcia miast dla holenderskiego wicekróla, przed zakończeniem wojny między Holandią a Anglią. Masz czas, zanim nadejdzie @D$EndDate$."
