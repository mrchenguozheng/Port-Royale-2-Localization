"0xfa80a0c0" = "%1 pirat %2 wywołał plagę szczurów w mieście. Spożycie pszenicy, owoców, kukurydzy i mięsa będzie dwukrotnie wyższe przez cały miesiąc."
"0xfaa1f6b4" = "Min."
"0xfaa28418" = "Majątek"
"0xfab539b0" = "Dziękuję ci, za zniszczenie tej pirackiej kryjówki. Mam nadzieję, że kryjówka zawierała wystarczająco wiele złota, by to wynagrodziło twój trud. Wszystkie narody są ci wdzięczne!  "
"0xfab62a0a" = "Nie mam dla ciebie żadnych innych wieści. Wróć zobaczyć się ze mną innym razem."
"0xfabae878" = "<g:INTEXT_SPANIEN_800x600.screen>"
"0xfac6c05b" = "Witaj! Konwój jest na szlaku i wkrótce pierwsi kupcy będą trzęśli się u twych stóp! Proszę, wróć później, aby zabrać swój pierwszy udział."
"0xfac6c05c" = "Witam cię, ale obawiam się, że przybywasz zbyt wcześnie! Jeszcze nie mam dla ciebie żadnego udziału. Proszę, poczekaj cierpliwie kilka następnych dni!"
"0xfac6c05d" = "Dzień dobry, %1. Mam tu udział dla ciebie. Tym razem dostajesz %2!"
