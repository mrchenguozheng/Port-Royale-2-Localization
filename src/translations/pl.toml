"0x28f090e8" = "Listy kaperskie"
"0x293d8c9f" = "Doskonale! Twoje miasto jest już całkiem spore. Wkrótce przybędą pierwsi kupcy z innych miast, aby handlować towarami z twoim miastem.<n><n>Ale twojemu miastu grożą także odwiedziny przez mniej pożądane postacie. Należą do nich piraci i korsarze z narodów, z którymi masz kiepskie relacje. Twoim następnym zadaniem będzie zatem najęcie żołnierzy i wzniesienie dział portowych.<n><n>Na szczęście, mieszkańcy twojego miasta potrafią w dużym stopniu sami się zorganizować. Musisz dać im tylko kilka instrukcji i zakupić wszelkie niezbędne materiały. Poza tym, nie ma innych kosztów.<n><n>Możesz polecić budowę dział portowych za pomocą menu budowy i zatrudnić żołnierzy w swoim pałacu.<n><n>Pamiętaj:<n>Żołnierze także potrzebują kwater mieszkalnych! Jednak, w odróżnieniu od pracowników, każdy żołnierz zajmuje tylko jedno miejsce na obszarze mieszkalnym.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zbuduj pięć dział portowych i zwiększ liczebność swoich żołnierzy do 300."
