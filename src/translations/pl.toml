"0xdd14592b" = "Po przebiciu się przez fortyfikacje portu, twój konwój przybija do doków, a żeglarze wyruszają na poszukiwanie pirackiego skarbu. Nagle napotykają pirata imieniem %1, który wyzywa twojego kapitana na pojedynek."
"0xdd22ec49" = "Twój statek jest w porcie. Podstawowa załoga jest już na pokładzie."
"0xdd379158" = "Dostarcz @a$Amount$ narzędzi na rynek miasta @T$DestTown$, zanim nadejdzie @D$Date$. Otrzymasz @g$GoldPerBarrel$ za każde <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
"0xdd3808a0" = "Scenariusz wprowadzający<n><n>W grze Port Royale 2 możesz budować w każdym mieście, w którym uzyskasz zezwolenie na budowę. Zawsze posiadasz zezwolenie na budowę w mieście, w którym rozpoczniesz grę.<n:25>Ten scenariusz wprowadzi cię w budowanie i produkcję. Twoje zadanie polega na zbudowaniu kilku budynków handlowych i mieszkalnych. Podczas różnych kroków w scenariuszu trzeba będzie znaleźć surowce, osadników i pracowników. "
"0xdd5aa167" = "Otrzymałeś @g$Gold$."
"0xdd644e9f" = "Przykro mi, ale okazuje się, że nie mogę dać ci tej misji. Właśnie usłyszałem, że problem przestał istnieć."
