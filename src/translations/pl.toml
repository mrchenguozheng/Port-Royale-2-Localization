"0x19b399ce" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Zamknij okno dialogowe/<n><t>Menu opcji<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>Szybkie przewijanie do przodu<n><f:fonts/Tiepolo_black14x14aaFHk.res>Shift<f:fonts/Tiepolo_bold14x14aaFH.res><t>Centruj na konwoju<n><f:fonts/Tiepolo_black14x14aaFHk.res>Caps Lock<f:fonts/Tiepolo_bold14x14aaFH.res><t>Centrowanie wł./wył.<n><f:fonts/Tiepolo_black14x14aaFHk.res>Klawisze ze strzałkami<f:fonts/Tiepolo_bold14x14aaFH.res><t>Przesuń<n><t>okno podglądu<n><f:fonts/Tiepolo_black14x14aaFHk.res>CTRL + 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Zapisz konwój<n><f:fonts/Tiepolo_black14x14aaFHk.res> 1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>Przywróć konwój<n><f:fonts/Tiepolo_black14x14aaFHk.res> TAB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Następny konwój<n><f:fonts/Tiepolo_black14x14aaFHk.res>+ / -<f:fonts/Tiepolo_bold14x14aaFH.res><t>Tempo gry<n><f:fonts/Tiepolo_black14x14aaFHk.res>F5 <f:fonts/Tiepolo_bold14x14aaFH.res><t>Szybki zapis<n><t> (niedostępne podczas bitew)"
"0x19c31f0b" = "Nowa ranga: %1"
"0x19c34763" = "Wczytaj szlak kupiecki"
"0x19c8d3d9" = "Twój konwój został pobłogosławiony."
"0x19e2f378" = "%1: Brak robotników"
"0x19f3d8a6" = "Według liczby statków"
"0x19f413a1" = "W tym scenariuszu masz znacznie więcej do zrobienia niż w pierwszym. Nauczysz się handlować z zyskiem i uzyskasz swoje pierwsze dochody z handlu.<n><n>Utworzysz także drugi konwój, który umożliwi ci transport większej ilości towarów.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Przeczytaj i zastosuj się do wskazówek w oknie wydarzeń."
"0x1a106105" = "Konwój nie brał jeszcze udziału w bitwie morskiej."
"0x1a2ebe80" = "Niestety, nie mam dogodnych konwojów na kotwicy w porcie. Konwój musi składać się dokładnie z 5 statków i mieć 150 dział na pokładzie. Wróć, gdy zbierzesz taki konwój."
"0x1a3808bb" = "Kupiec nazywa się @N$Name$, a jego miasto macierzyste to @T$Town$. Jeśli uda ci się zniszczyć jego konwój, zanim nadejdzie @D$EndDate$, nagrodzę cię sowicie różnymi dobrami."
"0x1a444b3b" = "Nie mogę zlecić ci przejęcia miasta innego narodu w moim imieniu, ponieważ w tej chwili nie toczymy wojny. Jednak wszystko może zmienić się bardzo szybko. Wróć do mnie, gdy tak się stanie."
"0x1a444b3c" = "%1 prowadzi z nami wojnę, a ty sprawiłeś, że %1 ma już tylko jedno miasto. Nie możemy go przejąć, dlatego teraz nie mogę zlecić ci zajęcia żadnego miasta. <n><n>Wróć jednak, gdy sytuacja się zmieni."
"0x1a444b3d" = "Chętnie zleciłbym ci przejęcie miasta, którym włada %1. Mam dość konwojów wojskowych do obrony nowych przejętych obszarów.<n><n>Jednak %1 jest nadal zbyt silna, by podjąć taką akcję.<n><n>Możesz sprawić, by %1 stała się słabsza niszcząc jej konwoje wojskowe.<n><n>Potem wróć do mnie, a może będę miał misję dla ciebie."
"0x1a444b3e" = "Chętnie zleciłbym ci przejęcie miasta, którym włada %1. Mam dość konwojów wojskowych do obrony nowych przejętych obszarów.<n><n>Jednak %1 jest nadal zbyt silna, by podjąć taką akcję.<n><n>Możesz sprawić, by %1 stała się słabsza niszcząc jej konwoje wojskowe.<n><n>Potem wróć do mnie, a może będę miał misję dla ciebie.<n><n><n>Możesz sprawdzić siłę narodu pod zakładką „Narody” w Kronice. "
