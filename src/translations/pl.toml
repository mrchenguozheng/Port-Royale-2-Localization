"0x034e66b1" = "Magazyny"
"0x0351768f" = "Czy słyszałeś opowieść o piracie Czarnobrodym? Naprawdę nazywa się Edward Teach i posiada kilka konwojów, a od pewnego czasu z dużym powodzeniem atakuje kupców wszelkich narodów. Nikomu jednak nie udało się go aresztować.<n><n>Zlecam ci zatem zadanie wyśledzenia jednego z jego konwojów i zniszczenia go."
"0x03517690" = "Działania bandy Czarnobrodego zamierają, ale nie możemy spocząć na laurach, gdy rzecz tyczy się tych brudnych kundli. Wobec tego wyznaczam ci zadanie zniszczenia jeszcze jednego z konwojów Czarnobrodego."
