"0xea33c5c8" = "Symulacje i misje"
"0xea43addd" = "To dobra okazja dla nas. Miasto, którego właścicielem jest @n$TargetNation$ pragnie związać się z naszym narodem, ponieważ ciągle nękają je różne konflikty. Chcę, żebyś wspierał to miasto, aż zdecyduje się zmienić swoją narodowość."
"0xea43adde" = "Pojawił się problem dotyczący miasta, którego właścicielem jest @n$TargetNation$. Pisemne porozumienie w sprawie pokojowego przejęcia miasta przez nasz naród zostało podpisane dawno temu. Niestety, @n$TargetNation$ przestała honorować to porozumienie. Chcę, żebyś wspierał miasto do czasu, aż konflikt zostanie rozwiązany."
"0xea43addf" = "Miasto, którego właścicielem jest @n$TargetNation$ popadło w poważny konflikt ze swoim wicekrólem. Znam tego powody i teraz zamierzam wspierać miasto, aby zachęcić je do przejścia na naszą stronę. Możesz pomóc mi tego dokonać."
"0xea44c34b" = "Koszt:"
"0xea566056" = "Misje wykonane"
"0xea597c1f" = "%1<n>(spłata sumy %2 w ciągu %3 miesięcy)"
"0xea62b758" = "Znani piraci"
"0xea70e2e3" = "na pokładzie"
"0xea7ede96" = "Znajdź kryjówkę pirata Czarnobrodego. @l$IslandPos$"
"0xea8b5027" = "Wyrządziłeś wiele szkód mojemu narodowi, ale jesteś także człowiekiem, który może nas ocalić. Proponuję ci naszą przyjaźń za %1. Co ty na to?"
"0xea92b930" = "Jestem %1. Czy chcesz ubić interes? Jeśli dasz mi konwój, dam ci %2 udziału w moim łupie. Możesz mi nawet wskazać, na jakich wodach mam operować. Przekaż mi dowolny konwój składający się najwyżej z 5 statków."
"0xea93e08e" = "Zbuduj szpital"
"0xeaa83fa4" = "Opłata"
"0xeab3ad38" = "Zbuduj w mieście Santa Marta przedsiębiorstwo produkcji kakao i jeden obszar mieszkalny."
"0xeac82d4c" = "Przeczytaj i zastosuj się do wskazówek widocznych w oknie Wydarzeń."
"0xeadf3ee3" = "Sztorm"
"0xeaeac619" = "Styczeń"
"0xeaeedfdf" = "<f:fonts/Tiepolo_black13x13aaFHk.res>Atakuj miasta<n><f:fonts/Tiepolo_bold13x13aaFHk.res>(zbliżając się do miasta)"
"0xeaef8c4f" = "Córka gubernatora"
"0xeb151beb" = "Znani piraci"
"0xeb1ce06d" = "Konwój znajduje twoją żonę dryfującą na tratwie. Zasmakowała przygody, ale teraz chce jak najszybciej wrócić do domu, do swoich puderniczek."
"0xeb1ce06e" = "Konwój znajduje twoją żonę dryfującą na tratwie. Mówi, że piraci porzucili ją, ponieważ sprawa dotyczyła tylko ich i ciebie."
"0xeb1ce06f" = "Nareszcie, konwój znajduje twoją żonę, dryfującą po morzu. Jest nieprzytomna, ale po chwili wraca do zmysłów:<n>„Ten prostak porwał mnie! Naprawdę uwierzył w to, że chcę z nim uciec, tylko dlatego, że raz czy dwa uśmiechnęłam się do niego uprzejmie.”"
"0xeb288ee4" = "Za mała pojemność magazynowa"
"0xeb2aee46" = "Nie możesz zakończyć transferu, ponieważ twój konwój jest przeładowany. Usuń trochę ładunku ze swojego konwoju lub dodaj więcej statków."
"0xeb46ee46" = "Skład"
"0xeb61a2d8" = "%1: Konfiskata."
"0xeb63edc3" = "Odwiedź gubernatora Cartageny i wypełnij jego misję."
