"0x0034be0d" = "Szybkość"
"0x004b9030" = "Wiesz już, że w bitwie biorą udział tylko statki eskorty. Pokonane statki kupieckie zawsze przypadają zwycięzcy, który może je splądrować lub przechwycić.<n><n>Nie zawsze ty inicjujesz bitwy, w których biorą udział twoje konwoje. Jeśli jeden z twoich konwojów zostanie zaatakowany przez piratów lub konwój wojskowy z narodu, w którym twoja reputacja jest bardzo niska, możesz wziąć udział w bitwie lub twój konwój może spróbować uniknąć bitwy. Jeśli chcesz uniknąć bitwy, twoje statki eskorty muszą spróbować nie dopuścić wroga zbyt blisko twoich statków kupieckich.<n><n>Jeśli to się nie uda, twoje statki eskorty zostaną przechwycone, a statki kupieckie splądrowane. Jeśli w konwoju nie ma okrętów wojennych, w przypadku ataku taki konwój może tylko próbować uniknąć bitwy. Zaleta takiej sytuacji: statki kupieckie są tylko plądrowane przez wroga. Nie są przechwytywane.<n><n>Teraz złóż wizytę gubernatorowi. Gubernator ma dla ciebie nową misję. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Wykonaj następną misję zleconą ci przez gubernatora."
