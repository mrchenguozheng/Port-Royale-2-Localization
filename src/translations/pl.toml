"0x2840c9a8" = "Dobrze. Twoja misja polega na splądrowaniu @a$Amount$ towaru: @G$Goods$ od angielskich kupców. "
"0x2840c9a9" = "Dobrze. Twoja misja polega na splądrowaniu @a$Amount$ towaru: @G$Goods$ od francuskich kupców. "
