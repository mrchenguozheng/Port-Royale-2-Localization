"0xdeeff9c4" = " Wydaje się pewne, że skrzynia zawierała, między innymi, pudełko miętowych ciasteczek z Anglii."
"0xdeeff9c5" = " Zdaje się, że skrzynia była używana do przechowywania cętkowanych pończoch, jedwabnej pidżamy i jeździeckich bryczesów."
