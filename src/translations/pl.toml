"0xf88d5e17" = "Statystyka zaludnienia"
"0xf88d6ee5" = "Dostarcz jakąkolwiek ilość towaru: @G$Goods$ na rynek w mieście @T$TOWN$. Tam natychmiast otrzymasz @g$Price$ za beczkę. W dniu: @D$EndDate$, konwój ekspedycyjny zabierze towary. Eskortuj konwój do Europy, a otrzymasz następne @g$Price$ za beczkę."
"0xf894bc2d" = "Konwój nie może postawić żagli, ponieważ część twoich statków jest w bardzo złym stanie. Napraw swój konwój w stoczni, zanim ponownie wyślesz go na morze. Możesz także oddzielić uszkodzone statki od konwoju i naprawiać je niezależnie."
"0xf89f542f" = " Otrzymałeś <o:0xff1e1eff>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GOLD_800x600.screen>."
"0xf8af3810" = "Mamy tu wszystko, czego potrzebujemy."
"0xf8b3a303" = "Status miasta może osiągać siedem kolejnych poziomów, od ubóstwa do zamożności. Na dwóch najniższych poziomach, jakość życia jest tak niska, że mieszkańcy regularnie opuszczają miasto. Z drugiej strony, gdy miasto osiągnie poziomy „kwitnącej ekonomii”, „zamożności” i „bogactwa”, twoje przedsiębiorstwa otrzymają premię wydajności, a twoja siła robocza stanie się tańsza. Na najwyższym poziomie miasto produkuje własnych osadników.<n><n>Więcej informacji o wpływie każdego poziomu statusu znajdziesz w oknie informacji o mieście. Aby go wyświetlić, kliknij na nazwie miasta.<n><n> Wystarczające zapasy dwóch lub trzech towarów z każdej grupy dóbr zapewnią dobrą jakość życia w twoim mieście. Zasoby towarów są wystarczające, jeśli zaspokoją potrzeby populacji miasta przez dziesięć dni.<n><n>Uwaga: Status miasta nie zmienia się gwałtownie. Mieszkańcom miasta zajmuje nieco czasu zaadaptowanie się do nowej sytuacji."
"0xf8bacb9a" = "Tawerna"
"0xf8cc0545" = "Sprzedane towary"
"0xf8e13932" = "Wspieraj miasto @T$TargetTown$ towarami i kupuj nadwyżki towarów. W dniu @D$EndDate$, status miasta musi mieć stan „nagłego rozwoju”, a wszystkie przedsiębiorstwa miejscowych kupców muszą pracować z pełną wydajnością."
"0xf8e13933" = "Wspieraj miasto @T$TargetTown$ towarami i kupuj nadwyżki towarów. W dniu @D$EndDate$, status miasta musi mieć stan „kwitnącej ekonomii”, a wszystkie przedsiębiorstwa miejscowych kupców muszą pracować z pełną wydajnością."
