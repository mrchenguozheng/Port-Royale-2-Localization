"0x084340c7" = "Ten wymagający scenariusz dotyczy w całości handlu, produkcji i dostaw towarów w mieście.<n:25>Dziwne rzeczy dzieją się w Tortudze: niewielu kupców chce odwiedzać miasto, a kilka wydarzeń utrudniło życie jego mieszkańców. Twoje zadanie polega na ocaleniu miasta od upadku. Na końcu scenariusza wyświetlony zostanie twój wynik. Zależy on od twojej szybkości i majątku pod koniec scenariusza.<n:25>W tym scenariuszu możesz użyć wszystkich opcji dostępnych w trybie wolnej gry, ale masz także określone cele, które musisz wypełnić."
