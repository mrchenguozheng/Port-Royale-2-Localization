"0xc7640157" = "A zatem, statki są w porcie. Dziękuję ci. Natychmiast utworzę nowy konwój wojskowy.<n>Tym razem nie nagrodzę cię złotem, bowiem masz go już mnóstwo.<n>Zamiast tego dam ci mapę, na której zaznaczyłem położenie zatopionego konwoju transportowego. Znajdziesz tam dużo towarów."
"0xc7640158" = "A zatem, statki są w porcie. Dziękuję ci. Natychmiast utworzę nowy konwój wojskowy.<n>Jak już mówiłem, moje zapasy są obecnie bardzo ograniczone i żałuję, ale nie mogę nagrodzić cię złotem. Jednak moja nagroda jest nie mniej cenna.<n>Proszę, weź tę mapę. Zaznaczyłem na niej położenie zatopionego konwoju transportowego. Znajdziesz tam dużo towarów."
