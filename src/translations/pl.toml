"0xdbd3f83d" = "%1,<n>czego chcesz ode mnie? Gdybyś przypłynął do miasta jak prawdziwy żeglarz, obróciłbym przeciwko tobie moje działa, bowiem jesteś wrogiem mojego narodu.<n><n> Ale skoro już tu jesteś, muszę zachowywać się jak prawdziwy dżentelmen."
