"0x147c4ab1" = "Widzę, że jesteś zamożnym człowiekiem, %1. Trudno mi związać koniec z końcem i chciałbym w imieniu mojego narodu spytać cię, czy w swojej szczodrobliwości zechciałbyś udzielić mi pożyczki w wysokości %2? Otrzymasz z powrotem %4 w ciągu %3 miesięcy."
