"0x31ed47e7" = "Sabotażysta skaził zapasy żywności w Tortudze. To natychmiast wywołało głód w mieście.<n><n>Twoim zadaniem jest zakończenie tego głodu, najszybciej jak się da.<n><n>Przez około 2-3 tygodnie musisz dbać o to, by w mieście codziennie było dostępnych do konsumpcji jak najwięcej żywności.<n><n>Wskazówka: Do żywności zaliczają się: pszenica, owoce, kukurydza i mięso.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Głód musi zakończyć się, zanim nadejdzie @D$EndDate$."
