"0xd8e39bc3" = "Pomóż wicekrólowi Wielkich Bahamów zwiększyć siłę wojskową Holandii przekazując mu konwój. Następnie przyjmij misję przejęcia miast w jego imieniu."
"0xd91054d3" = "Ten statek nie ma kapitana i dlatego nie może postawić żagli. Najmij w tawernie kapitana dla tego statku, albo dodaj go do istniejącego konwoju."
"0xd918680a" = "Sprzedałeś swoje zezwolenie na budowę i wszystkie twoje budynki w tym mieście."
"0xd918680b" = "Oddałeś swoje zezwolenie na budowę."
"0xd91d3621" = "maks. liczba dział"
"0xd92d797c" = "Kupiec z innego narodu zwabił i zabrał znaczną liczbę pracowników. Ci pracownicy opuścili miasto jako osadnicy, razem ze swoimi rodzinami.<n><n>Twoje zadanie polega teraz na zalezieniu odpowiedniej ilości osadników, by przedsiębiorstwa w mieście miały pełną obsadę pracowników, zanim nadejdzie @D$EndDate$.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza <f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Liczba obywateli (mieszkańcy minus żołnierze) musi zostać przywrócona do stanu o @I$Pop$, zanim nadejdzie @D$EndDate$."
"0xd95aa48e" = "Obawiam się, że zbyt długo zwlekałeś z odpowiedzią. Porozmawiaj najpierw z moją córką, aby przekonać się, czy nadal cię chce."
"0xd95fcda8" = "Zamknij"
"0xd9720471" = "Witaj. Czy posiadasz statek, który może zabrać mnie do miasta @T$TargetTown$? Muszę się tam pilnie dostać, zanim nadejdzie @D$EndDate$. Zapłacę ci @g$Reward$, jeśli dowieziesz mnie tam na czas."
"0xd9720472" = " @A$USER$, czekałem tu na ciebie. Ale pilnie muszę dostać się do miasta @T$TargetTown$. Czy możesz mnie tam zabrać? Zapłacę ci @g$Reward$!"
"0xd9720473" = " @A$USER$, szukam przewoźnika do miasta @T$TargetTown$. Będę nader wdzięczny, jeśli dasz mi koję na jednym z twoich statków. Zapłacę ci @g$Reward$."
"0xd979efd5" = "Niech zatem tak będzie. Proszę, zacznij budować szpital w mieście @T$Town$, zanim nadejdzie @D$EndDate$."
"0xd99426c9" = "Nie zechciałbyś zagrać ze mną w karty?<n><n>Zatem ustal swoją stawkę! Ja dorzucę tyle samo, a zwycięzca bierze wszystko."
"0xd99426ca" = "Nawet nie muszę pytać, czy zagrasz ze mną, skoro jesteś czysty jak świeżo wyszorowany pokład! Wróć, gdy będziesz miał pełne kieszenie."
"0xd99426cb" = "Och nie, tylko nie ty! Jeszcze pamiętam naszą ostatnią grę. Nadal nie masz dość? Cóż, na razie nie zagram z tobą."
"0xd99426cc" = "Gracze dostają 5 kart. Licytuję %1 punktów.<n><n>Jeśli chcesz grać, musisz zalicytować jeden punkt więcej."
"0xd99426cd" = "A zatem wchodzę. %1 to atut.<n>To moja pierwsza karta."
"0xd99426ce" = "Prowadzisz. Powiedz mi, jaki kolor wybierasz na atut (wybierz kartę)."
"0xd99426cf" = "A zatem %1 to atut.<n>Zagraj swoją pierwszą kartę."
"0xd99426d0" = "Wygrałeś jeden punkt.<n>Wybierz swoją następną kartę."
"0xd99426d1" = "Wygrałem jeden punkt.<n>A to moja karta."
"0xd9942739" = "Nie zdobędę tyle punków, ile wylicytowałem. Przegrałem."
"0xd994273a" = "Zdobyłem tyle punktów, ile wylicytowałem. Przegrałeś."
"0xd994273b" = "Nie zdobędziesz tylu punktów, ile wylicytowałeś. Przegrałeś grę."
"0xd994273c" = "Zdobyłeś tyle punktów, ile wylicytowałeś. Udało ci się!"
"0xd994273d" = "A zatem mój ostatni punkt. Przegrałeś grę!"
"0xd994273e" = "A niech to, powinienem zdobyć ten punkt. Przegrałem grę."
"0xd994273f" = "Cóż, zdaje się, że miałem więcej szczęścia w grze. Obawiam się, że przegrałeś."
"0xd9942740" = "Masz diabelne szczęście!<n>To była moja ostatnia gra, jestem spłukany."
"0xd9942741" = "Zabrałeś całe moje złoto. Zamów mi flaszkę rumu, a potem zostaw mnie samego. Chcę utopić moje smutki."
"0xd9942742" = "No i dokonałeś tego! Dzisiaj nie będę mógł pokazać się w domu."
"0xd99427aa" = "Wygrałeś grę!"
"0xd99427ab" = "Dasz się skusić na jeszcze jedną grę?"
