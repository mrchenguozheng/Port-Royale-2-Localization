"0x0a49c903" = "Gratulacje! Udało ci się pomyślnie ukończyć drugi scenariusz. Nauczyłeś się handlować z zyskiem, osiągnąłeś wyższą rangę i utworzyłeś nowy konwój wynajmując kapitana.<n><n>Zauważ, że im więcej doświadczenia mają kapitanowie, tym są drożsi. Zwykle na początku mają bardzo mało doświadczenia, ale z biegiem czasu wszyscy kapitanowie nabywają doświadczenia w nawigacji, handlu i walce, w zależności od tego, jak ich wykorzystujesz. Możesz sprawdzić aktualne poziomy doświadczenia swoich kapitanów w oknie przeglądu konwoju. Aby to zrobić, kliknij na konwoju, a następnie na przycisku „Przegląd i koszty”.<n><n>W następnym scenariuszu założysz własne przedsiębiorstwa i zaczniesz produkować towary. "
