"0x0adb3fdd" = "Wiedziałem, że mogę ci ufać. Sprawa dotyczy miasta @T$TargetTown$, którym włada @n$HostileNation$. Zaatakuj miasto i ogołoć je ze wszystkiego co zechcesz, a potem poszukaj mojej żony. Nie zwlekaj, ponieważ muszę coś zrobić, zanim nadejdzie @D$EndDate$.<n><n>Jeśli jeszcze nie posiadasz listu kaperskiego, którego celem jest @n$HostileNation$, dam ci go teraz."
"0x0adb3fde" = "Moja żona będzie nad wyraz uradowana. Pudliczka Misia została ukryta w mieście @T$TargetTown$. Splądruj miasto, aby wyglądało to na misję wojskową, a potem poszukaj psa. Masz czas, zanim nadejdzie @D$EndDate$.<n>Wierz mi, wolałbym już nie zobaczyć tego psa, ale przygnębienie mojej żony nie mija.<n><n>Jeśli jeszcze nie posiadasz listu kaperskiego, którego celem jest @n$HostileNation$, dam ci go teraz."
"0x0adb3fdf" = "A zatem, wszystko ustalone. Proszę, splądruj miasto @T$TargetTown$ i sprowadź do mnie moją córkę. Jej urodziny przypadają w dniu @D$EndDate$ i ona musi tu być, żeby mogła razem z nami obchodzić tę specjalną okazję.<n><n>Jeśli jeszcze nie posiadasz listu kaperskiego, którego celem jest @n$HostileNation$, dam ci go teraz."
