"0x2e39d24e" = "Widzę, że jesteś majętnym człowiekiem, %1.<n><n>Normalnie poprosiłbym cię o pożyczkę, ale niestety mogę prowadzić takie interesy tylko z miejscowymi kupcami. A zatem, musisz uzyskać zezwolenie na budowę w moim mieście."
