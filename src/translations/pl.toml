"0x35f48fe4" = "[riddle:answer=Cancun;group=35f48fe4;clue=świątyniach, rogu, południowy wschód;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 2`&authored]Dawno temu inni ludzie tu żyli, co w wielkich świątyniach swych bogów wielbili. Wyżej leży X, w samym rogu. Bacz, że na południowy wschód żeglujesz bez powodu."
"0x35f48fe5" = "[riddle:answer=-southwest;group=35f48fe5;clue=południowy zachód, świątyniach;level=direction;certainty=certain;source=original-en&authored]Dawno temu inni ludzie tu żyli, co w wielkich świątyniach swych bogów wielbili. Wyżej leży X, w samym rogu. Bacz, że na południowy zachód żeglujesz bez powodu."
"0x35f48fe6" = "[riddle:answer=Havana;group=35f48fe6;clue=rumu, cygaro;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 12`&cargo&authored]Drogi z X do Nombre nie jest dużo lecz mało, jeśli masz mnóstwo rumu, a wieczorem cygaro."
