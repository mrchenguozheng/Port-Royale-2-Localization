"0x03036377" = "Kapitan %1 tworzy nowy konwój.<n>Konwój jest gotowy do drogi i czeka w porcie.<n>Codzienny żołd kapitana i załogi podstawowej wynosi %2."
"0x030bb0b2" = "Jak wiesz, @n$HostileNation$ i my prowadzimy wojnę.<n><n>To dobry moment, by napełnić nasze magazyny towarami, których @n$HostileNation$ ma wielkie zapasy.<n><n>Chcę, żebyś przechwycił dla mnie znaczną ilość pewnego towaru.  "
"0x030bb0b4" = "Ponieważ @n$HostileNation$ prowadzi z nami wojnę, otrzymałem od wicekróla rozkaz, by naszych wrogów dotknęły poważne braki towarów.<n><n>Zatem przydzielam ci misję plądrowania. Czy przyjmujesz misję?"
"0x03141035" = "Projekt miast"
