"0x397f6e43" = "Zakupiłeś @a$Amount$ towaru: @G$Goods$. Zabierz towar na rynku w mieście @T$TOWN$."
"0x3989bf5c" = "Witaj, %1. Sternik %2 zaproponował swoje usługi jako doświadczony kapitan."
"0x398a7b09" = " Otrzymałeś @g$Gold$."
"0x398d968f" = "Angielski kapitan"
"0x398e8fd5" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_GEBAEUDE_800x600.screen>"
"0x3998d524" = "<gs:TEXTFLUSS_KEINEHOEHE>%1 %2"
"0x39a23a8f" = "Filmy"
"0x39a7d8ee" = "Nieznany pirat"
"0x39c75485" = "nieznana"
"0x39e32dc6" = "Dziękuję ci pięknie. Miasto, o którym mowa, zwie się @T$TargetTown$. Mam nadzieję, że uda mi się dojść do porozumienia z kupcami, zanim nadejdzie @D$EndDate$. Do tego czasu, miasto nie może spaść poniżej statusu „nagłego rozwoju”, abym mógł prowadzić negocjacje z mocniejszej pozycji."
"0x39e32dc7" = "Miasto, o którym mowa, to @T$TargetTown$. Zaopatruj miasto we wszystkie dobra, których potrzebuje. Zrobię wszystko, co w mojej mocy, aby raz na zawsze stłumić plotki, zanim nadejdzie @D$EndDate$. Przedtem, miasto nie może spaść poniżej statusu „nagłego rozwoju”."
"0x39e32dc8" = "Miasto w kłopotach to @T$TargetTown$. Jego status nie może spaść poniżej stanu „nagłego rozwoju”, zanim nie nadejdzie @D$EndDate$. Inaczej, zbyt wielu obywateli opuści miasto. Istnieje tam nawet ryzyko wybuchu zarazy. Musisz zadbać o zaopatrzenie miasta na czas w wystarczającą ilość towarów, aby temu zapobiec!"
"0x39e32dc9" = "Dobrze. @T$TargetTown$ to miasto, o którym mowa. Zaopatruj miasto we wszystko, czego potrzebuje, zanim nadejdzie @D$EndDate$. Jego status nie może spaść poniżej stanu „nagłego rozwoju”. Muszę być szczery i powiedzieć ci, że miasto najprawdopodobniej dotknie zaraza. Bądź na to gotowy."
"0x39e7361e" = "Miasto %1 pokonane"
"0x39e9081a" = "Odkryłeś położenie kryjówki Czarnobrodego. Aby uzyskać informacje o bandzie piratów, kliknij na symbolu kryjówki na mapie morskiej.<n><n>Uważaj: Gdy zniszczysz kryjówkę, banda piratów przestanie istnieć. Jednak wszelkie konwoje pirackie, które nie znajdowały się w kryjówce w tym czasie, dowiedzą się o tym ataku i potem założą nową kryjówkę.<n><n>Twoim pierwszym celem jest zatem zniszczenie wszystkich konwojów należących do kryjówki. W najlepszym razie powinieneś czekać na wszystkie konwoje wpływające lub wypływające z kryjówki i atakować je.<n><n>Otrzymałeś pewne wsparcie gotówkowe w swojej misji.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zniszcz wszystkie pirackie konwoje Czarnobrodego, które aktualnie znajdują się na morzu. Nie atakuj jego kryjówki!"
