"0xdef5305e" = "Splądrowane: %1"
"0xdf10406e" = "Dobra robota! Twoje miasto urosło już nieco.<n><n>Gdy tylko twoje miasto przekroczy liczbę 1000 mieszkańców, zacznie interesować kupców z innych miast, którzy mogą przybywać, aby handlować swoimi towarami.<n><n>Kupcy zwykle odwiedzają miasto, gdy w mieście jest popyt na określony towar, innymi słowy, jeśli jakiś towar jest niedostępny w twoim mieście.<n><n>Właśnie otrzymałeś komunikat o handlu i produkcji w twoim własnym mieście. Aby go przeczytać, otwórz dziennik.<n><n>Twoim pierwszym celem jest zwiększenie populacji twojego miasta do 1000.<n><n>Uwaga: Jeśli miasto ma ponad 500 mieszkańców, musi mieć tawernę! <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zwiększ populację swojego miasta do 1000."
