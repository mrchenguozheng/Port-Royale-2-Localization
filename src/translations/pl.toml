"0x05478cea" = "Moja córka wspomniała już, że przyjdziesz. Wiesz, ona bywa czasami bardzo porywcza. Ale nie mogę sprzeciwiać się pragnieniom mojej córki i myślę, że jesteś właściwym mężczyzną dla niej. Dlatego muszę cię spytać: czy chcesz, by %1 stała się twoją żoną? "
"0x05633055" = "Twoje budynki"
"0x05716a06" = "Twoja następna bitwa będzie nieco trudniejsza, ponieważ tym razem przeciwnik będzie stawiał opór. Twoja misja polega na wyśledzeniu i zniszczeniu pirata w imieniu gubernatora.<n><n>Ale najpierw musisz uzbroić swój konwój przed bitwą. Kup statek, dodaj go do swojego konwoju i zabierz na pokład nowe uzbrojenie i żeglarzy.<n><n>W dowolnym momencie podczas bitwy morskiej możesz wcisnąć klawisz F1, aby wyświetlić konfigurację klawiatury i myszy. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Uzbrój swój konwój i wykonaj nową misję zleconą ci przez gubernatora Cartageny."
"0x058ca789" = "Odwiedź gubernatora miasta @T$TOWN$ i przyjmij jego misję."
"0x05980d2c" = "Poziom trudności określa ceny towarów i uszkodzenia zadawane podczas bitew morskich.<n><n>Dodatkowo, przy niskim poziomie trudności nie musisz mieć bardzo dobrego rejestru handlowego w mieście, by móc nabyć w nim zezwolenie na budowę."
"0x05ae35b1" = "Bardzo dobrze! Teraz odwiedź hiszpańskiego wicekróla w Port Royale i przyjmij misję przejęcia francuskiego miasta.<n><n>Zwykle musisz przejąć dwa miasta, zanim wicekról nada ci ziemię. Jednak w tym scenariuszu otrzymujesz niewielką premię i musisz przejąć dla Hiszpanii tylko jedno miasto.<n><n>Możesz wybrać, które miasto chcesz przejąć. Dobrze jest wybrać miasto z minimalną liczbą dział portowych. Jedno z francuskich miast, które w tej chwili stanowi doskonały cel to @T$SampleTown$.<n><n>W zamian za przejęcie miasta, wicekról nagrodzi cię skrawkiem ziemi. Uwaga: Nie możesz rozmawiać z wicekrólem, zanim nie osiągniesz rangi co najmniej Bosmana.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Odwiedź hiszpańskiego wicekróla w Port Royale i przyjmij misję przejęcia miasta. Po ukończeniu tej misji możesz przyjąć jego dar w postaci ziemi."
