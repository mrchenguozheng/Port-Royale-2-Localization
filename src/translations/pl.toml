"0xf4da7469" = "oraz"
"0xf4e195bf" = "Czarnobrody odkrył, że współpracujesz z gubernatorem miasta @T$TOWN$. Wobec tego zaczął terroryzować kupców odwiedzających miasto @T$TOWN$. W ciągu kilku następnych dni niewielu kupców odważy się przybyć do miasta @T$TOWN$. <n><n>To tylko tymczasowa taktyka. Twoje zadanie polega na zaopatrywaniu miasta w towary, zanim nadejdzie @D$EndDate$. Status miasta nie może spaść poniżej „kwitnącej ekonomii”.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zaopatruj miasto @T$TOWN$ w towary, zanim nadejdzie @D$EndDate$. Status miasta nie może spaść poniżej stanu „kwitnącej ekonomii”."
