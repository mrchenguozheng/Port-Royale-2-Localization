"0x028a81fb" = "Hiszpańska flota skarbów"
"0x028f5322" = "Gdybym znał cię lepiej, mógłbym powierzać ci także misje i listy kaperskie. Jednak, w tym celu musisz uzyskać zezwolenie na budowę w moim mieście."
