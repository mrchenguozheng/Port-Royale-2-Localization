"0xf9125b3d" = "Konwój piracki, którym dowodzi @P$PirateName$ działa obecnie w pobliżu Belize, na północny zachód od Cartageny. Twoja misja polega na zniszczeniu tego konwoju. Potem wróć do gubernatora Cartageny."
"0xf91ff4fd" = "Miasta"
"0xf921efc0" = "Znalazłeś szczątki zatopionego konwoju i zabierasz towary na pokład."
"0xf921efc1" = "Znalazłeś szczątki zatopionego konwoju transportowego, ale na pokładzie nie ma miejsca, żeby zabrać towary."
"0xf9256ece" = "Koszt naprawy"
"0xf9279095" = "Na skromny festyn potrzebujesz po %1 pszenicy, owoców, mięsa, rumu i wina."
"0xf9279096" = "Na przeciętny festyn potrzebujesz po %1 pszenicy, owoców, mięsa, rumu i wina."
"0xf9279097" = "Na wystawny festyn potrzebujesz po %1 pszenicy, owoców, mięsa, rumu i wina."
"0xf92c7177" = "Módl się"
"0xf92d7da5" = "%1%"
"0xf932eef8" = "Gratulacje! Udało ci się pomyślnie ukończyć ten scenariusz i teraz wiesz jak rozbudowywać własne miasto.<n><n>W trybie wolnej gry, wicekról dowolnego narodu może podarować ci miasto. Niełatwo to jednak osiągnąć, ponieważ zawsze musisz przejąć miasto, aby otrzymać ziemię, a to naturalnie pogorszy twoją reputację wśród innych narodów. <n><n>Wszystko, czego nauczyłeś się w tym scenariuszu na temat rozwoju własnego miasta, pomoże ci rozwijać przedsiębiorstwa także w innych miastach. Główna różnica polega na tym, że nie musisz przejmować się obroną tych miast."
"0xf934d153" = "(Bez efektu)"
"0xf93656ab" = "IDM_CONTEST_01_2004_LOG_00_HDR"
"0xf93abe1a" = "Popraw swoją reputację z Hiszpanią do poziomu „przyjazny”."
"0xf93ea2aa" = "Skrawek ziemi"
"0xf9404c18" = "Zaznaczę przybliżone położenie jego konwoju na mapie morskiej. @l$ConvoyPos$ Do ciebie zależy, czy zniszczysz ten konwój, czy nie. Musisz jednak wykonać tę misję, zanim nadejdzie @D$EndDate$."
"0xf9404c19" = "Obawiam się, że nie mogę ci powiedzieć, gdzie znaleźć jeden z konwojów Czarnobrodego, ponieważ te konwoje przebywają obecnie w tajnej lokacji. Daję ci jednak mnóstwo czasu na tę misję. Musisz zniszczyć konwój, zanim nadejdzie @D$EndDate$."
"0xf9462f72" = "Twoje przedsiębiorstwo w mieście Santa Marta powinno mieć pełną obsadę pracowników."
"0xf94c02c2" = "Za pożyczone %1 otrzymasz uzgodnioną sumę w wysokości %3, w dniu %2."
