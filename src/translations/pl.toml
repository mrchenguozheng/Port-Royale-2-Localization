"0x11e79f57" = "Scenariusz wprowadzający<n><n>W grze Port Royale 2, rozpoczynasz jako skromny kupiec, a twoim celem jest stanie się wpływowym przedsiębiorcą. Aby osiągnąć ten cel, możesz transportować towary oraz handlować, budować, zajmować się polityką i piractwem.<n:25>Scenariusz wprowadzający nauczy cię podstaw prowadzenia gry. W tym scenariuszu, podobnie jak we wszystkich pozostałych, musisz wypełnić kilka różnych celów."
