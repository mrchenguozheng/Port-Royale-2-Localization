"0x15ba13db" = "Widzę, że masz fragment mapy skarbu w swoim dzienniku. Czy zainteresuje cię nowy kawałek? Nigdy nic nie wiadomo, może to wystarczy, żebyś znalazł skarb.<n>Dam ci to za @g$Price$."
"0x15ba13dc" = " @s$USER$, słyszałem, że interesują cię mapy skarbów. Mam tu kawałek, który pasuje do twojej mapy. Dam ci to za @g$Price$."
"0x15ba13dd" = "Dzień dobry, @s$USER$. Słyszałem, że posiadasz niekompletną mapę skarbu, prawda? Chciałbym zaoferować ci kolejny kawałek należący do twojej mapy. Proszę tylko o @g$Price$ za to."
