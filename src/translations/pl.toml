"0xd44a911d" = "Gratulacje! Masz już pewne doświadczenie w produkcji towarów. Być może zauważyłeś także, że nie zawsze łatwo jest sprzedać z zyskiem wyprodukowane towary, gdy trzeba jednocześnie zachować płynność finansową handlując innymi towarami.<n><n>Gdy będziesz zakładać przedsiębiorstwa w późniejszych scenariuszach, lub w trybie wolnej gry, musisz zawsze dbać, by sprzedawać z zyskiem wyprodukowane towary. Produkcja towarów jest droga i nie zawsze łatwo znaleźć surowce.<n><n>Z tego powodu, staraj się najpierw rozbudować swoje rezerwy finansowe przez handel, a potem stopniowo zacznij produkować towary. "
