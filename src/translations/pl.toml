"0x1910fc69" = "Klawisz zmieniony."
"0x19251021" = "Czy naprawdę chcesz zlikwidować to całe duże przedsiębiorstwo?"
"0x1936271b" = "Czy chcesz kupić list kaperski za %1 i ścigać statki naszych wrogów w imieniu Anglii?"
