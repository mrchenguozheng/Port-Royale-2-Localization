"0x2842ae4a" = "List kaperski"
"0x2875b307" = "%1 %2 zniszczył konwój, którym dowodził pirat %3."
"0x28812f6e" = "Słyszałem, że chcesz sprawdzić się jako dowódca podczas bitwy morskiej. Cóż, mam dla ciebie zadanie, na którym skorzystamy obaj.<n>Pewne dwa porzucone statki dryfują bez celu. Chcę, żebyś usunął te statki, zanim staną się zagrożeniem dla moich kupców.<n>Czy przyjmujesz tę misję?"
"0x28812f6f" = "A teraz coś trudniejszego. Przypadkiem dowiedziałem się, gdzie w tej chwili żegluje konwój piracki, którym dowodzi @P$PirateName$. Konwój składa się tylko z jednego statku, więc nie powinieneś mieć zbytnich trudności z jego zniszczeniem.<n>Czy przyjmujesz tę misję?"
"0x28812f70" = "Zniszczyłeś już konwój piracki, którego właścicielem był @P$PirateName$. Jednakże, w kryjówce pirackiej jest zwykle kilka konwojów. Wszystkimi dowodzi @P$PirateName$. Wyeliminujesz dowódcę bandy piratów tylko znajdując i niszcząc ich kryjówkę.<n>Pojawił się właśnie kolejny konwój, którym dowodzi @P$PirateName$. Ten konwój składa się z dwóch statków, a zatem musisz być przygotowany, zanim włączysz się do walki.<n>Jesteś gotowy?"
"0x2883fdae" = "Możesz zaatakować konwojem tę kryjówkę piratów od strony morza. Najpierw musisz pokonać wszystkie statki w porcie. "
"0x289d1ced" = "dzienna konsumpcja"
"0x28b1f98d" = "%1 %2 Masz także zezwolenie na wznoszenie budynków i zakładanie przedsiębiorstw w mieście %3 oraz masz już magazyn w mieście.<n><n>Ponieważ jesteś młody i niedoświadczony, osiągnąłeś tylko rangę majtka. A zatem nie możesz jeszcze dowodzić następnymi konwojami ani kupować dodatkowych zezwoleń na budowę w innym mieście.<n><n>Twoja ranga zależy od sumy twoich aktywów, na które składają się gotówka i majątek materialny. W tej chwili aktywa wynoszą około %4. Otrzymasz następną rangę, gdy twoje aktywa osiągną %5.<n><n><n>Powodzenia!"
"0x28c94158" = "Statki"
"0x28cc4ee4" = "Konwój nie może postawić żagli, ponieważ na pokładzie jest zbyt wiele towarów. Sprzedaj część towarów, albo przenieś je do swojego magazynu, aby nie przekroczyć maksymalnej pojemności załadunkowej konwoju."
"0x28ef24c0" = "słaby"
"0x28ef24c1" = "normalny"
