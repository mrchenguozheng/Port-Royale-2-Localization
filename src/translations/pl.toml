"0x080f2b29" = "<ts:20>Musisz dowiedzieć się kilku rzeczy o towarach:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Jest pięć różnych rodzajów towarów: towary podstawowe, surowce, produkty finalne, towary kolonialne i towary importowane<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Każde miasto może produkować pięć różnych towarów<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Są dwa rodzaje miast: miasta kolonialne i miasta z gubernatorem lub wicekrólem<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Miasta gubernatorskie produkują towary podstawowe i produkty finalne. Poza tym, otrzymują regularne dostawy dóbr importowanych z Europy. Te miasta to zatem najlepsze miejsca, gdzie możesz znaleźć towary finalne oraz importowane.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Miasta gubernatorskie potrzebują surowców do wytwarzania produktów finalnych. Ponadto przyjmują towary kolonialne. Są one zabierane przez konwoje transportowe z Europy.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Miasta kolonialne produkują towary podstawowe, surowce i towary kolonialne. Każdy z towarów kolonialnych może być produkowany tylko na określonych obszarach Karaibów. Kawa, na przykład, jest dostępna tylko na południu i na zachodzie Karaibów.<n><n>Musisz dowiedzieć się następujących faktów dotyczących cen:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Im większy popyt na towar i im mniejszy jego zapas w mieście, tym wyższa będzie cena.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Im lepsza jest twoja reputacja w danym narodzie, tym niższa będzie cena, za którą będziesz mógł kupować towary w miastach należących do tego narodu.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Staraj się kupować towary tylko w miastach, w których są one produkowane.<n><n>Oto najszybszy sposób zdobycia pieniędzy:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>kupuj towary kolonialne i surowce w miastach kolonialnych<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>sprzedawaj te dobra w miastach gubernatorskich i kupuj tam towary finalne oraz towary importowane."
