"0x0f4c7b2b" = "Bilans"
"0x0f52782d" = "Gratulacje! Teraz możesz produkować w Cartagenie sukno z bawełny.<n><n>Jak można się spodziewać, koszt produkcji sukna zależy w dużym stopniu od ceny, którą płacisz za bawełnę. Z tego powodu, staraj się produkować towary finalne tylko wtedy, gdy jesteś pewien, że zdołasz nabywać surowce za rozsądną cenę. Możesz także samodzielnie produkować surowce.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zbuduj przedsiębiorstwo produkcji bawełny w mieście Santa Marta i zwiększ swoją gotówkę do @g$GoldGoal$."
"0x0f5d7735" = "Daleko na wschód od Charleston leżą Wyspy Bermudy. Trzymaj się od nich z daleka! Dwa miesiące temu, mój szwagier pożeglował tam, żeby je zbadać, ale już nie wrócił. Nikt nie wie, co tam się dzieje, ale jedno jest pewne: straszny los czeka wszystkich, którzy ośmielą się żeglować zbyt blisko tych wysp!"
"0x0f5d7736" = "Czy słyszałeś najnowsze wieści o Wyspach Bermudach? Pewien kupiec chciał wykorzystać szlak prowadzący przez wyspy, żeby pożeglować do Europy, ale nigdy nie dotarł do celu. Jego brat wyruszył za nim na poszukiwanie, ale nie znalazł niczego poza kilkoma szczątkami wraku na południe od wysp."
"0x0f5d7737" = "Całkiem niedawno żeglarz z Port Royale powiedział mi, że ostatnio żeglowali bardzo blisko Wysp Bermudów. Najwyraźniej żeglowali zbyt blisko, bowiem ten żeglarz na własne oczy zobaczył wielkiego potwora ruszającego się w wodzie. Pluł ogniem, a z jego długich uszu buchał dym. Nieszczęście spadnie na tych, którzy ośmielą się zbliżyć do morskiego potwora!"
