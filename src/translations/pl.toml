"0x2ae68b1b" = "Z wielkim zadowoleniem usłyszałem, że pokazałeś Czarnobrodemu, gdzie jego miejsce. W nagrodę daję ci hiszpański galeon. Czeka na ciebie w porcie. <n><n>A skoro już przy tym jesteśmy, mogę dać ci także @g$Reward$."
"0x2ae68b1c" = "Jeszcze raz z satysfakcją usłyszałem o twoim ponownym zwycięstwie nad tym pogardy godnym Czarnobrodym. Muszę także przekazać specjalne wyrazy uszanowania od mojej żony. Pragnie podarować ci jej hiszpański galeon, włącznie z naszym kucharzem!<n><n>Oprócz tego, nagradzam się @g$Reward$."
"0x2b0bca45" = "Konwój ze szpiegiem na pokładzie wyruszył z miasta @T$HostileTown$ w kierunku Europy i opuści Karaiby na wschodzie. Przeszukaj szlak i sprowadź znalezione dokumenty do gubernatora miasta @T$TOWN$, zanim nadejdzie @D$EndDate$."
