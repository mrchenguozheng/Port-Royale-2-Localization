"0x2c3fd248" = "Kupiec w mieście %1 zlikwidował przedsiębiorstwo, ponieważ utrzymująca się niska cena produktu: %2 w mieście sprawiła, że produkcja przestała być opłacalna."
"0x2c4a7b42" = "Twoje zadanie polegało na założeniu pięciu różnych przedsiębiorstw w Tortudze i zwiększeniu liczby mieszkańców do 1500. Nie udało ci się wykonać tego zadania.<n><n>Zdobądź surowce potrzebne do wznoszenia budynków. Gdy budowa rozpocznie się, powinieneś zacząć pozyskiwać potrzebne rodziny osadników. Potrzebujesz 30 rodzin osadników do każdego przedsiębiorstwa, co da ci 120 nowych mieszkańców."
