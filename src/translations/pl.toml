"0x2ee7d67a" = "Wicekról, którego mianowała %1"
"0x2ee8bb8c" = "Znajdujemy się w mieście gubernatorskim Cartagena na Południowych Karaibach.<n>Możesz wchodzić do różnych budynków w mieście i wykonywać różne akcje. Więcej o tym dowiesz się nieco później.<n>Najpierw, spójrz na górę ekranu. Widzisz tam rząd przycisków i okien.<n>Teraz kliknij na przycisku zegara na ekranie, pierwszym na lewo."
"0x2ee8bb8d" = "To jest Kronika. Kronika zawiera zapis wszystkiego, co dzieje się na Karaibach, zupełnie jak współczesna gazeta.<n>Na prawo od okna Kroniki widać kilka przycisków. Możesz za ich pomocą przeglądać informacje o Karaibach. W tej chwili jednak to nie jest ważne.<n>Teraz zamknij Kronikę klikając na przycisku oznaczonym symbolem „X”."
"0x2ee8bb8e" = "Na górze ekranu, obok daty, znajduje się przycisk Dziennika, a obok niego widnieje stan twojej gotówki.<n>Dziennik pokazuje aktualne informacje dotyczące twoich postępów i majątku. Oprócz tego, w tym miejscu zapisywane są wszystkie komunikaty i misje, które otrzymujesz.<n>Otwórz dziennik. "
"0x2ee8bb8f" = "Jak widzisz, dziennik natychmiast wyświetla wszystkie komunikaty, które otrzymałeś do tej pory. W tej chwili, dziennik wyświetla informacje dotyczące tylko tego scenariusza.<n>Po prawej stronie okna dziennika znajdują się następne przyciski. Kliknij na trzecim przycisku. "
"0x2ee8bb90" = "Spowoduje to wyświetlenie zadań i misji, jakie otrzymałeś. W tej chwili wyświetlony jest tylko cel scenariusza.<n>Używając dwóch przycisków na samej górze okna Misji, możesz przełączać między misją aktualną, a misjami ukończonymi.<n>Teraz zamknij dziennik. Możesz to także zrobić po prostu klikając prawym przyciskiem myszy."
"0x2ee8bb91" = "W dalszej części gry, możesz przyjmować liczne misje, które zapewnią ci sławę i fortunę.<n>Najpierw przyjrzyjmy się miastu. Jak widzisz w oknie pośrodku górnej części ekranu, znajdujemy się w mieście Cartagena. Miasto ma około 2000 mieszkańców.<n>Kliknij na przycisku z nazwą miasta."
"0x2ee8bb92" = "Spowoduje to otworzenie się okna, które pokazuje informacje o mieście.<n>Cartagena to miasto gubernatorskie należące do Hiszpanii. Możesz także zobaczyć status miasta i towary, jakie można tu produkować.<n>Teraz wejdź do budynku. Aby to zrobić, zamknij okno informacji."
"0x2ee8bb93" = "Możesz przesuwać podgląd miasta za pomocą klawiszy ze strzałkami na klawiaturze. Teraz spójrz na otoczone murami centrum miasta. Znajdują się tam różne budynki, takie jak doki, kościół i pałac gubernatora.<n>Kliknij raz na dowolnym z tych budynków."
"0x2ee8bb94" = "Gdy klikniesz na budynku, widok pośrodku dolnej części ekranu zmieni się. W zależności od rodzaju budynku otrzymasz odpowiednie informacje i będziesz mógł wykonać różne akcje.<n>Po prawej stronie podglądu budynku znajdują się przyciski. Aby opuścić budynek, kliknij na przycisku oznaczonym symbolem „X”."
"0x2ee8bb95" = "Budynki, w których możesz wykonywać różne akcje zawsze znajdują się w obrębie murów miejskich. Wyjątkiem jest twój magazyn. Więcej o tym w następnym scenariuszu.<n>Teraz wyjdź z budynku i użyj klawiszy ze strzałkami, aby wyświetlić port i konwój o nazwie „Santa Maria”. Kliknij na nim."
"0x2ee8bbfd" = "Jak widzisz, informacja o twoim konwoju pojawiła się pośrodku dolnej części ekranu.<n>Konwój jest już załadowany towarami: 10 beczkami pszenicy i 15 beczkami kukurydzy.<n>Po prawej stronie podglądu konwoju znajduje się kilka przycisków. Kliknij na drugim przycisku (z ikoną statku)."
"0x2ee8bbfe" = "Wyświetli się liczba statków w konwoju. Konwój może składać się z maksymalnie 10 statków dowodzonych przez kapitana.<n>Teraz wyślijmy konwój do innego miasta.<n>Kliknij na przycisku ze strzałką w prawej górnej części ekranu, aby opuścić miasto i wyświetlić mapę morską."
"0x2ee8bbff" = "Pojawi się mapa morska. Pośrodku ekranu zobaczysz miasto Cartagena.<n>Teraz możesz używać przycisków ze strzałkami, aby przesuwać wyświetloną mapę i oglądać cały świat gry.<n>Poszukaj miasta Port Royale na wyspie na północy, po czym kliknij prawym przyciskiem myszy na tym mieście, gdy wybrany jest twój konwój."
"0x2ee8bc00" = "Szlak zostanie nakreślony, a konwój wyruszy w drogę.<n>Klikając prawym przyciskiem na mieście Port Royale wybrałeś je jako cel swojego konwoju.<n>Jeśli podróż konwoju do miasta zabiera zbyt wiele czasu, możesz po prostu przewinąć czas gry naprzód naciskając spację (ustawienie domyślne). "
"0x2ef566b4" = "Klawiatura"
"0x2ef8f665" = "Witaj w mieście %1,<n><n>Pragnę przekazać ci kilka porad, dzięki którym szybciej znajdziesz właściwą drogę w regionie miasta %2, w ten sposób pomagając mojemu narodowi w rozwijaniu tego i innych miast.<n>Jestem pewien, że znane są ci już podstawowe informacje dotyczące miast gubernatorów: te miasta potrzebują stałych dostaw dóbr kolonialnych na eksport do Europy. Jednocześnie, te miasta oferują zwykle różne towary luksusowe, które można sprzedawać z sowitym zyskiem w innych miastach.<n>Jeszcze jedno: może zainteresuje cię to, że gubernatorzy od czasu do czasu przydzielają różne misje. Nie możesz jednak przyjmować misji, dopóki nie osiągniesz rangi majtka.<n><n>%3 %4, gubernator z: %5"
"0x2efebfdd" = "Skoro twój konwój dotarł do Port Royale, możesz wejść do miasta. Wystarczy kliknąć na symbolu miasta (z małymi domami)."
"0x2efebfde" = "Ponownie zobaczysz znany już podgląd miasta, ale tym razem to jest Port Royale. Możesz przenosić się do dowolnego miasta, w którym masz swoje konwoje lub budynki.<n>Poszukaj stoczni w porcie i kliknij na niej, ponieważ chcemy kupić nowy statek."
"0x2efebfdf" = "W oknie wyboru pojawi się widok stoczni, w której zostanie pokazany twój konwój.<n>Rozejrzyj się po stoczni używając przycisków po prawej stronie podglądu stoczni.<n>Następnie, wróć do ekranu „Kup statek” i obejrzyj dostępne statki.<n>Kup dowolnie wybrany statek."
"0x2efebfe0" = "Gratulacje! Kupiłeś swój pierwszy statek.<n>Statek zostanie przeniesiony do portu miejskiego.<n>Teraz opuść stocznię i kliknij na wodach portu. W oknie wyboru pojawi się widok pojedynczych statków znajdujących się w porcie.<n>Kliknij na swoim nowym statku."
"0x2efebfe1" = "Spowoduje to wyświetlenie danych statku, które widziałeś już w stoczni.<n>Zanim można będzie cokolwiek zrobić z pojedynczym statkiem, trzeba go włączyć do konwoju.<n>W tym celu ponownie wybierz swój konwój."
"0x2efebfe2" = "Teraz spróbuj przeprowadzić ze swoim konwojem interakcję z portem.<n>Kliknij prawym przyciskiem myszy na porcie.  "
"0x2efebfe3" = "Otworzy się okno transferu, w którym możesz dodawać pojedyncze statki do konwoju.<n>Aby to zrobić, kliknij na pojedynczym statku po lewej stronie i przeciągnij go do konwoju, by konwój składał się z dwóch statków.<n>Następnie, ponownie zamknij okno transferu za pomocą przycisku „X” po prawej stronie."
"0x2efebfe4" = "Możesz także utworzyć kolejny konwój z nowym statkiem, wynajmując nowego kapitana w tawernie.<n>W tej chwili nie możesz jednak tego zrobić, ponieważ twoja ranga jest za niska.<n>Teraz wybierz listę statków konwoju. To drugi przycisk."
"0x2efebfe5" = "Teraz w porcie Port Royale masz konwój z dwoma statkami.<n>Możesz klikać na statkach z listy statków konwoju, aby przeglądać szczegółowe informacje o nich.<n>Teraz wyślij konwój z powrotem do swojego macierzystego miasta Cartagena. Aby to zrobić, przejdź na mapę morską klikając na przycisku ze strzałką, który znajduje się najdalej w prawym górnym rogu ekranu. "
"0x2efebfe6" = "Teraz znajdź miasto Cartagena na południu i wyślij tam swój konwój klikając prawym przyciskiem myszy na mieście.<n>Ten scenariusz skończy się, gdy konwój dotrze do miasta."
"0x2f0127e1" = "Ty i %1 spędziliście bardzo przyjemny dzień. Opowiedziałeś jej o swoich przygodach."
"0x2f0127e2" = "Ty i %1 spędziliście bardzo przyjemne popołudnie. Na pewien czas zapomniałeś o swoich sprawach handlowych."
"0x2f0127e3" = "Ty i %1 spędziliście razem wieczór i pragniesz, by wspólnie spędzane chwile nigdy się nie kończyły."
"0x2f08cdb5" = "Czekałem na ciebie, %1. Co masz dla mnie?"
"0x2f08cdb6" = "Jesteś wreszcie, %1. Czy masz wszystkie towary ze sobą?"
"0x2f08cdb7" = "%1! Witaj! Czy przywiozłeś coś dla mnie?"
"0x2f206efd" = "Koszt:"
"0x2f240c29" = "Konwój przybił niezauważony do portu."
"0x2f40c20b" = "Nie udało ci się na czas zakończyć głodu w Tortudze. Aby zakończyć głód, musisz zapewnić, że co najmniej trzy rodzaje żywności będą dostępne w mieście do codziennej konsumpcji. Jeśli dostępne będą wszystkie cztery rodzaje pożywienia, głód skończy się wcześniej."
"0x2f59cd0e" = "Szukaj swojej żony. Znalazłeś przydatną wskazówkę: @l$Pos$"
"0x2f8427eb" = "Pirat zabity"
"0x2f98061f" = "Klikaj na towarach, aby aktywować lub anulować sprzedaż."
"0x2f980620" = "Automatyczna sprzedaż przez magazyniera"
"0x2f980621" = "Utrzymuj<n>minimalny poziom zapasów przy<n>szlakach kupieckich."
"0x2f980622" = "Nie dopuść, by<n>szlaki kupieckie <n> przekroczyły maksymalny poziom zapasów."
"0x2f9de268" = "Znaleziono skarb"
"0x2fa8e2e4" = " Otrzymałeś @g$Gold$."
"0x2faa205c" = "Nad miastem szaleje potężna burza."
"0x2fcfff90" = "Wejdź, mój synu. Czy zechcesz pogrążyć się w modlitwie?"
"0x2fd4ef92" = "<f:fonts/Tiepolo_black14x14aaFHk.res>"
"0x2fec4614" = "Flota"
"0x30132d5c" = "Dostępne towary"
"0x302a8f02" = "Kwiecień"
"0x302c1f05" = "Miasto startowe"
"0x302d13be" = "Mój kraj jest gotów zapłacić ci %1 za uwolnienie człowieka imieniem %2."
"0x30383766" = "Pokonałeś swojego przeciwnika i zatopiłeś statek."
"0x30383767" = "Zatopiłeś %1 statków konwoju twojego przeciwnika."
"0x305f2287" = "Mój naród ostatnio stracił ostatnie miasto gubernatorskie, które wpadło w ręce wrogów.<n><n>Jeśli te wrogie narody zostaną osłabione przez zatopienie ich konwojów wojskowych, będziemy mogli odbić kilka miast.<n><n>Aby uniknąć zatargów z pozostałymi narodami, wydam ci list kaperski przeciwko naszym wrogom."
"0x306d2bef" = "Atak piratów na miasto %1"
"0x309ae6f7" = "Projekt gry"
"0x30a14cb4" = "Za mało danych"
"0x30a45770" = "Witaj!"
"0x30a8b565" = "Autorzy gry"
"0x30bb44fc" = "Czy ty jesteś sławny @A$USER$? Może mógłbyś mi pomóc? Ściga mnie łowca nagród, którego nasłał jeden z moich wrogów. "
"0x30bb44fd" = "Proszę, przysiądź się do mnie, @A$USER$. Nazywam się @N$OwnerName$ i muszę porozmawiać z tobą o ważnej sprawie. Od czego zacząć? No cóż, pokłóciłem się z żoną; oskarżyła mnie o niewierność, co oczywiście jest kompletną nieprawdą. Tak czy inaczej, wyrzuciła mnie z domu, ale to jeszcze nie jest najgorsze: ona wynajęła łowcę nagród, przez co nie mogę nawet wejść do miasta. Czy pomożesz mi?"
"0x30bb44fe" = "Wyglądasz na kogoś, kto potrafi kierować statkiem.<n>Muszę pilnie odbyć podróż do miasta @T$Town$, aby dostarczyć dokumenty, które obciążają jednego z tamtejszych kupców. Niestety, kupiec dowiedział się o tym i teraz usiłuje położyć swoje łapy na tych papierach. Czy mógłbyś w jakiś sposób odstawić mnie do miasta @T$Town$?"
"0x30ee69e7" = "Statystyka towarów"
"0x30f0fea9" = "Szukaj w okolicach miasta @T$TOWN$ wskazówek, które zdradzą lokalizację opilców. Zwróć statek kupcowi imieniem @N$OwnerName$, zanim nadejdzie @D$EndDate$."
"0x31054c65" = "scenario000 - @I$Idx$"
"0x31074c51" = "Czy słyszałeś, że w mieście @T$Town$ wybuchła zaraza? Z pewnością można by było tego uniknąć, gdyby w mieście był szpital. Niestety, mój mistrz budowlany jest tchórzem i bał się wejść do miasta, żeby wznieść szpital. Wobec tego proponuję wysłać tam ciebie. Czy przyjmujesz misję? Jestem gotów zapłacić @g$Reward$ za twój trud!"
"0x3117ec2d" = "Transfer broni"
"0x31713947" = "Insert"
"0x317d5747" = "Nie możesz dokonać transferu z konwojem, który jest naprawiany."
"0x3187e7f0" = "Wyniki ostatniej podróży"
"0x318fbf80" = "Trwa głód."
"0x31969b21" = "Aktywa"
"0x31971224" = "Dzisiaj, twój konwój został zaatakowany przez angielski konwój wojskowy. "
"0x31971225" = "Dzisiaj, twój konwój został zaatakowany przez francuski konwój wojskowy. "
