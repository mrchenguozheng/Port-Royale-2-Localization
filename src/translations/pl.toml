"0x1e7c11f3" = "Dziękuję ci! Rozbudowa fortyfikacji portu zacznie się, gdy w mieście znajdzie się dość drewna i cegieł. "
"0x1e82c002" = "Menadżer lokalizacji"
"0x1e8a5b01" = "Strajk pracowników"
"0x1e8d41a5" = "Otrzymujesz rabat w wysokości <o:0xFFF2FAAD>5%<o> na wszystkie towary, jeśli będziesz handlować samodzielnie."
"0x1e90f9b3" = "-"
"0x1e932a31" = "Datek"
"0x1ed0d7c5" = "Szlak kupiecki"
"0x1ed10078" = "Muzyka"
"0x1ed43f2a" = "Tekst"
"0x1eec583a" = "Ok"
