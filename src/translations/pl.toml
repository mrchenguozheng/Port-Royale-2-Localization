"0xc88c67fb" = "Odkryto kopalnię złota w pobliżu miasta %1. W rezultacie poprawiła się jakość życia jego mieszkańców, a spożycie dóbr luksusowych będzie dwukrotnie wyższe przez cały miesiąc."
