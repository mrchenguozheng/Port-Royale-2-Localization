"0x13cd046e" = "Gdy przejmujesz wrogie miasta dla wicekróla, otrzymasz w nagrodę ziemię. Na tej ziemi możesz zbudować własne miasto, które będzie należało do ciebie i w którym możesz stawiać różne budynki. Innymi słowy, każdy wicekról może pomóc ci stać się właścicielem twojego własnego miasta. <n><n>Twój następny cel polega na poprawieniu reputacji z Hiszpanią, ponieważ wicekról przyjmie cię tylko wtedy, gdy masz dobrą reputację w jego narodzie.<n><n>Możesz sprawdzić swoją reputację w narodzie na przykład pod nazwą miasta, na jego podglądzie. W mieście Margarita, gdzie rozpoczynasz grę, pokazane są trzy flagi wskazujące, że twoja reputacja w Hiszpanii jest „neutralna”.<n><n>Możesz poprawiać swoją reputację w narodzie wykonując misje od jego gubernatorów, ścigając piratów lub handlując z jego miastami i dostarczając im towary, których potrzebują.<n><n>Ponieważ Hiszpania i Francja prowadzą ze sobą wojnę, możesz otrzymać list kaperski przeciwko Francji od gubernatora w mieście Margarita. Mając listy kaperskie możesz szybko poprawić swoją reputację.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Popraw swoją reputację z Hiszpanią do „przyjaznej”."
"0x13d92dd7" = "%1 (%2)"
