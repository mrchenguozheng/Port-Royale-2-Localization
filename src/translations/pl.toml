"0xfaf356b7" = "%1-%2-%3"
"0xfaf87ec1" = "Doki"
"0xfaf8f3b3" = "Miejscowy kupiec jest gotów sprzedać ci swoje przedsiębiorstwo i wszystkie pola uprawne za %1."
"0xfafd13c9" = "Szczegóły WŁ."
"0xfb08e668" = "Pojedynek przegrany"
"0xfb0d31c7" = "Budynki mieszkalne"
"0xfb203dad" = "Położenie wraku"
"0xfb343dde" = "Gdy byłeś zajęty plądrowaniem miasta, podbiegła do ciebie młoda kobieta.<n>„Wiem, że ten atak został przeprowadzony z rozkazu mojego ojca! Czy powiedział ci, że jestem tu z własnej woli i naprawdę kocham swojego porywacza? Błagam, nie zabieraj mnie z powrotem, a nagrodzę cię”.<n><n>Czy chcesz zostawić córkę jej własnemu losowi w mieście @T$TargetTown$?"
"0xfb343ddf" = "Córka gubernatora dziękuje ci i daje mapę pokazującą położenie kryjówki, która zawiera @a$Amount$ dóbr."
"0xfb3648b2" = "Szlak kupiecki aktywny"
"0xfb399b9a" = "Miejscowy kupiec jest gotów sprzedać ci swój obszar mieszkalny za %1."
"0xfb3ffb48" = "Chciałbym jeszcze raz podziękować ci za twoją hojność i przekazanie jednego z twoich konwojów. Konwój jest obecnie uzbrajany i będzie gotowy do żeglugi w ciągu %1 dni.<n><n>Jeśli chcesz przekazać następny konwój, musisz poczekać do tego czasu."
"0xfb425369" = "Wsparcie projektowania"
"0xfb4be839" = "Doskonale! Zniszczyłeś wszystkie pirackie konwoje, tak że żaden z piratów nie może uciec. Jeśli zniszczysz wszystkie konwoje bandy piratów przed zaatakowaniem ich kryjówki, minie więcej czasu, zanim na Karaibach pojawi się nowy konwój piracki.<n><n>Teraz zaatakuj kryjówkę w ten sam sposób, w jaki zaatakowałbyś miasto, wybierając swój konwój, a potem klikając prawym przyciskiem myszy na kryjówce piratów. Jeśli w porcie są zakotwiczone jakieś statki pirackie, musisz je zaatakować, zanim zwyciężysz w bitwie portowej.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zniszczyć kryjówkę Czarnobrodego."
"0xfb514e13" = "Nowe miasto"
"0xfb5c8a98" = "Blokada w mieście @T$TOWN$"
"0xfb64ad02" = "Wygrałeś "
"0xfbb36ec1" = "Ponownie muszę ci podziękować za uczynienie tak wiele dla mojego narodu. Nagrodzę cię dodatkową ziemią w twoim mieście %1. Będziesz wówczas posiadał %2% dzielnicy."
"0xfbb97bb9" = "Odbierz nagrodę od gubernatora."
"0xfbbba36d" = "Mogę cię jeszcze tylko ostrzec: uważaj na konwoje wojskowe z mojego narodu, które polują na ciebie!"
"0xfbbf60a0" = "3 maszty"
