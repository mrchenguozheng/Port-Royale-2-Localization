"0x12bf2170" = "Nie mamy o czym ze sobą rozmawiać.<n>Popraw swoją reputację w moim kraju, jeśli chcesz prowadzić ze mną dalsze interesy."
"0x12c4aed2" = "Wyświadczasz mi wielką przysługę. Wszystko się zgadza, zapłaciłeś mi @g$PriceBuy$. Spotkajmy się na rynku, gdzie przekażę ci @a$Amount$ towaru: @G$Goods$. Potem, zabierz towar do miasta @T$Town$, zanim nadejdzie @D$EndDate$ i oddaj go kupcowi imieniem @N$DestName$."
"0x12e312db" = "Jeszcze raz borykamy się z niedoborem towarów importowanych, które @n$Nation$ dostarczała na pokładzie swoich konwojów transportowych. Czy mógłbyś pomóc w tej sprawie moim przyjaciołom?"
"0x12e312dd" = "Wojna, jaką prowadzi z nami @n$HostileNation$, wywołała niedobór towarów importowanych do kolonii, których właścicielem jest @n$Nation$. Ponieważ wydaje się, że @n$HostileNation$ nie cierpi na brak tych towarów, moglibyśmy atakować ich konwoje transportowe i w ten sposób zdobyć brakujące dobra. Ty możesz podjąć się tego zadania. "
