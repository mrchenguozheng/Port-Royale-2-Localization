"0x0769a667" = "Yanco"
"0x077030da" = "Gratulacje! Udało ci się pomyślnie ukończyć ten scenariusz i teraz masz pewne doświadczenie w prowadzeniu bitew morskich i ataków na porty.<n><n>Zawsze sprawdzaj, czy twoje statki eskorty są dobrze uzbrojone, zanim zaatakujesz inny konwój. Oczywiście, powinieneś także pomyśleć bardzo uważnie przed wybraniem, jaki konwój chcesz zaatakować. Konwoje transportowe z Europy i konwoje wojskowe są zawsze bardzo silne, a piraci także potrafią czasami być bardzo trudnymi przeciwnikami.<n><n>Jeśli atakujesz kupców nie mając listu kaperskiego od gubernatora danego narodu, będzie to miało poważny wpływ na twoją reputację we wszystkich narodach. W najgorszym razie, w pościg za twoim konwojem ruszą potężne konwoje wojskowe.<n><n>Rada: Jeśli przechwycisz konwój kupiecki bez zatapiania jego statków i tylko go złupisz, negatywny wpływ na twoją reputację będzie znacznie mniejszy. "
