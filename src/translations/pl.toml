"0x00225853" = "Nowa burza z południowego zachodu zbliża się do Karaibów. Produkcja farm uprawnych jest zmniejszona o połowę we wszystkich miastach, do których dotarła burza."
"0x0027e860" = "Przedsiębiorstwa"
