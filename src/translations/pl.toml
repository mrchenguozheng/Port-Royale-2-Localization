"0xc73939cd" = "Dobrze. Statek wyruszył na szlak między miastem @T$TOWN$ a miastem @T$Town$. Proszę, pospiesz się! Szansa znalezienia jakichś rozbitków, po tym jak nadejdzie @D$EndDate$, będzie bardzo mała.<n>Przy okazji, w tej chwili w mieście @T$SampleTown$ brakuje robotników. Mógłbyś po prostu wysadzić tam na brzeg ocalałych."
"0xc73939ce" = "To bardzo nam pomoże. Przeszukaj szlak pomiędzy miastami @T$TOWN$ a @T$Town$. Musisz zakończyć swoje poszukiwania, zanim nadejdzie @D$EndDate$.<n>Jeśli znajdziesz jakichś ocalałych, możesz wypuścić ich na brzeg w mieście @T$SampleTown$."
"0xc73939cf" = "Dziękuję ci! Osadnicy zdążali do miasta @T$TOWN$ i zamierzali dotrzeć do miasta @T$Town$. Przeszukaj obszar między tymi miastami, zanim nadejdzie @D$EndDate$. Statki mogły utonąć, a jacyś ludzie przeżyć."
