"0xd4b8ac62" = "Przysiądź się do mnie, @s$USER$."
"0xd4b8ac63" = "Jak leci, @s$USER$? "
"0xd4b8ac64" = "Witaj, @N$PlayerName$. Może tu podejdziesz? "
"0xd4b8ac65" = "Witaj, @s$USER$. Mam pewne nowiny dla ciebie. "
"0xd4b8ac66" = "Pozdrawiam cię! Właśnie spisuję nowy esej historyczny. "
"0xd4cd0f3d" = "Henry Avery to doskonały przykład pirata, któremu się powiodło. Przechwytywał najbogatsze statki tamtych czasów, udawało mu się unikać władz i żyć na tyle długo, by mógł cieszyć się zgromadzonym majątkiem.<n><n>Wczesne lata kariery Avery'go okrywa nimb tajemnicy. Wiadomo jednak, że w czerwcu 1694 roku był drugim oficerem korsarza imieniem Charles, który otrzymał od Hiszpanii pozwolenie na przechwytywanie statków należących do francuskiej kolonii Martynika w Indiach Zachodnich. Pewnego dnia wszczął bunt i przejął kontrolę nad statkiem, po czym większość załogi stanęła po jego stronie. Szybki statek z 46 działami doskonale nadawał się do roli statku pirackiego i został przemianowany na „Fancy” (Fantazja). W 1695 udało mu się dokonać największego z jego wyczynów: splądrować flotę indiańskich skarbów. W ramach sojuszu z innymi piratami Avery zaatakował ciężko uzbrojony konwój, który wiózł skarby Indian i udało mu się przechwycić dwa statki. Statki należały do samego Wielkiego Mogula i były wyładowane niewyobrażalnymi skarbami. <n><n>Po przekupieniu gubernatora Bahamów, aby ten zaoferował piratom protekcję, Avery zapłacił załodze, która potem rozproszyła się na cztery wiatry. Niektórzy z nich zostali złapani w Anglii, ale Avery pożeglował do Irlandii, gdzie zniknął bez śladu. Możemy tylko zakładać, że w ukryciu korzystał ze swojego bogactwa."
"0xd4cd0f3e" = "Jednym z najbardziej popularnych piratów wszystkich czasów był Edward Teach (zmarł 1718 r.), znany jako Czarnobrody. Jego znakiem rozpoznawczym, co sugeruje przydomek, była budząca trwogę, spleciona, czarna broda. Z załogą liczącą 300 ludzi pożeglował na głębokie morza na swoim statku, „Queen Anne’s Revenge” (Zemsta Królowej Anny), przerobionym holenderskim statku kupieckim. Nie bał się atakować nawet okrętów wojennych Marynarki Królewskiej.<n><n>W ciągu 18 miesięcy, urodzony w Bristolu Teach, siał zamęt i zniszczenie, głównie w północnej części Indii Zachodnich i wzdłuż wybrzeży Ameryki Północnej. Zawsze udawało mu się znaleźć schronienie na Bahamach i w zubożałej Północnej Karolinie.<n><n>Kolejnym powodem, który sprawił, że Czarnobrody stał się tak sławny, był fakt, że odpowiadał on stereotypowi przerażającego, gorącokrwistego i obdarzonego temperamentem pirata: podobno okaleczył swojego działonowego Izraela Handsa postrzeliwszy go dwukrotnie tylko po to, żeby przypomnieć reszcie załogi, kto tu dowodzi.<n><n>Jego ostatnia godzina nadeszła w roku 1718, gdy łowca piratów Robert Maynard wyśledził jego slupa. Mimo, że był pijany jak bela, Teach walczył niczym demon i uległ dopiero po zażartych zmaganiach. Został zabity w bitwie, a większość ocalałych członków jego załogi została powieszona."
"0xd4cd0f3f" = "Ludzie, którzy chcieli powiększyć swoje majątki we wczesnych latach Ery Odkryć przekonali się, że plantacje cukrowe zakładane od początku XVI stulecia, głównie na Karaibach, stanowią doskonałą okazję do zainwestowania pieniędzy.<n><n>Te inwestycje zwracały się średnio z zyskiem w wysokości dziesięciu procent, a w najlepszych przypadkach (tak jak na Barbados około roku 1650) nawet 50 procent! Naturalnie, te plantacje wymagały wielkich ilości robotników, dlatego z Afryki transportowano setki tysięcy niewolników. Działo się tak dlatego, że w tym czasie Europejczycy w wielu miejscach niemal kompletnie wybił populację rdzennych Amerykanów. <n><n>Sami Europejczycy nie mogli znieść miejscowego klimatu, a poza tym, uważali się za zbyt dumnych, by zajmować się tak mozolną pracą. Nawet właściciele plantacji woleli mieszkać w Londynie lub Madrycie, organizację  pracy w koloniach pozostawiając swoim zarządcom. Do początku XVIII wieku udział czarnoskórej populacji na niektórych wyspach sięgał 90 procent!"
"0xd4cd0f40" = "Handel „czarnym złotem” rozpoczął się już w początkach XVI stulecia. Handlarze niewolników preferowali źródła „towaru” znajdujące się na wybrzeżu Afryki Zachodniej, które rozciągały się od rzeki Senegal do kraju, który dzisiaj jest znany jako Kamerun. Ten obszar był nie tylko idealnie położony z punktu widzenia transportu, ale posiadał także stabilną infrastrukturę ekonomiczną i socjalno-polityczną. Oznaczało to, że żeglarze nie musieli sami polować na niewolników, ale mogli kupować swoje ofiary od miejscowych wodzów lub od innych handlarzy niewolników.<n><n>Szczególnie poszukiwani byli młodzi mężczyźni w wieku od 15 do 35 lat, ponieważ przeznaczano ich do ciężkiej pracy na plantacjach. Przeciętnie, jeden na pięciu niewolników nie przeżywał podróży, która mogła trwać do sześciu tygodni. Niektórzy umierali na skutek barbarzyńskiego traktowania przez swoich panów, podczas gdy inni ginęli w katastrofach na morzu. Ze względu na tak wysoką śmiertelność, handlarze niewolników usiłowali czerpać jak największe korzyści z każdej podróży i upychali na swoich statkach możliwie dużo niewolników. Przez kolejne tygodnie ci nieszczęśnicy leżeli siebie ściśnięci jak sardynki w puszce, przykuci do siebie łańcuchami, w ciemności, gdzie ledwo starczało powietrza do oddychania.<n><n>W takich okolicznościach to niezwykłe, że ktokolwiek z nich przeżywał te podróże!  "
"0xd4cd0f41" = "Chociaż w Ameryce Północnej i Środkowej nie było białych niewolników, wielu Europejczyków pracowało tam w warunkach niewiele różniących się od tych, które były udziałem czarnych niewolników.<n><n>Wielu młodych ludzi (przeważnie z niewykształconych klas niższych) chciało emigrować, ale nie miało pieniędzy na podróż. Wobec tego pożyczali pieniądze na przewóz umawiając się, że spłacą swój dług pracując przez określony czas na plantacji cukrowej (albo w podobnym miejscu).<n><n>Jednak w tej pozornie logicznej umowie tkwił pewien haczyk: wielu plantatorów usiłowało maksymalnie wyzyskać pracę tych robotników, dopóki obowiązywała ich umowa. Dodatkowo, większość Europejczyków z trudem znosiła klimat Karaibów.<n><n>Ten system „pracy zakontraktowanej” był także często używany w odniesieniu do więźniów wygnanych ze swoich ojczystych krajów. Brytyjczycy wykorzystali tę metodę także później, szczególnie przeciwko Indianom, których zmuszali do pracy w koloniach afrykańskich."
"0xd4cd0f42" = "Gdy kolonie w Ameryce rozkwitały, to samo działo się z handlem poprzez Ocean Atlantycki. Wielka Brytania, największa potęga morska od czasów Królowej Elżbiety, była żywotnie zainteresowania kontrolą nad transportem towarów, co umożliwiało ciągnięcie zysków z wymiany handlowej i wspieranie własnej gospodarki.<n><n>Wydany przez lorda-protektora Olivera Cromwella „Pierwszy Akt Nawigacyjny” z 1651 roku stanowił, że do transportu towarów z kolonii do Europy można było wykorzystywać tylko statki angielskie. Dekret ten był wymierzony przede wszystkim przeciwko rosnącej w siłę Holandii i faworyzował rodzimą flotę handlową.<n><n>W 1663 roku postanowienia tego aktu stały się jeszcze bardziej surowe: statki kolonialne, które chciały przewozić towary do Europy, musiały zawijać do angielskich portów i płacić tam myto. Jednak próba objęcia kontrolą handlu między koloniami wkrótce okazała się daremna. Ponieważ nie można było spodziewać się, że armia brytyjska będzie pilnowała całego wybrzeża, w rezultacie rozkwitł handel kontrabandą. <n><n>Konflikt ten dotyczący warunków eksportu i importu towarów - szczególnie w koloniach Ameryki Północnej - rozbudził poczucie odrębności wśród tamtejszych osadników stając się motorem dążeń niepodległościowych."
"0xd4cd0f43" = "Początek ery kolonialnej sprowadził ze sobą liczne problemy zdrowotne, do tej pory niespotykane podczas znacznie krótszych podróży po Morzu Śródziemnym lub wzdłuż wybrzeża. Podróż do kolonii na Karaibach lub w Ameryce Północnej trwała od jednego do dwóch miesięcy, albo i dłużej, jeśli statek natrafiał na burze lub okresy bezwietrzne. Nic dziwnego zatem, że załogi musiały borykać się z różnymi trudnościami: smrodem brudnych ubrań i niemytych ciał, zepsutą i gnijącą żywnością, brakiem czystej wody, szczurami na pokładzie, a także psychologicznym napięciem powodowanym przez monotonię i zamknięcie w ograniczonej przestrzeni kabin. Nad każdym żeglarzem krążyło przerażające widmo szkorbutu: ta choroba, wywoływana przez niedobór witamin, objawiała się wypadaniem włosów i zębów. Szkorbut odebrał życie wielu żeglarzom. Dopiero podróżnik wokół świata, James Cook (1728-1779), po raz pierwszy odkrył sposób zapobiegania tej chorobie. Nie tylko nalegał, by statek był utrzymywany w czystości, ale także zabierał dla swojej załogi zapas kiszonej kapusty i świeżych owoców. Każdemu kto schodził na ląd, groziły także tropikalne choroby, takie jak czarna gorączka, najbardziej niebezpieczna forma malarii: ta choroba, której symptomami są między innymi przyspieszony puls, gorączka, dreszcze i oddawanie ciemnego moczu, jest prawie zawsze śmiertelna."
"0xd4cd0f44" = "Istnieją ciekawe anegdoty dotyczące wielu nazw, jakimi żeglarze i kartografowie obdarzali nowe połacie ziemi, rzeki i osady. Nawet pierwsza nazwa nadana przez europejskich podróżników w Erze Odkryć w Ameryce ma swoją historię. Krzysztof Kolumb nazwał wyspę, na której wylądował 12 października 1492 roku, Salvador („Zbawca”). W ten sposób chciał podziękować Bogu za ocalenie konwoju przed zarazą i sztormami podczas ich podróży, a przede wszystkim, za zapobieżenie wybuchowi buntu, gdy dosłownie w ostatniej chwili zauważono ląd.<n><n>Później, hiszpańscy Konkwistadorzy wybierali najczęściej nazwy o znaczeniu religijnym, na przykład „Nombre de Dios” („Imię Boże”) lub „Trinidad” („Trójca”). W innych przypadkach, inspiracją stawała się bieżąca data lub obserwacja otoczenia. Na przykład, portugalscy żeglarze nazwali zatokę, którą odkryli na brazylijskim wybrzeżu w Dzień Nowego Roku 1502, mianem „Rzeki styczniowej” (Rio de Janeiro), a nazwa miasta Montevideo pochodzi podobno do okrzyku, jaki wzniósł Magellan ujrzawszy po raz pierwszy wybrzeże: „Monte vido eu!” („Widzę górę!”).<n><n>Ponadto, popularnym zwyczajem wśród odkrywców było nazywanie krain i miast na cześć władców podróżników, ich ojczyzny lub miasta, z którego pochodzili. W ten sposób nie tylko obwieszczali całemu światu, kto tu rządzi, ale także tworzyło to pewnego rodzaju związek z ojczystym państwem odkrywcy, mimo dzielących te ziemie odległości.<n><n>W ostateczności, zawsze można było zapożyczyć nazwy z języka tubylczych Indian (chociaż w większości przypadków to nie powstrzymywało kolonizatorów przed konsekwentnym wypędzaniem lub wybijaniem samych tubylców).<n><n>Do dzisiejszego dnia przetrwała opowieść mówiąca o tym, jak James Cook zapytał australijskiego Aborygena o nazwę pewnego dziwnego torbacza. W odpowiedzi usłyszał „kangooroo”, albo „ganguru”, co podobno oznaczało „O czym ty mówisz?”. Nawet jeśli to tylko anegdota, tego rodzaju nieporozumienia z pewnością musiały mieć miejsce.<n><n>Zapewne wielu z was byłoby zaskoczonych dowiedziawszy się, jak wiele nazw miast, gór i rzek oznacza po prostu „dzień dobry!”, „przepraszam?”, albo „zostaw mnie w spokoju!”..."
"0xd4cd0f45" = "Wraz z pojawieniem się hiszpańskiego imperium, które rozciągało się niemal na cały świat, niezbędne stało się utworzenie rządów kolonialnych dysponujących wystarczającą władzą, by mogły zajmować się codziennymi sprawami administracyjnymi, a także wszelkimi sytuacjami kryzysowymi, jakie mogły wystąpić. W tym celu przyznawano tytuł wicekróla, który otrzymywali najważniejsi gubernatorzy w koloniach.<n><n>U szczytu światowego imperium, istniało dwóch takich dygnitarzy, w Nowej Hiszpanii (Meksyku) oraz w Peru. Wicekrólestwa Nowej Granady i Rio de la Plata zostały dodane w XVIII wieku. <n><n> Do obowiązków wicekróla, który wykonywał je razem (i często w sprzeczności z jej postanowieniami) z radą administracyjną znaną jako „Audiencia”, należały normalne zadania urzędnika rządowego: ustalanie i zbieranie podatków, utrzymywanie posłuszeństwa poddanych wobec prawa, organizowanie obrony kolonii i tak dalej. Był on także odpowiedzialny za ochronę populacji rdzennych Amerykanów oraz wyznaczanie pomniejszych dygnitarzy duchownych i świeckich.<n><n>Ze względu na wielkie znaczenie ekonomiczne i polityczne majątków zamorskich, Korona zawsze uważnie przyglądała się działalności swoich wicekrólów. Nie wolno im było zajmować się innymi przedsięwzięciami handlowymi, które mogły zapewniać im dodatkowy dochód. Niezależnie od tego, rywalizacja między wicekrólami prowadziła do wzajemnego ograniczania ich władzy."
"0xd4cd0f46" = "Jest znanym faktem, że europejskich zdobywców zawsze pociągał zew srebra i złota. Jednak niemal równie cenne były przyprawy. Trudno sobie wyobrazić jak monotonna musiała być dieta w średniowiecznej Europie. Nic dziwnego zatem, że ludzie byli gotowi zmierzyć się z największymi niebezpieczeństwami, byle tylko zdobyć odrobinę pieprzu lub gałki muszkatołowej.<n><n>Pod tym względem odkrycie Ameryki początkowo wydawało się niezwykle rozczarowujące. Ludzie z zainteresowaniem oglądali egzotyczne zwierzęta, jakie przywiózł ze sobą Krzysztof Kolumb, cieszyli się z rozszerzenia terytorium ich kraju i wyobrażali sobie jak wiele dusz można tam ocalić dzięki wprowadzeniu chrześcijaństwa. Jednak góry złota okazały się bardziej niedosiężne, niż to sobie wyobrażano. Podróże zaczęły przynosić zyski dopiero dziesięć do dwudziestu lat później, gdy do Europy zaczął docierać prawdziwy zalew amerykańskiego srebra.<n><n>Z jednej z tych wypraw, Kolumb sprowadził ze sobą skarb cenniejszy niż całe złoto i srebro na świecie: 4 grudnia 1492 roku tubylcy podarowali mu coś, co Kolumb opisał jako jabłko, które smakowało jak orzechy. W tamtej chwili stał się pierwszym Europejczykiem, który zjadł ziemniaka! Indianie nazywali tę roślinę „batate” i ta nazwa przetrwała we współczesnym języku angielskim w formie „potato”.<n><n>Wiele innych rzeczy, które dziś uważamy za powszechne, zostało sprowadzonych do Europy po raz pierwszy przez Kolumba i jego następców: tytoń, pomidory, kukurydza i hamak. W języku rdzennych Amerykanów ta rzecz nazywa się „hamaka” i stąd pochodzi używane przez nas słowo."
"0xd4cd0fae" = "Odkrycie Nowego Świata od początku rozpalało wyobraźnię mieszkańców Europy. Jakie stworzenia mogły żyć na tych niezbadanych ziemiach? Krążyły najbardziej niezwykłe opowieści: podobno na jednej z wysp roiło się od kanibali, na innej zaś mieszkały bezgłowe stworzenia, których twarze wyzierały prosto z ich brzuchów.<n><n>Nazwę południowoamerykańskiej krainy Patagonia można przetłumaczyć swobodnie jako „ziemia ludzi o wielkich stopach”, podczas gdy Amazonka zawdzięcza swoją nazwę plemieniu wojowniczych kobiet, które miały przypominać odkrywcom podobne wojowniczki z greckiej mitologii.<n><n>Chociaż niektóre z tych plotek miały podstawy w faktach, inne były oparte na nieporozumieniach i niewłaściwych interpretacjach, albo opowieściach, które wymyślili sami rdzenni Amerykanie.<n><n>Jednak wiele z tych pogłosek było wytworem żywej wyobraźni, a bardzo często ludzie wierzyli w nie tylko dlatego, że tego właśnie chcieli. To tłumaczy, dlaczego całe pokolenia konkwistadorów poszukiwały legendarnej Fontanny Młodości, Ogrodu Rajskiego oraz Eldorado, złotego miasta. Ich błędne przekonania podsycane były przez rdzennych Amerykanów, którzy stale zapewniali przybyszy, że słyszeli o jednym z takich miejsc. Indianie chcieli po prostu w ten sposób zyskać na czasie, by zwabić chciwych białych ludzi w głąb lądu i odciąć ich od statków."
"0xd4cd0faf" = "Jedną z najbardziej niezwykłych osób na liście odkrywców i zdobywców, na której znalazło się wiele innych barwnych postaci, był angielski pisarz i poszukiwacz przygód sir Walter Raleigh (ok. 1554 – 1618). Po raz pierwszy zrobiło się o nim głośno, gdy w 1580 roku stłumił powstanie Irlandczyków sprzeciwiających się angielskiej okupacji.<n><n>Stał się ulubieńcem królowej Elżbiety I i wykorzystał swoje wpływy do sfinansowania wyprawy, która miała znaleźć legendarne miasto Eldorado w Ameryce Południowej. Pomimo całkowitego niepowodzenia kilku wypraw, którym nie udało się znaleźć niczego wartościowego, za pomocą wyjątkowych umiejętności perswazji zdołał utrzymać wsparcie finansistów opłacających jego podróże. Dzięki niemu wierzyli, że ostateczna nagroda zawsze czeka tuż za następnym wzgórzem i nie mogą się poddać w takiej chwili.<n><n>Mimo wszystko, jego kredyt zaufania w końcu się wyczerpał. Zbyt często ludzie wysłuchiwali jego śmiałych obietnic, po czym okazywało się, że były to tylko czcze zapewnienia. Raleigh ostatecznie popadł w niełaskę u Elżbiety. Jej następca, Jakub I, uznał tego gorącokrwistego awanturnika za zagrożenie dla jego umiarkowanej polityki zagranicznej i kazał go aresztować z błahych powodów, po czym skazał na śmierć, gdy tylko osiągnął pełnię władzy. Wyrok został zamieniony (uwaga, nie został zniesiony!) na karę więzienia i Raleigh został wtrącony do Tower w Londynie.<n><n>Lata później, gdy stan finansów państwa przekonał go o takiej konieczności, król udzielił sir Walterowi Raleigh’owi pozwolenia na poprowadzenie kolejnej wyprawy do Gujany. To była absurdalna sytuacja: człowiek, który sam został skazany na śmierć, otrzymał władzę nad życiem i śmiercią innych ludzi, po czym wysłano go na poszukiwanie złota! Jednak ten paradoks rozwiązał się sam niedługo później, gdy Raleigh, w tym czasie już wyniszczony przez gorączkę, wrócił ze swojej ostatniej wyprawy, która zakończyła się porażką.<n><n>Po jego powrocie do Anglii, wściekły król postanowił, że zawieszony wyrok śmierci na Raleigh’a z 1603 roku powinien zostać wykonany. Egzekucja sir Waltera Raleigh’a odbyła się niedługo później.  "
"0xd4cd0fb0" = "Pierwsze spotkania między rdzennymi mieszkańcami Nowego Świata i białymi żeglarzami generalnie przebiegały pokojowo. W wielu miejscach Europejczycy byli witani jako bogowie. Czasami to przekonanie wynikało ze starych legend, ale w większości przypadków rdzenni Amerykanie byli po prostu zdumieni wysokimi, jasnowłosymi nieznajomi, którzy przybyli w błyszczących zbrojach na swoich „wodnych domach” (statkach).<n><n>Kolumb, Cortez i wszyscy pozostali odkrywcy nie zamierzali rozwiewać tego złudzenia, ale wkrótce rdzenni Amerykanie musieli zmierzyć się z brutalną rzeczywistością: Hiszpanie popychani przez swoją nienasyconą żądzę złota – rdzenni Amerykanie nazywali przybyszów „hiszpańską zarazą” – wyzyskiwali, niewolili i masakrowali całe populacje. Widok koni, do tej pory nieznanych w Ameryce oraz huk dział, wywoływały prawdziwą panikę, a ci którzy przeżywali masakry, wkrótce padali ofiarami ospy, grypy i innych zawleczonych przez przybyszów chorób.<n><n>Słynni intelektualiści, tacy jak Gonzolo Oviedo czy Juan de Sepulveda próbowali usprawiedliwiać zbrodnie dokonywane przez Europejczyków, wysuwając mrożące krew w żyłach rasistowskie argumenty, które przedstawiały rasę rdzennych Amerykanów jako ludzi prymitywnych, ignoranckich i gorszego rodzaju.<n><n>Ci sami ludzie, którzy palili uczonych i czarownice na stosach za ich przekonania, umiejętnie wydobywali szokujące dowody „zwierzęcych obyczajów” rdzennych Amerykanów: chociaż praktykowanie bałwochwalstwa, składania ofiar z ludzi i kanibalizmu istotnie nie było wymysłem, teraz zostało wykorzystane przez białego człowieka jako zasłona usprawiedliwiająca najbardziej brutalne traktowanie wszystkich rdzennych Amerykanów."
"0xd4cd0fb1" = "Jak powszechnie wiadomo, pierwsza faza kolonizacji Ameryki została podjęta przez Hiszpanię i Portugalię. Później dołączyła do nich Holandia, i co najważniejsze, Anglia i Francja. Nieco mniej wiadome jest, że liczne hiszpańskie ekspedycje nie doszłyby do skutku, gdyby nie wsparcie potężnych niemieckich finansistów.<n><n>Do roku 1500, Górna Szwabia, a szczególnie Augsburg, rozwinęła się w jeden z najważniejszych ośrodków handlu i finansów w Europie. Stąd kupieckie familie Fuggerów i Welserów rozciągały swoje znaczne wpływy na światową politykę. Na przykład, to dzięki ich intensywnemu wparciu finansowemu król hiszpański Karol mógł stać się Cesarzem Niemiec w 1519 roku. Król Anglii Henryk VIII i wielu papieży z zadowoleniem zaliczało Jakuba Fuggera „Majętnego” do swoich przyjaciół.<n><n>Naturalnie, ci przemyślni kupcy mieli swoje ukryte cele w udzielaniu tego rodzaju wsparcia. W zamian spodziewali się otrzymywać przywileje lub zezwolenia na udział w urobkach królewskich kopalni srebra. Welserom udało się nawet na pewien czas pozyskać część północnego wybrzeża Wenezueli, gdzie założyli miasta, takie jak „Nowy Augsburg” i skąd wysłali kilka wypraw (przeważnie bezowocnych) na poszukiwania skarbów w głębi lądu."
"0xd4cd0fb2" = "Po podbiciu połowy globu, przed Hiszpańską Koroną otworzyły się niepowtarzalne możliwości. W okresie kilku stuleci, aż do zagłady wielkich amerykańskich kultur Inków, Majów i Azteków oraz do odkrycia wielkich złóż srebra w Peru i Meksyku, pozycja Hiszpanii wydawała się nie do podważenia. Wydaje się absurdalne, że właśnie to olbrzymie bogactwo stało się przyczyną upadku tej światowej potęgi.<n><n>Znaczna część skarbów wysyłanych na statkach do Hiszpanii trafiała bezpośrednio do kufrów kupców mieszkających na północ od Pirenejów, którzy w największym stopniu finansowali podróże. Jednak reszta nadal wystarczała, by podnieść ceny na półwyspie iberyjskim. Tamtejsi ludzie zaczęli żyć ponad stan: w czasach, gdy utrzymywanie wielkiego dworu było uważane za coś ważniejszego od zachowania równowagi budżetu państwa, ludzie zwracali niewielką uwagę na trywialne kwestie finansowe.<n><n>Towary sprowadzano w coraz większych ilościach na pokładach obcych statków, ponieważ miejscowi uznawali się za zbyt wytwornych, by produkować je u siebie. Nawet wyposażenie i zapasy dla wypraw do Ameryki rzadko bywały dostarczane przez miejscowych kupców. Ludzie powiadali z dumą: cała Europa jest na rozkazy Hiszpanii.<n><n>Jednak napływ srebra musiał wreszcie ustać, a nagłe przebudzenie, jakie potem nastąpiło, przypominało kac po długiej, pijackiej nocy: Holendrzy i Brytyjczycy usiłowali zepchnąć Hiszpanię z dalekich mórz. Liczne wojny religijne przeciw protestanckim „heretykom” oraz przeciw Turkom pochłonęły ogromne sumy i wielkie imperium, w którym słońce nigdy nie zachodziło, zmieniło się w niestabilnego kolosa.<n><n> Kryzys stał się jasny dla wszystkich w roku 1557, gdy hiszpański władca Filip II został zmuszony po raz pierwszy ogłosić bankructwo państwa. Wielkie imperium, które zgromadziło skarby większe niż jakiekolwiek inne mocarstwo wcześniej, załamało się."
"0xd4cd0fb3" = "Dlaczego w Brazylii mówi się po portugalsku, gdy prawie wszędzie w pozostałej Ameryce Południowej używany jest hiszpański?<n><n>No cóż, zarówno Hiszpanie, jak Portugalczycy, którzy odkryli drogę morską do Indii wzdłuż wybrzeża Afryki, szybko zrozumieli, że ich przyszłość czeka na nich za oceanami. Oba narody zazdrośnie dbały o to, by podczas swoich poszukiwań dóbr, poddanych i ziem nie wkraczać na terytoria drugiego kraju.<n><n>Ponieważ w tamtych czasach nie istniało coś takiego jak prawo międzynarodowe, zwrócili się do papieża, jako do jedynej osoby, którego autorytet uznawały oba narody. Kościół katolicki, ze swojej strony, chciał zapewnić, by Hiszpanie i Portugalczycy gorliwie prowadzili chrystianizację „ciemnych ludzi” na nieznanych ziemiach, zamiast marnować swoją energię na uprzykrzanie życia sobie nawzajem.<n><n>Osiągnięto zatem porozumienie podczas połączonych negocjacji w Tordesillas (1494) i Saragossie (1529), które stanowiło, że nowo odkrywane terytoria na zachód od określonego południka będą należały do Hiszpanii, a wszystkie pozostałe do Portugalii. Ten południk podzielił teren odkrytej do tego czasu części Ameryki Południowej, tak że jej wschodnia część, włącznie z tym, co dzisiaj nazywamy Brazylią, przypadła Portugalii."
"0xd4cd0fb4" = "Prawdopodobnie to rzymski pisarz Polibiusz jako pierwszy użył określenia „pirat” (peirato) około 140 roku p.n.e. Od tego czasu stosowano wiele nazw w odniesieniu do tych przerażających morskich łotrów: korsarze, bukanierzy, kaprowie, flibustierzy... Ludzie, którzy otaczali Klausa Störtebekera znani byli jako „Bracia Witalijscy”, a Bartholomew Roberts nadał sobie i jego bandzie morderczych zbirów dość niewinny tytuł „Dżentelmenów Fortuny”. W ostateczności jednak, kupcowi nie robiło wielkiej różnicy, kto właśnie wychynął znienacka, żeby zaatakować jego statek. <n><n>Piraci byli plagą ludzkości od wieków, we wszystkich zakątkach świata. W czasach starożytnych, sycylijscy piraci siali taką trwogę na całym Morzu Śródziemnym, że Cesarstwo Rzymskie było zmuszane do przeprowadzania regularnych kampanii przeciwko nim. Skryte wyspy i postrzępiona linia brzegowa w pobliżu często uczęszczanych szlaków kupieckich zapewniały idealne warunki do działań piratów: obszary, na których rafy, prądy morskie i złe warunki pogodowe sprawiały, że ociężałe statki kupieckie stawały się łatwymi łupem, zapewniały także schronienie bandytom, którzy mogli szybko umknąć. Wybrzeże Azji Mniejszej cieszyło się w starożytnych czasach równie złą sławą jak Karaiby w Erze Odkryć, chociaż piraci Azji Południowo-Wschodniej byli uznawani za żywą legendę.<n><n>Zgodnie z pochodzeniem tego słowa, „pirat” był żeglarzem, który wyruszał na morze samodzielnie, a nie jako marynarz należący do armii, w poszukiwaniu łupów. Uznawano zatem, że taki człowiek zajmował się działalnością bandycką, czyli piracką. <n><n>Jednak wydawane listy kaperskie nadawały działaniom niektórym z karaibskich korsarzy pozory legalności. Te dokumenty były wydawane przez gubernatorów angielskich, francuskich lub holenderskich, a ich celem było skierowanie plagi piractwa przeciwko wrogim potęgom.<n><n> Łatwość, z jaką można było zdobyć list kaperski, zależała od danego rządu. Jeden gubernator mógł uznawać za niehonorowe wchodzenie w układy z piratami, inni byli znacznie bardziej pozbawieni skrupułów, albo po prostu skorumpowani lub tchórzliwi."
"0xd4cd0fb5" = "Mówi się o „siedmiu morzach” choć właściwie są trzy (ściśle mówiąc, trzy oceany): północny i południowy Pacyfik, północny i południowy Atlantyk, oceany Arktyczny i Antarktyczny oraz Ocean Indyjski.<n><n> Ocean Spokojny (Pacyfik) zawdzięcza swoją nazwę pierwszemu podróżnikowi wokół Ziemi, Fernando Magellanowi, któremu, szczęśliwym zrządzeniem losu, dopisywała pogoda podczas wielu gorączkowych tygodni, jakie zajęła mu podróż przez ten wielki ocean.<n><n>I jeszcze jedno: Karaiby wywodzą swoją nazwę od słowa „Karibe” (albo „Karaibe”), którym określała się grupa Indian osiadłych na obszarze ciągnącym się od Antyli wzdłuż północnego wybrzeża Ameryki Południowej."
"0xd4cd0fb6" = "Wyspy Bermudy zostały tak nazwane na cześć hiszpańskiego odkrywcy Juana Bermúdeza, który odkrył je w 1503 roku. Ten niesławny obszar znany wszystkim żeglarzom jako „Trójkąt Bermudzki”, na którym podobno wydarzyło się wiele tajemniczych wypadków morskich, pokrywa połać morza między Bermudami, Puerto Rico i Fortem Lauderdale (Floryda).<n><n>Niektórzy ludzie utrzymują, że seria niewyjaśnionych wydarzeń zaczęła się podczas podróży Krzysztofa Kolumba: żeglarz z Genui w służbie Hiszpanii, 14 września 1492 roku znajdował się wraz ze swoimi trzema statkami właśnie na tym obszarze, gdy nagle igła jego kompasu zaczęła gwałtownie wirować. Powodowała to różnica między północnym biegunem geograficznym, a północnym biegunem magnetycznym. Następnego dnia na niebie pojawiła się wielka smuga ognia (prawdopodobnie był to meteor).<n><n>Jednak nazwa „Trójkąt Bermudzki” pojawiła się dopiero po Drugiej Wojnie Światowej, w następstwie serii katastrof samolotowych, które przyciągnęły uwagę publiczną do tego obszaru w południowo-zachodniej części Atlantyku Północnego.<n><n>Znawcy tajemniczych wydarzeń wymieniają ponad 200 rzekomo niewytłumaczalnych wypadków, chociaż dość ogólnie wyznaczają granice tego obszaru. Większość z tych wydarzeń, z których duża liczba nawet nie wydarzyła się w tym rejonie, ma całkowicie logiczne wytłumaczenie."
"0xd4cd0fb7" = "Legendarna hiszpańska flota skarbów, która regularnie żeglowała z Ameryki do Hiszpanii, rozbudziła chciwość także ludzi poza Półwyspem Iberyjskim. Najpierw ambitna Anglia dostrzegła okazję do podważenia roli Hiszpanii jako władczyni mórz i królowej świata.<n><n>Ponieważ wyspiarskie królestwo było nadal o wiele zbyt słabe, by angażować się w kampanie wojskowe w pełnej skali, znacznie rozsądniejszym rozwiązaniem wydawało się związanie walką przeciwnika poza Europą, daleko, gdzie nie będzie spodziewał się ataku, ani nie dostanie żadnego ostrzeżenia. Tam można było z łatwością złupić ofiarę, a potem po prostu zniknąć i nikt w Europie przez całe miesiące nie dowiedział się nawet o tym wydarzeniu.<n><n>Dzielni kapitanowie, spośród których najsławniejszym był Francis Drake (1540-1596), otrzymali listy kaperskie od Jej Wysokości Elżbiety I. Te listy kaperskie były rodzajem licencji na plądrowanie i wyniosły Drake’a oraz jego towarzyszy ponad poziom zwykłych piratów. Dokumenty nadawały im status prywatnych baronów-rozbójników, w służbie władzy najwyższej. Doskonale to wykorzystali. Statki i garnizony iberyjskie nigdzie nie były bezpieczne.<n><n>W 1578 roku Francis Drake przekroczył Cieśninę Magellana i wyruszył jak tornado na połów hiszpańskich łupów wzdłuż pacyficznego wybrzeża Ameryki. Nikt wcześniej nie odważył się dokonać czegoś takiego! Po powrocie do portu Plymouth w 1580 roku, Drake stał się drugim po Magellanie kapitanem, który opłynął świat. <n><n>W międzyczasie, król Hiszpanii Filip kipiał ze złości i wymachiwał Traktatem z Tordesillas, w którym Jego Świątobliwość Papież wyraźnie stwierdzał, że od roku 1494 zachodnia półkula należy do hiszpańskiej strefy wpływów. Jaki jednak efekt mogły wywierać takie protesty na tym osobliwym wyspiarskim narodzie protestanckich heretyków, którzy całkowicie odrzucili autorytet Papieża Rzymu i którzy aż do roku 1753 odmawiali przyjęcia nowoczesnego kalendarza gregoriańskiego, tylko z tego powodu, że został opracowany na rozkaz papieża Grzegorza, w 1582 roku?<n><n>Jeszcze raz wydawało się, że tę sprawę może rozstrzygnąć tylko wojna. Armada Filipa wyruszyła do Anglii w 1588 roku, ale Anglikom pod komendą sir Francisa Drake’a, który został już mianowany szlachcicem oraz z pomocą kilku sprzyjających sztormów, udało się zniszczyć hiszpańską flotę. W ciągu następnych setek lat nikt nie ośmielił się podważyć pozycji Wielkiej Brytanii jako wiodącej potęgi morskiej."
"0xd4cd101f" = "Bez wątpienia, podróże Krzysztofa Kolumba (1451-1506) do Ameryki zaliczają się do największych przygód, jakie ludzkość kiedykolwiek podjęła. Nawet powieściopisarz z trudem wymyśliłby podobną historię pełną dramatycznych wydarzeń i dziwnych zbiegów okoliczności.<n><n>Chociaż nawigatorowi z Genui udało się przekonać hiszpańską królewską parę, Izabellę i Ferdynanda, do swojej idei, według której istniał zachodni szlak morski do Indii, z pewnością nie zdołał uzyskać pozwolenia na własnoręczny wybór swojej załogi. W istocie, większość załogi została siłą włączona do służby: w ramach kary za wykroczenia przeciwko Koronie, miasto Palos zostało zmuszone do wystawienia dwóch statków z załogami.<n><n>Wieści o planie Kolumba wywoływały trwogę. Załoga była święcie przekonana, że żeglują pod komendą szaleńca, który sprowadzi zagładę na siebie i na wszystkich, którzy z nim płyną.<n><n>Jednak największym wrogiem Kolumba były przesądy: wydawało się, że na pokładzie opowiedziano każdą możliwą do wyobrażenia straszną opowieść, a złowieszcze wydarzenia tylko podsycały obawy żeglarzy: gdy żeglowali w pobliżu Teneryfy, wybuchł wulkan, potem zobaczyli na niebie kolumny ognia, a nawet igła kompasu wydawała się płatać figle załodze. Gdy statek zatrzymywał się z powodu ciszy, uznawano to za zły znak. Z drugiej strony, gdy robili znaczne postępy, oznaczało to, że wiatr zawsze wiał ze wschodu na zachód i nigdy nie będą w stanie wrócić.<n><n>W wielu przypadkach bunt wydawał się nieunikniony. Pewnej nocy kapitan usłyszał kroki i szept pod swoją kabiną. Zaczął głośno modlić się i dopiero wtedy skrytobójcy stracili odwagę i oddalili się.<n><n>Najpoważniejsze kryzysy zawsze wybuchały, gdy coś, co wydawało się wyspą na horyzoncie, po raz kolejny okazywało się niczym więcej, jak złudzeniem optycznym. Tylko zbieg okoliczności doprowadził sprawę do końca 10 października. Kolumb z wielkim trudem wynegocjował ultimatum trzech dni, po których załoga chciała zawrócić (najlepiej bez swojego kapitana). Los zgotował im jednak coś innego: przed upływem tych trzech dni rzeczywiście dostrzegli ląd. Nikt z obecnych nie marzył nawet, że zamiast Azji natrafią na całkowicie nowy i nieznany kontynent.<n><n>Japonia i Chiny nadal leżały tysiące mil morskich dalej i gdyby nie niewiarygodne szczęście, że ten obcy kontynent znalazł się na ich drodze, wyprawa Kolumba byłaby stracona. Morale załogi natychmiast podniosło się. Wszyscy porzucili wszelkie myśli o buncie..."
"0xd4cd1020" = "Krzysztof Kolumb rzeczywiście odkrył nową ziemię (albo raczej: odkrył ją ponownie, ponieważ Wikingowie postawili już swoje stopy na amerykańskiej ziemi w wiekach średnich), ale omyłkowo ogłosił, że odkrył drogę morską do Indii.<n><n>Podczas przygotowań do drugiej i trzeciej ze swoich czterech podróży, żeglarz z Genui współpracował z Amerigo Vespuccim z Florencji. To on po raz pierwszy wysunął przypuszczenie, że ziemie na zachodzie należały w istocie do nowego i nieznanego kontynentu. To spektakularne stwierdzenie roznieciło publiczne zainteresowanie i za każdym razem, gdy toczyła się dyskusja o tych nowych terytoriach, nazwisko Vespucciego z pewnością było wymieniane.<n><n>Dla kontrastu, gwiazda Krzysztofa Kolumba gasła. W międzyczasie został nawet odesłany do domu w łańcuchach, po skardze karaibskich osadników, a jego śmierć jako zgorzkniałego i schorowanego człowieka w 1506 roku nie przyciągnęła uwagi, na jaką zasługiwał. Nic zatem dziwnego, że kartograf z południa Niemiec, Martin Waldseemüller uznał imię Amerigo Vespucciego za inspirację, gdy rok później zaproponował nazwę dla tych nieznanych ziem. <n><n>Propozycja nazwy wysunięta przez Waldseemüllera została przyjęta przez jego kolegów. Sprawiedliwiej byłoby, gdyby kontynent otrzymał nazwę „Kolumbia”."
"0xd4cd1021" = "Pierwszą częścią Ameryki, jaka nabrała wielkiego znaczenia pod rządami Hiszpanów, była Hispaniola. Krzysztof Kolumb założył tu pierwszą europejską osadę już w 1493 roku, chociaż została zniszczona przez rdzennych Amerykanów, jeszcze zanim zdążył wrócić z Europy.<n><n>W kolejnych latach Korona Hiszpańska umacniała swoją kontrolę nad tą wyspą. Wybudowano pierwszy klasztor i pierwszą katedrę. To właśnie tutaj po raz pierwszy stworzono system społeczny, który miał przenieść się na inne obszary: była to społeczność oparta na pracy niewolników, ściśle podzielona na klasy i mocno związana z Kościołem Katolickim.<n><n>Hispaniola wydawała się oferować wielkie możliwości i przyciągała wielu przedsiębiorczych osadników zza oceanu. <n><n>Jednak nie minęło dużo czasu, gdy Hiszpania zwróciła swoją uwagę na inne regiony: do tej pory odkryto i podbito ogromne krainy na kontynencie. Tam prościej było utrzymać rządy, a tamtejsze złoża złota i srebra były bogatsze i łatwiej było je wydobywać.<n><n>Ludzie stracili zainteresowanie Hispaniolą, jak porzuconą zabawką. Holenderscy, angielscy i francuscy piraci na zmianę przeprowadzali kolejne ataki na wyspę. W 1697 roku, Francuzi przejęli kontrolę nad Saint Domingue, zachodnią częścią wyspy (dzisiejsze Haiti) i stworzyli gospodarkę opartą o przynoszące zyski plantacje. Produkcja kakao, cukru, indygo, bawełny i kawy uczyniła z Saint Domingue najlepiej prosperującą kolonię na Nowym Świecie w XVIII wieku.<n><n>Jedyna zakończona powodzeniem rewolta niewolników w historii, która wybuchła na skutek Rewolucji Francuskiej, doprowadziła do osiągnięcia przez Haiti niepodległości w roku 1804. Rebelianci potraktowali swoich dawnych gnębicieli w ten sam sposób, w jaki sami byli traktowani: „Do spisania deklaracji niepodległości potrzebujemy skóry białego człowieka jako pergaminu, jego czaszki jako kałamarza, jego krwi jako atramentu i bagnetu za pióro” – ogłosił wówczas czarnoskóry generał, Boisrond-Tonnerre."
"0xd4cd1022" = "Typowym produktem pochodzenia karaibskiego, choć jego dobrodziejstwo dla ludzkości jest wątpliwe, jest rum. Ten napój alkoholowy wytwarzany z melasy trzciny cukrowej, który początkowo nosił barwną nazwę „zabójczego diabła”, pojawił się po raz pierwszy na Barbados, w 1650 roku. Ponieważ był to legendarny napitek ulubiony przez piratów, większość ludzi kojarzyła rum z wyspą Jamajką, jedną z najbardziej głośnych kryjówek pirackich w tamtych czasach. <n><n>Handlarze niewolników, w zamian za znaczne ilości melasy, sprzedawali na Karaibach ładunek ludzi zakupionych na afrykańskim wybrzeżu. Ta melasa była przerabiana na rum w Nowej Anglii, a potem transportowana do Afryki, na tych samych statkach. Trunek był sprzedawany w Afryce, a puste statki były następnie zapełniane świeżym ładunkiem niewolników. Dzięki temu fatalnemu „trójkątowi kupieckiemu”, właściciele statków mieli pewność, że statki zawsze były wyładowane przy każdej podróży."
"0xd4cd1023" = "Jamajka, obok Kuby, jest zapewne najsłynniejszą z wysp Karaibów. Jej nazwa wywodzi się z używanej przez Indian Arawak nazwy Xymaca, co oznacza mniej więcej „ziemię drewna i wody”. Sam Krzysztof Kolumb, który odkrył wyspę dziewięć lat wcześniej, miał znakomitą okazję doświadczyć piękna tego miejsca i przyjaźni tamtejszych mieszkańców, gdy jego statek rozbił się na północnym wybrzeżu wyspy, w 1503 roku.<n><n>W istocie, tak mu się tam spodobało, że przejął prawo własności do całej wyspy od króla Hiszpanii i zadeklarował, że wyspa należy do niego samego. Pomimo tego, ten wyspiarski raj pozostawał zaniedbywany przez kilka następnych dekad, aż przejęli go Brytyjczycy, w 1655 roku. W tym czasie pozostało bardzo niewielu Indian Arawak, gdyż ich plemię okazało się wyjątkowo podatne na choroby, jakie zawlekli ze sobą Europejczycy.<n><n>W 1661 roku, Edward D'Oyley został mianowany generalnym kapitanem i gubernatorem Jamajki. Pod jego rządami stolica wyspy, Port Royal, została przekształcona w tętniące życiem, silnie bronione siedlisko piratów. Powiadano, że było to „najbogatsze i najbardziej zepsute miejsce na ziemi”, a wielu z jego mieszkańców, którzy poza tym byli zwykłymi kupcami, regularnie łączyło się w bandy przeprowadzające prywatne najazdy na hiszpańskich wodach. Na początku, rząd brytyjski okazywał niewielkie starania, by zapanować nad tą sytuacją - w końcu piraci nękali ich hiszpańskich rywali.<n><n>Dopiero gdy sir Henry Morgan przejął urząd gubernatora (znaczące jest to, że sam był wcześniej piratem), na Jamajkę powróciła kultura i porządek. Morgan bezwzględnie zwalczał piractwo i bez wahania posyłał swoich dawnych kompanów na szubienicę.<n><n>Jednak, niedługo po tym, jak ponownie przywrócono brytyjską władzę nad wyspą, odkryto nowe, zyskowne źródło dochodów uzupełniających uprawę trzciny cukrowej: po 1672 roku, Port Royal rozwinęło się w największy rynek niewolników na świecie, gdy angielska Królewska Kompania Afrykańska zdobyła monopol."
"0xd4cd1024" = "Zaledwie w dwa tygodnie po swoim przybyciu do Nowego Świata, Krzysztof Kolumb dotarł do Kuby, największej wyspy Indii Zachodnich. Żyło tam kilka plemion: Sibonejowie, Guanahatabey i Taino, których, pomimo ich pokojowej natury, czekał ten sam nieszczęsny los, co innych plemion rdzennych Amerykanów: w 1511 roku, po trwającej cztery lata wojnie z Hiszpanami, zostali podbici i wymordowani. W rezultacie, na wyspę zaczęto sprowadzać wielkie ilości czarnych niewolników. Wyspa, ze swoją stolicą Hawaną, została podzielona na siedem obszarów administracyjnych (cabildos), z których każda wysyłała delegata do specjalnej rady. Obowiązkiem delegata było reprezentowanie lokalnych interesów danego obszaru.<n><n>Znaczące w historii Kuby jest to, że poza krótkim okresem brytyjskiej kontroli w latach 1762-1763, wyspa pozostawała w hiszpańskich rękach przez stosunkowo długi czas. Mogło tak dziać się dlatego, że Kuba nie należała do najważniejszych obszarów hiszpańskiego imperium w czasach kolonialnych (na przykład, było tam bardzo niewiele złóż mineralnych) i generalnie traktowano ją jako przystanek w drodze na kontynent. W każdym razie, podczas gdy znaczna większość krajów Ameryki Południowej i Ameryki Środkowej walczyła o swoją niepodległość w pierwszej ćwierci XIX stulecia, Hiszpanie byli w stanie utrzymać Kubę aż do roku 1898, kiedy oddali kontrolę nad wyspą Stanom Zjednoczonym."
"0xd4cd1025" = "Dobrze znanym faktem jest to, że wiele rzeczy, które obecnie uznajemy za powszechnie dostępne, po raz pierwszy pojawiło się w Europie na skutek handlu z Ameryką. Jednakże wymiana kulturalna działała w inny sposób.<n><n> Na przykład, gdy wyobrażamy sobie typowego Indianina na równinach Ameryki Północnej, trudno uwierzyć, że w Ameryce nie było koni przed przybyciem Hiszpanów i Portugalczyków. Wielu rdzennych Amerykanów uciekało w ślepej panice, gdy po raz pierwszy zobaczyli konia i jeźdźca. Myśleli bowiem, że to dziwny stwór składający się z dwóch zrośniętych ze sobą istot.<n><n>Kawa, którą zwykle kojarzymy z krajami takimi jak Brazylia i Gwatemala, nie pochodzi z Ameryki i jeszcze zanim tam dotarła, przemierzyła trzy kontynenty: z Afryki (prawdopodobnie z Etiopii) podróżowała przez kraje arabskie, aż przybyła do południowo-zachodniej Europy. Ta roślina po raz pierwszy została wprowadzona do uprawy w Ameryce w XVIII stuleciu, gdy rosnąca popularność napoju wymusiła zwiększenie produkcji kawowego ziarna.<n><n>Ziemniak, którego Europejczycy odkryli na Karaibach, stał się niewyobrażalnie cenną podstawą wyżywienia. I odwrotnie, pszenica nie była znana w Ameryce aż do przybycia Hiszpanów i Anglików, którzy sprowadzili to zboże do Meksyku i Wirginii, w latach, odpowiednio, 1520 i 1777. Chociaż początkowo panowało przeświadczenie, że amerykański klimat nie nadaje się do uprawy pszenicy, to właśnie Ameryka Północna stała się świadkiem najbardziej fenomenalnego sukcesu tego zboża. Dzisiaj, pszenica jest zbożem uprawianym na największym areale na całym świecie."
"0xd4cd1026" = "Czy potrafisz sobie wyobrazić życie bez czekolady? Spróbuj, bo kakao nie było znane reszcie świata aż do odkrycia Ameryki. Słowo kakao prawdopodobnie pochodzi z języka Majów: wydaje się rzeczą pewną, że kupcy Majów pili kakao 400 lat przed narodzeniem Chrystusa.<n><n>Aztekowie, którzy od XIV wieku byli wiodącą potęgą na kontynencie Ameryki Środkowej, nadawali kakao znaczenie wręcz religijne. Pierwszym Europejczykiem, który zetknął się z tym przysmakiem był, ponownie, Krzysztof Kolumb, chociaż stało się to podczas jego późniejszej podróży w 1502 roku, która doprowadziła go do Nikaragui.<n><n>Jednak właściwym „odkrywcą” kakao był Hernan Cortés, zdobywca azteckiego królestwa, który sprowadził do Hiszpanii przepis na napój zwany xocoatl (stąd słowo „czekolada”). Początkowo jego smak był zbyt gorzki dla podniebień Europejczyków i dopiero gdy smakosze zaczęli dodawać cukier lub wanilię, gorąca czekolada stała się popularnym napojem wśród iberyjskich klas wyższych.<n><n>Hiszpanie zachowywali przepis tylko dla siebie przez niemal sto lat, po czym gorąca czekolada rozprzestrzeniła się we Francji i reszcie Europy. Około roku 1700, Brytyjczycy zaczęli dodawać do niej mleko. Ostatni przełom w przyrządzaniu kakao w Europie miał miejsce, gdy odkryto jak wspaniale kakao smakuje w połączeniu z kawą."
"0xd4cd1027" = "Chociaż czasami trudno rozdzielić rzeczywistość od legendy, gdy rzecz dotyczy opowieści o piratach, nie podlega dyskusji fakt, że istniały kobiety-piratki. Dwie z najbardziej znanych postaci wyruszyły w kurs na wyspę Jamajkę na początku XVIII wieku.<n><n>Anne Bonny, o której mówiono, że w dzieciństwie pchnięto ją nożem w brzuch, uwiodła żeglarza i pociągnęła go ze sobą do pirackiej siedziby w New Providence (Nassau). Tam, udało jej się pozbyć męża i rozpocząć własną karierę na pokładzie przechwyconego holenderskiego statku. <n><n>Tam też spotkała Mary Read, która walczyła już w hiszpańskiej wojnie sukcesyjnej przebrana za mężczyznę i która podobno obnażała swoje piersi przed swoimi wrogami, na chwilę zanim ich zabiła, aby udowodnić im, że zostali pokonani przez kobietę.<n><n>Gdy schwytano je w 1720 roku, uniknęły posłania na szubienicę tylko dlatego, że obie były w ciąży. Uważały się za lepsze od większości swoich męskich towarzyszy, o których Anne Bonny wyrażała się zawsze z pogardą.<n><n>Oto słowa, jakie wypowiedziała do niesławnego „Calico Jacka”, gdy ten szedł na szubienicę: „przykro mi, że cię tu widzę, Jack, ale gdybyś walczył jak mężczyzna, nie byłbyś tutaj, żeby zawisnąć jak pies”."
"0xd4cd1028" = "Walijczyk Bartholomew Roberts (1682? – 1722), był nie tylko jednym z najważniejszych piratów, ale był także bardzo niezwykłym piratem. Znany także pod przydomkiem „Czarny Bart” (nie mylić z „Czarnobrodym” alias Edward Teach), późno stał się piratem, mając 37 lat, chociaż jego zejście na drogę występku odbyło się bez wątpienia płynnie: statek, na którym pracował i który został zaatakowany w 1719 przez jego rodaka, Walijczyka Howella Davisa, był w rzeczywistości statkiem niewolniczym.<n><n>Roberts postanowił związać swój los z Davisem, a po jego zamordowaniu kilka tygodni później, przejął rolę kapitana. Mówi się, że Bartholomew Roberts unikał alkoholu i wolał herbatę.<n><n>W odróżnieniu od Teacha, który kreował siebie na diabła wcielonego, Roberts lubił dobre ubrania, gardził hazardem i nalegał, by jego ludzie regularnie się modlili. Jednak, z pewnością nie oznaczało to, że Roberts był w głębi duszy pobożnym człowiekiem. Istnieją liczne opowieści o okrucieństwach, jakich dopuścił się podczas swoich niezliczonych wypraw łupieżczych, szczególnie wobec jeńców. Mając pod swoim dowództwem ponad 400 statków i działając na obszarze rozciągającym się od Brazylii aż do Nowej Fundlandii i Afryki Zachodniej, był obok Henry'ego Morgana, jednym z największych piratów Ameryki Środkowej. <n><n>Huk salwy dział z brytyjskiego okrętu wojennego przy wybrzeżu Gwinei w 1722 roku, ogłosił koniec jego kariery i zniknięcie jednego z największych zagrożeń na siedmiu morzach."
"0xd4cd1090" = "Najsławniejszym piratem XVII wieku był Walijczyk, Henry Morgan (1635-1688), który gnębił hiszpańskie kolonie w Indiach Zachodnich podważając fundamenty władzy iberyjskiego mocarstwa w tym regionie.<n><n>Jego życie jest przykładem dość wątpliwej moralności, na jakiej opierała się polityka Brytanii, Holandii i Francji, które z zadowoleniem przymykały oko na piractwo, dopóki wyrządzało szkodę pozostałym mocarstwom.<n><n>Henry Morgan, który objął dowodzenie nad statkiem korsarskim w 1668 roku, rozpoczął sianie zamętu wzdłuż północnego wybrzeża Ameryki Południowej. Dowodząc niemal 2000 ludzi, przejął dobrze bronione miasto Panama, w sierpniu 1670 roku, a potem wycofał się z większą częścią łupów i wrócił do domu. Jednak, ponieważ atak nastąpił po podpisaniu traktatu pokojowego przez Hiszpanię i Anglię, pirat został wzięty do niewoli i osądzony w Londynie.<n><n>Morgan nie został skazany - wręcz przeciwnie: niewiele czasu minęło, gdy wiatry dyplomacji ponownie zmieniły kierunek. Nie tylko ułaskawiono Morgana, ale jeszcze mianowano go szlachcicem. Sir Henry został mianowany nowym gubernatorem Jamajki, gdzie wprowadził surowe prawo i porządek oraz przeżył pozostałe lata swojego życia jako majętny i szanowany plantator."
"0xd4cd1091" = "Bahamy, które przez krótki okres w połowie XVII wieku służyły jako schronienie dla religijnych odszczepieńców z Anglii, od 1670 roku zostały oficjalnie oddane pod kontrolę księciu Albemarle i innym dżentelmenom, którym król Karol II udzielił prawa własności nad tą grupą wysp. Król liczył, że te majątki przyniosą spore dochody.<n><n>Pomimo obietnic, ci osobnicy okazywali niewielkie zainteresowanie stworzeniem dobrze zarządzanej administracji cywilnej. W istocie było wprost przeciwnie: podobnie jak w innych miejscach na Karaibach, hordy piratów zaczęły osiedlać się na Bahamach, szczególnie na wyspie New Providence, na której znajdowało się miasto Nassau. x<n><n>Płytkie zatoki, do których nie mogły wtargnąć ciężkie okręty wojenne, stanowiły idealną bazę dla kilkuset slupów i pirackich barków. Regularne napaści na hiszpańskich wodach doprowadziły do akcji odwetowych i John Wentworth, pierwszy gubernator, otrzymał niewdzięczne zadanie przywrócenia prawa i porządku na wyspach.<n><n>Ponieważ nic nie wskazywało na to, by sytuacja miała się poprawić, król angielski Jerzy I ponownie skonfiskował Bahamy i zmienił je w kolonię pod rządami Korony. Woodes Rogers, były pirat i podróżnik dookoła świata, po raz pierwszy został mianowany królewskim gubernatorem w połowie 1718 roku.<n><n>Stosując podejście kija i marchewki udało mu się opanować chaos, jaki panował do tej pory. Ogłosił powszechną amnestię dla wszystkich piratów, którzy zdecydowali się porzucić swoją działalność i złożyć przysięgę. Na tych, którzy nie podporządkowali się temu, oczekiwała kara w postaci floty uzbrojonych po zęby statków.<n><n>Po tym, jak w ten sposób przywrócono normalny stan rzeczy, w 1729 roku grupa wysp uzyskała własny parlament i w ciągu następnych stu lat, za wyjątkiem okazjonalnych niepokojów wywoływanych przez najazdy, historia Bahamów pozostawała stosunkowo spokojna."
"0xd4cd1092" = "Prawie we wszystkich zdobywanych koloniach Hiszpanie wprowadzali sztywny system społeczny oferujący niewielkie możliwości awansu do innej klasy. Na samym szczycie hierarchii znajdowali się Hiszpanie urodzeni w Europie.<n><n> Hiszpanie urodzeni w koloniach byli nazywani Kreolami. Chociaż uważano, że zajmują drugie pod względem ważności miejsce w hierarchii, obejmowali większość pomniejszych urzędów w rządzie, kościele i armii.<n><n>A zatem, Hiszpanie pochodzenia europejskiego i Kreole stanowili elitarną klasę w koloniach. Dzieci z mieszanych małżeństw między białymi (głównie mężczyźni) i rdzennymi Amerykanami były nazywane metysami. Rdzenni Amerykanie, do których pierwotnie należała ta ziemia, zajmowali najniższą pozycję w społeczeństwie, a na tych obszarach, gdzie zostali kompletnie wytępieni przez Europejczyków, ich pozycję przejmowali czarni niewolnicy.<n><n>Proporcje między tymi populacjami różniły się znacznie w różnych regionach hiszpańskiego imperium. Na przykład, w Meksyku metysi tworzyli najliczniejszy odłam populacji. Na wielu wyspach czarni niewolnicy stanowili znaczną większość ludności (i pozostawali skazani na łaskę swoich panów). Niektórym plemionom rdzennych Amerykanów udało się przetrwać na tych obszarach, gdzie dżungle, bagna i góry oferowały bezpieczne schronienie, na przykład w Boliwii lub na Florydzie."
