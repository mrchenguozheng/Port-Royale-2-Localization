"0xfd4ed860" = "Twoi żołnierze rozbili bramę miejską i wzięli do niewoli dowódcę. Mieszkańcy miasta widząc to poddają się.<n><n>Co chcesz teraz zrobić?"
"0xfd518241" = "Miasto gubernatorskie, którym włada %1"
"0xfd638295" = "Gra jest wczytywana..."
"0xfd6477c9" = "Zwiększ siłę ognia swojego konwoju do co najmniej 90 dział."
"0xfd69d24a" = "%1:%2:%3"
"0xfd6d4abb" = "Wykonałeś akcję, która uniemożliwiła pomyślne ukończenie scenariusza.<n><n>Wykonaj instrukcje widoczne w oknie wydarzeń."
"0xfd9349ac" = "Konfiskata"
"0xfda0635d" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>LPM<f:fonts/Tiepolo_bold14x14aaFH.res><t>Salwa z burty<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Ustal kurs<n><f:fonts/Tiepolo_black14x14aaFHk.res>1,2,3<f:fonts/Tiepolo_bold14x14aaFH.res><t>Wybierz amunicję<n><f:fonts/Tiepolo_black14x14aaFHk.res>4<f:fonts/Tiepolo_bold14x14aaFH.res><t>Szykuj abordaż<n><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Wypal z dział"
"0xfda277f4" = "Miasto %1 jest pełne i nie ma miejsca do wybudowania magazynu. Jeśli pomimo tego chcesz zbudować w mieście coś własnego, spróbuj przekonać któregoś z miejscowych kupców, żeby wyburzył jedno z własnych przedsiębiorstw.<n><n>Przedsiębiorstwa są likwidowane, gdy cena w mieście na produkowane tam towary pozostaje przez dłuższy czas na niskim poziomie, co oznacza, że utrzymuje się nadwyżka tych dóbr. Aby do tego doprowadzić, musisz zacząć gromadzić odpowiedni produkt. Następnie sprzedawaj odpowiednio duże ilości produktu na rynku miejskim, aby cena opadła do niskiego poziomu.<n><n>Towary wyprodukowane są dostarczane na rynek miejski raz dziennie. Jeśli aktualna cena jest minimalna, przedsiębiorstwo zredukuje swoją obsadę pracowników. Możesz to sprawdzić, klikając na przedsiębiorstwie. Przedsiębiorstwo zostaje zlikwidowane, gdy 30 pracowników stanie się zbędnych."
"0xfda5ded4" = "Miasto rozkwita dzięki odkryciu złota."
"0xfdaf6463" = "Ponownie muszę ci podziękować za uczynienie tak wiele dla mojego narodu. W nagrodę dam ci pozostałą ziemię w naszym mieście %1. Teraz posiadasz całą dzielnicę."
"0xfdb7f907" = "Ognisko zdradza położenie kryjówki nauczyciela, niedaleko od brzegu. Twój kapitan wiosłuje na brzeg i spotyka się ze starym mężczyzną. Gdy stary widzi całe wino, zaciera swoje dłonie z radości."
"0xfdb7f908" = "Niedaleko od brzegu twój konwój odkrywa małe obozowisko pustelnika. Twój kapitan wiosłuje na brzeg i spotyka starego mężczyznę w mundurze kapitana, który jest starszy nawet od niego. Stary zauważa beczki rumu i jest zachwycony."
"0xfdb7f909" = "Po pewnym czasie twój konwój odkrywa kryjówkę na lądzie. Kapitan wiosłuje na brzeg i rozgląda się. Wreszcie znajduje starego mistrza i tłumaczy, co go tam sprowadza. Pustelnik przyjmuje jedzenie."
