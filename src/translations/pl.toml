"0xf4b112c8" = "Wyjście z gry"
"0xf4b68a6b" = "Gratulacje! Udało ci się pomyślnie ukończyć scenariusz i przejąć kilka angielskich miast w imieniu Holandii.<n><n>W trybie wolnej gry możesz przejmować miasta w ten sam sposób. Ale pamiętaj zadbać, by naród, którego miasta chcesz przejąć, był słaby militarnie. Dodatkowo, naród, dla którego chcesz przejmować miasta, musi być militarnie silny, a oba odpowiednie narody muszą prowadzić wojnę ze sobą.<n><n>Uwaga: Zwykle, gdy przejmiesz miasto dla wicekróla, w nagrodę otrzymasz ziemię, na której możesz budować własne miasta. Jednak ta cecha jest wyłączona w tym scenariuszu."
