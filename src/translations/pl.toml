"0xf6456afc" = "Dzisiaj, holenderski pirat %1 napotkał konwój wojskowy z Francji i został zabity."
"0xf6456afe" = "Dzisiaj, holenderski pirat %1 napotkał konwój wojskowy z Hiszpanii i został zabity."
"0xf64f1e5a" = "Jak wiesz, prowadzimy wojnę. Przechwyć lub zatop @I$NumShips$ statków kupieckich, co sprawi, że @n$TargetNation$ stanie się słabsza ekonomicznie. Czy przyjmujesz tę misję? "
"0xf64f1e5b" = "@n$TargetNation$ prowadzi z nami wojnę. Chcę, żebyś zatopił lub przechwycił określoną liczbę statków kupieckich. Wszystko co im zabierzesz, należy do ciebie, zależy mi tylko na tym, żeby @n$TargetNation$ została osłabiona. Czy mogę liczyć na ciebie."
"0xf64f1e5c" = "Zastanawiałem się, czy mógłbyś nam pomóc w wojnie, którą prowadzimy my i @n$TargetNation$. Chciałbym wysłać cię na pewien obszar i zlecić ci przechwytywanie lub zatapianie statków, jakie tam spotkasz. "
"0xf651cc3f" = "Holandia i Anglia zawarły pokój, więc nie możesz już przechwytywać żadnych miast.<n><n>Zaszedłeś daleko w tym scenariuszu, ale nie starczyło ci czasu, aby przechwycić dość miast w imieniu Holandii.<n><n>W trybie wolnej gry możesz przejmować miasta w ten sam sposób. Najpierw jednak musisz upewnić się, czy naród, którego miasta chcesz przejąć, jest słaby militarnie. Dodatkowo, naród, który chce przejąć te miasta musi być silny militarnie i oba narody muszą być w stanie wojny między sobą.<n><n>Uwaga: Zwykle, gdy przejmiesz miasto dla wicekróla, w nagrodę otrzymasz ziemię, na której możesz założyć własne miasta. Jednak ta możliwość jest wyłączona w tym scenariuszu."
"0xf65a5a04" = "Możesz poprawić swoją reputację, jaką darzy cię %1, atakując angielskie statki i miasta. To nie pogorszy twojej reputacji w pozostałych państwach."
"0xf65b6f4c" = "Dzisiaj, hiszpański pirat %1 napotkał konwój wojskowy z Anglii i został zabity."
"0xf65b6f4d" = "Dzisiaj, hiszpański pirat %1 napotkał konwój wojskowy z Francji i został zabity."
"0xf65b6f4e" = "Dzisiaj, hiszpański pirat %1 napotkał konwój wojskowy z Holandii i został zabity."
"0xf662124e" = "Konwój pirata zwanego %1 został zniszczony."
"0xf669f78e" = "Hiszpańska flota skarbów zakotwiczyła w mieście %1"
"0xf67158d8" = "Tryb wolnej gry"
"0xf680e197" = "%1 czeka na ciebie na rynku."
"0xf6957b90" = "Statki w porcie"
"0xf69c4221" = "Atak na %1"
"0xf6a84efd" = "Jest rok 1570 i znajdujemy się na Karaibach. Jesteś skromnym kupcem, a twoim celem jest stanie się wpływowym przedsiębiorcą. Aby osiągnąć ten cel, możesz transportować towary, a także handlować, budować i zajmować się polityką oraz piractwem.<n><n>Następujący scenariusz nauczy cię podstaw prowadzenia gry. Podobnie jak w przypadku pozostałych scenariuszy, musisz wypełnić różne cele. Aby pomyślnie ukończyć scenariusz, musisz wypełnić wszystkie cele.<n><n>Teraz możesz zamknąć to okno za pomocą przycisku Zamknij i przenieść się do okna wydarzeń w lewej dolnej części ekranu.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Wykonuj instrukcje widoczne w oknie wydarzeń."
"0xf6bb9f8c" = "Cena"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "Karta grafiki"
"0xf6c77503" = "Odkryto kryjówkę pirata zwanego %1. Jaki bohaterski poszukiwacz przygód ośmieli się zaatakować i zniszczyć tę kryjówkę?"
"0xf6ec5ddc" = "Dziwne rzeczy dzieją się Tortudze. Z powodu kilku wydarzeń jakie miały miejsce w przeszłości, niewielu kupców ośmiela się postawić stopę w mieście. Twoim zadaniem jest wspieranie Tortugi najlepiej jak się da, za pomocą dostarczania towarów.<n><n>Ale twój kapitał początkowy nie jest zbyt imponujący. Masz dostępne @g$StartGold$ gotówki. Tym niemniej, posiadasz dobrze wyposażony konwój kupiecki w porcie i trochę towarów.<n><n>Twoim pierwszym celem jest zwiększenie stanu gotówki do @g$GoldGoal$. Ukończ to zadanie najszybciej jak się da, ale nie może ci to zabrać więcej niż 40 dni.<n><n>Rada: Pod żadnym pozorem nie sprzedawaj własnych statków. Możesz jednak brać pożyczki.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zwiększ swoją gotówkę do @g$GoldGoal$, zanim nadejdzie @D$EndDate$."
"0xf70feddb" = "Jesteś z powrotem w porcie Cartagena, a twój konwój, „Santa Maria”, został wybrany.<n>Jak widzisz, w konwoju jest już trochę towarów: bawełna, mięso i kakao.<n>Teraz znajdź doki w porcie i kliknij na nich, ponieważ chcemy sprzedać towar."
"0xf70feddc" = "W dokach możesz handlować między miastem a twoim magazynem oraz między miastem a twoim konwojem.<n>Zobaczysz jakie towary znajdują się w mieście i jakie towary są w twoim konwoju. Używaj strzałek, aby kupować i sprzedawać (ceny widoczne są na strzałkach).<n>Teraz sprzedaj bawełnę."
"0xf70feddd" = "Być może zauważyłeś jak spadła cena bawełny, gdy sprzedałeś pewną jej ilość.<n>Dzieje się tak dlatego, że cena zależy od podaży i popytu w mieście.<n>Sprzedawanie towaru zaspokaja popyt i cena spada. Jeśli kupujesz towar, jego cena wzrasta.<n>Teraz kup @a$SubGoal$ pszenicy."
"0xf70fedde" = "Widzisz, jak właśnie wzrosła cena pszenicy? <n>Zauważ jednak, że cena zależy nie tylko od podaży, ale także od twojej reputacji w mieście.<n>Kliknij na przycisku z budynkiem, widocznym w prawej górnej części okna handlu."
"0xf70feddf" = "Teraz możesz handlować między swoim magazynem a miastem.<n>W każdym mieście, w którym chcesz rozpocząć produkcję jakiegoś towaru, najpierw musisz wybudować magazyn. Zawsze posiadasz już magazyn w swoim mieście startowym.<n>Teraz sprzedaj wszystkie towary, jakie masz w magazynie."
"0xf70fede0" = "Trzy przyciski z numerami 1, 10 i 100, na samej górze okna handlu, umożliwiają szybsze handlowanie większymi ilościami towaru. Kliknij na przycisku 10 i patrz jak zmieniają się ceny.<n>Nie ma znaczenia, czy kupisz 10 razy 1 jednostkę towaru, czy 1 raz 10 jednostek towaru: cena całkowita jest zawsze taka sama. Teraz kup @a$SubGoal$ rumu."
"0xf70fede1" = "Kolumna najdalej po prawej stronie menu handlu pokazuje średnie ceny za kupowane przez ciebie towary. Ponieważ chcesz sprzedać towar z zyskiem, musisz znaleźć miasto, które zapłaci najwyższą cenę za ten towar.<n>Teraz otwórz okno transferu między statkiem i twoim magazynem klikając na czwartym przycisku (z dźwigiem) na dole, po prawej stronie."
"0xf70fede2" = "W tym oknie możesz przenosić towary między swoim konwojem a magazynem. Teraz załaduj wszelkie pozostałe towary z magazynu do konwoju, ponieważ chcemy sprzedać towary w innym mieście.<n>Następnie zamknij okno handlu klikając na przycisku oznaczonym symbolem „X”, na dole po prawej stronie."
"0xf70fede3" = "Teraz przełącz widok na mapę morską i popłyń ze swoim konwojem do miasta Santa Marta. Nie wchodź do miasta Santa Marta, ale kliknij prawym przyciskiem na mieście, gdy tylko konwój dotrze do niego. "
"0xf70fede4" = "Spowoduje to otwarcie okna handlu dla miasta Santa Marta.<n>A zatem, nie musisz wchodzić do miasta, żeby móc w nim handlować.<n>Teraz sprzedaj wszystkie towary, jakie masz na pokładzie swojego konwoju.<n>Następnie zamknij okno handlu."
"0xf7110875" = "Czy na pewno chcesz usunąć zapis?"
"0xf725f22c" = "Twój konwój znajduje się teraz w mieście Santa Marta. Kliknij na nazwie miasta, aby wyświetlić informacje o nim.<n>Możesz to zrobić na mapie morskiej, albo wchodząc do miasta."
"0xf725f22d" = "Informacja o mieście pokazuje produkowane w nim towary.<n><n>Widoczny jest także twój związek z Hiszpanią: tez związek jest przyjazny! Oznacza to, że w tym mieście otrzymasz najlepsze ceny.<n><n>Teraz zamknij to okno i rozejrzyj się po mieście."
"0xf725f22e" = "Teraz kliknij na symbolu mieszkańców pod nazwą miasta, po lewej stronie ekranu, aby wyświetlić zapasy miasta Santa Marta."
"0xf725f22f" = "Zobaczysz ilość dóbr trzymanych w zapasach oraz ilość dóbr konsumowanych w mieście. Naturalnie, poziom konsumpcji zależy od populacji miasta.<n>Poziom konsumpcji wskazuje jak wiele towarów można regularnie dostarczać do danego miasta. Teraz zamknij okno zapasów."
"0xf725f230" = "Następnie spróbuj dokonać kilku zyskownych transakcji.<n>Otwórz okno handlu i kup jak najwięcej bawełny, cukru i kakao do swojego konwoju, ponieważ są to towary produkowane w tym mieście.<n>Potem wróć do Cartageny i sprzedaj te towary z zyskiem."
"0xf725f231" = "Właśnie otrzymałeś dwa komunikaty z kilkoma wskazówkami radzącymi jak umiejętnie handlować.<n>Otwórz dziennik, aby przeczytać te komunikaty.<n>"
"0xf725f232" = "Sprzedaj jak najwięcej towarów powyżej ceny średniej i kup nowe towary. <n>Uwaga: Ceny towarów, których brakuje w mieście, są pokazane na czerwono. Zawsze dostaniesz dobrą cenę za te towary.<n>"
"0xf725f233" = "Miasta gubernatorskie, takie jak Cartagena, otrzymują towary importowane z Europy.<n>Zwykle możesz sprzedawać je z zyskiem w miastach kolonialnych, takich jak as Santa Marta, Maracaibo lub Gibraltar.<n>Teraz przez chwilę handluj samodzielnie.<n>Twoim celem jest zdobycie z handlu @g$GoldGoal$, w gotówce."
"0xf7346191" = "Kupiec z: %1"
"0xf73619d7" = "Poznano położenie kryjówki piratów"
"0xf7370c4b" = "%1,<n>jest wielu ludzi, z którymi muszę się zobaczyć. Czy mamy o czym rozmawiać? Wejdź, jeśli musisz."
"0xf73bf67d" = "Przejdź do podglądu miasta Cartagena.<n>Zwykle musisz mieć konwój zakotwiczony w porcie, jeśli chcesz wejść do miasta. Jednak w Cartagenie masz magazyn, a zatem możesz wchodzić do tego miasta, kiedykolwiek zechcesz.<n>Kliknij na stoczni w Cartagenie."
"0xf73bf67e" = "W stoczni zakup mały statek. Nie wydawaj zbyt dużo pieniędzy, ponieważ musisz zachować trochę na handel i konserwację statku."
"0xf73bf67f" = "W ostatnim scenariuszu nauczyłeś się dodawać statki do konwoju przez klikanie prawym przyciskiem na porcie.<n>Teraz jednak, spróbuj utworzyć nowy konwój wynajmując kapitana w tawernie.<n>Znajdź tawernę (położoną w centrum miasta) i kliknij na niej."
"0xf73bf680" = "Kapitanów można zawsze szukać w tawernach. Jeśli w mieście przebywa jakiś kapitan, zostanie to wskazane na trzecim przycisku w menu tawerny.<n>Jeśli masz w porcie inne statki lub konwoje, musisz powiedzieć kapitanowi, gdzie dokładnie ma zacząć pracować.<n>Wskaż, że ma stać się kapitanem twojego nowego statku."
"0xf73bf681" = "Gratulacje! Utworzyłeś swój pierwszy konwój! Twoje następne zadanie polega na powiększeniu majątku do @g$GoldGoal$. W dowolnej chwili możesz ocenić stan swojego majątku na zakładce „Sukcesy”, w dzienniku.<n><n>Powodzenia!"
"0xf73dab55" = "Dziękuję ci za ukończenie ostatniej misji, jaką ci zleciłem."
"0xf73dab56" = "Chciałbym ci podziękować za wykonanie mojej ostatniej misji."
"0xf73dab57" = "Jestem wdzięczny za twoje wsparcie."
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "Rozpoczynasz karierę z <o:0xFFF2FAAD>%1<o> złotymi monetami oraz <o:0xFFF2FAAD>pinasą<o> (60 ton, maks. 8 dział)"
"0xf7534d8f" = "Gdy przewieziesz osadników do miasta, w którym potrzebni są pracownicy, osadnicy podziękują ci płacąc przewoźne, gdy zejdą na ląd.<n><n>Do produkcji dóbr kolonialnych, takich jak kakao, zawsze potrzebna jest pewna, niewielka liczba narzędzi. Jeśli brakuje tych narzędzi, produkcja zatrzymuje się. Później, kiedy dowiesz się więcej o cenach i ilościach, możesz poinstruować magazyniera, by regularnie zakupywał narzędzia w mieście. Jednak w tej chwili na wszelki wypadek sam kup narzędzia.<n><n>To twoje następne zadanie. Potem nic już nie powstrzyma cię przed rozpoczęciem produkcji kakao.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Produkuj kakao i zgromadź jego zapas @a$AmountGoal$ w swoim magazynie."
"0xf760fd2a" = "Dziękuję ci. Oto twoje %1. Będę tu, dopóki nie nadejdzie %2. Do tego czasu możesz sprowadzać do mnie więcej towarów."
"0xf76d173f" = "Miasto %1 zostało przejęte."
