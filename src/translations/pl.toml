"0x15d892f9" = "Tiepolo_bold14x14aaFH.res"
"0x15d8bad1" = "Dobrze! Miasto, o którym mowa, to @T$TargetTown$. Pragnąc podporządkować je sobie, Wicekról, którego mianowała @n$TargetNation$, zakazał wszystkim kupcom zawijać do tego miasta. Jeśli uda nam się przywrócić zamożność miasta zaopatrując je w towary, z pewnością będziemy mogli liczyć na lojalność mieszkańców. Musisz ukończyć tę misję, zanim nadejdzie @D$EndDate$."
"0x15d8bad2" = "Mówię o mieście @T$TargetTown$. Wszystkim kupcom zakazano zawijać do tego miasta. Twoja misja polega na zaopatrywaniu miasta, aby przywrócić jego zamożność. W ten sposób, damy do zrozumienia, że jesteśmy zainteresowani miastem @T$TargetTown$. Musisz wypełnić tę misję, zanim nadejdzie @D$EndDate$."
"0x15d8bad3" = "Sprawa jest następująca: Wicekról zakazał wszystkim kupcom zawijać do miasta @T$TargetTown$. W ten sposób, chce wywrzeć nacisk na radę miejską. Jeśli uda ci się dostarczyć miastu @T$TargetTown$ tyle towarów, żeby przywrócić jego zamożność, zanim nadejdzie @D$EndDate$, nie wątpię, że uda nam się zaaranżować pokojową zmianę przynależności narodowej tego miasta."
"0x15e96b4c" = "Zapisz"
"0x15f470e9" = "Zakończ bitwę morską"
"0x15f6d04b" = "Wygrałeś bitwę morską. Czy chcesz odwołać atak?"
"0x15fd96d6" = "Nabyłeś zezwolenie na budowę i teraz możesz budować w tym mieście. Twoim pierwszym budynkiem musi być magazyn.<n><n>Uwaga: Im więcej masz zezwoleń, tym droższe będzie następne i tym dłużej zabierze poprawienie rejestru handlowego w innych miastach."
"0x1605422d" = "Kryjówka"
"0x161f0ab3" = "Ranga"
"0x1629fb20" = "%1,<n>znowu jesteś. Chodź, mam pewne nowiny dla ciebie."
"0x1629fb21" = "%1,<n>tym razem długo cię nie było. Nie masz nic innego do roboty?"
"0x1629fb22" = "%1,<n>nie spodziewałam się zobaczyć cię tak szybko. Chyba nie mam jeszcze żadnych nowin dla ciebie."
"0x162a5cb6" = "Kryjówka różnego dobra"
"0x163fff71" = "%1,<n>miło, że wpadłeś. Czy mam opowiedzieć ci o najnowszych wydarzeniach, o których słyszałam?"
"0x163fff72" = "%1,<n>dobrze znowu cię zobaczyć. W ciągu kilku ostatnich dni rozpytywałam wkoło i może mam jakieś wieści dla ciebie."
"0x163fff73" = "%1,<n>jesteś znowu. Cieszę się na twój widok. Myślę, że mam pewne nowiny dla ciebie."
"0x165603c2" = "%1,<n>minęło trochę czasu, ale jestem rada znowu cię zobaczyć. Mam pewne nowiny dla ciebie."
"0x165603c3" = "%1,<n>właśnie miałam kogoś odwiedzić, bo tak tu nudno. Ale ty przyszedłeś. Chodź, mam ci coś do powiedzenia."
"0x165603c4" = "%1,<n>Jesteś. Zastanawiałam się właśnie, gdzie się podziewałeś przez cały ten czas. Mam pewne nowiny dla ciebie."
"0x1659b12c" = "Masz teraz dość złota, aby zwiększyć siłę ogniową swojego konwoju. Poszukaj w stoczniach miast gubernatorskich najsilniejszego statku, na jaki cię stać.<n><n>Następnie dodaj ten statek do swojego konwoju i weź na pokład więcej dział i żeglarzy. Jeśli masz za mało złota, pohandluj jeszcze trochę. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zwiększ siłę ognia swojego konwoju do co najmniej 90 dział."
"0x165fc28e" = "Odwiedź swoje nowe miasto i zbuduj stocznię."
"0x16656b80" = "%1 %2<g:scripts/intext_herz_800x600.screen>"
"0x1666a42c" = "%1, miło cię widzieć."
"0x1666a42d" = "Czekałem na ciebie, %1."
"0x1666a42e" = "Rad jestem, że cię widzę, %1."
"0x166c0813" = "%1,<n>to ty, prawda? Prawie cię nie rozpoznałam. Rozumiem, że twoje przygody zabierają ci mnóstwo czasu. Ale mógłbyś mnie odwiedzać częściej."
"0x166c0814" = "%1,<n>czy chcesz, żebym spędzała cały czas w tawernie szukając jakiegoś towarzystwa? Naprawdę powinieneś odwiedzać mnie częściej!"
"0x166c0815" = "%1,<n>proszę odwiedzających ten dom kupców, by pozostawali tu na cały dzień, tylko po to, by zapewnić sobie jakieś towarzystwo. Czy nie mógłbyś wpadać tu częściej?"
