"0xe1cdc367" = "Poznałeś kilka podstawowych sposobów prowadzenia gry i wiesz jak wysyłać konwój z jednego miasta do innego. To bardzo ważne, ponieważ początkowo będziesz zarabiać na życie transportując i handlując towarami między miastami.<n><n>W drugiej części tego scenariusza zbudujesz statek i dodasz go do istniejącego konwoju, który należy do ciebie.<n><n>Oto kolejna wskazówka:<n><n>Możesz w dowolnej chwili wcisnąć klawisz F1, aby wyświetlić stronę pomocy z opisem konfiguracji klawiatury i myszy.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Twój konwój z dwoma statkami musi dotrzeć do portu w mieście Cartagena."
