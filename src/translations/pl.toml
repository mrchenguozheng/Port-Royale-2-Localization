"0xc8bb0d22" = "Muszę uporać się z pewnym problemem. Muszę mieć stałe zapasy towaru: @G$Goods$ dla konwojów transportowych."
"0xc8bb0d24" = " Jednak wojna, którą @n$FoeNation$ prowadzi z nami, utrudniła to. Czy pomożesz mi? "
