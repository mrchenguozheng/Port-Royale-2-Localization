"0xe521a764" = "Codzienny koszt utrzymania"
"0xe5228143" = "Zapewniłeś bezpieczną podróż konwoju transportowego do Europy i jestem ci wdzięczny. Dlatego, mam dla ciebie prezent. To @S$ShipType$. Statek czeka w porcie."
"0xe53c68dd" = "Plaga szczurów"
"0xe547bff1" = "Statki<t>%1<t>%2<t>%3<n>"
"0xe5483876" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>LMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>wybierz jednostkę<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>wyślij jednostkę<n><f:fonts/Tiepolo_black14x14aaFHk.res>1..0<f:fonts/Tiepolo_bold14x14aaFH.res><t>wybierz jednostkę"
"0xe5630a04" = "transfer wszystkich statków"
"0xe56dc335" = "Potrzebnych %1 żołnierzy"
"0xe5743ad8" = "Cena zakupu"
"0xe57778f0" = "%1 pokonany"
"0xe606edc4" = "Nadal potrzebujesz %1, aby osiągnąć następną rangę"
"0xe62d04b5" = "Działa:"
"0xe6393b08" = "Konwój na morzu"
"0xe6490f96" = "Jest rok 1676 w holenderskim mieście gubernatorskim na Wyspach Turk. Holandia posiada siedem miast, z których pięć to miasta kolonialne, jedno to miasto gubernatorskie, a w jednym stacjonuje wicekról.<n><n>Anglia posiada 14 miast i od dłuższego czasu prowadzi wojnę z Holandią, która będzie trwała jeszcze przez wiele miesięcy. Dopóki trwa ta wojna, musisz w imieniu Holandii przejmować miasta od Korony Angielskiej.<n><n>Zanim jednak będziesz mógł zaatakować jakiekolwiek angielskie miasto, musisz mieć większy kapitał i więcej uzbrojenia w swoim konwoju. Twoim pierwszym celem jest pokonanie trzech angielskich konwojów kupieckich i przechwycenie ich statków.<n><n>Najpierw jednak musisz otrzymać list kaperski od holenderskiego gubernatora na Wyspach Turk.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Odwiedź gubernatora Wysp Turk i zdobądź list kaperski przeciwko Anglii."
"0xe64f1385" = "Bardzo dobrze! Zniszczyłeś jeden z pirackich konwojów Czarnobrodego. Teraz udaj się do gubernatora miasta @T$TOWN$ i odbierz swoją nagrodę.<n><n>Gubernator ma także dla ciebie następną misję do wykonania.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Wykonaj następną misję dla gubernatora miasta @T$TOWN$."
"0xe65025c3" = "w 1 mieście"
"0xe6510ae7" = "Musisz zwiększyć zapasy pszenicy, cegieł, bawełny, cukru i tytoniu do @a$Amount$ każdego towaru, zanim nadejdzie @D$EndDate$."
"0xe65524e7" = "Spraw, by twoje miasto miało zapasy @a$Amount$ wszystkich towarów."
"0xe674b971" = "Mapa skarbu"
"0xe67d58b9" = "Odkrycie złota"
"0xe6851da5" = "W ostatnim scenariuszu dowiedziałeś się, że twoja ranga zależy od twojej sumy aktywów. Na sumę twoich aktywów składa się posiadana przez ciebie gotówka, a także twoje budynki, statki i towary. W dowolnej chwili możesz ocenić stan swoich całkowitych aktywów na zakładce „Sukcesy”, w dzienniku.<n><n>Możesz także obejrzeć niebieski pasek wskazujący twoje doświadczenie. Jest on zawsze widoczny na dole ekranu, na podglądzie konwoju. Gdy pasek dosięgnie prawego końca ekranu, otrzymasz awans na następną rangę. Po osiągnięciu danej rangi, nie możesz jej stracić.<n><n>Im wyższą masz rangę, tym większą liczbą konwojów możesz dowodzić, a także w tym większej liczbie miast będziesz mógł zakładać przedsiębiorstwa. Po osiągnięciu określonej rangi, uzyskasz prawo do posiadania nieograniczonej liczby konwojów i zezwoleń na budowę."
"0xe6d65f53" = "Mieszkańcy"
"0xe6d9252d" = "%2 %1, a zatem to o tobie tak wiele opowiadał mój ojciec. Mam na imię %3. Czy przyłączysz się do mnie i opowiesz mi o swoich przygodach?"
"0xe6d9252e" = "Wydaje mi się, że już słyszałam o tobie, %1. Jestem %3, córka gubernatora. %2, zawsze chciałam spotkać kogoś takiego jak ty. Proszę, opowiedz mi o swoich przygodach!"
"0xe6d9252f" = "Ach, ty jesteś ten słynny %1! Słuchając opowieści o tobie wyobrażałam sobie, że jesteś znacznie wyższy. Ale to nie znaczy, że jesteś mniej interesujący! Podejdź tutaj i opowiedz mi o twoich przygodach! Słyszałam już tak wiele o tobie od mojego ojca, gubernatora."
"0xe6d92530" = "%1,<n>jestem tak szczęśliwa, że znowu cię widzę. Opowiedz mi, co się z tobą działo od czasu, gdy ostatni raz się widzieliśmy. Czy przywiozłeś coś dla mnie?"
"0xe6d92531" = "%1,<n>tak miło znowu cię widzieć. Nie przestawałam myśleć o tobie od czasu naszego ostatniego spotkania. Wejdź szybko do środka, mam ci mnóstwo do opowiedzenia."
"0xe6d92532" = "%1,<n>jestem tak szczęśliwa, że znowu przyszedłeś mnie odwiedzić. Opowiadałam wszystkim moim przyjaciółkom o twoich przygodach. Ale teraz musisz opowiedzieć mi więcej, bo dziewczęta czekają na nowe ciekawostki. Wchodź szybko."
"0xe6dea2e1" = "Tu mieszka %1 wicekról"
"0xe6e36437" = "Wspieraj miasto"
"0xe6f17db8" = "Przyjęcie weselne"
"0xe6f8a85f" = "Nie przybywa robotników"
"0xe71161b6" = "<n>%1"
"0xe7180853" = "Kapitan piratów"
"0xe725029c" = "Produkcja zewnętrzna"
"0xe7270933" = "<gs:TEXTFLUSS_KEINEHOEHE>%1  %2"
"0xe7519201" = "A zatem umowa stoi. Dostarcz mi @a$Amount$ towaru: @G$Goods$ na rynek. Będę tam czekał na ciebie, dopóki nie nadejdzie @D$EndDate$. Musisz dostarczyć towar za jednym razem."
"0xe77b3422" = "Nie mam dla ciebie innych wieści. Zobacz się ze mną ponownie, gdy wykonasz misję, którą ci zleciłem."
"0xe78a6f65" = "%1 %2"
"0xe78e5c6d" = "w tym mieście jest o wiele za mało żołnierzy"
"0xe799be68" = "%1 pirat %2 skaził znaczną ilość żywności w mieście. W rezultacie zapanował głód. Dopóki trwa głód, ceny pszenicy, owoców, kukurydzy i mięsa będą wysokie."
"0xe79fc3ee" = "Według załogi"
"0xe7a9acfb" = "Czy chcesz kupić list kaperski za %1 i ścigać statki naszych wrogów w imieniu Hiszpanii?"
"0xe7b85cf1" = "Czy naprawdę chcesz zlikwidować to przedsiębiorstwo?"
"0xe7ba475b" = "Bitwy morskie"
"0xe7bffbb6" = "Zapasy w mieście Tortura zostały zniszczone przez sabotażystów. Przepadło wiele zapasów miasta, a w rezultacie dramatycznie pogorszyła się jakość życia jego obywateli.<n><n>Twoim celem jest odnowienie zapasów miasta jak najszybciej się da, aby status miasta ponownie wzrósł.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Miasto musi osiągnąć status „nagłego rozwoju”, zanim nadejdzie @D$EndDate$."
"0xe7c31648" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Wybierz budynek<n><n><f:fonts/Tiepolo_bold14x14aaFH.res>Twoim pierwszym budynkiem w tym mieście musi być magazyn"
"0xe7c31649" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Wybierz budynek"
"0xe7d6570d" = "Twoja reputacja wśród narodów"
"0xe7ecbb16" = "Pościg za pirackim konwojem"
"0xe80564ba" = "Zajęcie miasta"
