"0xde535352" = "Niestety, w Tortudze wybuchła zaraza. Będzie szalała w mieście przez około miesiąc. Status miasta pogarsza się znacząco, a jego mieszkańcy umierają każdego dnia. Wielu mieszkańców jest przerażonych zarazą i ucieka.<n><n>Dla ciebie jako kupca, interesujący jest także fakt, że popyt na ubrania i drewno jest podwojony w mieście, dopóki szaleje w nim zaraza.<n><n>Twoje zadanie polega teraz za zapewnieniu miastu dostaw, dopóki trwa zaraza, aby liczba mieszkańców nie spadła.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Liczba obywateli (mieszkańcy minus żołnierze) musi zostać przywrócona do stanu @I$Pop$, nie później niż w ciągu 20 dni po zakończeniu zarazy. To zapewni, że przedsiębiorstwa będą miały pełną obsadę pracowników."
