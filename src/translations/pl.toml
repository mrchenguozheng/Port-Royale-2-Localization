"0xdfb4cddf" = "Tortuga w kłopotach"
"0xdfb549a4" = "%1 i my prowadzimy wojnę, ale wróg ma za mało konwojów wojskowych, aby bronić swoich wód. Chcę, żebyś to wykorzystał i przejął miasto."
"0xdfb549a5" = "%1 ma za mało konwojów wojskowych do obrony swoich wód! Powinniśmy natychmiast wyruszyć i przejąć miasto!!<n>Czy mogę polegać na tobie? "
"0xdfb9b5b7" = "Doskonale! Teraz masz @g$Gold$.<n><n>Każdy naród ma konwoje wojskowe, które bronią jego miast i wód wokół nich. Im więcej miast zajmuje naród, tym więcej konwojów wojskowych potrzebuje, aby zapewnić im odpowiednią obronę.<n><n>Gdy naród traci konwój wojskowy, jego siła militarna maleje. Ponieważ konwoje wojskowe podczas wojny są dość agresywne wobec miast wrogich narodów i konwojów, naród może od czasu do czasu tracić konwoje wojskowe. Z tego powodu, z Europy są regularnie wysyłane konwoje, które mają wzmacniać siłę militarną narodu w Nowym Świecie.<n><n>Możesz sprawdzić siłę narodu pod zakładką „Narody” w Kronice. Jeśli naród jest oceniony jako słaby, można przejmować jego miasta.<n><n>Teraz powinieneś pokonać tyle angielskich konwojów wojskowych, aby sprawić, że potęga Anglii zostanie oceniona jako „słaba”.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Pokonaj tyle angielskich konwojów wojskowych, aby Anglia została oceniona jako „słaba”."
