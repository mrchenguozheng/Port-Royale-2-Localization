"0xf214f69c" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Uratowałeś rozbitka, którego krajem pochodzenia jest @n$DestNation$. @N$Name$ oferuje ci znaczną nagrodę, jeśli wypuścisz go na brzeg w następnym mieście należącym do tego narodu."
"0xf214f69d" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Uratowałeś kupca imieniem @N$Name$ z miasta @T$DestTown$. Kupiec obiecuje ci dużą nagrodę, jeśli sprowadzisz go do jego miasta macierzystego."
"0xf214f69e" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Uratowałeś bardzo doświadczonego kapitana imieniem @N$Name$. Kapitan prosi, żebyś wypuścił go w mieście, którym włada @n$DestNation$."
"0xf214f69f" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Zabrałeś @I$Sailors$ rozbitków, którzy okazali się znajomymi części załogi. Przyjęcie powitalne podniosło morale załogi."
"0xf214f6a0" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Zabrałeś żeglarza, którego krajem pochodzenia jest @n$Nation$. W ramach podziękowania za ratunek, żeglarz mówi ci, gdzie możesz znaleźć wiele beczek cennych towarów pochodzących z rozbitego statku. @l$DebrisPos$"
"0xf214f6a1" = "<g:INTEXT_SCHIFFBRUECHIGER_800x600.screen><n>Uratowałeś księdza, którego krajem pochodzenia jest @n$DestNation$. Ksiądz nie może zapłacić ci za zabranie go do miasta należącego do jego kraju, ale obiecuje wstawić się w twoim imieniu, co poprawi twoją reputację, jakim darzy cię @n$DestNation$."
"0xf22583c4" = "Czy chcesz kupić list kaperski za %1 i ścigać statki naszych wrogów w imieniu Holandii?"
"0xf22a4fad" = "W mieście %1 wybuchła plaga szczurów. Spożycie pszenicy, owoców, kukurydzy i mięsa będzie dwukrotnie wyższe przez cały miesiąc. "
"0xf22b236f" = "Nie dostarczyłeś towarów na czas."
"0xf22d73b9" = "Aby produkować dobra kolonialne, potrzebujesz narzędzi. Podobnie, potrzebujesz surowców do produkcji towarów finalnych. Towary finalne to na przykład liny i sukno. Surowce do nich to juka i bawełna.<n><n>Teraz, gdy potrafisz budować przedsiębiorstwa produkcyjne, powinieneś zakupić zezwolenie na budowę w mieście gubernatorskim i zbudować tam wytwórnie towarów finalnych. Zanim jednak będziesz mógł kupić zezwolenie, musisz mieć solidny rejestr handlowy z miastem, co oznacza, że musisz sprzedawać miastu towary, których w nim brakuje.<n><n>Uważaj jednak! Jeśli wykupisz mało dostępny towar w jakimś mieście, będzie to miało negatywny wpływ na rejestr handlowy w tym mieście! Towary, których brakuje w mieście są wyświetlone na czerwono w oknie handlu.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Popraw swój rejestr handlowy w Cartagenie, aby móc zakupić tam zezwolenie na budowę."
"0xf24b293b" = "Wczytaj / Zapisz"
"0xf253afcd" = "Możesz wprowadzić szlak kupiecki, gdy kapitan konwoju ma %1 punktów doświadczenia. Teraz ma %2 punkty(ów)."
"0xf2590753" = "Dziękuję ci. Wygląda na to, że w najbliższym czasie nie dostaniemy żadnych towarów importowanych z Europy. Ponieważ aktualnie @n$HostileNation$ prowadzi z nami wojnę, mamy okazję zagarnąć towary z konwojów transportowych naszych wrogów, bez przechwytywania ani zatapiania ich statków.<n>Proszę, zdobądź po @a$Amount$ jednostek przypraw, wina i narzędzi, po czym dostarcz je do mojego kupca na rynku, zanim nadejdzie @D$EndDate$."
"0xf2590754" = "Twoja misja polega na zaatakowaniu i splądrowaniu konwojów transportowych, których właścicielem jest @n$HostileNation$, bez przechwytywania ani zatapiania ich statków. Następnie musisz dostarczyć towary na rynek. Masz czas, zanim nadejdzie @D$EndDate$."
"0xf2590755" = "Niech zatem tak będzie. Wyrusz na poszukiwanie konwojów transportowych, których właścicielem jest @n$HostileNation$ i zagarnij @a$Amount$ towarów importowanych, jakie znajdują się na pokładzie. Następnie, zanim nadejdzie @D$EndDate$, przekaż dobra kupcowi, który będzie czekał na ciebie na rynku. Rada: Z powodu bardzo napiętej sytuacji, jaka obecnie utrzymuje się w tym regionie, możesz tylko plądrować statki, ale nie wolno ci ich przechwytywać ani zatapiać!"
"0xf2593b17" = "Wygrałem %1."
"0xf2682c84" = "scenario001 - @I$Idx$"
"0xf285925a" = "Mój drogi panie %1,<n>może mógłbym wesprzeć cię pożyczką, abyś mógł pomóc nam w rozwijaniu tego miasta. Jaką kwotę masz na myśli?"
"0xf2a41570" = "Pirat atakuje kupca"
"0xf32d3ac2" = "%1 splądrowała legendarną hiszpańską flotę skarbów."
"0xf332daf7" = "Miejscowy kupiec jest gotów zapłacić ci %1 za obszar mieszkalny."
"0xf3537f2c" = "Datek"
"0xf353a9ce" = "Cieszę się, że cię widzę, @A$USER$. Zgubiłem paczkę płynąc tutaj. Czy mógłbyś znaleźć ją dla mnie?"
"0xf353a9cf" = "Witaj! Czy masz własny statek? Ja swój straciłem podczas niedawnego sztormu. Na szczęście, zdołałem się uratować, ale straciłem mój kufer zawierający wiele z moich najcenniejszych rzeczy osobistych. Może mógłbyś postawić żagle i sprawdzić, czy mój kufer nie unosi się nadal gdzieś na morzu? Nagrodzę cię bardzo hojnie, bowiem kufer jest dla nie niezwykle cenny."
