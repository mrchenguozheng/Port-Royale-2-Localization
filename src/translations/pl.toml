"0x1f15d242" = "Morale"
"0x1f2634aa" = "Kordelasy"
"0x1f28c5b6" = "Miasto %1 jest pełne"
"0x1f32f588" = "Scenariusz przegrany"
"0x1f36e96b" = "Niebawem przybędzie tu konwój transportowy. Szpieg powiedział mi, że nasz wróg zamierza zaatakować ten konwój podczas jego podróży powrotnej do Europy. Czy ochronisz konwój wracający do domu? "
"0x1f36e96c" = "Mam problem. Moja żona pragnie udać się do Europy następnym konwojem. Chce odwiedzić swoją rodzinę. Niestety, @n$HostileNation$ dowiedziała się o tym i planuje przechwycić konwój. Czy możesz zapewnić mojej żonie bezpieczną podróż?"
"0x1f36e96d" = "Wkrótce będę wysyłać ważne dokumenty do Europy. Obecnie @n$HostileNation$ prowadzi z nami wojnę, dlatego wolę nie ryzykować i chcę zorganizować dodatkową eskortę. Czy możesz zapewnić taką ochronę? "
"0x1f6696d2" = "Przykro mi, ale okazuje się, że nie mogę dać ci tej misji. Właśnie otrzymałem wiadomość, że problem już nie istnieje."
"0x1f851477" = "Konwój, który miał wykonać tę misję, został zniszczony."
"0x1f890b43" = "Popyt na towar"
"0x1f9a14b7" = "<n><n>Aby zaatakować kryjówkę, musisz wysłać konwój w ten sam sposób, w jaki wysyłasz go do miasta. Uważaj! Każdy konwój piracki, który nie będzie znajdował się w kryjówce gdy zaatakujesz, zostanie ostrzeżony i założy nową kryjówkę."
"0x1fb02f3a" = "Zapisz"
"0x1fcb6529" = "Zakończ bitwę morską"
"0x1fd35f28" = "Animacje"
"0x1fdba107" = " Jego codzienna pensja wynosi %1."
"0x1fe06eb2" = "Wydajność<n>%1%"
"0x1fe25594" = "Po przebiciu się przez fortyfikacje portu, twój konwój przybija do doków, a żeglarze wdzierają się do miasta. Po drodze spotykają dowódcę straży miejskiej. Dowódca nie chce ustąpić, dopóki nie zostanie pokonany w uczciwym pojedynku. Twój kapitan przyjmuje wyzwanie."
"0x1fea1f37" = "Przerwać bieżącą grę i wczytać zapis?"
"0x1ff731c7" = "Zapisz szlak kupiecki"
"0x200d4e11" = "%1 %2 %3"
"0x20252656" = "Odkryto złoto w okolicach miasta %1"
"0x20413ba0" = "<o:0xFF000096>%1<o:0xff000000><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>"
"0x204cf373" = "Wspieraj miasto"
"0x204d1e7c" = "Kryjówkę piratów można zaatakować tylko od morza."
"0x20574fcc" = "%1, przejąłeś ukochane miasto mojego ojca. Teraz rządzi nim %2! Nie chcę mieć z tobą do czynienia. Mam nadzieję, że nigdy nie zobaczymy się ponownie. Wiedz, że nigdy nic dla mnie nie znaczyłeś i nie poświęcę ci w przyszłości ani jednej myśli.<n>Szczerze wierzę, że wcześniej czy później doczekasz się kary, na którą tak bardzo zasługujesz.<n><n>%3"
"0x20574fcd" = "%1, zajmując miasto %2 zmusiłeś wicekróla, by przeniósł się do ukochanego miasta mojego ojca, który musi teraz wracać do Europy.<n><n>Nie chcę mieć z tobą więcej do czynienia. Mam nadzieję, że nigdy nie zobaczymy się ponownie. Chcę także, żebyś wiedział, że zawsze bardziej od ciebie interesowali mnie kupcy w tawernie. Nic dla mnie nie znaczysz i od tej chwili zamierzam o tobie zapomnieć.<n><n>Gorąco ufam, że wcześniej czy później doczekasz się kary, na którą tak bardzo zasługujesz.<n><n>%3"
"0x2065f070" = "Spójrz tutaj. Właśnie otrzymałem wiadomość od mojego ambasadora, który informuje mnie, że %1 złożyła nieoczekiwaną propozycję rozejmu. To oznacza, że zapewne już dzisiaj zawrzemy pokój. <n><n>A zatem, nie mogę dłużej zlecać ci misji przejęcia miasta."
"0x207295a1" = "Istnieje już szlak kupiecki o nazwie „%1”.<n><c>Czy chcesz go zastąpić?"
"0x2077407d" = "%1,<n>cieszę się, że przyszedłeś. Wejdź, a zobaczę, czy mam coś dla ciebie."
"0x207a9d35" = "Dowódca straży miejskiej woła do twojego kapitana z murów miejskich, wzywając go, by odwołał bitwę i zamiast tego stoczył z nim pojedynek. Twój kapitan zgadza się chcąc uniknąć dalszych strat."
"0x207b620f" = "Gdy twoi żołnierze zniszczyli bramę miasta, stanęli przed dowódcą straży miejskiej. Dowódca wyzywa twojego kapitana na pojedynek."
"0x208aca1b" = " Wypatruj angielskich konwojów w tej okolicy i zniszcz @I$NumConvoys$ z nich."
"0x208aca1c" = " Wypatruj francuskich konwojów w tej okolicy i zniszcz @I$NumConvoys$ z nich."
"0x208aca1d" = " Wypatruj holenderskich konwojów w tej okolicy i zniszcz @I$NumConvoys$ z nich."
"0x208aca1e" = " Wypatruj hiszpańskich konwojów w tej okolicy i zniszcz @I$NumConvoys$ z nich."
"0x209d658e" = "Data"
"0x20abe2eb" = "Alan Wild"
"0x20b21199" = "Sprzedaj  "
"0x20b2119a" = "Oddaj"
"0x20ccd2d7" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen>"
"0x20d2607a" = "Dobra robota! Tortuga ponownie ma status „nagłego rozwoju”. Ukończyłeś to zadanie w ciągu @I$Days$ dni."
"0x20de74a6" = "Pościg za statkiem"
"0x20e2a2f4" = "Średnia za 1 dzień. Średni dochód dzienny %1."
"0x20eedea9" = "Nie można zapisać szlaku kupieckiego."
"0x20eef526" = "<ts:80><ts:145><ts:210><n>Wynik bitwy:<n><n>"
"0x20ff905e" = "Załoga"
"0x2106ce9e" = "Doświadczony kapitan czeka w tawernie."
"0x21117682" = "<n><n>Zwykle możesz oddać zdobyte zezwolenie na budowę. Jednak w tym przypadku nie możesz tego zrobić, ponieważ %1 to miasto, w którym rozpocząłeś grę."
"0x21117683" = "<n><n>Czy chcesz oddać zezwolenie?<n>Pamiętaj, że nic za to nie zapłacę!"
"0x211c8552" = "Czas gry upłynął"
"0x2137ec23" = "Dziękuję ci. Zapłacę hojnie za wino, narzędzia i przyprawy, dopóki nie nadejdzie @D$Date$. Spotkaj mojego wysłannika na rynku i dostarcz @a$Amount$ każdego z tych towarów. Wysłannik przyjmie tylko kompletną dostawę i zapłaci ci od razu, na miejscu."
"0x2137ec24" = "To brzmi dobrze. A zatem, podróżuj do miast naszych wrogów i wykupuj tam dobra importowane. Dostarcz @a$Amount$ każdego z towaru, zanim nadejdzie @D$Date$, mojemu wysłannikowi na rynku miasta @T$TOWN$. On zapłaci ci dwa razy więcej niż wynosi zwykła cena."
"0x2137ec25" = "Czy wiesz, co byłoby najlepsze? Wykupienie importowanych towarów, które posiada @n$Nation2$ i wywołanie tam ich braku. Dostarcz @a$Amount$ każdego towaru na rynek. Mój wysłannik będzie tam czekał, aż nadejdzie @D$Date$, i zapłaci ci wysoką cenę."
"0x215e37a6" = "Ostatnio podsłuchałem rozmowę, podczas której pewien kupiec wspomniał, że zatonął jeden z jego statków. Nie dbał zbytnio o sam statek, bo to była stara łajba. Ale miała na pokładzie szczególną skrzynię."
"0x215e37a7" = "A zatem, mamy umowę. Podczas ostatniej wyprawy, na którą się pisałem, kapitan z jakiegoś powodu wściekł się na skrzynię, którą po prostu wyrzucił za pokład."
"0x215e37a8" = "Pewien człowiek, który był kiedyś moim dobrym przyjacielem, uciekł z cenną skrzynią, która należy do mnie."
"0x2167838b" = "Zakup statku"
"0x21743bf7" = " Muszę odzyskać te rzeczy! Nie wiem dokładnie, gdzie zatonął statek. @l$ChestPos$ Sprowadź mi skrzynię, zanim nadejdzie @D$EndDate$."
"0x21743bf8" = " Musisz dostarczyć mi te rzeczy, zanim nadejdzie @D$EndDate$. @l$ChestPos$"
"0x21743bf9" = " Dopiero niedawno napisał mi, gdzie wyrzucił tę skrzynię za pokład. @l$ChestPos$ Musisz sprowadzić do mnie moje rzeczy! Znajdziesz mnie tutaj, dopóki nie nadejdzie @D$EndDate$."
"0x217923cb" = "Koniec przekazania towarów: %1"
"0x2190d204" = "Miejscowy kupiec jest gotów zapłacić ci %1 za przedsiębiorstwo."
"0x21a69afe" = "Dyrektor sprzedaży"
"0x21b0dfff" = "%1 plądruje miasto %2"
"0x21b3050a" = "Konwój wojskowy zniszczył umocnienia nadbrzeżne miasta i splądrował miasto. Status miasta pogorszył się."
"0x21bdc952" = "następny wykres"
"0x21bf83f0" = "Stałe wyświetlanie informacji o statku"
"0x21c2f2cf" = "<n><o:0xffC00000>Misja nie została wykonana. <o:0xff000000>"
"0x21cae149" = "Bardzo dobrze! Teraz musisz sprawić, by twój konwój stał się na tyle potężny, aby mógł poradzić sobie z kilkoma konwojami wojskowymi. Musisz mieć w swoim konwoju co najmniej trzy statki, które są fregatami lub większe.<n><n>Możesz przechwytywać statki, albo próbować je kupić w stoczniach miast gubernatorskich.<n><n>Oznacz te statki jako eskortę i zadbaj, by zostały w pełni uzbrojone i obsadzone żeglarzami.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Uzbrój swój konwój, aby miał co najmniej trzy w pełni uzbrojone i obsadzone statki eskorty, które są fregatami lub większymi statkami. "
"0x21d142f5" = "Napraw konwój w tym mieście"
"0x21e727b4" = "Jestem pewien, że słyszałeś już o piracie, znanym jako @P$PirateName$. Ten pirat ma już @I$NumConvoys$ konwojów, a jeszcze nie odnaleźliśmy jego kryjówki. Na szczęście, wiemy gdzie znajduje się jeden z jego konwojów. Być może nadal jest niedaleko stąd. Chciałbym, żebyś zniszczył ten konwój. "
"0x21e727b5" = "Musimy działać szybko, ponieważ właśnie dowiedziałem się, gdzie znajduje się jeden z konwojów, które należą do pirata zwanego @P$PirateName$. Znajdź i zniszcz ten konwój."
"0x21e727b6" = "Wszyscy piraci mają swoje kryjówki, skąd wysyłają konwoje na wyprawy łupieżcze. W międzyczasie, pirat @P$PirateName$ zgromadził flotę liczącą @I$NumConvoys$ konwojów. Zrządzeniem losu odkryłem, gdzie ostatnio podziewał się ważny kapitan należący do jego gangu, wraz ze swoim konwojem. Chciałbym, żebyś znalazł i zniszczył ten konwój."
"0x21f9ce44" = "Głód w mieście %1"
"0x2204d118" = "Działające przedsiębiorstwa/suma"
"0x22163917" = "<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_SCHIFF_800x600.screen>"
"0x2225ed1a" = "Łowy na statki"
"0x22385c1b" = "Statek"
"0x22385c1c" = "Normalny"
"0x22385c1d" = "Złoto"
"0x22481c3e" = "Mieszkańcy / Maksimum"
"0x22497d5c" = "Status miasta jest niski."
"0x22584831" = "Spotkaj się z piratem"
"0x226068b3" = "Zły stan statków"
"0x227ca1f5" = "<f:fonts/Tiepolo_black13x13aaFHk.res>Broń portu miasta<n><f:fonts/Tiepolo_bold13x13aaFHk.res>(konwój jest w porcie i obecny jest statek eskorty)"
"0x22a3b6d0" = "Poszukiwanie skarbu"
"0x22b99c70" = "Czy chcesz zburzyć ostatnio zbudowany magazyn?"
"0x22caa09f" = "%1. %2 %3"
"0x22e58881" = "Tryb ataku"
"0x22fffe32" = "Mój drogi %1,<n>ledwo powstrzymuję swoją niecierpliwość. Proszę, pospiesz na rynek i dostarcz towary na wesele, żebyśmy jak najprędzej mogli wydać bankiet."
"0x2310e7f4" = "Aby wyświetlić cel następnego scenariusza, musisz ukończyć swoją misję przejęcia miast."
"0x2335f663" = "Dziękuję ci za zwrot paczki. Oto twoja nagroda, w wysokości @g$Reward$."
"0x234d00d9" = "Dzisiaj, pirat %1 zaczął siać zamęt na Karaibach."
"0x23652698" = "Niestety, nie mogę powiedzieć nic pewnego. Mój dowódca portu podał mi jedynie przybliżony opis statku, który być może zabrali. Pewien kupiec zauważył ten statek na morzu i pokazał mi to miejsce. @l$Pos$ Przeszukaj ten obszar, a może znajdziesz jakieś wskazówki."
"0x23652699" = "Oto pozycja: @l$Pos$. Przeszukaj ten obszar, a może znajdziesz jakieś wskazówki. Proszę, sprowadź do mnie moją córkę zdrową i całą."
"0x2365269a" = "Oto pozycja: @l$Pos$. Przeszukaj ten obszar, może @F$WifeName$ chciała nam coś przekazać, gdy o tym wspomniała. Proszę, sprowadź do mnie moją córkę zdrową i całą. A jeśli natrafisz na tego Casanovę, pozdrów go odpowiednio ode mnie."
"0x23815ece" = "Czy na pewno chcesz wyjść z aktualnej gry i wrócić do menu głównego?"
"0x2388c117" = "(brak wymaganych towarów na pokładzie)"
"0x238c039b" = "Organizator festynów"
"0x239bed4a" = "Nie możesz dodać więcej niż 10 statków do konwoju."
"0x23a8f980" = "Wczytaj / Zapisz"
"0x23f0ed65" = "@n$HostileNation$ prowadzi z nami wojnę. Ostatnio pewien mój kapitan wpadł na sprytny sposób, by osłabić morale @n$HostileNation$. Zaproponował sformowanie konwoju wojskowego ze statków naszego wroga, by dać im przedsmak własnej metody, że się tak wyrażę.<n>Wygląda na to, że jesteś właśnie człowiekiem, który zdobędzie dla nas te statki."
"0x23f0ed66" = "Ponieważ jeszcze raz @n$HostileNation$ wojuje z nami, chcę utworzyć nowy konwój do obrony mojego miasta. Nie zamierzam czekać, aż zostanie mi przydzielony nowy konwój wojskowy z Europy.<n>Niestety, moje zasoby są obecnie bardzo ograniczone i dlatego wpadłem na pomysł, żeby wykorzystać statki naszego wroga. Czy zechcesz pomóc mi w schwytaniu kilku statków typu: @S$ShipType$?"
"0x23f33e8d" = "Konwój  "
"0x2410e373" = "Nie masz dostępnego konwoju w tym mieście"
"0x241395ec" = "Położenie twojej żony"
"0x242085c1" = "%1: Atak piratów odparty"
"0x24208781" = "Miasto %1 splądrowane przez piratów"
"0x242edadf" = "Tubylcy zaatakowali miasto i splądrowali jego towary luksusowe. W wyniku ataku życie straciło %1 obywateli."
"0x24353b95" = "Projekt opakowania"
"0x2439d933" = "Magazyn w mieście %1"
"0x244f3294" = "%1 - %2"
"0x245a69cf" = "Głód"
"0x2460ebfb" = "Koszt  "
"0x2461f4a9" = "Zniszcz kryjówkę piratów"
"0x24646e0b" = "Pinasa"
"0x24646e0c" = "Slup"
"0x24646e0d" = "Bryg"
"0x24646e0e" = "Bark"
"0x24646e0f" = "Piracki bark"
"0x24646e10" = "Fleuta "
"0x24646e11" = "Fleuta kupiecka"
"0x24646e12" = "Korweta"
"0x24646e13" = "Fregata"
"0x24646e14" = "Korweta wojenna"
"0x24646e7c" = "Fregata wojenna"
"0x24646e7d" = "Galeon"
"0x24646e7e" = "Karaka"
"0x24646e7f" = "Karawela"
"0x24646e80" = "Galeon wojenny"
"0x24646e81" = "Okręt liniowy"
"0x24646e82" = "Okręt - premia"
"0x24646e83" = "Kanonierka"
"0x24695110" = "Dziękuję ci. Jestem kupcem z miasta @T$Town$. Ponieważ moi prześladowcy nie wiedzą, gdzie przebywam, z pewnością będą próbowali złapać mnie w moim macierzystym mieście. Rozpocznij tam swoje poszukiwania i zabij łowców nagród. Muszę wyjechać stąd, zanim nadejdzie @D$EndDate$. Jeśli wykonasz misję przed tym terminem, zapłacę ci @g$Reward$."
"0x24695111" = "Muszę pilnie wrócić do miasta @T$Town$, ponieważ mam tam do załatwienia pewne interesy, zanim zniknę na dobre. Niestety, szlaki do miasta @T$Town$ są obserwowane przez łowcę nagród, którego musisz zabić. Dam ci w nagrodę @g$Reward$, jeśli wykonasz tę misję, zanim nadejdzie @D$EndDate$."
"0x24695112" = "Dziękuję ci! Podejrzewam, że łowca nagród obserwuje wejście do portu w mieście @T$Town$.<n>Oto co zrobimy: rozpuszczę plotkę, że zamierzam zaokrętować się na jeden z twoich okrętów, a potem wyruszysz do miasta @T$Town$ i przekonamy się, co się stanie.<n>Zanim nadejdzie @D$EndDate$ chcę dowiedzieć się, że wybrzeże jest czyste, a potem wypłacę ci nagrodę w wysokości @g$Reward$."
"0x246aece6" = "%1: Głód"
"0x2478c95f" = "Gratulacje! Udało ci się pomyślnie ukończyć ten scenariusz i uwolnić Karaiby od zmory znanego pirata.<n><n>W ciągu gry, kryjówki piratów będą się pojawiały same z siebie. Jednak liczba pirackich konwojów zależy od twoich postępów w grze. Zauważ, że piraci chcą tylko plądrować konwoje kupieckie i wystrzegają się konwojów wojskowych. Z tego powodu unikaj wód, gdzie krąży zbyt wiele konwojów wojskowych.<n><n>W trybie wolnej gry także możesz ścigać piratów i wykurzać ich z kryjówek. "
"0x24802954" = "%1: Statek zatopiony"
"0x2487ab5c" = "Bilans"
"0x248f1e26" = "Kryjówka pirata zwanego %1"
"0x24901249" = "%1 z %2 żeglarzy chce przyłączyć się do twoich przygód."
"0x24a0f898" = "Stocznia"
"0x24b0fd83" = "Cecha "
"0x24c12812" = "Gratulacje! Powierzono ci misję przejmowania miast!<n><n>Ponieważ miasta mogą być bardzo silnie bronione, musisz wybrać angielskie miasto z minimalną liczbą wież strzelniczych w jego porcie. Miasto @T$SampleTown$ to doskonały cel.<n><n>Aby zaatakować miasto, aktywuj opcję ataku na miasto w swoim konwoju. Aby to zrobić, wybierz swój konwój i kliknij na przycisku trybu ataku.<n><n>Możesz zaatakować miasto zarówno z morza, jak i od strony lądu. Nie powinieneś jednak ryzykować ataku od lądu, dopóki twoi żeglarze nie przewyższają liczebnie żołnierzy w mieście. W takim przypadku powinieneś także uzbroić połowę swoich żeglarzy w kordelasy i połowę w muszkiety.<n><n>Uwaga: Jeśli w porcie miasta znajduje się konwój wojskowy, musisz pokonać ten konwój przed atakiem na samo miasto.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Ukończ misję przejmowania miast."
"0x24e18ac4" = "<f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x24ec3366" = "Doskonale! Teraz twój konwój jest uzbrojony i gotowy do pościgu za jednym z pirackich konwojów Czarnobrodego.<n><n>W oknie wydarzeń pojawiają się codziennie wskazówki, które pomogą ci znaleźć piracki konwój, o ile znajduje się na morzu. Znalezienie piratów może być trudne, ponieważ po udanym ataku na statek kupiecki zawsze wracają do swojej kryjówki.<n><n>Pamiętaj, że konwój piracki może mieć do pięciu okrętów. Wzmocnij swój konwój, jeśli uznasz, że nie jest dość silny. Wiesz już jak zdobyć więcej złota.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel misji<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Wykonaj misję zleconą ci przez gubernatora miasta @T$TOWN$."
"0x250c7a12" = "Dostarcz @a$Amount$, zanim nadejdzie @D$Date$. Możesz przekazać dobra na rynku, gdzie natychmiast otrzymasz zapłatę w wysokości @g$GoldPerBarrel$ za każde <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> towaru: @G$Goods$."
"0x250c7a13" = "Jestem zachwycony. Proszę, dostarcz @a$Amount$ na rynek. Tam otrzymasz zapłatę w wysokości @g$GoldPerBarrel$ za każde <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>, zanim nadejdzie @D$Date$."
"0x250c7a14" = "Proszę, spotkaj się z moim wysłannikiem na rynku. Przekaż mu @a$Amount$ towaru: @G$Goods$, zanim nadejdzie @D$Date$, on zaproponuje ci dobrą cenę."
"0x2540ea42" = "Dodatkowy tekst (kronikarz)"
"0x2546beb9" = "A zatem, przysłał cię do mnie @N$OwnerName$? Tak, znam tego starego kapitana. Z pewnością mógłby nauczyć twoją załogę paru rzeczy. Dlaczego jednak miałbym ci pomóc? Ale nie chcę robić problemów. Doceniam to, że spędziłeś czas, żeby mnie odnaleźć. Jeśli wyświadczysz mi małą przysługę, powiem ci, gdzie przebywa ten kapitan."
"0x2546beba" = "Nie znam nikogo imieniem @N$OwnerName$, ale z pewnością wiem gdzie przebywa @N$TeacherName$. Sądzę, że mógłbym ci to powiedzieć, gdybym zechciał. A może ty zrobisz coś dla mnie, a wtedy ja dla ciebie? "
"0x2546bebb" = "Nie dbam o to, czy przysłał cię @N$OwnerName$, czy garbaty Wielki Wezyr Taipei! Mam problem. I dopóki nie zostanie rozwiązany, nie interesuje mnie nic innego. Mam propozycję: może ty znajdziesz dla mnie pewną skrzynię, a ja powiem ci, gdzie ukrywa się ten szalony, stary @N$TeacherName$?"
