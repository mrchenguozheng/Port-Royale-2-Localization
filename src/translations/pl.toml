"0xe38974d7" = "Bilans:"
"0xe3922641" = "Igła busoli obraca się bardzo swobodnie i szybko ustawia się we właściwym położeniu. Nigdy nie widziałeś tak dokładnej busoli.<n>Busola została umieszczona w kunsztownej obsadzie, a jej spód zdobią różne grawerowane znaki."
"0xe3922642" = "Para kompasów doskonale leży w dłoni. Bardzo łatwo się ich używa. Zdobi je zawiły wzór i wydaje się, że zostały w całości wykonane ze złota."
"0xe3922643" = "Sekstans pozwala ustalić dokładne położenie nawet na dalekim morzu. Części sekstansu zostały zamontowane na sprężynach, które osłabiają silne drgania."
"0xe3922644" = "Ten przyrząd to podwójna luneta, która umożliwia patrzenie w dal jednocześnie oboma oczami. Dla ochrony wzroku możesz zesunąć na soczewki barwione szkła. Z boku można dostrzec tajemnicze ryty."
"0xe3922645" = "To zwykły złoty zegarek, ale nigdy nie widziałeś tak małego zegarka. Na dysku pod cyferblatem dostrzegasz także księżyc, który wydaje się powoli obracać. Na spodzie zegarka jest też kilka wyrytych symboli."
"0xe3922646" = "Lampa przypomina normalną latarnię. Jednak wokół jej knota zamontowano wiele lusterek, które sprawiają, że światło świeci tylko w jedną stronę. Używając czegoś w rodzaju wachlarza zasuwanego na wylot latarni, możesz bardzo szybko tłumić światło lub otwierać je."
"0xe3922647" = "Suwak, który można przesuwać w jedną i drugą stronę jest zamontowany w drugim suwaku. Do niego przymocowany został przesuwający się wskaźnik z przezroczystego materiału. Możesz używać tego urządzenia do bardzo szybkiego przeprowadzania prostych obliczeń."
"0xe3922648" = "To dziwne urządzenie przypomina strzałę. Umieszczone na nim łopatki wprawiają urządzenie w ruch obrotowy, gdy zostanie zanurzone w wodzie. Niewielka tarcza zlicza każdy obrót, dzięki czemu można bardzo dokładnie obliczyć prędkość statku."
"0xe3922649" = "Ten instrument składa się z obracających się łopatek i tarczy, która pokazuje ich prędkość obrotową. Unosząc łopatki w powietrze, gdzie są obracane przez wiatr, możesz ustalić kierunek i prędkość wiatru. Przyrząd jest pieczołowicie wykonany i oznaczony nieznanym symbolem."
"0xe392264a" = "Chociaż ta lina musiała być przez pewien czas poddawana działaniu słonej wody, wygląda jakby dopiero została wykonana. Jest zdumiewająco gładka w dotyku i można na niej wiązać bardzo mocne węzły."
"0xe39226b2" = "Ta teczka zawiera liczne, piękne mapy gwiazdowe. Duża tabela określa dokładnie gdzie i kiedy każda z gwiazd wschodzi i zachodzi za horyzontem."
"0xe39226b3" = "Pięknie grawerowany, okrągły dysk, w którym umieszczone są różne mniejsze dyski. Można go używać do ustalenia, jaka część nieba gwiaździstego jest widoczna w danej chwili, w zależności od daty i pory dnia.<n>Znaki na dysku wskazują, że ten przyrząd był kiedyś używany do ustalania pozycji statku w określonym regionie."
"0xe39226b4" = "Gdy przekręcasz rączkę, duża tuba emituje słodkie dźwięki kobiecego śpiewu. Doskonała rzecz dla żeglarzy od tygodni podróżujących po dalekim morzu."
"0xe39226b5" = "Duży kawałek okrągłego szkła zamontowany na końcu złotego trzonka. Gdy przytrzymasz urządzenie nad mapą, drobne linie staną się wyraźnie widoczne nawet przy słabym oświetleniu."
"0xe39226b6" = "Ten mały metalowy stolik jest wykonany z twardego brązu i zbudowany w taki sposób, że zawsze pozostaje w pozycji poziomej, bez względu na nachylenie statku. Zewnętrzną metalową krawędź zdobią ryty, które wydają się wskazywać kierunki świata. Nie potrafisz jednak określić regionu, w którym był kiedyś używany ten stolik."
"0xe39226b7" = "Małe pudełko zawiera kunsztowne urządzenie, dzięki któremu bardzo łatwo można rozpalać ogień. Pudełko pokryte jest tajemniczą grawerką."
"0xe39226b8" = "Ta kotwica ma przeznaczenie bardziej ozdobne niż praktyczne. W najlepszym razie może posłużyć jako kotwica dla szalupy wiosłowej.<n>Jest bardzo ciężka jak na swoje rozmiary. Pokrywają ją zawiłe zdobienia oraz nierozpoznawalne litery."
"0xe39226b9" = "To urządzenie przypomina lampkę oliwną z własnym krzesiwem. Gdy obrócisz niewielkie kółko, na knot sypią się iskry, które zapalą go nawet przy najsilniejszym wietrze."
"0xe39226ba" = "W ten róg nie dmie się ustami, ale za pomocą urządzenia przypominającego miech. Gdy naciśniesz go mocno, róg wydaje z siebie dźwięk głośniejszy, niż można by przypuszczać."
"0xe39226bb" = "Ta mapa bardzo różni się od zwykłych, dostępnych powszechnie map morskich. Jest bardzo szczegółowa i została oznaczona za pomocą różnych kolorów. Nie potrafisz jednak określić, jaki obszar został pokazany na tej mapie."
"0xe39bb702" = "Konwój nie może postawić żagli, ponieważ na pokładzie jest zbyt wiele dział. Sprzedaj część dział, albo przenieś je do swojego magazynu, aby nie przekroczyć maksymalnej liczby dział."
"0xe3b79f69" = "Zmniejsz tempo gry"
