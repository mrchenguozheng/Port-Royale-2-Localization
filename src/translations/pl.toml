"0xe3de2671" = "Twój konwój wydobył z morza skrzynkę zawierającą jeden z dokumentów gubernatora."
"0xe3de2672" = "Udało ci się zabrać na pokład wszystkie dokumenty gubernatora. Zabierz dokumenty do miasta @T$TOWN$ "
"0xe3e1d467" = "%1,<n><n>Nie możesz kupić żadnych zezwoleń, ponieważ twoja reputacja w moim narodzie jest zbyt niska, a poza tym za mało zrobiłeś dla tego miasta.<n><n>Popraw swoją reputację w moim narodzie i handluj z moim miastem, aby poprawić swój rejestr handlowy, a wtedy porozmawiamy ponownie."
"0xe3e1d468" = "%1,<n><n>Twoja reputacja w moim narodzie jest zbyt niska. Obawiam się, że nie mogę sprzedać ci żadnych zezwoleń.<n><n>Wróć, kiedy twoja reputacja poprawi się."
"0xe3e1d469" = "%1,<n><n>Za mało handlowałeś z tym miastem. Dostarczaj towary, na które jest popyt, aby poprawić swój rejestr handlowy. Tylko wtedy będziesz mógł kupić zezwolenie."
"0xe3e33a30" = "Niech %1 będzie twoim nowym miastem. Możesz teraz wchodzić do niego jak do innych miast i wznosić tam budynki oraz zakładać przedsiębiorstwa.<n>Nie masz jeszcze dostępu do całej dzielnicy, ale jeśli przejmiesz jeszcze kilka miast, dam ci ziemię, której potrzebujesz."
"0xe3fa97eb" = "A zatem, wszystko ustalone. Sprowadź @a$Amount$ narzędzi do miasta @T$DestTown$. Na rynku otrzymasz @g$GoldPerBarrel$ za każde <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>. Towary muszą zostać dostarczone, zanim nadejdzie @D$Date$."
"0xe3fa97ec" = "Niech zatem tak będzie. Dostarcz @a$Amount$ do miasta @T$DestTown$. Narzędzia muszą dotrzeć, zanim nadejdzie @D$Date$. "
"0xe3fa97ed" = "Dobrze! Zlecam ci zdobycie @a$Amount$ narzędzi. Dostarcz je zanim nadejdzie @D$Date$ do miasta @T$DestTown$. Na rynku otrzymasz zapłatę w wysokości @g$GoldPerBarrel$ za każde <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>."
