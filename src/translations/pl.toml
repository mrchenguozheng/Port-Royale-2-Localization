"0xe821614a" = "<g:INTEXT_SCHATZKISTE_800x600.screen><n>Używając swojej mapy skarbów udało ci się odnaleźć skarb.<n>@g$Gold$"
"0xe830d90e" = "%1,<n>Z radością sprzedałbym ci zezwolenie na stawianie budynków w tym mieście. Jednak z twoją rangą możesz mieć tylko %2 zezwoleń, a właśnie tyle już masz.<n><n>Wróć, kiedy będziesz miał wyższą rangę. "
"0xe84690dc" = "Aby zmienić szczegóły, kliknij na mieście. Użyj myszy aby dodać/usunąć towar. "
"0xe8469fdd" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>Kronika<n><f:fonts/Tiepolo_black14x14aaFHk.res>%2<f:fonts/Tiepolo_bold14x14aaFH.res><t>Dziennik<n><f:fonts/Tiepolo_black14x14aaFHk.res>%3<f:fonts/Tiepolo_bold14x14aaFH.res><t>Lista konwoju<n><f:fonts/Tiepolo_black14x14aaFHk.res>CTRL<f:fonts/Tiepolo_bold14x14aaFH.res><t>Rozmiar jednostki<n><t>Okno handlu<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>Zamknij okno dialogowe"
"0xe84971d5" = "Żona"
"0xe84c0654" = "Mam pewien problem związany z miastem @T$Town$. Obiecałem mojej żonie, że dopilnuję, by została tam wybudowana szkoła. Niestety, moje stosunki z mistrzem budowlanym pozostają niezwykle wrogie. Nigdy nie pozwoli mi wtrącać się w sprawy jego miasta. Może ty zbudujesz dla mnie tę szkołę?"
"0xe84c0655" = "Chciałbym zbudować szkołę w mieście @T$Town$, aby zwiększyć moją reputację w tym mieście. Prawdę mówiąc, @T$Town$ nic dla mnie nie znaczy, ale tam mieszka moja siostra, która za nic nie przyjmuje do wiadomości, że istnieją lepsze miasta."
"0xe84c0656" = "Wicekról nakazał mi wsparcie miasta @T$Town$. W związku z tym z radością opłacę budowę szkoły w tym mieście. Jednakże rada miejska odrzuciła moją ofertę, ponieważ nie chcą mojego udziału i woleliby raczej dostać bezpośrednio całe złoto. Dlatego też, pragnę poprosić ciebie o wybudowanie tej szkoły."
"0xe88ea6ee" = "Według nazwy konwoju"
"0xe8925b0d" = "Pojedynek"
"0xe894ba6f" = "<f:fonts/Tiepolo_bold14x14aaFH.res>Twój kapitan jest po lewej stronie. Kontrolujesz go w następujący sposób:<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Atak<f:fonts/Tiepolo_bold14x14aaFH.res><n>Aby zaatakować, kliknij na wybranej części ciała twojego przeciwnika. Klikaj na różnych częściach jego ciała, aby zwiększyć swoją szansę trafienia.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Obrona<f:fonts/Tiepolo_bold14x14aaFH.res><n>Gdy twój przeciwnik szykuje się do ataku, musisz we właściwym momencie kliknąć prawym przyciskiem myszy, aby sparować atak.<n> <n><f:fonts/Tiepolo_black14x14aaFHk.res>Ataki specjalne<f:fonts/Tiepolo_bold14x14aaFH.res><n>Wciśnij lewy przycisk myszy na chwilę zanim twój kapitan wróci do pozycji startowej po ataku.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Wytrzymałość<f:fonts/Tiepolo_bold14x14aaFH.res><n>Każdy atak zmniejsza wytrzymałość twojego kapitana, który odzyskuje siły między atakami.<n><n><f:fonts/Tiepolo_black14x14aaFHk.res>Czas reakcji<f:fonts/Tiepolo_bold14x14aaFH.res><n>Im więcej pojedynków wygrasz, tym szybciej musisz reagować."
"0xe8aae87c" = "(lista miast została zmieniona, szlak ponownie wytyczony)"
"0xe8b8bf24" = "%1: %2 odparła atak"
"0xe8b8c0e4" = "%2 plądruje miasto %1"
"0xe8d7e960" = "%1,<n>znamy się już od tak dawna, a moje serce pragnie należeć tylko do ciebie. Czy poprosisz mojego ojca o moją rękę?"
"0xe8d7e961" = "%1,<n>muszę z tobą porozmawiać. Mój ojciec niczego bardziej nie pragnie, niż wybrać bogatego szlachcica, aby poślubił jego córkę. Ale moje serce należy do ciebie. Czy poprosisz ojca o moją rękę?"
"0xe8d7e962" = "%1,<n>moje serce skacze z radości, za każdym razem gdy się spotykamy. Ale mój ojciec grozi, że wyda mnie za jakiegoś niedoszłego szlachetkę. Tylko ty jeden możesz ocalić mnie przed takim losem. Czy poprosisz ojca o moją rękę?"
