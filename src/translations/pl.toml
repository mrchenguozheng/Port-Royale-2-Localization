"0x32ec0f01" = "%1,<n>mój drogi przyjacielu, jestem tak szczęśliwy, że cię widzę. Mam nadzieję, że dobrze ci się wiodło, odkąd widzieliśmy się po raz ostatni."
"0x32ec0f02" = "%1,<n>jesteś mile widziany w moim domu. Wejdź. Porozmawiajmy przez chwilę."
"0x32f1c30f" = "Scenariusz wprowadzający<n><n>Ten scenariusz poświęcony jest transportowi i handlowi towarami. Dostaniesz wskazówki, które doradzą jak osiągać wysokie zyski i dowiesz się, jak tworzyć nowe konwoje."
"0x33045442" = "Pirat %1 "
"0x3327e51b" = "Markus Wilding"
"0x3337aa7e" = "Normalne miasto"
"0x334585f4" = "Zaraza"
"0x334d5256" = "Zasady  "
"0x3353aa4c" = "Doskonale! Teraz powinieneś przejąć więcej angielskich miast w imieniu Holandii. Ale nie ociągaj się, ponieważ możesz przejmować miasta tylko dopóki Holandia i Anglia toczą ze sobą wojnę. <n><n>Jak zwykle, misje tego rodzaju może przydzielić ci wicekról na Wielkich Bahamach. Zanim otrzymasz kolejne misje przejmowania miast, musisz coś zrobić, aby wpłynąć na siłę militarną obu narodów. Wiesz już jak tego dokonać.<n><n>W ramach wsparcia, gubernator Wysp Turk dostarczył ci następne trzy karaki.<n><n>W porcie jest także dostępnych wielu żeglarzy i broni.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Wypełnij dwie następne misje przejęcia miast dla holenderskiego wicekróla, przed zakończeniem wojny między Holandią i Anglią. Masz czas, zanim nadejdzie @D$EndDate$. Potem scenariusz zostanie zakończony."
"0x336d1860" = "Przedsiębiorstwa "
"0x338a357f" = "%1 %2 kupuje zezwolenie na stawianie budynków w mieście %3."
"0x33a2304e" = "Uratuj osadników"
"0x33a89d6d" = "Zyski z handlu"
"0x33ab2ad8" = "Nie mam dla ciebie innych wieści. Życzę ci udanego dnia."
"0x33ab2ad9" = "Omówiliśmy już wszystko. Wróć do mnie za kilka dni."
"0x33ab2ada" = "Na dzisiaj to będzie wszystko. Życzę ci dużo szczęścia i do zobaczenia."
"0x33b5b1ae" = "Twoja reputacja, jaką darzy cię %1, jest zbyt niska, abyś mógł się spotkać ze skarbnikiem."
"0x33c2c533" = "Autosave %02u"
"0x33e4a28d" = "Chcę, żebyś zaatakował konwoje wojskowe, którymi dowodzi @n$HostileNation$ i przechwycił dwa statki. Ich typ to: @S$ShipType$. Zacumuj statki w porcie, a potem wróć do mnie."
"0x33e4a28e" = "Chcę, żebyś atakował konwoje wojskowe, którymi dowodzi @n$HostileNation$ i przechwycił dwa statki typu: @S$ShipType$. Zacumuj statki w porcie, a potem wróć do mnie."
"0x3401b7ad" = "Zredukowany koszt wynagrodzeń"
"0x340c9536" = "Działa"
"0x34114e2d" = " %1 dział jest w budowie."
"0x34242510" = "Październik"
"0x3426834a" = "IDM_CONTEST_01_2004_LOG_06_TEXT"
"0x3427201a" = "Działa"
"0x34312b41" = "Dodawaj miasta klikając na nich."
"0x343cc312" = "Konwój ma zbyt wielu ludzi"
"0x343e9f4b" = "Gratulacje! Znasz już podstawy budowania miasta.<n><n>Gdy twoje przedsiębiorstwo zostanie zbudowane, automatycznie zacznie zatrudniać pracowników. Każdy osadnik oczekujący w porcie na zatrudnienie może zostać zamieniony na jednego pracownika i czterech mieszkańców miasta. Oznacza to, że jeden osadnik reprezentuje właściwie całą rodzinę osadniczą.<n><n>Jeśli chcesz, żeby w twoim przedsiębiorstwie wystarczyło pracowników, musisz zadbać o to, by nie zabrakło osadników chętnych do pracy. Konwoje transportowe przenoszą osadników z Europy do miast gubernatorskich, a potem są oni przewożeni przez kupców do innych miast.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zadbaj o to, żeby twoje przedsiębiorstwo w mieście Santa Marta miało dość pracowników."
"0x344b915f" = "Kupiec od gubernatora"
"0x34669be1" = "Tortuga nie osiągnęła na czas statusu „zamożności”. Każdy z towarów wpływa na status miasta. Jeśli w mieście są zapasy towaru wystarczające na 10 dni, towar ma najlepszy wpływ na jakość życia mieszkańców, a zatem na status miasta. "
