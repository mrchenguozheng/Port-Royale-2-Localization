"0xc557fe31" = "W mieście %1 wybuchła zaraza. Jakość życia mieszkańców pogorszyła się, a popyt na ubrania i drewno będzie dwukrotnie wyższy przez cały miesiąc. Dopóki trwa zaraza, każdego dnia umiera pewna liczba mieszkańców miasta, a kupcy niechętnie żeglują do tego portu."
"0xc558e134" = "Jeśli chcesz, aby twoje miasto odwiedzało jak najwięcej kupców, nie wystarczy tylko zaopatrywać miasta w pewne towary. Powinieneś wybierać towary, które są produkowane w pobliskich miastach, ponieważ kupcy biorą pod uwagę długość swoich podróży.<n><n>Kupcy, którzy odwiedzają twoje miasto, będą automatycznie kupowali towary, których jest w nim dużo, a zatem mają niską cenę w twoim mieście. Możesz sprzedawać bezpośrednio w swoim mieście towary, które wyprodukowałeś. Dopóki towary nie są droższe niż w innych miastach, będą regularnie kupowane przez kupców.<n><n>Korzyść jaka z tego płynie, polega na tym, że twoim mieszkańcom nigdy nie zabraknie towarów i nie musisz przejmować się transportowaniem dóbr do innych miast."
"0xc567cbb1" = "Dogoń i zabij łowcę nagród, który zatrzymał się w pobliżu miasta @T$Town$, zanim nadejdzie @D$EndDate$."
"0xc58b0cac" = "Mieszkańcy"
"0xc58b0f43" = "I znowu tu jesteś, a jak widzę, udało ci się.<n><n>Muszę zatem dotrzymać swojej części naszej umowy. Znajdziesz Mistrza zwanego @N$TeacherName$ w jego kryjówce.<n><n> @l$TeacherPos$<n><n>Szukaj wzdłuż tamtejszego wybrzeża, a go znajdziesz.<n><n>Zabierz @a$Amount$ wina jako zapłatę. "
"0xc58b0f44" = "Dziękuję ci za wyświadczenie mi tej przysługi.<n><n>A wracając do naszej umowy. Stary kapitan zwie się @N$TeacherName$ i odpoczywa niedaleko stąd.<n><n> @l$TeacherPos$<n><n>Szukaj wzdłuż tamtejszego wybrzeża, a go znajdziesz.<n><n>Weź @a$Amount$ rumu ze sobą, albo on nie zechce ci pomóc."
"0xc58b0f45" = "Zrobiłeś, o co prosiłem i jestem ci bardzo wdzięczny.<n><n>Wzdłuż wybrzeża znajdziesz nauczyciela imieniem @N$TeacherName$.<n><n> @l$TeacherPos$ <n><n>Przeszukaj tamten obszar i weź @a$Amount$ jedzenia ze sobą, żeby on zechciał ci pomóc. "
"0xc595352c" = "Kronika"
"0xc597f7f7" = "Rozmiary i siła"
"0xc59a4105" = "Twój pałac w mieście %1"
"0xc5a11394" = "<n><n>I wyślij kapitana, który nie ma doświadczenia kupieckiego."
"0xc5a11395" = "<n><n>Radzę, żebyś wysłał kapitana, który nie ma doświadczenia bitewnego."
"0xc5a11396" = "<n><n>Pamiętaj, aby wysłać kapitana, który nie ma doświadczenia w nawigacji."
"0xc5d1483a" = "Populacja"
"0xc5d1c61b" = "Dyrektor sprzedaży"
"0xc6063615" = "Konwój nie może postawić żagli, ponieważ morale załogi jest zbyt niskie. Daj im trochę czasu na wyjście do miasta, albo zapewnij konwojowi błogosławieństwo w kościele."
"0xc617e8fb" = "%1 także prowadzi z nami wojnę. "
"0xc618cdea" = "Komunikaty"
"0xc61d98b4" = "Nazwa miasta"
"0xc6202672" = "A zatem, zlecam ci przejęcie miasta kolonialnego, którym włada %2, zanim nadejdzie %1. Miasto nie może być siedzibą gubernatora, ani wicekróla!"
"0xc6202673" = "A zatem, zlecam ci przejęcie miasta kolonialnego, którym włada %2, zanim nadejdzie %1. Miasto nie może być siedzibą gubernatora, ani wicekróla!<n><n>Aby uniknąć zatargów z pozostałymi narodami, wydam ci list kaperski, którego celem jest %2."
"0xc62ed01a" = "Klikaj prawym przyciskiem myszy na konwoju, aby dodawać statki"
"0xc62f070d" = "Lata"
"0xc6362ac3" = "Niech zatem tak będzie.<n>Twoja misja polega na przejęciu dowolnego miasta, którym rządzi %2, zanim nadejdzie %1."
"0xc6362ac4" = "Twoja misja polega na przejęciu dowolnego miasta, którego właścicielem jest %2, zanim nadejdzie %1.<n>Aby uniknąć problemów z innymi narodami, wydaję ci list kaperski, którego celem jest %2. "
"0xc638ee24" = "Zmień nazwę"
"0xc647e049" = "<n><n>Ukończyłeś wszystkie cele scenariusza.<n><n>Masz kolejne 20 dni, aby zebrać więcej aktywów, zanim ten scenariusz skończy się i zostanie wyświetlony wynik.<n><n>Uwaga: Wszystkie wydarzenia, jakie miały miejsce w tym scenariuszu mogą wydarzyć się także trybie wolnej gry. Gdy toczą się wojny, czasami narody wysyłają korsarzy, aby sabotowali miasta wrogich państw. "
"0xc65c8b8c" = "W imieniu mojego narodu chciałbym podziękować ci za zniszczenie konwoju znanego pirata imieniem %1.<n><n>Otrzymasz nagrodę w kwocie %2 za wszystkie statki pirackie, które pokonałeś i mogę cię zapewnić, że mój naród jest ci bardzo wdzięczny."
"0xc65e1601" = "Działania wojskowe"
"0xc66396bb" = "Spójrz tutaj, zaznaczyłem na twojej mapie morskiej ostatnią znaną pozycję. @l$Pos$ Znajdź i zniszcz ten konwój. Masz czas, zanim nadejdzie @D$EndDate$."
"0xc66396bc" = "Musisz działać szybko. Aktualna pozycja konwoju została zaznaczona na twojej mapie morskiej. @l$Pos$ Musisz znaleźć i zniszczyć ten konwój, zanim nadejdzie @D$EndDate$."
"0xc66396bd" = "Dziękuję ci! Musisz się pospieszyć, albo bardzo trudno będzie ci znaleźć konwój, jeśli wybierze za swój cel nowy region. Jego ostatnia pozycja została zaznaczona na twojej mapie morskiej. @l$Pos$ Masz czas, zanim nadejdzie @D$EndDate$."
