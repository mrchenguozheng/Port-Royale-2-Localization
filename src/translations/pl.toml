"0xf7b263ab" = "%1 we własnej osobie przebywa na wrogim statku. Proponuje twojemu kapitanowi, by o losach bitwy zdecydował pojedynek.<n><n>Twój kapitan podejmuje wyzwanie chcąc oszczędzić załogę."
"0xf7b3d0f1" = "Chcesz zastąpić?"
"0xf7b48e5f" = "Zatopione: %1"
"0xf7c59ef9" = "W moim mieście brakuje towaru: @G$Goods$, który przetwarzamy. Zapasy w różnych przedsiębiorstwach są już małe. Czy możesz mi pomóc?"
"0xf7c59efa" = "Ostatnio u moich drzwi pojawił się Związek Katolickich Producentów. Narzekają, że w mieście brakuje towaru: @G$Goods$. Musiałem wysłuchiwać ich narzekań przez trzy godziny. Nie wytrzymam tego jeszcze raz. Czy możesz mi wyplątać się z tej delikatnej sytuacji?"
"0xf7c59efb" = "A niech to! Jeszcze raz w moim mieście zabrakło towaru: @G$Goods$. Czasami zupełnie nie mam pojęcia, jak miejscowym kupcom udaje się wiązać koniec z końcem. Dopóki nie rozwiążemy tej sprawy, byłbym wdzięczny, gdybyś mógł mi pomóc."
"0xf7ca9ed0" = "Statki eskorty"
