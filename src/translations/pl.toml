"0xc93b91cb" = "Zwiększ swoje zyski z handlu w Cartagenie i zdobądź zezwolenie na budowę od mistrza budowlanego."
"0xc9500bee" = "Gratulacje! Wypełniłeś swój cel i zarobiłeś więcej pieniędzy. Zdobyłeś także wyższą rangę.<n><n>Twoją rangę zawsze określają twoje całkowite aktywa. Składają się na nią gotówka, a także majątek ruchomy, taki jak towary i statki. W dowolnej chwili możesz ocenić stan swojego majątku na zakładce „Sukcesy”, w dzienniku. Tam także dowiesz się, kiedy uzyskasz następną rangę.<n><n>Im wyższą masz rangę, tym większą liczbą konwojów możesz dowodzić, a także w tym większej liczbie miast będziesz mógł zakładać przedsiębiorstwa.<n><n>Teraz, gdy masz wyższą rangę, spróbuj utworzyć kolejny konwój i handluj dalej, aby powiększać swój majątek.<n><n>W dowolnej chwili możesz ocenić swoje zasoby finansowe umieszczając kursor na niebieskim pasku pokazującym twój majątek. Ten pasek jest widoczny pod tym oknem. <n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Utwórz drugi konwój i zwiększ swoje aktywa całkowite do sumy @g$GoldGoal$."
