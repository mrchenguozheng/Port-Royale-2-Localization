"0xca4930db" = "Witaj, @A$USER$. Muszę przetransportować dużą dostawę towaru: @G$Goods$ do miasta @T$Town$ ale, niestety, mój kapitan mnie zawiódł. Proponuję następujący plan: zapłacisz kaucję w wysokości @g$PriceBuy$, przewieziesz @a$Amount$ do miasta @T$Town$ i tam otrzymasz w zamian @g$PriceSell$. Co ty na to?"
"0xca4930dc" = "@A$USER$! Cieszę się, że cię widzę. Masz dużą flotę kupiecką, nieprawdaż? Chodzi o to, że muszę przewieźć towar: @A$Amount$ @G$Goods$.<n>Może zapłacisz mi kaucję w wysokości @g$PriceBuy$ i zabierzesz towar do miasta @T$Town$. Tam będziesz mógł sprzedać towar za @g$PriceSell$."
"0xca4930dd" = "Jestem w kłopotliwym położeniu. Zanim nadejdzie @D$EndDate$ muszę dostarczyć @a$Amount$ towaru: @G$Goods$ do miasta @T$Town$, ale mój konwój jest już w drodze z innym transportem dóbr. Mam dla ciebie następującą propozycję: zapłać mi kaucję w wysokości @g$PriceBuy$ i dostarcz towar. Następnie, w zamian otrzymasz @g$PriceSell$. Co o tym myślisz?"
"0xca6a6869" = "Zapisz"
"0xca6f7275" = "Zdołaliśmy odkryć kryjówkę pirata %1. %2 Czy zechciałbyś zaatakować tę kryjówkę i zniszczyć bandę raz na zawsze, w ten sposób przywracając jakieś pozory spokoju na naszych wodach?"
"0xca6f7276" = "Czy słyszałeś, że wreszcie dowiedzieliśmy się, gdzie pirat %1 ma swoją kryjówkę? %2 %3 szuka śmiałego bohatera, który ją zniszczy. Podejmiesz się tego zadania?"
"0xca6f7277" = "Położenie bazy, z której korzysta głośny pirat znany jako %1, przestało być tajemnicą. %2 Powinniśmy zniszczyć jego bandę bez dalszej zwłoki. Myślę, że nadajesz się do tego zadania."
"0xca6f7278" = "Cieszysz się bardzo dobrą reputacją w moim narodzie. Jednak znam sposób w jaki możesz poprawić swoją reputację jeszcze bardziej.<n><n>Niedługi czas temu odkryto kryjówkę pirata imieniem %1.  %2<n><n>Może to ty nareszcie uwolnisz nas od zmory jego gangu. "
"0xcab1988a" = "%1 atakuje"
"0xcac5b30b" = "Módl się"
"0xcacc4fa8" = "Znajdź i zniszcz hiszpańską flotę skarbów. Ostatnio była w mieście @T$StartTown$, skąd wyruszyła do miasta @T$DestTown$."
"0xcb2b0709" = "Co za nieszczęście! Czy @F$WifeName$ spotkała się już z tobą dzisiaj? Oszczędź sobie trudu - ona zniknęła. Spójrz, znalazłem coś w rodzaju listu pożegnalnego. Pisze, że ma dość swojego nudnego życia i uciekła z jakimś poszukiwaczem przygód. Musisz uratować moją ukochaną córkę!"
"0xcb2b070a" = "Wydarzyło się nieszczęście i zdaje się, że to dotyczy także ciebie. Moja córka została porwana przez piratów, ale ktoś zostawił ci wiadomość z mapą pokazującą położenie jakiegoś miejsca. Wygląda mi to na pułapkę, ale co możemy zrobić? Musisz uratować moją córkę!"
"0xcb2b070b" = "Ha! Moja córka, a twoja żona uciekła z jednym z oficerów straży miejskiej! Mogłem się tego domyśleć! Teraz oboje zniknęli kradnąc jeden z moich statków! Musisz sprowadzić do mnie moją córkę i przemówić jej do rozumu! Co dziwne, natrafiłem w pokojach mojej córki na mapę, na której zaznaczone jest jakieś miejsce."
"0xcb3b9785" = "Nowa nazwa"
"0xcb3c204b" = "Nowe zezwolenie na budowę"
"0xcb4ef185" = "Atak"
"0xcb6604a0" = "zatopione"
"0xcb674ff0" = "Dziękuję ci w imieniu mojego kraju. Konwój zostanie przygotowany do drogi, a nowa załoga zebrana. Statki będą gotowe do postawienia żagli w ciągu 15 dni.<n><n>Jeśli chcesz przekazać następny konwój, musisz poczekać do tego czasu."
"0xcb6c23d8" = "Kup"
"0xcb6f7f0c" = "Dostawa narzędzi"
"0xcb7ef0e8" = "Powodzenie handlu %1"
"0xcb853f07" = "Twój kapitan wygrał pojedynek z dowódcą. Twoi żeglarze wdzierają się do skarbca i wynoszą %1.<n><n>Teraz zdecyduj, które towary chcesz zagrabić z magazynu miasta."
"0xcb8dbdae" = "wrodzy muszkieterzy "
"0xcb8dd6d9" = "Nasz wróg, @n$HostileNation$, nie zatrzyma się przed niczym. Moja żona została porwana i zostanie zwolniona, gdy spełnię pewne warunki. Jednak, udało mi się dowiedzieć, gdzie jest przetrzymywana. Rozumiesz, że oficjalnie nic nie mogę zrobić, ale ty mógłbyś zaatakować miasto i sprowadzić ją do mnie."
"0xcb8dd6da" = "Cieszę się, że cię widzę.<n>Moja żona dostała niedawno domowego pudla z Paryża. To przeklęte zwierzę doprowadza mnie do szaleństwa, ale moja żona straciła głowę na jego punkcie.<n>Ktoś dowiedział się o tym, porwał psa i oddał go naszym wrogom, którzy chcą go wykorzystać jako narzędzie szantażu.<n><n>Czy uratujesz dla mnie tego pudla?"
"0xcb8dd6db" = "Pewien czas temu, moja najmłodsza córka uciekła z jakimś przejezdnym awanturnikiem. Tak wtedy powiadano. Teraz odkryłem, że ona żyje w mieście @T$TargetTown$ i ma zostać poślubiona dowódcy miasta. Znam swoją córkę - nigdy nie uczyniłaby czegoś takiego z własnej woli! Nie mogę zasugerować wicekrólowi ataku na miasto w celu odbicia mojej córki. Ale może ty tego dokonasz?"
"0xcb9b3a82" = "Pojawiła się plaga szczurów"
"0xcba7ebba" = "Mistrz budowlany"
"0xcbb16a2d" = "Gdy posiadasz własne przedsiębiorstwo, w tym miejscu możesz sprawdzić, czy produkcja przebiega bez problemów. "
"0xcbbb1ba9" = "Premia produkcji"
"0xcbc60959" = "Dalej"
"0xcbe32499" = "Kolejna bitwa"
"0xcbe3c595" = "Stragan"
"0xcc02bdc2" = "Transfer statków"
"0xcc04e86c" = "Naprawy aktywne"
"0xcc0a1380" = "Znajdź konwój piracki, którym dowodzi @P$PirateName$, który znajduje się około 1 dnia podróży na północny wschód od Providence. Zniszcz ten konwój.<n>Potem wróć do gubernatora Cartageny."
"0xcc1709af" = "%1: Wrogie"
"0xcc2c64fb" = "Otrzymałeś misję wyśledzenia i zniszczenia jednego z pirackich konwojów Czarnobrodego.<n><n>Czarnobrody ma tajną kryjówkę, gdzie trzyma kilka konwojów, z których każdy składa się z pięciu w pełni uzbrojonych statków. To będzie trudna misja dla konwoju, który posiadasz w tej chwili.<n><n>A zatem, powinieneś najpierw zwiększyć siłę ogniową swojego konwoju. Aby zdobyć dość pieniędzy na zakup większego statku, musisz sprzedawać dobra ze swojego magazynu w mieście @T$TOWN$ za najlepszą cenę, jaką się da uzyskać. Wypełnij wskazówki widoczne w oknie wydarzeń, które powiedzą ci, gdzie możesz sprzedać towary za dobrą cenę, na północ i na wschód od miasta @T$TOWN$.<n><n>Nie strać na to zbyt wiele czasu, ponieważ musisz potem ukończyć misję gubernatora!<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Sprzedawaj towary w swoim magazynie w mieście @T$TOWN$ i zwiększ gotówkę do @g$GoldGoal$."
"0xcc475a7d" = "Mistrz budowlany"
"0xcc528764" = "Budynek społeczny "
"0xcc56863a" = "Wynagrodzenie dzienne"
"0xcc5bfb04" = "<f:fonts/Tiepolo_black14x14aaFHk.res>Obecna misja<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0xcc72dc12" = "Wskazówki dotyczące kupowania i sprzedawania towarów"
"0xcc823e54" = "@n$TargetNation$ prowadzi z nami wojnę i w świetle ostatnich wydarzeń uznałem, że nadszedł czas na odwet. Chcę, żebyś przechwycił lub zatopił okręty wojenne w moim imieniu. Czy przyjmujesz tę misję? "
"0xcc823e55" = "Całkiem niedawno @n$TargetNation$ zaatakowała jedno z naszych miast. Teraz planuję własną akcję militarną, której celem będzie @n$TargetNation$ i zastanawiałem się, czy nie zechciałbyś wziąć w tym udziału? Chcę, żebyś zatopił lub przechwycił konwoje wojskowe. Wszystko co im zabierzesz, należy do ciebie, zależy mi tylko na tym, żeby @n$TargetNation$ została osłabiona. Czy jesteś zainteresowany?"
"0xcc823e56" = "@n$TargetNation$ zaatakowała jedno z naszych miast. Prowadzimy akcję odwetową i zatapiamy ich statki. Bardzo chciałbym wysłać cię w pewien rejon i udzielić ci zezwolenia na przechwytywanie lub zatapianie okrętów wojennych. "
"0xcc84b125" = "Agencja PR"
"0xcc84b185" = "Kontrola jakości"
"0xcc9f5062" = "Następnie wyrusz w podróż. Kieruj się na wody w okolicy miasta @T$TargetTown$."
"0xcc9f5064" = " Musisz ukończyć tę misję, zanim nadejdzie @D$EndDate$."
"0xcca05df4" = " i obecnie może kontrolować 2 kapitanów oraz posiadać 1 zezwolenie na budowę."
"0xcca05df5" = " i obecnie może kontrolować %1 kapitanów oraz posiadać %2 zezwoleń na budowę."
"0xcca05df6" = " i obecnie może kontrolować dowolną liczbę kapitanów oraz posiadać 10 zezwoleń na budowę."
