"0x16cc82c9" = "Dostarcz towar: @G$Goods$, zanim nadejdzie @D$EndDate$, osobie w mieście @T$TargetTown$. Wówczas otrzymasz zapłatę w wysokości @g$Price$ za każdą dostarczoną beczkę."
"0x16e90f87" = "Znalazłeś zaginioną paczkę. @N$OwnerName$ czeka na nią w mieście @T$TOWN$, dopóki nie nadejdzie @D$EndDate$. "
"0x16fcf40f" = "Pożyczki"
"0x17081769" = "Pojemność max:"
"0x170f1419" = "%1 %2 przebił się przez umocnienia nadbrzeżne miasta i splądrował miasto."
"0x171746e9" = "Służyłeś mojemu narodowi długo i wiernie. Teraz muszę nagrodzić cię za twoją lojalność. Dam ci działkę ziemi, na której możesz założyć własne miasto."
"0x17328849" = "nieznany"
"0x1733ed83" = "W tym scenariuszu, hiszpański wicekról nadaje ci ziemię, na której możesz zbudować własne miasto. Celem tego scenariusza jest sprawienie, by gospodarka twojego miasta rozkwitła.<n:25>Jednak, zanim otrzymasz ziemię, musisz poprawić swoją reputację w Hiszpanii i zdobyć popularność u hiszpańskiego wicekróla. Dokonasz tego przejmując miasta w jego imieniu."
"0x1742a5e4" = "Czas"
"0x17677dab" = "Prognoza"
"0x17839498" = "Obniż cenę o 5%"
"0x178491f6" = "Podwyższ cenę o 5%"
"0x17885da0" = "Natrafiłeś na rozbitków na tratwie i zabrałeś @I$Settlers$ osadników. Mają nadzieję, że dotrą do miasta, w którym brakuje pracowników."
"0x17a97ba2" = "Bitwy morskie"
"0x17abb14d" = "a port jest bardzo słabo broniony."
"0x17ae0013" = "Ostatni konwój z Europy powiadomił mnie, że w ciągu kilku następnych tygodni w moim mieście będzie brakowało towarów importowanych.<n><n>Czy pomożesz mi? Nie mogę polegać na tym, czy inni kupcy sprowadzą te dobra do miasta."
"0x17ae0014" = "Jak wiesz, @n$Nation1$ i @n$Nation2$ prowadzą ze sobą wojnę.<n>Z tego powodu, w ciągu nadchodzących tygodni nadal nie będę dostawał żadnych dóbr importowanych z Europy. Wobec tego nie mam innego wyjścia, jak kupować towary, które posiada @n$Nation2$.<n><n>Wysłałem już w tym celu kilku innych kupców, ale chciałbym móc polegać także na twojej pomocy."
"0x17ae0015" = "Co @n$Nation2$ sobie myśli? Właśnie dowiedziałem od informatora, że konwoje transportowe na drodze z Europy do mojego miasta zostały zaatakowane i splądrowane. Czy pomożesz mi kupić dobra importowane, których potrzebujemy?"
"0x17d31860" = "Kupione towary"
"0x17d5b880" = "Nie możesz rozwiązać konwoju, ponieważ na pokładzie nadal są towary lub ładunek."
"0x17f39d18" = "Konwoje bez misji"
"0x1813d72e" = "%1. %2"
"0x183f926a" = "Gubernator %1"
"0x1844fb4f" = "Po pokonaniu statków eskortowych swojego przeciwnika, przejmujesz statek kupiecki.<n><n>Teraz musisz zdecydować, które towary chcesz zabrać i co zrobić ze statkami – przejąć je, czy tylko splądrować."
"0x1844fb50" = "Po pokonaniu statków eskortowych swojego przeciwnika, przejmujesz %1 statków kupieckich.<n><n>Teraz musisz zdecydować, które towary chcesz zabrać i co zrobić ze statkami – przejąć je, czy tylko splądrować."
"0x1844fb51" = "Konwój twojego przeciwnika nie jest broniony przez żadne statki eskorty. Możesz zatem przejąć statek kupiecki bez walki.<n><n>Teraz musisz zdecydować, które towary chcesz zabrać i co zrobić ze statkiem – przejąć go, czy tylko splądrować."
"0x1844fb52" = "Konwój twojego przeciwnika nie jest broniony przez żadne statki eskorty. Przejmujesz zatem statki kupieckie bez walki.<n><n>Teraz musisz zdecydować, które towary chcesz zabrać i co zrobić ze statkami – przejąć je, czy tylko splądrować."
"0x184aee4b" = "Kompatybilne"
"0x18546893" = "W tym scenariuszu nauczysz się prowadzić bitwę na morzu. Scenariusz zaczyna się od krótkiej bitwy ćwiczebnej. Później, musisz wyśledzić i zniszczyć konwój znanego pirata.<n><n>Musisz także poznać gubernatora Cartageny, gdzie rozpoczniesz scenariusz. Gubernator pomoże ci zapoznać się z prowadzeniem bitew morskich, a później przydzieli ci misję, której zadaniem będzie wyśledzenie i zniszczenie pewnego pirata.<n><n>Twoja ranga na początku scenariusza to Żeglarz. Musisz osiągnąć tę rangę, aby móc otrzymać misję od gubernatora. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Odwiedź gubernatora Cartageny i wykonaj misję, którą ci zleci."
"0x18636d91" = "Żołnierze"
"0x18708b29" = "Transfer towarów"
"0x18ab27d9" = "<c>%1<n><n:5>%2 (%3)<n><n:5>%4<n:5>"
"0x18b36fa5" = "<n><n>Możesz udać się do gubernatora jego narodu i zażądać okupu."
"0x18b8442c" = "W rezultacie, %1 została osłabiona."
"0x18b9a161" = "Konwój wojskowy zniszczony"
"0x18c8a515" = "%1 %2 otrzymuje od angielskiego wicekróla miasto %3."
"0x18c8a516" = "%1 %2 otrzymuje od francuskiego wicekróla miasto %3."
"0x18c8a517" = "%1 %2 otrzymuje od holenderskiego wicekróla miasto %3."
"0x18c8a518" = "%1 %2 otrzymuje od hiszpańskiego wicekróla miasto %3."
