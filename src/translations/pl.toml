"0x100afa32" = "%1,<n>Nasz kościół wymaga stałej konserwacji i musi być dekorowany jako miejsce czci, ale Rzym jest daleko stąd. Złóż datek dla naszego kościoła, a włączymy cię do naszych modlitw. Twoja reputacja w moim narodzie i moim mieście także się poprawi.<n><n>Wybierz sumę, jaką chciałbyś podarować."
