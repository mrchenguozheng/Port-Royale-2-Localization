"0xdeeff94f" = " Przechowywano w niej perfumowane płatki róży."
"0xdeeff950" = " Najwyraźniej zawierała piękną, miniaturową zastawę do herbaty dla lalek."
"0xdeeff951" = " Skrzynia zawierała pluszowe, różowe zabawki."
