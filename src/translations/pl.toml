"0x09d615b1" = "Pokonałeś swojego przeciwnika i wszedłeś na pokład jego statku.<n><n>Teraz musisz zdecydować, które towary chcesz zabrać i co zrobić ze statkiem – przejąć go, czy tylko splądrować."
