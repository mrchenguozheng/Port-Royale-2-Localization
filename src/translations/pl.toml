"0xd5328f24" = "W tym scenariuszu musisz wyśledzić i zabić niesławnego pirata Edwarda Teacha, znanego także jako Czarnobrody. Gubernator Hawany daje ci różne instrukcje i wspiera cię w twojej misji.<n:25>W tym scenariuszu możesz użyć wszystkich opcji dostępnych w trybie wolnej gry. Musisz jednak wypełnić określone zadania, aby pomyślnie ukończyć scenariusz."
