"0x103b68ea" = " Ale nie zapomnij: szukasz tylko towarów! Nie wolno ci zatapiać ani przechwytywać żadnych statków, ponieważ nie chcemy prowokować wroga bardziej, niż to konieczne.<n><n>Masz czas, zanim nadejdzie @D$EndDate$.<n><n>Pamiętaj, że konwoje transportowe nie liczą się jako konwoje kupieckie i musisz mieć list kaperski, jeśli chcesz atakować kupców. "
