"0xe4233be0" = "W tym scenariuszu musisz pomóc holenderskim koloniom zdobyć nowe miasta.<n:25>Rozpoczynasz scenariusz z dobrze uzbrojonym konwojem i pewnym kapitałem startowym. Przechwytując angielskie statki handlowe natychmiast zwiększasz swój majątek, dzięki czemu będziesz mógł wyposażyć swój konwój w więcej uzbrojenia.<n:25>Później, twój konwój zaatakuje angielskie konwoje wojskowe w celu osłabienia obrony Anglii, a potem będziesz mógł przechwycić ich miasta."
