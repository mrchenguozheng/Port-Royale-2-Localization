"0x37af7b1e" = "Dwa dni na północ od Cartageny znajdują się dwa porzucone statki. Chcę, żebyś je zniszczył."
"0x37baebd9" = "Tawerna"
"0x37d00ed9" = "Do tej pory powinieneś mieć wystarczającą obronę miasta. Teraz zwiększ rozmiary swojego miasta i popraw jego wygląd. Wybuduj kościół oraz kolejne przedsiębiorstwa produkcyjne i obszary mieszkalne, aby przyciągnąć ponad 2200 mieszkańców do twojego miasta.<n><n>Masz czas, żeby to zrobić, zanim nadejdzie @D$EndDate$. Potem scenariusz zostanie zakończony.<n><n>Nie zapominaj sprzedawać z zyskiem wyprodukowanych towarów! <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zbuduj kościół i zwiększ populację swojego miasta do 2200. Masz czas, zanim nadejdzie @D$EndDate$."
"0x37d803c0" = "Popyt na towar: @G$MsgGoods$ jest wysoki w miastach: @T$MsgTown0$ i @T$MsgTown1$"
"0x37fc6d8a" = "Pracownicy "
"0x37fda1f9" = "Usuń ostatnie miasto"
"0x3812837b" = "Pokaż wykres cen"
"0x382965ac" = "Podróżnik @N$Name$ dziękuje ci za uratowanie go i wypłaca nagrodę w wysokości @g$Reward$."
