"0xe0538e7e" = "@n$HostileNation$ prowadzi z nami wojnę i mam ochotę sabotować miasto należące do naszych wrogów. Czy zechcesz pomóc mi w odcięciu dopływu towarów do miasta, dzięki czemu jego status pogorszy się?"
"0xe0538e7f" = "Bardzo pragnę doprowadzić do ruiny gospodarkę jednego z wrogich miast. Może zablokujemy drogi dostępu do miasta, którym włada @n$HostileNation$, aż osiągnie stan recesji?"
"0xe058fceb" = "Kryjówka różnego dobra"
"0xe06b1522" = "Możesz poprawić swoją reputację, jaką darzy cię %1, atakując holenderskie statki i miasta. To nie pogorszy twojej reputacji w pozostałych państwach."
