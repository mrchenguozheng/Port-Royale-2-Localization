"0x09ccb838" = "Jeden z naszych konwojów transportowych został ostatnio zaatakowany i przechwycony przez piratów. Obawiam się o los rodzin osadników na pokładzie przechwyconych statków. Obecnie przeszukujemy obszar w okolicy miejsce, gdzie nastąpił atak. Czy mógłbyś także zająć się przeszukaniem innego obszaru?"
"0x09ccb839" = "Niektórzy z osadników byli niezadowoleni z warunków pracy w mieście @T$SampleTown$ i wyruszyli w nędznej łodzi wiosłowej. Od tego czasu słuch o nich zaginął. Czy mógłbyś mi pomóc ich odnaleźć? "
