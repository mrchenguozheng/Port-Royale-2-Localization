"0xd9fb62e7" = "Twój konwój zabrał wiadomość w butelce. Butelka zawierała mapę pokazującą położenie jakiegoś miejsca."
"0xd9fb62e8" = "Twój konwój zabrał wiadomość w butelce. Butelka zawierała mapę pokazującą położenie jakiegoś miejsca."
"0xd9fb62e9" = "Konwój znajduje wiadomość w butelce. To spisany pospiesznie list: „Uratujcie mnie! Myślę, że chcą zabrać mnie w to miejsce!”.<n>Do listu dołączona została mapa pokazująca położenie jakiegoś miejsca. "
