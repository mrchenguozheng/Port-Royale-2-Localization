"0x273267f2" = "Och, nie mogę w to uwierzyć. Pijacy ukradli mój piękny statek. Zapełnili go flaszkami rumu i odpłynęli. Czy pomożesz mi znaleźć mój statek?"
"0x273267f3" = "Mogłem się tego domyśleć. Mój syn Borys, nicpoń jakich mało, pożyczył sobie najlepszy z moich statków. Właśnie dowiedziałem się, że on i jego kompani postanowili urządzić sobie przejażdżkę. Bez wątpienia wypełnili ładownię rumem i jestem pewien, że już nigdy nie zobaczę mojego statku. Czy możesz odzyskać dla mnie mój statek?"
"0x27344ff4" = "Wielkie dzięki za terminową dostawę. Gubernator będzie zachwycony. Wesele zacznie się jeszcze tego dnia!"
"0x273d7e0f" = "Wszyscy twoi żeglarze mają już najwyższe możliwe morale."
"0x274e9455" = "UWAGA"
"0x2766d2e5" = "Nie masz konwoju, ani żadnych magazynów w tym mieście"
"0x2772293d" = "Atak na miasto %1"
"0x2796edbb" = "Miasto %1 zostało przejęte"
"0x27beb2d9" = "Zagarnij @a$Amount$ przypraw, wina i narzędzi z konwojów transportowych, które wysłała @n$HostileNation$. Nie wolno ci przechwytywać ani zatapiać żadnych statków. Następnie, dostarcz te towary na rynek w mieście @T$TOWN$, zanim nadejdzie @D$EndDate$. Potem, możesz odebrać swoją nagrodę od gubernatora."
"0x27e88b91" = "Zbuduj kościół i zwiększ populację swojego miasta do 2200. Masz czas, zanim nadejdzie @D$EndDate$."
"0x2806bf85" = "Konwój nie może postawić żagli, ponieważ na pokładzie jest zbyt wielu żeglarzy. Zwolnij część swoich żeglarzy, aby nie przekroczyć maksymalnej liczby dozwolonej załogi."
"0x282e1ded" = "%1 chce, żebyś przejął dla niej miasto kolonialne, którym włada %3, zanim nadejdzie %2. Miasto nie może być siedzibą gubernatora, ani wicekróla."
