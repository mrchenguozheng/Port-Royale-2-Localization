"0xef04cb04" = "Koszt naprawy:"
"0xef0f916b" = "Natrafiłeś na @I$Settlers$ rozbitków na tratwie. Niestety, nie masz miejsca na pokładach swojego konwoju, żeby zabrać ich wszystkich. Wróć z innym konwojem."
"0xef152fb7" = "%1,<n>teraz moja kolej, by cię poznać. Jesteś bardzo popularnym jegomościem w moim narodzie. Zawsze miałem nadzieję, że spotkam cię osobiście."
"0xef635ad0" = "Dobrze. Pośrednik czeka na ciebie na rynku miasta @T$TargetTown$. Dostarcz tyle towaru: @G$Goods$ ile dasz radę, zanim nadejdzie @D$EndDate$. Wówczas otrzymasz zapłatę w wysokości @g$Price$ za każdą beczkę, jaką dostarczysz."
