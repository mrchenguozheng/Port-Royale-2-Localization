"0x1269b77b" = "Ty jesteś @s$USER$, prawda? A zatem, jesteś tym, kto szuka wskazówek do ukrytego skarbu. Mogę ci pomóc, jeśli tego chcesz."
"0x1269b77c" = "Witaj, @A$USER$. Mogę ci powiedzieć, jak znaleźć to, czego szukasz. Posłuchaj mojej wskazówki do ukrytego skarbu."
