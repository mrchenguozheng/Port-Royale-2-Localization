"0x382c83f2" = "Przewijanie przy krawędzi mapy"
"0x3833b8b2" = "%1: Atak konwoju wojskowego"
"0x383e31dd" = "Słuchaj uważnie! Obawiam się, że mój szwagier to włóczęga i nikt nie wie, gdzie on teraz jest."
"0x383e31de" = "Wiedziałem, że to cię zainteresuje. @N$ContactName$ przez większość czasu jest w podróży."
"0x383e31df" = "To prawda, w moim wieku muszę inaczej patrzeć na pieniądze. Kupiec @N$ContactName$ to człowiek, którego trudno znaleźć."
"0x384261bc" = "Tortuga_@I$Idx$"
"0x385b3d02" = "Wybierz szermierza"
"0x385b8d74" = "Wszystkie statki"
"0x386a053b" = "Osiągnąłeś najwyższą rangę!"
"0x386a3a7f" = " Szukaj go w tamtejszych tawernach. Wierz mi, możesz się nie spieszyć, ale jeśli uda ci się go zobaczyć, prześlij mu moje najlepsze pozdrowienia i powiedz mu, że mógłby wreszcie przypomnieć mojej siostrze jak wygląda!"
"0x386a3a80" = " Obawiam się, że nie mogę powiedzieć, kiedy będzie można go tam zobaczyć. Najlepsze, co możesz zrobić, to szukać go jak najczęściej w tamtejszych tawernach."
"0x386a3a81" = " Nie ma wątpliwości, że znajdziesz go w tawernie. Ale jestem pewien, że on pomoże ci znaleźć człowieka zwanego @N$TeacherName$."
"0x38760acc" = "<n>Aby wszystko wyglądało bardziej oficjalnie, daję ci list kaperski, którego celem jest @n$TargetNation$."
