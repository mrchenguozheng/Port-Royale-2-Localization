"0xee7fe702" = "Módl się"
"0xeea57a9b" = "Twoje własne miasto"
"0xeea6068c" = "Działa portowe"
"0xeeced82e" = "@s$USER$, @n$Nation$ w Europie odczuwa niedobór towaru: @G$Goods$. W związku tym organizuję wyprawę do Europy. Kupię tyle towaru: @G$Goods$, ile zdołasz dostarczyć, i jestem gotów zaproponować ci cenę @g$FullPrice$ za jednostkę. Czy jesteś zainteresowany?"
"0xeeced82f" = "Witaj. Organizuję wyprawę do Europy. Chcę wykorzystać panujący tam niedobór towaru: @G$Goods$. Oferuję zakupić tyle towaru, ile zdołasz dostarczyć i dam ci bardzo dobrą cenę za beczkę, powiedzmy @g$FullPrice$. Umowa stoi?"
"0xeeced830" = "Miło cię widzieć, @s$USER$. Organizuję konwój do Europy, ponieważ usłyszałem, że towar: @G$Goods$ osiąga tam bardzo wysoką cenę. Oferuję cenę @g$FullPrice$ za jednostkę, dla każdego, kto dostarczy mi towar: @G$Goods$. Umowa stoi?"
"0xeed24553" = "Zwiększ tempo gry"
"0xeee3380a" = "%1 pirat %2 zaatakował miasto od strony lądu i splądrował je. Zginęło wielu z żołnierzy miejskiego garnizonu, a status miasta pogorszył się."
