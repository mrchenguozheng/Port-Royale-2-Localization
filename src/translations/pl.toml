"0xcdd473c0" = "Obszar mieszkalny"
"0xcde25dc6" = "<g:INTEXT_SCHATZKISTE_800x600.screen><n>Znalazłeś w wodzie skrzynię ze skarbem.<n><n>@g$Gold$"
"0xcde47db7" = "Obrona miasta"
"0xcde8b98e" = "poprzednia mapa"
"0xcdf0b227" = "Pewna liczba kupców połączyła siły i żąda lepszej obrony naszych wód. Na poparcie swych żądań postanowili wkrótce przestać zaopatrywać jedno z naszych miast. Czy możesz interweniować i pomóc mnie oraz obywatelom?"
"0xcdf0b228" = "W jednym z naszych miasto od tygodni prawie nie pojawiają się kupcy, ponieważ rozeszła się pogłoska, że w mieście trwa zaraza. Czy pomożesz mi stłumić tę plotkę zaopatrując miasto w towary?"
"0xcdf0b229" = "W ciągu ostatnich tygodni nad jednym z naszych miast unosiło się widmo zarazy. Co gorsza, także kupcy zaczęli omijać miasto. Czy możesz wspierać miasto, zanim sytuacja nie poprawi się?"
"0xcdf0b22a" = "Kilka dni temu w jednym z naszych miast pewien obywatel umarł na zakaźną chorobę. Próbowaliśmy ukryć ten fakt, ale obawiam się, że rozeszła się plotka. Teraz wielu kupców postanowiło omijać to miasto. Ty masz wspaniałą flotę kupiecką. Czy mógłbyś przez pewien czas wspierać to miasto?"
"0xcdfdf758" = "Twoje okręty zmusiły napastników do ucieczki."
"0xce03abbc" = "Hiszpański pirat"
"0xce36d9cb" = "Konwój ekspedycyjny"
"0xce43a07c" = "Zaatakowałeś konwój należący do zaprzyjaźnionego narodu. W tym scenariuszu narody utrzymują ze sobą pokój, co oznacza, że w żadnym razie nie wolno ci atakować kupców, ani konwojów wojskowych."
"0xce4d9a57" = "Handel w mieście"
"0xce75e5c4" = "Nauczyłeś się kupować i sprzedawać towary. Zawsze staraj się kupować towary w miastach, gdzie są one produkowane, ponieważ zwykle będą tam tańsze.<n><n>Uwaga: Jeśli chcesz handlować z konwojem, musisz go wybrać i konwój musi znajdować się w mieście, zanim wejdziesz do doków.<n><n>W dalszej części scenariusza powinieneś samodzielnie zdobyć zyski z handlu. Okno wydarzeń zawiera wskazówki, które ci w tym pomogą.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Musisz zdobyć z handlu @g$GoldGoal$, w gotówce."
