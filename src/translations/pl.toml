"0xd83f794d" = "Twój rejestr handlowy w tym mieście jest zbyt mało imponujący, aby zezwolono ci na spotkanie ze skarbnikiem. Dostarczaj towary, których miasto potrzebuje, aby poprawić swój rejestr handlowy."
"0xd83f9cae" = "Dziennik"
"0xd850a739" = "<n>Czy dasz mi trochę złota na utrzymanie dodatkowych żołnierzy? Mogę nająć %2 nowych żołnierzy za %1."
