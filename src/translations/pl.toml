"0xfc3ac0b4" = "Zniszczyłeś kryjówkę Czarnobrodego, ale nie udało ci się zniszczyć wcześniej wszystkich jego konwojów."
"0xfc3fdd9b" = "Nie udało ci się przywrócić populacji Tortugi. <n><n>Nowych robotników można najmować, gdy miasto osiągnie status „nagłego rozwoju” lub wyższy. Możesz dostarczać miastu nowych robotników w formie rodzin osadniczych. Przybywają z Europy do miast gubernatorskich, gdzie czekają na podróż do innych miast. Znajdziesz także osadników czekających na zabranie w miastach o niższym statusie."
