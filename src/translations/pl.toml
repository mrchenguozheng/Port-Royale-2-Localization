"0x142de1b9" = " Jestem pewien, że nauczyłby tego i owego jednego z twoich kapitanów! A zatem, czy dasz mi złoto?"
"0x142de1ba" = " Za @g$Price$ powiem ci, gdzie możesz znaleźć człowieka imieniem @N$ContactName$."
"0x142de1bb" = " Wielu myślało, że on od dawna nie żyje, ale ostatnio spotkałem kupca, który natrafił na jego kryjówkę. Zdaje się, że po prostu ukrył się przed światem. Za @g$Price$ powiem ci, gdzie możesz znaleźć tego kupca."
