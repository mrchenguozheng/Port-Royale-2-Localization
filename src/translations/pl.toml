"0x132a8a31" = "%1 wypuściła pirata imieniem %2, który ma sabotować nasze miasta. Całkiem niedawno zaatakował miasto %3, a teraz płynie do domu. Wyświadczyłbyś mnie i mojemu narodowi wielką przysługę, gdybyś powstrzymał tego pirata."
"0x132a8a32" = "Właśnie dowiedziałem się, że pirat imieniem %1 niedawno opuścił miasto %2, aby zaatakować jedno z naszych miast. Mam nadzieję, że uda nam się go zatrzymać zanim uderzy. "
"0x132a8a33" = "Z rozkazu, który wydała %2, pirat imieniem %1 jest w drodze, by zaatakować nasze miasta. Dowiedziałem się, że obecnie przebywa w mieście %3, gdzie przygotowuje się do swojej następnej akcji."
"0x132e00ca" = "Jestem zachwycony! Od tego dnia wrogość między nami odchodzi do przeszłości."
"0x13385f0f" = "Dobra robota! Mając list kaperski zostajesz oficjalnie włączony do służby Holandii i weźmiesz udział w wojnie z Anglią. Oznacza to, że możesz atakować angielskie statki kupieckie bez straty reputacji w Holandii, Francji lub Hiszpanii.<n><n>Naturalnie, twoja reputacja w Anglii pogorszy się i od tej chwili, gdy tylko znajdziesz się na angielskich wodach, musisz wypatrywać konwojów wojskowych, które będą cię ścigały!<n><n>Wszystkie miasta angielskie znajdują się na południowy wschód od Wysp Turk. Pożegluj w tym kierunku swoim konwojem i poszukaj odpowiednich konwojów kupieckich, które będziesz mógł przejąć. Sprzedawaj łupy i mniejsze statki, aby zwiększyć swój majątek.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Przechwyć trzy angielskie konwoje kupieckie: wejdź na pokład ich statków i dodaj je do swojego konwoju. "
"0x133e8429" = "a port jest wystarczająco bezpieczny."
"0x13475956" = "Zarządzanie beta-testami, mastering"
"0x13493847" = "Konwój jest naprawiany i nie można go wysłać w drogę.<n>Czy chcesz zatrzymać naprawę konwoju?<n>Nie otrzymasz zwrotu złota!"
