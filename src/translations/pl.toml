"0x146c233b" = "Gratulacje! Udało ci się pomyślnie wykonać każde z zadań w tym scenariuszu, w ciągu @I$Days$ dni i zgromadziłeś sumę aktywów w wysokości @g$Wealth$.<n><n>Twój wynik wynosi teraz: @I$Val1$"
