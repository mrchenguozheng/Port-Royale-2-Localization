"0xd0b3158e" = "Dobrze. Chciałbym, żebyś zniszczył dwa porzucone statki, które znajdują się mniej więcej dwa dni na północ od Cartageny."
"0xd0b3158f" = "Doskonale! Konwój pirata imieniem @P$PirateName$ znajduje się w pobliżu Belize, to jest około 5 dni podróży na północny zachód stąd. To miasto znajduje się na północnym zachodzie. Potem wróć tutaj, aby powiadomić mnie o twoim sukcesie."
"0xd0b31590" = "Nieco ponad 1 dzień drogi na zachód od Cartageny znajduje się mała wyspa Providence. Widziano tam konwój piracki, którym dowodzi @P$PirateName$. Powinieneś znaleźć konwój piracki, którym dowodzi @P$PirateName$, po około 1 dniu podróży na północny wschód stąd.<n>Zniszcz ten konwój, a potem wróć tutaj, aby opisać mi dokładnie wszystkie wydarzenia."
