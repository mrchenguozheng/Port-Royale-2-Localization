"0xfc64ab0e" = "Możesz poprawić swoją reputację, jaką darzy cię %1, atakując francuskie statki i miasta. To nie pogorszy twojej reputacji w pozostałych państwach."
"0xfc692ef1" = "<n><n>Jeśli jednak przynajmniej jeden statek w twoim konwoju przetrwa bitwę, kapitan także przeżyje."
"0xfc71eb4b" = "Cóż za pech mnie gnębi. Od czasu, gdy @n$FoeNation$ rozpoczęła wojnę z nami, nie jestem w stanie zgromadzić dość towarów kolonialnych dla konwojów transportowych. Czy pomożesz mi, dostarczając duży ładunek towaru: @G$Goods$?"
"0xfc71eb4c" = "Od kiedy @n$FoeNation$ wojuje z nami, ich kupcom zabroniono dostarczać towar: @G$Goods$ do miast należących do mojego kraju. Teraz moim problemem jest znaczący niedobór towarów. Ty masz wiele statków i dobrze znasz morze. Czy mógłbyś zdobyć dla mnie dużą dostawę towaru: @G$Goods$?"
"0xfc72151e" = "Magazyn – Transfer z konwojem"
"0xfc7ddb7d" = "%1 %2"
"0xfc8dd1be" = "Według liczby dział"
"0xfc910833" = "Dostępne budynki mieszkalne"
"0xfc9a5f7d" = "Przyjemnie było prowadzić z tobą interesy. Dobrego dnia!"
"0xfc9a5f7e" = "Towary zostały wysłane do twojego magazynu. Dobrego dnia!"
"0xfc9a5f7f" = "Towary zostały załadowane na statki twojego konwoju. Do widzenia, %1."
"0xfc9cf623" = "Ukończone"
"0xfca882e8" = "Jak wiesz, hiszpańska flota skarbów zawsze wybiera inny szlak, gdy zbiera skarby ze swoich kolonii i odsyła je do Europy. Flota unika zasadzki przebywając w każdym mieście tylko przez krótki czas. Jednak tym razem Hiszpania popełniła poważny błąd, pozwalając nam znaleźć szlak, którym w tej chwili podąża hiszpańska flota skarbów. Twoje rozkazy nie mogłyby być prostsze. Zniszcz okręty, co do jednego!"
"0xfca882e9" = "Prowadzimy wojnę z Hiszpanią i muszę zadbać o to, by hiszpańska flota skarbów nigdy nie dotarła do Europy. Na szczęście, dowiedzieliśmy się, do którego miasta zawita następnym razem ta flota. Sabotujemy flotę w tym mieście, aby przedłużyć jej pobyt w porcie. To powinno dać ci dość czasu na przejęcie floty i uniemożliwienie jej dotarcia do Europy. Czy przyjmujesz tę misję?"
"0xfca882ea" = "Taka okazja nie zdarza się co dzień! Dzisiaj jeden z moich informatorów pokazał mi szlak, jakim aktualnie podąża hiszpańska flota skarbów. Ale to nie wszystko. Dowiedzieliśmy się, że flota będzie stała na kotwicy dłużej niż zwykle, w następnym mieście, które odwiedzi. Ponieważ prowadzimy wojnę z Hiszpanią, powinniśmy dać wicekrólowi powód do zadowolenia i sprawić, by flota skarbów nigdy nie dotarła do swojego celu w Europie. Czy przechwycisz flotę dla mojego narodu?"
"0xfcc82d44" = "Szermierz"
"0xfcd6fdec" = "Widzę, że nadal nie wykonałeś mojej ostatniej misji. Skończ to zlecenie, ponieważ mam kolejną pracę dla ciebie."
"0xfcded04c" = "IDM_CONTEST_01_2004_LOG_01_TEXT"
"0xfce1cfd1" = "Obawiam się, że w tej chwili nie mogę cię niczym zająć.<n> Mogę zlecić ci przejęcie miasta tylko wtedy, gdy wrogi naród jest osłabiony, a ja będę miał dość dostępnych konwojów wojskowych, by strzec moich miast."
"0xfce38f12" = "Dowódca miasta"
"0xfcf67c79" = "%s%s"
"0xfcf97130" = "Otoczenie"
"0xfd1be8e3" = "%1 pirat %2 wkradł się do miasta i zniszczył znaczne zapasy dóbr należących do kilku miejskich kupców. Rada miejska odmawia przyjęcia na siebie odpowiedzialności za to wydarzenie."
"0xfd1f0281" = "Surowce i produkcja"
