"0x1aa78781" = "Atak na holenderski konwój wojskowy"
"0x1aa78782" = "Atak na hiszpański konwój wojskowy"
"0x1ab784e9" = "Zniszcz konwój piracki"
"0x1ab9b63f" = "Śladem Czarnobrodego! "
"0x1ac13fc5" = "Zaraza"
"0x1ac38a65" = "%1. %2. %3"
"0x1acbcf40" = "Który konwój możesz mi ofiarować?"
"0x1af8f2c6" = "Aktywny od %1"
"0x1b0a0b6d" = "Osiągnąłeś rangę „żeglarza”. W tej chwili musisz coś zrobić, aby utrzymać swoją wysoką reputację w państwie.<n><n> Możesz poprawiać swoją reputację wśród narodów prowadząc handel, wspierając datkami kościół, organizując festiwale, niszcząc piratów, a także wypełniając misje i cele listów kaperskich.<n><n>Jeśli twoja reputacja w jakimś państwie nie poprawia się, każdego dnia pogarsza się odrobinę. Zauważ, że liczba budynków, które wybudowałeś w miastach danego narodu, określa minimalny poziom, do jakiego może spaść w ten sposób twoja reputacja.<n><n>Twoja reputacja wpływa zarówno na ceny uzyskiwane podczas handlu, jak i na misje przydzielane ci w miastach. Jeśli twoja reputacja jest niska, musisz uważać także na konwoje wojskowe!"
"0x1b33d8e6" = "Transportowane mogą być towary nieużywane!"
"0x1b407276" = "Produkcja"
"0x1b416d15" = "Aktywa"
"0x1b4bfca3" = "<g:INTEXT_TREIBGUT_800x600.screen>"
"0x1b818264" = "Liczba mieszkańców (populacja minus liczebność żołnierzy) w Tortudze musi zostać przywrócona do @I$Pop$, zanim nadejdzie @D$EndDate$. W ten sposób zapewnisz, że wszystkie przedsiębiorstwa będą miały pełną obsadę pracowników."
"0x1b900424" = "Podróżnik"
"0x1ba04e6b" = "Konwój wojskowy, którymi dowodzi %1, został zniszczony przez statki, których właścicielem jest %2."
"0x1ba7362a" = "Okręty wojenne, którymi dowodzi %1, zaatakowały konwój kupiecki, których właścicielem jest %2."
"0x1bcad43f" = "%1 pirat %2 dostał się dzisiaj do miasta pod fałszywym nazwiskiem i wywołał znaczne poruszenie wśród robotników. Teraz robotnicy odmawiają pracy przez dwa tygodnie."
"0x1bccfb60" = "Cena całkowita"
"0x1be1209e" = "Twoje własne miasto"
"0x1be7a5dc" = "Musisz znaleźć paczkę. @l$Pos$ @N$OwnerName$ czeka na nią w mieście @T$TOWN$, dopóki nie nadejdzie @D$EndDate$. "
"0x1bf425d5" = "Niestety, jesteś wrogiem narodu, do którego należy do miasto i musisz wkraść się do portu."
"0x1c0b520a" = "Nie ma zapisanych gier"
"0x1c1160cb" = "Dyrektor techniczny"
"0x1c16ab5a" = "Transfer do magazynu:"
"0x1c394b47" = "Doświadczenie w bitwach morskich"
"0x1c4cc4f1" = "%1: Statek naprawiony"
"0x1c703500" = "Gubernator pilnie pragnie z tobą porozmawiać."
"0x1c74c605" = "Zabierasz ze sobą %1."
"0x1c7e1413" = "Dziękuję ci!<n> Naturalnie, najpierw musisz dostać zezwolenie w mieście, ale z pewnością je otrzymasz.<n>Ja oczywiście zapłacę ci za wszelkie wydatki, gdy tylko szkoła zostanie zbudowana. Urodziny mojej żony przypadają w dniu @D$EndDate$, zatem dopilnuj, by do tego czasu zostały postawione fundamenty szkoły."
"0x1c7e1414" = "To dobrze. Zacznij budowę szkoły, zanim nadejdzie @D$EndDate$. Potem zapłacę za twoje wydatki.<n>Nie zapominaj, że musisz mieć zezwolenie na budowę szkoły w mieście @T$Town$.<n>Nie wypuść o tym pary z gęby przed moją siostrą."
"0x1c7e1415" = "Dziękuję ci! @T$Town$ dowie się teraz o naszej umowie. Rozpocznij budowę, zanim nadejdzie @D$EndDate$. Potem zapłacę za twoje wydatki.<n>Nie zapominaj, że musisz mieć zezwolenie na budowę szkoły w mieście @T$Town$."
"0x1c7e9deb" = "%1: Pożyczka w wysokości %2 spłacona."
"0x1c83647f" = "Uzbrojenie i amunicja:"
"0x1ca41002" = "Scenariusz ukończony"
"0x1ca50773" = "Dobra robota! Teraz masz imponujący konwój.<n><n>Twoje następne zadanie nie będzie łatwe, ponieważ polega na zaatakowaniu i pokonaniu angielskiego konwoju wojskowego. Gubernator Wysp Turk dostarczył ci jeszcze jeden statek jako wsparcie. Znajdź go w porcie Wysp Turk i dodaj do swojego konwoju.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zniszczyć angielski konwój wojskowy."
"0x1ce621bb" = "Obszar mieszkalny miejscowego kupca"
"0x1ce62aab" = "Aktualne misje"
"0x1ce81e5e" = "Typ gry"
"0x1cf07333" = "Dobra robota, osiągnąłeś swój pierwszy cel w ciągu @I$Days$ dni. Twoim następnym celem jest zwiększenie liczby mieszkańców żyjących w mieście. Aby to zrobić, załóż pięć przedsiębiorstw, po jednym z każdego rodzaju, jakie są dozwolone w mieście.<n><n>Pamiętaj, że Tortugę odwiedza niewielka liczba kupców i musisz zadbać o to, żeby miasto miało wystarczające zapasy, a jego status był na tyle wysoki, by miasto mogło przyjmować nowych osadników. Nie zapominaj także o zapewnieniu odpowiedniego miejsca do zamieszkania dla obywateli.<n><n>Masz 60 dni na osiągnięcie tego celu. Im szybciej go osiągniesz, tym lepiej.<n><n>Wskazówka: Żołnierze są częścią populacji miasta, ale nie liczą się jako jego mieszkańcy! Możesz zwiększać liczbę mieszkańców w mieście tylko tworząc miejsca pracy.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Załóż pięć różnych przedsiębiorstw w Tortudze i zwiększ liczbę mieszkańców do 1500, zanim nadejdzie @D$EndDate$. Nie zapomnij o zapewnieniu odpowiedniej przestrzeni mieszkalnej! Każde przedsiębiorstwo wymaga jednego obszaru mieszkalnego."
"0x1d01f111" = "Dźwięk"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Statkiem, który tu zatonął, musiał dowodzić bardzo doświadczony kapitan. W skrzyni nie ma złota, ale znajdujesz pieczołowicie spisywany dziennik, który należał do kapitana imieniem @L$RandLName$. W rezultacie, doświadczenie kapitana konwoju @C$Convoy$ wzrasta o dwa punkty."
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Skrzynia ze skarbem jest jednak pusta. Posłużono się nią jako boją do utrzymania liny. Tuż pod powierzchnią odnajdujesz kryjówkę zawierającą działa. Twoja załoga zaciąga na pokład tyle dział, ile się da."
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Na okolicznych wodach pływa spora liczba baryłek rumu. Twoi ludzie wydobywają tyle baryłek, ile jest w stanie unieść twój konwój."
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Twój konwój natrafił na dużą drewnianą skrzynię. Natychmiast zostaje wyłowiona i otwarta. Nareszcie jakiś prawdziwy skarb, myśli kapitan widząc @g$Gold$."
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>Stara i niemal całkiem przegniła drewniana skrzynia unosi się na wodzie. Cokolwiek kiedyś zawierała, teraz nic nie zostało, poza odrażającym smrodem. Pomimo tego, morale twojej załogi poprawia się, ponieważ poszukiwanie skarbu nareszcie dobiegło końca."
"0x1d19d29c" = "Zezwolenie na budowę w mieście %1"
"0x1d6d7bd9" = "a port jest silnie broniony."
"0x1db06b05" = "Znajdź paczkę"
"0x1db7f908" = "Niestety, nie zdążyłeś zgromadzić @g$GoldGoal$ w gotówce.<n><n>Sprzedaj towary w swoim magazynie z Tortugi w miastach, gdzie ich brakuje i szukaj towarów, które możesz kupić za dobrą cenę.<n><n>Możesz także wziąć pożyczkę od skarbnika w Tortudze."
