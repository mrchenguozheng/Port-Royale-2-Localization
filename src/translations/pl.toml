"0xd06e1e7e" = "Opuść miasto"
"0xd07dbe34" = "Najważniejszymi czynnikami wpływającymi na jakość życia w mieście są podaż i wybór dostępnych towarów. Nie musisz jednak dbać o zadowolenie mieszkańców zapewniając im zapasy wszystkich rodzajów towarów.<n><n>Towary w mieście można podzielić na pięć grup: towary podstawowe, surowce, towary finalne, dobra kolonialne i importowane. W tej kolejności wymienione są w oknie handlu. Wystarczający zapas dwóch do trzech towarów w każdej grupie zapewni dobrą jakość życia w twoim mieście. <n><n>Właśnie otrzymałeś komunikat na temat jakości życia w miastach. Możesz wyświetlić go w dzienniku.<n><n>Ponieważ twoje miasto jest nadal małe, bardzo łatwo będzie zapewnić w nim dobrą jakość życia, ponieważ mieszkańcy małych miast nie są zbyt wymagający. To oznacza, że nie powinieneś mieć żadnych problemów z osiągnięciem celu. Jednak miasto posiadające ponad 2000 mieszkańców nie może przekroczyć stanu „nagłego rozwoju”.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Cel scenariusza<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Zapewnij swojemu miastu zapasy pięciu beczek każdego towaru."
