"0xf725f232" = "Продайте как можно больше товаров по выгодной цене и купите новые товары. <n>Обратите внимание, что цены на товары, которых городу не хватает, подсвечиваются красным. За эти товары вы получите в этом городе немало денег.<n>"
"0xf725f233" = "Административные центры, такие как [town:Cartagena], получают импортные товары из Европы.<n>Эти товары можно с выгодой продавать в колониальных городах, например, Санта-Марта, Маракайбо или Гибралтар.<n>А теперь некоторое время поторгуйте самостоятельно.<n>Ваша цель — заработать торговлей @g$GoldGoal$."
