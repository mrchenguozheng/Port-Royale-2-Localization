"0x24695110" = "Благодарю вас. Я торговец из г. @T$Town$. Мои преследователи не знают, где меня искать, поэтому, скорее всего, начнут с моего родного города. Отправляйтесь туда и убейте их. Я должен уплыть отсюда не позднее @D$EndDate$. Если вы справитесь с моим заданием до этого времени, я заплачу вам @g$Reward$."
"0x24695111" = "Мои дела вынуждают меня срочно вернуться в город @T$Town$. К сожалению, за городом @T$Town$ внимательно наблюдает охотник за головами, которого вы должны убить. Я заплачу вам @g$Reward$, если вы выполните мое задание до @D$EndDate$."
"0x24695112" = "Благодарю вас! Я подозреваю, что охотник за головами наблюдает за входом в гавань города @T$Town$.<n>Вот что мы сделаем. Я расскажу всем, что поплыву на борту одного из ваших кораблей, а затем вы отправитесь к городу @T$Town$ и посмотрите, что произойдет.<n>Убедитесь, что путь свободен и дайте мне знать до @D$EndDate$, и я заплачу вам @g$Reward$."
"0x246aece6" = "%1: голод"
"0x2478c95f" = "Поздравляем! Вы успешно завершили сценарий и избавили Карибское море от печально известного пирата.<n><n>Со временем будут появляться новые логова пиратов, а в зависимости от того, насколько успешно действуют разбойники, будет зависеть количество их караванов. Пираты нападают только на торговые суда и опасаются военных. Поэтому они будут избегать тех районов, где много военных кораблей.<n><n>В свободной игре вы также сможете охотиться на пиратов и уничтожать их логова."
