"0xfc9cf623" = "Завершён"
"0xfca882e8" = "Как вам известно, каждый раз, когда Золотой флот собирает сокровища в колониях и перевозит их в Европу, он выбирает новый маршрут. Кроме того, чтобы не попасть в засаду, корабли никогда подолгу не задерживаются в одном городе. Однако на этот раз испанцы допустили серьезную ошибку, которая позволила нам узнать маршрут, по которому Золотой флот следует в этот раз. Ваша задача предельно проста: уничтожить все корабли до единого!"
"0xfca882e9" = "Мы хотим, чтобы Золотой флот Испании, с которой мы ведем войну, не добрался до Европы. Нам повезло, и мы смогли узнать, в какой город он сейчас направляется. Мы устроим диверсию в этом городе, и Золотому флоту придется задержаться в порту. Это даст вам достаточно времени для того, чтобы перехватить и уничтожить флот. Вы возьметесь за это задание?"
"0xfca882ea" = "Такой шанс упускать нельзя! Сегодня от одного из моих информаторов мне стал известен маршрут, по которому следует испанский Золотой флот. Но это еще не все! Я также узнал, что в следующем городе, который посетит флот, корабли задержатся дольше, чем обычно. Мы ведем войну с Испанией, и я подумал, что наш вице-король будет доволен, если Золотой флот не доберется до Европы. Вы согласны уничтожить флот?"
