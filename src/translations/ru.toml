"0x2ee8bb8c" = "Мы находимся в административном центре [town:Cartagena] в южной части Карибского моря.<n>Вы можете посещать городские здания и выполнять различные действия (позже мы подробно на этом остановимся).<n>Прежде всего, посмотрите на верхнюю часть экрана. Там находятся разнообразные кнопки и индикаторы. <n>Нажмите кнопку с часами в левом углу экрана."
"0x2ee8bb8d" = "Это — хроника. Сюда заносится информация обо всех событиях, которые происходят в Карибском бассейне.<n>Справа от окна хроники находятся несколько кнопок. Их можно использовать, чтобы узнать различные сведения о Карибах. Но пока что это не важно. <n>Закройте окно хроники, нажав кнопку 'X'."
"0x2ee8bb8e" = "В верхней части экрана находится кнопка журнала, а рядом с ней показано количество ваших средств.<n>В журнале можно найти информацию о ваших достижениях, собственности и полученных вами заданиях, а также прочитать сообщения. <n>Откройте журнал. "
"0x2ee8bb8f" = "Как видите, в журнале хранятся все полученные вами сообщения. Пока вы получили только одно сообщение — инструкции к этому сценарию.<n>Справа от окна журнала находятся несколько кнопок. Щелкните по третьей. "
"0x2ee8bb90" = "Здесь перечислены задачи и задания, которые вам нужно выполнить. В данный момент здесь показаны только цели сценария.<n>Используя две кнопки в верхней части окна заданий, вы можете переключаться между текущими и выполненными заданиями.<n>Закройте журнал (для этого просто щелкните правой кнопкой мыши)."
"0x2ee8bb91" = "Позже в игре вы будете получать различные задания, выполнение которых будет приносить вам славу и богатство.<n>А теперь давайте осмотрим город. Название города — [town:Cartagena] — отображается в центре верхней части экрана. В городе живет примерно 2000 жителей.<n>Нажмите кнопку с названием города."
"0x2ee8bb92" = "На экране появится окно с информацией о городе.<n>[town:Cartagena] — принадлежащий Испании административный центр. Также в этом окне указан статус города и товары, которые в нем производятся.<n>Теперь давайте зайдем в здание. Для этого сначала закройте окно с информацией о городе."
"0x2ee8bb93" = "Чтобы перемещать окно города, вы можете использовать клавиши стрелок на клавиатуре. Посмотрите на центральную часть города, защищенную городскими стенами. Там находятся такие здания, как доки, церковь и дворец губернатора.<n>Щелкните по любому из них."
"0x2ee8bb94" = "Когда вы щелкаете по зданию, окошко в центре нижней части экрана изменяется. В зависимости от типа здания, вы можете получить информацию или произвести определенные действия.<n>Справа от окна здания расположено несколько кнопок. Чтобы покинуть здание, нажмите на кнопке 'X'."
"0x2ee8bb95" = "Здания, в которых можно производить какие-либо действия, всегда находятся за городскими стенами. Единственное исключение — ваш склад. Со складом мы познакомимся в следующем сценарии.<n>А теперь покиньте здание и переместитесь к порту, к кораблю 'Санта-Мария'. Щелкните по кораблю."
"0x2ee8bbfd" = "Как видите, в центре нижней части экрана появилась информация о караване. <n>На борту уже есть товары: 10 бочек пшеницы и 15 бочек кукурузы.<n>Справа от окна каравана находятся несколько кнопок. Нажмите вторую кнопку (с изображением корабля)."
"0x2ee8bbfe" = "Здесь показывается количество кораблей в караване. В караване может быть до 10 кораблей, которыми командует один капитан.<n>Давайте отправим караван в другой город.<n>Чтобы покинуть экран города и вывести морскую карту, нажмите кнопку со стрелкой в правой верхней части экрана."
"0x2ee8bbff" = "На экране появится морская карта. В ее центре находится [town:Cartagena].<n>С помощью клавиш со стрелками можно перемещать окно карты и осмотреть весь игровой мир.<n>А теперь найдите город Порт-Рояль, находящийся на острове к северу от вас, и щелкните по городу правой кнопкой мыши."
"0x2ee8bc00" = "Будет проложен маршрут, и ваш караван отправится в плаванье.<n>Щелкнув правой кнопкой мыши по Порт-Роялю, вы выбрали его в качестве пункта назначения.<n>Если путь к городу занимает слишком много времени, вы можете ускорить ход игры с  помощью клавиши 'Пробел' (по умолчанию). "
"0x2ef566b4" = "Клавиатура"
"0x2ef8f665" = "Добро пожаловать в город %1!<n><n>Я дам вам несколько советов, которые помогут вам быстрее освоиться в городе %2 и окружающих его районах. Думаю, вы сможете внести свой вклад в развитие этого и других городов нашей страны.<n>Я уверен, что вам уже известно об основных особенностях административных центров. Вы должны обеспечивать постоянные поставки колониальных товаров для их дальнейшей отправки в Европу. В то же время, в этих городах можно приобрести различные предметы роскоши, а затем с выгодой перепродать их в других городах.<n>И еще: иногда губернаторы будут предлагать вам выполнить для них различные поручения. Однако это случится не раньше, чем вы достигнете звания юнги.<n><n>%3 %4, губернатор города %5"
"0x2efebfdd" = "Ваш караван прибыл в Порт-Рояль, и вы можете войти в город. Щелкните по иконке города (с изображением маленьких домов)."
"0x2efebfde" = "На экране снова уже знакомый вам вид города, но на этот раз вы находитесь в Порт-Рояле. Вы можете войти в любой город, в котором у вас есть караваны или здания.<n>Теперь давайте купим новый корабль. Найдите в порту верфь и щелкните по ней."
"0x2efebfdf" = "В окне выбора теперь показана верфь, а не караван.<n>Познакомьтесь с возможностями верфи, нажимая на кнопки справа от окна.<n>Вернитесь к окну 'Купить корабль' и посмотрите, что выставлено на продажу.<n>Приобретите понравившийся вам корабль."
"0x2efebfe0" = "Поздравляем! Вы купили корабль.<n>Он появится в порту города.<n>Покиньте верфь и щелкните по порту. Появится окно, в котором будут перечислены находящиеся в гавани корабли. <n>Выберите свой новый корабль."
"0x2efebfe1" = "Здесь приведена информация о корабле, с которой вы уже могли познакомиться в окне верфи.<n>Прежде чем вы сможете что-либо сделать с кораблем, его нужно добавить в состав каравана.<n>Для этого снова выберите караван."
"0x2efebfe2" = "Присоединим к каравану ваш новый корабль.<n>Щелкните по порту правой кнопкой мыши.  "
"0x2efebfe3" = "Откроется окно обмена, с помощью которого вы можете добавлять суда к каравану.<n>Для этого перетащите мышью корабль из левой части окна в караван. Теперь ваш караван состоит из двух кораблей.<n>Закройте окно обмена, нажав на кнопке 'X'."
"0x2efebfe4" = "Также вы могли бы создать с помощью нового корабля отдельный караван, наняв капитана в таверне.<n>Однако сейчас вы этого сделать не можете, поскольку у вас слишком низкое звание.<n>А теперь нажмите вторую кнопку, чтобы вывести список кораблей в караване."
"0x2efebfe5" = "В порту Порт-Рояля находится ваш караван из двух кораблей.<n>Чтобы получить более подробную информацию об одном из них, щелкните по названию корабля в списке.<n>А сейчас давайте отправим караван обратно в Картахену. Для этого вы должны перейти на морскую карту, нажав кнопку со стрелкой в правой верхней части экрана. "
"0x2efebfe6" = "Найдите Картахену (она расположена к югу от вас) и отправьте туда караван, щелкнув по городу правой кнопкой мыши.<n>Как только ваши корабли прибудут в Картахену, сценарий будет завершён."
