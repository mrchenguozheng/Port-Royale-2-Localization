"0x24c12812" = "Поздравляем! Вице-король доверил вам захват города!<n><n>Хорошо защищенные города могут оказаться вам не по зубам, поэтому вы должны выбрать английский город с минимальным количеством пушек в порту. Например, вам подойдет город @T$SampleTown$.<n><n>Чтобы напасть на него, вы должны включить для каравана опцию 'Атаковать города'. Для этого выберите караван и нажмите кнопку 'Режим атаки'.<n><n>Атаковать город можно с суши или с моря. Нападать с суши имеет смысл только в том случае, если ваши матросы численно превосходят гарнизон города. Если вы нападаете с суши, то должны вооружить одну половину своих матросов абордажными саблями, а вторую — мушкетами.<n><n>Обратите внимание: если в порту города находится военный караван, вы должны сначала сразиться с ним.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Выполните задание по захвату города."
"0x24e18ac4" = "[ref:0x101874f6]"
"0x24ec3366" = "Прекрасно! Ваш караван вооружен и готов сразиться с одним из караванов Черной Бороды. <n><n>Каждый день в окне сообщений будут появляться подсказки, которые помогут вам найти в море пиратский караван. Найти пиратов может быть непросто, ведь после каждого удачного налета на торговые караваны они возвращаются в свое логово.<n><n>В пиратском караване может быть до пяти боевых кораблей. Если вы думаете, что ваш караван недостаточно мощен, вооружите его. Как достать золото, вы уже знаете.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Выполните задание губернатора города @T$TOWN$."
"0x250c7a12" = "Доставьте @a$Amount$ до @D$Date$. Вы можете сдать товар на рынке и сразу получить @g$GoldPerBarrel$ за каждую <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> @G$Goods$."
"0x250c7a13" = "Хорошо. Пожалуйста, доставьте @a$Amount$ товара на рынок. Вы получите @g$GoldPerBarrel$ за каждую <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen> товара. У вас есть время до @D$Date$."
"0x250c7a14" = "Встретьтесь с моим человеком на рынке. Передайте ему @a$Amount$ товара @G$Goods$ до @D$Date$, он предложит вам хорошую цену."
"0x2540ea42" = "Дополнительный текст (историк)"
"0x2546beb9" = "Итак, вас послал ко мне @N$OwnerName$? Да, я знаю этого старого капитана. Он мог бы научить вашу команду парочке новых трюков. Но почему я должен вам помогать? Впрочем, было бы невежливо прогонять вас. Давайте договоримся: вы окажете мне небольшую услугу, а я расскажу вам, где живет капитан."
