"0xda93dbe1" = "Очень хорошо! Это был непростой подвиг! Англия потеряла столько военных караванов, что её города можно захватывать. В благодарность за службу губернатор островов Теркс дарует вам ещё четыре караки.<n><n>Захватывать города государства можно только по приказу вице-короля. Вице-король прикажет захватить город, лишь если его собственное государство военно сильно, а государство противника военно слабо.<n><n>К сожалению, Голландия недостаточно сильна, чтобы захватить город. Однако вы можете это исправить: навестите голландского вице-короля в Гранд-Багаме и передайте ему один из своих караванов. Он соберёт новый военный караван, и военная мощь Голландии возрастёт.<n><n>Если вы хотите передать караван вице-королю, в нём должно быть ровно пять кораблей и не менее 150 пушек.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Помогите вице-королю усилить военную мощь Голландии. Затем примите от него задание захватить город."
