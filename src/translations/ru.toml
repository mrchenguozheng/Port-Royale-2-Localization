"0xd4cd0f3d" = "Генри Эйвери — яркий пример удачливого пирата. Он захватывал богатейшие корабли своего времени, сумел уйти от властей и прожил достаточно долго, чтобы насладиться своим богатством.<n><n>Ранние годы Эйвери окутаны тайной. Известно лишь, что в июне 1694 года он был помощником капитана на капере «Чарльз», которому испанцы разрешили захватывать корабли французской колонии Мартиника в Вест-Индии. Однажды он поднял мятеж и захватил корабль, и большая часть команды поддержала его. Быстрый 46-пушечный капер, идеально подходивший на роль пиратского корабля, был переименован в «Фэнси». В 1695 году он совершил свой величайший подвиг: разграбил индийский флот с сокровищами. В союзе с другими пиратами он атаковал тяжеловооружённый индийский флот с сокровищами и захватил два корабля. Они принадлежали самому Великому Моголу и были загружены невообразимыми сокровищами. <n><n>Подкупив губернатора Багамских островов, чтобы тот предоставил пиратам защиту, Эйвери расплатился с командой, которая затем разбрелась по всему свету. Некоторых из них позже поймали в Англии, но сам Эйвери уплыл в Ирландию, где бесследно исчез. Остаётся лишь предполагать, что он продолжал наслаждаться богатством, скрываясь от всех."
"0xd4cd0f3e" = "Одним из самых известных пиратов всех времён был Эдвард Тич (умер в 1718 году), по прозвищу Чёрная Борода, чьей визитной карточкой, как явствует из имени, была устрашающая чёрная заплетённая борода. С командой в 300 человек он бороздил открытое море на своём корабле «Месть королевы Анны» — переоборудованном голландском торговом судне — и не боялся вступать в бой с военными кораблями Королевского флота.<n><n>За 18 месяцев Тич, родившийся в Бристоле, навёл немало страху, главным образом в северной части Вест-Индии и вдоль побережья Северной Америки. Убежище он всегда находил на Багамах и в нищей Северной Каролине.<n><n>Ещё одна причина, по которой Чёрная Борода был так знаменит, — он полностью соответствовал образу страшного, вспыльчивого и необузданного буканьера: рассказывают, что он искалечил своего канонира Израэля Хэндса, дважды выстрелив в него — просто чтобы напомнить остальной команде, кто здесь главный.<n><n>Его последний час пробил лишь в 1718 году, когда охотник за пиратами Роберт Мейнард выследил его шлюп. Хотя Тич был мертвецки пьян, он дрался как дьявол и был побеждён только в жестокой схватке. Он погиб в бою, а большинство выживших членов его команды повесили."
"0xd4cd0f3f" = "В первые годы Эпохи открытий те, кто жаждал приумножить уже нажитое, обнаружили, что сахарные плантации, развивавшиеся с начала XVI века главным образом в Карибском бассейне, дают превосходные возможности для вложений.<n><n>Такие вложения приносили в среднем десять процентов прибыли, а в лучших случаях (например, на Барбадосе около 1650 года) — целых 50 процентов! Естественно, плантации требовали огромного числа работников, и потому из Африки туда привозили сотни тысяч рабов. Причина была в том, что белый человек к тому времени почти полностью истребил коренное население Америки во многих местах. <n><n>Сами европейцы не выдерживали климата, а кроме того, считали себя слишком благородными для такой чёрной работы. Даже плантаторы предпочитали жить в Лондоне или Мадриде и поручали организацию работ в колониях паре своих подручных. К XVIII веку доля чернокожих в населении некоторых островов достигала 90 процентов!"
"0xd4cd0f40" = "Торговля 'черным золотом' началась еще в 16 веке. Работорговцы предпочитали привозить 'товар' с западного побережья Африки, из области, простирающейся от реки Сенегал до границ нынешнего Камеруна. Эта территория была не только идеально расположена с точки зрения перевозки рабов, но и обладала стабильной экономической и социополитической инфраструктурой. Это значит, что морякам не приходилось самостоятельно охотиться за рабами, они могли приобрести их у местных вождей или работорговцев. <n><n>Наибольший спрос был на мужчин 15-35 лет, которых использовали для тяжелого труда на плантациях. Приблизительно каждый пятый раб умирал во время плавания, которое могло продолжаться до шести недель. Некоторые умирали из-за варварского отношения своих хозяев или из-за несчастных случаев в открытом океане. Учитывая такую высокую смертность, работорговцы старались погрузить на корабль как можно больше рабов. На протяжении нескольких недель эти бедняги, прикованные друг к другу цепями, сидели в темноте и тесноте, как сардины в бочке.<n><n>Неудивительно, что в такой обстановке они с трудом доживали до конца путешествия!"
"0xd4cd0f41" = "Хотя в Северной и Центральной Америке не было белых рабов, очень многие европейцы работали там в условиях, мало отличавшихся от рабства.<n><n>Большое количество молодых людей (в основном, из низших слоев общества) намеревались иммигрировать из страны, но у них не было денег на то, чтобы пересечь океан. Поэтому они брали деньги в долг на условии, что какое-то время будут работать на плантациях (или в других местах).<n><n>Однако после заключения договора плантаторы шли на хитрость. Они старались сделать так, чтобы должники все время работали на пределе сил. Кроме того, европейцы крайне плохо переносили карибский климат.<n><n>Эта система 'договорного рабства' часто использовалась и по отношению к преступникам, высланным из родной страны. Позже англичане начали широко практиковать 'договорное рабство' по отношению к индийцам, которых они заставляли работать в африканских колониях."
"0xd4cd0f42" = "По мере роста американских колоний развивалась торговля между странами атлантического региона. Великобритания, самая могущественная морская держава со времен королевы Елизаветы, была очень заинтересована в увеличении товарооборота, так как это могло принести ей немалую прибыль.<n><n>В 1651 году при лорде-протекторе Оливере Кромвеле был составлен 'Первый навигационный акт', в котором говорилось, что только английские корабли могли перевозить товары из колоний в Европу. Этот документ, направленный, прежде всего, против стремительно развивающейся Голландии, благотворно повлиял на развитие торгового флота Англии.<n><n>В 1663 году положения этого акта были ужесточены: колониальные корабли, желающие ввозить товары в Европу, должны были заходить в английские порты и платить торговую пошлину. Однако попытка контролировать товарооборот между колониями окончилась неудачей. Так как английская армия не могла контролировать все побережье, то товары зачастую ввозились нелегально. <n><n>Этот непрерывный конфликт с метрополией, касающийся экспорта и импорта товаров, привел к росту национального самосознания среди местного населения, а позже — к возникновению движения за независимость."
"0xd4cd0f43" = "Начало колониальной эпохи принесло с собой множество болезней, дотоле почти неизвестных на куда более коротких путях по Средиземному морю или вдоль берега. Переход к колониям в Карибском бассейне и Северной Америке занимал от одного до двух месяцев, а то и дольше, если корабль попадал в штормы или в полосы безветрия. Трудности, которые приходилось преодолевать, потому едва ли удивляют: вонь грязной одежды и пренебрежение личной гигиеной, испорченная и гнилая еда, нехватка чистой воды, крысы на борту, а также душевное напряжение от однообразия и тоски по дому. Над каждым моряком висел страшный призрак цинги: эта болезнь, вызванная нехваткой витаминов, проявлялась выпадением волос и зубов и стоила жизни многим морякам. Именно совершивший кругосветное плавание Джеймс Кук (1728–1779) первым сумел победить эту болезнь. Он не только требовал содержать корабль в чистоте, но и снабжал команду квашеной капустой и свежими фруктами. Всякому, кто сходил на берег, приходилось также противостоять тропическим болезням вроде чёрной лихорадки — одной из самых опасных форм малярии: эта инфекция, чьи признаки включают учащённый пульс, жар, озноб и тёмную мочу, почти всегда была смертельной."
"0xd4cd0f44" = "За множеством названий, которые мореплаватели и картографы придумывали для новых земель, рек и поселений, стоят интересные истории. Даже первое имя, данное европейскими исследователями Эпохи открытий в Америке, говорит само за себя. Христофор Колумб назвал остров, на который высадился 12 октября 1492 года, Сальвадором («Спасителем»): так он благодарил Господа за то, что тот защитил караван от болезней и штормов в пути и, главное, предотвратил мятеж, грозивший вспыхнуть буквально в последнюю минуту перед появлением земли.<n><n>В последующие времена испанские конкистадоры чаще выбирали названия с религиозным смыслом, например «Номбре-де-Диос» («Имя Господа») или «Тринидад» («Троица»). В других случаях людей вдохновляли дата или наблюдения за местностью. Так, португальские моряки назвали бухту у берегов Бразилии, открытую ими в новогодний день 1502 года, «Январской рекой» (Рио-де-Жанейро), а название города Монтевидео восходит к предполагаемому возгласу Магеллана при первом виде берега: «Monte vido eu!» («Я вижу гору!»).<n><n>Популярным обычаем было и называть земли и города в честь своих правителей, родной страны или города, откуда прибыл исследователь. Так не только заявляли миру о своих правах на владение, но и сохраняли связь с родиной даже в этих далёких краях.<n><n>Если же ничего не помогало, всегда можно было обратиться к названиям из языков коренных индейцев (хотя в большинстве случаев это не мешало колонизаторам впоследствии изгнать или истребить самих индейцев).<n><n>До сих пор живёт миф о том, что на вопрос Джеймса Кука, как называется это странное сумчатое животное, австралийский абориген ответил «kangooroo» или «ganguru», что будто бы означало лишь «О чём ты говоришь?». Даже если это вымысел, подобные забавные недоразумения наверняка случались. <n><n>Пожалуй, многие удивились бы, узнав, сколько названий городов, гор и рек означают попросту «доброе утро!», «простите?» или «оставьте меня в покое!» ..."
"0xd4cd0f45" = "С появлением испанской империи, простёршейся по всему миру, возникла необходимость в колониальных властях, наделённых достаточными полномочиями для повседневных административных дел и для внезапно возникающих кризисов. Для этого самым важным губернаторам в колониях был присвоен титул вице-короля.<n><n>В пору расцвета мировой империи таких сановников было двое — в Новой Испании (Мексика) и в Перу. Вице-королевства Новая Гранада и Рио-де-ла-Плата добавились в XVIII веке.<n><n> Обязанности вице-короля (его также называли virrey), которые он исполнял вместе с административным советом — аудиенсией — и часто вступал с ним в противоречия, включали обычные дела чиновника: сбор и взимание налогов, надзор за соблюдением законов, организацию обороны колонии и так далее. Он же отвечал за защиту коренного населения Америки и за назначение низших духовных и светских сановников.<n><n>Из-за огромного экономического и политического значения заморских владений корона всегда зорко следила за деятельностью своих вице-королей. Им запрещалось вести какую-либо дополнительную торговлю, приносящую побочный доход. Кроме того, соперничество между вице-королями лишь взаимно ограничивало их власть."
"0xd4cd0f46" = "Хорошо известно, что европейские завоеватели постоянно испытывали недостаток в золоте и серебре. Однако самой большой ценностью были специи. Сложно представить, насколько европейская кухня Средних веков была бы бедна без специй, если люди были готовы на любые, даже самые отчаянные предприятия, чтобы добыть немного перца или муската.<n><n>С этой точки зрения, открытие Америки сначала не оправдало ожиданий. Люди с интересом разглядывали экзотических животных, которых привез с собой Христофор Колумб, радуясь тому, что владения их страны увеличились и христианство спасет тысячи людей, живущих за морем. Однако обещанных гор золота в Америке не оказалось. Путешествия в эту страну стали приносить прибыль только десять лет спустя, когда в Европу буквально хлынул поток американского серебра. <n><n>Из одного такого путешествия Колумб привез нечто более ценное, чем все золото и серебро мира: 4 ноября 1492 года туземцы подарили ему овощ, который он описал как яблоко со вкусом ореха. Он стал первым европейцем, попробовавшим картофель! Индийцы называли это растение 'батат', мы же знаем его как картофель.<n><n>Колумб и его наследники привезли в Европу множество вещей, которые сегодня являются для нас вполне обычными: табак, помидоры, кукурузу, гамак... Кстати, коренные американцы называют гамак 'хамака'."
"0xd4cd0fae" = "Открытие Нового Света долгое время будоражило воображение европейцев. Какие существа жили на неисследованных землях? Возникали самые нелепые слухи: говорили, что один остров заселен безжалостными каннибалами, а на другом живут безголовые существа, лица которых находятся на животе.<n><n>Патагонию, район в Южной Америке, называют 'страной большеногих', а река Амазонка обязана своим названием племени женщин-воительниц, которых исследователи видели в джунглях этой реки.<n><n>Некоторые из этих слухов основывались на реальных фактах, а некоторые — на неправильном переводе или  на историях, которые рассказывали коренные американцы.<n><n>Однако большинство слухов было лишь выдумками, и, зачастую, люди верили им лишь потому, что хотели им верить. Это объясняет то, что целое поколение конквистадоров искали легендарный источник молодости, сад Эдем, и Эльдорадо, золотой город. Их прельщали рассказы коренных жителей, уверявших, что они слышали о том или ином месте, где находятся сказочные богатства. На самом деле, они хотели выиграть время и завести жадных европейцев вглубь острова, отрезав их от кораблей."
"0xd4cd0faf" = "Одна из самых ярких личностей среди всех исследователей и путешественников — это английский писатель и путешественник сэр Уолтер Рэйли (прибл. 1554 - 1618 гг). Он стал известен благодаря тому, что в 1580 году подавил восстание ирландцев.<n><n>Он стал фаворитом королевы Елизаветы I и использовал свое влияние и средства для финансирования экспедиций в Южную Америку. Его мечтой было найти легендарный город Эльдорадо. Несмотря на то, что несколько первых экспедиций не смогли обнаружить ничего ценного, он убедил своих кредиторов в Лондоне, что ему известно о местонахождении сокровищ и что прекратить поиски было бы глупо.<n><n>Но кредит доверия вскоре был исчерпан. Люди больше не верили его самонадеянным обещаниям, которые постоянно расходились с делом. В конце концов, Рэйли потерял расположение Елизаветы. Ее наследник, Джеймс I, увидел в этом импульсивном путешественнике угрозу для своей осторожной внешней политики. Придя к власти, он приказал арестовать Рэйли и добился для него смертного приговора. Приговор был изменен (но не отменен!) на пожизненное заключение в лондонском Тауэре.<n><n>Несколько лет спустя, когда финансовое состояние страны ухудшилось, король позволил сэру Уолтеру возглавить еще одну экспедицию в Гайану. Ситуация была абсурдной: приговоренному к смерти человеку доверили судьбы других людей, отправив за легендарным золотом! Однако эта нелепая ситуация разрешилась довольно скоро — Рэйли, ослабленный лихорадкой, потерпел неудачу в этой экспедиции.<n><n>После его возвращения в Англию разъяренный король приказал привести в исполнение приговор 1603 года. Вскоре Рэйли был казнен."
"0xd4cd0fb0" = "Первые контакты европейцев с коренным населением были мирные. В некоторых районах белых людей принимали за богов. Высокие люди со светлыми волосами, в сияющих доспехах и на 'плавающих домах' (кораблях) произвели неизгладимое впечатление на коренных американцев.<n><n>Колумб, Кортес и другие мореплаватели были слишком польщены, чтобы рассеивать их иллюзии, но очень скоро местные жители столкнулись с жестокой реальностью: движимые страстью к золоту, 'испанским недугом', как назвали ее коренные американцы, испанцы порабощали и уничтожали целые народы. Лошади и грохот пушек, с которыми индейцы ранее никогда не сталкивались, порождали панику, а те, кто сумел выжить в этой резне, заражались оспой, гриппом и другими болезнями, привезенными из-за океана.<n><n>Знаменитые мыслители, такие как Гонсало Овьедо или Хуан Сепульведа пытались оправдать преступления европейцев, приводя расистские аргументы и выставляя коренных американцев ограниченными и неполноценными глупцами.<n><n>Люди, заживо сжигавшие ученых и 'ведьм' из-за инаковерия, прекрасно научились придумывать шокирующие рассказы про 'звериные обычаи' коренного населения Америки. Хотя случаи идолопоклонства и каннибализма имели место, с того момента они стали использоваться как предлог для бесчеловечного обращения со всеми коренными жителями Америки."
"0xd4cd0fb1" = "Как известно, первыми странами-колонизаторами Америки были Испания и Португалия. Позже к ним присоединилась Голландия, а затем Англия и Франция. Однако мало кому известно, что бесчисленные испанские экспедиции никогда не осуществились бы без немецких капиталов.<n><n>К 1500 году Верхняя Швабия и, в частности, Аугсбург, стали самыми крупными центрами торговли во всей Европе. Отсюда зажиточные семьи Фуггер и Велзер оказывали влияние на всю мировую политику. Например, благодаря их поддержке испанский король Чарльз стал в 1519 году императором Германии. Английский король Генри VIII и Папа Римский гордились дружбой с Якобом Фуггером 'Богатым'.<n><n>Конечно, поддерживая экспедиции, эти хитрые торговцы преследовали свои скрытые цели. За это они получали определенные привилегии или разрешение добывать серебро на королевских рудниках. Велзеры даже на время получили северную часть Венесуэлы, где они основали ряд городов, например, Новый Аугсбург, где было организовано несколько экспедиций (в основном, окончившихся безрезультатно) для поиска сокровищ в глубине материка. "
"0xd4cd0fb2" = "Покорив половину земного шара, испанская корона смогла извлечь максимум выгоды из своего положения. На протяжении нескольких веков до исчезновения культуры инков, майя, ацтеков и открытия залежей серебра в Перу и Мексике позиции Испании были неколебимы. Кажется абсурдным, что именно это огромное богатство и привело к разрушению одной из величайших империй.<n><n>Большая часть сокровищ из Америки оседала в руках торговцев северной части Пиреней, ведь экспедиции собирались на их деньги. Однако даже остальных богатств хватало для того, чтобы уровень цен на Пиренейском полуострове начал повышаться. Люди стали жить богато: в эпоху, когда содержание пышного двора считалось делом более важным, чем забота о государственном бюджете, люди уделяли мало внимания банальным финансовым вопросам.<n><n>Увеличился импорт товаров из других стран, поскольку люди стали считать недостойным утруждать себя их производством. Даже оборудование и провиант для экспедиций почти не продавались у испанских торговцев. Люди с гордостью говорили: 'Испания управляет всей Европой'.<n><n>Однако реки серебра неожиданно иссякли, настало пробуждение от грез и мечтаний: Дания и Англия пытались вытеснить Испанию из открытого океана. Постоянные войны с 'еретиками'-протестантами и Турцией требовали колоссальных сумм. Огромная империя, над которой 'никогда не заходило солнце', превратилась в колосса на глиняных ногах.<n><n>Кризис явственно обозначился в 1557 году, когда новый испанский король Филипп II впервые официально заявил о банкротстве государства. Великая империя, некогда владевшая немыслимыми богатствами, распалась."
"0xd4cd0fb3" = "Почему в Бразилии говорят на португальском языке, хотя во всех остальных странах Южной Америки государственным языком является испанский?<n><n>И испанцы, и португальцы, открывшие морской путь в Индию вдоль африканского побережья, вскоре поняли, что будущее им следует искать за океаном. Каждое из двух могучих государств постоянно следило за тем, чтобы соперник в поисках богатств и славы не заходил на его территории.<n><n>В те времена еще не было международного законодательства, и в случае конфликта стороны обращались к Папе Римскому — единственному человеку, чью власть признавали обе страны. Католическая церковь была заинтересована в том, чтобы и португальцы, и испанцы преследовали одну цель — обращение 'язычников' в католичество — вместо того, чтобы тратить силы, враждуя друг с другом.<n><n>Поэтому во время переговоров в Тордесильяс (1494 г.) и в Сарагосе (1529 г.) было решено, что все открытые земли, находящиеся к востоку от определенного меридиана должны принадлежать Испании, а остальные земли — Португалии. Этот меридиан пересекал неисследованный в то время континент — Южную Америку, поэтому Бразилия отошла Португалии."
"0xd4cd0fb4" = "Возможно, слово 'пират' впервые употребил римский писатель Полибий примерно в 140 году до н.э. С тех пор появилось множество слов, обозначающих ужасных морских разбойников: корсары, флибустьеры, буканьеры... Например, людей, окружающих Клауса Стортебекера, именовали 'Виталийским братством', а Бартоломью Робертс называл себя и свою банду отъявленных головорезов 'Джентльменами удачи'.  Но для торговцев название банды пиратов не имело никакого значения, они всеми силами пытались избежать нападения на свои корабли.<n><n>На несколько веков пираты стали настоящим бедствием во всех уголках земли. Во времена античности сицилийские пираты наводили ужас на все Средиземноморье, и Римская империя была вынуждена посылать специальные отряды для их поимки. Тайные острова со скалистыми берегами, находившиеся около торговых маршрутов, были идеальным местом для пиратов. Рифы, течения и плохие погодные условия, делавшие громоздкие торговые корабли легкой добычей, позволяли пиратам легко скрываться от преследования после нападения. Побережье Малой Азии в древние времена пользовалось у мореплавателей дурной славой, так же как и Карибские острова в Эпоху Открытий, а пираты Юго-Восточной Азии стали живыми легендами.<n><n>Буканьерами называли моряков, которые не принадлежали к военно-морским силам и выходили в море сами по себе, в поисках золота и серебра. Их также считали пиратами.<n><n>Однако с появлением каперских свидетельств пиратство фактически стало легальным. Эти документы издавались в Англии, Франции и Дании с целью натравить пиратов на корабли, принадлежащие другим странам.<n><n>Не каждый правитель выдавал каперские свидетельства. Кто-то считал бесчестным вступать в соглашения с пиратами. Другие же были менее разборчивыми или просто трусливыми."
"0xd4cd0fb5" = "Так называемые 'семь морей' - это фактически три океана: северная и южная части Тихого океана, северная и южная части Атлантического, Северный Ледовитый и Антарктический океаны и Индийский океан.<n><n>Было бы правильно переводить на русский язык название 'oceano pacifico' как 'Мирный океан', а не 'Тихий'. Тихий океан обязан своим названием первому человеку, совершившему кругосветное путешествие, Фернандо Магеллану, который много недель плыл по этому океану без провианта, но погода благоприятствовала его путешествию.<n><n>И еще один интересный факт: название 'Карибские острова' произошло от слова 'Карибе' или 'Караибе', обозначающего людей индийской языковой группы, которые жили на северном побережье Южной Америки."
"0xd4cd0fb6" = "Бермудские острова были названы в честь испанского путешественника Хуана Бермудеса, который открыл их в 1503 году. Печально знаменитый Бермудский треугольник, в котором то и дело исчезают суда, находится между Бермудскими островами, Пуэрто-Рико и Форт-Лодердейлом (Флорида).<n><n>Некоторые утверждают, что таинственные события начались после путешествия Кристофора Колумба. 14 сентября 1492 года мореплаватель из Генуи, который служил испанской короне, вместе со своими кораблями очутился в этом загадочном месте. Стрелка его компаса начала вращаться с бешеной скоростью. Это было вызвано несовпадением географического и магнитного северных полюсов. На следующий день Колумб и его люди увидели в небе огромный сгусток огня (возможно, это был метеор).<n><n>Однако название 'Бермудский треугольник' появилось только после Второй мировой войны, после серии загадочных исчезновений самолетов, которая привлекла общественный интерес к этой территории на юго-востоке северной части Атлантического океана.<n><n>После этого произошло около 200 таинственных событий. Большинство из них случилось за пределами Бермудского треугольника и имеет вполне логическое объяснение."
"0xd4cd0fb7" = "Легендарный испанский флот с сокровищами, регулярно ходивший из Америки в Испанию, породил зависть и алчность далеко за пределами Пиренейского полуострова. Прежде всего амбициозная Англия увидела в этом шанс оспорить роль Испании как хозяйки морей и королевы мира.<n><n>Островное королевство было ещё слишком слабо для крупномасштабных военных кампаний, поэтому куда разумнее было схватиться с соперником вне Европы, вдали, где тот не ждал нападения и не получил бы о нём предупреждения. Там можно было с лёгкостью обобрать жертву, а затем просто исчезнуть, и в Европе о случившемся не узнали бы месяцами.<n><n>Дерзкие капитаны, самым известным из которых был Фрэнсис Дрейк (1540–1596), получали от её величества Елизаветы I каперские свидетельства. Они походили на некий бланк с печатью и были лицензией на грабёж, поднимавшей Дрейка и его товарищей выше обычных буканьеров и дававшей им положение частных разбойных баронов на службе высшей власти. Своё дело они делали превосходно. Нигде иберийские корабли и гарнизоны не были в безопасности.<n><n>В 1578 году Фрэнсис Дрейк прошёл Магелланов пролив и вихрем бросился за испанской добычей вдоль тихоокеанского побережья Америки. Никто прежде не смел на такое! Вернувшись в плимутскую гавань в 1580 году, Дрейк стал вторым после Магеллана капитаном, совершившим кругосветное плавание. <n><n>Тем временем король Испании Филипп кипел от ярости и размахивал Тордесильясским договором, по которому его святейшество папа в 1494 году непререкаемо объявил западное полушарие сферой влияния Испании. Но какое действие могли оказать подобные протесты на эту странную островную нацию протестантских еретиков, полностью отвергавших власть папы в Риме и даже отказывавшихся переходить на современный григорианский календарь до 1753 года — лишь потому, что тот был создан по приказу папы Григория в 1582 году?<n><n>Казалось, дело снова можно решить только войной. Армада Филиппа вышла к Англии в 1588 году, но под командованием сэра Фрэнсиса Дрейка, к тому времени уже посвящённого в рыцари, и при помощи нескольких своевременных штормов англичанам удалось уничтожить испанский флот. Сотни лет после этого никто не оспаривал положение Великобритании как ведущей морской державы."
"0xd4cd101f" = "Без сомнения, плавания Христофора Колумба (1451–1506) в Америку принадлежат к величайшим приключениям, когда-либо предпринятым человечеством. Даже писатель едва ли осмелился бы вообразить такую повесть о драматических событиях и странных совпадениях.<n><n>Хотя мореплавателю из Генуи удалось убедить испанскую королевскую чету Изабеллу и Фердинанда в своей идее западного морского пути в Индию, он вовсе не мог рассчитывать на согласие команды на борту. Большинство команды и вовсе было призвано силой: в наказание за проступки против короны город Палос был обязан предоставить два корабля с командами.<n><n>Весть о плане Колумба вызвала ужас. Команда была твёрдо убеждена, что плывёт под началом безумца, который навлечёт гибель и на себя, и на всех, кто с ним.<n><n>Однако главным врагом Колумба было суеверие: казалось, на борт проникли все мыслимые страшные истории, и любое странное или зловещее событие лишь усиливало страх моряков: при проходе мимо Тенерифе извергался вулкан, затем в небе видели столбы огня, и даже стрелка компаса, казалось, играла с командой шутки. Если корабли застревали в штиле, это считали дурным знаком. С другой стороны, если они шли хорошо, это означало, что ветер всегда дует с востока на запад и развернуться они уже не смогут.<n><n>Много раз мятеж казался неизбежным. Однажды ночью капитан услышал шаги и бормотание за дверью своей каюты, и лишь когда он громко начал молиться, убийцы потеряли смелость и убрались прочь.<n><n>Самые тяжёлые кризисы разражались, когда принятый за остров на горизонте предмет снова оказывался лишь оптической иллюзией. Именно такое событие 10 октября довело дело до развязки. С огромным трудом Колумб выторговал ультиматум в три дня, после которых команда хотела повернуть назад (желательно без капитана). Но у судьбы были иные намерения: землю они действительно увидели в эти три дня. Никто из присутствовавших не мог и мечтать, что вместо Азии наткнулся на совершенно новый и неведомый континент.<n><n>Япония и Китай лежали ещё в тысячах морских миль, и лишь невероятная удача — то, что на пути оказался чужой континент, — спасла экспедицию Колумба. Настроение команды сразу поднялось. Никто из них уже не мог припомнить, что когда-то думал о мятеже ..."
"0xd4cd1020" = "Христофор Колумб открыл новый материк (точнее, открыл повторно: викинги первыми высадились на американском континенте в Средневековье), но он предполагал, что обнаружил новый путь в Индию.<n><n>Ко второму и третьему из четырех путешествий генуэзец готовился вместе с флорентийцем Америго Веспуччи, который первым предположил, что западные земли — часть нового континента. Эта смелая мысль вызвала общественный интерес, и всякий раз, когда обсуждались открытые земли, упоминалось имя Веспуччи.<n><n>Звезда Христофора Колумба зашла. Путешественника даже отправили на родину в цепях после того, как на него пожаловались жители Карибских островов, а после смерти первооткрывателя в 1506 году о нем быстро забыли. Неудивительно, что имя Америго Веспуччи вдохновило немецкого картографа Мартина Вельдзимюллера, когда он, год спустя, думал над названием для нового континента.<n><n>Название Вельдзимюллера пришлось по вкусу его коллегам. Но было бы более справедливо, если бы континент назвали 'Колумбия'."
"0xd4cd1021" = "Первой американской колонией, имевшей очень большое значение для Испании, была Испаньола. Христофор Колумб уже основал там первую колонию в 1493 году, хотя она была уничтожена коренными американцами еще до того, как он вернулся из Европы.<n><n>В последующие годы испанская корона приобретала все большее влияние на этом острове. Были построены первый монастырь и первая церковь. Возникла первая социальная система: классовое рабовладельческое общество, в котором важную роль играла католическая церковь.<n><n>Испаньола была развивающейся колонией и привлекала массу предприимчивых переселенцев из-за океана.<n><n>Однако вскоре Испания обратила свое внимание и на другие регионы. Были исследованы и покорены огромные территории, обнаружены месторождения золота и серебра. Кроме того, здесь было легче управлять народом.<n><n>Люди потеряли интерес к Испаньоле, как порой дети теряют интерес к сломанной игрушке. Английские, датские и французские пираты по очереди нападали на американские колонии. В 1697 году французы захватили колонию Сан-Доминик, находящуюся в западной части острова (современный Гаити), и создали выгодную экономическую систему, основанную на деятельности плантаций. Поставляя в Европу сахарный тростник, кокосы, индиго, хлопок и кофе, Сан-Доминик в 18 веке стала одной из самых прибыльных колоний Нового Света .<n><n>В 1804 году на Гаити произошло восстание рабов, причиной которого стала Французская революция, и остров получил независимость. Восставшие безжалостно расправились со своими угнетателями. Из уст в уста передавали слова чернокожего генерала Буарон-Тоннера: 'Штыками мы напишем декларацию независимости на коже белого человека, его череп послужит чернильницей, а кровь — чернилами'."
"0xd4cd1022" = "Карибские острова подарили миру алкогольный напиток, ценность которого для человечества весьма спорна, - ром. Он делается из черной патоки сахарного тростника, которую называют 'убийца дьявола'. Впервые он появился на Барбадосе в 1650 году. Так как ром считался любимым напитком пиратов, многие связывают его с островом Ямайка, самым знаменитым пиратским островом.<n><n>Работорговцы продавали людей с африканского побережья на Карибских островах за большие количества патоки. В Новой Англии из нее делали ром и перевозили его на тех же самых кораблях в Африку. Там ром продавали, а пустые корабли заполняли новые рабы. Владельцы кораблей следили, чтобы трюмы их кораблей всегда были заполнены товаром."
"0xd4cd1023" = "После Кубы, Ямайка, пожалуй, самый известный из Карибских островов. Его название произошло от индейского названия 'Химака', которое означает приблизительно следующее: 'страна деревьев и воды'. Сам Христофор Колумб, который открыл этот остров, имел возможность оценить красоту этих мест и гостеприимство местных жителей, после того как его корабль потерпел крушение у берегов Ямайки в 1503 году.<n><n>Ему так понравился этот остров, что он объявил его своей собственностью, по сути, отобрав его у короля Испании. Несмотря на это, на остров не обращали никакого внимания несколько десятилетий, пока его не захватили англичане в 1655 году. К этому времени на острове осталось очень мало коренных жителей, так как эти племена оказались неспособны противостоять болезням, которые привезли с собой европейцы.<n><n>В 1661 году Эдварда д'Олей назначили генерал-капитаном и губернатором острова Ямайка. При его правлении столица [town:Port Royal] превратилась в хорошо укрепленное убежище для пиратов. Про остров говорили, что это \"самое богатое и порочное место на Земле\", и многие жители острова, которые в обычное время были простыми торговцами, часто собирались вместе и совершали пиратские рейды в испанских водах. Поначалу британское правительство не препятствовало деятельности пиратов, так как они помогали сдерживать испанцев.<n><n>И только после того, как власть над островом перешла в руки губернатора Сэра Генри Моргана (примечательно то, что он сам был бывшим пиратом), спокойствие и закон вернулись на Ямайку. Морган жестоко подавлял пиратскую деятельность и не задумываясь посылал на виселицу своих бывших соратников.<n><n>Однако почти сразу после установления британского правления наряду с выращиванием сахарного тростника появился новый способ получения огромных прибылей: после 1672 года [town:Port Royal] превратился в крупнейший в мире рынок торговцев рабами после того, как британская Королевская африканская компания стала полноправным монополистом."
"0xd4cd1024" = "Буквально через две недели после прибытия в Америку Христофор Колумб приплыл на Кубу, самый большой остров Вест-Индии. На острове проживали несколько племен — кибони, гуанахатаби и тайнос, которых, несмотря на их миролюбивый характер, ожидала такая же участь, как и другие племена коренных американцев: в 1511 году после кровопролитной войны с испанцами, которая продолжалась четыре года, их полностью уничтожили. Это привело к тому, что на территорию Кубы стали завозить большое количество черных рабов. Остров со столицей в Гаване был разделен на семь административных районов (кабилдос), каждый из которых посылал своего представителя в специальный совет. Каждый из этих представителей должен был представлять свой район.<n><n>Примечательно в истории Кубы то, что за исключением короткого периода английского правления с 1762 по 1763 год Куба довольно долгое время находилась под властью испанцев. Возможно, это было вызвано тем, что остров не представлял особого интереса для испанской империи в эпоху колонизации (к примеру, на острове не было никаких полезных ископаемых) и в основном использовался в качестве перевалочного пункта на пути к континенту. В любом случае, пока большинство стран Южной и Северной Америки в первой четверти 19 столетия сражались за свою независимость, испанцы сумели продержаться на Кубе вплоть до 1898 года, после чего они передали власть на островом в руки Соединенных Штатов."
"0xd4cd1025" = "Общеизвестно, что многие вещи, которые сейчас считаются как нечто само собой разумеющееся, были привезены в Европу из Америки. Однако межкультурный обмен действовал в обе стороны.<n><n>К примеру, когда мы говорим о коренных жителях равнинной части Северной Америки, нам трудно представить, что до появления португальцев и испанцев у индейцев не было лошадей. Многие индейцы в панике бежали с поля боя, увидев всадников на лошадях, потому что они считали, что на них нападает странный зверь, состоящий из двух разных существ.<n><n>Кофе, который все люди привыкли ассоциировать с такими странами, как Бразилия и Гватемала, для Америки когда-то являлся напитком неизвестным. Прежде чем попасть в Америку, кофе совершил длительное путешествие через три континента: из Африки (возможно, из Эфиопии) через арабские страны в юго-западную Европу. В Америке кофе начали выращивать в 18 веке, так как спрос на этот напиток превышал предложение.<n><n>Картофель, который европейцы обнаружили на Карибах, стал для них бесценным пищевым продуктом. Пшеницу завезли в Америку испанцы и англичане, которые в 1520 году привезли эту культуру в Мексику, а затем в 1777 году в Виргинию. Несмотря на то, что люди думали, что климат Америки мало пригоден для выращивания пшеницы, на плодородных равнинах Америки эта сельскохозяйственная культура прижилась на удивление быстро. Сегодня пшеница является самой распространенной сельскохозяйственной культурой в мире."
"0xd4cd1026" = "Вы можете себе представить жизнь без шоколада? Наверное можете, так как до открытия Америки мир ничего не знал о какао. Слово 'какао' пришло к нам из языка индейцев майя: По всей видимости, торговцы майя пили какао за 400 лет до Рождества Христова.<n><n>Ацтеки, которые начиная с 14 столетия доминировали среди других племен Центральной Америки, приписывали какао божественные свойства. Первым европейцем, который попробовал этот деликатес, был все тот же Христофор Колумб, хотя это произошло лишь в 1502 году во время его путешествия в Никарагуа.<n><n>Однако полноправным \"первооткрывателем\" какао был Гернар Кортес, покоритель империи ацтеков, который вернулся в Испанию и привез с собой рецепт напитка, который ацтеки называли \"хокоатль\" (отсюда пошло название \"шоколад\"). Поначалу вкус напитка показался европейцам слишком горьким и только после того, как они стали добавлять в него сахар или ваниль, этот напиток приобрел огромную популярность среди представителей высших слоев иберийского общества.<n><n>Испанцы никому не выдавали рецепт напитка почти на протяжении ста лет, после чего горячий шоколад покорил сначала Францию, а потом и остальную часть Европы. Примерно в 1700 году англичане придумали добавлять в какао молоко. Окончательным прорывом какао в Европу стало изобретение напитка, в котором кофе и какао смешивались вместе."
"0xd4cd1027" = "Хотя порой бывает трудно отличить вымысел от правды, когда речь заходит о пиратах, нет никакого сомнения, что существовали и женщины-пираты. В начале 18 столетия в пиратской среде на острове Ямайка появились две выдающиеся личности.<n><n>Анна Бони, которую по слухам в детстве пырнули ножом в живот, сбежала от родителей с моряком и отправилась в пиратский рай — Нью-Провиденс (Нассау). Там она сумела избавиться от своего мужа и начать свою собственную карьеру пирата на борту захваченного голландского корабля.<n><n>Она встретилась с Мэри Рид, которая уже имела боевой опыт, приобретенный во время испанских войн за престолонаследие. Для этого ей пришлось переодеться мужчиной и, по слухам, перед тем как убить врага, она обнажала перед ним грудь, чтобы доказать, что его победила женщина.<n><n>В 1720 году их схватили, и они избежали виселицы лишь потому, что были беременны. Эти женщины жили намного богаче многих пиратов мужского пола и до глубины души презирали их.<n><n>Далее приводятся слова, которые она бросила печально знаменитому Калико Джеку перед тем, как его повесили: \"Джек, мне жаль видеть тебя здесь, но если бы ты сражался, как мужчина, тебя бы не вешали сейчас, как последнего шакала\"."
"0xd4cd1028" = "Валлиец Бартоломью Робертс (1682? — 1722) был не только одним из самых значительных пиратов, но и весьма необычным человеком. Известный также как «Чёрный Барт» (не путать с «Чёрной Бородой» — Эдвардом Тичем), он обратился к пиратству поздно, в 37 лет, хотя переход к преступной деятельности прошёл, без сомнения, гладко: корабль, на котором он служил и который в 1719 году атаковал его земляк Хоуэлл Дэвис, был невольничьим судном.<n><n>Робертс решил связать судьбу с Дэвисом, а после убийства того несколькими неделями позже принял роль капитана. Говорят, Бартоломью Робертс избегал спиртного и предпочитал чай.<n><n>В отличие от Тича, который представлял себя воплощением дьявола, Робертс любил хорошую одежду, не жаловал азартные игры и требовал, чтобы его люди читали молитвы. Однако это вовсе не означало, что в душе Робертс был набожен. Сохранилось множество рассказов о жестокостях, которые он совершал, особенно с пленниками, в ходе бесчисленных грабежей. Его добыча превысила 400 кораблей, а район действий простирался от Бразилии до Ньюфаундленда и Западной Африки; наряду с Генри Морганом он был одним из самых удачливых пиратов Центральной Америки. <n><n>Грохот пушек британского военного корабля у берегов Гвинеи в 1722 году ознаменовал конец его карьеры и устранение одной из величайших угроз семи морей."
"0xd4cd1090" = "Самым известным пиратом 17 столетия был валлиец Генри Морган (1635-1688 гг.), который держал в страхе испанские колонии в Вест-Индии и таким образом ставил под сомнение силу Иберийской империи.<n><n>Его жизнь – это яркий пример двусмысленности политики Британии, Голландии и Франции, которые поддерживали пиратов, которые наносили ущерб экономике других держав.<n><n>Генри Морган, который в 1668 году был капитаном пиратского корабля, сеял страх и ужас вдоль северного побережья Южной Америки. Под его началом находилось около 2000 человек. Он сумел захватить хорошо укрепленный город Панаму в августе 1670 года, а затем сумел уйти от правосудия, прихватив награбленное. Но после подписания мирного договора между Испанией и Англией его схватили и судили в Лондоне.<n><n>Но Моргана не осудили, а совсем наоборот: Незадолго до этого ветры дипломатии в который раз изменили свое направление. Моргана не только амнистировали, но и возвели в рыцари. Сэра Генри назначили губернатором Ямайки, где он ввел строгие законы и где провел остаток жизни в роли богатого плантатора."
"0xd4cd1091" = "Багамы, недолго служившие в середине XVII века убежищем для религиозных отступников из Англии, с 1670 года официально находились под властью графа Албемарла и других господ, получивших эти острова от короля Карла II в надежде на прибыль.<n><n>Однако, несмотря на обещания, эти люди мало интересовались налаживанием упорядоченной гражданской администрации. Скорее наоборот: как и в других местах Карибского бассейна, на Багамах поселились орды пиратов, особенно на острове Нью-Провиденс, где стоял город Нассау. <n><n>Мелкие заливы, куда не могли проникнуть тяжёлые военные корабли, давали идеальную стоянку сотням шлюпов и пиратских барков. Частые набеги в испанских водах вызвали ответные меры, и Джону Уэнтворту, первому губернатору, досталась незавидная задача восстановить на островах закон и порядок.<n><n>Так как положение не улучшалось, король Англии Георг I вновь конфисковал Багамы и превратил их в коронную колонию. Вудс Роджерс, бывший буканьер и кругосветный мореплаватель, был назначен первым королевским губернатором в середине 1718 года.<n><n>Действуя кнутом и пряником, он положил конец царившему до тех пор хаосу. Он объявил всеобщую амнистию всем пиратам, готовым под присягой отказаться от своего промысла. Для тех, кто не желал этого, наказание ждало в виде флота вооружённых до зубов кораблей.<n><n>После восстановления нормальных условий островам в 1729 году был дарован собственный парламент, и на протяжении следующих ста лет, за исключением случайных потрясений из-за вторжений, история Багам оставалась относительно спокойной."
"0xd4cd1092" = "В своих колониях испанцы устанавливали жесткую систему управления, которая не давала возможностей для развития страны. У власти стояли выходцы из Европы.<n><n>Испанцев, родившихся в колониях, называли креолами. И хотя они и считались второстепенными звеньями в системе управления, они занимали все ключевые посты государства, армии и церкви.<n><n>Испанцы из Европы и креолы были элитой колониального общества. Детей, родившихся от смешанных браков между белыми (в основном мужчинами) и коренными американцами, называли метисами. Коренные американцы, которые изначально владели этими землями, занимали самую низкую ступень социальной иерархии, а в тех местах, где их полностью уничтожили колонизаторы, эту ступень занимали черные рабы.<n><n>В различных регионах испанской империи количественное соотношение этих классов сильно отличалось. Например, в Мексике метисы составляли большую часть населения. На многих островах основную часть населения составляли негры (по воле их хозяев). Индейские племена также умудрялись выжить там, где природный ландшафт, джунгли, болота и горы служил им убежищем. Например, в Боливии или Флориде."
