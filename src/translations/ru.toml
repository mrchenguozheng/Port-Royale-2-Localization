"0xdad6e283" = "Кнопка"
"0xdaeb0484" = "На этот раз сценарий начинается в Картахене, административном центре в центральной части Карибского моря.<n>Ваш караван, состоящий из одного шлюпа, стоит в порту.<n>Прежде всего вы должны вооружить свой караван, потому что вам придется участвовать в морских сражениях.<n>Зайдите в доки и откройте меню 'Грузы'."
"0xdaeb0485" = "Как видите, на борту вашего корабля нет ни пушек, ни боеприпасов. Также вам нужна команда.<n>Полностью укомплектуйте команду, купите  максимальное количество пушек и 10x10 каждого из трех типов боеприпасов для пушек.<n>Возможно, на караване не хватит места, поскольку пушки тяжелые. В этом случае продайте часть ваших товаров."
"0xdaeb0486" = "Отлично! Ваш караван вооружен и готов к небольшой битве.<n>А у губернатора Картахены как раз есть для вас подходящее задание.<n>Щелкните по резиденции губернатора и согласитесь на его задание."
"0xdaeb0487" = "Губернатор часто предлагает вам задания, после выполнения которых ваша репутация в соответствующем государстве повышается.<n>Также у губернатора вы можете получить каперское свидетельство или награду за пойманного пирата.<n>А теперь возьмите свой караван и найдите корабли, о которых говорил губернатор."
"0xdaeb0488" = "Отлично. Вы нашли караван.<n>Ваша следующая задача — подготовить корабль к бою. Для этого откройте список кораблей в караване и выберите шлюп. Чтобы сделать его боевым кораблем, нажмите кнопку рядом с изображением пушки. После этого вы сможете атаковать караван, щелкнув по нему правой кнопкой мыши."
"0xdaeb0489" = "Перед вами экран морского сражения в Порт-Рояле.<n>На нем показан ваш корабль, а если вы передвинете экран, то увидите брошенные корабли.<n>А теперь отключите режим паузы и попрактикуйтесь в управлении кораблем, используя правую кнопку мыши. Направление ветра показывается в окне сообщений."
"0xdaeb048a" = "Все корабли, участвующие в сражении, показаны в нижней части экрана. Там же вы можете выбрать, какие боеприпасы использовать. Выберите тяжелые ядра и потопите один из вражеских кораблей.<n>Стрельба ведется с помощью левой кнопки мыши, но стрелять вы можете, только когда ваш корабль находится в правильном положении для стрельбы. Цели показаны красным цветом."
"0xdaeb048b" = "Хорошо! Второй корабль вы должны взять на абордаж. <n>Для этого нажмите кнопку 'Абордаж' в нижней правой части экрана корабля.<n>Затем направьте свой корабль к вражескому и протараньте его. Обратите внимание, что кнопка 'F1' работает и во время морских сражений."
"0xdaeb048c" = "После этого, как правило, начинается схватка между командами двух судов на борту одного из кораблей.<n>Когда схватка заканчивается, все корабли, взятые на абордаж, переходят в руки победителя.<n>Присоедините вражеский корабль к своему каравану и закройте окно обмена."
"0xdaeb048d" = "Очень хорошо!<n>А теперь отправьте свой караван обратно в Картахену."
