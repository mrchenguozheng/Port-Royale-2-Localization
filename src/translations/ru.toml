"0x35f48f6f" = "[riddle:answer=Fort Caroline;group=35f48f6f,35f48f71;clue=север;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 17`]Самый северный город — не он: севернее лежит лишь один другой."
