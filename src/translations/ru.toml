"0x0ea0e0ea" = " Вы должны выполнить задание до @D$EndDate$."
"0x0eb34b66" = "В этом сценарии вы научитесь основывать предприятия и узнаете, какие факторы нужно учитывать при управлении производством. Также вы будете строить жилые дома для новых рабочих.<n><n>В игре «Порт-Рояль 2» вы можете строить здания в любом городе, в котором у вас есть лицензия на строительство. Чем больше у вас лицензий, тем дороже вам обойдется каждая следующая. C самого начала игры у вас имеется лицензия на строительство в родном городе, поэтому можете немедленно приступать к возведению построек.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Постройте в городе Санта-Марта одну плантацию какао и один жилой дом."
"0x0ede126a" = "Теперь вы знаете, как проводить сражения на море. Но вы также можете напасть и на целый город, чтобы разграбить его или захватить для другого государства. Конечно, для этого нужны большие караваны из мощных кораблей. Атака города серьезно ударит по вашей репутации в соответствующем государстве, и за вами начнут охоту военные караваны этой державы.<n><n>Также вы можете напасть на логово пиратов. Пираты устраивают свои логова в секретных местах, о которых вы будете узнавать по ходу игры. Пиратское логово вы можете атаковать так же, как и город. Уничтожив логово, вы уничтожите всю банду.<n><n>Уровень защиты логова зависит от того, как долго существует банда и как хорошо у нее идут дела.<n><n>Ваша последняя задача в этом сценарии — уничтожить небольшое пиратское логово. О его местонахождении вам расскажет губернатор города @T$TOWN$.<n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Уничтожьте логово пирата по имени @P$PirateName$."
"0x0eecc4e8" = "Английская колония"
"0x0eecc4e9" = "Французская колония"
"0x0eecc4ea" = "Голландская колония"
"0x0eecc4eb" = "Испанская колония"
"0x0f1ade15" = "Теперь вам нужно построить в городе жилые дома и создать рабочие места.<n><n>Колонисты останутся в вашем городе, только если смогут найти работу, поэтому сначала вам нужно построить предприятия. Решите, какие предприятия вы хотите построить. Но помните, что имеет смысл производить только те товары, которые можно с выгодой продать в других городах.<n><n>Четыре производства обеспечивают работой 120 рабочих. Семья каждого рабочего состоит  из четырех человек, так что вы должны обеспечить жильем 480 жителей, построив четыре жилых дома.<n><n>Как только предприятия и жилые здания будут построены, можете начинать привозить в свой город колонистов. Обычно их можно найти в административных центрах. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Увеличьте количество жителей вашего города до 480."
