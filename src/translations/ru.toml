"0xf6a84efd" = "Карибское море, 1570 год. Ваша цель — пройти путь от скромного торговца до влиятельного дельца. Чтобы достигнуть своей цели, вы можете перевозить товары, торговать и заниматься политикой и пиратством. <n><n>Этот сценарий познакомит вас с основами игры. В нем, как и во всех остальных сценариях, есть несколько целей. Для успешного завершения сценария все эти цели должны быть достигнуты.<n><n>Закройте это окно и обратите внимание на окно сообщений в левой нижней части экрана.<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Следуйте подсказкам в окне сообщений."
