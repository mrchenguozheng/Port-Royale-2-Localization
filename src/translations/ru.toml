"0xdfb9b5b7" = "Отлично! Теперь у вас @g$Gold$.<n><n>У каждого государства есть военные караваны, которые защищают его города и воды вокруг них. Чем больше городов у государства, тем больше военных караванов нужно, чтобы их надёжно прикрывать.<n><n>Если государство теряет военный караван, его военная мощь слабеет. Во время войны военные караваны ведут себя довольно агрессивно по отношению к городам и караванам противника, поэтому государство время от времени может лишаться военного каравана. По этой причине из Европы регулярно отправляют караваны, чтобы усилить военную мощь государства в Новом Свете.<n><n>Силу государства можно посмотреть в разделе «Государства» хроники. Если государство описано как слабое, его города можно захватывать.<n><n>Теперь вам следует разбить достаточно английских военных караванов, чтобы мощь Англии оценивалась как «слабая».<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Разбейте достаточно английских военных караванов, чтобы Англия оценивалась как «слабая»."
