"0x0ce1a79f" = "Колониальные города, такие как Санта-Марта, могут производить два товара первой необходимости, два вида сырья и один колониальный товар.<n>В прошлом сценарии вы узнали, что в административных центрах высокий спрос на сырье и колониальные товары.<n>Поэтому прежде всего вам нужно основать производство какао.<n>Закройте окно информации о городе."
"0x0ce1a7a0" = "Из административных центров колониальные товары отправляются в Европу, поэтому спрос на них всегда велик. Это очень хорошо для вашего бизнеса. Найдите в центре города дом главного архитектора и щелкните по этому зданию."
"0x0ce1a7a1" = "У архитектора вы можете получить разрешение на постройку здания или вернуть свою лицензию (чего, конечно, сейчас делать не нужно!).<n>Посмотрите, какие вы можете построить здания. Можете также использовать кнопки справа от окна архитектора.<n>Нажмите кнопку 'Плантация какао'."
"0x0ce1a7a2" = "Здесь вы можете посмотреть, сколько материалов и денег потребуется для строительства.<n>Также здесь показано, сколько стройматериалов имеется у вас на складе и сколько вам придется докупить у города.<n>Сейчас у вас достаточно материалов для строительства.<n>Наведите указатель мыши на место, где вы хотите построить здание, и нажмите левую кнопку мыши."
"0x0ce1a7a3" = "На выбранном месте появятся строительные леса и начнется создание плантации.<n>На строительство потребуется несколько дней. А пока вы должны обеспечить ваших будущих рабочих жильем.<n>Закройте меню строительства и найдите в Санта-Марте жилое здание. "
"0x0ce1a7a4" = "Жилой дом принадлежит одному из городских торговцев. Вы можете посмотреть, сколько таких домов принадлежит местным торговцам и сколько в них жителей. Вам нужно построить свой собственный жилой дом. Для этого снова откройте меню строительства."
"0x0ce1a7a5" = "Выберите в меню строительства жилой дом и посмотрите на стоимость строительства. <n>Возможно, на вашем складе не будет хватать стройматериалов. Однако вы можете докупить их у города. <n>Если в этом городе недостаточно стройматериалов, вам придется привезти их из другого города.<n>Постройте жилой дом."
"0x0ce1a7a6" = "На одном предприятии может работать до 30 рабочих. Обычно семья рабочего состоит из четырех человек, так что вам потребуется жилье для 120 человек. <n>Каждый жилой дом вмещает именно такое количество людей, так что он обеспечивает жильем одно предприятие.<n>Закройте меню строительства и щелкните по своему новому жилому дому."
"0x0ce1a7a7" = "На строительство жилого дома не требуется время, поскольку что сначала его обитатели живут в палатках.<n>Через некоторое время жители сами построят себе приличное здание.<n>Внешний вид дома зависит от его возраста и от статуса города.<n>Закройте диалоговое окно."
"0x0ce1a80f" = "Как вы уже знаете, первым вашим зданием в городе должен быть склад. Пока вы не построили склад, вы не можете строить другие здания.<n>У вас уже есть склад в родном городе. Найдите его и щелкните по нему левой кнопкой мыши. На карте он отмечен светло-синим."
"0x0ce1a810" = "В окне склада показывается, какие еще здания у вас есть в этом городе и во сколько вам обходится их содержание.<n>Также вы можете посмотреть, сколько вам платят ваши жильцы и какие товары производят ваши предприятия.<n>Позже вы сможете давать указания управляющему складом.<n>Закройте окно склада."
"0x0cee08cc" = "солдат в городе могло быть и побольше, "
"0x0cf75014" = "Закрыть"
"0x0cf7abef" = "Щелкните по своей плантации какао. В появившемся окне будут показаны все предприятия такого типа в городе.<n>Как только плантация какао достроится, ей понадобится 30 рабочих, то есть 30 колонистов. Покиньте плантацию, зайдите в доки и нажмите кнопку 'Грузы' (нижняя кнопка справа)."
"0x0cf7abf0" = "Здесь видно, ждут ли в городе колонисты, готовые наняться, или, наоборот, городу нужны новые рабочие. Это станет актуальным, как только строительство вашего предприятия завершится.<n><n>Отправляйтесь в окрестные губернаторские города и привозите колонистов в Санта-Марту, пока на вашем предприятии не будет полный штат рабочих."
"0x0d0db040" = "Щелкните по одной из ваших плантаций какао."
"0x0d0db041" = "Здесь вы можете увидеть, сколько какао производит в день ваша плантация и сколько для этого требуется инструментов.<n> Соберите на складе @a$SubGoal$ инструментов, так как предприятия берут инструменты именно со склада."
"0x0d0db042" = "Инструменты относятся к импортным товарам. Это означает, что по самым низким ценам вы можете купить их в административных центрах.<n>Попробуйте приобрести их в Картахене на юго-западе или в Маргарите, которая находится далеко на востоке."
"0x0d0db043" = "Прекрасно!<n>Чем меньше средняя стоимость используемого предприятием сырья, тем меньше стоимость производства товара.<n>Продолжайте производство какао, пока у вас на складе не будет @a$AmountGoal$."
"0x0d0f1795" = "Июль"
"0x0d0f1877" = "Июнь"
"0x0d1098bd" = "%1! <n>Вы здесь недавно, верно? Но я уже столько слышал о вас. Вы очень известны. Заходите ко мне почаще, у меня всегда найдется для вас работа."
"0x0d23b491" = "Отправьте ваш караван в Картахену. Когда он придет на место, войдите в город.<n>Под названием города, справа, находится небольшой круглый символ. В нем отображается ваш текущий торговый рейтинг в Картахене.<n>В этом сценарии вы получили бонус к рейтингу, так что вам будет несколько проще.<n>Откройте окно информации о городе."
"0x0d23b492" = "Пункт 'Торговый рейтинг' показывает ваш торговый рейтинг в этом городе. Если это значение достигает 100%, вы можете получить лицензию на строительство у главного архитектора.<n>Закройте окно информации о городе."
"0x0d23b493" = "Цены на товары, которых не хватает в городе, подсвечены в окне торговли красным. Если вы будете продавать городу эти товары, то ваш торговый рейтинг и репутация в государстве, которому принадлежит этот город, повысятся.<n>Щелкните по докам и посмотрите, какие товары и в каком количестве имеются в городе."
"0x0d23b494" = "Обратите внимание на то, каких товаров не хватает. Например, городу всегда нужен сахар и хлопок, поскольку он производит ром и одежду.<n>Но ему требуются и другие товары.<n>Отправляйтесь в другие города и привезите оттуда то, на что высокий спрос в Картахене. Это повысит ваш торговый рейтинг."
"0x0d23b495" = "Неплохо! Вы значительно повысили свой рейтинг в Картахене.<n>Будьте внимательны и не покупайте в Картахене дефицитные товары (они подсвечены в окне торговли красным).<n>Повысьте свой торговый рейтинг до 85%."
"0x0d23b496" = "Отлично! Ваш торговый рейтинг в Картахене равен 85%. Не расслабляйтесь!<n>Повысьте свой торговый рейтинг до 100%.<n>Кстати, вы только что получили сообщение с информацией о новых званиях."
"0x0d23b497" = "Прекрасно! Вы достаточно торговали с Картахеной, чтобы получить лицензию.<n>Но, к сожалению, вы все еще младший матрос, поэтому лицензия у вас может быть только одна.<n>Чтобы получить следующее звание, вы должны увеличить размер своего капитала. "
"0x0d23b498" = "Отлично! Вы достигли звания матроса, поэтому можете иметь две лицензии на строительство.<n>Отправляйтесь к главному архитектору Картахены и приобретите лицензию.<n>Если вам не хватит денег, заработайте необходимую сумму торговлей. Не забывайте о том, что вы можете продавать товары, которые производите в Санта-Марте."
"0x0d2a3b89" = "Расх. на корабли"
"0x0d39b8e2" = "Прежде чем что-либо строить в Картахене, вы должны построить склад."
"0x0d39b8e3" = "Теперь вы должны построить две ткацкие фабрики и еще два жилых дома.<n>Если в городе не хватает стройматериалов, вам придется привозить их на ваш склад из других городов. <n>Прежде чем платить, постарайтесь найти лучшую цену!"
"0x0d39b8e4" = "К тому времени, как построятся ткацкие фабрики, у вас на складе должно быть @a$SubGoal$ хлопка, чтобы фабрики могли сразу же начать работу."
"0x0d39b8e5" = "Ваша следующая задача — подождать окончания строительства ткацких фабрик и произвести @a$SubGoal$ одежды, которая будет храниться на складе Картахены.<n>Чтобы произвести @a$SubGoal$ одежды, вам понадобится @a$SubGoal$ хлопка."
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Военные<t>Ваши торговые и военные корабли<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>Пират<t>Ваши торговые и военные корабли<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "Ошибка в сохраненной игре!"
"0x0d496e89" = "Щелкните на товаре, чтобы купить его или отменить покупку."
"0x0d496e8a" = "Автоматическая покупка управляющим складом."
"0x0d4fbd33" = "Очень хорошо!<n>Чтобы быть уверенным, что вашим ткацким фабрикам всегда будет хватать сырья, вам нужно основать в Санта-Марте производство хлопка.<n>Одна плантация может снабжать сырьем две фабрики."
"0x0d4fbd34" = "Убедитесь, что ваши предприятия в Санта-Марте и Картахене работают на полную мощность.<n>Не забывайте, что ткацким фабрикам в Картахене нужны постоянные поставки хлопка.<n>Продолжайте торговать и продавать произведенные товары.<n>Вы выиграете сценарий, как только заработаете @g$GoldGoal$."
"0x0d552127" = "Атака невозможна"
"0x0d578089" = "Вы уже атаковали город %1 за последние 30 дней. Капитан отказывается атаковать его снова из моральных соображений."
"0x0d58ea99" = "Сегодня %1 пират %2 ограбил %3 рабочих и их семей. В результате этого многие предприятия в городе стали работать с меньшей эффективностью."
"0x0d750c45" = "%1 карав."
"0x0d919a5a" = "%1!<n>Вы прекрасно знаете, что в другое время я бы послал вас к черту... Но сейчас я готов даже продать душу дьяволу.<n><n>Подойдите, мне нужно кое-что вам сказать."
"0x0d9c1799" = "Вы должны добиться снижения статуса города @T$TargetTown$ до уровня “Спад” до @D$EndDate$. Выберите одну из двух стратегий.<n><n>Вы можете напасть на город и разграбить его, вывезя все товары.  После этого статус города понизится до значения 'Восстановление', который из-за недостатка товаров будет падать.<n><n>Второй вариант — поставку товаров в город, нападая на торговые караваны. Примечание: Если вы не будете захватывать караван, а только ограбите его, ваша репутация в соответствующем государстве снизится не так сильно."
"0x0d9c179a" = "Хорошо. Я хочу, чтобы вы добились экономического спада в городе @T$TargetTown$. У вас есть время до @D$EndDate$.<n><n>Для этого вы должны перехватывать всех торговцев, которые направляются в этот город. От недостатка товаров статус города начнет падать.<n><n>Однако есть и более быстрый способ. Вы должны напасть на город и разграбить его, вывезя все товары.  После этого статус города понизится до значения 'Восстановление', который из-за недостатка товаров будет падать и в конце концов снизится до значения 'Спад'."
