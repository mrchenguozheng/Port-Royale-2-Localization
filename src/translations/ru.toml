"0xd07dbe34" = "Важнейшие факторы, влияющие на качество жизни в городе, — наличие товаров и их ассортимент. Однако вовсе не обязательно обеспечивать поставки всех видов товаров, чтобы жители были довольны.<n><n>Товары в городе можно разделить на пять групп: товары первой необходимости, сырьё, готовые товары, колониальные товары и импортные товары. В том же порядке они перечислены в окне торговли. Достаточные поставки двух-трёх товаров из каждой группы обеспечат хорошее качество жизни в вашем городе. <n><n>Вы только что получили сообщение о качестве жизни в городах. Его можно открыть в журнале.<n><n>Поскольку ваш город ещё мал, добиться хорошего качества жизни особенно легко: горожане небольших городов неприхотливы. Значит, с выполнением задачи у вас не должно быть проблем. Однако город с населением менее 2 000 жителей не может подняться выше статуса «бум».<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Добейтесь, чтобы в вашем городе было по пять бочек каждого товара."
