"0xf64f1e5b" = "Мы ведем войну с государством @n$TargetNation$. Я хочу, чтобы вы захватили или пустили ко дну несколько торговых кораблей противника. Все, что вы захватите с этих кораблей — ваше, меня интересует только ослабление экономики государства @n$TargetNation$. Вы согласны?"
"0xf64f1e5c" = "Я подумал, что вы сможете помочь нам в войне с государством @n$TargetNation$. Мне нужно, чтобы вы отправились в определенный район и там захватили или пустили ко дну несколько торговых кораблей противника."
"0xf651cc3f" = "Голландия и Англия заключили мир, так что вы больше не можете захватывать города.<n><n>Вы многое сделали в этом сценарии, но не успели захватить для Голландии достаточно городов.<n><n>Таким же образом города захватываются в режиме свободной игры. Вы должны быть уверены, что государство,  чьи города вы собираетесь захватывать, является слабым в военном отношении, а государство, для которого вы захватываете города,  должно быть в военном отношении сильным, и эти два государства должны вести друг с другом войну.<n><n>Обратите внимание: обычно когда вы захватываете города для вице-короля, он награждает вас наделом земли, на котором вы можете построить свой собственный город. Однако в настоящем сценарии эта функция отключена."
