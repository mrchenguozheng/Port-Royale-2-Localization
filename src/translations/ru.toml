"0x21cae149" = "Очень хорошо! Теперь вы должны усилить свой караван, чтобы он смог справиться с несколькими военными караванами. В вашем караване должно быть как минимум три фрегата или более мощных судна.<n><n>Вы можете захватить эти корабли или купить их на верфях административных центров. <n><n>Полностью вооружите эти корабли, наймите команду и сделайте эти корабли боевыми.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Вооружите ваш караван. В его составе должно быть как минимум три полностью вооруженных и укомплектованных командой корабля типа 'фрегат' или выше. "
