"0xe3e1d468" = "%1,<n><n>Ваша репутация в нашем государстве слишком низка. Боюсь, я не могу продать вам лицензию на строительство.<n><n>Возвращайтесь, когда ваша репутация повысится."
"0xe3e1d469" = "%1,<n><n>Вы недостаточно торговали с нашим городом. Доставляйте товары, которые нужны городу, и ваш торговый рейтинг увеличится. Тогда вы сможете купить лицензию."
"0xe3e33a30" = "%1 - ваш новый город. Вы можете посещать его, как любой другой город, строить в нем здания и открывать предприятия. <n>Вся его территория вам пока недоступна, но если вы захватите еще несколько городов, то получите в свое распоряжение дополнительную территорию."
