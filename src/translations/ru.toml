"0x35f490c4" = "[riddle:copy=0x35f490c3]"
"0x35f490c5" = "[riddle:answer=Santa Marta;group=35f490c5;clue=джунглей,солнце,Белый песок;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 23`]Белый песок у джунглей, безымянная речушка. Здесь ты укрыт хорошо, в бухте, которую видит лишь солнце."
"0x35f490c6" = "[riddle:answer=Maracaibo;group=35f490c6;clue=пролив,бухте,кораблей;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 5`]Здесь город с видом на пролив. Эскадра кораблей на рейде в бухте."
"0x35f490c7" = "[riddle:answer=Caracas;group=35f490c7,35f49136;clue=корабль разбитый,скал;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 7`]Недалеко от города, в подножье острых скал, лежит корабль разбитый, о котором я слыхал."
"0x35f490c8" = "[riddle:answer=Port of Spain;group=35f490c8;clue=Испанцы,кирпичи,древесина,пшеницы;level=town;certainty=certain;source=original-en]Испанцы основали порт. Там кирпичи и древесина. Но никакой пшеницы не найти."
