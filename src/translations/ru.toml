"0xf6ec5ddc" = "Странные вещи происходят в Тортуге. В город практически не заходят торговцы. Вы должны помочь Тортуге, доставляя туда товары.<n><n>Ваш стартовый капитал невелик — у вас всего @g$StartGold$ наличными. Но в порту вас ждет отличный торговый караван, а на вашем складе есть некоторый запас товаров.<n><n>Вашей первой задачей будет увеличить количество своих денег до @g$GoldGoal$. Вы должны сделать это как можно быстрее, не более чем за 40 дней.<n><n>Небольшая подсказка: вы не должны продавать свои корабли, но можете взять заем у казначея.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>У вас должно быть @g$GoldGoal$ наличными до @D$EndDate$."
"0xf70feddb" = "Вы снова в порту Картахены, где выбран ваш караван 'Санта-Мария'.<n>Как видите, караван уже загружен товарами: хлопком, мясом и какао.<n>Чтобы продать эти товары, найдите в порту доки и щелкните по ним."
"0xf70feddc" = "В доках вы можете осуществлять торговлю между городом и вашим складом или городом и караваном.<n>Вы видите, какие товары есть в городе, и какие — на вашем караване. Покупка и продажа осуществляется с помощью стрелочек. На стрелочках отображается цена на единицу товара. <n>Продайте свой хлопок."
"0xf70feddd" = "Обратите внимание, что после того, как вы продали хлопок, цена на него упала.<n>Это происходит потому, что цена на товар определяется спросом и предложением.<n>Продажа товаров понижает спрос, и цена падает. Если же вы покупаете товар, цена на него растет.<n>А теперь купите @a$SubGoal$ пшеницы."
"0xf70fedde" = "Видите, как выросла цена на пшеницу? <n>Имейте в виду, что цена зависит также и от вашей репутации в городе.<n>Нажмите кнопку с изображением здания в правой нижней части окна торговли."
"0xf70feddf" = "Теперь вы можете торговать между городом и вашим складом.<n>Если вы хотите начать в городе производство товаров, то сначала должны построить в нем склад. В городе, где вы начинаете игру, склад у вас уже имеется.<n>Продайте все товары, которые есть на складе."
"0xf70fede0" = "В верхней части окна торговли расположены три кнопки с числами 1, 10 и 100. Они используются для того, чтобы быстрее продавать или покупать большие объемы товаров. Нажмите кнопку '10'. Обратите внимание, что цены товаров изменились<n>Не важно, покупаете вы 1 единицу товара 10 раз или 10 единиц сразу. Общая сумма, которую вы заплатите, будет одинаковой. Купите @a$SubGoal$ рома."
"0xf70fede1" = "В правой колонке окна торговли  показывается средняя цена на купленные вами товары. Поскольку вы должны извлекать из торговли выгоду, вам нужно найти город, где за эти товары вам заплатят больше.<n> А теперь нажмите кнопку с изображением крана и откройте окно обмена между караваном и складом."
"0xf70fede2" = "Это окно используется для перемещения товаров со склада на караваны и наоборот. Если у вас остались какие-либо товары на складе, погрузите их на караван. Эти товары вы продадите в другом городе.<n>Закройте окно торговли, нажав на кнопке 'X'."
"0xf70fede3" = "Переключитесь на морскую карту и отправьте свой караван в Санта-Марту. Не входите на экран города. По прибытии каравана щелкните по иконке города правой кнопкой мыши. "
"0xf70fede4" = "Откроется окно торговли для Санта-Марты.<n>Как видите, чтобы осуществлять торговлю, вовсе не обязательно заходить в город.<n>Продайте все товары, которые есть на борту ваших кораблей.<n>Закройте окно торговли."
