"0xe6393b08" = "Караван в море"
"0xe6490f96" = "1676 год, голландский административный центр на островах Теркс. Голландия владеет семью городами: пятью колониальными и двумя административными центрами.<n><n>Англия, владеющая 14 городами, уже давно воюет с Голландией, и война продлится еще много месяцев. Пока война не завершится, вы должны захватывать для Голландии английские города.<n><n>Но прежде чем начать атаковать города, вы должны увеличить свой капитал и лучше вооружить свои корабли. Ваше первое задание — захватить три английских торговых каравана. <n><n>Прежде всего вы должны получить каперское свидетельство у губернатора на островах Теркс. <n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Нанесите визит губернатору островов Теркс и получите у него каперское свидетельство против Англии."
"0xe64f1385" = "Очень хорошо! Вы уничтожили один из караванов Черной Бороды. Теперь отправляйтесь к губернатору города @T$TOWN$ за наградой.<n><n>Он даст вам новое задание.<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>Цель сценария<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>Выполните новое задание губернатора города @T$TOWN$."
