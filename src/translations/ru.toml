"0x0420c2a2" = "<ts:20>Вы уже знаете, как покупать и продавать товары в окне торговли. Вот еще несколько подсказок:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Цена, показываемая на стрелочках, зависит от объема покупки.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Покупаете вы 1 единицу товара 10 раз или 10 единиц сразу — общая сумма, которую вы заплатите, будет одинаковой.<n><n><g:INTEXT_AUSRUF_800x600.screen>Цена на товар отображается всегда, даже если товара нет в наличии. Показывается цена за единицу товара, вне зависимости от установленного объема покупки.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Купить или продать товар вы можете также, щелкнув по соответствующей иконке. Появится небольшое окошко с полосой прокрутки. Вы можете использовать эту полосу, чтобы установить, какое количество товара вы хотите купить или продать. При этом показывается цена за единицу товара и общая сумма."
