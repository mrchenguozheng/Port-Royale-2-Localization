"0xcff9644a" = "\"Однорукий бандит\" - это азартная карточная игра. Играют 32 карты четырех мастей, по возрастанию старшинства - I, II, III, IV, пират, невеста, губернатор, попугай.<n><n>Игроки делают ставки, после чего в закрытую раздается 5 карт.<n><n>Каждый игрок оценивает количество взяток, которые он может взять. Заявивший большее количество ведет игру и объявляет козырную масть. Он должен взять по меньшей мере заявленное количество взяток.<n><n>Ведущий выкладывает одну из своих карт. Второй игрок должен сыграть карту той же масти, или, если такой нет, побить козырем или сбросить карту другой масти.<n><n>Чья карта старше, тот берет взятку (козырная масть бьет другие масти).<n><n>Тот, кто взял взятку, играет первым следующую карту, и так до тех пор, пока кто-то не выиграет.<n><n>Если ведущий берет заявленное количество взяток, он выиграл и забирает обе ставки. Если ему это не удалось, выиграл оппонент."
