"0x23f0ed65" = "Мы ведем войну с государством @n$HostileNation$. Один из моих капитанов придумал хороший способ деморализовать противника. Он предложил сформировать эскадру, состоящую из вражеских кораблей, чтобы '@n$HostileNation$ попробовала собственное лекарство', как он выразился.<n>Вы можете стать тем самым человеком, который добудет для нас эти корабли."
"0x23f0ed66" = "Мы снова ведем войну с государством @n$HostileNation$, и для защиты города я хочу сформировать новую эскадру военных кораблей. Я не собираюсь ждать, пока необходимые мне корабли придут из Европы.<n>К сожалению, мои ресурсы очень ограничены, но мне пришла в голову одна мысль. Я хочу использовать корабли врага. Вы не поможете мне добыть несколько кораблей типа @S$ShipType$?"
