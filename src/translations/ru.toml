"0xe3922641" = "Стрелка этого компаса вращается очень плавно и быстро останавливается. Вы никогда раньше не видели такого точного прибора.<n>Компас носится как украшение, а его оборотная сторона украшена гравировкой."
"0xe3922642" = "Эта пара компасов, сделанных из чистого золота, прекрасно лежит в руке и очень проста в использовании. Компасы украшены замысловатым узором."
"0xe3922643" = "С помощью этого секстанта можно определять точное направление даже в открытом море. Части секстанта скреплены между собой пружинами, которые уменьшают вибрацию."
"0xe3922644" = "Эти спаренные подзорные трубы позволяют обозревать окрестности обеими глазами. Для защиты глаз линзы можно закрыть цветными стеклами. На корпусах труб можно разглядеть странную гравировку."
"0xe3922645" = "Это обычные золотые часы, но миниатюрного размера. На циферблате можно разглядеть медленно вращающееся изображение луны. Обратная сторона часов покрыта гравировкой."
"0xe3922646" = "Эта лампа похожа на обычный фонарь, однако система зеркал вокруг горящего фитиля направляет ее свет в одном направлении. С помощью специального устройства можно быстро открывать и закрывать лампу."
"0xe3922647" = "Одна линейка встроена в другую так, что может двигаться вперед и назад. Сверху к ним прикреплено прозрачное двигающееся окошко. Это устройство можно использовать для простых вычислений."
"0xe3922648" = "Это странное устройство похоже на стрелу. Если погрузить устройство в воду, его лопасти начинают вращаться. Маленький счетчик показывает число оборотов, что позволяет вам точно подсчитать скорость корабля."
"0xe3922649" = "Этот прибор состоит из вращающихся лопастей и циферблата, показывающего скорость вращения. Он служит для измерения скорости и определения направления ветра. Прибор изготовлен очень искусно и украшен неизвестным символом."
"0xe392264a" = "Несмотря на то, что эта веревка провела долгое время в морской воде, она выглядит совсем новой. Она очень гладкая, и на ней можно завязывать очень прочные узлы."
"0xe39226b2" = "В этой папке находится множество прекрасно выполненных звездных карт. А с помощью большой таблицы можно определить, где и когда восходит и заходит та или иная звезда."
"0xe39226b3" = "Покрытый гравировкой диск, в который встроены другие диски меньшего размера. Этот прибор можно использовать, чтобы определить, какая часть звездного неба видна в определенное время.<n>Разметка дисков позволяет сделать вывод, что прибор использовали для определения местонахождения корабля в открытом море."
"0xe39226b4" = "При вращении ручки из большого рупора начинают доноситься приятные звуки женского пения. Как раз то, что нужно морякам, неделями плавающим в открытом море."
"0xe39226b5" = "Большое увеличительное стекло, закрепленное на золотой ручке. Если держать его над картой, то даже при плохом свете можно разглядеть мельчайшие детали."
"0xe39226b6" = "Этот небольшой бронзовый столик сделан таким образом, что его поверхность вне зависимости от наклона корабля всегда остается в горизонтальном положении. На металлическом кольце вокруг столика выгравированы знаки, обозначающие стороны света. Вы не можете определить страну, где использовался этот столик."
"0xe39226b7" = "В маленькой коробочке находится замысловатое устройство, с помощью которого можно быстро и просто добыть огонь. Коробочка покрыта загадочной гравировкой."
"0xe39226b8" = "Это скорее украшение, чем настоящий якорь. Его можно использовать разве что на весельной лодке.<n>Якорь довольно тяжел для своего размера и весь покрыт сложными узорами и непонятными письменами."
"0xe39226b9" = "Это устройство напоминает масляную лампу с кремнем. С помощью маленького колесика, высекающего искру, можно зажечь пламя даже на сильном ветру."
"0xe39226ba" = "В этот горн не надо дуть самому, для этого используется устройство, напоминающее насос. Если сильно нажать на него, горн издаст невероятно громкий звук."
"0xe39226bb" = "Эта морская карта не похожа на все те, что вы видели раньше. Она многоцветная и очень детальная. Но вы не можете понять, что за местность на ней изображена."
"0xe39bb702" = "Караван не может быть отправлен: на кораблях слишком много пушек. Продайте часть пушек или переведите их на склад. Количество пушек не должно превышать допустимый максимум."
