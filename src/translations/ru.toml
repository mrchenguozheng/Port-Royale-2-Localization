"0x35f48f6c" = "[riddle:answer=Corpus Christi;group=35f48f6c,35f48f74,35f48f75;clue=отвергнут,забыт;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 4`]Тот город в отдалении отвергнут и забыт, искать его — безумие. Он тайной вечной скрыт."
"0x35f48f6d" = "[riddle:answer=New Orleans;group=35f48f6d;clue=речка,утесу;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 15*`]Сбегает речка там к утесу, и городок стоит. В том месте чудном каждый рад бы жить."
