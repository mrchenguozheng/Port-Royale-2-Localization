"0x080f2b29" = "<ts:20>О товарах нужно знать следующее:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Товары делятся на пять типов: товары первой необходимости, сырье, готовые товары, колониальные товары и импортные товары.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Каждый город может производить до пяти различных товаров.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Есть два типа городов: колониальные города и административные центры.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Административные центры производят товары первой необходимости и готовые товары. Также в эти города регулярно поступают импортные товары из Европы. Таким образом, эти города — лучшее место для приобретения готовых и импортных товаров.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Для производства готовых товаров административным центрам требуется сырье. Также эти города охотно покупают колониальные товары, которые затем отправляют на транспортных караванах в Европу. <n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>Колониальные города производят товары первой необходимости, сырье и колониальные товары. Каждый из колониальных товаров производится в определенном районе Карибского бассейна. Кофе, например, выращивается только на юге и западе Карибского региона.<n><n>О ценах на товары нужно знать следующее:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Чем больше спрос на товар в городе и чем меньше поставки, тем выше будет цена.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Чем выше у вас репутация в стране, тем ниже цена, по которой вы сможете покупать в городах этого государства товары.<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>Покупайте товары только в городах, в которых они производятся.<n><n>Самый быстрый способ заработать:<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>покупайте сырье и колониальные товары в колониальных городах,<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>продавайте эти товары в административных центрах и покупайте там готовые товары и импортные товары."
