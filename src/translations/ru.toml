"0xf725f22c" = "Ваш караван находится в городе Санта-Марта. Щелкните по названию города, чтобы вывести информацию о нем.<n>Вы можете сделать это, находясь на морской карте или на экране города."
"0xf725f22d" = "В окне информации показано, какие товары производятся в городе.<n><n>Также в этом окне указано отношение к вам Испании. Как видите, сейчас к вам относятся дружелюбно. Это означает, что на рынке вам предложат лучшую цену.<n><n>Закройте это окно и осмотрите город."
"0xf725f22e" = "Щелкните на иконке с изображением человека, которая расположена под названием города в левой части экрана, чтобы вывести информацию о населении Санта-Марты."
"0xf725f22f" = "Вы увидите, сколько товаров находится на складе города и какое количество ежедневно потребляется. Естественно, уровень потребления зависит от численности населения города.<n>Эта информация поможет вам понять, какое количество товаров можно регулярно привозить в город. Закройте окно."
"0xf725f230" = "А теперь давайте попробуем совершить несколько выгодных сделок.<n>Откройте окно торговли и купите столько хлопка, сахара и какао, сколько может перевезти ваш караван. Эти товары производятся в этом городе.<n>Возвращайтесь в Картахену и выгодно продайте эти товары."
