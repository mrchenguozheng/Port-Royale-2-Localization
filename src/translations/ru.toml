"0xe6851da5" = "В предыдущем сценарии вы узнали, что ваше звание зависит от размера вашего капитала, в который входят наличные деньги, собственность, товары и корабли. Узнать, насколько вы богаты, можно с помощью раздела 'Успехи' в журнале.<n><n>Обратите внимание также на синий индикатор в нижней части экрана каравана. Когда полоска достигает правого края индикатора, вы получаете новое звание. После того как вы получили звание, вы уже не можете его потерять.<n><n>Чем выше ваше звание, тем большим количеством караванов вы можете владеть и тем в большем количестве городов вы можете основывать предприятия. Начиная с определенного звания вы сможете владеть неограниченным количеством караванов и лицензий."
