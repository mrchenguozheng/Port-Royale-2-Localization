"0x35f49131" = "[riddle:answer=east;group=35f49131;clue=три,восток;level=direction;certainty=certain;source=original-en]В большом заливе города разыщешь. Их три, но нужный на востоке ты найдешь."
"0x35f49132" = "[riddle:answer=Providence;group=35f49132,35f49133;clue=северн;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9]Тот остров, словно в колыбели, спит, окруженный северными землями."
