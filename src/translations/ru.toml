"0x35f48fe3" = "[riddle:answer=Tampico;group=35f48fe3;clue=самом западе,город;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 3*`]Этот город находится на самом западе."
"0x35f48fe4" = "[riddle:answer=Cancun;group=35f48fe4;clue=юго-восток;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 2`]Другие жили здесь когда-то. И храмы возвели богам. Чуть выше вы найдете, что искали. Юго-восток — пристанище печали."
"0x35f48fe5" = "[riddle:answer=-southwest;group=35f48fe5;clue=юго-запад;level=direction;certainty=certain;source=original-en]Другие жили здесь когда-то. И храмы возвели богам. Чуть выше вы найдете, что искали. А юго-запад — лишь потерянное время."
"0x35f48fe6" = "[riddle:answer=Havana;group=35f48fe6;clue=Сигары,ром;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 12`&cargo]Оттуда до Номбре путь невелик. Сигары и ром мы вывезем вмиг!"
"0x35f4904e" = "[riddle:answer=Gibara;group=35f4904e;clue=север;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 20*`]Идите к северу, подальше от утесов. Там город, где спокойствие найдете."
"0x35f4904f" = "[riddle:answer=Turk Islands;group=35f4904f;clue=Три острова,канаты;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 6`]Три острова вокруг лежат, но канаты есть лишь на одном из них."
"0x35f49050" = "[riddle:answer=San Juan|San Thoma;group=35f49050,35f490bf;clue=юго-восток;level=town;certainty=either;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 1`]Тот остров совсем мал. Но взгляни на юго-восток — крупнее там нет."
"0x35f49051" = "[riddle:answer=-north;group=35f49051;clue=север;level=direction;certainty=certain;source=original-en]В цепи островов найдете разрыв. Те острова на западе и юге. А север — лишь вода и дым."
"0x35f49052" = "[riddle:answer=Vera Cruz;group=35f49052,35f490c1,35f490c2,35f49130;clue=три,западн;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 27*`]В большом заливе города найдешь. Их три,  но нужен вам лишь западный."
"0x35f49053" = "[riddle:answer=Roatán;group=35f49053;clue=три,юге;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 13`]В большом заливе города найдешь. Их три,  но нужный вам — на юге."
"0x35f49054" = "[riddle:answer=Roatán;group=35f49054;clue=Два острова,большом;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 21`]Два острова в заливе том. Большой и малый. Вам нужный город — на большом."
"0x35f49055" = "[riddle:answer=Cayman;group=35f49055;clue=далеко,маленький;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 25`]Далеко в стороне лежит остров, маленький и одинок. Иного места, что звалось бы X, нет."
"0x35f49056" = "[riddle:answer=Port Royale;group=35f49056;clue=златом,гавань;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 8`]В том граде улицы сияют златом. И гавань восхищает взор."
"0x35f49057" = "[riddle:answer=Santo Domingo;group=35f49057;clue=Четыре,вулкан,юго-восток;level=town;certainty=inferred;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 19*`]Четыре града окружают вулкан. И нужный вам город — на юго-востоке."
"0x35f490bf" = "[riddle:copy=0x35f49050]"
"0x35f490c0" = "[riddle:answer=Guadeloupe|Martinique;group=35f490c0;clue=Забытый город,прекрасные товары;level=town;certainty=either;source=original-en&manual:docs/_src/pr2-treasure-hunts.md@sha256-b61535c557a9#`Hunt Text 18`&cargo]Забытый город на песчаном пляже. И в одном найдете вы прекрасные товары."
