"0x30bb44fd" = "どうぞ座ってください、@A$USER$。私は@N$OwnerName$、話したい重要案件があります。どこから話せば。妻と言い争いになり、浮気をしていると責められました。もちろん事実無根です。とにかく家を追い出され、それだけではありません。賞金稼ぎを雇ったので、もう町にも入れません。助けてもらえますか？"
"0x30bb44fe" = "しっかりした船を任せられそうな方ですね。<n>@T$Town$へ急ぎ行かねばなりません。そこの商人の一人に不利な書類を届けるのです。あいにく、それを察した商人が書類を手に入れようとしています。私を@T$Town$へ送り届ける方法を考えてもらえませんか？"
