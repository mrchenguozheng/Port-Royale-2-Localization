"0xe6851da5" = "前のシナリオで、階級が総資産で決まることを学びました。総資産には現金、建物、船、物資が含まれます。総資産はログの「成果」でいつでも確認できます。<n><n>経験値を示す青いバーも確認できます。船団表示の画面下に常に出ています。バーが右端まで来ると次の階級に昇進します。一度上がった階級が下がることはありません。<n><n>階級が高いほど多くの船団を指揮でき、後に事業を興せる町も増えます。ある階級に達すると、船団と建築許可の数が無制限になります。"
"0xe6d65f53" = "住民"
"0xe6d9252d" = "%1、あなたが父がいつも話していた%2ですね。私は%3です。一緒に冒険の話を聞かせてくれませんか？"
"0xe6d9252e" = "あなたの噂はもう耳にしています、%1。私は総督の娘、%3です。%2にはずっと会ってみたかったのです。どうか、あなたの冒険の話を聞かせてください！"
"0xe6d9252f" = "なるほど、あなたがあの有名な%1！話に聞いていたので、もっと背が高い方だと思っていました。でも、それがあなたの魅力を減らすわけではありません！こちらへ来て、冒険の話を聞かせてください！父である総督から、あなたのことをたくさん聞かされています。"
"0xe6d92530" = "%1、<n>また会えてとても嬉しい。前回からどうしていましたか。私に何か持ってきてくれましたか？"
"0xe6d92531" = "%1、<n>またお会いできてうれしいです。前にお会いしてから、あなたのことばかり考えていました。早く入ってください、話したいことがたくさんあります。"
