"0xd4b8ac66" = "ようこそ！ちょうど新しい歴史随筆を書いているところです。"
"0xd4cd0f3d" = "ヘンリー・エイヴリーは成功した海賊の典型例です。当時最も豊かな船を奪い、当局の追跡を逃れ、富を楽しめるだけの長生きをしました。<n><n>エイヴリーの若い頃は謎に包まれています。ただ、1694年6月に彼が私掠船「チャールズ」の航海士だったことは分かっています。この船はスペインから、西インド諸島のフランス植民地マルティニークの船を拿捕する許可を得ていました。ある日彼は反乱を主導して船を掌握し、乗員の大半が味方しました。46門の大砲を積む快速の私掠船で、海賊船にうってつけだったこの船は「ファンシー」と改名されました。1695年、彼は最大の功業を成し遂げます。インドの宝船団の略奪です。他の海賊と手を組み、重武装のインド宝船団を襲って2隻を拿捕しました。その船は大ムガル帝の所有で、想像を絶する宝を積んでいました。<n><n>バハマの総督に賄賂を渡して海賊への保護を約束させた後、エイヴリーは乗員に分け前を払い、一同は世界各地へ散っていきました。何人かはイングランドで捕まりましたが、エイヴリーはアイルランドへ渡り、跡形もなく消えました。身を隠したまま富を楽しみ続けたのだとしか思えません。"
"0xd4cd0f3e" = "史上最も名高い海賊の一人がエドワード・ティーチ（1718年没）、別名ブラックベアード（黒ひげ）です。その名のとおり、恐ろしい黒い三つ編みの髭が彼の印でした。300人の乗員とともに、オランダの交易船を改造した船「クイーン・アンズ・リベンジ」で外洋を航海し、イギリス海軍の軍艦と戦うこともいとしませんでした。<n><n>ブリストル生まれのティーチは、18か月のあいだ、主に西インド諸島北部と北アメリカ沿岸で猛威を振るいました。そして常にバハマと、貧しいノースカロライナに逃げ込むことができました。<n><n>黒ひげがこれほど有名になったもう一つの理由は、恐ろしく血の気が多く短気な海賊という型にぴったり合っていたことです。砲手のイスラエル・ハンズを二度撃って不具にしたとされ、その理由は、乗員に誰が仕切っているかを思い知らせるためだけだったとも言われます。<n><n>彼の最後が訪れたのは1718年、海賊狩りのロバート・メイナードが彼のスループを追い詰めたときでした。ティーチは泥酔していながら悪鬼のように戦い、激しい格闘のすえに倒されました。彼は戦いの中で命を落とし、生き残った乗員の多くは絞首刑にされました。"
"0xd4cd0f3f" = "大航海時代の初め、すでに持つ富をさらに増やしたいと考えた人々は、主にカリブ海で16世紀初めから発展してきたサトウキビ農園が、絶好の投資先であることを知りました。<n><n>こうした投資は平均10パーセントの利益を生み、最良の場合（1650年ごろのバルバドスなど）は50パーセントにも達しました！当然、農園には膨大な数の労働者が要り、何十万もの奴隷がアフリカから送られました。というのも、この頃までに白人によって先住民が多くの土地でほぼ絶滅させられていたからです。<n><n>ヨーロッパ人自身はこの気候に耐えられず、それ以前に、こうした単純労働に従事するにはあまりに高貴すぎました。農園主たちもロンドンやマドリードに住み、手下に植民地の仕事を任せるのを好みました。18世紀までには、一部の島では黒人の割合が人口の90パーセントに達していました！"
"0xd4cd0f40" = "「黒い黄金」の交易は16世紀初めにはすでに始まっていました。奴隷商人が好んだ「商品」の供給源は、セネガル川から現在のカメルーンに至る西アフリカ沿岸でした。この地域は輸送上の立地が理想的だっただけでなく、安定した経済的・社会政治的な基盤も備えていました。つまり船乗りたちは自分で奴隷を狩り集める必要がなく、地元の首長や他の奴隷商人から買い取れたのです。<n><n>特に求められたのは15歳から35歳の若い男性で、主に農園での重労働に充てられました。最長6週間に及ぶ航海で、奴隷のおよそ5人に1人が命を落としました。主人の野蛮な扱いで死ぬ者もいれば、海難事故で命を失う者もいました。この高い死亡率を踏まえ、奴隷商人はできるだけ多くの奴隷を船に詰め込み、1航海あたりの利益を最大にしようとしました。数週間にわたり、哀れな人々は缶詰のイワシのように並んで横たわり、互いに鎖でつながれ、暗闇の中で息をするのがやっとでした。<n><n>こうした状況で誰かが生き延びたこと自体、ほとんど信じがたいことです！"
"0xd4cd0f41" = "北アメリカや中央アメリカに白人の奴隷はいませんでしたが、奴隷とほとんど変わらない境遇で働くヨーロッパ人は数多くいました。<n><n>多くの若者（主に教育を受けていない下層階級の出身）が移民を望みながら、渡航費を払う金がありませんでした。そこで渡航費を借り、一定期間サトウキビ農園などで働いて借金を返す約束をしたのです。<n><n>しかし、一見理にかなったこの取り決めにも落とし穴がありました。多くの農園主は、雇用期間中にこの契約労働者をできるかぎり酷使しようとしたのです。さらに、ほとんどのヨーロッパ人が耐え難いと感じるカリブ海の気候もありました。<n><n>この「年季奉公」制度は、母国を追われた囚人にもよく使われました。イギリスは後にこの方法を用い、とりわけインド人をアフリカの植民地で働かせました。"
"0xd4cd0f42" = "アメリカの植民地が栄えるにつれ、大西洋を渡る交易も盛んになりました。エリザベス女王の時代以来、最も強力な海洋国家だったイギリスは、物資の流れを統制し、国内経済が交易の利益を分け合えるようにすることに強い関心を持っていました。<n><n>護国卿オリバー・クロムウェルの下、1651年の「第一次航海条例」は、植民地からヨーロッパへ物資を運べるのはイギリス船だけと定めました。この措置は主に新興のオランダを狙ったもので、国内の交易船団に利しました。<n><n>1663年には規定がさらに厳しくなりました。ヨーロッパへ物資を運びたい植民地の船は、イギリスの港に寄港して通行料を払わねばならなくなったのです。しかし、植民地間の交易を統制しようとするこの試みはすぐに行き詰まりました。イギリス軍に海岸線全体を監視させるわけにはいかず、結果として密輸取引が盛んになったのです。<n><n>物資の輸出入の条件をめぐる母国とのこの絶え間ない対立こそが、とりわけ北アメリカの植民地で入植者たちの間に独自のアイデンティティを生み、後に独立運動の大きな動機となっていきました。"
"0xd4cd0f43" = "植民地時代の始まりは、それまで地中海や沿岸の短い航海ではほとんど知られなかった数多くの健康問題をもたらしました。カリブ海や北アメリカの植民地への航海は1〜2か月、嵐や無風に遭えばさらに長引きました。克服すべき困難は当然でした。汚れた衣服と不潔な体の悪臭、汚染されて腐った食料、きれいな水の不足、船内の鼠、そして単調さと閉所による精神的な疲労です。すべての船乗りに壊血病という恐ろしい影がつきまといました。ビタミン不足によるこの病は、髪と歯を失わせ、多くの船員の命を奪いました。これを最初に治療しえたのが世界一周航海者のジェームズ・クック（1728-1779）です。船内を清潔に保つよう命じただけでなく、乗員にザワークラウトと新鮮な果物を与えました。上陸する者には、黒水熱のような熱帯病も立ちはだかりました。マラリアで最も危険な形の一つで、脈拍の亢進、発熱、悪寒、黒い尿を症状とし、ほぼ確実に命を奪うものでした。"
"0xd4cd0f44" = "船乗りや地図製作者が新しい土地、川、集落に付けねばならなかった多くの名の裏には、興味深い逸話があります。大航海時代にヨーロッパの探検者がアメリカに付けた最初の名でさえ、物語を物語っています。コロンブスは1492年10月12日に上陸した島を「サルバドル（救世主）」と名付けました。これは、往路で船団を病と嵐から守り、とりわけ陸地を目前にしたまさに土壇場で起きかけた反乱を防いでくれた主に感謝するためでした。<n><n>その後、スペインの征服者たちは宗教的な含みを持つ名を選ぶことが多くなりました。たとえば「ノンブレ・デ・ディオス（神の名）」や「トリニダード（三位一体）」です。別の場合は、日付や景観の観察から着想を得ました。ポルトガルの船乗りたちは、1502年の元日に発見したブラジル沿岸の湾を「一月の川」と名付け、モンテビデオという市の名は、初めてその海岸線を見たときのマゼランの叫びに由来します。「モンテ・ビド・エウ！（山が見える！）」<n><n>支配者の名や母国、出身の町を新しい土地や町に付けるのも、探検家たちに人気の慣習でした。これは外部に領有を明確に示すだけでなく、こうした遠く離れた土地にも母国とのつながりを生みました。<n><n>それもかなわなければ、先住民の言葉の名に頼ることもできました（もっとも多くの場合、それによって入植者たちが後に先住民を追い払ったり絶滅させたりするのを思いとどまることはありませんでした）。<n><n>今なお、あの奇妙な有袋類の名を尋ねられたオーストラリアの先住民が「カングールー」あるいは「ガングル」と答え、それが実は「何の話だ？」という意味だったという俗説が生き続けています。たとえ作り話でも、こうした愉快な誤解はきっと実際に起きたのでしょう。<n><n>町や山、川の名のうち、どれほど多くが単に「おはよう！」「何とおっしゃいました？」「放っておいてくれ！」という意味にすぎないかを知れば、人はきっと驚くでしょう。"
"0xd4cd0f45" = "スペイン帝国が世界に広がるにつれ、日常の行政事務から突発的な危機まで扱える十分な権限を持つ植民地の統治機関を設ける必要が生じました。そのために、植民地で最も重要な総督に「副王（ビレイ）」の称号が与えられました。<n><n>帝国の最盛期には、ヌエバ・エスパーニャ（メキシコ）とペルーに二人の副王がいました。18世紀にはヌエバ・グラナダとリオ・デ・ラ・プラタの副王領が加わりました。<n><n>副王の職務は、アウディエンシアと呼ばれる行政評議会とともに（しばしば対立しながら）行い、税の徴収、住民が法を守ることの確保、植民地防衛の組織化など、通常の官吏の仕事を含みました。さらに先住民の保護や、下級の教会・世俗の要職の任命も担いました。<n><n>海外領土の経済的・政治的な重要性が大きかったため、王室は常に副王の動きに目を光らせていました。余分な収入を得る商業活動は禁じられていました。それとは別に、副王同士の対立は互いの権限を制約する結果にしかなりませんでした。"
"0xd4cd0f46" = "ヨーロッパの征服者たちが常に銀と金の呼び声に従ったことは、すでに広く知られています。しかし、ほとんどそれ以上に価値があったのが香辛料です。胡椒やナツメグを少し手に入れるために人々がどれほどの危険を厭わなかったかを思えば、中世ヨーロッパの食事がいかに味気なかったか、想像するのは難しいでしょう。<n><n>その点で、アメリカの発見は当初こそひどく期待外れでした。人々はコロンブスが持ち帰った珍しい動物に関心を示し、自国の領土が広がること、そしてキリスト教の普及で多くの魂が救われることを想像して喜びました。しかし約束されたほどの金の山は、なかなか見つかりませんでした。これらの航海が利益を生むようになったのは10〜20年後、アメリカの銀がヨーロッパへなだれ込むようになってからです。<n><n>その航海の一つで、コロンブスは世界中の金銀すべてより貴重な宝物を持ち帰りました。1492年11月4日、先住民が彼に差し出したのは、栗のような味のする「果物」と彼が記したものでした。その瞬間、彼はジャガイモを食べた最初のヨーロッパ人になったのです！この植物の先住民の言葉は「バタテ」で、英語の「potato」として今も残っています。<n><n>今日では当たり前になっている多くのものも、コロンブスとその後継者たちによって初めてヨーロッパへもたらされました。たばこ、トマト、とうもろこし、そしてハンモックです。先住民の言葉では「ハマカ」といい、英語の語源にもなっています。"
"0xd4cd0fae" = "新世界の発見が伝えられると、ヨーロッパの人々の想像力はかき立てられました。この未踏の地にはどんな生き物がいるのか。信じがたい噂が飛び交いました。ある島は人食いでいっぱいだと言い、次の島には顔が腹に付いた首無しの生物がいると言う。<n><n>南アメリカのパタゴニアは、おおよそ「大足の者たちの国」を意味します。アマゾンという名は、探検家たちにギリシア神話の女戦士を思い起こさせたという女戦士の一団に由来します。<n><n>こうした噂のいくつかには事実の裏付けがありましたが、他は誤解や誤った解釈、あるいは先住民がどこかで聞きかじった話に基づいていました。<n><n>しかし多くの噂は、人々の生き生きとした想像力の産物にすぎず、たいていは信じたいから信じていただけでした。歴代の征服者たちが、伝説の若さの泉、エデンの園、黄金の都エル・ドラードを探し求めたのも、そう説明できるでしょう。彼らの誤信を後押ししたのは先住民でした。あの場所もこの場所も聞いたことがあると常に請け合いながら、実のところは時間を稼ぎ、欲深い白人を内陸深くへ誘い込んで船から切り離そうとしていたのです。"
"0xd4cd0faf" = "多彩な人物を数多く輩出した探検家・征服者の系譜の中でも、際立って華やかな一人がイングランドの文人にして冒険家、ウォルター・ローリー卿（およそ1554-1618）です。彼が最初に名を上げたのは1580年、イングランドの占領に反対するアイルランド反乱を鎮圧したときでした。<n><n>エリザベス1世の寵を得た彼は、その影響力を使って、南アメリカの伝説の都市エル・ドラードを探す遠征に資金を集めます。何度かの遠征が価値あるものを何も見つけられずに失敗しても、彼は独特の説得力でロンドンの出資者たちの支持を保ち続けました。最後の褒美はいつも次の河口の先にある、今やめるわけにはいかない、と信じさせたのです。<n><n>それでもやがて彼の信用は尽きました。人々は高らかな約束を聞かされ、後になってそれが空手形にすぎなかったと知ることを、あまりに重ねてきたのです。ローリーはついにエリザベスの寵を失います。後継者ジェームズ1世はこの血の気の多い冒険家を、より穏健な外交政策への脅威と見なし、即位するとすぐ、きわめて薄弱な根拠で逮捕して死刑を宣告しました。刑は減刑され（ただし取り消されはしませんでした！）、ローリーはロンドン塔に投獄されます。<n><n>数年後、国の財政が、必要だと王を説得したとき、王はローリー卿にギアナへの新たな遠征を率いる許可を与えました。これは不合理な状況でした。自ら死刑を宣告された者に、他人の生死を左右する権限を与え、金を探しに行かせるというのですから。しかしこの矛盾はほどなく解消します。熱病に苦しむローリーは、最後の遠征が失敗に終わるのを見届けたのです。<n><n>イングランドへ戻ると、激怒した王は1603年に定めた執行停止を終わらせることにしました。ウォルター・ローリー卿はまもなく処刑されました。"
"0xd4cd0fb0" = "新世界の先住民と白人の船乗りたちの最初の出会いは、おおむね平穏に過ぎました。多くの土地で、ヨーロッパ人は神として迎えられました。それが古い神話に基づくこともありましたが、ほとんどの場合、先住民は「水の家」（船）に乗って輝く鎧で現れた、背の高い金髪の見知らぬ者たちに圧倒されただけでした。<n><n>コロンブスもコルテスも他の探検者たちも、この幻想を広めたいと喜んでいましたが、先住民はやがて残酷な現実に直面します。飽くなき金への欲情、先住民が「スペイン病」と呼んだものに突き動かされ、スペイン人は住民を虐待し、奴隷にし、虐殺しました。アメリカにいなかった馬の姿と大砲の音は激しい恐慌を呼び、虐殺を生き延びた者もまもなく天然痘やインフルエンザなど持ち込まれた病に倒れました。<n><n>ゴンサロ・オビエドやフアン・デ・セプルベダといった著名な知識人は、血も凍るような人種差別的な論法で、先住民を卑しく無知で劣った人種と描き、ヨーロッパ人の犯した罪を正当化しようとしました。<n><n>信仰のゆえに科学者や魔女を火刑にした同じ者たちが、先住民の「獣のような風習」について衝撃的な記述を作る術にも長けていました。偶像崇拝、人身御供、人食いがまったくの空想ではなかったにせよ、以後それは、先住民にあらゆる残酷な制裁を課すための包括的な口実として使われたのです。"
"0xd4cd0fb1" = "広く知られているように、アメリカ植民地化の初期はスペインとポルトガルが担いました。後にオランダ、そして何よりイングランドとフランスが加わりました。あまり知られていないのは、ドイツの強力な資金提供者がいなければ数多くのスペイン遠征が実現しなかったということです。<n><n>1500年までに、とりわけ上シュヴァーベンとアウクスブルクはヨーロッパ有数の交易・金融の中心地へと発展していました。ここからフッガー家やヴェルザー家といった商人の一族が、世界の政治に強い影響を及ぼしました。たとえば、スペイン王カルロスが1519年にドイツ皇帝となったのも、彼らの手厚い財政支援があってのことでした。イングランド王ヘンリー8世や多くの教皇も、「富者」ヤーコプ・フッガーを友人に数えることを喜んでいました。<n><n>もちろん、こうした支援には彼らなりの下心がありました。見返りとして、特権や王室の銀採掘への参加許可を期待したのです。ヴェルザー家は一時、ベネズエラ北岸の一部を手に入れ、そこに「ノイアウクスブルク」などの町を築き、内陸の宝を求めて何度も（ほとんど実りのない）遠征を送り出しました。"
"0xd4cd0fb2" = "世界の半分を征服することで、スペイン王室は他に類のない機会を得ました。数世紀にわたり、インカ・マヤ・アステカの大文明が滅び、最後にはペルーとメキシコで巨大な銀鉱床が発見されるまで、スペインの地位は揺るぎないように見えました。まさにその途方もない富がこの世界帝国の衰退を招いたとは、ほとんど不合理に思えます。<n><n>船でスペインへ送られた宝の大部分は、そもそも航海に資金を出したピレネー以北の商人たちの懐に直接入りました。それでも残りは、イベリア半島の物価を押し上げるのに十分でした。人々は身の丈を超えた暮らしを始めます。壮大に宮廷を開く力が国家予算の均衡より重んじられた時代に、小さな財政の心配など誰も気にしませんでした。<n><n>自国で作るにはあまりに洗練されすぎたため、物資は外国船でますます大量に輸入されました。アメリカ遠征の装備や食料まで、国内の商人が用意することはまれでした。人々は誇らしげに言いました。ヨーロッパ中がスペインの意のままに動いている、と。<n><n>しかし銀の流れはいずれ涸れるものであり、その後に訪れた目覚めは、長い夜の酔いの後の二日酔いのようなものでした。オランダとイギリスがスペインを公海から追い出そうとし、プロテスタントの「異端者」やトルコ人との数々の宗教戦争が莫大な金を食い尽くし、太陽の沈まぬ大帝国は統治不能な巨像と化していたのです。<n><n>危機は1557年、誰の目にも明らかになりました。新たなスペインの支配者フェリペ2世が、初めて国家破産を宣言せざるを得なかったのです。かつてのどの帝国よりも多くの宝を抱えた大帝国は、破産しました。"
"0xd4cd0fb3" = "なぜブラジルで話される言語はポルトガル語で、南アメリカのほとんどどこでもスペイン語なのでしょうか。<n><n>スペイン人も、アフリカ沿岸を回るインドへの海路を発見したポルトガル人も、自らの未来が海の向こうにあると早くから気づいていました。互いに嫉妬深く監視し合い、物資・臣民・土地を求める中で相手の領土を侵さないようにしていたのです。<n><n>当時は国際法のようなものがなかったため、紛争が起きると両国がその権威に従う用意のある唯一の人物、教皇に裁定を求めました。カトリック教会としても、スペイン人とポルトガル人が互いの足を引っ張ることに力を費やすより、未知の土地で「異教徒」のキリスト教化に熱心に取り組むことを望んでいました。<n><n>そこで1494年のトルデシリャス、1529年のサラゴサでの共同交渉で、ある経線より西の新発見の領土はスペインに、それ以外はすべてポルトガルに属するという合意が成立しました。この経線は当時未発見だった南アメリカを横切ったため、その東側、現在のブラジルの一部がポルトガル領となったのです。"
"0xd4cd0fb4" = "「海賊」という語を初めて記したのは、おそらく紀元前140年ごろのローマの著述家ポリュビオスでした。以来、この恐るべき海の悪党を指す言葉は数多く使われてきました。コルセア、フリーブーター、バッカニア、フィリバスター…クラウス・シュテルテベッカーを取り巻く者たちは「ヴィタリア同胞団」と呼ばれ、バーソロミュー・ロバーツは自分と殺し屋の一行に「幸運の紳士たち」といういかにも無害な称号を与えました。しかし結局、商人にとっては、虚空から現れて船を襲うのが誰であれ大差はありませんでした。<n><n>バッカニアは古来、世界のあらゆる隅々で人類の災いでした。古代にはキリキアの海賊が地中海全域に恐怖を広め、ローマ帝国は彼らに対して定期的な遠征を余儀なくされました。航路の多い海域に近い隠れた島々やぎざぎざの海岸線は、海賊活動の理想的な拠点でした。岩礁や海流、悪天候が緩慢な交易船を格好の獲物に変える海域は、暴行を働いた後に素早く逃げ込める避難所でもあったのです。古代に小アジアの海岸が恐れられたのは、大航海時代にカリブ海が恐れられたのと同じであり、東南アジアの海賊はほとんど神話的な存在になりました。<n><n>語源によれば「バッカニア」とは、海軍の水夫ではなく私人として獲物を求めて海に出た船乗り、つまり海賊行為に従事していると見なされた者を指しました。<n><n>しかし私掠免許状の発行によって、カリブ海のバッカニアの一部は合法の外観を得ました。これらの文書はイングランド・フランス・オランダの総督が発行し、海賊という災いを敵対国に向けるのが目的でした。<n><n>私掠免許状をどれだけ容易に得られるかは、総督次第でした。海賊と手を組むのは不名誉だと考える総督もいれば、あまり良心に縛られない者、単に腐敗していたり臆病だったりする者もいました。"
"0xd4cd0fb5" = "「七つの海」は実際には三つ（つまり三大洋）しかありません。太平洋（南北）、大西洋（南北）、北極海と南極海、そしてインド洋です。<n><n>太平洋の名は、マゼランの世界一周に由来します。この広大な海を渡るのに何週間も飢えながら、幸運にも好天に恵まれたのです。<n><n>もう一つ。カリブ海の名は「カリベ（カライベ）」から来ています。これはインディアン語族の民族名で、その居住域はアンティル諸島から南米北岸一帯に及んでいました。"
"0xd4cd0fb6" = "バミューダ諸島の名は、1503年に発見したスペインの探検家フアン・ベルムデスの名に由来します。船乗りたちに「バミューダ・トライアングル」として知られる、不可解な海難事故の危険が非常に高いとされる海域は、バミューダ諸島、プエルトリコ、フォートローダーデール（フロリダ）の間の海を指します。<n><n>この一連の奇妙な出来事はコロンブスの航海から始まったと主張する人もいます。スペインに仕えたジェノヴァ出身の彼は、1492年9月14日、まさにこの海域で三隻の船とともに、羅針盤の針が激しく回るのを目にしました。これは地理上の北極と磁北との差によるものでした。翌日には空に巨大な炎が現れました（隕石だった可能性があります）。<n><n>ただし「バミューダ・トライアングル」という呼び名が生まれたのは第二次世界大戦後のことでした。一連の航空機事故が、北大西洋南西部のこの海域に世間の注目を集めたのです。<n><n>神秘現象の信奉者たちは200件以上もの未解明の事故を挙げますが、境界の取り方はかなり恣意的です。その多くは、そもそもこの海域で起きてもおらず、ごく論理的に説明がつくものです。"
"0xd4cd0fb7" = "定期的にアメリカからスペインへ向けて出航した伝説のスペイン宝船団は、イベリア半島の外にもあらゆる欲望を呼び起こしました。とりわけ野心家のイングランドは、これをスペインの「海の女王・世界の女王」の地位に異を唱える好機と見たのです。<n><n>島国はまだ大規模な軍事作戦を展開できるほど強くなかったため、ライバルとヨーロッパの外で、遠くで、攻撃を予期されず警告も与えられない場所で事を構えるほうがはるかに理にかなっていました。そこでは獲物を楽に奪い、そのまま消えれば、ヨーロッパの誰も何か月もその出来事を知りません。<n><n>大胆な船長たち、その最も有名なフランシス・ドレイク（1540-1596）らには、エリザベス1世陛下から私掠免許状が与えられました。この免許状はいわば白紙小切手のようなもので、ドレイク一味を並のバッカニアの上に押し上げ、より高き権威に仕える私的な山賊男爵の地位を与える略奪許可証でした。彼らは実に見事にそれをこなしました。イベリアの船も守備隊も安全な場所はありませんでした。<n><n>1578年、ドレイクはマゼラン海峡を抜け、アメリカの太平洋岸でスペインの獲物を求めて旋風のように駆け回りました。それまで誰も敢えてしなかったことです！1580年にプリマス港へ戻ったドレイクは、マゼランに次いで世界を一周した二人目の船長になっていました。<n><n>一方、スペイン王フェリペは激怒し、1494年に教皇が西半球をスペインの勢力圏と断言したトルデシリャス条約を振りかざしました。しかし、ローマ教皇の権威を完全に拒否し、1582年に教皇グレゴリウスの命で作られたという理由だけで1753年までグレゴリオ暦の採用さえ拒んだプロテスタント異端者の、この奇妙な島国に、そんな抗議が効くはずもありませんでした。<n><n>再び、問題は戦争でしか解決できないかに見えました。フェリペの無敵艦隊は1588年にイングランドへ向けて出航しますが、すでに騎士に叙されていたフランシス・ドレイク卿の指揮と、折よく訪れた嵐の助けによって、イングランドはスペイン艦隊を撃破しました。以後数百年、イギリスの海軍大国としての地位に挑む者はいませんでした。"
"0xd4cd101f" = "疑いなく、コロンブス（1451-1506）のアメリカ航海は、人類が行った最大の冒険の一つに数えられます。劇的な出来事と奇妙な偶然に満ちたこんな物語は、著述家でさえ想像するのをためらうでしょう。<n><n>ジェノヴァ出身の航海者は、インドへの西の海路があるという考えをスペインのイサベル女王とフェルナンド王に納得させることに成功しましたが、船の乗員の同意は得られませんでした。実際、乗員の多くは強制的に集められたのです。王冠に対する軽犯罪の罰として、パロスの町は船二隻と乗員を供出させられました。<n><n>コロンブスの計画が知れ渡ると、恐怖の声が上がりました。乗員たちは、自分たちは狂人の指揮下で航海しており、その男は自分と同船する全員を破滅させるだけだと固く信じていました。<n><n>しかしコロンブスの最大の敵は迷信でした。ありとあらゆる恐怖の物語が船内に持ち込まれ、奇妙で不吉な出来事が船乗りの恐れを強めるだけでした。テネリフェを過ぎるころ火山が噴火し、空には炎の柱が見え、羅針盤の針まで乗員を翻弄しているようでした。船が無風で止まれば凶兆とされ、順調に進めば、風は常に東から西へ吹いており引き返せないのだと言われました。<n><n>何度も反乱は避けられないかに見えました。ある夜、船長は船室の外に足音とつぶやきを聞きましたが、大声で祈り始めたとき、暗殺者たちは勇気を失って忍び去りました。<n><n>最も深刻な危機は、水平線上の島だと思ったものがまたしても錯覚にすぎないと分かったときに訪れました。まさにそうしたことが起きた10月10日、事態は頂点に達します。コロンブスは苦労して三日間の猶予を取り付けました。その後に乗員は（できれば船長抜きで）引き返したがっていました。しかし運命は別の意図を持っていました。実際、その三日のうちに陸地が見えたのです。その場にいた誰も、アジアではなく全く新しい未知の大陸にたどり着いたとは夢にも思わなかったでしょう。<n><n>日本も中国もまだ何千海里も先にあり、その航路に外国の大陸があったという信じがたい幸運がなければ、コロンブスの遠征は失敗に終わっていたでしょう。乗員の士気はすぐに持ち直しました。誰一人、反乱を考えたことなど一度もなかったかのように振る舞いました…"
"0xd4cd1020" = "コロンブスは確かに新しい陸地を発見しました（というより再発見で、中世にはすでにヴァイキングがアメリカの地を踏んでいました）が、誤ってインドへの海路を発見したと宣言しました。<n><n>四回の航海のうち二回目と三回目を準備するあいだ、ジェノヴァ出身の彼はフィレンツェのアメリゴ・ヴェスプッチと協力しました。西のこれらの土地は実は新しく未知の大陸に属すると最初に示したのは彼です。この目覚ましい認識が世間の関心を再び呼び起こし、新しい領土が話題になれば必ずヴェスプッチの名が挙がりました。<n><n>一方、コロンブスの声望は衰えました。その間にカリブ海の入植者たちの訴えで鎖につながれて本国へ送り返され、1506年に苦々しく病んだ末の死も、ふさわしい注目を集めませんでした。ですから一年後、南ドイツの地図製作者マルティン・ヴァルトゼーミュラーが、この未知の土地に名を提案する際に、人気のアメリゴ・ヴェスプッチの名に着想を得たのも不思議ではありません。<n><n>ヴァルトゼーミュラーの名は同僚たちに受け入れられました。「コロンビア」と名付けられていたら、もっと公平だったでしょう。"
"0xd4cd1021" = "スペイン統治下で最初に重要になったアメリカの地はイスパニョーラ島でした。コロンブスはすでに1493年にここに最初のヨーロッパ人入植地を築きましたが、彼がヨーロッパから戻る前に先住民によって滅ぼされていました。<n><n>その後、スペイン王室はこの島の支配を強めていきます。最初の修道院と大聖堂が建てられ、他の地域へ広がる社会制度がここで初めて整いました。階級で厳格に分かれた奴隷制社会で、カトリック教会と密接に結びついていました。<n><n>イスパニョーラは大きな可能性を秘めているように見え、海を渡って多くの進取の気性ある入植者を惹きつけました。<n><n>しかしスペインが目を他の地域へ向けるのに時間はかかりませんでした。大陸の大王国はすでに発見され征服されていたのです。そこでは統治も容易で、金銀の鉱床も豊かで採掘も簡単でした。<n><n>投げ捨てられた玩具のように、人々はイスパニョーラへの関心を失いました。オランダ・イングランド・フランスの海賊が交代で攻撃を仕掛けます。1697年、フランスが島の西部サン＝ドマング（現在のハイチ）を支配し、利益の出る農園経済を築きました。カカオ・砂糖・藍・綿花・コーヒーの生産により、サン＝ドマングは18世紀に新世界で最も利益を生む植民地となりました。<n><n>フランス革命を機に起きた、史上唯一成功した奴隷反乱は、やがて1804年のハイチ独立へとつながります。反乱者たちはかつての支配者を、自分たちがされたのとほとんど同じように扱いました。「独立宣言には、羊皮紙に白人の皮、インク壺にその頭蓋骨、インクにその血、ペンに銃剣が必要だ」と、黒人将軍ボワスロン＝トネールは当時宣言しました。"
"0xd4cd1022" = "カリブ海を代表する産物でありながら、人類への恩恵は疑問なのがラム酒です。サトウキビの糖蜜から作られるこの蒸留酒は、もともと「悪魔殺し」という色鮮やかな名を持ち、1650年にバルバドスで初めて言及されました。海賊の伝説的な飲み物として、多くの人はラム酒をジャマイカ島と結びつけます。史上最も恐れられた海賊の巣窟の一つです。<n><n>奴隷商人はアフリカ沿岸で買い付けた「人間の商品」を、カリブ海で大量の糖蜜と交換しました。その糖蜜はニューイングランドでラム酒に蒸留され、同じ船でアフリカへ運ばれます。酒はアフリカで売られ、空になった船には新たな奴隷が積まれました。この「三角貿易」によって、船主はどの航海でも船を満載にできたのです。"
"0xd4cd1023" = "キューバに次いで、ジャマイカはおそらくカリブ海で最も名高い島でしょう。その名はアラワク語の「シバマカ」に由来し、おおよそ「木と水の国」を意味します。9年前にこの島を発見していたコロンブス自身も、1503年に北岸沖で船が難破したとき、その景観の美しさと住民の親切を存分に味わう機会を得ました。<n><n>実際、彼はこの島がたいほど気に入り、スペイン王から島全体の所有権を移して自分のものと宣言しました。にもかかわらず、この楽園のような島はその後数十年ほとんど顧みられず、1655年にイギリスに奪われます。この時点でアラワク人はごくわずかしか残っていませんでした。彼らはヨーロッパ人が持ち込んだ病にとりわけ弱かったのです。<n><n>1661年、エドワード・ドイリーがジャマイカの総督兼総司令官に任じられました。その権威のもと、首都ポートロイヤルは活気に満ち、厳重に防備された海賊の避難所へと変貌します。「地上で最も豊かで最も腐敗した場所」と言われ、ふだんは普通の商人である住民の多くが、しばしば徒党を組んでスペイン海域へ私的な略奪に出かけました。当初、イギリス政府はこれを取り締まる気をほとんど見せませんでした。何しろバッカニアたちはスペインの競争相手を抑え込んでくれていたのです。<n><n>文化と秩序がジャマイカに戻ったのは、ヘンリー・モーガン卿が総督に就いてからでした（彼自身が元海賊だった点が重要です）。モーガンは海賊行為を容赦なく弾圧し、かつての仲間を絞首台へ送ることに何の躊躇も示しませんでした。<n><n>しかし、イギリスの権威が回復されるやいなや、サトウキビ栽培に加えて新たなもうかる収入源が見つかります。1672年以降、イギリス王立アフリカ会社が独占を確立すると、ポートロイヤルは世界最大の奴隷市場へと発展したのです。"
"0xd4cd1024" = "新世界に到着してわずか2週間後、コロンブスは西インド諸島最大の島、キューバに到達しました。ここにはシボネイ、グアナハタベイ、タイノといった部族が住んでいましたが、平和的な性質にもかかわらず、他の先住民部族と同じ不幸な運命をたどりました。1511年、スペインとの4年間の戦いの末に征服され、絶滅させられたのです。その結果、大量の黒人奴隷がここへ輸入されました。首都ハバナを持つこの島は七つの行政区（カビルド）に分かれ、それぞれが特別評議会へ代議員を送り、地域の利益を代表しました。<n><n>キューバ史で注目すべきは、1762年から1763年のイギリス支配という短い中断を除き、この島が比較的長くスペインの手にとどまったことです。植民地時代のキューバはスペイン帝国の最重要地域ではなく（たとえば鉱床はほとんどなく）、大陸へ向かう中継地として使われていたからかもしれません。いずれにせよ、19世紀の最初の四半世紀に南米・中米の大多数の国が独立を戦った一方で、スペインは1898年に島の支配権をアメリカへ譲るまでキューバを保持し続けました。"
"0xd4cd1025" = "今では当たり前になっている多くのものが、アメリカとの交易によって初めてヨーロッパへ届いたことは広く知られています。しかし文化の交流は逆方向にも働きました。<n><n>たとえば北アメリカの平原の典型的な先住民を思い描くとき、スペイン人とポルトガル人が来る前のアメリカに馬がいなかったとは想像しにくいでしょう。多くの先住民は初めて馬と騎手を見たとき、二つの生き物が一つに育った奇妙な獣だと思い、盲目的な恐怖で逃げ出しました。<n><n>ブラジルやグアテマラなどと結びつけられるコーヒーも、アメリカ原産ではなく、そこへ届く前にすでに三つの大陸を旅していました。アフリカ（おそらくエチオピア）からアラブ諸国を経て南西ヨーロッパへ。この植物がアメリカに初めてもたらされたのは18世紀、飲み物の人気が高まり栽培を増やす必要が生じたときでした。<n><n>ジャガイモによって、ヨーロッパ人はカリブ海で想像を絶する価値のある主食を見つけました。逆に小麦は、スペイン人とイングランド人が持ち込むまでアメリカにはありませんでした。それぞれ1520年にメキシコへ、1777年にバージニアへもたらされています。当初アメリカの気候は小麦に適さないと考えられていましたが、とりわけ北アメリカでこの作物は驚異的な成功を収めました。今日、小麦は世界で最も作付面積の大きい農作物です。"
"0xd4cd1026" = "チョコレートのない生活を想像できますか？できて当然です。アメリカ発見以前、カカオは世界の他の地域では知られていませんでした。カカオという語はおそらくマヤ語に由来し、そこまで遡れます。キリスト生誕の400年前には、マヤの商人がすでにカカオを飲んでいたのは確かでしょう。<n><n>14世紀から中央アメリカ大陸の支配勢力だったアステカ人は、カカオに宗教的な意味まで与えていました。この珍味に最初に触れたヨーロッパ人も、やはりコロンブスでした。ただしそれは1502年、ニカラグアへ向かった後の航海でのことです。<n><n>しかしカカオの正当な「発見者」は、アステカ王国を征服したエルナン・コルテスです。彼は「ショコアトル」という飲み物の作り方（これが「チョコレート」の語源です）をスペインへ持ち帰りました。当初はヨーロッパ人の口には苦すぎ、砂糖やバニラを加えるようになってから、ホットチョコレートはイベリア半島の上流階級に広まりました。<n><n>スペインはおよそ100年のあいだ作り方を独占し、その後ホットチョコレートはフランスからヨーロッパ各地へ広がりました。1700年ごろにはイギリス人が牛乳を加えます。コーヒーとカカオを混ぜると美味しいと分かって、ヨーロッパでのカカオの本格的な普及が完成したのです。"
"0xd4cd1027" = "海賊について語るとき、現実と伝説の区別がつきにくいこともありますが、女海賊が実在したことは疑いようがありません。その中でも特に華やかな二人が、18世紀初めにジャマイカ島でこの道に踏み出しました。<n><n>アン・ボニーはまだ子どもの頃に腹を刺されたと言われ、やがて船乗りと駆け落ちして海賊の巣窟ニュープロビデンス（ナッソー）へ渡りました。そこで夫を始末し、拿捕したオランダ船の上で自らの海賊稼業を始めます。<n><n>そこで出会ったのがメアリー・リードでした。彼女は男装してスペイン継承戦争を戦ったことがあり、相手を殺す前に胸をあらわして、女に負けたのだと示したと言われています。<n><n>1720年に捕らえられた二人は、妊娠していたため絞首台送りを免れました。男の仲間たちの多くより幸運で、アン・ボニーは彼らを軽蔑してやまなかったといいます。<n><n>絞首台へ向かう悪名高い「キャリコ・ジャック」に彼女が浴びせた言葉が残っています。「こんなところで会うのは残念だよ、ジャック。男らしく戦っていれば、犬のように吊るされることはなかったのに」。"
"0xd4cd1028" = "ウェールズ出身のバーソロミュー・ロバーツ（1682年？-1722年）は、最も重要な海賊の一人であるだけでなく、非常に変わった海賊でもありました。「ブラック・バート」とも呼ばれ（エドワード・ティーチこと「黒ひげ」とは別人物です）、37歳で遅まきながら海賊に転じましたが、犯罪への転身は疑いなく滑らかでした。1719年に同郷のハウエル・デイヴィスに襲われた彼の乗っていた船は、実は奴隷船だったのです。<n><n>ロバーツはデイヴィスと運命をともにすることにし、数週間後にデイヴィスが殺されると船長の役目を引き継ぎました。バーソロミュー・ロバーツは酒を避け、茶を好んだと言われています。<n><n>自らを悪魔の化身と見せたティーチと対照的に、ロバーツは身なりの良さを好み、賭け事を嫌い、部下に祈りを唱えるよう命じました。しかし、だからといってロバーツが心から敬虔だったわけではありません。数え切れない略奪のさなか、とりわけ捕虜に対して犯した残虐行為の話は数多く残っています。400隻を超える船を奪い、活動範囲はブラジルからニューファンドランド、西アフリカにまで及んだ彼は、ヘンリー・モーガンと並ぶ中央アメリカで最も成功した海賊でした。<n><n>1722年、ギニア沖のイギリス軍艦の砲声が彼の海賊稼業の終わりを告げ、七つの海から最大級の脅威の一つが消え去りました。"
"0xd4cd1090" = "17世紀で最も名高いバッカニアはウェールズ出身のヘンリー・モーガン（1635-1688）で、西インド諸島のスペイン植民地を悩ませ、この地域におけるイベリアの大国の権威を根底から揺るがしました。<n><n>彼の生涯は、イギリス・オランダ・フランスの政策の背後にある、いささか怪しげな道徳を示しています。他の大国に損害を与える限り、海賊行為には喜んで目をつぶったのです。<n><n>1668年にバッカニア船の指揮を任されたモーガンは、まず南米北岸で猛威を振るい始めました。2000人近い部下を率い、1670年8月に防備の厚いパナマの町を攻略し、帰路には戦利品の大半を持ち去りました。しかし、この攻撃がスペインとイングランドの和平条約調印後だったため、捕らえられてロンドンで裁判にかけられました。<n><n>モーガンは有罪になりませんでした。それどころか、まもなく外交の風向きが再び変わったのです。恩赦されただけでなく、騎士に叙されました。サー・ヘンリーとしてジャマイカの新総督に任じられ、厳しい法と秩序を敷き、裕福で尊敬される農園主として余生を過ごしました。"
"0xd4cd1091" = "バハマは17世紀半ばにわずかな期間、イングランドの宗教的異端者の避難所となりましたが、1670年からは正式に、利益を狙って国王チャールズ2世からこの島々の所有権を得たアルバマール伯爵ら紳士たちの支配下に入りました。<n><n>しかし約束に反し、彼らは秩序ある民政の確立に関心をほとんど示しませんでした。まったく逆でした。カリブ海の他の地と同じく、海賊の群れがバハマ、とりわけナッソーの町があるニュープロビデンス島に居着いたのです。<n><n>重い軍艦が入れない浅い入り江は、数百隻のスループや海賊バークにとって理想の停泊地でした。スペイン海域への頻繁な襲撃は報復を招き、初代総督ジョン・ウェントワースは島々に法と秩序を回復するという厄介な仕事を負いました。<n><n>状況が好転する気配がないため、イングランド王ジョージ1世はバハマを再び没収し、王室直轄植民地としました。元バッカニアで世界一周航海者のウッズ・ロジャーズが、1718年の半ばに初代王室総督に任じられました。<n><n>飴と鞭を使い分けて、彼はそれまでの混乱に終止符を打ちます。誓いを立てて海賊行為を捨てる者には広範な恩赦を約束しました。応じない者には、徹底的に武装した艦隊による罰が待っていました。<n><n>こうして正常な状態が戻ると、1729年にはこの島々に独自の議会が認められ、以後100年、侵略による多少の混乱を除けば、バハマの歴史は比較的平穏に過ぎました。"
"0xd4cd1092" = "スペインは新たに得た植民地のほとんどどこでも、出世の機会がほとんどない厳格な社会制度を敷きました。階層の最上位は、ヨーロッパ生まれの同国人たちです。<n><n>植民地生まれのスペイン人はクリオーリョと呼ばれました。階層上は二次的な存在とされたものの、国家・教会・軍の下級職の大半を占めていました。<n><n>ヨーロッパ系のスペイン人とクリオーリョが植民地のエリート層を成していたのです。白人（主に男性）と先住民の混血の子はメスティーソと呼ばれました。もともとこの土地の持ち主だった先住民は社会の最下層に置かれ、彼らがヨーロッパ人によって完全に絶滅させられた地域では、その「名誉」は黒人奴隷に与えられました。<n><n>こうした階層の人口比は、スペイン帝国の地域によって大きく異なりました。たとえばメキシコではメスティーソが人口の最大部分を占めました。多くの島では黒人奴隷が多数を占め（そして主人のなすがままにされ）、ジャングルや沼地、山岳地帯が安全な隠れ場所となった地域、たとえばボリビアやフロリダでは先住民の部族も生き延びました。"
