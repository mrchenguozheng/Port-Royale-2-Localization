"0xf64f1e5a" = "ご存じのとおり、我々は戦争中です。@n$TargetNation$の経済を弱めるため、交易船を@I$NumShips$隻拿捕するか沈めてください。この任務を受けますか？"
"0xf64f1e5b" = "我々は@n$TargetNation$と戦争中です。ですから、交易船を指定の数だけ沈めるか拿捕してほしいのです。奪ったものはすべてあなたのもの、私が望むのは@n$TargetNation$の経済を弱めることだけ。引き受けてもらえますか？"
"0xf64f1e5c" = "@n$TargetNation$との戦争で助けてもらえないでしょうか。あなたをある海域へ送り、そこの船を拿捕するか沈める任務を任せたいのです。"
"0xf651cc3f" = "オランダとイングランドは和平を結んだので、もう町を占領できません。<n><n>このシナリオではかなり進みましたが、オランダのために十分な数の町を占領する時間がありませんでした。<n><n>フリープレイでも同じように町を占領できます。ただし、まず占領したい町の国が軍事的に弱っていることを確かめてください。さらに、その町を占領したい国が軍事的に強く、二国が戦争中である必要があります。<n><n>補足：副王のために町を占領すると、通常は自分の町を建てられる土地がもらえます。ただしこのシナリオではその機能は無効です。"
"0xf65a5a04" = "これで、イングランドの船や町を攻撃して%1での名声を高められます。他の国での名声が下がることはありません。"
"0xf65b6f4c" = "本日、スペインのバッカニア%1がイングランドの軍事船団に遭遇し、討たれました。"
