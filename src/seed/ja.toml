"0xdfb9b5b7" = "見事です！これで@g$Gold$を手に入れました。<n><n>各国には町を守り、周辺海域を防衛する軍事船団があります。町が多い国ほど、十分に守るための軍事船団も多く必要です。<n><n>軍事船団を失うと、その国の軍事力は弱まります。戦争中、軍事船団は敵国の町や船団に対してかなり攻撃的なので、時折失われることがあります。そのためヨーロッパから定期的に船団が送られ、新世界の軍事力が補強されます。<n><n>国の強さは年代記の「国家」で確認できます。「弱い」と表示されている国の町は占領できます。<n><n>ではイングランドの軍事船団を十分に撃破し、イングランドの強さが「弱い」と評価されるようにしてください。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>イングランドの軍事船団を十分に撃破し、イングランドが「弱い」と評価されるようにしてください。"
