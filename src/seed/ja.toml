"0x2137ec23" = "感謝します。@D$Date$までワイン・道具・香辛料を高値で買い取ります。市場で私の使者に会い、それぞれ@a$Amount$ずつ届けてください。まとめてでないと受け取らず、その場で支払います。"
"0x2137ec24" = "いいですね。では敵国の町へ行って輸入品を買い集めてください。@D$Date$までにそれぞれ@a$Amount$を@T$TOWN$の市場にいる私の使者へ届ければ、通常の2倍以上を支払います。"
"0x2137ec25" = "何が一番か分かりますか？@n$Nation2$で輸入品を買い占めて不足を起こすのです。それぞれ@a$Amount$ずつ市場へ届けてください。使者が@D$Date$まで待ち、高値で買い取ります。"
"0x215e37a6" = "先ごろ、商人が自分の船が沈んだと話しているのを耳にしました。ただの古ぼけた船なので船自体は気にしていませんでしたが、特別な箱が積まれていたのです。"
"0x215e37a7" = "では合意ですね。最後に乗った航海で、船長が箱のことで理由もなく怒り出し、そのまま海へ捨ててしまったのです。"
"0x215e37a8" = "かつて親友だった男が、私の高価な箱を持ち逃げしました。"
"0x2167838b" = "船の購入"
"0x21743bf7" = "どうしても必要なのです！船が沈んだ正確な場所は分かりません。@l$ChestPos$ @D$EndDate$までに箱を持ってきてください。"
"0x21743bf8" = "@D$EndDate$までに品を手に入れてください。@l$ChestPos$"
"0x21743bf9" = "つい最近、その箱を海へ捨てたと手紙で知らせてきました。@l$ChestPos$私の品を取り戻してください！@D$EndDate$までここにいます。"
