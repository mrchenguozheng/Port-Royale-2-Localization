"0x04e000d9" = "船長%1が前任者に代わりました。"
"0x04e4fc22" = "町—倉庫取引"
"0x04e5002a" = "トルトゥーガで労働者のストライキが扇動されました。労働者が全員仕事を放棄してスト中です（それでも事業の費用はかかり続けます）。<n><n>あなたの任務は、労働者が普通なら生産する物資の在庫を十分に保ち、ストライキを失敗させて仕事に戻らせることです。<n><n>注意：この町は小麦・レンガ・綿花・砂糖・たばこを生産します。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>町で生産される物資の在庫を、@D$EndDate$までにそれぞれ@a$Amount$にしてください。"
