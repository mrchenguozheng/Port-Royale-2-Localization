"0xfe955798" = "町は鼠の大量発生に悩まされています"
"0xfe9663e8" = "現在の1日の生産量"
"0xfeab2fe1" = "よろしい。輸送船団は@D$DepartDate$に@T$TOWN$の港を出ます。ヨーロッパ方面へ先に出て、航路を確保してください。@n$HostileNation$の軍事船団に警戒を怠らないように。船団が攻撃を受けずに新世界の海域を出られれば、任務達成です。"
"0xfeab2fe2" = "深く感謝します。輸送船団が@D$DepartDate$に私の港を出ます。@n$HostileNation$の軍事船団から守り、無事にヨーロッパへ着くようにしてください。"
"0xfeab2fe3" = "あなたは行動の人ですね。まもなく輸送船団がここへ到着し、@D$DepartDate$にヨーロッパへ向けて出港します。先に出て航路を確保し、船団を攻撃から守ってください。"
"0xfeadceb1" = "体験版では、ゲーム開始時にすでに表示されていた町にしか入れません。<n><n>ただし、船団を町へ向かわせ、船団を選んだまま町を右クリックすれば、どの町とも取引できます。"
