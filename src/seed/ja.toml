"0x22fffe32" = "愛しい%1、<n>待ちきれません。早く市場へ行って結婚式の品を届けてください。すぐに披露宴を開けますように。"
"0x2310e7f4" = "次のシナリオ目標を表示するには、町を占領する任務を果たさねばなりません。"
