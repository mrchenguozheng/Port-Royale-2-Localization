"0xcdf0b227" = "何人かの商人が手を組み、我々の海域での保護強化を求めています。要求を強めるため、近いうちにある町への供給を止めることにしたそうです。私と市民のために、何とかしてもらえませんか？"
"0xcdf0b228" = "ある町では疫病が流行したという噂が広がり、週の初めから終わりまで商人がほとんど来なくなりました。物資を供給して噂を打ち消すのを手伝ってもらえませんか？"
"0xcdf0b229" = "ここ数週間、ある町に疫病の脅威が迫っています。さらに悪いことに、商人たちもその町を避けるようになりました。状況が良くなるまで町を支えてもらえませんか？"
"0xcdf0b22a" = "数日前、ある町で市民が疫病で亡くなりました。隠そうとしましたが、残念ながら噂は広まってしまいました。今では多くの商人がその町に寄港しないと決めています。あなたは立派な交易船団をお持ちです。しばらくのあいだ町に物資を供給してもらえませんか？"
