"0xfd26feb4" = "@N$Name$は遅すぎることに怒って海に飛び込みました。"
"0xfd2f55fd" = "ゲーム内の日付"
"0xfd40a541" = "<n><f:fonts/Tiepolo_black14x14aaFHk.res>損失<t><gs:TEXTFLUSS_KEINEHOEHE><g:Intext_Fass_800x600.screen>%1<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_KANONE_800x600.screen>%2<t><gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_MANN_800x600.screen>%3<n>（約%4）"
"0xfd4ed860" = "部隊が町門を破り、司令官を人質に取りました。町の兵士たちはそれを見て降伏します。<n><n>次にどうしますか？"
"0xfd518241" = "%1の総督の町"
"0xfd638295" = "ゲームを読み込み中…"
"0xfd6477c9" = "船団の火力を少なくとも90門まで上げてください。"
"0xfd69d24a" = "%1:%2:%3"
"0xfd6d4abb" = "シナリオを成功裏に完了できなくなる行動を取りました。<n><n>イベントウィンドウの指示に従ってください。"
"0xfd9349ac" = "没収"
"0xfda0635d" = "<ts:0><ts:110><f:fonts/Tiepolo_black14x14aaFHk.res>LMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>舷側砲を撃つ<n><f:fonts/Tiepolo_black14x14aaFHk.res>RMB<f:fonts/Tiepolo_bold14x14aaFH.res><t>進路を定める<n><f:fonts/Tiepolo_black14x14aaFHk.res>1,2,3<f:fonts/Tiepolo_bold14x14aaFH.res><t>弾薬を選ぶ<n><f:fonts/Tiepolo_black14x14aaFHk.res>4<f:fonts/Tiepolo_bold14x14aaFH.res><t>接舷の準備<n><f:fonts/Tiepolo_black14x14aaFHk.res>%1<f:fonts/Tiepolo_bold14x14aaFH.res><t>大砲を撃つ"
"0xfda277f4" = "%1は満杯で、倉庫を建てる場所がもうありません。それでもこの町に足がかりを得たいなら、地元の商人を説得して事業の一つを取り壊させられます。<n><n>生産した物資の値段が長期間低いまま、つまり物資が余っていると、事業は取り壊されます。そのためにはまず製品を買い占め、次に町の市場で十分な量を売って値段を下げます。<n><n>生産物は1日1回町の市場へ届けられます。値段が最低になっていれば、事業は労働者を減らします。事業をクリックすれば確認できます。労働者が30人余剰になると、その事業は取り壊されます。"
"0xfda5ded4" = "金鉱の発見で町は繁栄しています"
"0xfdaf6463" = "あらためて感謝します。あなたはわが国のために多くのことをしてくれました。褒美として、あなたの町%1に残りの土地を追加で与えましょう。これで地区全体を所有することになります。"
"0xfdb7f907" = "焚き火の明かりで、岸から遠くない師匠の隠れ家が見つかりました。船長は小舟で岸へ漕ぎ寄せ、老人に迎えられます。老人はワインの量を見て、うれしそうに手をこすりました。"
"0xfdb7f908" = "岸から遠くないところで、船団は小さな隠者の野営地を見つけました。船長は小舟で岸へ漕ぎ寄せ、自分より古びた船長服を着た老人に会います。老人はラム酒の樽に気づいて大喜びです。"
"0xfdb7f909" = "しばらくして、船団は陸に隠れ家を見つけました。船長は小舟で岸へ上がって見回り、ついに老師匠を見つけて、来た理由を説明します。隠者は食料を受け取ります。"
"0xfdc606cf" = "海賊狩り"
"0xfdcdfd58" = "彼は若い船長に商売のこつを喜んで教えてくれます。"
"0xfdcdfd59" = "そこで彼は、戦いに勝つために知るかぎりのことを若い船長に教えます。"
"0xfdcdfd5a" = "彼は船長に航海術を喜んで教えてくれます。"
