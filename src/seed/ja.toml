"0xd92d797c" = "他国の商人がかなりの数の労働者を引き抜きました。その労働者たちは家族とともに入植者として町を去りました。<n><n>あなたの任務は、@D$EndDate$までに町のすべての事業に労働者がそろうだけの入植者を見つけることです。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>市民数（住民から兵士を引いた数）を@D$EndDate$までに@I$Pop$まで戻す必要があります。"
