"0x070c60f9" = "感謝します。@G$Goods$を@a$Amount$持ってきてください。市場への納品期限は@D$Date$です。そこで1<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>につき@g$GoldPerBarrel$を受け取れます。"
