"0xf52fee2f" = "海賊、バッカニア、敵国の軍事船団と戦いましょう。<n><n>バッカニアとして交易船団を追う腕試しも。<n><n>伝説のスペイン宝船団を探しに出ましょう。<n><n>16種類の船を指揮できます。"
