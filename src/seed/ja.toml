"0xcc2c64fb" = "黒ひげの海賊船団を1つ追跡して撃破する任務が与えられました。<n><n>黒ひげには秘密の隠れ家があり、そこに船団をいくつも置いています。どれも完全武装の船5隻で構成されています。今のあなたの船団では難しい任務でしょう。<n><n>ですから、まず船団の火力を上げてください。大きな船を買う資金を作るには、@T$TOWN$の倉庫の物資をできるだけ良い値で売りましょう。@T$TOWN$の北と東で物資を高く売れる場所は、イベントウィンドウのヒントにあります。<n><n>ただし時間をかけすぎないでください。後に総督の任務も果たさねばなりません！<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@T$TOWN$の倉庫の物資を売り、現金を@g$GoldGoal$まで増やしてください。"
