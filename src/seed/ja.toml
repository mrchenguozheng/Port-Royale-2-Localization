"0xcb2b0709" = "なんという災難だ！今日@F$WifeName$に会いましたか？手間を省いてもいい、彼女はもういません。ほら、別れの手紙のようなものを見つけました。退屈な生活に愛想が尽きた、冒険者と駆け落ちしたと書いてあります。私の愛する娘を救ってください！"
"0xcb2b070a" = "災難が降りかかり、どうやらあなたもその渦中にいるようだ。娘が海賊にさらわれたが、誰かが地図付きの伝言を残している。罠に見えるが、どうすればいい？娘を救わねばならない！"
"0xcb2b070b" = "はっ！私の娘、つまりあなたの妻は、町の警備隊の将校と駆け落ちした！そうだろうと思った！今は二人とも行方不明で、私の船を一隻盗んでいる！娘を私のもとへ連れ戻し、よく言い聞かせてくれ！奇妙なことに、娘の部屋で場所の記された地図を見つけた。"
