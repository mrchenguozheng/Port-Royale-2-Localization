"0x05478cea" = "娘から、あなたが来るともう聞いていました。あの子は時々とても衝動的なんですよ。しかし娘の望みを阻むわけにはいきませんし、あなたこそ彼女にふさわしい男性だと本当に思っています。ですからお尋ねします。%1を妻に迎えますか？"
"0x05633055" = "自分の建物"
"0x05716a06" = "次の戦いは少し難しくなります。今度は敵が抵抗するからです。あなたの任務は、総督のために海賊を追って討ち取ることです。<n><n>ただしその前に、戦いのために船団を武装させねばなりません。船を買って船団に加え、新しい武器と船員を積み込んでください。<n><n>海戦中いつでもF1を押すと、キーボードとマウスの設定が表示されます。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>船団を武装させ、カルタヘナの総督から与えられた新しい任務を果たしてください。"
"0x058ca789" = "@T$TOWN$の総督を訪ね、任務を受諾してください。"
"0x05980d2c" = "難易度は物資の価格と、海戦で受ける損害を左右します。<n><n>さらに難易度が低いと、建築許可を買う前に町でそこまで良い交易実績を残さなくてもよくなります。"
"0x05ae35b1" = "上出来です！ではポートロワイヤルのスペイン副王を訪ね、フランスの町を1つ占領する任務を受けてください。<n><n>通常は町を2つ占領しないと副王から土地をもらえませんが、このシナリオでは少しボーナスがあり、スペインのために1つ占領するだけで済みます。<n><n>どの町を占領するかはあなた次第です。港の大砲ができるだけ少ない町を選ぶのがよいでしょう。今の狙い目として理想的なフランスの町が@T$SampleTown$です。<n><n>町を占領した見返りに、副王は土地の区画を与えます。注意：少なくとも水夫長の階級がないと副王と話せません。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>ポートロワイヤルのスペイン副王を訪ね、町を占領する任務を受けてください。任務を果たしたら、彼の贈る土地の区画を受け取れます。"
