"0x3353aa4c" = "見事です！ではオランダのためにイングランドの町をもっと占領しましょう。ただし、占領できるのはオランダとイングランドが戦争中の間だけなので、ぐずぐずはできません。<n><n>いつものように、こうした任務を出せるのはグランドバハマの副王だけです。次の町占領任務を受ける前に、二国の軍事力の強弱に働きかける必要があるかもしれません。その方法はもう知っていますね。<n><n>援護として、テルクス諸島の総督が大型帆船をさらに3隻用意しました。<n><n>港には船員も武器も多くあります。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>オランダとイングランドの戦争が終わるまでに、オランダ副王のために町を占領する任務をあと2つ果たしてください。期限は@D$EndDate$です。それでシナリオは終了します。"
