"0xfc9a5f7d" = "お取引できて光栄でした。ごきげんよう！"
"0xfc9a5f7e" = "物資を倉庫へ送りました。ごきげんよう！"
"0xfc9a5f7f" = "物資を船団に積み込みました。では、%1。"
"0xfc9cf623" = "完了"
"0xfca882e8" = "ご存じのとおり、スペインの宝船団は植民地から宝物を集めてヨーロッパへ送る際、いつも違う航路を取ります。各町に短時間しか滞在しないことで待ち伏せを避けています。ところが今回はスペインが大きな失策を犯し、今この瞬間の宝船団の航路を我々に知られてしまいました。命令はいたって簡単です。一隻残らず沈めなさい！"
"0xfca882e9" = "我々はスペインと戦争中で、スペインの宝船団がヨーロッパへ到達しないようにせねばなりません。幸い、船団が次に寄港する町が分かりました。その町で船団に妨害工作をして、港での滞在を長引かせます。そうすれば船団を迎撃し、ヨーロッパへ行かせない時間ができるはずです。この任務を受けますか？"
"0xfca882ea" = "こんな機会は毎日あるものではありません！今日、情報屋の一人がスペイン宝船団の現在の航路を教えてくれました。それだけではありません。船団は次に寄港する町で、いつもより長く停泊するそうです。スペインと戦争中ですから、副王を喜ばせるためにも、宝船団をヨーロッパの目的地へ着かせないようにしましょう。わが国のために船団を迎撃してくれますか？"
"0xfcc82d44" = "サーベル兵"
"0xfcd6fdec" = "まだ前の任務を果たしていないようですね。これを片付けてください。次の仕事もあります。"
"0xfcded04c" = "IDM_CONTEST_01_2004_LOG_01_TEXT"
"0xfce1cfd1" = "あいにく今はあなたの出番がありません。<n>町を占領する任務は、敵国が弱っていて、こちらの町を守る軍事船団が十分にあるときにしか任せられません。"
"0xfce38f12" = "町の司令官"
