"0xfc64ab0e" = "これで、フランスの船や町を攻撃して%1での名声を高められます。他の国での名声が下がることはありません。"
"0xfc692ef1" = "<n><n>ただし、船団のうち少なくとも1隻が戦いを生き延びれば、船長も助かります。"
"0xfc71eb4b" = "なんという不運でしょう。@n$FoeNation$との戦争が始まってから、輸送船団に回す植民地物資を十分に集められません。@G$Goods$を大量に届けて助けてもらえませんか？"
"0xfc71eb4c" = "@n$FoeNation$と戦争になってから、相手の商人はわが国の町へ@G$Goods$を届けることを禁じられています。おかげで物資がひどく不足しています。あなたは船を多く持ち、海をよく知っています。@G$Goods$を大量に確保してもらえませんか？"
"0xfc72151e" = "倉庫—船団への移譲"
"0xfc7ddb7d" = "%1・%2"
"0xfc8dd1be" = "大砲別"
