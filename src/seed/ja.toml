"0x28b1f98d" = "%1 %2また%3で建物を建て事業を興す許可を持ち、町にはすでに倉庫があります。<n><n>若く経験が浅いため、階級は甲板見習いにとどまっています。ですからまだ多くの船団を指揮したり、他の町で建築許可を追加で買ったりはできません。<n><n>階級は総資産で決まり、現金と財産を合わせて現在およそ%4です。資産が%5に達ししだい、次の階級になります。<n><n><n>幸運を祈ります！"
