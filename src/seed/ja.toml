"0x21c2f2cf" = "<n><o:0xffC00000>任務未達成。<o:0xff000000>"
"0x21cae149" = "上出来です！次は、いくつもの軍事船団と渡り合えるよう船団を強化してください。船団にはフリゲート以上の船を少なくとも3隻そろえるべきです。<n><n>船は拿捕するか、総督の町の造船所で買い求めてください。<n><n>その船を護衛船にし、完全武装・満員の船員を載せてください。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>フリゲート以上の船で、完全武装・満員の護衛船を少なくとも3隻そろえてください。"
"0x21d142f5" = "この町で船団を修理"
"0x21e727b4" = "海賊@P$PirateName$の噂はもう耳にしているでしょう。すでに船団を@I$NumConvoys$つ持ち、隠れ家はまだ見つかっていません。幸い、船団の一つの行方は分かっています。彼も近くにいるかもしれません。その船団を撃破してください。"
"0x21e727b5" = "急ぎましょう。海賊@P$PirateName$の船団の一つの行方が分かったのです。見つけて撃破してください。"
"0x21e727b6" = "どの海賊にも隠れ家があり、そこから船団を出して獲物を奪っています。海賊@P$PirateName$は今や船団を@I$NumConvoys$つも抱えています。偶然、この一味の重要な船長とその船団の最近の行方が分かりました。その船団を見つけて撃破してください。"
