"0x077030da" = "おめでとうございます！このシナリオを達成し、海戦と港への攻撃を少し経験しました。<n><n>他の船団を攻める前に、護衛船が十分に武装しているか必ず確かめてください。もちろん、どの船団を攻めるかもよく考えるべきです。ヨーロッパからの輸送船団や軍事船団はいつも非常に強力で、海賊もしばしば手強い相手になります。<n><n>ある国の総督から私掠免許状を受け取らずに商人を攻撃すると、すべての国でのあなたの名声に大きく響きます。最悪の場合、強力な軍事船団があなたの船団を追ってきます。<n><n>忠告です。交易船団を拿捕しても船を沈めず、積荷だけを奪えば、名声への悪影響はずっと小さくなります。"
