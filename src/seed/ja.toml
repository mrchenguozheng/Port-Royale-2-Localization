"0x0480889c" = "<g:INTEXT_TREIBGUT_800x600.screen><n>漂流者が話していた場所で、大量の物資の隠し場所を見つけました。<n>あいにく船団に空きがもうないので、今は物資を置いていくしかありません。"
"0x04825ba0" = "船団は修理のため造船所にあるので出航できません。修理が終わるまで待ってください。"
"0x04b51123" = "申し訳ありませんが、もうこの任務は任せられません。考えるのに時間がかかりすぎました。"
