"0xd44a911d" = "おめでとうございます！これで物資の生産を少し体験しました。また、他の物資の取引で事業を維持しながら、生産した物資を利益が出る値段で売るのがいつも簡単ではないことにも気づいたでしょう。<n><n>後のシナリオやフリープレイで事業を興すなら、生産した物資を必ず利益の出る値段で売れるようにしてください。生産は費用がかかり、原材料をそろえるのもいつも簡単ではありません。<n><n>ですから、まず交易で資金を貯めてから、少しずつ生産を始めるのがよいのです。"
