"0x07246168" = "修理"
"0x072a9579" = "輸入品を届けてくれて本当に感謝しています。新世界の我々には、もう何週間も自国の輸送船団が来ていないのです。褒美として、オランダの交易フリュート船を2隻渡します。港であなたを待っています。"
"0x0744a699" = "宝船団があと何の町を訪れるかは分かりません。確かなのは、町を訪れるたびに船団がより多くの金を積み込むことだけです。いつ攻めてもかまいません。金はあなたのものにできますから。私が望むのは、宝船団を消えさせることだけです。最後に確認されたのは@T$StartTown$で、次に寄港するのは@T$DestTown$、そこではおよそ5日間停泊します。"
"0x0744a69a" = "ですから急いでください。最後に確認されたのは@T$StartTown$で、そこから@T$DestTown$へ向けて出航し、そこではいつもより長く停泊します。攻撃を遅らせるほど、船団の積む金は増えます。全部あなたのものにしてかまいませんが、宝船団は決してヨーロッパへ着かせてはなりません。"
"0x0744a69b" = "では決まりですね、感謝します。私の情報が正しければ、宝船団は先ごろ@T$StartTown$を出て@T$DestTown$へ向かっています。そこではいつもより長く停泊するでしょう。では急いで迎撃してください！"
"0x0746253d" = "できるだけ多くの商人に自分の町へ来てほしいなら、特定の物資をあえて町に供給しないのがよいでしょう。近くの町で生産される物資を選ぶのが理想的です。商人は移動距離も考慮するからです。<n><n>自分の町を訪れた商人は、町に豊富にあり値段の安い物資を自動的に買います。自分で生産した物資を町に直接売ることもできます。他の町より高くなければ、商人が定期的に買っていきます。<n><n>そうすれば市民に必要な物資が常に足り、他の町へ運ぶ手間も考えずに済みます。"
