"0xdca0a525" = "売却"
"0xdcba5843" = "会えてうれしいです、@A$USER$。助けが必要なのです。私はかつて海賊@P$PirateName$の下で働いていました。しかし目を覚まし、@T$TargetTown$の総督と取引したのです。あいにく昔の仲間がそれを知り、私の首に賞金をかけました。私を@T$TargetTown$まで連れて行ってもらえませんか？"
"0xdcba5844" = "あなたは信頼できると聞きました、@A$USER$。私は@T$TargetTown$の総督に仕えており、極秘情報を伝えるため至急会わねばなりません。あいにく、ある者たちが私を@T$TargetTown$へ行かせまいとしています。そこでお尋ねしますが、安全な航路を提供してもらえませんか？"
"0xdcba5845" = "ああ、災難が続いています。数週間前、悪名高い海賊@P$PirateName$の船に出くわしました。しかしその船の船長はとても未熟だったらしく、ほとんど苦もなく沈められました。<n>ところが、その不運な船長は海賊@P$PirateName$の可愛がっていた甥だったのです。彼は私の名を聞いてからずっと私を追っています。乗員たちは私の船を奪って恐怖で逃げ出し、私はここで足止めです。<n>故郷の@T$TargetTown$まで行けるよう助けてもらえませんか？"
