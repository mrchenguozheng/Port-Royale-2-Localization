"0x0f1ade15" = "では町に仕事を作り、住宅地区を建ててください。<n><n>入植者は働き口があるときにしか町に残らないので、まず生産施設を4つ建てましょう。どんな生産施設を建てるか決めてください。ただし生産費は高く、物資を売った利益に頼るのですから、他の町で利益を出して売れる物資だけを生産するように。<n><n>生産施設4つで労働者120人分の仕事ができます。労働者はそれぞれ4人家族なので、市民480人分、つまり住宅地区4つ分の住まいが必要です。<n><n>生産施設と住宅地区ができたら、他の町から自分の町へ入植者を連れてきましょう。入植者は普通、総督の町で仕事を待っています。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>自分の町の人口を480人まで増やしてください。"
