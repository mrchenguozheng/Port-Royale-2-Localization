"0x24901249" = "%2人中%1人の船員が冒険に加わりたがっています。"
"0x24a0f898" = "造船所"
"0x24b0fd83" = "機能"
"0x24c12812" = "おめでとうございます！町を占領する任務を任されました！<n><n>町は非常に厳重に防備されていることがあるので、港の砲塔ができるだけ少ないイングランドの町を選びましょう。@T$SampleTown$は絶好の標的です。<n><n>町を攻めるには、船団の「町を攻撃」を有効にします。船団を選び、「攻撃モード」ボタンを押してください。<n><n>町は海からも陸からも攻撃できます。ただし陸から攻めるのは、船員が町の兵士より多い場合だけにすべきです。その場合は船員の半分にカットラス、半分にマスケット銃を持たせられねばなりません。<n><n>注意：町の港に軍事船団がいる場合、町そのものを攻める前にその船団を破る必要があります。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>町を占領する任務を果たしてください。"
"0x24e18ac4" = "<f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x24ec3366" = "見事です！船団は武装し、黒ひげの海賊船団を追う準備ができました。<n><n>イベントウィンドウには、海賊船団の居場所が海上にある場合、見つけるためのヒントが毎日表示されます。海賊は交易船を襲うと必ず隠れ家へ戻るので、見つけるのは難しいことがあります。<n><n>海賊船団は最大5隻の軍艦を擁しうることを忘れずに。力不足なら船団を強化してください。金貨の入手方法はもう知っていますね。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@T$TOWN$の総督から与えられた任務を果たしてください。"
"0x250c7a12" = "@D$Date$までに@a$Amount$を届けてください。市場で品を渡せば、@G$Goods$ 1 <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>につき@g$GoldPerBarrel$がすぐに支払われます。"
"0x250c7a13" = "うれしく思います。@a$Amount$を市場へ届けてください。@D$Date$まで、1 <gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>につき@g$GoldPerBarrel$を受け取れます。"
"0x250c7a14" = "市場で私の使者に会ってください。@D$Date$までに@G$Goods$を@a$Amount$渡せば、良い値段を提示します。"
"0x2540ea42" = "追加テキスト（年代記作者）"
"0x2546beb9" = "なるほど、@N$OwnerName$があなたを寄こしたのですか？ええ、その老船長は知っています。あなたの乗員に一、二つ教えられるでしょう。でも、なぜ私が助けねばならないのです？とはいえ意地悪はしたくない。私を探すのに時間をかけたのでしょう。小さな頼みを聞いてくれたら、その船長が隠居している場所を教えましょう。"
"0x2546beba" = "@N$OwnerName$は知りませんが、@N$TeacherName$がどこにいるかは確かに知っています。気が向けば教えてもいい。こちらを助けてくれれば、こちらも助けますよ。"
