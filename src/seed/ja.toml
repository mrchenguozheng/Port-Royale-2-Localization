"0x0ce1a79e" = "ここは植民地の町サンタマルタです。町の名前をクリックすると町の情報が出ます。"
"0x0ce1a79f" = "サンタマルタのような植民地の町は、必需物資を2種、原材料を2種、植民地物資を1種生産できます。<n>前のシナリオで、総督の町では原材料と植民地物資の需要が特に高いことを学びました。<n>まずは植民地物資であるカカオを生産しましょう。<n>では町の情報を閉じてください。"
"0x0ce1a7a0" = "植民地物資は総督の町からヨーロッパへ送られるため、これらの町ではカカオの需要が高いのです。この条件は最初の事業に向いています。では町の中心にある親方建築士の建物を探してクリックしてください。"
"0x0ce1a7a1" = "親方建築士のところでは、新しい建物の建築許可を申請したり、建築許可を返却したりできます。もちろん今やりたいのはそちらではありません！<n>建てられる建物を見てください。親方建築士ウィンドウ右側のボタンも使えます。<n>「カカオ農園」ボタンをクリックしてください。"
"0x0ce1a7a2" = "必要な建材の数と建設費が分かります。<n>また、倉庫に今ある建材の数と、町から買い足す必要のある数も分かります。<n>今は建材が足りています。<n>空いている建設用地にカーソルを合わせ、左クリックしてください。"
"0x0ce1a7a3" = "カカオ生産施設の足場が表示され、建設が始まりました。<n>完成までに数日かかります。その間に新しい労働者の住まいを用意しましょう。<n>建設メニューを閉じ、サンタマルタの住宅地区を探してください。"
"0x0ce1a7a4" = "この住宅地区は町の商人のものです。地元の商人がいくつの住宅地区を持ち、入居者が何人いるかを確認できます。あなたは自分の住宅地区を建てたいのです。そのために建設メニューを開いてください。"
"0x0ce1a7a5" = "建設メニューで住宅地区を選び、建設費の表示を見てください。<n>倉庫に建材が足りないかもしれません。ただし、町に十分な供給があれば必要な建材を買えます。<n>なければ別の町で調達せねばなりません。<n>では住宅地区を建ててください。"
"0x0ce1a7a6" = "事業1つにつき労働者30人を雇えます。平均的な労働者の家庭は4人家族なので、事業1つにつき120人分の住まいが必要です。<n>住宅地区1つは入居者120人分なので、事業1つにつき住宅地区1つが必要になります。<n>では建設メニューを閉じ、新しい住宅地区をクリックしてください。"
"0x0ce1a7a7" = "住宅地区には建設期間がありません。入居者は最初テントに住むからです。<n>やがて入居者自身が住宅地区を立派な建物へと発展させていきます。<n>住宅地区の見た目は、築年数と町の状態によって変わります。<n>住宅地区のダイアログを閉じてください。"
"0x0ce1a80f" = "ご存じのとおり、町で最初に建てるものは必ず倉庫です。それを建てるまで他の建物は建てられません。<n>ゲームを開始した町にはすでに倉庫があります。探してクリックしてください。画面上では水色で表示されています。"
"0x0ce1a810" = "倉庫では、町で所有している建物とその維持費が分かります。<n>入居者が払う家賃や、事業が生産している物資も確認できます。<n>後には倉庫番に指示も出せるようになります。<n>倉庫を見て回ってから閉じてください。"
"0x0cee08cc" = "この町の軍事力はもう少し欲しいところです"
"0x0cf75014" = "閉じる"
"0x0cf7abef" = "自分のカカオ農園をクリックしてください。表示には常に、町にある自分のカカオ農園すべてが出ます。<n>生産施設が建つと、労働者が30人、つまり入植者30人が必要になります。では農園を出て、港の船着場へ行き、「積荷」ボタン（右側の一番下）を押してください。"
"0x0cf7abf0" = "ここでは、町に雇い待ちの入植者がいるか、町が新しい労働者を必要としているかが分かります。事業の建設が終わると、そうなります。<n>周辺の総督の町へ行き、事業に労働者がそろうまで入植者をサンタマルタへ運んでください。"
"0x0d0db040" = "自分のカカオ農園の1つをクリックしてください。"
"0x0d0db041" = "自分の事業が1日にどれだけカカオを生産し、そのために道具がどれだけ要るかが分かります。<n>倉庫は事業に物資を供給するので、倉庫に道具を@a$SubGoal$ためてください。"
"0x0d0db042" = "道具は輸入品です。つまり総督の町で最も豊富に、最も安く手に入ります。<n>南西のカルタヘナか、ずっと東のマルガリータで調達してみるとよいでしょう。"
"0x0d0db043" = "よくやりました！<n>必要な原材料の平均価格が低いほど、生産する物資の生産費も低くなります。<n>では倉庫に@a$AmountGoal$たまるまでカカオを生産し続けてください。"
"0x0d0f1795" = "7月"
"0x0d0f1877" = "6月"
"0x0d1098bd" = "%1、<n>あなたはこのあたりでは新顔ですよね？もう噂は聞いていますし、良い評判が先に立っています。時々私を訪ねてきてください。仕事はいつでもあるのですから。"
"0x0d23b491" = "船団でカルタヘナの町へ航海し、町に入ってください。<n>画面右の町の名前の下に、小さな丸い記号が出ています。これはこれまでのカルタヘナでの交易実績を示しています。<n>このシナリオではボーナスがあるので、少し楽になっています。<n>では町の情報を開いてください。"
"0x0d23b492" = "「交易実績」では、必要な到達度のうち何パーセントを達成したかが分かります。ここに100%と出れば、親方建築士に許可を申請できます。<n>町の情報を閉じてください。"
"0x0d23b493" = "町で不足している物資の価格は、取引ウィンドウで赤く表示されます。こうした物資を売れば、その町での交易実績と、その町が属する国での名声の両方が上がります。<n>船着場を一度クリックして、町の物資在庫の情報を表示してください。"
"0x0d23b494" = "町で足りない物資に注目してください。たとえばこの町はラム酒と衣類を生産するので、砂糖と綿花は常に必要です。<n>ただし町には他にも不足している物資があります。<n>他の町へ行ってカルタヘナが必要とする物資を買い、交易実績を上げてください。"
"0x0d23b495" = "悪くありません！カルタヘナでのあなたの評価はかなり上がりました。<n>ただしカルタヘナで不足している物資を買い占めないよう気をつけてください！不足している物資は在庫が赤く表示されるので、すぐに見分けられます。<n>交易実績の到達度を85%まで上げてください。"
"0x0d23b496" = "よくやりました！カルタヘナでの評価は85%です。この調子で続けてください！<n>評価を100%まで上げましょう。<n>ところで、「昇進と階級」についてのメッセージが届いています。"
"0x0d23b497" = "見事です！これでカルタヘナとの交易は十分です。<n>あいにく階級はまだ普通の船員なので、許可は1枚しか与えられません。<n>次の階級に上がるには、もう少し交易して財産を増やしてください。"
"0x0d23b498" = "上出来です！船員の階級なら、建築許可を2枚まで得られます。<n>カルタヘナの親方建築士へ行き、許可を申請してください。<n>金貨が足りないなら、もう少し交易してください。サンタマルタで生産している物資の交易も忘れずに。"
"0x0d2a3b89" = "船の維持費"
"0x0d39b8e2" = "他の建物を建てる前に、まずカルタヘナに倉庫を建てねばなりません。"
"0x0d39b8e3" = "では織物工場を2つ建て、住宅地区も2つ建ててください。<n>町に建材が足りなければ、他の町で買い、港の倉庫へ届けねばなりません。<n>大事な金貨を手放す前に、値段交渉を忘れずに！"
"0x0d39b8e4" = "織物工場が建つまでに、倉庫に綿花を@a$SubGoal$用意しておいてください。そうすれば新しい事業がすぐに綿花から布を織り始められます。"
"0x0d39b8e5" = "次の目標は、カルタヘナの倉庫用に布を@a$SubGoal$自前で生産し、織物工場の完成を待つことです。<n>布を@a$SubGoal$作るには、綿花がちょうど@a$SubGoal$必要です。"
"0x0d43f73c" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>軍用<t>あなたの護衛船と交易船<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d448ce5" = "<f:fonts/Tiepolo_black14x14aaFHk.res><t>海賊<t>あなたの護衛船と交易船<n><f:fonts/Tiepolo_bold14x14aaFH.res>"
"0x0d48f0cd" = "セーブデータが無効です！"
