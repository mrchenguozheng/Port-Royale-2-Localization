"0x234d00d9" = "本日、海賊%1がカリブ海で猛威を振るい始めました。"
"0x23652698" = "あいにく確かなことは言えません。港の責任者が、彼らが奪ったかもしれない船の漠然とした特徴を教えてくれました。商人が海上でその船を見かけ、場所を示してくれました。@l$Pos$この一帯を捜せば手がかりが見つかるかもしれません。"
"0x23652699" = "位置は@l$Pos$です。この一帯を捜せば手がかりが見つかるかもしれません。娘を無事に連れ戻してください。"
"0x2365269a" = "位置は@l$Pos$です。この一帯を捜してください。@F$WifeName$がその名を口にしたのは何かを伝えようとしていたのかもしれません。娘を無事に連れ戻してください。あのカサノバに会ったら、よろしく伝えてください。"
