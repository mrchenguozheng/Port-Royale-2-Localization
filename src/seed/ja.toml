"0xe3922641" = "この羅針盤の針はとても滑らかに動き、すぐに位置を定めます。これほど正確な羅針盤は見たことがありません。<n>宝石細工のように作られ、裏面にはさまざまな刻印が施されています。"
"0xe3922642" = "この一対のコンパスは手に美しく収まり、とても使いやすいものです。全体が金でできているようで、精巧な文様が施されています。"
"0xe3922643" = "この六分儀は荒れた海でも正確な方位を示します。一部がばねで支えられており、強い振動を和らげるのに役立っています。"
"0xe3922644" = "これは両眼で同時に遠くを見られる双眼望遠鏡です。色付きのガラスをレンズの上にスライドさせて目を保護できます。側面には神秘的な刻印が見て取れます。"
"0xe3922645" = "ごく普通の金時計ですが、これまで見たどれよりも小さいものです。文字盤の裏の円盤には、ゆっくり回っているように見える月が描かれています。時計の裏にもいくつか刻印があります。"
"0xe3922646" = "このランプは普通のカンテラに似ています。しかし燃える芯の周りに多くの鏡が並べられ、光は一方向だけに射します。開口部に扇のような装置を使うと、放つ光を素早く点滅させられます。"
"0xe3922647" = "前後に滑る物差しが別の物差しに組み込まれています。そこには透明な素材の滑る金具が付いています。この道具で簡単な計算を素早く行えます。"
"0xe3922648" = "この奇妙な道具は矢のような形をしています。羽根に当たる水の流れで回転し、小さな目盛盤が回転数を数えるので、船の速さをとても正確に計算できます。"
"0xe3922649" = "この計器は回転する羽根と、その回転速度を示す目盛盤からなります。羽根を風にかざすと、風向きと風速を読み取れます。丁寧に作られており、未知の記号が刻まれています。"
"0xe392264a" = "このロープはしばらく海水にさらされていたはずですが、できたばかりのように見えます。手触りは驚くほど滑らかで、とても丈夫な結び目を作れます。"
"0xe39226b2" = "この帳面には美しい星図が数多く収められています。大きな表が、それぞれの星がいつどこで昇り沈むかを正確に示しています。"
"0xe39226b3" = "精巧に刻まれた円盤で、そこにいくつもの小さな円盤がはめ込まれています。日付と時刻に応じて、星空のどの部分が見えているかを調べるのに使えます。<n>円盤の刻みから、かつてこの計器が特定の海域で船の位置を測るのに使われたと分かります。"
"0xe39226b4" = "取っ手を回すと、大きなホルンから女の歌声のような優しい音が出ます。何週間も海に出ている船乗りにはうってつけです。"
"0xe39226b5" = "金の棒の先に大きな丸いガラスが付いています。地図の上にかざすと、光の弱いところでも細い線まではっきり見えます。"
"0xe39226b6" = "この小さな金属製の台は真鍮でできており、船がどれだけ揺れても台の面が常に水平を保つように作られています。外側の金属環には方位を示すような刻みがあります。ただし、この台がかつて使われた海域までは分かりません。"
"0xe39226b7" = "小さな箱に、簡単に火を起こせる精巧な道具が入っています。箱には神秘的な刻印がびっしりと施されています。"
"0xe39226b8" = "この錨は実用よりも装飾的です。せいぜい手漕ぎ舟を留める程度にしか使えません。<n>大きさの割に非常に重く、精巧な装飾と未知の文字で覆われています。"
