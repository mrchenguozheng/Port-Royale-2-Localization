"0x0625c88f" = "国家"
"0x062a6d44" = "よし。船団は@T$HostileTown$を出てヨーロッパ方面へ向かい、東からカリブ海を出ます。航路全体を捜して書類を見つけ、@D$EndDate$までに私へ届けてください。"
"0x062a6d45" = "本当に助かります！計画どおりなら、操舵手が航海日誌を一枚ずつ密かに海へ捨てます。船は@T$HostileTown$を出てヨーロッパへ向かっています。船を追って日誌を回収し、@D$EndDate$までに私へ届けてください。"
"0x062a6d46" = "上出来です。船はすでに@T$HostileTown$の港を出てヨーロッパへ向かっています。ただし、私に借りのある客が乗っています。彼が船内で書類を探し、一枚ずつ密かに海へ捨てます。あなたの任務は、その書類を回収し、@D$EndDate$までに私へ届けることです。"
