"0xf22d73b9" = "植民地物資を生産するには道具が要ります。同じように、加工品を生産するには原材料が要ります。加工品にはロープや布などがあります。その原材料は麻と綿花です。<n><n>生産施設の建て方を覚えたので、総督の町で建築許可を買い、そこに加工品の生産施設を建てるとよいでしょう。ただし建築許可を買う前に、その町で実績を積む必要があります。つまり、不足している物資を町へ売るのです。<n><n>ただし注意！町で不足している物資を買い占めると、その町での実績に悪影響が出ます！不足している物資は取引ウィンドウで赤く表示されます。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>カルタヘナでの交易実績を上げ、建築許可を買えるようにしてください。"
