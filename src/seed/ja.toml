"0x1f36e96d" = "まもなく重要な書類をヨーロッパへ送ります。現在@n$HostileNation$と戦争中なので、危険は冒さず、護衛を追加したい。その護衛を引き受けてもらえますか？"
"0x1f6696d2" = "申し訳ありません、結局この任務は任せられません。問題はもう解消したという連絡が届いたのです。"
