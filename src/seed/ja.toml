"0x080f2b29" = "<ts:20>物資について、次のことを知っておきましょう。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>物資には五つの種類があります。必需物資、原材料、加工品、植民地物資、輸入品です<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>各町は5種類の物資を生産できます<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>町には二つの型があります。植民地の町と、総督や副王のいる町です<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>総督の町は必需物資と加工品を生産します。またヨーロッパから輸入品の定期的な納品を受けます。ですから加工品と輸入品を探すなら、これらの町が最適です。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>総督の町は加工品を作るために原材料を必要とします。また植民地物資も受け入れます。これはヨーロッパからの輸送船団が集めてくるものです。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>植民地の町は必需物資、原材料、植民地物資を生産します。植民地物資はそれぞれカリブ海の特定の地域でしか作れません。たとえばコーヒーはカリブ海の南と西でしか手に入りません。<n><n>価格について、次のことを知っておきましょう。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>町である物資の需要が高く供給が少ないほど、値段は高くなります。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>ある国での名声が良いほど、その国の町で物資を安く買えます。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>物資は生産されている町で買うべきです。<n><n>金を稼ぐ最速の方法：<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>植民地の町で植民地物資と原材料を買う<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>それらを総督の町で売り、そこで加工品と輸入品を買う。"
