"0xcff9644a" = "「片腕の海賊」は32枚の札を使う運任せのゲームです。各プレイヤーは掛け金をポットに入れ、相手には見えない5枚の札を配られます。<n><n>まず各プレイヤーは、取れると思う点数を宣言します。1トリック取るごとに1点です。高い点数を宣言した方が主導権を握り、切り札の種類を決めます。そして少なくともその点数を取らねばなりません。<n><n>主導側が最初の札を出し、相手は同じ種類の札があれば必ずそれを出します。高い札を出した方が1点を得ます。<n><n>同じ種類の札がなければ、どの札を捨てても、切り札を出してもかまいません。<n><n>札の順序はI、II、III、IV、海賊、花嫁、総督、鸚鵡です。切り札は他のどの札にも勝ります。<n><n>点を取った方が次の札を出します。どちらかが勝つまでこれを続けます。<n><n>主導側が宣言した点数を取れば、そのプレイヤーの勝ちでポットを獲得します。取れなければ相手の勝ちです。"
