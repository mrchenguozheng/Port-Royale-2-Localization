"0xdbd3f83d" = "%1、<n>私に何の用ですか？あなたが本当の船乗りのように町へ入ってきたなら、わが国への敵ですから大砲を向けたでしょう。<n><n>しかし、もうここにいるのですから、紳士らしく振る舞わねばなりません。"
