"0x39e9081a" = "黒ひげの隠れ家の場所を突き止めました。一味の情報は、海図の隠れ家の記号を左クリックしてください。<n><n>注意：隠れ家を破壊すると一味は全滅します。ただし、そのとき隠れ家にいなかった船団には連絡が届き、新しい隠れ家を構えます。<n><n>ですから最初の目標は、隠れ家に属する船団をすべて撃破することです。できれば隠れ家へ出入りする船団を待ち伏せして攻撃しましょう。<n><n>探索を支える資金も受け取りました。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>海上にある黒ひげの海賊船団をすべて撃破してください。隠れ家を攻撃してはなりません！"
