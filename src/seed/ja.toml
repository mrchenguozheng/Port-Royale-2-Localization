"0xfd1be8e3" = "%1の海賊%2が町に忍び込み、町の商人数人の大量の在庫を破壊しました。町議会は責任を認めようとしません。"
"0xfd1f0281" = "原材料と生産"
"0xfd26f2aa" = "船団@C$Convoy$が漂流者を救助しました。@T$DestTown$へ連れて行ってください。"
