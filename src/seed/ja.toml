"0x39e32dc7" = "問題の町は@T$TargetTown$です。町が必要とする物資をすべて供給してください。@D$EndDate$までに噂を完全に打ち消すよう最善を尽くします。それまでは町の状態を「好況」より下げてはなりません。"
"0x39e32dc8" = "困っている町は@T$TargetTown$です。@D$EndDate$まで状態を「好況」より下げてはなりません。さもないと市民が大量に離れ、疫病の危険すらあります。そうならないよう、期限内に十分な物資を供給してください！"
"0x39e32dc9" = "よろしい。問題の町は@T$TargetTown$です。@D$EndDate$までに必要な物資をすべて供給してください。町の状態を「好況」より下げてはなりません。正直に言うと、この町は疫病に見舞われる可能性が高い。覚悟しておいてください。"
