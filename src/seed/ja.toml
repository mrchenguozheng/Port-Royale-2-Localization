"0x39331330" = "小さな復讐に手を貸してもらえませんか？@T$Town$の商人が私の船の何隻かを妨害したのはほぼ確実です。今は造船所から船が戻るのを待つしかありません。冷酷な相手の船団を1つ撃破してください。十分に報います！"
"0x39331331" = "@A$USER$ではありませんか？仕事があるかもしれません。<n>ずっと前に@T$Town$の商人にかなりの額を貸し、返済期限もとうに過ぎています。それでも返さず、今後も返す気はなさそうです。<n>ですから一度痛い目に合わせたい！彼の船団を1つ襲ってくれませんか？十分に報います！"
