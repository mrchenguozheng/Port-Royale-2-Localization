"0x0ea0e0e8" = "では出発してください。@T$TargetTown$の町の周辺海域へ向かってください。"
"0x0ea0e0ea" = "@D$EndDate$までにこの任務を完了してください。"
"0x0eb34b66" = "このシナリオでは、事業の興し方と、その際に気をつけることを学びます。新しい労働者のための住宅地区も建てます。<n><n>ポートロワイヤル2では、建築許可を買った町ならどこでも建てられます。許可を多く持つほど、次の許可は高くなります。ゲームを開始した町ではすでに許可を1枚持っているので、すぐに建物を建て始められます。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>サンタマルタにカカオ生産施設を1つと、住宅地区を1つ建ててください。"
"0x0ede126a" = "これで海戦の仕組みが分かりました。町全体を攻撃して略奪したり、他国のために占領したりもできます。ただしそのためには、強力な船をそろえた大きな船団が必要です。ご想像のとおり、町を攻撃すればその国での名声は大きく損なわれ、以後その国の軍事船団があなたを追ってきます。<n><n>別の方法として、海賊の隠れ家を攻撃することもできます。隠れ家は通常は秘密の場所ですが、ゲームが進むうちにいずれ分かります。分かれば、町を攻めるのと同じように攻撃して、海賊一味を丸ごと壊せます。<n><n>隠れ家周辺の防備の強さは、その一味がどれだけ長くのさばっていたか、そして船団がどれだけうまく交易船を略奪したかで決まります。<n><n>このシナリオの最後の仕事は、小さな海賊の根城を襲うことです。隠れ家の場所は@T$TOWN$の総督に聞いてください。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@P$PirateName$の海賊の隠れ家を破壊してください。"
