"0x04081363" = "@n$HostileNation$にいる私の競争相手が、私の日記を盗み、それをヨーロッパへ送ろうとしています。それを成功させては絶対になりません。幸い、日記をヨーロッパへ運ぶ船の操舵手を買収できました。そこで、あなたの助けが必要なのです。"
"0x04081364" = "@n$HostileNation$は長く我々をスパイしていました。集めた情報が細かく記録され、今@T$HostileTown$からヨーロッパへ送られようとしているのが分かりました。その書類がカリブ海から出ないようにするのを手伝ってほしいのです。"
"0x040bf5f1" = "ゲームを送信"
"0x04100fa0" = "%1：海賊の襲撃"
"0x0420c2a2" = "<ts:20>取引ウィンドウでの物資の買い方・売り方はもうご存じでしょう。もう少しヒントを挙げます。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>矢印に表示される価格は、単位の大きさによって変わります<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>1個を10回売買しても、10個を1回売買しても、合計価格は同じです。<n><n><g:INTEXT_AUSRUF_800x600.screen>物資がなくても価格は常に表示されます。これは設定した単位の大きさにかかわらず、1単位あたりの価格です。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>物資の記号をクリックしても取引できます。そのときスクロールバーの付いた小さなウィンドウが出て、売買する数量を指定できます。単価と合計価格がすぐに表示されます。"
"0x0424bb9a" = "年代記"
"0x0436c531" = "とても特別な船を見つけました！<n><n><g:INTEXT_BONUSSCHIFF_800x600.screen><n><n><f:fonts/Tiepolo_black14x14aaFHk.res>蒸気機関付き帆船<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><n>こんな船は生涯見たことがありません！二本のマストの帆だけでなく、蒸気で二つの外輪を回す奇妙な仕組みでも進むようです。どうやら風がまったくなくても進み続けられるらしいのです。"
"0x044bc6d2" = "船長は%1との剣闘に勝利しました。部下たちが海賊の宝を探し、%2を見つけます。<n><n>あなたは隠れ家を破壊し、海賊%3の支配に終止符を打ちました。"
"0x044bc6d3" = "船長は%1との剣闘に勝ちました。部下たちが海賊の宝を探し、%2を見つけます。隠れ家を破壊し、それがもたらす危険をうまく取り除きましたが、どうやらすべての船を壊したわけではないようです。残った船は新しい隠れ家を探すかもしれません。"
"0x044e52eb" = "シナリオ"
