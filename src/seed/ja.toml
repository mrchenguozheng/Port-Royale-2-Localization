"0x204cf373" = "町を支援"
"0x204d1e7c" = "海賊の隠れ家は海からしか攻撃できません。"
"0x20574fcc" = "%1、あなたは%2のために父の愛する町を占領したのですね！もうあなたとは関わりたくありません。二度と会いたくない。あなたは私にとって何の意味もなかったし、今後も思い出すことはありません。<n>遅かれ早かれ、あなたがふさわしい罰を受けることを心から願っています。<n><n>%3"
"0x20574fcd" = "%1、あなたが%2のために併合を行ったせいで、副王は父の愛する町へ移らざるを得ず、父はヨーロッパへ帰らねばならなくなりました。<n><n>もうあなたとは関わりたくありません。二度と会いたくない。それに、私は酒場の商人たちのほうがあなたよりずっと気になっていたのです。あなたは私にとって何の意味もなく、今後は最後に思い出す存在になるでしょう。<n><n>遅かれ早かれ、あなたがふさわしい罰を受けることを心から願っています。<n><n>%3"
"0x2065f070" = "聞いてください。大使から、%1が思いがけない和平の申し出をしてきたと連絡がありました。つまり今日にも和平が成立するでしょう。<n><n>ですから、もう町を占領する任務は任せられません。"
"0x207295a1" = "「%1」という名前の交易路がすでにあります。<n><c>上書きしますか？"
"0x2077407d" = "%1、<n>来てくれて嬉しい。入りなさい、あなたに合うものがあるか見てみましょう。"
"0x207a9d35" = "町の警備隊の司令官が城壁からあなたの船長に呼びかけ、戦いをやめて決闘で決めようと申し出ます。これ以上の損害を避けるため、船長は応じます。"
"0x207b620f" = "部隊が町門を破ると、町の警備隊の司令官が立ちはだかります。彼はあなたの船長に決闘を挑みます。"
