"0x0d496e8a" = "倉庫番による自動購入"
"0x0d4fbd33" = "上出来です！<n>織物工場に原材料を絶やさないため、サンタマルタに綿花の事業を興してください。<n>生産施設1つで、加工施設2つ分の原材料をまかなえます。"
"0x0d4fbd34" = "ではサンタマルタとカルタヘナの事業をフル稼働させてください。<n>カルタヘナの織物工場には綿花を絶やさないよう忘れずに。<n>交易を続け、生産した物資を売ってください。<n>現金が@g$GoldGoal$に達しだい、このシナリオは終了します。"
"0x0d552127" = "町を攻撃できません"
"0x0d578089" = "過去30日以内に%1の町をすでに攻撃しました。船長は道義的な理由で再攻撃を拒みます。"
"0x0d58ea99" = "%1の海賊%2が労働者とその家族を%3人引き抜きました。町の多くの事業が、もうフル稼働できていません。"
"0x0d750c45" = "%1の船団"
"0x0d919a5a" = "%1、<n>普段なら地獄へ行けと言うところですが、こんな非常時には、悪魔にだって魂を売りますよ。<n><n>さあ入ってください、話したいことがあります。"
"0x0d9c1799" = "あなたの任務は、@D$EndDate$までに@T$TargetTown$の状態を「不況」まで落とすことです。方法は二つあります。<n><n>町を攻撃して物資をすべて奪い、状態を「回復」まで下げる。その後は物資不足で状態が下がり続けます。<n><n>あるいは、交易船団を迎撃して町への物資供給を断つ。注意：船団を拿捕せず略奪だけなら、その国での名声の損害はずっと小さく済みます。"
"0x0d9c179a" = "よろしい！@T$TargetTown$の町を「不況」に陥れる任務を命じます。期限は@D$EndDate$です。<n><n>目的を果たすには、町を訪れる商人をすべて迎撃し、物資が届かないようにして状態をゆっくり下げさせてください。<n><n>ただし、もっと早く進める方法もあります。町を攻撃して略奪するのです。攻撃で状態が「回復」まで急落し、その後の物資不足でさらに下がり、やがて「不況」に至ります。"
"0x0daa656f" = "散弾"
"0x0dbd9444" = "私にしてやれることはもう何もない。"
