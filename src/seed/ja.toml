"0xcb8dd6d9" = "敵の@n$HostileNation$は手段を選びません。妻がさらわれ、解放の条件が突きつけられています。ただし、どこに監禁されているかは知っています。表向きには何もできないのです、お分かりでしょう。しかしあなたが町を攻めて妻を連れ戻すことはできます。"
"0xcb8dd6da" = "会えてうれしい。<n>妻が最近パリから手入れされたプードルを買いました。その忌々しい動物には気が変になりそうですが、妻は犬に夢中です。<n>それを知った誰かが犬をさらって敵に渡し、我々を脅しているのです。<n><n>そのプードルを救ってくれませんか？"
"0xcb8dd6db" = "しばらく前、末娘が通りすがりの冒険者と駆け落ちしたと言われていました。それが今、@T$TargetTown$に住み、町の司令官と結婚することになっていると分かったのです。娘のことは分かっています。自分の意思であんなことをする子ではありません！副王に「娘を救うため町を攻撃せよ」などと言えるはずもない。しかし、あなたならどうですか？"
