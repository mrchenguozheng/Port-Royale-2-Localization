"0xf680e197" = "%1が市場であなたを待っています。"
"0xf6957b90" = "港内の船"
"0xf69c4221" = "%1への攻撃"
"0xf6a84efd" = "時は1570年、舞台はカリブ海です。あなたの目標は、一介の交易者から影響力ある実業家へと成り上がることです。物資を運んで交易し、建設し、政治や海賊行為にも関わることで、目指す地位に近づけます。<n><n>これからのシナリオでゲームの基本を学びます。他のシナリオと同じく、いくつもの目標があり、すべて達成するとシナリオ成功です。<n><n>では「閉じる」ボタンでこのウィンドウを閉じ、画面左下のイベントウィンドウを参照してください。<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>イベントウィンドウの指示に従ってください。"
"0xf6bb9f8c" = "価格"
"0xf6c23666" = "@d$Pos$<n>"
"0xf6c23667" = "@r$Pos$<n>"
"0xf6c23668" = "@M$Pos$<n>"
"0xf6c70431" = "グラフィックカード"
"0xf6c77503" = "海賊%1の隠れ家が見つかりました。攻めて破壊する勇敢な冒険者は誰でしょう？"
"0xf6ec5ddc" = "トルトゥーガで奇妙なことが起きています。過去のさまざまな出来事のせいで、町に足を踏み入れようとする商人はほとんどいません。あなたの任務は、物資を供給してトルトゥーガをできるかぎり支えることです。<n><n>ただし開始資金は決して潤沢ではありません。手元の現金は@g$StartGold$です。それでも港には装備の整った交易船団があり、物資もいくらか蓄えがあります。<n><n>最初の目標は、現金を@g$GoldGoal$まで増やすことです。できるだけ早く、ただし40日を超えないように。<n><n>忠告：どんなことがあっても船を売ってはなりません。借金はかまいません。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@D$EndDate$までに現金を@g$GoldGoal$まで増やしてください。"
"0xf70feddb" = "カルタヘナの港に戻り、船団「サンタ・マリア」が選ばれています。<n>ご覧のとおり、船団にはすでに綿花・肉・カカオが積まれています。<n>では港の船着場を探してクリックしてください。物資を売るのです。"
"0xf70feddc" = "船着場では、町と倉庫の間、町と船団の間の両方で取引できます。<n>町にどんな物資があり、船団に何が積まれているかが分かります。矢印で売買します（価格は矢印に表示されます）。<n>では綿花を売ってください。"
"0xf70feddd" = "綿花を売ったときに値段が下がるのに気づいたでしょう。<n>これは町の需要と供給で値段が決まるからです。<n>売れば需要が満たされて値段は下がり、買えば値段は上がります。<n>では小麦を@a$SubGoal$買ってください。"
"0xf70fedde" = "小麦の値段が上がったのが分かりますか？<n>ただし値段は供給だけでなく、その町でのあなたの名声にも左右されます。<n>取引ウィンドウ右下の建物のボタンをクリックしてください。"
"0xf70feddf" = "これで倉庫と町の間で取引できます。<n>物資の生産を始めたい町では、まず倉庫を建てねばなりません。開始した町では最初から倉庫を持っています。<n>では倉庫にある物資を全部売ってください。"
"0xf70fede0" = "取引ウィンドウの一番上に1、10、100のボタンがあり、まとめて早く取引できます。10のボタンを押して値段がどう変わるか見てください。<n>1個を10回買っても、10個を1回買っても、合計価格は同じです。ではラム酒を@a$SubGoal$買ってください。"
"0xf70fede1" = "取引メニューの一番右の列には、買った物資の平均価格が出ます。利益を出して売るには、より高い値を付ける町を探さねばなりません。<n>では右下の4番目（クレーンの）ボタンで、船と倉庫の間の移譲を開いてください。"
"0xf70fede2" = "このウィンドウでは船団と倉庫の間で物資を移せます。別の町で売るのですから、倉庫に残っている物資をすべて船団に積んでください。<n>その後、右下の「X」ボタンで取引ウィンドウを閉じてください。"
"0xf70fede3" = "では海図に切り替え、船団でサンタマルタへ向かってください。サンタマルタには入らず、船団が町に着いたらすぐ町を右クリックしてください。"
"0xf70fede4" = "サンタマルタの取引ウィンドウが開きます。<n>つまり、取引するために町に入る必要はありません。<n>では船団に積んだ物資をすべて売ってください。<n>その後、取引ウィンドウを閉じてください。"
"0xf7110875" = "このセーブデータを削除してもよろしいですか？"
"0xf725f22c" = "船団はサンタマルタにいます。町の名前をクリックすると町の情報が出ます。<n>海図からでも、町に入ってからでもかまいません。"
"0xf725f22d" = "町の情報には、その町で生産される物資が表示されます。<n><n>スペインとの関係も表示されています。友好的ですね！これは町で最高の値段が付くという意味です。<n><n>ではこのウィンドウを閉じて、町を見て回ってください。"
"0xf725f22e" = "画面左の町の名前の下にある住民の記号をクリックして、サンタマルタの在庫を表示してください。"
"0xf725f22f" = "ここには在庫量と町での消費量が表示されます。消費量は当然ながら町の人口によって変わります。<n>消費量から、定期的にどれだけ届けられるかが分かります。では在庫ウィンドウを閉じてください。"
"0xf725f230" = "では利益の出る取引を試してみましょう。<n>取引ウィンドウを開き、綿花・砂糖・カカオを船団で運べるだけ買ってください。これらはこの町で生産されています。<n>そしてカルタヘナに戻り、利益を付けて売ってください。"
"0xf725f231" = "交易をうまく進めるヒントのメッセージを2通受け取りました。<n>ログを開いて読んでください。<n>"
"0xf725f232" = "平均価格より高く売れる物資はどんどん売り、新しい物資を買ってください。<n>注意：町で不足している物資の価格は赤で表示されます。こうした物資はいつでも良い値で売れます。<n>"
"0xf725f233" = "カルタヘナのような総督の町は、ヨーロッパから輸入品を受け取ります。<n>輸入品は通常、サンタマルタやマラカイボ、ジブラルタルのような植民地の町へ売ると利益が出ます。<n>ではしばらく自分で交易してください。<n>目標は交易で現金を@g$GoldGoal$稼ぐことです。"
"0xf7346191" = "%1からの商人"
"0xf73619d7" = "海賊の隠れ家が知られるようになった"
"0xf7370c4b" = "%1、<n>会いたい人は他にも大勢います。話すことがあるのですか？どうしてもなら入りなさい。"
"0xf73bf67d" = "カルタヘナの町の画面へ行ってください。<n>通常、町に入るには船団を港に停泊させておく必要があります。しかしカルタヘナには倉庫があるので、いつでもこの町に入れます。<n>カルタヘナの造船所をクリックしてください。"
"0xf73bf67e" = "造船所で小さな船を1隻買ってください。使いすぎないように。交易と船の維持のためにも資金を残しておく必要があります。"
"0xf73bf67f" = "前のシナリオでは、港を右クリックして船団に船を加える方法を学びました。<n>しかし今度は、酒場で船長を雇って新しい船団を編成してください。<n>町の中心にある酒場を探してクリックしてください。"
"0xf73bf680" = "船長はいつも酒場にいます。町に船長が滞在していれば、酒場メニューの3番目のボタンに表示されます。<n>港に他の船や船団がある場合は、その船長をどこで使うかを正確に伝えねばなりません。<n>新しい船の船長にすることを指定してください。"
"0xf73bf681" = "おめでとうございます！初めての船団を編成しました！次の課題は、財産を@g$GoldGoal$まで増やすことです。財産はログの「成果」でいつでも確認できます。<n><n>幸運を祈ります！"
"0xf73dab55" = "前回の任務を完了してくれて感謝します。"
"0xf73dab56" = "前回の任務を完了していただき感謝します。"
"0xf73dab57" = "支援に感謝します。"
