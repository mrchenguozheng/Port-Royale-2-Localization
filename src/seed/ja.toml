"0xfb4be839" = "見事です！海賊船団をすべて撃破し、海賊が逃げられないようにしました。隠れ家を攻める前に一団の船団をすべて壊しておくと、新しい海賊船団がカリブ海に現れるまで時間がかかります。<n><n>では町を攻めるのと同じように、船団を選んで海賊の隠れ家を右クリックし、攻撃してください。港に海賊船が停泊している場合は、港の戦いに勝つ前にまずそれらを攻める必要があります。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>黒ひげの海賊の隠れ家を破壊してください。"
