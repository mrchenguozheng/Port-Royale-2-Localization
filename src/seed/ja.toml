"0xe6490f96" = "時は1676年、オランダの総督の町テルクス諸島にいます。オランダは7つの町を有し、そのうち5つが植民地の町、1つが総督の町、1つが副王の町です。<n><n>イングランドは14の町を有し、長くオランダと戦争中で、これから何か月も続くでしょう。この戦争が続く限り、オランダのためにイングランド王室の町を占領せねばなりません。<n><n>ただしイングランドの町を攻める前に、もっと資金と船団の武装が必要です。最初の目標は、イングランドの交易船団を3つ撃破し、その船を拿捕することです。<n><n>まずはテルクス諸島のオランダ総督から私掠免許状をもらってください。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>テルクス諸島の総督を訪ね、イングランドに対する私掠免許状を取得してください。"
"0xe64f1385" = "上出来です！黒ひげの海賊船団を1つ撃破しました。では@T$TOWN$の総督のところへ行き、報酬を受け取ってください。<n><n>彼には他にもあなたに果たしてほしい任務があります。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@T$TOWN$の総督のために、もう一つ任務を果たしてください。"
