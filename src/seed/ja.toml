"0xdad6e283" = "ボタン"
"0xdaeb0484" = "今回はカリブ海中央の総督の町カルタヘナからシナリオが始まります。<n>スループ1隻からなるあなたの船団が港にいます。<n>このシナリオには海戦があるので、まず船団を武装させましょう。<n>船着場へ行き、積荷メニューを開いてください。"
"0xdaeb0485" = "ご覧のとおり、船団には大砲も弾薬も積まれていません。乗員も必要です。<n>乗員を最大まで、大砲をできるだけ多く、さらに3種類の弾薬をそれぞれ10x10ずつ積んでください。<n>大砲は重いので、船団に十分な余裕がないかもしれません。その場合は、積んでいる物資をいくつか売ればよいでしょう。"
"0xdaeb0486" = "よくやりました！船団は武装でき、小規模な戦いに備えられました。<n>ちょうど今、カルタヘナの総督にぴったりの任務があります。<n>総督の建物をクリックして、任務を受けてください。"
"0xdaeb0487" = "総督は、成功すればその国でのあなたの名声が上がる任務をよく持ちかけます。<n>また、総督に私掠免許状を求めたり、捕らえた海賊の身代金を請求したりもできます。<n>では船団で、総督が話していた船を探してください。"
"0xdaeb0488" = "上出来です、船団を発見しました。<n>次は船を戦闘態勢にして、戦いの準備をします。船団の船リストを開いてスループを選び、大砲の隣のボタンで軍艦として宣言してください。そうすれば、船団を右クリックして「攻撃」できます。"
"0xdaeb0489" = "ここがポートロワイヤルの海戦画面です。<n>自分の船が表示され、ディスプレイウィンドウを動かせば放棄船も見られます。<n>では一時停止を解除し、右マウスボタンで航海の練習をしてください。海戦中はイベントウィンドウに風向きと船の向きが表示されます。"
"0xdaeb048a" = "戦いに参加している船は画面下に表示されます。ここで使う弾薬を選べます。重い砲弾を選んで、敵船を1隻沈めてください。<n>左マウスボタンで撃てますが、射撃位置が良いときだけです。そのとき目標は赤く表示されます。"
"0xdaeb048b" = "よし！2隻目に接舷しましょう。<n>船の表示の右下にある「接舷」ボタンをクリックしてください。<n>そして敵船へ近づいて体当たりします。なお、海戦中もF1ボタンは使えます。"
"0xdaeb048c" = "通常、敵には乗員がいて、あなたの乗員との間で船上の戦いになります。<n>戦いが終わると、接舷した船はすべて勝者のものになります。<n>では敵船を船団に加え、移譲ウィンドウを閉じてください。"
"0xdaeb048d" = "結構です！<n>では船団をカルタヘナへ戻してください。"
"0xdaeb9147" = "ティム・プレーガー"
"0xdaed79ac" = "海賊%1の船団が%2の商人を襲いました。"
"0xdb0108d5" = "まず新しい船を買いましょう。造船所へ行き、できるだけ大砲の多い船を買ってください。"
"0xdb0108d6" = "船団を選び、港を右クリックして新しい船を船団に加えてください。"
"0xdb0108d7" = "どの船団も交易船と護衛船で構成されます。<n>船団のうち1隻を戦いに参加させるには、軍艦として指定する必要があります。<n>船団の船リストを開いて、すべての船を表示してください。"
"0xdb0108d8" = "船リストには船団のすべての船が表示されます。軍艦かどうかは船の右上隅に表示されます。大砲の記号が出ていれば軍艦として指定され、戦いに参加します。その隅をクリックすると状態を直接切り替えられます。<n>では新しい船をクリックして選んでください。"
"0xdb0108d9" = "造船所と同じように、ここには最大積載量などの船の技術的詳細が表示されます。<n>船を維持する1日の費用も分かります。<n>では大砲の記号にチェックを入れて、この船を軍艦にしてください。"
"0xdb0108da" = "よくやりました！<n>大砲と船員は、船団の護衛船に常に均等に分けられます。<n>護衛船が十分に武装し、乗員も満たされていることを確認してから、総督を訪ね、彼が与える新しい任務を受けてください。"
"0xdb0108db" = "総督から与えられた任務を遂行してください。"
"0xdb0108dc" = "海戦で操作する船を護衛船の中から選んでください。<n><n>リストでクリックすれば、どの段階でも別の護衛船を選べます。<n><n>ただし注意：戦いが始まると、各船は一度しか選べません！"
"0xdb0108dd" = "よくやりました！海賊船団を撃破しました。<n>これは任務の一部なので、カルタヘナの総督のもとへ戻ってください。<n><n>任務はログに自動で記録されます。必要ならいつでもそこで詳細を確認できます。"
"0xdb04023a" = "建材が足りません"
"0xdb0e3d33" = "あなたに次の任務があります。<n><n>"
"0xdb0e3d34" = "ひとつ頼みがある。<n><n>"
"0xdb0e3d35" = "頼みたいことがある。<n><n>"
"0xdb10f490" = "寄付"
"0xdb126f49" = "あなたのポイント<n>"
"0xdb170d26" = "総督が新しい任務を出す前に、船団を「航海可能な状態」にしておきましょう！<n>船団が損傷しているなら、造船所へ行って修理してください。"
"0xdb170d27" = "船団をより良く装備できるよう、ちょうど資金が届きました。<n>船団には十分に武装した船3隻と、満員の乗員が必要です。<n>弾薬を忘れず、新しい船を軍艦として指定するのも忘れないでください。今すぐやりましょう。"
"0xdb170d28" = "見事です！<n>では総督を訪ね、彼が与える任務を果たしてください。"
"0xdb2ae26e" = "辞退"
"0xdb2d1177" = "これから海賊の隠れ家を襲撃します。<n>まず船団を「航海可能な状態」にしておきましょう！<n>いくつかの総督の町を回って、どこかの造船所にもっと大きな船がないか見てみるのもよいでしょう。<n>途中で総督を訪ね、海賊の隠れ家の情報を手に入れてください。"
"0xdb2d1178" = "港の戦いは海戦と似ていますが、相手が船ではなく非常に堅固な砲塔である点が違います。<n>港の戦いに勝つには、すべての砲塔を破壊する必要があります。<n>港に武装した船がいることもあります。その場合は、港そのものを攻める前に船と戦わねばなりません。"
"0xdb2d1179" = "このシナリオを終えるには、船団とともにカルタヘナへ戻ってください。"
"0xdb4287ac" = "カルタヘナの総督はあなたに大きな可能性を感じ、@g$Gold$を贈りました。<n><n>ヒント：<n>ある町で豊富に供給されている物資（数量が赤で表示されていないもの）を買い、それが不足している町で売ると、より良い値段がつきます。<n><n>こうすればすぐに富を増やせます。"
"0xdb4eeb89" = "船団を選択"
"0xdb5dde0a" = "ダミー"
"0xdb66b4df" = "IDM_CONTEST_01_2004_LOG_04_TEXT"
