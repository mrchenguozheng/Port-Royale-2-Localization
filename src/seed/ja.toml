"0xf8b3a303" = "町の状態は貧しさから富裕まで七段階に進みます。下から二段階では生活水準が悪すぎて、市民がしばしば町を離れます。逆に「繁栄」「富裕」「巨富」の段階になると、事業に効率ボーナスが付き、労働力も割安になります。最高段階では、町が自ら入植者を生み出すこともあります。<n><n>各段階の効果は町の情報で確認できます。町の名前をクリックしてください。<n><n>物資の各グループで2〜3種類を十分に供給すれば、町の生活水準は良好に保てます。「十分」とは、町の人口の10日分をまかなえる量です。<n><n>注意：町の状態は一晩では変わりません。市民が新しい状況に慣れるまで時間がかかります。"
