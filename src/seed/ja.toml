"0x23f0ed65" = "我々は@n$HostileNation$と戦争中です。先ごろ、私の船長の一人が@n$HostileNation$の戦意をくじく巧い方法を思いつきました。敵の船で軍事船団を編成し、いわば同じ薬を飲ませてやろうというのです。<n>その船を調達するのは、まさにあなた向きのようです。"
"0x23f0ed66" = "再び@n$HostileNation$と戦争になったので、町を守る新しい船団を編成したい。ヨーロッパから新しい軍事船団が割り当てられるのを待つ気はありません。<n>あいにく今は資力が乏しいので、敵の船を使うことを思いつきました。@S$ShipType$型の船を何隻か拿捕するのを手伝ってくれますか？"
