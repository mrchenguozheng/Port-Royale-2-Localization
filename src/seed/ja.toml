"0xd99426ca" = "勝負に付き合うかどうか聞くまでもありませんね。甲板を磨いたようにすっからかんです！懐が満ちたらまた来なさい。"
"0xd99426cb" = "おや、またあなたですか！前回の勝負は覚えていますよ。まだ足りないのですか？まあ、しばらくはあなたとはやりません。"
