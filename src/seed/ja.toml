"0x293d8c9f" = "見事です！町はかなり大きくなりました。まもなく他の町から最初の商人が来て、品を取引するでしょう。<n><n>ただし、あまり歓迎したくない者たちも訪れる危険があります。関係の悪い国の海賊やバッカニアなどです。ですから次の課題は、兵士を雇い、港の大砲を建てることです。<n><n>幸い、町の市民はかなりの部分を自分たちで組織できます。指示を出し、必要な材料を買うだけでよく、その後は追加費用もかかりません。<n><n>港の大砲は建設メニューから建てられ、兵士は自分の宮殿で雇えます。<n><n>覚えておいてください：<n>兵士にも住まいが必要です！ただし労働者と違い、兵士1人につき1区画だけで済みます。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>港の大砲を5門建て、兵士を300人まで増やしてください。"
