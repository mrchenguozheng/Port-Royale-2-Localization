"0x343e9f4b" = "おめでとうございます！町づくりの基本が分かりましたね。<n><n>生産施設が建つと、自動的に労働者を雇い始めます。港で雇われるのを待つ入植者1人が、労働者1人と市民4人になります。つまり入植者1人は実質、入植者一家まるごとを表します。<n><n>事業に労働者が足りなくならないよう、働き手となる入植者を十分に確保してください。輸送船団がヨーロッパから入植者を総督の町へ運び、そこから商人が他の町へ連れて行きます。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>サンタマルタの事業に十分な労働者がいるようにしてください。"
