"0x0f52782d" = "おめでとうございます！これでカルタヘナで綿花から布を生産できます。<n><n>ご想像のとおり、布の生産費は綿花の仕入れ値に大きく左右されます。ですから、原材料を妥当な値段で買える見込みがあるときにしか加工品は作れません。あるいは原材料を自分で生産する手もあります。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>サンタマルタに綿花生産施設を建て、交易で現金を@g$GoldGoal$まで増やしてください。"
"0x0f5d7735" = "チャールストンのはるか東にバミューダ諸島があります。近づかないように！2か月前、義理の兄がそこへ探検に出たまま戻りません。そこで何が起きているのか誰も知りませんが、確かなことが一つあります。島に近づきすぎた者には恐ろしい運命が待っているのです！"
"0x0f5d7736" = "バミューダ諸島の最新の話を聞きましたか？ある商人が島のそばを通る航路でヨーロッパへ向かったまま、着かなかったのです。弟が捜しに出ましたが、島の南でいくつかの残骸を見つけただけでした。"
"0x0f5d7737" = "つい先日、ポートロワイヤルの船乗りが話してくれました。最近バミューダ諸島のすぐそばを航海したそうです。危うく近づきすぎるところでしたが、自分の目で水中を動く巨大な怪物を見たと言います。火を噴き、長い耳から煙を吐いていたそうです。この海の怪物に近づこうとする者に災いあれ！"
