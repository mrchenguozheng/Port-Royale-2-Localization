"0xf74a5740" = "<o:0xFFF2FAAD>%1<o>枚の金貨と<o:0xFFF2FAAD>ピンネース<o>（60トン、最大8門）で船乗りの人生が始まります。"
"0xf7534d8f" = "労働者を必要とする町へ入植者を運ぶと、入植者は下船時にお礼として運賃を払ってくれます。<n><n>カカオのような植民地物資を生産するには、少量の道具が常に必要です。道具がないと生産が止まります。後で値段と数量についてもう少し分かってきたら、倉庫番に定期的な道具の購入を指示できます。ただ今のところは、念のため自分で道具を買っておきましょう。<n><n>これが次の課題です。そうすればカカオ生産を妨げるものはなくなります。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>カカオを生産し、倉庫に@a$AmountGoal$の備蓄を築いてください。"
