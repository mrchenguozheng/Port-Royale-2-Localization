"0xd06e1e7e" = "町を出る"
"0xd07dbe34" = "町の生活水準を左右する最大の要素は、物資の供給量と種類です。ただし、住民を満足させるためにあらゆる種類の物資をそろえる必要はありません。<n><n>町の物資は五つのグループに分けられます。必需物資、原材料、加工品、植民地物資、輸入品です。取引ウィンドウでもこの順に並んでいます。各グループで2〜3種類を十分に供給すれば、町の生活水準は良好に保てます。<n><n>町の生活水準についてのメッセージが届いています。ログで確認できます。<n><n>あなたの町はまだ小さいので、生活水準を良くするのは特に簡単です。小さな町の市民はそれほど多くを求めないからです。つまり目標達成に問題はないはずです。ただし人口2,000人未満の町は「好況」より上には上がれません。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>自分の町に、各物資を5樽ずつ供給してください。"
