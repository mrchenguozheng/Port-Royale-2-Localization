"0xf4e195bf" = "黒ひげは、あなたが@T$TOWN$の総督と手を組んでいることに気づきました。そこで@T$TOWN$を訪れる商人たちを脅し始めたのです。数日のうちに、@T$TOWN$へ来ようとする商人はほとんどいなくなるでしょう。<n><n>これは一時的な策にすぎません。あなたの任務は@D$EndDate$まで町に物資を供給することです。町の状態を「繁栄」より下げてはなりません。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@D$EndDate$まで@T$TOWN$に物資を供給してください。町の状態を「繁栄」より下げてはなりません。"
