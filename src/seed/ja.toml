"0xf2590753" = "感謝します。近いうちにヨーロッパから輸入品が入ってきそうにありません。現在@n$HostileNation$と戦争中なので、敵の輸送船団から、船を拿捕も撃沈もせずに物資を奪う機会があります。<n>香辛料・ワイン・道具をそれぞれ@a$Amount$ずつ調達し、@D$EndDate$までに市場の私の商人へ届けてください。"
"0xf2590754" = "あなたの任務は、@n$HostileNation$の輸送船団を攻撃して物資を奪うことです。船を拿捕したり撃沈したりしてはなりません。その後、物資を市場へ届けてください。期限は@D$EndDate$です。"
"0xf2590755" = "よろしい。@n$HostileNation$の輸送船団を探し、積荷の輸入品を@a$Amount$奪ってください。その後@D$EndDate$までに、市場で待つ商人へ物資を引き渡してください。忠告です。この地域は今非常に緊張しているので、船から物資を奪うだけで、拿捕も撃沈もしてはなりません！"
