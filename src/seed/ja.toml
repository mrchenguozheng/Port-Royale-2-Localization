"0xe39226ba" = "このホルンは口では鳴らさず、ポンプのような装置で鳴らします。強く押し込むと、信じられないほど大きな音が出ます。"
"0xe39226bb" = "この海図は、普通に出回っている海図とはかなり趣が違います。非常に細かく、何色も使って描かれています。ただし、どの海域を描いたものかは分かりません。"
