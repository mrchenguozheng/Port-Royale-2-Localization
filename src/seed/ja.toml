"0xe84c0654" = "@T$Town$で小さな問題を抱えています。妻に、あそこに学校を建てると約束したのです。あいにく親方建築士との関係は極めて険悪なままで、彼は私が町のことに口を出すのを決して許しません。代わりに学校を建ててもらえませんか？"
"0xe84c0655" = "@T$Town$の富を増やすため、この町に学校を建ててほしいのです。実は@T$Town$自体には何の思い入れもありませんが、妹がそこに住んでいて、他の町のほうが良いなどとどうしても認めないのです。"
"0xe84c0656" = "副王から@T$Town$を支援するよう指示されました。ですから町の学校の費用を喜んで払うつもりです。しかし町議会は私の申し出を断り、干渉されたくないので金貨を直接もらいたいと言います。そこで、あなたが学校を建ててくれないかと。"
