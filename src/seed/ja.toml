"0x1fe25594" = "港の防備を突破すると、船団は接岸し、船員たちは町を進みます。途中で町の警備隊の司令官に出会います。彼は正々堂々の決闘で負けない限り道を譲らないと言います。あなたの船長は挑戦を受けます。"
