"0xf4b68a6b" = "おめでとうございます！シナリオを達成し、オランダのためにイングランドの町をいくつか占領しました。<n><n>フリープレイでも同じように町を占領できます。ただし、占領したい町の国が軍事的に弱っていること、あなたが仕える国も軍事的に弱っていること、そして二国が戦争中であることが必要です。<n><n>補足：副王のために町を占領すると、通常は自分の町を建てられる土地がもらえます。ただしこのシナリオではその機能は無効になっています。"
