"0xda75935c" = "町の占領"
"0xda93dbe1" = "上出来です！並大抵のことではありませんでした！イングランドは軍事船団を多く失い、もう町を占領できます。その功績に感謝し、テルクス諸島の総督は大型帆船をさらに4隻与えます。<n><n>国の町を占領できるのは副王の命令がある場合だけです。副王は、自国が軍事的に強く、敵国が軍事的に弱いときにしか町の占領を命じません。<n><n>あいにくオランダは町を占領できるほど強くありません。しかし、これには手があります。グランドバハマのオランダ副王を訪ね、船団を一隻引き渡してください。新しい軍事船団を編成し、オランダの軍事力が上がります。<n><n>副王に船団を引き渡すには、船がちょうど5隻、大砲が少なくとも150門必要です。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>副王がオランダの軍事力を高めるのを助けてください。その後、彼の代理として町を占領する任務を受けてください。"
"0xdab4fea7" = "住宅"
