"0xcd01da76" = "スペインの総督の町@T$TOWN$で船員の階級から始まり、そこにはすでに倉庫があります。港には武装した船2隻の船団もありますが、船員はいません。<n><n>このシナリオの最初の目標は、@T$TOWN$の総督を訪ねて任務を受けることです。彼は悪名高い海賊エドワード・ティーチ（黒ひげとして知られています）に手を焼いていて、あなたの助けを求めています。<n><n>重要：このシナリオでは各国は平和状態です。つまり、どの国の船団も決して攻撃してはなりません。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>シナリオ目標<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>@T$TOWN$の総督を訪ね、彼が与える任務を受けてください。"
