"0x24695110" = "感謝します。私は@T$Town$の商人です。追手は私の居場所を知らないので、きっと故郷の町で捕まえようとするでしょう。そこで捜して賞金稼ぎを始末してください。私は@D$EndDate$までにここを発たねばなりません。それまでに任務を果たせば@g$Reward$を払います。"
"0x24695111" = "@T$Town$へ急ぎ戻らねばなりません。永久に姿を消す前に片付けたい用事があるのです。あいにく@T$Town$への航路は賞金稼ぎに見張られており、あなたが始末せねばなりません。@D$EndDate$までに任務を果たせば@g$Reward$を払います。"
"0x24695112" = "感謝します！賞金稼ぎが@T$Town$の港の入口を見張っているようです。<n>こうしましょう。私があなたの船に乗るという噂を流し、あなたは@T$Town$へ出航して様子を見るのです。<n>遅くとも@D$EndDate$までに安全だと知らせてくれれば、報酬@g$Reward$を払います。"
"0x246aece6" = "%1：飢饉"
"0x2478c95f" = "おめでとうございます！このシナリオを達成し、カリブ海から悪名高い海賊という災いを一掃しました。<n><n>ゲームが進むと、海賊の隠れ家は自然に現れます。ただし海賊船団の数は、彼らの成功度合いによります。海賊は交易船団だけを狙い、軍事船団には非常に警戒します。ですから軍事船団が多い海域は避けます。<n><n>フリープレイでも海賊を追い、隠れ家を暴けます。"
"0x24802954" = "%1：船が沈没"
"0x2487ab5c" = "残高"
