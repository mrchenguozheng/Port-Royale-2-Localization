"0x061848e4" = "@T$TargetTown$の町に妨害工作をしてくれたことに、わが国を代表して感謝します。とても特別な褒美を用意しました。非常に経験豊かな船長を、あなたのもとへ説得してきました。名は@N$CaptainName$で、酒場であなたを待っています。"
