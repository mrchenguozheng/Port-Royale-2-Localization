"0xcc823e55" = "つい先ごろ、@n$TargetNation$が我々の町を攻撃しました。今こそ@n$TargetNation$への軍事行動を考えており、あなたも加わりませんか？軍の船団を沈めるか拿捕してください。奪ったものはすべてあなたのもの、私が望むのは@n$TargetNation$を弱めることだけです。興味はありますか？"
