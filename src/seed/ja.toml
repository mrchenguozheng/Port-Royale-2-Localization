"0x28812f6e" = "海戦の指揮官として腕試しをしたいそうですね。では双方に得になる仕事があります。<n>今この瞬間も、放棄された船が2隻、海を漂っています。私の商人にとって脅威になる前に、その船を片付けてください。<n>この任務を受けますか？"
"0x28812f6f" = "では少し難しい話を。@P$PirateName$が率いる海賊船団が今どこを航行しているか、耳に入りました。船団は船1隻だけなので、撃破するのはそれほど難しくないはずです。<n>この任務を受けますか？"
"0x28812f70" = "@P$PirateName$の海賊船団をすでに1つ撃破しました。しかし海賊の隠れ家には通常いくつもの船団があり、いずれも@P$PirateName$が指揮しています。一味の頭目を倒すには、隠れ家を見つけて破壊するしかありません。<n>今、@P$PirateName$が指揮する別の船団が現れました。船2隻の船団なので、戦う前に十分準備してください。<n>準備はよいですか？"
"0x2883fdae" = "この海賊の隠れ家は船団で海から攻撃できます。まず港の船をすべて撃破してください。"
