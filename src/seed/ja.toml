"0x070c60fb" = "@n$FoeNation$の町へ航海して@G$Goods$を集めてください。@D$Date$までに私の町の市場へ@a$Amount$届けてください。1<gs:TEXTFLUSS_KEINEHOEHE><g:INTEXT_FASS_800x600.screen>につき@g$GoldPerBarrel$を受け取れます。"
