"0x1d01f111" = "Sounds"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>ここで沈んだ船は、非常に経験豊かな船長が指揮していたに違いありません。箱には金貨はありませんが、船長@L$RandLName$の丁寧に綴られた航海日誌が見つかります。その結果、船団@C$Convoy$の船長の経験値が2ポイント上がります。"
