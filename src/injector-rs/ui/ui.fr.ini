# Interface du lanceur (français). Le paquet de publication inclut ce fichier comme ui.default.ini selon la langue par défaut du groupe.
# Pour modifier les textes, copiez ui.default.ini de ce dossier en ui.ini et ne gardez que les clés à changer. ui.ini n'est pas écrasé lors d'une mise à jour.
[gui]
title=Port Royale 2 – Lanceur
subtitle=Runtime de localisation de Port Royale 2
subtitle.version=Runtime de localisation de Port Royale 2 v%d · %s
label.language=Paquet de langue :
button.launch=Lancer dans la langue choisie
button.vanilla=Lancer l'original
button.restore=Restaurer l'original
button.refresh=Actualiser
button.kill=Terminer le processus du jeu
status.count=Paquets de langue : %d
status.count_pack=Paquets de langue : %d · actuel %s
status.pack_stats=Entrées : %d · non traduites : %d
status.pack_detail=Entrées : %d · non traduites : %d · résumé %s
status.none=Aucun fichier .txt dans PR2Localization\packs
status.launched=Jeu lancé dans la langue choisie.
status.steam=Lancement confié au client ; la langue a été écrite dans PR2Localization\packs\locale.ini.
status.vanilla=Jeu original lancé.
status.restored=DLL hôte et polices originales restaurés.
status.killed=%d processus PR2.exe terminé(s).
hint.footer=Les paquets de langue se trouvent dans PR2Localization\packs.\nSi le jeu se bloque à la fermeture, terminez PR2.exe dans ce dossier.
confirm.kill=Forcer la fermeture de %d processus PR2.exe de ce dossier ?\nLa progression non sauvegardée sera perdue.
confirm.restore=Restaurer le DLL hôte et les polices originales ?\nAprès la restauration, le jeu démarrera en anglais jusqu'à ce que vous choisissiez à nouveau une langue.
error.no_game=Aucun PR2.exe en cours d'exécution trouvé dans ce dossier.
error.kill_failed=Impossible de terminer PR2.exe (erreur %lu).
error.no_launcher=PR2Localization.exe introuvable dans ce dossier.
error.no_language=Aucun paquet de langue n'est sélectionné.
error.launch_failed=Impossible de lancer PR2Localization.exe.
error.exit_code=Code de sortie du lanceur %lu ; le jeu n'a pas démarré.\nVérifiez que PR2Localization.exe / PR2LocalizationCore.dll se trouvent dans le même dossier.
error.font_missing=Polices TTF manquantes dans PR2Localization\fonts\.\nUn lancement quand même utilisera les polices latines d'origine ; certains caractères français risquent de manquer.\n\nLancer quand même ?
error.pack_too_new=Ce paquet de langue nécessite un lanceur plus récent (runtime v%d requis, actuel v%d).
error.restore_failed=Échec de la restauration (code de sortie %lu).\n%s
