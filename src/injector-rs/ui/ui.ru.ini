# Интерфейс лаунчера (русский). Пакет выпуска включает этот файл как ui.default.ini в соответствии с языком группы по умолчанию.
# Чтобы изменить текст, скопируйте ui.default.ini из этой папки в ui.ini и оставьте только нужные ключи. ui.ini не перезаписывается при обновлении.
[gui]
title=Port Royale 2 — лаунчер
subtitle=Среда локализации Port Royale 2
subtitle.version=Среда локализации Port Royale 2 v%d · %s
label.language=Языковой пакет:
button.launch=Запустить на выбранном языке
button.vanilla=Запустить оригинал
button.restore=Восстановить оригинал
button.refresh=Обновить
button.kill=Завершить процесс игры
status.count=Языковых пакетов: %d
status.count_pack=Языковых пакетов: %d · текущий %s
status.pack_stats=Строк: %d · без перевода: %d
status.pack_detail=Строк: %d · без перевода: %d · сводка %s
status.none=В PR2Localization\packs нет файлов .txt
status.launched=Игра запущена на выбранном языке.
status.steam=Запуск передан клиенту; язык записан в PR2Localization\packs\locale.ini.
status.vanilla=Оригинальная игра запущена.
status.restored=Оригинальные DLL хоста и шрифты восстановлены.
status.killed=Завершено процессов PR2.exe: %d.
hint.footer=Языковые пакеты находятся в PR2Localization\packs.\nЕсли игра зависает при выходе, завершите PR2.exe в этой папке.
confirm.kill=Принудительно завершить процессы PR2.exe (%d) в этой папке?\nНесохранённый прогресс будет потерян.
confirm.restore=Восстановить оригинальные DLL хоста и шрифты?\nПосле восстановления игра будет запускаться на английском, пока вы снова не выберете язык.
error.no_game=В этой папке не найден запущенный PR2.exe.
error.kill_failed=Не удалось завершить PR2.exe (ошибка %lu).
error.no_launcher=В этой папке нет PR2Localization.exe.
error.no_language=Языковой пакет не выбран.
error.launch_failed=Не удалось запустить PR2Localization.exe.
error.exit_code=Код выхода лаунчера %lu; игра не запустилась.\nПроверьте, что PR2Localization.exe / PR2LocalizationCore.dll лежат в той же папке.
error.font_missing=В PR2Localization\fonts\ нет шрифтов TTF.\nПри запуске будут использованы оригинальные латинские шрифты; русские буквы могут отображаться не полностью.\n\nВсё равно запустить?
error.pack_too_new=Для этого языкового пакета нужен более новый лаунчер (требуется среда v%d, сейчас v%d).
error.restore_failed=Не удалось восстановить (код выхода %lu).\n%s
