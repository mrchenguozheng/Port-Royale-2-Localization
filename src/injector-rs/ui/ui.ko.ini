# 실행기 UI(한국어). 배포 패키지는 그룹 기본 언어에 맞춰 이 파일을 ui.default.ini로 포함한다.
# 문구를 바꾸려면 같은 폴더의 ui.default.ini를 ui.ini로 복사하고 바꿀 key만 남긴다. ui.ini는 업데이트 때 덮어쓰지 않는다.
[gui]
title=Port Royale 2 실행기
subtitle=Port Royale 2 로컬라이제이션 런타임
subtitle.version=Port Royale 2 로컬라이제이션 런타임 v%d · %s
label.language=언어 팩:
button.launch=선택한 언어로 시작
button.vanilla=원본판 시작
button.restore=원본으로 복원
button.refresh=새로 고침
button.kill=게임 프로세스 종료
status.count=언어 팩 %d개
status.count_pack=언어 팩 %d개 · 현재 %s
status.pack_stats=%d개 항목 · 미번역 %d
status.pack_detail=%d개 항목 · 미번역 %d · 요약 %s
status.none=PR2Localization\packs에 .txt가 없습니다
status.launched=선택한 언어로 게임을 시작했습니다.
status.steam=클라이언트에 실행을 넘겼고, 언어는 PR2Localization\packs\locale.ini에 기록했습니다.
status.vanilla=원본 게임을 시작했습니다.
status.restored=원본 호스트 DLL과 원본 글꼴을 복원했습니다.
status.killed=PR2.exe 프로세스 %d개를 종료했습니다.
hint.footer=언어 팩은 PR2Localization\packs에 있습니다.\n종료 시 멈추면 이 폴더의 PR2.exe를 종료하세요.
confirm.kill=이 폴더의 PR2.exe 프로세스 %d개를 강제 종료할까요?\n저장하지 않은 게임 진행 상황은 사라집니다.
confirm.restore=원본 호스트 DLL과 원본 글꼴을 복원할까요?\n복원 후에는 다시 선택한 언어로 시작할 때까지 게임이 영어로 실행됩니다.
error.no_game=이 폴더에서 실행 중인 PR2.exe를 찾지 못했습니다.
error.kill_failed=PR2.exe 종료 실패(오류 %lu).
error.no_launcher=같은 폴더에서 PR2Localization.exe를 찾지 못했습니다.
error.no_language=아직 언어 팩을 선택하지 않았습니다.
error.launch_failed=PR2Localization.exe 시작 실패.
error.exit_code=실행기 종료 코드 %lu, 게임이 시작되지 않았습니다.\nPR2Localization.exe / PR2LocalizationCore.dll이 같은 폴더에 있는지 확인하세요.
error.font_missing=PR2Localization\fonts\에 TTF 글꼴이 없습니다.\n그대로 시작하면 원본 라틴 글꼴을 사용하므로 한국어 글자가 빠질 수 있습니다.\n\n그래도 시작할까요?
error.pack_too_new=이 언어 팩에는 더 새로운 실행기가 필요합니다(런타임 v%d 이상, 현재 v%d).
error.restore_failed=복원 실패(종료 코드 %lu).\n%s
