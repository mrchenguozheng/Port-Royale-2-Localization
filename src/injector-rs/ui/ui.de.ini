subtitle.version=Port Royale 2 – Lokalisierungs-Laufzeit v%d · %s
label.language=Sprachpaket:
button.launch=In ausgewählter Sprache starten
button.vanilla=Original starten
button.restore=Original wiederherstellen
button.refresh=Aktualisieren
button.kill=Spielprozess beenden
status.count=Sprachpakete: %d
status.count_pack=Sprachpakete: %d · aktuell %s
status.pack_stats=Einträge: %d · unübersetzt: %d
status.pack_detail=Einträge: %d · unübersetzt: %d · Zusammenfassung %s
status.none=Keine .txt-Dateien in PR2Localization\packs
status.launched=Spiel in der ausgewählten Sprache gestartet.
status.steam=An den Client übergeben; Sprache wurde in PR2Localization\packs\locale.ini geschrieben.
status.vanilla=Originales Spiel gestartet.
