error.launch_failed=PR2Localization.exe konnte nicht gestartet werden.
error.exit_code=Launcher-Exit-Code %lu; das Spiel wurde nicht gestartet.\nPrüfe, ob PR2Localization.exe / PR2LocalizationCore.dll im selben Ordner liegen.
error.font_missing=In PR2Localization\fonts\ fehlen TTF-Schriften.\nBeim Start werden die originalen lateinischen Schriften verwendet; deutsche Sonderzeichen können fehlen.\n\nTrotzdem starten?
