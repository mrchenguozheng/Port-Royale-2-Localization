# Launcher-Oberfläche (Deutsch). Das Release-Paket legt diese Datei als ui.default.ini gemäß der Standardsprache der Gruppe bei.
# Zum Ändern des Texts ui.default.ini aus diesem Ordner als ui.ini kopieren und nur die gewünschten Keys behalten. ui.ini wird beim Update nicht überschrieben.
[gui]
title=Port Royale 2 – Launcher
