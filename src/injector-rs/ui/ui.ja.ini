# ランチャー UI（日本語）。配布パッケージはグループの既定言語に合わせて本ファイルを ui.default.ini として同梱する。
# 文言を変えるには、同ディレクトリの ui.default.ini を ui.ini にコピーし、変えたい key だけ残す。ui.ini は更新時に上書きされない。
[gui]
title=Port Royale 2 ランチャー
subtitle=Port Royale 2 ローカライズランタイム
subtitle.version=Port Royale 2 ローカライズランタイム v%d · %s
label.language=言語パック：
button.launch=選択した言語で起動
button.vanilla=オリジナル版を起動
button.restore=オリジナル版に戻す
button.refresh=再読み込み
button.kill=ゲームプロセスを終了
status.count=言語パック：%d 個
status.count_pack=言語パック：%d 個 · 現在 %s
status.pack_stats=%d 件 · 未翻訳 %d
status.pack_detail=%d 件 · 未翻訳 %d · 概要 %s
status.none=PR2Localization\packs に .txt がありません
status.launched=選択した言語でゲームを起動しました。
status.steam=クライアントに起動を引き渡しました。言語は PR2Localization\packs\locale.ini に書き込み済みです。
status.vanilla=オリジナル版を起動しました。
status.restored=オリジナルのホスト DLL とフォントを復元しました。
status.killed=PR2.exe を %d 個終了しました。
hint.footer=言語パックは PR2Localization\packs にあります。\n終了時に固まる場合は、このフォルダの PR2.exe を終了してください。
confirm.kill=このフォルダの PR2.exe を %d 個強制終了しますか？\n保存していないゲームの進行状況は失われます。
confirm.restore=オリジナルのホスト DLL とフォントを復元しますか？\n復元後は、再度選択した言語で起動するまでゲームは英語で起動します。
error.no_game=このフォルダで実行中の PR2.exe が見つかりません。
error.kill_failed=PR2.exe の終了に失敗しました（エラー %lu）。
error.no_launcher=同じフォルダに PR2Localization.exe が見つかりません。
error.no_language=言語パックが選択されていません。
error.launch_failed=PR2Localization.exe を起動できませんでした。
error.exit_code=ランチャーの終了コード %lu。ゲームは起動しませんでした。\nPR2Localization.exe / PR2LocalizationCore.dll が同じフォルダにあるか確認してください。
error.font_missing=PR2Localization\fonts\ に TTF フォントがありません。\nこのまま起動すると元のラテン文字フォントが使われ、日本語の文字が欠ける可能性があります。\n\n起動しますか？
error.pack_too_new=この言語パックには新しいランチャーが必要です（ランタイム v%d 以上、現在 v%d）。
error.restore_failed=復元に失敗しました（終了コード %lu）。\n%s
