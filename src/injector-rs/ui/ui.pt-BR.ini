error.no_language=Nenhum pacote de idioma foi selecionado.
error.launch_failed=Falha ao iniciar PR2Localization.exe.
error.exit_code=O iniciador saiu com o código %lu e o jogo não iniciou.\nVerifique se PR2Localization.exe / PR2LocalizationCore.dll estão no mesmo diretório.
error.font_missing=Faltam fontes TTF em PR2Localization\fonts\.\nContinuar iniciará com as fontes latinas originais, e o chinês pode exibir quadrados vazios.\n\nIniciar mesmo assim?
error.pack_too_new=O pacote de idioma exige um iniciador mais novo (runtime v%d exigido, v%d atual).
error.restore_failed=Falha ao restaurar (código %lu).\n%s
