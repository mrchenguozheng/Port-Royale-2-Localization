# 启动器界面（葡萄牙语 - 巴西）。发行包按分组默认语言选用本文件，改名为 ui.default.ini。
# 想改文案：复制同目录 ui.default.ini 为 ui.ini，只保留要覆盖的 key；ui.ini 不会被升级覆盖。
[gui]
title=Iniciador do Port Royale 2
subtitle=Runtime de localização do Port Royale 2
subtitle.version=Runtime de localização do Port Royale 2 v%d · %s
label.language=Pacotes de idioma:
button.launch=Iniciar no idioma selecionado
button.vanilla=Iniciar versão original
button.restore=Restaurar versão original
button.refresh=Atualizar
button.kill=Encerrar processo do jogo
status.count=%d pacotes de idioma
status.count_pack=%d pacotes de idioma · atual %s
status.pack_stats=%d entradas · %d não traduzidas
status.pack_detail=%d entradas · %d não traduzidas · resumo %s
status.none=Não há arquivos .txt em PR2Localization\packs
status.launched=Jogo iniciado no idioma selecionado.
status.steam=Início entregue ao cliente; o idioma foi gravado em PR2Localization\packs\locale.ini.
status.vanilla=Versão original iniciada.
status.restored=DLL host e fontes originais restaurados.
status.killed=%d processos PR2.exe encerrados.
hint.footer=Os pacotes de idioma ficam em PR2Localization\packs.\nSe o jogo travar ao sair, encerre o PR2.exe deste diretório.
confirm.kill=Encerrar à força %d processos PR2.exe deste diretório?\nO progresso não salvo será perdido.
