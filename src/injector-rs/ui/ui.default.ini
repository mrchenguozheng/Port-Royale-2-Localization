# 启动器默认界面（简体中文）。发行包只带这一份，不再按语言包切换 UI。
# 想改文案：复制本文件为同目录 ui.ini，只保留要覆盖的 key；ui.ini 不会被升级覆盖。
[gui]
title=Port Royale 2 启动器
subtitle=Port Royale 2 本地化运行时
subtitle.version=Port Royale 2 本地化运行时 v%d · %s
label.language=语言包：
button.launch=以所选语言启动
button.vanilla=启动原版
button.restore=还原 Steam 原版
button.refresh=刷新
button.kill=结束游戏进程
status.count=%d 个语言包
status.count_pack=%d 个语言包 · 当前 %s
status.pack_stats=%d 条 · 未译 %d
status.pack_detail=%d 条 · 未译 %d · 摘要 %s
status.none=PR2Localization\packs 里没有 .txt
status.launched=已以所选语言启动游戏。
status.vanilla=已启动原版游戏。
status.restored=已还原 Steam 原版 DLL 与原版字体。
status.restore_gog=这是 GOG 版，没有需要还原的宿主 DLL。
status.killed=已结束 %d 个 PR2.exe 进程。
hint.footer=语言包位于 PR2Localization\packs。\n退出卡死时，结束本目录 PR2.exe。
confirm.kill=要强制结束本目录的 %d 个 PR2.exe 进程吗？\n未保存的游戏进度会丢失。
confirm.restore=要还原 Steam 原版 DLL 和原版字体吗？\n还原后游戏以英文启动，直到你再次以所选语言启动。
error.no_game=没有找到本目录正在运行的 PR2.exe。
error.kill_failed=结束 PR2.exe 失败（错误 %lu）。
error.no_launcher=同目录下找不到 PR2Localization.exe。
error.no_language=还没有选择语言包。
error.launch_failed=启动 PR2Localization.exe 失败。
error.exit_code=启动器退出码 %lu，游戏没有启动。\n检查 PR2Localization.exe / PR2LocalizationCore.dll 是否在同目录。
error.font_missing=PR2Localization\fonts\ 缺少字体 TTF。\n仍然启动会使用原版拉丁字体，中文可能缺字。\n\n仍要启动吗？
error.pack_too_new=语言包需要更新的启动器（要求运行时 v%d，当前 v%d）。
error.restore_failed=还原失败（退出码 %lu）。\n%s
