error.launch_failed=啟動 PR2Localization.exe 失敗。
error.exit_code=啟動器退出碼 %lu，遊戲沒有啟動。\n檢查 PR2Localization.exe / PR2LocalizationCore.dll 是否在同目錄。
error.font_missing=PR2Localization\fonts\ 缺少字體 TTF。\n仍然啟動會使用原版拉丁字體，中文可能缺字。\n\n仍要啟動嗎？
error.pack_too_new=語言包需要更新的啟動器（要求運行時 v%d，當前 v%d）。
error.restore_failed=還原失敗（退出碼 %lu）。\n%s
