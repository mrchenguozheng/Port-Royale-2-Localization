label.language=語言包：
button.launch=以所選語言啟動
button.vanilla=啟動原版
button.restore=還原原版
button.refresh=刷新
button.kill=結束遊戲進程
status.count=%d 個語言包
status.count_pack=%d 個語言包 · 當前 %s
