# 啟動器介面（繁體中文（香港））。發行包按分組預設語言選用本檔案，改名為 ui.default.ini。
# 想改文案：复制同目录 ui.default.ini 为 ui.ini，只保留要覆盖的 key；ui.ini 不会被升级覆盖。
[gui]
title=Port Royale 2 啟動器
