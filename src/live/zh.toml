"0x077030da" = "恭喜！ 你已成功完成这个剧本， 现在对海战和攻港都有所体会了。<n><n>袭击另一支船队前， 务必确认护航船已武装妥当。 当然， 决定打哪支船队之前也要仔细权衡。 来自欧洲的运输船队和军事船队一向非常强大， 海盗有时也会变成难缠的对手。<n><n>如果没先从某国总督手里拿到私掠许可证就袭击商人， 这会严重影响你在所有国家的关系。 最坏的情况是， 强大的军事船队会追猎你的船队。<n><n>一句忠告： 如果 你俘获一支商船队而不击沉它的船、 只是洗劫， 对声望的负面影响会小得多。"
