"0x05ae35b1" = "很好！ 现在去拜访 皇家港的西班牙副王， 接受一项攻占法国城镇的任务。<n><n>通常你得攻占两座城镇， 副王才会赏你一块地。 不过 在本剧本中你有点额外的优待， 只需为西班牙攻占一座城镇。<n><n>攻哪座城镇由你决定。 最好挑一座港口炮最少的城镇。 眼下最理想的目标之一是法国城镇 @T$SampleTown$。<n><n>作为攻占城镇的回报， 副王会赏你一块地。 注意： 你的等级至少要达到水手长等级才能与副王对话。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>拜访 皇家港的西班牙副王并接受攻占城镇的任务。 完成这个任务后， 就能收下他送的土地。"
