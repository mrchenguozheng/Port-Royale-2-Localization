"0x0eb34b66" = "在这个剧本里， 你将学会如何开设产业， 以及 为此需要考虑哪些因素。 你还会为新来的工人建造居住区。<n><n>在 Port Royale 2 中， 你可以在任何一座你已购得建造许可的城镇里动工。 你的许可越多， 下一张就越贵。 你在游戏开局所在的那座城镇里已经有一张许可， 所以 可以立刻开始在那里建造新建筑。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在 圣玛尔塔 建造一座可可生产设施和一座居住区。"
"0x0ede126a" = "现在你已经知道海战是怎么打了。 你也可以攻打整座城镇， 将其洗劫一空， 或 代表他国予以占领。 但 要这么做， 你得拥有由强力舰船组成的大型船队。 可以想象， 攻打一座城市会严重损害你与该国的关系， 而 它的军事船队此后也会一路追猎你。<n><n>你也可以选择攻打海盗巢穴。 海盗巢穴通常设在隐秘地点， 但 这些地点在游戏进程中的某个时刻都会为人所知。 届时你就可以像攻打城镇那样攻打海盗巢穴， 把整个海盗团一网打尽。<n><n>这些巢穴的防御强度， 取决于该海盗团逍遥法外的时长， 以及 他们的船队劫掠商船的成功程度。<n><n>这个剧本的最后一项任务， 是突袭一个小海盗窝。 去向 @T$TOWN$ 的总督打听巢穴的位置。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>摧毁 @P$PirateName$ 的海盗巢穴。"
