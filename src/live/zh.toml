"0x2875b307" = "%1 %2 摧毁了海盗 %3 的一支船队。"
"0x28812f6e" = "听说你想检验一下自己作为海战指挥官的本事。 好， 我有个任务， 对你我都有好处。<n>此刻有两艘被遗弃的船在海上漫无目的地漂流。 我要你在它们威胁到我的商人之前把它们清除掉。<n>你接受这个任务吗？"
"0x28812f6f" = "现在来件难一点的。 有只小鸟告诉我， @P$PirateName$ 指挥的一支海盗船队正在海上游荡。 船队只有一艘船， 摧毁它对你来说应该不算太难。<n>你接受这个任务吗？"
"0x28812f70" = "你已经摧毁过 @P$PirateName$ 的一支海盗船队。 不过 一个海盗藏身处通常有好几支船队， 全都由 @P$PirateName$ 指挥。 要彻底除掉一个海盗团伙的头目， 只能找到并摧毁他们的藏身处。<n>又一支由 @P$PirateName$ 指挥的船队出现了。 这支船队有两艘船， 开战前你必须做好准备。<n>你准备好了吗？"
"0x2883fdae" = "你可以率领一支船队从海上攻击这个海盗藏身处。 你必须先消灭港口里的所有船只。"
"0x289d1ced" = "每日消耗"
"0x28b1f98d" = "%1 %2 你还持有许可证， 可在 %3 建造房屋、 开办产业， 并且 你已在该城镇拥有一座仓库。<n><n>你年轻且缺乏经验， 目前只达到见习水手等级， 因此 还不能指挥更多商船队， 也不能在其他城镇再购买建造许可证。<n><n>你的等级由总资产决定， 包括现金与船只等财产， 目前约为 %4； 总资产达到 %5 时， 你就会晋升下一级。<n><n><n>祝你好运！"
