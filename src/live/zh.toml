"0xdfb549a5" = "%1 的军事船队不足以守卫它的海域！ 那就立刻出发， 攻占一座城镇！！<n>我能指望你吗？"
"0xdfb9b5b7" = "太棒了！ 你现在有 @g$Gold$ 了。<n><n>每个国家都有军事船队， 用来保卫自己的城镇、 保护城镇周围的水域。 一个国家占领的城镇越多， 需要的军事船队就越多， 才能确保这些城镇都得到足够的保护。<n><n>一个国家若损失了一支军事船队， 其军事实力就会削弱。 由于 战争期间军事船队对敌国的城镇和船队相当激进， 一个国家时不时就会损失一支军事船队。 因 此， 欧洲方面会定期派出船队， 为该国家在新大陆的军事实力提供增援。<n><n>你可以在编年史的 「国家」 一栏查看某个国家的实力。 如果 一个国家被描述为 「虚弱」， 它的城镇就可以被攻占。<n><n>你现在要击败足够多的英格兰军事船队， 让英格兰的实力被评为 「虚弱」。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>击败足够多的英格兰军事船队， 让英格兰被评为 「虚弱」。"
