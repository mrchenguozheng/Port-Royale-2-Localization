"0xe10e4380" = "你的时间用完了， 但 并没有达成剧本的最终目标。<n><n>在自由模式中， 任何一位副王都可能把一座属于你的城镇赏赐给你。 但 这并不容易做到， 因为 你必须不断攻占城镇才能获得土地， 而 这自然会损害你与其他国家的关系。<n><n>这个剧本里你学到的所有城镇发展心得， 同样会帮助你在其他城镇开设店铺。 唯一的区别是， 你不必再为那些城镇的防守操心。"
