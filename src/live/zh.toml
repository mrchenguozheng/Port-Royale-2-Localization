"0x1b0a0b6d" = "你已经晋升为 「水手」。 从今天起， 你必须做点什么， 才能保住与该国的高声望。<n><n>提升声望的办法有： 贸易、 向教堂捐献、 筹办庆典、 清剿海盗， 以及 完成总督任务和私掠许可证。<n><n>若声望没有改善， 它每天都会略微下降。 注意： 你在某国城镇里建造的房屋数量， 决定了这套机制下声望能跌到多低。<n><n>声望既影响贸易价格， 也决定城镇给不给你派任务。 声望低了， 也得提防军事船队！"
