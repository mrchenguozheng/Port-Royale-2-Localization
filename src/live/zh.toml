"0x0d4fbd34" = "现在让你在 圣玛尔塔 和 卡塔赫纳的产业全速运转。<n>别忘了 卡塔赫纳的织造厂需要棉花持续供应。<n>继续交易， 卖出你生产的货物。<n>一旦你的现金增加到 @g$GoldGoal$， 本剧本即告结束。"
