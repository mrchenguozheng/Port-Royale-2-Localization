"0xd4cd0f3d" = "亨利·艾弗里 是成功海盗的典型范例。 他劫获了当时最富有的船只， 成功躲避当局追捕， 并且 活得足够久， 得以享受自己的财富。<n><n>艾弗里早年的经历笼罩在迷雾之中。 不过 我们知道， 1694 年 6 月， 他还是一艘名叫 「查尔斯」 号的私掠船上的大副； 该船获得西班牙方面许可， 可以缉拿西印度群岛法属 马提尼克 殖民地的船只。 一天， 他煽动哗变夺下这艘船， 大部分船员随即站在了他一边。 这是一艘快速私掠船， 装有 46 门火炮， 极适合改作海盗船， 随后被改名为 「范西」。 1695 年， 他完成了自己最壮举的战绩： 劫掠印度宝藏船队。 作为与其他海盗结盟的一部分， 他袭击了一支重装戒备的印度宝藏船队， 并 成功夺走两艘船。 这两艘船属于莫卧儿皇帝本人， 船上满载着难以想象的财富。<n><n>在买通巴哈马总督为海盗提供庇护之后， 艾弗里付清了船员工钱， 船员们随后四散天涯。 其中一些人在英格兰被捕， 但 艾弗里航往爱尔兰， 从此杳无音讯。 我们只能推测， 他此后一直在隐居中享受自己的财富。"
"0xd4cd0f3e" = "有史以来最受欢迎的海盗之一， 是 爱德华·蒂奇 （卒于 1718 年）， 也就是黑胡子。 正如其名所示， 他的标志特征是那条骇人的黑色辫须。 他率领 300 名船员， 驾着 「安妮女王复仇号」 在公海上驰骋—— 那是一艘改装的荷兰商船—— 面对皇家海军战舰也毫无惧色。<n><n>在 18 个月里， 蒂奇大肆劫掠， 主要在西印度群岛北部和北美沿岸。 他总能在巴哈马和贫困的北卡罗来纳找到藏身之处。<n><n>黑胡子之所以如此出名， 还有一个原因： 他完美契合了那个可怕、 热血又暴躁的私掠者刻板印象。 据说他的炮手 以色列·汉斯 被他连开两枪打伤， 理由无非是要提醒其余船员， 这里谁说了算。<n><n>他的末日直到 1718 年才到来， 当时的捕海盗人 罗伯特·梅纳德 追踪到了他的单桅帆船。 尽管 已经烂醉如泥， 蒂奇仍像恶魔一样战斗， 经过苦战才被击败。 他战死沙场， 幸存船员中的大部分被处以绞刑。"
"0xd4cd0f3f" = "在地理大发现的头几年， 那些想让既有财富增值的人发现， 自 16 世纪初以来主要在加勒比地区开发起来的糖种植园， 提供了极好的投资机会。<n><n>这些投资的平均回报率为 10%， 而在最好的情况下 （例如 1650 年前后的 巴巴多斯） 甚至 可达 50%！ 自然， 这些种植园需要大量劳力， 于是 数十万奴隶从非洲被运往那里。 这是因为白人此时已在许多地方几乎把美洲原住民屠戮殆尽。<n><n>欧洲人自己受不了这种气候； 除此之外， 他们也远远体面， 不肯干这种驴一样的粗活。 就连种植园主也更愿意住在伦敦或马德里， 派几个手下去殖民地组织劳作。 到 18 世纪， 某些岛屿的人口中黑人比例已达 90%！"
"0xd4cd0f40" = "「黑色黄金」 的买卖早在 16 世纪初就已开始。 奴隶贩子偏爱的 「货物」 来源， 是西非从塞内加尔河延伸到今日喀麦隆之间的海岸。 这一地区不仅在运输上位置得天独厚， 还具备稳定的经济与社会政治基础设施。 这意味着水手们不必自己去猎捕奴隶， 而是可以向当地酋长或其他奴隶贩子买下他们的受害者。<n><n>15 至 35 岁的年轻男子尤其抢手， 因为 他们注定主要要被送进种植园从事苦役。 大约每五个奴隶里就有一个连横渡都撑不过去， 而 航程最长可达六周。 有些人死于主人施加的野蛮折磨， 另一些人则葬身海上事故。 考虑到如此高的死亡率， 奴隶贩子便想方设法让每次航行尽可能赚钱， 往船上尽可能多地塞进奴隶。 一连几个星期， 这些可怜的生物像罐头里的沙丁鱼一样肩挨肩躺着， 彼此锁在一起， 置身黑暗之中， 空气稀薄得几乎无法呼吸。<n><n>在这种条件下， 他们之中居然有人能活着走完这段航程， 几乎难以置信！"
"0xd4cd0f41" = "尽管北美和中美洲没有白人奴隶， 却 有大量欧洲人发现自己的劳动条件与奴隶相差无几。<n><n>许多年轻男子 （大多来自未受教育的底层阶级） 想移民， 却 没钱支付横渡的费用。 于是 他们借钱支付船款， 约定日后再到糖种植园 （或类似的地方） 做工一段时间来还债。<n><n>然而， 这份看似完全合理的安排也有陷阱： 许多种植园主在他们受雇期间使足了劲压榨他们。 更别提加勒比的气候， 大多数欧洲人都难以忍受。<n><n>这种 「契约劳工」 制度也被频繁用于那些被逐出本国的囚犯。 英国人后来也用过这一手段， 最突出的例子是对付印第安人—— 他们强迫印第安人在非洲殖民地劳作。"
"0xd4cd0f42" = "随着美洲殖民地繁荣起来， 跨大西洋的贸易也随之兴盛。 自伊丽莎白女王时代以来最强大的航海国家大不列颠， 对管控货物流动怀有浓厚兴趣， 好让本国经济分得贸易利润。<n><n>在护国公 奥利弗·克伦威尔 治下， 1651 年的 《第一航海条例》 规定只有英国船只才能把货物从殖民地运往欧洲。 这项措施主要针对正在崛起的荷兰， 并 让本国商船队受益。<n><n>1663 年， 该条例的规定变得更严： 殖民地船只若想把货运往欧洲， 必须先到英国港口停靠并缴纳税费。 然而， 这种管控殖民地贸易的企图很快搁浅了。 英国陆军根本不可能监视整条海岸线， 结果走私贸易反而蓬勃发展起来。<n><n>正是这种围绕货物进出口条件的持续冲突， 使殖民者在尤其是在北美殖民地逐渐形成了独立的认同， 日后成为独立运动的一项重要推动力。"
"0xd4cd0f43" = "殖民时代伊始， 也带来了众多健康问题—— 这些在地中海或沿岸那些短得多的航程中基本不会遇到。 前往加勒比和北美殖民地的横渡要花上一到两个月， 遇上风暴或无风的时段还更久。 因此 要克服的困难并不出人意料： 肮脏衣物与个人卫生不良的恶臭、 受污染而腐败的食物、 清洁水源的缺乏、 船上的老鼠， 以及 单调生活和幽闭恐惧带来的心理压力。 坏血病的可怕阴影笼罩着每一个海员： 这种由维生素缺乏引起的疾病， 表现为脱发和掉牙， 夺去了许多水手的性命。 最先成功治疗此病的是环球航行者 詹姆斯·库克 （1728-1779）。 他不仅坚持把船保持干净， 还给船员提供酸菜和新鲜水果。 上岸的人还得应付黑尿热这类热带疾病， 它是疟疾最危险的表现形式之一： 这种感染的症状包括脉搏加快、 发热、 发抖和尿液颜色加深， 几乎总是致命。"
"0xd4cd0f44" = "航海家和制图师为新发现的大片陆地、 河流和聚落想出的众多地名背后， 藏着许多有趣的轶事。 甚至 连大航海时代的欧洲探险家们为美洲各地取的第一批名字， 也各自讲述着一段故事。 1492 年 10 月 12 日， 克里斯托弗·哥伦布 把他登陆的那座岛命名为萨尔瓦多 （意即 「救世主」）。 这是为了感谢上帝在远航途中护佑船队免受疾病与风暴侵袭， 尤其是感谢祂在最紧要关头—— 就在陆地望见的前一刻—— 阻止了一场即将爆发的哗变。<n><n>在此之后的日子里， 西班牙征服者们大多选择带有宗教含义的名字， 例如 「上帝之镇」 （Nombre de Dios） 或 「三位一体」 （Trinidad）。 有时人们也会从日期出发， 或 根据自己对地貌的观察来命名。 例如 葡萄牙水手在1502 年元旦发现巴西海岸的一处海湾， 便把它命名为 「一月之河」 （Rio de Janeiro）； 而 蒙得维的亚这个名字， 则源自麦哲伦据说第一次望见海岸时那句惊呼： 「Monte vido eu！」 （ 「我看见一座山！」）<n><n>探险家们还常常习惯性地用他们的统治者、 母国或故乡城镇来为远方的土地和城镇命名。 这不仅向外界清楚地宣示了领土归属， 也让他们即使身处这些偏远的土地上， 仍与自己的祖国保持着一份联系。<n><n>实在无计可施时， 人们总还能退回到当地原住民的语言上去取名 （尽管在多数情况下， 这并没有阻止殖民者事后把原住民赶走或灭绝）。<n><n>直到今天仍流传着这样一个神话： 詹姆斯·库克 问一名澳大利亚原住民那种奇特的袋兽叫什么， 对方回答说 「kangooroo」 或 「ganguru」 —— 据说这个词其实只是 「你在说什么？」 的意思。 即便这只是个神话， 这类令人忍俊不禁的误解肯定确实发生过。<n><n>人们大概会惊讶于， 城镇、 山脉与河流的众多名字， 其实就意味着 「早上好！」 「对不起， 请再说一遍？」 或者 「别来烦我！」 ……"
"0xd4cd0f45" = "随着一个横跨全球的西班牙帝国崛起， 有必要设立拥有足够权力的殖民当局， 既处理日常行政事务， 也应对任何可能突然出现的危机。 为此， 殖民地里最重要的总督被授予了 「副王」 （viceroy） 的头衔。<n><n>在世界帝国的鼎盛时期， 这样的大员有两位， 分别驻于新西班牙 （墨西哥） 和秘鲁。 新格拉纳达与拉普拉塔两个副王区则在18 世纪增设。<n><n>副王 （西班牙语亦称 virrey） 的职责是与一个叫作 Audiencia 的行政委员会共同履行 （且常常发生冲突）， 内容包括政府官员的日常事务： 征收与催缴税款、 确保民众遵守法律、 组织殖民地防务等等。 他还负责保护美洲原住民人口， 并 任命较低一级的教会与世俗官员。<n><n>由于海外属地具有极大的经济与政治重要性， 王室始终对其副王的动向严加监视。 他们被禁止从事任何能带来额外收入的商业活动。 除此之外， 副王之间的竞争只会导致彼此权力的相互掣肘。"
"0xd4cd0f46" = "欧洲征服者总是追逐白银与黄金的召唤， 这早已是众所周知的常识。 然而 几乎比金银更有价值的， 却是香料。 若想到人们甘冒何等危险只为获取一小撮胡椒或肉豆蔻， 就很难想象中世纪欧洲的饮食该是何等寡淡。<n><n>在这方面， 发现美洲一开始令人极度失望。 人们怀着兴趣打量 克里斯托弗·哥伦布 带回家的奇异动物， 为本国疆域的扩张和想象中基督教传播将拯救的众多灵魂而欣喜。 然而 黄金之山远比许诺的更难寻觅。 这些航程要到十至二十年后才真正获利—— 那时美洲的白银才如洪流般涌入欧洲。<n><n>在这些航程中的一次， 哥伦布带回了一件比全世界所有金银都更珍贵的宝物： 1492 年 11 月 4 日， 原住民送给他一样东西， 他形容那像苹果、 味道却像栗子。 就在那一刻， 他成了第一个吃土豆的欧洲人！ 这种植物的印第安语名称是 「batate」， 而 它以 「potato」 之名一直存活至今的英语里。<n><n>我们今天视为理所当然的许多东西， 也都是哥伦布及其后继者最早带到欧洲的： 烟草、 番茄、 玉米， 以及 吊床。 用美洲原住民的话说， 就是 「hamaka」 （英语的吊床一词即由此而来）。"
"0xd4cd0fae" = "新世界的发现一经宣布， 便点燃了欧洲人的想象力。 这些未经探索的土地上究竟藏着什么样的生灵？ 各种最难以置信的传闻四处流传： 据说有一座岛上遍是食人族， 另一座岛则住着无头怪， 它们的脸长在肚子上。<n><n>南美洲巴塔哥尼亚的地名大致可译为 「大脚者的土地」， 而 亚马逊河的名字则源于一支女战士族群—— 据说她们让探险者想起了希腊神话中类似的女性战士。<n><n>这些传闻中有些确有事实依据， 另一些则源于误解与误读， 或是原住民自己不知从哪儿听来的故事。<n><n>不过， 这些传闻中有许多不过是人们丰富想象力的产物； 而 更多时候， 人们之所以相信它们， 只因为他们愿意相信。 这就解释了为什么一代又一代的征服者会去寻找传说中的青春泉、 伊甸园， 以及 黄金之城埃尔多拉多。 原住民非但没有纠正他们的迷思， 反而 不断鼓励—— 总是向他们保证说自己听说过某个地方； 他们不过是想拖延时间， 好把这些贪婪的白人诱到内陆深处， 与他们的船只断绝联系。"
"0xd4cd0faf" = "在一份群英荟萃的探险家与征服者名单中， 最耀眼的人物之一， 是英国作家兼冒险家 沃尔特·雷利 爵士 （约1554 — 1618年）。 他于1580 年首次崭露头角， 当时他平定了爱尔兰反叛者针对英格兰占领的起义。<n><n>他成了伊丽莎白一世女王的宠臣， 并 借助自己的影响力出资资助了一场远征， 去寻找南美洲那座传说中的黄金之城埃尔多拉多。 尽管 数次远征搜寻有价之物都以彻底失败告终， 他却凭着独特的说服力， 保住了伦敦那些出资人的支持。 他让他们相信， 最丰厚的奖赏永远就在下一个河口的那一边， 而 他现在无论如何都不可能放弃。<n><n>然而他的信誉最终还是走到了尽头。 人们听了太多他那些不切实际的承诺， 后来才发现不过是一派空言。 雷利终于失宠于伊丽莎白。 她的继任者詹姆斯一世视这位热血冒险家为对自己较为温和的对外政策的威胁， 几乎没抓到什么把柄便将其逮捕， 并 在即位后不久判处他死刑。 判决后来被改为了缓刑 （注意， 并没有被撤销！）， 雷利被囚禁在伦敦塔中。<n><n>多年之后， 当国家财政的状况促使国王认为有必要时， 他准许 沃尔特·雷利 爵士率领另一次远征前往圭亚那。 这是个荒谬的处境： 把一个自己已被判死刑的人， 赋予决定他人生死的权力， 再派出去寻找黄金！ 不过 这个矛盾不久便自行化解了—— 此时已被热病折磨的雷利， 活着看到了他的最后一次远征以失败告终。<n><n>回到英格兰后， 怒不可遏的国王认定： 雷利在1603 年获得的缓刑如今该结束了。 不久之后， 沃尔特·雷利 爵士被处决。"
"0xd4cd0fb0" = "新大陆的原住民与白人航海者之间的最初接触， 一般来说都是和平的。 在许多地方， 欧洲人被当作神祇般迎接。 这种印象的来源， 一部分来自古老传说， 但 更多时候， 只是因为那些金发高个的陌生人乘坐熠熠生辉的 「水上房屋」 （船只） 而 来， 让原住民惊骇不已。<n><n>哥伦布、 科尔特斯以及所有其他探险家， 都乐见其成地维持着这个误会， 但 原住民很快就面对了残酷的事实： 西班牙人被永无止境的黄金欲所驱动， 一场原住民称之为 「西班牙病」 的噩梦就此展开—— 他们凌虐、 奴役并屠杀整族整族的人口。 美洲此前从未见过马匹—— 那高头大马的模样； 火炮的轰鸣更令人失声惊惶。 幸存下来的那些人也很快死于天花、 流感， 或 其他某种被带进来的疾病。<n><n>贡萨洛·奥维耶多、 胡安·德·塞普尔维达之类的名士， 曾试图用骇人听闻的种族主义论调为欧洲人所犯的罪行开脱， 把美洲原住民的种族描绘成卑劣、 无知且低人一等。<n><n>同样这些人—— 他们曾因为他人的信仰而把科学家和女巫绑上火刑柱， 也深谙炮制骇人听闻的 「野蛮习俗」 故事之道： 偶像崇拜、 活人献祭和食人这些做法固然并非虚构， 但 从今以后， 白人却干脆把这一整套清单当作一张万能的免责声明， 用来为对原住民施加各种最残暴的惩罚开脱。"
"0xd4cd0fb1" = "众所周知， 美洲殖民的早期阶段是由西班牙和葡萄牙开启的。 后来加入的是荷兰， 而 最重要的是英格兰与法国。 但 鲜为人知的是： 若不是那些财力雄厚的德国金融赞助者， 西班牙的许多次远征根本不会成行。<n><n>到 1500 年， 上施瓦本和奥格斯堡已发展成为欧洲最重要的贸易与金融中心之一。 福格与韦尔泽两家的商人家族， 从这里对世界政治施加着强大的影响。 例如， 正是他们大量的资金支持， 帮助西班牙的 卡洛斯 国王于 1519 年成为德国皇帝。 英格兰的亨利八世国王和多位教宗， 都很乐于把 「富有的」 雅各布·福格 算作自己的朋友。<n><n>这些精明的商人当然也有自己的私下盘算。 作为回报， 他们期待获得特权， 或 获准参与王室的白银开采。 韦尔泽家族甚至一度取得了委内瑞拉北部海岸的一部分， 在那里建起了 「新奥格斯堡」 这样的城镇， 并 从那里派出多支探险队， 深入内陆寻宝 （大多一无所获）。"
"0xd4cd0fb2" = "西班牙王室在征服了半个地球之后， 发现自己享有一种独特的机会。 在长达几个世纪的时间里—— 直到印加、 玛雅与阿兹特克这些伟大美洲文明的消亡， 以及 后来在秘鲁和墨西哥发现巨型银矿藏为止—— 西班牙的地位看上去坚不可摧。 然而 恰恰是这份庞大的财富， 促成了这个世界强国的衰落， 这几乎显得荒谬。<n><n>用船运回西班牙的财宝中， 很大一部分直接流进了比利牛斯山以北那些商人的口袋—— 正是他们出资资助了这些航程。 但 剩下的部分， 仍足以把伊比利亚半岛的物价推高。 那里的人开始过着入不敷出的生活： 在一个把大规模排场看得比平衡国家预算更重要的年代， 人们根本不怎么理会那些琐碎的财务问题。<n><n>商品以越来越多的数量乘外国船运来， 因为 人们已经矫情到不肯自己生产这些东西了。 连前往美洲的探险队所需装备与给养， 也很少由本国商人提供。 人们自豪地感叹： 整个欧洲都在听命于西班牙。<n><n>然而白银的洪流终究会枯竭， 随之而来的当头棒喝， 活像通宵痛饮之后的那阵宿醉： 荷兰人和英国人正在把西班牙逐出公海。 针对新教 「异端」 和土耳其人的一场场宗教战争吞掉了巨额钱财， 而 这个日不落的庞大帝国已经长成一个无法治理的巨怪。<n><n>1557 年， 危机已为所有人所察觉： 西班牙的新君主菲利普二世被迫首次宣布国家破产。 这个曾经拥有比此前任何帝国都更多财富的大帝国， 穷了。"
"0xd4cd0fb3" = "为什么巴西说的语言是葡萄牙语， 而 南美洲几乎其他所有地方说的却是西班牙语？<n><n>这话说来话长。 西班牙人与葡萄牙人早已发现了沿非洲海岸通往印度的航路， 两国的目光都很快投向了海外。 双方各自警惕地监视着对方， 确保自己在追逐货物、 臣民与土地时， 不会侵占对方的势力范围。<n><n>由于当时根本不存在什么国际法， 一旦 发生冲突， 两国就去找教皇裁决—— 因为 他是唯一一个两国都愿意接受其权威的人。 就天主教教会而言， 它也乐见西班牙人和葡萄牙人热心推动对 「异教徒」 的基督教化， 而 不是把精力浪费在彼此为难上。<n><n>于是双方在托尔德西利亚斯 （1494 年） 与萨拉戈萨 （1529 年） 的联合谈判中达成协议： 某条经线以西新发现的领土归西班牙所有， 以东的所有领土归葡萄牙所有。 这条经线切过当时尚未被发现的南大陆， 于是 它东侧、 也就是今日巴西的一部分归了葡萄牙。"
"0xd4cd0fb4" = "「pirate」 （peirato） 这个词， 大概最早是罗马作家波利比乌斯在公元前 140 年前后提出的。 此后， 人们用过许多不同的词来指称这些可怕的海上恶徒： corsair、 freebooter、 buccaneer、 filibuster…… 克劳斯·施托特贝克尔 周围那帮人被称为 「维塔利安兄弟会」， 而 巴塞洛缪·罗伯茨 则给自己和那伙杀人刽子手取了个听起来无害无害的称号—— 「幸运绅士」。 可对那个商人来说， 出手的究竟是谁其实根本无所谓： 反正总有人会从虚空里冒出来， 袭击他的船。<n><n>世世代代以来， 私掠者都是人类在世界各地的祸害。 在古代， 西西里海盗在整个地中海制造了如此彻底的恐怖， 以至于罗马帝国不得不周期性地对他们发动讨伐。 那些隐蔽的岛屿与嶙峋的海岸线紧邻繁忙的贸易航线， 是海盗活动的绝佳据点： 在暗礁、 暗流与恶劣天气让笨重的商船轻易成为猎物的地方， 就有可供作案的巢穴， 犯下暴行之后可以迅速撤回去。 古代的小亚细亚海岸之可怕， 不亚于大航海时代的加勒比； 而 东南亚的海盗则近乎神话般的存在。<n><n>从词源上说， 「buccaneer」 原意是一个以私人身份出海、 而 非作为海军水手航行的海员， 为的是寻找战利品， 因此 被视为从事海盗活动。<n><n>然而， 私掠许可证的颁发， 让加勒比的某些私掠者看上去多少有了几分合法性。 这些文件由英国、 法国或荷兰的总督签发， 目的是把海盗之祸引向敌对势力。<n><n>私掠许可证容易到什么程度就能拿到， 取决于具体是哪位总督。 有的总督认为与海盗订立约定是不名誉的； 另一些则没那么讲究， 或者 干脆就是腐败或胆怯。"
"0xd4cd0fb5" = "所谓 「七大洋」， 其实只有三个 （即三大洋）： 北太平洋与南太平洋、 北大西洋与南西洋、 北冰洋与南极洋， 以及 印度洋。<n><n>太平洋的名字， 要归功于 费尔南多·麦哲伦 环球航行的壮举： 在横渡这片辽阔大洋的漫长而饥饿的日子里， 他运气极好， 一路遇上了好天气。<n><n>还有一点： 加勒比之名源自 「Karibe」 （或作 「Karaibe」）， 那是某个印第安语系民族的称呼， 他们的地盘从安的列斯群岛一路沿着南美洲北岸铺开。"
"0xd4cd0fb6" = "百慕大群岛得名于西班牙探险家 胡安·贝尔穆德斯， 他于 1503 年发现了它们。 而 那个所有航海人都耳熟能详的、 据说神秘海难事故发生率极高的恶名区域—— 「百慕大三角」 —— 涵盖的是百慕大群岛、 波多黎各与劳德代尔堡 （佛罗里达） 之间的一片海域。<n><n>有些人坚持认为， 这一连串离奇事件要从 克里斯托弗·哥伦布 的航程算起： 1492 年 9 月 14 日， 这位为西班牙效力的热那亚航海家发现自己的三艘船正好位于这片海域， 而 他的罗盘指针此时开始疯狂旋转。 这是地理北极与磁北极之间的差异造成的。 第二天， 天空中出现了一道巨大的火焰 （可能是流星）。<n><n>然而 「百慕大三角」 这个称呼其实是在第二次世界大战之后才出现的： 接连发生的一系列飞机失事事故， 才把公众的注意力引向北大西洋西南部的这片海域。<n><n>这些离奇事件的信徒列举了两百多起所谓无法解释的事故， 不过 他们对边界划得颇为宽松。 这些事件中的大多数—— 其中相当多甚至压根没发生在这一带—— 都有完全合理的解释。"
"0xd4cd0fb7" = "那支定期从美洲驶往西班牙的传奇西班牙珍宝船队， 在伊比利亚半岛之外也激起了各式各样的贪念。 主要是雄心勃勃的英格兰看到了一个机会， 要与西班牙争夺海上霸主和世界女王的地位。<n><n>这个岛国当时还没有强到足以投入大规模军事行动， 因此 把战场摆到欧洲之外的遥远地方要明智得多—— 在那里， 她既不会料到遭人袭击， 也不会收到任何袭击的预警。 在那里， 你可以轻而易举地抢光受害者， 然后 从容消失， 欧洲几个月之内都不会听说这件事。<n><n>那些胆大的船长—— 其中最著名的是 弗朗西斯·德雷克 （1540 — 1596年） —— 由伊丽莎白一世女王亲自颁发私掠许可证。 这种私掠许可证形如一张空白支票， 是一份抢劫许可： 它把德雷克及其同伙凌驾于普通海盗之上， 使他们成为效忠更高权威的私掠男爵。 他们也把这份差事干得相当漂亮。 伊比利亚的船队与守军， 没有一处是安全的。<n><n>1578 年， 弗朗西斯·德雷克 穿越麦哲伦海峡， 像旋风一样沿着美洲太平洋海岸搜寻西班牙的财富。 此前从未有人胆敢这样做！ 1580 年他返回普利茅斯港时， 已成为继麦哲伦之后第二位环航世界的船长。<n><n>与此同时， 西班牙国王菲利普暴跳如雷， 援引了托尔德西利亚斯条约—— 教宗陛下曾在1494 年断然宣布西半球属于西班牙的势力范围。 可是， 对这个奇特的异教新教岛国而言， 这种抗议又能有什么作用呢？ 它完全拒绝承认罗马教宗的权威， 甚至 直到 1753 年才肯采用现代的格里高利历， 仅仅因为这套历法是教宗格里高利在 1582 年下令制定的。<n><n>又一次， 看来这件事只能靠战争来解决。 菲利普的无敌舰队于 1588 年驶向英格兰， 但 在此时已受封为爵士的 弗朗西斯·德雷克 爵士指挥下， 再加上几场来得正是时候的风暴相助， 英格兰人成功摧毁了西班牙舰队。 在此后数百年的时间里， 再也没有人敢挑战大不列颠作为海上霸主地位。"
"0xd4cd101f" = "克里斯托弗·哥伦布 （1451 — 1506年） 前往美洲的航程， 无疑位列人类所进行过的最伟大冒险之中。 即便是作家， 也几乎不敢想象出这样一部由戏剧性事件与离奇巧合构成的故事。<n><n>这位热那亚航海家虽然说服了西班牙王室夫妇 伊莎贝拉 与斐迪南， 相信存在一条通往印度的西行航路， 却 显然无法指望船上的船员们会同意。 事实上， 大多数船员都是被强征来的： 作为对王室不敬行为的惩罚， 帕洛斯城被迫提供两艘船和船员。<n><n>哥伦布计划的消息引发了种种惊恐的议论。 船员们坚信， 他们是在一个疯子的指挥下航行， 这个人只会给他自己以及所有跟他一起出海的人带来毁灭。<n><n>然而， 哥伦布最大的敌人是迷信： 各种能想象到的恐怖故事似乎都混上了船， 任何怪异的或不祥的事件只会加深水手们的恐惧—— 驶过特内里费岛时火山喷发， 随后他们看到天空中出现火柱， 甚至 连罗盘的指针都像是在跟船员们耍花招。 船只若遇风平浪静， 就被视为不祥之兆。 反过来， 如果 他们进展顺利， 就意味着风总是从东往西吹， 他们永远都无法掉头返航。<n><n>很多次， 哗变似乎都不可避免。 一天夜里， 船长听见舱外有脚步声和低声咒骂， 直到他开始大声祈祷， 那些刺客才失去勇气， 悄悄溜走。<n><n>最严重的危机总是发生在这样的时刻： 地平线上那个被当成岛屿的东西， 结果又一次不过是一场海市蜃楼。 10 月 10 日发生的正是这样一件事， 把事情推到了紧要关头。 哥伦布费尽周折谈成了一个最后通牒： 三天之后， 船员们就要调头返航 （最好是不带船长一起）。 然而 命运另有安排： 他们确实在这三天里看见了陆地。 在场的人谁也想不到， 他们找到的不是亚洲， 而是一块全新且未知的大陆。<n><n>日本与中国仍在数千海里之外， 若非命运之神给了他们难以置信的好运， 让一块外来大陆恰好横在航路上， 哥伦布的远征早已全军覆没。 船员的士气立刻大振。 他们谁也再也想不起自己曾有过哗变的念头……"
"0xd4cd1020" = "克里斯托弗·哥伦布 确实发现了一块新大陆—— 更准确地说， 是重新发现了它， 因为 中世纪时维京人早已踏上过美洲的土地。 但 他错误地宣称， 自己发现的是一条通往印度的航路。<n><n>在准备他那四次航行中的第二与第三次时， 这位热那亚人与来自佛罗伦萨的 亚美利哥·韦斯普奇 合作。 正是后者最先提出： 西边这些土地其实属于一块全新且未知的大陆。 这一惊人的判断重新点燃了公众的兴趣， 从此每逢谈起这些新领土， 人们必然会提到韦斯普奇这个名字。<n><n>相比之下， 哥伦布的星光正在黯淡。 与此同时， 他甚至因加勒比殖民者的控诉被押上锁链送回国内； 1506 年， 他这个满腹怨气又身染重病的人就此死去， 却 并没有得到应有的关注。 因 此， 一年后当南德意志制图师 马丁·瓦尔德泽米勒 要为这些未知土地想出一个名字时， 转而取材于那个当时广为流传的名字 「 亚美利哥·韦斯普奇」， 也就不足为奇了。<n><n>瓦尔德泽米勒拟定的名字被同行采纳了。 不过， 若把那块大陆命名为 「哥伦比亚」， 本会更公平一些。"
"0xd4cd1021" = "在西班牙统治下最先取得重要地位的美洲地区， 是伊斯帕尼奥拉岛。 克里斯托弗·哥伦布 早在 1493 年就在这里建立了第一座欧洲殖民点， 尽管 在他从欧洲返回之前， 这地方就已经被原住民夷为平地。<n><n>在此之后的日子里， 西班牙王室逐步加强了对这座岛屿的控制。 第一座修道院和第一座主教座堂建了起来， 日后将被推广到其他地区的社会制度， 也正是在这里初步成形： 一个蓄奴的社会， 等级划分极为严格， 与天主教会紧密结合。<n><n>伊斯帕尼奥拉似乎提供了巨大的机会， 吸引了许多雄心勃勃的移民渡海而来。<n><n>然而没过多久， 西班牙就把目光转向了别处： 此时大陆上的那些宏大国度已经被发现并征服了。 在这里统治更容易， 金银矿藏也更富、 更易开采。<n><n>伊斯帕尼奥拉就像一件被丢到一旁的玩具， 人们对它失去了兴趣。 荷兰、 英国和法国的海盗轮番发起攻击。 1697 年， 法国人控制了岛上的西部 圣多明各 （今日海地）， 并 建立起了赚钱的种植园经济。 可可、 糖、 靛蓝、 棉花和咖啡的产量， 让 圣多明各 在 18 世纪成为新世界最赚钱的殖民地。<n><n>历史上唯一一次成功的奴隶起义， 起因是法国大革命， 最终导致海地在 1804 年独立。 起义者对待昔日压迫者的方式， 与压迫者当初对待他们的方式如出一辙： 「为了宣布独立， 我们需要一张白人的皮当羊皮纸， 用他的颅骨作墨水瓶， 用他的血作墨水， 再用一把刺刀作笔——」 黑人将军布瓦隆-东内尔当时这样宣布。"
"0xd4cd1022" = "朗姆酒是加勒比的典型产物， 尽管 它对人类是否真有好处很值得怀疑。 这种用甘蔗糖蜜酿成的烈酒， 最初有个耸人听闻的名字—— 「撒旦杀手」， 早在 1650 年就已在 巴巴多斯 被人提及。 作为海盗传奇性的首选饮品， 大多数人都会把朗姆酒与牙买加岛联系起来， 它曾是最令人胆寒的海盗巢穴之一。<n><n>奴隶贩子把他们在非洲海岸买来的人口货物， 在加勒比大量换成糖蜜。 这些糖蜜在新英格兰被蒸馏成朗姆酒， 然后 又由同一批船运回非洲。 烈酒在非洲就地卖掉， 空船再装上新鲜的一船奴隶。 通过这套致命的 「三角贸易」， 船主们确保自己的船在每一次航程中都是满载。"
"0xd4cd1023" = "除古巴之外， 牙买加大概是加勒比最著名的岛屿了。 它的名字源自阿拉瓦克语中的 Xymaca， 大致意思是 「森林与水之乡」。 九年前亲手发现该岛的 克里斯托弗·哥伦布， 在 1503 年船只于北岸失事时， 有充分机会体验这里的风光之美与居民的友善。<n><n>他喜爱此地至此， 竟把整座岛屿的所有权从西班牙国王手里转到了自己名下， 宣布归己所有。 尽管 如此， 在接下来的几十年里， 这座天堂般的岛屿一直无人问津， 直到 1655 年被英国人夺走。 那时阿拉瓦克人已经所剩无几， 因为 他们这个族群对欧洲人带来的疾病格外缺乏抵抗力。<n><n>1661 年， 爱德华·多伊利 被任命为牙买加的总督兼军事长官。 在他治下， 首都 皇家港 被改造成了一座活力十足、 防御森严的海盗避风港。 据说这里是 「地球上最富有也最腐败的地方」， 许多原本只是普通商人的居民， 常结伙到西班牙海域去干私掠勾当。 起初英国政府对这类勾当并不怎么管， 毕竟这些私掠者毕竟替它挡着西班牙的对手。<n><n>直到 亨利·摩根 爵士出任总督—— 这件事本身就耐人寻味， 因为 他自己从前也是海盗—— 牙买加才重新找回文化和秩序。 摩根毫不留情地镇压海盗， 把自己昔日的那帮同伙送上绞刑架时也毫不迟疑。<n><n>然而， 英国的权威刚刚恢复， 人们就发现了一门比不断增长的甘蔗生意更赚钱的新生意： 1672 年之后， 皇家非洲公司取得垄断， 皇家港 发展成为世界上最大的奴隶市场。"
"0xd4cd1024" = "克里斯托弗·哥伦布 抵达新大陆仅仅两周， 便到达了西印度群岛最大的岛屿—— 古巴。 这里生活着若干族群： 西博尼人、 瓜纳哈塔贝人和泰诺人。 尽管 他们性情温和， 却 都和其他美洲原住民族一样遭遇了同样的不幸结局： 1511 年， 在与西班牙人打完四年战争之后， 他们被征服并灭绝。 此后， 大批黑人奴隶被输入此地。 这座岛屿连同其首府 哈瓦那， 被划分为七个行政管区 （cabildos）， 各管区派出一名代表参加一个专门的议会。 代表的职责是维护本地区的利益。<n><n>古巴的历史引人注目之处在于： 除了 1762 年至 1763 年一段短暂的英国占领期外， 这座岛屿在西班牙人手中握有相当长的时间。 这或许是因为在殖民时代， 古巴并非西班牙帝国最重要的地区之一 （比如那里几乎没有任何矿藏）， 而 它通常只是驶往大陆途中的中转站。 无论 如何， 当南美和中美洲绝大多数国家都在 19 世纪第一个四分之一世纪里为独立而战时， 西班牙人却一直守住了古巴， 直到 1898 年， 才把该岛的控制权让给美国。"
"0xd4cd1025" = "众所周知， 如今我们视为理所当然的许多东西， 最初都是通过与美洲的贸易才抵达欧洲的。 然而 文化上的交流却是双向的。<n><n>比如， 当你想象北美平原上典型的美洲原住民时， 很难想象在西班牙人和葡萄牙人到来之前， 美洲是没有马的。 许多原住民第一次看到骑手与马匹时都惊慌逃散， 因为 在他们看来， 这是一种由两个生命长成一体的怪物。<n><n>咖啡， 人们通常把它和巴西、 危地马拉这样的国家联系在一起， 其实并非美洲原生； 在到达美洲之前， 它已经跨越了三个大洲： 它从非洲 （很可能是埃塞俄比亚） 出发， 经由阿拉伯诸国传入南欧。 这种植物是在18 世纪才被引入美洲的—— 当时这种饮料日益流行， 人们不得不扩大对它的种植。<n><n>在欧洲人于加勒比发现的土豆， 是一种价值难以想象的基本主食。 反过来， 小麦在美洲一直无人知晓， 直到西班牙人和英国人的到来： 他们分别在1520 年和 1777 年把这种作物带到墨西哥和弗吉尼亚。 尽管 人们最初认为美洲的气候并不适合种小麦， 但 恰恰是北美大陆见证了这种作物最为惊人的成功。 如今， 小麦是全世界播种面积最大的农作物。"
"0xd4cd1026" = "你能想象没有巧克力的生活吗？ 你大概真该想象一下， 因为 在美洲被发现之前， 可可对世界其他地方来说都是闻所未闻的。 「cocoa」 这个词很可能源自玛雅语， 它的踪迹最早也只能追溯到那里： 几乎可以肯定， 玛雅商人在基督诞生前 400 年就在喝可可了。<n><n>阿兹特克人自 14 世纪起就是中美洲大陆上的主导力量， 他们甚至赋予可可以宗教意义。 第一位接触这种美味的欧洲人又一次是 克里斯托弗·哥伦布， 不过 那是1502 年的一次后期航程， 目的地是尼加拉瓜。<n><n>不过， 可可当之无愧的 「发现者」 是阿兹特克王国的征服者 埃尔南·科尔特斯， 他把一种叫作 xocoatl 的饮品的配方带回了西班牙 （ 「chocolate」 一词即由此而来）。 那味道对欧洲人的舌头来说起初太苦， 直到人们开始加入糖或香草， 热巧克力才在伊比利亚的上流社会流行开来。<n><n>西班牙人把这份配方秘而不宣了将近一百年， 此后热巧克力才传遍法国和欧洲其他地区。 大约在 1700 年， 英国人往里面加了牛奶。 可可在欧洲的最终突破， 发生在人们发现咖啡与可可搭配起来竟如此美味的时候。"
"0xd4cd1027" = "谈论海盗时， 事实与传说往往难以分辨， 但 海上有过女海盗这一点却是不容争辩的。 18 世纪初， 牙买加岛上启程走在这条道路上的， 有两位最为耀眼的人物。<n><n>据说 安妮·博尼 小时候就曾被人一刀捅进肚子， 后来跟一名水手私奔到了新 普罗维登斯 （ 拿骚） 这座海盗窝。 在那里， 她设法除掉了丈夫， 并 在一艘被缴获的荷兰船上开启了自己的职业生涯。<n><n>在那里， 她遇见了 玛丽·雷德—— 后者早在西班牙王位继承战争中就曾女扮男装作战， 据说还在杀死对手之前袒胸露乳， 好让对方明白自己是被一个女人打败的。<n><n>1720 年被俘之后， 两人之所以没有被送上绞架， 只因为她们正怀着身孕。 她们的运气比大多数男同伙都好得多， 而 安妮·博尼 对那些人， 则只能报以鄙夷。<n><n>下面便是那位臭名昭著的 「花布杰克」 被押赴刑场时， 她对他说的话： 「真遗憾在这里看到你， 杰克； 但 如果你当初像个男人那样拼命， 你现在就不会像条狗一样被吊在这里了。」"
"0xd4cd1028" = "威尔士人 巴塞洛缪·罗伯茨 （1682？ — 1722年）， 不仅是最重要的海盗之一， 也是一位极不寻常的海盗。 他又名 「黑巴特」 （别与 「黑胡子」 爱德华·蒂奇 混为一谈）， 37 岁时才转而去做海盗， 不过 这一步的过渡无疑顺滑得很： 1719 年， 他供职的那条船被他的威尔士同乡 豪厄尔·戴维斯 袭击—— 那实际上是一条奴隶船。<n><n>戴维斯被杀后， 罗伯茨决定与这位同伙共进退， 并 在几周后接手了他的船长之位。 据说 巴塞洛缪·罗伯茨 不碰酒， 只喝茶。<n><n>与把自己打扮成魔鬼化身的蒂奇不同， 罗伯茨偏爱精致衣裳， 厌恶赌博， 还坚持要求手下船员做祷告。 当然， 这绝不代表罗伯茨是个内心虔诚的人。 关于他在无数次劫掠中犯下的暴行—— 尤其是对俘虏的暴行—— 流传着大量传说。 总计劫走四百余艘船， 活动范围从巴西一路延伸到纽芬兰与西非海岸； 他与 亨利·摩根 并列为中美洲最成功的海盗。<n><n>1722 年， 一艘英国战舰在几内亚海岸外开炮的轰鸣， 宣告了他职业生涯的终点， 也宣告了七大洋上最大祸患之一的消亡。"
"0xd4cd1090" = "17 世纪最著名的海盗是威尔士人 亨利·摩根 （1635 — 1688年）， 他在西印度群岛的西班牙殖民地肆虐， 从根本上动摇了这个伊比利亚大国的地区权威。<n><n>他的一生， 例证了英国、 荷兰与法国政策背后那颇为暧昧的道德观： 只要海盗行为能伤害到其他列强， 他们便乐得睁一只眼闭一只眼。<n><n>1668 年， 摩根受命指挥一艘海盗船， 最初在北美洲南岸一带大肆破坏。 1670 年 8 月， 他率领近两千人攻下了防守严密的重镇巴拿马城， 随后在返航途中带着大部分战利款溜之大吉。 然而 由于这次袭击发生在西班牙与英国签订和平条约之后， 他被俘， 并 被押往伦敦受审。<n><n>摩根最终并未被判有罪， 恰恰相反： 没过多久， 外交的风向便再度转变。 摩根不仅被赦免， 还被授以骑士爵位。 作为 「亨利爵士」， 他被任命为牙买加的新任总督， 在那里厉行法纪， 以一位富有而受人敬重的种植园主的身份度过余生。"
"0xd4cd1091" = "巴哈马群岛在 17 世纪中叶曾短暂充当英格兰宗教异议者的避难所， 而 从 1670 年起， 它正式归奥伯马尔伯爵等一批绅士管辖—— 他们从查理二世国王手中买下了这组岛屿， 指望从中获利。<n><n>然而尽管他们信誓旦旦， 这些人对建立一套井然有序的民政管理却兴趣寥寥。 恰恰相反： 与加勒比其他地方的遭遇一样， 大批海盗在巴哈马安家落户， 尤其集中在新 普罗维登斯岛—— 拿骚镇就在这座岛上。<n><n>那些重型战舰无法驶入的浅水海湾， 为数百艘单桅帆船和海盗双桅船提供了理想的停泊处。 他们在西班牙海域的频繁劫掠招来了报复， 首任总督 约翰·温特沃思面临 着一项棘手任务： 在这些岛屿上重新建立法律与秩序。<n><n>眼看情况毫无好转， 英格兰的乔治一世国王再度没收了巴哈马， 把它改为王室直辖殖民地。 1718 年中， 前私掠者兼环球航行家伍兹·罗杰斯被任命为首位皇家总督。<n><n>他软硬兼施， 结束了此前一直弥漫的混乱。 他宣布大赦： 凡愿意宣誓放弃海盗活动的海盗， 一律既往不咎。 至于不肯就范者， 等待他们的是一支全副武装的舰队的惩罚。<n><n>就这样恢复正常秩序之后， 这组岛屿于 1729 年获得了自己的议会； 在此后的一百年里， 除了偶尔因入侵而起的动荡之外， 巴哈马的历史相对平静。"
"0xd4cd1092" = "在新获得的殖民地， 几乎处处都是西班牙人建立起来的僵硬社会等级， 几乎不给人任何上升机会。 等级的最顶端， 是那些出生于欧洲的同胞。<n><n>出生在殖民地的西班牙人被称为克里奥尔人。 尽管 在等级表中他们只被视为次要， 却 占据了国家、 教会与军队中绝大多数较低的位置。<n><n>因此， 欧洲血统的西班牙人与克里奥尔人构成了殖民地的精英阶层。 白人 （多数是男性） 与原住民通婚所生的子女被称为混血儿 （mestizos）。 原本拥有这片土地的原住民， 处于社会的最底层； 而在那些已被欧洲人彻底灭绝的原住民所在地区， 这份 「荣耀」 则留给了黑人奴隶。<n><n>这些阶层在人口中的相对比例， 在西班牙帝国的各个地区差异极大。 例如 在墨西哥， 混血儿构成了人口中最大的部分。 在许多岛上， 黑人奴隶的人数更多 （并任由主人摆布）。 而在丛林、 沼泽与山区提供了安全退避之所的地方—— 比如 玻利维亚或佛罗里达—— 一些原住民族群也得以幸存。"
