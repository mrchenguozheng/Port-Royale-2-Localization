"0xf6a84efd" = "1570 年， 我们来到加勒比海。 你的目标是从一个默默无闻的小商人， 成长为一位举足轻重的实业家。 为了帮你取得所追求的地位， 你可以既跑运输、 又做贸易， 还能搞建筑、 参与政治与海盗活动。<n><n>接下来的剧本会教你游戏的基本玩法。 与其他剧本一样， 这里包含若干个不同的目标。 你必须完成全部目标， 才能顺利通关。<n><n>你现在可以点 「关闭」 按钮关掉这个窗口， 然后 查看屏幕左下角的事件窗口。<n><n><n><c><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>按照事件窗口里的指示去做。"
