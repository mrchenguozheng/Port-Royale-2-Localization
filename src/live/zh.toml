"0x1ca50773" = "干得漂亮！ 你现在有一支像样的船队了。<n><n>下一项任务可不轻松： 要攻打并击败一支英格兰军事船队。 特克群岛的总督已为你增派了一艘战舰作为后援， 去 特克群岛的港口找到它， 把它并入船队。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFHk.res><n><n><c>摧毁一支英格兰军事船队。"
