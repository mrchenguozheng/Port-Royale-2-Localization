"0xf6c77503" = "海盗 %1 的巢穴已被发现哪位英雄冒险家敢去攻毁它？"
"0xf6ec5ddc" = "托尔图加 正在发生一些怪事。 由于 过去发生的一连串事件， 如今几乎没有任何商人敢踏入这座城镇。 你的任务是尽你所能供应货物， 以扶持 托尔图加。<n><n>但你手上的启动资金并不算可观。 你手头有 @g$StartGold$ 现金。 不过， 港口里停着一支装备齐全的贸易船队， 还有一些货物存货。<n><n>你的第一个目标， 是把现金增加到 @g$GoldGoal$。 尽快完成这项任务， 但 耗时不得超过 40 天。<n><n>一句忠告： 无论 如何都不要卖掉你的船。 不过， 你可以去贷款。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在 @D$EndDate$ 之前把现金增加到 @g$GoldGoal$。"
"0xf70feddb" = "你已经回到 卡塔赫纳的港口， 你的船队 「圣玛丽亚号」 也已选定。<n>正如你所见， 船队里已经有了一些货物： 棉花、 肉和可可。<n>现在在港口里找到码头并点击它， 因为 你打算把这些货物卖掉。"
"0xf70feddc" = "在码头， 你可以进行城镇与仓库之间、 以及 城镇与船队之间的交易。<n>现在你能看到城镇有哪些货物、 船队有哪些货物。 用箭头买入卖出 （价格显示在箭头上）。<n>现在卖掉你的棉花。"
"0xf70feddd" = "你可能已经注意到， 你一卖出棉花， 棉花的价格就下跌了。<n>这是因为价格由城镇的供求关系决定。<n>卖出货物满足了需求， 价格便会下跌； 买入某种货物， 它的价格就会上升。<n>现在买入 @a$SubGoal$ 小麦。"
"0xf70fedde" = "注意到小麦的价格刚刚上涨了吗？<n>不过要注意， 价格不只取决于供应量， 还取决于你在这座城镇的声望。<n>点击贸易窗口右下角那个带房屋图标的按钮。"
"0xf70feddf" = "现在你可以在仓库与城镇之间进行交易。<n>想在某座城镇生产某种货物， 就必须先在那里建一座仓库。 你的起始城镇里必定已经有一座仓库。<n>现在把仓库里的所有货物都卖掉。"
"0xf70fede0" = "贸易窗口最上方有三个分别标着 1、 10 和 100 的按钮， 方便你更快地大批量交易。 点击 10 号按钮， 看价格如何变化。<n>买 10 件 x 1 种货和买 1 件 x 10 种货没有区别： 总价始终相同。 现在买入 @a$SubGoal$ 朗姆酒。"
"0xf70fede1" = "贸易菜单最右边那一列显示你买下这些货物的平均价格。 既然你想赚取差价， 就得找到一个能卖出更高价格的城镇。<n>现在点击右下角第四个按钮 （带吊臂的那个）， 打开船只与仓库之间的移交界面。"
"0xf70fede2" = "在这个窗口里， 你可以在船队与仓库之间调动货物。 现在把仓库里剩下的货物都装上船队， 因为 你打算到另一座城镇去卖。<n>然后点击右下角标着 「X」 的按钮关闭贸易窗口。"
"0xf70fede3" = "现在切换到海图， 驾船队前往 圣玛尔塔。 不要进入 圣玛尔塔， 而 要在船队抵达城镇时立刻右击城镇名称。"
"0xf70fede4" = "这会打开 圣玛尔塔的贸易窗口。<n>因此你不必进入城镇就能在那里交易。<n>现在把船队上所有的货物都卖掉。<n>然后关闭贸易窗口。"
"0xf7110875" = "你确定要删除这个存档吗？"
"0xf725f22c" = "你的船队现在位于 圣玛尔塔。 点击城镇名称即可查看城镇信息。<n>你可以在海图上直接这么做， 也可以进入城镇后再看。"
"0xf725f22d" = "城镇信息会显示这座城镇出产哪些货物。<n><n>你与西班牙的关系也会一并显示： 这层关系是友好的！ 这意味着你在这座城镇能拿到最有利的价格。<n><n>现在关闭这个窗口， 在城里四处看看。"
"0xf725f22e" = "现在点击屏幕左侧城镇名称下方的 「居民」 图标， 查看 圣玛尔塔的库存。"
"0xf725f22f" = "这里会显示库存货物的数量和城镇消耗货物的数量。 当然， 消耗水平取决于城镇的人口。<n>消耗量能告诉你哪些货物可以长期稳定供应。 现在关闭库存窗口。"
"0xf725f230" = "现在试着做几笔有利可图的买卖。<n>打开贸易窗口， 尽可能多地买入你的船队装得下的棉花、 糖和可可， 因为 这些货物正是这座城镇出产的。<n>然后返回 卡塔赫纳， 把这些货物高价卖出。"
"0xf725f231" = "你刚收到两条消息， 里面有些成功贸易的诀窍。<n>打开日志来读一读这些消息。<n>"
"0xf725f232" = "尽量把货物以高于平均价的价格卖出去， 再买入新的货物。<n>注意： 某座城镇里稀缺的货物， 其价格会以红色显示。 这类货物你总能卖出好价钱。<n>"
"0xf725f233" = "像 卡塔赫纳 这样的总督城会收到从欧洲运来的进口货物。<n>你通常能把它们高价卖给殖民城镇， 比如 圣玛尔塔、 马拉开波 或 直布罗陀。<n>接下来自己先做一段时间买卖吧。<n>你的目标是通过贸易赚到 @g$GoldGoal$ 现钱。"
"0xf7346191" = "%1 的商人"
"0xf73619d7" = "海盗巢穴已曝光"
"0xf7370c4b" = "%1，<n>我还想不出有几个人是我更愿意见到的。 我们有事要谈吗？ 你要是非进来不可， 就进来吧。"
"0xf73bf67d" = "切换到 卡塔赫纳的城镇视图。<n>通常你想进入一座城镇， 得先有船队停泊在港口。 不过 你在 卡塔赫纳 有仓库， 因此 随时都可以进入这座城镇。<n>点击 卡塔赫纳的船坞。"
"0xf73bf67e" = "在船坞里买一艘小船。 别花太多钱， 因为 还要留些钱用来贸易和维持你的船。"
"0xf73bf67f" = "上一个剧本里， 你学会了通过右击港口把船只加入船队。<n>不过这一次， 你该在旅店雇一名船长的方式来组建一支新船队。<n>找到旅店 （位于城镇中心） 并 点击它。"
"0xf73bf680" = "船长总能在旅店里找到。 如果 城里有船长住着， 旅店菜单里的第三个按钮就会有所提示。<n>如果你在港口里还有别的船只或船队， 你必须告诉船长他具体要在哪条船上任职。<n>指定由他指挥你的新船。"
"0xf73bf681" = "恭喜！ 你已经组建了第一支船队！ 下一个任务是把你的财富提升到 @g$GoldGoal$。 你随时可以在日志的 「收益」 里查看自己的财富。<n><n>祝你好运！"
"0xf73dab55" = "谢谢你完成我交给你的最后一个任务。"
"0xf73dab56" = "我想为你完成我的最后一个任务而道谢。"
"0xf73dab57" = "我很感激你的支持。"
"0xf7485ed1" = "%1 (%2)"
"0xf74a5740" = "你将带着<o:0xFFF2FAAD>%1<o> 枚金币和一艘<o:0xFFF2FAAD>轻型帆船<o> 开始生涯。 （60 吨， 最多 8 门火炮）"
"0xf7534d8f" = "当你把移民运到缺人的城镇时， 他们会在下船时付给你一笔运费， 以此向你致谢。<n><n>生产可可这类殖民地商品， 始终需要少量工具。 一旦 没有工具， 生产就会停下来。 等你略微摸清价格与数量之后， 可以指派店老板定期在城里采购工具。 不过 眼下为了稳妥， 工具还是你自己买。<n><n>这就是你的下一项任务。 做完之后， 就再没有什么能阻止你生产可可了。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>生产可可， 并 在仓库中囤到 @a$AmountGoal$。"
