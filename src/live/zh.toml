"0x0f52782d" = "恭喜！ 你现在可以用棉花在 卡塔赫纳 生产布料了。<n><n>不难想象， 生产布料的成本在很大程度上取决于你为棉花支付的价钱。 因 此， 只有当你有把握能以合理价格购进原料时， 才可以生产成品。 当然， 你也可以自己生产这些原料。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在 圣玛尔塔 建一座棉花生产设施， 并 通过贸易把现金增加到 @g$GoldGoal$。"
"0x0f5d7735" = "在 查尔斯顿 以东很远的地方就是百慕大群岛。 务必绕开它们！ 两个月前， 我姐夫驶往那里探查， 却 再也没有回来。 没人知道那边有什么， 但 有一点可以肯定： 胆敢驶得太近的人， 都会遭遇可怕的命运！"
"0x0f5d7736" = "你听说过百慕大群岛最新的传闻吗？ 一个商人想借道群岛附近航线前往欧洲， 却 始终没有抵达。 他的哥哥出发去找他， 只在群岛以南找到几块残骸。"
"0x0f5d7737" = "就在前几天， 皇家港的一名水手告诉我， 他们最近驶得离百慕大群岛很近， 差点靠得太近—— 他亲眼看见水中有一个巨大的怪物在移动。 它喷吐火焰， 长耳里冒出浓烟。 胆敢靠近这头海怪的， 必遭横祸！"
