"0x0ce1a79f" = "像 圣玛尔塔 这样的殖民地城镇， 能生产两种必需品、 两种原料和一种殖民地商品。<n>上一剧本中你已经了解到， 总督城对原料和殖民地商品的需求格外旺盛。<n>你打算先生产殖民地商品可可。<n>现在关闭城镇信息。"
"0x0ce1a7a0" = "殖民地商品是从总督城运往欧洲的， 因此 这些城镇对可可的需求很高。 条件正适合你开办第一家企业。 现在找出并点击城镇正中的总建筑师建筑。"
"0x0ce1a7a1" = "在总建筑师处， 你可以申请建造新建筑的许可， 也可以交还建筑许可证。 当然， 你现在不想这么做！<n>看看你可以建造哪些建筑。 窗口右侧的按钮也可以使用。<n>点击 「可可种植园」 按钮。"
"0x0ce1a7a2" = "你现在能看到需要多少建筑材料、 建造要花多少钱。<n>你也能看到仓库里现有多少建筑材料， 以及 还需向城镇购买多少。<n>你目前的材料充足。<n>把鼠标移到可用的建造位置上， 左键点击。"
"0x0ce1a7a3" = "可可生产设施的脚手架已经搭好， 开工了。<n>建造需要几天时间才能完工。 在此期间， 你该为新来的工人安排住处。<n>关闭建造菜单， 在 圣玛尔塔 寻找一处住宅区。"
"0x0ce1a7a4" = "这处住宅区属于城里的一位商人。 你可以查看当地商人拥有多少住宅区、 共有多少住户。 你想自己建一处住宅区。 为此， 打开建造菜单。"
"0x0ce1a7a5" = "在建造菜单中选中住宅区， 查看建造费用显示。<n>你的库存里可能没有足够的建筑材料。 不过， 只要城镇供应充足， 你可以在城里买到任何需要的材料。<n>否则， 你就得去别的城镇弄货。<n>然后建起一处住宅区。"
"0x0ce1a7a6" = "一家企业可雇用 30 名工人。 普通工人家庭平均有四口人， 所以 每开一家企业， 就需要能容纳 120 人的住处。<n>一处住宅区可容纳 120 名住户， 因此 每家企业需要配一处住宅区。<n>现在关闭建造菜单， 点击你新建的住宅区。"
"0x0ce1a7a7" = "住宅区没有建造期， 因为 住户一开始是住在帐篷里的。<n>随着时间推移， 住户们自己会把住宅区发展成一座相当可观的建筑。<n>住宅区的外观取决于它的年头和城镇的地位。<n>关闭住宅区对话框。"
"0x0ce1a80f" = "你已经知道， 在城镇里建造的第一座建筑必须是仓库。 在建成之前你无法建造其他任何建筑。<n>你在游戏起始的那座城镇里已经有一座仓库。 找出它并点击它， 它在屏幕上显示为浅蓝色。"
"0x0ce1a810" = "在仓库里， 你可以看到自己在城中拥有哪些建筑， 以及 维护它们要花多少钱。<n>你还能看到住户向你支付的租金， 以及 各家企业正在生产哪些货物。<n>之后你就能向店主下达指令了。<n>在仓库里四处看看， 然后 关闭它。"
