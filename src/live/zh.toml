"0xda93dbe1" = "非常好！ 这可不是件容易的事！ 英格兰已经损失了如此之多的军事船队， 以至于它的城镇可以被攻占了。 为感谢你所提供的服务， 特克群岛的总督再给你四艘大帆船。<n><n>只有奉副王之命， 你才能攻占他国城镇。 而 副王只有在自身国家军事强大、 敌国军事虚弱的情况下， 才会命你攻城。<n><n>不幸的是， 荷兰目前的实力还不足以攻占城镇。 不过 你可以为此做点事： 去拜访 大巴哈马的荷兰副王， 把你的一支船队移交给他。 这样他就会组建一支新的军事船队， 从而 增强荷兰的军事实力。<n><n>如果你想把船队移交给一位副王， 这支船队必须恰好有五艘船， 并且 至少配备 150 门火炮。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>帮助副王增强荷兰的军事实力， 然后 接受一项代表他攻城掠地的任务。"
