"0x293d8c9f" = "太棒了！ 你的城镇现在规模不小了。 很快， 第一批来自其他城镇的商人就会登陆， 来与你的城镇交易货物。<n><n>不过你的城镇也可能招来一些不受欢迎的客人， 其中包括与你关系不睦的国家的海盗和私掠者。 所以 你的下一个任务是招募士兵、 修筑港口炮。<n><n>幸而镇上的市民基本上能自己组织起来。 你只要给他们一些指示、 买齐所需材料就行， 之后就不再有额外开销。<n><n>你可以在 「建造」 菜单里修筑港口炮， 也可以在宫殿里招募士兵。<n><n>记住：<n>士兵也需要住处！ 不过 与工人不同， 士兵每人只占一个空间。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>建造五门港口炮， 并 把士兵人数增加到 300 人。"
