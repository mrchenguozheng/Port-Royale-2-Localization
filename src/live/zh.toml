"0xcff9644a" = "「独臂海盗」 是一款用 32 张牌玩的机会游戏。 每位玩家把赌注放进底池， 并 拿到 5 张对方看不见的牌。<n><n>首先， 每位玩家都要报出自己认为能赢的点数， 每赢一墩得一分。 报点数更高的玩家先出牌， 并 决定主花色。 他必须设法赢到至少自己报的那么多分。<n><n>先出牌的玩家打出手牌， 另一位玩家若做得到， 必须跟出同花色的牌。 牌最大者赢得这一分。<n><n>若某玩家无法跟花色， 可以弃掉任意一张牌， 或 打出一张主牌。<n><n>牌的顺序是 I、 II、 III、 IV、 海盗、 新娘、 总督、 鹦鹉。 主牌压过其他所有牌。<n><n>赢得这一分的玩家再出下一张牌。 如此继续， 直到有人赢下整局。<n><n>若先手者成功赢到了自己报的点数， 他即获胜并拿走底池； 若没有， 则对手获胜。"
