"0x0f1ade15" = "现在你应当在城镇里创造就业岗位， 并 建造居住区。<n><n>移民只有在这座城镇里能找到工作时， 才会愿意留下来， 所以 你首先得建造四座生产设施。 先想清楚要建哪一种生产设施。 但 务必确保你只生产那些能在其他城镇卖出利润的货物， 因为 生产成本很高， 而 你全靠卖货赚来的利润过活。<n><n>四座生产设施可以提供 120 个岗位。 由于 这些工人各自都是四口之家的一员， 你必须为 480 名居民提供住处—— 换句话说， 就是四个居住区。<n><n>生产设施和居住区一旦就绪， 你就可以试着从其他城镇引来移民。 移民通常是在总督城里等着找工作。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>把城镇人口增加到 480 人。"
