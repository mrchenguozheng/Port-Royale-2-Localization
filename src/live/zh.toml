"0xcc2c64fb" = "你已接受任务： 追踪并摧毁黑胡子的一支海盗船队。<n><n>黑胡子有一处秘密藏身处， 里面藏着好几支船队， 每支都由五艘全副武装的船只组成。 以你现有的船队， 这会是一份艰难的任务。<n><n>所以你得先提升船队的火力。 要凑够钱买更大的船， 可以把 @T$TOWN$ 仓库里的货物按你能拿到的最好价钱卖掉。 照着 「事件」 窗口的提示做， 它会告诉你 @T$TOWN$ 东北方向的哪里能卖出好价钱。<n><n>别在这上面花太多时间， 之后你还得完成总督的任务！<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFHk.res><n><n><c>卖掉你在 @T$TOWN$ 仓库里的货物， 把现金增加到 @g$GoldGoal$。"
