"0x05716a06" = "你下一场战斗会难一些， 因为 这次敌人会还手。 你的任务是替总督追踪并杀死一名海盗。<n><n>但首先你得为战斗武装船队。 买一艘船， 把它编入船队， 再装上新的武器和水手。<n><n>海战期间随时可以按 F1 查看键鼠设置。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>武装你的船队， 完成 卡塔赫纳 总督交给你的新任务。"
