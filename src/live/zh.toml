"0x2ee7d67a" = "%1 的副王"
"0x2ee8bb8c" = "我们现在位于南加勒比的总督城 卡塔赫纳。<n>你可以走进城镇里的各种建筑， 做各种事情， 稍后再细说。<n>先看看屏幕上方， 那儿有一排按钮和显示栏。<n>现在点最左边那个带时钟的按钮。"
"0x2ee8bb8d" = "这就是编年史， 记着加勒比发生的所有事件和轶事， 就像一份日报。<n>编年史窗口右侧有几个按钮， 可以用来查看加勒比的相关信息， 不过 现在还用不上。<n>现在点标着 「X」 的按钮关闭编年史。"
"0x2ee8bb8e" = "屏幕顶部、 日期旁边是日志按钮， 它右边就是你的现金。<n>日志会告诉你所有与成就和财产有关的信息， 你收到的所有消息和任务也都存在这里。<n>打开日志。"
"0x2ee8bb8f" = "你看， 日志立刻列出了你至今收到的所有消息。 目前里面只有本剧本的说明。<n>日志窗口右侧还有别的按钮。 点第三个。"
"0x2ee8bb90" = "这里显示的是你收到的任务。 目前只显示剧本目标。<n>任务窗口最上方有两个按钮， 可以在进行中的任务和已完成的任务之间切换。<n>现在关掉日志。 右键点击也一样。"
"0x2ee8bb91" = "游戏中你可以接受许多任务， 去博取名声和财富。<n>先看看城镇吧。 屏幕上方中央的显示栏告诉你， 我们现在在 卡塔赫纳， 这座城镇约有 2,000 名居民。<n>点那个显示城镇名称的按钮。"
"0x2ee8bb92" = "这会打开一个显示城镇信息的窗口。<n>卡塔赫纳 是总督城， 归属西班牙。 你还能在这里看到城镇等级和当地能生产的货物。<n>现在进入一座建筑。 先把城镇信息显示关掉。"
"0x2ee8bb93" = "你可以用键盘方向键在城镇视图里移动。 现在看看城墙内的城镇中心， 那里有各种建筑， 比如 船坞、 教堂和总督宫殿。<n>在其中任意一座上点一下。"
"0x2ee8bb94" = "点击建筑后， 屏幕下方中央的显示栏会随之改变。 视建筑类型而定， 你会看到信息， 或者 可以做些事情。<n>建筑显示栏右侧有几个按钮。 要离开建筑， 点标着 「X」 的那个。"
"0x2ee8bb95" = "能进行各种操作的建筑都在城墙之内。 你的仓库是个例外， 下个剧本再说。<n>现在离开建筑， 用方向键找到港口， 以及 名为 「圣玛丽亚号」 的船队。 点它一下。"
"0x2ee8bbfd" = "你看， 现在屏幕下方中央显示的是船队信息。<n>船队已经装好货： 10 桶小麦和 15 桶玉米。<n>船队显示栏右侧有几个按钮。 点第二个 （带船图标的那个）。"
"0x2ee8bbfe" = "这里显示船队里的船只数量。 一支船队最多有 10 艘船， 由一位船长统领。<n>现在把这支船队派往另一座城镇。<n>点屏幕右上角那个带箭头的按钮离开城镇， 打开海图。"
"0x2ee8bbff" = "海图打开了。 屏幕中央是 卡塔赫纳城镇。<n>你可以用方向按钮平移地图显示的区域， 浏览整个游戏世界。<n>现在到北边的岛上找到 皇家港， 在选中船队的情况下右键点击该城镇。"
"0x2ee8bc00" = "航线规划好了， 船队启航。<n>在 皇家港 上右键点击， 就把它设成了船队的目的地。<n>如果船队赶到城镇太慢， 可以按空格键快进游戏 （默认设置）。"
"0x2ef566b4" = "键盘"
"0x2ef8f665" = "欢迎来到 %1。<n><n>我先给你几条忠告， 好让你更快熟悉 %2 一带的情况， 这样才能帮我的国家把这座城镇和其他城镇发展起来。<n>我想总督城的基本情况你已经很了解了： 它们需要源源不断的殖民地货物出口到欧洲。 同时， 这些城镇通常也备有各类奢侈品， 卖到别的城镇能赚上一笔。<n>还有一点： 你或许想先知道， 总督时不时会派任务给你， 不过 在达到见习水手等级之前， 你还不能接受任务。<n><n>%3 %4， %5 的总督"
"0x2efebfdd" = "你的船队已经抵达 皇家港， 现在可以进城了。 点一下城镇符号 （那排小房子） 就行。"
"0x2efebfde" = "现在又看到熟悉的城镇视图了， 不过 这次是 皇家港。 凡是拥有你船队或建筑的城市， 你都可以前往。<n>在港口里找到船坞并点它一下， 我们要买一艘新船。"
"0x2efebfdf" = "船坞现在显示在刚才船队所在的这个选择窗口里。<n>点船坞显示栏右侧的按钮， 在船坞里逛一逛。<n>然后回到 「购买船只」 这一栏， 看看有哪些船可选。<n>买你想要的任何一艘。"
"0x2efebfe0" = "恭喜！ 你买下了第一艘船。<n>船会被送到城镇的港口。<n>现在离开船坞， 点击港口里的水面。 选择窗口会逐一显示港口中的船只。<n>点你的新船。"
"0x2efebfe1" = "这里显示船只的数据， 你在船坞里已经见过了。<n>要对单艘船做任何事， 你得先把它编入一支船队。<n>为此， 重新选中你的船队。"
"0x2efebfe2" = "现在你要让船队与港口互动。<n>在港口上点击右键。"
"0x2efebfe3" = "「调拨」 窗口打开了， 可以把单艘船加入船队。<n>点左边那艘单独的船， 把它拖到船队上， 这样船队就有两艘船了。<n>然后用右边的 「X」 按钮关掉调拨窗口。"
"0x2efebfe4" = "你还可以在酒馆雇一位新船长， 用新船再组一支船队。<n>不过现在还不行， 你的等级不够。<n>现在选中船队的船只列表， 就是第二个按钮。"
"0x2efebfe5" = "现在 皇家港的港口里有一支两艘船的船队了。<n>你可以在船只列表里点船， 查看每艘船的详情。<n>现在把船队派回你的母城 卡塔赫纳。 为此， 点屏幕最右上角那个带箭头的按钮打开海图。"
"0x2efebfe6" = "在南方找到 卡塔赫纳城镇， 右键点击它， 把船队派过去。<n>船队一到城镇， 本剧本就结束。"
