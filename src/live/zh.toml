"0x3353aa4c" = "太好了！ 现在你该替荷兰去占领更多英格兰城镇了。 但 别磨蹭， 只有荷兰与英格兰交战期间才能攻占城镇。<n><n>和往常一样， 这类任务只有 大巴哈马的副王才能派给你。 在你能再接到攻占城镇的任务之前， 或许得先做点什么去影响两国的军事强弱。 你已经知道该怎么做了。<n><n>作为后援， 特克群岛 总督又给了你三艘卡拉克帆船。<n><n>港口里还可以招募到大量水手、 购置武器。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在荷兰与英格兰的战争结束之前， 再为荷兰总督完成两座城镇的攻占任务。 期限是 @D$EndDate$。 之后剧本即告结束。"
