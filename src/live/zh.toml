"0x072a9579" = "你替我把这些进口货物带回来， 我感激不尽 —— 新世界这边已经好几个星期没得到我国的运输船队补给了。 作为报答， 我送你两艘荷兰商货船。 它们正在港口等你。"
"0x0744a699" = "我没法告诉你宝藏船队还会造访多少座城镇。 能肯定的是， 船队每造访一座城镇， 船上装的黄金就更多一些。 你什么时候动手都行， 拿到手的黄金全归你。 我只要你确保宝藏船队消失。 它上一站是 @T$StartTown$， 下一站是 @T$DestTown$， 会在那里抛锚约五天。"
"0x0744a69a" = "所以你得抓紧动手。 它上一站是 @T$StartTown$， 正驶向 @T$DestTown$， 会在那里停留得比平时更久。 你拖得越久， 它船上的黄金就越多。 这些钱你可以全拿走， 但 宝藏船队绝不能抵达欧洲。"
"0x0744a69b" = "那就说定了， 谢谢。 如果 我的情报没错， 宝藏船队最近已离开 @T$StartTown$， 正驶向 @T$DestTown$， 会在那里停留得比平时更久。 现在赶紧去截住它！"
"0x0746253d" = "如果想让尽可能多的商船队来你镇上光顾， 最简单的办法就是某些货物干脆不往镇上供应。 最好挑那些邻近城镇生产的货物， 因为 商人会把路程远近算进去。<n><n>来你镇的商人会自动买走那些货源充足、 因而 在你镇上价格低廉的货物。 你也可以把镇里生产的货物直接卖给本镇。 只要价格不比别的镇高， 商人就会定期买走。<n><n>这样好处是市民的日常所需总有着落， 你也不必操心把这些货物运到别的城镇去。"
