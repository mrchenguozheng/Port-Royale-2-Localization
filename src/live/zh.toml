"0xfca882e8" = "你知道， 西班牙珍宝船队每次从殖民地收取珍宝运往欧洲时， 都会走不同的航线。 它只在每座城镇短暂停留， 以避开埋伏。 不过 这一次西班牙犯了个严重的错误， 让我们查到了西班牙珍宝船队此刻正在走的航线。 你的命令再简单不过： 把每一艘船都摧毁！"
"0xfca882e9" = "我们正与西班牙交战， 必须确保西班牙珍宝船队永远到不了欧洲。 幸运的是， 我们已经查明船队下一站会停靠哪座城镇。 我们要在那座城镇搞破坏， 迫使它延长停泊时间。 这应该能给你足够的时间去截住船队， 阻止它抵达欧洲。 你接受这项任务吗？"
"0xfca882ea" = "这种机会可不是天天都有！ 今天我的一个线人告诉我西班牙珍宝船队眼下正在走的航线。 但 这还不是全部。 我们得知船队会在下一座访问的城镇停泊得比平时更久。 既然我们正与西班牙交战， 就该给副王一点乐子看看， 绝不能让珍宝船队抵达它在欧洲的目的地。 你愿意为我国截住这支船队吗？"
"0xfcc82d44" = "弯刀战士"
"0xfcd6fdec" = "看来你还没完成我上一个委托。 把这件事办完， 因为 我还有更多活儿交给你。"
