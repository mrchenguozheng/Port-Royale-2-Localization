"0x24ec3366" = "太好了！ 你的船队已经武装齐备， 可以去追查黑胡子的一支海盗船队了。<n><n>「事件」 窗口每天都会给些提示， 帮你在船队位于海上时找到它的位置。 找海盗可不容易， 因为 每次抢商船得手， 他们都会退回藏身处。<n><n>记住， 一支海盗船队最多能有五艘战舰。 要是 你觉得船队不够强， 就去加强它。 反正你已经知道怎么弄到钱了。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFHk.res><n><n><c>完成 @T$TOWN$ 总督交给你的任务。"
