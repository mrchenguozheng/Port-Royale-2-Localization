"0xe6490f96" = "1676 年， 荷兰人统治的 特克群岛 上。 荷兰拥有七座城镇， 其中五座是殖民城镇， 一座是总督城， 一座是副王城。<n><n>英国拥有 14 座城镇， 并且 与荷兰打了很久的仗， 而且 这场战争还会再持续许多个月。 只要战争还在继续， 你就必须代表荷兰去夺取英国王室手中的城镇。<n><n>但在你攻打任何英国城镇之前， 你的船队还需要更多资金和更多武装。 你的第一个目标， 是击败三支英国贸易船队并缴获它们的船。<n><n>不过首先， 你必须从 特克群岛的荷兰总督那里取得一份私掠许可证。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>拜访 特克群岛 总督， 取得针对英国的私掠许可证。"
