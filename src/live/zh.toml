"0x0d919a5a" = "%1，<n>换作平时， 我早叫你见鬼去了， 但 眼下这种危难时候， 我连灵魂都肯卖给魔鬼本人。<n><n>那就进来吧， 我有件事要告诉你。"
"0x0d9c1799" = "你的任务， 是设法让 @T$TargetTown$ 在 @D$EndDate$ 之前把城镇地位降到 「衰退」。 你有两个选择：<n><n>其一， 攻打该城镇并抢光全部货物， 把城镇地位打成 「复苏」。 此后由于货物匮乏， 城镇地位还会继续下滑。<n><n>其二， 你也可以通过拦截贸易船队来切断对该城镇的货物供应。 注意： 如果 你只抢掠一支船队而不占领它， 你与相关国家的声望所受损害会小得多。"
"0x0d9c179a" = "很好！ 我要交给你的任务是让 @T$TargetTown$ 陷入 「衰退」 状态。 你的期限是 @D$EndDate$。<n><n>要达成目标， 你必须拦截所有前往该城镇的商人， 让它再也收不到任何货物， 城镇地位随之缓慢下滑。<n><n>不过， 也有办法让这一切来得更快： 那就是攻打并洗劫这座城镇。 你的进攻会让城镇地位迅速跌到 「复苏」， 而 随之而来的货物匮乏会让它继续下探， 直到跌入 「衰退」。"
