"0xcd01da76" = "你以水手身份在西班牙总督城 @T$TOWN$ 起步， 那里已经有一座属于你的仓库。 你的港口里还有一支船队， 配有两艘武装船， 却 没有水手。<n><n>本剧本的第一个目标， 是拜访 @T$TOWN$ 的总督并接下他的任务。 他正被臭名昭著的海盗 爱德华·蒂奇 （即黑胡子） 搅得不得安宁， 想请你出手相助。<n><n>注意： 本剧本中各国处于和平状态。 这意味着你绝不可攻击任何国家的船队。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>拜访 @T$TOWN$ 的总督， 接下他交给你的任务。"
