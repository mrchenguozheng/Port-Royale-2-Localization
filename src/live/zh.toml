"0x080f2b29" = "<ts:20>关于货物， 你需要知道以下这些：<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>货物分五大类： 生活必需品、 原料、 制成品、 殖民地货物和进口货物<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>每座城镇能生产五种货物<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>城镇分两类： 殖民地城镇， 以及 设有总督的城镇<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>总督城生产生活必需品和制成品， 同时 定期收到从欧洲运来的进口货物。 所以 这两样东西在总督城最容易买到。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>总督城需要原料来生产制成品， 同时 也收购殖民地货物。 这些货物由从欧洲运来的运输船队送达。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>-<t>殖民地城镇生产生活必需品、 原料和殖民地货物。 每种殖民地货物只能在加勒比的特定区域生产。 比如 咖啡， 就只有加勒比的南部和西部出产。<n><n>关于价格， 你需要知道以下这些：<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>某种货物需求越大、 在某镇供应越少， 价格就越高。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>你在某国的声望越好， 在该国城镇里买货的价格就越低。<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>只应该在货物的产地城镇进货。<n><n>最快的赚钱路子：<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>在殖民地城镇买进殖民地货物和原料<n><n><gs:TEXTFLUSS_BASELINE><g:INTEXT_AUSRUF_800x600.screen>到总督城卖掉这些货， 再买进制成品和进口货物。"
