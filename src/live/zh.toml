"0x0d23b491" = "驾着你的船队前往 卡塔赫纳镇并进入城镇。<n>屏幕右侧的镇名下方会显示一个小圆形图标， 它显示你至今在 卡塔赫纳的贸易记录。<n>本剧本里你较为顺利， 因为 你得到了一份加成。<n>现在打开城镇信息。"
"0x0d23b492" = "在 「贸易记录」 下， 你现在可以查看所要求分数的完成百分比。 这里显示 100% 时， 你就可以向总建筑师申请许可证。<n>关闭城镇信息。"
"0x0d23b493" = "贸易窗口里， 该城镇稀缺货物的价格以红色显示。 卖出这些货物， 能同时提升你在该镇的贸易记录和在该国所属国家的声望。<n>点击一次码头， 查看该镇货物的库存信息。"
"0x0d23b494" = "记下该镇缺哪些货物。 例如， 这座城镇总会需要糖和棉花， 因为 它出产朗姆酒和衣物。<n>不过镇上还有其他稀缺货物。<n>去其他城镇买进 卡塔赫纳 需要的货物， 提升你的贸易记录。"
"0x0d23b495" = "不错！ 你在 卡塔赫纳的声望提升了不少。<n>但当心别在 卡塔赫纳 大量买进稀缺货物！ 稀缺货物很容易辨认， 它们的库存是以红色显示的。<n>把你的贸易记录分数提升到 85%。"
"0x0d23b496" = "干得好！ 你在 卡塔赫纳 已经有 85% 的分数了。 继续保持！<n>把分数提升到 100%。<n>顺便一提， 你刚收到一条关于 「晋升与等级」 的消息。"
"0x0d23b497" = "太棒了！ 你与 卡塔赫纳的交易量已经足够。<n>可惜你的等级仍是普通水手， 所以 只能获发一张许可证。<n>要升到下一等级， 你得再通过贸易增加财富。"
"0x0d23b498" = "很好！ 作为水手， 你可以获发两张建筑许可证。<n>去 卡塔赫纳的总建筑师那里申请许可证。<n>如果你的钱不够， 那就再交易一些。 别忘了卖掉你在 圣玛尔塔 生产的货物。"
"0x0d2a3b89" = "船只维护费"
"0x0d39b8e2" = "你必须先在 卡塔赫纳 建起一座仓库， 之后才能建造其他任何建筑。"
"0x0d39b8e3" = "现在开设两座织造厂， 并 建起两处住宅区。<n>如果城里建筑材料不足， 你得去别的城镇买来， 运到码头处的仓库。<n>别忘了在花掉宝贵的金币之前先谈好价钱！"
"0x0d39b8e4" = "你要确保在织造厂建成之时， 仓库里备有 @a$SubGoal$ 的棉花， 好让新企业一开张就能用棉花织布。"
"0x0d39b8e5" = "你的下一个目标是为 卡塔赫纳的仓库自产 @a$SubGoal$ 的布料， 并 等织造厂建成。<n>每 @a$SubGoal$ 布料， 正好需要 @a$SubGoal$ 棉花。"
