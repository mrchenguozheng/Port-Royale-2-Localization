"0x1cf07333" = "干得好， 你在 @I$Days$ 天内达到了第一个目标。 下一个目标是增加居住在这座城镇里的市民人数。 为此要开设五家产业， 本镇允许的种类各一家。<n><n>别忘了， 来 托尔图加的商人很少， 你得保证城镇货源充足、 地位足够高， 才能接纳新的移民。 也别忘了给市民留出足够的居住空间。<n><n>你有 60 天达成这个目标， 越快越好。<n><n>提示： 士兵计入城镇的人口， 但 不算市民！ 增加市民人数的唯一办法就是创造工作。<n><n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>在 托尔图加 开设五家不同的产业， 并 在 @D$EndDate$ 之前把居民人数增加到 1,500。 别忘了提供足够的居住空间！ 每家产业都要配一处住宅区。"
"0x1d01f111" = "Sounds"
"0x1d14b35f" = "<g:INTEXT_TREIBGUT_800x600.screen><n>在这里沉没的那条船， 船长必定是个经验丰富的老手。 箱子里没有金币， 只有一本保存得极好的日记， 属于船长 @L$RandLName$。 于是 船队 @C$Convoy$ 的船长经验提升了两点。"
"0x1d14b360" = "<g:INTEXT_TREIBGUT_800x600.screen><n>宝箱是空的， 不过 它曾被用作缆绳上的浮标。 离水面不远的地方， 你发现一处堆着火炮的藏点。 船员们尽可能多地把火炮搬上了船。"
"0x1d14b361" = "<g:INTEXT_TREIBGUT_800x600.screen><n>周围海面上漂着大量朗姆酒桶。 你的人马尽量多地打捞， 能装上船的都装上。"
"0x1d14b362" = "<g:INTEXT_TREIBGUT_800x600.screen><n>船队发现了一口大木箱， 立刻搬上船打开。 船长一眼瞥见 @g$Gold$， 心想： 这回可真是实打实的宝藏。"
"0x1d14b363" = "<g:INTEXT_TREIBGUT_800x600.screen><n>水面上漂着一只又老又朽、 几乎散架的木箱。 里面曾经装过什么， 如今已无从得知， 只留下一股恶臭。 即便如此， 船员们还是松了口气—— 寻宝的折腾总算结束了。"
