"0xdaeb0484" = "这一次， 你在加勒比海腹地的总督城 卡塔赫纳 开始这个剧本。<n>你那只由一艘单桅帆船组成的船队正在港口里。<n>你必须先为船队武装起来， 因为 这个剧本会涉及海战。<n>去码头， 打开货物菜单。"
"0xdaeb0485" = "可以看到， 你的船队上没有火炮， 也没有弹药。 你还缺一批船员。<n>尽可能多地装载船员和火炮， 并 按每种 10×10 的数量带上三类火炮弹药。<n>火炮很重， 船队的空间可能不够。 若真不够， 你可以卖掉一部分已装上的货物。"
"0xdaeb0486" = "做得好！ 你的船队已经武装完毕， 可以打一场小规模的海战了。<n>巧的是， 卡塔赫纳的总督正好有一件委托要交给你。<n>点击总督府， 接受他的委托。"
"0xdaeb0487" = "总督们常常会给出一些委托， 你要是办成了， 声望就会提升， 在该国的地位也就更高。<n>你也可以向总督索取私掠特许状， 或者 为你俘获的海盗索要赎金。<n>现在用你的船队去找总督提到的那几艘船。"
"0xdaeb0488" = "很好， 你已经找到那支船队了。<n>下一步是把你的船整备到可以作战的状态。 为此打开船队的船只列表， 选中你的单桅帆船。 要把它定为军舰， 请按火炮旁边的那个按钮。 随后右键点击那支船队， 即可对它发起\"攻击\"。"
"0xdaeb0489" = "这就是 Port Royale 的海战视图。<n>它会显示你的船， 移动显示窗口还可以查看那些被弃置的船只。<n>现在关闭暂停模式， 用鼠标右键练习航行。 海战期间， 事件窗口会显示风向和风向标船。"
"0xdaeb048a" = "参战的所有船只都显示在屏幕底部。 你可以在此选择要使用的弹药。 选中重型炮弹， 击沉一艘敌船。<n>你可以用鼠标左键开火， 但 只有在你的船处于良好射击位置时才可行。 此时目标会显示为红色。"
"0xdaeb048b" = "很好！ 登上第二艘船。<n>为此请点击船只显示区右下角的\"登船\"按钮。<n>然后驶向敌船撞它。 注意： 海战期间 F1 按钮同样可用。"
"0xdaeb048c" = "通常敌船上都有船员， 于是 双方船员会在船上展开战斗。<n>战斗结束后， 所 有被登上的船只都归胜者所有。<n>现在把这艘敌船加入你的船队， 然后 关闭移交窗口。"
"0xdaeb048d" = "非常好！<n>现在让你的船队返回 卡塔赫纳。"
"0xdaeb9147" = "Tim Plöger"
"0xdaed79ac" = "属于海盗 %1 的一支船队袭击了一名来自 %2 的商人。"
"0xdb0108d5" = "先买一艘新船。 去船厂挑一艘尽可能多装火炮的船。"
"0xdb0108d6" = "选中你的船队， 然后 右键点击港口， 把新船加入船队。"
"0xdb0108d7" = "所有船队都由商船和护航船组成。<n>若船队中的某艘船要参战， 就必须把它定为军舰。<n>打开船队的船只列表， 即可看到你所有的船。"
"0xdb0108d8" = "船只列表会显示船队中的全部船只。 军舰状态显示在船只的右上角。 若出现火炮图标， 就说明该船已被定为军舰， 会参与战斗。 点击这个角落即可直接切换状态。<n>不过现在你应该点击你的新船并选中它。"
"0xdb0108d9" = "船只的技术参数 （比如最大载货量） 会像在船厂里一样显示在这里。<n>你还能看到维持这艘船的每日开销。<n>现在勾选火炮图标， 把这艘船转为军舰。"
"0xdb0108da" = "做得好！<n>船队中的火炮和船员始终由各艘护航船平均分配。<n>确保你的护航船全部武装到位、 船员满编， 然后 去拜访总督， 接受他交给你的新委托。"
"0xdb0108db" = "现在去完成总督交给你的委托。"
"0xdb0108dc" = "从你的护航船中选出你希望指挥的那一艘参加海战。<n><n>在任意阶段， 你都可以点击列表中的另一艘护航船来更换选择。<n><n>但要注意： 战斗一旦开始， 每艘船只能被选中一次！"
"0xdb0108dd" = "做得好！ 你已经消灭了这支海盗船队。<n>现在返回 卡塔赫纳 总督处， 因为 这属于委托的一部分。<n><n>注意， 你的委托会自动记录进日志。 必要的时候， 你随时可以在那里查看详情。"
