"0xcacc4fa8" = "找到并摧毁西班牙的宝藏船队。 它最后一次停在 @T$StartTown$， 此后便驶向 @T$DestTown$。"
"0xcb2b0709" = "真是倒霉！ 今天你去见过 @F$WifeName$ 了吗？ 省省力气吧， 她已经不在了。 你看， 我找到了一封像是告别信的东西。 信上说， 她受够了这种乏味的生活， 跟一个冒险私奔了。 你必须替我救回我的宝贝女儿！"
"0xcb2b070a" = "大祸临头， 而 我看你正身处风暴中心。 我女儿被海盗劫走了， 不过 有人给你留了一条消息， 还附了一张地图， 标出某个地点。 在我看来这多半是个陷阱， 可我们又能怎么办？ 你必须救回我女儿！"
"0xcb2b070b" = "哈！ 我女儿， 也就是你老婆， 跟我卫队的一名军官私奔了！ 我早该想到的！ 现在两个人都不见了， 还顺走了我一艘船！ 你必须把我女儿带回来， 让她回心转意！ 说来也巧， 我在一张地图上发现了一个地方， 就标在我女儿的住处里。"
