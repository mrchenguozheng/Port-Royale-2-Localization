"0xcb8dd6d9" = "我们的敌人 @n$HostileNation$ 什么事都做得出来。 我妻子被人绑架了， 对方还开出了释放她的条件。 不过 我恰好知道她被关在哪里。 明面上我什么也做不了—— 你明白的—— 但 你可以攻下那座城镇， 把她带回来给我。"
"0xcb8dd6da" = "很高兴见到你。<n>我妻子最近从巴黎得到一只修剪过的贵宾犬。 这只讨厌的畜生把我折腾得快疯了， 可我妻子却迷上了它。<n>有人听说了这件事， 绑走这条狗， 转交给我们的敌人， 用来勒索我们。<n><n>你能替我把那条贵宾犬救回来吗？"
"0xcb8dd6db" = "不久前， 我最小的女儿据说是跟一个路过的冒险私奔了。 如今我发现她住在 @T$TargetTown$， 而且 要嫁给该镇的指挥官。 我了解自己的女儿， 她绝不会自愿做出这种事！ 我总不能去跟副王说， 为了救我女儿得攻打一座城镇吧？ 可换了你呢？"
