"0x24c12812" = "恭喜！ 你被委派了一项占领城镇的任务！<n><n>城镇可能防守森严， 所以 你该挑一座港口炮塔最少的英格兰城镇。 @T$SampleTown$ 是个完美的目标。<n><n>要攻打城镇， 先为船队启用 「攻击城镇」 选项： 选中船队， 点击 「攻击模式」 按钮。<n><n>你可以从海上或陆上攻打城镇。 但 只有在水手人数压过守军时， 才可从陆上强攻； 而且 还得让一半水手装备弯刀、 一半装备火枪。<n><n>注意： 如果 城镇港口里有军事船队， 你必须先打败这支船队， 才能攻打城镇本身。<n><n><f:fonts/ELGRECO_26x26aaFHk.res>剧本目标<f:fonts/Tiepolo_bold14x14aaFH.res><n><n><c>完成占领城镇的任务。"
