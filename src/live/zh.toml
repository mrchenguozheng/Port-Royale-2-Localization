"0xf651cc3f" = "荷兰与英格兰已经议和， 因此 你再也无法攻占任何城镇。<n><n>你在这个剧本里走得相当远， 但 没能及时为荷兰攻占足够多的城镇。<n><n>在自由模式中， 你也可以用同样的办法攻占城镇。 不过 你必须先确认： 你想攻打城镇的那个国家在军事上处于弱势。 此外， 想要攻占这些城镇的那个国家必须军事强大， 而且 这两个国家必须彼此交战。<n><n>注意： 当你为一位副王攻打城镇时， 通常会获得一块土地， 供你自己建造城镇。 不过 本剧本中这项功能已被关闭。"
