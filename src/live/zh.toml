"0xe3922641" = "这副罗盘的指针转动得非常灵活， 几乎立刻就稳定下来。 你从没见过这么准确的罗盘。<n>罗盘打造得如同珠宝， 底面还刻着各式各样的花纹。"
"0xe3922642" = "这副罗盘握在手中极为妥帖， 也很好使。 它似乎通体纯金， 还饰着精细的纹样。"
"0xe3922643" = "即便在风浪极大的海上， 这具六分仪也能给出准确的方位。 六分仪的部分构件装在弹簧上， 有助于削弱强烈的震动。"
"0xe3922644" = "这件仪器是一副双筒望远镜， 能让你同时用双眼望向远处。 你可以把有色玻璃滑到镜头上以保护眼睛。 侧面还能辨认出一道神秘的刻纹。"
"0xe3922645" = "这是一只普通的金表， 但 比你见过的任何一只都要小。 表盘后面的圆盘上， 还看得见一轮似乎缓缓旋转的月亮。 表背也刻着一些花纹。"
"0xe3922646" = "这盏灯与普通提灯相似， 但 燃烧的灯芯四周装了许多镜子， 使光线只能朝一个方向照射。 借助罩在开口处、 形状像风扇的装置， 你可以极快地开关射出的光。"
"0xe3922647" = "一把可以来回滑动的尺子嵌在另一把尺子里， 上面还装着一个透明材料制成的滑动卡尺。 借助这件装置， 你可以很快完成简单的计算。"
"0xe3922648" = "这件奇特的装置看起来像一支箭。 一放进水里， 它上面的叶片就会带着它旋转。 一个小转盘会数清每一圈的圈数， 让你得以非常准确地算出船速。"
"0xe3922649" = "这件仪器由旋转叶片和一个刻度盘组成， 刻度盘显示叶片的转速。 把叶片举到风中， 你就能读出风向和风速。 仪器做工极精， 上面还刻着一个不明符号。"
"0xe392264a" = "这根绳子想必在海水里泡过一段时间， 却 看起来像刚做出来的一样。 手感异常光滑， 打出的结也极其牢靠。"
"0xe39226b2" = "这部对开本里收着大量精美的星图。 一张大表精确地列出了每一颗具体的星何时在何地升起、 何时落下。"
"0xe39226b3" = "一枚雕刻精细的圆盘， 上面嵌着若干较小的圆盘。 你可以用它查看目前星空的哪一部分可见， 取决于日期和时刻。<n>盘上的刻度表明， 这件仪器曾用于测定某片海域中的船位。"
"0xe39226b4" = "你转动把手， 一只大号号角就会发出女子歌唱般悦耳的声响。 对于在海上漂泊数周的水手来说， 再合适不过了。"
"0xe39226b5" = "一根金杆的末端装着一大块打磨成弧形的玻璃。 把它悬在地图上方， 即便光线再差， 也能清楚看见最细的线条。"
"0xe39226b6" = "这张小金属桌由实心黄铜制成， 构造使得无论船身如何倾斜， 台面始终保持水平。 外圈的金属环上刻着似乎标示方向的刻度， 但 你无法判断这张桌子曾在哪片海域使用。"
"0xe39226b7" = "一只小盒子里装着一件精巧的装置， 可以很方便地生火。 盒面上满是神秘的刻纹。"
"0xe39226b8" = "这只锚与其说实用， 不如说装饰。 它顶多能用来泊一条划艇。<n>以它的尺寸而言算是很重了， 上面布满精细的装饰和不明文字。"
"0xe39226b9" = "这件装置类似自带火石的油灯。 转动小轮， 火星便飞向灯芯， 即便在大风里也能点起火苗。"
"0xe39226ba" = "这只号角不是用嘴吹的， 而是借助一个类似打气筒的装置。 你用力按下它， 发出的声响会比想象中更响亮。"
"0xe39226bb" = "这张海图与市面上普通的海图很不一样。 它十分精细， 还用上了好几种颜色绘制。 不过 你认不出它画的是哪一片海域。"
"0xe39bb702" = "船队无法启航， 因为 船上火炮太多。 卖掉一些火炮， 或 把它们移进仓库， 别让火炮数量超过上限。"
