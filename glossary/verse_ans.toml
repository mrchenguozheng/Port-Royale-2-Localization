# 诗谜谜底队列 —— 谜面在 09 卷第六十四节定义的 verse 区间里，共 41 条，按同一首谜面归成 29 组。
#
# 只填两样：
#   ans    谜底。必须是 entities.toml 里登记的实体键（城镇用英文名，六语共用）；
#          城镇名不在表里也行，verse_ans.py --apply 会按城镇表把六语译名一起登记进来。
#          谜面只给朝向、给不出城名的，ans 写方位键（north/east/southeast…，见
#          marks.ANS_DIRECTIONS），不登记实体——这类谜底就是「朝哪边」，玩家仍要
#          自己在地图上走到那座城（理由见 09 卷第七十二节）。
#          线索词至少一条，英文逗号分隔，禁止全角「，」；每条线索都必须真的出现在
#          该语言的谜面正文里——展开时自动校验，推不出来就构建失败。
#
# 谜面本身不要改：加 [ans:] 只在行首加标注，正文一字不动。
#
# 已标 16 组：05 圣奥古斯丁（城名）；03/04/09/13/14/18/25/27/29 九组是正向方位；
# 06/07 是**否定方位**（not_southeast / not_southwest，谜面直说往那边去是白费）；
# 11/12/20/26 拿路标方位当谜底（东南那座更大的岛 / 北边什么都没有 / 半岛自北伸来）。
# 其余 13 组（01/02/08/10/15/16/17/19/21/22/23/24/28）等地图判定，谜面里没有方位。

