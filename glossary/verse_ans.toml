# 诗谜谜底队列 —— 谜面在 09 卷第六十四节定义的 verse 区间里，共 41 个槽位，按同一首谜面归成 29 组。
# 41 个槽位里有 12 个与同组另一条逐字同文，译文侧按 `[ref:组内最小键]` 收敛，只剩 29 条带文本
# （见 09 卷第一百一十四节）；下面 ids 仍列全组成员，--apply 只往带文本那条写标注。
#
# 每组建三样：
#   ans    谜底。必须是 entities.toml 里登记的实体键（城镇用英文名，六语共用）；
#          城镇名不在表里也行，verse_ans.py --apply 会按城镇表把六语译名一起登记进来。
#          谜面只给朝向、给不出城名的，ans 写方位键（north/east/southeast…，见
#          marks.ANS_DIRECTIONS），不登记实体——这类谜底就是「朝哪边」，玩家仍要
#          自己在地图上走到那座城（理由见 09 卷第七十二节）。
#   clues  线索词，逐语各写各的，至少一条，英文逗号分隔，禁止裸写的全角「，」；每条线索
#          都必须真的出现在该语言的谜面正文里——展开时自动校验，推不出来就构建失败。
#          逗号是唯一的并列符（每段都要出现），`+` 并值已退役（见 09 卷第一百零六节）。
#          线索本身带逗号/冒号/加号时整段用引号包起来：`"Good, very good!"`。引号认三种
#          半角（`"…"`、`'…'`、反引号 `…`），里可以写另外两种；`I'm`、`l'abondance` 这种
#          撇号不用包（引号只在一段开头才算开引号）。引号里出现同种引号时用反斜杠转义
#          （`"say \"hi\""`），`\\` 表示正文里的一个反斜杠（见 09 卷第一百零八节）。
#   kinds  可选。给了就按位置贴标签，条数必须与该语 clues 一条对一条；某一项写空串
#          表示这条不贴标签（裸写）。整组不给 kinds 也等于全裸写——两种写法在展开侧
#          完全等价，都是「值要在该语谜面正文里逐字出现」。
#          已知类型只留 pun（双关，见 marks.ANS_CLUE_KINDS）：谜底靠谐音时，译文必须
#          保住那个音。原先的 direction / count / feature / produce / history / exclude
#          六类已退役：它们只做统计与提示，值本来就是正文片段，直接裸写即可
#          （见 09 卷第一百零五节）。
#          自造标签仍认：`_` 开头静默；字母开头的未知标签（含上述六个退役名）会在
#          text_lint 里记一条 W 级警告（多半是拼错）。标签只对「译者看」有价值，
#          不参与答案判定。
#          俄语 90c5、法语 90c6 原先各只剩两条线索（俄语把「白沙」漏译、法语把「海峡」
#          并进 l'abondance 那句）——2026-11-18 已补齐：ru 补 `Белый песок`（正文里就有），
#          fr 把线索换成正文里的 `détroit`。六语各条的线索条数现已齐平（收敛成 29 条文本后，每语 54 项）。
#   ids    同组的文本键。**组内多于一条时**，--apply 会给每条译文加 `group=`，列出本组
#          全体成员的键（`,` 连接、按 0x 串升序、含本条自己；`+` 已退役）；单条的组只写
#          自己那一个键。ids 决定这组有几条，
#          译文那边的 group 只做校验：两边对不上（缺一条、多一条、互指不对称）就失败。
#          组内逐字同文的副本在译文侧写成整行 `[ref:组内最小键]`，不抄第二遍 `[riddle:…]`
#          （抄了会和目标键的写法分叉）；--apply 跳过这类副本，标注只落在带文本的那条上。
#
# 谜面本身不要改：加 [riddle:] 只在行首加标注，正文一字不动。
#
# 本轮起（2026-11-18，见 09 卷第一百零九、一百一十节）译文那边的 riddle 还要写三件依据：
#   level=      谜题分级 direction / town / mixed —— 由谜底字段算出来、必须一致：
#               只有方位键 = direction（玩家得自己找城），只给城镇名 = town，
#               城名与方位齐备（`answer=城|-方位`）= mixed。本文件 ans 是分级的来源之一，
#               但译文侧写错会被 check_doc 按自己的答案报错。
#   certainty=  certain / inferred / either / disputed
#   source=     依据，`+` 或 `&` 并列；类别见 marks.ANS_SOURCE_*：
#               original-en / original-fr（原文本身，不带指向）、
#               retail-xx / fan-xx（xx ∈ de,en,es,fr,pl,ru，可跟 8 位键）、
#               url:'…' 或裸引号 URL、manual:路径@sha256-<12 位>#`小节标题`、
#               riddle:键,键（推自别的谜面）、cargo / map / authored（只记类别）。
#               authored 是本语言自己编写/新编的谜面（不是从任何一版原文推来的），给自写
#               副本一个合法归属（最初叫 local，后按「谁写的」改名）；inferred 不能只有
#               original-*/authored，必须有外部依据。
#               构建前复核（text_lint）要求这三种必写；语法解析期不查，方便先写谜面。
#               本文件只维护谜底/线索，不写 level/certainty/source——那是译文层的事。
#
