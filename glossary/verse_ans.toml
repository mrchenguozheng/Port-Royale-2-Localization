# 诗谜谜底队列 —— 谜面在 09 卷第六十四节定义的 verse 区间里，共 41 条，按同一首谜面归成 29 组。
#
# 每组建三样：
#   ans    谜底。必须是 entities.toml 里登记的实体键（城镇用英文名，六语共用）；
#          城镇名不在表里也行，verse_ans.py --apply 会按城镇表把六语译名一起登记进来。
#          谜面只给朝向、给不出城名的，ans 写方位键（north/east/southeast…，见
#          marks.ANS_DIRECTIONS），不登记实体——这类谜底就是「朝哪边」，玩家仍要
#          自己在地图上走到那座城（理由见 09 卷第七十二节）。
#   clues  线索词，逐语各写各的，至少一条，英文逗号分隔，禁止全角「，」；每条线索
#          都必须真的出现在该语言的谜面正文里——展开时自动校验，推不出来就构建失败。
#   kinds  **必填**。线索的标签，逐语给出、与该语 clues 条数一条对一条，每项都不能空。
#          不给 kinds 或留空项 = 裸写，verse_ans.py --apply 直接停。
#          写七个已知类型（pun/direction/count/feature/produce/history/exclude，
#          见 marks.ANS_CLUE_KINDS）能拿到类型校验，也等于给译者一句硬约束：
#          pun 要保住谐音、produce 要保住商品专名、direction 要保住方位词、exclude
#          不许翻成肯定。写错或自造的类型不拦——展开侧只当标签，扫描冒号后的正文；
#          标签只允许小写，且只允许 `_` 或字母开头。字母开头的自造标签（如 dirction）
#          会在 text_lint 里记一条 W 级警告（多半是类型名拼错）；`_hello` 这种 `_`
#          开头的显式自造标签静默通过。类型只对「译者看」有价值，不参与答案判定。
#          俄语 90c5 漏译「白沙」、法语 90c6 把「海峡」译成 l'abondance，这两条只剩
#          两条线索，kinds 就按两条给——不拿理想模板替译文补齐条数。
#
# 谜面本身不要改：加 [ans:] 只在行首加标注，正文一字不动。
#
# 29 组谜底现状（2026-11-17）：24 组是城名，来源是 Selket 整理的「三线索寻宝」表
# （Steam 帖 steamcommunity.com/app/12470/discussions/0/1354868867712622875/，
# 帖子正文标题 "Port Royal 2 - Three Part Treasure Quests"，作者 Darinthal 转录 Selket 原文）。
# 剩余 5 组：07/12/25/29 在该表里查不到（保留方位谜底），05 早有城名。
# 谜底取值仍支持四类：城名、正向方位、否定方位 not_*、关键词组合 kw（当前 0 组使用，留作兜底）。

