# 术语对照表 —— 数据源
#
# 这个文件只写「哪些字符串算术语、归到哪一组」，不写译文本身。
# 译文由 src\tools\glossary.py 从 translations\ 里现取，所以：
#   · 改了译文，重新生成一次对照表就同步了；
#   · 加一种语言，只是多出一个 glossary\<语言>.md，不用抄一遍术语。
#
# 每组的两种写法：
#   range = ["0x起", "0x止"]   取这个 id 区间内的条目（游戏表里同类字符串
#                              常常连续排列：货物、船只、军衔、城镇都是）
#   ids   = ["0x…", …]         精确列出，适合零散分布的那几组
# max_len 是长度上限，用来挡掉区间里夹着的长句子。

[[group]]
