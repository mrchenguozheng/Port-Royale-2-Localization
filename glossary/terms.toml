# Turk Islands 的俄语：正文按俄语习惯写「острова Теркс」，不是音译全名「Теркс-Айленд」；
# 只给 ru 放行，别的语言没有这个说法
[group.alt]
"0xc77f4e45" = ["Port Royale"]
"0xc77f4dcf" = {ru = ["Теркс"]}

[[group]]
