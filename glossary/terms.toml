# 术语对照表 —— 数据源
#
# 这个文件只写「哪些字符串算术语、归到哪一组」，不写译文本身。
# 译文由 src\tools\glossary.py 从 translations\ 里现取，所以：
#   · 改了译文，重新生成一次对照表就同步了；
#   · 加一种语言，只是多出一个 glossary\<语言>.md，不用抄一遍术语。
#
# 每组的两种写法：
#   range = ["0x起", "0x止"]   取这个 id 区间内的条目（游戏表里同类字符串
#                              常常连续排列：货物、船只、军衔、城镇都是）
#   ids   = ["0x…", …]         精确列出，适合零散分布的那几组
# max_len 是长度上限，用来挡掉区间里夹着的长句子。

# 一致性检查时整条跳过的条目（与术语无关的误命中）：
#   0xfc512ea5 版权声明里的 “RAD Game Tools, Inc.”
#   0xd4cd0f44 职员表分区标题 "Tools"：保留英文，不是货物「工具」，会污染术语基准
#   0xc77f4eb7 特立尼达的城镇名 Port of Spain：含 Spain，但不是国家
ignore = ["0xfc512ea5", "0xd4cd0f44", "0xc77f4eb7"]

# 诗谜：藏宝图的打油诗谜面。这类文本的用词由韵脚、音节数和「藏一步线索」共同决定，
# 与术语一致性天然冲突——`Holy August` 里的 August 是人不是八月，`northward bound`
# 里的 bound 只为押 found。所以整片不查，而不是把撞上的词一个个加进 ignore：
# 那样等于让术语表去管诗，诗人就没法换词了。
#
# 判据是「这一片是押韵的谜面」，不是「这条撞了术语」——新写一条谜面不用再回来登记。
verse = [["0x35f48f6c", "0x35f48f75"],
         ["0x35f48fe4", "0x35f48fe6"],
         ["0x35f4904e", "0x35f49057"],
         ["0x35f490bf", "0x35f490c8"],
         ["0x35f49130", "0x35f49137"]]

[[group]]
name = "货物"
note = "市场里买卖的商品，含「移民」这种特殊货物"
range = ["0x37328fb9", "0x37329033"]
max_len = 24

# 货物名「Settlers（移民）」在沉船文本里译成「殖民者」是通的
[group.alt]
"0x37329033" = ["殖民者"]

[[group]]
