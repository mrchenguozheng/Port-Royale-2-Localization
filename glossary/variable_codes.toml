# PR2 文本变量码表（@码$变量名$）
#
# 结构：@ + 单字母格式码 + $ + 变量名 + $，尾 $ 必需（770 处引用零例外）。
# 码是「类型/转换器」标签（大小写是类型名的一部分，不是文本变换，见 09 卷 67.9）。
#
# 手工维护：meaning / display / conf / evidence。其余字段由 --sync 重算，不要手改。
# 置信度三档：confirmed=配对结构实证 / inferred=由配对与语境推断 / unknown=只有配对事实
# 工具：python src/tools/text/var_codes.py --table / --check / --sync

