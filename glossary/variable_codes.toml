# PR2 文本变量码表（@码$变量名$）
#
# 结构：@ + 单字母格式码 + $ + 变量名 + $，尾 $ 必需（770 处引用零例外）。
# 码是「类型/转换器」标签（大小写是类型名的一部分，不是文本变换，见 09 卷 67.9），
# 不是 @A$ 首字母大写化之类的开关。
#
# conf 三档：confirmed=配对结构实证 / inferred=由配对与语境推断 / unknown=只有配对事实
# 本表由 build/qa/_var_table_gen.py 从 en.gog_1.1.2.3 的 770 处引用生成，
# 人工补含义；工具读取入口是 src/tools/text/var_codes.py。

