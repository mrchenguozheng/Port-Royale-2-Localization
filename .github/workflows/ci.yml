name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      # 判据用的包全装，见 requirements-ci.txt。中文分词还要一份 .venv-spacy，
      # 与开发机同名同结构，zh_space.spacy_python() 直接就能发现。
      - name: Python deps
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m venv .venv-spacy
          .venv-spacy\Scripts\python -m pip install --disable-pip-version-check spacy
          .venv-spacy\Scripts\python -m spacy download zh_core_web_sm

      - name: Static checks
        shell: pwsh
        run: .\check.ps1 -NoPause

      - name: Build injector and language packs
        shell: pwsh
        run: .\build.ps1 -Target All -Lang @('zh','ja') -NoPause
