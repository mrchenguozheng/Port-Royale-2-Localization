name: Release

# Only release-* tags trigger a build. Normal version tags such as v0.9.0 do not.
on:
  push:
    tags:
      - "release-v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Install Noto CJK fonts
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $fonts = @{
            "NotoSansSC-VF.ttf"   = "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"
            "NotoSerifSC-VF.ttf"  = "https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifsc/NotoSerifSC%5Bwght%5D.ttf"
            "NotoSansJP-VF.ttf"   = "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf"
            "NotoSerifJP-VF.ttf"  = "https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifjp/NotoSerifJP%5Bwght%5D.ttf"
          }
          foreach ($name in $fonts.Keys) {
            Invoke-WebRequest -Uri $fonts[$name] -OutFile (Join-Path $dir $name)
          }

      - name: Build injector
        shell: cmd
        run: src\build_injector.bat --no-pause

      - name: Derive version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Replace("release-", "")
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build game packs
        run: |
          python src\tools\pack\make_release.py --lang zh --version $env:VERSION
          python src\tools\pack\make_release.py --lang ja --version $env:VERSION

      - name: Build translator workbench
        run: |
          python src\tools\pack\make_translator.py --out "dist\PR2Translator-$env:VERSION"
          Compress-Archive -Path "dist\PR2Translator-$env:VERSION\*" -DestinationPath "dist\PR2Translator-$env:VERSION.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/PR2-zh-${{ env.VERSION }}.zip
            dist/PR2-ja-${{ env.VERSION }}.zip
            dist/PR2Translator-${{ env.VERSION }}.zip
