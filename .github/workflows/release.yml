name: Release

# Tag release-v* on main builds and publishes the per-language GOG/Steam packages
# listed in src/release-languages.txt. Manual runs build the same artifacts but
# keep them as workflow artifacts. Tags must sit on main or release/*.
on:
  push:
    tags:
      - "release-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    runs-on: windows-latest
    # 八门语言全量出包 + 字体生成，给足但别无限等候。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # 需要完整历史：tag 校验要判断提交是否是 main / release/* 的祖先。
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/injector-rs -> target

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Derive version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
          } elseif ($env:REF_NAME -match '^release-(v[0-9].*)$') {
            $version = $Matches[1]
          } else {
            throw "无法从触发事件推导版本"
          }
          if ($version -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "版本号不合法：$version；应为 vMAJOR.MINOR.PATCH[-prerelease]"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VERSION=$version"

      - name: Verify the tagged commit is on the release line
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # 发版线只有 main 与 release/*；dev 上的 tag 不发布。
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          $sha = (git rev-parse HEAD).Trim()
          $candidates = @(git for-each-ref --format='%(refname:short)' refs/remotes/origin) |
            Where-Object { $_ -eq 'origin/main' -or $_ -match '^origin/release/' }
          if (-not $candidates) {
            throw "找不到 origin/main 或 origin/release/* 分支，无法校验 tag 来源"
          }
          foreach ($ref in $candidates) {
            git merge-base --is-ancestor $sha $ref
            if ($LASTEXITCODE -eq 0) {
              Write-Host "tag 提交在 $ref 上：$sha"
              exit 0
            }
          }
          throw "tag 提交不在 origin/main 或 origin/release/* 上：$sha；请在 main 上打 tag"

      - name: Read release languages
        shell: pwsh
        run: |
          $list = Join-Path "src" "release-languages.txt"
          $names = @()
          foreach ($raw in Get-Content -LiteralPath $list -Encoding utf8) {
            $line = ($raw -split '#', 2)[0].Trim()
            if (-not $line) { continue }
            $names += @($line -split '[,\s]+' | Where-Object { $_ })
          }
          $names = @($names | Select-Object -Unique)
          if ($names.Count -eq 0) { throw "发行语言清单为空：$list" }
          "LANGS=$($names -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "LANGS=$($names -join ',')"

      # 字体与 CI 走同一套：项目内缓存优先，缓存里缺的按清单下载并实例化成
      # 静态文件；系统字体不参与，同一 tag 重建出的包才逐字节一致。
      - name: Restore font cache
        id: font-cache
        uses: actions/cache@v5
        with:
          path: build/cache/noto-src
          key: noto-${{ runner.os }}-${{ hashFiles('src/fonts-sources.toml') }}

      - name: Ensure Noto source fonts
        shell: pwsh
        run: |
          # 与 CI 同一套顺序：assets\fonts\noto → build\cache\noto-src，系统字体
          # 不参与（--no-system），同一 tag 重建出的包才逐字节一致。
          $log = Join-Path $env:RUNNER_TEMP 'fonts.log'
          & python src\tools\font\fetch_noto_fonts.py --langs $env:LANGS --fetch --no-system *>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            "::error::Noto 源字体缺失，项目内也没能补齐；见上方清单与查过的目录。"
            exit 1
          }

      - name: Pin build time
        shell: pwsh
        run: |
          # 固定时间源：同一 tag 重建出的包逐字节相同，校验和可比对。
          $epoch = (git log -1 --format=%ct).Trim()
          "SOURCE_DATE_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SOURCE_DATE_EPOCH=$epoch"

      - name: Build release packages
        id: build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'release-build.log'
          $env:CARGO_TERM_COLOR = 'never'
          & pwsh -NoProfile -NonInteractive -Command '$l = $env:LANGS -split ","; .\release.ps1 -Version $env:VERSION -Edition all -Lang $l -NoPause' *>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            foreach ($line in (Get-Content $log -Tail 60)) {
              if ($line -match '错误|ERROR|FAIL|error:') { "::error::$line" }
            }
            "--- release-build.log 尾部 ---"
            Get-Content $log -Tail 20
            "::error::发版打包失败（exit $code），完整日志见 artifact release-logs。"
            exit $code
          }
          Select-String -Path $log -Pattern '^warning: ' -Encoding utf8 |
            ForEach-Object { "::warning::build: $($_.Line.Trim())" }

      - name: Upload release logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn

      - name: Verify release assets
        shell: pwsh
        run: |
          $langs = $env:LANGS -split ','
          $expected = @()
          foreach ($lang in $langs) {
            $expected += "dist/PR2-$lang-gog-$env:VERSION.zip"
            $expected += "dist/PR2-$lang-steam-$env:VERSION.zip"
          }
          $expected += "dist/SHA256SUMS.txt"
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path)) { throw "缺少发行产物：$path" }
          }
          Get-Content -LiteralPath "dist/SHA256SUMS.txt" | ForEach-Object { Write-Host $_ }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PR2-${{ env.VERSION }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
